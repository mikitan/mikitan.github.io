<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIC VICTORY - DLAND DTM v59.0 VOICE REC & AI INSTRUMENT AUTO-BUILD SUITE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans select-none pb-24 overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        function MasterSynthApp() {
            const [tab, setTab] = React.useState("VOICE_REC");
            const [playing, setPlaying] = React.useState(false);
            const [isRecording, setIsRecording] = React.useState(false);
            const [flashColor, setFlashColor] = React.useState("border-cyan-500");
            const [bpm, setBpm] = React.useState(116);
            const [currentBar, setCurrentBar] = React.useState(0);
            const [currentStep, setCurrentStep] = React.useState(-1);
            const [status, setStatus] = React.useState("✨ v59.0 声歌マイク録音・AI各楽器自動仕上げ＆creraアルバム完全統合完了！");

            const [powerSavingMode, setPowerSavingMode] = React.useState(false);

            const BARS = 24;
            const BAR_STEPS = 16;
            const TOTAL_STEPS = BARS * BAR_STEPS;

            const [selectedInstrument, setSelectedInstrument] = React.useState("synth");
            const [selectedNote, setSelectedNote] = React.useState("C4");
            const [selectedDuration, setSelectedDuration] = React.useState("8n");
            const [selectedDrumPart, setSelectedDrumPart] = React.useState("kick");

            // 音声録音（声歌 / Voice Recording）用ステート
            const [isVoiceRecording, setIsVoiceRecording] = React.useState(false);
            const [voiceAudioUrl, setVoiceAudioUrl] = React.useState(null);
            const [voiceAudioList, setVoiceAudioList] = React.useState([
                { id: 1, title: "MIC VICTORY ヴォーカルテイク #1 (Demo)", date: "12:00:00", credit: "micvictorydanb / 作曲: 28 & danb" }
            ]);
            const mediaRecorderRef = React.useRef(null);
            const audioChunksRef = React.useRef([]);

            // 全体録音 crera 保存リスト
            const [recordedTakes, setRecordedTakes] = React.useState([
                { id: 1, title: "MIC VICTORY 24小節 Anthem (Demo #1)", bpm: 116, date: "12:00:00", credit: "micvictorydanb / 作曲: 28 & danb" }
            ]);
            const [activePatternIndex, setActivePatternIndex] = React.useState(1);

            // 18曲ソロ(danb) ポップス用AIパターン選択
            const [selectedSoloTrack, setSelectedSoloTrack] = React.useState(1);
            const [soloTrackList, setSoloTrackList] = React.useState(
                Array.from({ length: 18 }, (_, i) => ({
                    id: i + 1,
                    title: `MIC VICTORY ポップス曲 #${i + 1} (${['青春疾走', '夜空の誓い', '未来への鼓動', 'ネオン街の反撃', '光の向こう側', 'スパークリング・ラブ', 'エンドレス・ロード', 'ビートの波濤', 'サイバー・ダンサー', 'ストリート・アンセム', '黄金の地平線', 'スターダスト・メモリー', 'アイアン・ハート', 'サマー・ブリーズ', 'ウィンター・マジック', 'レインボー・ロード', 'ファイナル・カウント', 'エターナル・VICTORY'][i]})`,
                    genre: "MICVICTORY POP",
                    composer: "28 & danb"
                }))
            );

            const [lyricTheme, setLyricTheme] = React.useState("青春・希望");
            const [rapLyrics, setRapLyrics] = React.useState(
`[Verse 1 - 崩れない最強の結び (c) micvictorydanb]
ズンズン鳴り響くキック ちゃちゃっと刻むハイハット 夜を突き抜ける
声歌で録音したこの魂のメロディが 画面の向こうへ届く羅針盤になる
重低音クレラが足元を支えて どんな坂道だって全速力で駆け抜ける

[Chorus / Outro - AI各楽器自動仕上げ＆crera保存リスト]
何度転んでも立ち上がる強い意志 決して崩れない鋼鉄のメロディー
MIC VICTORY それは俺たちの証し
D-LAND DTM クレラと共に 24小節の彼方へ永遠に響け！`
            );

            const [masterBassBoost, setMasterBassBoost] = React.useState(12);
            const [masterVolume, setMasterVolume] = React.useState(1.3);
            const [dlandMode, setDlandMode] = React.useState(true);
            const [screenSaverActive, setScreenSaverActive] = React.useState(false);
            const [slotName, setSlotName] = React.useState("MIC_ALBUM_v59_VOICE_AI_CRERA_28");

            const INSTRUMENTS = [
                { id: "drums", label: "🥁 ドラム (ズンズンちゃちゃ)", color: "from-red-600 to-amber-600" },
                { id: "loopTrack", label: "🔁 ループ伴奏", color: "from-pink-600 to-rose-600" },
                { id: "subBass", label: "🔊 重低音ベース", color: "from-amber-600 to-orange-700" },
                { id: "bass", label: "🎸 ベース", color: "from-emerald-600 to-teal-600" },
                { id: "synth", label: "🎹 シンセメロディ", color: "from-cyan-600 to-blue-700" },
                { id: "trumpet", label: "🎺 トランペット", color: "from-yellow-500 to-amber-600" },
                { id: "guitar", label: "🎸 エレキギター伴奏", color: "from-orange-600 to-red-700" },
                { id: "piano", label: "🎹 ピアノ前向き伴奏", color: "from-blue-600 to-indigo-600" },
                { id: "violin", label: "🎻 バイオリン", color: "from-amber-600 to-yellow-700" },
                { id: "flute", label: "🪈 フルート", color: "from-teal-500 to-cyan-600" },
            ];

            const [instrumentSteps, setInstrumentSteps] = React.useState({
                drums: new Array(TOTAL_STEPS).fill(null),
                loopTrack: new Array(TOTAL_STEPS).fill(null),
                subBass: new Array(TOTAL_STEPS).fill(null),
                bass: new Array(TOTAL_STEPS).fill(null),
                synth: new Array(TOTAL_STEPS).fill(null),
                trumpet: new Array(TOTAL_STEPS).fill(null),
                guitar: new Array(TOTAL_STEPS).fill(null),
                piano: new Array(TOTAL_STEPS).fill(null),
                violin: new Array(TOTAL_STEPS).fill(null),
                flute: new Array(TOTAL_STEPS).fill(null),
            });

            const [volumes, setVolumes] = React.useState({
                drums: 2, loopTrack: 0, subBass: 6, bass: 4, synth: 0, trumpet: 0, guitar: 0, piano: 0, violin: 0, flute: 0
            });

            const synthsRef = React.useRef(null);
            const loopRef = React.useRef(null);
            const masterGainRef = React.useRef(null);

            const NOTES = ["C4", "D4", "E4", "F4", "G4", "A4", "B4", "C5"];
            const SOLFEGE = { "C4": "ド", "D4": "レ", "E4": "ミ", "F4": "ファ", "G4": "ソ", "A4": "ラ", "B4": "シ", "C5": "ド" };
            const DURATION_OPTIONS = [
                { id: "16n", label: "極短 (16分)" },
                { id: "8n", label: "標準 (8分)" },
                { id: "4n", label: "長め (4分)" },
                { id: "2n", label: "超長 (2n)" },
            ];

            React.useEffect(() => {
                const masterGain = new Tone.Gain(masterVolume).toDestination();
                masterGainRef.current = masterGain;

                const eq = new Tone.EQ3({ low: masterBassBoost, lowFrequency: 160, mid: 1.5, high: 2.5 }).connect(masterGain);
                const reverb = new Tone.Reverb({ decay: 1.4, wet: 0.12 }).connect(eq);
                const delay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.2, wet: 0.1 }).connect(reverb);
                const distortion = new Tone.Distortion(0.08).connect(delay);

                const cGains = {};
                Object.keys(instrumentSteps).forEach(key => {
                    const cg = new Tone.Gain(Tone.dbToGain(volumes[key] || 0)).connect(distortion);
                    cGains[key] = cg;
                });

                synthsRef.current = {
                    subBass: new Tone.MonoSynth({
                        oscillator: { type: "sine" },
                        envelope: { attack: 0.005, decay: 0.35, sustain: 0.5, release: 0.2 },
                        filterEnvelope: { attack: 0.005, decay: 0.2, sustain: 0.3, release: 0.2, baseFrequency: 70, octaves: 1.5 }
                    }).connect(cGains.subBass),
                    bass: new Tone.MonoSynth({
                        oscillator: { type: "triangle" },
                        envelope: { attack: 0.01, decay: 0.3, sustain: 0.4, release: 0.2 }
                    }).connect(cGains.bass),
                    synth: new Tone.Synth({ oscillator: { type: "pulse", width: 0.4 }, envelope: { attack: 0.01, decay: 0.25, sustain: 0.4, release: 0.2 } }).connect(cGains.synth),
                    loopTrack: new Tone.Synth({ oscillator: { type: "square" }, envelope: { attack: 0.008, decay: 0.2, sustain: 0.3, release: 0.15 } }).connect(cGains.loopTrack),
                    guitar: new Tone.Synth({ oscillator: { type: "sawtooth" }, envelope: { attack: 0.005, decay: 0.2, sustain: 0.2, release: 0.1 } }).connect(cGains.guitar),
                    trumpet: new Tone.Synth({ oscillator: { type: "sawtooth6" }, envelope: { attack: 0.04, decay: 0.2, sustain: 0.6, release: 0.15 } }).connect(cGains.trumpet),
                    piano: new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.008, decay: 0.35, sustain: 0.3, release: 0.4 } }).connect(cGains.piano),
                    violin: new Tone.Synth({ oscillator: { type: "sawtooth" }, envelope: { attack: 0.08, decay: 0.25, sustain: 0.8, release: 0.4 } }).connect(cGains.violin),
                    flute: new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.06, decay: 0.25, sustain: 0.7, release: 0.3 } }).connect(cGains.flute),
                    drums: {
                        kick: new Tone.MembraneSynth({ pitchDecay: 0.06, octaves: 6, oscillator: { type: "sine" }, envelope: { attack: 0.0001, decay: 0.3, sustain: 0.01, release: 0.15 } }).connect(cGains.drums),
                        snare: new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.0001, decay: 0.18, sustain: 0 } }).connect(cGains.drums),
                        hihat: new Tone.MetalSynth({ frequency: 900, envelope: { attack: 0.0005, decay: 0.025, release: 0.01 }, harmonicity: 5.1, modulationIndex: 32, resonance: 7000, octaves: 1.5 }).connect(cGains.drums),
                        clap: new Tone.NoiseSynth({ noise: { type: "pink" }, envelope: { attack: 0.005, decay: 0.14, sustain: 0 } }).connect(cGains.drums),
                    },
                    eq, reverb, distortion
                };

                return () => { Tone.Transport.stop(); Tone.Transport.cancel(); };
            }, []);

            React.useEffect(() => {
                Tone.Transport.bpm.value = bpm;
                Tone.Transport.cancel();

                if (playing) {
                    let stepCounter = 0;
                    loopRef.current = new Tone.Loop(time => {
                        let step = stepCounter % TOTAL_STEPS;
                        const bar = Math.floor(step / BAR_STEPS);
                        const sInBar = step % BAR_STEPS;

                        setCurrentStep(sInBar);
                        setCurrentBar(bar);

                        if (dlandMode && sInBar === 0 && !powerSavingMode) {
                            const colors = ["border-cyan-500", "border-pink-500", "border-amber-500", "border-purple-500", "border-emerald-500"];
                            setFlashColor(colors[Math.floor(Math.random() * colors.length)]);
                        }

                        const syns = synthsRef.current;
                        if (!syns) return;

                        Object.keys(instrumentSteps).forEach(instKey => {
                            const item = instrumentSteps[instKey][step];
                            if (!item) return;

                            const note = typeof item === "object" ? item.note : item;
                            const dur = typeof item === "object" ? (item.dur || "8n") : "8n";

                            if (instKey === "drums") {
                                if (typeof item === "object") {
                                    if (item.kick) syns.drums.kick.triggerAttackRelease(item.subBoost ? "C0" : "C1", "8n", time);
                                    if (item.snare) syns.drums.snare.triggerAttackRelease("8n", time);
                                    if (item.hihat) syns.drums.hihat.triggerAttackRelease("32n", time, 0.85);
                                    if (item.clap) syns.drums.clap.triggerAttackRelease("8n", time);
                                }
                            } else if (instKey === "subBass") {
                                syns.subBass.triggerAttackRelease(item.subBoost ? "C0" : "C1", dur, time);
                            } else if (syns[instKey]) {
                                syns[instKey].triggerAttackRelease(note || "C4", dur, time);
                            }
                        });

                        stepCounter++;
                    }, "16n").start(0);

                    Tone.Transport.start();
                } else {
                    Tone.Transport.stop();
                }
            }, [playing, bpm, instrumentSteps, dlandMode, powerSavingMode]);

            const togglePlay = async () => {
                await Tone.start();
                setPlaying(!playing);
                setStatus(playing ? "停止しました" : `▶ 再生中 (BPM: ${bpm}) - 作曲: 28 & danb / (c) micvictorydanb`);
            };

            const toggleRecord = async () => {
                await Tone.start();
                setIsRecording(!isRecording);
                if (!isRecording) {
                    setStatus("🔴 24小節 全体リアルタイム・crera録音中...");
                } else {
                    const newTake = {
                        id: Date.now(),
                        title: `24小節テイク #${recordedTakes.length + 1} (${slotName})`,
                        bpm,
                        date: new Date().toLocaleTimeString(),
                        credit: "micvictorydanb / 作曲: 28 & danb"
                    };
                    setRecordedTakes(prev => [...prev, newTake]);
                    setStatus("⏹️ 24小節の全体演奏を crera 保存リストに正常記録しました！");
                }
            };

            // 声歌（Voice）マイク録音機能
            const startVoiceRecording = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorderRef.current = new MediaRecorder(stream);
                    audioChunksRef.current = [];

                    mediaRecorderRef.current.ondataavailable = (event) => {
                        if (event.data.size > 0) audioChunksRef.current.push(event.data);
                    };

                    mediaRecorderRef.current.onstop = () => {
                        const audioBlob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                        const audioUrl = URL.createObjectURL(audioBlob);
                        setVoiceAudioUrl(audioUrl);

                        const newVoiceItem = {
                            id: Date.now(),
                            title: `声歌テイク #${voiceAudioList.length + 1} (${slotName})`,
                            date: new Date().toLocaleTimeString(),
                            credit: "micvictorydanb / 作曲: 28 & danb"
                        };
                        setVoiceAudioList(prev => [...prev, newVoiceItem]);
                        setStatus("🎙️ 声歌ヴォーカル録音完了＆creraリストに保存しました！");
                    };

                    mediaRecorderRef.current.start();
                    setIsVoiceRecording(true);
                    setStatus("🔴 声歌マイク録音中... (歌声を入力してください)");
                } catch (err) {
                    setStatus("❌ マイクアクセスエラーまたは非対応環境です。");
                }
            };

            const stopVoiceRecording = () => {
                if (mediaRecorderRef.current && isVoiceRecording) {
                    mediaRecorderRef.current.stop();
                    setIsVoiceRecording(false);
                }
            };

            // ズンズンちゃちゃ リズム自動生成（全24小節）
            const applyZunzunChachaRhythm = () => {
                const newDrums = new Array(TOTAL_STEPS).fill(null);
                const newBass = new Array(TOTAL_STEPS).fill(null);
                const newGuitar = new Array(TOTAL_STEPS).fill(null);
                const newPiano = new Array(TOTAL_STEPS).fill(null);
                const newSynth = new Array(TOTAL_STEPS).fill(null);

                const scale = ["C4", "E4", "G4", "A4", "C5"];

                for (let i = 0; i < TOTAL_STEPS; i++) {
                    const s = i % 16;
                    const isKick = (s === 0 || s === 6 || s === 8 || s === 14);
                    const isSnare = (s === 4 || s === 12);
                    const isHihat = true;
                    const isClap = (s === 12);

                    newDrums[i] = { kick: isKick, snare: isSnare, hihat: isHihat, clap: isClap, subBoost: true };

                    if (s === 0 || s === 8) {
                        newBass[i] = { note: "C1", dur: "8n", subBoost: true };
                        newGuitar[i] = { note: "E3", dur: "8n" };
                        newPiano[i] = { note: "C4", dur: "4n" };
                    }
                    if (s % 4 === 2) {
                        newSynth[i] = { note: scale[Math.floor(Math.random() * scale.length)], dur: "16n" };
                    }
                }

                setInstrumentSteps(prev => ({
                    ...prev,
                    drums: newDrums,
                    subBass: newBass,
                    bass: newBass,
                    guitar: newGuitar,
                    piano: newPiano,
                    synth: newSynth
                }));
                setStatus("🥁 ズンズンちゃちゃリズム & 前向き伴奏（24小節）を一括反映しました！");
            };

            // 18曲ソロ(danb) ポップス一括生成 ＋ AI各楽器自動仕上げ
            const generateSoloTrackAi = (trackId) => {
                setSelectedSoloTrack(trackId);
                const newSynth = new Array(TOTAL_STEPS).fill(null);
                const newTrumpet = new Array(TOTAL_STEPS).fill(null);
                const newViolin = new Array(TOTAL_STEPS).fill(null);
                const newFlute = new Array(TOTAL_STEPS).fill(null);
                const newDrums = new Array(TOTAL_STEPS).fill(null);
                const newSubBass = new Array(TOTAL_STEPS).fill(null);

                const scales = [
                    ["C4", "D4", "E4", "G4", "A4", "C5"],
                    ["A3", "C4", "E4", "G4", "A4"],
                    ["F3", "A3", "C4", "E4", "F4"],
                    ["G3", "B3", "D4", "G4", "B4"]
                ];
                const scale = scales[(trackId - 1) % scales.length];

                for (let i = 0; i < TOTAL_STEPS; i++) {
                    const s = i % 16;
                    if (i % 2 === 0 || (i % 16 >= 8 && Math.random() < 0.7)) {
                        const note = scale[(i * 3 + trackId) % scale.length];
                        const dur = (i % 4 === 0) ? "4n" : "8n";
                        newSynth[i] = { note, dur };
                    }
                    // AI各楽器が伴奏を自動仕上げ
                    if (s % 4 === 0) {
                        newTrumpet[i] = { note: scale[0], dur: "4n" };
                        newViolin[i] = { note: scale[2], dur: "4n" };
                    }
                    if (s === 2 || s === 10) {
                        newFlute[i] = { note: scale[4], dur: "8n" };
                    }
                    const isKick = (s === 0 || s === 8);
                    const isSnare = (s === 4 || s === 12);
                    newDrums[i] = { kick: isKick, snare: isSnare, hihat: true, clap: s === 12, subBoost: true };
                    if (s === 0 || s === 8) {
                        newSubBass[i] = { note: "C1", dur: "8n", subBoost: true };
                    }
                }

                setInstrumentSteps(prev => ({
                    ...prev,
                    synth: newSynth,
                    trumpet: newTrumpet,
                    violin: newViolin,
                    flute: newFlute,
                    drums: newDrums,
                    subBass: newSubBass
                }));
                setStatus(
                    `🤖 AI各楽器自動仕上げ #${trackId} 「${soloTrackList[trackId - 1].title.split(' ')[2]}」構築完了！(c) micvictorydanb`
                );
            };

            const toggleStepWithDuration = (instKey, idx, note = selectedNote, dur = selectedDuration) => {
                setInstrumentSteps(prev => {
                    const currentArr = [...prev[instKey]];
                    if (instKey === "drums") {
                        const currentObj = currentArr[idx] || { kick: false, snare: false, hihat: false, clap: false };
                        const updatedObj = { ...currentObj, [selectedDrumPart]: !currentObj[selectedDrumPart] };
                        const hasAny = Object.values(updatedObj).some(Boolean);
                        currentArr[idx] = hasAny ? updatedObj : null;
                    } else {
                        currentArr[idx] = currentArr[idx] ? null : { note, dur, subBoost: instKey === "subBass" };
                    }
                    return { ...prev, [instKey]: currentArr };
                });
            };

            const clearSpecificInstrument = (instKey) => {
                setInstrumentSteps(prev => ({ ...prev, [instKey]: new Array(TOTAL_STEPS).fill(null) }));
                setStatus(`🗑️ 【${instKey}】をクリアしました。`);
            };

            const exportProjectToFile = () => {
                const projectData = {
                    title: slotName,
                    album: "MIC VICTORY 24小節 OFFICIAL ALBUM v59.0",
                    copyright: "micvictorydanb",
                    composer: "28 & danb",
                    bpm,
                    instrumentSteps,
                    volumes,
                    date: new Date().toISOString()
                };
                const blob = new Blob([JSON.stringify(projectData, null, 2)], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `${slotName}.json`;
                a.click();
                URL.revokeObjectURL(url);
                setStatus(`💾 24小節アルバムプロジェクトファイル転送（保存）完了！`);
            };

            const importProjectFromFile = (event) => {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (data.instrumentSteps) {
                            setInstrumentSteps(data.instrumentSteps);
                            if (data.bpm) setBpm(data.bpm);
                            setStatus(`📂 ファイル転送読込成功：${data.title || 'プロジェクト'}`);
                        }
                    } catch (err) {
                        setStatus("❌ ファイル転送読込エラー");
                    }
                };
                reader.readAsText(file);
            };

            return (
                <div className={`min-h-screen bg-slate-950 text-slate-100 flex flex-col text-xs font-sans select-none pb-24 overflow-x-hidden border-8 transition-colors duration-300 ${powerSavingMode ? 'border-emerald-800' : flashColor}`}>
                    {screenSaverActive && !powerSavingMode && (
                        <div onClick={() => setScreenSaverActive(false)} className="fixed inset-0 z-50 bg-slate-950/95 flex flex-col items-center justify-center p-6 cursor-pointer backdrop-blur-md">
                            <div className="absolute top-4 right-4 text-cyan-400 font-bold text-sm animate-pulse">
                                [ 画面クリックで通常画面へ戻る ]
                            </div>
                            <div className="text-center mb-8">
                                <h1 className="text-2xl font-black bg-gradient-to-r from-amber-400 via-pink-400 to-cyan-400 bg-clip-text text-transparent animate-bounce">
                                    MIC VICTORY 24-BARS VISUALIZER
                                </h1>
                                <p className="text-slate-400 text-xs mt-1">著作権: micvictorydanb | 作曲: 28 & danb | BPM: {bpm}</p>
                            </div>
                            <div className="flex items-end gap-1.5 h-64 w-full max-w-xl bg-slate-900/80 p-4 rounded-xl border border-slate-800 shadow-2xl">
                                {Array.from({ length: 16 }).map((_, idx) => {
                                    const activeHeight = playing ? Math.floor(Math.sin((idx + currentStep) * 0.5) * 40 + 60) : 10;
                                    return (
                                        <div key={idx} className="flex-1 bg-gradient-to-t from-pink-600 via-purple-600 to-cyan-400 rounded-t transition-all duration-100" style={{ height: `${activeHeight}%` }}></div>
                                    );
                                })}
                            </div>
                        </div>
                    )}

                    <header className="bg-slate-900 border-b border-slate-800 px-3 py-2 flex items-center justify-between gap-2 sticky top-0 z-40 shadow-lg">
                        <div className="flex items-center gap-2">
                            <span className="font-black text-sm bg-gradient-to-r from-amber-400 via-pink-400 to-cyan-400 bg-clip-text text-transparent">
                                MIC VICTORY <span className="text-[10px] text-pink-400 font-bold">v59.0 声歌・AI各楽器自動版</span>
                            </span>
                        </div>
                        <div className="flex items-center gap-1.5 flex-wrap">
                            <button 
                                onClick={() => setPowerSavingMode(!powerSavingMode)} 
                                className={`px-2.5 py-1 rounded font-bold text-[10px] border shadow transition-all ${
                                    powerSavingMode 
                                        ? 'bg-emerald-600 border-emerald-400 text-white animate-pulse' 
                                        : 'bg-slate-800 border-slate-700 text-slate-300 hover:bg-slate-700'
                                }`}
                            >
                                {powerSavingMode ? '⚡ 節電: ON' : '🔋 節電: OFF'}
                            </button>

                            {!powerSavingMode && (
                                <button onClick={() => setScreenSaverActive(true)} className="px-2.5 py-1 bg-cyan-900 border border-cyan-700 text-cyan-200 font-bold rounded text-[10px] shadow">
                                    📺 セーバー
                                </button>
                            )}
                            <button onClick={togglePlay} className={`px-3 py-1 rounded font-bold text-xs shadow ${playing ? "bg-amber-400 text-slate-950 animate-bounce" : "bg-pink-600 text-white"}`}>
                                {playing ? "■ 停止" : "▶ 再生"}
                            </button>
                            <button onClick={toggleRecord} className={`px-3 py-1 rounded font-bold text-xs shadow ${isRecording ? "bg-red-600 text-white animate-pulse" : "bg-slate-800 text-red-400 border border-red-800"}`}>
                                {isRecording ? "🔴 24小節録音中(Stop保存)" : "⏺️ 24小節 crera保存"}
                            </button>
                            <div className="flex items-center gap-1 bg-slate-950 px-2 py-0.5 rounded border border-slate-800">
                                <span className="text-[9px] text-slate-400">BPM</span>
                                <input type="number" value={bpm} onChange={e => setBpm(Math.max(60, Math.min(220, Number(e.target.value))))} className="w-12 bg-slate-900 text-center font-bold text-pink-400 rounded text-xs py-0.5" />
                            </div>
                        </div>
                    </header>

                    <nav className="bg-slate-900/90 border-b border-slate-800 px-2 py-1.5 flex gap-1 overflow-x-auto">
                        {[
                            { id: "VOICE_REC", label: "🎙️ 声歌・Voice録音" },
                            { id: "SOLO_AI_18", label: "🤖 AI各楽器自動仕上げ" },
                            { id: "ZUNZUN_CHACHA", label: "🥁 ズンズンちゃちゃリズム" },
                            { id: "DUAL_EDIT", label: "🎛️ 24小節 手動鍵盤エディタ" },
                            { id: "RAP_AI", label: "🎤 800字歌詞 & ラップ" },
                            { id: "RECORDINGS", label: "📁 creraリスト & アルバム" },
                            { id: "MEMORY", label: "💾 ファイル転送" },
                        ].map(t => (
                            <button key={t.id} onClick={() => setTab(t.id)} className={`px-3 py-1 rounded text-center font-bold transition-all shrink-0 ${tab === t.id ? "bg-amber-500 text-slate-950 shadow" : "bg-slate-800/60 text-slate-400"}`}>
                                {t.label}
                            </button>
                        ))}
                    </nav>

                    <div className="bg-slate-900/50 px-3 py-1 text-[11px] text-cyan-400 border-b border-slate-900 truncate flex justify-between items-center">
                        <span>💡 {status} | 🎵 作曲: 28 & danb | (c) micvictorydanb</span>
                        {playing && (
                            <div className="flex items-center gap-1">
                                <span className="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
                                <span className="text-[10px] text-cyan-300 font-mono">BAR: {currentBar + 1}/24 | STEP: {currentStep + 1}</span>
                            </div>
                        )}
                    </div>

                    <main className="p-2 flex flex-col gap-3">
                        {tab === "VOICE_REC" && (
                            <div className="flex flex-col gap-3">
                                <div className="bg-gradient-to-r from-slate-900 via-pink-950/40 to-slate-900 border border-pink-800/60 rounded-lg p-4 flex flex-col gap-3 shadow-lg">
                                    <div className="flex justify-between items-center flex-wrap gap-2">
                                        <h2 className="text-sm font-black text-pink-400">🎙️ 声歌（Voice）マイク録音 & 録音再生 crera保存リスト</h2>
                                        <span className="px-2 py-0.5 bg-red-600 text-white font-bold rounded text-[10px]">マイク入力対応</span>
                                    </div>
                                    <p className="text-[11px] text-slate-300 leading-relaxed">
                                        マイクからあなたの歌声やラップ、メロディを直接録音し、crera保存リストへ登録してアルバムに組み込むことができます。
                                    </p>
                                    <div className="flex gap-2 items-center flex-wrap">
                                        {!isVoiceRecording ? (
                                            <button onClick={startVoiceRecording} className="px-4 py-2.5 bg-red-600 text-white font-black rounded-lg text-xs shadow-xl hover:bg-red-500 transition-all">
                                                🎙️ 声歌マイク録音を開始
                                            </button>
                                        ) : (
                                            <button onClick={stopVoiceRecording} className="px-4 py-2.5 bg-slate-800 text-red-400 border border-red-600 font-black rounded-lg text-xs animate-pulse">
                                                ⏹️ 声歌マイク録音を停止 (保存)
                                            </button>
                                        )}
                                    </div>
                                    {voiceAudioUrl && (
                                        <div className="flex flex-col gap-2 bg-slate-950 p-3 rounded border border-slate-800">
                                            <span className="text-[10px] text-cyan-400 font-bold">直近の声歌プレビュー再生:</span>
                                            <audio controls src={voiceAudioUrl} className="w-full h-8" />
                                        </div>
                                    )}
                                    <div className="flex flex-col gap-2 bg-slate-950 p-3 rounded border border-slate-800">
                                        <span className="text-[10px] text-amber-400 font-bold">📁 crera 声歌録音再生リスト (全 {voiceAudioList.length} 件):</span>
                                        {voiceAudioList.map(v => (
                                            <div key={v.id} className="flex justify-between items-center bg-slate-900 p-2 rounded border border-slate-800">
                                                <div>
                                                    <div className="text-pink-400 text-xs font-bold">{v.title}</div>
                                                    <div className="text-[9px] text-slate-400">{v.credit} | {v.date}</div>
                                                </div>
                                                <button onClick={() => setStatus(`▶ crera声歌リスト「${v.title}」を選択しました`)} className="px-2.5 py-1 bg-cyan-700 text-white rounded text-[10px] font-bold">選択</button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {tab === "SOLO_AI_18" && (
                            <div className="flex flex-col gap-3">
                                <div className="bg-gradient-to-r from-slate-900 via-purple-950/40 to-slate-900 border border-purple-800/60 rounded-lg p-4 flex flex-col gap-3 shadow-lg">
                                    <div className="flex justify-between items-center flex-wrap gap-2">
                                        <h2 className="text-sm font-black bg-gradient-to-r from-amber-400 via-pink-400 to-cyan-400 bg-clip-text text-transparent">
                                            🤖 AI各楽器自動仕上げ (18曲ソロ danb ポップスコレクション)
                                        </h2>
                                        <span className="px-2 py-0.5 bg-pink-600 text-white font-bold rounded text-[10px]">一括AI構築</span>
                                    </div>
                                    <p className="text-[11px] text-slate-300 leading-relaxed">
                                        AIがシンセ・トランペット・バイオリン・フルート・ドラム・ベースの各楽器を自動で美しく仕上げて重ねます。崩れない最強の結びを体感してください。
                                    </p>
                                    <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-1.5 max-h-[300px] overflow-y-auto p-1 bg-slate-950 rounded border border-slate-800">
                                        {soloTrackList.map(track => (
                                            <button
                                                key={track.id}
                                                onClick={() => generateSoloTrackAi(track.id)}
                                                className={`p-2 rounded border text-left flex flex-col justify-between gap-1 transition-all ${
                                                    selectedSoloTrack === track.id
                                                        ? "bg-amber-500 text-slate-950 border-white font-black shadow-lg"
                                                        : "bg-slate-900 text-slate-200 border-slate-800 hover:bg-slate-800"
                                                }`}
                                            >
                                                <div className="text-[10px] opacity-80">曲 #{track.id}</div>
                                                <div className="text-xs font-bold leading-tight truncate">{track.title.split(' ')[2]}</div>
                                                <div className="text-[9px] text-pink-400 font-mono">作: 28 & danb</div>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {tab === "ZUNZUN_CHACHA" && (
                            <div className="flex flex-col gap-3">
                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-4 flex flex-col gap-3">
                                    <h2 className="text-sm font-black text-amber-400">🥁 ズンズンちゃちゃリズム & 前向き伴奏（24小節一括構築）</h2>
                                    <p className="text-[11px] text-slate-300 leading-relaxed">
                                        「ズンズン・ちゃちゃっ」の定番ダンスビートに、エレキギターバックコーラス、重低音ベース、前向きなピアノ伴奏を24小節全体に一瞬で組み込みます。
                                    </p>
                                    <button onClick={applyZunzunChachaRhythm} className="px-4 py-3 bg-gradient-to-r from-red-600 via-amber-600 to-pink-600 text-white font-black rounded-lg text-xs shadow-xl hover:opacity-90 transition-all">
                                        🚀 ズンズンちゃちゃリズム & 伴奏を全24小節に一括反映！
                                    </button>
                                </div>
                            </div>
                        )}

                        {tab === "DUAL_EDIT" && (
                            <div className="flex flex-col gap-3">
                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-2.5 shadow">
                                    <div className="flex justify-between items-center">
                                        <span className="text-xs font-bold text-pink-400">① 楽器選択 & 24小節手動エディタ</span>
                                        <button onClick={() => clearSpecificInstrument(selectedInstrument)} className="px-2.5 py-1 bg-red-950 text-red-300 font-bold rounded text-[10px]">クリア</button>
                                    </div>
                                    <div className="grid grid-cols-2 sm:grid-cols-5 gap-1.5">
                                        {INSTRUMENTS.map(inst => (
                                            <button key={inst.id} onClick={() => setSelectedInstrument(inst.id)} className={`py-2 px-1 rounded-lg font-bold text-[11px] border flex items-center justify-center gap-1 shadow ${selectedInstrument === inst.id ? `bg-gradient-to-r ${inst.color} border-white text-white` : "bg-slate-950 border-slate-800 text-slate-400"}`}>
                                                {inst.label}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3 shadow">
                                    <div className="flex justify-between items-center flex-wrap gap-2">
                                        <span className="text-xs font-bold text-cyan-400">② 鍵盤 & 音の長さ（短・長）調整</span>
                                        <div className="flex items-center gap-1 bg-slate-950 px-2 py-1 rounded border border-slate-800">
                                            <span className="text-[10px] text-amber-400 font-bold">音長:</span>
                                            {DURATION_OPTIONS.map(d => (
                                                <button key={d.id} onClick={() => setSelectedDuration(d.id)} className={`px-2 py-0.5 rounded text-[10px] font-bold ${selectedDuration === d.id ? "bg-amber-500 text-slate-950" : "bg-slate-900 text-slate-400"}`}>
                                                    {d.label.split(" ")[0]}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {selectedInstrument === "drums" && (
                                        <div className="flex items-center gap-2 bg-slate-950 p-2 rounded border border-slate-800">
                                            <span className="text-[10px] font-bold text-red-400">打楽器切替:</span>
                                            {["kick", "snare", "hihat", "clap"].map(part => (
                                                <button key={part} onClick={() => setSelectedDrumPart(part)} className={`px-2.5 py-1 rounded text-[10px] font-bold ${selectedDrumPart === part ? "bg-red-600 text-white" : "bg-slate-900 text-slate-400"}`}>
                                                    {part.toUpperCase()}
                                                </button>
                                            ))}
                                        </div>
                                    )}

                                    <div className="grid grid-cols-8 gap-1.5">
                                        {NOTES.map(note => (
                                            <button key={note} onClick={() => {
                                                setSelectedNote(note);
                                                const syns = synthsRef.current;
                                                if (syns && syns[selectedInstrument]) {
                                                    syns[selectedInstrument].triggerAttackRelease(note, selectedDuration);
                                                }
                                                if (currentStep !== -1) {
                                                    const stepIdx = currentBar * BAR_STEPS + currentStep;
                                                    toggleStepWithDuration(selectedInstrument, stepIdx, note, selectedDuration);
                                                }
                                            }} className={`py-4 rounded font-bold text-center border shadow transition-all active:scale-95 ${selectedNote === note ? "bg-amber-500 text-slate-950 border-white ring-2 ring-amber-400" : "bg-slate-950 text-slate-100 border-slate-800 hover:bg-slate-900"}`}>
                                                <div className="text-sm font-black">{SOLFEGE[note]}</div>
                                                <div className="text-[9px] opacity-70">{note}</div>
                                            </button>
                                        ))}
                                    </div>

                                    <div className="flex items-center justify-between bg-slate-950 p-2 rounded border border-slate-800 flex-wrap gap-2">
                                        <span className="text-[11px] text-slate-300">小節選択 (全24小節): <strong className="text-pink-400">{currentBar + 1} / 24</strong></span>
                                        <div className="flex gap-1 overflow-x-auto max-w-full pb-1">
                                            {Array.from({ length: BARS }).map((_, b) => (
                                                <button key={b} onClick={() => setCurrentBar(b)} className={`w-6 h-6 rounded-full text-[10px] font-bold shrink-0 ${currentBar === b ? "bg-amber-500 text-slate-950" : "bg-slate-800 text-slate-400"}`}>{b + 1}</button>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="overflow-x-auto bg-slate-950 p-2 rounded border border-slate-800">
                                        <div className="grid gap-1 min-w-[500px]" style={{ gridTemplateColumns: "repeat(16, minmax(0, 1fr))" }}>
                                            {Array.from({ length: BAR_STEPS }).map((_, i) => {
                                                const stepIdx = currentBar * BAR_STEPS + i;
                                                const stepVal = instrumentSteps[selectedInstrument][stepIdx];
                                                const isCurrentPlay = playing && currentStep === i;
                                                let isActive = selectedInstrument === "drums" ? (stepVal && stepVal[selectedDrumPart]) : !!stepVal;

                                                return (
                                                    <button key={i} onClick={() => toggleStepWithDuration(selectedInstrument, stepIdx)} className={`aspect-[3/4] w-full rounded border flex flex-col items-center justify-center text-[9px] ${isActive ? "bg-gradient-to-t from-amber-600 to-pink-600 border-white text-white font-bold" : "bg-slate-900 border-slate-800 text-slate-500"} ${isCurrentPlay && !powerSavingMode ? "ring-2 ring-cyan-400" : ""}`}>
                                                        <span>{i + 1}</span>
                                                        {stepVal && typeof stepVal === "object" && stepVal.dur && (
                                                            <span className="text-[7px] text-yellow-200">{stepVal.dur}</span>
                                                        )}
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {tab === "RAP_AI" && (
                            <div className="flex flex-col gap-3">
                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-4 flex flex-col gap-3">
                                    <div className="flex justify-between items-center flex-wrap gap-2">
                                        <span className="text-xs font-bold text-pink-400">🎤 800字歌詞ストック & ラップAI作成</span>
                                        <div className="flex gap-1">
                                            {["青春・希望", "恋愛・情熱", "時代・春夏秋冬", "友情・仲間"].map(theme => (
                                                <button key={theme} onClick={() => setLyricTheme(theme)} className={`px-2 py-1 rounded text-[10px] font-bold ${lyricTheme === theme ? "bg-pink-600 text-white" : "bg-slate-800 text-slate-400"}`}>
                                                    {theme}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                    <textarea value={rapLyrics} onChange={e => setRapLyrics(e.target.value)} rows="8" className="bg-slate-950 text-slate-100 p-2.5 rounded text-xs border border-slate-800 font-mono leading-relaxed" />
                                    <div className="flex gap-2">
                                        <button onClick={() => setStatus("📝 24小節の歌詞データを crera に保存しました！")} className="px-3 py-1.5 bg-cyan-600 text-white font-bold rounded text-xs">crera保存</button>
                                        <button onClick={() => setRapLyrics("[Verse - " + lyricTheme + "]\nズンズンちゃちゃ響く 24小節 DLAND\n作曲: 28 & danb / (c) micvictorydanb")} className="px-3 py-1.5 bg-slate-800 text-slate-300 font-bold rounded text-xs">AI自動切替生成</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {tab === "RECORDINGS" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-4 flex flex-col gap-3">
                                <span className="text-xs font-bold text-pink-400">📁 crera 24小節 全体録音リスト & アルバム著作権リリース管理</span>
                                <div className="bg-slate-950 p-3 rounded border border-slate-800 flex flex-col gap-2 max-h-[220px] overflow-y-auto">
                                    {recordedTakes.length === 0 ? <span className="text-[10px] text-slate-500">記録なし</span> : recordedTakes.map(t => (
                                        <div key={t.id} className="flex justify-between items-center bg-slate-900 p-2 rounded border border-slate-800">
                                            <div>
                                                <div className="text-cyan-400 text-xs font-bold">{t.title}</div>
                                                <div className="text-[9px] text-slate-400">BPM: {t.bpm} | {t.credit} | {t.date}</div>
                                            </div>
                                            <div className="flex gap-1">
                                                <button onClick={() => setStatus(`🚀 ${t.title} をアルバムリリースに登録完了！ (c) micvictorydanb`)} className="px-2 py-1 bg-emerald-700 text-white rounded text-[10px] font-bold">リリース</button>
                                                <button onClick={() => setRecordedTakes(recordedTakes.filter(x => x.id !== t.id))} className="px-2 py-1 bg-red-900 text-white rounded text-[10px]">削除</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {tab === "MEMORY" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3">
                                <span className="text-xs font-bold text-emerald-400">💾 ファイル転送・24小節プロジェクト保存</span>
                                <div className="flex gap-2 bg-slate-950 p-3 rounded border border-slate-800">
                                    <input type="text" value={slotName} onChange={e => setSlotName(e.target.value)} className="bg-slate-900 px-2 py-1 rounded text-slate-100 flex-1 border border-slate-800 font-bold text-xs" />
                                    <button onClick={exportProjectToFile} className="px-3 py-1 bg-emerald-600 text-white font-bold rounded text-xs">ファイル転送(保存)</button>
                                </div>
                                <div className="flex flex-col gap-1 bg-slate-950 p-3 rounded border border-slate-800">
                                    <span className="text-[10px] text-slate-400">外部からプロジェクトファイルを読込（ファイル転送）:</span>
                                    <input type="file" accept=".json" onChange={importProjectFromFile} className="text-[10px] text-slate-300" />
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<MasterSynthApp />);
    </script>
</body>
</html>
