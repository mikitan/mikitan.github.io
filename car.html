<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自己管理ライフログ App（ローカル完全版）</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --danger-color: #ef4444;
            --danger-hover: #dc2626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
            padding: 20px;
        }

        header {
            max-width: 1200px;
            margin: 0 auto 24px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--primary-color);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            font-size: 1.1rem;
            margin-bottom: 16px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        input, select, textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
        }

        textarea {
            resize: vertical;
            height: 70px;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 0.95rem;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .btn-group {
            display: flex;
            gap: 6px;
        }

        button.edit-btn {
            background-color: #f59e0b;
            width: auto;
            padding: 6px 12px;
            font-size: 0.8rem;
        }
        button.edit-btn:hover { background-color: #d97706; }

        button.delete-btn {
            background-color: var(--danger-color);
            width: auto;
            padding: 6px 12px;
            font-size: 0.8rem;
        }
        button.delete-btn:hover { background-color: var(--danger-hover); }

        .flex-row {
            display: flex;
            gap: 10px;
        }
        
        .status-badge {
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 4px;
            background-color: #d1fae5;
            color: #065f46;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            margin-top: 8px;
        }

        th, td {
            text-align: left;
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #f9fafb;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <header>
        <h1>自己管理ライフログ App</h1>
        <div>
            <span class="status-badge">ローカル保存モード（稼働中）</span>
        </div>
    </header>

    <div class="container">
        <!-- 目標 -->
        <div class="card">
            <h2>目標設定</h2>
            <div class="form-group">
                <label for="goal-input">現在のメイン目標</label>
                <input type="text" id="goal-input" value="健康的な体重維持と毎日継続">
            </div>
            <button onclick="saveRecord('目標', document.getElementById('goal-input').value)">目標を保存する</button>
        </div>

        <!-- 食事・水分 -->
        <div class="card">
            <h2>食事・水分・カロリー</h2>
            <div class="form-group">
                <label>食事内容 & カロリー</label>
                <div class="flex-row">
                    <input type="text" id="meal-input" placeholder="例: サラダ" style="flex: 2;">
                    <input type="number" id="calorie-input" placeholder="kcal" style="flex: 1;">
                </div>
            </div>
            <div class="form-group">
                <label for="water">水分摂取量 (ml)</label>
                <input type="number" id="water" placeholder="例: 1500">
            </div>
            <button onclick="saveMealRecord()">食事・水分を保存する</button>
        </div>

        <!-- エクササイズ -->
        <div class="card">
            <h2>エクササイズ・歩行</h2>
            <div class="form-group">
                <label for="exercise">運動メニュー</label>
                <input type="text" id="exercise" placeholder="例: ウォーキング 30分">
            </div>
            <div class="form-group">
                <label for="steps">歩数</label>
                <input type="number" id="steps" placeholder="例: 8000">
            </div>
            <button onclick="saveExerciseRecord()">活動を保存する</button>
        </div>

        <!-- 睡眠・健康 -->
        <div class="card">
            <h2>睡眠・薬・健康</h2>
            <div class="form-group">
                <label for="sleep">睡眠時間 (h)</label>
                <input type="number" step="0.5" id="sleep" placeholder="例: 7.0">
            </div>
            <div class="form-group">
                <label for="medication">服薬・サプリ</label>
                <input type="text" id="medication" placeholder="例: ビタミンC">
            </div>
            <button onclick="saveHealthRecord()">体調データを保存する</button>
        </div>

        <!-- 日記 -->
        <div class="card">
            <h2>日記・思索・写真</h2>
            <div class="form-group">
                <label for="diary">本日の振り返り・思索</label>
                <textarea id="diary" placeholder="今日の気づき..."></textarea>
            </div>
            <button onclick="saveRecord('日記', document.getElementById('diary').value)">日記を保存する</button>
        </div>

        <!-- メモ -->
        <div class="card">
            <h2>リストメモ</h2>
            <div class="form-group">
                <div class="flex-row">
                    <input type="text" id="memo-input" placeholder="新しいメモやタスク...">
                    <button style="width: 80px;" onclick="addMemoItem()">追加</button>
                </div>
            </div>
        </div>

        <!-- データ管理（確認・編集・削除の一覧） -->
        <div class="card full-width">
            <h2>保存データ一覧（確認・編集・削除）</h2>
            <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 12px;">
                アプリ内に保存されたすべての記録をここで「確認」「編集」「削除」できます。
            </p>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>日時</th>
                            <th>カテゴリ</th>
                            <th>内容詳細</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="record-table-body">
                        <!-- データがここに表示されます -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // ローカルストレージを使ったデータ管理
        let records = JSON.parse(localStorage.getItem('lifelog_records')) || [
            { id: 1, date: '2026-07-25 08:00', category: '目標', detail: '健康的な体重維持と毎日継続' }
        ];

        function saveRecord(category, detail) {
            if(!detail || detail.trim() === '') {
                alert('内容を入力してください。');
                return;
            }

            const nowStr = new Date().toISOString().replace('T', ' ').substring(0, 16);
            const newEntry = {
                id: Date.now(),
                date: nowStr,
                category: category,
                detail: detail
            };

            records.unshift(newEntry);
            syncStorage();
            renderTable();
            alert(`「${category}」を保存しました！`);
        }

        function saveMealRecord() {
            const meal = document.getElementById('meal-input').value || '食事記録';
            const calorie = document.getElementById('calorie-input').value || '0';
            const water = document.getElementById('water').value || '0';
            saveRecord('食事・水分', `食事: ${meal} (${calorie}kcal) / 水分: ${water}ml`);
        }

        function saveExerciseRecord() {
            const exercise = document.getElementById('exercise').value || '運動';
            const steps = document.getElementById('steps').value || '0';
            saveRecord('エクササイズ', `運動: ${exercise} / 歩数: ${steps}歩`);
        }

        function saveHealthRecord() {
            const sleep = document.getElementById('sleep').value || '0';
            const med = document.getElementById('medication').value || 'なし';
            saveRecord('睡眠・健康', `睡眠: ${sleep}時間 / 服薬: ${med}`);
        }

        function addMemoItem() {
            const input = document.getElementById('memo-input');
            if(input.value.trim() === '') return;
            saveRecord('リストメモ', input.value);
            input.value = '';
        }

        function editRecord(id) {
            const record = records.find(r => r.id === id);
            if (!record) return;

            const newDetail = prompt('内容を編集してください:', record.detail);
            if (newDetail !== null && newDetail.trim() !== '') {
                record.detail = newDetail;
                syncStorage();
                renderTable();
                alert('データを更新しました。');
            }
        }

        function deleteRecord(id) {
            if (confirm('この記録を削除しますか？')) {
                records = records.filter(r => r.id !== id);
                syncStorage();
                renderTable();
            }
        }

        function syncStorage() {
            localStorage.setItem('lifelog_records', JSON.stringify(records));
        }

        function renderTable() {
            const tbody = document.getElementById('record-table-body');
            tbody.innerHTML = '';

            if (records.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:var(--text-muted);">保存されたデータはありません。</td></tr>';
                return;
            }

            records.forEach(r => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${r.date}</td>
                    <td><strong>${r.category}</strong></td>
                    <td>${r.detail}</td>
                    <td>
                        <div class="btn-group">
                            <button class="edit-btn" onclick="editRecord(${r.id})">編集</button>
                            <button class="delete-btn" onclick="deleteRecord(${r.id})">削除</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 初期表示
        window.onload = function() {
            renderTable();
        };
    </script>
</body>
</html>
