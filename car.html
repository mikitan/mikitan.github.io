<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自己管理ライフログ App（完全統合版）</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e5e7eb;
            --text-muted: #9ca3af;
            --border-color: #374151;
            --danger-color: #ef4444;
            --danger-hover: #dc2626;
            --input-bg: #2a2a2a;
        }

        /* 5色背景テーマ定義 */
        body.theme-dark { --bg-color: #121212; --card-bg: #1e1e1e; --text-color: #e5e7eb; --border-color: #374151; --input-bg: #2a2a2a; }
        body.theme-light { --bg-color: #f3f4f6; --card-bg: #ffffff; --text-color: #1f2937; --text-muted: #6b7280; --border-color: #e5e7eb; --input-bg: #ffffff; }
        body.theme-blue { --bg-color: #0f172a; --card-bg: #1e293b; --text-color: #f8fafc; --text-muted: #94a3b8; --border-color: #334155; --input-bg: #0f172a; }
        body.theme-green { --bg-color: #064e3b; --card-bg: #065f46; --text-color: #ecfdf5; --text-muted: #a7f3d0; --border-color: #047857; --input-bg: #064e3b; }
        body.theme-rose { --bg-color: #4c0519; --card-bg: #881337; --text-color: #fff1f2; --text-muted: #fecdd3; --border-color: #9f1239; --input-bg: #4c0519; }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
            padding: 16px;
            transition: background-color 0.3s;
        }

        header {
            max-width: 1200px;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        h1 {
            font-size: 1.4rem;
        }

        .theme-selector {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .theme-btn {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid #fff;
            cursor: pointer;
            padding: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
        }

        .card h2 {
            font-size: 1.05rem;
            margin-bottom: 12px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-group {
            margin-bottom: 10px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 3px;
        }

        input, select, textarea {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.9rem;
            background-color: var(--input-bg);
            color: var(--text-color);
        }

        textarea {
            resize: vertical;
            height: 60px;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .btn-group {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        button.action-btn {
            width: auto;
            padding: 4px 10px;
            font-size: 0.75rem;
        }
        button.edit-btn { background-color: #f59e0b; }
        button.copy-btn { background-color: #0ea5e9; }
        button.delete-btn { background-color: var(--danger-color); }
        button.calendar-btn { background-color: #ea4335; }

        .flex-row {
            display: flex;
            gap: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            margin-top: 6px;
        }

        th, td {
            text-align: left;
            padding: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: rgba(0,0,0,0.1);
            color: var(--text-muted);
        }

        .chart-bar-container {
            margin-top: 8px;
        }
        .chart-row {
            display: flex;
            align-items: center;
            font-size: 0.8rem;
            margin-bottom: 6px;
            gap: 8px;
        }
        .chart-label {
            width: 80px;
            color: var(--text-muted);
        }
        .chart-track {
            flex-grow: 1;
            background-color: var(--border-color);
            border-radius: 4px;
            height: 12px;
            overflow: hidden;
        }
        .chart-fill {
            height: 100%;
            background-color: var(--primary-color);
            width: 0%;
            transition: width 0.5s;
        }
    </style>
</head>
<body class="theme-dark">

    <header>
        <h1>自己管理ライフログ App</h1>
        <div class="theme-selector">
            <span style="font-size: 0.8rem; color: var(--text-muted);">背景テーマ:</span>
            <button class="theme-btn" style="background: #121212;" onclick="setTheme('theme-dark')" title="ダーク"></button>
            <button class="theme-btn" style="background: #ffffff;" onclick="setTheme('theme-light')" title="ライト"></button>
            <button class="theme-btn" style="background: #0f172a;" onclick="setTheme('theme-blue')" title="ブルー"></button>
            <button class="theme-btn" style="background: #064e3b;" onclick="setTheme('theme-green')" title="グリーン"></button>
            <button class="theme-btn" style="background: #881337;" onclick="setTheme('theme-rose')" title="ローズ"></button>
        </div>
    </header>

    <div class="container">
        <!-- 目標 -->
        <div class="card">
            <h2>目標設定</h2>
            <div class="form-group">
                <label for="goal-input">メイン目標</label>
                <input type="text" id="goal-input" value="健康的な体重維持と毎日継続">
            </div>
            <button onclick="saveRecord('目標', document.getElementById('goal-input').value)">目標を保存</button>
        </div>

        <!-- 食事・水分 -->
        <div class="card">
            <h2>食事・水分・カロリー</h2>
            <div class="form-group">
                <label>食事内容 & カロリー</label>
                <div class="flex-row">
                    <input type="text" id="meal-input" placeholder="例: サラダチキン" style="flex: 2;">
                    <input type="number" id="calorie-input" placeholder="kcal" style="flex: 1;">
                </div>
            </div>
            <div class="form-group">
                <label for="water">水分 (ml)</label>
                <input type="number" id="water" placeholder="例: 1500">
            </div>
            <button onclick="saveMealRecord()">食事・水分を保存</button>
        </div>

        <!-- エクササイズ -->
        <div class="card">
            <h2>エクササイズ・歩行</h2>
            <div class="form-group">
                <label for="exercise">運動メニュー</label>
                <input type="text" id="exercise" placeholder="例: ウォーキング 30分">
            </div>
            <div class="form-group">
                <label for="steps">歩数</label>
                <input type="number" id="steps" placeholder="例: 8000">
            </div>
            <button onclick="saveExerciseRecord()">活動を保存</button>
        </div>

        <!-- 睡眠・健康 -->
        <div class="card">
            <h2>睡眠・薬・健康</h2>
            <div class="form-group">
                <label for="sleep">睡眠時間 (h)</label>
                <input type="number" step="0.5" id="sleep" placeholder="例: 7.5">
            </div>
            <div class="form-group">
                <label for="medication">服薬・サプリ</label>
                <input type="text" id="medication" placeholder="例: ビタミンC">
            </div>
            <button onclick="saveHealthRecord()">体調データを保存</button>
        </div>

        <!-- 日記 -->
        <div class="card">
            <h2>日記・思索・SNS投稿など</h2>
            <div class="form-group">
                <label for="diary">本日の振り返り・SNS連携項目</label>
                <textarea id="diary" placeholder="今日の気づき、Nsn.fesbok.tictop.imesta.x.line.投稿など..."></textarea>
            </div>
            <button onclick="saveRecord('日記・SNS', document.getElementById('diary').value)">内容を保存</button>
        </div>

        <!-- メモ -->
        <div class="card">
            <h2>リストメモ</h2>
            <div class="form-group">
                <div class="flex-row">
                    <input type="text" id="memo-input" placeholder="新しいメモやタスク...">
                    <button style="width: 70px;" onclick="addMemoItem()">追加</button>
                </div>
            </div>
        </div>

        <!-- グラフカード -->
        <div class="card full-width">
            <h2>活動・健康 簡易グラフ（目標達成度）</h2>
            <div class="chart-bar-container" id="chart-container">
                <!-- 動的生成 -->
            </div>
        </div>

        <!-- 保存データ管理（確認・編集・削除・全て削除・共有） -->
        <div class="card full-width">
            <h2>保存データ一覧（確認・編集・削除・共有）</h2>
            <div style="display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap;">
                <button style="background-color: #059669; width: auto;" onclick="exportDataJson()">JSONエクスポート</button>
                <button style="background-color: #3b82f6; width: auto;" onclick="exportDataText()">テキストコピー</button>
                <button style="background-color: var(--danger-color); width: auto;" onclick="deleteAllRecords()">全てのデータを削除</button>
            </div>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>日時</th>
                            <th>カテゴリ</th>
                            <th>内容詳細</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="record-table-body">
                        <!-- データ一覧 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        function setTheme(themeName) {
            document.body.className = themeName;
            localStorage.setItem('lifelog_theme', themeName);
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('lifelog_theme') || 'theme-dark';
            setTheme(savedTheme);
            renderTable();
            updateChart();
        });

        let records = JSON.parse(localStorage.getItem('lifelog_records')) || [
            { id: 1, date: '2026-07-25 08:00', category: '目標', detail: '健康的な体重維持と毎日継続' }
        ];

        function saveRecord(category, detail) {
            if(!detail || detail.trim() === '') {
                alert('内容を入力してください。');
                return;
            }

            const nowStr = new Date().toISOString().replace('T', ' ').substring(0, 16);
            const newEntry = {
                id: Date.now(),
                date: nowStr,
                category: category,
                detail: detail
            };

            records.unshift(newEntry);
            syncStorage();
            renderTable();
            updateChart();
            alert(`「${category}」を保存しました！`);
        }

        function saveMealRecord() {
            const meal = document.getElementById('meal-input').value || '食事記録';
            const calorie = document.getElementById('calorie-input').value || '0';
            const water = document.getElementById('water').value || '0';
            saveRecord('食事・水分', `食事: ${meal} (${calorie}kcal) / 水分: ${water}ml`);
        }

        function saveExerciseRecord() {
            const exercise = document.getElementById('exercise').value || '運動';
            const steps = document.getElementById('steps').value || '0';
            saveRecord('エクササイズ', `運動: ${exercise} / 歩数: ${steps}歩`);
        }

        function saveHealthRecord() {
            const sleep = document.getElementById('sleep').value || '0';
            const med = document.getElementById('medication').value || 'なし';
            saveRecord('睡眠・健康', `睡眠: ${sleep}時間 / 服薬: ${med}`);
        }

        function addMemoItem() {
            const input = document.getElementById('memo-input');
            if(input.value.trim() === '') return;
            saveRecord('リストメモ', input.value);
            input.value = '';
        }

        function editRecord(id) {
            const record = records.find(r => r.id === id);
            if (!record) return;

            const newDetail = prompt('内容を編集してください:', record.detail);
            if (newDetail !== null && newDetail.trim() !== '') {
                record.detail = newDetail;
                syncStorage();
                renderTable();
                updateChart();
                alert('データを更新しました。');
            }
        }

        function deleteRecord(id) {
            if (confirm('この記録を削除しますか？')) {
                records = records.filter(r => r.id !== id);
                syncStorage();
                renderTable();
                updateChart();
            }
        }

        function deleteAllRecords() {
            if (confirm('本当にすべての保存データを削除しますか？この操作は元に戻せません。')) {
                records = [];
                syncStorage();
                renderTable();
                updateChart();
                alert('すべてのデータを削除しました。');
            }
        }

        function copyText(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('クリップボードにコピーしました！');
            }).catch(err => {
                alert('コピーに失敗しました');
            });
        }

        function addToGoogleCalendar(category, detail) {
            const title = encodeURIComponent(`【自己管理】${category}`);
            const details = encodeURIComponent(detail);
            const url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&details=${details}`;
            window.open(url, '_blank');
        }

        function syncStorage() {
            localStorage.setItem('lifelog_records', JSON.stringify(records));
        }

        function exportDataJson() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(records, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "lifelog_export.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function exportDataText() {
            let textOutput = records.map(r => `[${r.date}] ${r.category}: ${r.detail}`).join('\n');
            copyText(textOutput);
        }

        function renderTable() {
            const tbody = document.getElementById('record-table-body');
            tbody.innerHTML = '';

            if (records.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:var(--text-muted);">保存されたデータはありません。</td></tr>';
                return;
            }

            records.forEach(r => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${r.date}</td>
                    <td><strong>${r.category}</strong></td>
                    <td>${r.detail}</td>
                    <td>
                        <div class="btn-group">
                            <button class="action-btn edit-btn" onclick="editRecord(${r.id})">編集</button>
                            <button class="action-btn copy-btn" onclick="copyText('${r.category}: ${r.detail}')">コピー</button>
                            <button class="action-btn calendar-btn" onclick="addToGoogleCalendar('${r.category}', '${r.detail}')">カレンダー</button>
                            <button class="action-btn delete-btn" onclick="deleteRecord(${r.id})">削除</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function updateChart() {
            const container = document.getElementById('chart-container');
            let latestSteps = 8000;
            let latestSleep = 7.0;
            let latestWater = 1500;

            records.forEach(r => {
                if(r.detail.includes('歩数')) {
                    const match = r.detail.match(/歩数:\s*(\d+)/);
                    if(match) latestSteps = parseInt(match[1]);
                }
                if(r.detail.includes('睡眠')) {
                    const match = r.detail.match(/睡眠:\s*([\d\.]+)/);
                    if(match) latestSleep = parseFloat(match[1]);
                }
                if(r.detail.includes('水分')) {
                    const match = r.detail.match(/水分:\s*(\d+)/);
                    if(match) latestWater = parseInt(match[1]);
                }
            });

            const stepPercent = Math.min(Math.round((latestSteps / 10000) * 100), 100);
            const sleepPercent = Math.min(Math.round((latestSleep / 8) * 100), 100);
            const waterPercent = Math.min(Math.round((latestWater / 2000) * 100), 100);

            container.innerHTML = `
                <div class="chart-row">
                    <span class="chart-label">歩数 (${latestSteps})</span>
                    <div class="chart-track"><div class="chart-fill" style="width: ${stepPercent}%;"></div></div>
                    <span>${stepPercent}%</span>
                </div>
                <div class="chart-row">
                    <span class="chart-label">睡眠 (${latestSleep}h)</span>
                    <div class="chart-track"><div class="chart-fill" style="width: ${sleepPercent}%; background-color: #3b82f6;"></div></div>
                    <span>${sleepPercent}%</span>
                </div>
                <div class="chart-row">
                    <span class="chart-label">水分 (${latestWater}ml)</span>
                    <div class="chart-track"><div class="chart-fill" style="width: ${waterPercent}%; background-color: #06b6d4;"></div></div>
                    <span>${waterPercent}%</span>
                </div>
            `;
        }
    </script>
</body>
</html>
