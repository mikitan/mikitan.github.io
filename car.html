<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ライフログ・自己管理ダッシュボード</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
            padding: 20px;
        }

        header {
            max-width: 1200px;
            margin: 0 auto 24px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--primary-color);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            font-size: 1.1rem;
            margin-bottom: 16px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        input, select, textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
        }

        textarea {
            resize: vertical;
            height: 80px;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 0.95rem;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
        }

        .list-item button.delete-btn {
            background-color: #ef4444;
            width: auto;
            padding: 4px 8px;
            font-size: 0.8rem;
        }

        .list-item button.delete-btn:hover {
            background-color: #dc2626;
        }

        .flex-row {
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>自己管理ライフログ App</h1>
        <p>目標達成・習慣化ダッシュボード</p>
    </header>

    <div class="container">
        <!-- 目標・ターゲット -->
        <div class="card">
            <h2>目標設定</h2>
            <div class="form-group">
                <label for="goal-input">現在のメイン目標</label>
                <input type="text" id="goal-input" value="健康的な体重維持と毎日継続">
            </div>
            <button>目標を更新</button>
        </div>

        <!-- カロリー・食事・水分 -->
        <div class="card">
            <h2>食事・水分・カロリー</h2>
            <div class="form-group">
                <label>食事内容 & カロリー</label>
                <div class="flex-row">
                    <input type="text" placeholder="例: 鶏胸肉のサラダ" style="flex: 2;">
                    <input type="number" placeholder="kcal" style="flex: 1;">
                </div>
            </div>
            <div class="form-group">
                <label for="water">水分摂取量 (ml)</label>
                <input type="number" id="water" placeholder="例: 1500">
            </div>
            <button>記録する</button>
        </div>

        <!-- エクササイズ・歩行 -->
        <div class="card">
            <h2>エクササイズ・歩行</h2>
            <div class="form-group">
                <label for="exercise">運動メニュー</label>
                <input type="text" id="exercise" placeholder="例: ジョギング 30分">
            </div>
            <div class="form-group">
                <label for="steps">歩数</label>
                <input type="number" id="steps" placeholder="例: 8500">
            </div>
            <button>活動を保存</button>
        </div>

        <!-- 睡眠・薬・体調 -->
        <div class="card">
            <h2>睡眠・薬・健康</h2>
            <div class="form-group">
                <label for="sleep">睡眠時間 (h)</label>
                <input type="number" step="0.5" id="sleep" placeholder="例: 7.5">
            </div>
            <div class="form-group">
                <label for="medication">服薬・サプリ</label>
                <input type="text" id="medication" placeholder="例: ビタミンC, 処方薬A">
            </div>
            <button>体調データを保存</button>
        </div>

        <!-- 日記・写真・思索 -->
        <div class="card">
            <h2>日記・思索・写真</h2>
            <div class="form-group">
                <label for="diary">本日の振り返り・思索</label>
                <textarea id="diary" placeholder="今日の気づき、形成日記..."></textarea>
            </div>
            <div class="form-group">
                <label for="photo">写真添付</label>
                <input type="file" id="photo" accept="image/*">
            </div>
            <button>日記を保存</button>
        </div>

        <!-- リスト・メモ -->
        <div class="card">
            <h2>リストメモ</h2>
            <div class="form-group">
                <div class="flex-row">
                    <input type="text" id="memo-input" placeholder="新しいタスクやメモ...">
                    <button style="width: 80px;" onclick="addMemo()">追加</button>
                </div>
            </div>
            <div id="memo-list">
                <div class="list-item">
                    <span>朝のストレッチを行う</span>
                    <button class="delete-btn">削除</button>
                </div>
                <div class="list-item">
                    <span>水をこまめに飲む</span>
                    <button class="delete-btn">削除</button>
                </div>
            </div>
        </div>

        <!-- Googleカレンダー連携・共有 -->
        <div class="card">
            <h2>Googleカレンダー・共有</h2>
            <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 12px;">
                予定やライフログのスケジュールをGoogleカレンダーに同期します。
            </p>
            <button style="margin-bottom: 8px; background-color: #ea4335;">Googleカレンダーと連携</button>
            <button style="background-color: #059669;">データを共有・エクスポート</button>
        </div>
    </div>

    <script>
        // 簡易的なメモ追加スクリプトのサンプル
        function addMemo() {
            const input = document.getElementById('memo-input');
            const list = document.getElementById('memo-list');
            if(input.value.trim() === '') return;

            const div = document.createElement('div');
            div.className = 'list-item';
            div.innerHTML = `<span>${input.value}</span><button class="delete-btn" onclick="this.parentElement.remove()">削除</button>`;
            list.appendChild(div);
            input.value = '';
        }
    </script>
</body>
</html>
