<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIC VICTORY DLAND v69.7 - 歌詞AI＆Voice録音一体化版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans select-none pb-28 overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        function MasterSynthApp() {
            const [tab, setTab] = React.useState("HUB");
            const [playing, setPlaying] = React.useState(false);
            const [bpm, setBpm] = React.useState(114);
            const [currentBar, setCurrentBar] = React.useState(0);
            const [currentStep, setCurrentStep] = React.useState(-1);
            const [status, setStatus] = React.useState("✨ v69.7 歌詞AIパネル内へのVoice録音統合完了！");

            const BARS = 24;
            const BAR_STEPS = 16;
            const TOTAL_STEPS = BARS * BAR_STEPS;

            const [selectedInstrument, setSelectedInstrument] = React.useState("guitar");
            const [selectedDuration, setSelectedDuration] = React.useState("8n");
            
            // ギター詳細設定
            const [guitarType, setGuitarType] = React.useState("mokumeAcoustic"); 
            const [vibratoDepth, setVibratoDepth] = React.useState(0.2);
            const [noteLengthMode, setNoteLengthMode] = React.useState("normal"); 
            const [tapHitMode, setTapHitMode] = React.useState("woodHit"); 

            // ドラム設定
            const [activeDrumPattern, setActiveDrumPattern] = React.useState(1);
            const [tambourineTempo, setTambourineTempo] = React.useState(10); 

            // 🎨 グラフティクイコライザー 7色自動カラー連動
            const [autoGraffitiActive, setAutoGraffitiActive] = React.useState(true);
            const [graffitiColorIndex, setGraffitiColorIndex] = React.useState(0);
            const GRAFFITI_7_COLORS = [
                { name: "サイバーシアン", bg: "border-cyan-500 shadow-cyan-500/50", text: "text-cyan-400", glow: "rgba(6,182,212,0.4)" },
                { name: "ネオンピンク", bg: "border-pink-500 shadow-pink-500/50", text: "text-pink-400", glow: "rgba(236,72,153,0.4)" },
                { name: "サンセットオレンジ", bg: "border-orange-500 shadow-orange-500/50", text: "text-orange-400", glow: "rgba(249,115,22,0.4)" },
                { name: "エメラルドグリーン", bg: "border-emerald-500 shadow-emerald-500/50", text: "text-emerald-400", glow: "rgba(16,185,129,0.4)" },
                { name: "バイオレットパープル", bg: "border-purple-500 shadow-purple-500/50", text: "text-purple-400", glow: "rgba(168,85,247,0.4)" },
                { name: "ゴールデンイエロー", bg: "border-amber-500 shadow-amber-500/50", text: "text-amber-400", glow: "rgba(245,158,11,0.4)" },
                { name: "ホットレッド", bg: "border-red-500 shadow-red-500/50", text: "text-red-400", glow: "rgba(239,68,68,0.4)" }
            ];

            // ✨ スクリーンセーバーマーク位置ステート
            const [screensaverPos, setScreensaverPos] = React.useState({ x: 15, y: 25 });

            // 著作権リリースアルバム管理
            const [albumReleaseStatus, setAlbumReleaseStatus] = React.useState("未リリース（商用利用フリー化スタンバイ中）");

            // 各楽器別 CRERA ストック
            const [instrumentCreraTakes, setInstrumentCreraTakes] = React.useState({
                guitar: [], piano: [], subBass: [], bass: [], drums: [], synth: [], loopTrack: [], trumpet: []
            });

            // 🎙️ Voice 録音機能用ステート
            const [isRecording, setIsRecording] = React.useState(false);
            const [voiceRecordings, setVoiceRecordings] = React.useState([]);
            const mediaRecorderRef = React.useRef(null);
            const audioChunksRef = React.useRef([]);

            // 📝 歌詞 AI 800文字文章表示用ステート（崩さない絶対つけ足し版）
            const [aiLyricsText, setAiLyricsText] = React.useState(
                "【MIC VICTORY DLAND - 800文字 AI壮大アンセム歌詞（完全版）】\n\n" +
                "（第1章：夜明けのビートとサイバーシアンの胎動）\n" +
                "静寂を切り裂くように鳴り響くサイバーシアンのパルス。荒野を渡る風のように、僕らの足音は確実に未来へと刻まれていく。誰もが迷い、立ち止まりそうになる暗闇の中で、胸の奥底に灯した小さな光が、やがて巨大な炎へと変わっていくのを感じる。低音ブーストが大地を揺らし、最高潮のグルーブが今、解き放たれる。24小節のグリッドに魂を吹き込み、無限の音色を響かせろ。\n\n" +
                "（第2章：不屈のメロディと永遠の絆）\n" +
                "崩さない絶対の誇りを胸に、僕らはギターのコードをかき鳴らす。Cmaj7の響きが優しく夜空に溶け込み、Am7の切なさが過去の痛みを包み込む。何度倒れても、何度でも立ち上がる力——それが「MIC VICTORY」の真髄。涙の数だけ音色は強くなり、笑顔の数だけリズムは加速する。君と描いた夢の続きを、このステップボードのすべてに叩き込め。音連動する7色のグラフィティが、僕らの未来を鮮やかに照らし出す。\n\n" +
                "（第3章：世界へ羽ばたくレジェンドアンセム）\n" +
                "著作権フリーの波に乗せ、世界中へ響き渡れ micvictorydanbdanb の魂。国境も言葉も越えて、すべての音楽ラバーたちの心に直撃するアンセム。ボイス録音に刻んだ生の息吹と、AIが紡ぎ出す無限のハーモニーが重なり合う時、奇跡の扉が開かれる。さあ、恐れずに前を向け。勝利の旗を掲げ、光の彼方へ突き進め！すべてのビートが君の味方だ。"
            );

            // ✨ つけ足し用：AI歌詞自動拡張プロンプト入力ステート
            const [aiPromptInput, setAiPromptInput] = React.useState("");

            const [masterBassBoost, setMasterBassBoost] = React.useState(16);
            const [masterVolume, setMasterVolume] = React.useState(1.2);
            const [reverbWet, setReverbWet] = React.useState(0.22);
            const [powerUsage, setPowerUsage] = React.useState(22);

            const INSTRUMENTS = [
                { id: "guitar", label: "🎸 木目/電子/エレキギター" },
                { id: "piano", label: "🎹 極上グランドピアノ" },
                { id: "subBass", label: "🔊 C0超重低音土台" },
                { id: "bass", label: "🎸 ファットベース" },
                { id: "drums", label: "🥁 ドラム・タンバリン20種" },
                { id: "synth", label: "🎹 AIローズ系スタブ" },
                { id: "loopTrack", label: "🔁 ブラコンカッティング" },
                { id: "trumpet", label: "🎺 ブラスセクション" }
            ];

            const [instrumentSteps, setInstrumentSteps] = React.useState(() => {
                const init = {};
                INSTRUMENTS.forEach(inst => init[inst.id] = new Array(TOTAL_STEPS).fill(null));
                return init;
            });

            const [instrumentAiModes, setInstrumentAiModes] = React.useState(() => {
                const init = {};
                INSTRUMENTS.forEach(inst => init[inst.id] = "18beat");
                return init;
            });

            const [volumes, setVolumes] = React.useState({
                guitar: 4, piano: 3, subBass: 6, bass: 3, drums: 4, synth: 0, loopTrack: -2, trumpet: -1
            });

            const synthsRef = React.useRef(null);
            const loopRef = React.useRef(null);

            const GUITAR_CHORDS = [
                { name: "Cmaj7", notes: ["C2", "E2", "G2", "B2"], desc: "極上Cmaj7" },
                { name: "Am7", notes: ["A2", "C3", "E3", "G3"], desc: "Am7" },
                { name: "Fmaj7", notes: ["F2", "A2", "C3", "E3"], desc: "Fmaj7" },
                { name: "G7", notes: ["G2", "B2", "D3", "F3"], desc: "G7" },
                { name: "Dm7", notes: ["D2", "F2", "A2", "C3"], desc: "Dm7" },
                { name: "Em7", notes: ["E2", "G2", "B2", "D3"], desc: "Em7" }
            ];

            const autoPurgeAndOptimizeMemory = () => {
                try {
                    if (Tone.context) {
                        if (Tone.context.state === 'suspended') Tone.context.resume();
                        if (typeof Tone.context.disposeSurplusNodes === 'function') Tone.context.disposeSurplusNodes();
                    }
                    Tone.Transport.cancel(Tone.now() + 10);
                } catch(e) {}
            };

            const manualPurgeAndClear = () => {
                autoPurgeAndOptimizeMemory();
                const empty = {};
                INSTRUMENTS.forEach(inst => empty[inst.id] = new Array(TOTAL_STEPS).fill(null));
                setInstrumentSteps(empty);
                setStatus("🧹 メモリ最適化＆全ステップリセット完了（完全死守）！");
            };

            // オーディオ初期化
            React.useEffect(() => {
                const masterGain = new Tone.Gain(masterVolume).toDestination();
                const eq = new Tone.EQ3({ low: masterBassBoost, lowFrequency: 130, mid: 3.2, high: 2.8 }).connect(masterGain);
                const reverb = new Tone.Reverb({ decay: 2.2, wet: reverbWet }).connect(eq);
                const vibrato = new Tone.Vibrato({ frequency: 5.0, depth: vibratoDepth }).connect(reverb);

                const cGains = {};
                INSTRUMENTS.forEach(inst => {
                    cGains[inst.id] = new Tone.Gain(Tone.dbToGain(volumes[inst.id] || 0)).connect(vibrato);
                });

                synthsRef.current = {
                    guitar: new Tone.Synth({
                        oscillator: { type: guitarType === "mokumeAcoustic" ? "triangle" : (guitarType === "electric" ? "sawtooth" : "sine") },
                        envelope: { attack: noteLengthMode === "short" ? 0.001 : 0.003, decay: noteLengthMode === "short" ? 0.15 : 0.4, sustain: 0.3, release: 0.2 }
                    }).connect(cGains.guitar),
                    piano: new Tone.Synth({ oscillator: { type: "triangle" }, envelope: { attack: 0.005, decay: 0.6, sustain: 0.45, release: 0.4 } }).connect(cGains.piano),
                    subBass: new Tone.MonoSynth({ oscillator: { type: "sine" }, envelope: { attack: 0.002, decay: 0.5, sustain: 0.65, release: 0.2 } }).connect(cGains.subBass),
                    bass: new Tone.MonoSynth({ oscillator: { type: "triangle" }, envelope: { attack: 0.003, decay: 0.3, sustain: 0.4, release: 0.12 } }).connect(cGains.bass),
                    synth: new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.006, decay: 0.3, sustain: 0.4, release: 0.2 } }).connect(cGains.synth),
                    loopTrack: new Tone.Synth({ oscillator: { type: "triangle" }, envelope: { attack: 0.003, decay: 0.15, sustain: 0.2, release: 0.1 } }).connect(cGains.loopTrack),
                    trumpet: new Tone.Synth({ oscillator: { type: "sawtooth" }, envelope: { attack: 0.02, decay: 0.25, sustain: 0.6, release: 0.15 } }).connect(cGains.trumpet),
                    drums: {
                        kick: new Tone.MembraneSynth({ pitchDecay: 0.05, octaves: 6, oscillator: { type: "sine" }, envelope: { attack: 0.0001, decay: 0.32, sustain: 0.01, release: 0.12 } }).connect(cGains.drums),
                        snare: new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.0001, decay: 0.18, sustain: 0 } }).connect(cGains.drums),
                        hihat: new Tone.MetalSynth({ frequency: 950, envelope: { attack: 0.0005, decay: 0.02, release: 0.01 }, harmonicity: 5.1, modulationIndex: 32, resonance: 7200, octaves: 1.4 }).connect(cGains.drums),
                        tambourine: new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.001, decay: 0.08, sustain: 0 } }).connect(cGains.drums),
                        woodHit: new Tone.MembraneSynth({ pitchDecay: 0.01, octaves: 2, oscillator: { type: "sine" }, envelope: { attack: 0.0001, decay: 0.05, sustain: 0 } }).connect(cGains.drums)
                    },
                    reverb, vibrato
                };

                return () => { Tone.Transport.stop(); Tone.Transport.cancel(); };
            }, [guitarType, vibratoDepth, noteLengthMode, masterBassBoost, masterVolume, reverbWet]);

            // ✨ スクリーンセーバーマークの漂いアニメーション
            React.useEffect(() => {
                const interval = setInterval(() => {
                    setScreensaverPos({
                        x: Math.floor(5 + Math.random() * 75),
                        y: Math.floor(10 + Math.random() * 70)
                    });
                }, 6000);
                return () => clearInterval(interval);
            }, []);

            // 再生ループ ＆ 音に応じた7色自動チェンジ
            React.useEffect(() => {
                Tone.Transport.bpm.value = bpm;
                Tone.Transport.cancel();

                if (playing) {
                    let stepCounter = 0;
                    loopRef.current = new Tone.Loop(time => {
                        let step = stepCounter % TOTAL_STEPS;
                        const bar = Math.floor(step / BAR_STEPS);
                        const sInBar = step % BAR_STEPS;

                        setCurrentStep(sInBar);
                        setCurrentBar(bar);

                        if (sInBar === 0) {
                            setPowerUsage(Math.floor(20 + Math.random() * 6));
                        }

                        if (autoGraffitiActive) {
                            if (sInBar % 2 === 0) {
                                setGraffitiColorIndex(prev => (prev + 1) % GRAFFITI_7_COLORS.length);
                            }
                        }

                        const syns = synthsRef.current;
                        if (!syns) return;

                        if (sInBar % Math.max(1, Math.floor(16 / (tambourineTempo || 10))) === 0) {
                            syns.drums.tambourine.triggerAttackRelease("32n", time, 0.4);
                        }

                        Object.keys(instrumentSteps).forEach(instKey => {
                            const item = instrumentSteps[instKey][step];
                            if (!item) return;

                            const note = typeof item === "object" ? item.note : item;
                            let dur = typeof item === "object" ? (item.dur || "8n") : "8n";
                            if (noteLengthMode === "short") dur = "16n";
                            if (noteLengthMode === "long") dur = "4n";

                            if (instKey === "drums") {
                                if (typeof item === "object") {
                                    if (item.kick) {
                                        syns.drums.kick.triggerAttackRelease("C1", "8n", time);
                                        if (autoGraffitiActive) setGraffitiColorIndex(Math.floor(Math.random() * GRAFFITI_7_COLORS.length));
                                    }
                                    if (item.snare) syns.drums.snare.triggerAttackRelease("8n", time);
                                    if (item.hihat) syns.drums.hihat.triggerAttackRelease("32n", time, 0.9);
                                    if (item.woodHit) syns.drums.woodHit.triggerAttackRelease("G2", "16n", time);
                                }
                            } else if (syns[instKey]) {
                                if (Array.isArray(note)) {
                                    note.forEach((n, idx) => {
                                        syns[instKey].triggerAttackRelease(n, dur, time + idx * 0.025);
                                    });
                                } else {
                                    syns[instKey].triggerAttackRelease(note || "C4", dur, time);
                                }
                            }
                        });

                        stepCounter++;
                    }, "16n").start(0);

                    Tone.Transport.start();
                } else {
                    Tone.Transport.stop();
                }
            }, [playing, bpm, instrumentSteps, noteLengthMode, tambourineTempo, autoGraffitiActive]);

            // 🎙️ ボイス録音開始・停止処理
            const startVoiceRecording = async () => {
                audioChunksRef.current = [];
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const mediaRecorder = new MediaRecorder(stream);
                    mediaRecorderRef.current = mediaRecorder;

                    mediaRecorder.ondataavailable = (event) => {
                        if (event.data.size > 0) {
                            audioChunksRef.current.push(event.data);
                        }
                    };

                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                        const audioUrl = URL.createObjectURL(audioBlob);
                        const newRecording = {
                            id: Date.now(),
                            title: `Voice_Take_${voiceRecordings.length + 1}`,
                            url: audioUrl,
                            date: new Date().toLocaleString()
                        };
                        setVoiceRecordings(prev => [newRecording, ...prev]);
                        setStatus("🎙️ ボイス録音の保存が完了しました！");
                    };

                    mediaRecorder.start();
                    setIsRecording(true);
                    setStatus("🎙 歌詞AIパネル内：マイク録音中...");
                } catch (err) {
                    alert("マイクへのアクセスが拒否されたか、デバイスが見つかりません。");
                }
            };

            const stopVoiceRecording = () => {
                if (mediaRecorderRef.current && isRecording) {
                    mediaRecorderRef.current.stop();
                    setIsRecording(false);
                }
            };

            // ✨ つけ足し機能：AI歌詞に新しい章を自動追加・結合する関数
            const appendAiLyricsSection = () => {
                if (!aiPromptInput.trim()) {
                    alert("追加したいテーマや歌詞のキーワードを入力してください。");
                    return;
                }
                const newSection = `\n\n（追加章：${aiPromptInput} のビート）\n` +
                    `無限に広がるサウンドスケープの中、${aiPromptInput}の情熱がリズムとシンクロする。` +
                    `崩さない絶対の意志が、さらなる高みへと僕らを導く。micvictorydanbdanb の旗印のもと、新たな伝説が今ここに刻まれる！`;
                
                setAiLyricsText(prev => prev + newSection);
                setAiPromptInput("");
                setStatus(`📝 「${aiPromptInput}」の章をAI歌詞へ綺麗につけ足しました！`);
            };

            const currentGraffiti = GRAFFITI_7_COLORS[graffitiColorIndex];

            return (
                <div className={`min-h-screen bg-slate-950 text-slate-100 flex flex-col text-xs font-sans select-none pb-28 border-4 transition-colors duration-700 relative overflow-hidden ${currentGraffiti.bg}`}>
                    
                    {/* ✨ micvictory スクリーンセーバーマーク（浮遊式ネオンロゴ） */}
                    <div 
                        className="absolute pointer-events-none z-10 transition-all duration-1000 ease-in-out opacity-25 flex flex-col items-center"
                        style={{ left: `${screensaverPos.x}%`, top: `${screensaverPos.y}%` }}
                    >
                        <div className={`text-2xl sm:text-4xl font-black tracking-widest bg-gradient-to-r from-amber-400 via-pink-400 to-cyan-400 bg-clip-text text-transparent drop-shadow-[0_0_15px_rgba(255,255,255,0.6)] animate-pulse`}>
                            MIC VICTORY
                        </div>
                        <div className="text-[10px] text-cyan-300 font-mono tracking-tighter bg-slate-950/80 px-2 py-0.5 rounded border border-cyan-500/30">
                            ✨ screensaver: micvictorydanbdanb
                        </div>
                    </div>

                    {/* ヘッダー */}
                    <header className="bg-slate-900 border-b border-slate-800 px-3 py-2 flex items-center justify-between gap-2 sticky top-0 z-40 shadow-lg">
                        <div className="flex flex-col">
                            <span className="font-black text-xs bg-gradient-to-r from-amber-400 via-pink-400 to-cyan-400 bg-clip-text text-transparent">
                                MIC VICTORY DLAND <span className="text-[9px] text-pink-400">v69.7 歌詞AI＆Voice録音統合版</span>
                            </span>
                            <span className="text-[8px] text-slate-400">宣伝タグ: <strong className="text-cyan-400">micvictorydanbdanb</strong></span>
                        </div>
                        <div className="flex items-center gap-1.5 flex-wrap">
                            <span className="text-[9px] text-amber-400 bg-slate-950 px-1.5 py-0.5 rounded border border-slate-800">⚡{powerUsage}W</span>
                            <button onClick={manualPurgeAndClear} className="px-2 py-1 bg-red-900 border border-red-700 text-red-200 font-bold rounded text-[9px]">🧹 Clear</button>
                            <button onClick={() => setPlaying(!playing)} className={`px-3 py-1 rounded font-bold text-xs shadow ${playing ? "bg-amber-400 text-slate-950 animate-bounce" : "bg-pink-600 text-white"}`}>
                                {playing ? "■ 停止" : "▶ 再生"}
                            </button>
                            <div className="flex items-center gap-1 bg-slate-950 px-1.5 py-0.5 rounded border border-slate-800">
                                <span className="text-[9px] text-slate-400">BPM</span>
                                <input type="number" value={bpm} onChange={e => setBpm(Math.max(60, Math.min(220, Number(e.target.value))))} className="w-10 bg-slate-900 text-center font-bold text-pink-400 rounded text-xs py-0.5" />
                            </div>
                        </div>
                    </header>

                    {/* ナビゲーションメニュー */}
                    <nav className="bg-slate-950 border-b border-slate-800 px-2 py-1.5 flex gap-1 overflow-x-auto z-20">
                        {[
                            { id: "HUB", label: "🌟 ホーム" },
                            { id: "GRAFFITI_EQ", label: "🎨 7色自動EQ" },
                            { id: "AI_LYRICS", label: "📝 歌詞AI & Voice録音" },
                            { id: "ALBUM_RELEASE", label: "💿 著作権リリース" },
                            { id: "INST_CRERA", label: "📁 各楽器別CRERA" },
                            { id: "GUITAR_PANEL", label: "🎸 ギター" },
                            { id: "INST_AI", label: "🤖 楽器別AI" },
                            { id: "DRUMS20", label: "🥁 ドラム20種" },
                            { id: "GRID", label: "🎛️ グリッド" },
                            { id: "MIXER", label: "🎚️ ミキサー" },
                        ].map(t => (
                            <button key={t.id} onClick={() => setTab(t.id)} className={`px-2.5 py-1 rounded text-center font-bold transition-all shrink-0 ${tab === t.id ? "bg-amber-500 text-slate-950 shadow" : "bg-slate-900 text-slate-400"}`}>
                                {t.label}
                            </button>
                        ))}
                    </nav>

                    <div className="bg-slate-900/50 px-3 py-1 text-[10px] text-cyan-400 border-b border-slate-900 truncate z-20">
                        💡 {status} (Bar: {currentBar + 1} / Step: {currentStep + 1}) | micvictorydanbdanb
                    </div>

                    <main className="p-2 flex flex-col gap-3 z-20">
                        
                        {tab === "HUB" && (
                            <div className="flex flex-col gap-3">
                                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                                    <button onClick={() => setTab("AI_LYRICS")} className="p-3 bg-gradient-to-r from-purple-950 to-pink-950 border border-purple-500 rounded-lg text-left shadow flex flex-col gap-1 col-span-2">
                                        <span className="font-bold text-purple-300 text-xs">📝 歌詞AI & Voice録音マネージャー</span>
                                        <span className="text-[9px] text-slate-300">800文字アンセム歌詞作成＆ボイス同時録音・再生</span>
                                    </button>
                                    <button onClick={() => setTab("GRAFFITI_EQ")} className="p-3 bg-gradient-to-r from-cyan-950 to-blue-950 border border-cyan-500 rounded-lg text-left shadow flex flex-col gap-1">
                                        <span className="font-bold text-cyan-300 text-xs">🎨 7色自動グラフティEQ</span>
                                        <span className="text-[9px] text-slate-300">音に応じて7色かわる自動シフト</span>
                                    </button>
                                    <button onClick={() => setTab("GRID")} className="p-3 bg-gradient-to-r from-amber-950 to-orange-950 border border-amber-500 rounded-lg text-left shadow flex flex-col gap-1">
                                        <span className="font-bold text-amber-300 text-xs">🎛️ 崩さない絶対グリッド</span>
                                        <span className="text-[9px] text-slate-300">24小節の安定編集空間</span>
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* 🎨 グラフティEQ 7色自動カラーチェンジパネル */}
                        {tab === "GRAFFITI_EQ" && (
                            <div className="bg-slate-900 border border-cyan-500/50 rounded-lg p-3 flex flex-col gap-3 shadow">
                                <div className="flex justify-between items-center flex-wrap gap-2">
                                    <span className="text-xs font-bold text-cyan-400">🎨 グラフティクイコライザー（音に応じて7色かわる自動モード）</span>
                                    <button 
                                        onClick={() => setAutoGraffitiActive(!autoGraffitiActive)}
                                        className={`px-3 py-1 font-bold rounded text-xs shadow ${autoGraffitiActive ? "bg-cyan-500 text-slate-950 animate-pulse" : "bg-slate-800 text-slate-400"}`}
                                    >
                                        {autoGraffitiActive ? "⚡ 7色自動チェンジ：ON" : "⏸ 7色自動チェンジ：OFF"}
                                    </button>
                                </div>
                                <div className="bg-slate-950 p-3 rounded border border-slate-800 flex flex-col gap-2">
                                    <span className="text-[10px] text-slate-300">現在の自動連動テーマカラー: <strong className={currentGraffiti.text}>{currentGraffiti.name}</strong></span>
                                    <div className="grid grid-cols-2 sm:grid-cols-7 gap-2">
                                        {GRAFFITI_7_COLORS.map((col, idx) => (
                                            <button
                                                key={col.name}
                                                onClick={() => {
                                                    setGraffitiColorIndex(idx);
                                                    setAutoGraffitiActive(false);
                                                    setStatus(`🎨 グラフティEQテーマを手動で [${col.name}] に固定しました！`);
                                                }}
                                                className={`p-2.5 rounded border font-bold text-[10px] flex flex-col items-center justify-center gap-1 transition-all shadow ${graffitiColorIndex === idx ? "bg-slate-800 text-white " + col.bg : "bg-slate-900 text-slate-400 border-slate-800"}`}
                                            >
                                                <span className="w-4 h-4 rounded-full bg-cyan-400 animate-ping"></span>
                                                <span>{col.name}</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 📝 歌詞 AI 800文字文章表示 ＆ 崩さない絶対つけ足し ＆ 🎙️ Voice 録音統合パネル */}
                        {tab === "AI_LYRICS" && (
                            <div className="bg-slate-900 border border-purple-500/50 rounded-lg p-3 flex flex-col gap-3 shadow">
                                <div className="flex justify-between items-center flex-wrap gap-2">
                                    <span className="text-xs font-bold text-purple-400">📝 歌詞 AI (800文字) ＆ 🎙️ Voice録音・再生マネージャー</span>
                                    <button onClick={() => {
                                        navigator.clipboard.writeText(aiLyricsText);
                                        setStatus("📋 歌詞AIテキストをクリップボードにコピーしました！");
                                    }} className="px-3 py-1 bg-purple-600 hover:bg-purple-500 text-white font-bold rounded text-[10px]">
                                        📋 歌詞をコピー
                                    </button>
                                </div>

                                {/* 🎙️ Voice 録音エリア（歌詞AI内へ統合） */}
                                <div className="bg-slate-950 p-3 rounded border border-red-500/40 flex flex-col gap-2 shadow-inner">
                                    <div className="flex justify-between items-center flex-wrap gap-2">
                                        <span className="text-[10px] font-bold text-red-300">🎙️ ボイス録音（ボーカル・鼻歌・ラップの記録）</span>
                                        <div className="flex gap-2">
                                            {!isRecording ? (
                                                <button onClick={startVoiceRecording} className="px-3 py-1 bg-red-600 hover:bg-red-500 text-white font-bold rounded text-[10px] shadow animate-pulse">
                                                    🔴 録音開始 (Rec)
                                                </button>
                                            ) : (
                                                <button onClick={stopVoiceRecording} className="px-3 py-1 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded text-[10px] shadow">
                                                    ■ 録音停止 & 保存
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                    <div className="flex flex-col gap-1.5 max-h-[140px] overflow-y-auto">
                                        {voiceRecordings.length === 0 ? (
                                            <span className="text-[9px] text-slate-500">※まだ録音されたボイスはありません。「録音開始」を押して声を吹き込んでください。</span>
                                        ) : voiceRecordings.map(rec => (
                                            <div key={rec.id} className="flex justify-between items-center bg-slate-900 p-2 rounded border border-slate-800 gap-2 flex-wrap">
                                                <span className="text-red-300 text-[10px] font-bold">{rec.title} <span className="text-[7px] text-slate-400">({rec.date})</span></span>
                                                <audio controls src={rec.url} className="h-7 w-40 sm:w-56"></audio>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* ✨ つけ足し入力コントロール */}
                                <div className="bg-slate-950 p-2.5 rounded border border-purple-500/30 flex flex-col gap-2">
                                    <span className="text-[10px] text-purple-300 font-bold">✨ AI歌詞の「崩さない絶対つけ足し」ジェネレーター</span>
                                    <div className="flex gap-2">
                                        <input
                                            type="text"
                                            placeholder="追加したいテーマやキーワード（例: 夜空の流星、未来の鼓動）を入力..."
                                            value={aiPromptInput}
                                            onChange={e => setAiPromptInput(e.target.value)}
                                            className="flex-1 bg-slate-900 text-slate-200 text-xs px-3 py-1.5 rounded border border-slate-800 focus:outline-none focus:border-purple-500"
                                        />
                                        <button
                                            onClick={appendAiLyricsSection}
                                            className="px-4 py-1.5 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-bold rounded text-xs shadow shrink-0"
                                        >
                                            + つけ足す
                                        </button>
                                    </div>
                                </div>

                                <div className="bg-slate-950 p-3 rounded border border-slate-800 flex flex-col gap-2">
                                    <textarea
                                        value={aiLyricsText}
                                        onChange={e => setAiLyricsText(e.target.value)}
                                        rows="8"
                                        className="w-full bg-slate-900 text-slate-200 text-xs p-3 rounded border border-slate-800 font-mono leading-relaxed focus:outline-none focus:border-purple-500"
                                    ></textarea>
                                    <span className="text-[9px] text-slate-400 text-right">文字数: 約 {aiLyricsText.length} 文字 (800文字AIアンセム + つけ足し仕様)</span>
                                </div>
                            </div>
                        )}

                        {/* 💿 著作権リリースアルバム */}
                        {tab === "ALBUM_RELEASE" && (
                            <div className="bg-slate-900 border border-pink-500/50 rounded-lg p-3 flex flex-col gap-3 shadow">
                                <span className="text-xs font-bold text-pink-400">💿 著作権リリースアルバム販売 ＆ 宣伝ハブ</span>
                                <div className="bg-slate-950 p-4 rounded border border-slate-800 flex flex-col gap-3">
                                    <div className="flex flex-col gap-1">
                                        <span className="text-amber-400 font-bold text-sm">MIC VICTORY DLAND OFFICIAL ALBUM</span>
                                        <span className="text-[10px] text-slate-400">公式宣伝タグ: <code className="bg-slate-900 text-cyan-300 px-1.5 py-0.5 rounded border border-slate-800">micvictorydanbdanb</code></span>
                                    </div>
                                    <div className="p-2 bg-slate-900 rounded border border-slate-800 text-[10px] text-slate-300">
                                        ステータス: <span className="text-pink-400 font-bold">{albumReleaseStatus}</span>
                                    </div>
                                    <div className="flex gap-2 flex-wrap">
                                        <button onClick={executeAlbumRelease} className="px-4 py-2 bg-gradient-to-r from-pink-600 to-purple-600 text-white font-bold rounded shadow">
                                            🚀 著作権リリースアルバムを一般公開・販売する
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 📁 各楽器別 CRERA */}
                        {tab === "INST_CRERA" && (
                            <div className="bg-slate-900 border border-purple-500/50 rounded-lg p-3 flex flex-col gap-3 shadow">
                                <span className="text-xs font-bold text-purple-400">📁 各楽器別 CRERA（クレラ）ストレージ管理</span>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-[320px] overflow-y-auto">
                                    {INSTRUMENTS.map(inst => {
                                        const takes = instrumentCreraTakes[inst.id] || [];
                                        return (
                                            <div key={inst.id} className="bg-slate-950 p-2.5 rounded border border-slate-800 flex flex-col gap-2">
                                                <div className="flex justify-between items-center border-b border-slate-900 pb-1">
                                                    <span className="text-[10px] font-bold text-slate-200">{inst.label}</span>
                                                    <button onClick={() => saveInstrumentCrera(inst.id)} className="px-2 py-0.5 bg-purple-600 hover:bg-purple-500 text-white font-bold rounded text-[9px]">
                                                        + この楽器をCRERAセーブ
                                                    </button>
                                                </div>
                                                <div className="flex flex-col gap-1 max-h-24 overflow-y-auto">
                                                    {takes.length === 0 ? (
                                                        <span className="text-[9px] text-slate-500">保存テイクなし</span>
                                                    ) : takes.map(t => (
                                                        <div key={t.id} className="flex justify-between items-center bg-slate-900 p-1.5 rounded border border-slate-800">
                                                            <div className="flex flex-col">
                                                                <span className="text-amber-400 text-[9px] font-bold">{t.title}</span>
                                                                <span className="text-[7px] text-slate-400">{t.date}</span>
                                                            </div>
                                                            <button onClick={() => loadInstrumentCrera(inst.id, t)} className="px-2 py-0.5 bg-amber-500 text-slate-950 font-bold rounded text-[8px]">
                                                                復元
                                                            </button>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {tab === "GUITAR_PANEL" && (
                            <div className="bg-slate-900 border border-amber-600/50 rounded-lg p-3 flex flex-col gap-3 shadow">
                                <div className="flex justify-between items-center flex-wrap gap-2">
                                    <span className="text-xs font-bold text-amber-400">🎸 ギター設定 ＆ 極上コード</span>
                                    <div className="flex gap-1 flex-wrap">
                                        {["mokumeAcoustic", "electric", "electricClean"].map(type => (
                                            <button key={type} onClick={() => setGuitarType(type)} className={`px-2 py-0.5 rounded text-[10px] font-bold ${guitarType === type ? "bg-amber-500 text-slate-950" : "bg-slate-950 text-slate-400 border border-slate-800"}`}>
                                                {type === "mokumeAcoustic" ? "木目アコギ" : (type === "electric" ? "エレキ歪み" : "電子クリーン")}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                <div className="grid grid-cols-2 sm:grid-cols-6 gap-2">
                                    {GUITAR_CHORDS.map(chord => (
                                        <button
                                            key={chord.name}
                                            onClick={() => playNote(chord.notes)}
                                            className="p-2.5 bg-slate-950 hover:bg-amber-950 border border-slate-700 hover:border-amber-400 rounded flex flex-col items-center justify-center gap-0.5 active:scale-95 shadow"
                                        >
                                            <span className="text-amber-300 font-black text-xs">{chord.name}</span>
                                            <span className="text-[8px] text-slate-400">{chord.desc}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        {tab === "INST_AI" && (
                            <div className="bg-slate-900 border border-purple-600/50 rounded-lg p-3 flex flex-col gap-3 shadow">
                                <span className="text-xs font-bold text-purple-400">🤖 各楽器別AIパターン切り替え ＆ 自動生成</span>
                                <div className="flex flex-col gap-2">
                                    {INSTRUMENTS.map(inst => (
                                        <div key={inst.id} className="flex items-center justify-between bg-slate-950 p-2.5 rounded border border-slate-800 gap-2 flex-wrap">
                                            <span className="text-[10px] font-bold text-slate-200 w-36">{inst.label}</span>
                                            <div className="flex gap-1">
                                                {["18beat", "arpeggio", "cutting", "random"].map(mode => (
                                                    <button
                                                        key={mode}
                                                        onClick={() => {
                                                            setInstrumentAiModes({ ...instrumentAiModes, [inst.id]: mode });
                                                            setSelectedInstrument(inst.id);
                                                            generateAiForInstrument(inst.id, mode);
                                                        }}
                                                        className={`px-2 py-1 rounded text-[9px] font-bold ${instrumentAiModes[inst.id] === mode ? "bg-purple-600 text-white" : "bg-slate-900 text-slate-400"}`}
                                                    >
                                                        {mode}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {tab === "DRUMS20" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3 shadow">
                                <div className="flex justify-between items-center">
                                    <span className="text-xs font-bold text-red-400">🥁 ドラム 20パターン ＆ 木目打音</span>
                                    <div className="flex gap-1">
                                        <button onClick={() => setTapHitMode("woodHit")} className={`px-2 py-0.5 rounded text-[9px] font-bold ${tapHitMode === "woodHit" ? "bg-red-600 text-white" : "bg-slate-950 text-slate-400"}`}>木目打音</button>
                                        <button onClick={() => setTapHitMode("kick")} className={`px-2 py-0.5 rounded text-[9px] font-bold ${tapHitMode === "kick" ? "bg-red-600 text-white" : "bg-slate-950 text-slate-400"}`}>キック</button>
                                    </div>
                                </div>
                                <div className="grid grid-cols-4 sm:grid-cols-10 gap-1.5">
                                    {Array.from({ length: 20 }).map((_, idx) => {
                                        const pNum = idx + 1;
                                        return (
                                            <button key={pNum} onClick={() => applyDrumPattern20(pNum)} className={`py-2 rounded text-[10px] font-bold border transition-all ${activeDrumPattern === pNum ? "bg-red-600 text-white border-white" : "bg-slate-950 text-red-300 border-red-900/50"}`}>
                                                # {pNum}
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {tab === "GRID" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3 shadow">
                                <div className="flex justify-between items-center flex-wrap gap-2">
                                    <span className="text-xs font-bold text-cyan-400">🎛️ 手動グリッド表示 (対象楽器: {selectedInstrument})</span>
                                    <select value={selectedInstrument} onChange={e => setSelectedInstrument(e.target.value)} className="bg-slate-950 text-cyan-300 font-bold text-[10px] p-1 rounded border border-slate-800">
                                        {INSTRUMENTS.map(i => <option key={i.id} value={i.id}>{i.label}</option>)}
                                    </select>
                                </div>
                                <div className="flex gap-2 overflow-x-auto pb-2 pt-1">
                                    {Array.from({ length: BARS }).map((_, barIdx) => (
                                        <div key={barIdx} className="bg-slate-950 p-2 rounded border border-slate-800 shrink-0 w-32 flex flex-col gap-1">
                                            <div className="text-[9px] font-bold text-cyan-400 text-center border-b border-slate-900 pb-0.5">Bar {barIdx + 1}</div>
                                            <div className="grid grid-cols-4 gap-1">
                                                {Array.from({ length: BAR_STEPS }).map((_, stepIdx) => {
                                                    const absoluteStep = barIdx * BAR_STEPS + stepIdx;
                                                    const stepData = instrumentSteps[selectedInstrument][absoluteStep];
                                                    const isCurrent = currentBar === barIdx && currentStep === stepIdx && playing;

                                                    return (
                                                        <button
                                                            key={stepIdx}
                                                            onClick={() => {
                                                                const arr = [...instrumentSteps[selectedInstrument]];
                                                                arr[absoluteStep] = arr[absoluteStep] ? null : { note: "C2", dur: "8n" };
                                                                setInstrumentSteps({...instrumentSteps, [selectedInstrument]: arr});
                                                            }}
                                                            className={`h-6 rounded flex items-center justify-center text-[8px] font-bold border ${isCurrent ? "ring-2 ring-pink-400" : ""} ${stepData ? "bg-cyan-500 text-slate-950 border-white" : "bg-slate-900 text-slate-600 border-slate-800"}`}
                                                        >
                                                            {stepIdx + 1}
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {tab === "MIXER" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3 shadow">
                                <span className="text-xs font-bold text-amber-400">🎚️ マスター・各楽器ボリューム＆エフェクト調整</span>
                                <div className="flex flex-col gap-3 bg-slate-950 p-3 rounded border border-slate-800">
                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-2 border-b border-slate-900 pb-2">
                                        <div className="flex flex-col gap-1">
                                            <span className="text-[9px] text-cyan-400 font-bold">マスターVol: {masterVolume.toFixed(1)}</span>
                                            <input type="range" min="0.1" max="2.0" step="0.1" value={masterVolume} onChange={e => setMasterVolume(Number(e.target.value))} className="accent-cyan-500" />
                                        </div>
                                        <div className="flex flex-col gap-1">
                                            <span className="text-[9px] text-amber-400 font-bold">低音ブースト: {masterBassBoost}dB</span>
                                            <input type="range" min="0" max="30" step="1" value={masterBassBoost} onChange={e => setMasterBassBoost(Number(e.target.value))} className="accent-amber-500" />
                                        </div>
                                        <div className="flex flex-col gap-1">
                                            <span className="text-[9px] text-pink-400 font-bold">リバーブWet: {(reverbWet * 100).toFixed(0)}%</span>
                                            <input type="range" min="0" max="0.8" step="0.05" value={reverbWet} onChange={e => setReverbWet(Number(e.target.value))} className="accent-pink-500" />
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                        {INSTRUMENTS.map(inst => (
                                            <div key={inst.id} className="flex items-center justify-between bg-slate-900 p-2 rounded border border-slate-800">
                                                <span className="text-[10px] text-slate-200">{inst.label}</span>
                                                <input type="range" min="-30" max="6" step="1" value={volumes[inst.id]} onChange={e => setVolumes({...volumes, [inst.id]: Number(e.target.value)})} className="w-24 accent-amber-500" />
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<MasterSynthApp />);
    </script>
</body>
</html>
