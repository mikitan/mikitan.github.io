<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIC VICTORY DLAND v70.0 - 18小節グリッド拡張＆8色フラッシュ・CRERA完全版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans select-none pb-32 overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        function MasterSynthApp() {
            const [tab, setTab] = React.useState("HUB");
            const [playing, setPlaying] = React.useState(false);
            const [flashColorIndex, setFlashColorIndex] = React.useState(0);
            const [bpm, setBpm] = React.useState(114);
            const [currentBar, setCurrentBar] = React.useState(0);
            const [currentStep, setCurrentStep] = React.useState(-1);
            const [status, setStatus] = React.useState("✨ v70.0 micvictorydanb公式リリース！18小節グリッド＆8色フラッシュ稼働中");

            // 基準24小節 ＋ 新たにつけ足す18小節（合計42小節対応）
            const [extraBarsCount, setExtraBarsCount] = React.useState(0); // 0なら24小節, 18なら42小節
            const BASE_BARS = 24;
            const ADDED_BARS = extraBarsCount; 
            const TOTAL_BARS = BASE_BARS + ADDED_BARS;
            const BAR_STEPS = 16;
            const TOTAL_STEPS = TOTAL_BARS * BAR_STEPS;

            const [selectedInstrument, setSelectedInstrument] = React.useState("guitar");
            const [selectedDuration, setSelectedDuration] = React.useState("8n");
            
            const [guitarType, setGuitarType] = React.useState("mokumeAcoustic"); 
            const [vibratoDepth, setVibratoDepth] = React.useState(0.2);
            const [noteLengthMode, setNoteLengthMode] = React.useState("normal"); 
            const [tapHitMode, setTapHitMode] = React.useState("woodHit"); 

            const [activeDrumPattern, setActiveDrumPattern] = React.useState(1);
            const [tambourineTempo, setTambourineTempo] = React.useState(10); 

            const [creraTakes, setCreraTakes] = React.useState([]);
            const [masterBassBoost, setMasterBassBoost] = React.useState(16);
            const [masterVolume, setMasterVolume] = React.useState(1.2);
            const [powerUsage, setPowerUsage] = React.useState(25);

            // フラッシュライト8色
            const FLASH_COLORS = [
                "border-cyan-500 shadow-cyan-500/50",
                "border-amber-500 shadow-amber-500/50",
                "border-pink-500 shadow-pink-500/50",
                "border-purple-500 shadow-purple-500/50",
                "border-emerald-500 shadow-emerald-500/50",
                "border-rose-500 shadow-rose-500/50",
                "border-yellow-500 shadow-yellow-500/50",
                "border-indigo-500 shadow-indigo-500/50"
            ];

            const INSTRUMENTS = [
                { id: "guitar", label: "🎸 木目/電子/エレキギター" },
                { id: "piano", label: "🎹 極上グランドピアノ" },
                { id: "subBass", label: "🔊 C0超重低音土台" },
                { id: "bass", label: "🎸 ファットベース" },
                { id: "drums", label: "🥁 ドラム・タンバリン20種" },
                { id: "synth", label: "🎹 AIローズ系スタブ" },
                { id: "loopTrack", label: "🔁 ブラコンカッティング" },
                { id: "trumpet", label: "🎺 ブラスセクション" }
            ];

            const [instrumentSteps, setInstrumentSteps] = React.useState(() => {
                const init = {};
                INSTRUMENTS.forEach(inst => init[inst.id] = new Array(TOTAL_STEPS).fill(null));
                return init;
            });

            const [instrumentAiModes, setInstrumentAiModes] = React.useState(() => {
                const init = {};
                INSTRUMENTS.forEach(inst => init[inst.id] = "18beat");
                return init;
            });

            const [volumes, setVolumes] = React.useState({
                guitar: 4, piano: 3, subBass: 6, bass: 3, drums: 4, synth: 0, loopTrack: -2, trumpet: -1
            });

            const synthsRef = React.useRef(null);
            const loopRef = React.useRef(null);

            const GUITAR_CHORDS = [
                { name: "Cmaj7", notes: ["C2", "E2", "G2", "B2"], desc: "極上Cmaj7" },
                { name: "Am7", notes: ["A2", "C3", "E3", "G3"], desc: "Am7" },
                { name: "Fmaj7", notes: ["F2", "A2", "C3", "E3"], desc: "Fmaj7" },
                { name: "G7", notes: ["G2", "B2", "D3", "F3"], desc: "G7" },
                { name: "Dm7", notes: ["D2", "F2", "A2", "C3"], desc: "Dm7" },
                { name: "Em7", notes: ["E2", "G2", "B2", "D3"], desc: "Em7" }
            ];

            // 18小節新しくつけ足す関数
            const addNew18Bars = () => {
                const newBarsCount = extraBarsCount + 18;
                const newTotalSteps = (BASE_BARS + newBarsCount) * BAR_STEPS;
                
                const updatedSteps = {};
                INSTRUMENTS.forEach(inst => {
                    const oldArr = instrumentSteps[inst.id] || [];
                    const expanded = new Array(newTotalSteps).fill(null);
                    for(let i=0; i<oldArr.length; i++) {
                        expanded[i] = oldArr[i];
                    }
                    updatedSteps[inst.id] = expanded;
                });

                setExtraBarsCount(newBarsCount);
                setInstrumentSteps(updatedSteps);
                setStatus(`➕ 新たに18小節をつけ足しました！（総小節数: ${BASE_BARS + newBarsCount}小節）`);
            };

            const autoPurgeAndOptimizeMemory = () => {
                try {
                    if (Tone.context) {
                        if (Tone.context.state === 'suspended') Tone.context.resume();
                        if (typeof Tone.context.disposeSurplusNodes === 'function') Tone.context.disposeSurplusNodes();
                    }
                    Tone.Transport.cancel(Tone.now() + 10);
                } catch(e) {}
            };

            const manualPurgeAndClear = () => {
                autoPurgeAndOptimizeMemory();
                const empty = {};
                INSTRUMENTS.forEach(inst => empty[inst.id] = new Array(TOTAL_STEPS).fill(null));
                setInstrumentSteps(empty);
                setStatus("🧹 キャッシュクリア＆全ステップリセット完了！");
            };

            // 音響構築
            React.useEffect(() => {
                const masterGain = new Tone.Gain(masterVolume).toDestination();
                const eq = new Tone.EQ3({ low: masterBassBoost, lowFrequency: 130, mid: 3.2, high: 2.8 }).connect(masterGain);
                const reverb = new Tone.Reverb({ decay: 2.2, wet: 0.22 }).connect(eq);
                const vibrato = new Tone.Vibrato({ frequency: 5.0, depth: vibratoDepth }).connect(reverb);

                const cGains = {};
                INSTRUMENTS.forEach(inst => {
                    cGains[inst.id] = new Tone.Gain(Tone.dbToGain(volumes[inst.id] || 0)).connect(vibrato);
                });

                synthsRef.current = {
                    guitar: new Tone.Synth({
                        oscillator: { type: guitarType === "mokumeAcoustic" ? "triangle" : (guitarType === "electric" ? "sawtooth" : "sine") },
                        envelope: { attack: noteLengthMode === "short" ? 0.001 : 0.003, decay: noteLengthMode === "short" ? 0.15 : 0.4, sustain: 0.3, release: 0.2 }
                    }).connect(cGains.guitar),
                    piano: new Tone.Synth({ oscillator: { type: "triangle" }, envelope: { attack: 0.005, decay: 0.6, sustain: 0.45, release: 0.4 } }).connect(cGains.piano),
                    subBass: new Tone.MonoSynth({ oscillator: { type: "sine" }, envelope: { attack: 0.002, decay: 0.5, sustain: 0.65, release: 0.2 } }).connect(cGains.subBass),
                    bass: new Tone.MonoSynth({ oscillator: { type: "triangle" }, envelope: { attack: 0.003, decay: 0.3, sustain: 0.4, release: 0.12 } }).connect(cGains.bass),
                    synth: new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.006, decay: 0.3, sustain: 0.4, release: 0.2 } }).connect(cGains.synth),
                    loopTrack: new Tone.Synth({ oscillator: { type: "triangle" }, envelope: { attack: 0.003, decay: 0.15, sustain: 0.2, release: 0.1 } }).connect(cGains.loopTrack),
                    trumpet: new Tone.Synth({ oscillator: { type: "sawtooth" }, envelope: { attack: 0.02, decay: 0.25, sustain: 0.6, release: 0.15 } }).connect(cGains.trumpet),
                    drums: {
                        kick: new Tone.MembraneSynth({ pitchDecay: 0.05, octaves: 6, oscillator: { type: "sine" }, envelope: { attack: 0.0001, decay: 0.32, sustain: 0.01, release: 0.12 } }).connect(cGains.drums),
                        snare: new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.0001, decay: 0.18, sustain: 0 } }).connect(cGains.drums),
                        hihat: new Tone.MetalSynth({ frequency: 950, envelope: { attack: 0.0005, decay: 0.02, release: 0.01 }, harmonicity: 5.1, modulationIndex: 32, resonance: 7200, octaves: 1.4 }).connect(cGains.drums),
                        tambourine: new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.001, decay: 0.08, sustain: 0 } }).connect(cGains.drums),
                        woodHit: new Tone.MembraneSynth({ pitchDecay: 0.01, octaves: 2, oscillator: { type: "sine" }, envelope: { attack: 0.0001, decay: 0.05, sustain: 0 } }).connect(cGains.drums)
                    },
                    reverb, vibrato
                };

                return () => { Tone.Transport.stop(); Tone.Transport.cancel(); };
            }, [guitarType, vibratoDepth, noteLengthMode, masterBassBoost]);

            // 再生ループ
            React.useEffect(() => {
                Tone.Transport.bpm.value = bpm;
                Tone.Transport.cancel();

                if (playing) {
                    let stepCounter = 0;
                    loopRef.current = new Tone.Loop(time => {
                        let step = stepCounter % TOTAL_STEPS;
                        const bar = Math.floor(step / BAR_STEPS);
                        const sInBar = step % BAR_STEPS;

                        setCurrentStep(sInBar);
                        setCurrentBar(bar);

                        if (sInBar === 0) {
                            setFlashColorIndex(prev => (prev + 1) % FLASH_COLORS.length);
                            setPowerUsage(Math.floor(22 + Math.random() * 8));
                        }

                        const syns = synthsRef.current;
                        if (!syns) return;

                        if (sInBar % Math.max(1, Math.floor(16 / (tambourineTempo || 10))) === 0) {
                            syns.drums.tambourine.triggerAttackRelease("32n", time, 0.4);
                        }

                        Object.keys(instrumentSteps).forEach(instKey => {
                            const stepsArr = instrumentSteps[instKey];
                            if (!stepsArr || !stepsArr[step]) return;
                            const item = stepsArr[step];

                            const note = typeof item === "object" ? item.note : item;
                            let dur = typeof item === "object" ? (item.dur || "8n") : "8n";
                            if (noteLengthMode === "short") dur = "16n";
                            if (noteLengthMode === "long") dur = "4n";

                            if (instKey === "drums") {
                                if (typeof item === "object") {
                                    if (item.kick) syns.drums.kick.triggerAttackRelease("C1", "8n", time);
                                    if (item.snare) syns.drums.snare.triggerAttackRelease("8n", time);
                                    if (item.hihat) syns.drums.hihat.triggerAttackRelease("32n", time, 0.9);
                                    if (item.woodHit) syns.drums.woodHit.triggerAttackRelease("G2", "16n", time);
                                }
                            } else if (syns[instKey]) {
                                if (Array.isArray(note)) {
                                    note.forEach((n, idx) => {
                                        syns[instKey].triggerAttackRelease(n, dur, time + idx * 0.025);
                                    });
                                } else {
                                    syns[instKey].triggerAttackRelease(note || "C4", dur, time);
                                }
                            }
                        });

                        stepCounter++;
                    }, "16n").start(0);

                    Tone.Transport.start();
                } else {
                    Tone.Transport.stop();
                }
            }, [playing, bpm, instrumentSteps, noteLengthMode, tambourineTempo, TOTAL_STEPS]);

            const playNote = async (noteOrNotes) => {
                await Tone.start();
                const syns = synthsRef.current;
                if (!syns) return;

                const notesToPlay = Array.isArray(noteOrNotes) ? noteOrNotes : [noteOrNotes];

                if (selectedInstrument === "drums") {
                    if (tapHitMode === "woodHit") syns.drums.woodHit.triggerAttackRelease("G2", "16n");
                    else syns.drums.kick.triggerAttackRelease("C1", "8n");
                } else if (syns[selectedInstrument]) {
                    notesToPlay.forEach((n, idx) => {
                        syns[selectedInstrument].triggerAttackRelease(n, selectedDuration, Tone.now() + idx * 0.03);
                    });
                }

                const targetStep = (currentBar * BAR_STEPS) + (currentStep >= 0 ? currentStep : 0);
                if (targetStep < TOTAL_STEPS) {
                    setInstrumentSteps(prev => {
                        const arr = [...(prev[selectedInstrument] || new Array(TOTAL_STEPS).fill(null))];
                        if (selectedInstrument === "drums") {
                            const cur = arr[targetStep] || { kick: false, snare: false, hihat: false, woodHit: false };
                            arr[targetStep] = { ...cur, [tapHitMode]: true };
                        } else {
                            arr[targetStep] = { note: notesToPlay.length === 1 ? notesToPlay[0] : notesToPlay, dur: selectedDuration };
                        }
                        return { ...prev, [selectedInstrument]: arr };
                    });
                }
            };

            const generateAiForInstrument = (instId, mode) => {
                const newSteps = JSON.parse(JSON.stringify(instrumentSteps));
                const pool = ["C2", "E2", "G2", "B2", "A2", "C3", "E3", "G3"];
                const arr = new Array(TOTAL_STEPS).fill(null);

                for (let i = 0; i < TOTAL_STEPS; i++) {
                    const s = i % 16;
                    if (mode === "18beat") {
                        if (s === 0 || s === 3 || s === 7 || s === 10 || s === 14) {
                            arr[i] = { note: pool[Math.floor(Math.random() * pool.length)], dur: "8n" };
                        }
                    } else if (mode === "arpeggio") {
                        if (s % 2 === 0) arr[i] = { note: pool[i % pool.length], dur: "16n" };
                    } else if (mode === "cutting") {
                        if (s === 2 || s === 6 || s === 10 || s === 14) arr[i] = { note: ["C2", "G2"], dur: "16n" };
                    } else {
                        if (Math.random() < 0.35) arr[i] = { note: pool[Math.floor(Math.random() * pool.length)], dur: "8n" };
                    }
                }

                newSteps[instId] = arr;
                setInstrumentSteps(newSteps);
                setStatus(`✨ [${instId}] AIパターン (${mode}) 生成完了！`);
            };

            const applyDrumPattern20 = (pNum) => {
                setActiveDrumPattern(pNum);
                const newArr = new Array(TOTAL_STEPS).fill(null);
                for (let i = 0; i < TOTAL_STEPS; i++) {
                    const s = i % 16;
                    let isK = (s === 0 || s === 8 || (pNum > 10 && s === 10));
                    let isS = (s === 4 || s === 12);
                    let isH = (i % (pNum % 3 === 0 ? 2 : 4) === 0);
                    newArr[i] = { kick: isK, snare: isS, hihat: isH, woodHit: (pNum > 15 && s === 14) };
                }
                setInstrumentSteps(prev => ({ ...prev, drums: newArr }));
                setStatus(`🥁 ドラム・木目打音 #${pNum} 適用完了！`);
            };

            const saveCreraTake = () => {
                const newTake = {
                    id: Date.now(),
                    title: `micvictorydanb_Take_${creraTakes.length + 1}`,
                    bpm,
                    totalBars: TOTAL_BARS,
                    stepsSnapshot: JSON.parse(JSON.stringify(instrumentSteps)),
                    date: new Date().toLocaleString()
                };
                setCreraTakes(prev => [newTake, ...prev]);
                setStatus(`💾 CRERAテイク [${newTake.title}] 記録完了！(全${TOTAL_BARS}小節)`);
            };

            const loadCreraTake = (take) => {
                if(take.totalBars) {
                    const diffBars = take.totalBars - BASE_BARS;
                    if(diffBars >= 0) setExtraBarsCount(diffBars);
                }
                setInstrumentSteps(JSON.parse(JSON.stringify(take.stepsSnapshot)));
                setBpm(take.bpm);
                setStatus(`▶ CRERAテイク [${take.title}] 再生・復元ロード完了！`);
            };

            return (
                <div className={`min-h-screen bg-slate-950 text-slate-100 flex flex-col text-xs font-sans select-none pb-32 border-4 transition-colors duration-500 ${FLASH_COLORS[flashColorIndex]}`}>
                    
                    {/* ヘッダー */}
                    <header className="bg-slate-900 border-b border-slate-800 px-3 py-2 flex items-center justify-between gap-2 sticky top-0 z-40 shadow-lg">
                        <div className="flex flex-col">
                            <span className="font-black text-xs bg-gradient-to-r from-amber-400 via-pink-400 to-cyan-400 bg-clip-text text-transparent">
                                MIC VICTORY DLAND <span className="text-[9px] text-pink-400">v70.0 (micvictorydanb)</span>
                            </span>
                            <span className="text-[8px] text-slate-400">© 2026 micvictorydanb All Rights Reserved.</span>
                        </div>
                        <div className="flex items-center gap-1.5 flex-wrap">
                            <span className="text-[9px] text-amber-400 bg-slate-950 px-1.5 py-0.5 rounded border border-slate-800">⚡{powerUsage}W</span>
                            <button onClick={manualPurgeAndClear} className="px-2 py-1 bg-red-900 border border-red-700 text-red-200 font-bold rounded text-[9px]">🧹 Clear</button>
                            <button onClick={() => setPlaying(!playing)} className={`px-3 py-1 rounded font-bold text-xs shadow ${playing ? "bg-amber-400 text-slate-950 animate-bounce" : "bg-pink-600 text-white"}`}>
                                {playing ? "■ 停止" : "▶ 再生"}
                            </button>
                            <div className="flex items-center gap-1 bg-slate-950 px-1.5 py-0.5 rounded border border-slate-800">
                                <span className="text-[9px] text-slate-400">BPM</span>
                                <input type="number" value={bpm} onChange={e => setBpm(Math.max(60, Math.min(220, Number(e.target.value))))} className="w-10 bg-slate-900 text-center font-bold text-pink-400 rounded text-xs py-0.5" />
                            </div>
                        </div>
                    </header>

                    {/* ナビゲーションメニュー */}
                    <nav className="bg-slate-950 border-b border-slate-800 px-2 py-1.5 flex gap-1 overflow-x-auto">
                        {[
                            { id: "HUB", label: "🌟 ホーム＆宣伝" },
                            { id: "GUITAR_PANEL", label: "🎸 ギター" },
                            { id: "INST_AI", label: "🤖 各楽器AI" },
                            { id: "DRUMS20", label: "🥁 ドラム20種" },
                            { id: "GRID", label: "🎛️ 各楽器別18小節グリッド" },
                            { id: "CRERA", label: "📁 CRERA記録・再生" },
                            { id: "MIXER", label: "🎚️ ミキサー" },
                        ].map(t => (
                            <button key={t.id} onClick={() => setTab(t.id)} className={`px-2.5 py-1 rounded text-center font-bold transition-all shrink-0 ${tab === t.id ? "bg-amber-500 text-slate-950 shadow" : "bg-slate-900 text-slate-400"}`}>
                                {t.label}
                            </button>
                        ))}
                    </nav>

                    <div className="bg-slate-900/50 px-3 py-1 text-[10px] text-cyan-400 border-b border-slate-900 truncate flex justify-between items-center">
                        <span>💡 {status}</span>
                        <span className="text-pink-400 font-bold shrink-0">Bar: {currentBar + 1}/{TOTAL_BARS} (Step: {currentStep + 1})</span>
                    </div>

                    <main className="p-2 flex flex-col gap-3">
                        
                        {/* 🌟 ホーム ＆ グラフィティアート ＆ 宣伝タブ */}
                        {tab === "HUB" && (
                            <div className="flex flex-col gap-3">
                                {/* グラフィティ風イメージデザインエリア */}
                                <div className="relative bg-gradient-to-r from-purple-950 via-slate-900 to-pink-950 border-2 border-pink-500/80 rounded-xl p-4 shadow-xl flex flex-col items-center justify-center gap-2 overflow-hidden">
                                    <div className="absolute -right-6 -bottom-6 text-6xl opacity-15 font-black text-pink-400">MICVICTORY</div>
                                    <span className="text-[10px] tracking-widest text-pink-400 font-black uppercase">Graffiti Visual Art Showcase</span>
                                    <h2 className="text-base font-black bg-gradient-to-r from-amber-300 via-pink-400 to-cyan-400 bg-clip-text text-transparent text-center">
                                        MIC VICTORY DLAND v70.0
                                    </h2>
                                    <p className="text-[10px] text-slate-300 text-center max-w-md">
                                        極上の木目アコギ、重低音サブベース、そして20種のドラムビートが融合する次世代DAW。18小節の追加グリッド＆CRERAレコード機能で無限の音楽制作をあなたに。
                                    </p>
                                    <div className="flex gap-2 mt-1">
                                        <button onClick={() => setTab("GRID")} className="px-3 py-1.5 bg-pink-600 hover:bg-pink-500 text-white font-bold rounded text-xs shadow">
                                            🎛️ 18小節グリッドを開く
                                        </button>
                                        <button onClick={() => setTab("CRERA")} className="px-3 py-1.5 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded text-xs shadow">
                                            📁 CRERA記録・再生
                                        </button>
                                    </div>
                                </div>

                                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                                    <button onClick={() => { setSelectedInstrument("guitar"); setTab("GUITAR_PANEL"); }} className="p-3 bg-slate-900 border border-amber-600/50 rounded-lg text-left shadow flex flex-col gap-1">
                                        <span className="font-bold text-amber-300 text-xs">🎸 ギター演奏パネル</span>
                                        <span className="text-[9px] text-slate-400">木目アコギ・コード鳴らし</span>
                                    </button>
                                    <button onClick={() => setTab("INST_AI")} className="p-3 bg-slate-900 border border-purple-600/50 rounded-lg text-left shadow flex flex-col gap-1">
                                        <span className="font-bold text-purple-300 text-xs">🤖 各楽器AI切り替え</span>
                                        <span className="text-[9px] text-slate-400">18ビート・アルペジオ自動生成</span>
                                    </button>
                                    <button onClick={() => setTab("DRUMS20")} className="p-3 bg-slate-900 border border-red-600/50 rounded-lg text-left shadow flex flex-col gap-1">
                                        <span className="font-bold text-red-300 text-xs">🥁 ドラム20パターン</span>
                                        <span className="text-[9px] text-slate-400">木目打音＆タンバリン</span>
                                    </button>
                                    <button onClick={() => setTab("MIXER")} className="p-3 bg-slate-900 border border-cyan-600/50 rounded-lg text-left shadow flex flex-col gap-1">
                                        <span className="font-bold text-cyan-300 text-xs">🎚️ ミキサー＆EQ</span>
                                        <span className="text-[9px] text-slate-400">重低音ブースト・音量調整</span>
                                    </button>
                                </div>

                                {/* 公式宣伝・著作権情報カード */}
                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-1.5 text-[10px]">
                                    <span className="font-bold text-amber-400">📢 公式リリース・著作権情報 (micvictorydanb)</span>
                                    <p className="text-slate-300">
                                        本アプリケーション「MIC VICTORY DLAND」および関連音源・UIデザインは、**micvictorydanb** による完全オリジナル作品です。著作権法により保護されており、無断転載・商用流用を固く禁じます。
                                    </p>
                                    <div className="bg-slate-950 p-2 rounded border border-slate-800 flex justify-between items-center text-[9px] text-cyan-400">
                                        <span>Official Release: micvictorydanb DLAND Engine v70.0</span>
                                        <span className="text-pink-400 font-bold">著作権保護適用済み</span>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 🎸 ギター演奏タブ */}
                        {tab === "GUITAR_PANEL" && (
                            <div className="bg-slate-900 border border-amber-600/50 rounded-lg p-3 flex flex-col gap-3 shadow">
                                <div className="flex justify-between items-center flex-wrap gap-2">
                                    <span className="text-xs font-bold text-amber-400">🎸 ギター設定 ＆ 極上コード演奏</span>
                                    <div className="flex gap-1 flex-wrap">
                                        {["mokumeAcoustic", "electric", "electricClean"].map(type => (
                                            <button key={type} onClick={() => setGuitarType(type)} className={`px-2 py-0.5 rounded text-[10px] font-bold ${guitarType === type ? "bg-amber-500 text-slate-950" : "bg-slate-950 text-slate-400 border border-slate-800"}`}>
                                                {type === "mokumeAcoustic" ? "木目アコギ" : (type === "electric" ? "エレキ歪み" : "電子クリーン")}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                <div className="grid grid-cols-2 sm:grid-cols-6 gap-2">
                                    {GUITAR_CHORDS.map(chord => (
                                        <button
                                            key={chord.name}
                                            onClick={() => playNote(chord.notes)}
                                            className="p-2.5 bg-slate-950 hover:bg-amber-950 border border-slate-700 hover:border-amber-400 rounded flex flex-col items-center justify-center gap-0.5 active:scale-95 shadow"
                                        >
                                            <span className="text-amber-300 font-black text-xs">{chord.name}</span>
                                            <span className="text-[8px] text-slate-400">{chord.desc}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* 🤖 各楽器別AI切り替えタブ */}
                        {tab === "INST_AI" && (
                            <div className="bg-slate-900 border border-purple-600/50 rounded-lg p-3 flex flex-col gap-3 shadow">
                                <span className="text-xs font-bold text-purple-400">🤖 各楽器別AIパターン切り替え ＆ 自動生成</span>
                                <div className="flex flex-col gap-2">
                                    {INSTRUMENTS.map(inst => (
                                        <div key={inst.id} className="flex items-center justify-between bg-slate-950 p-2.5 rounded border border-slate-800 gap-2 flex-wrap">
                                            <span className="text-[10px] font-bold text-slate-200 w-36">{inst.label}</span>
                                            <div className="flex gap-1">
                                                {["18beat", "arpeggio", "cutting", "random"].map(mode => (
                                                    <button
                                                        key={mode}
                                                        onClick={() => {
                                                            setInstrumentAiModes({ ...instrumentAiModes, [inst.id]: mode });
                                                            setSelectedInstrument(inst.id);
                                                            generateAiForInstrument(inst.id, mode);
                                                        }}
                                                        className={`px-2 py-1 rounded text-[9px] font-bold ${instrumentAiModes[inst.id] === mode ? "bg-purple-600 text-white" : "bg-slate-900 text-slate-400"}`}
                                                    >
                                                        {mode}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* 🥁 ドラム20種タブ */}
                        {tab === "DRUMS20" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3 shadow">
                                <div className="flex justify-between items-center">
                                    <span className="text-xs font-bold text-red-400">🥁 ドラム 20パターン ＆ 木目打音</span>
                                    <div className="flex gap-1">
                                        <button onClick={() => setTapHitMode("woodHit")} className={`px-2 py-0.5 rounded text-[9px] font-bold ${tapHitMode === "woodHit" ? "bg-red-600 text-white" : "bg-slate-950 text-slate-400"}`}>木目打音</button>
                                        <button onClick={() => setTapHitMode("kick")} className={`px-2 py-0.5 rounded text-[9px] font-bold ${tapHitMode === "kick" ? "bg-red-600 text-white" : "bg-slate-950 text-slate-400"}`}>キック</button>
                                    </div>
                                </div>
                                <div className="grid grid-cols-4 sm:grid-cols-10 gap-1.5">
                                    {Array.from({ length: 20 }).map((_, idx) => {
                                        const pNum = idx + 1;
                                        return (
                                            <button key={pNum} onClick={() => applyDrumPattern20(pNum)} className={`py-2 rounded text-[10px] font-bold border transition-all ${activeDrumPattern === pNum ? "bg-red-600 text-white border-white" : "bg-slate-950 text-red-300 border-red-900/50"}`}>
                                                # {pNum}
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {/* 🎛️ 各楽器別 18小節追加グリッドタブ */}
                        {tab === "GRID" && (
                            <div className="bg-slate-900 border border-cyan-600/50 rounded-lg p-3 flex flex-col gap-3 shadow">
                                <div className="flex justify-between items-center flex-wrap gap-2">
                                    <div className="flex items-center gap-2">
                                        <span className="text-xs font-bold text-cyan-400">🎛️ グリッド編集</span>
                                        <select value={selectedInstrument} onChange={e => setSelectedInstrument(e.target.value)} className="bg-slate-950 text-cyan-300 font-bold text-[10px] p-1 rounded border border-slate-800">
                                            {INSTRUMENTS.map(i => <option key={i.id} value={i.id}>{i.label}</option>)}
                                        </select>
                                    </div>
                                    <button onClick={addNew18Bars} className="px-3 py-1 bg-gradient-to-r from-cyan-600 to-blue-600 text-white font-bold rounded text-xs shadow hover:opacity-90 active:scale-95">
                                        ➕ 新たに18小節つけ足す (+18 Bars)
                                    </button>
                                </div>

                                <div className="text-[10px] text-slate-400 bg-slate-950 p-2 rounded border border-slate-800 flex justify-between items-center">
                                    <span>現在選択中: <strong className="text-amber-400">{selectedInstrument}</strong> (全 {TOTAL_BARS} 小節)</span>
                                    <span className="text-cyan-400">ボタンタップでノートON/OFF切替</span>
                                </div>

                                <div className="flex gap-2 overflow-x-auto pb-3 pt-1">
                                    {Array.from({ length: TOTAL_BARS }).map((_, barIdx) => (
                                        <div key={barIdx} className={`bg-slate-950 p-2 rounded border shrink-0 w-32 flex flex-col gap-1 ${barIdx >= BASE_BARS ? "border-pink-500/80 bg-pink-950/20" : "border-slate-800"}`}>
                                            <div className="text-[9px] font-bold text-center border-b border-slate-900 pb-0.5 flex justify-between">
                                                <span className={barIdx >= BASE_BARS ? "text-pink-400" : "text-cyan-400"}>Bar {barIdx + 1}</span>
                                                {barIdx >= BASE_BARS && <span className="text-[7px] bg-pink-900 text-pink-200 px-1 rounded">追加18</span>}
                                            </div>
                                            <div className="grid grid-cols-4 gap-1">
                                                {Array.from({ length: BAR_STEPS }).map((_, stepIdx) => {
                                                    const absoluteStep = barIdx * BAR_STEPS + stepIdx;
                                                    const stepsArr = instrumentSteps[selectedInstrument] || [];
                                                    const stepData = stepsArr[absoluteStep];
                                                    const isCurrent = currentBar === barIdx && currentStep === stepIdx && playing;

                                                    return (
                                                        <button
                                                            key={stepIdx}
                                                            onClick={() => {
                                                                const arr = [...stepsArr];
                                                                arr[absoluteStep] = arr[absoluteStep] ? null : { note: "C2", dur: "8n" };
                                                                setInstrumentSteps({...instrumentSteps, [selectedInstrument]: arr});
                                                            }}
                                                            className={`h-6 rounded flex items-center justify-center text-[8px] font-bold border ${isCurrent ? "ring-2 ring-pink-400" : ""} ${stepData ? "bg-cyan-500 text-slate-950 border-white" : "bg-slate-900 text-slate-600 border-slate-800"}`}
                                                        >
                                                            {stepIdx + 1}
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* 📁 CRERA記録・再生タブ */}
                        {tab === "CRERA" && (
                            <div className="bg-slate-900 border border-pink-600/50 rounded-lg p-3 flex flex-col gap-3 shadow">
                                <div className="flex justify-between items-center flex-wrap gap-2">
                                    <span className="text-xs font-bold text-pink-400">📁 CRERA 記録・再生 ＆ 保存マネージャー</span>
                                    <button onClick={saveCreraTake} className="px-3 py-1.5 bg-gradient-to-r from-pink-600 to-rose-600 text-white font-bold rounded text-xs shadow hover:opacity-90 active:scale-95">
                                        💾 現在のフレーズをCRERA記録
                                    </button>
                                </div>
                                <div className="bg-slate-950 p-3 rounded border border-slate-800 flex flex-col gap-2 max-h-[250px] overflow-y-auto">
                                    {creraTakes.length === 0 ? (
                                        <span className="text-[10px] text-slate-500 text-center py-4">CRERAに記録されたテイクはありません。「CRERA記録」ボタンを押してセッションを保存してください。</span>
                                    ) : creraTakes.map(t => (
                                        <div key={t.id} className="flex justify-between items-center bg-slate-900 p-2.5 rounded border border-slate-800 hover:border-pink-500 transition-colors">
                                            <div className="flex flex-col">
                                                <span className="text-amber-400 text-xs font-bold">{t.title}</span>
                                                <span className="text-[8px] text-slate-400">記録時刻: {t.date} / BPM: {t.bpm} / 小節数: {t.totalBars || 24}小節</span>
                                            </div>
                                            <div className="flex gap-1.5">
                                                <button onClick={() => loadCreraTake(t)} className="px-3 py-1 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded text-[10px] shadow">
                                                    ▶ 再生・復元ロード
                                                </button>
                                                <button onClick={() => alert(`[${t.title}] をmicvictorydanbクラウドへバックアップ同期しました！`)} className="px-2.5 py-1 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded text-[10px]">
                                                    同期
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* 🎚️ ミキサータブ */}
                        {tab === "MIXER" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3 shadow">
                                <span className="text-xs font-bold text-amber-400">🎚️ 各楽器ボリューム＆重低音ミキサー</span>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 bg-slate-950 p-3 rounded border border-slate-800">
                                    {INSTRUMENTS.map(inst => (
                                        <div key={inst.id} className="flex items-center justify-between bg-slate-900 p-2 rounded border border-slate-800">
                                            <span className="text-[10px] text-slate-200">{inst.label}</span>
                                            <input type="range" min="-30" max="6" step="1" value={volumes[inst.id]} onChange={e => setVolumes({...volumes, [inst.id]: Number(e.target.value)})} className="w-24 accent-amber-500" />
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<MasterSynthApp />);
    </script>
</body>
</html>
