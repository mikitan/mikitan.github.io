<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIC VICTORY DLAND v66.0 - 800文字AI歌詞 ＆ 極上ピアノコード版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans select-none pb-28 overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        function MasterSynthApp() {
            const [tab, setTab] = React.useState("KEYBOARD");
            const [playing, setPlaying] = React.useState(false);
            const [isRecording, setIsRecording] = React.useState(false);
            const [isVoiceRecording, setIsVoiceRecording] = React.useState(false);
            const [flashColorIndex, setFlashColorIndex] = React.useState(0);
            const [bpm, setBpm] = React.useState(114);
            const [currentBar, setCurrentBar] = React.useState(0);
            const [currentStep, setCurrentStep] = React.useState(-1);
            const [status, setStatus] = React.useState("✨ v66.0 800文字AI歌詞＆極上ピアノコード稼働中！");

            const BARS = 24;
            const BAR_STEPS = 16;
            const TOTAL_STEPS = BARS * BAR_STEPS;

            const [selectedInstrument, setSelectedInstrument] = React.useState("piano");
            const [selectedDuration, setSelectedDuration] = React.useState("8n");
            const [selectedDrumPart, setSelectedDrumPart] = React.useState("kick");
            
            const [guitarMode, setGuitarMode] = React.useState("acoustic");
            const [pianoMode, setPianoMode] = React.useState("richGrand"); // 極上ピアノモード
            const [vibratoDepth, setVibratoDepth] = React.useState(0);
            const [noteLengthMode, setNoteLengthMode] = React.useState("normal");
            const [voiceSamples, setVoiceSamples] = React.useState([]);

            // FXエフェクト用ステート
            const [filterFreq, setFilterFreq] = React.useState(4000);
            const [bitCrushBits, setBitCrushBits] = React.useState(16);
            const [distortionWet, setDistortionWet] = React.useState(0.08);

            const [showButtons, setShowButtons] = React.useState({
                transport: true,
                genre: true,
                drums20: true,
                keyboardPanel: true,
                gridPanel: true,
                lyricsPanel: true,
                mixer: true,
                crera: true,
                save: true
            });

            const [creraTakes, setCreraTakes] = React.useState([]);
            const [activePatternIndex, setActivePatternIndex] = React.useState(1);
            const [masterBassBoost, setMasterBassBoost] = React.useState(16);
            const [masterVolume, setMasterVolume] = React.useState(1.2);
            const [slotName, setSlotName] = React.useState("DLAND_v66_GRAND_PIANO");
            const [powerUsage, setPowerUsage] = React.useState(21);

            // 800文字級 AI歌詞・ストーリーテキスト
            const [aiLyricsText, setAiLyricsText] = React.useState(
`【MIC VICTORY DLAND v66.0 - 800文字AI叙事詩＆ドラマチックストーリー】

[Verse 1: 夜明けの街とデジタル・ビート]
静寂を切り裂くように鳴り響くC0の超重低音。アスファルトの冷たさが心地よく、足元のモズ・エアクッションがリズムを刻み始める。遠くの空が白み、ネスカフェの深い香りが頭を冴え渡らせる。画面の向こうで輝くBLAUNDとMICVICTORYのコード群。Pythonのスクリプトが描く未来図のように、私たちは自分の足で新しい道を切り開いている。焦る必要はない、一歩ずつ確実に、リズムに身を委ねればいい。

[Chorus: 永遠に続くグルーヴと高鳴る鼓動]
響け、極上のピアノコード！ グランドピアノの重厚な倍音が胸の奥を震わせ、アコギの爪弾きが優しく寄り添う。ベースが刻むリズミカルなグルーヴは止まらない。崩れない、絶対に崩れない。私たちが積み上げたビートは、すべての迷いを吹き飛ばすエネルギーに変わる。何度でもつけ足そう、新しいメロディと最高の歌声を。この瞬間、世界で一番自由な音が、私たちの手の中で完成する。

[Bridge: 光と影、そしてCRERAの記憶]
台風の過ぎ去った空に虹がかかるように、過去のデータも、未来の約束も、すべてがこの音楽に溶け込んでいく。マイクに向かって叫んだあの日の声も、CRERAのアーカイブに優しく刻まれている。甘いラカントの余韻と、香ばしいコーヒーの温もり。技術と情熱がクロスオーバーする場所、それが私たちのD-LAND。

[Outro: 終わらないフィナーレへ]
フェードアウトしていく音の波間に、確かな温もりを残して。明日へ続く扉が今、静かに開かれる。MIC VICTORY。勝利の旋律は、いつまでも鳴り止まない。`
            );

            const FLASH_COLORS = [
                "border-cyan-500 shadow-cyan-500/50",
                "border-pink-500 shadow-pink-500/50",
                "border-amber-500 shadow-amber-500/50",
                "border-purple-500 shadow-purple-500/50",
                "border-emerald-500 shadow-emerald-500/50",
                "border-red-500 shadow-red-500/50",
                "border-blue-500 shadow-blue-500/50",
                "border-yellow-500 shadow-yellow-500/50"
            ];

            const INSTRUMENTS = [
                { id: "subBass", label: "🔊 C0超重低音土台", color: "from-amber-600 to-orange-700" },
                { id: "bass", label: "🎸 リズミカル・ファットベース", color: "from-emerald-600 to-teal-600" },
                { id: "piano", label: "🎹 極上グランドピアノ＆コード", color: "from-blue-600 to-indigo-600" },
                { id: "synth", label: "🎹 AIローズ系スタブ", color: "from-cyan-600 to-blue-700" },
                { id: "guitar", label: "🎸 極上ギター (木目/エレキ切替)", color: "from-amber-700 to-red-900" },
                { id: "loopTrack", label: "🔁 ブラコンカッティング", color: "from-pink-600 to-rose-600" },
                { id: "trumpet", label: "🎺 ブラスセクション", color: "from-yellow-500 to-amber-600" },
                { id: "drums", label: "🥁 つけ足しドラム20種", color: "from-red-600 to-amber-600" },
            ];

            const [instrumentSteps, setInstrumentSteps] = React.useState(() => {
                const init = {};
                INSTRUMENTS.forEach(inst => init[inst.id] = new Array(TOTAL_STEPS).fill(null));
                return init;
            });

            const [volumes, setVolumes] = React.useState({
                subBass: 6, bass: 3, piano: 3, synth: 0, loopTrack: -2, trumpet: -1, guitar: 3, drums: 4
            });

            const synthsRef = React.useRef(null);
            const loopRef = React.useRef(null);
            const mediaRecorderRef = React.useRef(null);
            const audioChunksRef = React.useRef([]);

            const KEYBOARD_NOTES = [
                { note: "C0", label: "超低C0" },
                { note: "C1", label: "低C1" },
                { note: "C2", label: "ド(C2)" },
                { note: "D2", label: "レ(D2)" },
                { note: "E2", label: "ミ(E2)" },
                { note: "F2", label: "ファ(F2)" },
                { note: "G2", label: "ソ(G2)" },
                { note: "A2", label: "ラ(A2)" },
                { note: "B2", label: "シ(B2)" },
                { note: "C3", label: "高ド(C3)" },
                { note: "Eb4", label: "ミ♭" },
                { note: "G4", label: "ソ4" },
                { note: "Bb4", label: "シ♭4" },
                { note: "C5", label: "高ド5" }
            ];

            const ALL_CHORDS = [
                { name: "Cmaj7", notes: ["C2", "E2", "G2", "B2"], desc: "極上Cメジャー7" },
                { name: "Am7", notes: ["A2", "C3", "E3", "G3"], desc: "Aマイナー7" },
                { name: "Fmaj7", notes: ["F2", "A2", "C3", "E3"], desc: "Fメジャー7" },
                { name: "G7", notes: ["G2", "B2", "D3", "F3"], desc: "Gセブンス" },
                { name: "Dm7", notes: ["D2", "F2", "A2", "C3"], desc: "Dマイナー7" },
                { name: "Em7", notes: ["E2", "G2", "B2", "D3"], desc: "Eマイナー7" },
                { name: "Am", notes: ["A2", "C3", "E3"], desc: "ラ・ド・ミ" },
                { name: "C", notes: ["C2", "E2", "G2"], desc: "ド・ミ・ソ" },
                { name: "F", notes: ["F2", "A2", "C3"], desc: "ファ・ラ・ド" },
                { name: "G", notes: ["G2", "B2", "D3"], desc: "ソ・シ・レ" },
                { name: "Gsus4", notes: ["G2", "C3", "D3"], desc: "サスフォー" },
                { name: "E7", notes: ["E2", "G#2", "B2", "D3"], desc: "セブンススパイス" }
            ];

            const autoPurgeAndOptimizeMemory = () => {
                try {
                    if (Tone.context) {
                        if (Tone.context.state === 'suspended') Tone.context.resume();
                        if (typeof Tone.context.disposeSurplusNodes === 'function') Tone.context.disposeSurplusNodes();
                    }
                    Tone.Transport.cancel(Tone.now() + 10);
                } catch(e) {}
            };

            React.useEffect(() => {
                const intervalId = setInterval(() => autoPurgeAndOptimizeMemory(), 120000);
                return () => clearInterval(intervalId);
            }, []);

            const manualPurgeAndClear = () => {
                autoPurgeAndOptimizeMemory();
                const empty = {};
                INSTRUMENTS.forEach(inst => empty[inst.id] = new Array(TOTAL_STEPS).fill(null));
                setInstrumentSteps(empty);
                setStatus("🧹 崩れない自動キャッシュクリア＆全ステップリセット完了！");
            };

            // 極上エフェクト＆ピアノ・ギター最適化チェーン構築
            React.useEffect(() => {
                const masterGain = new Tone.Gain(masterVolume).toDestination();
                const eq = new Tone.EQ3({ low: masterBassBoost, lowFrequency: 130, mid: 3.2, high: 2.8 }).connect(masterGain);
                const bitCrusher = new Tone.BitCrusher({ bits: bitCrushBits }).connect(eq);
                const filter = new Tone.Filter({ frequency: filterFreq, type: "lowpass" }).connect(bitCrusher);
                const distortion = new Tone.Distortion({ distortion: distortionWet, oversample: "4x" }).connect(filter);
                const reverb = new Tone.Reverb({ decay: pianoMode === "richGrand" ? 2.4 : 1.8, wet: pianoMode === "richGrand" ? 0.22 : 0.15 }).connect(distortion);
                const delay = new Tone.FeedbackDelay({ delayTime: "8n", feedback: 0.15, wet: 0.08 }).connect(reverb);
                const vibrato = new Tone.Vibrato({ frequency: 5.5, depth: vibratoDepth }).connect(delay);

                const cGains = {};
                INSTRUMENTS.forEach(inst => {
                    cGains[inst.id] = new Tone.Gain(Tone.dbToGain(volumes[inst.id] || 0)).connect(vibrato);
                });

                synthsRef.current = {
                    subBass: new Tone.MonoSynth({
                        oscillator: { type: "sine" },
                        envelope: { attack: 0.002, decay: 0.5, sustain: 0.65, release: 0.2 },
                        filterEnvelope: { attack: 0.002, decay: 0.3, sustain: 0.45, release: 0.2, baseFrequency: 50, octaves: 2 }
                    }).connect(cGains.subBass),
                    bass: new Tone.MonoSynth({
                        oscillator: { type: "triangle" },
                        envelope: { attack: 0.003, decay: 0.3, sustain: 0.4, release: 0.12 }
                    }).connect(cGains.bass),
                    // 極上グランドピアノ専用ポリフォニック設定
                    piano: new Tone.Synth({ 
                        oscillator: { type: pianoMode === "richGrand" ? "triangle" : "sine" }, 
                        envelope: { attack: pianoMode === "richGrand" ? 0.005 : 0.006, decay: pianoMode === "richGrand" ? 0.6 : 0.4, sustain: pianoMode === "richGrand" ? 0.45 : 0.35, release: 0.4 } 
                    }).connect(cGains.piano),
                    synth: new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.006, decay: 0.3, sustain: 0.4, release: 0.2 } }).connect(cGains.synth),
                    loopTrack: new Tone.Synth({ oscillator: { type: "triangle" }, envelope: { attack: 0.003, decay: 0.15, sustain: 0.2, release: 0.1 } }).connect(cGains.loopTrack),
                    guitar: new Tone.Synth({ 
                        oscillator: { type: guitarMode === "electricDist" ? "sawtooth" : (guitarMode === "electricClean" ? "triangle" : "sine") }, 
                        envelope: { attack: guitarMode === "acoustic" ? 0.002 : 0.005, decay: guitarMode === "acoustic" ? 0.35 : 0.25, sustain: 0.35, release: 0.2 } 
                    }).connect(cGains.guitar),
                    trumpet: new Tone.Synth({ oscillator: { type: "sawtooth" }, envelope: { attack: 0.02, decay: 0.25, sustain: 0.6, release: 0.15 } }).connect(cGains.trumpet),
                    drums: {
                        kick: new Tone.MembraneSynth({ pitchDecay: 0.05, octaves: 6, oscillator: { type: "sine" }, envelope: { attack: 0.0001, decay: 0.32, sustain: 0.01, release: 0.12 } }).connect(cGains.drums),
                        snare: new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.0001, decay: 0.18, sustain: 0 } }).connect(cGains.drums),
                        hihat: new Tone.MetalSynth({ frequency: 950, envelope: { attack: 0.0005, decay: 0.02, release: 0.01 }, harmonicity: 5.1, modulationIndex: 32, resonance: 7200, octaves: 1.4 }).connect(cGains.drums),
                        clap: new Tone.NoiseSynth({ noise: { type: "pink" }, envelope: { attack: 0.004, decay: 0.14, sustain: 0 } }).connect(cGains.drums),
                    },
                    eq, reverb, vibrato, filter, bitCrusher
                };

                return () => { Tone.Transport.stop(); Tone.Transport.cancel(); };
            }, [guitarMode, pianoMode, vibratoDepth, filterFreq, bitCrushBits, distortionWet]);

            React.useEffect(() => {
                Tone.Transport.bpm.value = bpm;
                Tone.Transport.cancel();

                if (playing) {
                    let stepCounter = 0;
                    loopRef.current = new Tone.Loop(time => {
                        let step = stepCounter % TOTAL_STEPS;
                        const bar = Math.floor(step / BAR_STEPS);
                        const sInBar = step % BAR_STEPS;

                        setCurrentStep(sInBar);
                        setCurrentBar(bar);

                        if (sInBar === 0) {
                            setFlashColorIndex(prev => (prev + 1) % FLASH_COLORS.length);
                            setPowerUsage(Math.floor(18 + Math.random() * 8));
                            if (bar % 4 === 0) autoPurgeAndOptimizeMemory();
                        }

                        const syns = synthsRef.current;
                        if (!syns) return;

                        Object.keys(instrumentSteps).forEach(instKey => {
                            const item = instrumentSteps[instKey][step];
                            if (!item) return;

                            const note = typeof item === "object" ? item.note : item;
                            let dur = typeof item === "object" ? (item.dur || "8n") : "8n";
                            if (noteLengthMode === "short") dur = "16n";
                            if (noteLengthMode === "long") dur = "4n";

                            if (instKey === "drums") {
                                if (typeof item === "object") {
                                    if (item.kick) syns.drums.kick.triggerAttackRelease("C1", "8n", time);
                                    if (item.snare) syns.drums.snare.triggerAttackRelease("8n", time);
                                    if (item.hihat) syns.drums.hihat.triggerAttackRelease("32n", time, 0.92);
                                    if (item.clap) syns.drums.clap.triggerAttackRelease("8n", time);
                                }
                            } else if (syns[instKey]) {
                                if (Array.isArray(note)) {
                                    note.forEach((n, idx) => {
                                        syns[instKey].triggerAttackRelease(n, dur, time + idx * 0.025);
                                    });
                                } else {
                                    syns[instKey].triggerAttackRelease(note || "C4", dur, time);
                                }
                            }
                        });

                        stepCounter++;
                    }, "16n").start(0);

                    Tone.Transport.start();
                } else {
                    Tone.Transport.stop();
                }
            }, [playing, bpm, instrumentSteps, noteLengthMode]);

            const playKeyboardNote = async (noteOrNotes) => {
                await Tone.start();
                const syns = synthsRef.current;
                if (!syns) return;

                const notesToPlay = Array.isArray(noteOrNotes) ? noteOrNotes : [noteOrNotes];

                if (selectedInstrument === "drums") {
                    if (selectedDrumPart === "kick") syns.drums.kick.triggerAttackRelease("C1", "8n");
                    else if (selectedDrumPart === "snare") syns.drums.snare.triggerAttackRelease("8n");
                    else if (selectedDrumPart === "hihat") syns.drums.hihat.triggerAttackRelease("32n");
                    else syns.drums.clap.triggerAttackRelease("8n");
                } else if (syns[selectedInstrument]) {
                    notesToPlay.forEach((n, idx) => {
                        syns[selectedInstrument].triggerAttackRelease(n, selectedDuration, Tone.now() + idx * 0.03);
                    });
                }

                const targetStep = (currentBar * BAR_STEPS) + (currentStep >= 0 ? currentStep : 0);
                setInstrumentSteps(prev => {
                    const arr = [...prev[selectedInstrument]];
                    if (selectedInstrument === "drums") {
                        const cur = arr[targetStep] || { kick: false, snare: false, hihat: false, clap: false };
                        arr[targetStep] = { ...cur, [selectedDrumPart]: true };
                    } else {
                        arr[targetStep] = { note: notesToPlay.length === 1 ? notesToPlay[0] : notesToPlay, dur: selectedDuration };
                    }
                    return { ...prev, [selectedInstrument]: arr };
                });
                setStatus(`🎵 [${selectedInstrument}] 入力追加: ${Array.isArray(noteOrNotes) ? noteOrNotes.join(",") : noteOrNotes} (Bar ${currentBar + 1})`);
            };

            // AIランダムメロディ作成（つけ足し対応）
            const generateRandomAiMelody = (instKey) => {
                const newSteps = JSON.parse(JSON.stringify(instrumentSteps));
                const notePools = {
                    subBass: ["C0", "C1", "G0", "F0"],
                    bass: ["C1", "Eb1", "G1", "Bb1", "C2", "G1"],
                    piano: [["C2","E2","G2","B2"], ["A2","C3","E3","G3"], ["F2","A2","C3","E3"], ["G2","B2","D3","F3"]],
                    synth: ["C2", "Eb2", "G2", "Bb2", "C3", "G3"],
                    guitar: ["C2", "E2", "G2", "B2", "C3", "E3", "G3"],
                    loopTrack: ["A2", "C3", "E3", "G3"],
                    trumpet: ["C3", "Eb3", "G3", "Bb3", "C4"],
                    drums: []
                };

                const pool = notePools[instKey] || ["C2", "G2", "C3"];
                const arr = new Array(TOTAL_STEPS).fill(null);

                for (let i = 0; i < TOTAL_STEPS; i++) {
                    const s = i % 16;
                    if (instKey === "bass" || instKey === "subBass") {
                        if (s === 0 || s === 3 || s === 6 || s === 10 || s === 12) {
                            const n = pool[Math.floor(Math.random() * pool.length)];
                            arr[i] = { note: n, dur: "8n" };
                        }
                    } else if (instKey === "piano") {
                        if (s === 0 || s === 8) {
                            const ch = pool[Math.floor(Math.random() * pool.length)];
                            arr[i] = { note: ch, dur: "4n" };
                        }
                    } else {
                        if (Math.random() < 0.28) {
                            const n = pool[Math.floor(Math.random() * pool.length)];
                            arr[i] = { note: n, dur: Math.random() > 0.5 ? "8n" : "16n" };
                        }
                    }
                }

                newSteps[instKey] = arr;
                setInstrumentSteps(newSteps);
                setStatus(`✨ [${instKey}] AIランダム＆極上ピアノコード作成完了！`);
            };

            const toggleVoiceRecording = async () => {
                if (!isVoiceRecording) {
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        mediaRecorderRef.current = new MediaRecorder(stream);
                        audioChunksRef.current = [];
                        mediaRecorderRef.current.ondataavailable = e => {
                            if (e.data.size > 0) audioChunksRef.current.push(e.data);
                        };
                        mediaRecorderRef.current.onstop = () => {
                            const audioBlob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                            const audioUrl = URL.createObjectURL(audioBlob);
                            const newVoiceSample = {
                                id: Date.now(),
                                title: `🎤 Voice/打音サンプル #${voiceSamples.length + 1}`,
                                url: audioUrl,
                                date: new Date().toLocaleTimeString()
                            };
                            setVoiceSamples(prev => [newVoiceSample, ...prev]);
                            setStatus("✅ Voice/打音サンプリング保存完了！");
                        };
                        mediaRecorderRef.current.start();
                        setIsVoiceRecording(true);
                        setStatus("🎙️ マイク音声・ギター打音キャプチャ中...");
                    } catch (err) {
                        setStatus("⚠️ マイクへのアクセスが許可されていません");
                    }
                } else {
                    if (mediaRecorderRef.current) mediaRecorderRef.current.stop();
                    setIsVoiceRecording(false);
                }
            };

            const generateDrumPattern20 = (pNum) => {
                const newArr = new Array(TOTAL_STEPS).fill(null);
                for (let i = 0; i < TOTAL_STEPS; i++) {
                    const s = i % 16;
                    let isK = false, isS = false, isH = false, isC = false;
                    if (pNum === 1) {
                        isK = (s === 0 || s === 4 || s === 8 || s === 12);
                        isS = (s === 4 || s === 12);
                        isH = (i % 2 === 0);
                    } else {
                        isK = (i % (4 + (pNum % 3)) === 0 || s === 10);
                        isS = (s === 4 || s === 12 || (pNum > 10 && s === 14));
                        isH = (i % Math.max(1, (pNum % 4)) === 0);
                        isC = (pNum > 8 && s === 12);
                    }
                    if (isK || isS || isH || isC) {
                        newArr[i] = { kick: isK, snare: isS, hihat: isH, clap: isC };
                    }
                }
                setInstrumentSteps(prev => ({ ...prev, drums: newArr }));
                setActivePatternIndex(pNum);
                setStatus(`🥁 つけ足しドラム #${pNum} (24小節) 適用完了！`);
            };

            const generateAiGenre = (genreType) => {
                const newSteps = JSON.parse(JSON.stringify(instrumentSteps));
                if (genreType === "grandballad") {
                    setBpm(88);
                    setPianoMode("richGrand");
                    for (let i = 0; i < TOTAL_STEPS; i++) {
                        const s = i % 16;
                        if (s === 0) newSteps.piano[i] = { note: ["C2", "E2", "G2", "B2"], dur: "2n" };
                        if (s === 8) newSteps.piano[i] = { note: ["A2", "C3", "E3", "G3"], dur: "2n" };
                        if (s === 4 || s === 12) newSteps.subBass[i] = { note: "C0", dur: "4n" };
                    }

                                            <div className="flex items-center gap-2">
                                                <audio controls src={v.url} className="h-7 w-36"></audio>
                                                <button onClick={() => setVoiceSamples(voiceSamples.filter(x => x.id !== v.id))} className="px-2 py-1 bg-red-950 text-red-300 rounded text-[10px]">削除</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {tab === "MIXER" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-4 flex flex-col gap-3">
                                <span className="text-xs font-bold text-amber-400">🎚️ FX（追加エフェクト）＆ 崩れない重低音ミキサー</span>
                                
                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-2 bg-slate-950 p-3 rounded border border-slate-800">
                                    <div className="flex flex-col gap-1">
                                        <span className="text-[10px] text-cyan-400 font-bold">ローパスフィルター: {filterFreq}Hz</span>
                                        <input type="range" min="800" max="12000" step="100" value={filterFreq} onChange={e => setFilterFreq(Number(e.target.value))} className="accent-cyan-500" />
                                    </div>
                                    <div className="flex flex-col gap-1">
                                        <span className="text-[10px] text-pink-400 font-bold">ビットクラッシャー(音質): {bitCrushBits}bit</span>
                                        <input type="range" min="4" max="16" step="1" value={bitCrushBits} onChange={e => setBitCrushBits(Number(e.target.value))} className="accent-pink-500" />
                                    </div>
                                    <div className="flex flex-col gap-1">
                                        <span className="text-[10px] text-amber-400 font-bold">ディストーション(歪み): {Math.round(distortionWet * 100)}%</span>
                                        <input type="range" min="0" max="1" step="0.05" value={distortionWet} onChange={e => setDistortionWet(Number(e.target.value))} className="accent-amber-500" />
                                    </div>
                                </div>

                                <div className="flex flex-col gap-2 bg-slate-950 p-3 rounded border border-slate-800">
                                    <span className="text-[11px] text-amber-400">マスター重低音ブースト (130Hz): {masterBassBoost} dB</span>
                                    <input type="range" min="0" max="24" step="1" value={masterBassBoost} onChange={e => setMasterBassBoost(Number(e.target.value))} className="accent-amber-500" />
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 bg-slate-950 p-3 rounded border border-slate-800">
                                    {INSTRUMENTS.map(inst => (
                                        <div key={inst.id} className="flex items-center justify-between bg-slate-900 p-2 rounded border border-slate-800">
                                            <span className="text-[11px] text-slate-200">{inst.label}</span>
                                            <input type="range" min="-30" max="6" step="1" value={volumes[inst.id]} onChange={e => setVolumes({...volumes, [inst.id]: Number(e.target.value)})} className="w-24 accent-amber-500" />
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {tab === "SAVE" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3">
                                <span className="text-xs font-bold text-emerald-400">💾 プロジェクト保存・アルバムリリース</span>
                                <div className="flex gap-2 bg-slate-950 p-3 rounded border border-slate-800">
                                    <input type="text" value={slotName} onChange={e => setSlotName(e.target.value)} className="bg-slate-900 px-2 py-1 rounded text-slate-100 flex-1 border border-slate-800 font-bold text-xs" />
                                    <button onClick={() => {
                                        const blob = new Blob([JSON.stringify({ title: slotName, bpm, instrumentSteps, volumes, creraTakes, voiceSamples, aiLyricsText }, null, 2)], { type: "application/json" });
                                        const url = URL.createObjectURL(blob);
                                        const a = document.createElement("a");
                                        a.href = url; a.download = `${slotName}.json`; a.click();
                                        URL.revokeObjectURL(url);
                                        setStatus(`💾 保存完了 [${slotName}]`);
                                    }} className="px-3 py-1 bg-emerald-600 text-white font-bold rounded text-xs">JSON保存</button>
                                </div>
                                <div className="text-[10px] text-slate-400 bg-slate-950 p-3 rounded border border-slate-800 flex flex-col gap-1">
                                    <span className="font-bold text-cyan-400">℗ © 2026 MIC VICTORY DLAND (All Rights Reserved)</span>
                                    <span>Release Version: v66.0 Grand Piano & 800-Char AI Lyrics Edition</span>
                                </div>
                            </div>
                        )}

                    </main>
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        if (rootElement) {
            ReactDOM.createRoot(rootElement).render(<MasterSynthApp />);
        }
    </script>
</body>
</html>
