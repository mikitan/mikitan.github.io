<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIC VICTORY DLAND v69.8 - 歌詞AI＆Voice録音・極上20メロディAI統合版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans select-none pb-28 overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        function MasterSynthApp() {
            const [tab, setTab] = React.useState("HUB");
            const [playing, setPlaying] = React.useState(false);
            const [bpm, setBpm] = React.useState(114);
            const [currentBar, setCurrentBar] = React.useState(0);
            const [currentStep, setCurrentStep] = React.useState(-1);
            const [status, setStatus] = React.useState("✨ v69.8 極上20メロディAI＆著作権フリースタンバイ完了！");

            const BARS = 24;
            const BAR_STEPS = 16;
            const TOTAL_STEPS = BARS * BAR_STEPS;

            const [selectedInstrument, setSelectedInstrument] = React.useState("guitar");
            const [selectedDuration, setSelectedDuration] = React.useState("8n");
            
            // ギター詳細設定
            const [guitarType, setGuitarType] = React.useState("mokumeAcoustic"); 
            const [vibratoDepth, setVibratoDepth] = React.useState(0.2);
            const [noteLengthMode, setNoteLengthMode] = React.useState("normal"); 
            const [tapHitMode, setTapHitMode] = React.useState("woodHit"); 

            // ドラム設定
            const [activeDrumPattern, setActiveDrumPattern] = React.useState(1);
            const [tambourineTempo, setTambourineTempo] = React.useState(10); 

            // ✨ 20種メロディAI選択ステート
            const [activeMelodyPattern20, setActiveMelodyPattern20] = React.useState(1);

            // 🎨 グラフティクイコライザー 7色自動カラー連動
            const [autoGraffitiActive, setAutoGraffitiActive] = React.useState(true);
            const [graffitiColorIndex, setGraffitiColorIndex] = React.useState(0);
            const GRAFFITI_7_COLORS = [
                { name: "サイバーシアン", bg: "border-cyan-500 shadow-cyan-500/50", text: "text-cyan-400" },
                { name: "ネオンピンク", bg: "border-pink-500 shadow-pink-500/50", text: "text-pink-400" },
                { name: "サンセットオレンジ", bg: "border-orange-500 shadow-orange-500/50", text: "text-orange-400" },
                { name: "エメラルドグリーン", bg: "border-emerald-500 shadow-emerald-500/50", text: "text-emerald-400" },
                { name: "バイオレットパープル", bg: "border-purple-500 shadow-purple-500/50", text: "text-purple-400" },
                { name: "ゴールデンイエロー", bg: "border-amber-500 shadow-amber-500/50", text: "text-amber-400" },
                { name: "ホットレッド", bg: "border-red-500 shadow-red-500/50", text: "text-red-400" }
            ];

            const [screensaverPos, setScreensaverPos] = React.useState({ x: 15, y: 25 });
            const [albumReleaseStatus, setAlbumReleaseStatus] = React.useState("未リリース（商用利用フリー化スタンバイ中）");

            const [instrumentCreraTakes, setInstrumentCreraTakes] = React.useState({
                guitar: [], piano: [], subBass: [], bass: [], drums: [], synth: [], loopTrack: [], trumpet: []
            });

            // 🎙️ Voice 録音機能用ステート
            const [isRecording, setIsRecording] = React.useState(false);
            const [voiceRecordings, setVoiceRecordings] = React.useState([]);
            const mediaRecorderRef = React.useRef(null);
            const audioChunksRef = React.useRef([]);

            // 📝 歌詞 AI 800文字文章表示用ステート
            const [aiLyricsText, setAiLyricsText] = React.useState(
                "【MIC VICTORY DLAND - 800文字 AI壮大アンセム歌詞（完全版）】\n\n" +
                "（第1章：夜明けのビートとサイバーシアンの胎動）\n" +
                "静寂を切り裂くように鳴り響くサイバーシアンのパルス。荒野を渡る風のように、僕らの足音は確実に未来へと刻まれていく。誰もが迷い、立ち止まりそうになる暗闇の中で、胸の奥底に灯した小さな光が、やがて巨大な炎へと変わっていくのを感じる。低音ブーストが大地を揺らし、最高潮のグルーブが今、解き放たれる。24小節のグリッドに魂を吹き込み、無限の音色を響かせろ。\n\n" +
                "（第2章：不屈のメロディと永遠の絆）\n" +
                "崩さない絶対の誇りを胸に、僕らはギターのコードをかき鳴らす。Cmaj7の響きが優しく夜空に溶け込み、Am7の切なさが過去の痛みを包み込む。何度倒れても、何度でも立ち上がる力——それが「MIC VICTORY」の真髄。涙の数だけ音色は強くなり、笑顔の数だけリズムは加速する。君と描いた夢の続きを、このステップボードのすべてに叩き込め。音連動する7色のグラフィティが、僕らの未来を鮮やかに照らし出す。\n\n" +
                "（第3章：世界へ羽ばたくレジェンドアンセム）\n" +
                "著作権フリーの波に乗せ、世界中へ響き渡れ micvictorydanbdanb の魂。国境も言葉も越えて、すべての音楽ラバーたちの心に直撃するアンセム。ボイス録音に刻んだ生の息吹と、AIが紡ぎ出す無限のハーモニーが重なり合う時、奇跡の扉が開かれる。さあ、恐れずに前を向け。勝利の旗を掲げ、光の彼方へ突き進め！すべてのビートが君の味方だ。"
            );

            const [aiPromptInput, setAiPromptInput] = React.useState("");

            const [masterBassBoost, setMasterBassBoost] = React.useState(16);
            const [masterVolume, setMasterVolume] = React.useState(1.2);
            const [reverbWet, setReverbWet] = React.useState(0.22);
            const [powerUsage, setPowerUsage] = React.useState(22);

            const INSTRUMENTS = [
                { id: "guitar", label: "🎸 木目/電子/エレキギター" },
                { id: "piano", label: "🎹 極上グランドピアノ" },
                { id: "subBass", label: "🔊 C0超重低音土台" },
                { id: "bass", label: "🎸 ファットベース" },
                { id: "drums", label: "🥁 ドラム・タンバリン20種" },
                { id: "synth", label: "🎹 AIローズ系スタブ" },
                { id: "loopTrack", label: "🔁 ブラコンカッティング" },
                { id: "trumpet", label: "🎺 ブラスセクション" }
            ];

            const [instrumentSteps, setInstrumentSteps] = React.useState(() => {
                const init = {};
                INSTRUMENTS.forEach(inst => init[inst.id] = new Array(TOTAL_STEPS).fill(null));
                return init;
            });

            const [instrumentAiModes, setInstrumentAiModes] = React.useState(() => {
                const init = {};
                INSTRUMENTS.forEach(inst => init[inst.id] = "18beat");
                return init;
            });

            const [volumes, setVolumes] = React.useState({
                guitar: 4, piano: 3, subBass: 6, bass: 3, drums: 4, synth: 0, loopTrack: -2, trumpet: -1
            });

            const synthsRef = React.useRef(null);
            const loopRef = React.useRef(null);

            const GUITAR_CHORDS = [
                { name: "Cmaj7", notes: ["C2", "E2", "G2", "B2"], desc: "極上Cmaj7" },
                { name: "Am7", notes: ["A2", "C3", "E3", "G3"], desc: "Am7" },
                { name: "Fmaj7", notes: ["F2", "A2", "C3", "E3"], desc: "Fmaj7" },
                { name: "G7", notes: ["G2", "B2", "D3", "F3"], desc: "G7" },
                { name: "Dm7", notes: ["D2", "F2", "A2", "C3"], desc: "Dm7" },
                { name: "Em7", notes: ["E2", "G2", "B2", "D3"], desc: "Em7" }
            ];

            // ✨ 20種類の高音・中音映えメロディパターン定義
            const MELODY_PATTERNS_20 = {
                1: { name: "サイバー高音アルペジオ", gen: (i) => i % 2 === 0 ? "C5" : "G4" },
                2: { name: "きらめくクリスタル上物", gen: (i) => i % 4 === 0 ? ["E5", "G5"] : null },
                3: { name: "エモーショナル高音コード", gen: (i) => i % 8 === 0 ? ["A4", "C5", "E5"] : null },
                4: { name: "透明感パステルピアノ", gen: (i) => (i % 4 === 2 ? "D5" : null) },
                5: { name: "高速シンセリフ（高音）", gen: (i) => i % 2 === 0 ? "B4" : "E5" },
                6: { name: "メロディック・カッティング", gen: (i) => i % 3 === 0 ? "G4" : null },
                7: { name: "星空ハイノートスタブ", gen: (i) => i % 16 === 0 ? ["C6", "G5"] : null },
                8: { name: "優雅なワルツ刻み", gen: (i) => i % 6 === 0 ? "E4" : null },
                9: { name: "ネオンピンク・リード", gen: (i) => i % 4 === 1 ? "F5" : null },
                10: { name: "エメラルド・トップノート", gen: (i) => i % 8 === 4 ? "B4" : null },
                11: { name: "18ビート・スタンダード", gen: (i) => i % 2 === 0 ? "C4" : null },
                12: { name: "王道ポップス刻み", gen: (i) => i % 4 === 0 ? "C4" : "G4" },
                13: { name: "フュージョン風コード", gen: (i) => i % 8 === 0 ? ["D4", "F4", "A4"] : null },
                14: { name: "スムーズ・R&Bピアノ", gen: (i) => i % 4 === 2 ? "E4" : null },
                15: { name: "グルーヴィー・スタブ", gen: (i) => i % 4 === 3 ? "G4" : null },
                16: { name: "アンビエント・ロングトーン", gen: (i) => i % 16 === 0 ? "C5" : null },
                17: { name: "リズミカル・ハイハット連動", gen: (i) => i % 2 === 1 ? "D5" : null },
                18: { name: "ファイナル・アンセム高音", gen: (i) => i % 4 === 0 ? "C5" : "E5" },
                19: { name: "ドリーミー・アルペジオ", gen: (i) => i % 2 === 0 ? "G4" : "B4" },
                20: { name: "ランダム・スパークルAI", gen: (i) => Math.random() > 0.6 ? "C5" : null }
            };

            const generateMelodyPattern20 = (instId, patternNum) => {
                setActiveMelodyPattern20(patternNum);
                const pattern = MELODY_PATTERNS_20[patternNum] || MELODY_PATTERNS_20[1];
                const arr = new Array(TOTAL_STEPS).fill(null);
                for (let i = 0; i < TOTAL_STEPS; i++) {
                    const res = pattern.gen(i);
                    if (res) {
                        arr[i] = { note: res, dur: "8n" };
                    }
                }
                setInstrumentSteps(prev => ({ ...prev, [instId]: arr }));
                setStatus(`✨ [${instId}] に極上メロディ20選 #${patternNum} (${pattern.name}) を適用しました！`);
            };

            const autoPurgeAndOptimizeMemory = () => {
                try {
                    if (Tone.context) {
                        if (Tone.context.state === 'suspended') Tone.context.resume();
                        if (typeof Tone.context.disposeSurplusNodes === 'function') Tone.context.disposeSurplusNodes();
                    }
                    Tone.Transport.cancel(Tone.now() + 10);
                } catch(e) {}
            };

            const manualPurgeAndClear = () => {
                autoPurgeAndOptimizeMemory();
                const empty = {};
                INSTRUMENTS.forEach(inst => empty[inst.id] = new Array(TOTAL_STEPS).fill(null));
                setInstrumentSteps(empty);
                setStatus("🧹 メモリ最適化＆全ステップリセット完了（完全死守）！");
            };

            const executeAlbumRelease = () => {
                setAlbumReleaseStatus("🚀 リリース完了！【商用利用フリー / 著作権フリー開放中 (micvictorydanbdanb)】");
                setStatus("💿 アルバムの著作権フリー化・商用利用解放手続きが正常に完了しました！");
            };

            const saveInstrumentCrera = (instId) => {
                const newTake = {
                    id: Date.now(),
                    title: `${instId}_Take_${(instrumentCreraTakes[instId] || []).length + 1}`,
                    steps: [...instrumentSteps[instId]],
                    date: new Date().toLocaleTimeString()
                };
                setInstrumentCreraTakes(prev => ({
                    ...prev,
                    [instId]: [newTake, ...(prev[instId] || [])]
                }));
                setStatus(`📁 ${instId} のパターンをCRERAにセーブしました！`);
            };

            const loadInstrumentCrera = (instId, take) => {
                setInstrumentSteps(prev => ({
                    ...prev,
                    [instId]: [...take.steps]
                }));
                setStatus(`📂 CRERAから ${take.title} を正常に復元しました！`);
            };

            const playNote = (notes) => {
                if (!synthsRef.current) return;
                const synth = synthsRef.current.guitar;
                if (Array.isArray(notes)) {
                    notes.forEach((n, idx) => synth.triggerAttackRelease(n, "8n", Tone.now() + idx * 0.03));
                } else {
                    synth.triggerAttackRelease(notes, "8n");
                }
            };

            const applyDrumPattern20 = (pNum) => {
                setActiveDrumPattern(pNum);
                const arr = new Array(TOTAL_STEPS).fill(null);
                for (let i = 0; i < TOTAL_STEPS; i++) {
                    const isKick = i % 4 === 0;
                    const isSnare = i % 8 === 4;
                    const isHihat = i % 2 === 0;
                    if (isKick || isSnare || isHihat) {
                        arr[i] = { kick: isKick, snare: isSnare, hihat: isHihat, woodHit: (i % 16 === 0) };
                    }
                }
                setInstrumentSteps(prev => ({ ...prev, drums: arr }));
                setStatus(`🥁 ドラムパターン #${pNum} を適用しました！`);
            };

            React.useEffect(() => {
                const masterGain = new Tone.Gain(masterVolume).toDestination();
                const eq = new Tone.EQ3({ low: masterBassBoost, lowFrequency: 130, mid: 3.2, high: 2.8 }).connect(masterGain);
                const reverb = new Tone.Reverb({ decay: 2.2, wet: reverbWet }).connect(eq);
                const vibrato = new Tone.Vibrato({ frequency: 5.0, depth: vibratoDepth }).connect(reverb);

                const cGains = {};
                INSTRUMENTS.forEach(inst => {
                    cGains[inst.id] = new Tone.Gain(Tone.dbToGain(volumes[inst.id] || 0)).connect(vibrato);
                });

                synthsRef.current = {
                    guitar: new Tone.Synth({
                        oscillator: { type: guitarType === "mokumeAcoustic" ? "triangle" : (guitarType === "electric" ? "sawtooth" : "sine") },
                        envelope: { attack: noteLengthMode === "short" ? 0.001 : 0.003, decay: noteLengthMode === "short" ? 0.15 : 0.4, sustain: 0.3, release: 0.2 }
                    }).connect(cGains.guitar),
                    piano: new Tone.Synth({ oscillator: { type: "triangle" }, envelope: { attack: 0.005, decay: 0.6, sustain: 0.45, release: 0.4 } }).connect(cGains.piano),
                    subBass: new Tone.MonoSynth({ oscillator: { type: "sine" }, envelope: { attack: 0.002, decay: 0.5, sustain: 0.65, release: 0.2 } }).connect(cGains.subBass),
                    bass: new Tone.MonoSynth({ oscillator: { type: "triangle" }, envelope: { attack: 0.003, decay: 0.3, sustain: 0.4, release: 0.12 } }).connect(cGains.bass),
                    synth: new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.006, decay: 0.3, sustain: 0.4, release: 0.2 } }).connect(cGains.synth),
                    loopTrack: new Tone.Synth({ oscillator: { type: "triangle" }, envelope: { attack: 0.003, decay: 0.15, sustain: 0.2, release: 0.1 } }).connect(cGains.loopTrack),
                    trumpet: new Tone.Synth({ oscillator: { type: "sawtooth" }, envelope: { attack: 0.02, decay: 0.25, sustain: 0.6, release: 0.15 } }).connect(cGains.trumpet),
                    drums: {
                        kick: new Tone.MembraneSynth({ pitchDecay: 0.05, octaves: 6, oscillator: { type: "sine" }, envelope: { attack: 0.0001, decay: 0.32, sustain: 0.01, release: 0.12 } }).connect(cGains.drums),
                        snare: new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.0001, decay: 0.18, sustain: 0 } }).connect(cGains.drums),
                        hihat: new Tone.MetalSynth({ frequency: 950, envelope: { attack: 0.0005, decay: 0.02, release: 0.01 }, harmonicity: 5.1, modulationIndex: 32, resonance: 7200, octaves: 1.4 }).connect(cGains.drums),
                        tambourine: new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.001, decay: 0.08, sustain: 0 } }).connect(cGains.drums),
                        woodHit: new Tone.MembraneSynth({ pitchDecay: 0.01, octaves: 2, oscillator: { type: "sine" }, envelope: { attack: 0.0001, decay: 0.05, sustain: 0 } }).connect(cGains.drums)
                    },
                    reverb, vibrato
                };

                return () => { Tone.Transport.stop(); Tone.Transport.cancel(); };
            }, [guitarType, vibratoDepth, noteLengthMode, masterBassBoost, masterVolume, reverbWet]);

            React.useEffect(() => {
                const interval = setInterval(() => {
                    setScreensaverPos({
                        x: Math.floor(5 + Math.random() * 75),
                        y: Math.floor(10 + Math.random() * 70)
                    });
                }, 6000);
                return () => clearInterval(interval);
            }, []);

            React.useEffect(() => {
                Tone.Transport.bpm.value = bpm;
                Tone.Transport.cancel();

                if (playing) {
                    let stepCounter = 0;
                    loopRef.current = new Tone.Loop(time => {
                        let step = stepCounter % TOTAL_STEPS;
                        const bar = Math.floor(step / BAR_STEPS);
                        const sInBar = step % BAR_STEPS;

                        setCurrentStep(sInBar);
                        setCurrentBar(bar);

                        if (sInBar === 0) {
                            setPowerUsage(Math.floor(20 + Math.random() * 6));
                        }

                        if (autoGraffitiActive) {
                            if (sInBar % 2 === 0) {
                                setGraffitiColorIndex(prev => (prev + 1) % GRAFFITI_7_COLORS.length);
                            }
                        }

                        const syns = synthsRef.current;
                        if (!syns) return;

                        if (sInBar % Math.max(1, Math.floor(16 / (tambourineTempo || 10))) === 0) {
                            syns.drums.tambourine.triggerAttackRelease("32n", time, 0.4);
                        }

                        Object.keys(instrumentSteps).forEach(instKey => {
                            const item = instrumentSteps[instKey][step];
                            if (!item) return;

                            const note = typeof item === "object" ? item.note : item;
                            let dur = typeof item === "object" ? (item.dur || "8n") : "8n";
                            if (noteLengthMode === "short") dur = "16n";
                            if (noteLengthMode === "long") dur = "4n";

                            if (instKey === "drums") {
                                if (typeof item === "object") {
                                    if (item.kick) {
                                        syns.drums.kick.triggerAttackRelease("C1", "8n", time);
                                        if (autoGraffitiActive) setGraffitiColorIndex(Math.floor(Math.random() * GRAFFITI_7_COLORS.length));
                                    }
                                    if (item.snare) syns.drums.snare.triggerAttackRelease("8n", time);
                                    if (item.hihat) syns.drums.hihat.triggerAttackRelease("32n", time, 0.9);
                                    if (item.woodHit) syns.drums.woodHit.triggerAttackRelease("G2", "16n", time);
                                }
                            } else if (syns[instKey]) {
                                if (Array.isArray(note)) {
                                    note.forEach((n, idx) => {
                                        syns[instKey].triggerAttackRelease(n, dur, time + idx * 0.025);
                                    });
                                } else {
                                    syns[instKey].triggerAttackRelease(note || "C4", dur, time);
                                }
                            }
                        });

                        stepCounter++;
                    }, "16n").start(0);

                    Tone.Transport.start();
                } else {
                    Tone.Transport.stop();
                }
            }, [playing, bpm, instrumentSteps, noteLengthMode, tambourineTempo, autoGraffitiActive]);

            const startVoiceRecording = async () => {
                audioChunksRef.current = [];
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const mediaRecorder = new MediaRecorder(stream);
                    mediaRecorderRef.current = mediaRecorder;

                    mediaRecorder.ondataavailable = (event) => {
                        if (event.data.size > 0) {
                            audioChunksRef.current.push(event.data);
                        }
                    };

                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                        const audioUrl = URL.createObjectURL(audioBlob);
                        const newRecording = {
                            id: Date.now(),
                            title: `Voice_Take_${voiceRecordings.length + 1}`,
                            url: audioUrl,
                            date: new Date().toLocaleString()
                        };
                        setVoiceRecordings(prev => [newRecording, ...prev]);
                        setStatus("🎙️ ボイス録音の保存が完了しました！");
                    };

                    mediaRecorder.start();
                    setIsRecording(true);
                    setStatus("🎙 マイク録音中...");
                } catch (err) {
                    alert("マイクへのアクセスが拒否されたか、デバイスが見つかりません。");
                }
            };

            const stopVoiceRecording = () => {
                if (mediaRecorderRef.current && isRecording) {
                    mediaRecorderRef.current.stop();
                    setIsRecording(false);
                }
            };

            const appendAiLyricsSection = () => {
                if (!aiPromptInput.trim()) {
                    alert("追加したいテーマや歌詞のキーワードを入力してください。");
                    return;
                }
                const newSection = `\n\n（追加章：${aiPromptInput} のビート）\n` +
                    `無限に広がるサウンドスケープの中、${aiPromptInput}の情熱がリズムとシンクロする。` +
                    `崩さない絶対の意志が、さらなる高みへと僕らを導く。micvictorydanbdanb の旗印のもと、新たな伝説が今ここに刻まれる！`;
                
                setAiLyricsText(prev => prev + newSection);
                setAiPromptInput("");
                setStatus(`📝 「${aiPromptInput}」の章をAI歌詞へ綺麗につけ足しました！`);
            };

            const currentGraffiti = GRAFFITI_7_COLORS[graffitiColorIndex];

            return (
                <div className={`min-h-screen bg-slate-950 text-slate-100 flex flex-col text-xs font-sans select-none pb-28 border-4 transition-colors duration-700 relative overflow-hidden ${currentGraffiti.bg}`}>
                    
                    <div

                            <span className="text-[9px] text-amber-400 bg-slate-950 px-1.5 py-0.5 rounded border border-slate-800">⚡{powerUsage}W</span>

                            { id: "AI_LYRICS", label: "📝 歌詞AI & Voice" },
                            { id: "ALBUM_RELEASE", label: "💿 著作権リリース" },
                            { id: "INST_CRERA", label: "📁 CRERA" },
                            { id: "GUITAR_PANEL", label: "🎸 ギター" },
                            { id: "INST_AI", label: "🤖 楽器別20メロディAI" },
                            { id: "DRUMS20", label: "🥁 ドラム20種" },
                            { id: "GRID", label: "🎛️ グリッド" },
                            { id: "MIXER", label: "🎚️ ミキサー" },

                    <div className="bg-slate-900/50 px-3 py-1 text-[10px] text-cyan-400 border-b border-slate-900 truncate z-20">

                    </div>

                    <main className="p-2 flex flex-col gap-3 z-20">
                        
                        {tab === "HUB" && (
                            <div className="flex flex-col gap-3">
                                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">

                                        <span className="text-[9px] text-slate-300">低音だけでなく美しい旋律・コードを20種から一発適用</span>
                                    </button>
                                    <button onClick={() => setTab("AI_LYRICS")} className="p-3 bg-gradient-to-r from-pink-950 to-purple-950 border border-pink-500 rounded-lg text-left shadow flex flex-col gap-1">
                                        <span className="font-bold text-pink-300 text-xs">📝 歌詞AI & Voice録音</span>
                                        <span className="text-[9px] text-slate-300">800文字アンセム＆ボイス同時録音</span>
                                    </button>
                                    <button onClick={() => setTab("ALBUM_RELEASE")} className="p-3 bg-gradient-to-r from-amber-950 to-orange-950 border border-amber-500 rounded-lg text-left shadow flex flex-col gap-1">
                                        <span className="font-bold text-amber-300 text-xs">💿 著作権フリーリリース</span>
                                        <span className="text-[9px] text-slate-300">商用利用フリー化スタンバイ</span>
                                    </button>
                                </div>
                            </div>
                        )}

                        {tab === "GRAFFITI_EQ" && (
                            <div className="bg-slate-900 border border-cyan-500/50 rounded-lg p-3 flex flex-col gap-3 shadow">
                                <div className="flex justify-between items-center flex-wrap gap-2">
                                    <span className="text-xs font-bold text-cyan-400">🎨 グラフティクイコライザー（7色自動モード）</span>
                                    <button 
                                        onClick={() => setAutoGraffitiActive(!autoGraffitiActive)}
                                        className={`px-3 py-1 font-bold rounded text-xs shadow ${autoGraffitiActive ? "bg-cyan-500 text-slate-950 animate-pulse" : "bg-slate-800 text-slate-400"}`}
                                    >
                                        {autoGraffitiActive ? "⚡ 7色自動チェンジ：ON" : "⏸ 7色自動チェンジ：OFF"}
                                    </button>
                                </div>
                                <div className="grid grid-cols-2 sm:grid-cols-7 gap-2">
                                    {GRAFFITI_7_COLORS.map((col, idx) => (
                                        <button
                                            key={col.name}
                                            onClick={() => {
                                                setGraffitiColorIndex(idx);
                                                setAutoGraffitiActive(false);
                                                setStatus(`🎨 テーマを手動で [${col.name}] に固定しました！`);
                                            }}
                                            className={`p-2.5 rounded border font-bold text-[10px] flex flex-col items-center justify-center gap-1 ${graffitiColorIndex === idx ? "bg-slate-800 text-white " + col.bg : "bg-slate-900 text-slate-400 border-slate-800"}`}
                                        >
                                            <span className={col.text}>{col.name}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        {tab === "AI_LYRICS" && (
                            <div className="bg-slate-900 border border-purple-500/50 rounded-lg p-3 flex flex-col gap-3 shadow">
                                <div className="flex justify-between items-center flex-wrap gap-2">
                                    <span className="text-xs font-bold text-purple-400">📝 歌詞 AI (800文字) ＆ 🎙️ Voice録音マネージャー</span>
                                    <button onClick={() => {
                                        navigator.clipboard.writeText(aiLyricsText);
                                        setStatus("📋 コピーしました！");
                                    }} className="px-3 py-1 bg-purple-600 text-white font-bold rounded text-[10px]">
                                        📋 歌詞をコピー
                                    </button>
                                </div>

                                <div className="bg-slate-950 p-3 rounded border border-red-500/40 flex flex-col gap-2">
                                    <div className="flex justify-between items-center flex-wrap gap-2">
                                        <span className="text-[10px] font-bold text-red-300">🎙️ ボイス録音（ボーカル・ラップ）</span>
                                        {!isRecording ? (
                                            <button onClick={startVoiceRecording} className="px-3 py-1 bg-red-600 text-white font-bold rounded text-[10px] animate-pulse">🔴 録音開始</button>
                                        ) : (
                                            <button onClick={stopVoiceRecording} className="px-3 py-1 bg-amber-500 text-slate-950 font-bold rounded text-[10px]">■ 停止＆保存</button>
                                        )}
                                    </div>
                                    <div className="flex flex-col gap-1.5 max-h-[120px] overflow-y-auto">
                                        {voiceRecordings.map(rec => (
                                            <div key={rec.id} className="flex justify-between items-center bg-slate-900 p-2 rounded border border-slate-800">
                                                <span className="text-red-300 text-[10px] font-bold">{rec.title}</span>
                                                <audio controls src={rec.url} className="h-6 w-36 sm:w-48"></audio>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div className="bg-slate-950 p-2.5 rounded border border-purple-500/30 flex flex-col gap-2">
                                    <span className="text-[10px] text-purple-300 font-bold">✨ AI歌詞の「崩さない絶対つけ足し」ジェネレーター</span>
                                    <div className="flex gap-2">
                                        <input
                                            type="text"
                                            placeholder="追加したいテーマやキーワード..."
                                            value={aiPromptInput}
                                            onChange={e => setAiPromptInput(e.target.value)}
                                            className="flex-1 bg-slate-900 text-slate-200 text-xs px-3 py-1.5 rounded border border-slate-800"
                                        />
                                        <button onClick={appendAiLyricsSection} className="px-4 py-1.5 bg-purple-600 text-white font-bold rounded text-xs shadow">+ つけ足す</button>
                                    </div>
                                </div>

                                <textarea
                                    value={aiLyricsText}
                                    onChange={e => setAiLyricsText(e.target.value)}
                                    rows="6"
                                    className="w-full bg-slate-950 text-slate-200 text-xs p-3 rounded border border-slate-800 font-mono"
                                ></textarea>
                            </div>
                        )}

                        {/* ✨ 【新機能統合】各楽器別 高音・中音映え 20種メロディAIパネル */}
                        {tab === "INST_AI" && (
                            <div className="bg-slate-900 border border-purple-600/50 rounded-lg p-3 flex flex-col gap-3 shadow">
                                <div className="flex justify-between items-center flex-wrap gap-2">
                                    <span className="text-xs font-bold text-purple-400">🤖 各楽器別 高音・中音映え「20種メロディAI」一括ジェネレーター</span>
                                    <select value={selectedInstrument} onChange={e => setSelectedInstrument(e.target.value)} className="bg-slate-950 text-purple-300 font-bold text-[10px] p-1 rounded border border-slate-800">

                                    </select>
                                </div>
                                <span className="text-[10px] text-slate-300">対象楽器: <strong className="text-amber-400">{selectedInstrument}</strong> （下のボタンから美しい高音・中音メロディをワンタッチ適用！）</span>
                                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 max-h-[350px] overflow-y-auto">
                                    {Object.keys(MELODY_PATTERNS_20).map(pKey => {
                                        const pat = MELODY_PATTERNS_20[pKey];
                                        const isSelected = activeMelodyPattern20 === Number(pKey);
                                        return (
                                            <button
                                                key={pKey}
                                                onClick={() => generateMelodyPattern20(selectedInstrument, Number(pKey))}
                                                className={`p-2.5 rounded border text-left flex flex-col gap-1 transition-all shadow ${isSelected ? "bg-purple-600 text-white border-white shadow-purple-500/50" : "bg-slate-950 text-slate-300 border-slate-800 hover:border-purple-400"}`}
                                            >
                                                <span className="text-[10px] font-black text-amber-300"># {pKey}</span>
                                                <span className="text-[10px] font-bold leading-tight">{pat.name}</span>
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>

                        {tab === "ALBUM_RELEASE" && (
                            <div className="bg-slate-900 border border-pink-500/50 rounded-lg p-3 flex flex-col gap-3 shadow">
                                <span className="text-xs font-bold text-pink-400">💿 著作権リリースアルバム販売 ＆ 宣伝ハブ</span>
                                <div className="bg-slate-950 p-4 rounded border border-slate-800 flex flex-col gap-3">
                                    <span className="text-amber-400 font-bold text-sm">MIC VICTORY DLAND OFFICIAL ALBUM</span>
                                    <span className="text-[10px] text-slate-400">公式宣伝タグ: <code className="bg-slate-900 text-cyan-300 px-1 py-0.5 rounded">micvictorydanbdanb</code></span>
                                    <span className="text-pink-400 font-bold text-xs">{albumReleaseStatus}</span>
                                    <button onClick={executeAlbumRelease} className="px-4 py-2.5 bg-gradient-to-r from-pink-600 to-purple-600 text-white font-bold rounded shadow text-xs">

                                        const takes = instrumentCreraTakes[inst.id] || [];
                                        return (
                                            <div key={inst.id} className="bg-slate-950 p-2.5 rounded border border-slate-800 flex flex-col gap-2">
                                                <div className="flex justify-between items-center border-b border-slate-900 pb-1">
                                                    <span className="text-[10px] font-bold text-slate-200">{inst.label}</span>
                                                    <button onClick={() => saveInstrumentCrera(inst.id)} className="px-2 py-0.5 bg-purple-600 text-white font-bold rounded text-[9px]">CRERAセーブ</button>
                                                </div>
                                                <div className="flex flex-col gap-1 max-h-20 overflow-y-auto">
                                                    {takes.map(t => (
                                                        <div key={t.id} className="flex justify-between items-center bg-slate-900 p-1.5 rounded">
                                                            <span className="text-amber-400 text-[9px]">{t.title}</span>
                                                            <button onClick={() => loadInstrumentCrera(inst.id, t)} className="px-2 py-0.5 bg-amber-500 text-slate-950 font-bold rounded text-[8px]">復元</button>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>

                        {tab === "GUITAR_PANEL" && (
                            <div className="bg-slate-900 border border-amber-600/50 rounded-lg p-3 flex flex-col gap-3 shadow">
                                <span className="text-xs font-bold text-amber-400">🎸 ギター設定 ＆ 極上コード</span>
                                <div className="grid grid-cols-2 sm:grid-cols-6 gap-2">
                                    {GUITAR_CHORDS.map(chord => (
                                        <button
                                            key={chord.name}
                                            onClick={() => playNote(chord.notes)}
                                            className="p-2.5 bg-slate-950 hover:bg-amber-950 border border-slate-700 rounded flex flex-col items-center justify-center gap-0.5 shadow"
                                        >
                                            <span className="text-amber-300 font-black text-xs">{chord.name}</span>
                                            <span className="text-[8px] text-slate-400">{chord.desc}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        {tab === "DRUMS20" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3 shadow">
                                <span className="text-xs font-bold text-red-400">🥁 ドラム 20パターン ＆ 木目打音</span>
                                <div className="grid grid-cols-4 sm:grid-cols-10 gap-1.5">
                                    {Array.from({ length: 20 }).map((_, idx) => {
                                        const pNum = idx + 1;
                                        return (
                                            <button key={pNum} onClick={() => applyDrumPattern20(pNum)} className={`py-2 rounded text-[10px] font-bold border ${activeDrumPattern === pNum ? "bg-red-600 text-white border-white" : "bg-slate-950 text-red-300 border-red-900/50"}`}>
                                                # {pNum}
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {tab === "GRID" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3 shadow">
                                <div className="flex justify-between items-center flex-wrap gap-2">
                                    <span className="text-xs font-bold text-cyan-400">🎛️ 手動グリッド (対象: {selectedInstrument})</span>
                                    <select value={selectedInstrument} onChange={e => setSelectedInstrument(e.target.value)} className="bg-slate-950 text-cyan-300 font-bold text-[10px] p-1 rounded">
                                        {INSTRUMENTS.map(i => <option key={i.id} value={i.id}>{i.label}</option>)}
                                    </select>
                                </div>
                                <div className="flex gap-2 overflow-x-auto pb-2 pt-1">
                                    {Array.from({ length: BARS }).map((_, barIdx) => (
                                        <div key={barIdx} className="bg-slate-950 p-2 rounded border border-slate-800 shrink-0 w-32 flex flex-col gap-1">
                                            <div className="text-[9px] font-bold text-cyan-400 text-center border-b border-slate-900 pb-0.5">Bar {barIdx + 1}</div>
                                            <div className="grid grid-cols-4 gap-1">
                                                {Array.from({ length: BAR_STEPS }).map((_, stepIdx) => {
                                                    const absoluteStep = barIdx * BAR_STEPS + stepIdx;
                                                    const stepData = instrumentSteps[selectedInstrument][absoluteStep];
                                                    const isCurrent = currentBar === barIdx && currentStep === stepIdx && playing;

                                                    return (
                                                        <button
                                                            key={stepIdx}
                                                            onClick={() => {
                                                                const arr = [...instrumentSteps[selectedInstrument]];
                                                                arr[absoluteStep] = arr[absoluteStep] ? null : { note: "C4", dur: "8n" };
                                                                setInstrumentSteps({...instrumentSteps, [selectedInstrument]: arr});
                                                            }}
                                                            className={`h-6 rounded flex items-center justify-center text-[8px] font-bold border ${isCurrent ? "ring-2 ring-pink-400" : ""} ${stepData ? "bg-cyan-500 text-slate-950 border-white" : "bg-slate-900 text-slate-600 border-slate-800"}`}
                                                        >
                                                            {stepIdx + 1}
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {tab === "MIXER" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3 shadow">
                                <span className="text-xs font-bold text-amber-400">🎚️ ミキサー ＆ エフェクト</span>
                                <div className="flex flex-col gap-3 bg-slate-950 p-3 rounded border border-slate-800">
                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-2 border-b border-slate-900 pb-2">
                                        <div className="flex flex-col gap-1">
                                            <span className="text-[9px] text-cyan-400 font-bold">マスターVol: {masterVolume.toFixed(1)}</span>
                                            <input type="range" min="0.1" max="2.0" step="0.1" value={masterVolume} onChange={e => setMasterVolume(Number(e.target.value))} />
                                        </div>
                                        <div className="flex flex-col gap-1">
                                            <span className="text-[9px] text-amber-400 font-bold">低音ブースト: {masterBassBoost}dB</span>
                                            <input type="range" min="0" max="30" step="1" value={masterBassBoost} onChange={e => setMasterBassBoost(Number(e.target.value))} />
                                        </div>
                                        <div className="flex flex-col gap-1">
                                            <span className="text-[9px] text-pink-400 font-bold">リバーブWet: {(reverbWet * 100).toFixed(0)}%</span>
                                            <input type="range" min="0" max="0.8" step="0.05" value={reverbWet} onChange={e => setReverbWet(Number(e.target.value))} />
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                        {INSTRUMENTS.map(inst => (
                                            <div key={inst.id} className="flex items-center justify-between bg-slate-900 p-2 rounded">
                                                <span className="text-[10px] text-slate-200">{inst.label}</span>
                                                <input type="range" min="-30" max="6" step="1" value={volumes[inst.id]} onChange={e => setVolumes({...volumes, [inst.id]: Number(e.target.value)})} className="w-24" />
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(getElementById_safe = document.getElementById('root')).render(<MasterSynthApp />);
    </script>
</body>
