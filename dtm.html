<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI & DRUM GROOVE SYNTHESIZER - 楽器・ドラム・AI自動作曲・記録再生</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans select-none pb-16">
    <div id="root"></div>

    <script type="text/babel">
        function MultiInstrumentApp() {
            // --- 状態管理 ---
            const [tab, setTab] = React.useState("PLAY");
            const [playing, setPlaying] = React.useState(false);
            const [isLooping, setIsLooping] = React.useState(true);
            const [flashEffect, setFlashEffect] = React.useState(false);
            const [bpm, setBpm] = React.useState(120);
            const [currentBar, setCurrentBar] = React.useState(0);
            const [currentStep, setCurrentStep] = React.useState(-1);
            const [status, setStatus] = React.useState("準備完了：ドラム・ベース・AI自動作曲スタンバイOK");

            const BARS = 18;
            const BAR_STEPS = 16;
            const TOTAL_STEPS = BARS * BAR_STEPS;

            // 楽器セレクター（ドラム、ベース、ピアノ、ギター、エレキギター、バイオリン、トランペット、ジャンベ）
            const [selectedInstrument, setSelectedInstrument] = React.useState("drums");
            const [selectedNote, setSelectedNote] = React.useState("C4");
            const [selectedDrumPart, setSelectedDrumPart] = React.useState("kick"); // kick, snare, hihat, clap

            // 各楽器・ドラムごとのステップデータ（18小節 × 16ステップ）
            const [instrumentSteps, setInstrumentSteps] = React.useState({
                drums: new Array(TOTAL_STEPS).fill(null), // kick/snare/hihatなどを内包
                bass: new Array(TOTAL_STEPS).fill(null),
                piano: new Array(TOTAL_STEPS).fill(null),
                guitar: new Array(TOTAL_STEPS).fill(null),
                electric_guitar: new Array(TOTAL_STEPS).fill(null),
                violin: new Array(TOTAL_STEPS).fill(null),
                trumpet: new Array(TOTAL_STEPS).fill(null),
                djembe: new Array(TOTAL_STEPS).fill(null),
            });

            // 記録・保存リスト
            const [songName, setSongName] = React.useState("");
            const [savedList, setSavedList] = React.useState([]);

            // 音源参照
            const synthsRef = React.useRef(null);
            const loopRef = React.useRef(null);

            const NOTES = ["C4", "D4", "E4", "F4", "G4", "A4", "B4", "C5"];
            const SOLFEGE = { "C4": "ド", "D4": "レ", "E4": "ミ", "F4": "ファ", "G4": "ソ", "A4": "ラ", "B4": "シ", "C5": "ド" };

            const INSTRUMENTS = [
                { id: "drums", label: "🥁 ドラム", color: "from-red-600 to-amber-600" },
                { id: "bass", label: "🎸 ベース", color: "from-emerald-600 to-teal-600" },
                { id: "piano", label: "🎹 ピアノ", color: "from-blue-600 to-indigo-600" },
                { id: "guitar", label: "🎸 ギター", color: "from-amber-600 to-orange-600" },
                { id: "electric_guitar", label: "⚡ エレキギター", color: "from-rose-600 to-red-700" },
                { id: "violin", label: "🎻 バイオリン", color: "from-purple-600 to-pink-600" },
                { id: "trumpet", label: "🎺 トランペット", color: "from-yellow-600 to-amber-600" },
                { id: "djembe", label: "🪘 ジャンベ", color: "from-orange-700 to-yellow-900" },
            ];

            const DRUM_PARTS = [
                { id: "kick", label: "キック (B1)" },
                { id: "snare", label: "スネア (C2)" },
                { id: "hihat", label: "ハイハット (F#2)" },
                { id: "clap", label: "クラップ (D2)" },
            ];

            // --- Tone.js 音源初期化 ---
            React.useEffect(() => {
                const masterGain = new Tone.Gain(1).toDestination();
                const reverb = new Tone.Reverb({ decay: 2.0, wet: 0.3 }).connect(masterGain);
                const delay = new Tone.FeedbackDelay({ delayTime: "8n", feedback: 0.2, wet: 0.15 }).connect(reverb);

                // ドラム用音源（MembraneSynth & NoiseSynth）
                const kickSynth = new Tone.MembraneSynth({
                    pitchDecay: 0.05, octaves: 6, oscillator: { type: "sine" },
                    envelope: { attack: 0.001, decay: 0.4, sustain: 0.01, release: 0.4 }
                }).connect(masterGain);

                const snareSynth = new Tone.NoiseSynth({
                    noise: { type: "white" },
                    envelope: { attack: 0.001, decay: 0.2, sustain: 0 }
                }).connect(reverb);

                const hihatSynth = new Tone.MetalSynth({
                    frequency: 200, envelope: { attack: 0.001, decay: 0.08, release: 0.05 },
                    harmonicity: 5.1, modulationIndex: 32, resonance: 4000, octaves: 1.5
                }).connect(masterGain);

                const clapSynth = new Tone.NoiseSynth({
                    noise: { type: "pink" },
                    envelope: { attack: 0.01, decay: 0.15, sustain: 0 }
                }).connect(reverb);

                // 各楽器用シンセ
                const pianoSynth = new Tone.Synth({
                    oscillator: { type: "sine" },
                    envelope: { attack: 0.01, decay: 0.2, sustain: 0.2, release: 0.5 }
                }).connect(delay);

                const guitarSynth = new Tone.Synth({
                    oscillator: { type: "triangle" },
                    envelope: { attack: 0.02, decay: 0.3, sustain: 0.1, release: 0.3 }
                }).connect(delay);

                const distortion = new Tone.Distortion(0.4).connect(delay);
                const electricGuitarSynth = new Tone.Synth({
                    oscillator: { type: "sawtooth" },
                    envelope: { attack: 0.005, decay: 0.2, sustain: 0.3, release: 0.2 }
                }).connect(distortion);

                const bassFilter = new Tone.Filter({ frequency: 800, type: "lowpass" }).connect(delay);
                const bassSynth = new Tone.Synth({
                    oscillator: { type: "sawtooth" },
                    envelope: { attack: 0.01, decay: 0.2, sustain: 0.4, release: 0.2 }
                }).connect(bassFilter);

                const violinSynth = new Tone.Synth({
                    oscillator: { type: "sawtooth" },
                    envelope: { attack: 0.1, decay: 0.4, sustain: 0.7, release: 0.8 }
                }).connect(delay);

                const trumpetSynth = new Tone.Synth({
                    oscillator: { type: "square" },
                    envelope: { attack: 0.05, decay: 0.2, sustain: 0.6, release: 0.2 }
                }).connect(delay);

                const djembeSynth = new Tone.MembraneSynth({
                    pitchDecay: 0.05, octaves: 4, oscillator: { type: "sine" },
                    envelope: { attack: 0.001, decay: 0.25, sustain: 0, release: 0.2 }
                }).connect(reverb);

                synthsRef.current = {
                    drums: { kick: kickSynth, snare: snareSynth, hihat: hihatSynth, clap: clapSynth },
                    bass: bassSynth,
                    piano: pianoSynth,
                    guitar: guitarSynth,
                    electric_guitar: electricGuitarSynth,
                    violin: violinSynth,
                    trumpet: trumpetSynth,
                    djembe: djembeSynth,
                    masterGain
                };

                return () => {
                    Tone.Transport.stop();
                    Tone.Transport.cancel();
                };
            }, []);

            // --- 再生ループ処理 ---
            React.useEffect(() => {
                Tone.Transport.bpm.value = bpm;
                Tone.Transport.cancel();

                if (playing) {
                    let stepCounter = 0;
                    loopRef.current = new Tone.Loop(time => {
                        const step = stepCounter % TOTAL_STEPS;
                        const bar = Math.floor(step / BAR_STEPS);
                        const sInBar = step % BAR_STEPS;

                        setCurrentStep(sInBar);
                        setCurrentBar(bar);

                        if (sInBar % 4 === 0) {
                            setFlashEffect(true);
                            setTimeout(() => setFlashEffect(false), 80);
                        }

                        const syns = synthsRef.current;
                        if (!syns) return;

                        // 各楽器・ドラムの再生
                        Object.keys(instrumentSteps).forEach(instKey => {
                            const val = instrumentSteps[instKey][step];
                            if (!val) return;

                            if (instKey === "drums") {
                                // val は {kick: true, snare: ...} のオブジェクト形式または文字列
                                if (typeof val === "object") {
                                    if (val.kick) syns.drums.kick.triggerAttackRelease("C1", "8n", time);
                                    if (val.snare) syns.drums.snare.triggerAttackRelease("8n", time);
                                    if (val.hihat) syns.drums.hihat.triggerAttackRelease("32n", time, 0.5);
                                    if (val.clap) syns.drums.clap.triggerAttackRelease("8n", time);
                                }
                            } else if (syns[instKey]) {
                                let playNote = val;
                                if (instKey === "bass") {
                                    playNote = val.replace("4", "2").replace("5", "3");
                                } else if (instKey === "djembe") {
                                    playNote = "C2";
                                }
                                syns[instKey].triggerAttackRelease(playNote, "8n", time);
                            }
                        });

                        stepCounter++;
                        if (stepCounter >= TOTAL_STEPS) {
                            if (!isLooping) {
                                setPlaying(false);
                                Tone.Transport.stop();
                            }
                        }
                    }, "16n").start(0);

                    Tone.Transport.start();
                } else {
                    Tone.Transport.stop();
                }
            }, [playing, bpm, instrumentSteps, isLooping]);

            const togglePlay = async () => {
                await Tone.start();
                setPlaying(!playing);
                setStatus(playing ? "停止しました" : "▶ グルーヴ＆ドラム再生中...");
            };

            const restartFromTop = () => {
                Tone.Transport.position = 0;
                setCurrentBar(0);
                setCurrentStep(-1);
                setStatus("頭に戻りました");
            };

            // 手動打ちトグル（楽器またはドラム）
            const toggleStep = (instKey, idx) => {
                setInstrumentSteps(prev => {
                    const currentArr = [...prev[instKey]];
                    if (instKey === "drums") {
                        const currentObj = currentArr[idx] || { kick: false, snare: false, hihat: false, clap: false };
                        const updatedObj = { ...currentObj, [selectedDrumPart]: !currentObj[selectedDrumPart] };
                        // すべてfalseならnullにする
                        const hasAny = Object.values(updatedObj).some(Boolean);
                        currentArr[idx] = hasAny ? updatedObj : null;
                    } else {
                        currentArr[idx] = currentArr[idx] ? null : selectedNote;
                    }
                    return { ...prev, [instKey]: currentArr };
                });

                // プレビュー再生
                if (synthsRef.current) {
                    Tone.start();
                    const syns = synthsRef.current;
                    if (instKey === "drums") {
                        if (selectedDrumPart === "kick") syns.drums.kick.triggerAttackRelease("C1", "8n");
                        if (selectedDrumPart === "snare") syns.drums.snare.triggerAttackRelease("8n");
                        if (selectedDrumPart === "hihat") syns.drums.hihat.triggerAttackRelease("32n");
                        if (selectedDrumPart === "clap") syns.drums.clap.triggerAttackRelease("8n");
                    } else if (syns[instKey]) {
                        let playNote = selectedNote;
                        if (instKey === "bass") playNote = selectedNote.replace("4", "2").replace("5", "3");
                        if (instKey === "djembe") playNote = "C2";
                        syns[instKey].triggerAttackRelease(playNote, "8n");
                    }
                }
            };

            // --- AI自動作曲機能 ---
            const generateAIComposition = () => {
                const newSteps = {
                    drums: new Array(TOTAL_STEPS).fill(null),
                    bass: new Array(TOTAL_STEPS).fill(null),
                    piano: new Array(TOTAL_STEPS).fill(null),
                    guitar: new Array(TOTAL_STEPS).fill(null),
                    electric_guitar: new Array(TOTAL_STEPS).fill(null),
                    violin: new Array(TOTAL_STEPS).fill(null),
                    trumpet: new Array(TOTAL_STEPS).fill(null),
                    djembe: new Array(TOTAL_STEPS).fill(null),
                };

                const chordProgression = ["C4", "A4", "F4", "G4"]; // シンプルな王道コード

                for (let s = 0; s < TOTAL_STEPS; s++) {
                    const bar = Math.floor(s / BAR_STEPS);
                    const sInBar = s % BAR_STEPS;

                    // 1. ドラム自動生成 (4つ打ち Disco/Dance ビート)
                    const isKick = sInBar % 4 === 0;
                    const isSnare = sInBar === 4 || sInBar === 12;
                    const isHihat = sInBar % 2 === 0;
                    if (isKick || isSnare || isHihat) {
                        newSteps.drums[s] = {
                            kick: isKick,
                            snare: isSnare,
                            hihat: isHihat,
                            clap: sInBar === 12
                        };
                    }

                    // 2. ベース自動生成 (グルーヴ感のあるルート弾き)
                    if (sInBar % 2 === 0) {
                        const chordIdx = Math.floor(bar / 4) % chordProgression.length;
                        newSteps.bass[s] = chordProgression[chordIdx];
                    }

                    // 3. ピアノ・メロディ自動生成
                    if (sInBar % 4 === 0 || sInBar === 6 || sInBar === 10) {
                        const chordIdx = Math.floor(bar / 4) % chordProgression.length;
                        newSteps.piano[s] = chordProgression[chordIdx];
                    }
                }

                setInstrumentSteps(newSteps);
                setStatus("✨ AI自動作曲：Soul / Disco / Dance のグルーヴ曲を生成しました！");
            };

            const clearCurrentInstrument = () => {
                setInstrumentSteps(prev => ({
                    ...prev,
                    [selectedInstrument]: new Array(TOTAL_STEPS).fill(null)
                }));
                setStatus(`🧹 ${selectedInstrument} のデータをクリアしました`);
            };

            const clearAll = () => {
                setInstrumentSteps({
                    drums: new Array(TOTAL_STEPS).fill(null),
                    bass: new Array(TOTAL_STEPS).fill(null),
                    piano: new Array(TOTAL_STEPS).fill(null),
                    guitar: new Array(TOTAL_STEPS).fill(null),
                    electric_guitar: new Array(TOTAL_STEPS).fill(null),
                    violin: new Array(TOTAL_STEPS).fill(null),
                    trumpet: new Array(TOTAL_STEPS).fill(null),
                    djembe: new Array(TOTAL_STEPS).fill(null),
                });
                setStatus("🧹 すべてのデータをクリアしました");
            };

            const saveProject = () => {
                if (!songName) { setStatus("⚠️ 曲名を入力してください"); return; }
                setSavedList([...savedList, { name: songName, time: new Date().toLocaleTimeString() }]);
                setStatus(`💾 「${songName}」を記録保存しました！`);
                setSongName("");
            };

            const currentInstObj = INSTRUMENTS.find(i => i.id === selectedInstrument);

            return (
                <div className={`min-h-screen bg-slate-950 text-slate-100 flex flex-col text-xs font-sans select-none transition-all duration-75 ${flashEffect ? "border-b-4 border-pink-500" : ""}`}>
                    
                    {/* ヘッダー */}
                    <header className="bg-slate-900 border-b border-slate-800 px-3 py-2 flex items-center justify-between gap-2 sticky top-0 z-50">
                        <div className="flex items-center gap-2">
                            <span className="font-black text-sm bg-gradient-to-r from-red-400 via-pink-500 to-cyan-400 bg-clip-text text-transparent">
                                AI & DRUM SYNTH
                            </span>
                            <span className="text-[10px] bg-slate-800 px-1.5 py-0.5 rounded text-slate-400">18小節</span>
                        </div>

                        {/* 再生 & AI自動作曲コントロール */}
                        <div className="flex items-center gap-1.5">
                            <button
                                onClick={generateAIComposition}
                                className="px-2.5 py-1 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-bold rounded text-[11px] shadow animate-pulse"
                            >
                                ✨ AI自動作曲
                            </button>
                            <button
                                onClick={() => setIsLooping(!isLooping)}
                                className={`px-2 py-1 rounded text-[10px] font-bold border ${
                                    isLooping ? "bg-cyan-950 border-cyan-700 text-cyan-300" : "bg-slate-800 border-slate-700 text-slate-400"
                                }`}
                            >
                                🔁 {isLooping ? "リピート" : "単発"}
                            </button>
                            <button
                                onClick={togglePlay}
                                className={`px-3 py-1 rounded font-bold text-xs shadow ${
                                    playing ? "bg-amber-500 text-slate-950 animate-pulse" : "bg-pink-600 text-white"
                                }`}
                            >
                                {playing ? "■ 停止" : "▶ 再生"}
                            </button>
                            <button onClick={restartFromTop} className="px-2 py-1 bg-slate-800 text-slate-200 rounded text-[11px]">
                                ⏮ 頭
                            </button>
                            <div className="flex items-center gap-1 bg-slate-950 px-2 py-0.5 rounded border border-slate-800">
                                <span className="text-[9px] text-slate-400">BPM</span>
                                <input
                                    type="number"
                                    value={bpm}
                                    onChange={e => setBpm(Math.max(40, Math.min(240, Number(e.target.value))))}
                                    className="w-10 bg-slate-900 text-center font-bold text-pink-400 rounded text-xs py-0.5"
                                />
                            </div>
                        </div>
                    </header>

                    {/* タブナビゲーション */}
                    <nav className="bg-slate-900/90 border-b border-slate-800 px-2 py-1.5 flex gap-1 overflow-x-auto">
                        {[
                            { id: "PLAY", label: "🥁 ドラム・楽器打ち込み" },
                            { id: "SAVE", label: "💾 記録・保存リスト" },
                        ].map(t => (
                            <button
                                key={t.id}
                                onClick={() => setTab(t.id)}
                                className={`px-3 py-1 rounded text-center font-bold transition-all shrink-0 ${
                                    tab === t.id ? "bg-pink-600 text-white shadow" : "bg-slate-800/60 text-slate-400 hover:text-slate-200"
                                }`}
                            >
                                {t.label}
                            </button>
                        ))}
                    </nav>

                    {/* ステータスバー */}
                    <div className="bg-slate-900/50 px-3 py-1 text-[11px] text-cyan-400 border-b border-slate-900 truncate flex items-center justify-between">
                        <span>💡 {status}</span>
                        {flashEffect && <span className="text-pink-400 font-bold animate-ping text-[9px]">⚡ ビート</span>}
                    </div>

                    {/* メイン画面 */}
                    <main className="p-2 flex flex-col gap-3">

                        {tab === "PLAY" && (
                            <>
                                {/* 楽器セレクター（ドラム・ベース・メロディ） */}
                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-2 flex flex-col gap-2">
                                    <span className="text-[11px] font-bold text-slate-300">🎵 楽器・ドラムを選択：</span>
                                    <div className="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-8 gap-1.5">
                                        {INSTRUMENTS.map(inst => (
                                            <button
                                                key={inst.id}
                                                onClick={() => setSelectedInstrument(inst.id)}
                                                className={`py-2 px-2 rounded-lg font-bold text-xs transition-all border flex items-center justify-center gap-1 shadow ${
                                                    selectedInstrument === inst.id
                                                        ? `bg-gradient-to-r ${inst.color} border-white text-white ring-2 ring-white/30`
                                                        : "bg-slate-950 border-slate-800 text-slate-400 hover:text-slate-200"
                                                }`}
                                            >
                                                {inst.label}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* ドラムパーツ選択 (ドラム選択時のみ) */}
                                {selectedInstrument === "drums" && (
                                    <div className="bg-slate-900 border border-slate-800 rounded-lg p-2.5 flex items-center gap-2">
                                        <span className="text-[11px] font-bold text-slate-300">ドラムパーツ切替:</span>
                                        <div className="flex gap-1.5 overflow-x-auto">
                                            {DRUM_PARTS.map(part => (
                                                <button
                                                    key={part.id}
                                                    onClick={() => setSelectedDrumPart(part.id)}
                                                    className={`px-3 py-1 rounded text-[11px] font-bold shrink-0 ${
                                                        selectedDrumPart === part.id ? "bg-red-600 text-white shadow" : "bg-slate-800 text-slate-300"
                                                    }`}
                                                >
                                                    {part.label}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {/* 音階選択 (楽器選択時のみ) */}
                                {selectedInstrument !== "drums" && (
                                    <div className="bg-slate-900 border border-slate-800 rounded-lg p-2.5 flex flex-wrap items-center justify-between gap-2">
                                        <div className="flex items-center gap-1.5">
                                            <span className="text-[11px] font-bold text-slate-300">音階選択:</span>
                                            <div className="flex gap-1 overflow-x-auto pb-1">
                                                {NOTES.map(n => (
                                                    <button
                                                        key={n}
                                                        onClick={() => setSelectedNote(n)}
                                                        className={`px-2.5 py-1 rounded text-[11px] font-bold shrink-0 ${
                                                            selectedNote === n ? "bg-purple-600 text-white shadow" : "bg-slate-800 text-slate-300"
                                                        }`}
                                                    >
                                                        {SOLFEGE[n]} ({n})
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* 18小節セレクター */}
                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-2 flex flex-col gap-1.5">
                                    <div className="flex items-center justify-between">
                                        <span className="text-[11px] font-bold text-slate-300">
                                            小節セレクター ({currentInstObj.label}): <strong className="text-pink-400 text-xs">{currentBar + 1}小節目</strong>
                                            {playing && <span className="ml-2 text-cyan-400 animate-pulse">▶ Step: {currentStep + 1}</span>}
                                        </span>
                                        <div className="flex gap-1">
                                            <button onClick={clearCurrentInstrument} className="px-2 py-0.5 bg-red-950/60 text-red-300 text-[10px] rounded border border-red-800">
                                                このパートをクリア
                                            </button>
                                            <button onClick={clearAll} className="px-2 py-0.5 bg-slate-800 text-slate-300 text-[10px] rounded border border-slate-700">
                                                全体クリア
                                            </button>
                                        </div>
                                    </div>
                                    <div className="flex gap-1 overflow-x-auto pb-1">
                                        {Array.from({ length: BARS }).map((_, b) => (
                                            <button
                                                key={b}
                                                onClick={() => setCurrentBar(b)}
                                                className={`w-7 h-7 shrink-0 rounded-full text-xs font-bold transition-all ${
                                                    currentBar === b ? "bg-pink-600 text-white ring-2 ring-pink-400/50" : "bg-slate-800 text-slate-400"
                                                }`}
                                            >
                                                {b + 1}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* 手動打ちグリッドマトリクス */}
                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 overflow-x-auto">
                                    <div className="flex items-center justify-between mb-2">
                                        <span className="text-xs font-bold text-pink-400">
                                            🎯 手動打ちグリッド ({currentInstObj.label} / {currentBar + 1}小節目)
                                        </span>
                                        <span className="text-[10px] text-slate-400">
                                            {selectedInstrument === "drums" 
                                                ? `編集パーツ: ${DRUM_PARTS.find(p => p.id === selectedDrumPart)?.label}`
                                                : `配置ノート: ${SOLFEGE[selectedNote]} (${selectedNote})`
                                            }
                                        </span>
                                    </div>
                                    <div className="grid gap-1.5 min-w-[480px]" style={{ gridTemplateColumns: "repeat(16, minmax(0, 1fr))" }}>
                                        {Array.from({ length: BAR_STEPS }).map((_, i) => {
                                            const stepIdx = currentBar * BAR_STEPS + i;
                                            const stepVal = instrumentSteps[selectedInstrument][stepIdx];
                                            const isCurrentPlay = playing && currentStep === i;

                                            let isActive = false;
                                            if (selectedInstrument === "drums") {
                                                isActive = stepVal && stepVal[selectedDrumPart];
                                            } else {
                                                isActive = !!stepVal;
                                            }

                                            return (
                                                <button
                                                    key={i}
                                                    onClick={() => toggleStep(selectedInstrument, stepIdx)}
                                                    className={`aspect-square w-full rounded-lg border flex flex-col items-center justify-center p-0.5 text-[9px] transition-all ${
                                                        isActive
                                                            ? "bg-gradient-to-t from-pink-600 to-purple-600 border-pink-400 text-white font-bold shadow-md shadow-pink-500/50 scale-105"
                                                            : "bg-slate-950 border-slate-800 text-slate-500 hover:border-slate-700"
                                                    } ${isCurrentPlay ? "ring-2 ring-cyan-400" : ""}`}
                                                >
                                                    <span className="font-bold">{i + 1}</span>
                                                    <span className="text-[7px] text-cyan-200">
                                                        {isActive ? (selectedInstrument === "drums" ? "打" : SOLFEGE[stepVal]) : ""}
                                                    </span>
                                                </button>
                                            );
                                        })}
                                    </div>
                                    <div className="mt-3 text-[10px] text-slate-400 leading-relaxed bg-slate-950 p-2 rounded border border-slate-800">
                                        💡 「✨ AI自動作曲」ボタンを押すだけで、一瞬でドラム・ベース・メロディが組み合わさったグルーヴ楽曲が完成します！もちろん手動でマスの書き換えやクリアも可能です。
                                    </div>
                                </div>
                            </>
                        )}

                        {tab === "SAVE" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3">
                                <div className="text-xs font-bold text-pink-400">💾 記録・保存リスト</div>
                                <div className="flex gap-2">
                                    <input 
                                        type="text" 
                                        placeholder="曲名を入力してください (例: AI Disco Funk Groove)" 
                                        value={songName} 
                                        onChange={e => setSongName(e.target.value)} 
                                        className="flex-1 bg-slate-950 border border-slate-800 rounded px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-pink-500" 
                                    />
                                    <button onClick={saveProject} className="px-4 py-1.5 bg-pink-600 hover:bg-pink-500 text-white font-bold rounded text-xs shadow">
                                        記録保存
                                    </button>
                                </div>
                                <div className="flex flex-col gap-1.5 mt-1 max-h-60 overflow-y-auto">
                                    {savedList.length === 0 ? (
                                        <span className="text-[10px] text-slate-500 text-center py-6">保存された記録はありません</span>
                                    ) : (
                                        savedList.map((s, idx) => (
                                            <div key={idx} className="bg-slate-950 px-3 py-2 rounded border border-slate-800 flex justify-between items-center text-[11px]">
                                                <span className="font-bold text-slate-200">🎵 {s.name}</span>
                                                <span className="text-slate-500 text-[10px]">{s.time}</span>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        )}

                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MultiInstrumentApp />);
    </script>
</body>
</html>
