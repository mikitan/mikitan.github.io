<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIC VICTORY - COMPLETE SYNTHESIZER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans select-none pb-20 overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        function CompleteSynthApp() {
            const [tab, setTab] = React.useState("EDITOR");
            const [playing, setPlaying] = React.useState(false);
            const [isRecording, setIsRecording] = React.useState(false);
            const [flashColor, setFlashColor] = React.useState("border-cyan-500");
            const [bpm, setBpm] = React.useState(112);
            const [currentBar, setCurrentBar] = React.useState(0);
            const [currentStep, setCurrentStep] = React.useState(-1);
            const [status, setStatus] = React.useState("🎹 鍵盤・グリッド・記憶・再生・編集・リスト完全完備！");

            const BARS = 8;
            const BAR_STEPS = 16;
            const TOTAL_STEPS = BARS * BAR_STEPS;

            const [selectedInstrument, setSelectedInstrument] = React.useState("synth");
            const [selectedNote, setSelectedNote] = React.useState("C4");
            const [selectedDrumPart, setSelectedDrumPart] = React.useState("kick");
            const [inputMode, setInputMode] = React.useState("keyboard");

            const [instrumentSteps, setInstrumentSteps] = React.useState({
                drums: new Array(TOTAL_STEPS).fill(null),
                subBass: new Array(TOTAL_STEPS).fill(null),
                bass: new Array(TOTAL_STEPS).fill(null),
                synth: new Array(TOTAL_STEPS).fill(null),
                piano: new Array(TOTAL_STEPS).fill(null),
                guitar: new Array(TOTAL_STEPS).fill(null),
                trumpet: new Array(TOTAL_STEPS).fill(null),
                violin: new Array(TOTAL_STEPS).fill(null),
            });

            const [savedLists, setSavedLists] = React.useState({});
            const [listName, setListName] = React.useState("MY_BEAT_01");

            const synthsRef = React.useRef(null);
            const loopRef = React.useRef(null);

            const NOTES = ["C4", "D4", "E4", "F4", "G4", "A4", "B4", "C5"];
            const SOLFEGE = { "C4": "ド", "D4": "レ", "E4": "ミ", "F4": "ファ", "G4": "ソ", "A4": "ラ", "B4": "シ", "C5": "ド" };

            const INSTRUMENTS = [
                { id: "drums", label: "🥁 ドラム", color: "from-red-600 to-amber-600" },
                { id: "subBass", label: "🔊 低音サブベース", color: "from-amber-600 to-orange-700" },
                { id: "bass", label: "🎸 ベース", color: "from-emerald-600 to-teal-600" },
                { id: "synth", label: "🎹 シンセ", color: "from-cyan-600 to-blue-700" },
                { id: "piano", label: "🎹 ピアノ", color: "from-blue-600 to-indigo-600" },
                { id: "guitar", label: "🎸 ギター", color: "from-orange-600 to-red-700" },
                { id: "trumpet", label: "🎺 トランペット", color: "from-yellow-500 to-amber-600" },
                { id: "violin", label: "🎻 バイオリン", color: "from-amber-600 to-yellow-700" },
            ];

            const DRUM_PARTS = [
                { id: "kick", label: "01. キック" }, { id: "snare", label: "02. スネア" },
                { id: "hihat", label: "03. ハイハット" }, { id: "openHihat", label: "04. オープンハット" },
                { id: "clap", label: "05. クラップ" }, { id: "tom", label: "06. タム" },
                { id: "crash", label: "07. クラッシュ" }, { id: "percussion", label: "08. パーカッション" }
            ];

            // 音響・シンセサイザーの初期化
            React.useEffect(() => {
                const masterGain = new Tone.Gain(1.2).toDestination();
                const reverb = new Tone.Reverb({ decay: 2.0, wet: 0.3 }).connect(masterGain);
                const delay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.25, wet: 0.2 }).connect(reverb);

                const kickSynth = new Tone.MembraneSynth({ pitchDecay: 0.05, octaves: 8, oscillator: { type: "sine" }, envelope: { attack: 0.001, decay: 0.5, sustain: 0.01, release: 0.4 } }).connect(masterGain);
                const snareSynth = new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.001, decay: 0.2, sustain: 0 } }).connect(reverb);
                const hihatSynth = new Tone.MetalSynth({ frequency: 200, envelope: { attack: 0.001, decay: 0.05, release: 0.01 }, harmonicity: 5.1, modulationIndex: 32, resonance: 4000, octaves: 1.5 }).connect(reverb);
                const openHihatSynth = new Tone.MetalSynth({ frequency: 200, envelope: { attack: 0.001, decay: 0.2, release: 0.05 }, harmonicity: 5.1, modulationIndex: 32, resonance: 4000, octaves: 1.5 }).connect(reverb);
                const clapSynth = new Tone.NoiseSynth({ noise: { type: "pink" }, envelope: { attack: 0.01, decay: 0.15, sustain: 0 } }).connect(reverb);
                const tomSynth = new Tone.MembraneSynth({ pitchDecay: 0.01, octaves: 2, oscillator: { type: "sine" }, envelope: { attack: 0.001, decay: 0.3, sustain: 0, release: 0.1 } }).connect(reverb);
                const crashSynth = new Tone.MetalSynth({ frequency: 100, envelope: { attack: 0.01, decay: 0.6, release: 0.3 }, harmonicity: 3.1, modulationIndex: 40, resonance: 3000, octaves: 2 }).connect(reverb);
                const percSynth = new Tone.Synth({ oscillator: { type: "triangle" }, envelope: { attack: 0.001, decay: 0.1, sustain: 0, release: 0.05 } }).connect(reverb);

                const subBassSynth = new Tone.MonoSynth({
                    oscillator: { type: "triangle" },
                    envelope: { attack: 0.01, decay: 0.4, sustain: 0.5, release: 0.3 }
                }).connect(masterGain);

                const bassSynth = new Tone.MonoSynth({
                    oscillator: { type: "sine" },
                    envelope: { attack: 0.02, decay: 0.3, sustain: 0.4, release: 0.2 }
                }).connect(masterGain);

                const synthLead = new Tone.Synth({ oscillator: { type: "sawtooth" }, envelope: { attack: 0.02, decay: 0.3, sustain: 0.4, release: 0.3 } }).connect(delay);
                const pianoSynth = new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.01, decay: 0.4, sustain: 0.3, release: 0.5 } }).connect(reverb);
                const guitarSynth = new Tone.Synth({ oscillator: { type: "sawtooth" }, envelope: { attack: 0.005, decay: 0.25, sustain: 0.2, release: 0.15 } }).connect(masterGain);
                const trumpetSynth = new Tone.Synth({ oscillator: { type: "sawtooth" }, envelope: { attack: 0.05, decay: 0.2, sustain: 0.6, release: 0.2 } }).connect(delay);
                const violinSynth = new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.15, decay: 0.4, sustain: 0.8, release: 0.5 } }).connect(reverb);

                synthsRef.current = {
                    drums: {
                        kick: kickSynth, snare: snareSynth, hihat: hihatSynth, openHihat: openHihatSynth,
                        clap: clapSynth, tom: tomSynth, crash: crashSynth, percussion: percSynth
                    },
                    subBass: subBassSynth, bass: bassSynth, synth: synthLead,
                    piano: pianoSynth, guitar: guitarSynth, trumpet: trumpetSynth, violin: violinSynth
                };

                return () => {
                    Tone.Transport.stop();
                    Tone.Transport.cancel();
                };
            }, []);

            // 再生ループエンジン
            React.useEffect(() => {
                Tone.Transport.bpm.value = bpm;
                Tone.Transport.cancel();

                if (playing) {
                    let stepCounter = 0;
                    loopRef.current = new Tone.Loop(time => {
                        let step = stepCounter % TOTAL_STEPS;
                        const bar = Math.floor(step / BAR_STEPS);
                        const sInBar = step % BAR_STEPS;

                        setCurrentStep(sInBar);
                        setCurrentBar(bar);

                        if (sInBar % 2 === 0) {
                            const colors = ["border-pink-500", "border-cyan-400", "border-yellow-400", "border-purple-500"];
                            setFlashColor(colors[Math.floor(Math.random() * colors.length)]);
                        }

                        const syns = synthsRef.current;
                        if (!syns) return;

                        Object.keys(instrumentSteps).forEach(instKey => {
                            const val = instrumentSteps[instKey][step];
                            if (!val) return;

                            if (instKey === "drums") {
                                if (typeof val === "object") {
                                    Object.keys(val).forEach(partKey => {
                                        if (val[partKey] && syns.drums[partKey]) {
                                            if (partKey === "kick") syns.drums.kick.triggerAttackRelease("C1", "8n", time);
                                            else if (partKey === "tom") syns.drums.tom.triggerAttackRelease("G2", "8n", time);
                                            else syns.drums[partKey].triggerAttackRelease("8n", time);
                                        }
                                    });
                                }
                            } else if (instKey === "subBass") {
                                syns.subBass.triggerAttackRelease(typeof val === "string" ? val : "C1", "8n", time);
                            } else if (syns[instKey]) {
                                syns[instKey].triggerAttackRelease(typeof val === "string" ? val : "C4", "8n", time);
                            }
                        });

                        stepCounter++;
                    }, "16n").start(0);

                    Tone.Transport.start();
                } else {
                    Tone.Transport.stop();
                }
            }, [playing, bpm, instrumentSteps]);

            const togglePlay = async () => {
                await Tone.start();
                setPlaying(!playing);
                setStatus(playing ? "⏸️ 停止しました" : `▶ 再生中 (BPM: ${bpm})`);
            };

            const toggleRecord = async () => {
                await Tone.start();
                setIsRecording(!isRecording);
                setStatus(!isRecording ? "🔴 リアルタイム記録ON！鍵盤演奏が自動で打ち込まれます" : "⏹️ 記録OFF");
            };

            // グリッドのセル切替（直接打ち込み・編集）
            const toggleStep = (instKey, idx) => {
                setInstrumentSteps(prev => {
                    const currentArr = [...prev[instKey]];
                    if (instKey === "drums") {
                        const currentObj = currentArr[idx] || {};
                        const updatedObj = { ...currentObj, [selectedDrumPart]: !currentObj[selectedDrumPart] };
                        const hasAny = Object.values(updatedObj).some(Boolean);
                        currentArr[idx] = hasAny ? updatedObj : null;
                    } else if (instKey === "subBass") {
                        currentArr[idx] = currentArr[idx] ? null : "C1";
                    } else {
                        currentArr[idx] = currentArr[idx] ? null : selectedNote;
                    }
                    return { ...prev, [instKey]: currentArr };
                });
            };

            const clearInstrument = (instKey) => {
                setInstrumentSteps(prev => ({ ...prev, [instKey]: new Array(TOTAL_STEPS).fill(null) }));
                setStatus(`🗑️ 【${instKey}】をクリアしました`);
            };

            const clearAll = () => {
                const empty = {};
                Object.keys(instrumentSteps).forEach(k => { empty[k] = new Array(TOTAL_STEPS).fill(null); });
                setInstrumentSteps(empty);
                setStatus("🧹 すべてのデータを完全クリアしました");
            };

            // ドレミファ鍵盤演奏
            const playKeyboardNote = (note) => {
                setSelectedNote(note);
                const syns = synthsRef.current;
                if (!syns) return;

                if (selectedInstrument === "drums") {
                    const drumSyn = syns.drums[selectedDrumPart];
                    if (drumSyn) {
                        if (selectedDrumPart === "kick") drumSyn.triggerAttackRelease("C1", "8n");
                        else if (selectedDrumPart === "tom") drumSyn.triggerAttackRelease("G2", "8n");
                        else drumSyn.triggerAttackRelease("8n");
                    }
                } else if (selectedInstrument === "subBass") {
                    syns.subBass.triggerAttackRelease("C1", "8n");
                } else if (syns[selectedInstrument]) {
                    syns[selectedInstrument].triggerAttackRelease(note, "8n");
                }

                if (isRecording && currentStep !== -1) {
                    const stepIdx = currentBar * BAR_STEPS + currentStep;
                    toggleStep(selectedInstrument, stepIdx);
                }
            };

            // AI自動生成（ベースやメロディ）
            const generateAI = (instKey) => {
                const scales = ["C4", "D4", "E4", "G4", "A4", "C5"];
                const arr = new Array(TOTAL_STEPS).fill(null);
                for (let s = 0; s < TOTAL_STEPS; s++) {
                    const sInBar = s % BAR_STEPS;
                    if (instKey === "drums") {
                        arr[s] = { kick: sInBar % 4 === 0, snare: sInBar === 4 || sInBar === 12, hihat: sInBar % 2 === 0 };
                    } else if (instKey === "subBass") {
                        if (sInBar % 4 === 0) arr[s] = "C1";
                    } else if (sInBar % 2 === 0) {
                        arr[s] = scales[Math.floor(Math.random() * scales.length)];
                    }
                }
                setInstrumentSteps(prev => ({ ...prev, [instKey]: arr }));
                setStatus(`✨ 【${instKey}】のAI自動作曲を作成しました！`);
            };

            // 記憶・リスト管理
            const saveToList = () => {
                setSavedLists({ ...savedLists, [listName]: JSON.parse(JSON.stringify(instrumentSteps)) });
                setStatus(`💾 リスト「${listName}」に記憶・保存しました！`);
            };

            const loadFromList = (name) => {
                if (savedLists[name]) {
                    setInstrumentSteps(JSON.parse(JSON.stringify(savedLists[name])));
                    setStatus(`📂 リスト「${name}」を読み込みました！`);
                }
            };

            const currentInstObj = INSTRUMENTS.find(i => i.id === selectedInstrument);

            return (
                <div className={`min-h-screen bg-slate-950 text-slate-100 flex flex-col text-xs font-sans select-none border-8 transition-all duration-75 ${flashColor}`}>
                    
                    {/* ヘッダーバー */}
                    <header className="bg-slate-900 border-b border-slate-800 px-3 py-2 flex items-center justify-between gap-2 sticky top-0 z-50 shadow-lg">
                        <span className="font-black text-sm bg-gradient-to-r from-amber-400 via-pink-400 to-cyan-400 bg-clip-text text-transparent">
                            MIC VICTORY <span className="text-[10px] text-amber-400 font-normal">COMPLETE</span>
                        </span>

                        <div className="flex items-center gap-1.5 flex-wrap">
                            <button onClick={togglePlay} className={`px-3 py-1 rounded font-bold text-xs shadow ${playing ? "bg-amber-400 text-slate-950 animate-bounce" : "bg-pink-600 text-white"}`}>
                                {playing ? "■ 停止" : "▶ 再生"}
                            </button>
                            <button onClick={toggleRecord} className={`px-3 py-1 rounded font-bold text-xs shadow ${isRecording ? "bg-red-600 text-white animate-pulse" : "bg-slate-800 text-red-400 border border-red-800"}`}>
                                {isRecording ? "🔴 記録中" : "⏺️ 記録"}
                            </button>
                            <button onClick={clearAll} className="px-2.5 py-1 bg-red-950 hover:bg-red-900 text-red-300 rounded font-bold text-xs border border-red-800">
                                🧹 全クリア
                            </button>
                            <div className="flex items-center gap-1 bg-slate-950 px-2 py-0.5 rounded border border-slate-800">
                                <span className="text-[9px] text-slate-400">BPM</span>
                                <input type="number" value={bpm} onChange={e => setBpm(Math.max(60, Math.min(220, Number(e.target.value))))} className="w-12 bg-slate-900 text-center font-bold text-pink-400 rounded text-xs py-0.5" />
                            </div>
                        </div>
                    </header>

                    {/* タブナビゲーション */}
                    <nav className="bg-slate-900/90 border-b border-slate-800 px-2 py-1.5 flex gap-1 overflow-x-auto">
                        {[
                            { id: "EDITOR", label: "🎛️ 鍵盤＆グリッド編集" },
                            { id: "LISTS", label: "💾 記憶・リスト切替" },
                        ].map(t => (
                            <button key={t.id} onClick={() => setTab(t.id)} className={`px-4 py-1.5 rounded text-center font-bold transition-all shrink-0 ${tab === t.id ? "bg-amber-500 text-slate-950 shadow" : "bg-slate-800/60 text-slate-400"}`}>
                                {t.label}
                            </button>
                        ))}
                    </nav>

                    <div className="bg-slate-900/50 px-3 py-1 text-[11px] text-cyan-400 border-b border-slate-900">
                        <span>💡 {status}</span>
                    </div>

                    <main className="p-2 flex flex-col gap-3 max-w-4xl mx-auto w-full">

                        {tab === "EDITOR" && (
                            <div className="flex flex-col gap-3">
                                {/* 楽器選択 */}
                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-2.5 shadow">
                                    <div className="flex justify-between items-center flex-wrap gap-2">
                                        <span className="text-xs font-bold text-pink-400">① 楽器の選択</span>
                                        <div className="flex gap-1">
                                            <button onClick={() => generateAI(selectedInstrument)} className="px-2.5 py-1 bg-purple-950 hover:bg-purple-900 text-purple-300 font-bold rounded text-[10px] border border-purple-800">✨ AI自動作曲</button>
                                            <button onClick={() => clearInstrument(selectedInstrument)} className="px-2.5 py-1 bg-red-950 hover:bg-red-900 text-red-300 font-bold rounded text-[10px] border border-red-800">🗑️ クリア</button>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-1.5">
                                        {INSTRUMENTS.map(inst => (
                                            <button key={inst.id} onClick={() => setSelectedInstrument(inst.id)} className={`py-2 px-2 rounded-lg font-bold text-[11px] transition-all border flex items-center justify-center gap-1 shadow ${selectedInstrument === inst.id ? `bg-gradient-to-r ${inst.color} border-white text-white ring-2 ring-white/30` : "bg-slate-950 border-slate-800 text-slate-400"}`}>
                                                {inst.label}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {selectedInstrument === "drums" && (
                                    <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-2 shadow">
                                        <span className="text-xs font-bold text-amber-400">🥁 ドラムパーツ選択</span>
                                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-1.5">
                                            {DRUM_PARTS.map(part => (
                                                <button key={part.id} onClick={() => setSelectedDrumPart(part.id)} className={`px-2 py-1.5 rounded font-bold text-[10px] text-center transition-all border ${selectedDrumPart === part.id ? "bg-amber-500 text-slate-950 border-white shadow" : "bg-slate-900 text-slate-300 border-slate-800 hover:bg-slate-800"}`}>
                                                    {part.label}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {/* 入力切り替え（ドレミファ鍵盤 ＆ 直接グリッド） */}
                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3 shadow">
                                    <div className="flex justify-between items-center flex-wrap gap-2">
                                        <span className="text-xs font-bold text-cyan-400">② 入力方法 ({currentInstObj.label})</span>
                                        <div className="flex gap-1.5 items-center">
                                            <button onClick={() => setInputMode("keyboard")} className={`px-3 py-1 rounded text-[10px] font-bold ${inputMode === "keyboard" ? "bg-cyan-600 text-white" : "bg-slate-800 text-slate-400"}`}>ドレミファ鍵盤</button>
                                            <button onClick={() => setInputMode("grid")} className={`px-3 py-1 rounded text-[10px] font-bold ${inputMode === "grid" ? "bg-cyan-600 text-white" : "bg-slate-800 text-slate-400"}`}>直接グリッド打ち込み</button>
                                        </div>
                                    </div>

                                    {/* ドレミファ鍵盤 */}
                                    {inputMode === "keyboard" && (
                                        <div className="bg-slate-950 border border-slate-800 rounded p-3 flex flex-col gap-2">
                                            {selectedInstrument === "drums" ? (
                                                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                                                    {DRUM_PARTS.map(part => (
                                                        <button key={part.id} onClick={() => { setSelectedDrumPart(part.id); playKeyboardNote("C4"); }} className={`py-4 px-2 rounded font-bold flex items-center justify-center border transition-all active:scale-95 ${selectedDrumPart === part.id ? "bg-amber-500 text-slate-950 border-white ring-2 ring-white" : "bg-slate-900 text-slate-200 border-slate-800"}`}>
                                                            <span>{part.label}</span>
                                                        </button>
                                                    ))}
                                                </div>
                                            ) : (
                                                <div className="grid grid-cols-8 gap-1.5">
                                                    {NOTES.map(note => (
                                                        <button key={note} onClick={() => playKeyboardNote(note)} className={`py-6 rounded font-bold flex flex-col items-center justify-center gap-1 border transition-all active:scale-95 ${selectedNote === note ? "bg-amber-500 text-slate-950 border-white ring-2 ring-white shadow-lg" : "bg-slate-900 text-slate-200 border-slate-800 hover:bg-slate-800"}`}>
                                                            <span className="text-base font-black">{SOLFEGE[note]}</span>
                                                            <span className="text-[9px] text-slate-400">{note}</span>
                                                        </button>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    )}

                                    {/* 直接グリッド打ち込み・編集 */}
                                    {inputMode === "grid" && (
                                        <div className="flex flex-col gap-2 bg-slate-950 p-3 rounded border border-slate-800">
                                            <div className="flex items-center justify-between">
                                                <span className="text-[11px] font-bold text-slate-300">小節選択: <strong className="text-pink-400">{currentBar + 1} / 8小節</strong></span>
                                                <div className="flex gap-1">
                                                    {Array.from({ length: BARS }).map((_, b) => (
                                                        <button key={b} onClick={() => setCurrentBar(b)} className={`w-7 h-7 rounded-full text-xs font-bold ${currentBar === b ? "bg-amber-500 text-slate-950" : "bg-slate-800 text-slate-400"}`}>{b + 1}</button>
                                                    ))}
                                                </div>
                                            </div>

                                            <div className="overflow-x-auto py-1">
                                                <div className="grid gap-1 min-w-[540px]" style={{ gridTemplateColumns: "repeat(16, minmax(0, 1fr))" }}>
                                                    {Array.from({ length: BAR_STEPS }).map((_, i) => {
                                                        const stepIdx = currentBar * BAR_STEPS + i;
                                                        const stepVal = instrumentSteps[selectedInstrument][stepIdx];
                                                        const isCurrentPlay = playing && currentStep === i;
                                                        let isActive = selectedInstrument === "drums" ? (stepVal && stepVal[selectedDrumPart]) : !!stepVal;

                                                        return (
                                                            <button key={i} onClick={() => toggleStep(selectedInstrument, stepIdx)} className={`aspect-[3/4] w-full rounded border flex flex-col items-center justify-center text-[9px] transition-all ${isActive ? "bg-gradient-to-t from-amber-600 to-pink-600 border-white text-white font-bold shadow-md shadow-pink-500/50 scale-105" : "bg-slate-900 border-slate-800 text-slate-500"} ${isCurrentPlay ? "ring-2 ring-cyan-400" : ""}`}>
                                                                <span className="font-bold text-[10px]">{i + 1}</span>
                                                            </button>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {tab === "LISTS" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-4 flex flex-col gap-3">
                                <span className="text-xs font-bold text-emerald-400">💾 セッションの記憶・リスト切替</span>
                                <div className="flex gap-2 bg-slate-950 p-3 rounded border border-slate-800">
                                    <input type="text" value={listName} onChange={e => setListName(e.target.value)} className="bg-slate-900 px-2 py-1.5 rounded text-slate-100 flex-1 border border-slate-800 text-xs" />
                                    <button onClick={saveToList} className="px-4 py-1.5 bg-emerald-600 text-white font-bold rounded text-xs">記憶する</button>
                                </div>
                                <div className="flex flex-col gap-2 bg-slate-950 p-3 rounded border border-slate-800 max-h-[260px] overflow-y-auto">
                                    {Object.keys(savedLists).length === 0 && (
                                        <span className="text-[11px] text-slate-500 text-center py-4">記憶されたリストはありません</span>
                                    )}
                                    {Object.keys(savedLists).map(name => (
                                        <div key={name} className="flex justify-between items-center bg-slate-900 p-2.5 rounded border border-slate-800">
                                            <span className="font-bold text-cyan-400 text-xs">{name}</span>
                                            <button onClick={() => loadFromList(name)} className="px-3 py-1 bg-cyan-600 text-white rounded text-[10px] font-bold">切替ロード</button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<CompleteSynthApp/>);
    </script>
</body>
</html>
