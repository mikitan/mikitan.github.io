<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIC VICTORY - DLAND 20-INSTRUMENT OVERDUB & GRAFFITI TACHOGRAPH v57.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        @keyframes flashRainbow {
            0% { border-color: #ef4444; box-shadow: 0 0 20px rgba(239, 68, 68, 0.6); }
            25% { border-color: #f59e0b; box-shadow: 0 0 20px rgba(245, 158, 11, 0.6); }
            50% { border-color: #10b981; box-shadow: 0 0 20px rgba(16, 185, 129, 0.6); }
            75% { border-color: #06b6d4; box-shadow: 0 0 20px rgba(6, 182, 212, 0.6); }
            100% { border-color: #a855f7; box-shadow: 0 0 20px rgba(168, 85, 247, 0.6); }
        }
        .illumi-flash {
            animation: flashRainbow 1.2s infinite linear;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans select-none pb-28 overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        function MicVictoryDlandApp() {
            const [tab, setTab] = React.useState("INSTRUMENT_20");
            const [playing, setPlaying] = React.useState(false);
            const [illumiFlashActive, setIllumiFlashActive] = React.useState(false);
            const [manualRecActive, setManualRecActive] = React.useState(true);
            const [bpm, setBpm] = React.useState(116);
            const [playbackRate, setPlaybackRate] = React.useState(1.0);
            const [currentBar, setCurrentBar] = React.useState(0);
            const [currentStep, setCurrentStep] = React.useState(-1);
            const [status, setStatus] = React.useState("✨ MIC VICTORY DLAND v57.0 20入＋手動グリッド＋タコグラフ起動");

            const BARS = 8;
            const BAR_STEPS = 16;
            const TOTAL_STEPS = BARS * BAR_STEPS;

            // 画面画像準拠の楽器リスト（ドラム20入り＋各楽器20入り/ベース/シンセ等）
            const ALL_INSTRUMENTS = [
                { id: "drums20", label: "🥁 ドラム(20入パレット)", color: "from-red-600 to-amber-600", group: "drums" },
                { id: "subBass", label: "🔊 重低音ベース", color: "from-amber-600 to-orange-700", group: "bass" },
                { id: "bass20", label: "🎸 ベース(20入)", color: "from-emerald-600 to-teal-600", group: "bass" },
                { id: "synth20", label: "🎹 シンセ(20入)", color: "from-cyan-600 to-blue-700", group: "synth" },
                { id: "trumpet20", label: "🎺 トランペット(20入)", color: "from-yellow-500 to-amber-600", group: "horn" },
                { id: "guitar20", label: "🎸 エレキギター(20入)", color: "from-orange-600 to-red-700", group: "guitar" },
                { id: "djembe", label: "🪘 ジャンベ(アフリカ)", color: "from-amber-700 to-stone-700", group: "perk" },
                { id: "kalimba", label: "🎹 カリンバ(アフリカ)", color: "from-amber-500 to-yellow-600", group: "perk" },
                { id: "piano", label: "🎹 ピアノ", color: "from-blue-600 to-indigo-600", group: "keys" },
                { id: "violin", label: "🎻 バイオリン", color: "from-amber-600 to-yellow-700", group: "strings" },
                { id: "flute", label: "🪈 フルート", color: "from-teal-500 to-cyan-500", group: "wind" },
            ];

            const [selectedInstId, setSelectedInstId] = React.useState("synth20");
            const [selectedNote, setSelectedNote] = React.useState("C4");
            const [noteDuration, setNoteDuration] = React.useState("8n"); // 極短(16n), 標準(8n), 長め(4n), 超長(2n)
            const [selectedDrum20Index, setSelectedDrum20Index] = React.useState(0);
            const [selectedAiPatternNum, setSelectedAiPatternNum] = React.useState(1);
            const [creraParam, setCreraParam] = React.useState({ cutoff: 3500, resonance: 3, pitchOffset: 0 });

            // 20種類ドラムスロット定義
            const DRUM_20_SLOTS = Array.from({ length: 20 }, (_, i) => ({
                id: i, label: `D-${i+1} ${["KICK-deep", "KICK-punch", "SNARE-dry", "SNARE-tight", "CLAP-hi", "SNAP", "HH-closed", "HH-open", "TOM-low", "TOM-mid", "TOM-hi", "RIM", "COWBELL", "SHAKER", "CRASH", "RIDE", "SUB-808", "VINYL-pop", "SNAP-delay", "FX-laser"][i] || "PERK"}`
            }));

            // 各楽器データストア (TOTAL_STEPSグリッド＋AI20種保存用)
            const [instrumentSteps, setInstrumentSteps] = React.useState(() => {
                const initObj = {};
                ALL_INSTRUMENTS.forEach(inst => {
                    initObj[inst.id] = new Array(TOTAL_STEPS).fill(null);
                });
                return initObj;
            });

            // タコグラフ／グラフティ用推移ログ（直近32ステップ分の動的値保持）
            const [tachographHistory, setTachographHistory] = React.useState(Array(32).fill({ energy: 0, cutoff: 3000, activeCount: 0 }));

            const synthsRef = React.useRef(null);
            const loopRef = React.useRef(null);

            const NOTES = ["C4", "D4", "E4", "F4", "G4", "A4", "B4", "C5"];
            const SOLFEGE = { "C4": "ド", "D4": "レ", "E4": "ミ", "F4": "ファ", "G4": "ソ", "A4": "ラ", "B4": "シ", "C5": "ド" };
            const SAFE_SCALE = ["C4", "Eb4", "F4", "G4", "Bb4", "C5"];

            const DURATION_MAP = {
                "極短": "16n",
                "標準": "8n",
                "長め": "4n",
                "超長": "2n"
            };

            React.useEffect(() => {
                const masterGain = new Tone.Gain(1.1).toDestination();
                const filter = new Tone.Filter({ type: "lowpass", frequency: 3500, Q: 3 }).connect(masterGain);
                const eq = new Tone.EQ3({ low: 6, lowFrequency: 150, mid: 2, high: 3 }).connect(filter);
                const reverb = new Tone.Reverb({ decay: 1.0, wet: 0.18 }).connect(eq);

                synthsRef.current = {
                    filter, eq, reverb,
                    leadSynth: new Tone.PolySynth(Tone.Synth, {
                        oscillator: { type: "sawtooth" },
                        envelope: { attack: 0.008, decay: 0.2, sustain: 0.3, release: 0.15 }
                    }).connect(reverb),
                    subBass: new Tone.MonoSynth({
                        oscillator: { type: "sine" },
                        envelope: { attack: 0.005, decay: 0.3, sustain: 0.5, release: 0.2 }
                    }).connect(reverb),
                    drums: new Tone.MembraneSynth({ pitchDecay: 0.05, octaves: 5 }).connect(reverb),
                    noiseDrum: new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.001, decay: 0.15, sustain: 0 } }).connect(reverb),
                };

                return () => { Tone.Transport.stop(); Tone.Transport.cancel(); };
            }, []);

            // 輸送再生ループ
            React.useEffect(() => {
                const effectiveBpm = bpm * playbackRate;
                Tone.Transport.bpm.value = Math.max(30, effectiveBpm);
                Tone.Transport.cancel();

                if (playing) {
                    let stepCounter = 0;
                    loopRef.current = new Tone.Loop(time => {
                        const step = stepCounter % TOTAL_STEPS;
                        const bar = Math.floor(step / BAR_STEPS);
                        const sInBar = step % BAR_STEPS;
                        setCurrentStep(sInBar);
                        setCurrentBar(bar);

                        const syns = synthsRef.current;
                        if (!syns) return;

                        let activeCount = 0;
                        ALL_INSTRUMENTS.forEach(inst => {
                            const val = instrumentSteps[inst.id][step];
                            if (val) {
                                activeCount++;
                                const dur = val.dur || "8n";
                                const note = val.note || "C4";
                                if (inst.group === "drums" || inst.id === "drums20") {
                                    syns.drums.triggerAttackRelease("C1", "16n", time);
                                } else if (inst.id === "subBass") {
                                    syns.subBass.triggerAttackRelease("C0", dur, time);
                                } else {
                                    syns.leadSynth.triggerAttackRelease(note, dur, time);
                                }
                            }
                        });

                        // タコグラフ＆グラフティログ更新
                        setTachographHistory(prev => {
                            const next = [...prev.slice(1), {
                                energy: Math.min(100, activeCount * 14 + Math.round(Math.random() * 20)),
                                cutoff: creraParam.cutoff,
                                activeCount
                            }];
                            return next;
                        });

                        stepCounter++;
                    }, "16n").start(0);

                    Tone.Transport.start();
                } else {
                    Tone.Transport.stop();
                }
            }, [playing, bpm, playbackRate, instrumentSteps, creraParam.cutoff]);

            const togglePlay = async () => {
                await Tone.start();
                setPlaying(!playing);
                setStatus(playing ? "⏸ 停止" : `▶ 再生中 (BPM: ${Math.round(bpm * playbackRate)})`);
            };

            // 手動押しによるつけ足し演奏＆グリッド記録保持
            const triggerManualNote = (noteOrAction) => {
                const syns = synthsRef.current;
                if (!syns) return;

                const actualDur = DURATION_MAP[noteDuration] || "8n";

                if (selectedInstId === "drums20") {
                    syns.drums.triggerAttackRelease(selectedDrum20Index % 2 === 0 ? "C1" : "G1", actualDur);
                } else if (selectedInstId === "subBass") {
                    syns.subBass.triggerAttackRelease("C0", actualDur);
                } else {
                    syns.leadSynth.triggerAttackRelease(noteOrAction, actualDur);
                }

                // グリッド残し＆リアルタイムつけ足し記録
                if (manualRecActive && currentStep !== -1) {
                    const stepIdx = currentBar * BAR_STEPS + currentStep;
                    setInstrumentSteps(prev => {
                        const arr = [...prev[selectedInstId]];
                        arr[stepIdx] = { note: noteOrAction, dur: actualDur, slotId: selectedDrum20Index };
                        return { ...prev, [selectedInstId]: arr };
                    });
                }
            };

            // 各楽器20入りAIメロディ一括生成（崩れない安全スケール共存型）
            const generateAi20PatternForInstrument = (targetInstId, patternNum) => {
                setInstrumentSteps(prev => {
                    const next = { ...prev };
                    const newArr = new Array(TOTAL_STEPS).fill(null);
                    const safeScale = SAFE_SCALE;
                    const seedOffset = patternNum * 3;

                    for (let bar = 0; bar < BARS; bar++) {
                        for (let s = 0; s < BAR_STEPS; s++) {
                            const idx = bar * BAR_STEPS + s;
                            // パターン番号に応じて密度やリズム変化を変化
                            const density = 0.35 + (patternNum % 5) * 0.08;
                            if ((s + seedOffset) % 2 === 0 && Math.random() < density) {
                                const note = safeScale[(s + patternNum) % safeScale.length];
                                const durKeys = Object.keys(DURATION_MAP);
                                const durKey = durKeys[(bar + s + patternNum) % durKeys.length];
                                newArr[idx] = { note, dur: DURATION_MAP[durKey], aiPat: patternNum };
                            }
                        }
                    }
                    next[targetInstId] = newArr;
                    return next;
                });
                setStatus(`🤖 ${targetInstId} にAIパターン #${patternNum}（20入アルゴリズム）を一括生成・適用しました！`);
            };

            // 全体音楽切り替え（全体一括AIシンセシス構築）
            const switchOverallMusicStyle = (styleName) => {
                setInstrumentSteps(prev => {
                    const next = { ...prev };
                    ALL_INSTRUMENTS.forEach(inst => {
                        const arr = new Array(TOTAL_STEPS).fill(null);
                        for (let i = 0; i < TOTAL_STEPS; i++) {
                            const density = styleName === "CYBER_MIC" ? 0.45 : styleName === "AFRO_GROOVE" ? 0.38 : 0.3;
                            if (Math.random() < density) {
                                const note = SAFE_SCALE[i % SAFE_SCALE.length];
                                arr[i] = { note, dur: i % 4 === 0 ? "8n" : "16n" };
                            }
                        }
                        next[inst.id] = arr;
                    });
                    return next;
                });
                setStatus(`🌐 全体音楽スタイル [${styleName}] へ切り替え・構築完了！`);
            };

            // イルミネーションフラッシュ切替
            const toggleIllumiFlash = () => {
                setIllumiFlashActive(v => !v);
                setStatus("🌈 イルミネーションフラッシュ演出を切替ました");
            };

            // CRERAリアルタイムパラメータ調整
            const handleCreraChange = (val, key) => {
                setCreraParam(prev => {
                    const updated = { ...prev, [key]: val };
                    if (synthsRef.current && synthsRef.current.filter) {
                        synthsRef.current.filter.frequency.value = updated.cutoff;
                        synthsRef.current.filter.Q.value = updated.resonance;
                    }
                    return updated;
                });
            };

            const clearAllGrids = () => {
                const initObj = {};
                ALL_INSTRUMENTS.forEach(inst => {
                    initObj[inst.id] = new Array(TOTAL_STEPS).fill(null);
                });
                setInstrumentSteps(initObj);
                setStatus("🗑️ 全楽器グリッドを一括クリアしました");
            };

            return (
                <div className={`min-h-screen bg-slate-950 text-slate-100 flex flex-col text-xs font-sans select-none pb-28 overflow-x-hidden border-4 border-slate-900 ${illumiFlashActive ? "illumi-flash" : ""}`}>
                    {/* TOP HEADER */}
                    <header className="bg-slate-900 border-b border-slate-800 px-3 py-2 flex items-center justify-between gap-2 sticky top-0 z-40">
                        <div className="flex items-center gap-2">
                            <span className="font-black text-sm bg-gradient-to-r from-amber-400 via-pink-400 to-cyan-400 bg-clip-text text-transparent">
                                MIC VICTORY DLAND <span className="text-[10px] text-pink-400 font-bold">v57.0 20-INSTRUMENT OVERDUB & TACHOGRAPH</span>
                            </span>
                        </div>
                        <div className="flex items-center gap-1.5 flex-wrap">
                            <button onClick={() => setManualRecActive(!manualRecActive)} className={`px-2.5 py-1 rounded font-bold text-[10px] border shadow ${manualRecActive ? "bg-red-900 border-red-500 text-red-200" : "bg-slate-900 border-slate-700 text-slate-400"}`}>
                                {manualRecActive ? "🔴 手動グリッド残しON" : "⚪ 手動単発試聴"}
                            </button>
                            <button onClick={toggleIllumiFlash} className={`px-2.5 py-1 rounded font-bold text-[10px] border shadow ${illumiFlashActive ? "bg-pink-600 text-white animate-pulse" : "bg-slate-900 border-purple-500 text-purple-300"}`}>
                                🌈 イルミフラッシュ
                            </button>
                            <button onClick={togglePlay} className={`px-3 py-1 rounded font-bold text-xs shadow ${playing ? "bg-amber-400 text-slate-950 animate-bounce" : "bg-pink-600 text-white"}`}>
                                {playing ? "■ 停止" : "▶ 再生"}
                            </button>
                            <div className="flex items-center gap-1 bg-slate-950 px-2 py-0.5 rounded border border-slate-800">
                                <span className="text-[9px] text-slate-400">BPM</span>
                                <input type="number" value={Math.round(bpm * playbackRate)} onChange={e => setBpm(Number(e.target.value))} className="w-12 bg-slate-900 text-center font-bold text-pink-400 rounded text-xs py-0.5" />
                            </div>
                        </div>
                    </header>

                    {/* TABS */}
                    <nav className="bg-slate-900/90 border-b border-slate-800 px-2 py-1.5 flex gap-1 overflow-x-auto">
                        {[
                            { id: "INSTRUMENT_20", label: "🎛️ 20入楽器選択・手動グリッド記録" },
                            { id: "AI_20_ALL", label: "🤖 各楽器20入りAIメロディ一括生生成" },
                            { id: "OVERALL_SWITCH", label: "🌐 全体音楽切り替え・手動記録" },
                            { id: "CRERA_GRAPHITI", label: "🎛️ CRERA・グラフティ＆タコグラフ" },
                        ].map(t => (
                            <button key={t.id} onClick={() => setTab(t.id)} className={`px-3 py-1 rounded text-center font-bold transition-all shrink-0 ${tab === t.id ? "bg-amber-500 text-slate-950 shadow" : "bg-slate-800/60 text-slate-400"}`}>
                                {t.label}
                            </button>
                        ))}
                    </nav>

                    <div className="bg-slate-900/50 px-3 py-1 text-[11px] text-cyan-400 border-b border-slate-900 truncate flex justify-between items-center">
                        <span>💡 {status}</span>
                        {playing && <span className="text-[10px] text-cyan-300 font-mono">BAR: {currentBar + 1}/8 | STEP: {currentStep + 1}</span>}
                    </div>

                    <main className="p-2 flex flex-col gap-3">
                        {/* TAB 1: INSTRUMENT_20 & HAND GRID */}
                        {tab === "INSTRUMENT_20" && (
                            <div className="flex flex-col gap-3">
                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-2">
                                    <div className="flex justify-between items-center flex-wrap gap-2">
                                        <span className="text-xs font-bold text-pink-400">① 楽器選択（画像UI完全準拠: 20入・重低音・ジャンベ等）</span>
                                        <button onClick={clearAllGrids} className="px-2.5 py-1 bg-red-950 text-red-300 font-bold rounded text-[10px]">一括クリア</button>
                                    </div>
                                    <div className="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 gap-1.5">
                                        {ALL_INSTRUMENTS.map(inst => (
                                            <button key={inst.id} onClick={() => setSelectedInstId(inst.id)} className={`py-2 px-1 rounded-lg font-bold text-[11px] border flex items-center justify-center gap-1 shadow ${selectedInstId === inst.id ? `bg-gradient-to-r ${inst.color} border-white text-white` : "bg-slate-950 border-slate-800 text-slate-400"}`}>
                                                {inst.label}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {selectedInstId === "drums20" && (
                                    <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-2">
                                        <span className="text-xs font-bold text-red-400">🥁 ドラム 20スロット選択パレット</span>
                                        <div className="grid grid-cols-5 sm:grid-cols-10 gap-1">
                                            {DRUM_20_SLOTS.map(d => (
                                                <button key={d.id} onClick={() => setSelectedDrum20Index(d.id)} className={`p-1.5 rounded text-[9px] font-bold border truncate ${selectedDrum20Index === d.id ? "bg-red-600 text-white border-white" : "bg-slate-950 text-slate-400 border-slate-800"}`}>
                                                    {d.label}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3">
                                    <div className="flex justify-between items-center flex-wrap gap-2">
                                        <span className="text-xs font-bold text-cyan-400">② 音の長さ（短・長）調整 ＆ 手動鍵盤打刻・グリッド残し</span>
                                        <div className="flex items-center gap-1 bg-slate-950 p-1 rounded border border-slate-800">
                                            <span className="text-[10px] text-amber-400 font-bold mr-1">音長:</span>
                                            {Object.keys(DURATION_MAP).map(k => (
                                                <button key={k} onClick={() => setNoteDuration(k)} className={`px-2 py-0.5 rounded text-[10px] font-bold ${noteDuration === k ? "bg-amber-500 text-slate-950" : "bg-slate-900 text-slate-400"}`}>
                                                    {k}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-8 gap-1.5">
                                        {NOTES.map(note => (
                                            <button key={note} onMouseDown={() => triggerManualNote(note)} className="py-4 rounded font-bold text-center border shadow transition-all active:scale-95 bg-slate-950 text-slate-100 border-slate-800 hover:bg-slate-900">
                                                <div className="text-sm font-black">{SOLFEGE[note]}</div>
                                                <div className="text-[9px] opacity-70">{note}</div>
                                            </button>
                                        ))}
                                    </div>

                                    {/* 8小節(128Step)手動グリッド残しエディタ */}
                                    <div className="flex items-center justify-between bg-slate-950 p-2 rounded border border-slate-800">
                                        <span className="text-[11px] text-slate-300">小節: <strong className="text-pink-400">{currentBar + 1} / 8</strong> ({selectedInstId})</span>
                                        <div className="flex gap-1">
                                            {Array.from({ length: BARS }).map((_, b) => (
                                                <button key={b} onClick={() => setCurrentBar(b)} className={`w-6 h-6 rounded-full text-xs font-bold ${currentBar === b ? "bg-amber-500 text-slate-950" : "bg-slate-800 text-slate-400"}`}>{b + 1}</button>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="overflow-x-auto bg-slate-950 p-2 rounded border border-slate-800">
                                        <div className="grid gap-1 min-w-[500px]" style={{ gridTemplateColumns: "repeat(16, minmax(0, 1fr))" }}>
                                            {Array.from({ length: BAR_STEPS }).map((_, i) => {
                                                const stepIdx = currentBar * BAR_STEPS + i;
                                                const stepVal = instrumentSteps[selectedInstId][stepIdx];
                                                const isCurrentPlay = playing && currentStep === i;

                                                return (
                                                    <button key={i} onClick={() => {
                                                        setInstrumentSteps(prev => {
                                                            const arr = [...prev[selectedInstId]];
                                                            arr[stepIdx] = arr[stepIdx] ? null : { note: selectedNote, dur: DURATION_MAP[noteDuration] };
                                                            return { ...prev, [selectedInstId]: arr };
                                                        });
                                                    }} className={`aspect-[3/4] w-full rounded border flex flex-col items-center justify-center text-[9px] ${stepVal ? "bg-gradient-to-t from-amber-600 to-pink-600 border-white text-white font-bold" : "bg-slate-900 border-slate-800 text-slate-500"} ${isCurrentPlay ? "ring-2 ring-cyan-400" : ""}`}>
                                                        <span>{i + 1}</span>
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 2: AI_20_ALL (各楽器20入りAIメロディ生生成パレット) */}
                        {tab === "AI_20_ALL" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3">
                                <div className="flex justify-between items-center">
                                    <span className="text-xs font-bold text-amber-400">🤖 各楽器 20種類 AIパターン一括生生成（崩れない安全スケール共存型）</span>
                                    <div className="flex gap-1.5 items-center">
                                        <span className="text-[10px] text-slate-400">対象楽器:</span>
                                        <select value={selectedInstId} onChange={e => setSelectedInstId(e.target.value)} className="bg-slate-950 text-cyan-400 font-bold border border-slate-800 rounded px-2 py-1 text-xs">
                                            {ALL_INSTRUMENTS.map(i => <option key={i.id} value={i.id}>{i.label}</option>)}
                                        </select>
                                    </div>
                                </div>
                                <div className="grid grid-cols-5 sm:grid-cols-10 gap-1.5">
                                    {Array.from({ length: 20 }, (_, idx) => idx + 1).map(num => (
                                        <button key={num} onClick={() => { setSelectedAiPatternNum(num); generateAi20PatternForInstrument(selectedInstId, num); }} className={`py-3 rounded font-bold text-xs border ${selectedAiPatternNum === num ? "bg-gradient-to-r from-amber-500 to-pink-500 text-slate-950 border-white shadow" : "bg-slate-950 border-slate-800 text-slate-300 hover:bg-slate-900"}`}>
                                            #{num}
                                        </button>
                                    ))}
                                </div>
                                <div className="text-[11px] text-slate-400 bg-slate-950 p-2.5 rounded border border-slate-800">
                                    ℹ️ 指定楽器（<strong>{selectedInstId}</strong>）に対して安全スケール（C4, Eb4, F4, G4, Bb4, C5）ベースのAIパターン20種から一括生成し、手動グリッドにレイヤー反映します。
                                </div>
                            </div>
                        )}

                        {/* TAB 3: OVERALL_SWITCH (全体音楽切り替え・手動記録) */}
                        {tab === "OVERALL_SWITCH" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-4 flex flex-col gap-3">
                                <span className="text-xs font-bold text-cyan-400">🌐 全体音楽切り替え・即時手動構築プレビュー</span>
                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                                    {[
                                        { id: "CYBER_MIC", label: "⚡ CYBER MIC VICTORY (近未来ダンサブル)" },
                                        { id: "AFRO_GROOVE", label: "🪘 DLAND AFRO GROOVE (ジャンベ・リズミック)" },
                                        { id: "DEEP_SUB_BALLAD", label: "🔊 DEEP SUB & MELODY (重低音バルカナイズ)" },
                                    ].map(style => (
                                        <button key={style.id} onClick={() => switchOverallMusicStyle(style.id)} className="p-3 bg-gradient-to-r from-slate-900 to-slate-800 border border-slate-700 rounded-lg font-bold text-xs text-amber-300 hover:border-amber-400 shadow text-left">
                                            {style.label}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* TAB 4: CRERA_GRAPHITI & TACHOGRAPH */}
                        {tab === "CRERA_GRAPHITI" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-4 flex flex-col gap-4">
                                <div className="flex flex-col gap-3 bg-slate-950 p-3 rounded border border-slate-800">
                                    <span className="text-xs font-bold text-amber-400">🎛️ CRERAリアルタイム周波数・共鳴調整</span>
                                    <div className="flex flex-col gap-1">
                                        <span className="text-[11px] text-cyan-400">カットオフ周波数: {creraParam.cutoff} Hz</span>
                                        <input type="range" min="400" max="10000" step="100" value={creraParam.cutoff} onChange={e => handleCreraChange(Number(e.target.value), 'cutoff')} className="accent-amber-500" />
                                    </div>
                                    <div className="flex flex-col gap-1">
                                        <span className="text-[11px] text-pink-400">レゾナンス Q: {creraParam.resonance}</span>
                                        <input type="range" min="1" max="15" step="1" value={creraParam.resonance} onChange={e => handleCreraChange(Number(e.target.value), 'resonance')} className="accent-pink-500" />
                                    </div>
                                </div>

                                {/* グラフィティ＆タコグラフ可視化モニター */}
                                <div className="bg-slate-950 p-3 rounded border border-slate-800 flex flex-col gap-2">
                                    <div className="flex justify-between items-center">
                                        <span className="text-xs font-bold text-purple-400">📊 グラフティ＆タコグラフ（リアルタイム音圧・アクティビティ推移）</span>
                                        <span className="text-[10px] text-slate-400 font-mono">MIC VICTORY DLAND MONITOR</span>
                                    </div>
                                    <div className="h-28 bg-slate-900 rounded border border-slate-800 p-2 flex items-end gap-1">
                                        {tachographHistory.map((item, idx) => (
                                            <div key={idx} className="flex-1 flex flex-col justify-end h-full gap-[1px]">
                                                <div style={{ height: `${item.energy}%` }} className="bg-gradient-to-t from-pink-500 to-amber-400 rounded-t-[1px]" />
                                            </div>
                                        ))}
                                    </div>
                                    <div className="flex justify-between text-[9px] text-slate-500 font-mono">
                                        <span>PAST 32 STEPS</span>
                                        <span>ACTIVE SYNTH CH: {tachographHistory[tachographHistory.length - 1]?.activeCount || 0}</span>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* FOOTER COPYRIGHT */}
                    <footer className="fixed bottom-0 left-0 right-0 bg-slate-950/95 border-t border-slate-800 px-3 py-1.5 flex justify-between items-center text-[10px] text-slate-500 z-50">
                        <span>COPYRIGHT © MIC VICTORY DLAND ALL RIGHTS RESERVED.</span>
                        <span className="text-pink-400 font-bold">RELEASE v57.0</span>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<MicVictoryDlandApp />);
    </script>
</body>
</html>
