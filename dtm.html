<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MIC VICTORY v45.1 ULTRA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans select-none pb-32">
    <div id="root"></div>

    <script type="text/babel">
        function MasterSynthApp() {
            const [tab, setTab] = React.useState("SWITCH");
            const [playing, setPlaying] = React.useState(false);
            const [flashColor, setFlashColor] = React.useState("border-yellow-500");
            const [bpm, setBpm] = React.useState(110);
            const [currentBar, setCurrentBar] = React.useState(0);
            const [totalBars, setTotalBars] = React.useState(18);
            const [status, setStatus] = React.useState("✨ v45.1 エラー修正・完全版");

            const BAR_STEPS = 16;
            const getMaxSteps = () => totalBars * BAR_STEPS;

            const [selectedInst, setSelectedInst] = React.useState("subBass");
            const [selectedNote, setSelectedNote] = React.useState("C1");
            const [repeatCount, setRepeatCount] = React.useState(2);

            const METAL_FLASHES = [
                "border-yellow-400", "border-slate-300", "border-amber-500", 
                "border-zinc-400", "border-yellow-200", "border-slate-100"
            ];

            const [modes, setModes] = React.useState({
                subBass: "ai", bass: "ai", drums20: "ai", violin: "manual",
                guitar: "manual", piano: "manual", robot: "manual", djembe: "ai", synth: "ai", fx: "manual"
            });

            const [steps, setSteps] = React.useState({
                subBass: new Array(18 * BAR_STEPS).fill(null),
                bass: new Array(18 * BAR_STEPS).fill(null),
                drums20: new Array(18 * BAR_STEPS).fill(null),
                violin: new Array(18 * BAR_STEPS).fill(null),
                guitar: new Array(18 * BAR_STEPS).fill(null),
                piano: new Array(18 * BAR_STEPS).fill(null),
                robot: new Array(18 * BAR_STEPS).fill(null),
                djembe: new Array(18 * BAR_STEPS).fill(null),
                synth: new Array(18 * BAR_STEPS).fill(null),
                fx: new Array(18 * BAR_STEPS).fill(null),
            });

            const [recordings, setRecordings] = React.useState([]);
            const [isRecordingLive, setIsRecordingLive] = React.useState(false);
            const liveAudioChunks = React.useRef([]);
            const mediaRecorderRef = React.useRef(null);

            const DRUM_PARTS = [
                { id: "kick1", label: "キック1" }, { id: "kick2", label: "キック2" },
                { id: "snare1", label: "スネア1" }, { id: "snare2", label: "スネア2" },
                { id: "clap", label: "クラップ" }, { id: "hihatClosed", label: "HH閉" },
                { id: "hihatOpen", label: "HH開" }, { id: "tomHigh", label: "Hタム" },
                { id: "tomMid", label: "Mタム" }, { id: "tomLow", label: "Lタム" },
                { id: "rimshot", label: "リム" }, { id: "cowbell", label: "カウベル" },
                { id: "shaker", label: "シェイカー" }, { id: "tambourine", label: "タンバリン" },
                { id: "crash", label: "クラッシュ" }, { id: "ride", label: "ライド" }
            ];
            const [selectedDrumPart, setSelectedDrumPart] = React.useState("kick1");

            const INSTRUMENTS = [
                { id: "subBass", label: "🔊 超重低音サブベース" }, { id: "bass", label: "🎸 重低音ベース" },
                { id: "drums20", label: "🥁 ドラム20音" }, { id: "violin", label: "🎻 バイオリン" },
                { id: "guitar", label: "🎸 ギター" }, { id: "piano", label: "🎹 ピアノ" },
                { id: "robot", label: "🤖 ロボット" }, { id: "djembe", label: "🪘 アフリカ太鼓" },
                { id: "synth", label: "🎹 シンセ" }, { id: "fx", label: "✨ FX効果音" },
            ];

            const synthsRef = React.useRef(null);
            const loopRef = React.useRef(null);
            const destinationRef = React.useRef(null);

            React.useEffect(() => {
                try {
                    const dest = Tone.context.createMediaStreamDestination();
                    destinationRef.current = dest;

                    const masterGain = new Tone.Gain(2.0).toDestination();
                    masterGain.connect(dest);

                    const dist = new Tone.Distortion({ distortion: 0.4, wet: 0.3 }).connect(masterGain);
                    const rev = new Tone.Reverb({ decay: 3.0, wet: 0.25 }).connect(masterGain);

                    const d20 = {};
                    d20.kick1 = new Tone.MembraneSynth().connect(dist);
                    d20.kick2 = new Tone.MembraneSynth().connect(dist);
                    d20.snare1 = new Tone.NoiseSynth().connect(rev);
                    d20.snare2 = new Tone.NoiseSynth().connect(rev);
                    d20.clap = new Tone.NoiseSynth().connect(rev);
                    d20.hihatClosed = new Tone.MetalSynth().connect(rev);
                    d20.hihatOpen = new Tone.MetalSynth().connect(rev);

                    synthsRef.current = {
                        subBass: new Tone.MonoSynth().connect(dist),
                        bass: new Tone.MonoSynth().connect(dist),
                        drums20: d20,
                        violin: new Tone.Synth().connect(rev),
                        guitar: new Tone.Synth().connect(dist),
                        piano: new Tone.Synth().connect(rev),
                        robot: new Tone.FMSynth().connect(dist),
                        djembe: new Tone.MembraneSynth().connect(rev),
                        synth: new Tone.Synth().connect(rev),
                        fx: new Tone.Synth().connect(rev),
                    };
                } catch(e) {}
                return () => { try { Tone.Transport.stop(); Tone.Transport.cancel(); } catch(e) {} };
            }, []);

            const generateAiMelodyForInstrument = (instKey, maxS) => {
                const arr = new Array(maxS).fill(null);
                for (let s = 0; s < maxS; s++) {
                    const sInBar = s % BAR_STEPS;
                    if (instKey === "drums20") {
                        if (sInBar === 0 || sInBar === 8) arr[s] = { kick1: true };
                        if (sInBar === 4 || sInBar === 12) arr[s] = { snare1: true };
                        if (sInBar % 2 === 0) arr[s] = { ...(arr[s] || {}), hihatClosed: true };
                    } else {
                        if (sInBar % 4 === 0) arr[s] = "C1";
                    }
                }
                return arr;
            };

            const generateAllAi = () => {
                const maxS = getMaxSteps();
                const newSteps = { ...steps };
                Object.keys(newSteps).forEach(k => {
                    if (modes[k] === "ai") newSteps[k] = generateAiMelodyForInstrument(k, maxS);
                });
                setSteps(newSteps);
                setStatus("✨ 全楽器のAI連打・メロディを生成しました！");
            };

            const addNew18Bars = () => {
                const newTotal = totalBars + 18;
                setTotalBars(newTotal);
                const newMax = newTotal * BAR_STEPS;
                setSteps(prev => {
                    const updated = {};
                    Object.keys(prev).forEach(k => {
                        const oldArr = prev[k];
                        const diff = newMax - oldArr.length;
                        updated[k] = [...oldArr, ...new Array(diff).fill(null)];
                    });
                    return updated;
                });
                setStatus(`➕ 新たに18小節追加しました（計 ${newTotal} 小節）`);
            };

            const clearSingleInstrument = (instKey) => {
                setSteps(prev => ({ ...prev, [instKey]: new Array(getMaxSteps()).fill(null) }));
                setStatus(`🗑️ ${INSTRUMENTS.find(i => i.id === instKey)?.label} をクリアしました`);
            };

            const playScratch = async () => {
                try {
                    await Tone.start();
                    synthsRef.current?.drums20?.kick1?.triggerAttackRelease("C3", "16n");
                    setStatus("💿 スクラッチ発動！");
                } catch(e) {}
            };

            const toggleLiveRecording = () => {
                if (!isRecordingLive) {
                    try {
                        liveAudioChunks.current = [];
                        const recorder = new MediaRecorder(destinationRef.current.stream);
                        recorder.ondataavailable = e => { if (e.data.size > 0) liveAudioChunks.current.push(e.data); };
                        recorder.onstop = () => {
                            const blob = new Blob(liveAudioChunks.current, { type: 'audio/webm' });
                            const url = URL.createObjectURL(blob);
                            setRecordings(prev => [...prev, { id: Date.now(), url, title: `録音セッション #${prev.length + 1}` }]);
                            setStatus("💾 その場全体の録音をリストに保存しました！");
                        };
                        recorder.start();
                        mediaRecorderRef.current = recorder;
                        setIsRecordingLive(true);
                        setStatus("🔴 ライブ全体録音中...");
                    } catch(e) {
                        setStatus("⚠️ 録音に対応していないブラウザです");
                    }
                } else {
                    mediaRecorderRef.current?.stop();
                    setIsRecordingLive(false);
                }
            };

            React.useEffect(() => {
                Tone.Transport.bpm.value = bpm;
                Tone.Transport.cancel();
                if (playing) {
                    let stepCounter = 0;
                    const maxS = getMaxSteps();
                    let activeSteps = Math.floor(maxS / repeatCount);

                    loopRef.current = new Tone.Loop(time => {
                        let step = stepCounter % activeSteps;
                        setCurrentBar(Math.floor(step / BAR_STEPS) % totalBars);

                        if (step % 4 === 0) {
                            setFlashColor(METAL_FLASHES[Math.floor(Math.random() * METAL_FLASHES.length)]);
                        }

                        const syns = synthsRef.current;
                        if (!syns) return;

                        Object.keys(modes).forEach(k => {
                            const val = steps[k][step];
                            if (val) {
                                if (k === "drums20") {
                                    Object.keys(val).forEach(pk => {
                                        if (val[pk] && syns.drums20[pk]) {
                                            syns.drums20[pk].triggerAttackRelease("8n", time);
                                        }
                                    });
                                } else if (syns[k]) {
                                    try { syns[k].triggerAttackRelease(typeof val === "string" ? val : "C1", "8n", time); } catch(e) {}
                                }
                            }
                        });
                        stepCounter++;
                    }, "16n").start(0);

                    Tone.Transport.start();
                } else {
                    Tone.Transport.stop();
                }
            }, [playing, bpm, steps, modes, repeatCount, totalBars]);

            const togglePlay = async () => {
                try { await Tone.start(); } catch(e) {}
                if (!playing) generateAllAi();
                setPlaying(!playing);
            };

            const toggleStep = (instKey, idx) => {
                setSteps(prev => {
                    const arr = [...prev[instKey]];
                    if (instKey === "drums20") {
                        const obj = arr[idx] || {};
                        const upd = { ...obj, [selectedDrumPart]: !obj[selectedDrumPart] };
                        arr[idx] = Object.values(upd).some(Boolean) ? upd : null;
                    } else {
                        arr[idx] = arr[idx] ? null : selectedNote;
                    }
                    return { ...prev, [instKey]: arr };
                });
            };

            return (
                <div className={`min-h-screen bg-slate-950 text-slate-100 text-sm font-sans select-none border-4 transition-all ${flashColor}`}>
                    
                    <header className="bg-gradient-to-r from-slate-900 via-zinc-900 to-slate-900 border-b border-yellow-500/30 p-3 flex flex-wrap items-center justify-between gap-2 sticky top-0 z-50 shadow-lg shadow-yellow-500/10">
                        <span className="font-black text-base bg-gradient-to-r from-yellow-300 via-slate-200 to-yellow-500 bg-clip-text text-transparent">
                            MIC VICTORY <span className="text-xs text-yellow-400">v45.1</span>
                        </span>
                        <div className="flex items-center gap-2">
                            <button onClick={togglePlay} className={`px-4 py-2 rounded-xl font-bold text-xs shadow-md ${playing ? "bg-yellow-400 text-slate-950 animate-bounce" : "bg-gradient-to-r from-yellow-600 to-amber-700 text-white"}`}>
                                {playing ? "■ 停止" : "▶ 再生"}
                            </button>
                            <button onClick={playScratch} className="px-3 py-2 bg-gradient-to-r from-slate-300 to-slate-400 text-slate-950 font-bold rounded-xl text-xs">スクラッチ</button>
                            <button onClick={toggleLiveRecording} className={`px-3 py-2 rounded-xl font-bold text-xs border ${isRecordingLive ? "bg-red-600 text-white border-white animate-pulse" : "bg-slate-800 text-slate-200 border-slate-600"}`}>
                                {isRecordingLive ? "🔴 録音中..." : "🎙️ 全体録音"}
                            </button>
                            <input type="number" value={bpm} onChange={e => setBpm(Number(e.target.value))} className="w-14 bg-slate-900 text-center font-bold text-yellow-400 rounded-xl text-sm py-1 border border-yellow-500/40" />
                        </div>
                    </header>

                    <nav className="bg-slate-900/95 border-b border-slate-800 p-2 flex gap-2 overflow-x-auto">
                        {[
                            { id: "SWITCH", label: "🎛️ 各楽器AI・個別Clear" },
                            { id: "EDIT", label: "🎹 ドレミ・グリッド操作" },
                            { id: "REC", label: "💾 録音リスト・保存" },
                        ].map(t => (
                            <button key={t.id} onClick={() => setTab(t.id)} className={`px-4 py-2 rounded-xl text-center font-bold text-xs shrink-0 ${tab === t.id ? "bg-gradient-to-r from-yellow-500 to-amber-600 text-slate-950 shadow-md" : "bg-slate-800 text-slate-300"}`}>
                                {t.label}
                            </button>
                        ))}
                    </nav>

                    <div className="bg-slate-900 px-3 py-2 text-xs text-yellow-400 border-b border-slate-800 flex justify-between items-center">
                        <span className="truncate">💡 {status}</span>
                        <span className="text-slate-300 font-bold shrink-0 ml-2">小節: {currentBar + 1} / {totalBars}</span>
                    </div>

                    <main className="p-3 flex flex-col gap-3 max-w-4xl mx-auto">

                        {tab === "SWITCH" && (
                            <div className="bg-slate-900 border border-yellow-500/20 rounded-2xl p-3 flex flex-col gap-3 shadow-xl">
                                <div className="flex justify-between items-center">
                                    <span className="text-xs font-bold text-yellow-400">🎛️ 各楽器 連打・メロディ AI設定 ＆ 個別Clear</span>
                                    <div className="flex gap-2">
                                        <button onClick={generateAllAi} className="px-3 py-1.5 bg-yellow-500 text-slate-950 rounded-xl font-bold text-xs shadow">全AI一括生成</button>
                                        <button onClick={addNew18Bars} className="px-3 py-1.5 bg-slate-300 text-slate-950 rounded-xl font-bold text-xs shadow">+18小節追加</button>
                                    </div>
                                </div>
                                <div className="grid grid-cols-1 gap-2">
                                    {INSTRUMENTS.map(inst => {
                                        const isAi = modes[inst.id] === "ai";
                                        return (
                                            <div key={inst.id} className="bg-slate-950 px-3 py-2.5 rounded-xl border border-slate-800 flex items-center justify-between">
                                                <span className="text-xs font-bold text-white">{inst.label}</span>
                                                <div className="flex items-center gap-2">
                                                    <button onClick={() => {
                                                        const nextAi = !isAi;
                                                        setModes(p => ({ ...p, [inst.id]: nextAi ? "ai" : "manual" }));
                                                        if(nextAi) setSteps(p => ({ ...p, [inst.id]: generateAiMelodyForInstrument(inst.id, getMaxSteps()) }));
                                                    }} className={`px-4 py-1.5 rounded-xl font-bold text-xs ${isAi ? "bg-yellow-400 text-slate-950" : "bg-slate-800 text-slate-300"}`}>
                                                        {isAi ? "AI連打" : "手動"}
                                                    </button>
                                                    <button onClick={() => clearSingleInstrument(inst.id)} className="px-3 py-1.5 bg-red-950 text-red-300 rounded-xl font-bold text-xs border border-red-800">
                                                        Clear
                                                    </button>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {tab === "EDIT" && (
                            <div className="flex flex-col gap-3">
                                <div className="bg-slate-900 border border-yellow-500/20 rounded-2xl p-3 flex flex-col gap-3 shadow-xl">
                                    <span className="text-xs font-bold text-yellow-400">🎹 楽器選択 ＆ ドレミファ鍵盤記録</span>
                                    <div className="grid grid-cols-2 gap-2">
                                        {INSTRUMENTS.map(inst => (
                                            <button key={inst.id} onClick={() => setSelectedInst(inst.id)} className={`py-2 px-2 rounded-xl font-bold text-xs truncate border ${selectedInst === inst.id ? "bg-gradient-to-r from-yellow-500 to-amber-600 text-slate-950 border-white shadow" : "bg-slate-950 text-slate-300 border-slate-800"}`}>
                                                {inst.label}
                                            </button>
                                        ))}
                                    </div>

                                    {selectedInst === "drums20" && (
                                        <div className="grid grid-cols-4 gap-2 bg-slate-950 p-2 rounded-xl border border-slate-800 max-h-40 overflow-y-auto">
                                            {DRUM_PARTS.map(d => (
                                                <button key={d.id} onClick={() => setSelectedDrumPart(d.id)} className={`py-2 px-1 rounded-xl text-xs font-bold border truncate ${selectedDrumPart === d.id ? "bg-rose-600 text-white border-white" : "bg-slate-900 text-slate-300 border-slate-800"}`}>
                                                    {d.label}
                                                </button>
                                            ))}
                                        </div>
                                    )}

                                    {selectedInst !== "drums20" && (
                                        <div className="flex flex-wrap gap-1.5 bg-slate-950 p-2 rounded-xl border border-slate-800">
                                            {["C1","D1","E1","F1","G1","A1","B1","C2","D2","E2","G2","C3"].map(n => (
                                                <button key={n} onClick={() => {
                                                    setSelectedNote(n);
                                                    try { synthsRef.current?.[selectedInst]?.triggerAttackRelease(n, "8n"); } catch(e){}
                                                }} className={`px-3 py-2 rounded-xl text-xs font-bold border ${selectedNote === n ? "bg-yellow-400 text-slate-950 border-white" : "bg-slate-900 text-slate-300 border-slate-800"}`}>
                                                    {n}
                                                </button>
                                            ))}
                                        </div>
                                    )}
                                </div>

                                <div className="bg-slate-900 border border-yellow-500/20 rounded-2xl p-3 flex flex-col gap-3 shadow-xl">
                                    <div className="flex items-center justify-between">
                                        <span className="text-xs font-bold text-yellow-400">小節ナビゲーション ({totalBars}小節対応)</span>
                                    </div>
                                    <div className="flex gap-1 overflow-x-auto p-1 bg-slate-950 rounded-xl border border-slate-800">
                                        {Array.from({ length: totalBars }).map((_, b) => (
                                            <button key={b} onClick={() => setCurrentBar(b)} className={`px-3 py-1.5 rounded-xl text-xs font-bold shrink-0 ${currentBar === b ? "bg-yellow-400 text-slate-950" : "bg-slate-800 text-slate-300"}`}>
                                                {b + 1}
                                            </button>
                                        ))}
                                    </div>

                                    <div className="grid grid-cols-4 gap-2 bg-slate-950 p-3 rounded-2xl border border-slate-800">
                                        {Array.from({ length: BAR_STEPS }).map((_, i) => {
                                            const idx = currentBar * BAR_STEPS + i;
                                            const val = steps[selectedInst][idx];
                                            const active = selectedInst === "drums20" ? !!(val && val[selectedDrumPart]) : !!val;
                                            return (
                                                <button key={i} onClick={() => toggleStep(selectedInst, idx)} className={`h-16 rounded-xl border flex flex-col items-center justify-center text-sm font-bold shadow ${active ? "bg-yellow-400 border-white text-slate-950" : "bg-slate-900 border-slate-800 text-slate-400"}`}>
                                                    <span>{i + 1}</span>
                                                    {active && <span className="text-[9px] text-slate-950">ON</span>}
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        )}

                        {tab === "REC" && (
                            <div className="bg-slate-900 border border-yellow-500/20 rounded-2xl p-4 flex flex-col gap-3 shadow-xl">
                                <span className="text-xs font-bold text-yellow-400">💾 録音セッション・保存リスト</span>
                                <div className="bg-slate-950 p-3 rounded-2xl border border-slate-800 flex flex-col gap-2 min-h-[160px]">
                                    {recordings.length === 0 ? (
                                        <span className="text-xs text-slate-500 text-center py-8">「全体録音」ボタンを押して演奏を録音するとここにリスト保存されます。</span>
                                    ) : (
                                        recordings.map((rec) => (
                                            <div key={rec.id} className="bg-slate-900 p-3 rounded-xl border border-slate-800 flex items-center justify-between">
                                                <span className="text-xs font-bold text-slate-200">{rec.title}</span>
                                                <div className="flex items-center gap-2">
                                                    <audio src={rec.url} controls className="h-8 w-44"></audio>
                                                    <a href={rec.url} download={`${rec.title}.webm`} className="px-3 py-1.5 bg-yellow-500 text-slate-950 rounded-lg text-xs font-bold">DL</a>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        )}

                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<MasterSynthApp/>);
    </script>
</body>
</html>
