<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIC VICTORY - MASTER SYNTHESIZER v54.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans select-none pb-20 overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        function MasterSynthApp() {
            const [tab, setTab] = React.useState("DUAL_EDIT");
            const [playing, setPlaying] = React.useState(false);
            const [isRecording, setIsRecording] = React.useState(false);
            const [flashColor, setFlashColor] = React.useState("border-cyan-500");
            const [bpm, setBpm] = React.useState(116);
            const [currentBar, setCurrentBar] = React.useState(0);
            const [currentStep, setCurrentStep] = React.useState(-1);
            const [status, setStatus] = React.useState("✨ 各楽器別 AIメロディ自動作成機能追加！MIC VICTORY v54.0 スタジオ起動！");

            const BARS = 8;
            const BAR_STEPS = 16;
            const TOTAL_STEPS = BARS * BAR_STEPS;

            const [selectedInstrument, setSelectedInstrument] = React.useState("synth");
            const [selectedNote, setSelectedNote] = React.useState("C4");
            const [selectedDuration, setSelectedDuration] = React.useState("8n");
            const [selectedDrumPart, setSelectedDrumPart] = React.useState("kick");
            const [inputMode, setInputMode] = React.useState("grid");

            const [recordedTakes, setRecordedTakes] = React.useState([]);
            const [isVoiceRecording, setIsVoiceRecording] = React.useState(false);
            const [voiceAudioUrl, setVoiceAudioUrl] = React.useState(null);
            const mediaRecorderRef = React.useRef(null);
            const audioChunksRef = React.useRef([]);

            const [jacketTitle, setJacketTitle] = React.useState("MIC VICTORY ULTIMATE v54");
            const [savedSlots, setSavedSlots] = React.useState({});
            const [slotName, setSlotName] = React.useState("MIC_ALBUM_v54");

            const INSTRUMENTS = [
                { id: "drums", label: "🥁 ドラム", color: "from-red-600 to-amber-600" },
                { id: "subBass", label: "🔊 重低音ベース", color: "from-amber-600 to-orange-700" },
                { id: "bass", label: "🎸 ベース", color: "from-emerald-600 to-teal-600" },
                { id: "synth", label: "🎹 シンセ", color: "from-cyan-600 to-blue-700" },
                { id: "piano", label: "🎹 ピアノ", color: "from-blue-600 to-indigo-600" },
                { id: "guitar", label: "🎸 ギター", color: "from-orange-600 to-red-700" },
                { id: "trumpet", label: "🎺 トランペット", color: "from-yellow-500 to-amber-600" },
                { id: "violin", label: "🎻 バイオリン", color: "from-amber-600 to-yellow-700" },
                { id: "flute", label: "🪈 フルート", color: "from-teal-500 to-cyan-600" },
                { id: "organ", label: "🎹 オルガン", color: "from-indigo-600 to-purple-700" },
                { id: "robot", label: "🤖 ロボットFX", color: "from-purple-600 to-pink-600" },
            ];

            const [instrumentSteps, setInstrumentSteps] = React.useState({
                drums: new Array(TOTAL_STEPS).fill(null),
                subBass: new Array(TOTAL_STEPS).fill(null),
                robot: new Array(TOTAL_STEPS).fill(null),
                bass: new Array(TOTAL_STEPS).fill(null),
                piano: new Array(TOTAL_STEPS).fill(null),
                synth: new Array(TOTAL_STEPS).fill(null),
                guitar: new Array(TOTAL_STEPS).fill(null),
                trumpet: new Array(TOTAL_STEPS).fill(null),
                violin: new Array(TOTAL_STEPS).fill(null),
                flute: new Array(TOTAL_STEPS).fill(null),
                organ: new Array(TOTAL_STEPS).fill(null),
                voiceTrack: new Array(TOTAL_STEPS).fill(null),
            });

            const [volumes, setVolumes] = React.useState({
                drums: 0, subBass: 0, robot: -2, bass: 0, piano: 0, synth: 0, guitar: 0, trumpet: 0, violin: 0, flute: 0, organ: 0
            });

            const [fxSettings, setFxSettings] = React.useState({
                reverbWet: 0.35, delayWet: 0.25, chorusWet: 0.3, distortion: 0.15
            });

            const synthsRef = React.useRef(null);
            const loopRef = React.useRef(null);
            const pannerRef = React.useRef(null);
            const channelGainsRef = React.useRef({});

            const NOTES = ["C4", "D4", "E4", "F4", "G4", "A4", "B4", "C5"];
            const SOLFEGE = { "C4": "ド", "D4": "レ", "E4": "ミ", "F4": "ファ", "G4": "ソ", "A4": "ラ", "B4": "シ", "C5": "ド" };
            const DURATIONS = [
                { id: "16n", label: "短 (16分音符)" },
                { id: "8n", label: "標準 (8分音符)" },
                { id: "4n", label: "長 (4分音符)" },
                { id: "2n", label: "超長 (2分音符)" }
            ];

            const DRUM_PARTS = [
                { id: "kick", label: "キック" },
                { id: "snare", label: "スネア" },
                { id: "hihat", label: "ハイハット" },
                { id: "clap", label: "クラップ" },
            ];

            // シンセ＆エフェクト初期化
            React.useEffect(() => {
                const masterGain = new Tone.Gain(1.2).toDestination();
                const panner = new Tone.Panner(0).connect(masterGain);
                pannerRef.current = panner;

                const reverb = new Tone.Reverb({ decay: 2.3, wet: fxSettings.reverbWet }).connect(panner);
                const delay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.3, wet: fxSettings.delayWet }).connect(reverb);
                const chorus = new Tone.Chorus({ frequency: 1.5, delayTime: 3.5, depth: 0.7, wet: fxSettings.chorusWet }).connect(delay);
                const distortion = new Tone.Distortion(fxSettings.distortion).connect(chorus);

                const cGains = {};
                Object.keys(instrumentSteps).forEach(key => {
                    if (key !== "voiceTrack") {
                        const cg = new Tone.Gain(Tone.dbToGain(volumes[key] || 0)).connect(distortion);
                        cGains[key] = cg;
                    }
                });
                channelGainsRef.current = cGains;

                synthsRef.current = {
                    subBass: new Tone.MonoSynth({ oscillator: { type: "triangle" }, envelope: { attack: 0.01, decay: 0.4, sustain: 0.4, release: 0.3 } }).connect(cGains.subBass),
                    robot: new Tone.Synth({ oscillator: { type: "square" }, envelope: { attack: 0.01, decay: 0.15, sustain: 0.2, release: 0.1 } }).connect(cGains.robot),
                    bass: new Tone.MonoSynth({ oscillator: { type: "sine" }, envelope: { attack: 0.02, decay: 0.3, sustain: 0.4, release: 0.2 } }).connect(cGains.bass),
                    drums: {
                        kick: new Tone.MembraneSynth({ pitchDecay: 0.05, octaves: 8, oscillator: { type: "sine" }, envelope: { attack: 0.001, decay: 0.6, sustain: 0.01, release: 0.4 } }).connect(cGains.drums),
                        snare: new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.001, decay: 0.25, sustain: 0 } }).connect(cGains.drums),
                        hihat: new Tone.MetalSynth({ frequency: 500, envelope: { attack: 0.001, decay: 0.05, release: 0.01 }, harmonicity: 5.0, modulationIndex: 35, resonance: 6000, octaves: 2 }).connect(cGains.drums),
                        clap: new Tone.NoiseSynth({ noise: { type: "pink" }, envelope: { attack: 0.01, decay: 0.18, sustain: 0 } }).connect(cGains.drums),
                    },
                    piano: new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.01, decay: 0.4, sustain: 0.3, release: 0.6 } }).connect(cGains.piano),
                    synth: new Tone.Synth({ oscillator: { type: "sawtooth" }, envelope: { attack: 0.02, decay: 0.3, sustain: 0.4, release: 0.3 } }).connect(cGains.synth),
                    guitar: new Tone.Synth({ oscillator: { type: "sawtooth" }, envelope: { attack: 0.005, decay: 0.25, sustain: 0.2, release: 0.15 } }).connect(cGains.guitar),
                    trumpet: new Tone.Synth({ oscillator: { type: "sawtooth6" }, envelope: { attack: 0.05, decay: 0.2, sustain: 0.6, release: 0.2 } }).connect(cGains.trumpet),
                    violin: new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.15, decay: 0.4, sustain: 0.8, release: 0.5 } }).connect(cGains.violin),
                    flute: new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.08, decay: 0.3, sustain: 0.7, release: 0.4 } }).connect(cGains.flute),
                    organ: new Tone.Synth({ oscillator: { type: "square8" }, envelope: { attack: 0.01, decay: 0.1, sustain: 0.9, release: 0.1 } }).connect(cGains.organ),
                    reverb, delay, chorus, distortion
                };

                return () => { Tone.Transport.stop(); Tone.Transport.cancel(); };
            }, []);

            // 再生ループ
            React.useEffect(() => {
                Tone.Transport.bpm.value = bpm;
                Tone.Transport.cancel();

                if (playing) {
                    let stepCounter = 0;
                    loopRef.current = new Tone.Loop(time => {
                        let step = stepCounter % TOTAL_STEPS;
                        const bar = Math.floor(step / BAR_STEPS);
                        const sInBar = step % BAR_STEPS;

                        setCurrentStep(sInBar);
                        setCurrentBar(bar);

                        const syns = synthsRef.current;
                        if (!syns) return;

                        Object.keys(instrumentSteps).forEach(instKey => {
                            if (instKey === "voiceTrack") return;
                            const item = instrumentSteps[instKey][step];
                            if (!item) return;

                            const note = typeof item === "object" ? item.note : item;
                            const dur = typeof item === "object" ? (item.dur || "8n") : "8n";

                            if (instKey === "drums") {
                                if (typeof item === "object") {
                                    if (item.kick) syns.drums.kick.triggerAttackRelease("C1", "8n", time);
                                    if (item.snare) syns.drums.snare.triggerAttackRelease("8n", time);
                                    if (item.hihat) syns.drums.hihat.triggerAttackRelease("32n", time, 0.7);
                                    if (item.clap) syns.drums.clap.triggerAttackRelease("8n", time);
                                }
                            } else if (instKey === "subBass") {
                                syns.subBass.triggerAttackRelease("C1", dur, time);
                            } else if (syns[instKey]) {
                                syns[instKey].triggerAttackRelease(note || "C4", dur, time);
                            }
                        });

                        stepCounter++;
                    }, "16n").start(0);

                    Tone.Transport.start();
                } else {
                    Tone.Transport.stop();
                }
            }, [playing, bpm, instrumentSteps]);

            const togglePlay = async () => {
                await Tone.start();
                setPlaying(!playing);
                setStatus(playing ? "停止しました" : `▶ 再生中 (BPM: ${bpm})`);
            };

            const toggleRecord = async () => {
                await Tone.start();
                setIsRecording(!isRecording);
                setStatus(!isRecording ? "🔴 リアルタイム演奏録音中！" : "⏹️ 録音完了・リストに保存しました");
                if (isRecording) {
                    setRecordedTakes(prev => [...prev, { id: Date.now(), title: `テイク ${prev.length + 1}`, bpm, date: new Date().toLocaleTimeString() }]);
                }
            };

            // AI自動メロディ作成機能（各楽器別）
            const generateAiMelodyForInstrument = (instKey) => {
                const newArr = new Array(TOTAL_STEPS).fill(null);
                const scale = ["C4", "D4", "E4", "F4", "G4", "A4", "B4", "C5"];

                for (let i = 0; i < TOTAL_STEPS; i++) {
                    if (instKey === "drums") {
                        // ドラムパターン：4つ打ち＆スネアバックビート
                        const isKick = i % 4 === 0;
                        const isSnare = i % 8 === 4;
                        const isHihat = i % 2 === 0;
                        const isClap = i % 16 === 14;
                        if (isKick || isSnare || isHihat || isClap) {
                            newArr[i] = { kick: isKick, snare: isSnare, hihat: isHihat, clap: isClap };
                        }
                    } else if (instKey === "subBass" || instKey === "bass") {
                        // ベースパターン：8分音符で刻む
                        if (i % 2 === 0 && Math.random() > 0.3) {
                            newArr[i] = { note: "C4", dur: "8n" };
                        }
                    } else {
                        // メロディ楽器（シンセ・ピアノ等）：おまかせランダム自動作曲
                        if (Math.random() > 0.4) {
                            const randomNote = scale[Math.floor(Math.random() * scale.length)];
                            const dur = Math.random() > 0.5 ? "8n" : "16n";
                            newArr[i] = { note: randomNote, dur };
                        }
                    }
                }

                setInstrumentSteps(prev => ({ ...prev, [instKey]: newArr }));
                const targetInst = INSTRUMENTS.find(i => i.id === instKey);
                setStatus(`🤖 【${targetInst ? targetInst.label : instKey}】のAI自動メロディを作成しました！`);
            };

            const playNoteKeyboard = (note) => {
                setSelectedNote(note);
                const syns = synthsRef.current;
                if (!syns) return;

                if (selectedInstrument === "drums") {
                    if (selectedDrumPart === "kick") syns.drums.kick.triggerAttackRelease("C1", selectedDuration);
                    else if (selectedDrumPart === "snare") syns.drums.snare.triggerAttackRelease(selectedDuration);
                    else if (selectedDrumPart === "hihat") syns.drums.hihat.triggerAttackRelease("32n");
                    else syns.drums.clap.triggerAttackRelease(selectedDuration);
                } else if (selectedInstrument === "subBass") {
                    syns.subBass.triggerAttackRelease("C1", selectedDuration);
                } else if (syns[selectedInstrument]) {
                    syns[selectedInstrument].triggerAttackRelease(note, selectedDuration);
                }

                if (isRecording && currentStep !== -1) {
                    const stepIdx = currentBar * BAR_STEPS + currentStep;
                    toggleStepWithDuration(selectedInstrument, stepIdx, note, selectedDuration);
                }
            };

            const toggleStepWithDuration = (instKey, idx, note = selectedNote, dur = selectedDuration) => {
                setInstrumentSteps(prev => {
                    const currentArr = [...prev[instKey]];
                    if (instKey === "drums") {
                        const currentObj = currentArr[idx] || { kick: false, snare: false, hihat: false, clap: false };
                        const updatedObj = { ...currentObj, [selectedDrumPart]: !currentObj[selectedDrumPart] };
                        const hasAny = Object.values(updatedObj).some(Boolean);
                        currentArr[idx] = hasAny ? updatedObj : null;
                    } else {
                        currentArr[idx] = currentArr[idx] ? null : { note, dur };
                    }
                    return { ...prev, [instKey]: currentArr };
                });
            };

            const clearSpecificInstrument = (instKey) => {
                setInstrumentSteps(prev => ({ ...prev, [instKey]: new Array(TOTAL_STEPS).fill(null) }));
                setStatus(`🗑️ 【${instKey}】をクリアしました。`);
            };

            const startVoiceRecording = async () => {
                audioChunksRef.current = [];
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const mediaRecorder = new MediaRecorder(stream);
                    mediaRecorderRef.current = mediaRecorder;
                    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunksRef.current.push(e.data); };
                    mediaRecorder.onstop = () => {
                        const blob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                        const url = URL.createObjectURL(blob);
                        setVoiceAudioUrl(url);
                        setRecordedTakes(prev => [...prev, { id: Date.now(), title: `ボイス録音 ${prev.length + 1}`, url, date: new Date().toLocaleTimeString() }]);
                        setStatus("🎙️ ボイス録音完了・リストに追加！");
                    };
                    mediaRecorder.start();
                    setIsVoiceRecording(true);
                    setStatus("🔴 マイク録音中...");
                } catch (err) {
                    setStatus("❌ マイクエラー");
                }
            };

            const stopVoiceRecording = () => {
                if (mediaRecorderRef.current && isVoiceRecording) {
                    mediaRecorderRef.current.stop();
                    setIsVoiceRecording(false);
                }
            };

            const saveCurrentSession = () => {
                setSavedSlots({ ...savedSlots, [slotName]: JSON.parse(JSON.stringify(instrumentSteps)) });
                setStatus(`💾 セッション「${slotName}」保存完了！`);
            };

            const loadSession = (name) => {
                if (savedSlots[name]) {
                    setInstrumentSteps(JSON.parse(JSON.stringify(savedSlots[name])));
                    setStatus(`📂 セッション「${name}」ロード完了！`);
                }
            };

            const currentInstObj = INSTRUMENTS.find(i => i.id === selectedInstrument);

            return (
                <div className={`min-h-screen bg-slate-950 text-slate-100 flex flex-col text-xs font-sans select-none border-8 transition-all duration-75 ${flashColor}`}>
                    
                    {/* ヘッダー */}
                    <header className="bg-slate-900 border-b border-slate-800 px-3 py-2 flex items-center justify-between gap-2 sticky top-0 z-50 shadow-lg">
                        <div className="flex items-center gap-2">
                            <span className="font-black text-sm bg-gradient-to-r from-amber-400 via-pink-400 to-cyan-400 bg-clip-text text-transparent">
                                MIC VICTORY <span className="text-[10px] text-amber-400 font-normal">v54.0 AI STUDIO</span>
                            </span>
                        </div>

                        <div className="flex items-center gap-1.5 flex-wrap">
                            <button onClick={togglePlay} className={`px-3 py-1 rounded font-bold text-xs shadow ${playing ? "bg-amber-400 text-slate-950 animate-bounce" : "bg-pink-600 text-white"}`}>
                                {playing ? "■ 停止" : "▶ 再生"}
                            </button>
                            <button onClick={toggleRecord} className={`px-3 py-1 rounded font-bold text-xs shadow ${isRecording ? "bg-red-600 text-white animate-pulse border border-white" : "bg-slate-800 text-red-400 border border-red-800"}`}>
                                {isRecording ? "🔴 録音中..." : "⏺️ 録音"}
                            </button>
                            <div className="flex items-center gap-1 bg-slate-950 px-2 py-0.5 rounded border border-slate-800">
                                <span className="text-[9px] text-slate-400">BPM</span>
                                <input type="number" value={bpm} onChange={e => setBpm(Math.max(60, Math.min(220, Number(e.target.value))))} className="w-12 bg-slate-900 text-center font-bold text-pink-400 rounded text-xs py-0.5" />
                            </div>
                        </div>
                    </header>

                    {/* タブナビゲーション */}
                    <nav className="bg-slate-900/90 border-b border-slate-800 px-2 py-1.5 flex gap-1 overflow-x-auto">
                        {[
                            { id: "DUAL_EDIT", label: "🎛️ AI & 鍵盤エディタ" },
                            { id: "MIXER", label: "🎚️ ミキサー" },
                            { id: "RECORDINGS", label: "📁 録音記録リスト" },
                            { id: "VOICE_STUDIO", label: "🎙️ ボイススタジオ" },
                            { id: "MEMORY_LIST", label: "💾 保存・ロード" },
                            { id: "JACKET", label: "💿 ジャケット" },
                        ].map(t => (
                            <button key={t.id} onClick={() => setTab(t.id)} className={`px-3 py-1 rounded text-center font-bold transition-all shrink-0 ${tab === t.id ? "bg-amber-500 text-slate-950 shadow" : "bg-slate-800/60 text-slate-400"}`}>
                                {t.label}
                            </button>
                        ))}
                    </nav>

                    <div className="bg-slate-900/50 px-3 py-1 text-[11px] text-cyan-400 border-b border-slate-900 truncate">
                        <span>💡 {status}</span>
                    </div>

                    <main className="p-2 flex flex-col gap-3">

                        {/* タブ1: AI & 鍵盤エディタ */}
                        {tab === "DUAL_EDIT" && (
                            <div className="flex flex-col gap-3">
                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-2.5 shadow">
                                    <div className="flex justify-between items-center flex-wrap gap-2">
                                        <span className="text-xs font-bold text-pink-400">① 楽器セレクト</span>
                                        <div className="flex gap-2">
                                            <button onClick={() => generateAiMelodyForInstrument(selectedInstrument)} className="px-3 py-1 bg-gradient-to-r from-purple-600 to-pink-600 hover:opacity-90 text-white font-bold rounded text-[10px] shadow">
                                                🤖 この楽器のAIメロディ作成
                                            </button>
                                            <button onClick={() => clearSpecificInstrument(selectedInstrument)} className="px-2.5 py-1 bg-red-950 hover:bg-red-900 text-red-300 font-bold rounded text-[10px] border border-red-800">
                                                🗑️ クリア
                                            </button>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-1.5">
                                        {INSTRUMENTS.map(inst => (
                                            <button
                                                key={inst.id}
                                                onClick={() => setSelectedInstrument(inst.id)}
                                                className={`py-2 px-1 rounded-lg font-bold text-[11px] transition-all border flex items-center justify-center gap-1 shadow ${
                                                    selectedInstrument === inst.id
                                                        ? `bg-gradient-to-r ${inst.color} border-white text-white ring-2 ring-white/30`
                                                        : "bg-slate-950 border-slate-800 text-slate-400"
                                                }`}
                                            >
                                                {inst.label}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3 shadow">
                                    <div className="flex justify-between items-center flex-wrap gap-2">
                                        <span className="text-xs font-bold text-cyan-400">② ステップ＆鍵盤エディタ ({currentInstObj.label})</span>
                                        <div className="flex gap-1.5 items-center">
                                            <button onClick={() => setInputMode("grid")} className={`px-3 py-1 rounded text-[10px] font-bold ${inputMode === "grid" ? "bg-cyan-600 text-white" : "bg-slate-800 text-slate-400"}`}>グリッド</button>
                                            <button onClick={() => setInputMode("keyboard")} className={`px-3 py-1 rounded text-[10px] font-bold ${inputMode === "keyboard" ? "bg-cyan-600 text-white" : "bg-slate-800 text-slate-400"}`}>ドレミ鍵盤</button>
                                        </div>
                                    </div>

                                    {/* 音の長さ選択 */}
                                    <div className="flex items-center gap-2 bg-slate-950 p-2 rounded border border-slate-800 flex-wrap">
                                        <span className="text-[11px] font-bold text-amber-400">🎵 音の長さ調整:</span>
                                        <div className="flex gap-1 flex-wrap">
                                            {DURATIONS.map(d => (
                                                <button key={d.id} onClick={() => setSelectedDuration(d.id)} className={`px-2.5 py-1 rounded text-[10px] font-bold ${selectedDuration === d.id ? "bg-amber-500 text-slate-950" : "bg-slate-800 text-slate-300"}`}>{d.label}</button>
                                            ))}
                                        </div>
                                    </div>

                                    {inputMode === "keyboard" && (
                                        <div className="bg-slate-950 border border-slate-800 rounded p-2.5 flex flex-col gap-2">
                                            <div className="text-[11px] font-bold text-amber-400">🎹 ドレミ鍵盤（クリックで試聴・入力）</div>
                                            <div className="grid grid-cols-8 gap-1.5">
                                                {NOTES.map(note => (
                                                    <button key={note} onClick={() => playNoteKeyboard(note)} className={`py-3 rounded font-bold flex flex-col items-center justify-center gap-0.5 border ${selectedNote === note ? "bg-amber-500 text-slate-950 border-white ring-2 ring-white" : "bg-slate-900 text-slate-200 border-slate-800"}`}>
                                                        <span className="text-xs">{SOLFEGE[note]}</span>
                                                        <span className="text-[8px] text-slate-400">{note}</span>
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    <div className="flex items-center justify-between bg-slate-950 p-2 rounded border border-slate-800">
                                        <span className="text-[11px] font-bold text-slate-300">小節: <strong className="text-pink-400">{currentBar + 1} / 8小節</strong></span>
                                        <div className="flex gap-1">
                                            {Array.from({ length: BARS }).map((_, b) => (
                                                <button key={b} onClick={() => setCurrentBar(b)} className={`w-7 h-7 rounded-full text-xs font-bold ${currentBar === b ? "bg-amber-500 text-slate-950" : "bg-slate-800 text-slate-400"}`}>{b + 1}</button>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="overflow-x-auto bg-slate-950 p-3 rounded border border-slate-800">
                                        <div className="grid gap-1 min-w-[540px]" style={{ gridTemplateColumns: "repeat(16, minmax(0, 1fr))" }}>
                                            {Array.from({ length: BAR_STEPS }).map((_, i) => {
                                                const stepIdx = currentBar * BAR_STEPS + i;
                                                const stepVal = instrumentSteps[selectedInstrument][stepIdx];
                                                const isCurrentPlay = playing && currentStep === i;
                                                let isActive = selectedInstrument === "drums" ? (stepVal && stepVal[selectedDrumPart]) : !!stepVal;

                                                return (
                                                    <button
                                                        key={i}
                                                        onClick={() => toggleStepWithDuration(selectedInstrument, stepIdx)}
                                                        className={`aspect-[3/4] w-full rounded border flex flex-col items-center justify-center text-[9px] transition-all ${
                                                            isActive ? "bg-gradient-to-t from-amber-600 to-pink-600 border-white text-white font-bold shadow-md shadow-pink-500/50 scale-105" : "bg-slate-900 border-slate-800 text-slate-500"
                                                        } ${isCurrentPlay ? "ring-2 ring-cyan-400" : ""}`}
                                                    >
                                                        <span className="font-bold text-[10px]">{i + 1}</span>
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* タブ2: ミキサー */}
                        {tab === "MIXER" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-4 flex flex-col gap-3">
                                <span className="text-xs font-bold text-amber-400">🎚️ 各楽器個別ボリュームミキサー (dB)</span>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 bg-slate-950 p-3 rounded border border-slate-800">
                                    {INSTRUMENTS.filter(i => i.id !== "voiceTrack").map(inst => (
                                        <div key={inst.id} className="flex items-center justify-between bg-slate-900 p-2 rounded border border-slate-800">
                                            <span className="text-[11px] font-bold text-slate-200">{inst.label}</span>
                                            <div className="flex items-center gap-2">
                                                <input type="range" min="-30" max="6" step="1" value={volumes[inst.id]} onChange={e => setVolumes({ ...volumes, [inst.id]: Number(e.target.value) })} className="w-24 accent-amber-500" />
                                                <span className="text-[10px] text-amber-400 w-8 text-right">{volumes[inst.id]}dB</span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* タブ3: 録音記録リスト */}
                        {tab === "RECORDINGS" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-4 flex flex-col gap-3">
                                <div className="flex justify-between items-center">
                                    <span className="text-xs font-bold text-pink-400">📁 録音・記録テイク一覧</span>
                                    <button onClick={() => setRecordedTakes([])} className="px-2.5 py-1 bg-red-950 text-red-300 font-bold rounded text-[10px]">リストをクリア</button>
                                </div>
                                <div className="bg-slate-950 p-3 rounded border border-slate-800 flex flex-col gap-2 max-h-[220px] overflow-y-auto">
                                    {recordedTakes.length === 0 ? (
                                        <span className="text-[10px] text-slate-500">まだ録音されたテイクはありません。「録音」ボタンから作成できます。</span>
                                    ) : (
                                        recordedTakes.map(take => (
                                            <div key={take.id} className="flex justify-between items-center bg-slate-900 p-2.5 rounded border border-slate-800">
                                                <div className="flex flex-col">
                                                    <span className="font-bold text-cyan-400 text-xs">🎵 {take.title}</span>
                                                    <span className="text-[9px] text-slate-400">時刻: {take.date} {take.bpm ? `(BPM: ${take.bpm})` : ""}</span>
                                                </div>
                                                <div className="flex gap-1.5">
                                                    {take.url && (
                                                        <button onClick={() => new Audio(take.url).play()} className="px-3 py-1 bg-cyan-600 text-white font-bold rounded text-[10px]">▶ 再生</button>
                                                    )}
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        )}

                        {/* タブ4: ボイススタジオ */}
                        {tab === "VOICE_STUDIO" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-4 flex flex-col gap-3">
                                <span className="text-xs font-bold text-rose-400">🎙️ ボイス録音スタジオ</span>
                                <div className="bg-slate-950 p-4 rounded border border-slate-800 flex flex-col gap-3 items-center">
                                    <div className="flex gap-2">
                                        {!isVoiceRecording ? (
                                            <button onClick={startVoiceRecording} className="px-4 py-2 bg-red-600 text-white font-bold rounded text-xs shadow animate-pulse">🔴 録音開始</button>
                                        ) : (
                                            <button onClick={stopVoiceRecording} className="px-4 py-2 bg-slate-200 text-slate-950 font-bold rounded text-xs shadow">⏹️ 停止</button>
                                        )}
                                        <button onClick={() => voiceAudioUrl && new Audio(voiceAudioUrl).play()} disabled={!voiceAudioUrl} className={`px-4 py-2 font-bold rounded text-xs shadow ${voiceAudioUrl ? "bg-cyan-600 text-white" : "bg-slate-800 text-slate-500 cursor-not-allowed"}`}>▶ 最新再生</button>
                                    </div>
                                    <span className="text-[10px] text-slate-400">{voiceAudioUrl ? "✅ 録音保存済み" : "マイクから音声を録音して記録リストに追加できます"}</span>
                                </div>
                            </div>
                        )}

                        {/* タブ5: 保存・ロード */}
                        {tab === "MEMORY_LIST" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3">
                                <span className="text-xs font-bold text-emerald-400">💾 セッション保存・ロード</span>
                                <div className="flex gap-2 bg-slate-950 p-3 rounded border border-slate-800">
                                    <input type="text" value={slotName} onChange={e => setSlotName(e.target.value)} className="bg-slate-900 px-2 py-1 rounded text-slate-100 flex-1 border border-slate-800" />
                                    <button onClick={saveCurrentSession} className="px-4 py-1 bg-emerald-600 text-white font-bold rounded">保存</button>
                                </div>
                                <div className="flex flex-col gap-2 bg-slate-950 p-3 rounded border border-slate-800 max-h-[180px] overflow-y-auto">
                                    {Object.keys(savedSlots).length === 0 ? (
                                        <span className="text-[10px] text-slate-500">保存スロットなし</span>
                                    ) : (
                                        Object.keys(savedSlots).map(name => (
                                            <div key={name} className="flex justify-between items-center bg-slate-900 p-2 rounded border border-slate-800">
                                                <span className="font-bold text-cyan-400 text-xs">📂 {name}</span>
                                                <button onClick={() => loadSession(name)} className="px-2 py-1 bg-cyan-600 text-white rounded text-[10px] font-bold">ロード</button>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        )}

                        {/* タブ6: ジャケット */}
                        {tab === "JACKET" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-4 flex flex-col gap-4 items-center">
                                <span className="text-xs font-bold text-cyan-400 self-start">💿 ジャケット作成</span>
                                <div className="flex flex-col gap-3 w-full max-w-sm bg-slate-950 p-4 rounded border border-slate-800">
                                    <input type="text" value={jacketTitle} onChange={e => setJacketTitle(e.target.value)} className="bg-slate-900 px-2 py-1.5 rounded text-white font-bold border border-slate-800" />
                                    <div className="w-full aspect-square bg-gradient-to-br from-purple-600 via-pink-600 to-amber-600 rounded-xl shadow-2xl p-6 flex flex-col justify-between items-center text-center border-4 border-white/20">
                                        <div className="font-black text-xs text-white/80">MIC VICTORY RECORDS</div>
                                        <h2 className="text-xl font-black text-white">{jacketTitle}</h2>
                                        <div className="text-[9px] text-white/70">STUDIO v54.0 AI MASTER</div>
                                    </div>
                                    <button onClick={() => setStatus(`🎉 【${jacketTitle}】リリース完了！`)} className="w-full py-3 bg-gradient-to-r from-pink-600 to-amber-500 text-white font-black rounded-lg text-xs shadow-lg">🚀 リリース！</button>
                                </div>
                            </div>
                        )}

                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<MasterSynthApp />);
    </script>
</body>
</html>
