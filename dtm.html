<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIC VICTORY - DLAND DTM v56.7 POPPING HIT & BLACK CONTEMPORARY CLEAR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans select-none pb-24 overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        function MasterSynthApp() {
            const [tab, setTab] = React.useState("POP_GROOVE");
            const [playing, setPlaying] = React.useState(false);
            const [isRecording, setIsRecording] = React.useState(false);
            const [flashColor, setFlashColor] = React.useState("border-cyan-500");
            const [bpm, setBpm] = React.useState(108); // ブラコン・ポップ向きミッドテンポ
            const [currentBar, setCurrentBar] = React.useState(0);
            const [currentStep, setCurrentStep] = React.useState(-1);
            const [status, setStatus] = React.useState("✨ v56.7 ブラコン・ポッピングHit＆キャッシュ崩壊防止ロジック稼働中");

            const BARS = 8;
            const BAR_STEPS = 16;
            const TOTAL_STEPS = BARS * BAR_STEPS;

            const [selectedInstrument, setSelectedInstrument] = React.useState("synth");
            const [selectedNote, setSelectedNote] = React.useState("C4");
            const [selectedDuration, setSelectedDuration] = React.useState("8n");
            const [selectedDrumPart, setSelectedDrumPart] = React.useState("kick");

            const [recordedTakes, setRecordedTakes] = React.useState([]);
            const [activePatternIndex, setActivePatternIndex] = React.useState(1);

            const [rapLyrics, setRapLyrics] = React.useState("[Verse 1 - DLAND DTM BLACK CONTEMPORARY]\nSmooth groove 刻む鎖の低音\nPop & Lock 止まる瞬間の重圧\nキャッシュクリア 崩れないグルーヴ\nMIC VICTORY 頂点のスクエア");

            const [masterBassBoost, setMasterBassBoost] = React.useState(14);
            const [masterVolume, setMasterVolume] = React.useState(1.3);
            const [dlandMode, setDlandMode] = React.useState(true);
            const [screenSaverActive, setScreenSaverActive] = React.useState(false);
            const [slotName, setSlotName] = React.useState("DLAND_v56_7_POP_BLACK_CONTEMPORARY");

            const INSTRUMENTS = [
                { id: "drums", label: "🥁 ドラム / Pop Hit", color: "from-red-600 to-amber-600" },
                { id: "loopTrack", label: "🔁 ブラコンカッティング", color: "from-pink-600 to-rose-600" },
                { id: "subBass", label: "🔊 C0極低音サブベース", color: "from-amber-600 to-orange-700" },
                { id: "bass", label: "🎸 ファットスラップベース", color: "from-emerald-600 to-teal-600" },
                { id: "synth", label: "🎹 ブラコンローズ系シンセ", color: "from-cyan-600 to-blue-700" },
                { id: "trumpet", label: "🎺 ブラスセクション", color: "from-yellow-500 to-amber-600" },
                { id: "guitar", label: "🎸 カリカリファンクギター", color: "from-orange-600 to-red-700" },
                { id: "africa1", label: "🪘 パーカッション1", color: "from-amber-700 to-yellow-800" },
                { id: "africa2", label: "🎹 パーカッション2", color: "from-yellow-600 to-amber-600" },
                { id: "piano", label: "🎹 エレピコード", color: "from-blue-600 to-indigo-600" },
                { id: "violin", label: "🎻 ストリングスパッド", color: "from-amber-600 to-yellow-700" },
                { id: "flute", label: "🪈 リードフルート", color: "from-teal-500 to-cyan-600" },
            ];

            const [instrumentSteps, setInstrumentSteps] = React.useState({
                drums: new Array(TOTAL_STEPS).fill(null),
                loopTrack: new Array(TOTAL_STEPS).fill(null),
                subBass: new Array(TOTAL_STEPS).fill(null),
                bass: new Array(TOTAL_STEPS).fill(null),
                synth: new Array(TOTAL_STEPS).fill(null),
                trumpet: new Array(TOTAL_STEPS).fill(null),
                guitar: new Array(TOTAL_STEPS).fill(null),
                africa1: new Array(TOTAL_STEPS).fill(null),
                africa2: new Array(TOTAL_STEPS).fill(null),
                piano: new Array(TOTAL_STEPS).fill(null),
                violin: new Array(TOTAL_STEPS).fill(null),
                flute: new Array(TOTAL_STEPS).fill(null),
            });

            const [volumes, setVolumes] = React.useState({
                drums: 3, loopTrack: -2, subBass: 7, bass: 5, synth: 0, trumpet: -1, guitar: -2, africa1: -3, africa2: -3, piano: 0, violin: -4, flute: -4
            });

            const synthsRef = React.useRef(null);
            const loopRef = React.useRef(null);
            const masterGainRef = React.useRef(null);

            const NOTES = ["C4", "D4", "E4", "F4", "G4", "A4", "B4", "C5"];
            const SOLFEGE = { "C4": "ド", "D4": "レ", "E4": "ミ", "F4": "ファ", "G4": "ソ", "A4": "ラ", "B4": "シ", "C5": "ド" };
            const DURATION_OPTIONS = [
                { id: "16n", label: "ヒット極短 (16分)" },
                { id: "8n", label: "標準グルーヴ (8分)" },
                { id: "4n", label: "長めベンド (4分)" },
                { id: "2n", label: "ロングパッド (2n)" },
            ];

            // 安全なキャッシュクリア・メモリ再構築関数
            const purgeAndClearCacheBuffer = () => {
                try {
                    if (Tone.context && Tone.context.state === 'suspended') {
                        Tone.context.resume();
                    }
                    setInstrumentSteps({
                        drums: new Array(TOTAL_STEPS).fill(null),
                        loopTrack: new Array(TOTAL_STEPS).fill(null),
                        subBass: new Array(TOTAL_STEPS).fill(null),
                        bass: new Array(TOTAL_STEPS).fill(null),
                        synth: new Array(TOTAL_STEPS).fill(null),
                        trumpet: new Array(TOTAL_STEPS).fill(null),
                        guitar: new Array(TOTAL_STEPS).fill(null),
                        africa1: new Array(TOTAL_STEPS).fill(null),
                        africa2: new Array(TOTAL_STEPS).fill(null),
                        piano: new Array(TOTAL_STEPS).fill(null),
                        violin: new Array(TOTAL_STEPS).fill(null),
                        flute: new Array(TOTAL_STEPS).fill(null),
                    });
                    setStatus("🧹 キャッシュバッファ強制クリア・破綻防止初期化完了！");
                } catch(e) {
                    setStatus("⚠️ クリア処理例外保護発動");
                }
            };

            React.useEffect(() => {
                const masterGain = new Tone.Gain(masterVolume).toDestination();
                masterGainRef.current = masterGain;

                const eq = new Tone.EQ3({ low: masterBassBoost, lowFrequency: 140, mid: 2.0, high: 2.0 }).connect(masterGain);
                const reverb = new Tone.Reverb({ decay: 1.2, wet: 0.1 }).connect(eq);
                const delay = new Tone.FeedbackDelay({ delayTime: "8n", feedback: 0.15, wet: 0.08 }).connect(reverb);
                const distortion = new Tone.Distortion(0.06).connect(delay);

                const cGains = {};
                Object.keys(instrumentSteps).forEach(key => {
                    const cg = new Tone.Gain(Tone.dbToGain(volumes[key] || 0)).connect(distortion);
                    cGains[key] = cg;
                });

                synthsRef.current = {
                    subBass: new Tone.MonoSynth({
                        oscillator: { type: "sine" },
                        envelope: { attack: 0.003, decay: 0.4, sustain: 0.6, release: 0.2 },
                        filterEnvelope: { attack: 0.003, decay: 0.25, sustain: 0.4, release: 0.2, baseFrequency: 60, octaves: 1.2 }
                    }).connect(cGains.subBass),
                    bass: new Tone.MonoSynth({
                        oscillator: { type: "triangle" },
                        envelope: { attack: 0.008, decay: 0.35, sustain: 0.45, release: 0.15 }
                    }).connect(cGains.bass),
                    synth: new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.01, decay: 0.3, sustain: 0.5, release: 0.2 } }).connect(cGains.synth),
                    loopTrack: new Tone.Synth({ oscillator: { type: "triangle" }, envelope: { attack: 0.005, decay: 0.15, sustain: 0.2, release: 0.1 } }).connect(cGains.loopTrack),
                    guitar: new Tone.Synth({ oscillator: { type: "sawtooth" }, envelope: { attack: 0.005, decay: 0.18, sustain: 0.2, release: 0.1 } }).connect(cGains.guitar),
                    trumpet: new Tone.Synth({ oscillator: { type: "sawtooth" }, envelope: { attack: 0.03, decay: 0.2, sustain: 0.6, release: 0.15 } }).connect(cGains.trumpet),
                    africa1: new Tone.MembraneSynth({ pitchDecay: 0.02, octaves: 4, oscillator: { type: "sine" }, envelope: { attack: 0.001, decay: 0.2, sustain: 0.01, release: 0.1 } }).connect(cGains.africa1),
                    africa2: new Tone.Synth({ oscillator: { type: "triangle" }, envelope: { attack: 0.001, decay: 0.18, sustain: 0.1, release: 0.15 } }).connect(cGains.africa2),
                    piano: new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.008, decay: 0.35, sustain: 0.3, release: 0.3 } }).connect(cGains.piano),
                    violin: new Tone.Synth({ oscillator: { type: "sawtooth" }, envelope: { attack: 0.06, decay: 0.3, sustain: 0.7, release: 0.3 } }).connect(cGains.violin),
                    flute: new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.05, decay: 0.25, sustain: 0.7, release: 0.25 } }).connect(cGains.flute),
                    drums: {
                        kick: new Tone.MembraneSynth({ pitchDecay: 0.05, octaves: 5.5, oscillator: { type: "sine" }, envelope: { attack: 0.0001, decay: 0.28, sustain: 0.01, release: 0.12 } }).connect(cGains.drums),
                        snare: new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.0001, decay: 0.15, sustain: 0 } }).connect(cGains.drums),
                        hihat: new Tone.MetalSynth({ frequency: 950, envelope: { attack: 0.0005, decay: 0.02, release: 0.01 }, harmonicity: 5.1, modulationIndex: 30, resonance: 6800, octaves: 1.2 }).connect(cGains.drums),
                        clap: new Tone.NoiseSynth({ noise: { type: "pink" }, envelope: { attack: 0.004, decay: 0.12, sustain: 0 } }).connect(cGains.drums),
                    },
                    eq, reverb, distortion
                };

                return () => { Tone.Transport.stop(); Tone.Transport.cancel(); };
            }, []);

            React.useEffect(() => {
                Tone.Transport.bpm.value = bpm;
                Tone.Transport.cancel();

                if (playing) {
                    let stepCounter = 0;
                    loopRef.current = new Tone.Loop(time => {
                        let step = stepCounter % TOTAL_STEPS;
                        const bar = Math.floor(step / BAR_STEPS);
                        const sInBar = step % BAR_STEPS;

                        setCurrentStep(sInBar);
                        setCurrentBar(bar);

                        if (dlandMode && sInBar === 0) {
                            const colors = ["border-cyan-500", "border-pink-500", "border-amber-500", "border-purple-500", "border-emerald-500"];
                            setFlashColor(colors[Math.floor(Math.random() * colors.length)]);
                        }

                        const syns = synthsRef.current;
                        if (!syns) return;

                        Object.keys(instrumentSteps).forEach(instKey => {
                            const item = instrumentSteps[instKey][step];
                            if (!item) return;

                            const note = typeof item === "object" ? item.note : item;
                            const dur = typeof item === "object" ? (item.dur || "8n") : "8n";

                            if (instKey === "drums") {
                                if (typeof item === "object") {
                                    if (item.kick) syns.drums.kick.triggerAttackRelease(item.subBoost ? "C0" : "C1", "8n", time);
                                    if (item.snare) syns.drums.snare.triggerAttackRelease("8n", time);
                                    if (item.hihat) syns.drums.hihat.triggerAttackRelease("32n", time, 0.9);
                                    if (item.clap) syns.drums.clap.triggerAttackRelease("8n", time);
                                }
                            } else if (instKey === "subBass") {
                                syns.subBass.triggerAttackRelease(item.subBoost ? "C0" : "C1", dur, time);
                            } else if (syns[instKey]) {
                                syns[instKey].triggerAttackRelease(note || "C4", dur, time);
                            }
                        });

                        stepCounter++;
                    }, "16n").start(0);

                    Tone.Transport.start();
                } else {
                    Tone.Transport.stop();
                }
            }, [playing, bpm, instrumentSteps, dlandMode]);

            // ポッピングダンス用 Hit/Lock 生成AI (点滅・急停止・重低音同期の衝撃音パターン)
            const generatePopDanceHitAi = (intensityType) => {
                const newDrums = new Array(TOTAL_STEPS).fill(null);
                const newBass = new Array(TOTAL_STEPS).fill(null);
                const newSynth = new Array(TOTAL_STEPS).fill(null);

                for (let i = 0; i < TOTAL_STEPS; i++) {
                    const isBeat = i % 4 === 0;
                    const isPopHit = intensityType === 'heavy_lock' ? (i % 2 === 0 || i === 6 || i === 14) : (i % 4 === 0 || i === 10);
                    const isSnare = i % 8 === 4;
                    const isHihat = i % 2 === 0;

                    newDrums[i] = {
                        kick: isPopHit,
                        snare: isSnare,
                        hihat: isHihat,
                        clap: intensityType === 'heavy_lock' && i % 4 === 2,
                        subBoost: true
                    };

                    if (isPopHit) {
                        newBass[i] = { note: "C0", dur: "16n", subBoost: true };
                    }
                    if (i % 8 === 2 || i % 8 === 6) {
                        const chordNotes = ["C4", "Eb4", "G4", "Bb4"];
                        newSynth[i] = { note: chordNotes[i % chordNotes.length], dur: "8n" };
                    }
                }

                setInstrumentSteps(prev => ({
                    ...prev,
                    drums: newDrums,
                    subBass: newBass,
                    synth: newSynth
                }));
                setStatus(`🕺 ポッピングダンスHit AI [${intensityType}] 同期完了！`);
            };

            // ブラックコンテンポラリー級グルーヴ生成AI
            const generateBlackContemporaryAi = (styleVariant) => {
                const newArr = { ...instrumentSteps };
                const scales = ["C3", "Eb3", "F3", "G3", "Bb3", "C4", "Eb4"];
                const bassArr = new Array(TOTAL_STEPS).fill(null);
                const synthArr = new Array(TOTAL_STEPS).fill(null);
                const drumArr = new Array(TOTAL_STEPS).fill(null);

                for (let i = 0; i < TOTAL_STEPS; i++) {
                    // ブラックコンテンポラリーのシンコペーションベースライン
                    if (i % 4 === 0 || i === 6 || i === 10 || i === 15) {
                        bassArr[i] = { note: i % 8 === 0 ? "C0" : "C1", dur: "16n", subBoost: true };
                    }
                    // ローズ風コードスタブ
                    if (i % 4 === 2 || i % 16 === 11) {
                        synthArr[i] = { note: scales[(i / 2) % scales.length], dur: "8n" };
                    }
                    // レイドバックドラム
                    const isKick = i % 4 === 0 || (styleVariant === 'syncopated' && i === 10);
                    const isSnare = i % 8 === 4;
                    drumArr[i] = { kick: isKick, snare: isSnare, hihat: true, clap: i % 16 === 12, subBoost: true };
                }

                setInstrumentSteps(prev => ({
                    ...prev,
                    bass: bassArr,
                    synth: synthArr,
                    subBass: bassArr,
                    drums: drumArr
                }));
                setStatus(`🎹 ブラックコンテンポラリー級グルーヴAI [${styleVariant}] 展開！`);
            };

            const togglePlay = async () => {
                await Tone.start();
                setPlaying(!playing);
                setStatus(playing ? "停止しました" : `▶ 再生中 (BPM: ${bpm})`);
            };

            const toggleRecord = async () => {
                await Tone.start();
                setIsRecording(!isRecording);
                setStatus(!isRecording ? "🔴 全体リアルタイム・ポップ/ブラコン録音中..." : "⏹️ 記録をセーブしました");
                if (isRecording) {
                    setRecordedTakes(prev => [...prev, { id: Date.now(), title: `POP/BC テイク ${prev.length + 1}`, bpm, date: new Date().toLocaleTimeString() }]);
                }
            };

            const playNoteKeyboard = (note) => {
                setSelectedNote(note);
                const syns = synthsRef.current;
                if (!syns) return;

                if (selectedInstrument === "drums") {
                    if (selectedDrumPart === "kick") syns.drums.kick.triggerAttackRelease("C0", selectedDuration);
                    else if (selectedDrumPart === "snare") syns.drums.snare.triggerAttackRelease(selectedDuration);
                    else if (selectedDrumPart === "hihat") syns.drums.hihat.triggerAttackRelease("32n");
                    else syns.drums.clap.triggerAttackRelease(selectedDuration);
                } else if (selectedInstrument === "subBass") {
                    syns.subBass.triggerAttackRelease("C0", selectedDuration);
                } else if (syns[selectedInstrument]) {
                    syns[selectedInstrument].triggerAttackRelease(note, selectedDuration);
                }

                if (currentStep !== -1) {
                    const stepIdx = currentBar * BAR_STEPS + currentStep;
                    toggleStepWithDuration(selectedInstrument, stepIdx, note, selectedDuration);
                }
            };

            const toggleStepWithDuration = (instKey, idx, note = selectedNote, dur = selectedDuration) => {
                setInstrumentSteps(prev => {
                    const currentArr = [...prev[instKey]];
                    if (instKey === "drums") {
                        const currentObj = currentArr[idx] || { kick: false, snare: false, hihat: false, clap: false };
                        const updatedObj = { ...currentObj, [selectedDrumPart]: !currentObj[selectedDrumPart] };
                        const hasAny = Object.values(updatedObj).some(Boolean);
                        currentArr[idx] = hasAny ? updatedObj : null;
                    } else {
                        currentArr[idx] = currentArr[idx] ? null : { note, dur, subBoost: instKey === "subBass" };
                    }
                    return { ...prev, [instKey]: currentArr };
                });
            };

            const exportProjectToFile = () => {
                const projectData = { title: slotName, bpm, instrumentSteps, volumes, date: new Date().toISOString() };
                const blob = new Blob([JSON.stringify(projectData, null, 2)], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `${slotName}.json`;
                a.click();
                URL.revokeObjectURL(url);
                setStatus(`💾 プロジェクトファイル保存完了`);
            };

            const importProjectFromFile = (event) => {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (data.instrumentSteps) {
                            setInstrumentSteps(data.instrumentSteps);
                            if (data.bpm) setBpm(data.bpm);
                            setStatus(`📂 ファイル読込成功`);
                        }
                    } catch (err) {
                        setStatus("❌ 読込エラー");
                    }
                };
                reader.readAsText(file);
            };

            return (
                <div className={`min-h-screen bg-slate-950 text-slate-100 flex flex-col text-xs font-sans select-none pb-24 overflow-x-hidden border-8 transition-colors duration-300 ${flashColor}`}>
                    {screenSaverActive && (
                        <div onClick={() => setScreenSaverActive(false)} className="fixed inset-0 z-50 bg-slate-950/95 flex flex-col items-center justify-center p-6 cursor-pointer backdrop-blur-md">
                            <div className="text-center mb-8">
                                <h1 className="text-2xl font-black bg-gradient-to-r from-amber-400 via-pink-400 to-cyan-400 bg-clip-text text-transparent animate-bounce">
                                    POPPING & BLACK CONTEMPORARY VISUALIZER
                                </h1>
                                <p className="text-slate-400 text-xs mt-1">BPM: {bpm} | ステップ: {currentStep + 1}</p>
                            </div>
                        </div>
                    )}

                    <header className="bg-slate-900 border-b border-slate-800 px-3 py-2 flex items-center justify-between gap-2 sticky top-0 z-40 shadow-lg">
                        <div className="flex items-center gap-2">
                            <span className="font-black text-sm bg-gradient-to-r from-amber-400 via-pink-400 to-cyan-400 bg-clip-text text-transparent">
                                MIC VICTORY <span className="text-[10px] text-pink-400 font-bold">v56.7 Pop/BC</span>
                            </span>
                        </div>
                        <div className="flex items-center gap-1.5 flex-wrap">
                            <button onClick={purgeAndClearCacheBuffer} className="px-2 py-1 bg-red-900 border border-red-700 text-red-200 font-bold rounded text-[10px]">
                                🧹 キャッシュクリア
                            </button>
                            <button onClick={togglePlay} className={`px-3 py-1 rounded font-bold text-xs shadow ${playing ? "bg-amber-400 text-slate-950 animate-bounce" : "bg-pink-600 text-white"}`}>
                                {playing ? "■ 停止" : "▶ 再生"}
                            </button>
                            <button onClick={toggleRecord} className={`px-3 py-1 rounded font-bold text-xs shadow ${isRecording ? "bg-red-600 text-white animate-pulse" : "bg-slate-800 text-red-400 border border-red-800"}`}>
                                {isRecording ? "🔴 録音中" : "⏺️ 記録"}
                            </button>
                            <div className="flex items-center gap-1 bg-slate-950 px-2 py-0.5 rounded border border-slate-800">
                                <span className="text-[9px] text-slate-400">BPM</span>
                                <input type="number" value={bpm} onChange={e => setBpm(Math.max(60, Math.min(220, Number(e.target.value))))} className="w-12 bg-slate-900 text-center font-bold text-pink-400 rounded text-xs py-0.5" />
                            </div>
                        </div>
                    </header>

                    <nav className="bg-slate-900/90 border-b border-slate-800 px-2 py-1.5 flex gap-1 overflow-x-auto">
                        {[
                            { id: "POP_GROOVE", label: "🕺 ポッピングHit & ブラコンAI" },
                            { id: "DUAL_EDIT", label: "🎛️ 鍵盤 & 重低音ステップ" },
                            { id: "RAP_AI", label: "🎤 ラップ歌詞" },
                            { id: "MASTER_EQ", label: "🔊 EQ・低域ブースト" },
                            { id: "MIXER", label: "🎚️ ミキサー" },
                            { id: "RECORDINGS", label: "📁 記録リスト" },
                            { id: "MEMORY", label: "💾 保存・読込" },
                        ].map(t => (
                            <button key={t.id} onClick={() => setTab(t.id)} className={`px-3 py-1 rounded text-center font-bold transition-all shrink-0 ${tab === t.id ? "bg-amber-500 text-slate-950 shadow" : "bg-slate-800/60 text-slate-400"}`}>
                                {t.label}
                            </button>
                        ))}
                    </nav>

                    <div className="bg-slate-900/50 px-3 py-1 text-[11px] text-cyan-400 border-b border-slate-900 truncate">
                        💡 {status}
                    </div>

                    <main className="p-2 flex flex-col gap-3">
                        {tab === "POP_GROOVE" && (
                            <div className="flex flex-col gap-3">
                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-2.5 shadow">
                                    <span className="text-xs font-bold text-pink-400">🕺 ポッピングダンス専用 Hit / Lock 衝撃音生成AI</span>
                                    <div className="flex gap-2 flex-wrap">
                                        <button onClick={() => generatePopDanceHitAi('pop_basic')} className="px-3 py-2 bg-pink-600 text-white font-bold rounded text-xs">ポッピング基本Hit同期</button>
                                        <button onClick={() => generatePopDanceHitAi('heavy_lock')} className="px-3 py-2 bg-red-600 text-white font-bold rounded text-xs">高負荷Heavy Lock連打</button>
                                    </div>
                                </div>
                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-2.5 shadow">
                                    <span className="text-xs font-bold text-amber-400">🎹 ブラックコンテンポラリー級グルーヴ構築AI</span>
                                    <div className="flex gap-2 flex-wrap">
                                        <button onClick={() => generateBlackContemporaryAi('smooth_bc')} className="px-3 py-2 bg-amber-500 text-slate-950 font-bold rounded text-xs">スムースBCグルーヴ</button>
                                        <button onClick={() => generateBlackContemporaryAi('syncopated')} className="px-3 py-2 bg-cyan-600 text-white font-bold rounded text-xs">ファンキーシンコペーション</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {tab === "DUAL_EDIT" && (
                            <div className="flex flex-col gap-3">
                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-2.5 shadow">
                                    <div className="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 gap-1.5">
                                        {INSTRUMENTS.map(inst => (
                                            <button key={inst.id} onClick={() => setSelectedInstrument(inst.id)} className={`py-2 px-1 rounded-lg font-bold text-[11px] border flex items-center justify-center gap-1 shadow ${selectedInstrument === inst.id ? `bg-gradient-to-r ${inst.color} border-white text-white` : "bg-slate-950 border-slate-800 text-slate-400"}`}>
                                                {inst.label}
                                            </button>
                                        ))}
                                    </div>
                                    <div className="grid grid-cols-8 gap-1.5 mt-2">
                                        {NOTES.map(note => (
                                            <button key={note} onClick={() => playNoteKeyboard(note)} className={`py-4 rounded font-bold text-center border shadow transition-all active:scale-95 ${selectedNote === note ? "bg-amber-500 text-slate-950 border-white ring-2 ring-amber-400" : "bg-slate-950 text-slate-100 border-slate-800 hover:bg-slate-900"}`}>
                                                <div className="text-sm font-black">{SOLFEGE[note]}</div>
                                                <div className="text-[9px] opacity-70">{note}</div>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {tab === "MASTER_EQ" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-4 flex flex-col gap-3">
                                <span className="text-xs font-bold text-amber-400">🔊 重低音・低域EQ＆リリース音響調整</span>
                                <div className="flex flex-col gap-3 bg-slate-950 p-3 rounded border border-slate-800">
                                    <div className="flex flex-col gap-1">
                                        <span className="text-[11px] text-amber-400">低域ブースト (140Hz土台): {masterBassBoost} dB</span>
                                        <input type="range" min="0" max="24" step="1" value={masterBassBoost} onChange={e => {
                                            const val = Number(e.target.value);
                                            setMasterBassBoost(val);
                                            if (synthsRef.current && synthsRef.current.eq) synthsRef.current.eq.low.value = val;
                                        }} className="accent-amber-500" />
                                    </div>
                                </div>
                            </div>
                        )}

                        {tab === "MEMORY" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3">
                                <span className="text-xs font-bold text-emerald-400">💾 ファイル保存・読込</span>
                                <div className="flex gap-2 bg-slate-950 p-3 rounded border border-slate-800">
                                    <input type="text" value={slotName} onChange={e => setSlotName(e.target.value)} className="bg-slate-900 px-2 py-1 rounded text-slate-100 flex-1 border border-slate-800 font-bold text-xs" />
                                    <button onClick={exportProjectToFile} className="px-3 py-1 bg-emerald-600 text-white font-bold rounded text-xs">保存</button>
                                </div>
                                <input type="file" accept=".json" onChange={importProjectFromFile} className="text-[10px] text-slate-400" />
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<MasterSynthApp />);
    </script>
</body>
</html>
