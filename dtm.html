<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIC VICTORY - ULTIMATE MAESTRO v45.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans select-none pb-20 overflow-x-hidden">
    <div id="root">
        <div class="flex items-center justify-center h-screen text-amber-500 font-bold text-sm animate-pulse">
            究極マエストロシステム v45.0 読み込み中...
        </div>
    </div>

    <script type="text/babel">
        try {
            function MasterSynthApp() {
                const [tab, setTab] = React.useState("STUDIO");
                const [playing, setPlaying] = React.useState(false);
                const [flashColor, setFlashColor] = React.useState("border-orange-600");
                const [bpm, setBpm] = React.useState(112);
                const [currentBar, setCurrentBar] = React.useState(0);
                const [currentStep, setCurrentStep] = React.useState(-1);
                const [status, setStatus] = React.useState("✨ v45.0 鍵盤フラッシュ＆20パターンループ完全版：準備完了");

                const BARS = 8;
                const BAR_STEPS = 16;
                const TOTAL_STEPS = BARS * BAR_STEPS;

                const [selectedInstrument, setSelectedInstrument] = React.useState("synth");
                const [octaveShift, setOctaveShift] = React.useState(0);
                const [activeKeyFlash, setActiveKeyFlash] = React.useState(null);

                const [liveRecordMode, setLiveRecordMode] = React.useState(false);
                const [recordStepIndex, setRecordStepIndex] = React.useState(0);

                const [slotName, setSlotName] = React.useState("MAESTRO_BEAT_01");
                const [savedSlots, setSavedSlots] = React.useState({});

                const [instrumentSteps, setInstrumentSteps] = React.useState({
                    trumpet: new Array(TOTAL_STEPS).fill(null),
                    synth: new Array(TOTAL_STEPS).fill(null),
                    violin: new Array(TOTAL_STEPS).fill(null),
                    piano: new Array(TOTAL_STEPS).fill(null),
                    guitar: new Array(TOTAL_STEPS).fill(null),
                    subBass: new Array(TOTAL_STEPS).fill(null),
                    drums: new Array(TOTAL_STEPS).fill(null),
                    afroPerc: new Array(TOTAL_STEPS).fill(null),
                    rapVocals: new Array(TOTAL_STEPS).fill(null),
                });

                const synthsRef = React.useRef(null);
                const loopRef = React.useRef(null);

                const DOREMI_KEYS = [
                    { label: "ド (C)", baseNote: "C", color: "bg-white text-slate-900" },
                    { label: "レ (D)", baseNote: "D", color: "bg-white text-slate-900" },
                    { label: "ミ (E)", baseNote: "E", color: "bg-white text-slate-900" },
                    { label: "ファ (F)", baseNote: "F", color: "bg-white text-slate-900" },
                    { label: "ソ (G)", baseNote: "G", color: "bg-white text-slate-900" },
                    { label: "ラ (A)", baseNote: "A", color: "bg-white text-slate-900" },
                    { label: "シ (B)", baseNote: "B", color: "bg-white text-slate-900" },
                    { label: "高ド (C+)", baseNote: "C+", color: "bg-amber-200 text-slate-900" }
                ];

                const INSTRUMENTS = [
                    { id: "synth", label: "🎹 リードシンセ", color: "from-blue-900 to-indigo-950" },
                    { id: "subBass", label: "🔊 808重低音ベース", color: "from-amber-700 to-orange-900" },
                    { id: "violin", label: "🎻 バイオリン", color: "from-emerald-800 to-teal-950" },
                    { id: "drums", label: "🥁 ドラムキット", color: "from-red-800 to-amber-900" },
                    { id: "trumpet", label: "🎺 ブラス", color: "from-amber-600 to-yellow-800" },
                    { id: "piano", label: "🎹 ピアノ", color: "from-slate-700 to-slate-900" },
                    { id: "guitar", label: "🎸 ギター", color: "from-orange-800 to-amber-950" },
                    { id: "afroPerc", label: "🪘 パーカッション", color: "from-yellow-700 to-amber-900" },
                    { id: "rapVocals", label: "🎤 ボイス", color: "from-rose-800 to-purple-950" },
                ];

                const DRUM_PARTS = [
                    { id: "kick", label: "キック", note: "C1" },
                    { id: "snare", label: "スネア", note: "E1" },
                    { id: "hihat", label: "ハイハット", note: "F#1" },
                    { id: "clap", label: "クラップ", note: "D1" }
                ];

                const BASS_PARTS = [{ id: "sub808", label: "808サブ" }, { id: "synthBass", label: "シンセベース" }];

                // 20パターンのリズム・メロディ＆ループ定義
                const PATTERNS_20 = Array.from({ length: 20 }, (_, idx) => ({
                    id: idx + 1,
                    name: `パターン ${idx + 1}: ${["Soul Groove", "Popping Beat", "Ballad Flow", "Rock Drive", "Dance Anthem", "Pops Magic", "Funky Night", "Smooth Groove", "Heavy 808", "Cyber Stream", "Acoustic Breeze", "Electric Dream", "Sunset Groove", "Midnight Step", "Urban Vibe", "Cosmic Wave", "Future Beat", "Classic Flow", "Neo Soul", "Ultimate Master"][idx]}`,
                    bpm: 85 + (idx * 3) % 45
                }));

                React.useEffect(() => {
                    try {
                        const dest = Tone.Destination;
                        const limiter = new Tone.Limiter(-0.1).connect(dest);
                        const reverb = new Tone.Reverb({ roomSize: 0.75, dampening: 4000, wet: 0.2 }).connect(limiter);
                        const masterGain = new Tone.Gain(1.5).connect(reverb);

                        const trumpetSynth = new Tone.Synth({ oscillator: { type: "sawtooth" } }).connect(masterGain);
                        const synthLead = new Tone.Synth({ oscillator: { type: "fmsawtooth" } }).connect(masterGain);
                        const violinSynth = new Tone.Synth({ oscillator: { type: "triangle" } }).connect(masterGain);
                        const pianoSynth = new Tone.Synth({ oscillator: { type: "sine" } }).connect(masterGain);
                        const guitarSynth = new Tone.Synth({ oscillator: { type: "square" } }).connect(masterGain);

                        const bassSynths = {};
                        BASS_PARTS.forEach(p => { bassSynths[p.id] = new Tone.MonoSynth({ oscillator: { type: "sine" } }).connect(masterGain); });

                        const drumSynths = {};
                        DRUM_PARTS.forEach(p => { drumSynths[p.id] = new Tone.MembraneSynth().connect(masterGain); });

                        synthsRef.current = {
                            trumpet: trumpetSynth, synth: synthLead, violin: violinSynth, piano: pianoSynth, guitar: guitarSynth,
                            subBass: bassSynths, drums: drumSynths
                        };
                    } catch (e) {
                        console.error("Audio Init Error:", e);
                    }

                    return () => {
                        Tone.Transport.stop();
                        Tone.Transport.cancel();
                    };
                }, []);

                React.useEffect(() => {
                    Tone.Transport.bpm.value = bpm;
                }, [bpm]);

                React.useEffect(() => {
                    Tone.Transport.cancel();

                    if (playing) {
                        let stepCounter = 0;
                        loopRef.current = new Tone.Loop(time => {
                            let step = stepCounter % TOTAL_STEPS;
                            const bar = Math.floor(step / BAR_STEPS);
                            const sInBar = step % BAR_STEPS;

                            setCurrentStep(sInBar);
                            setCurrentBar(bar);
                            if (liveRecordMode) {
                                setRecordStepIndex(step);
                            }

                            if (sInBar % 2 === 0) setFlashColor("border-orange-500");

                            const syns = synthsRef.current;
                            if (!syns) return;

                            Object.keys(instrumentSteps).forEach(instKey => {
                                const val = instrumentSteps[instKey][step];
                                if (!val) return;

                                if (["drums", "subBass", "afroPerc", "rapVocals"].includes(instKey)) {
                                    if (typeof val === "object") {
                                        Object.keys(val).forEach(partKey => {
                                            if (val[partKey]) {
                                                if (instKey === "drums" && syns.drums && syns.drums[partKey]) {
                                                    const note = partKey === "kick" ? "C1" : partKey === "snare" ? "E1" : partKey === "hihat" ? "F#1" : "D1";
                                                    syns.drums[partKey].triggerAttackRelease(note, "8n", time);
                                                } else if (instKey === "subBass" && syns.subBass && syns.subBass[partKey]) {
                                                    syns.subBass[partKey].triggerAttackRelease("C2", "8n", time);
                                                }
                                            }
                                        });
                                    }
                                } else if (["trumpet", "synth", "violin", "piano", "guitar"].includes(instKey)) {
                                    const noteToPlay = typeof val === "string" ? val : "C3";
                                    if (syns[instKey]) syns[instKey].triggerAttackRelease(noteToPlay, "8n", time);
                                }
                            });

                            stepCounter++;
                        }, "16n").start(0);

                        Tone.Transport.start();
                    } else {
                        Tone.Transport.stop();
                    }
                }, [playing, instrumentSteps, liveRecordMode]);

                const togglePlay = async () => {
                    await Tone.start();
                    setPlaying(!playing);
                    setStatus(playing ? "⏸️ 停止しました" : `▶ 再生中 (BPM: ${bpm})`);
                };

                const getAdjustedNote = (baseNote) => {
                    const octaveMap = { "C": 3, "D": 3, "E": 3, "F": 3, "G": 3, "A": 3, "B": 3, "C+": 4 };
                    let oct = (octaveMap[baseNote] || 3) + octaveShift;
                    let cleanNote = baseNote.replace("+", "");
                    return `${cleanNote}${Math.max(1, Math.min(6, oct))}`;
                };

                const playLiveKeyboard = (baseNote, labelName) => {
                    const syns = synthsRef.current;
                    if (!syns) return;

                    const noteValue = getAdjustedNote(baseNote);

                    // 鍵盤フラッシュ演出
                    setActiveKeyFlash(baseNote);
                    setTimeout(() => setActiveKeyFlash(null), 180);

                    if (selectedInstrument === "drums") {
                        const partId = baseNote === "C" ? "kick" : baseNote === "D" ? "clap" : baseNote === "E" ? "snare" : "hihat";
                        if (syns.drums && syns.drums[partId]) {
                            syns.drums[partId].triggerAttackRelease(partId === "hihat" ? "F#1" : "C1", "8n");
                        }
                    } else if (selectedInstrument === "subBass") {
                        if (syns.subBass && syns.subBass.sub808) {
                            syns.subBass.sub808.triggerAttackRelease(noteValue, "8n");
                        }
                    } else if (syns[selectedInstrument]) {
                        syns[selectedInstrument].triggerAttackRelease(noteValue, "8n");
                    }

                    setStatus(`🎵 鍵盤演奏: [${labelName}] (${noteValue})`);

                    if (liveRecordMode) {
                        setInstrumentSteps(prev => {
                            const currentArr = [...prev[selectedInstrument]];
                            if (selectedInstrument === "drums") {
                                const partId = baseNote === "C" ? "kick" : baseNote === "D" ? "clap" : baseNote === "E" ? "snare" : "hihat";
                                const currentObj = currentArr[recordStepIndex] || {};
                                currentArr[recordStepIndex] = { ...currentObj, [partId]: true };
                            } else if (selectedInstrument === "subBass") {
                                const currentObj = currentArr[recordStepIndex] || {};
                                currentArr[recordStepIndex] = { ...currentObj, sub808: true };
                            } else {
                                currentArr[recordStepIndex] = noteValue;
                            }
                            return { ...prev, [selectedInstrument]: currentArr };
                        });
                        setStatus(`🔴 安全つけ足し記録: ステップ ${recordStepIndex + 1} に [${labelName}] を重ねました！`);
                    }
                };

                const toggleDrumGridStep = (partId, idx) => {
                    setInstrumentSteps(prev => {
                        const currentArr = [...prev.drums];
                        const currentObj = currentArr[idx] || {};
                        const updatedObj = { ...currentObj, [partId]: !currentObj[partId] };
                        currentArr[idx] = Object.values(updatedObj).some(Boolean) ? updatedObj : null;
                        return { ...prev, drums: currentArr };
                    });
                };

                const toggleStep = (instKey, idx) => {
                    setInstrumentSteps(prev => {
                        const currentArr = [...prev[instKey]];
                        const targetNote = getAdjustedNote("C");

                        if (["subBass", "afroPerc", "rapVocals"].includes(instKey)) {
                            const currentObj = currentArr[idx] || {};
                            const updatedObj = { ...currentObj, sub808: !currentObj.sub808 };
                            currentArr[idx] = Object.values(updatedObj).some(Boolean) ? updatedObj : null;
                        } else {
                            currentArr[idx] = currentArr[idx] === targetNote ? null : targetNote;
                        }
                        return { ...prev, [instKey]: currentArr };
                    });
                };

                const loadPattern20 = (pat) => {
                    setBpm(pat.bpm);
                    const newSteps = JSON.parse(JSON.stringify(instrumentSteps));
                    
                    Object.keys(newSteps).forEach(inst => {
                        const arr = new Array(TOTAL_STEPS).fill(null);
                        for (let s = 0; s < TOTAL_STEPS; s++) {
                            const sInBar = s % BAR_STEPS;
                            if (inst === "drums") {
                                arr[s] = {
                                    kick: sInBar % 4 === 0 || (pat.id % 2 === 0 && sInBar === 10),
                                    snare: sInBar === 4 || sInBar === 12,
                                    hihat: sInBar % 2 === 0,
                                    clap: sInBar === 12
                                };
                            } else if (inst === "subBass") {
                                if (sInBar % 4 === 0) arr[s] = { sub808: true };
                            } else {
                                const notes = ["C3", "E3", "G3", "B3", "C4"];
                                if (sInBar % 4 === 0 || sInBar % 4 === 2) {
                                    arr[s] = notes[(s + pat.id) % notes.length];
                                }
                            }
                        }
                        newSteps[inst] = arr;
                    });

                    setInstrumentSteps(newSteps);
                    setStatus(`🌟 【${pat.name}】の20パターンループ＆リズムを適用しました！`);
                };

                const clearSpecificInstrument = (instKey) => {
                    setInstrumentSteps(prev => ({ ...prev, [instKey]: new Array(TOTAL_STEPS).fill(null) }));
                    setStatus(`🗑️ クリア: 【${instKey}】のデータを消去しました`);
                };

                const clearAllSteps = () => {
                    const emptyMap = {};
                    Object.keys(instrumentSteps).forEach(k => { emptyMap[k] = new Array(TOTAL_STEPS).fill(null); });
                    setInstrumentSteps(emptyMap);
                    setStatus("🧹 全クリア完了");
                };

                const saveOrAppendSession = (isAppend) => {
                    if (isAppend && savedSlots[slotName]) {
                        const existing = savedSlots[slotName];
                        const merged = {};
                        Object.keys(instrumentSteps).forEach(inst => {
                            merged[inst] = instrumentSteps[inst].map((val, idx) => {
                                const oldVal = existing[inst][idx];
                                if (!val) return oldVal;
                                if (!oldVal) return val;
                                if (typeof val === "object" && typeof oldVal === "object") {
                                    return { ...oldVal, ...val };
                                }
                                return val;
                            });
                        });
                        setSavedSlots({ ...savedSlots, [slotName]: merged });
                        setStatus(`➕ セッション「${slotName}」に安全につけ足し保存しました！`);
                    } else {
                        setSavedSlots({ ...savedSlots, [slotName]: JSON.parse(JSON.stringify(instrumentSteps)) });
                        setStatus(`💾 セッション「${slotName}」を新規保存しました！`);
                    }
                };

                const loadSession = (name) => {
                    if (savedSlots[name]) {
                        setInstrumentSteps(JSON.parse(JSON.stringify(savedSlots[name])));
                        setSlotName(name);
                        setStatus(`📂 セッション「${name}」をロードしました！`);
                    }
                };

                const currentInstObj = INSTRUMENTS.find(i => i.id === selectedInstrument);

                return (
                    <div className={`min-h-screen bg-slate-950 text-slate-100 flex flex-col text-xs font-sans select-none border-8 transition-all duration-75 ${flashColor}`}>
                        <header className="bg-slate-900 border-b border-slate-800 px-3 py-2 flex items-center justify-between gap-2 sticky top-0 z-50 shadow-lg">
                            <span className="font-black text-sm bg-gradient-to-r from-amber-400 via-orange-500 to-red-500 bg-clip-text text-transparent">
                                MIC VICTORY <span className="text-[10px] text-orange-400 font-normal">v45.0 ULTIMATE MAESTRO</span>
                            </span>

                            <div className="flex items-center gap-1.5 flex-wrap">
                                <button onClick={togglePlay} className={`px-3 py-1.5 rounded font-bold text-xs shadow ${playing ? "bg-amber-600 text-white animate-bounce" : "bg-orange-700 text-white"}`}>
                                    {playing ? "■ 停止" : "▶ 再生スタート"}
                                </button>
                                <button onClick={clearAllSteps} className="px-2.5 py-1.5 bg-red-950 hover:bg-red-900 text-red-300 rounded font-bold text-xs border border-red-800">
                                    🧹 全クリア
                                </button>
                                <div className="flex items-center gap-1 bg-slate-950 px-2 py-0.5 rounded border border-slate-800">
                                    <span className="text-[9px] text-slate-400">BPM</span>
                                    <input type="number" value={bpm} onChange={e => setBpm(Math.max(60, Math.min(200, Number(e.target.value))))} className="w-12 bg-slate-900 text-center font-bold text-orange-500 rounded text-xs py-0.5" />
                                </div>
                            </div>
                        </header>

                        <nav className="bg-slate-900/90 border-b border-slate-800 px-2 py-1.5 flex gap-1 overflow-x-auto">
                            {[
                                { id: "STUDIO", label: "🎵 スタジオ & 20パターンループ" },
                                { id: "SAVED_LIST", label: "💾 安全つけ足し保存 & セッション" },
                            ].map(t => (
                                <button key={t.id} onClick={() => setTab(t.id)} className={`px-3 py-1 rounded text-center font-bold transition-all shrink-0 ${tab === t.id ? "bg-orange-600 text-white shadow" : "bg-slate-800/60 text-slate-400"}`}>
                                    {t.label}
                                </button>
                            ))}
                        </nav>

                        <div className="bg-slate-900/80 border-b border-slate-800 px-3 py-1.5 flex items-center justify-between flex-wrap gap-2">
                            <span className="text-[11px] text-orange-400 font-bold">💡 {status}</span>
                        </div>

                        <main className="p-2 flex flex-col gap-3">
                            {tab === "STUDIO" && (
                                <div className="flex flex-col gap-3">
                                    {/* 20パターン・ループ一括選択 */}
                                    <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-2 shadow">
                                        <span className="text-xs font-bold text-cyan-400">🌟 20パターン リズム・テンポ・メロディーループ選択 (Soul, Popping, Ballad, Rock, Dance, Pops)</span>
                                        <div className="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-5 gap-1.5 max-h-[140px] overflow-y-auto p-1 bg-slate-950 rounded border border-slate-800">
                                            {PATTERNS_20.map(pat => (
                                                <button key={pat.id} onClick={() => loadPattern20(pat)} className="py-2 px-2 bg-slate-900 hover:bg-orange-600 hover:text-white text-slate-300 rounded text-[10px] font-bold border border-slate-800 transition-all text-left truncate shadow">
                                                    {pat.name}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* 楽器選択 */}
                                    <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3 shadow">
                                        <div className="flex justify-between items-center flex-wrap gap-2">
                                            <span className="text-xs font-bold text-orange-400">① 楽器セレクト</span>
                                            <button onClick={() => clearSpecificInstrument(selectedInstrument)} className="px-2 py-0.5 bg-red-950 text-red-300 rounded text-[10px] border border-red-800">
                                                🗑️ この楽器をクリア
                                            </button>
                                        </div>
                                        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-9 gap-1.5">
                                            {INSTRUMENTS.map(inst => (
                                                <button key={inst.id} onClick={() => setSelectedInstrument(inst.id)} className={`py-2 px-1 rounded-lg font-bold text-[10px] transition-all border flex items-center justify-center gap-1 shadow ${selectedInstrument === inst.id ? `bg-gradient-to-r ${inst.color} border-white text-white ring-2 ring-white/30 scale-105` : "bg-slate-950 border-slate-800 text-slate-400"}`}>
                                                    {inst.label}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* ドレミファソラシド鍵盤 & フラッシュ ＆ 安全つけ足し録音 */}
                                    <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3 shadow border-amber-900/50">
                                        <div className="flex justify-between items-center flex-wrap gap-2">
                                            <span className="text-xs font-bold text-amber-400">② ドレミファソラシド鍵盤 (押したところフラッシュ) ＆ 安全つけ足し</span>
                                            <div className="flex items-center gap-2 flex-wrap">
                                                <div className="flex items-center gap-1 bg-slate-950 px-2 py-0.5 rounded border border-slate-800">
                                                    <span className="text-[9px] text-slate-400">オクターブ: {octaveShift >= 0 ? `+${octaveShift}` : octaveShift}</span>
                                                    <button onClick={() => setOctaveShift(Math.max(-2, octaveShift - 1))} className="px-1.5 bg-slate-800 text-white rounded font-bold">-</button>
                                                    <button onClick={() => setOctaveShift(Math.min(2, octaveShift + 1))} className="px-1.5 bg-slate-800 text-white rounded font-bold">+</button>
                                                </div>
                                                <button onClick={() => setLiveRecordMode(!liveRecordMode)} className={`px-3 py-1 rounded font-bold text-xs border transition-all ${liveRecordMode ? "bg-red-600 text-white border-white animate-pulse" : "bg-slate-800 text-slate-400 border-slate-700"}`}>
                                                    {liveRecordMode ? "🔴 安全つけ足し録音: ON" : "⚪ 安全つけ足し録音: OFF"}
                                                </button>
                                            </div>
                                        </div>

                                        {/* ドレミ鍵盤ボタン (フラッシュ連動) */}
                                        <div className="grid grid-cols-4 sm:grid-cols-8 gap-1.5 bg-slate-950 p-3 rounded border border-slate-800">
                                            {DOREMI_KEYS.map(k => {
                                                const isFlash = activeKeyFlash === k.baseNote;
                                                return (
                                                    <button 
                                                        key={k.baseNote} 
                                                        onClick={() => playLiveKeyboard(k.baseNote, k.label)} 
                                                        className={`py-4 px-1 rounded font-black text-xs shadow-lg transition-all border border-slate-700 flex flex-col items-center justify-center gap-1 ${isFlash ? "bg-amber-400 text-slate-950 scale-95 ring-4 ring-orange-500 shadow-orange-500/50" : k.color}`}
                                                    >
                                                        <span className="text-sm">{k.label.split(" ")[0]}</span>
                                                        <span className="text-[9px] text-slate-500">{k.label.split(" ")[1]}</span>
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>

                                    {/* グリッドシーケンサー */}
                                    <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3 shadow">
                                        <div className="flex justify-between items-center">
                                            <span className="text-xs font-bold text-cyan-400">③ グリッドシーケンサー ({currentInstObj.label}) - 小節: {currentBar + 1} / 8</span>
                                            <div className="flex gap-1">
                                                {Array.from({ length: BARS }).map((_, b) => (
                                                    <button key={b} onClick={() => setCurrentBar(b)} className={`w-7 h-7 rounded-full text-xs font-bold ${currentBar === b ? "bg-orange-600 text-white" : "bg-slate-800 text-slate-400"}`}>{b + 1}</button>
                                                ))}
                                            </div>
                                        </div>

                                        <div className="flex flex-col gap-2 bg-slate-950 p-3 rounded border border-slate-800">
                                            {selectedInstrument === "drums" ? (
                                                <div className="flex flex-col gap-2">
                                                    {DRUM_PARTS.map(part => (
                                                        <div key={part.id} className="flex flex-col gap-1">
                                                            <span className="text-[10px] text-orange-300 font-bold">{part.label}</span>
                                                            <div className="overflow-x-auto py-0.5">
                                                                <div className="grid gap-1 min-w-[540px]" style={{ gridTemplateColumns: "repeat(16, minmax(0, 1fr))" }}>
                                                                    {Array.from({ length: BAR_STEPS }).map((_, i) => {
                                                                        const stepIdx = currentBar * BAR_STEPS + i;
                                                                        const stepObj = instrumentSteps.drums[stepIdx] || {};
                                                                        const isActive = !!stepObj[part.id];
                                                                        const isCurrentPlay = playing && currentStep === i;

                                                                        return (
                                                                            <button key={i} onClick={() => toggleDrumGridStep(part.id, stepIdx)} className={`aspect-[3/4] w-full rounded border flex flex-col items-center justify-center text-[9px] transition-all ${isActive ? "bg-gradient-to-t from-red-600 to-amber-500 border-white text-white font-bold shadow-md scale-105" : "bg-slate-900 border-slate-800 text-slate-600"} ${isCurrentPlay ? "ring-2 ring-cyan-400" : ""}`}>
                                                                                <span className="font-bold text-[9px]">{i + 1}</span>
                                                                                {isActive && <span className="text-[7px] text-white">●</span>}
                                                                            </button>
                                                                        );
                                                                    })}
                                                                </div>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            ) : (
                                                <div className="overflow-x-auto py-1">
                                                    <div className="grid gap-1 min-w-[540px]" style={{ gridTemplateColumns: "repeat(16, minmax(0, 1fr))" }}>
                                                        {Array.from({ length: BAR_STEPS }).map((_, i) => {
                                                            const stepIdx = currentBar * BAR_STEPS + i;
                                                            const stepVal = instrumentSteps[selectedInstrument][stepIdx];
                                                            const isCurrentPlay = playing && currentStep === i;
                                                            let isActive = !!stepVal;

                                                            return (
                                                                <button key={i} onClick={() => toggleStep(selectedInstrument, stepIdx)} className={`aspect-[3/4] w-full rounded border flex flex-col items-center justify-center text-[9px] transition-all ${isActive ? "bg-gradient-to-t from-orange-700 to-amber-600 border-white text-white font-bold shadow-md scale-105" : "bg-slate-900 border-slate-800 text-slate-500"} ${isCurrentPlay ? "ring-2 ring-cyan-400" : ""}`}>
                                                                    <span className="font-bold text-[10px]">{i + 1}</span>
                                                                    {isActive && <span className="text-[7px] text-amber-200">♪</span>}
                                                                </button>
                                                            );
                                                        })}
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {tab === "SAVED_LIST" && (
                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3">
                                    <span className="text-xs font-bold text-emerald-400">💾 安全つけ足し保存・セッション管理</span>
                                    <div className="flex gap-2 bg-slate-950 p-3 rounded border border-slate-800 flex-wrap">
                                        <input type="text" value={slotName} onChange={e => setSlotName(e.target.value)} className="bg-slate-900 px-2 py-1 rounded text-slate-100 flex-1 border border-slate-800" placeholder="セッション名を入力" />
                                        <button onClick={() => saveOrAppendSession(false)} className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded text-xs">新規・上書き保存</button>
                                        <button onClick={() => saveOrAppendSession(true)} className="px-3 py-1.5 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded text-xs">➕ 安全につけ足し保存</button>
                                    </div>

                                    <div className="flex flex-col gap-2 bg-slate-950 p-3 rounded border border-slate-800 max-h-[260px] overflow-y-auto">
                                        <span className="text-[10px] text-slate-400">📂 保存済みセッション一覧</span>
                                        {Object.keys(savedSlots).length === 0 && (
                                            <span className="text-[11px] text-slate-500 text-center py-4">保存されたセッションはありません</span>
                                        )}
                                        {Object.keys(savedSlots).map(name => (
                                            <div key={name} className="flex justify-between items-center bg-slate-900 p-2.5 rounded border border-slate-800">
                                                <span className="font-bold text-orange-400 text-xs">{name}</span>
                                                <div className="flex gap-1.5">
                                                    <button onClick={() => loadSession(name)} className="px-3 py-1 bg-orange-600 hover:bg-orange-500 text-white rounded text-[10px] font-bold">ロード</button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </main>
                    </div>
                );
            }

            const rootElement = document.getElementById('root');
            if (rootElement) {
                ReactDOM.createRoot(rootElement).render(<MasterSynthApp />);
            }
        } catch (err) {
            document.getElementById('root').innerHTML = `
                <div class="p-6 text-red-400 font-bold">
                    <h2 class="text-lg mb-2">⚠️ 起動エラー</h2>
                    <p class="text-xs text-slate-300">${err.message}</p>
                </div>
            `;
        }
    </script>
</body>
</html>
