​React.useEffect(() => {
Tone.Transport.bpm.value = bpm;
Tone.Transport.cancel();
​if (playing) {
let stepCounter = 0;
loopRef.current = new Tone.Loop(time => {
let step = stepCounter % TOTAL_STEPS;
const bar = Math.floor(step / BAR_STEPS);
const sInBar = step % BAR_STEPS;
​setCurrentStep(sInBar);
setCurrentBar(bar);
​if (sInBar % 2 === 0) {
const colors = ["border-pink-500", "border-cyan-400", "border-yellow-400", "border-purple-500", "border-amber-400", "border-orange-500"];
setFlashColor(colors[Math.floor(Math.random() * colors.length)]);
}
​const syns = synthsRef.current;
if (!syns) return;
​Object.keys(instrumentSteps).forEach(instKey => {
if (instKey === "voiceTrack") return;
const val = instrumentSteps[instKey][step];
if (!val) return;
​if (instKey === "drums") {
if (typeof val === "object") {
Object.keys(val).forEach(partKey => {
if (val[partKey] && syns.drums[partKey]) {
if (partKey === "kick" || partKey === "subKick") syns.drums[partKey].triggerAttackRelease("C1", "8n", time);
else if (partKey.includes("tom")) syns.drums[partKey].triggerAttackRelease("G2", "8n", time);
else if (partKey === "cowbell") syns.drums[partKey].triggerAttackRelease("G4", "16n", time);
else if (partKey === "woodblock") syns.drums[partKey].triggerAttackRelease("C5", "32n", time);
else syns.drums[partKey].triggerAttackRelease("8n", time);
}
});
}
} else if (instKey === "africanPerc") {
syns.africanPerc.triggerAttackRelease("G2", "8n", time);
} else if (instKey === "subBass") {
syns.subBass.triggerAttackRelease("C1", "8n", time);
} else if (syns[instKey]) {
syns[instKey].triggerAttackRelease(typeof val === "string" ? val : "C4", "8n", time);
}
});
​stepCounter++;
}, "16n").start(0);
​Tone.Transport.start();
} else {
Tone.Transport.stop();
}
}, [playing, bpm, instrumentSteps]);
​const togglePlay = async () => {
await Tone.start();

};

await Tone.start();
setIsRecording(!isRecording);
setStatus(!isRecording ? "🔴 リアルタイム演奏録音中！鍵盤を叩くと記録されます" : "⏹️ 録音停止しました");
};
​const applyBeatPattern = (type, patternId) => {
const arr = new Array(TOTAL_STEPS).fill(null);
for (let s = 0; s < TOTAL_STEPS; s++) {
const sInBar = s % BAR_STEPS;
let kick = false, snare = false, hihat = false, clap = false, openHihat = false;
if (type === "8beat") {
kick = sInBar === 0 || sInBar === 8 || (patternId === 2 && sInBar === 10);
snare = sInBar === 4 || sInBar === 12;
hihat = sInBar % 2 === 0;
openHihat = sInBar === 14;
} else {
kick = sInBar % 5 === 0;
snare = sInBar === 4 || sInBar === 12;
hihat = sInBar % 3 === 0;
clap = sInBar === 17;
}
arr[s] = { kick, snare, hihat, clap, openHihat };
}
setInstrumentSteps(prev => ({ ...prev, drums: arr }));
setStatus(🥁 20種ドラムパターンを適用しました！);
};
​const applyAfricanPercPattern = (patternId) => {
setSelectedAfricanPatternId(patternId);
const arr = new Array(TOTAL_STEPS).fill(null);
for (let s = 0; s < TOTAL_STEPS; s++) {
const sInBar = s % BAR_STEPS;
let active = (patternId === 1) ? (sInBar === 0 || sInBar === 3 || sInBar === 7 || sInBar === 10) : (sInBar % 3 === 0);
if (active) arr[s] = "G2";
}
setInstrumentSteps(prev => ({ ...prev, africanPerc: arr }));
setStatus(🪘 アフリカ太鼓リズムを適用しました！);
};
​const toggleStep = (instKey, idx) => {
setInstrumentSteps(prev => {
const currentArr = [...prev[instKey]];
if (instKey === "drums") {
const currentObj = currentArr[idx] || {};
const updatedObj = { ...currentObj, [selectedDrumPart]: !currentObj[selectedDrumPart] };
const hasAny = Object.values(updatedObj).some(Boolean);
currentArr[idx] = hasAny ? updatedObj : null;
} else if (instKey === "africanPerc" || instKey === "subBass") {
currentArr[idx] = currentArr[idx] ? null : "C1";
} else {
currentArr[idx] = currentArr[idx] ? null : selectedNote;
}
return { ...prev, [instKey]: currentArr };
});
};
​const clearSpecificInstrument = (instKey) => {
setInstrumentSteps(prev => ({ ...prev, [instKey]: new Array(TOTAL_STEPS).fill(null) }));
setStatus(🗑️ 【${instKey}】をClearしました。);
};
​const clearAllSteps = () => {
const emptyMap = {};
Object.keys(instrumentSteps).forEach(k => { emptyMap[k] = new Array(TOTAL_STEPS).fill(null); });
setInstrumentSteps(emptyMap);
setStatus("🧹 すべての楽器を完全Clearしました。");
};
​const playNoteKeyboard = (note) => {
setSelectedNote(note);
const syns = synthsRef.current;
if (!syns) return;
​if (selectedInstrument === "drums") {
const drumSyn = syns.drums[selectedDrumPart];
if (drumSyn) {
if (selectedDrumPart === "kick" || selectedDrumPart === "subKick") drumSyn.triggerAttackRelease("C1", "8n");
else if (selectedDrumPart.includes("tom")) drumSyn.triggerAttackRelease("G2", "8n");
else if (selectedDrumPart === "cowbell") drumSyn.triggerAttackRelease("G4", "16n");
else if (selectedDrumPart === "woodblock") drumSyn.triggerAttackRelease("C5", "32n");
else drumSyn.triggerAttackRelease("8n");
}
} else if (selectedInstrument === "africanPerc") {
syns.africanPerc.triggerAttackRelease("G2", "8n");
} else if (selectedInstrument === "subBass") {
syns.subBass.triggerAttackRelease("C1", "8n");
} else if (syns[selectedInstrument]) {
syns[selectedInstrument].triggerAttackRelease(note, "8n");
}
​if (isRecording && currentStep !== -1) {
const stepIdx = currentBar * BAR_STEPS + currentStep;
toggleStep(selectedInstrument, stepIdx);
}
};
​const generateInstrumentAI = (instKey, genreId = "soul") => {
const scales = ["C4", "D4", "E4", "G4", "A4", "C5"];
const instArr = new Array(TOTAL_STEPS).fill(null);
for (let s = 0; s < TOTAL_STEPS; s++) {
const sInBar = s % BAR_STEPS;
if (instKey === "drums") {
instArr[s] = { kick: sInBar % 4 === 0, snare: sInBar === 4 || sInBar === 12, hihat: sInBar % 2 === 0, clap: sInBar === 12 };
} else if (sInBar % 3 === 0) {
instArr[s] = scales[Math.floor(Math.random() * scales.length)];
}
}
setInstrumentSteps(prev => ({ ...prev, [instKey]: instArr }));
setStatus(✨ 【${instKey}】にAIメロディを作成しました！);
};
​const generateAllAI = (genreId = "soul") => {
INSTRUMENTS.forEach(inst => {
if (inst.id !== "voiceTrack") generateInstrumentAI(inst.id, genreId);
});
setStatus(✨ 全楽器の一括AI作曲が完了しました！);
};
​const startVoiceRecording = async () => {
audioChunksRef.current = [];
try {
const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
const mediaRecorder = new MediaRecorder(stream);
mediaRecorderRef.current = mediaRecorder;
mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunksRef.current.push(e.data); };
mediaRecorder.onstop = () => {
const blob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
setVoiceAudioUrl(URL.createObjectURL(blob));
setStatus("🎤 ボイス録音が完了しました！");
};
mediaRecorder.start();
setIsVoiceRecording(true);
} catch (err) {
setStatus("❌ マイクを使用できません。");
}
};
​const stopVoiceRecording = () => {
if (mediaRecorderRef.current && isVoiceRecording) {
mediaRecorderRef.current.stop();
setIsVoiceRecording(false);
}
};
​const playVoiceAudio = () => {
if (voiceAudioUrl) new Audio(voiceAudioUrl).play();
};
​const saveCurrentSession = () => {
setSavedSlots({ ...savedSlots, [slotName]: JSON.parse(JSON.stringify(instrumentSteps)) });

};
