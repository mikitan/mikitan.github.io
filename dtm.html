<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ultimate Afro-Melody & Drum DAW</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body class="bg-black text-slate-100 font-sans select-none pb-32">
    <div id="root"></div>

    <script type="text/babel">
        function UltimateAfroDAW() {
            const [tab, setTab] = React.useState("EDIT");
            const [playing, setPlaying] = React.useState(false);
            
            // 8色フラッシュライト
            const [flashColorIndex, setFlashColorIndex] = React.useState(0);
            const FLASH_COLORS = [
                "border-cyan-500", "border-teal-500", "border-emerald-500", "border-indigo-500", 
                "border-purple-500", "border-pink-500", "border-rose-500", "border-amber-500"
            ];
            const FLASH_NAMES = ["シアン", "ティール", "エメラルド", "インディゴ", "パープル", "ピンク", "ローズ", "アンバー"];

            // テンポ (BPM) と小節
            const [bpm, setBpm] = React.useState(112);
            const [currentBar, setCurrentBar] = React.useState(0);
            const totalBars = 16;
            const BAR_STEPS = 16;
            const getMaxSteps = () => totalBars * BAR_STEPS;
            const [status, setStatus] = React.useState("🌍 アフリカ太鼓＆崩れないAIメロディDAW起動完了");

            // 選択中の楽器・入力モード切り替え
            const [selectedInst, setSelectedInst] = React.useState("afroDrum");
            const [inputMode, setInputMode] = React.useState("KEYBOARD"); 
            const [selectedNote, setSelectedNote] = React.useState("C3");
            const [repeatRate, setRepeatRate] = React.useState("16n");

            // 5バンド・イコライザー設定
            const [eqGains, setEqGains] = React.useState([0, 0, 0, 0, 0]);

            // 各楽器定義 (アフリカ楽器太鼓含む)
            const INSTRUMENTS = [
                { id: "afroDrum", label: "🪘 アフリカ太鼓 (ジャンベ/ジェンベ)" },
                { id: "kick", label: "🥁 キック (BD)" },
                { id: "snare", label: "💥 スネア (SD)" },
                { id: "hihat", label: "⚡ ハイハット (HH)" },
                { id: "sistmbeesu", label: "🎸 システムベース" },
                { id: "soulPiano", label: "🎹 スタンダードピアノ" },
                { id: "brassStab", label: "🎺 ブラススタブ" },
                { id: "synthLead", label: "🎶 シンセリード" },
            ];

            const [steps, setSteps] = React.useState({
                afroDrum: new Array(16 * BAR_STEPS).fill(null),
                kick: new Array(16 * BAR_STEPS).fill(null),
                snare: new Array(16 * BAR_STEPS).fill(null),
                hihat: new Array(16 * BAR_STEPS).fill(null),
                sistmbeesu: new Array(16 * BAR_STEPS).fill(null),
                soulPiano: new Array(16 * BAR_STEPS).fill(null),
                brassStab: new Array(16 * BAR_STEPS).fill(null),
                synthLead: new Array(16 * BAR_STEPS).fill(null),
            });

            // マイク録音
            const [micRecording, setMicRecording] = React.useState(false);
            const [micAudioUrl, setMicAudioUrl] = React.useState(null);
            const micMediaRecorderRef = React.useRef(null);
            const micChunksRef = React.useRef([]);

            // 全体ミックス録音
            const [mixRecordings, setMixRecordings] = React.useState([]);
            const [isRecordingMix, setIsRecordingMix] = React.useState(false);
            const liveAudioChunks = React.useRef([]);
            const mediaRecorderRef = React.useRef(null);
            const destinationRef = React.useRef(null);

            // 鍵盤手動記録・再生
            const [keyboardRecordings, setKeyboardRecordings] = React.useState([]);
            const [isKeyboardRecording, setIsKeyboardRecording] = React.useState(false);
            const liveKeyboardNotesRef = React.useRef([]);

            const synthsRef = React.useRef(null);
            const eqRef = React.useRef(null);
            const loopRef = React.useRef(null);

            // 崩れないAIパターン自動生成 (アフリカ太鼓のリズムパターン対応)
            const generateAiPattern = (instKey, maxS) => {
                const arr = new Array(maxS).fill(null);
                const notes = ["C2", "Eb2", "G2", "Bb2", "C3", "Eb3", "G3", "Bb3"];

                for (let s = 0; s < maxS; s++) {
                    const sInBar = s % BAR_STEPS;
                    const barIdx = Math.floor(s / BAR_STEPS);

                    if (instKey === "afroDrum") {
                        // アロハ・アフロポリリズム風の太鼓の刻み
                        if (sInBar === 0 || sInBar === 3 || sInBar === 6 || sInBar === 10 || sInBar === 12) {
                            arr[s] = "G1";
                        }
                    } else if (instKey === "kick") {
                        if (sInBar % 4 === 0) arr[s] = "C1";
                    } else if (instKey === "snare") {
                        if (sInBar === 4 || sInBar === 12) arr[s] = "D1";
                    } else if (instKey === "hihat") {
                        if (sInBar % 2 === 0) arr[s] = "F#1";
                    } else if (instKey === "sistmbeesu") {
                        if (sInBar % 4 === 0 || sInBar === 6) {
                            arr[s] = notes[(s + barIdx) % notes.length];
                        }
                    } else {
                        if (sInBar % 4 === 0 || sInBar === 3 || sInBar === 7) {
                            arr[s] = notes[(s * 2 + barIdx) % notes.length];
                        }
                    }
                }
                return arr;
            };

            const handleOverallAiOptimization = () => {
                const maxS = getMaxSteps();
                const newSteps = {};
                Object.keys(steps).forEach(k => {
                    newSteps[k] = generateAiPattern(k, maxS);
                });
                setSteps(newSteps);
                setBpm(108 + Math.floor(Math.random() * 12));
                setStatus("✨ アフリカ太鼓＆崩れないAIメロディを全体に適用しました！");
            };

            const handleAllClear = () => {
                const maxS = getMaxSteps();
                const cleared = {};
                Object.keys(steps).forEach(k => {
                    cleared[k] = new Array(maxS).fill(null);
                });
                setSteps(cleared);
                setStatus("🗑️ 全データをCrera（クリア）しました。");
            };

            const generateSingleInstAi = (instKey) => {
                const maxS = getMaxSteps();
                const arr = generateAiPattern(instKey, maxS);
                setSteps(prev => ({ ...prev, [instKey]: arr }));
                setStatus(`🎲 ${INSTRUMENTS.find(i => i.id === instKey)?.label} にAIパターンを適用しました！`);
            };

            const clearSingleInstrument = (instKey) => {
                setSteps(prev => ({ ...prev, [instKey]: new Array(getMaxSteps()).fill(null) }));
                setStatus(`🗑️ ${INSTRUMENTS.find(i => i.id === instKey)?.label} をCreraしました`);
            };

            // ランダムリピート（ランダム打ち込み生成）
            const handleRandomRepeat = (instKey) => {
                const maxS = getMaxSteps();
                const arr = new Array(maxS).fill(null);
                const notes = ["C3", "D3", "E3", "F3", "G3", "A3", "B3", "C4"];
                for (let s = 0; s < maxS; s++) {
                    if (Math.random() < 0.35) {
                        arr[s] = instKey === "afroDrum" ? "G1" : notes[Math.floor(Math.random() * notes.length)];
                    }
                }
                setSteps(prev => ({ ...prev, [instKey]: arr }));
                setStatus(`🎲 ${INSTRUMENTS.find(i => i.id === instKey)?.label} にランダムリピートを適用しました！`);
            };

            // 音源＆エフェクト初期化
            React.useEffect(() => {
                try {
                    const dest = Tone.context.createMediaStreamDestination();
                    destinationRef.current = dest;

                    const masterGain = new Tone.Gain(2.0).toDestination();
                    masterGain.connect(dest);

                    const eq = new Tone.EQ3({
                        low: 2,
                        mid: 0,
                        high: 1,
                        lowFrequency: 250,
                        highFrequency: 2500
                    }).connect(masterGain);
                    eqRef.current = eq;

                    const reverb = new Tone.Reverb({ decay: 2.2, wet: 0.25 }).connect(eq);

                    const syns = {};

                    // アフリカ太鼓 (ジャンベ風のパーカッシブシンセ)
                    syns.afroDrum = new Tone.MembraneSynth({
                        pitchDecay: 0.08,
                        octaves: 4,
                        oscillator: { type: "triangle" },
                        envelope: { attack: 0.002, decay: 0.35, sustain: 0.01, release: 0.2 }
                    }).connect(eq);

                    syns.kick = new Tone.MembraneSynth({
                        pitchDecay: 0.05,
                        octaves: 6,
                        oscillator: { type: "sine" },
                        envelope: { attack: 0.001, decay: 0.4, sustain: 0.01, release: 0.4 }
                    }).connect(eq);

                    syns.snare = new Tone.NoiseSynth({
                        noise: { type: "white" },
                        envelope: { attack: 0.001, decay: 0.2, sustain: 0 }
                    }).connect(eq);

                    syns.hihat = new Tone.MetalSynth({
                        frequency: 200,
                        envelope: { attack: 0.001, decay: 0.08, release: 0.05 },
                        harmonicity: 5.1,
                        modulationIndex: 32,
                        resonance: 4000,
                        octaves: 1.5
                    }).connect(eq);

                    syns.sistmbeesu = new Tone.MonoSynth({
                        oscillator: { type: "sawtooth" },
                        envelope: { attack: 0.01, decay: 0.4, sustain: 0.6, release: 0.2 },
                        filterEnvelope: { attack: 0.01, decay: 0.3, baseFrequency: 80, octaves: 3 }
                    }).connect(eq);

                    syns.soulPiano = new Tone.Synth({
                        oscillator: { type: "triangle" },
                        envelope: { attack: 0.005, decay: 0.4, sustain: 0.3, release: 0.4 }
                    }).connect(reverb);

                    syns.brassStab = new Tone.Synth({
                        oscillator: { type: "sawtooth" },
                        envelope: { attack: 0.01, decay: 0.3, sustain: 0.4, release: 0.2 }
                    }).connect(reverb);

                    syns.synthLead = new Tone.Synth({
                        oscillator: { type: "square" },
                        envelope: { attack: 0.02, decay: 0.3, sustain: 0.4, release: 0.3 }
                    }).connect(reverb);

                    synthsRef.current = syns;

                    setSteps({
                        afroDrum: generateAiPattern("afroDrum", 16 * BAR_STEPS),
                        kick: generateAiPattern("kick", 16 * BAR_STEPS),
                        snare: generateAiPattern("snare", 16 * BAR_STEPS),
                        hihat: generateAiPattern("hihat", 16 * BAR_STEPS),
                        sistmbeesu: generateAiPattern("sistmbeesu", 16 * BAR_STEPS),
                        soulPiano: generateAiPattern("soulPiano", 16 * BAR_STEPS),
                        brassStab: generateAiPattern("brassStab", 16 * BAR_STEPS),
                        synthLead: generateAiPattern("synthLead", 16 * BAR_STEPS),
                    });
                } catch(e) {}
                return () => { try { Tone.Transport.stop(); Tone.Transport.cancel(); } catch(e) {} };
            }, []);

            // EQ変更
            const handleEqChange = (index, val) => {
                const newGains = [...eqGains];
                newGains[index] = Number(val);
                setEqGains(newGains);
                if (eqRef.current) {
                    if (index === 0) eqRef.current.low.value = Number(val);
                    if (index === 2) eqRef.current.mid.value = Number(val);
                    if (index === 4) eqRef.current.high.value = Number(val);
                }
                setStatus(`🎚️ イコライザー調整 [${index + 1}]: ${val}dB`);
            };

            // マイク録音
            const toggleMicRecording = async () => {
                if (!micRecording) {
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        const recorder = new MediaRecorder(stream);
                        micChunksRef.current = [];
                        recorder.ondataavailable = e => { if (e.data.size > 0) micChunksRef.current.push(e.data); };
                        recorder.onstop = () => {
                            const blob = new Blob(micChunksRef.current, { type: 'audio/webm' });
                            setMicAudioUrl(URL.createObjectURL(blob));
                            setStatus("🎙️ マイク録音完了！");
                        };
                        recorder.start();
                        micMediaRecorderRef.current = recorder;
                        setMicRecording(true);
                        setStatus("🔴 マイク録音中...");
                    } catch(e) {
                        setStatus("⚠️ マイクエラー");
                    }
                } else {
                    micMediaRecorderRef.current?.stop();
                    setMicRecording(false);
                }
            };

            // 全体ミックス録音
            const toggleMixRecording = () => {
                if (!isRecordingMix) {
                    try {
                        liveAudioChunks.current = [];
                        const recorder = new MediaRecorder(destinationRef.current.stream);
                        recorder.ondataavailable = e => { if (e.data.size > 0) liveAudioChunks.current.push(e.data); };
                        recorder.onstop = () => {
                            const blob = new Blob(liveAudioChunks.current, { type: 'audio/webm' });
                            setMixRecordings(prev => [...prev, { id: Date.now(), url: URL.createObjectURL(blob), title: `MIX REC #${prev.length + 1}` }]);
                            setStatus("💾 全体ミックス録音を保存しました！");
                        };
                        recorder.start();
                        mediaRecorderRef.current = recorder;
                        setIsRecordingMix(true);
                        setStatus("🔴 全体ミックス録音中...");
                    } catch(e) {}
                } else {
                    mediaRecorderRef.current?.stop();
                    setIsRecordingMix(false);
                }
            };

            // 鍵盤手動記録・再生
            const toggleKeyboardRecording = () => {
                if (!isKeyboardRecording) {
                    liveKeyboardNotesRef.current = [];
                    setIsKeyboardRecording(true);
                    setStatus("🎙️ 鍵盤演奏の記録を開始しました！");
                } else {
                    setIsKeyboardRecording(false);
                    const recorded = [...liveKeyboardNotesRef.current];
                    if (recorded.length > 0) {
                        setKeyboardRecordings(prev => [...prev, { id: Date.now(), title: `鍵盤記録 (${selectedInst}) #${prev.length + 1}`, notes: recorded }]);
                        setStatus("💾 鍵盤記録を保存しました！");
                    }
                }
            };

            const playKeyboardRecording = (rec) => {
                setStatus(`▶ 鍵盤記録 "${rec.title}" 再生中...`);
                rec.notes.forEach(item => {
                    setTimeout(async () => {
                        try {
                            await Tone.start();
                            const syn = synthsRef.current?.[selectedInst];
                            if (syn) {
                                if (selectedInst === "afroDrum") syn.triggerAttackRelease("G1", "8n");
                                else if (selectedInst === "kick") syn.triggerAttackRelease("C1", "8n");
                                else if (selectedInst === "snare") syn.triggerAttackRelease("8n");
                                else if (selectedInst === "hihat") syn.triggerAttackRelease("32n");
                                else syn.triggerAttackRelease(item.note, item.duration || "8n");
                            }
                        } catch(e){}
                    }, item.time - rec.notes[0].time);
                });
            };

            // 再生ループ
            React.useEffect(() => {
                Tone.Transport.bpm.value = bpm;
                Tone.Transport.cancel();
                if (playing) {
                    let stepCounter = 0;
                    const maxS = getMaxSteps();

                    loopRef.current = new Tone.Loop(time => {
                        let step = stepCounter % maxS;
                        setCurrentBar(Math.floor(step / BAR_STEPS) % totalBars);

                        if (step % 4 === 0) {
                            setFlashColorIndex(prev => (prev + 1) % FLASH_COLORS.length);
                        }

                        const syns = synthsRef.current;
                        if (!syns) return;

                        Object.keys(steps).forEach(k => {
                            const val = steps[k][step];
                            if (val && syns[k]) {
                                try {
                                    if (k === "afroDrum") syns.afroDrum.triggerAttackRelease("G1", "8n", time);
                                    else if (k === "kick") syns.kick.triggerAttackRelease("C1", "8n", time);
                                    else if (k === "snare") syns.snare.triggerAttackRelease("8n", time);
                                    else if (k === "hihat") syns.hihat.triggerAttackRelease("32n", time);
                                    else syns[k].triggerAttackRelease(typeof val === "string" ? val : selectedNote, "8n", time);
                                } catch(e) {}
                            }
                        });
                        stepCounter++;
                    }, "16n").start(0);

                    Tone.Transport.start();
                } else {
                    Tone.Transport.stop();
                }
            }, [playing, bpm, steps, selectedNote]);

            const togglePlay = async () => {
                try { await Tone.start(); } catch(e) {}
                setPlaying(!playing);
            };

            const toggleStep = (instKey, idx) => {
                setSteps(prev => {
                    const arr = [...prev[instKey]];
                    arr[idx] = arr[idx] ? null : (instKey === "afroDrum" ? "G1" : instKey === "kick" ? "C1" : instKey === "snare" ? "D1" : instKey === "hihat" ? "F#1" : selectedNote);
                    return { ...prev, [instKey]: arr };
                });
            };

            const handleKeyboardNotePlay = async (note) => {
                try {
                    await Tone.start();
                    const syn = synthsRef.current?.[selectedInst];
                    if (syn) {
                        if (selectedInst === "afroDrum") syn.triggerAttackRelease("G1", repeatRate === "OFF" ? "8n" : repeatRate);
                        else if (selectedInst === "kick") syn.triggerAttackRelease("C1", "8n");
                        else if (selectedInst === "snare") syn.triggerAttackRelease("8n");
                        else if (selectedInst === "hihat") syn.triggerAttackRelease("32n");
                        else syn.triggerAttackRelease(note, repeatRate === "OFF" ? "8n" : repeatRate);
                    }
                    if (isKeyboardRecording) {
                        liveKeyboardNotesRef.current.push({ note, time: Date.now(), duration: "8n" });
                    }
                    setStatus(`🎵 演奏: ${selectedInst} (${note})`);
                } catch(e){}
            };

            const doremiKeyboardNotes = [
                { label: "ド (C3)", note: "C3" },
                { label: "レ (D3)", note: "D3" },
                { label: "ミ (E3)", note: "E3" },
                { label: "ファ (F3)", note: "F3" },
                { label: "ソ (G3)", note: "G3" },
                { label: "ラ (A3)", note: "A3" },
                { label: "シ (B3)", note: "B3" },
                { label: "高いド (C4)", note: "C4" },
            ];

            const chromaticNotes = ["C2", "Eb2", "F2", "G2", "Bb2", "C3", "Eb3", "F3", "G3", "Bb3", "C4", "Eb4"];

            return (
                <div className={`min-h-screen bg-black text-slate-100 text-xs font-sans select-none border-4 transition-all ${FLASH_COLORS[flashColorIndex]}`}>
                    
                    {/* ヘッダー */}
                    <header className="bg-gradient-to-r from-zinc-950 via-neutral-950 to-zinc-950 border-b border-zinc-800 p-2.5 flex flex-wrap items-center justify-between gap-2 sticky top-0 z-50 shadow-2xl">
                        <div className="flex items-center gap-2">
                            <span className="font-black text-xs bg-gradient-to-r from-cyan-400 via-teal-400 to-emerald-400 bg-clip-text text-transparent">
                                ULTIMATE AFRO-MELODY DAW
                            </span>
                            <span className="text-[9px] bg-zinc-900 border border-zinc-700 text-cyan-400 px-2 py-0.5 rounded-full font-bold">
                                フラッシュ: {FLASH_NAMES[flashColorIndex]}
                            </span>
                        </div>
                        <div className="flex items-center gap-1.5 flex-wrap">
                            <button onClick={togglePlay} className={`px-3.5 py-1 rounded-lg font-bold text-[11px] shadow ${playing ? "bg-cyan-500 text-black animate-bounce" : "bg-gradient-to-r from-cyan-600 to-teal-600 text-white"}`}>
                                {playing ? "■ 停止" : "▶ 再生"}
                            </button>
                            <button onClick={toggleMixRecording} className={`px-2.5 py-1 rounded-lg font-bold text-[11px] border ${isRecordingMix ? "bg-red-600 text-white border-white animate-pulse" : "bg-zinc-900 text-slate-200 border-zinc-700"}`}>
                                {isRecordingMix ? "🔴 録音中" : "💾 全体録音"}
                            </button>
                            <button onClick={handleOverallAiOptimization} className="px-2.5 py-1 bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-bold rounded-lg text-[10px] shadow">
                                ✨ 全体AI作成
                            </button>
                            <button onClick={handleAllClear} className="px-2.5 py-1 bg-red-800 text-white font-bold rounded-lg text-[10px] shadow hover:bg-red-700">
                                🗑️ Crera (全クリア)
                            </button>
                            <div className="flex items-center gap-1 bg-zinc-900 px-2 py-0.5 rounded-lg border border-zinc-700">
                                <span className="text-[9px] text-cyan-400 font-bold">BPM</span>
                                <input type="number" value={bpm} onChange={e => setBpm(Number(e.target.value))} className="w-10 bg-transparent text-center font-bold text-cyan-400 text-[11px] focus:outline-none" />
                            </div>
                        </div>
                    </header>

                    {/* タブ */}
                    <nav className="bg-zinc-900/95 border-b border-zinc-800 p-1.5 flex gap-1 overflow-x-auto">
                        {[
                            { id: "EDIT", label: "🪘 楽器・アフリカ太鼓・鍵盤・AI" },
                            { id: "MIC_DLAND", label: "🎙️ マイク録音" },
                            { id: "EQ_PANEL", label: "🎚️ イコライザー" },
                            { id: "REC_LIST", label: "💾 記録・再生管理" },
                        ].map(t => (
                            <button key={t.id} onClick={() => setTab(t.id)} className={`px-3 py-1 rounded-lg text-center font-bold text-[11px] shrink-0 ${tab === t.id ? "bg-gradient-to-r from-cyan-500 to-teal-600 text-black shadow" : "bg-zinc-800 text-slate-300"}`}>
                                {t.label}
                            </button>
                        ))}
                    </nav>

                    <div className="bg-zinc-950 px-3 py-1.5 text-[11px] text-cyan-400 border-b border-zinc-800 flex justify-between items-center">
                        <span className="truncate">💡 {status}</span>
                        <span className="text-slate-300 font-bold shrink-0 ml-2">16小節: {currentBar + 1} / 16</span>
                    </div>

                    <main className="p-2.5 flex flex-col gap-2.5 max-w-4xl mx-auto">

                        {tab === "EDIT" && (
                            <div className="flex flex-col gap-2.5">
                                
                                {/* 楽器セレクター */}
                                <div className="bg-zinc-900 border border-zinc-800 rounded-2xl p-3 flex flex-col gap-2 shadow-xl">
                                    <div className="flex justify-between items-center">
                                        <span className="text-[11px] font-bold text-cyan-400">🪘 アフリカ太鼓＆楽器セレクター</span>
                                    </div>
                                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-1.5">
                                        {INSTRUMENTS.map(inst => (
                                            <div key={inst.id} className="flex gap-1">
                                                <button onClick={() => setSelectedInst(inst.id)} className={`flex-1 py-2 px-2 rounded-xl font-bold text-[11px] truncate border text-left ${selectedInst === inst.id ? "bg-gradient-to-r from-cyan-500 to-teal-600 text-black border-white shadow" : "bg-zinc-950 text-slate-300 border-zinc-800"}`}>
                                                    {inst.label}
                                                </button>
                                                <button onClick={() => generateSingleInstAi(inst.id)} className="px-2 bg-purple-950 text-purple-200 rounded-xl text-[9px] font-bold border border-purple-800" title="AI作成">AI</button>
                                                <button onClick={() => handleRandomRepeat(inst.id)} className="px-2 bg-amber-950 text-amber-200 rounded-xl text-[9px] font-bold border border-amber-800" title="ランダムリピート">乱</button>
                                                <button onClick={() => clearSingleInstrument(inst.id)} className="px-2 bg-red-950 text-red-200 rounded-xl text-[9px] font-bold border border-red-800" title="Crer">Crer</button>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* 入力モード (鍵盤 or 手動) */}
                                <div className="bg-zinc-900 border border-zinc-800 rounded-2xl p-3 flex flex-col gap-2.5 shadow-xl">
                                    <div className="flex justify-between items-center flex-wrap gap-2">
                                        <div className="flex items-center gap-2">
                                            <span className="text-[11px] font-bold text-cyan-400">🎛️ モード切替:</span>
                                            <div className="flex gap-1 bg-zinc-950 p-1 rounded-xl border border-zinc-800">
                                                <button onClick={() => setInputMode("KEYBOARD")} className={`px-3 py-1 rounded-lg text-[10px] font-bold ${inputMode === "KEYBOARD" ? "bg-cyan-500 text-black" : "text-slate-400"}`}>
                                                    🎹 ドレミファ鍵盤＆記録
                                                </button>
                                                <button onClick={() => setInputMode("MANUAL")} className={`px-3 py-1 rounded-lg text-[10px] font-bold ${inputMode === "MANUAL" ? "bg-cyan-500 text-black" : "text-slate-400"}`}>
                                                    ✍️ 手動グリッド
                                                </button>
                                            </div>
                                        </div>

                                        {inputMode === "MANUAL" && (
                                            <div className="flex items-center gap-1.5">
                                                <span className="text-[10px] text-slate-300 font-bold">音階:</span>
                                                <select value={selectedNote} onChange={e => setSelectedNote(e.target.value)} className="bg-zinc-950 border border-zinc-700 text-cyan-400 font-bold px-2 py-1 rounded-lg text-[11px]">
                                                    {chromaticNotes.map(n => <option key={n} value={n}>{n}</option>)}
                                                </select>
                                            </div>
                                        )}
                                    </div>

                                    {inputMode === "KEYBOARD" ? (
                                        <div className="bg-zinc-950 p-3 rounded-xl border border-zinc-800 flex flex-col gap-2.5">
                                            <div className="flex justify-between items-center flex-wrap gap-2">
                                                <span className="text-[10px] text-cyan-400 font-bold">🎹 ドレミファ演奏 ＆ 記録 ({INSTRUMENTS.find(i=>i.id===selectedInst)?.label})</span>
                                                <button onClick={toggleKeyboardRecording} className={`px-3 py-1 rounded-lg text-[10px] font-bold border ${isKeyboardRecording ? "bg-red-600 text-white border-white animate-pulse" : "bg-zinc-900 text-slate-300 border-zinc-700"}`}>
                                                    {isKeyboardRecording ? "🔴 記録停止・保存" : "🎙️ 鍵盤演奏の記録開始"}
                                                </button>
                                            </div>

                                            <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                                                {doremiKeyboardNotes.map(k => (
                                                    <button key={k.note} onClick={() => handleKeyboardNotePlay(k.note)} className="py-3 px-2 rounded-xl text-center font-bold bg-gradient-to-b from-zinc-900 to-zinc-950 hover:from-cyan-500 hover:to-teal-600 hover:text-black text-slate-100 border border-zinc-700 shadow-md active:scale-95 transition-all">
                                                        <div className="text-[12px] text-cyan-400 hover:text-black">{k.label.split(" ")[0]}</div>
                                                        <div className="text-[9px] text-slate-400 hover:text-black">{k.note}</div>
                                                    </button>
                                                ))}
                                            </div>

                                            <div className="flex items-center justify-between gap-2 pt-1 border-t border-zinc-800">
                                                <span className="text-[10px] text-slate-400 font-bold">連打リピート:</span>
                                                <div className="flex gap-1">
                                                    {["OFF", "8n", "16n", "32n"].map(rate => (
                                                        <button key={rate} onClick={() => setRepeatRate(rate)} className={`px-2 py-0.5 rounded text-[10px] font-bold border ${repeatRate === rate ? "bg-cyan-500 text-black border-white" : "bg-zinc-900 text-slate-300 border-zinc-700"}`}>
                                                            {rate === "OFF" ? "通常" : rate}
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="bg-zinc-950 p-3 rounded-xl border border-zinc-800 flex flex-col gap-2">
                                            <div className="flex items-center justify-between">
                                                <span className="text-[10px] text-cyan-400 font-bold">✍️ 手動グリッド (小節: {currentBar + 1} / 16)</span>
                                                <button onClick={() => clearSingleInstrument(selectedInst)} className="text-[10px] text-red-400 font-bold px-2 py-0.5 bg-red-950 rounded border border-red-800">この楽器をCrera</button>
                                            </div>

                                            <div className="flex gap-1 overflow-x-auto p-1 bg-zinc-900 rounded-lg border border-zinc-800">
                                                {Array.from({ length: 16 }).map((_, b) => (
                                                    <button key={b} onClick={() => setCurrentBar(b)} className={`px-2 py-0.5 rounded text-[10px] font-bold shrink-0 ${currentBar === b ? "bg-cyan-500 text-black" : "bg-zinc-800 text-slate-300"}`}>
                                                        {b + 1}小節
                                                    </button>
                                                ))}
                                            </div>

                                            <div className="grid grid-cols-8 gap-1.5 pt-1">
                                                {Array.from({ length: BAR_STEPS }).map((_, i) => {
                                                    const idx = currentBar * BAR_STEPS + i;
                                                    const active = !!steps[selectedInst][idx];
                                                    return (
                                                        <button key={i} onClick={() => toggleStep(selectedInst, idx)} className={`h-11 rounded-lg border flex flex-col items-center justify-center text-[10px] font-bold shadow transition-all ${active ? "bg-cyan-500 border-white text-black scale-105" : "bg-zinc-900 border-zinc-800 text-slate-400"}`}>
                                                            <span>{i + 1}</span>
                                                            {active && <span className="text-[8px] font-black text-black bg-cyan-200 px-0.5 rounded mt-0.5">ON</span>}
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {tab === "MIC_DLAND" && (
                            <div className="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 flex flex-col gap-3 shadow-xl">
                                <span className="text-[12px] font-bold text-cyan-400">🎙️ マイク録音 (Mic Victory Dland)</span>
                                <div className="bg-zinc-950 p-4 rounded-xl border border-zinc-800 flex flex-col items-center gap-3">
                                    <button onClick={toggleMicRecording} className={`px-6 py-3 rounded-xl font-bold text-[12px] border ${micRecording ? "bg-red-600 text-white animate-pulse" : "bg-cyan-500 text-black"}`}>
                                        {micRecording ? "🔴 録音停止" : "🎙️ マイク録音を開始"}
                                    </button>
                                    {micAudioUrl && <audio src={micAudioUrl} controls className="w-full h-8 mt-2"></audio>}
                                </div>
                            </div>
                        )}

                        {tab === "EQ_PANEL" && (
                            <div className="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 flex flex-col gap-3 shadow-xl">
                                <span className="text-[12px] font-bold text-cyan-400">🎚️ イコライザー</span>
                                <div className="grid grid-cols-1 sm:grid-cols-5 gap-3 bg-zinc-950 p-4 rounded-xl border border-zinc-800">
                                    {["低音", "中低音", "中音", "高中音", "高音"].map((freq, idx) => (
                                        <div key={freq} className="flex flex-col items-center gap-2">
                                            <span className="text-[10px] text-slate-300 font-bold">{freq}</span>
                                            <input type="range" min="-15" max="15" step="1" value={eqGains[idx]} onChange={e => handleEqChange(idx, e.target.value)} className="w-full accent-cyan-500" />
                                            <span className="text-[10px] font-bold text-cyan-400">{eqGains[idx]} dB</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {tab === "REC_LIST" && (
                            <div className="flex flex-col gap-2.5">
                                <div className="bg-zinc-900 border border-zinc-800 rounded-2xl p-3 flex flex-col gap-2.5 shadow-xl">
                                    <span className="text-[11px] font-bold text-cyan-400">🎙️ 鍵盤演奏記録リスト</span>
                                    <div className="bg-zinc-950 p-3 rounded-xl border border-zinc-800 flex flex-col gap-2">
                                        {keyboardRecordings.length === 0 ? (
                                            <span className="text-[11px] text-slate-500 text-center py-4">鍵盤の記録はありません。</span>
                                        ) : (
                                            keyboardRecordings.map(rec => (
                                                <div key={rec.id} className="bg-zinc-900 p-2.5 rounded-xl border border-zinc-800 flex items-center justify-between">
                                                    <span className="text-[11px] font-bold text-slate-200">{rec.title}</span>
                                                    <button onClick={() => playKeyboardRecording(rec)} className="px-3 py-1 bg-cyan-500 text-black rounded-lg text-[10px] font-bold">▶ 再生</button>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>

                                <div className="bg-zinc-900 border border-zinc-800 rounded-2xl p-3 flex flex-col gap-2.5 shadow-xl">
                                    <span className="text-[11px] font-bold text-cyan-400">💾 全体ミックス録音一覧</span>
                                    <div className="bg-zinc-950 p-3 rounded-xl border border-zinc-800 flex flex-col gap-2">
                                        {mixRecordings.length === 0 ? (
                                            <span className="text-[11px] text-slate-500 text-center py-6">録音データはありません。</span>
                                        ) : (
                                            mixRecordings.map(rec => (
                                                <div key={rec.id} className="bg-zinc-900 p-2.5 rounded-xl border border-zinc-800 flex items-center justify-between">
                                                    <span className="text-[11px] font-bold text-slate-200">{rec.title}</span>
                                                    <div className="flex items-center gap-2">
                                                        <audio src={rec.url} controls className="h-7 w-40"></audio>
                                                        <a href={rec.url} download={`${rec.title}.webm`} className="px-3 py-1 bg-cyan-500 text-black rounded-lg text-[10px] font-bold">DL</a>
                                                    </div>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<UltimateAfroDAW/>);
    </script>
</body>
</html>
