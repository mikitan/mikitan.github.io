<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 爆音テンションMAX! SOUL, DISCO & ROBOT SYNTH v26.0 🔥</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tone.js for Sound Synthesis -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans select-none pb-20 overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        function MasterSynthApp() {
            const [tab, setTab] = React.useState("AI_STUDIO");
            const [playing, setPlaying] = React.useState(false);
            const [flashColor, setFlashColor] = React.useState("border-pink-500");
            const [bpm, setBpm] = React.useState(155); // テンション高め初期値！
            const [currentBar, setCurrentBar] = React.useState(0);
            const [currentStep, setCurrentStep] = React.useState(-1);
            const [status, setStatus] = React.useState("🔥 テンションMAX！全楽器をブチ鳴らせ！重低音＆高音＆効果音フェス開催中だぁッ！！");

            const BARS = 8;
            const BAR_STEPS = 16;
            const TOTAL_STEPS = BARS * BAR_STEPS;

            const [selectedInstrument, setSelectedInstrument] = React.useState("synth");
            const [selectedNote, setSelectedNote] = React.useState("C4");
            const [selectedDrumPart, setSelectedDrumPart] = React.useState("kick");
            const [inputMode, setInputMode] = React.useState("keyboard");

            // 楽器ステップデータ
            const [instrumentSteps, setInstrumentSteps] = React.useState({
                drums: new Array(TOTAL_STEPS).fill(null),
                subBass: new Array(TOTAL_STEPS).fill(null), // 重低音ベース
                robot: new Array(TOTAL_STEPS).fill(null),   // 効果音ロボット
                bass: new Array(TOTAL_STEPS).fill(null),     // ベースシンセ
                piano: new Array(TOTAL_STEPS).fill(null),
                synth: new Array(TOTAL_STEPS).fill(null),    // 高音シンセ
                voice: new Array(TOTAL_STEPS).fill(null),
                afroPerc: new Array(TOTAL_STEPS).fill(null),
                afroMel: new Array(TOTAL_STEPS).fill(null),
            });

            const [fxSettings, setFxSettings] = React.useState({
                reverbWet: 0.35,
                delayWet: 0.3,
                distortion: 0.7, // テンション爆上げ歪み！
                stereoPan: 0
            });

            const [savedSlots, setSavedSlots] = React.useState({});
            const [slotName, setSlotName] = React.useState("テンションMAXセッション1");

            const synthsRef = React.useRef(null);
            const loopRef = React.useRef(null);
            const pannerRef = React.useRef(null);

            // 高音から低音まで選べるドレミファ鍵盤ノート
            const NOTES = ["C2", "G2", "C3", "G3", "C4", "E4", "G4", "B4", "C5", "E5", "G5", "C6"];
            const SOLFEGE = { 
                "C2": "超低ド", "G2": "超低ソ", "C3": "低ド", "G3": "低ソ", 
                "C4": "ド", "E4": "ミ", "G4": "ソ", "B4": "シ", 
                "C5": "高ド", "E5": "高ミ", "G5": "高ソ", "C6": "超高ド" 
            };

            const INSTRUMENTS = [
                { id: "drums", label: "🥁 ドラムビート", color: "from-red-600 to-amber-600" },
                { id: "subBass", label: "🔊 重低音サブベース", color: "from-amber-600 to-orange-700" },
                { id: "bass", label: "🎸 ベースシンセ", color: "from-emerald-600 to-teal-600" },
                { id: "synth", label: "🎹 高音シンセ", color: "from-cyan-600 to-blue-700" },
                { id: "robot", label: "🤖 効果音ロボット", color: "from-purple-600 to-pink-600" },
                { id: "piano", label: "🎹 ピアノ", color: "from-blue-600 to-indigo-600" },
                { id: "voice", label: "🎤 ボイスFX", color: "from-rose-600 to-pink-700" },
                { id: "afroPerc", label: "🪘 アフロパーカッション", color: "from-yellow-600 to-amber-800" },
                { id: "afroMel", label: "🌍 民族メロディ", color: "from-lime-600 to-emerald-800" },
            ];

            const DRUM_PARTS = [
                { id: "kick", label: "重低音キック" },
                { id: "snare", label: "スネア" },
                { id: "hihat", label: "ハイハット" },
                { id: "clap", label: "クラップ" },
            ];

            const MASTER_21_PRESETS = Array.from({ length: 21 }, (_, i) => {
                const id = i + 1;
                const genres = ["Cyber", "Afro", "Disco", "Hardcore", "Rock", "Soul", "Pops"];
                const names = [
                    "超爆音サイバー・ロボットディスコ", "アフロビーツ・ジャングルパーティ", "サタデーナイト・ハイパーディスコ",
                    "エモーショナル・爆音ラブバラード", "ヘヴィメタル・アグレッシブロッケン", "スムーズR&B・グルーヴ爆発",
                    "フューチャー・ベースエレクトロ爆誕", "トライバル・アフロ狂乱ビート", "モータウン・ソウルアンセムMAX",
                    "スタジアム・ロック超絶アンセム", "ピアノ・メランコリック爆音", "サイケデリック・ファンク極まる",
                    "アマピアノ・クラブ狂いシャッフル", "アコースティック・サンセット狂騒", "エレクトリック・ダンス・フロア炸裂",
                    "オールドスクール・ヒップホップ極上", "サンバ・カーニバル狂喜乱舞ビート", "グランジ・オルタナティブ爆音",
                    "ドリーミー・アンビエント狂気", "スーパー・ハイテンポ・ブレイクビーツ", "伝説のグランド・フィナーレMAX"
                ];
                return { id, name: `${id}. ${names[i]}`, genre: genres[i % genres.length], bpm: 130 + (i * 3) % 60 };
            });

            // 音響・シンセサイザー初期化
            React.useEffect(() => {
                const masterGain = new Tone.Gain(1.3).toDestination();
                const panner = new Tone.Panner(0).connect(masterGain);
                pannerRef.current = panner;

                const reverb = new Tone.Reverb({ decay: 2.0, wet: fxSettings.reverbWet }).connect(panner);
                const delay = new Tone.FeedbackDelay({ delayTime: "8n", feedback: 0.3, wet: fxSettings.delayWet }).connect(reverb);
                const distortion = new Tone.Distortion(fxSettings.distortion).connect(delay);

                // 重低音サブベース
                const subBassSynth = new Tone.MonoSynth({
                    oscillator: { type: "sawtooth" },
                    envelope: { attack: 0.005, decay: 0.4, sustain: 0.3, release: 0.2 },
                    filterEnvelope: { attack: 0.001, decay: 0.3, baseFrequency: 40, octaves: 5 }
                }).connect(distortion);

                // ベースシンセ
                const bassSynth = new Tone.MonoSynth({
                    oscillator: { type: "square" },
                    envelope: { attack: 0.01, decay: 0.25, sustain: 0.2, release: 0.1 }
                }).connect(distortion);

                // 高音シンセ
                const synthLead = new Tone.Synth({
                    oscillator: { type: "sawtooth" },
                    envelope: { attack: 0.005, decay: 0.2, sustain: 0.5, release: 0.2 }
                }).connect(delay);

                // 効果音ロボット
                const robotSynth = new Tone.Synth({
                    oscillator: { type: "pulse", width: 0.8 },
                    envelope: { attack: 0.001, decay: 0.1, sustain: 0.1, release: 0.05 }
                }).connect(distortion);

                const kickSynth = new Tone.MembraneSynth({
                    pitchDecay: 0.06, octaves: 12, oscillator: { type: "sine" },
                    envelope: { attack: 0.001, decay: 0.7, sustain: 0.02, release: 0.4 }
                }).connect(masterGain);

                const snareSynth = new Tone.NoiseSynth({
                    noise: { type: "white" },
                    envelope: { attack: 0.001, decay: 0.25, sustain: 0 }
                }).connect(reverb);

                const hihatSynth = new Tone.MetalSynth({
                    frequency: 800, envelope: { attack: 0.001, decay: 0.05, release: 0.01 },
                    harmonicity: 6.0, modulationIndex: 50, resonance: 8000, octaves: 3
                }).connect(reverb);

                const clapSynth = new Tone.NoiseSynth({
                    noise: { type: "pink" },
                    envelope: { attack: 0.01, decay: 0.2, sustain: 0 }
                }).connect(reverb);

                const pianoSynth = new Tone.Synth({
                    oscillator: { type: "triangle" },
                    envelope: { attack: 0.01, decay: 0.3, sustain: 0.4, release: 0.5 }
                }).connect(reverb);

                const voiceSynth = new Tone.Synth({
                    oscillator: { type: "sine" },
                    envelope: { attack: 0.02, decay: 0.3, sustain: 0.4, release: 0.3 }
                }).connect(reverb);

                const afroPercSynth = new Tone.MembraneSynth({
                    pitchDecay: 0.03, octaves: 5, oscillator: { type: "triangle" },
                    envelope: { attack: 0.001, decay: 0.25, sustain: 0.05, release: 0.1 }
                }).connect(reverb);

                const afroMelSynth = new Tone.FMSynth({
                    harmonicity: 3.0, modulationIndex: 8,
                    oscillator: { type: "sawtooth" },
                    envelope: { attack: 0.001, decay: 0.3, sustain: 0.2, release: 0.2 },
                    modulation: { type: "square" }
                }).connect(delay);

                synthsRef.current = {
                    drums: { kick: kickSynth, snare: snareSynth, hihat: hihatSynth, clap: clapSynth },
                    subBass: subBassSynth,
                    bass: bassSynth,
                    synth: synthLead,
                    robot: robotSynth,
                    piano: pianoSynth,
                    voice: voiceSynth,
                    afroPerc: afroPercSynth,
                    afroMel: afroMelSynth,
                    masterGain, reverb, delay, distortion
                };

                return () => {
                    Tone.Transport.stop();
                    Tone.Transport.cancel();
                };
            }, []);

            React.useEffect(() => {
                const syns = synthsRef.current;
                if (!syns) return;
                syns.reverb.wet.value = fxSettings.reverbWet;
                syns.delay.wet.value = fxSettings.delayWet;
                syns.distortion.distortion = fxSettings.distortion;
                if (pannerRef.current) {
                    pannerRef.current.pan.value = fxSettings.stereoPan;
                }
            }, [fxSettings]);

            // 演奏ループ
            React.useEffect(() => {
                Tone.Transport.bpm.value = bpm;
                Tone.Transport.cancel();

                if (playing) {
                    let stepCounter = 0;
                    loopRef.current = new Tone.Loop(time => {
                        let step = stepCounter % TOTAL_STEPS;
                        const bar = Math.floor(step / BAR_STEPS);
                        const sInBar = step % BAR_STEPS;

                        setCurrentStep(sInBar);
                        setCurrentBar(bar);

                        if (sInBar % 2 === 0) {
                            const colors = ["border-pink-500", "border-cyan-400", "border-yellow-400", "border-purple-500", "border-emerald-400", "border-red-500"];
                            setFlashColor(colors[Math.floor(Math.random() * colors.length)]);
                        }

                        const syns = synthsRef.current;
                        if (!syns) return;

                        Object.keys(instrumentSteps).forEach(instKey => {
                            const val = instrumentSteps[instKey][step];
                            if (!val) return;

                            if (instKey === "drums") {
                                if (typeof val === "object") {
                                    if (val.kick) syns.drums.kick.triggerAttackRelease("C1", "8n", time);
                                    if (val.snare) syns.drums.snare.triggerAttackRelease("8n", time);
                                    if (val.hihat) syns.drums.hihat.triggerAttackRelease("32n", time, 0.9);
                                    if (val.clap) syns.drums.clap.triggerAttackRelease("8n", time);
                                }
                            } else if (instKey === "subBass") {
                                syns.subBass.triggerAttackRelease(typeof val === "string" ? val : "C2", "8n", time);
                            } else if (instKey === "robot") {
                                syns.robot.triggerAttackRelease(typeof val === "string" ? val : "C5", "16n", time);
                            } else if (instKey === "afroPerc") {
                                syns.afroPerc.triggerAttackRelease("G2", "8n", time);
                            } else if (syns[instKey]) {
                                syns[instKey].triggerAttackRelease(typeof val === "string" ? val : "C4", "8n", time);
                            }
                        });

                        stepCounter++;
                    }, "16n").start(0);

                    Tone.Transport.start();
                } else {
                    Tone.Transport.stop();
                }
            }, [playing, bpm, instrumentSteps]);

            const togglePlay = async () => {
                await Tone.start();
                setPlaying(!playing);
                setStatus(playing ? "停止したぜ！" : `🔥 爆音再生中だァァーーッ！！ (BPM: ${bpm})`);
            };

            // 手動書き込み（ドレミファ鍵盤またはグリッドから直接つけ足し）
            const toggleStep = (instKey, idx) => {
                setInstrumentSteps(prev => {
                    const currentArr = [...prev[instKey]];
                    if (instKey === "drums") {
                        const currentObj = currentArr[idx] || { kick: false, snare: false, hihat: false, clap: false };
                        const updatedObj = { ...currentObj, [selectedDrumPart]: !currentObj[selectedDrumPart] };
                        const hasAny = Object.values(updatedObj).some(Boolean);
                        currentArr[idx] = hasAny ? updatedObj : null;
                    } else if (instKey === "afroPerc") {
                        currentArr[idx] = currentArr[idx] ? null : 1;
                    } else {
                        // 鍵盤やグリッドで選んだノートをつけ足し・書き込み！
                        currentArr[idx] = currentArr[idx] ? null : selectedNote;
                    }
                    return { ...prev, [instKey]: currentArr };
                });
            };

            const clearSpecificInstrument = (instKey) => {
                setInstrumentSteps(prev => ({
                    ...prev,
                    [instKey]: new Array(TOTAL_STEPS).fill(null)
                }));
                const instName = INSTRUMENTS.find(i => i.id === instKey)?.label || instKey;
                setStatus(`🗑️ 【${instName}】をクリアしたぜ！`);
            };

            // 鍵盤クリックで試聴 ＆ 選択中ステップへの書き込みもワンタップ！
            const playNoteKeyboard = (note) => {
                setSelectedNote(note);
                const syns = synthsRef.current;
                if (!syns) return;

                if (selectedInstrument === "drums") {
                    if (selectedDrumPart === "kick") syns.drums.kick.triggerAttackRelease("C1", "8n");
                    else if (selectedDrumPart === "snare") syns.drums.snare.triggerAttackRelease("8n");
                    else if (selectedDrumPart === "hihat") syns.drums.hihat.triggerAttackRelease("32n");
                    else syns.drums.clap.triggerAttackRelease("8n");
                } else if (selectedInstrument === "subBass") {
                    syns.subBass.triggerAttackRelease(note, "8n");
                } else if (selectedInstrument === "bass") {
                    syns.bass.triggerAttackRelease(note, "8n");
                } else if (selectedInstrument === "synth") {
                    syns.synth.triggerAttackRelease(note, "8n");
                } else if (selectedInstrument === "robot") {
                    syns.robot.triggerAttackRelease(note, "16n");
                } else if (syns[selectedInstrument]) {
                    syns[selectedInstrument].triggerAttackRelease(note, "8n");
                }
            };

            // 各楽器AIメロディ作成（テンション高めアレンジ）
            const generateAIForSpecificInstrument = (instKey, style = "cyber") => {
                const newArr = new Array(TOTAL_STEPS).fill(null);
                
                const scales = {
                    cyber: ["C2", "G2", "C3", "G3", "C4", "G4", "C5", "G5"],
                    disco: ["C3", "E3", "G3", "A3", "C4", "E4", "G4", "C5"],
                    afro: ["C3", "D3", "F3", "G3", "A3", "C4", "E4", "G4"],
                    hardcore: ["C2", "C#2", "G2", "C3", "D#3", "G3", "C4", "C5"],
                    rock: ["C2", "G2", "A#2", "C3", "F3", "G3", "A#3", "C4"],
                    robot: ["C3", "C#3", "G3", "C4", "D#4", "G4", "C5", "G5"]
                };
                const scale = scales[style] || scales.cyber;

                for (let s = 0; s < TOTAL_STEPS; s++) {
                    const sInBar = s % BAR_STEPS;

                    if (instKey === "drums") {
                        const kick = sInBar % 4 === 0 || sInBar === 10;
                        const snare = sInBar === 4 || sInBar === 12;
                        const hihat = true;
                        const clap = sInBar === 12 || sInBar === 15;
                        newArr[s] = { kick, snare, hihat, clap };
                    } else if (instKey === "subBass") {
                        if (sInBar % 2 === 0 || sInBar % 3 === 0) {
                            const subNotes = ["C2", "G2", "C3"];
                            newArr[s] = subNotes[Math.floor(Math.random() * subNotes.length)];
                        }
                    } else if (instKey === "bass") {
                        if (sInBar % 2 === 0) {
                            newArr[s] = scale[Math.floor(Math.random() * 4)];
                        }
                    } else if (instKey === "synth") {
                        // 高音シンセのキレキレメロディ
                        if (sInBar % 2 === 0 || sInBar % 3 === 1) {
                            const highNotes = ["C4", "E4", "G4", "C5", "E5", "G5"];
                            newArr[s] = highNotes[Math.floor(Math.random() * highNotes.length)];
                        }
                    } else if (instKey === "robot") {
                        // 効果音ロボットのピコピコ高音
                        if (sInBar === 3 || sInBar === 7 || sInBar === 11 || sInBar === 15) {
                            const robotNotes = ["C5", "G5", "C6"];
                            newArr[s] = robotNotes[Math.floor(Math.random() * robotNotes.length)];
                        }
                    } else if (["piano", "voice", "afroMel"].includes(instKey)) {
                        if (sInBar % 4 === 0 || sInBar % 4 === 2) {
                            newArr[s] = scale[Math.floor(Math.random() * scale.length)];
                        }
                    } else if (instKey === "afroPerc") {
                        if (sInBar % 3 === 0 || sInBar % 4 === 1) {
                            newArr[s] = 1;
                        }
                    }
                }

                setInstrumentSteps(prev => ({ ...prev, [instKey]: newArr }));
                setStatus(`✨ 【${INSTRUMENTS.find(i => i.id === instKey)?.label}】のAIメロディを【${style}】でブチ生成したぜ！！`);
            };

            const generateAllAI = (style = "cyber") => {
                INSTRUMENTS.forEach(inst => {
                    generateAIForSpecificInstrument(inst.id, style);
                });
                setStatus(`🔥 全楽器が一斉に【${style}】スタイルで爆音AI作曲されたぜぇぇーーッ！！`);
            };

            const applyMaster21Preset = (presetId) => {
                const preset = MASTER_21_PRESETS.find(p => p.id === presetId);
                setBpm(preset.bpm);
                const styleMap = { Cyber: "cyber", Afro: "afro", Disco: "disco", Hardcore: "hardcore", Rock: "rock", Soul: "disco", Pops: "cyber" };
                const st = styleMap[preset.genre] || "cyber";
                generateAllAI(st);
                setStatus(`🌟 【${preset.name}】をロード完了！テンションMAXでブチ上がれ！！`);
            };

            const saveCurrentSession = () => {
                setSavedSlots(prev => ({ ...prev, [slotName]: JSON.parse(JSON.stringify(instrumentSteps)) }));
                setStatus(`💾 セッション「${slotName}」をガッチリ保存したぜ！`);
            };

            const loadSession = (name) => {
                if (savedSlots[name]) {
                    setInstrumentSteps(JSON.parse(JSON.stringify(savedSlots[name])));
                    setStatus(`📂 セッション「${name}」をロードしたぜ！`);
                }
            };

            const clearAllSteps = () => {
                setInstrumentSteps({
                    drums: new Array(TOTAL_STEPS).fill(null),
                    subBass: new Array(TOTAL_STEPS).fill(null),
                    robot: new Array(TOTAL_STEPS).fill(null),
                    bass: new Array(TOTAL_STEPS).fill(null),
                    piano: new Array(TOTAL_STEPS).fill(null),
                    synth: new Array(TOTAL_STEPS).fill(null),
                    voice: new Array(TOTAL_STEPS).fill(null),
                    afroPerc: new Array(TOTAL_STEPS).fill(null),
                    afroMel: new Array(TOTAL_STEPS).fill(null),
                });
                setStatus("🧹 すべてのステップをきれいさっぱりクリアしたぜ！");
            };

            const currentInstObj = INSTRUMENTS.find(i => i.id === selectedInstrument);

            return (
                <div className={`min-h-screen bg-slate-950 text-slate-100 flex flex-col text-xs font-sans select-none border-8 transition-all duration-75 ${flashColor}`}>
                    
                    {/* ヘッダー */}
                    <header className="bg-slate-900 border-b border-slate-800 px-3 py-2 flex items-center justify-between gap-2 sticky top-0 z-50 shadow-lg">
                        <div className="flex items-center gap-2">
                            <span className="font-black text-sm bg-gradient-to-r from-amber-400 via-pink-500 to-cyan-400 bg-clip-text text-transparent animate-pulse">
                                🚀 TENSION MAX SYNTH <span className="text-[10px] text-pink-400 font-normal">v26.0</span>
                            </span>
                        </div>

                        <div className="flex items-center gap-2">
                            <button
                                onClick={togglePlay}
                                className={`px-5 py-1.5 rounded-lg font-black text-xs shadow-lg transition-transform active:scale-95 ${
                                    playing ? "bg-amber-400 text-slate-950 animate-bounce ring-4 ring-amber-400/50" : "bg-gradient-to-r from-pink-600 to-purple-600 text-white animate-pulse"
                                }`}
                            >
                                {playing ? "■ 停止" : "▶ 爆音再生！！"}
                            </button>
                            
                            <div className="flex items-center gap-1 bg-slate-950 px-2 py-1 rounded border border-slate-800">
                                <span className="text-[9px] text-pink-400 font-bold">BPM</span>
                                <input
                                    type="number"
                                    value={bpm}
                                    onChange={e => setBpm(Math.max(80, Math.min(250, Number(e.target.value))))}
                                    className="w-12 bg-slate-900 text-center font-black text-amber-400 rounded text-xs py-0.5"
                                />
                            </div>
                        </div>
                    </header>

                    {/* ナビゲーション */}
                    <nav className="bg-slate-900/90 border-b border-slate-800 px-2 py-1.5 flex gap-1 overflow-x-auto">
                        {[
                            { id: "AI_STUDIO", label: "✨ 各楽器AI作曲 ＆ つけ足し" },
                            { id: "PLAY", label: "🎹 ドレミファ鍵盤 ＆ グリッド" },
                            { id: "PRESETS21", label: "🌟 爆音21曲マスター" },
                            { id: "MEMORY", label: "💾 記憶・Clear" },
                            { id: "MIXER", label: "🎚️ 歪み・音響" },
                        ].map(t => (
                            <button
                                key={t.id}
                                onClick={() => setTab(t.id)}
                                className={`px-3 py-1.5 rounded font-bold transition-all shrink-0 ${
                                    tab === t.id ? "bg-gradient-to-r from-amber-400 to-pink-500 text-slate-950 shadow-md font-black" : "bg-slate-800/60 text-slate-400 hover:text-white"
                                }`}
                            >
                                {t.label}
                            </button>
                        ))}
                    </nav>

                    {/* ステータスバー */}
                    <div className="bg-slate-900/80 px-3 py-1.5 text-[11px] text-amber-400 font-bold border-b border-slate-900 truncate">
                        <span>💡 {status}</span>
                    </div>

                    <main className="p-2 flex flex-col gap-3">

                        {/* タブ1: AI作曲 ＆ つけ足しスタジオ */}
                        {tab === "AI_STUDIO" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-4 flex flex-col gap-4">
                                <div className="text-xs font-black text-pink-400 flex items-center justify-between">
                                    <span>✨ 各楽器のAIメロディ作成 & 重低音・高音・効果音スタジオ</span>
                                    <span className="text-[10px] text-slate-400">ワンタップでジャンル別爆音作曲！</span>
                                </div>

                                <div className="grid grid-cols-2 sm:grid-cols-6 gap-2 bg-slate-950 p-3 rounded border border-slate-800">
                                    {[
                                        { id: "cyber", name: "🚀 サイバー", desc: "重低音＆高音キレキレ" },
                                        { id: "hardcore", name: "⚡ ハードコア", desc: "爆音ディストーション" },
                                        { id: "disco", name: "🕺 ディスコ", desc: "ノリノリ4つ打ち" },
                                        { id: "afro", name: "🌍 アフロビーツ", desc: "ポリリズムグルーヴ" },
                                        { id: "rock", name: "🎸 ロック", desc: "疾走パワーコード" },
                                        { id: "robot", name: "🤖 ロボット", desc: "ピコピコ効果音MAX" },
                                    ].map(st => (
                                        <button
                                            key={st.id}
                                            onClick={() => generateAllAI(st.id)}
                                            className="p-2.5 bg-slate-900 hover:bg-purple-950/60 border border-slate-800 hover:border-pink-500 rounded text-left flex flex-col gap-1 transition-all shadow group"
                                        >
                                            <span className="font-bold text-slate-200 text-[11px] group-hover:text-pink-400">{st.name}</span>
                                            <span className="text-[9px] text-slate-400">{st.desc}</span>
                                            <span className="text-[9px] text-pink-400 font-black mt-1">▶ 全楽器AI爆誕</span>
                                        </button>
                                    ))}
                                </div>

                                <div className="flex flex-col gap-2">
                                    <span className="text-[11px] font-bold text-slate-300">楽器ごとに個別AI作成 ＆ クリア:</span>
                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                                        {INSTRUMENTS.map(inst => (
                                            <div key={inst.id} className="bg-slate-950 p-2.5 rounded border border-slate-800 flex flex-col gap-2">
                                                <div className="flex items-center justify-between">
                                                    <span className="font-black text-slate-200 text-xs">{inst.label}</span>
                                                    <button
                                                        onClick={() => clearSpecificInstrument(inst.id)}
                                                        className="px-2 py-0.5 bg-red-950 hover:bg-red-900 text-red-300 rounded text-[9px] font-bold border border-red-800 transition-all"
                                                    >
                                                        🗑️ クリア
                                                    </button>
                                                </div>
                                                <div className="grid grid-cols-3 gap-1">
                                                    {["cyber", "hardcore", "disco", "afro", "rock", "robot"].map(st => (
                                                        <button
                                                            key={st}
                                                            onClick={() => generateAIForSpecificInstrument(inst.id, st)}
                                                            className="py-1 px-1 bg-slate-900 hover:bg-pink-600 hover:text-white text-slate-300 rounded text-[9px] font-bold border border-slate-800 transition-all text-center"
                                                        >
                                                            {st === "cyber" ? "サイバー" : st === "hardcore" ? "ハード" : st === "disco" ? "ディスコ" : st === "afro" ? "アフロ" : st === "rock" ? "ロック" : "ロボット"}
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* タブ2: ドレミファ鍵盤 ＆ グリッド手動書き込み */}
                        {tab === "PLAY" && (
                            <>
                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-2.5 flex flex-col gap-2.5">
                                    <div className="flex justify-between items-center">
                                        <span className="text-[11px] font-black text-amber-400">🎹 手動書き込み ＆ 楽器選択:</span>
                                        <div className="flex gap-1 items-center">
                                            <button
                                                onClick={() => clearSpecificInstrument(selectedInstrument)}
                                                className="px-2 py-0.5 bg-red-950 hover:bg-red-900 text-red-300 font-bold rounded text-[10px] border border-red-800"
                                            >
                                                🗑️ この楽器クリア
                                            </button>
                                            <button 
                                                onClick={() => setInputMode("keyboard")}
                                                className={`px-2.5 py-0.5 rounded text-[10px] font-black ${inputMode === "keyboard" ? "bg-pink-600 text-white shadow" : "bg-slate-800 text-slate-400"}`}
                                            >
                                                ドレミ鍵盤
                                            </button>
                                            <button 
                                                onClick={() => setInputMode("grid")}
                                                className={`px-2.5 py-0.5 rounded text-[10px] font-black ${inputMode === "grid" ? "bg-pink-600 text-white shadow" : "bg-slate-800 text-slate-400"}`}
                                            >
                                                グリッド
                                            </button>
                                        </div>
                                    </div>

                                    {/* 楽器ボタン一覧（重低音、高音、効果音ロボット完備！） */}
                                    <div className="grid grid-cols-3 sm:grid-cols-5 md:grid-cols-9 gap-1.5">
                                        {INSTRUMENTS.map(inst => (
                                            <button
                                                key={inst.id}
                                                onClick={() => setSelectedInstrument(inst.id)}
                                                className={`py-2 px-1 rounded-lg font-black text-[11px] transition-all border flex items-center justify-center gap-1 shadow ${
                                                    selectedInstrument === inst.id
                                                        ? `bg-gradient-to-r ${inst.color} border-white text-white ring-2 ring-white/50 scale-105`
                                                        : "bg-slate-950 border-slate-800 text-slate-400 hover:text-slate-200"
                                                }`}
                                            >
                                                {inst.label}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {selectedInstrument === "drums" && (
                                    <div className="bg-slate-900 border border-slate-800 rounded-lg p-2.5 flex items-center gap-2">
                                        <span className="text-[11px] font-bold text-slate-300">ドラムパーツ選択:</span>
                                        <div className="flex gap-1.5 overflow-x-auto">
                                            {DRUM_PARTS.map(part => (
                                                <button
                                                    key={part.id}
                                                    onClick={() => setSelectedDrumPart(part.id)}
                                                    className={`px-3 py-1 rounded text-[11px] font-bold shrink-0 ${
                                                        selectedDrumPart === part.id ? "bg-red-600 text-white shadow" : "bg-slate-800 text-slate-300"
                                                    }`}
                                                >
                                                    {part.label}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {/* 超強力ドレミファ鍵盤パネル（つけ足し・手動書き込み用） */}
                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-2">
                                    <div className="flex justify-between items-center">
                                        <span className="text-[11px] font-black text-pink-400">🎹 ドレミファ鍵盤（クリックで試聴＆選択中ノート変更！下のグリッドをタップして書き込み！）</span>
                                        <span className="text-[10px] text-cyan-400 font-bold">選択中: <strong className="text-white text-xs">{selectedNote} ({SOLFEGE[selectedNote]})</strong></span>
                                    </div>
                                    <div className="grid grid-cols-6 sm:grid-cols-12 gap-1.5">
                                        {NOTES.map(note => (
                                            <button
                                                key={note}
                                                onClick={() => playNoteKeyboard(note)}
                                                className={`py-3 rounded font-black flex flex-col items-center justify-center gap-0.5 border transition-all shadow-md ${
                                                    selectedNote === note 
                                                        ? "bg-gradient-to-t from-amber-500 to-yellow-400 text-slate-950 border-white ring-2 ring-white scale-105" 
                                                        : "bg-slate-950 text-slate-200 border-slate-800 hover:bg-slate-800"
                                                }`}
                                            >
                                                <span className="text-xs">{SOLFEGE[note]}</span>
                                                <span className="text-[8px] text-slate-400">{note}</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-2 flex items-center justify-between">
                                    <span className="text-[11px] font-bold text-slate-300">
                                        小節選択: <strong className="text-pink-400">{currentBar + 1}小節目 / 8小節</strong>
                                    </span>
                                    <div className="flex gap-1">
                                        {Array.from({ length: BARS }).map((_, b) => (
                                            <button
                                                key={b}
                                                onClick={() => setCurrentBar(b)}
                                                className={`w-7 h-7 rounded-full text-xs font-black ${
                                                    currentBar === b ? "bg-amber-400 text-slate-950 shadow" : "bg-slate-800 text-slate-400"
                                                }`}
                                            >
                                                {b + 1}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* グリッドエディタ（つけ足し・書き込みメイン） */}
                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 overflow-x-auto">
                                    <div className="text-xs font-black text-cyan-400 mb-2 flex items-center justify-between">
                                        <span>🎯 グリッドエディタ（タップして音符をつけ足し・削除！）: <strong className="text-white">{currentInstObj.label}</strong></span>
                                        <span className="text-[10px] text-slate-400">{currentBar + 1}小節目 (16ステップ)</span>
                                    </div>
                                    <div className="grid gap-1 min-w-[560px]" style={{ gridTemplateColumns: "repeat(16, minmax(0, 1fr))" }}>
                                        {Array.from({ length: BAR_STEPS }).map((_, i) => {
                                            const stepIdx = currentBar * BAR_STEPS + i;
                                            const stepVal = instrumentSteps[selectedInstrument][stepIdx];
                                            const isCurrentPlay = playing && currentStep === i;

                                            let isActive = selectedInstrument === "drums" 
                                                ? (stepVal && stepVal[selectedDrumPart]) 
                                                : ["subBass", "afroPerc"].includes(selectedInstrument)
                                                ? !!stepVal
                                                : !!stepVal;

                                            return (
                                                <button
                                                    key={i}
                                                    onClick={() => toggleStep(selectedInstrument, stepIdx)}
                                                    className={`aspect-[3/4] w-full rounded border flex flex-col items-center justify-center text-[9px] transition-all ${
                                                        isActive
                                                            ? "bg-gradient-to-t from-amber-600 via-pink-600 to-purple-600 border-white text-white font-black shadow-lg shadow-pink-500/50 scale-105"
                                                            : "bg-slate-950 border-slate-800 text-slate-500 hover:border-slate-700"
                                                    } ${isCurrentPlay ? "ring-2 ring-cyan-400 bg-cyan-950/40" : ""}`}
                                                >
                                                    <span className="font-black text-[10px]">{i + 1}</span>
                                                    {stepVal && !["drums", "subBass", "afroPerc"].includes(selectedInstrument) && (
                                                        <span className="text-[7px] text-amber-200 font-bold truncate px-0.5">{SOLFEGE[stepVal] || stepVal}</span>
                                                    )}
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>
                            </>
                        )}

                        {/* タブ3: 爆音21曲マスター */}
                        {tab === "PRESETS21" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3">
                                <div className="text-xs font-black text-pink-400">🌟 爆音テンションMAX全21曲マスタープリセット</div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2 max-h-[400px] overflow-y-auto">
                                    {MASTER_21_PRESETS.map((preset) => (
                                        <button
                                            key={preset.id}
                                            onClick={() => applyMaster21Preset(preset.id)}
                                            className="p-3 bg-slate-950 border border-slate-800 hover:border-pink-500 rounded-lg text-left flex flex-col gap-1 transition-all shadow group hover:bg-slate-900"
                                        >
                                            <div className="flex justify-between items-center">
                                                <span className="font-bold text-slate-200 text-[11px] group-hover:text-pink-400">{preset.name}</span>
                                                <span className="text-[9px] bg-pink-950 text-pink-300 px-1.5 py-0.5 rounded font-black">{preset.genre}</span>
                                            </div>
                                            <span className="text-[10px] text-cyan-400 font-bold">BPM: {preset.bpm} ⚡ 爆音自動セット</span>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* タブ4: 記憶・保存・Clear */}
                        {tab === "MEMORY" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3">
                                <div className="text-xs font-black text-emerald-400">💾 セッション記憶・ロード・全クリア</div>
                                
                                <div className="flex flex-col gap-2 bg-slate-950 p-3 rounded border border-slate-800">
                                    <span className="text-[11px] font-bold text-slate-300">現在の爆音セッションを保存:</span>
                                    <div className="flex gap-2">
                                        <input
                                            type="text"
                                            value={slotName}
                                            onChange={e => setSlotName(e.target.value)}
                                            className="bg-slate-900 px-2.5 py-1 rounded text-slate-100 flex-1 border border-slate-800 font-bold text-xs"
                                        />
                                        <button
                                            onClick={saveCurrentSession}
                                            className="px-4 py-1 bg-emerald-600 hover:bg-emerald-500 text-white font-black rounded text-xs shadow"
                                        >
                                            💾 記憶する
                                        </button>
                                    </div>
                                </div>

                                <div className="flex flex-col gap-2 bg-slate-950 p-3 rounded border border-slate-800">
                                    <span className="text-[11px] font-bold text-slate-300">保存済みセッションのロード:</span>
                                    <div className="flex flex-wrap gap-1.5">
                                        {Object.keys(savedSlots).length === 0 ? (
                                            <span className="text-[10px] text-slate-500">保存されたセッションはまだないぜ！</span>
                                        ) : (
                                            Object.keys(savedSlots).map(name => (
                                                <button
                                                    key={name}
                                                    onClick={() => loadSession(name)}
                                                    className="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-cyan-400 rounded text-xs font-bold border border-slate-700 shadow"
                                                >
                                                    📂 {name}
                                                </button>
                                            ))
                                        )}
                                    </div>
                                </div>

                                <div className="flex justify-between items-center bg-slate-950 p-3 rounded border border-slate-800">
                                    <span className="text-[11px] font-bold text-red-400">全楽器のリセット:</span>
                                    <button
                                        onClick={clearAllSteps}
                                        className="px-4 py-1.5 bg-red-600 hover:bg-red-500 text-white font-black rounded text-xs shadow"
                                    >
                                        🧹 すべてクリア
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* タブ5: 音響・歪みエフェクト */}
                        {tab === "MIXER" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3">
                                <div className="text-xs font-black text-cyan-400">🎚️ 爆音歪みディストーション ＆ 音響エフェクト</div>
                                <div className="bg-slate-950 p-3 rounded border border-slate-800 flex flex-col gap-3">
                                    <label className="text-[10px] text-slate-300 flex flex-col gap-1 font-bold">
                                        🔥 歪み度合い (Distortion - テンション爆上げ): {Math.round(fxSettings.distortion * 100)}%
                                        <input type="range" min="0" max="1" step="0.05" value={fxSettings.distortion} onChange={e => setFxSettings({...fxSettings, distortion: Number(e.target.value)})} className="accent-pink-500" />
                                    </label>
                                    <label className="text-[10px] text-slate-300 flex flex-col gap-1 font-bold">
                                        ステレオワイド (左右パンニング): {Math.round(fxSettings.stereoPan * 100)}%
                                        <input type="range" min="-1" max="1" step="0.1" value={fxSettings.stereoPan} onChange={e => setFxSettings({...fxSettings, stereoPan: Number(e.target.value)})} className="accent-cyan-500" />
                                    </label>
                                    <label className="text-[10px] text-slate-300 flex flex-col gap-1 font-bold">
                                        リバーブ (残響): {Math.round(fxSettings.reverbWet * 100)}%
                                        <input type="range" min="0" max="1" step="0.05" value={fxSettings.reverbWet} onChange={e => setFxSettings({...fxSettings, reverbWet: Number(e.target.value)})} className="accent-amber-500" />
                                    </label>
                                </div>
                            </div>
                        )}

                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(getElementById('root')).render(<MasterSynthApp />);
    </script>
</body>
</html>
