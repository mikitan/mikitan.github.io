<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOUL, DISCO & ROBOT MASTER SYNTHESIZER v28.0 - ALL INTEGRATED</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tone.js for Sound Synthesis -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans select-none pb-16 overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        function MasterSynthApp() {
            const [tab, setTab] = React.useState("ALL_STUDIO");
            const [playing, setPlaying] = React.useState(false);
            const [isRecording, setIsRecording] = React.useState(false);
            const [flashColor, setFlashColor] = React.useState("border-cyan-500");
            const [bpm, setBpm] = React.useState(112);
            const [currentBar, setCurrentBar] = React.useState(0);
            const [currentStep, setCurrentStep] = React.useState(-1);
            const [status, setStatus] = React.useState("✨ すべての楽器を一括録音・編集・Clear・記憶・試聴・リスト保存対応 v28.0！");

            const BARS = 8;
            const BAR_STEPS = 16;
            const TOTAL_STEPS = BARS * BAR_STEPS;

            const [selectedInstrument, setSelectedInstrument] = React.useState("synth");
            const [selectedNote, setSelectedNote] = React.useState("C4");
            const [selectedDrumPart, setSelectedDrumPart] = React.useState("kick");
            const [inputMode, setInputMode] = React.useState("grid");

            // 全楽器のステップデータ
            const [instrumentSteps, setInstrumentSteps] = React.useState({
                drums: new Array(TOTAL_STEPS).fill(null),
                subBass: new Array(TOTAL_STEPS).fill(null),
                robot: new Array(TOTAL_STEPS).fill(null),
                bass: new Array(TOTAL_STEPS).fill(null),
                piano: new Array(TOTAL_STEPS).fill(null),
                synth: new Array(TOTAL_STEPS).fill(null),
                guitar: new Array(TOTAL_STEPS).fill(null),
                violin: new Array(TOTAL_STEPS).fill(null),
                voice: new Array(TOTAL_STEPS).fill(null),
                afroPerc: new Array(TOTAL_STEPS).fill(null),
                afroMel: new Array(TOTAL_STEPS).fill(null),
            });

            const [fxSettings, setFxSettings] = React.useState({
                reverbWet: 0.35,
                delayWet: 0.25,
                distortion: 0.2,
                stereoPan: 0
            });

            const [savedSlots, setSavedSlots] = React.useState({});
            const [slotName, setSlotName] = React.useState("マイソング_01");

            const synthsRef = React.useRef(null);
            const loopRef = React.useRef(null);
            const pannerRef = React.useRef(null);

            const NOTES = ["C4", "D4", "E4", "F4", "G4", "A4", "B4", "C5"];
            const SOLFEGE = { "C4": "ド", "D4": "レ", "E4": "ミ", "F4": "ファ", "G4": "ソ", "A4": "ラ", "B4": "シ", "C5": "ド" };

            const INSTRUMENTS = [
                { id: "drums", label: "🥁 ドラム", color: "from-red-600 to-amber-600" },
                { id: "subBass", label: "🔊 重低音ベース", color: "from-amber-600 to-orange-700" },
                { id: "robot", label: "🤖 ロボットFX", color: "from-purple-600 to-pink-600" },
                { id: "bass", label: "🎸 ベース", color: "from-emerald-600 to-teal-600" },
                { id: "piano", label: "🎹 ピアノ", color: "from-blue-600 to-indigo-600" },
                { id: "synth", label: "🎹 シンセ", color: "from-cyan-600 to-blue-700" },
                { id: "guitar", label: "🎸 エレキギター", color: "from-orange-600 to-red-700" },
                { id: "violin", label: "🎻 バイオリン", color: "from-amber-500 to-yellow-700" },
                { id: "voice", label: "🎤 ボイス", color: "from-rose-600 to-pink-700" },
                { id: "afroPerc", label: "🪘 アフリカ太鼓", color: "from-yellow-600 to-amber-800" },
                { id: "afroMel", label: "🌍 民族メロディ", color: "from-lime-600 to-emerald-800" },
            ];

            const DRUM_PARTS = [
                { id: "kick", label: "キック" },
                { id: "snare", label: "スネア" },
                { id: "hihat", label: "ハイハット" },
                { id: "clap", label: "クラップ" },
            ];

            // 音響・シンセ初期化
            React.useEffect(() => {
                const masterGain = new Tone.Gain(1.2).toDestination();
                const panner = new Tone.Panner(0).connect(masterGain);
                pannerRef.current = panner;

                const reverb = new Tone.Reverb({ decay: 2.0, wet: fxSettings.reverbWet }).connect(panner);
                const delay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.3, wet: fxSettings.delayWet }).connect(reverb);
                const distortion = new Tone.Distortion(fxSettings.distortion).connect(delay);

                const subBassSynth = new Tone.MonoSynth({
                    oscillator: { type: "triangle" },
                    envelope: { attack: 0.01, decay: 0.4, sustain: 0.3, release: 0.3 },
                    filterEnvelope: { attack: 0.001, decay: 0.3, baseFrequency: 80, octaves: 3 }
                }).connect(distortion);

                const robotSynth = new Tone.Synth({
                    oscillator: { type: "square" },
                    envelope: { attack: 0.01, decay: 0.15, sustain: 0.2, release: 0.1 }
                }).connect(distortion);

                const bassSynth = new Tone.MonoSynth({
                    oscillator: { type: "sine" },
                    envelope: { attack: 0.02, decay: 0.3, sustain: 0.4, release: 0.2 }
                }).connect(distortion);

                const kickSynth = new Tone.MembraneSynth({
                    pitchDecay: 0.04, octaves: 8, oscillator: { type: "sine" },
                    envelope: { attack: 0.001, decay: 0.5, sustain: 0.01, release: 0.4 }
                }).connect(masterGain);

                const snareSynth = new Tone.NoiseSynth({
                    noise: { type: "white" },
                    envelope: { attack: 0.001, decay: 0.25, sustain: 0 }
                }).connect(reverb);

                const hihatSynth = new Tone.MetalSynth({
                    frequency: 500, envelope: { attack: 0.001, decay: 0.05, release: 0.01 },
                    harmonicity: 5.0, modulationIndex: 35, resonance: 6000, octaves: 2
                }).connect(reverb);

                const clapSynth = new Tone.NoiseSynth({
                    noise: { type: "pink" },
                    envelope: { attack: 0.01, decay: 0.18, sustain: 0 }
                }).connect(reverb);

                const pianoSynth = new Tone.Synth({
                    oscillator: { type: "sine" },
                    envelope: { attack: 0.01, decay: 0.4, sustain: 0.3, release: 0.6 }
                }).connect(reverb);

                const synthLead = new Tone.Synth({
                    oscillator: { type: "sawtooth" },
                    envelope: { attack: 0.02, decay: 0.3, sustain: 0.4, release: 0.3 }
                }).connect(delay);

                const guitarSynth = new Tone.Synth({
                    oscillator: { type: "sawtooth" },
                    envelope: { attack: 0.005, decay: 0.25, sustain: 0.2, release: 0.15 }
                }).connect(distortion);

                const violinSynth = new Tone.Synth({
                    oscillator: { type: "sine" },
                    envelope: { attack: 0.1, decay: 0.5, sustain: 0.7, release: 0.5 }
                }).connect(reverb);

                const voiceSynth = new Tone.Synth({
                    oscillator: { type: "triangle" },
                    envelope: { attack: 0.05, decay: 0.3, sustain: 0.6, release: 0.4 }
                }).connect(reverb);

                const afroPercSynth = new Tone.MembraneSynth({
                    pitchDecay: 0.02, octaves: 4, oscillator: { type: "triangle" },
                    envelope: { attack: 0.001, decay: 0.2, sustain: 0.05, release: 0.1 }
                }).connect(reverb);

                const afroMelSynth = new Tone.FMSynth({
                    harmonicity: 2.0, modulationIndex: 5,
                    oscillator: { type: "sine" },
                    envelope: { attack: 0.001, decay: 0.4, sustain: 0.1, release: 0.3 },
                    modulation: { type: "square" }
                }).connect(delay);

                synthsRef.current = {
                    drums: { kick: kickSynth, snare: snareSynth, hihat: hihatSynth, clap: clapSynth },
                    subBass: subBassSynth,
                    bass: bassSynth,
                    robot: robotSynth,
                    piano: pianoSynth,
                    synth: synthLead,
                    guitar: guitarSynth,
                    violin: violinSynth,
                    voice: voiceSynth,
                    afroPerc: afroPercSynth,
                    afroMel: afroMelSynth,
                    masterGain, reverb, delay, distortion
                };

                return () => {
                    Tone.Transport.stop();
                    Tone.Transport.cancel();
                };
            }, []);

            React.useEffect(() => {
                const syns = synthsRef.current;
                if (!syns) return;
                syns.reverb.wet.value = fxSettings.reverbWet;
                syns.delay.wet.value = fxSettings.delayWet;
                syns.distortion.distortion = fxSettings.distortion;
                if (pannerRef.current) {
                    pannerRef.current.pan.value = fxSettings.stereoPan;
                }
            }, [fxSettings]);

            // 再生ループとリアルタイム録音処理
            React.useEffect(() => {
                Tone.Transport.bpm.value = bpm;
                Tone.Transport.cancel();

                if (playing) {
                    let stepCounter = 0;
                    loopRef.current = new Tone.Loop(time => {
                        let step = stepCounter % TOTAL_STEPS;
                        const bar = Math.floor(step / BAR_STEPS);
                        const sInBar = step % BAR_STEPS;

                        setCurrentStep(sInBar);
                        setCurrentBar(bar);

                        if (sInBar % 2 === 0) {
                            const colors = ["border-pink-500", "border-cyan-400", "border-yellow-400", "border-purple-500", "border-emerald-400"];
                            setFlashColor(colors[Math.floor(Math.random() * colors.length)]);
                        }

                        const syns = synthsRef.current;
                        if (!syns) return;

                        Object.keys(instrumentSteps).forEach(instKey => {
                            const val = instrumentSteps[instKey][step];
                            if (!val) return;

                            if (instKey === "drums") {
                                if (typeof val === "object") {
                                    if (val.kick) syns.drums.kick.triggerAttackRelease("C1", "8n", time);
                                    if (val.snare) syns.drums.snare.triggerAttackRelease("8n", time);
                                    if (val.hihat) syns.drums.hihat.triggerAttackRelease("32n", time, 0.7);
                                    if (val.clap) syns.drums.clap.triggerAttackRelease("8n", time);
                                }
                            } else if (instKey === "subBass") {
                                syns.subBass.triggerAttackRelease("C1", "8n", time);
                            } else if (instKey === "robot") {
                                syns.robot.triggerAttackRelease(typeof val === "string" ? val : "C5", "16n", time);
                            } else if (instKey === "afroPerc") {
                                syns.afroPerc.triggerAttackRelease("G2", "8n", time);
                            } else if (syns[instKey]) {
                                syns[instKey].triggerAttackRelease(typeof val === "string" ? val : "C4", "8n", time);
                            }
                        });

                        stepCounter++;
                    }, "16n").start(0);

                    Tone.Transport.start();
                } else {
                    Tone.Transport.stop();
                }
            }, [playing, bpm, instrumentSteps]);

            const togglePlay = async () => {
                await Tone.start();
                setPlaying(!playing);
                setStatus(playing ? "停止しました" : `▶ 再生中 (BPM: ${bpm})`);
            };

            // リアルタイム録音の切り替え
            const toggleRecord = async () => {
                await Tone.start();
                setIsRecording(!isRecording);
                if (!isRecording) {
                    setPlaying(true);
                    setStatus("🔴 リアルタイム演奏録音中！鍵盤やグリッドを弾いて記録できます");
                } else {
                    setStatus("⏹️ 録音を停止しました");
                }
            };

            const toggleStep = (instKey, idx) => {
                setInstrumentSteps(prev => {
                    const currentArr = [...prev[instKey]];
                    if (instKey === "drums") {
                        const currentObj = currentArr[idx] || { kick: false, snare: false, hihat: false, clap: false };
                        const updatedObj = { ...currentObj, [selectedDrumPart]: !currentObj[selectedDrumPart] };
                        const hasAny = Object.values(updatedObj).some(Boolean);
                        currentArr[idx] = hasAny ? updatedObj : null;
                    } else if (["subBass", "afroPerc"].includes(instKey)) {
                        currentArr[idx] = currentArr[idx] ? null : 1;
                    } else {
                        currentArr[idx] = currentArr[idx] ? null : selectedNote;
                    }
                    return { ...prev, [instKey]: currentArr };
                });
            };

            const clearSpecificInstrument = (instKey) => {
                setInstrumentSteps(prev => ({
                    ...prev,
                    [instKey]: new Array(TOTAL_STEPS).fill(null)
                }));
                const instName = INSTRUMENTS.find(i => i.id === instKey)?.label || instKey;
                setStatus(`🗑️ 【${instName}】をClearしました。`);
            };

            const clearAllSteps = () => {
                setInstrumentSteps({
                    drums: new Array(TOTAL_STEPS).fill(null),
                    subBass: new Array(TOTAL_STEPS).fill(null),
                    robot: new Array(TOTAL_STEPS).fill(null),
                    bass: new Array(TOTAL_STEPS).fill(null),
                    piano: new Array(TOTAL_STEPS).fill(null),
                    synth: new Array(TOTAL_STEPS).fill(null),
                    guitar: new Array(TOTAL_STEPS).fill(null),
                    violin: new Array(TOTAL_STEPS).fill(null),
                    voice: new Array(TOTAL_STEPS).fill(null),
                    afroPerc: new Array(TOTAL_STEPS).fill(null),
                    afroMel: new Array(TOTAL_STEPS).fill(null),
                });
                setStatus("🧹 すべての楽器を完全Clearしました。");
            };

            // 試聴（ドレミ鍵盤クリック時 & リアルタイム録音連動）
            const playNoteKeyboard = (note) => {
                setSelectedNote(note);
                const syns = synthsRef.current;
                if (!syns) return;

                if (selectedInstrument === "drums") {
                    if (selectedDrumPart === "kick") syns.drums.kick.triggerAttackRelease("C1", "8n");
                    else if (selectedDrumPart === "snare") syns.drums.snare.triggerAttackRelease("8n");
                    else if (selectedDrumPart === "hihat") syns.drums.hihat.triggerAttackRelease("32n");
                    else syns.drums.clap.triggerAttackRelease("8n");
                } else if (selectedInstrument === "subBass") {
                    syns.subBass.triggerAttackRelease("C1", "8n");
                } else if (selectedInstrument === "bass") {
                    syns.bass.triggerAttackRelease("C2", "8n");
                } else if (syns[selectedInstrument]) {
                    syns[selectedInstrument].triggerAttackRelease(note, "8n");
                }

                // 録音中であれば現在のステップに即時記録
                if (isRecording && currentStep !== -1) {
                    const stepIdx = currentBar * BAR_STEPS + currentStep;
                    toggleStep(selectedInstrument, stepIdx);
                }
            };

            // 一括AI自動作曲ジェネレーター (ブラコン対応)
            const generateAllAI = (style = "brahcon") => {
                const newSteps = {};
                const scales = {
                    brahcon: ["C4", "D#4", "F4", "G4", "A#4", "C5", "D5"],
                    disco: ["C4", "E4", "G4", "A4", "C5", "E5"],
                    funk: ["C4", "D#4", "F4", "F#4", "G4", "A#4"],
                    ballad: ["C4", "D4", "E4", "G4", "B4", "C5"]
                };
                const scale = scales[style] || scales.brahcon;

                INSTRUMENTS.forEach(inst => {
                    const instArr = new Array(TOTAL_STEPS).fill(null);
                    for (let s = 0; s < TOTAL_STEPS; s++) {
                        const sInBar = s % BAR_STEPS;
                        if (inst.id === "drums") {
                            instArr[s] = {
                                kick: sInBar === 0 || sInBar === 6 || sInBar === 10,
                                snare: sInBar === 4 || sInBar === 12,
                                hihat: sInBar % 2 === 1 || sInBar % 2 === 0,
                                clap: sInBar === 12
                            };
                        } else if (inst.id === "subBass" || inst.id === "bass") {
                            if (sInBar % 2 === 0) instArr[s] = "C1";
                        } else if (inst.id === "robot") {
                            if (sInBar % 2 === 0) instArr[s] = scale[Math.floor(Math.random() * scale.length)];
                        } else {
                            if (sInBar === 0 || sInBar === 3 || sInBar === 7 || sInBar === 10 || sInBar === 14) {
                                instArr[s] = scale[Math.floor(Math.random() * scale.length)];
                            }
                        }
                    }
                    newSteps[inst.id] = instArr;
                });

                setInstrumentSteps(newSteps);
                setStatus(`✨ すべての楽器で【${style}】AI自動編成が完了しました！`);
            };

            // 記憶・セッション保存
            const saveCurrentSession = () => {
                const newSlots = { ...savedSlots, [slotName]: JSON.parse(JSON.stringify(instrumentSteps)) };
                setSavedSlots(newSlots);
                setStatus(`💾 セッション「${slotName}」を記憶しました！`);
            };

            const loadSession = (name) => {
                if (savedSlots[name]) {
                    setInstrumentSteps(JSON.parse(JSON.stringify(savedSlots[name])));
                    setStatus(`📂 セッション「${name}」をロードしました！`);
                }
            };

            const deleteSession = (name) => {
                const newSlots = { ...savedSlots };
                delete newSlots[name];
                setSavedSlots(newSlots);
                setStatus(`🗑️ セッション「${name}」を削除しました。`);
            };

            // リスト保存（JSONファイルとしてエクスポート / インポート）
            const exportListAsJSON = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ bpm, savedSlots, instrumentSteps }, null, 2));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", `synth_project_${Date.now()}.json`);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
                setStatus("💾 すべてのプロジェクトリストをファイルとして保存しました！");
            };

            const importListFromJSON = (e) => {
                const fileReader = new FileReader();
                if (e.target.files[0]) {
                    fileReader.readAsText(e.target.files[0], "UTF-8");
                    fileReader.onload = (event) => {
                        try {
                            const parsed = JSON.parse(event.target.result);
                            if (parsed.instrumentSteps) setInstrumentSteps(parsed.instrumentSteps);
                            if (parsed.savedSlots) setSavedSlots(parsed.savedSlots);
                            if (parsed.bpm) setBpm(parsed.bpm);
                            setStatus("📂 プロジェクトリストを正常に読み込みました！");
                        } catch (err) {
                            setStatus("❌ ファイルの読み込みに失敗しました。");
                        }
                    };
                }
            };

            const currentInstObj = INSTRUMENTS.find(i => i.id === selectedInstrument);

            return (
                <div className={`min-h-screen bg-slate-950 text-slate-100 flex flex-col text-xs font-sans select-none border-8 transition-all duration-75 ${flashColor}`}>
                    
                    {/* ヘッダーコントロール */}
                    <header className="bg-slate-900 border-b border-slate-800 px-3 py-2 flex items-center justify-between gap-2 sticky top-0 z-50 shadow-lg">
                        <div className="flex items-center gap-2">
                            <span className="font-black text-sm bg-gradient-to-r from-amber-400 via-pink-400 to-cyan-400 bg-clip-text text-transparent">
                                MASTER SYNTH <span className="text-[10px] text-pink-400 font-normal">v28.0 完全統合</span>
                            </span>
                        </div>

                        <div className="flex items-center gap-1.5 flex-wrap">
                            <button
                                onClick={togglePlay}
                                className={`px-3 py-1 rounded font-bold text-xs shadow ${
                                    playing ? "bg-amber-400 text-slate-950 animate-bounce" : "bg-pink-600 text-white"
                                }`}
                            >
                                {playing ? "■ 停止" : "▶ 試聴・再生"}
                            </button>

                            <button
                                onClick={toggleRecord}
                                className={`px-3 py-1 rounded font-bold text-xs shadow ${
                                    isRecording ? "bg-red-600 text-white animate-pulse border border-white" : "bg-slate-800 text-red-400 border border-red-800"
                                }`}
                            >
                                {isRecording ? "🔴 録音中..." : "⏺️ 録音"}
                            </button>
                            
                            <div className="flex items-center gap-1 bg-slate-950 px-2 py-0.5 rounded border border-slate-800">
                                <span className="text-[9px] text-slate-400">BPM</span>
                                <input
                                    type="number"
                                    value={bpm}
                                    onChange={e => setBpm(Math.max(60, Math.min(220, Number(e.target.value))))}
                                    className="w-12 bg-slate-900 text-center font-bold text-pink-400 rounded text-xs py-0.5"
                                />
                            </div>
                        </div>
                    </header>

                    {/* ナビゲーションタブ */}
                    <nav className="bg-slate-900/90 border-b border-slate-800 px-2 py-1.5 flex gap-1 overflow-x-auto">
                        {[
                            { id: "ALL_STUDIO", label: "🎵 全楽器一括・AI・Clear" },
                            { id: "EDIT_KEYBOARD", label: "🎹 ドレミ鍵盤・編集・試聴" },
                            { id: "MEMORY_LIST", label: "💾 記憶・リスト保存" },
                            { id: "FX", label: "🎛️ FX音響" },
                        ].map(t => (
                            <button
                                key={t.id}
                                onClick={() => setTab(t.id)}
                                className={`px-3 py-1 rounded text-center font-bold transition-all shrink-0 ${
                                    tab === t.id ? "bg-amber-500 text-slate-950 shadow" : "bg-slate-800/60 text-slate-400"
                                }`}
                            >
                                {t.label}
                            </button>
                        ))}
                    </nav>

                    <div className="bg-slate-900/50 px-3 py-1 text-[11px] text-cyan-400 border-b border-slate-900 truncate">
                        <span>💡 {status}</span>
                    </div>

                    <main className="p-2 flex flex-col gap-3">

                        {/* タブ1: 全楽器一括スタジオ */}
                        {tab === "ALL_STUDIO" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-4 flex flex-col gap-4">
                                <div className="flex items-center justify-between">
                                    <span className="text-xs font-bold text-pink-400">✨ すべての楽器の一括操作・AI作曲・一括Clear</span>
                                    <button
                                        onClick={clearAllSteps}
                                        className="px-3 py-1 bg-red-950 hover:bg-red-900 text-red-300 font-bold rounded text-[10px] border border-red-800"
                                    >
                                        🧹 すべて一括Clear
                                    </button>
                                </div>

                                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 bg-slate-950 p-3 rounded border border-slate-800">
                                    {[
                                        { id: "brahcon", name: "🕶️ ブラコン (メロウ)", desc: "都会的R&Bリズム" },
                                        { id: "disco", name: "🕺 ディスコ", desc: "4つ打ちファンキー" },
                                        { id: "funk", name: "🎸 ファンク", desc: "グルーヴィーベース" },
                                        { id: "ballad", name: "🎹 バラード", desc: "情緒的スロー" },
                                    ].map(st => (
                                        <button
                                            key={st.id}
                                            onClick={() => generateAllAI(st.id)}
                                            className="p-2 bg-slate-900 hover:bg-pink-950/40 border border-slate-800 rounded text-left flex flex-col gap-1 transition-all shadow"
                                        >
                                            <span className="font-bold text-slate-200 text-[11px]">{st.name}</span>
                                            <span className="text-[9px] text-slate-400">{st.desc}</span>
                                            <span className="text-[9px] text-pink-400 font-bold mt-1">▶ 一括AI作曲</span>
                                        </button>
                                    ))}
                                </div>

                                <div className="flex flex-col gap-2">
                                    <span className="text-[11px] font-bold text-slate-300">各楽器の個別Clear ＆ 編集切替:</span>
                                    <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2">
                                        {INSTRUMENTS.map(inst => (
                                            <div key={inst.id} className="bg-slate-950 p-2.5 rounded border border-slate-800 flex flex-col justify-between gap-2">
                                                <span className="font-bold text-slate-200 text-xs">{inst.label}</span>
                                                <div className="flex gap-1">
                                                    <button
                                                        onClick={() => { setSelectedInstrument(inst.id); setTab("EDIT_KEYBOARD"); }}
                                                        className="flex-1 py-1 bg-cyan-950 hover:bg-cyan-900 text-cyan-300 rounded text-[10px] font-bold border border-cyan-800 text-center"
                                                    >
                                                        🎹 編集・鍵盤
                                                    </button>
                                                    <button
                                                        onClick={() => clearSpecificInstrument(inst.id)}
                                                        className="px-2 py-1 bg-red-950 hover:bg-red-900 text-red-300 rounded text-[10px] font-bold border border-red-800"
                                                    >
                                                        Clear
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* タブ2: ドレミ鍵盤・編集・試聴 */}
                        {tab === "EDIT_KEYBOARD" && (
                            <>
                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-2.5 flex flex-col gap-2">
                                    <div className="flex justify-between items-center flex-wrap gap-2">
                                        <span className="text-[11px] font-bold text-slate-300">🎵 編集対象の楽器選択 & モード切替:</span>
                                        <div className="flex gap-1 items-center flex-wrap">
                                            <button
                                                onClick={() => clearSpecificInstrument(selectedInstrument)}
                                                className="px-2 py-0.5 bg-red-950 hover:bg-red-900 text-red-300 font-bold rounded text-[10px] border border-red-800"
                                            >
                                                🗑️ この楽器をClear
                                            </button>
                                            <button 
                                                onClick={() => setInputMode("grid")}
                                                className={`px-2 py-0.5 rounded text-[10px] font-bold ${inputMode === "grid" ? "bg-pink-600 text-white" : "bg-slate-800 text-slate-400"}`}
                                            >
                                                グリッド
                                            </button>
                                            <button 
                                                onClick={() => setInputMode("keyboard")}
                                                className={`px-2 py-0.5 rounded text-[10px] font-bold ${inputMode === "keyboard" ? "bg-pink-600 text-white" : "bg-slate-800 text-slate-400"}`}
                                            >
                                                ドレミ鍵盤
                                            </button>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-3 sm:grid-cols-6 md:grid-cols-11 gap-1.5">
                                        {INSTRUMENTS.map(inst => (
                                            <button
                                                key={inst.id}
                                                onClick={() => setSelectedInstrument(inst.id)}
                                                className={`py-2 px-1 rounded-lg font-bold text-[11px] transition-all border flex items-center justify-center gap-1 shadow ${
                                                    selectedInstrument === inst.id
                                                        ? `bg-gradient-to-r ${inst.color} border-white text-white ring-2 ring-white/30`
                                                        : "bg-slate-950 border-slate-800 text-slate-400"
                                                }`}
                                            >
                                                {inst.label}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {selectedInstrument === "drums" && (
                                    <div className="bg-slate-900 border border-slate-800 rounded-lg p-2.5 flex items-center gap-2">
                                        <span className="text-[11px] font-bold text-slate-300">ドラムパーツ選択:</span>
                                        <div className="flex gap-1.5 overflow-x-auto">
                                            {DRUM_PARTS.map(part => (
                                                <button
                                                    key={part.id}
                                                    onClick={() => setSelectedDrumPart(part.id)}
                                                    className={`px-3 py-1 rounded text-[11px] font-bold shrink-0 ${
                                                        selectedDrumPart === part.id ? "bg-red-600 text-white shadow" : "bg-slate-800 text-slate-300"
                                                    }`}
                                                >
                                                    {part.label}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {inputMode === "keyboard" && (
                                    <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-2">
                                        <div className="text-[11px] font-bold text-amber-400">🎹 ドレミ鍵盤（クリックで「試聴」＆「リアルタイム録音」に対応）</div>
                                        <div className="grid grid-cols-8 gap-1.5">
                                            {NOTES.map(note => (
                                                <button
                                                    key={note}
                                                    onClick={() => playNoteKeyboard(note)}
                                                    className={`py-4 rounded font-bold flex flex-col items-center justify-center gap-1 border transition-all ${
                                                        selectedNote === note ? "bg-amber-500 text-slate-950 border-white ring-2 ring-white" : "bg-slate-950 text-slate-200 border-slate-800 hover:bg-slate-800"
                                                    }`}
                                                >
                                                    <span className="text-sm">{SOLFEGE[note]}</span>
                                                    <span className="text-[9px] text-slate-400">{note}</span>
                                                </button>
                                            ))}
                                        </div>
                                        <span className="text-[10px] text-slate-400">現在選択中の音階: <strong className="text-amber-300">{selectedNote} ({SOLFEGE[selectedNote]})</strong></span>
                                    </div>
                                )}

                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-2 flex items-center justify-between">
                                    <span className="text-[11px] font-bold text-slate-300">
                                        小節選択: <strong className="text-pink-400">{currentBar + 1}小節目 / 8小節</strong>
                                    </span>
                                    <div className="flex gap-1">
                                        {Array.from({ length: BARS }).map((_, b) => (
                                            <button
                                                key={b}
                                                onClick={() => setCurrentBar(b)}
                                                className={`w-7 h-7 rounded-full text-xs font-bold ${
                                                    currentBar === b ? "bg-amber-500 text-slate-950" : "bg-slate-800 text-slate-400"
                                                }`}
                                            >
                                                {b + 1}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 overflow-x-auto">
                                    <div className="text-xs font-bold text-amber-400 mb-2">
                                        🎯 グリッド編集エディタ ({currentInstObj.label} / {currentBar + 1}小節) - クリックで配置・Clear
                                    </div>
                                    <div className="grid gap-1 min-w-[540px]" style={{ gridTemplateColumns: "repeat(16, minmax(0, 1fr))" }}>
                                        {Array.from({ length: BAR_STEPS }).map((_, i) => {
                                            const stepIdx = currentBar * BAR_STEPS + i;
                                            const stepVal = instrumentSteps[selectedInstrument][stepIdx];
                                            const isCurrentPlay = playing && currentStep === i;

                                            let isActive = selectedInstrument === "drums" 
                                                ? (stepVal && stepVal[selectedDrumPart]) 
                                                : ["subBass", "afroPerc"].includes(selectedInstrument)
                                                ? !!stepVal
                                                : !!stepVal;

                                            return (
                                                <button
                                                    key={i}
                                                    onClick={() => toggleStep(selectedInstrument, stepIdx)}
                                                    className={`aspect-[3/4] w-full rounded border flex flex-col items-center justify-center text-[9px] transition-all ${
                                                        isActive
                                                            ? "bg-gradient-to-t from-amber-600 to-pink-600 border-white text-white font-bold shadow-md shadow-pink-500/50 scale-105"
                                                            : "bg-slate-950 border-slate-800 text-slate-500"
                                                    } ${isCurrentPlay ? "ring-2 ring-cyan-400" : ""}`}
                                                >
                                                    <span className="font-bold text-[10px]">{i + 1}</span>
                                                    {stepVal && !["drums", "subBass", "afroPerc"].includes(selectedInstrument) && (
                                                        <span className="text-[8px] text-amber-300">{SOLFEGE[stepVal] || ""}</span>
                                                    )}
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>
                            </>
                        )}

                        {/* タブ3: 記憶・リスト保存 */}
                        {tab === "MEMORY_LIST" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3">
                                <div className="text-xs font-bold text-emerald-400">💾 セッション記憶 ＆ プロジェクトリスト保存・ファイル入出力</div>
                                
                                <div className="flex flex-col gap-2 bg-slate-950 p-3 rounded border border-slate-800">
                                    <span className="text-[11px] font-bold text-slate-300">ブラウザ内に名前をつけて記憶:</span>
                                    <div className="flex gap-2">
                                        <input
                                            type="text"
                                            value={slotName}
                                            onChange={e => setSlotName(e.target.value)}
                                            className="bg-slate-900 px-2 py-1 rounded text-slate-100 flex-1 border border-slate-800"
                                        />
                                        <button
                                            onClick={saveCurrentSession}
                                            className="px-4 py-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded"
                                        >
                                            💾 記憶する
                                        </button>
                                    </div>
                                </div>

                                <div className="flex flex-col gap-2 bg-slate-950 p-3 rounded border border-slate-800">
                                    <span className="text-[11px] font-bold text-slate-300">記憶されたセッション一覧:</span>
                                    <div className="flex flex-col gap-1.5 max-h-[160px] overflow-y-auto">
                                        {Object.keys(savedSlots).length === 0 ? (
                                            <span className="text-[10px] text-slate-500">保存されたセッションはありません</span>
                                        ) : (
                                            Object.keys(savedSlots).map(name => (
                                                <div key={name} className="flex justify-between items-center bg-slate-900 p-2 rounded border border-slate-800">
                                                    <span className="font-bold text-cyan-400 text-xs">📂 {name}</span>
                                                    <div className="flex gap-1">
                                                        <button
                                                            onClick={() => loadSession(name)}
                                                            className="px-2.5 py-1 bg-cyan-600 hover:bg-cyan-500 text-white rounded text-[10px] font-bold"
                                                        >
                                                            ロード
                                                        </button>
                                                        <button
                                                            onClick={() => deleteSession(name)}
                                                            className="px-2.5 py-1 bg-red-950 hover:bg-red-900 text-red-300 rounded text-[10px] font-bold border border-red-800"
                                                        >
                                                            削除
                                                        </button>
                                                    </div>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>

                                <div className="flex flex-col gap-2 bg-slate-950 p-3 rounded border border-slate-800">
                                    <span className="text-[11px] font-bold text-slate-300">プロジェクトリストのファイル保存・読み込み:</span>
                                    <div className="flex gap-2 items-center flex-wrap">
                                        <button
                                            onClick={exportListAsJSON}
                                            className="px-4 py-1.5 bg-pink-600 hover:bg-pink-500 text-white font-bold rounded text-xs shadow"
                                        >
                                            📥 リストをJSON保存（ダウンロード）
                                        </button>
                                        <label className="px-4 py-1.5 bg-slate-800 hover:bg-slate-700 text-cyan-400 font-bold rounded text-xs cursor-pointer border border-slate-700">
                                            📂 リストをファイルから読込
                                            <input type="file" accept=".json" onChange={importListFromJSON} className="hidden" />
                                        </label>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* タブ4: FX音響 */}
                        {tab === "FX" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3">
                                <div className="text-xs font-bold text-cyan-400">🎛️ FX・音響空間エフェクト調整</div>
                                <div className="bg-slate-950 p-3 rounded border border-slate-800 flex flex-col gap-3">
                                    <label className="text-[10px] text-slate-300 flex flex-col gap-1">
                                        ステレオ・ワイド (左右パン): {Math.round(fxSettings.stereoPan * 100)}%
                                        <input type="range" min="-1" max="1" step="0.1" value={fxSettings.stereoPan} onChange={e => setFxSettings({...fxSettings, stereoPan: Number(e.target.value)})} />
                                    </label>
                                    <label className="text-[10px] text-slate-300 flex flex-col gap-1">
                                        エレクトリック歪み (Distortion): {Math.round(fxSettings.distortion * 100)}%
                                        <input type="range" min="0" max="1" step="0.05" value={fxSettings.distortion} onChange={e => setFxSettings({...fxSettings, distortion: Number(e.target.value)})} />
                                    </label>
                                    <label className="text-[10px] text-slate-300 flex flex-col gap-1">
                                        リバーブ残響 (Reverb): {Math.round(fxSettings.reverbWet * 100)}%
                                        <input type="range" min="0" max="1" step="0.05" value={fxSettings.reverbWet} onChange={e => setFxSettings({...fxSettings, reverbWet: Number(e.target.value)})} />
                                    </label>
                                    <label className="text-[10px] text-slate-300 flex flex-col gap-1">
                                        ディレイ遅延 (Delay): {Math.round(fxSettings.delayWet * 100)}%
                                        <input type="range" min="0" max="1" step="0.05" value={fxSettings.delayWet} onChange={e => setFxSettings({...fxSettings, delayWet: Number(e.target.value)})} />
                                    </label>
                                </div>
                            </div>
                        )}

                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(getElementByIdOrFallback('root')).render(<MasterSynthApp />);
        function getElementByIdOrFallback(id) {
            return document.getElementById(id);
        }
    </script>
</body>
</html>
