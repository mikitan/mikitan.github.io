<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIC VICTORY - DLAND DTM v60.0 CRERA/MULTI-STEP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans select-none pb-24 overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const ALBUM_POPS_20_MANIFEST = [
            { id: 1, title: "01 DLAND Bright Pop Anthem", bpm: 118, key: "Cmajor", concept: "王道4つ打ちポップス＋高音きらめきAI" },
            { id: 2, title: "02 Mic Victory Popin Shine", bpm: 115, key: "Gmajor", concept: "タットに合わせる弾むピアノ＆シンセ" },
            { id: 3, title: "03 Neon Pop Step Dland", bpm: 120, key: "Aminor", concept: "ダンスフロア向けポップグルーヴ" },
            { id: 4, title: "04 Sunset Pop Velvet Breeze", bpm: 108, key: "Fmajor", concept: "爽やかカッティングギター＆フルート" },
            { id: 5, title: "05 Future Popin Victory", bpm: 122, key: "Dminor", concept: "フューチャーポップ基調の高音AIリフ" },
            { id: 18, title: "18 Crera Popin Climax", bpm: 128, key: "Cminor", concept: "全楽器AIポップ高密度フィナーレ" },
        ];

        const SOUL_BALAD_BCON_20_MANIFEST = Array.from({ length: 20 }, (_, i) => ({
            id: 101 + i,
            title: `SBC-${(i+1).toString().padStart(2, '0')} ${["SoulVelvet", "RockBallad", "BlackConTemp", "MidnightGroove", "AcousticSoul"][i % 5]} Flow`,
            bpm: 78 + (i % 6) * 8,
            key: ["Cmaj7", "Amin9", "Dm7", "Fmaj7", "Bbmaj7"][i % 5],
            concept: "ソウル・ロック・ブラコン融合バラード／グルーヴ"
        }));

        const INSTRUMENTS = [
            { id: "subBass", label: "🔊 重低音サブベース", color: "from-amber-600 to-orange-700", scale: ["C0", "D0", "E0", "F0", "G0", "A0"] },
            { id: "bass", label: "🎸 ベース", color: "from-emerald-600 to-teal-600", scale: ["C1", "D1", "E1", "F1", "G1", "A1"] },
            { id: "drums", label: "🥁 ドラム", color: "from-red-600 to-amber-600", scale: ["kick", "snare", "hihat", "clap"] },
            { id: "afroPerc", label: "🪘 アフリカ太鼓・ジャンベ", color: "from-yellow-700 to-amber-900", scale: ["C2", "D2", "E2", "G2", "A2", "C3"] },
            { id: "synth", label: "🎹 AI高音シンセ", color: "from-cyan-600 to-blue-700", scale: ["C5", "D5", "E5", "G5", "A5", "C6", "D6"] },
            { id: "piano", label: "🎹 ブラコンローズピアノ", color: "from-blue-600 to-indigo-600", scale: ["C4", "E4", "G4", "B4", "D5", "E5"] },
            { id: "guitar", label: "🎸 ソウルギターカッティング", color: "from-orange-600 to-red-700", scale: ["G3", "C4", "E4", "G4", "B4"] },
            { id: "violin", label: "🎻 バラードストリングス", color: "from-amber-600 to-yellow-700", scale: ["C4", "G4", "A4", "E5"] },
        ];

        const SAMPLE_RAP_LYRICS = [
            "[Verse 1 - BCON Flow] 夜を抜ける低音の波打つ影 / タットの隙間に刻む MIC VICTORY の音",
            "[Pre-Chorus] ソウルの体温、ロックの棘、混ざり合うパステル・スウィート",
            "[Chorus - DLAND Anthem] 鳴らないビートの奥で躍る、魂のセーバーは止まらない",
            "[Afro-Break] ジャンベ鳴らす大地、ポリ rhythmic な鼓動、ここが起点"
        ];

        function MasterSynthApp() {
            const [tab, setTab] = React.useState("SOUL_BCON_20");
            const [playing, setPlaying] = React.useState(false);
            const [bpm, setBpm] = React.useState(92);
            const [currentBar, setCurrentBar] = React.useState(0);
            const [currentStep, setCurrentStep] = React.useState(-1);
            const [barsCount, setBarsCount] = React.useState(8);
            const [status, setStatus] = React.useState("🛡️ v60.0 クレラ全楽器・手動マルチステップ・完全統合準備完了");

            const BAR_STEPS = 16;
            const TOTAL_STEPS = barsCount * BAR_STEPS;

            const [selectedInstrument, setSelectedInstrument] = React.useState("piano");
            const [rapGeneratedText, setRapGeneratedText] = React.useState(SAMPLE_RAP_LYRICS.join("\n"));

            const [instrumentSteps, setInstrumentSteps] = React.useState(() => {
                const initial = {};
                INSTRUMENTS.forEach(inst => {
                    initial[inst.id] = new Array(8 * BAR_STEPS).fill(null);
                });
                return initial;
            });

            const volumes = { subBass: 6, bass: 3, drums: 3, afroPerc: 4, synth: 2, piano: 3, guitar: 0, violin: 0 };

            const resizeBarsSafe = (newBarCount) => {
                const newTotalSteps = newBarCount * BAR_STEPS;
                setInstrumentSteps(prev => {
                    const next = {};
                    Object.keys(prev).forEach(instId => {
                        const oldArr = prev[instId];
                        const resized = new Array(newTotalSteps).fill(null);
                        for (let i = 0; i < Math.min(oldArr.length, newTotalSteps); i++) {
                            resized[i] = oldArr[i];
                        }
                        next[instId] = resized;
                    });
                    return next;
                });
                setBarsCount(newBarCount);
                if (currentBar >= newBarCount) setCurrentBar(newBarCount - 1);
                setStatus(`🎚️ 小節数を ${newBarCount}bars へ安全拡張しました`);
            };

            const synthsRef = React.useRef(null);
            const loopRef = React.useRef(null);
            const canvasRef = React.useRef(null);

            React.useEffect(() => {
                const masterGain = new Tone.Gain(1.3).toDestination();
                const eq = new Tone.EQ3({ low: 10, lowFrequency: 160, mid: 2.0, high: 2.5 }).connect(masterGain);
                const reverb = new Tone.Reverb({ decay: 2.2, wet: 0.25 }).connect(eq);
                const delay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.2, wet: 0.1 }).connect(reverb);

                const cGains = {};
                INSTRUMENTS.forEach(inst => {
                    cGains[inst.id] = new Tone.Gain(Tone.dbToGain(volumes[inst.id] || 0)).connect(delay);
                });

                synthsRef.current = {
                    subBass: new Tone.MonoSynth({ oscillator: { type: "sine" } }).connect(cGains.subBass),
                    bass: new Tone.MonoSynth({ oscillator: { type: "triangle" } }).connect(cGains.bass),
                    synth: new Tone.Synth({ oscillator: { type: "triangle" } }).connect(cGains.synth),
                    piano: new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.01, decay: 0.4, sustain: 0.3, release: 0.4 } }).connect(cGains.piano),
                    guitar: new Tone.Synth({ oscillator: { type: "sawtooth" } }).connect(cGains.guitar),
                    violin: new Tone.Synth({ oscillator: { type: "sawtooth" }, envelope: { attack: 0.1, decay: 0.3, sustain: 0.8, release: 0.4 } }).connect(cGains.violin),
                    afroPerc: new Tone.MembraneSynth({ pitchDecay: 0.02, octaves: 3, oscillator: { type: "sine" } }).connect(cGains.afroPerc),
                    drums: {
                        kick: new Tone.MembraneSynth({ pitchDecay: 0.05, octaves: 4 }).connect(cGains.drums),
                        snare: new Tone.NoiseSynth({ noise: { type: "white" } }).connect(cGains.drums),
                        hihat: new Tone.MetalSynth({ frequency: 1200 }).connect(cGains.drums),
                        clap: new Tone.NoiseSynth({ noise: { type: "pink" } }).connect(cGains.drums),
                    }
                };

                return () => { Tone.Transport.stop(); Tone.Transport.cancel(); };
            }, []);

            React.useEffect(() => {
                let animationId;
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');

                const drawEQ = () => {
                    ctx.fillStyle = '#020617';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    const bands = 16;
                    const barWidth = canvas.width / bands - 2;

                    for (let i = 0; i < bands; i++) {
                        const h = playing ? Math.random() * (canvas.height * 0.85) + 10 : 8;
                        const gradient = ctx.createLinearGradient(0, canvas.height, 0, 0);
                        gradient.addColorStop(0, '#f59e0b');
                        gradient.addColorStop(0.5, '#ec4899');
                        gradient.addColorStop(1, '#06b6d4');
                        ctx.fillStyle = gradient;
                        ctx.fillRect(i * (barWidth + 2), canvas.height - h, barWidth, h);
                    }
                    animationId = requestAnimationFrame(drawEQ);
                };
                drawEQ();
                return () => cancelAnimationFrame(animationId);
            }, [playing]);

            React.useEffect(() => {
                Tone.Transport.bpm.value = bpm;
                Tone.Transport.cancel();

                if (playing) {
                    let stepCounter = 0;
                    loopRef.current = new Tone.Loop(time => {
                        let step = stepCounter % TOTAL_STEPS;
                        const bar = Math.floor(step / BAR_STEPS);
                        const sInBar = step % BAR_STEPS;
                        setCurrentStep(sInBar);
                        setCurrentBar(bar);

                        const syns = synthsRef.current;
                        if (!syns) return;

                        Object.keys(instrumentSteps).forEach(instKey => {
                            const item = instrumentSteps[instKey][step];
                            if (!item) return;
                            if (instKey === "drums" && typeof item === "object") {
                                if (item.kick) syns.drums.kick.triggerAttackRelease("C0", "16n", time);
                                if (item.snare) syns.drums.snare.triggerAttackRelease("16n", time);
                            } else if (instKey === "afroPerc") {
                                syns.afroPerc.triggerAttackRelease(item.note || "C2", "16n", time);
                            } else {
                                const note = typeof item === "object" ? item.note : item;
                                if (syns[instKey]) syns[instKey].triggerAttackRelease(note || "C4", "16n", time);
                            }
                        });
                        stepCounter++;
                    }, "16n").start(0);

                    Tone.Transport.start();
                } else {
                    Tone.Transport.stop();
                }
            }, [playing, bpm, instrumentSteps]);

            const togglePlay = async () => {
                await Tone.start();
                setPlaying(!playing);
            };

            const generateCreraClimaxAI = () => {
                setInstrumentSteps(prev => {
                    const next = {};
                    INSTRUMENTS.forEach(inst => {
                        const arr = new Array(TOTAL_STEPS).fill(null);
                        const scale = inst.scale;
                        for (let i = 0; i < TOTAL_STEPS; i++) {
                            if (i % 2 === 0 || i % 3 === 0) {
                                if (inst.id === "drums") {
                                    arr[i] = { kick: i % 4 === 0, snare: i % 4 === 2 };
                                } else {
                                    arr[i] = { note: scale[i % scale.length], dur: "16n" };
                                }
                            }
                        }
                        next[inst.id] = arr;
                    });
                    return next;
                });
                setStatus("✨ TR #18 Crera Popin Climax 全楽器AI高密度パターン自動ロード完了！");
            };

            const toggleStepManual = (instKey, idx) => {
                const meta = INSTRUMENTS.find(i => i.id === instKey);
                setInstrumentSteps(prev => {
                    const currentArr = [...prev[instKey]];
                    if (instKey === "drums") {
                        currentArr[idx] = currentArr[idx] ? null : { kick: true, snare: idx % 2 === 0 };
                    } else {
                        const defaultNote = meta.scale[idx % meta.scale.length] || "C4";
                        currentArr[idx] = currentArr[idx] ? null : { note: defaultNote, dur: "16n" };
                    }
                    return { ...prev, [instKey]: currentArr };
                });
            };

            return (
                <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col text-xs font-sans select-none pb-24 overflow-x-hidden p-2 gap-3">
                    <header className="bg-slate-900 border border-slate-800 p-3 rounded-lg flex items-center justify-between flex-wrap gap-2">
                        <div>
                            <span className="font-black text-sm bg-gradient-to-r from-amber-400 via-pink-400 to-cyan-400 bg-clip-text text-transparent">
                                MIC VICTORY v60.0 CRERA/MULTI-STEP
                            </span>
                            <div className="text-[10px] text-slate-400">crerapopsdanb20ai 統合 + フルマルチステップエディタ</div>
                        </div>
                        <div className="flex items-center gap-2">
                            <button onClick={togglePlay} className={`px-4 py-1.5 rounded font-bold text-xs ${playing ? "bg-amber-400 text-slate-950 animate-bounce" : "bg-pink-600 text-white"}`}>
                                {playing ? "■ 停止" : "▶ 再生"}
                            </button>
                            <input type="number" value={bpm} onChange={e => setBpm(Number(e.target.value))} className="w-14 bg-slate-950 text-center font-bold text-pink-400 rounded py-1 border border-slate-800" />
                        </div>
                    </header>

                    <div className="bg-slate-900 border border-slate-800 p-2.5 rounded-lg flex flex-col gap-1.5 shadow">
                        <div className="flex justify-between items-center text-[10px] text-cyan-400 font-bold">
                            <span>📊 グラフィックイコライザー・スクリーンビジュアライザー</span>
                            <span>Low/Mid/High/Crera-Master</span>
                        </div>
                        <canvas ref={canvasRef} width="600" height="60" className="w-full h-14 bg-slate-950 rounded border border-slate-800"></canvas>
                    </div>

                    <div className="bg-slate-900 border border-slate-800 p-2.5 rounded-lg flex flex-wrap items-center justify-between gap-2">
                        <div className="flex items-center gap-2">
                            <span className="font-bold text-pink-400">小節拡張:</span>
                            {[8, 12, 16].map(b => (
                                <button key={b} onClick={() => resizeBarsSafe(b)} className={`px-2.5 py-1 rounded font-bold ${barsCount === b ? "bg-amber-500 text-slate-950" : "bg-slate-800 text-slate-400"}`}>
                                    {b}小節
                                </button>
                            ))}
                        </div>
                        <button onClick={generateCreraClimaxAI} className="px-3 py-1 bg-gradient-to-r from-pink-600 to-amber-600 text-white font-bold rounded">
                            ✨ TR#18 Crera全楽器クライマックス自動生成
                        </button>
                    </div>

                    <nav className="flex gap-1 overflow-x-auto">
                        {[
                            { id: "SOUL_BCON_20", label: "🎵 micvictorypopsdanb20ai" },
                            { id: "POPS_CRERA", label: "✨ Crera Pops 20" },
                            { id: "STEP_MATRIX", label: "🎛️ マルチ・全楽器手動ステップ" },
                            { id: "RAP_AI", label: "🎤 ラップ歌詞AI" },
                        ].map(t => (
                            <button key={t.id} onClick={() => setTab(t.id)} className={`px-3 py-1.5 rounded font-bold shrink-0 ${tab === t.id ? "bg-amber-500 text-slate-950" : "bg-slate-900 text-slate-400 border border-slate-800"}`}>
                                {t.label}
                            </button>
                        ))}
                    </nav>

                    {status && <div className="bg-slate-900 border border-slate-800 text-cyan-300 px-3 py-1.5 rounded font-bold">{status}</div>}

                    {tab === "SOUL_BCON_20" && (
                        <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-2 max-h-[420px] overflow-y-auto">
                            {SOUL_BALAD_BCON_20_MANIFEST.map(tr => (
                                <div key={tr.id} onClick={() => setBpm(tr.bpm)} className="p-2.5 rounded bg-slate-950 border border-slate-800 hover:border-amber-400 cursor-pointer flex flex-col gap-1">
                                    <div className="flex justify-between">
                                        <span className="font-black text-amber-300">TR #{tr.id}</span>
                                        <span className="text-cyan-400">{tr.bpm}BPM</span>
                                    </div>
                                    <div className="font-bold text-slate-100 truncate">{tr.title}</div>
                                    <div className="text-[10px] text-slate-400">{tr.concept}</div>
                                </div>
                            ))}
                        </div>
                    )}

                    {tab === "POPS_CRERA" && (
                        <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2">
                            {ALBUM_POPS_20_MANIFEST.map(tr => (
                                <div key={tr.id} onClick={() => { setBpm(tr.bpm); if(tr.id===18) generateCreraClimaxAI(); }} className="p-2.5 rounded bg-slate-950 border border-slate-800 hover:border-pink-400 cursor-pointer flex flex-col gap-1">
                                    <div className="flex justify-between">
                                        <span className="font-black text-pink-300">CR #{tr.id}</span>
                                        <span className="text-cyan-400">{tr.bpm}BPM</span>
                                    </div>
                                    <div className="font-bold text-slate-100 truncate">{tr.title}</div>
                                    <div className="text-[10px] text-slate-400">{tr.concept}</div>
                                </div>
                            ))}
                        </div>
                    )}

                    {tab === "STEP_MATRIX" && (
                        <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-4">
                            <div className="flex gap-2 flex-wrap">
                                {INSTRUMENTS.map(inst => (
                                    <button key={inst.id} onClick={() => setSelectedInstrument(inst.id)} className={`px-2.5 py-1 rounded font-bold text-xs ${selectedInstrument === inst.id ? "bg-amber-500 text-slate-950" : "bg-slate-950 text-slate-400 border border-slate-800"}`}>
                                        {inst.label}
                                    </button>
                                ))}
                            </div>
                            <div className="flex flex-col gap-2">
                                <div className="text-xs font-bold text-cyan-400">現在選択中: {INSTRUMENTS.find(i=>i.id===selectedInstrument)?.label} (Bar #{currentBar+1})</div>
                                <div className="grid gap-1 min-w-[300px]" style={{ gridTemplateColumns: "repeat(16, minmax(0, 1fr))" }}>
                                    {Array.from({ length: BAR_STEPS }).map((_, i) => {
                                        const stepIdx = currentBar * BAR_STEPS + i;
                                        const stepVal = instrumentSteps[selectedInstrument][stepIdx];
                                        const isPlayingNow = playing && currentStep === i;
                                        return (
                                            <button key={i} onClick={() => toggleStepManual(selectedInstrument, stepIdx)} className={`aspect-[3/4] rounded border flex flex-col items-center justify-center text-[9px] ${isPlayingNow ? "ring-2 ring-cyan-400" : ""} ${stepVal ? "bg-amber-600 border-white text-white" : "bg-slate-950 border-slate-800 text-slate-500"}`}>
                                                <span>{i + 1}</span>
                                                <span className="text-[7px] truncate w-full text-center">{stepVal ? (typeof stepVal==='object' ? (stepVal.note || 'Hit') : 'X') : '-'}</span>
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    )}

                    {tab === "RAP_AI" && (
                        <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-2">
                            <div className="flex justify-between items-center">
                                <span className="font-bold text-pink-400">🎤 ラップリリック生成AI（バー同期）</span>
                                <button onClick={() => {
                                    const newLines = `[Bar ${currentBar+1} Flow] 闇に響くローズの和音とタットの残像`;
                                    setRapGeneratedText(prev => prev + "\n" + newLines);
                                    setStatus("🎤 ラップ歌詞AIジェネレーター更新完了");
                                }} className="px-3 py-1 bg-pink-600 text-white rounded font-bold text-xs">✨ バー同期ラップ歌詞生成</button>
                            </div>
                            <textarea value={rapGeneratedText} readOnly className="w-full h-36 bg-slate-950 text-slate-200 p-2 rounded border border-slate-800 font-mono text-xs"></textarea>
                        </div>
                    )}
                </div>
            );
        }

        const rootEl = document.getElementById('root');
        if (rootEl) {
            ReactDOM.createRoot(rootEl).render(<MasterSynthApp />);
        }
    </script>
</body>
</html>
