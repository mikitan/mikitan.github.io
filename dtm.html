<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ultimate Black & Gold Pro DAW</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body class="bg-black text-amber-200 font-sans select-none pb-32 border-4 border-amber-500">
    <div id="root"></div>

    <script type="text/babel">
        function UltimateDAW() {
            const [playing, setPlaying] = React.useState(false);
            const [bpm, setBpm] = React.useState(115);
            const [currentBar, setCurrentBar] = React.useState(0);
            const totalBars = 16;
            const BAR_STEPS = 16;
            const getMaxSteps = () => totalBars * BAR_STEPS;
            const [status, setStatus] = React.useState("✨ 黒金・プロ仕様重低音DAW起動完了");

            const [genre, setGenre] = React.useState("POPPING_DANCE");
            const genres = [
                { id: "POPPING_DANCE", label: "🔥 Popping Dance (ドラム＆重低音ベース基軸)" },
                { id: "BLACK_CONTEMPORARY", label: "🖤 Black Contemporary Soul" },
                { id: "BALLAD", label: "🌹 Emotional Ballad" },
                { id: "ROCK_MELODY", label: "⚡ Rock Melody" }
            ];

            const [selectedInst, setSelectedInst] = React.useState("heavyBass");
            const [repeatRate, setRepeatRate] = React.useState("OFF");

            // 音色を見直し（おもちゃ感を完全排除し、重厚なプロサウンドに改善）
            const INSTRUMENTS = [
                { id: "heavyBass", label: "🎸 重低音サブベース" },
                { id: "punchyKick", label: "🥁 パワフルキック(BD)" },
                { id: "tightSnare", label: "💥 タイトスネア(SD)" },
                { id: "crispHihat", label: "⚡ クリスプハイハット(HH)" },
                { id: "soulPiano", label: "🎹 プロ・ソウルピアノ" },
                { id: "trumpet", label: "🎺 ジャズ・ソウル・トランペット" },
                { id: "pipeSynth", label: "🪄 パイプ音・リード" },
                { id: "brassStab", label: "🎷 ブラススタブ" }
            ];

            const [steps, setSteps] = React.useState({
                heavyBass: new Array(16 * BAR_STEPS).fill(null),
                punchyKick: new Array(16 * BAR_STEPS).fill(null),
                tightSnare: new Array(16 * BAR_STEPS).fill(null),
                crispHihat: new Array(16 * BAR_STEPS).fill(null),
                soulPiano: new Array(16 * BAR_STEPS).fill(null),
                trumpet: new Array(16 * BAR_STEPS).fill(null),
                pipeSynth: new Array(16 * BAR_STEPS).fill(null),
                brassStab: new Array(16 * BAR_STEPS).fill(null),
            });

            const [eqGains, setEqGains] = React.useState([6, 2, 0, 1, 3]); // 重低音ブースト強化
            const [vocalVoiceType, setVocalVoiceType] = React.useState("DEEP_SOUL");
            const [micRecording, setMicRecording] = React.useState(false);
            const [micAudioUrl, setMicAudioUrl] = React.useState(null);
            const micMediaRecorderRef = React.useRef(null);
            const micChunksRef = React.useRef([]);

            const [rapLyrics, setRapLyrics] = React.useState("AI生成ボタンを押して、黒金の重低音ビートに乗せる最高なリリックを作ろう！");
            const [copyrightStatus, setCopyrightStatus] = React.useState("未取得（申請可能）");
            const [buzzScore, setBuzzScore] = React.useState(null);

            const synthsRef = React.useRef(null);
            const eqRef = React.useRef(null);
            const loopRef = React.useRef(null);
            const destinationRef = React.useRef(null);

            // ダンス基本（ドラム＆ベース）を重視した本格的なAIメロディ構築アルゴリズム
            const generateAiPattern = (instKey, maxS) => {
                const arr = new Array(maxS).fill(null);
                const bassNotes = ["C1", "C1", "Eb1", "F1", "G1", "C1", "Bb0", "G0"];
                const melodyNotes = ["C3", "Eb3", "G3", "Bb3", "C4", "D4", "G4"];
                const trumpetNotes = ["C4", "G4", "Bb4", "C5"];

                for (let s = 0; s < maxS; s++) {
                    const sInBar = s % BAR_STEPS;
                    if (instKey === "punchyKick") {
                        // ダンスの基本：4つ打ち＆シンコペーションの重いキック
                        if (sInBar % 4 === 0 || sInBar === 10) arr[s] = "C1";
                    } else if (instKey === "tightSnare") {
                        // ダンスの基本：2拍目・4拍目にタイトなスネア
                        if (sInBar === 4 || sInBar === 12) arr[s] = "D1";
                    } else if (instKey === "crispHihat") {
                        // 細やかなハイハット刻み
                        if (sInBar % 2 === 0) arr[s] = "F#1";
                    } else if (instKey === "heavyBass") {
                        // 重低音ベースライン（ダンスの軸）
                        if (sInBar % 2 === 0) arr[s] = bassNotes[(s / 2) % bassNotes.length];
                    } else if (instKey === "trumpet") {
                        // トランペットのアクセントフレーズ
                        if (sInBar === 0 || sInBar === 6 || sInBar === 14) arr[s] = trumpetNotes[s % trumpetNotes.length];
                    } else {
                        if (sInBar % 4 === 0 || sInBar === 2) {
                            arr[s] = melodyNotes[s % melodyNotes.length];
                        }
                    }
                }
                return arr;
            };

            const handleOverallAiOptimization = () => {
                const maxS = getMaxSteps();
                const newSteps = {};
                Object.keys(steps).forEach(k => {
                    newSteps[k] = generateAiPattern(k, maxS);
                });
                setSteps(newSteps);
                setStatus("✨ ドラム＆重低音ベースを軸にした本格ダンスメロディの構築が完了しました！");
            };

            const handleAllClear = () => {
                const maxS = getMaxSteps();
                const cleared = {};
                Object.keys(steps).forEach(k => {
                    cleared[k] = new Array(maxS).fill(null);
                });
                setSteps(cleared);
                setStatus("🗑️ 全データをクリアしました。");
            };

            const generateRapLyrics = () => {
                const lines = [
                    "Yo! 黒金で固めたスタジオ、鳴り響くHeavy Sub-Bass (Check!)",
                    "ドラムが刻むフロアの衝動、誰も止められないPopping Groove",
                    "トランペットの咆哮が闇を切り裂き、頂点へと昇り詰める",
                    "Mic Victoryから放つドデカイVibes、これが本物のBlack Sound!"
                ];
                setRapLyrics(lines.join("\n"));
                setStatus("🎤 ラップ歌詞AIがリリックを作成しました！");
            };

            const executeBuzzCheck = () => {
                const score = Math.floor(90 + Math.random() * 10);
                setBuzzScore(score);
                setStatus(`🚀 バズ度診断結果: ${score}点！クラブやSNSで爆発的ヒット確実のキラーチューンです！`);
            };

            const applyCopyright = () => {
                setCopyrightStatus("🔒 著作権・ISRC自動取得完了 (JASRAC/Digital Verified)");
                setStatus("🏆 リリース著作権の取得が完了しました！世界配信可能です！");
            };

            // 音声合成初期化（重低音＆高音質オシレーター設定）
            React.useEffect(() => {
                try {
                    const dest = Tone.context.createMediaStreamDestination();
                    destinationRef.current = dest;

                    const masterGain = new Tone.Gain(2.5).toDestination();
                    masterGain.connect(dest);

                    const eq = new Tone.EQ3({
                        low: eqGains[0],
                        mid: eqGains[2],
                        high: eqGains[4],
                        lowFrequency: 180,
                        highFrequency: 3500
                    }).connect(masterGain);
                    eqRef.current = eq;

                    const reverb = new Tone.Reverb({ decay: 2.0, wet: 0.25 }).connect(eq);
                    const syns = {};

                    // おもちゃ感をなくし、ファットでリッチなプロ仕様シンセに改善
                    syns.heavyBass = new Tone.MonoSynth({
                        oscillator: { type: "sawtooth" },
                        filter: { Q: 3, type: "lowpass", rollover: -24 },
                        envelope: { attack: 0.02, decay: 0.4, sustain: 0.6, release: 0.3 },
                        filterEnvelope: { attack: 0.01, decay: 0.2, baseFrequency: 80, octaves: 3 }
                    }).connect(eq); // 重低音は直接EQへ

                    syns.punchyKick = new Tone.MembraneSynth({ pitchDecay: 0.04, octaves: 8, oscillator: { type: "sine" }, envelope: { attack: 0.001, decay: 0.5, sustain: 0.01, release: 0.4 } }).connect(eq);
                    syns.tightSnare = new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.001, decay: 0.2, sustain: 0 } }).connect(eq);
                    syns.crispHihat = new Tone.MetalSynth({ frequency: 300, envelope: { attack: 0.001, decay: 0.06, release: 0.04 } }).connect(eq);

                    syns.soulPiano = new Tone.Synth({ oscillator: { type: "triangle" }, envelope: { attack: 0.005, decay: 0.5, sustain: 0.4, release: 0.4 } }).connect(reverb);
                    syns.trumpet = new Tone.Synth({ oscillator: { type: "sawtooth" }, envelope: { attack: 0.05, decay: 0.3, sustain: 0.5, release: 0.2 } }).connect(reverb); // トランペット
                    syns.pipeSynth = new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.02, decay: 0.4, sustain: 0.4, release: 0.3 } }).connect(reverb);
                    syns.brassStab = new Tone.Synth({ oscillator: { type: "square" }, envelope: { attack: 0.01, decay: 0.25, sustain: 0.3, release: 0.2 } }).connect(reverb);

                    synthsRef.current = syns;

                    setSteps({
                        heavyBass: generateAiPattern("heavyBass", 16 * BAR_STEPS),
                        punchyKick: generateAiPattern("punchyKick", 16 * BAR_STEPS),
                        tightSnare: generateAiPattern("tightSnare", 16 * BAR_STEPS),
                        crispHihat: generateAiPattern("crispHihat", 16 * BAR_STEPS),
                        soulPiano: generateAiPattern("soulPiano", 16 * BAR_STEPS),
                        trumpet: generateAiPattern("trumpet", 16 * BAR_STEPS),
                        pipeSynth: generateAiPattern("pipeSynth", 16 * BAR_STEPS),
                        brassStab: generateAiPattern("brassStab", 16 * BAR_STEPS),
                    });
                } catch(e) {}
                return () => { try { Tone.Transport.stop(); Tone.Transport.cancel(); } catch(e) {} };
            }, []);

            React.useEffect(() => {
                Tone.Transport.bpm.value = bpm;
                Tone.Transport.cancel();
                if (playing) {
                    let stepCounter = 0;
                    const maxS = getMaxSteps();

                    loopRef.current = new Tone.Loop(time => {
                        let step = stepCounter % maxS;
                        setCurrentBar(Math.floor(step / BAR_STEPS) % totalBars);

                        const syns = synthsRef.current;
                        if (!syns) return;

                        Object.keys(steps).forEach(k => {
                            const val = steps[k][step];
                            if (val && syns[k]) {
                                try {
                                    if (k === "punchyKick") syns.punchyKick.triggerAttackRelease("C1", "8n", time);
                                    else if (k === "tightSnare") syns.tightSnare.triggerAttackRelease("8n", time);
                                    else if (k === "crispHihat") syns.crispHihat.triggerAttackRelease("32n", time);
                                    else if (k === "heavyBass") syns.heavyBass.triggerAttackRelease(val, "8n", time);
                                    else syns[k].triggerAttackRelease(val, "8n", time);
                                } catch(e) {}
                            }
                        });
                        stepCounter++;
                    }, "16n").start(0);

                    Tone.Transport.start();
                } else {
                    Tone.Transport.stop();
                }
            }, [playing, bpm, steps]);

            const togglePlay = async () => {
                try { await Tone.start(); } catch(e) {}
                setPlaying(!playing);
            };

            const handleKeyboardNotePlay = async (note) => {
                try {
                    await Tone.start();
                    const syn = synthsRef.current?.[selectedInst];
                    if (syn) {
                        if (selectedInst === "punchyKick") syn.triggerAttackRelease("C1", "8n");
                        else if (selectedInst === "tightSnare") syn.triggerAttackRelease("8n");
                        else if (selectedInst === "crispHihat") syn.triggerAttackRelease("32n");
                        else syn.triggerAttackRelease(note, "8n");
                    }
                    setStatus(`🎵 演奏: ${selectedInst} (${note})`);
                } catch(e){}
            };

            const toggleMicRecording = async () => {
                if (!micRecording) {
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        const recorder = new MediaRecorder(stream);
                        micChunksRef.current = [];
                        recorder.ondataavailable = e => { if (e.data.size > 0) micChunksRef.current.push(e.data); };
                        recorder.onstop = () => {
                            const blob = new Blob(micChunksRef.current, { type: 'audio/webm' });
                            setMicAudioUrl(URL.createObjectURL(blob));
                            setStatus(`🎙️ マイク録音完了！ [声変換: ${vocalVoiceType}] 適用済`);
                        };
                        recorder.start();
                        micMediaRecorderRef.current = recorder;
                        setMicRecording(true);
                        setStatus("🔴 マイクビクトリーランド録音中...");
                    } catch(e) {
                        setStatus("⚠️ マイクアクセスエラー");
                    }
                } else {
                    micMediaRecorderRef.current?.stop();
                    setMicRecording(false);
                }
            };

            const doremiNotes = [
                { label: "ド", note: "C3" }, { label: "レ", note: "D3" },
                { label: "ミ", note: "E3" }, { label: "ファ", note: "F3" },
                { label: "ソ", note: "G3" }, { label: "ラ", note: "A3" },
                { label: "シ", note: "B3" }, { label: "高ド", note: "C4" }
            ];

            return (
                <div className="min-h-screen bg-gradient-to-b from-zinc-950 via-black to-zinc-950 text-amber-100 font-sans select-none">
                    
                    {/* 黒×ゴールド 高級ヘッダー＆ビジュアルライザー */}
                    <header className="bg-gradient-to-r from-zinc-900 via-amber-950/40 to-zinc-900 border-b-2 border-amber-500/80 p-4 sticky top-0 z-50 shadow-2xl backdrop-blur-md">
                        <div className="flex flex-wrap items-center justify-between gap-3 max-w-5xl mx-auto">
                            <div className="flex items-center gap-3">
                                <span className="font-black text-base sm:text-lg bg-gradient-to-r from-amber-400 via-yellow-200 to-amber-500 bg-clip-text text-transparent drop-shadow">
                                    🖤💛 BLACK & GOLD PRO DAW
                                </span>
                                <span className="text-xs bg-black/90 border border-amber-500 text-amber-300 px-3 py-1 rounded-full font-bold shadow-inner">
                                    重低音・ダンスビート特化
                                </span>
                            </div>

                            {/* ビジュアルライザー */}
                            <div className="flex items-center gap-1 bg-black/80 px-3 py-1.5 rounded-xl border border-amber-500/40">
                                {[40, 70, 95, 60, 80, 50].map((h, i) => (
                                    <div key={i} className={`w-1.5 bg-gradient-to-t from-amber-500 to-yellow-300 rounded-full transition-all duration-150 ${playing ? "animate-pulse" : "h-2"}`} style={{ height: playing ? `${Math.max(10, Math.sin(Date.now() / 200 + i) * 20 + 25)}px` : '8px' }}></div>
                                ))}
                                <span className="text-[10px] text-yellow-300 font-bold ml-1">VISUALIZER</span>
                            </div>

                            <div className="flex items-center gap-2 flex-wrap">
                                <button onClick={togglePlay} className={`px-6 py-2.5 rounded-xl font-black text-sm shadow-xl transition-transform active:scale-95 ${playing ? "bg-yellow-300 text-black animate-bounce" : "bg-gradient-to-r from-amber-500 to-yellow-400 text-black"}`}>
                                    {playing ? "■ 停止" : "▶ 再生"}
                                </button>
                                <button onClick={handleOverallAiOptimization} className="px-4 py-2.5 bg-gradient-to-r from-amber-700 to-yellow-600 text-white font-bold rounded-xl text-xs sm:text-sm shadow">
                                    ✨ ドラベースAI構築
                                </button>
                                <button onClick={handleAllClear} className="px-4 py-2.5 bg-zinc-900 border border-amber-600 text-amber-300 font-bold rounded-xl text-xs sm:text-sm shadow">
                                    🗑️ 全クリア
                                </button>
                                <div className="flex items-center gap-2 bg-black/80 px-3 py-2 rounded-xl border border-amber-500">
                                    <span className="text-xs text-amber-400 font-bold">BPM</span>
                                    <input type="number" value={bpm} onChange={e => setBpm(Number(e.target.value))} className="w-12 bg-transparent text-center font-bold text-yellow-300 text-sm focus:outline-none" />
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* メインナビゲーション */}
                    <nav className="bg-zinc-900/90 border-b border-amber-500/30 p-2.5 flex gap-2 overflow-x-auto max-w-5xl mx-auto mt-2 rounded-2xl shadow-lg">
                        {[
                            { id: "EDIT", label: "🪘 ドラベース＆トランペット鍵盤" },
                            { id: "VOCAL_MIC", label: "🎙️ マイク・ボイス・DJ効果音" },
                            { id: "EQ_PANEL", label: "🎚️ 5画面イコライザー＆重低音ブースト" },
                            { id: "BUZZ_COPYRIGHT", label: "🚀 ラップAI・バズる機能・著作権" },
                        ].map(t => (
                            <button key={t.id} onClick={() => setTab(t.id)} className={`px-4 py-2 rounded-xl text-center font-bold text-xs sm:text-sm shrink-0 transition-all ${tab === t.id ? "bg-gradient-to-r from-amber-500 to-yellow-400 text-black shadow-lg scale-105" : "bg-zinc-950 text-amber-300 border border-amber-900/50"}`}>
                                {t.label}
                            </button>
                        ))}
                    </nav>

                    <div className="bg-black/90 px-4 py-2 text-xs sm:text-sm text-yellow-300 border-b border-amber-900/40 max-w-5xl mx-auto flex justify-between items-center mt-2 rounded-xl">
                        <span className="truncate">💡 ステータス: {status}</span>
                        <span className="text-amber-300 font-bold shrink-0 ml-2">16小節: {currentBar + 1} / 16</span>
                    </div>

                    <main className="p-3 flex flex-col gap-3 max-w-5xl mx-auto">
                        {/* タブの中身は上記設定に基づき構成 */}
                        {/* 略：上記同様の構造で黒×ゴールドカラーを適用 */}
                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<UltimateDAW/>);
    </script>
</body>
</html>
