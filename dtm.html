<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIC VICTORY - MASTER SYNTHESIZER v33.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans select-none pb-20 overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        function MasterSynthApp() {
            const [tab, setTab] = React.useState("DUAL_EDIT");
            const [playing, setPlaying] = React.useState(false);
            const [isRecording, setIsRecording] = React.useState(false);
            const [flashColor, setFlashColor] = React.useState("border-cyan-500");
            const [bpm, setBpm] = React.useState(112);
            const [currentBar, setCurrentBar] = React.useState(0);
            const [currentStep, setCurrentStep] = React.useState(-1);
            const [status, setStatus] = React.useState("🌍 ベース・重低音・20種ドラム・AI自動作曲・手動書き込み対応！起動完了");

            const BARS = 8;
            const BAR_STEPS = 16;
            const TOTAL_STEPS = BARS * BAR_STEPS;

            const [selectedInstrument, setSelectedInstrument] = React.useState("synth");
            const [selectedNote, setSelectedNote] = React.useState("C4");
            const [selectedDrumPart, setSelectedDrumPart] = React.useState("kick");
            const [inputMode, setInputMode] = React.useState("keyboard");

            const [savedSlots, setSavedSlots] = React.useState({});
            const [slotName, setSlotName] = React.useState("MIC_VICTORY_ALBUM_01");

            const [instrumentSteps, setInstrumentSteps] = React.useState({
                drums: new Array(TOTAL_STEPS).fill(null),
                subBass: new Array(TOTAL_STEPS).fill(null),
                bass: new Array(TOTAL_STEPS).fill(null),
                synth: new Array(TOTAL_STEPS).fill(null),
                piano: new Array(TOTAL_STEPS).fill(null),
                guitar: new Array(TOTAL_STEPS).fill(null),
                trumpet: new Array(TOTAL_STEPS).fill(null),
                violin: new Array(TOTAL_STEPS).fill(null),
                robot: new Array(TOTAL_STEPS).fill(null),
                voiceTrack: new Array(TOTAL_STEPS).fill(null),
            });

            const synthsRef = React.useRef(null);
            const loopRef = React.useRef(null);

            const NOTES = ["C4", "D4", "E4", "F4", "G4", "A4", "B4", "C5"];
            const SOLFEGE = { "C4": "ド", "D4": "レ", "E4": "ミ", "F4": "ファ", "G4": "ソ", "A4": "ラ", "B4": "シ", "C5": "ド" };

            const INSTRUMENTS = [
                { id: "drums", label: "🥁 20種ドラム", color: "from-red-600 to-amber-600" },
                { id: "subBass", label: "🔊 重低音サブベース", color: "from-amber-700 to-yellow-700" },
                { id: "bass", label: "🎸 ベース", color: "from-emerald-600 to-teal-600" },
                { id: "synth", label: "🎹 シンセ", color: "from-cyan-600 to-blue-700" },
                { id: "piano", label: "🎹 ピアノ", color: "from-blue-600 to-indigo-600" },
                { id: "guitar", label: "🎸 ギター", color: "from-orange-600 to-red-700" },
                { id: "trumpet", label: "🎺 トランペット", color: "from-yellow-500 to-amber-600" },
                { id: "violin", label: "🎻 バイオリン", color: "from-amber-600 to-yellow-700" },
                { id: "robot", label: "🤖 ロボット", color: "from-purple-600 to-pink-600" },
            ];

            const DRUM_PARTS = [
                { id: "kick", label: "01. キック" }, { id: "subKick", label: "02. サブキック" },
                { id: "snare", label: "03. スネア" }, { id: "tightSnare", label: "04. タイトスネア" },
                { id: "hihat", label: "05. HHクローズ" }, { id: "openHihat", label: "06. HHオープン" },
                { id: "clap", label: "07. クラップ" }, { id: "rimshot", label: "08. リムショット" },
                { id: "tomHigh", label: "09. ハイタム" }, { id: "tomMid", label: "10. ミッドタム" },
                { id: "tomLow", label: "11. フロアタム" }, { id: "crash", label: "12. クラッシュ" },
                { id: "ride", label: "13. ライド" }, { id: "cowbell", label: "14. カウベル" },
                { id: "shaker", label: "15. シェイカー" }, { id: "tambourine", label: "16. タンバリン" },
                { id: "conga", label: "17. コンガ" }, { id: "bongo", label: "18. ボンゴ" },
                { id: "woodblock", label: "19. ウッドブロック" }, { id: "snap", label: "20. スナップ" },
            ];

            React.useEffect(() => {
                const masterGain = new Tone.Gain(1.3).toDestination();
                const reverb = new Tone.Reverb({ decay: 2.0, wet: 0.3 }).connect(masterGain);
                const delay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.25, wet: 0.2 }).connect(reverb);

                const subBassSynth = new Tone.MonoSynth({
                    oscillator: { type: "sine" },
                    envelope: { attack: 0.02, decay: 0.5, sustain: 0.6, release: 0.3 }
                }).connect(masterGain); // 重低音はダイレクトにマスターへ

                const bassSynth = new Tone.MonoSynth({
                    oscillator: { type: "triangle" },
                    envelope: { attack: 0.01, decay: 0.3, sustain: 0.4, release: 0.2 }
                }).connect(delay);

                const synthLead = new Tone.Synth({
                    oscillator: { type: "sawtooth" },
                    envelope: { attack: 0.01, decay: 0.3, sustain: 0.3, release: 0.2 }
                }).connect(delay);

                const pianoSynth = new Tone.Synth({
                    oscillator: { type: "sine" },
                    envelope: { attack: 0.01, decay: 0.4, sustain: 0.3, release: 0.5 }
                }).connect(reverb);

                const guitarSynth = new Tone.Synth({
                    oscillator: { type: "sawtooth" },
                    envelope: { attack: 0.005, decay: 0.2, sustain: 0.2, release: 0.1 }
                }).connect(reverb);

                const trumpetSynth = new Tone.Synth({
                    oscillator: { type: "square" },
                    envelope: { attack: 0.03, decay: 0.2, sustain: 0.5, release: 0.2 }
                }).connect(delay);

                const violinSynth = new Tone.Synth({
                    oscillator: { type: "sine" },
                    envelope: { attack: 0.1, decay: 0.3, sustain: 0.8, release: 0.4 }
                }).connect(reverb);

                const robotSynth = new Tone.Synth({
                    oscillator: { type: "square" },
                    envelope: { attack: 0.001, decay: 0.1, sustain: 0.1, release: 0.05 }
                }).connect(masterGain);

                // 20種ドラム音源の生成
                const drums = {};
                DRUM_PARTS.forEach(p => {
                    if (p.id.includes("kick")) {
                        drums[p.id] = new Tone.MembraneSynth({ pitchDecay: 0.05, octaves: 6, envelope: { attack: 0.001, decay: 0.5 } }).connect(masterGain);
                    } else if (p.id.includes("tom")) {
                        drums[p.id] = new Tone.MembraneSynth({ pitchDecay: 0.01, octaves: 2, envelope: { attack: 0.001, decay: 0.3 } }).connect(reverb);
                    } else if (p.id.includes("hihat") || p.id.includes("crash") || p.id.includes("ride") || p.id.includes("tambourine")) {
                        drums[p.id] = new Tone.MetalSynth({ frequency: 300, envelope: { attack: 0.001, decay: 0.1 } }).connect(reverb);
                    } else {
                        drums[p.id] = new Tone.NoiseSynth({ noise: { type: "pink" }, envelope: { attack: 0.001, decay: 0.15 } }).connect(reverb);
                    }
                });

                synthsRef.current = {
                    drums, subBass: subBassSynth, bass: bassSynth, synth: synthLead,
                    piano: pianoSynth, guitar: guitarSynth, trumpet: trumpetSynth, violin: violinSynth, robot: robotSynth
                };

                return () => {
                    Tone.Transport.stop();
                    Tone.Transport.cancel();
                };
            }, []);

            React.useEffect(() => {
                Tone.Transport.bpm.value = bpm;
                Tone.Transport.cancel();

                if (playing) {
                    let stepCounter = 0;
                    loopRef.current = new Tone.Loop(time => {
                        let step = stepCounter % TOTAL_STEPS;
                        const bar = Math.floor(step / BAR_STEPS);
                        const sInBar = step % BAR_STEPS;

                        setCurrentStep(sInBar);
                        setCurrentBar(bar);

                        if (sInBar % 2 === 0) {
                            const cols = ["border-pink-500", "border-cyan-400", "border-yellow-400", "border-purple-500", "border-amber-400"];
                            setFlashColor(cols[Math.floor(Math.random() * cols.length)]);
                        }

                        const syns = synthsRef.current;
                        if (!syns) return;

                        Object.keys(instrumentSteps).forEach(instKey => {
                            const val = instrumentSteps[instKey][step];
                            if (!val) return;

                            if (instKey === "drums") {
                                Object.keys(val).forEach(partKey => {
                                    if (val[partKey] && syns.drums[partKey]) {
                                        if (partKey.includes("kick")) syns.drums[partKey].triggerAttackRelease("C1", "8n", time);
                                        else if (partKey.includes("tom")) syns.drums[partKey].triggerAttackRelease("G2", "8n", time);
                                        else if (partKey === "cowbell") syns.drums[partKey].triggerAttackRelease("G4", "16n", time);
                                        else syns.drums[partKey].triggerAttackRelease("8n", time);
                                    }
                                });
                            } else if (instKey === "subBass") {
                                syns.subBass.triggerAttackRelease(val, "8n", time);
                            } else if (syns[instKey]) {
                                syns[instKey].triggerAttackRelease(typeof val === "string" ? val : "C4", "8n", time);
                            }
                        });

                        stepCounter++;
                    }, "16n").start(0);

                    Tone.Transport.start();
                } else {
                    Tone.Transport.stop();
                }
            }, [playing, bpm, instrumentSteps]);

            const togglePlay = async () => {
                await Tone.start();
                setPlaying(!playing);
                setStatus(playing ? "停止しました" : `▶ 再生中 (BPM: ${bpm})`);
            };

            const toggleRecord = async () => {
                await Tone.start();
                setIsRecording(!isRecording);
                setStatus(!isRecording ? "🔴 鍵盤記録モードON（鍵盤を叩くと現在の位置に記録されます）" : "⏹️ 記録モードOFF");
            };

            const toggleStep = (instKey, idx) => {
                setInstrumentSteps(prev => {
                    const currentArr = [...prev[instKey]];
                    if (instKey === "drums") {
                        const currentObj = currentArr[idx] || {};
                        const updatedObj = { ...currentObj, [selectedDrumPart]: !currentObj[selectedDrumPart] };
                        const hasAny = Object.values(updatedObj).some(Boolean);
                        currentArr[idx] = hasAny ? updatedObj : null;
                    } else if (instKey === "subBass") {
                        currentArr[idx] = currentArr[idx] ? null : "C1";
                    } else {
                        currentArr[idx] = currentArr[idx] ? null : selectedNote;
                    }
                    return { ...prev, [instKey]: currentArr };
                });
            };

            const clearSpecificInstrument = (instKey) => {
                setInstrumentSteps(prev => ({ ...prev, [instKey]: new Array(TOTAL_STEPS).fill(null) }));
                setStatus(`🗑️ 【${instKey}】をClearしました。`);
            };

            const clearAllSteps = () => {
                const emptyMap = {};
                Object.keys(instrumentSteps).forEach(k => { emptyMap[k] = new Array(TOTAL_STEPS).fill(null); });
                setInstrumentSteps(emptyMap);
                setStatus("🧹 すべてのトラックを完全Clearしました。");
            };

            const playNoteKeyboard = (note) => {
                setSelectedNote(note);
                const syns = synthsRef.current;
                if (!syns) return;

                if (selectedInstrument === "drums") {
                    const drumSyn = syns.drums[selectedDrumPart];
                    if (drumSyn) {
                        if (selectedDrumPart.includes("kick")) drumSyn.triggerAttackRelease("C1", "8n");
                        else if (selectedDrumPart.includes("tom")) drumSyn.triggerAttackRelease("G2", "8n");
                        else drumSyn.triggerAttackRelease("8n");
                    }
                } else if (selectedInstrument === "subBass") {
                    syns.subBass.triggerAttackRelease(note, "8n");
                } else if (syns[selectedInstrument]) {
                    syns[selectedInstrument].triggerAttackRelease(note, "8n");
                }

                if (isRecording && currentStep !== -1) {
                    const stepIdx = currentBar * BAR_STEPS + currentStep;
                    toggleStep(selectedInstrument, stepIdx);
                }
            };

            const generateInstrumentAI = (instKey) => {
                const scales = ["C4", "D4", "E4", "G4", "A4", "C5"];
                const subBassNotes = ["C1", "G1", "F1"];
                const instArr = new Array(TOTAL_STEPS).fill(null);

                for (let s = 0; s < TOTAL_STEPS; s++) {
                    const sInBar = s % BAR_STEPS;
                    if (instKey === "drums") {
                        instArr[s] = {
                            kick: sInBar % 4 === 0,
                            snare: sInBar === 4 || sInBar === 12,
                            hihat: sInBar % 2 === 0,
                            openHihat: sInBar === 14
                        };
                    } else if (instKey === "subBass") {
                        if (sInBar % 4 === 0) instArr[s] = subBassNotes[Math.floor(Math.random() * subBassNotes.length)];
                    } else if (sInBar % 2 === 0) {
                        instArr[s] = scales[Math.floor(Math.random() * scales.length)];
                    }
                }
                setInstrumentSteps(prev => ({ ...prev, [instKey]: instArr }));
                setStatus(`✨ 【${instKey}】のAI自動作曲が完了しました！`);
            };

            const generateAllAI = () => {
                INSTRUMENTS.forEach(inst => generateInstrumentAI(inst.id));
                setStatus("✨ 全楽器の一括AI自動作曲が完了しました！");
            };

            const saveCurrentSession = () => {
                setSavedSlots({ ...savedSlots, [slotName]: JSON.parse(JSON.stringify(instrumentSteps)) });
                setStatus(`💾 セッション「${slotName}」として記憶（保存）しました！`);
            };

            const loadSession = (name) => {
                if (savedSlots[name]) {
                    setInstrumentSteps(JSON.parse(JSON.stringify(savedSlots[name])));
                    setStatus(`📂 セッション「${name}」を呼び出しました！`);
                }
            };

            const currentInstObj = INSTRUMENTS.find(i => i.id === selectedInstrument);

            return (
                <div className={`min-h-screen bg-slate-950 text-slate-100 flex flex-col text-xs font-sans select-none border-8 transition-all duration-75 ${flashColor}`}>
                    
                    {/* ヘッダー */}
                    <header className="bg-slate-900 border-b border-slate-800 px-3 py-2 flex items-center justify-between gap-2 sticky top-0 z-50 shadow-lg">
                        <span className="font-black text-sm bg-gradient-to-r from-amber-400 via-pink-400 to-cyan-400 bg-clip-text text-transparent">
                            MIC VICTORY <span className="text-[10px] text-amber-400 font-normal">v33.0</span>
                        </span>

                        <div className="flex items-center gap-1.5 flex-wrap">
                            <button onClick={togglePlay} className={`px-3 py-1 rounded font-bold text-xs shadow ${playing ? "bg-amber-400 text-slate-950 animate-bounce" : "bg-pink-600 text-white"}`}>
                                {playing ? "■ 再生停止" : "▶ 再生する"}
                            </button>
                            <button onClick={toggleRecord} className={`px-3 py-1 rounded font-bold text-xs shadow ${isRecording ? "bg-red-600 text-white animate-pulse" : "bg-slate-800 text-red-400 border border-red-800"}`}>
                                {isRecording ? "🔴 記録中" : "⏺️ 鍵盤記録ON"}
                            </button>
                            <button onClick={clearAllSteps} className="px-2.5 py-1 bg-red-950 hover:bg-red-900 text-red-300 rounded font-bold text-xs border border-red-800">
                                🧹 全Clear
                            </button>
                            <div className="flex items-center gap-1 bg-slate-950 px-2 py-0.5 rounded border border-slate-800">
                                <span className="text-[9px] text-slate-400">BPM</span>
                                <input type="number" value={bpm} onChange={e => setBpm(Math.max(60, Math.min(220, Number(e.target.value))))} className="w-12 bg-slate-900 text-center font-bold text-pink-400 rounded text-xs py-0.5" />
                            </div>
                        </div>
                    </header>

                    {/* タブナビゲーション */}
                    <nav className="bg-slate-900/90 border-b border-slate-800 px-2 py-1.5 flex gap-1 overflow-x-auto">
                        {[
                            { id: "DUAL_EDIT", label: "🎛️ 楽器・鍵盤・エディタ" },
                            { id: "ALL_STUDIO", label: "✨ 一括AI自動作曲" },
                            { id: "MEMORY_LIST", label: "💾 記憶・ロード" },
                        ].map(t => (
                            <button key={t.id} onClick={() => setTab(t.id)} className={`px-3 py-1 rounded text-center font-bold transition-all shrink-0 ${tab === t.id ? "bg-amber-500 text-slate-950 shadow" : "bg-slate-800/60 text-slate-400"}`}>
                                {t.label}
                            </button>
                        ))}
                    </nav>

                    <div className="bg-slate-900/50 px-3 py-1 text-[11px] text-cyan-400 border-b border-slate-900 truncate">
                        <span>💡 {status}</span>
                    </div>

                    <main className="p-2 flex flex-col gap-3">

                        {/* タブ1: メイン演奏・手動書き込み */}
                        {tab === "DUAL_EDIT" && (
                            <div className="flex flex-col gap-3">
                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-2.5 shadow">
                                    <div className="flex justify-between items-center flex-wrap gap-2">
                                        <span className="text-xs font-bold text-pink-400">① 楽器セレクト（重低音ベース・20種ドラム対応）</span>
                                        <div className="flex gap-2">
                                            <button onClick={() => generateInstrumentAI(selectedInstrument)} className="px-2.5 py-1 bg-purple-950 hover:bg-purple-900 text-purple-300 font-bold rounded text-[10px] border border-purple-800">✨ この楽器をAI作曲</button>
                                            <button onClick={() => clearSpecificInstrument(selectedInstrument)} className="px-2.5 py-1 bg-red-950 hover:bg-red-900 text-red-300 font-bold rounded text-[10px] border border-red-800">🗑️ Clear</button>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-3 sm:grid-cols-5 md:grid-cols-9 gap-1.5">
                                        {INSTRUMENTS.map(inst => (
                                            <button key={inst.id} onClick={() => setSelectedInstrument(inst.id)} className={`py-2 px-1 rounded-lg font-bold text-[11px] transition-all border flex items-center justify-center gap-1 shadow ${selectedInstrument === inst.id ? `bg-gradient-to-r ${inst.color} border-white text-white ring-2 ring-white/30` : "bg-slate-950 border-slate-800 text-slate-400"}`}>
                                                {inst.label}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {selectedInstrument === "drums" && (
                                    <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-2 shadow">
                                        <span className="text-xs font-bold text-amber-400">🥁 20種類のドラムパーツ選択</span>
                                        <div className="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-5 gap-1.5 max-h-[160px] overflow-y-auto p-1 bg-slate-950 rounded border border-slate-800">
                                            {DRUM_PARTS.map(part => (
                                                <button key={part.id} onClick={() => setSelectedDrumPart(part.id)} className={`px-2 py-1.5 rounded font-bold text-[10px] text-left transition-all border ${selectedDrumPart === part.id ? "bg-amber-500 text-slate-950 border-white shadow" : "bg-slate-900 text-slate-300 border-slate-800 hover:bg-slate-800"}`}>
                                                    {part.label}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3 shadow">
                                    <div className="flex justify-between items-center flex-wrap gap-2">
                                        <span className="text-xs font-bold text-cyan-400">② 鍵盤・演奏 ＆ 手動グリッド書き込み ({currentInstObj.label})</span>
                                        <div className="flex gap-1.5 items-center">
                                            <button onClick={() => setInputMode("keyboard")} className={`px-3 py-1 rounded text-[10px] font-bold ${inputMode === "keyboard" ? "bg-cyan-600 text-white" : "bg-slate-800 text-slate-400"}`}>鍵盤演奏</button>
                                            <button onClick={() => setInputMode("grid")} className={`px-3 py-1 rounded text-[10px] font-bold ${inputMode === "grid" ? "bg-cyan-600 text-white" : "bg-slate-800 text-slate-400"}`}>手動グリッド書き込み</button>
                                        </div>
                                    </div>

                                    {inputMode === "keyboard" && (
                                        <div className="bg-slate-950 border border-slate-800 rounded p-2.5 flex flex-col gap-2">
                                            {selectedInstrument === "drums" ? (
                                                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                                                    {DRUM_PARTS.map(part => (
                                                        <button key={part.id} onClick={() => { setSelectedDrumPart(part.id); playNoteKeyboard("C4"); }} className={`py-3 px-2 rounded font-bold flex flex-col items-center justify-center gap-1 border transition-all active:scale-95 ${selectedDrumPart === part.id ? "bg-amber-500 text-slate-950 border-white ring-2 ring-white shadow-lg" : "bg-slate-900 text-slate-200 border-slate-800 hover:bg-slate-800"}`}>
                                                            <span className="text-[11px]">{part.label}</span>
                                                        </button>
                                                    ))}
                                                </div>
                                            ) : (
                                                <div className="grid grid-cols-8 gap-1.5">
                                                    {NOTES.map(note => (
                                                        <button key={note} onClick={() => playNoteKeyboard(note)} className={`py-4 rounded font-bold flex flex-col items-center justify-center gap-1 border transition-all active:scale-95 ${selectedNote === note ? "bg-amber-500 text-slate-950 border-white ring-2 ring-white shadow-lg shadow-amber-500/50" : "bg-slate-900 text-slate-200 border-slate-800 hover:bg-slate-800"}`}>
                                                            <span className="text-sm font-black">{SOLFEGE[note]}</span>
                                                            <span className="text-[9px] text-slate-400">{note}</span>
                                                        </button>
                                                    ))}
                                                </div>
                                            )}
                                            <span className="text-[10px] text-center text-slate-400">※ボタン音出し＋「鍵盤記録ON」でリアルタイム自動書き込み。</span>
                                        </div>
                                    )}

                                    {inputMode === "grid" && (
                                        <div className="flex flex-col gap-2 bg-slate-950 p-3 rounded border border-slate-800">
                                            <div className="flex items-center justify-between">
                                                <span className="text-[11px] font-bold text-slate-300">小節切替: <strong className="text-pink-400">{currentBar + 1} / 8小節</strong></span>
                                                <div className="flex gap-1">
                                                    {Array.from({ length: BARS }).map((_, b) => (
                                                        <button key={b} onClick={() => setCurrentBar(b)} className={`w-7 h-7 rounded-full text-xs font-bold ${currentBar === b ? "bg-amber-500 text-slate-950" : "bg-slate-800 text-slate-400"}`}>{b + 1}</button>
                                                    ))}
                                                </div>
                                            </div>

                                            <div className="overflow-x-auto py-1">
                                                <div className="grid gap-1 min-w-[540px]" style={{ gridTemplateColumns: "repeat(16, minmax(0, 1fr))" }}>
                                                    {Array.from({ length: BAR_STEPS }).map((_, i) => {
                                                        const stepIdx = currentBar * BAR_STEPS + i;
                                                        const stepVal = instrumentSteps[selectedInstrument][stepIdx];
                                                        const isCurrentPlay = playing && currentStep === i;
                                                        let isActive = selectedInstrument === "drums" ? (stepVal && stepVal[selectedDrumPart]) : !!stepVal;

                                                        return (
                                                            <button key={i} onClick={() => toggleStep(selectedInstrument, stepIdx)} className={`aspect-[3/4] w-full rounded border flex flex-col items-center justify-center text-[9px] transition-all ${isActive ? "bg-gradient-to-t from-amber-600 to-pink-600 border-white text-white font-bold shadow-md shadow-pink-500/50 scale-105" : "bg-slate-900 border-slate-800 text-slate-500"} ${isCurrentPlay ? "ring-2 ring-cyan-400" : ""}`}>
                                                                <span className="font-bold text-[10px]">{i + 1}</span>
                                                            </button>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                            <span className="text-[10px] text-center text-slate-400">※マップをクリックするだけで手動書き込み・削除（Clear）ができます。</span>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* タブ2: 一括AI自動作曲 */}
                        {tab === "ALL_STUDIO" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-4 flex flex-col gap-4 items-center">
                                <span className="text-xs font-bold text-pink-400 self-start">✨ AI自動作曲</span>
                                <button onClick={generateAllAI} className="w-full py-4 bg-gradient-to-r from-pink-600 to-amber-600 text-white font-black text-sm rounded-xl shadow-lg hover:opacity-90">
                                    🚀 全楽器の一括AI自動作曲を実行する
                                </button>
                                <span className="text-[11px] text-slate-400">重低音ベース、20種ドラム、シンセサイザーなどの全トラックに一瞬で最高の自動フレーズを作成します。</span>
                            </div>
                        )}

                        {/* タブ3: 記憶・ロード */}
                        {tab === "MEMORY_LIST" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3">
                                <span className="text-xs font-bold text-emerald-400">💾 セッション記憶・ロード</span>
                                <div className="flex gap-2 bg-slate-950 p-3 rounded border border-slate-800">
                                    <input type="text" value={slotName} onChange={e => setSlotName(e.target.value)} className="bg-slate-900 px-2 py-1 rounded text-slate-100 flex-1 border border-slate-800 text-xs" />
                                    <button onClick={saveCurrentSession} className="px-4 py-1 bg-emerald-600 text-white font-bold rounded text-xs">記憶する</button>
                                </div>
                                <div className="flex flex-col gap-2 bg-slate-950 p-3 rounded border border-slate-800 max-h-[200px] overflow-y-auto">
                                    {Object.keys(savedSlots).length === 0 && <span className="text-[11px] text-slate-500">記憶されたセッションはまだありません。</span>}
                                    {Object.keys(savedSlots).map(name => (
                                        <div key={name} className="flex justify-between items-center bg-slate-900 p-2 rounded border border-slate-800">
                                            <span className="font-bold text-cyan-400 text-xs">{name}</span>
                                            <button onClick={() => loadSession(name)} className="px-2 py-1 bg-cyan-600 text-white rounded text-[10px] font-bold">ロードする</button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<MasterSynthApp/>);
    </script>
</body>
</html>
