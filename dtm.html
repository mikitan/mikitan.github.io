<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RHYTHM FORGE - Ultimate Mobile Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans select-none pb-20">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [tab, setTab] = React.useState("DRUM");
            const [playing, setPlaying] = React.useState(false);
            const [isLooping, setIsLooping] = React.useState(true);
            const [flashEffect, setFlashEffect] = React.useState(false);
            const [bpm, setBpm] = React.useState(115);
            const [currentBar, setCurrentBar] = React.useState(0);
            const [currentStep, setCurrentStep] = React.useState(-1);
            const [status, setStatus] = React.useState("準備完了：タップして演奏を始めよう");

            const BARS = 18;
            const BAR_STEPS = 16;
            const TOTAL_STEPS = BARS * BAR_STEPS;

            // データ状態
            const [drumSteps, setDrumSteps] = React.useState({
                kick: new Array(TOTAL_STEPS).fill(0),
                snare: new Array(TOTAL_STEPS).fill(0),
                hihat: new Array(TOTAL_STEPS).fill(0),
                clap: new Array(TOTAL_STEPS).fill(0),
                afroTom: new Array(TOTAL_STEPS).fill(0),
            });
            const [bassSteps, setBassSteps] = React.useState(new Array(TOTAL_STEPS).fill(null));
            const [melodySteps, setMelodySteps] = React.useState(new Array(TOTAL_STEPS).fill(null));

            const [bassNote, setBassNote] = React.useState("C2");
            const [melodyInstrument, setMelodyInstrument] = React.useState("piano");
            const [melodyNote, setMelodyNote] = React.useState("C4");

            const [songName, setSongName] = React.useState("");
            const [savedList, setSavedList] = React.useState([]);

            const synthsRef = React.useRef(null);
            const loopRef = React.useRef(null);

            const DRUM_ROWS = [
                { key: "kick", label: "KICK" },
                { key: "snare", label: "SNARE" },
                { key: "hihat", label: "HI-HAT" },
                { key: "clap", label: "CLAP" },
                { key: "afroTom", label: "🪘 太鼓" },
            ];

            const NOTES = ["C4", "D4", "E4", "F4", "G4", "A4", "B4", "C5"];
            const SOLFEGE = { "C4": "ド", "D4": "レ", "E4": "ミ", "F4": "ファ", "G4": "ソ", "A4": "ラ", "B4": "シ", "C5": "ド" };
            const BASS_NOTES = ["C1", "D1", "E1", "F1", "G1", "A1", "B1", "C2"];

            const INSTRUMENTS = [
                { id: "piano", label: "🎹 ピアノ" },
                { id: "guitar", label: "🎸 ギター" },
                { id: "electric_guitar", label: "⚡ エレキ" },
                { id: "violin", label: "🎻 バイオリン" },
                { id: "trumpet", label: "🎺 トランペット" },
            ];

            // 音源初期化
            React.useEffect(() => {
                try {
                    const masterGain = new Tone.Gain(1).toDestination();
                    const reverb = new Tone.Reverb({ decay: 2.0, wet: 0.2 }).connect(masterGain);
                    const delay = new Tone.FeedbackDelay({ delayTime: "8n", feedback: 0.2, wet: 0.15 }).connect(reverb);

                    const kick = new Tone.MembraneSynth({ pitchDecay: 0.05, octaves: 6 }).connect(delay);
                    const snare = new Tone.NoiseSynth({ envelope: { attack: 0.001, decay: 0.15, sustain: 0 } }).connect(delay);
                    const hihat = new Tone.NoiseSynth({ envelope: { attack: 0.001, decay: 0.05, sustain: 0 } }).connect(delay);
                    const clap = new Tone.NoiseSynth({ envelope: { attack: 0.01, decay: 0.2, sustain: 0 } }).connect(delay);
                    const afroTom = new Tone.MembraneSynth({ pitchDecay: 0.03, octaves: 4 }).connect(delay);

                    const bass = new Tone.MonoSynth({
                        oscillator: { type: "sawtooth" },
                        envelope: { attack: 0.02, decay: 0.2, sustain: 0.4, release: 0.2 }
                    }).connect(delay);

                    const melody = new Tone.Synth({
                        oscillator: { type: "sine" },
                        envelope: { attack: 0.05, decay: 0.2, sustain: 0.4, release: 0.4 }
                    }).connect(delay);

                    synthsRef.current = { kick, snare, hihat, clap, afroTom, bass, melody };
                } catch (e) {
                    console.error(e);
                }

                return () => {
                    Tone.Transport.stop();
                    Tone.Transport.cancel();
                };
            }, []);

            // 再生ループ
            React.useEffect(() => {
                Tone.Transport.bpm.value = bpm;
                Tone.Transport.cancel();

                if (playing) {
                    let stepCounter = 0;
                    loopRef.current = new Tone.Loop(time => {
                        const step = stepCounter % TOTAL_STEPS;
                        const bar = Math.floor(step / BAR_STEPS);
                        const sInBar = step % BAR_STEPS;

                        setCurrentStep(sInBar);
                        setCurrentBar(bar);

                        if (sInBar % 4 === 0) {
                            setFlashEffect(true);
                            setTimeout(() => setFlashEffect(false), 70);
                        }

                        const syns = synthsRef.current;
                        if (!syns) return;

                        if (drumSteps.kick[step]) syns.kick.triggerAttackRelease("C1", "8n", time);
                        if (drumSteps.snare[step]) syns.snare.triggerAttackRelease("16n", time);
                        if (drumSteps.hihat[step]) syns.hihat.triggerAttackRelease("32n", time);
                        if (drumSteps.clap[step]) syns.clap.triggerAttackRelease("16n", time);
                        if (drumSteps.afroTom[step]) syns.afroTom.triggerAttackRelease("G2", "8n", time);

                        const bNote = bassSteps[step];
                        if (bNote) syns.bass.triggerAttackRelease(bNote, "8n", time);

                        const mNote = melodySteps[step];
                        if (mNote) {
                            if (melodyInstrument === "piano") syns.melody.oscillator.type = "sine";
                            else if (melodyInstrument === "guitar") syns.melody.oscillator.type = "triangle";
                            else if (melodyInstrument === "electric_guitar") syns.melody.oscillator.type = "sawtooth";
                            else if (melodyInstrument === "violin") syns.melody.oscillator.type = "sawtooth";
                            else if (melodyInstrument === "trumpet") syns.melody.oscillator.type = "square";

                            syns.melody.triggerAttackRelease(mNote, "8n", time);
                        }

                        stepCounter++;
                        if (stepCounter >= TOTAL_STEPS && !isLooping) {
                            setPlaying(false);
                            Tone.Transport.stop();
                        }
                    }, "16n").start(0);

                    Tone.Transport.start();
                } else {
                    Tone.Transport.stop();
                }
            }, [playing, bpm, drumSteps, bassSteps, melodySteps, melodyInstrument, isLooping]);

            const togglePlay = async () => {
                await Tone.start();
                setPlaying(!playing);
                setStatus(playing ? "停止しました" : "▶ 連続リピート再生中...");
            };

            const restartFromTop = () => {
                Tone.Transport.position = 0;
                setCurrentBar(0);
                setCurrentStep(-1);
                setStatus("頭に戻りました");
            };

            // AI自動生成
            const generateAI = (genre) => {
                let d = {
                    kick: new Array(TOTAL_STEPS).fill(0),
                    snare: new Array(TOTAL_STEPS).fill(0),
                    hihat: new Array(TOTAL_STEPS).fill(0),
                    clap: new Array(TOTAL_STEPS).fill(0),
                    afroTom: new Array(TOTAL_STEPS).fill(0),
                };
                let b = new Array(TOTAL_STEPS).fill(null);
                let m = new Array(TOTAL_STEPS).fill(null);

                for (let bar = 0; bar < BARS; bar++) {
                    const offset = bar * BAR_STEPS;
                    if (genre === "SOUL") {
                        [0, 6, 10].forEach(i => d.kick[offset + i] = 1);
                        [4, 12].forEach(i => d.snare[offset + i] = 1);
                        [0, 2, 4, 6, 8, 10, 12, 14].forEach(i => d.hihat[offset + i] = 1);
                        [0, 8].forEach(i => b[offset + i] = "C2");
                        [2, 6, 10, 14].forEach(i => m[offset + i] = "E4");
                    } else if (genre === "DISCO") {
                        [0, 4, 8, 12].forEach(i => d.kick[offset + i] = 1);
                        [4, 12].forEach(i => d.clap[offset + i] = 1);
                        for (let i = 0; i < 16; i++) d.hihat[offset + i] = 1;
                        [0, 2, 4, 6, 8, 10, 12, 14].forEach(i => b[offset + i] = "G1");
                        [0, 4, 8, 12].forEach(i => m[offset + i] = "C5");
                    } else if (genre === "POPS") {
                        [0, 8].forEach(i => d.kick[offset + i] = 1);
                        [4, 12].forEach(i => d.snare[offset + i] = 1);
                        [0, 4, 8, 12].forEach(i => d.hihat[offset + i] = 1);
                        [0, 6, 10].forEach(i => b[offset + i] = "C2");
                        [0, 4, 8, 12].forEach(i => m[offset + i] = "C4");
                    } else if (genre === "POPPING_ROCK") {
                        [0, 3, 8, 11].forEach(i => d.kick[offset + i] = 1);
                        [4, 12].forEach(i => d.snare[offset + i] = 1);
                        [2, 6, 10, 14].forEach(i => d.clap[offset + i] = 1);
                        [0, 2, 4, 6, 8, 10, 12, 14].forEach(i => d.hihat[offset + i] = 1);
                        [0, 3, 8, 11].forEach(i => b[offset + i] = "F1");
                        [1, 5, 9, 13].forEach(i => m[offset + i] = "G4");
                    } else if (genre === "AFRO") {
                        [0, 3, 6, 10, 12].forEach(i => d.afroTom[offset + i] = 1);
                        [2, 6, 10, 14].forEach(i => d.hihat[offset + i] = 1);
                        [0, 4, 8, 12].forEach(i => b[offset + i] = "C2");
                        [1, 5, 9, 13].forEach(i => m[offset + i] = "A4");
                    }
                }
                setDrumSteps(d);
                setBassSteps(b);
                setMelodySteps(m);
                setStatus(`🤖 AI自動作曲 (${genre}) を適用しました！`);
            };

            const clearAll = () => {
                setDrumSteps({
                    kick: new Array(TOTAL_STEPS).fill(0),
                    snare: new Array(TOTAL_STEPS).fill(0),
                    hihat: new Array(TOTAL_STEPS).fill(0),
                    clap: new Array(TOTAL_STEPS).fill(0),
                    afroTom: new Array(TOTAL_STEPS).fill(0),
                });
                setBassSteps(new Array(TOTAL_STEPS).fill(null));
                setMelodySteps(new Array(TOTAL_STEPS).fill(null));
                setStatus("🧹 すべてクリアしました");
            };

            const toggleDrum = (key, idx) => {
                setDrumSteps(prev => {
                    const c = [...prev[key]];
                    c[idx] = c[idx] ? 0 : 1;
                    return { ...prev, [key]: c };
                });
            };
            const toggleBass = (idx) => {
                setBassSteps(prev => {
                    const c = [...prev];
                    c[idx] = c[idx] ? null : bassNote;
                    return c;
                });
            };
            const toggleMelody = (idx) => {
                setMelodySteps(prev => {
                    const c = [...prev];
                    c[idx] = c[idx] ? null : melodyNote;
                    return c;
                });
            };

            const saveProject = () => {
                if (!songName) { setStatus("⚠️ 曲名を入力してください"); return; }
                setSavedList([...savedList, { name: songName, time: new Date().toLocaleTimeString() }]);
                setStatus(`💾 「${songName}」を保存しました！`);
                setSongName("");
            };

            return (
                <div className={`min-h-screen bg-slate-950 text-slate-100 flex flex-col text-xs font-sans select-none transition-all ${flashEffect ? "bg-slate-900 border-b-2 border-pink-500" : ""}`}>
                    
                    {/* ヘッダー */}
                    <header className="bg-slate-900 border-b border-slate-800 px-3 py-2 flex items-center justify-between gap-1 sticky top-0 z-50">
                        <div className="flex items-center gap-1.5">
                            <span className="font-black text-xs bg-gradient-to-r from-pink-500 to-cyan-400 bg-clip-text text-transparent">
                                RHYTHM FORGE
                            </span>
                        </div>

                        <div className="flex items-center gap-1">
                            <button
                                onClick={() => setIsLooping(!isLooping)}
                                className={`px-2 py-1 rounded text-[10px] font-bold border ${
                                    isLooping ? "bg-cyan-950 border-cyan-700 text-cyan-300" : "bg-slate-800 border-slate-700 text-slate-400"
                                }`}
                            >
                                {isLooping ? "🔁リピートON" : "🔁OFF"}
                            </button>
                            <button
                                onClick={togglePlay}
                                className={`px-3 py-1 rounded font-bold text-xs shadow ${
                                    playing ? "bg-amber-500 text-slate-950 animate-pulse" : "bg-pink-600 text-white"
                                }`}
                            >
                                {playing ? "■ 停止" : "▶ 再生"}
                            </button>
                            <button onClick={restartFromTop} className="px-2 py-1 bg-slate-800 text-slate-200 rounded text-[10px]">
                                ⏮ 頭
                            </button>
                            <div className="flex items-center gap-1 bg-slate-950 px-1.5 py-0.5 rounded border border-slate-800">
                                <span className="text-[9px] text-slate-400">BPM</span>
                                <input
                                    type="number"
                                    value={bpm}
                                    onChange={e => setBpm(Math.max(40, Math.min(240, Number(e.target.value))))}
                                    className="w-9 bg-slate-900 text-center font-bold text-pink-400 rounded text-xs py-0.5"
                                />
                            </div>
                        </div>
                    </header>

                    {/* タブ */}
                    <nav className="bg-slate-900 border-b border-slate-800 px-2 py-1.5 flex gap-1 overflow-x-auto">
                        {[
                            { id: "DRUM", label: "🥁 ドラム" },
                            { id: "BASS", label: "🎸 ベース" },
                            { id: "MELODY", label: "🎹 メロディ" },
                            { id: "AI", label: "🤖 AI自動" },
                            { id: "SAVE", label: "💾 保存" },
                        ].map(t => (
                            <button
                                key={t.id}
                                onClick={() => setTab(t.id)}
                                className={`px-3 py-1 rounded font-bold text-xs shrink-0 ${
                                    tab === t.id ? "bg-pink-600 text-white shadow" : "bg-slate-800 text-slate-400"
                                }`}
                            >
                                {t.label}
                            </button>
                        ))}
                    </nav>

                    {/* ステータス */}
                    <div className="bg-slate-900/60 px-3 py-1 text-[11px] text-cyan-400 border-b border-slate-900 truncate">
                        💡 {status}
                    </div>

                    <main className="p-2 flex flex-col gap-3">
                        
                        {/* 18小節セレクター */}
                        <div className="bg-slate-900 border border-slate-800 rounded-lg p-2 flex flex-col gap-1.5">
                            <div className="flex items-center justify-between">
                                <span className="text-[11px] font-bold text-slate-300">
                                    小節選択: <strong className="text-pink-400 text-xs">{currentBar + 1}小節目 / 18小節</strong>
                                    {playing && <span className="ml-2 text-cyan-400">Step: {currentStep + 1}</span>}
                                </span>
                                <button onClick={clearAll} className="px-2 py-0.5 bg-red-950 text-red-300 text-[10px] rounded border border-red-800">
                                    全Clear
                                </button>
                            </div>
                            <div className="flex gap-1 overflow-x-auto pb-1">
                                {Array.from({ length: BARS }).map((_, b) => (
                                    <button
                                        key={b}
                                        onClick={() => setCurrentBar(b)}
                                        className={`w-7 h-7 shrink-0 rounded-full text-xs font-bold ${
                                            currentBar === b ? "bg-pink-600 text-white ring-2 ring-pink-400" : "bg-slate-800 text-slate-400"
                                        }`}
                                    >
                                        {b + 1}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* DRUM */}
                        {tab === "DRUM" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-2.5 overflow-x-auto">
                                <div className="text-xs font-bold text-pink-400 mb-2">🥁 ドラム・太鼓 ({currentBar + 1}小節目)</div>
                                <div className="flex flex-col gap-2 min-w-[420px]">
                                    {DRUM_ROWS.map(r => (
                                        <div key={r.key} className="flex items-center gap-2">
                                            <span className="w-20 text-[10px] font-bold text-slate-300 truncate">{r.label}</span>
                                            <div className="flex-1 grid gap-1" style={{ gridTemplateColumns: "repeat(16, minmax(0, 1fr))" }}>
                                                {Array.from({ length: BAR_STEPS }).map((_, i) => {
                                                    const stepIdx = currentBar * BAR_STEPS + i;
                                                    const active = drumSteps[r.key][stepIdx];
                                                    const isCurrentPlay = playing && currentStep === i;
                                                    return (
                                                        <button
                                                            key={i}
                                                            onClick={() => toggleDrum(r.key, stepIdx)}
                                                            className={`aspect-square w-full rounded-full border transition-all ${
                                                                active ? "bg-pink-600 border-pink-400 shadow-md shadow-pink-500/50" : "bg-slate-950 border-slate-800"
                                                            } ${isCurrentPlay ? "ring-2 ring-cyan-400" : ""}`}
                                                        />
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* BASS */}
                        {tab === "BASS" && (
                            <div className="flex flex-col gap-2">
                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-2 flex items-center gap-1 overflow-x-auto">
                                    <span className="text-[10px] text-slate-400 mr-1">ベース音:</span>
                                    {BASS_NOTES.map(n => (
                                        <button
                                            key={n}
                                            onClick={() => setBassNote(n)}
                                            className={`px-2 py-0.5 rounded text-[10px] font-bold shrink-0 ${
                                                bassNote === n ? "bg-cyan-600 text-white" : "bg-slate-800 text-slate-300"
                                            }`}
                                        >
                                            {n}
                                        </button>
                                    ))}
                                </div>
                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-2.5 overflow-x-auto">
                                    <div className="text-xs font-bold text-cyan-400 mb-2">🎸 ベース手動打ち ({currentBar + 1}小節目 / 音: {bassNote})</div>
                                    <div className="grid gap-1 min-w-[420px]" style={{ gridTemplateColumns: "repeat(16, minmax(0, 1fr))" }}>
                                        {Array.from({ length: BAR_STEPS }).map((_, i) => {
                                            const stepIdx = currentBar * BAR_STEPS + i;
                                            const note = bassSteps[stepIdx];
                                            const isCurrentPlay = playing && currentStep === i;
                                            return (
                                                <button
                                                    key={i}
                                                    onClick={() => toggleBass(stepIdx)}
                                                    className={`aspect-square w-full rounded-full border flex items-center justify-center text-[8px] ${
                                                        note ? "bg-cyan-600 border-cyan-400 text-white font-bold" : "bg-slate-950 border-slate-800 text-slate-500"
                                                    } ${isCurrentPlay ? "ring-2 ring-pink-400" : ""}`}
                                                >
                                                    {i + 1}
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* MELODY */}
                        {tab === "MELODY" && (
                            <div className="flex flex-col gap-2">
                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-2 flex flex-col gap-2">
                                    <div className="flex items-center gap-1 overflow-x-auto pb-1">
                                        <span className="text-[10px] text-slate-400 mr-1">楽器:</span>
                                        {INSTRUMENTS.map(p => (
                                            <button
                                                key={p.id}
                                                onClick={() => setMelodyInstrument(p.id)}
                                                className={`px-2 py-1 rounded text-[10px] font-bold shrink-0 ${
                                                    melodyInstrument === p.id ? "bg-purple-600 text-white" : "bg-slate-800 text-slate-300"
                                                }`}
                                            >
                                                {p.label}
                                            </button>
                                        ))}
                                    </div>
                                    <div className="flex items-center gap-1 overflow-x-auto pb-1">
                                        <span className="text-[10px] text-slate-400 mr-1">ドレミ:</span>
                                        {NOTES.map(n => (
                                            <button
                                                key={n}
                                                onClick={() => setMelodyNote(n)}
                                                className={`px-2 py-0.5 rounded text-[10px] font-bold shrink-0 ${
                                                    melodyNote === n ? "bg-purple-600 text-white" : "bg-slate-800 text-slate-300"
                                                }`}
                                            >
                                                {SOLFEGE[n]}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-2.5 overflow-x-auto">
                                    <div className="text-xs font-bold text-purple-400 mb-2">🎹 メロディ手動打ち ({currentBar + 1}小節目 / {melodyInstrument} / {SOLFEGE[melodyNote]})</div>
                                    <div className="grid gap-1 min-w-[420px]" style={{ gridTemplateColumns: "repeat(16, minmax(0, 1fr))" }}>
                                        {Array.from({ length: BAR_STEPS }).map((_, i) => {
                                            const stepIdx = currentBar * BAR_STEPS + i;
                                            const note = melodySteps[stepIdx];
                                            const isCurrentPlay = playing && currentStep === i;
                                            return (
                                                <button
                                                    key={i}
                                                    onClick={() => toggleMelody(stepIdx)}
                                                    className={`aspect-square w-full rounded-full border flex items-center justify-center text-[8px] ${
                                                        note ? "bg-purple-600 border-purple-400 text-white font-bold" : "bg-slate-950 border-slate-800 text-slate-500"
                                                    } ${isCurrentPlay ? "ring-2 ring-cyan-400" : ""}`}
                                                >
                                                    {i + 1}
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* AI */}
                        {tab === "AI" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-2">
                                <div className="text-xs font-bold text-pink-400">🤖 AI自動作曲（18小節を一括生成）</div>
                                <div className="grid grid-cols-2 gap-2">
                                    {[
                                        { id: "SOUL", label: "🎷 ソウル" },
                                        { id: "DISCO", label: "🕺 ディスコ" },
                                        { id: "POPS", label: "✨ ポップス" },
                                        { id: "POPPING_ROCK", label: "⚡ ポッピング・ロック" },
                                        { id: "AFRO", label: "🪘 アフリカ太鼓" },
                                    ].map(g => (
                                        <button
                                            key={g.id}
                                            onClick={() => generateAI(g.id)}
                                            className="p-2.5 bg-slate-950 hover:bg-slate-800 border border-slate-800 rounded-lg text-left font-bold text-slate-200"
                                        >
                                            <span className="text-xs">{g.label}生成</span>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* SAVE */}
                        {tab === "SAVE" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-2">
                                <div className="text-xs font-bold text-pink-400">💾 プロジェクト記録保存</div>
                                <div className="flex gap-2">
                                    <input 
                                        type="text" 
                                        placeholder="曲名を入力" 
                                        value={songName} 
                                        onChange={e => setSongName(e.target.value)} 
                                        className="flex-1 bg-slate-950 border border-slate-800 rounded px-2.5 py-1 text-xs text-slate-200" 
                                    />
                                    <button onClick={saveProject} className="px-3 py-1 bg-pink-600 text-white font-bold rounded text-xs">
                                        保存
                                    </button>
                                </div>
                                <div className="flex flex-col gap-1 mt-2 max-h-36 overflow-y-auto">
                                    {savedList.map((s, idx) => (
                                        <div key={idx} className="bg-slate-950 px-2.5 py-1.5 rounded border border-slate-800 flex justify-between text-[11px]">
                                            <span>🎵 {s.name}</span>
                                            <span className="text-slate-500">{s.time}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
