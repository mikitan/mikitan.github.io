<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RhythmForge - Web DAW & Groove Box</title>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tone.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body style="margin: 0; background-color: #0f172a;">
  <div id="root"></div>

  <script type="text/babel">
    function App() {
      const [playing, setPlaying] = React.useState(false);
      const [bpm, setBpm] = React.useState(120);
      const [currentStep, setCurrentStep] = React.useState(0);
      const [currentBar, setCurrentBar] = React.useState(0);
      const [tab, setTab] = React.useState("DRUM");
      const [status, setStatus] = React.useState("準備完了。再生ボタンを押してください");

      const BARS = 4;
      const BAR_STEPS = 16;
      const TOTAL_STEPS = BARS * BAR_STEPS;

      const [drumSteps, setDrumSteps] = React.useState({
        kick: Array(TOTAL_STEPS).fill(false),
        snare: Array(TOTAL_STEPS).fill(false),
        hihat: Array(TOTAL_STEPS).fill(false),
      });

      const DRUM_ROWS = [
        { key: "kick", label: "Kick" },
        { key: "snare", label: "Snare" },
        { key: "hihat", label: "Hi-Hat" },
      ];

      // Tone.js シンセ・音源の準備
      React.useEffect(() => {
        Tone.Transport.bpm.value = bpm;
      }, [bpm]);

      const togglePlay = async () => {
        await Tone.start();
        if (!playing) {
          Tone.Transport.start();
          setPlaying(true);
          setStatus("再生中...");
        } else {
          Tone.Transport.stop();
          setPlaying(false);
          setStatus("停止しました");
        }
      };

      const restartFromTop = () => {
        Tone.Transport.seconds = 0;
        setCurrentStep(0);
        setCurrentBar(0);
      };

      const toggleDrumStep = (rowKey, stepIdx) => {
        const globalIdx = currentBar * BAR_STEPS + stepIdx;
        setDrumSteps(prev => ({
          ...prev,
          [rowKey]: prev[rowKey].map((val, idx) => idx === globalIdx ? !val : val)
        }));
      };

      // サウンド再生用の簡易シンセ（メンテナス用）
      const kickSynth = React.useRef(new Tone.MembraneSynth().toDestination());
      const snareSynth = React.useRef(new Tone.NoiseSynth({
        synth: { oscillator: { type: 'sine' } },
        envelope: { attack: 0.001, decay: 0.2, sustain: 0 }
      }).toDestination());
      const hihatSynth = React.useRef(new Tone.MetalSynth({
        frequency: 200,
        envelope: { attack: 0.001, decay: 0.1, release: 0.01 },
        harmonicity: 5.1,
        modulationIndex: 32,
        resonance: 4000,
        octaves: 1.5
      }).toDestination());

      // ループ処理の設定
      React.useEffect(() => {
        let index = 0;
        const repeat = Tone.Transport.scheduleRepeat((time) => {
          const step = index % TOTAL_STEPS;
          const bar = Math.floor(step / BAR_STEPS);
          const barStep = step % BAR_STEPS;

          setCurrentStep(barStep);
          setCurrentBar(bar);

          // 各楽器の鳴り分け
          if (drumSteps.kick[step]) {
            kickSynth.current.triggerAttackRelease("C1", "8n", time);
          }
          if (drumSteps.snare[step]) {
            snareSynth.current.triggerAttackRelease("8n", time);
          }
          if (drumSteps.hihat[step]) {
            hihatSynth.current.triggerAttackRelease("32n", time, 0.3);
          }

          index++;
        }, "16n");

        return () => {
          Tone.Transport.clear(repeat);
        };
      }, [drumSteps]);

      return (
        <div style={{ minHeight: "100vh", backgroundColor: "#0f172a", color: "#f8fafc", fontFamily: "sans-serif", padding: "12px", boxSizing: "border-box" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: "10px", marginBottom: "12px", borderBottom: "1px solid #334155", paddingBottom: "10px" }}>
            <div>
              <h1 style={{ margin: 0, fontSize: "20px", color: "#38bdf8", fontWeight: "bold" }}>🥁 RHYTHM FORGE</h1>
              <div style={{ fontSize: "11px", color: "#94a3b8" }}>小節: {currentBar + 1} / {BARS} ｜ ステップ: {currentStep + 1}</div>
            </div>

            <div style={{ display: "flex", alignItems: "center", gap: "8px", flexWrap: "wrap" }}>
              <button onClick={togglePlay} style={{ backgroundColor: playing ? "#ef4444" : "#22c55e", color: "#fff", border: "none", padding: "8px 16px", borderRadius: "6px", fontWeight: "bold", cursor: "pointer", fontSize: "14px" }}>
                {playing ? "⏹ 停止" : "▶ 再生"}
              </button>
              <button onClick={restartFromTop} style={{ backgroundColor: "#475569", color: "#fff", border: "none", padding: "8px 12px", borderRadius: "6px", cursor: "pointer" }}>⏮ 最初から</button>
              <div style={{ display: "flex", alignItems: "center", gap: "4px", backgroundColor: "#1e293b", padding: "4px 8px", borderRadius: "6px", border: "1px solid #334155" }}>
                <span style={{ fontSize: "12px", color: "#94a3b8" }}>BPM:</span>
                <input type="number" value={bpm} onChange={e => setBpm(Math.max(40, Math.min(240, Number(e.target.value))))} style={{ width: "45px", backgroundColor: "#0f172a", color: "#fff", border: "1px solid #475569", borderRadius: "4px", textAlign: "center" }} />
              </div>
            </div>
          </div>

          <div style={{ backgroundColor: "#1e293b", padding: "12px", borderRadius: "8px", border: "1px solid #334155", marginBottom: "12px" }}>
            <div style={{ fontSize: "12px", color: "#38bdf8", marginBottom: "8px", fontWeight: "bold" }}>小節 {currentBar + 1} ドラムグリッド（青いマスで音が鳴ります）</div>
            {DRUM_ROWS.map(row => (
              <div key={row.key} style={{ display: "flex", alignItems: "center", marginBottom: "6px", gap: "6px" }}>
                <div style={{ width: "70px", color: "#cbd5e1", fontSize: "11px" }}>{row.label}</div>
                <div style={{ display: "flex", gap: "4px", flexGrow: 1 }}>
                  {Array.from({ length: BAR_STEPS }, (_, i) => {
                    const globalIdx = currentBar * BAR_STEPS + i;
                    const active = drumSteps[row.key][globalIdx];
                    const isCurrentPlaying = playing && currentStep === i;
                    return (
                      <button
                        key={i}
                        onClick={() => toggleDrumStep(row.key, i)}
                        style={{
                          flex: 1,
                          height: "36px",
                          backgroundColor: active ? "#38bdf8" : (isCurrentPlaying ? "#334155" : "#0f172a"),
                          border: "1px solid #475569",
                          borderRadius: "4px",
                          cursor: "pointer",
                        }}
                      />
                    );
                  })}
                </div>
              </div>
            ))}
          </div>

          <div style={{ backgroundColor: "#1e293b", padding: "8px 12px", borderRadius: "6px", border: "1px solid #334155", fontSize: "12px", color: "#38bdf8" }}>
            {status}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
