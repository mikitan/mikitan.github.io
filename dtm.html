<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Afro-Beat & Groove DAW (Per-Instrument AI / 18 Bars)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body class="bg-black text-amber-200 font-sans select-none pb-32 border-4 border-amber-600">
    <div id="root"></div>

    <script type="text/babel">
        function UltimateDAW() {
            const [tab, setTab] = React.useState("EDIT");
            const [playing, setPlaying] = React.useState(false);
            const [bpm, setBpm] = React.useState(112);
            const [currentBar, setCurrentBar] = React.useState(0);
            
            const totalBars = 18;
            const BAR_STEPS = 16;
            const getMaxSteps = () => totalBars * BAR_STEPS; // 288ステップ
            const [status, setStatus] = React.useState("✨ 各楽器AI対応・18小節アフリカ＆グルーブDAW起動完了");

            const [selectedInst, setSelectedInst] = React.useState("djembe");

            const INSTRUMENTS = [
                { id: "djembe", label: "🪘 アフリカ太鼓 (ジャンベ)" },
                { id: "talkingDrum", label: "🪘 トーキングドラム" },
                { id: "punchyKick", label: "🥁 ドラム・キック(BD)" },
                { id: "tightSnare", label: "💥 ドラム・スネア(SD)" },
                { id: "afroBass", label: "🎸 アフロ・重低音ベース" },
                { id: "chordKeys", label: "🎹 コード・ピアノ" },
                { id: "arpeggioSynth", label: "✨ アルペジオ・シンセ" },
                { id: "kalimba", label: "🎶 カリンバ (親指ピアノ)" }
            ];

            const [steps, setSteps] = React.useState({
                djembe: new Array(18 * BAR_STEPS).fill(null),
                talkingDrum: new Array(18 * BAR_STEPS).fill(null),
                punchyKick: new Array(18 * BAR_STEPS).fill(null),
                tightSnare: new Array(18 * BAR_STEPS).fill(null),
                afroBass: new Array(18 * BAR_STEPS).fill(null),
                chordKeys: new Array(18 * BAR_STEPS).fill(null),
                arpeggioSynth: new Array(18 * BAR_STEPS).fill(null),
                kalimba: new Array(18 * BAR_STEPS).fill(null),
            });

            // 鍵盤・メロディ記録用
            const [keyboardHistory, setKeyboardHistory] = React.useState([]);
            const [isRecordingKeyboard, setIsRecordingKeyboard] = React.useState(false);
            const [playingKeyboard, setPlayingKeyboard] = React.useState(false);

            const [melodyHistory, setMelodyHistory] = React.useState([]);
            const [isRecordingMelody, setIsRecordingMelody] = React.useState(false);
            const [playingMelody, setPlayingMelody] = React.useState(false);

            // FX状態
            const [scratchActive, setScratchActive] = React.useState(false);
            const [repeatActive, setRepeatActive] = React.useState(false);

            const synthsRef = React.useRef(null);
            const loopRef = React.useRef(null);

            // 💡 選択中の楽器だけにAIパターンを適用する関数（各楽器AI）
            const handleSingleInstrumentAi = () => {
                const maxS = getMaxSteps();
                const arr = new Array(maxS).fill(null);
                const notesMap = {
                    djembe: ["C2", "G2", "C3", "D3"],
                    talkingDrum: ["G3", "C4"],
                    punchyKick: ["C1"],
                    tightSnare: ["D1"],
                    afroBass: ["C1", "G0", "Bb0", "F1"],
                    chordKeys: ["C3", "Eb3", "G3"],
                    arpeggioSynth: ["C4", "E4", "G4", "B4"],
                    kalimba: ["C4", "G4", "C5", "E5"]
                };
                const notes = notesMap[selectedInst] || ["C3"];

                for (let s = 0; s < maxS; s++) {
                    const sInBar = s % BAR_STEPS;
                    if (selectedInst === "punchyKick") {
                        if (sInBar % 4 === 0) arr[s] = "C1";
                    } else if (selectedInst === "tightSnare") {
                        if (sInBar === 4 || sInBar === 12) arr[s] = "D1";
                    } else {
                        if (sInBar % 2 === 0 || sInBar % 3 === 0) {
                            arr[s] = notes[(s / 2) % notes.length];
                        }
                    }
                }

                setSteps(prev => ({ ...prev, [selectedInst]: arr }));
                setStatus(`✨ ${INSTRUMENTS.find(i=>i.id===selectedInst)?.label} のAIメロディ・リズムを作成しました！`);
            };

            // 選択中の楽器だけをクリア
            const handleSingleInstrumentClear = () => {
                const maxS = getMaxSteps();
                setSteps(prev => ({ ...prev, [selectedInst]: new Array(maxS).fill(null) }));
                setStatus(`🗑️ ${INSTRUMENTS.find(i=>i.id===selectedInst)?.label} のグリッドをクリアしました。`);
            };

            const toggleStep = (instKey, stepIndex) => {
                const updated = [...steps[instKey]];
                updated[stepIndex] = updated[stepIndex] ? null : (instKey.includes("Kick") || instKey.includes("Snare") ? "C1" : "C3");
                setSteps({ ...steps, [instKey]: updated });
            };

            // Audio初期化
            React.useEffect(() => {
                try {
                    const masterGain = new Tone.Gain(2.0).toDestination();
                    const eq = new Tone.EQ3({ low: 4, mid: 1, high: 2 }).connect(masterGain);
                    const reverb = new Tone.Reverb({ decay: 1.8, wet: 0.2 }).connect(eq);

                    const syns = {};
                    syns.djembe = new Tone.MembraneSynth({ pitchDecay: 0.02, octaves: 4, oscillator: { type: "sine" }, envelope: { attack: 0.001, decay: 0.3, sustain: 0 } }).connect(eq);
                    syns.talkingDrum = new Tone.Synth({ oscillator: { type: "triangle" }, envelope: { attack: 0.01, decay: 0.2, sustain: 0.1 } }).connect(eq);
                    syns.punchyKick = new Tone.MembraneSynth({ pitchDecay: 0.05, octaves: 6 }).connect(eq);
                    syns.tightSnare = new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.001, decay: 0.15, sustain: 0 } }).connect(eq);
                    syns.afroBass = new Tone.MonoSynth({ oscillator: { type: "sawtooth" }, filter: { cutoff: 800 } }).connect(eq);
                    syns.chordKeys = new Tone.PolySynth(Tone.Synth).connect(reverb);
                    syns.arpeggioSynth = new Tone.Synth({ oscillator: { type: "sine" } }).connect(reverb);
                    syns.kalimba = new Tone.Synth({ oscillator: { type: "triangle" }, envelope: { attack: 0.005, decay: 0.4 } }).connect(reverb);

                    synthsRef.current = syns;
                } catch(e) {}

                return () => { try { Tone.Transport.stop(); Tone.Transport.cancel(); } catch(e){} };
            }, []);

            // 18小節トランスポート再生ループ
            React.useEffect(() => {
                Tone.Transport.bpm.value = bpm;
                Tone.Transport.cancel();
                if (playing) {
                    let stepCounter = 0;
                    const maxS = getMaxSteps();

                    loopRef.current = new Tone.Loop(time => {
                        let step = stepCounter % maxS;
                        setCurrentBar(Math.floor(step / BAR_STEPS) % totalBars);

                        const syns = synthsRef.current;
                        if (!syns) return;

                        Object.keys(steps).forEach(k => {
                            const val = steps[k][step];
                            if (val && syns[k]) {
                                try {
                                    if (k === "punchyKick" || k === "djembe") syns[k].triggerAttackRelease(val, "8n", time);
                                    else if (k === "tightSnare") syns[k].triggerAttackRelease("8n", time);
                                    else syns[k].triggerAttackRelease(val, "8n", time);
                                } catch(e){}
                            }
                        });
                        stepCounter++;
                    }, "16n").start(0);

                    Tone.Transport.start();
                } else {
                    Tone.Transport.stop();
                }
            }, [playing, bpm, steps]);

            const togglePlay = async () => {
                try { await Tone.start(); } catch(e){}
                setPlaying(!playing);
            };

            // 鍵盤演奏・記録・再生
            const playKeyboardNote = async (note) => {
                try {
                    await Tone.start();
                    const syn = synthsRef.current?.[selectedInst];
                    if (syn) syn.triggerAttackRelease(note, "8n");
                    if (isRecordingKeyboard) {
                        setKeyboardHistory(prev => [...prev, { note, time: Date.now() }]);
                    }
                    setStatus(`🎵 鍵盤演奏: ${note} (${selectedInst})`);
                } catch(e){}
            };

            const playbackKeyboardHistory = async () => {
                if (keyboardHistory.length === 0) {
                    setStatus("⚠️ 記録された鍵盤データがありません。");
                    return;
                }
                setPlayingKeyboard(true);
                setStatus("▶ 鍵盤記録の再生中...");
                try {
                    await Tone.start();
                    const syn = synthsRef.current?.[selectedInst];
                    for (let i = 0; i < keyboardHistory.length; i++) {
                        const item = keyboardHistory[i];
                        if (syn) syn.triggerAttackRelease(item.note, "8n");
                        await new Promise(r => setTimeout(r, 300));
                    }
                } catch(e){}
                setPlayingKeyboard(false);
                setStatus("✨ 鍵盤記録の再生終了");
            };

            // メロディ記録・再生
            const playMelodyNote = async (note) => {
                try {
                    await Tone.start();
                    const syn = synthsRef.current?.kalimba;
                    if (syn) syn.triggerAttackRelease(note, "8n");
                    if (isRecordingMelody) {
                        setMelodyHistory(prev => [...prev, { note, time: Date.now() }]);
                    }
                    setStatus(`🎶 メロディ入力: ${note}`);
                } catch(e){}
            };

            const playbackMelodyHistory = async () => {
                if (melodyHistory.length === 0) {
                    setStatus("⚠️ 記録されたメロディデータがありません。");
                    return;
                }
                setPlayingMelody(true);
                setStatus("▶ メロディ記録の再生中...");
                try {
                    await Tone.start();
                    const syn = synthsRef.current?.kalimba;
                    for (let i = 0; i < melodyHistory.length; i++) {
                        const item = melodyHistory[i];
                        if (syn) syn.triggerAttackRelease(item.note, "8n");
                        await new Promise(r => setTimeout(r, 250));
                    }
                } catch(e){}
                setPlayingMelody(false);
                setStatus("✨ メロディ再生終了");
            };

            // FX: 連打・スクラッチ
            const triggerRapidFire = async () => {
                try {
                    await Tone.start();
                    const syn = synthsRef.current?.djembe;
                    setRepeatActive(true);
                    for (let i = 0; i < 8; i++) {
                        if (syn) syn.triggerAttackRelease("C3", "32n");
                        await new Promise(r => setTimeout(r, 80));
                    }
                    setRepeatActive(false);
                    setStatus("🔥 連打・リピートFX発動完了！");
                } catch(e){}
            };

            const triggerScratchFx = async () => {
                try {
                    await Tone.start();
                    const syn = synthsRef.current?.talkingDrum;
                    setScratchActive(true);
                    for (let i = 0; i < 5; i++) {
                        if (syn) syn.triggerAttackRelease(i % 2 === 0 ? "G2" : "C4", "64n");
                        await new Promise(r => setTimeout(r, 50));
                    }
                    setScratchActive(false);
                    setStatus("💿 スクラッチFX発動！");
                } catch(e){}
            };

            const doremiNotes = [
                { label: "ド", note: "C3" }, { label: "レ", note: "D3" },
                { label: "ミ", note: "E3" }, { label: "ファ", note: "F3" },
                { label: "ソ", note: "G3" }, { label: "ラ", note: "A3" },
                { label: "シ", note: "B3" }, { label: "高ド", note: "C4" }
            ];

            return (
                <div className="min-h-screen bg-gradient-to-b from-zinc-950 via-black to-zinc-950 text-amber-100 font-sans select-none">
                    
                    {/* ヘッダー */}
                    <header className="bg-gradient-to-r from-zinc-900 via-amber-950/50 to-zinc-900 border-b-2 border-amber-600 p-4 sticky top-0 z-50 shadow-2xl">
                        <div className="flex flex-wrap items-center justify-between gap-3 max-w-5xl mx-auto">
                            <span className="font-black text-sm sm:text-lg bg-gradient-to-r from-amber-400 via-yellow-200 to-amber-500 bg-clip-text text-transparent">
                                🪘 AFRO-BEAT & GROOVE DAW (18 Bars)
                            </span>

                            <div className="flex items-center gap-2 flex-wrap">
                                <button onClick={togglePlay} className={`px-5 py-2 rounded-xl font-black text-xs sm:text-sm shadow-xl transition-all ${playing ? "bg-yellow-300 text-black animate-bounce" : "bg-gradient-to-r from-amber-500 to-yellow-400 text-black"}`}>
                                    {playing ? "■ 停止" : "▶ 全体再生"}
                                </button>
                                <div className="flex items-center gap-1.5 bg-black/80 px-2.5 py-1.5 rounded-xl border border-amber-500">
                                    <span className="text-[11px] text-amber-400 font-bold">BPM</span>
                                    <input type="number" value={bpm} onChange={e => setBpm(Number(e.target.value))} className="w-10 bg-transparent text-center font-bold text-yellow-300 text-xs focus:outline-none" />
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* タブ */}
                    <nav className="bg-zinc-900/90 border-b border-amber-500/30 p-2.5 flex gap-2 overflow-x-auto max-w-5xl mx-auto mt-2 rounded-2xl shadow-lg">
                        {[
                            { id: "EDIT", label: "🪘 18小節グリッド ＆ 各楽器AI" },
                            { id: "KEYBOARD_REC", label: "🎹 ドレミ鍵盤記録・再生" },
                            { id: "MELODY_REC", label: "🎶 メロディ記録・再生" },
                            { id: "FX_PANEL", label: "🔥 FX (連打・スクラッチ)" },
                        ].map(t => (
                            <button key={t.id} onClick={() => setTab(t.id)} className={`px-4 py-2 rounded-xl text-center font-bold text-xs shrink-0 transition-all ${tab === t.id ? "bg-gradient-to-r from-amber-500 to-yellow-400 text-black shadow-lg scale-105" : "bg-zinc-950 text-amber-300 border border-amber-900/50"}`}>
                                {t.label}
                            </button>
                        ))}
                    </nav>

                    <div className="bg-black/90 px-4 py-2 text-xs text-yellow-300 border-b border-amber-900/40 max-w-5xl mx-auto flex justify-between items-center mt-2 rounded-xl">
                        <span className="truncate">💡 ステータス: {status}</span>
                        <span className="text-amber-300 font-bold shrink-0 ml-2">18小節進行: {currentBar + 1} / {totalBars}</span>
                    </div>

                    <main className="p-3 flex flex-col gap-3 max-w-5xl mx-auto">
                        {tab === "EDIT" && (
                            <div className="flex flex-col gap-3">
                                <div className="bg-zinc-900/90 border border-amber-500/40 rounded-2xl p-4 shadow-xl flex flex-col gap-3">
                                    <div className="flex justify-between items-center flex-wrap gap-2">
                                        <span className="text-xs sm:text-sm font-bold text-yellow-300">🪘 楽器選択 ＆ 「各楽器AI・Clear」</span>
                                        <div className="flex gap-2">
                                            <button onClick={handleSingleInstrumentAi} className="px-3.5 py-2 bg-gradient-to-r from-amber-500 to-yellow-400 text-black font-bold rounded-xl text-xs shadow">
                                                ✨ 選択楽器のAI作成
                                            </button>
                                            <button onClick={handleSingleInstrumentClear} className="px-3 py-2 bg-zinc-950 text-amber-300 border border-amber-600 font-bold rounded-xl text-xs">
                                                Clear
                                            </button>
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                                        {INSTRUMENTS.map(inst => (
                                            <button key={inst.id} onClick={() => setSelectedInst(inst.id)} className={`py-2 px-3 rounded-xl font-bold text-xs truncate border text-left transition-all ${selectedInst === inst.id ? "bg-gradient-to-r from-amber-500 to-yellow-400 text-black border-white shadow-lg" : "bg-black text-amber-300 border-amber-900/60"}`}>
                                                {inst.label}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* 18小節ステップグリッド */}
                                <div className="bg-zinc-900/90 border border-amber-500/40 rounded-2xl p-4 shadow-xl flex flex-col gap-3">
                                    <div className="flex justify-between items-center">
                                        <span className="text-xs sm:text-sm text-yellow-300 font-bold">
                                            🪘 18小節ステップグリッド ({INSTRUMENTS.find(i=>i.id===selectedInst)?.label})
                                        </span>
                                        <span className="text-[11px] text-amber-400">クリックでON/OFF</span>
                                    </div>
                                    
                                    <div className="overflow-x-auto pb-2">
                                        <div className="flex gap-1 min-w-[max-content]">
                                            {Array.from({ length: totalBars }).map((_, barIdx) => (
                                                <div key={barIdx} className={`border p-1 rounded-xl flex flex-col gap-1 ${currentBar === barIdx && playing ? 'border-yellow-300 bg-amber-950/20' : 'border-amber-900/50 bg-black'}`}>
                                                    <div className="text-[10px] text-center font-bold text-amber-400">Bar {barIdx + 1}</div>
                                                    <div className="grid grid-cols-4 gap-1">
                                                        {Array.from({ length: BAR_STEPS }).map((_, stepInBarIdx) => {
                                                            const absoluteStepIndex = barIdx * BAR_STEPS + stepInBarIdx;
                                                            const isActive = steps[selectedInst][absoluteStepIndex] !== null;

                                                            return (
                                                                <button
                                                                    key={stepInBarIdx}
                                                                    onClick={() => toggleStep(selectedInst, absoluteStepIndex)}
                                                                    className={`w-6 h-8 rounded-md transition-all ${
                                                                        isActive 
                                                                            ? "bg-gradient-to-t from-amber-500 to-yellow-300 shadow-md shadow-amber-500/50 border border-white" 
                                                                            : "bg-zinc-950 border border-amber-900/30 hover:border-amber-500"
                                                                    }`}
                                                                />
                                                            );
                                                        })}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {tab === "KEYBOARD_REC" && (
                            <div className="bg-zinc-900/90 border border-amber-500/40 rounded-2xl p-5 flex flex-col gap-4 shadow-xl">
                                <div className="flex justify-between items-center flex-wrap gap-2">
                                    <span className="text-sm font-bold text-yellow-300">🎹 ドレミファ鍵盤ボタン 記録・再生・Clear</span>
                                    <div className="flex gap-2">
                                        <button onClick={() => setIsRecordingKeyboard(!isRecordingKeyboard)} className={`px-4 py-2 rounded-xl font-bold text-xs border ${isRecordingKeyboard ? "bg-red-600 text-white animate-pulse border-white" : "bg-black text-amber-300 border-amber-600"}`}>
                                            {isRecordingKeyboard ? "🔴 記録中..." : "⏺️ 記録開始"}
                                        </button>
                                        <button onClick={playbackKeyboardHistory} disabled={playingKeyboard} className="px-4 py-2 bg-gradient-to-r from-amber-500 to-yellow-400 text-black font-bold rounded-xl text-xs shadow">
                                            {playingKeyboard ? "再生中..." : "▶ 再生"}
                                        </button>
                                        <button onClick={() => { setKeyboardHistory([]); setStatus("🗑️ 鍵盤記録をクリアしました。"); }} className="px-3 py-2 bg-zinc-950 text-amber-300 border border-amber-800 font-bold rounded-xl text-xs">
                                            Clear
                                        </button>
                                    </div>
                                </div>
                                <div className="grid grid-cols-4 sm:grid-cols-8 gap-2 bg-black p-4 rounded-xl border border-amber-500/30">
                                    {doremiNotes.map(k => (
                                        <button key={k.note} onClick={() => playKeyboardNote(k.note)} className="py-4 px-1 rounded-xl text-center font-bold bg-gradient-to-b from-zinc-900 to-black hover:from-amber-500 hover:to-yellow-400 hover:text-black text-amber-100 border border-amber-500/50 shadow-md active:scale-95 transition-all">
                                            <div className="text-sm text-yellow-300 font-black">{k.label}</div>
                                            <div className="text-[9px] text-amber-400">{k.note}</div>
                                        </button>
                                    ))}
                                </div>
                                <div className="text-xs text-amber-400">記録音数: {keyboardHistory.length} 音</div>
                            </div>
                        )}

                        {tab === "MELODY_REC" && (
                            <div className="bg-zinc-900/90 border border-amber-500/40 rounded-2xl p-5 flex flex-col gap-4 shadow-xl">
                                <div className="flex justify-between items-center flex-wrap gap-2">
                                    <span className="text-sm font-bold text-yellow-300">🎶 カリンバ・メロディ記録・再生・Clear</span>
                                    <div className="flex gap-2">
                                        <button onClick={() => setIsRecordingMelody(!isRecordingMelody)} className={`px-4 py-2 rounded-xl font-bold text-xs border ${isRecordingMelody ? "bg-red-600 text-white animate-pulse border-white" : "bg-black text-amber-300 border-amber-600"}`}>
                                            {isRecordingMelody ? "🔴 記録中..." : "⏺️ メロディ記録"}
                                        </button>
                                        <button onClick={playbackMelodyHistory} disabled={playingMelody} className="px-4 py-2 bg-gradient-to-r from-amber-500 to-yellow-400 text-black font-bold rounded-xl text-xs shadow">
                                            {playingMelody ? "再生中..." : "▶ メロディ再生"}
                                        </button>
                                        <button onClick={() => { setMelodyHistory([]); setStatus("🗑️ メロディ記録をクリアしました。"); }} className="px-3 py-2 bg-zinc-950 text-amber-300 border border-amber-800 font-bold rounded-xl text-xs">
                                            Clear
                                        </button>
                                    </div>
                                </div>
                                <div className="grid grid-cols-4 sm:grid-cols-5 gap-2 bg-black p-4 rounded-xl border border-amber-500/30">
                                    {["C4", "D4", "E4", "G4", "A4", "C5", "D5", "E5", "G5", "A5"].map(note => (
                                        <button key={note} onClick={() => playMelodyNote(note)} className="py-3 rounded-xl font-bold bg-zinc-900 hover:bg-amber-500 hover:text-black text-amber-200 border border-amber-600/50 transition-all text-xs">
                                            🎶 {note}
                                        </button>
                                    ))}
                                </div>
                                <div className="text-xs text-amber-400">記録音数: {melodyHistory.length} 音</div>
                            </div>
                        )}

                        {tab === "FX_PANEL" && (
                            <div className="bg-zinc-900/90 border border-amber-500/40 rounded-2xl p-5 flex flex-col gap-4 shadow-xl">
                                <span className="text-sm font-bold text-yellow-300">🔥 連打・リピート・スクラッチFX</span>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 bg-black p-4 rounded-xl border border-amber-500/30">
                                    <button onClick={triggerRapidFire} className={`py-4 px-4 rounded-xl font-black text-xs sm:text-sm border shadow-lg transition-all ${repeatActive ? "bg-red-600 text-white animate-pulse border-white" : "bg-gradient-to-r from-amber-500 to-yellow-400 text-black border-transparent"}`}>
                                        ⚡ 太鼓・高速連打リピート
                                    </button>
                                    <button onClick={triggerScratchFx} className={`py-4 px-4 rounded-xl font-black text-xs sm:text-sm border shadow-lg transition-all ${scratchActive ? "bg-amber-600 text-white animate-pulse border-white" : "bg-gradient-to-r from-yellow-600 to-amber-700 text-white border-transparent"}`}>
                                        💿 スクラッチFX発動
                                    </button>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<UltimateDAW/>);
    </script>
</body>
</html>
