<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RHYTHM FORGE - DAW & Music Studio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        // ここに先ほどのReactコンポーネントのロジックやアプリ本体を記述します
        function App() {
            return (
                <div className="min-h-screen flex flex-col items-center justify-center p-4">
                    <h1 className="text-3xl font-black bg-gradient-to-r from-indigo-400 to-amber-300 bg-clip-text text-transparent mb-4">
                        RHYTHM FORGE STUDIO
                    </h1>
                    <p className="text-sm text-slate-400 mb-6">アプリを読み込んでいます...</p>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById("root"));
    </script>
</body>
</html>
