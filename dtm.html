<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIC VICTORY - MASTER SYNTHESIZER v33.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans select-none pb-20 overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        function MasterSynthApp() {
            const [tab, setTab] = React.useState("DUAL_EDIT");
            const [playing, setPlaying] = React.useState(false);
            const [isRecording, setIsRecording] = React.useState(false);
            const [flashColor, setFlashColor] = React.useState("border-cyan-500");
            const [bpm, setBpm] = React.useState(112);
            const [currentBar, setCurrentBar] = React.useState(0);
            const [currentStep, setCurrentStep] = React.useState(-1);
            const [status, setStatus] = React.useState("🎹 連打メロディ記録・再生・編集機能追加！MIC VICTORY v33.0 スタジオ起動！");

            const BARS = 8;
            const BAR_STEPS = 16;
            const TOTAL_STEPS = BARS * BAR_STEPS;

            const [selectedInstrument, setSelectedInstrument] = React.useState("synth");
            const [selectedNote, setSelectedNote] = React.useState("C4");
            const [selectedDrumPart, setSelectedDrumPart] = React.useState("kick");
            const [inputMode, setInputMode] = React.useState("grid");

            const [selectedDrumPatternId, setSelectedDrumPatternId] = React.useState(1);
            const [selectedSubBassPatternId, setSelectedSubBassPatternId] = React.useState(1);

            // 連打記録・再生・編集用ステート
            const [rapidRecordMode, setRapidRecordMode] = React.useState(false);
            const [performanceLogs, setPerformanceLogs] = React.useState([]); // タイムライン連打ログ

            const [isVoiceRecording, setIsVoiceRecording] = React.useState(false);
            const [voiceAudioUrl, setVoiceAudioUrl] = React.useState(null);
            const mediaRecorderRef = React.useRef(null);
            const audioChunksRef = React.useRef([]);

            const [jacketTitle, setJacketTitle] = React.useState("MIC VICTORY RAPID BEATS");
            const [jacketGenre, setJacketGenre] = React.useState("SOUL / DISCO / LIVE JAM");
            const [jacketColor, setJacketColor] = React.useState("from-amber-600 via-rose-600 to-indigo-600");

            const [instrumentSteps, setInstrumentSteps] = React.useState({
                drums: new Array(TOTAL_STEPS).fill(null),
                subBass: new Array(TOTAL_STEPS).fill(null),
                robot: new Array(TOTAL_STEPS).fill(null),
                bass: new Array(TOTAL_STEPS).fill(null),
                piano: new Array(TOTAL_STEPS).fill(null),
                synth: new Array(TOTAL_STEPS).fill(null),
                guitar: new Array(TOTAL_STEPS).fill(null),
                trumpet: new Array(TOTAL_STEPS).fill(null),
                violin: new Array(TOTAL_STEPS).fill(null),
                voiceTrack: new Array(TOTAL_STEPS).fill(null),
            });

            const [fxSettings, setFxSettings] = React.useState({
                reverbWet: 0.35,
                delayWet: 0.25,
                distortion: 0.2,
                stereoPan: 0
            });

            const [savedSlots, setSavedSlots] = React.useState({});
            const [slotName, setSlotName] = React.useState("MIC_VICTORY_LIVE_01");

            const synthsRef = React.useRef(null);
            const loopRef = React.useRef(null);
            const pannerRef = React.useRef(null);

            const NOTES = ["C4", "D4", "E4", "F4", "G4", "A4", "B4", "C5"];
            const SOLFEGE = { "C4": "ド", "D4": "レ", "E4": "ミ", "F4": "ファ", "G4": "ソ", "A4": "ラ", "B4": "シ", "C5": "ド" };

            const INSTRUMENTS = [
                { id: "drums", label: "🥁 ドラム", color: "from-red-600 to-amber-600" },
                { id: "subBass", label: "🔊 重低音", color: "from-amber-600 to-orange-700" },
                { id: "bass", label: "🎸 ベース", color: "from-emerald-600 to-teal-600" },
                { id: "synth", label: "🎹 シンセ", color: "from-cyan-600 to-blue-700" },
                { id: "piano", label: "🎹 ピアノ", color: "from-blue-600 to-indigo-600" },
                { id: "guitar", label: "🎸 ギター", color: "from-orange-600 to-red-700" },
                { id: "trumpet", label: "🎺 トランペット", color: "from-yellow-500 to-amber-600" },
                { id: "violin", label: "🎻 バイオリン", color: "from-amber-600 to-yellow-700" },
                { id: "robot", label: "🤖 ロボット", color: "from-purple-600 to-pink-600" },
                { id: "voiceTrack", label: "🎤 ボイス", color: "from-rose-600 to-pink-700" },
            ];

            const GENRES = [
                { id: "soul", label: "✨ Soul (ソウル)" },
                { id: "disco", label: "🕺 Disco (ディスコ)" },
                { id: "pops", label: "🎵 Pops (ポップス)" },
                { id: "rook", label: "🎸 Rook (ロック)" },
                { id: "ballad", label: "🎹 Ballad (バラード)" },
                { id: "popingdance", label: "💃 Poping Dance" }
            ];

            const DRUM_PARTS = [
                { id: "kick", label: "キック" },
                { id: "snare", label: "スネア" },
                { id: "hihat", label: "ハイハット" },
                { id: "clap", label: "クラップ" },
            ];

            // 音響初期化
            React.useEffect(() => {
                const masterGain = new Tone.Gain(1.2).toDestination();
                const panner = new Tone.Panner(0).connect(masterGain);
                pannerRef.current = panner;

                const reverb = new Tone.Reverb({ decay: 2.2, wet: fxSettings.reverbWet }).connect(panner);
                const delay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.3, wet: fxSettings.delayWet }).connect(reverb);
                const distortion = new Tone.Distortion(fxSettings.distortion).connect(delay);

                const subBassSynth = new Tone.MonoSynth({
                    oscillator: { type: "triangle" },
                    envelope: { attack: 0.01, decay: 0.4, sustain: 0.4, release: 0.3 },
                    filterEnvelope: { attack: 0.001, decay: 0.3, baseFrequency: 50, octaves: 4 }
                }).connect(distortion);

                const robotSynth = new Tone.Synth({
                    oscillator: { type: "square" },
                    envelope: { attack: 0.01, decay: 0.15, sustain: 0.2, release: 0.1 }
                }).connect(distortion);

                const bassSynth = new Tone.MonoSynth({
                    oscillator: { type: "sine" },
                    envelope: { attack: 0.02, decay: 0.3, sustain: 0.4, release: 0.2 }
                }).connect(distortion);

                const kickSynth = new Tone.MembraneSynth({
                    pitchDecay: 0.05, octaves: 8, oscillator: { type: "sine" },
                    envelope: { attack: 0.001, decay: 0.6, sustain: 0.01, release: 0.4 }
                }).connect(masterGain);

                const snareSynth = new Tone.NoiseSynth({
                    noise: { type: "white" },
                    envelope: { attack: 0.001, decay: 0.25, sustain: 0 }
                }).connect(reverb);

                const hihatSynth = new Tone.MetalSynth({
                    frequency: 500, envelope: { attack: 0.001, decay: 0.05, release: 0.01 },
                    harmonicity: 5.0, modulationIndex: 35, resonance: 6000, octaves: 2
                }).connect(reverb);

                const clapSynth = new Tone.NoiseSynth({
                    noise: { type: "pink" },
                    envelope: { attack: 0.01, decay: 0.18, sustain: 0 }
                }).connect(reverb);

                const pianoSynth = new Tone.Synth({
                    oscillator: { type: "sine" },
                    envelope: { attack: 0.01, decay: 0.4, sustain: 0.3, release: 0.6 }
                }).connect(reverb);

                const synthLead = new Tone.Synth({
                    oscillator: { type: "sawtooth" },
                    envelope: { attack: 0.02, decay: 0.3, sustain: 0.4, release: 0.3 }
                }).connect(delay);

                const guitarSynth = new Tone.Synth({
                    oscillator: { type: "sawtooth" },
                    envelope: { attack: 0.005, decay: 0.25, sustain: 0.2, release: 0.15 }
                }).connect(distortion);

                const trumpetSynth = new Tone.Synth({
                    oscillator: { type: "sawtooth6" },
                    envelope: { attack: 0.05, decay: 0.2, sustain: 0.6, release: 0.2 }
                }).connect(delay);

                const violinSynth = new Tone.Synth({
                    oscillator: { type: "sine" },
                    envelope: { attack: 0.15, decay: 0.4, sustain: 0.8, release: 0.5 }
                }).connect(reverb);

                synthsRef.current = {
                    drums: { kick: kickSynth, snare: snareSynth, hihat: hihatSynth, clap: clapSynth },
                    subBass: subBassSynth,
                    bass: bassSynth,
                    robot: robotSynth,
                    piano: pianoSynth,
                    synth: synthLead,
                    guitar: guitarSynth,
                    trumpet: trumpetSynth,
                    violin: violinSynth,
                    masterGain, reverb, delay, distortion
                };

                return () => {
                    Tone.Transport.stop();
                    Tone.Transport.cancel();
                };
            }, []);

            // 運輸ループ
            React.useEffect(() => {
                Tone.Transport.bpm.value = bpm;
                Tone.Transport.cancel();

                if (playing) {
                    let stepCounter = 0;
                    loopRef.current = new Tone.Loop(time => {
                        let step = stepCounter % TOTAL_STEPS;
                        const bar = Math.floor(step / BAR_STEPS);
                        const sInBar = step % BAR_STEPS;

                        setCurrentStep(sInBar);
                        setCurrentBar(bar);

                        if (sInBar % 2 === 0) {
                            const colors = ["border-pink-500", "border-cyan-400", "border-yellow-400", "border-purple-500", "border-amber-400"];
                            setFlashColor(colors[Math.floor(Math.random() * colors.length)]);
                        }

                        const syns = synthsRef.current;
                        if (!syns) return;

                        Object.keys(instrumentSteps).forEach(instKey => {
                            if (instKey === "voiceTrack") return;
                            const val = instrumentSteps[instKey][step];
                            if (!val) return;

                            if (instKey === "drums") {
                                if (typeof val === "object") {
                                    if (val.kick) syns.drums.kick.triggerAttackRelease("C1", "8n", time);
                                    if (val.snare) syns.drums.snare.triggerAttackRelease("8n", time);
                                    if (val.hihat) syns.drums.hihat.triggerAttackRelease("32n", time, 0.7);
                                    if (val.clap) syns.drums.clap.triggerAttackRelease("8n", time);
                                }
                            } else if (instKey === "subBass") {
                                syns.subBass.triggerAttackRelease("C1", "8n", time);
                            } else if (syns[instKey]) {
                                syns[instKey].triggerAttackRelease(typeof val === "string" ? val : "C4", "8n", time);
                            }
                        });

                        stepCounter++;
                    }, "16n").start(0);

                    Tone.Transport.start();
                } else {
                    Tone.Transport.stop();
                }
            }, [playing, bpm, instrumentSteps]);

            const togglePlay = async () => {
                await Tone.start();
                setPlaying(!playing);
                setStatus(playing ? "停止しました" : `▶ 再生中 (BPM: ${bpm})`);
            };

            const toggleStep = (instKey, idx) => {
                setInstrumentSteps(prev => {
                    const currentArr = [...prev[instKey]];
                    if (instKey === "drums") {
                        const currentObj = currentArr[idx] || { kick: false, snare: false, hihat: false, clap: false };
                        const updatedObj = { ...currentObj, [selectedDrumPart]: !currentObj[selectedDrumPart] };
                        const hasAny = Object.values(updatedObj).some(Boolean);
                        currentArr[idx] = hasAny ? updatedObj : null;
                    } else if (instKey === "subBass") {
                        currentArr[idx] = currentArr[idx] ? null : "C1";
                    } else {
                        currentArr[idx] = currentArr[idx] ? null : selectedNote;
                    }
                    return { ...prev, [instKey]: currentArr };
                });
            };

            const clearSpecificInstrument = (instKey) => {
                setInstrumentSteps(prev => ({ ...prev, [instKey]: new Array(TOTAL_STEPS).fill(null) }));
                setStatus(`🗑️ 【${instKey}】をクリアしました。`);
            };

            const clearAllSteps = () => {
                setInstrumentSteps({
                    drums: new Array(TOTAL_STEPS).fill(null),
                    subBass: new Array(TOTAL_STEPS).fill(null),
                    robot: new Array(TOTAL_STEPS).fill(null),
                    bass: new Array(TOTAL_STEPS).fill(null),
                    piano: new Array(TOTAL_STEPS).fill(null),
                    synth: new Array(TOTAL_STEPS).fill(null),
                    guitar: new Array(TOTAL_STEPS).fill(null),
                    trumpet: new Array(TOTAL_STEPS).fill(null),
                    violin: new Array(TOTAL_STEPS).fill(null),
                    voiceTrack: new Array(TOTAL_STEPS).fill(null),
                });
                setPerformanceLogs([]);
                setStatus("🧹 すべての楽器・連打ログを完全クリアしました。");
            };

            // 🔥 連打メロディ記録・再生・編集機能
            const playAndRecordRapidNote = (note) => {
                setSelectedNote(note);
                const syns = synthsRef.current;
                if (!syns) return;

                // 試聴音を鳴らす
                if (selectedInstrument === "drums") {
                    if (selectedDrumPart === "kick") syns.drums.kick.triggerAttackRelease("C1", "8n");
                    else if (selectedDrumPart === "snare") syns.drums.snare.triggerAttackRelease("8n");
                    else if (selectedDrumPart === "hihat") syns.drums.hihat.triggerAttackRelease("32n");
                    else syns.drums.clap.triggerAttackRelease("8n");
                } else if (selectedInstrument === "subBass") {
                    syns.subBass.triggerAttackRelease("C1", "8n");
                } else if (syns[selectedInstrument]) {
                    syns[selectedInstrument].triggerAttackRelease(note, "8n");
                }

                // 連打録音モードONの場合、現在のステップやタイムラインに自動書き込み・ログ追加
                if (rapidRecordMode) {
                    const stepIdx = currentStep !== -1 ? (currentBar * BAR_STEPS + currentStep) : 0;
                    toggleStep(selectedInstrument, stepIdx);

                    setPerformanceLogs(prev => [...prev, {
                        id: Date.now() + Math.random(),
                        instrument: selectedInstrument,
                        note: selectedInstrument === "drums" ? selectedDrumPart : note,
                        step: stepIdx,
                        bar: Math.floor(stepIdx / BAR_STEPS) + 1
                    }]);
                    setStatus(`🔴 連打記録: ${selectedInstrument} [${note}] (小節 ${Math.floor(stepIdx / BAR_STEPS) + 1})`);
                }
            };

            const deletePerformanceLog = (id) => {
                setPerformanceLogs(prev => prev.filter(log => log.id !== id));
                setStatus("🗑️ 選択した連打ログを削除しました。");
            };

            const applyDrumPattern20 = (patternId) => {
                setSelectedDrumPatternId(patternId);
                const arr = new Array(TOTAL_STEPS).fill(null);
                for (let s = 0; s < TOTAL_STEPS; s++) {
                    const sInBar = s % BAR_STEPS;
                    let kick = sInBar % 4 === 0;
                    let snare = sInBar === 4 || sInBar === 12;
                    let hihat = sInBar % 2 === 0;
                    let clap = (patternId % 2 === 0 && sInBar === 12);
                    arr[s] = { kick, snare, hihat, clap };
                }
                setInstrumentSteps(prev => ({ ...prev, drums: arr }));
                setStatus(`🥁 ドラムパターン【No.${patternId}】適用！`);
            };

            const applySubBassPattern20 = (patternId) => {
                setSelectedSubBassPatternId(patternId);
                const arr = new Array(TOTAL_STEPS).fill(null);
                for (let s = 0; s < TOTAL_STEPS; s++) {
                    const sInBar = s % BAR_STEPS;
                    if (sInBar % (patternId % 4 + 1) === 0) arr[s] = "C1";
                }
                setInstrumentSteps(prev => ({ ...prev, subBass: arr }));
                setStatus(`🔊 重低音パターン【No.${patternId}】適用！`);
            };

            const startVoiceRecording = async () => {
                audioChunksRef.current = [];
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const mediaRecorder = new MediaRecorder(stream);
                    mediaRecorderRef.current = mediaRecorder;
                    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunksRef.current.push(e.data); };
                    mediaRecorder.onstop = () => {
                        const blob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                        setVoiceAudioUrl(URL.createObjectURL(blob));
                        setStatus("🎤 ボイス録音完了！");
                    };
                    mediaRecorder.start();
                    setIsVoiceRecording(true);
                    setStatus("🔴 ボイス録音中...");
                } catch (err) {
                    setStatus("❌ マイクが利用できません。");
                }
            };

            const stopVoiceRecording = () => {
                if (mediaRecorderRef.current && isVoiceRecording) {
                    mediaRecorderRef.current.stop();
                    setIsVoiceRecording(false);
                }
            };

            const saveCurrentSession = () => {
                setSavedSlots({ ...savedSlots, [slotName]: JSON.parse(JSON.stringify(instrumentSteps)) });
                setStatus(`💾 セッション「${slotName}」保存完了！`);
            };

            const loadSession = (name) => {
                if (savedSlots[name]) {
                    setInstrumentSteps(JSON.parse(JSON.stringify(savedSlots[name])));
                    setStatus(`📂 セッション「${name}」ロード完了！`);
                }
            };

            const currentInstObj = INSTRUMENTS.find(i => i.id === selectedInstrument);

            return (
                <div className={`min-h-screen bg-slate-950 text-slate-100 flex flex-col text-xs font-sans select-none border-8 transition-all duration-75 ${flashColor}`}>
                    
                    {/* ヘッダー */}
                    <header className="bg-slate-900 border-b border-slate-800 px-3 py-2 flex items-center justify-between gap-2 sticky top-0 z-50 shadow-lg">
                        <span className="font-black text-sm bg-gradient-to-r from-amber-400 via-pink-400 to-cyan-400 bg-clip-text text-transparent">
                            MIC VICTORY <span className="text-[10px] text-amber-400 font-normal">v33.0 (Rapid Jam & Edit)</span>
                        </span>

                        <div className="flex items-center gap-1.5 flex-wrap">
                            <button onClick={togglePlay} className={`px-3 py-1 rounded font-bold text-xs shadow ${playing ? "bg-amber-400 text-slate-950 animate-bounce" : "bg-pink-600 text-white"}`}>
                                {playing ? "■ 停止" : "▶ 再生"}
                            </button>
                            <div className="flex items-center gap-1 bg-slate-950 px-2 py-0.5 rounded border border-slate-800">
                                <span className="text-[9px] text-slate-400">BPM</span>
                                <input type="number" value={bpm} onChange={e => setBpm(Number(e.target.value))} className="w-12 bg-slate-900 text-center font-bold text-pink-400 rounded text-xs py-0.5" />
                            </div>
                        </div>
                    </header>

                    {/* タブナビゲーション */}
                    <nav className="bg-slate-900/90 border-b border-slate-800 px-2 py-1.5 flex gap-1 overflow-x-auto">
                        {[
                            { id: "DUAL_EDIT", label: "🎹 連打記録＆2画面編集" },
                            { id: "DRUM_SUBBASS_20", label: "🥁 ドラム&重低音" },
                            { id: "VOICE_STUDIO", label: "🎤 ボイス" },
                            { id: "MEMORY_LIST", label: "💾 リスト保存" },
                            { id: "JACKET", label: "💿 ジャケット" },
                        ].map(t => (
                            <button key={t.id} onClick={() => setTab(t.id)} className={`px-3 py-1 rounded text-center font-bold transition-all shrink-0 ${tab === t.id ? "bg-amber-500 text-slate-950 shadow" : "bg-slate-800/60 text-slate-400"}`}>
                                {t.label}
                            </button>
                        ))}
                    </nav>

                    <div className="bg-slate-900/50 px-3 py-1 text-[11px] text-cyan-400 border-b border-slate-900 truncate">
                        <span>💡 {status}</span>
                    </div>

                    <main className="p-2 flex flex-col gap-3">

                        {/* タブ1: 連打記録 ＆ 2画面編集 */}
                        {tab === "DUAL_EDIT" && (
                            <div className="flex flex-col gap-3">
                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-2.5 shadow">
                                    <div className="flex justify-between items-center flex-wrap gap-2">
                                        <span className="text-xs font-bold text-pink-400">① 楽器セレクト ＆ 🔥 連打記録モード</span>
                                        <div className="flex gap-2">
                                            <button
                                                onClick={() => setRapidRecordMode(!rapidRecordMode)}
                                                className={`px-3 py-1 rounded font-bold text-[10px] shadow border ${rapidRecordMode ? "bg-red-600 text-white border-white animate-pulse" : "bg-slate-800 text-red-400 border-red-800"}`}
                                            >
                                                {rapidRecordMode ? "🔴 連打記録ON" : "⚪ 連打記録OFF"}
                                            </button>
                                            <button onClick={() => clearSpecificInstrument(selectedInstrument)} className="px-2.5 py-1 bg-red-950 text-red-300 font-bold rounded text-[10px] border border-red-800">
                                                🗑️ 選択楽器Clear
                                            </button>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-3 sm:grid-cols-5 md:grid-cols-10 gap-1.5">
                                        {INSTRUMENTS.map(inst => (
                                            <button key={inst.id} onClick={() => setSelectedInstrument(inst.id)} className={`py-2 px-1 rounded-lg font-bold text-[11px] transition-all border flex items-center justify-center gap-1 shadow ${selectedInstrument === inst.id ? `bg-gradient-to-r ${inst.color} border-white text-white ring-2 ring-white/30` : "bg-slate-950 border-slate-800 text-slate-400"}`}>
                                                {inst.label}
                                            </button>
                                        ))}
                                    </div>

                                    {/* 鍵盤・連打パッド */}
                                    <div className="bg-slate-950 border border-slate-800 rounded p-2.5 flex flex-col gap-2">
                                        <div className="flex justify-between items-center">
                                            <span className="text-[11px] font-bold text-amber-400">🎹 鍵盤連打演奏＆即時記録エディタ</span>
                                            <span className="text-[10px] text-slate-400">ボタン連打でメロディをリアルタイム重ね録り！</span>
                                        </div>
                                        <div className="grid grid-cols-8 gap-1.5">
                                            {NOTES.map(note => (
                                                <button key={note} onClick={() => playAndRecordRapidNote(note)} className={`py-3 rounded font-bold flex flex-col items-center justify-center gap-0.5 border bg-slate-900 text-slate-200 border-slate-800 hover:bg-amber-600 hover:text-slate-950 active:scale-95 transition-all`}>
                                                    <span className="text-xs">{SOLFEGE[note]}</span>
                                                    <span className="text-[8px] text-slate-400">{note}</span>
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                {/* 連打ログ・編集リスト */}
                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-2">
                                    <div className="flex justify-between items-center">
                                        <span className="text-xs font-bold text-cyan-400">📝 連打記録ログ・編集 ({performanceLogs.length}件)</span>
                                        <button onClick={() => setPerformanceLogs([])} className="px-2 py-0.5 bg-red-950 text-red-300 text-[10px] rounded border border-red-800">全ログ削除</button>
                                    </div>
                                    <div className="max-h-28 overflow-y-auto bg-slate-950 p-2 rounded border border-slate-800 flex flex-col gap-1">
                                        {performanceLogs.length === 0 ? (
                                            <span className="text-[10px] text-slate-500">連打記録ONにして鍵盤を叩くとここにログが記録されます。</span>
                                        ) : (
                                            performanceLogs.map(log => (
                                                <div key={log.id} className="flex justify-between items-center bg-slate-900 px-2 py-1 rounded text-[10px]">
                                                    <span className="text-amber-300">楽器: <strong>{log.instrument}</strong> / 音: <strong>{log.note}</strong> / 小節: <strong>{log.bar}</strong></span>
                                                    <button onClick={() => deletePerformanceLog(log.id)} className="text-red-400 hover:text-red-300 font-bold">✕ 削除</button>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>

                                {/* ステップグリッド */}
                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3 shadow">
                                    <div className="flex items-center justify-between">
                                        <span className="text-xs font-bold text-cyan-400">② ステップグリッドエディタ ({currentInstObj.label})</span>
                                        <div className="flex gap-1">
                                            {Array.from({ length: BARS }).map((_, b) => (
                                                <button key={b} onClick={() => setCurrentBar(b)} className={`w-6 h-6 rounded-full text-[10px] font-bold ${currentBar === b ? "bg-amber-500 text-slate-950" : "bg-slate-800 text-slate-400"}`}>{b + 1}</button>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="overflow-x-auto bg-slate-950 p-3 rounded border border-slate-800">
                                        <div className="grid gap-1 min-w-[540px]" style={{ gridTemplateColumns: "repeat(16, minmax(0, 1fr))" }}>
                                            {Array.from({ length: BAR_STEPS }).map((_, i) => {
                                                const stepIdx = currentBar * BAR_STEPS + i;
                                                const stepVal = instrumentSteps[selectedInstrument][stepIdx];
                                                let isActive = selectedInstrument === "drums" ? (stepVal && stepVal[selectedDrumPart]) : !!stepVal;

                                                return (
                                                    <button key={i} onClick={() => toggleStep(selectedInstrument, stepIdx)} className={`aspect-[3/4] w-full rounded border flex flex-col items-center justify-center text-[9px] transition-all ${isActive ? "bg-gradient-to-t from-amber-600 to-pink-600 border-white text-white font-bold shadow-md shadow-pink-500/50" : "bg-slate-900 border-slate-800 text-slate-500"}`}>
                                                        <span className="font-bold text-[10px]">{i + 1}</span>
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* タブ2: ドラム&重低音 */}
                        {tab === "DRUM_SUBBASS_20" && (
                            <div className="flex flex-col gap-4">
                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3">
                                    <span className="text-xs font-bold text-red-400">🥁 ドラムパターン 20種一括切り替え</span>
                                    <div className="grid grid-cols-5 md:grid-cols-10 gap-1.5 max-h-[160px] overflow-y-auto p-1 bg-slate-950 rounded border border-slate-800">
                                        {Array.from({ length: 20 }).map((_, idx) => (
                                            <button key={idx + 1} onClick={() => applyDrumPattern20(idx + 1)} className={`py-2 rounded font-bold text-[10px] border ${selectedDrumPatternId === idx + 1 ? "bg-red-600 text-white border-white" : "bg-slate-900 text-slate-300 border-slate-800"}`}>
                                                No.{idx + 1}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3">
                                    <span className="text-xs font-bold text-amber-400">🔊 重低音ベースパターン 20種一括切り替え</span>
                                    <div className="grid grid-cols-5 md:grid-cols-10 gap-1.5 max-h-[160px] overflow-y-auto p-1 bg-slate-950 rounded border border-slate-800">
                                        {Array.from({ length: 20 }).map((_, idx) => (
                                            <button key={idx + 1} onClick={() => applySubBassPattern20(idx + 1)} className={`py-2 rounded font-bold text-[10px] border ${selectedSubBassPatternId === idx + 1 ? "bg-amber-600 text-slate-950 border-white" : "bg-slate-900 text-slate-300 border-slate-800"}`}>
                                                No.{idx + 1}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* タブ3: ボイス */}
                        {tab === "VOICE_STUDIO" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-4 flex flex-col gap-3">
                                <span className="text-xs font-bold text-rose-400">🎤 ボイス録音スタジオ</span>
                                <div className="bg-slate-950 p-4 rounded border border-slate-800 flex flex-col gap-3 items-center">
                                    <div className="flex gap-2">
                                        {!isVoiceRecording ? (
                                            <button onClick={startVoiceRecording} className="px-4 py-2 bg-red-600 text-white font-bold rounded text-xs animate-pulse">🔴 録音開始</button>
                                        ) : (
                                            <button onClick={stopVoiceRecording} className="px-4 py-2 bg-slate-200 text-slate-950 font-bold rounded text-xs">⏹️ 停止</button>
                                        )}
                                        {voiceAudioUrl && <button onClick={() => new Audio(voiceAudioUrl).play()} className="px-4 py-2 bg-cyan-600 text-white font-bold rounded text-xs">▶ 再生</button>}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* タブ4: メモリリスト */}
                        {tab === "MEMORY_LIST" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3">
                                <span className="text-xs font-bold text-emerald-400">💾 セッション保存・ロード</span>
                                <div className="flex gap-2">
                                    <input type="text" value={slotName} onChange={e => setSlotName(e.target.value)} className="bg-slate-900 px-2 py-1 rounded text-slate-100 flex-1 border border-slate-800" />
                                    <button onClick={saveCurrentSession} className="px-4 py-1 bg-emerald-600 text-white font-bold rounded">保存</button>
                                </div>
                                <div className="max-h-32 overflow-y-auto bg-slate-950 p-2 rounded border border-slate-800 flex flex-col gap-1">
                                    {Object.keys(savedSlots).map(name => (
                                        <div key={name} className="flex justify-between items-center bg-slate-900 p-2 rounded">
                                            <span className="text-cyan-400">{name}</span>
                                            <button onClick={() => loadSession(name)} className="px-2 py-1 bg-cyan-600 text-white rounded text-[10px]">ロード</button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* タブ5: ジャケット */}
                        {tab === "JACKET" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-4 flex flex-col gap-4 items-center">
                                <span className="text-xs font-bold text-cyan-400 self-start">💿 アルバムジャケット作成</span>
                                <div className={`w-64 aspect-square bg-gradient-to-br ${jacketColor} rounded-xl shadow-2xl p-6 flex flex-col justify-between items-center text-center border-4 border-white/20`}>
                                    <h2 className="text-lg font-black text-white">{jacketTitle}</h2>
                                    <span className="text-xs font-bold text-amber-300">{jacketGenre}</span>
                                </div>
                            </div>
                        )}

                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<MasterSynthApp />);
    </script>
</body>
</html>
