<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIC VICTORY - DLAND DTM v56.9 NON-LOOP POPIN SOUL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

</head>
<body class="bg-slate-950 text-slate-100 font-sans select-none pb-24 overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const ALBUM_20_MANIFEST = [
            { id: 1, title: "01 MIC VICTORY (Non-Loop OP)", bpm: 110, key: "Cminor", concept: "C0ファット持続＋小節進行型スケールシフトメロ" },
            { id: 2, title: "02 Velvet Non-Loop Cred", bpm: 106, key: "Fminor", concept: "オフビートスネア＋非反復タットパルス" },
            { id: 3, title: "03 Midnight Non-Loop Isolation", bpm: 98, key: "Ebmajor", concept: "ディープC0ベース＋スローウェーブ非ループ" },
            { id: 4, title: "04 Non-Loop Flashback 90s", bpm: 112, key: "Gminor", concept: "リッチコード変移＋ロック＆ストップ（高揚感）" },
            { id: 5, title: "05 Neon Non-Loop Velvet", bpm: 104, key: "Bbmajor", concept: "4on4温かみ重低音＋シフトレガート" },
            { id: 6, title: "06 Black Contempo Non-Loop", bpm: 108, key: "Bbmajor", concept: "4on4重低音ベース＋非反復スタッカート" },
            { id: 7, title: "07 DLAND Non-Loop Ground Zero", bpm: 114, key: "Cminor", concept: "C0サブスクリッピング極大＋胸・首ヒット" },
            { id: 8, title: "08 Young & Vibrant Non-Loop", bpm: 120, key: "F#minor", concept: "若々しいエスカレートパルスシンセ" },
            { id: 9, title: "09 Groove Theorem Non-Loop", bpm: 110, key: "Aminor", concept: "ファンク短音＋タット対応モジュラー" },
            { id: 10, title: "10 Crera Non-Loop Punch 3:50", bpm: 114, key: "Cminor", concept: "v56.9サチュレーションMAX＋非反復裏拍連打" },
            { id: 11, title: "11 Velvet & Steel Non-Loop", bpm: 104, key: "Dminor", concept: "ヴァイオリン変移短長スタッカート" },
            { id: 12, title: "12 Street Light Reflex Non-Loop", bpm: 112, key: "Gminor", concept: "スクエア波形非反復ループ金属ハリ" },
            { id: 13, title: "13 Soul Revival Non-Loop Velvet", bpm: 108, key: "Cminor", concept: "クラップ強調＋ファットサブベース変移" },
            { id: 14, title: "14 Pulse of Non-Loop Victory", bpm: 116, key: "Eminor", concept: "トランペットブラスシフトダイナミック" },
            { id: 15, title: "15 C0 Deep Non-Loop Meditation", bpm: 94, key: "Cminor", concept: "超重低音C0持続＋非ループアイソレーション" },
            { id: 16, title: "16 Urban Non-Loop Youth Energy", bpm: 120, key: "Aminor", concept: "明るいパルス＋非反復ジャンプコンボ" },
            { id: 17, title: "17 Silk & Subwoofer Non-Loop", bpm: 102, key: "Fminor", concept: "ピアノ微粒アタック変移" },
            { id: 18, title: "18 Final Countdown Non-Loop Pop", bpm: 124, key: "Cminor", concept: "全楽器一斉レイヤー・非反復クライマックス" },
            { id: 19, title: "19 Outro: Dland Non-Loop Horizon", bpm: 90, key: "Cminor", concept: "リバーブ減衰美＋C0残響フィナーレ" },
            { id: 20, title: "20 Bonus: Mic Victory (Non-Loop)", bpm: 114, key: "Cminor", concept: "C0サブベース＋フリースタイル対決非反復リミット" }
        ];

        function MasterSynthApp() {
            const [tab, setTab] = React.useState("ALBUM_20");
            const [playing, setPlaying] = React.useState(false);
            const [isRecording, setIsRecording] = React.useState(false);
            const [flashColor, setFlashColor] = React.useState("border-cyan-500");
            const [bpm, setBpm] = React.useState(112);
            const [currentBar, setCurrentBar] = React.useState(0);
            const [currentStep, setCurrentStep] = React.useState(-1);
            const [activeAlbumTrackId, setActiveAlbumTrackId] = React.useState(1);
            const [status, setStatus] = React.useState("🎤 v56.9 非ループ・ポッピン20曲システム統合完了！");

            const BARS = 8;
            const BAR_STEPS = 16;
            const TOTAL_STEPS = BARS * BAR_STEPS;

            const [selectedInstrument, setSelectedInstrument] = React.useState("synth");
            const [selectedNote, setSelectedNote] = React.useState("C4");
            const [selectedDuration, setSelectedDuration] = React.useState("16n");
            const [selectedDrumPart, setSelectedDrumPart] = React.useState("kick");

            const [recordedTakes, setRecordedTakes] = React.useState([]);
            const [activePatternIndex, setActivePatternIndex] = React.useState(1);

            const [rapLyrics, setRapLyrics] = React.useState("[Verse 1 - DLAND NON-LOOP POPIN]\nMIC VICTORY 反復ゼロのエスカレートフロウ\n走りすぎないソウル、裏拍のハリとタメ\nC0ファット持続、指先の16nランダムパルス\n最高級ポッピン同期（3分50秒非ループ仕様）");

            const [masterBassBoost, setMasterBassBoost] = React.useState(16);
            const [masterVolume, setMasterVolume] = React.useState(1.35);
            const [dlandMode, setDlandMode] = React.useState(true);
            const [screenSaverActive, setScreenSaverActive] = React.useState(false);
            const [slotName, setSlotName] = React.useState("MIC_VICTORY_NON_LOOP_POPIN_20");

            const INSTRUMENTS = [
                { id: "drums", label: "🥁 ドラム (20入)", color: "from-red-600 to-amber-600" },
                { id: "loopTrack", label: "🔁 ループ (20入)", color: "from-pink-600 to-rose-600" },
                { id: "subBass", label: "🔊 重低音ベース", color: "from-amber-600 to-orange-700" },
                { id: "bass", label: "🎸 ベース (20入)", color: "from-emerald-600 to-teal-600" },
                { id: "synth", label: "🎹 シンセ (20入)", color: "from-cyan-600 to-blue-700" },
                { id: "trumpet", label: "🎺 トランペット (20入)", color: "from-yellow-500 to-amber-600" },
                { id: "guitar", label: "🎸 エレキギター (20入)", color: "from-orange-600 to-red-700" },
                { id: "africa1", label: "🪘 ジャンベ (アフリカ)", color: "from-amber-700 to-yellow-800" },
                { id: "africa2", label: "🎹 カリンバ (アフリカ)", color: "from-yellow-600 to-amber-600" },
                { id: "piano", label: "🎹 ピアノ", color: "from-blue-600 to-indigo-600" },
                { id: "violin", label: "🎻 バイオリン", color: "from-amber-600 to-yellow-700" },
                { id: "flute", label: "🪈 フルート", color: "from-teal-500 to-cyan-600" },
            ];

            const [instrumentSteps, setInstrumentSteps] = React.useState({
                drums: new Array(TOTAL_STEPS).fill(null),
                loopTrack: new Array(TOTAL_STEPS).fill(null),
                subBass: new Array(TOTAL_STEPS).fill(null),
                bass: new Array(TOTAL_STEPS).fill(null),
                synth: new Array(TOTAL_STEPS).fill(null),
                trumpet: new Array(TOTAL_STEPS).fill(null),
                guitar: new Array(TOTAL_STEPS).fill(null),
                africa1: new Array(TOTAL_STEPS).fill(null),
                africa2: new Array(TOTAL_STEPS).fill(null),
                piano: new Array(TOTAL_STEPS).fill(null),
                violin: new Array(TOTAL_STEPS).fill(null),
                flute: new Array(TOTAL_STEPS).fill(null),
            });

            const [volumes, setVolumes] = React.useState({
                drums: 3, loopTrack: 0, subBass: 7, bass: 4, synth: 0, trumpet: 0, guitar: 0, africa1: 0, africa2: 0, piano: 0, violin: 0, flute: 0
            });

            const synthsRef = React.useRef(null);
            const loopRef = React.useRef(null);
            const masterGainRef = React.useRef(null);

            const NOTES = ["C4", "D4", "E4", "F4", "G4", "A4", "B4", "C5"];
            const SOLFEGE = { "C4": "ド", "D4": "レ", "E4": "ミ", "F4": "ファ", "G4": "ソ", "A4": "ラ", "B4": "シ", "C5": "ド" };
            const DURATION_OPTIONS = [
                { id: "16n", label: "極短ハリ (16分)" },
                { id: "8n", label: "標準 (8分)" },
                { id: "4n", label: "長めタメ (4分)" },
                { id: "2n", label: "超長レガート (2n)" },
            ];

            React.useEffect(() => {
                const masterGain = new Tone.Gain(masterVolume).toDestination();
                masterGainRef.current = masterGain;

                const eq = new Tone.EQ3({ low: masterBassBoost, lowFrequency: 160, mid: 2.2, high: 2.8 }).connect(masterGain);
                const reverb = new Tone.Reverb({ decay: 1.4, wet: 0.12 }).connect(eq);
                const delay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.22, wet: 0.1 }).connect(reverb);
                const distortion = new Tone.Distortion(0.08).connect(delay);

                const cGains = {};
                Object.keys(instrumentSteps).forEach(key => {
                    cGains[key] = new Tone.Gain(Tone.dbToGain(volumes[key] || 0)).connect(distortion);
                });

                synthsRef.current = {
                    subBass: new Tone.MonoSynth({
                        oscillator: { type: "sine" },
                        envelope: { attack: 0.005, decay: 0.35, sustain: 0.55, release: 0.18 },
                        filterEnvelope: { attack: 0.005, decay: 0.22, sustain: 0.35, release: 0.18, baseFrequency: 70, octaves: 1.6 }
                    }).connect(cGains.subBass),
                    bass: new Tone.MonoSynth({
                        oscillator: { type: "triangle" },
                        envelope: { attack: 0.01, decay: 0.28, sustain: 0.45, release: 0.15 }
                    }).connect(cGains.bass),
                    synth: new Tone.Synth({ oscillator: { type: "pulse", width: 0.4 }, envelope: { attack: 0.01, decay: 0.22, sustain: 0.35, release: 0.15 } }).connect(cGains.synth),
                    loopTrack: new Tone.Synth({ oscillator: { type: "square" }, envelope: { attack: 0.008, decay: 0.2, sustain: 0.3, release: 0.12 } }).connect(cGains.loopTrack),
                    guitar: new Tone.Synth({ oscillator: { type: "sawtooth" }, envelope: { attack: 0.005, decay: 0.2, sustain: 0.25, release: 0.1 } }).connect(cGains.guitar),
                    trumpet: new Tone.Synth({ oscillator: { type: "sawtooth6" }, envelope: { attack: 0.035, decay: 0.2, sustain: 0.6, release: 0.12 } }).connect(cGains.trumpet),
                    africa1: new Tone.MembraneSynth({ pitchDecay: 0.02, octaves: 4, oscillator: { type: "sine" }, envelope: { attack: 0.001, decay: 0.22, sustain: 0.01, release: 0.12 } }).connect(cGains.africa1),
                    africa2: new Tone.Synth({ oscillator: { type: "triangle" }, envelope: { attack: 0.001, decay: 0.18, sustain: 0.1, release: 0.15 } }).connect(cGains.africa2),
                    piano: new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.008, decay: 0.32, sustain: 0.3, release: 0.3 } }).connect(cGains.piano),
                    violin: new Tone.Synth({ oscillator: { type: "sawtooth" }, envelope: { attack: 0.06, decay: 0.22, sustain: 0.8, release: 0.3 } }).connect(cGains.violin),
                    flute: new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.045, decay: 0.22, sustain: 0.7, release: 0.25 } }).connect(cGains.flute),
                    drums: {
                        kick: new Tone.MembraneSynth({ pitchDecay: 0.06, octaves: 6, oscillator: { type: "sine" }, envelope: { attack: 0.0001, decay: 0.28, sustain: 0.01, release: 0.1 } }).connect(cGains.drums),
                        snare: new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.0001, decay: 0.16, sustain: 0 } }).connect(cGains.drums),
                        hihat: new Tone.MetalSynth({ frequency: 900, envelope: { attack: 0.0005, decay: 0.025, release: 0.01 }, harmonicity: 5.1, modulationIndex: 30, resonance: 7000, octaves: 1.4 }).connect(cGains.drums),
                        clap: new Tone.NoiseSynth({ noise: { type: "pink" }, envelope: { attack: 0.004, decay: 0.14, sustain: 0 } }).connect(cGains.drums),
                    },
                    eq, reverb, distortion
                };

                return () => { Tone.Transport.stop(); Tone.Transport.cancel(); };
            }, []);

            React.useEffect(() => {
                Tone.Transport.bpm.value = bpm;
                Tone.Transport.cancel();

                if (playing) {
                    let stepCounter = 0;
                    loopRef.current = new Tone.Loop(time => {
                        let step = stepCounter % TOTAL_STEPS;
                        const bar = Math.floor(step / BAR_STEPS);
                        const sInBar = step % BAR_STEPS;

                        setCurrentStep(sInBar);
                        setCurrentBar(bar);

                        if (dlandMode && sInBar === 0) {
                            const colors = ["border-cyan-500", "border-pink-500", "border-amber-500", "border-purple-500", "border-emerald-500"];
                            setFlashColor(colors[Math.floor(Math.random() * colors.length)]);
                        }

                        const syns = synthsRef.current;
                        if (!syns) return;

                        Object.keys(instrumentSteps).forEach(instKey => {
                            const item = instrumentSteps[instKey][step];
                            if (!item) return;

                            const note = typeof item === "object" ? item.note : item;
                            const dur = typeof item === "object" ? (item.dur || "16n") : "16n";

                            if (instKey === "drums") {
                                if (typeof item === "object") {
                                    if (item.kick) syns.drums.kick.triggerAttackRelease(item.subBoost ? "C0" : "C1", "16n", time);
                                    if (item.snare) syns.drums.snare.triggerAttackRelease("16n", time);
                                    if (item.hihat) syns.drums.hihat.triggerAttackRelease("32n", time, 0.85);
                                    if (item.clap) syns.drums.clap.triggerAttackRelease("16n", time);
                                }
                            } else if (instKey === "subBass") {
                                syns.subBass.triggerAttackRelease(item.subBoost ? "C0" : "C1", dur, time);
                            } else if (syns[instKey]) {
                                syns[instKey].triggerAttackRelease(note || "C4", dur, time);
                            }
                        });

                        stepCounter++;
                    }, "16n").start(0);

                    Tone.Transport.start();
                } else {
                    Tone.Transport.stop();
                }
            }, [playing, bpm, instrumentSteps, dlandMode]);

            const togglePlay = async () => {
                await Tone.start();
                setPlaying(!playing);
                setStatus(playing ? "停止しました" : `▶ 再生中 (BPM: ${bpm})`);
            };

            const toggleRecord = async () => {
                await Tone.start();
                setIsRecording(!isRecording);
                setStatus(!isRecording ? "🔴 全体リアルタイム・非ループ録音中..." : "⏹️ 記録をセーブしました");
                if (isRecording) {
                    setRecordedTakes(prev => [...prev, { id: Date.now(), title: `POPIN非ループテイク ${prev.length + 1}`, bpm, date: new Date().toLocaleTimeString() }]);
                }
            };

            // メロディ非リピート型・ポッピンダンス20曲展開ロジックの完全統合ローダー
            const applyNonRepeatingPoppinTrack = (track) => {
                setActiveAlbumTrackId(track.id);
                setBpm(track.bpm);

                const newDrums = new Array(TOTAL_STEPS).fill(null);
                const newSub = new Array(TOTAL_STEPS).fill(null);
                const newSynth = new Array(TOTAL_STEPS).fill(null);

                const baseOffsets = ["C4", "D#4", "F4", "G#4", "A#4", "D5"];

                for (let i = 0; i < TOTAL_STEPS; i++) {
                    const barIndex = Math.floor(i / BAR_STEPS);
                    const stepInBar = i % BAR_STEPS;

                    const isHitBeat = (stepInBar === 4 || stepInBar === 12 || stepInBar === 14);
                    const isKick = (stepInBar === 0 || stepInBar === 10) && (barIndex % 2 === 0 || stepInBar === 0);
                    const isSnare = (stepInBar === 4 || stepInBar === 12);
                    const isHihat = (stepInBar % 2 === 1);

                    newDrums[i] = {
                        kick: isKick,
                        snare: isSnare,
                        hihat: isHihat,
                        clap: isSnare && (barIndex >= 4),
                        subBoost: isHitBeat
                    };

                    if (stepInBar === 0) {
                        newSub[i] = { note: "C0", dur: "8n", subBoost: true };
                    } else if (stepInBar === 14 && barIndex % 2 === 1) {
                        newSub[i] = { note: "C0", dur: "16n", subBoost: true };
                    }

                    if (isHitBeat || (stepInBar % 4 === 2 && barIndex !== 3)) {
                        const pitchShiftIdx = (barIndex + stepInBar + track.id) % baseOffsets.length;
                        newSynth[i] = {
                            note: baseOffsets[pitchShiftIdx],
                            dur: "16n"
                        };
                    }
                }

                setInstrumentSteps(prev => ({
                    ...prev,
                    drums: newDrums,
                    subBass: newSub,
                    synth: newSynth
                }));
                setStatus(`🎤 Non-Loop Popin TR #${track.id.toString().padStart(2, '0')} [${track.title}] 非反復シフト反映！`);
            };

            const applyHeavySubManualAi = (instKey, modeType) => {
                const newArr = new Array(TOTAL_STEPS).fill(null);
                for (let i = 0; i < TOTAL_STEPS; i++) {
                    const isBeat = modeType === 'roll' ? (i % 2 === 0) : (i % 4 === 0 || i % 16 === 10);
                    if (isBeat) {
                        newArr[i] = { note: "C0", dur: modeType === 'roll' ? "16n" : "4n", subBoost: true };
                    }
                }
                setInstrumentSteps(prev => ({ ...prev, [instKey]: newArr }));
                setStatus(`🔊 【${instKey}】C0超重低音ソウルAI #${modeType} 反映！`);
            };

            const applyHeavyDrumManualAi = (modeName) => {
                const newArr = new Array(TOTAL_STEPS).fill(null);
                for (let i = 0; i < TOTAL_STEPS; i++) {
                    const isKick = modeName === 'heavy_roll' ? (i % 2 === 0) : (i % 4 === 0 || i % 16 === 10);
                    const isSnare = i % 8 === 4 || i % 32 === 28;
                    const isHihat = i % 2 === 0;
                    const isClap = i % 8 === 4;
                    newArr[i] = { kick: isKick, snare: isSnare, hihat: isHihat, clap: isClap, subBoost: true };
                }
                setInstrumentSteps(prev => ({ ...prev, drums: newArr }));
                setStatus(`🥁 ドラムC0ファットソウル連打AI [${modeName}] 反映完了！`);
            };

            const generateViolinAiMelody = (variant) => {
                const scales = ["D4", "E4", "F#4", "G4", "A4", "B4", "C#5", "D5"];
                const newArr = new Array(TOTAL_STEPS).fill(null);
                for (let i = 0; i < TOTAL_STEPS; i++) {
                    if (Math.random() < (variant === 'staccato_heavy' ? 0.65 : 0.5)) {
                        const note = scales[Math.floor(Math.random() * scales.length)];
                        const dur = variant === 'staccato_heavy' ? "16n" : "8n";
                        newArr[i] = { note, dur };
                    }
                }
                setInstrumentSteps(prev => ({ ...prev, violin: newArr }));
                setStatus(`🎻 ヴァイオリン・ソウル短長音切り替え [${variant}] 完了！`);
            };

            const generateAiPattern20 = (instKey, patternNum) => {
                const newArr = new Array(TOTAL_STEPS).fill(null);
                const soulScales = ["C4", "Eb4", "G4", "Bb4", "D5", "Eb5"];
                const scale = soulScales;

                for (let i = 0; i < TOTAL_STEPS; i++) {
                    if (instKey === "drums") {
                        const isKick = i % 4 === 0 || i % 16 === 10;
                        const isSnare = i % 8 === 4 || i % 32 === 28;
                        const isHihat = i % 2 === 0;
                        const isClap = i % 8 === 4;
                        newArr[i] = { kick: isKick, snare: isSnare, hihat: isHihat, clap: isClap, subBoost: true };
                    } else if (instKey === "subBass") {
                        if (i % 4 === 0) {
                            newArr[i] = { note: "C0", dur: "4n", subBoost: true };
                        }
                    } else {
                        if (i % 2 === 0 || Math.random() < 0.4) {
                            const noteIdx = (i * 5 + patternNum) % scale.length;
                            const dur = (patternNum % 2 === 0 && i % 4 === 2) ? "16n" : selectedDuration;
                            newArr[i] = { note: scale[noteIdx], dur };
                        }
                    }
                }

                setInstrumentSteps(prev => ({ ...prev, [instKey]: newArr }));
                setActivePatternIndex(patternNum);
                setStatus(`🤖 ブラックコンテムソウル AIパターン #${patternNum} 生成完了！`);
            };

            const playNoteKeyboard = (note) => {
                setSelectedNote(note);
                const syns = synthsRef.current;
                if (!syns) return;

                if (selectedInstrument === "drums") {
                    if (selectedDrumPart === "kick") syns.drums.kick.triggerAttackRelease("C0", selectedDuration);
                    else if (selectedDrumPart === "snare") syns.drums.snare.triggerAttackRelease(selectedDuration);
                    else if (selectedDrumPart === "hihat") syns.drums.hihat.triggerAttackRelease("32n");
                    else syns.drums.clap.triggerAttackRelease(selectedDuration);
                } else if (selectedInstrument === "subBass") {
                    syns.subBass.triggerAttackRelease("C0", selectedDuration);
                } else if (syns[selectedInstrument]) {
                    syns[selectedInstrument].triggerAttackRelease(note, selectedDuration);
                }

                if (currentStep !== -1) {
                    const stepIdx = currentBar * BAR_STEPS + currentStep;
                    toggleStepWithDuration(selectedInstrument, stepIdx, note, selectedDuration);
                }
            };

            const toggleStepWithDuration = (instKey, idx, note = selectedNote, dur = selectedDuration) => {
                setInstrumentSteps(prev => {
                    const currentArr = [...prev[instKey]];
                    if (instKey === "drums") {
                        const currentObj = currentArr[idx] || { kick: false, snare: false, hihat: false, clap: false };
                        const updatedObj = { ...currentObj, [selectedDrumPart]: !currentObj[selectedDrumPart] };
                        const hasAny = Object.values(updatedObj).some(Boolean);
                        currentArr[idx] = hasAny ? updatedObj : null;
                    } else {
                        currentArr[idx] = currentArr[idx] ? null : { note, dur, subBoost: instKey === "subBass" };
                    }
                    return { ...prev, [instKey]: currentArr };
                });
            };

            const clearSpecificInstrument = (instKey) => {
                setInstrumentSteps(prev => ({ ...prev, [instKey]: new Array(TOTAL_STEPS).fill(null) }));
                setStatus(`🗑️ 【${instKey}】をクリアしました。`);
            };

            const exportProjectToFile = () => {
                const projectData = { title: slotName, bpm, instrumentSteps, volumes, albumManifest: ALBUM_20_MANIFEST, date: new Date().toISOString() };
                const blob = new Blob([JSON.stringify(projectData, null, 2)], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `${slotName}.json`;
                a.click();
                URL.revokeObjectURL(url);
                setStatus(`💾 非ループポッピン20曲プロジェクト保存完了`);
            };

            const importProjectFromFile = (event) => {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (data.instrumentSteps) {
                            setInstrumentSteps(data.instrumentSteps);
                            if (data.bpm) setBpm(data.bpm);
                            setStatus(`📂 ファイル読込成功`);
                        }
                    } catch (err) {
                        setStatus("❌ 読込エラー");
                    }
                };
                reader.readAsText(file);
            };

            return (
                <div className={`min-h-screen bg-slate-950 text-slate-100 flex flex-col text-xs font-sans select-none pb-24 overflow-x-hidden border-8 transition-colors duration-300 ${flashColor}`}>
                    {screenSaverActive && (
                        <div onClick={() => setScreenSaverActive(false)} className="fixed inset-0 z-50 bg-slate-950/95 flex flex-col items-center justify-center p-6 cursor-pointer backdrop-blur-md">
                            <div className="absolute top-4 right-4 text-cyan-400 font-bold text-sm animate-pulse">
                                [ 画面タッチまたはクリックで通常画面へ戻る ]
                            </div>
                            <div className="text-center mb-8">
                                <h1 className="text-2xl font-black bg-gradient-to-r from-amber-400 via-pink-400 to-cyan-400 bg-clip-text text-transparent animate-bounce">
                                    NON-LOOP POPIN VISUALIZER
                                </h1>
                                <p className="text-slate-400 text-xs mt-1">BPM: {bpm} | ステップ: {currentStep + 1} | 3分50秒非ループ演出</p>
                            </div>
                            <div className="flex items-end gap-1.5 h-64 w-full max-w-xl bg-slate-900/80 p-4 rounded-xl border border-slate-800 shadow-2xl">
                                {Array.from({ length: 16 }).map((_, idx) => {
                                    const activeHeight = playing ? Math.floor(Math.sin((idx + currentStep) * 0.5) * 45 + 55) : 10;
                                    return (
                                        <div key={idx} className="flex-1 bg-gradient-to-t from-red-600 via-amber-500 to-cyan-400 rounded-t transition-all duration-100" style={{ height: `${activeHeight}%` }}></div>
                                    );
                                })}
                            </div>
                        </div>
                    )}

                    <header className="bg-slate-900 border-b border-slate-800 px-3 py-2 flex items-center justify-between gap-2 sticky top-0 z-40 shadow-lg">
                        <div className="flex items-center gap-2">
                            <span className="font-black text-sm bg-gradient-to-r from-amber-400 via-pink-400 to-cyan-400 bg-clip-text text-transparent">
                                MIC VICTORY <span className="text-[10px] text-pink-400 font-bold">v56.9 Non-Loop Popin</span>
                            </span>
                        </div>
                        <div className="flex items-center gap-1.5 flex-wrap">
                            <button onClick={() => setScreenSaverActive(true)} className="px-2.5 py-1 bg-cyan-900 border border-cyan-700 text-cyan-200 font-bold rounded text-[10px] shadow">
                                📺 セーバー
                            </button>
                            <button onClick={togglePlay} className={`px-3 py-1 rounded font-bold text-xs shadow ${playing ? "bg-amber-400 text-slate-950 animate-bounce" : "bg-pink-600 text-white"}`}>
                                {playing ? "■ 停止" : "▶ 再生"}
                            </button>
                            <button onClick={toggleRecord} className={`px-3 py-1 rounded font-bold text-xs shadow ${isRecording ? "bg-red-600 text-white animate-pulse" : "bg-slate-800 text-red-400 border border-red-800"}`}>
                                {isRecording ? "🔴 全体録音中" : "⏺️ 全体記録ソウル"}
                            </button>
                            <div className="flex items-center gap-1 bg-slate-950 px-2 py-0.5 rounded border border-slate-800">
                                <span className="text-[9px] text-slate-400">BPM</span>
                                <input type="number" value={bpm} onChange={e => setBpm(Math.max(60, Math.min(220, Number(e.target.value))))} className="w-12 bg-slate-900 text-center font-bold text-pink-400 rounded text-xs py-0.5" />
                            </div>
                        </div>
                    </header>

                    <nav className="bg-slate-900/90 border-b border-slate-800 px-2 py-1.5 flex gap-1 overflow-x-auto">
                        {[
                            { id: "ALBUM_20", label: "💿 20曲アルバム(非ループ)" },
                            { id: "DUAL_EDIT", label: "🎛️ 鍵盤 & ソウル低音" },
                            { id: "RAP_AI", label: "🎤 ラップAI & 🎻 ヴァイオリン" },
                            { id: "MASTER_EQ", label: "🔊 艶低域EQ 16dB" },
                            { id: "MIXER", label: "🎚️ ミキサー" },
                            { id: "RECORDINGS", label: "📁 全体記録" },
                            { id: "MEMORY", label: "💾 保存・読込" },
                        ].map(t => (
                            <button key={t.id} onClick={() => setTab(t.id)} className={`px-3 py-1 rounded text-center font-bold transition-all shrink-0 ${tab === t.id ? "bg-amber-500 text-slate-950 shadow" : "bg-slate-800/60 text-slate-400"}`}>
                                {t.label}
                            </button>
                        ))}
                    </nav>

                    <div className="bg-slate-900/50 px-3 py-1 text-[11px] text-cyan-400 border-b border-slate-900 truncate flex justify-between items-center">
                        <span>🎤 {status} | 反復ゼロ・小節エスカレート進行</span>
                        {playing && (
                            <div className="flex items-center gap-1">
                                <span className="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
                                <span className="text-[10px] text-cyan-300 font-mono">STEP: {currentStep + 1}</span>
                            </div>
                        )}
                    </div>

                    <main className="p-2 flex flex-col gap-3">
                        {tab === "ALBUM_20" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3 shadow">
                                <div className="flex justify-between items-center">
                                    <span className="text-xs font-bold text-amber-400">💿 20曲非ループ・ポッピンアルバム一覧（全曲スケールシフト展開）</span>
                                    <span className="text-[10px] text-pink-400 font-bold">Active: TR#{activeAlbumTrackId.toString().padStart(2, '0')}</span>
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-2 max-h-[480px] overflow-y-auto pr-1">
                                    {ALBUM_20_MANIFEST.map(tr => (
                                        <div key={tr.id} onClick={() => applyNonRepeatingPoppinTrack(tr)} className={`p-2.5 rounded-lg border cursor-pointer transition-all flex flex-col gap-1 ${activeAlbumTrackId === tr.id ? "bg-gradient-to-r from-amber-600/40 to-pink-600/40 border-amber-400 shadow-md" : "bg-slate-950 border-slate-800 hover:border-slate-700"}`}>
                                            <div className="flex justify-between items-center">
                                                <span className="text-[11px] font-black text-amber-300">TR #{tr.id.toString().padStart(2, '0')}</span>
                                                <span className="text-[10px] font-bold text-cyan-400 bg-slate-900 px-1.5 py-0.5 rounded">{tr.bpm} BPM</span>
                                            </div>
                                            <div className="text-[11px] font-bold text-slate-100 truncate">{tr.title}</div>
                                            <div className="text-[10px] text-slate-400 line-clamp-1">{tr.concept}</div>
                                            <div className="text-[9px] text-pink-300 font-mono">Non-Loop Shift/16n</div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {tab === "DUAL_EDIT" && (
                            <div className="flex flex-col gap-3">
                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-2.5 shadow">
                                    <div className="flex justify-between items-center">
                                        <span className="text-xs font-bold text-pink-400">① 楽器選択 & ソウル拡張パネル</span>
                                        <button onClick={() => clearSpecificInstrument(selectedInstrument)} className="px-2.5 py-1 bg-red-950 text-red-300 font-bold rounded text-[10px]">クリア</button>
                                    </div>
                                    <div className="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 gap-1.5">
                                        {INSTRUMENTS.map(inst => (
                                            <button key={inst.id} onClick={() => setSelectedInstrument(inst.id)} className={`py-2 px-1 rounded-lg font-bold text-[11px] border flex items-center justify-center gap-1 shadow ${selectedInstrument === inst.id ? `bg-gradient-to-r ${inst.color} border-white text-white` : "bg-slate-950 border-slate-800 text-slate-400"}`}>
                                                {inst.label}
                                            </button>
                                        ))}
                                    </div>

                                    <div className="bg-amber-950/40 p-2 rounded border border-amber-800/60 flex flex-wrap gap-2 items-center justify-between">
                                        <span className="text-[10px] font-bold text-amber-300">⚡ [{selectedInstrument}] 専用重低音C0ソウルAI連打:</span>
                                        <div className="flex gap-1.5 flex-wrap">
                                            {(selectedInstrument === "synth" || selectedInstrument === "bass" || selectedInstrument === "subBass") && (
                                                <>
                                                    <button onClick={() => applyHeavySubManualAi(selectedInstrument, 'heavy')} className="px-2.5 py-1 bg-amber-600 text-slate-950 font-bold rounded text-[10px]">C0ファット持続AI</button>
                                                    <button onClick={() => applyHeavySubManualAi(selectedInstrument, 'roll')} className="px-2.5 py-1 bg-pink-600 text-white font-bold rounded text-[10px]">C0裏拍タットAI</button>
                                                </>
                                            )}
                                            {selectedInstrument === "drums" && (
                                                <>
                                                    <button onClick={() => applyHeavyDrumManualAi('heavy_beat')} className="px-2.5 py-1 bg-red-600 text-white font-bold rounded text-[10px]">ソウル艶キックAI</button>
                                                    <button onClick={() => applyHeavyDrumManualAi('heavy_roll')} className="px-2.5 py-1 bg-amber-500 text-slate-950 font-bold rounded text-[10px]">裏拍タイトドラムAI</button>
                                                </>
                                            )}
                                            {selectedInstrument === "violin" && (
                                                <>
                                                    <button onClick={() => generateViolinAiMelody('staccato_heavy')} className="px-2.5 py-1 bg-amber-500 text-slate-950 font-bold rounded text-[10px]">短長音スタッカートAI</button>
                                                    <button onClick={() => generateViolinAiMelody('legato_blend')} className="px-2.5 py-1 bg-cyan-600 text-white font-bold rounded text-[10px]">ロングレガート推測AI</button>
                                                </>
                                            )}
                                        </div>
                                    </div>

                                    <div className="bg-slate-950 p-2.5 rounded border border-slate-800 flex flex-col gap-1.5 mt-1">
                                        <span className="text-[11px] font-bold text-amber-400">🤖 AI パターン一括生成 (20種類・ソウル高密度)</span>
                                        <div className="grid grid-cols-5 sm:grid-cols-10 gap-1">
                                            {Array.from({ length: 20 }).map((_, idx) => {
                                                const pNum = idx + 1;
                                                return (
                                                    <button key={pNum} onClick={() => generateAiPattern20(selectedInstrument, pNum)} className={`py-1.5 rounded text-[10px] font-bold border ${activePatternIndex === pNum ? "bg-amber-500 text-slate-950 border-white" : "bg-slate-900 text-slate-300 border-slate-800"}`}>
                                                        #{pNum}
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3 shadow">
                                    <div className="flex justify-between items-center flex-wrap gap-2">
                                        <span className="text-xs font-bold text-cyan-400">② 鍵盤 & 音の長さ（短ハリ・長タメ）調整機能</span>
                                        <div className="flex items-center gap-1 bg-slate-950 px-2 py-1 rounded border border-slate-800">
                                            <span className="text-[10px] text-amber-400 font-bold">音長:</span>
                                            {DURATION_OPTIONS.map(d => (
                                                <button key={d.id} onClick={() => setSelectedDuration(d.id)} className={`px-2 py-0.5 rounded text-[10px] font-bold ${selectedDuration === d.id ? "bg-amber-500 text-slate-950" : "bg-slate-900 text-slate-400"}`}>
                                                    {d.label.split(" ")[0]}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {selectedInstrument === "drums" && (
                                        <div className="flex items-center gap-2 bg-slate-950 p-2 rounded border border-slate-800">
                                            <span className="text-[10px] font-bold text-red-400">ドラム打楽器切替:</span>
                                            {["kick", "snare", "hihat", "clap"].map(part => (
                                                <button key={part} onClick={() => setSelectedDrumPart(part)} className={`px-2.5 py-1 rounded text-[10px] font-bold ${selectedDrumPart === part ? "bg-red-600 text-white" : "bg-slate-900 text-slate-400"}`}>
                                                    {part.toUpperCase()}
                                                </button>
                                            ))}
                                        </div>
                                    )}

                                    <div className="grid grid-cols-8 gap-1.5">
                                        {NOTES.map(note => (
                                            <button key={note} onClick={() => playNoteKeyboard(note)} className={`py-4 rounded font-bold text-center border shadow transition-all active:scale-95 ${selectedNote === note ? "bg-amber-500 text-slate-950 border-white ring-2 ring-amber-400" : "bg-slate-950 text-slate-100 border-slate-800 hover:bg-slate-900"}`}>
                                                <div className="text-sm font-black">{SOLFEGE[note]}</div>
                                                <div className="text-[9px] opacity-70">{note}</div>
                                            </button>
                                        ))}
                                    </div>

                                    <div className="flex items-center justify-between bg-slate-950 p-2 rounded border border-slate-800">
                                        <span className="text-[11px] text-slate-300">小節選択: <strong className="text-pink-400">{currentBar + 1} / 8</strong></span>
                                        <div className="flex gap-1">
                                            {Array.from({ length: BARS }).map((_, b) => (
                                                <button key={b} onClick={() => setCurrentBar(b)} className={`w-6 h-6 rounded-full text-xs font-bold ${currentBar === b ? "bg-amber-500 text-slate-950" : "bg-slate-800 text-slate-400"}`}>{b + 1}</button>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="overflow-x-auto bg-slate-950 p-2 rounded border border-slate-800">
                                        <div className="grid gap-1 min-w-[500px]" style={{ gridTemplateColumns: "repeat(16, minmax(0, 1fr))" }}>
                                            {Array.from({ length: BAR_STEPS }).map((_, i) => {
                                                const stepIdx = currentBar * BAR_STEPS + i;
                                                const stepVal = instrumentSteps[selectedInstrument][stepIdx];
                                                const isCurrentPlay = playing && currentStep === i;
                                                let isActive = selectedInstrument === "drums" ? (stepVal && stepVal[selectedDrumPart]) : !!stepVal;

                                                return (
                                                    <button key={i} onClick={() => toggleStepWithDuration(selectedInstrument, stepIdx)} className={`aspect-[3/4] w-full rounded border flex flex-col items-center justify-center text-[9px] ${isActive ? "bg-gradient-to-t from-red-600 to-amber-500 border-white text-white font-bold" : "bg-slate-900 border-slate-800 text-slate-500"} ${isCurrentPlay ? "ring-2 ring-cyan-400" : ""}`}>
                                                        <span>{i + 1}</span>
                                                        {stepVal && typeof stepVal === "object" && stepVal.dur && (
                                                            <span className="text-[7px] text-yellow-200">{stepVal.dur}</span>
                                                        )}
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {tab === "RAP_AI" && (
                            <div className="flex flex-col gap-3">
                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-4 flex flex-col gap-3">
                                    <span className="text-xs font-bold text-pink-400">🎤 ラップ歌詞作成</span>
                                    <textarea value={rapLyrics} onChange={e => setRapLyrics(e.target.value)} rows="4" className="bg-slate-900 text-slate-100 p-2.5 rounded text-xs border border-slate-800 font-mono" />
                                </div>
                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-4 flex flex-col gap-3">
                                    <span className="text-xs font-bold text-amber-400">🎻 ヴァイオリン専用：短長音メロディ推測・ランダム切り替え</span>
                                    <div className="flex gap-2">
                                        <button onClick={() => generateViolinAiMelody('staccato_heavy')} className="px-3 py-2 bg-amber-500 text-slate-950 font-bold rounded text-xs flex-1">短音スタッカート重視</button>
                                        <button onClick={() => generateViolinAiMelody('legato_blend')} className="px-3 py-2 bg-cyan-600 text-white font-bold rounded text-xs flex-1">長音トレモロレガート推測</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {tab === "MASTER_EQ" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-4 flex flex-col gap-3">
                                <span className="text-xs font-bold text-amber-400">🔊 重低音・艶消し低域EQリリース音響調整 (推薦: 16dB)</span>
                                <div className="flex flex-col gap-3 bg-slate-950 p-3 rounded border border-slate-800">
                                    <div className="flex flex-col gap-1">
                                        <span className="text-[11px] text-amber-400">低域ブースト (160Hz土台): {masterBassBoost} dB</span>
                                        <input type="range" min="0" max="24" step="1" value={masterBassBoost} onChange={e => {
                                            const val = Number(e.target.value);
                                            setMasterBassBoost(val);
                                            if (synthsRef.current && synthsRef.current.eq) synthsRef.current.eq.low.value = val;
                                        }} className="accent-amber-500" />
                                    </div>
                                    <div className="flex flex-col gap-1">
                                        <span className="text-[11px] text-cyan-400">マスター総合ボリューム: {Math.round(masterVolume * 100)}%</span>
                                        <input type="range" min="0.5" max="2.0" step="0.1" value={masterVolume} onChange={e => {
                                            const val = Number(e.target.value);
                                            setMasterVolume(val);
                                            if (masterGainRef.current) masterGainRef.current.gain.value = val;
                                        }} className="accent-cyan-500" />
                                    </div>
                                </div>
                            </div>
                        )}

                        {tab === "MIXER" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-4 flex flex-col gap-3">
                                <span className="text-xs font-bold text-amber-400">🎚️ ミキサー</span>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 bg-slate-950 p-3 rounded border border-slate-800">
                                    {INSTRUMENTS.map(inst => (
                                        <div key={inst.id} className="flex items-center justify-between bg-slate-900 p-2 rounded border border-slate-800">
                                            <span className="text-[11px] text-slate-200">{inst.label}</span>
                                            <input type="range" min="-30" max="6" step="1" value={volumes[inst.id]} onChange={e => setVolumes({ ...volumes, [inst.id]: Number(e.target.value) })} className="w-24 accent-amber-500" />
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {tab === "RECORDINGS" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-4 flex flex-col gap-3">
                                <span className="text-xs font-bold text-pink-400">📁 全体記録リスト (非ループテイク)</span>
                                <div className="bg-slate-950 p-3 rounded border border-slate-800 flex flex-col gap-2 max-h-[220px] overflow-y-auto">
                                    {recordedTakes.length === 0 ? <span className="text-[10px] text-slate-500">全体記録なし</span> : recordedTakes.map(t => (
                                        <div key={t.id} className="flex justify-between items-center bg-slate-900 p-2 rounded border border-slate-800">
                                            <span className="text-cyan-400 text-xs">{t.title} ({t.date})</span>
                                            <button onClick={() => setRecordedTakes(recordedTakes.filter(x => x.id !== t.id))} className="px-2 py-1 bg-red-900 text-white rounded text-[10px]">削除</button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {tab === "MEMORY" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3">
                                <span className="text-xs font-bold text-emerald-400">💾 ファイル保存・読込</span>
                                <div className="flex gap-2 bg-slate-950 p-3 rounded border border-slate-800">
                                    <input type="text" value={slotName} onChange={e => setSlotName(e.target.value)} className="bg-slate-900 px-2 py-1 rounded text-slate-100 flex-1 border border-slate-800 font-bold text-xs" />
                                    <button onClick={exportProjectToFile} className="px-3 py-1 bg-emerald-600 text-white font-bold rounded text-xs">保存</button>
                                </div>
                                <input type="file" accept=".json" onChange={importProjectFromFile} className="text-[10px] text-slate-400" />
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<MasterSynthApp />);
    </script>
</body>
</html>
