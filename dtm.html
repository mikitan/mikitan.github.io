<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RHYTHM FORGE - PRO DAW v4.8</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        /* ヘッダー */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: #111827;
            border-bottom: 1px solid #1f2937;
        }
        .logo {
            font-size: 1.2rem;
            font-weight: bold;
            background: linear-gradient(90deg, #38bdf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .version {
            font-size: 0.7rem;
            background: #1e3a8a;
            color: #93c5fd;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 8px;
        }
        .top-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .btn-stop {
            background: #f97316;
            color: #fff;
            border: none;
            padding: 5px 12px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        .bpm-box {
            background: #1e293b;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.9rem;
        }
        .btn-ai-top {
            background: #0ea5e9;
            color: #fff;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
        }

        /* 小節バー */
        .bar-container {
            display: flex;
            align-items: center;
            padding: 8px 10px;
            background: #0f172a;
            border-bottom: 1px solid #1e293b;
            overflow-x: auto;
        }
        .bar-label {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-right: 10px;
            white-space: nowrap;
        }
        .bars {
            display: flex;
            gap: 4px;
        }
        .bar-num {
            background: #1e293b;
            color: #cbd5e1;
            font-size: 0.75rem;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }
        .bar-num.active {
            background: #06b6d4;
            color: #fff;
        }

        /* トラックエリア */
        .track-list {
            flex: 1;
            overflow-y: auto;
            padding: 5px;
        }
        .track-row {
            display: flex;
            align-items: center;
            margin-bottom: 4px;
            background: #111827;
            border-radius: 4px;
            padding: 4px;
        }
        .track-btn {
            background: #1e293b;
            color: #e2e8f0;
            border: none;
            padding: 6px 8px;
            border-radius: 3px;
            font-size: 0.7rem;
            width: 110px;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
        }
        .track-timeline {
            flex: 1;
            height: 24px;
            background: #0f172a;
            margin-left: 6px;
            border-radius: 3px;
            border: 1px solid #1e293b;
            position: relative;
        }
        .track-timeline.selected {
            border-color: #ec4899;
        }

        /* 下部フッターコントロール */
        footer {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 4px;
            padding: 8px;
            background: #0f172a;
            border-top: 1px solid #1e293b;
        }
        .footer-btn {
            background: #1e293b;
            color: #cbd5e1;
            border: none;
            padding: 8px 2px;
            border-radius: 4px;
            font-size: 0.65rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            cursor: pointer;
        }
        .footer-btn:hover {
            background: #334155;
        }
    </style>
</head>
<body>

    <header>
        <div style="display: flex; align-items: center;">
            <span class="logo">RHYTHM FORGE</span>
            <span class="version">PRO DAW v4.8</span>
        </div>
        <div class="top-controls">
            <button class="btn-stop">停止</button>
            <div class="bpm-box">BPM 110</div>
            <button class="btn-ai-top">AI</button>
        </div>
    </header>

    <div class="bar-container">
        <div class="bar-label">小節<br>(BAR):</div>
        <div class="bars">
            <div class="bar-num">1</div>
            <div class="bar-num">2</div>
            <div class="bar-num">3</div>
            <div class="bar-num">4</div>
            <div class="bar-num">5</div>
            <div class="bar-num">6</div>
            <div class="bar-num">7</div>
            <div class="bar-num">8</div>
            <div class="bar-num">9</div>
            <div class="bar-num">10</div>
            <div class="bar-num">11</div>
            <div class="bar-num">12</div>
            <div class="bar-num">13</div>
            <div class="bar-num">14</div>
            <div class="bar-num">15</div>
            <div class="bar-num">16</div>
            <div class="bar-num active">17</div>
        </div>
    </div>

    <div class="track-list">
        <div class="track-row"><button class="track-btn">KICK</button><div class="track-timeline selected"></div></div>
        <div class="track-row"><button class="track-btn">SNARE</button><div class="track-timeline"></div></div>
        <div class="track-row"><button class="track-btn">H.H</button><div class="track-timeline"></div></div>
        <div class="track-row"><button class="track-btn">CYMB</button><div class="track-timeline"></div></div>
        <div class="track-row"><button class="track-btn">AI MELLOW GUIT.</button><div class="track-timeline"></div></div>
        <div class="track-row"><button class="track-btn">PIANO ARPEG.</button><div class="track-timeline"></div></div>
        <div class="track-row"><button class="track-btn">STRINGS</button><div class="track-timeline"></div></div>
        <div class="track-row"><button class="track-btn">STRINGS CODE</button><div class="track-timeline"></div></div>
        <div class="track-row"><button class="track-btn">HARMONICA</button><div class="track-timeline"></div></div>
        <div class="track-row"><button class="track-btn">VIOLIN</button><div class="track-timeline"></div></div>
        <div class="track-row"><button class="track-btn">AFRICAN DRUMS</button><div class="track-timeline"></div></div>
        <div class="track-row"><button class="track-btn">AI BASS</button><div class="track-timeline"></div></div>
        <div class="track-row"><button class="track-btn">SUB BASS</button><div class="track-timeline"></div></div>
    </div>

    <footer>
        <button class="footer-btn">🔴 録音</button>
        <button class="footer-btn">▶ 再生</button>
        <button class="footer-btn">✖ Clear</button>
        <button class="footer-btn">🔁 リピート</button>
        <button class="footer-btn">🔀 ランダム</button>
        <button class="footer-btn">🔗 共有</button>
        <button class="footer-btn">⚙ 編集</button>
        <button class="footer-btn">🧩 合成</button>
        <button class="footer-btn">📋 リスト</button>
        <button class="footer-btn">💾 保存</button>
    </footer>

</body>
</html>
