<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIC VICTORY - MASTER SYNTHESIZER v52.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans select-none pb-20 overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        function MasterSynthApp() {
            const [tab, setTab] = React.useState("DUAL_EDIT");
            const [playing, setPlaying] = React.useState(false);
            const [isRecording, setIsRecording] = React.useState(false);
            const [flashColor, setFlashColor] = React.useState("border-cyan-500");
            const [bpm, setBpm] = React.useState(116);
            const [currentBar, setCurrentBar] = React.useState(0);
            const [currentStep, setCurrentStep] = React.useState(-1);
            const [status, setStatus] = React.useState("✨ 個別AI・スクラッチ・ラップ歌詞AI追加！MIC VICTORY v52.0 スタジオ起動！");

            const BARS = 8;
            const BAR_STEPS = 16;
            const TOTAL_STEPS = BARS * BAR_STEPS;

            const [selectedInstrument, setSelectedInstrument] = React.useState("synth");
            const [selectedNote, setSelectedNote] = React.useState("C4");
            const [selectedDrumPart, setSelectedDrumPart] = React.useState("kick");
            const [inputMode, setInputMode] = React.useState("grid");

            const [selectedDrumPatternId, setSelectedDrumPatternId] = React.useState(1);
            const [selectedSubBassPatternId, setSelectedSubBassPatternId] = React.useState(1);

            // ラップ歌詞AI用ステート
            const [rapGenre, setRapGenre] = React.useState("HIPHOP");
            const [rapLyrics, setRapLyrics] = React.useState([
                "Yo! MIC VICTORY 止まらない Beat",
                "刻むリズム 16小節の Street",
                "AIのFLOWで 塗り替える History",
                "掴み取る栄光 This is my Victory!"
            ]);

            const [isVoiceRecording, setIsVoiceRecording] = React.useState(false);
            const [voiceAudioUrl, setVoiceAudioUrl] = React.useState(null);
            const mediaRecorderRef = React.useRef(null);
            const audioChunksRef = React.useRef([]);

            const [jacketTitle, setJacketTitle] = React.useState("MIC VICTORY ULTIMATE v52");
            const [jacketGenre, setJacketGenre] = React.useState("RAP / ELECTRO / SOUL");
            const [jacketColor, setJacketColor] = React.useState("from-purple-600 via-pink-600 to-amber-600");

            const [instrumentSteps, setInstrumentSteps] = React.useState({
                drums: new Array(TOTAL_STEPS).fill(null),
                subBass: new Array(TOTAL_STEPS).fill(null),
                robot: new Array(TOTAL_STEPS).fill(null),
                bass: new Array(TOTAL_STEPS).fill(null),
                piano: new Array(TOTAL_STEPS).fill(null),
                synth: new Array(TOTAL_STEPS).fill(null),
                guitar: new Array(TOTAL_STEPS).fill(null),
                trumpet: new Array(TOTAL_STEPS).fill(null),
                violin: new Array(TOTAL_STEPS).fill(null),
                flute: new Array(TOTAL_STEPS).fill(null),
                organ: new Array(TOTAL_STEPS).fill(null),
                voiceTrack: new Array(TOTAL_STEPS).fill(null),
            });

            const [volumes, setVolumes] = React.useState({
                drums: 0,
                subBass: 0,
                robot: -2,
                bass: 0,
                piano: 0,
                synth: 0,
                guitar: 0,
                trumpet: 0,
                violin: 0,
                flute: 0,
                organ: 0,
            });

            const [fxSettings, setFxSettings] = React.useState({
                reverbWet: 0.35,
                delayWet: 0.25,
                chorusWet: 0.3,
                distortion: 0.15,
                stereoPan: 0
            });

            const [savedSlots, setSavedSlots] = React.useState({});
            const [slotName, setSlotName] = React.useState("MIC_VICTORY_ALBUM_52");

            const synthsRef = React.useRef(null);
            const loopRef = React.useRef(null);
            const pannerRef = React.useRef(null);
            const channelGainsRef = React.useRef({});

            const NOTES = ["C4", "D4", "E4", "F4", "G4", "A4", "B4", "C5"];
            const SOLFEGE = { "C4": "ド", "D4": "レ", "E4": "ミ", "F4": "ファ", "G4": "ソ", "A4": "ラ", "B4": "シ", "C5": "ド" };

            const INSTRUMENTS = [
                { id: "drums", label: "🥁 ドラム", color: "from-red-600 to-amber-600" },
                { id: "subBass", label: "🔊 重低音ベース", color: "from-amber-600 to-orange-700" },
                { id: "bass", label: "🎸 ベース", color: "from-emerald-600 to-teal-600" },
                { id: "synth", label: "🎹 シンセ", color: "from-cyan-600 to-blue-700" },
                { id: "piano", label: "🎹 ピアノ", color: "from-blue-600 to-indigo-600" },
                { id: "guitar", label: "🎸 ギター", color: "from-orange-600 to-red-700" },
                { id: "trumpet", label: "🎺 トランペット", color: "from-yellow-500 to-amber-600" },
                { id: "violin", label: "🎻 バイオリン", color: "from-amber-600 to-yellow-700" },
                { id: "flute", label: "🪈 フルート", color: "from-teal-500 to-cyan-600" },
                { id: "organ", label: "🎹 オルガン", color: "from-indigo-600 to-purple-700" },
                { id: "robot", label: "🤖 ロボットFX", color: "from-purple-600 to-pink-600" },
                { id: "voiceTrack", label: "🎤 ボイス", color: "from-rose-600 to-pink-700" },
            ];

            const GENRES = [
                { id: "soul", label: "✨ Soul (ソウル)" },
                { id: "disco", label: "🕺 Disco (ディスコ)" },
                { id: "pops", label: "🎵 Pops (ポップス)" },
                { id: "rook", label: "🎸 Rook (ロック)" },
                { id: "ballad", label: "🎹 Ballad (バラード)" },
                { id: "popingdance", label: "💃 Poping Dance (ポッピング)" }
            ];

            const DRUM_PARTS = [
                { id: "kick", label: "キック" },
                { id: "snare", label: "スネア" },
                { id: "hihat", label: "ハイハット" },
                { id: "clap", label: "クラップ" },
            ];

            // 音響・シンセ初期化
            React.useEffect(() => {
                const masterGain = new Tone.Gain(1.2).toDestination();
                const panner = new Tone.Panner(0).connect(masterGain);
                pannerRef.current = panner;

                const reverb = new Tone.Reverb({ decay: 2.3, wet: fxSettings.reverbWet }).connect(panner);
                const delay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.3, wet: fxSettings.delayWet }).connect(reverb);
                const chorus = new Tone.Chorus({ frequency: 1.5, delayTime: 3.5, depth: 0.7, wet: fxSettings.chorusWet }).connect(delay);
                const distortion = new Tone.Distortion(fxSettings.distortion).connect(chorus);

                const cGains = {};
                Object.keys(instrumentSteps).forEach(key => {
                    if (key !== "voiceTrack") {
                        const cg = new Tone.Gain(Tone.dbToGain(volumes[key] || 0)).connect(distortion);
                        cGains[key] = cg;
                    }
                });
                channelGainsRef.current = cGains;

                const subBassSynth = new Tone.MonoSynth({
                    oscillator: { type: "triangle" },
                    envelope: { attack: 0.01, decay: 0.4, sustain: 0.4, release: 0.3 }
                }).connect(cGains.subBass);

                const robotSynth = new Tone.Synth({
                    oscillator: { type: "square" },
                    envelope: { attack: 0.01, decay: 0.15, sustain: 0.2, release: 0.1 }
                }).connect(cGains.robot);

                const bassSynth = new Tone.MonoSynth({
                    oscillator: { type: "sine" },
                    envelope: { attack: 0.02, decay: 0.3, sustain: 0.4, release: 0.2 }
                }).connect(cGains.bass);

                const kickSynth = new Tone.MembraneSynth({
                    pitchDecay: 0.05, octaves: 8, oscillator: { type: "sine" },
                    envelope: { attack: 0.001, decay: 0.6, sustain: 0.01, release: 0.4 }
                }).connect(cGains.drums);

                const snareSynth = new Tone.NoiseSynth({
                    noise: { type: "white" },
                    envelope: { attack: 0.001, decay: 0.25, sustain: 0 }
                }).connect(cGains.drums);

                const hihatSynth = new Tone.MetalSynth({
                    frequency: 500, envelope: { attack: 0.001, decay: 0.05, release: 0.01 },
                    harmonicity: 5.0, modulationIndex: 35, resonance: 6000, octaves: 2
                }).connect(cGains.drums);

                const clapSynth = new Tone.NoiseSynth({
                    noise: { type: "pink" },
                    envelope: { attack: 0.01, decay: 0.18, sustain: 0 }
                }).connect(cGains.drums);

                const pianoSynth = new Tone.Synth({
                    oscillator: { type: "sine" },
                    envelope: { attack: 0.01, decay: 0.4, sustain: 0.3, release: 0.6 }
                }).connect(cGains.piano);

                const synthLead = new Tone.Synth({
                    oscillator: { type: "sawtooth" },
                    envelope: { attack: 0.02, decay: 0.3, sustain: 0.4, release: 0.3 }
                }).connect(cGains.synth);

                const guitarSynth = new Tone.Synth({
                    oscillator: { type: "sawtooth" },
                    envelope: { attack: 0.005, decay: 0.25, sustain: 0.2, release: 0.15 }
                }).connect(cGains.guitar);

                const trumpetSynth = new Tone.Synth({
                    oscillator: { type: "sawtooth6" },
                    envelope: { attack: 0.05, decay: 0.2, sustain: 0.6, release: 0.2 }
                }).connect(cGains.trumpet);

                const violinSynth = new Tone.Synth({
                    oscillator: { type: "sine" },
                    envelope: { attack: 0.15, decay: 0.4, sustain: 0.8, release: 0.5 }
                }).connect(cGains.violin);

                const fluteSynth = new Tone.Synth({
                    oscillator: { type: "sine" },
                    envelope: { attack: 0.08, decay: 0.3, sustain: 0.7, release: 0.4 }
                }).connect(cGains.flute);

                const organSynth = new Tone.Synth({
                    oscillator: { type: "square8" },
                    envelope: { attack: 0.01, decay: 0.1, sustain: 0.9, release: 0.1 }
                }).connect(cGains.organ);

                // スクラッチFX用ノイズシンセ
                const scratchSynth = new Tone.NoiseSynth({
                    noise: { type: "white" },
                    envelope: { attack: 0.005, decay: 0.08, sustain: 0 }
                }).connect(masterGain);

                synthsRef.current = {
                    drums: { kick: kickSynth, snare: snareSynth, hihat: hihatSynth, clap: clapSynth },
                    subBass: subBassSynth,
                    bass: bassSynth,
                    robot: robotSynth,
                    piano: pianoSynth,
                    synth: synthLead,
                    guitar: guitarSynth,
                    trumpet: trumpetSynth,
                    violin: violinSynth,
                    flute: fluteSynth,
                    organ: organSynth,
                    scratch: scratchSynth,
                    masterGain, reverb, delay, chorus, distortion
                };

                return () => {
                    Tone.Transport.stop();
                    Tone.Transport.cancel();
                };
            }, []);

            // ボリューム・FX反映
            React.useEffect(() => {
                const syns = synthsRef.current;
                if (!syns) return;
                syns.reverb.wet.value = fxSettings.reverbWet;
                syns.delay.wet.value = fxSettings.delayWet;
                syns.chorus.wet.value = fxSettings.chorusWet;
                syns.distortion.distortion = fxSettings.distortion;
                if (pannerRef.current) {
                    pannerRef.current.pan.value = fxSettings.stereoPan;
                }

                Object.keys(volumes).forEach(k => {
                    if (channelGainsRef.current[k]) {
                        channelGainsRef.current[k].gain.rampTo(Tone.dbToGain(volumes[k]), 0.1);
                    }
                });
            }, [fxSettings, volumes]);

            // トランスポート・再生ループ
            React.useEffect(() => {
                Tone.Transport.bpm.value = bpm;
                Tone.Transport.cancel();

                if (playing) {
                    let stepCounter = 0;
                    loopRef.current = new Tone.Loop(time => {
                        let step = stepCounter % TOTAL_STEPS;
                        const bar = Math.floor(step / BAR_STEPS);
                        const sInBar = step % BAR_STEPS;

                        setCurrentStep(sInBar);
                        setCurrentBar(bar);

                        if (sInBar % 2 === 0) {
                            const colors = ["border-pink-500", "border-cyan-400", "border-yellow-400", "border-purple-500", "border-amber-400"];
                            setFlashColor(colors[Math.floor(Math.random() * colors.length)]);
                        }

                        const syns = synthsRef.current;
                        if (!syns) return;

                        Object.keys(instrumentSteps).forEach(instKey => {
                            if (instKey === "voiceTrack") return;
                            const val = instrumentSteps[instKey][step];
                            if (!val) return;

                            if (instKey === "drums") {
                                if (typeof val === "object") {
                                    if (val.kick) syns.drums.kick.triggerAttackRelease("C1", "8n", time);
                                    if (val.snare) syns.drums.snare.triggerAttackRelease("8n", time);
                                    if (val.hihat) syns.drums.hihat.triggerAttackRelease("32n", time, 0.7);
                                    if (val.clap) syns.drums.clap.triggerAttackRelease("8n", time);
                                }
                            } else if (instKey === "subBass") {
                                syns.subBass.triggerAttackRelease("C1", "8n", time);
                            } else if (syns[instKey]) {
                                syns[instKey].triggerAttackRelease(typeof val === "string" ? val : "C4", "8n", time);
                            }
                        });

                        stepCounter++;
                    }, "16n").start(0);

                    Tone.Transport.start();
                } else {
                    Tone.Transport.stop();
                }
            }, [playing, bpm, instrumentSteps]);

            const togglePlay = async () => {
                await Tone.start();
                setPlaying(!playing);
                setStatus(playing ? "停止しました" : `▶ 再生中 (BPM: ${bpm})`);
            };

            const toggleRecord = async () => {
                await Tone.start();
                setIsRecording(!isRecording);
                setStatus(!isRecording ? "🔴 リアルタイム演奏録音中！" : "⏹️ 録音停止");
            };

            // 🎛️ 連打リピート機能 (指定音を短く4回連打)
            const playRepeatRoll = async (note) => {
                await Tone.start();
                const syns = synthsRef.current;
                if (!syns) return;
                const targetSynth = syns[selectedInstrument] || syns.synth;
                if (selectedInstrument === "drums") return;

                for (let i = 0; i < 4; i++) {
                    setTimeout(() => {
                        targetSynth.triggerAttackRelease(note, "32n");
                    }, i * 70);
                }
                setStatus(`🥁 ロール連打！ (${note})`);
            };

            // 💿 スクラッチ機能 (DJ風ノイズとピッチ変動)
            const triggerScratch = async () => {
                await Tone.start();
                const syns = synthsRef.current;
                if (!syns) return;
                syns.scratch.triggerAttackRelease("16n");
                setStatus("💿 キュイッ！スクラッチ発動！");
            };

            // 各楽器別AIメロディ自動生成
            const generateInstrumentAI = (instKey) => {
                const scales = ["C4", "D4", "E4", "G4", "A4", "C5"];
                const instArr = new Array(TOTAL_STEPS).fill(null);

                for (let s = 0; s < TOTAL_STEPS; s++) {
                    const sInBar = s % BAR_STEPS;
                    if (instKey === "drums") {
                        instArr[s] = { kick: sInBar % 4 === 0, snare: sInBar === 4 || sInBar === 12, hihat: sInBar % 2 === 0, clap: sInBar === 12 };
                    } else if (instKey === "subBass") {
                        if (sInBar % 4 === 0) instArr[s] = "C1";
                    } else {
                        if (sInBar === 0 || sInBar === 2 || sInBar === 6 || sInBar === 10 || sInBar === 14) {
                            instArr[s] = scales[Math.floor(Math.random() * scales.length)];
                        }
                    }
                }
                setInstrumentSteps(prev => ({ ...prev, [instKey]: instArr }));
                setStatus(`✨ 【${instKey}】の個別AIメロディを生成しました！`);
            };

            // ラップ歌詞AI生成
            const generateRapAI = () => {
                const rapTemplates = [
                    ["🎤 Check one two MIC VICTORY! / 揺らすぜフロアからストリート！ / 止まらないRhyme溢れるEnergy / 掴むぜ頂点 勝利のDestiny!"],
                    ["🎤 Hey yo! 刻むBeatに乗せて / 限界突破のステージへ連れて / 誰も真似できないこのFlow / 鳴り響かすぜ Sound & Soul!"],
                    ["🎤 1, 2, 3 and 4! / 準備はいいか? 扉を開けろ Door! / 最高の仲間と奏でるHarmony / これが噂のMIC VICTORY!"]
                ];
                const selected = rapTemplates[Math.floor(Math.random() * rapTemplates.length)];
                setRapLyrics(selected);
                setStatus("🎤 ラップ歌詞AI生成完了！");
            };

            const startVoiceRecording = async () => {
                audioChunksRef.current = [];
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const mediaRecorder = new MediaRecorder(stream);
                    mediaRecorderRef.current = mediaRecorder;
                    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunksRef.current.push(e.data); };
                    mediaRecorder.onstop = () => {
                        const blob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                        setVoiceAudioUrl(URL.createObjectURL(blob));
                        setStatus("🎤 ボイス録音完了！");
                    };
                    mediaRecorder.start();
                    setIsVoiceRecording(true);
                    setStatus("🔴 ボイス録音中...");
                } catch (err) {
                    setStatus("❌ マイクアクセスエラー");
                }
            };

            const stopVoiceRecording = () => {
                if (mediaRecorderRef.current && isVoiceRecording) {
                    mediaRecorderRef.current.stop();
                    setIsVoiceRecording(false);
                }
            };

            const playVoiceAudio = () => {
                if (voiceAudioUrl) {
                    new Audio(voiceAudioUrl).play();
                    setStatus("▶ 録音ボイス再生中...");
                }
            };

            const toggleStep = (instKey, idx) => {
                setInstrumentSteps(prev => {
                    const currentArr = [...prev[instKey]];
                    if (instKey === "drums") {
                        const currentObj = currentArr[idx] || { kick: false, snare: false, hihat: false, clap: false };
                        const updatedObj = { ...currentObj, [selectedDrumPart]: !currentObj[selectedDrumPart] };
                        const hasAny = Object.values(updatedObj).some(Boolean);
                        currentArr[idx] = hasAny ? updatedObj : null;
                    } else if (instKey === "subBass") {
                        currentArr[idx] = currentArr[idx] ? null : "C1";
                    } else {
                        currentArr[idx] = currentArr[idx] ? null : selectedNote;
                    }
                    return { ...prev, [instKey]: currentArr };
                });
            };

            const clearSpecificInstrument = (instKey) => {
                setInstrumentSteps(prev => ({ ...prev, [instKey]: new Array(TOTAL_STEPS).fill(null) }));
                setStatus(`🗑️ 【${instKey}】をClearしました。`);
            };

            const clearAllSteps = () => {
                const cleared = {};
                Object.keys(instrumentSteps).forEach(k => cleared[k] = new Array(TOTAL_STEPS).fill(null));
                setInstrumentSteps(cleared);
                setStatus("🧹 すべての楽器を完全Clearしました。");
            };

            const playNoteKeyboard = (note) => {
                setSelectedNote(note);
                const syns = synthsRef.current;
                if (!syns) return;

                if (selectedInstrument === "drums") {
                    if (selectedDrumPart === "kick") syns.drums.kick.triggerAttackRelease("C1", "8n");
                    else if (selectedDrumPart === "snare") syns.drums.snare.triggerAttackRelease("8n");
                    else if (selectedDrumPart === "hihat") syns.drums.hihat.triggerAttackRelease("32n");
                    else syns.drums.clap.triggerAttackRelease("8n");
                } else if (selectedInstrument === "subBass") {
                    syns.subBass.triggerAttackRelease("C1", "8n");
                } else if (syns[selectedInstrument]) {
                    syns[selectedInstrument].triggerAttackRelease(note, "8n");
                }

                if (isRecording && currentStep !== -1) {
                    const stepIdx = currentBar * BAR_STEPS + currentStep;
                    toggleStep(selectedInstrument, stepIdx);
                }
            };

            const saveCurrentSession = () => {
                setSavedSlots({ ...savedSlots, [slotName]: JSON.parse(JSON.stringify(instrumentSteps)) });
                setStatus(`💾 セッション「${slotName}」保存完了！`);
            };

            const loadSession = (name) => {
                if (savedSlots[name]) {
                    setInstrumentSteps(JSON.parse(JSON.stringify(savedSlots[name])));
                    setStatus(`📂 セッション「${name}」ロード完了！`);
                }
            };

            const currentInstObj = INSTRUMENTS.find(i => i.id === selectedInstrument);

            return (
                <div className={`min-h-screen bg-slate-950 text-slate-100 flex flex-col text-xs font-sans select-none border-8 transition-all duration-75 ${flashColor}`}>
                    
                    {/* ヘッダー */}
                    <header className="bg-slate-900 border-b border-slate-800 px-3 py-2 flex items-center justify-between gap-2 sticky top-0 z-50 shadow-lg">
                        <div className="flex items-center gap-2">
                            <span className="font-black text-sm bg-gradient-to-r from-amber-400 via-pink-400 to-cyan-400 bg-clip-text text-transparent">
                                MIC VICTORY <span className="text-[10px] text-amber-400 font-normal">v52.0 PRO DJ</span>
                            </span>
                        </div>

                        <div className="flex items-center gap-1.5 flex-wrap">
                            {/* スクラッチボタン */}
                            <button
                                onClick={triggerScratch}
                                className="px-2.5 py-1 bg-amber-600 hover:bg-amber-500 text-slate-950 font-black rounded text-[11px] shadow animate-pulse"
                            >
                                💿 スクラッチ
                            </button>

                            <button
                                onClick={togglePlay}
                                className={`px-3 py-1 rounded font-bold text-xs shadow ${
                                    playing ? "bg-amber-400 text-slate-950 animate-bounce" : "bg-pink-600 text-white"
                                }`}
                            >
                                {playing ? "■ 停止" : "▶ 再生"}
                            </button>

                            <button
                                onClick={toggleRecord}
                                className={`px-3 py-1 rounded font-bold text-xs shadow ${
                                    isRecording ? "bg-red-600 text-white animate-pulse border border-white" : "bg-slate-800 text-red-400 border border-red-800"
                                }`}
                            >
                                {isRecording ? "🔴 録音中..." : "⏺️ 録音"}
                            </button>
                            
                            <div className="flex items-center gap-1 bg-slate-950 px-2 py-0.5 rounded border border-slate-800">
                                <span className="text-[9px] text-slate-400">BPM</span>
                                <input
                                    type="number"
                                    value={bpm}
                                    onChange={e => setBpm(Math.max(60, Math.min(220, Number(e.target.value))))}
                                    className="w-12 bg-slate-900 text-center font-bold text-pink-400 rounded text-xs py-0.5"
                                />
                            </div>
                        </div>
                    </header>

                    {/* タブナビゲーション */}
                    <nav className="bg-slate-900/90 border-b border-slate-800 px-2 py-1.5 flex gap-1 overflow-x-auto">
                        {[
                            { id: "DUAL_EDIT", label: "🎛️ 2画面デュアル編集" },
                            { id: "MIXER", label: "🎚️ ミキサー＆ボリューム" },
                            { id: "RAP_STUDIO", label: "🎤 ラップ歌詞AI＆手動" },
                            { id: "VOICE_STUDIO", label: "🎙️ ボイス録音" },
                            { id: "MEMORY_LIST", label: "💾 リスト保存" },
                            { id: "JACKET", label: "💿 ジャケット" },
                        ].map(t => (
                            <button
                                key={t.id}
                                onClick={() => setTab(t.id)}
                                className={`px-3 py-1 rounded text-center font-bold transition-all shrink-0 ${
                                    tab === t.id ? "bg-amber-500 text-slate-950 shadow" : "bg-slate-800/60 text-slate-400"
                                }`}
                            >
                                {t.label}
                            </button>
                        ))}
                    </nav>

                    <div className="bg-slate-900/50 px-3 py-1 text-[11px] text-cyan-400 border-b border-slate-900 truncate">
                        <span>💡 {status}</span>
                    </div>

                    <main className="p-2 flex flex-col gap-3">

                        {/* タブ1: 2画面デュアル編集 */}
                        {tab === "DUAL_EDIT" && (
                            <div className="flex flex-col gap-3">
                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-2.5 shadow">
                                    <div className="flex justify-between items-center flex-wrap gap-2">
                                        <span className="text-xs font-bold text-pink-400">① 楽器セレクト & 個別AI・連打リピート</span>
                                        <div className="flex gap-1.5">
                                            <button
                                                onClick={() => generateInstrumentAI(selectedInstrument)}
                                                className="px-2.5 py-1 bg-purple-600 hover:bg-purple-500 text-white font-bold rounded text-[10px] shadow"
                                            >
                                                ✨ この楽器の個別AI生成
                                            </button>
                                            <button
                                                onClick={() => clearSpecificInstrument(selectedInstrument)}
                                                className="px-2.5 py-1 bg-red-950 hover:bg-red-900 text-red-300 font-bold rounded text-[10px] border border-red-800"
                                            >
                                                🗑️ クリア
                                            </button>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-1.5">
                                        {INSTRUMENTS.map(inst => (
                                            <button
                                                key={inst.id}
                                                onClick={() => setSelectedInstrument(inst.id)}
                                                className={`py-2 px-1 rounded-lg font-bold text-[11px] transition-all border flex items-center justify-center gap-1 shadow ${
                                                    selectedInstrument === inst.id
                                                        ? `bg-gradient-to-r ${inst.color} border-white text-white ring-2 ring-white/30`
                                                        : "bg-slate-950 border-slate-800 text-slate-400"
                                                }`}
                                            >
                                                {inst.label}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3 shadow">
                                    <div className="flex justify-between items-center flex-wrap gap-2">
                                        <span className="text-xs font-bold text-cyan-400">② ステップエディタ ({currentInstObj.label})</span>
                                        <div className="flex gap-1.5 items-center">
                                            <button onClick={() => setInputMode("grid")} className={`px-3 py-1 rounded text-[10px] font-bold ${inputMode === "grid" ? "bg-cyan-600 text-white" : "bg-slate-800 text-slate-400"}`}>グリッド入力</button>
                                            <button onClick={() => setInputMode("keyboard")} className={`px-3 py-1 rounded text-[10px] font-bold ${inputMode === "keyboard" ? "bg-cyan-600 text-white" : "bg-slate-800 text-slate-400"}`}>ドレミ鍵盤 & 連打</button>
                                        </div>
                                    </div>

                                    {selectedInstrument === "drums" && (
                                        <div className="flex items-center gap-2 bg-slate-950 p-2 rounded border border-slate-800">
                                            <span className="text-[11px] font-bold text-slate-300">ドラムパーツ切替:</span>
                                            <div className="flex gap-1.5">
                                                {DRUM_PARTS.map(part => (
                                                    <button key={part.id} onClick={() => setSelectedDrumPart(part.id)} className={`px-3 py-1 rounded text-[11px] font-bold ${selectedDrumPart === part.id ? "bg-red-600 text-white shadow" : "bg-slate-800 text-slate-300"}`}>{part.label}</button>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    {inputMode === "keyboard" && (
                                        <div className="bg-slate-950 border border-slate-800 rounded p-2.5 flex flex-col gap-2">
                                            <div className="flex justify-between items-center">
                                                <span className="text-[11px] font-bold text-amber-400">🎹 ドレミ鍵盤（クリックで演奏 / 連打ロール機能付き）</span>
                                            </div>
                                            <div className="grid grid-cols-8 gap-1.5">
                                                {NOTES.map(note => (
                                                    <div key={note} className="flex flex-col gap-1">
                                                        <button onClick={() => playNoteKeyboard(note)} className={`py-2.5 rounded font-bold flex flex-col items-center justify-center gap-0.5 border ${selectedNote === note ? "bg-amber-500 text-slate-950 border-white ring-2 ring-white" : "bg-slate-900 text-slate-200 border-slate-800"}`}>
                                                            <span className="text-xs">{SOLFEGE[note]}</span>
                                                            <span className="text-[8px] text-slate-400">{note}</span>
                                                        </button>
                                                        <button onClick={() => playRepeatRoll(note)} className="py-1 bg-slate-800 hover:bg-pink-600 text-[9px] font-bold rounded text-pink-300 hover:text-white border border-slate-700">
                                                            連打
                                                        </button>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    <div className="flex items-center justify-between bg-slate-950 p-2 rounded border border-slate-800">
                                        <span className="text-[11px] font-bold text-slate-300">小節: <strong className="text-pink-400">{currentBar + 1} / 8小節</strong></span>
                                        <div className="flex gap-1">
                                            {Array.from({ length: BARS }).map((_, b) => (
                                                <button key={b} onClick={() => setCurrentBar(b)} className={`w-7 h-7 rounded-full text-xs font-bold ${currentBar === b ? "bg-amber-500 text-slate-950" : "bg-slate-800 text-slate-400"}`}>{b + 1}</button>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="overflow-x-auto bg-slate-950 p-3 rounded border border-slate-800">
                                        <div className="grid gap-1 min-w-[540px]" style={{ gridTemplateColumns: "repeat(16, minmax(0, 1fr))" }}>
                                            {Array.from({ length: BAR_STEPS }).map((_, i) => {
                                                const stepIdx = currentBar * BAR_STEPS + i;
                                                const stepVal = instrumentSteps[selectedInstrument][stepIdx];
                                                const isCurrentPlay = playing && currentStep === i;
                                                let isActive = selectedInstrument === "drums" ? (stepVal && stepVal[selectedDrumPart]) : !!stepVal;

                                                return (
                                                    <button
                                                        key={i}
                                                        onClick={() => toggleStep(selectedInstrument, stepIdx)}
                                                        className={`aspect-[3/4] w-full rounded border flex flex-col items-center justify-center text-[9px] transition-all ${
                                                            isActive ? "bg-gradient-to-t from-amber-600 to-pink-600 border-white text-white font-bold shadow-md shadow-pink-500/50 scale-105" : "bg-slate-900 border-slate-800 text-slate-500"
                                                        } ${isCurrentPlay ? "ring-2 ring-cyan-400" : ""}`}
                                                    >
                                                        <span className="font-bold text-[10px]">{i + 1}</span>
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* タブ2: ミキサー＆ボリューム */}
                        {tab === "MIXER" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-4 flex flex-col gap-3">
                                <span className="text-xs font-bold text-amber-400">🎚️ 各楽器個別ボリュームミキサー & 個別AI一発生成</span>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 bg-slate-950 p-3 rounded border border-slate-800">
                                    {INSTRUMENTS.filter(i => i.id !== "voiceTrack").map(inst => (
                                        <div key={inst.id} className="flex items-center justify-between bg-slate-900 p-2 rounded border border-slate-800 gap-2">
                                            <div className="flex items-center gap-2">
                                                <span className="text-[11px] font-bold text-slate-200">{inst.label}</span>
                                                <button onClick={() => generateInstrumentAI(inst.id)} className="px-2 py-0.5 bg-purple-900 hover:bg-purple-700 text-purple-200 rounded text-[9px] font-bold">AI生成</button>
                                            </div>
                                            <div className="flex items-center gap-2">
                                                <input
                                                    type="range"
                                                    min="-30"
                                                    max="6"
                                                    step="1"
                                                    value={volumes[inst.id]}
                                                    onChange={e => setVolumes({ ...volumes, [inst.id]: Number(e.target.value) })}
                                                    className="w-20 accent-amber-500"
                                                />
                                                <span className="text-[10px] text-amber-400 w-7 text-right">{volumes[inst.id]}dB</span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* タブ3: ラップ歌詞AI & 手動 */}
                        {tab === "RAP_STUDIO" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-4 flex flex-col gap-4">
                                <div className="flex justify-between items-center">
                                    <span className="text-xs font-bold text-pink-400">🎤 ラップ歌詞 AIメロディ ＆ 手動クリエーター</span>
                                    <button onClick={generateRapAI} className="px-3 py-1.5 bg-gradient-to-r from-pink-600 to-purple-600 text-white font-bold rounded text-xs shadow">✨ ラップ歌詞AI生成</button>
                                </div>
                                <div className="bg-slate-950 p-3 rounded border border-slate-800 flex flex-col gap-2">
                                    <span className="text-[10px] text-slate-400">ライム（韻）を刻むリリックエディタ（手動で編集可能）:</span>
                                    {rapLyrics.map((line, idx) => (
                                        <input
                                            key={idx}
                                            type="text"
                                            value={line}
                                            onChange={e => {
                                                const newL = [...rapLyrics];
                                                newL[idx] = e.target.value;
                                                setRapLyrics(newL);
                                            }}
                                            className="bg-slate-900 text-pink-300 font-bold px-3 py-2 rounded text-xs border border-slate-800"
                                        />
                                    ))}
                                    <div className="flex gap-2 mt-2">
                                        <button onClick={() => setStatus("🎤 ラップ歌詞をセットしました！")} className="px-4 py-2 bg-cyan-600 text-white font-bold rounded text-xs">💾 歌詞を適用</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* タブ4: ボイス */}
                        {tab === "VOICE_STUDIO" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-4 flex flex-col gap-3">
                                <span className="text-xs font-bold text-rose-400">🎙️ ボイス録音・再生スタジオ</span>
                                <div className="bg-slate-950 p-4 rounded border border-slate-800 flex flex-col gap-3 items-center">
                                    <div className="flex gap-2">
                                        {!isVoiceRecording ? (
                                            <button onClick={startVoiceRecording} className="px-4 py-2 bg-red-600 text-white font-bold rounded text-xs shadow animate-pulse">🔴 録音開始</button>
                                        ) : (
                                            <button onClick={stopVoiceRecording} className="px-4 py-2 bg-slate-200 text-slate-950 font-bold rounded text-xs shadow">⏹️ 停止</button>
                                        )}
                                        <button onClick={playVoiceAudio} disabled={!voiceAudioUrl} className={`px-4 py-2 font-bold rounded text-xs shadow ${voiceAudioUrl ? "bg-cyan-600 text-white" : "bg-slate-800 text-slate-500 cursor-not-allowed"}`}>▶ 再生</button>
                                    </div>
                                    <span className="text-[10px] text-slate-400">{voiceAudioUrl ? "✅ ボイス保存済み" : "マイクから音声を録音できます"}</span>
                                </div>
                            </div>
                        )}

                        {/* タブ5: メモリリスト */}
                        {tab === "MEMORY_LIST" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3">
                                <span className="text-xs font-bold text-emerald-400">💾 プロジェクトリスト保存</span>
                                <div className="flex gap-2 bg-slate-950 p-3 rounded border border-slate-800">
                                    <input type="text" value={slotName} onChange={e => setSlotName(e.target.value)} className="bg-slate-900 px-2 py-1 rounded text-slate-100 flex-1 border border-slate-800" />
                                    <button onClick={saveCurrentSession} className="px-4 py-1 bg-emerald-600 text-white font-bold rounded">保存</button>
                                </div>
                                <div className="flex flex-col gap-2 bg-slate-950 p-3 rounded border border-slate-800 max-h-[180px] overflow-y-auto">
                                    {Object.keys(savedSlots).length === 0 ? (
                                        <span className="text-[10px] text-slate-500">保存データなし</span>
                                    ) : (
                                        Object.keys(savedSlots).map(name => (
                                            <div key={name} className="flex justify-between items-center bg-slate-900 p-2 rounded border border-slate-800">
                                                <span className="font-bold text-cyan-400 text-xs">📂 {name}</span>
                                                <button onClick={() => loadSession(name)} className="px-2 py-1 bg-cyan-600 text-white rounded text-[10px] font-bold">ロード</button>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        )}

                        {/* タブ6: ジャケット */}
                        {tab === "JACKET" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-4 flex flex-col gap-4 items-center">
                                <span className="text-xs font-bold text-cyan-400 self-start">💿 アルバムジャケット作成</span>
                                <div className="flex flex-col gap-3 w-full max-w-sm bg-slate-950 p-4 rounded border border-slate-800">
                                    <input type="text" value={jacketTitle} onChange={e => setJacketTitle(e.target.value)} className="bg-slate-900 px-2 py-1.5 rounded text-white font-bold border border-slate-800" />
                                    <div className={`w-full aspect-square bg-gradient-to-br ${jacketColor} rounded-xl shadow-2xl p-6 flex flex-col justify-between items-center text-center border-4 border-white/20`}>
                                        <div className="font-black text-xs text-white/80">MIC VICTORY RECORDS</div>
                                        <h2 className="text-xl font-black text-white">{jacketTitle}</h2>
                                        <div className="text-[9px] text-white/70">PRODUCED BY STUDIO v52.0</div>
                                    </div>
                                    <button onClick={() => setStatus(`🎉 【${jacketTitle}】リリース完了！`)} className="w-full py-3 bg-gradient-to-r from-pink-600 to-amber-500 text-white font-black rounded-lg text-xs shadow-lg">🚀 リリース！</button>
                                </div>
                            </div>
                        )}

                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<MasterSynthApp />);
    </script>
</body>
</html>
