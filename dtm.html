<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIC VICTORY - MASTER SYNTHESIZER v38.9 (ULTIMATE STABLE & MULTI VISUALIZER)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans select-none pb-20 overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        function MasterSynthApp() {
            const [tab, setTab] = React.useState("DUAL_EDIT");
            const [playing, setPlaying] = React.useState(false);
            const [flashColor, setFlashColor] = React.useState("border-cyan-500");
            const [bpm, setBpm] = React.useState(106);
            const [currentBar, setCurrentBar] = React.useState(0);
            const [currentStep, setCurrentStep] = React.useState(-1);
            const [status, setStatus] = React.useState("✨ v38.9: 崩れない完全安定仕様 ＆ マルチビジュアライザー稼働中！");

            const BARS = 18;
            const BAR_STEPS = 16;
            const TOTAL_STEPS = BARS * BAR_STEPS;

            const [selectedInstrument, setSelectedInstrument] = React.useState("subBass");
            const [selectedNote, setSelectedNote] = React.useState("C1");
            const [selectedDrumPart, setSelectedDrumPart] = React.useState("kick");

            const [selectedDrumPatternId, setSelectedDrumPatternId] = React.useState(1);
            const [selectedSubBassPatternId, setSelectedSubBassPatternId] = React.useState(1);

            // 連打・記録関連
            const [rapidRecordMode, setRapidRecordMode] = React.useState(false);
            const [performanceLogs, setPerformanceLogs] = React.useState([]);
            const [hitFlashActive, setHitFlashActive] = React.useState(true);

            // 🌟 追加：ミュージックビジュアルライザーの多彩なパターン (全6種)
            const VISUALIZER_PATTERNS = [
                { id: "bars", label: "📊 クラシック・バー" },
                { id: "neonWave", label: "🌊 ネオン・ウェーブ" },
                { id: "radar", label: "🎯 サイバー・レーダー" },
                { id: "pulseCircle", label: "⭕ パルス・サークル" },
                { id: "matrix", label: "⚡ マトリックス・ドット" },
                { id: "spectrum", label: "🌈 レインボー・スペクトラム" }
            ];
            const [selectedVisualizerPattern, setSelectedVisualizerPattern] = React.useState("bars");

            // 全体録音（Master Record）＆永続保存リスト機能
            const [masterRecording, setMasterRecording] = React.useState(false);
            const [masterRecordBuffer, setMasterRecordBuffer] = React.useState([]);
            
            const [recordedSessionsList, setRecordedSessionsList] = React.useState(() => {
                try {
                    const saved = localStorage.getItem("MIC_VICTORY_RECORDED_SESSIONS");
                    return saved ? JSON.parse(saved) : [];
                } catch(e) { return []; }
            });
            const [playingSessionId, setPlayingSessionId] = React.useState(null);

            const [autoSwitchSync, setAutoSwitchSync] = React.useState(false);
            const [isVoiceRecording, setIsVoiceRecording] = React.useState(false);
            const [voiceAudioUrl, setVoiceAudioUrl] = React.useState(null);
            const mediaRecorderRef = React.useRef(null);
            const audioChunksRef = React.useRef([]);

            const [jacketTitle, setJacketTitle] = React.useState("MIC VICTORY: ULTIMATE 18 BARS PERSISTENT");
            const [jacketGenre, setJacketGenre] = React.useState("BLACK CONTEMPORARY / STABLE RECORD LIST");
            
            const GRADIENT_PATTERNS = [
                { id: "cyber", label: "サイバーネオン", class: "from-indigo-950 via-purple-950 to-black" },
                { id: "sunset", label: "サンセット・サンバ", class: "from-rose-600 via-orange-600 to-amber-950" },
                { id: "emerald", label: "エメラルド・ソウル", class: "from-emerald-900 via-teal-900 to-slate-950" },
                { id: "aurora", label: "オーロラ・ディスコ", class: "from-cyan-900 via-emerald-900 to-indigo-950" },
                { id: "gold", label: "ロイヤル・ゴールド", class: "from-amber-700 via-yellow-800 to-stone-950" },
                { id: "magma", label: "マグマ・ブレイブ", class: "from-red-900 via-rose-950 to-black" },
                { id: "electric", label: "エレクトリック・バイオレット", class: "from-purple-900 via-fuchsia-950 to-slate-950" },
                { id: "deepsea", label: "ディープ・アビス", class: "from-blue-950 via-cyan-950 to-black" }
            ];
            const [jacketColor, setJacketColor] = React.useState(GRADIENT_PATTERNS[0].class);

            const [instrumentSteps, setInstrumentSteps] = React.useState({
                drums: new Array(TOTAL_STEPS).fill(null),
                subBass: new Array(TOTAL_STEPS).fill(null),
                synth: new Array(TOTAL_STEPS).fill(null),
                fx: new Array(TOTAL_STEPS).fill(null),
                djembe: new Array(TOTAL_STEPS).fill(null),
                robot: new Array(TOTAL_STEPS).fill(null),
                bass: new Array(TOTAL_STEPS).fill(null),
                piano: new Array(TOTAL_STEPS).fill(null),
                guitar: new Array(TOTAL_STEPS).fill(null),
                trumpet: new Array(TOTAL_STEPS).fill(null),
                violin: new Array(TOTAL_STEPS).fill(null),
                voiceTrack: new Array(TOTAL_STEPS).fill(null),
            });

            const [savedSlots, setSavedSlots] = React.useState(() => {
                try {
                    const saved = localStorage.getItem("MIC_VICTORY_SAVED_SLOTS");
                    return saved ? JSON.parse(saved) : {};
                } catch(e) { return {}; }
            });
            const [slotName, setSlotName] = React.useState("MASTER_VICTORY_STABLE_SESSION");

            const synthsRef = React.useRef(null);
            const loopRef = React.useRef(null);
            const pannerRef = React.useRef(null);

            const NOTES = ["C4", "D4", "E4", "F4", "G4", "A4", "B4", "C5"];
            const SUBBASS_NOTES = ["C1", "D1", "Eb1", "F1", "G1", "Ab1", "Bb1", "C2"];
            const FX_NOTES = ["SWEEP_UP", "SWEEP_DOWN", "LASER", "NOISE_HIT", "PIPS", "ALIEN", "CRASH_FX", "SUB_DROP"];
            const DJEMBE_NOTES = ["G2", "A2", "B2", "C3", "D3", "E3", "F3", "G3"];
            const RAP_PHRASES = ["YEA!", "CHECK IT!", "HIT!", "STEP!", "MIC VICTORY!", "SOUL!", "TURN UP!", "FIRE!"];
            const SOLFEGE = { "C4": "ド", "D4": "レ", "E4": "ミ", "F4": "ファ", "G4": "ソ", "A4": "ラ", "B4": "シ", "C5": "ド" };

            const INSTRUMENTS = [
                { id: "subBass", label: "🔊 システム重低音", color: "from-amber-600 to-orange-800" },
                { id: "synth", label: "🎹 シンセ", color: "from-cyan-600 to-blue-700" },
                { id: "fx", label: "✨ FX効果音", color: "from-purple-600 to-pink-700" },
                { id: "drums", label: "🥁 ドラム", color: "from-red-600 to-amber-600" },
                { id: "bass", label: "🎸 ベース", color: "from-emerald-700 to-teal-900" },
                { id: "djembe", label: "🪘 太鼓", color: "from-yellow-700 to-amber-900" },
                { id: "piano", label: "🎹 ピアノ", color: "from-blue-600 to-indigo-600" },
                { id: "guitar", label: "🎸 ギター", color: "from-orange-600 to-red-700" },
                { id: "trumpet", label: "🎺 トランペット", color: "from-yellow-500 to-amber-600" },
                { id: "violin", label: "🎻 バイオリン", color: "from-amber-600 to-yellow-700" },
                { id: "robot", label: "🤖 ロボット", color: "from-purple-600 to-pink-600" },
                { id: "voiceTrack", label: "🎤 ラップ/ボーカル", color: "from-rose-600 to-pink-700" },
            ];

            const DRUM_PARTS = [
                { id: "kick", label: "キック" },
                { id: "snare", label: "スネア" },
                { id: "hihat", label: "ハイハット" },
                { id: "clap", label: "クラップ" },
            ];

            React.useEffect(() => {
                try { localStorage.setItem("MIC_VICTORY_RECORDED_SESSIONS", JSON.stringify(recordedSessionsList)); } catch(e) {}
            }, [recordedSessionsList]);

            React.useEffect(() => {
                try { localStorage.setItem("MIC_VICTORY_SAVED_SLOTS", JSON.stringify(savedSlots)); } catch(e) {}
            }, [savedSlots]);

            React.useEffect(() => {
                try {
                    const masterGain = new Tone.Gain(1.5).toDestination();
                    const panner = new Tone.Panner(0).connect(masterGain);
                    pannerRef.current = panner;

                    const reverb = new Tone.Reverb({ decay: 2.6, wet: 0.22 }).connect(panner);
                    const delay = new Tone.FeedbackDelay({ delayTime: "8n", feedback: 0.2, wet: 0.15 }).connect(reverb);
                    const distortion = new Tone.Distortion(0.12).connect(delay);

                    const subBassSynth = new Tone.MonoSynth({
                        oscillator: { type: "sawtooth" },
                        envelope: { attack: 0.01, decay: 0.8, sustain: 0.6, release: 0.4 },
                        filterEnvelope: { attack: 0.001, decay: 0.6, baseFrequency: 30, octaves: 4.8 }
                    }).connect(distortion);

                    const synthLead = new Tone.Synth({
                        oscillator: { type: "square" },
                        envelope: { attack: 0.01, decay: 0.3, sustain: 0.35, release: 0.2 }
                    }).connect(delay);

                    const fxSynth = new Tone.Synth({
                        oscillator: { type: "sine" },
                        envelope: { attack: 0.005, decay: 0.15, sustain: 0.1, release: 0.1 }
                    }).connect(reverb);

                    const bassSynth = new Tone.MonoSynth({
                        oscillator: { type: "triangle" },
                        envelope: { attack: 0.02, decay: 0.4, sustain: 0.45, release: 0.2 },
                        filterEnvelope: { attack: 0.01, decay: 0.3, baseFrequency: 65, octaves: 3.5 }
                    }).connect(distortion);

                    const djembeSynth = new Tone.MembraneSynth({
                        pitchDecay: 0.03, octaves: 6, oscillator: { type: "sine" },
                        envelope: { attack: 0.001, decay: 0.4, sustain: 0.01, release: 0.2 }
                    }).connect(reverb);

                    const robotSynth = new Tone.Synth({
                        oscillator: { type: "sawtooth" },
                        envelope: { attack: 0.01, decay: 0.15, sustain: 0.2, release: 0.1 }
                    }).connect(distortion);

                    const kickSynth = new Tone.MembraneSynth({
                        pitchDecay: 0.05, octaves: 9, oscillator: { type: "sine" },
                        envelope: { attack: 0.001, decay: 0.7, sustain: 0.01, release: 0.4 }
                    }).connect(masterGain);

                    const snareSynth = new Tone.NoiseSynth({
                        noise: { type: "white" },
                        envelope: { attack: 0.001, decay: 0.22, sustain: 0 }
                    }).connect(reverb);

                    const hihatSynth = new Tone.MetalSynth({
                        frequency: 380, envelope: { attack: 0.001, decay: 0.035, release: 0.01 },
                        harmonicity: 5.2, modulationIndex: 28, resonance: 4500, octaves: 2
                    }).connect(reverb);

                    const clapSynth = new Tone.NoiseSynth({
                        noise: { type: "pink" },
                        envelope: { attack: 0.01, decay: 0.16, sustain: 0 }
                    }).connect(reverb);

                    const pianoSynth = new Tone.Synth({
                        oscillator: { type: "sine" },
                        envelope: { attack: 0.01, decay: 0.4, sustain: 0.3, release: 0.5 }
                    }).connect(reverb);

                    const guitarSynth = new Tone.Synth({
                        oscillator: { type: "sawtooth" },
                        envelope: { attack: 0.005, decay: 0.25, sustain: 0.2, release: 0.15 }
                    }).connect(distortion);

                    const trumpetSynth = new Tone.Synth({
                        oscillator: { type: "sawtooth" },
                        envelope: { attack: 0.04, decay: 0.2, sustain: 0.5, release: 0.2 }
                    }).connect(delay);

                    const violinSynth = new Tone.Synth({
                        oscillator: { type: "sine" },
                        envelope: { attack: 0.1, decay: 0.4, sustain: 0.7, release: 0.4 }
                    }).connect(reverb);

                    synthsRef.current = {
                        drums: { kick: kickSynth, snare: snareSynth, hihat: hihatSynth, clap: clapSynth },
                        subBass: subBassSynth,
                        synth: synthLead,
                        fx: fxSynth,
                        djembe: djembeSynth,
                        bass: bassSynth,
                        robot: robotSynth,
                        piano: pianoSynth,
                        guitar: guitarSynth,
                        trumpet: trumpetSynth,
                        violin: violinSynth,
                        masterGain, reverb, delay, distortion
                    };
                } catch(e) {}

                return () => {
                    try { Tone.Transport.stop(); Tone.Transport.cancel(); } catch(e) {}
                };
            }, []);

            React.useEffect(() => {
                Tone.Transport.bpm.value = bpm;
                Tone.Transport.cancel();

                if (playing) {
                    let stepCounter = 0;
                    loopRef.current = new Tone.Loop(time => {
                        let step = stepCounter % TOTAL_STEPS;
                        const bar = Math.floor(step / BAR_STEPS);
                        const sInBar = step % BAR_STEPS;

                        setCurrentStep(sInBar);
                        setCurrentBar(bar);

                        if (hitFlashActive && (sInBar === 0 || sInBar === 4 || sInBar === 8 || sInBar === 12)) {
                            const flashColors = ["border-cyan-400", "border-purple-500", "border-amber-400", "border-rose-500", "border-emerald-400"];
                            setFlashColor(flashColors[Math.floor(Math.random() * flashColors.length)]);
                        }

                        const syns = synthsRef.current;
                        if (!syns) return;

                        Object.keys(instrumentSteps).forEach(instKey => {
                            if (instKey === "voiceTrack") return;
                            const val = instrumentSteps[instKey][step];
                            if (!val) return;

                            try {
                                if (instKey === "drums") {
                                    if (typeof val === "object") {
                                        if (val.kick) syns.drums.kick.triggerAttackRelease("C1", "8n", time);
                                        if (val.snare) syns.drums.snare.triggerAttackRelease("8n", time);
                                        if (val.hihat) syns.drums.hihat.triggerAttackRelease("32n", time, 0.75);
                                        if (val.clap) syns.drums.clap.triggerAttackRelease("8n", time);
                                    }
                                } else if (instKey === "subBass") {
                                    syns.subBass.triggerAttackRelease(typeof val === "string" ? val : "C1", "8n", time);
                                } else if (instKey === "fx") {
                                    syns.fx.triggerAttackRelease("C6", "16n", time);
                                } else if (instKey === "bass") {
                                    syns.bass.triggerAttackRelease(typeof val === "string" ? val : "C2", "8n", time);
                                } else if (instKey === "djembe") {
                                    syns.djembe.triggerAttackRelease(typeof val === "string" ? val : "G2", "8n", time);
                                } else if (syns[instKey]) {
                                    syns[instKey].triggerAttackRelease(typeof val === "string" ? val : "C4", "8n", time);
                                }
                            } catch(e) {}
                        });

                        if (masterRecording) {
                            setMasterRecordBuffer(prev => [...prev, { step, bar, time }]);
                        }

                        stepCounter++;
                    }, "16n").start(0);

                    Tone.Transport.start();
                } else {
                    Tone.Transport.stop();
                }
            }, [playing, bpm, instrumentSteps, masterRecording, hitFlashActive]);

            const togglePlay = async () => {
                try { await Tone.start(); } catch(e) {}

                if (playing && masterRecording) {
                    setMasterRecording(false);
                    if (masterRecordBuffer.length > 0) {
                        const newRecord = {
                            id: Date.now(),
                            name: `録音セッション_${new Date().toLocaleTimeString()}`,
                            buffer: [...masterRecordBuffer],
                            date: new Date().toLocaleString()
                        };
                        setRecordedSessionsList(prev => [newRecord, ...prev]);
                        setStatus("💾 全体演奏の録音が完了し、永続保存リストに追加されました！");
                    }
                }
                setPlaying(!playing);
                setStatus(playing ? "停止しました" : `▶ 再生中 (BPM: ${bpm})`);
            };

            const toggleStep = (instKey, idx) => {
                setInstrumentSteps(prev => {
                    const currentArr = [...prev[instKey]];
                    if (instKey === "drums") {
                        const currentObj = currentArr[idx] || { kick: false, snare: false, hihat: false, clap: false };
                        const updatedObj = { ...currentObj, [selectedDrumPart]: !currentObj[selectedDrumPart] };
                        const hasAny = Object.values(updatedObj).some(Boolean);
                        currentArr[idx] = hasAny ? updatedObj : null;
                    } else {
                        currentArr[idx] = currentArr[idx] ? null : selectedNote;
                    }
                    return { ...prev, [instKey]: currentArr };
                });
            };

            const clearEntireComposition = () => {
                if (window.confirm("すべての作曲データをクリアしますか？")) {
                    const emptyArr = new Array(TOTAL_STEPS).fill(null);
                    setInstrumentSteps({
                        drums: [...emptyArr], subBass: [...emptyArr], synth: [...emptyArr],
                        fx: [...emptyArr], djembe: [...emptyArr], robot: [...emptyArr],
                        bass: [...emptyArr], piano: [...emptyArr], guitar: [...emptyArr],
                        trumpet: [...emptyArr], violin: [...emptyArr], voiceTrack: [...emptyArr],
                    });
                    setStatus("🗑️ 全データをクリアしました。");
                }
            };

            const playAndRecordRapidNote = (note) => {
                setSelectedNote(note);
                const syns = synthsRef.current;
                if (!syns) return;

                try {
                    if (selectedInstrument === "drums") {
                        if (selectedDrumPart === "kick") syns.drums.kick.triggerAttackRelease("C1", "8n");
                        else if (selectedDrumPart === "snare") syns.drums.snare.triggerAttackRelease("8n");
                        else if (selectedDrumPart === "hihat") syns.drums.hihat.triggerAttackRelease("32n");
                        else syns.drums.clap.triggerAttackRelease("8n");
                    } else if (syns[selectedInstrument]) {
                        syns[selectedInstrument].triggerAttackRelease(note, "8n");
                    }
                } catch(e) {}

                if (rapidRecordMode) {
                    const stepIdx = currentStep !== -1 ? (currentBar * BAR_STEPS + currentStep) : 0;
                    setInstrumentSteps(prev => {
                        const currentArr = [...prev[selectedInstrument]];
                        currentArr[stepIdx] = selectedInstrument === "drums" ? selectedDrumPart : note;
                        return { ...prev, [selectedInstrument]: currentArr };
                    });
                    setStatus(`🔴 連打記録: ${selectedInstrument} [${note}]`);
                }
            };

            const applyRandomDrumPattern = (patternId) => {
                setSelectedDrumPatternId(patternId);
                const arr = new Array(TOTAL_STEPS).fill(null);
                for (let s = 0; s < TOTAL_STEPS; s++) {
                    const sInBar = s % BAR_STEPS;
                    arr[s] = { kick: sInBar === 0 || sInBar === 8, snare: sInBar === 4 || sInBar === 12, hihat: sInBar % 2 === 0, clap: sInBar === 12 };
                }
                setInstrumentSteps(prev => ({ ...prev, drums: arr }));
                setStatus(`🥁 ドラムパターン【No.${patternId}】適用！`);
            };

            const generateAiMelody = (instKey) => {
                const arr = new Array(TOTAL_STEPS).fill(null);
                const scale = ["C4", "D4", "Eb4", "F4", "G4", "Ab4", "Bb4", "C5"];
                for (let s = 0; s < TOTAL_STEPS; s++) {
                    if ((s % BAR_STEPS) % 2 === 0 || Math.random() > 0.4) arr[s] = scale[Math.floor(Math.random() * scale.length)];
                }
                setInstrumentSteps(prev => ({ ...prev, [instKey]: arr }));
                setStatus(`✨ 【${instKey}】AIメロディ生成完了！`);
            };

            const saveCurrentSession = () => {
                setSavedSlots(prev => ({ ...prev, [slotName]: JSON.parse(JSON.stringify(instrumentSteps)) }));
                setStatus(`💾 セッション「${slotName}」保存完了！`);
            };

            const loadSession = (name) => {
                if (savedSlots[name]) {
                    setInstrumentSteps(JSON.parse(JSON.stringify(savedSlots[name])));
                    setStatus(`📂 セッション「${name}」ロード完了！`);
                }
            };

            const currentInstObj = INSTRUMENTS.find(i => i.id === selectedInstrument);

            return (
                <div className={`min-h-screen bg-slate-950 text-slate-100 flex flex-col text-xs font-sans select-none border-8 transition-all duration-75 ${flashColor}`}>
                    
                    {/* ヘッダー */}
                    <header className="bg-slate-900 border-b border-slate-800 px-3 py-2 flex items-center justify-between gap-2 sticky top-0 z-50 shadow-lg">
                        <span className="font-black text-sm bg-gradient-to-r from-cyan-400 via-purple-400 to-amber-500 bg-clip-text text-transparent truncate">
                            MIC VICTORY <span className="text-[10px] text-cyan-300 font-normal">v38.9 MULTI-VIZ</span>
                        </span>

                        <div className="flex items-center gap-1.5 flex-wrap">
                            <button onClick={togglePlay} className={`px-3 py-1 rounded font-bold text-xs shadow ${playing ? "bg-cyan-500 text-slate-950 animate-bounce" : "bg-purple-600 text-white"}`}>
                                {playing ? "■ 停止" : "▶ 再生"}
                            </button>
                            <button onClick={() => setHitFlashActive(!hitFlashActive)} className={`px-2.5 py-1 rounded font-bold text-[10px] border ${hitFlashActive ? "bg-purple-600 text-white border-white animate-pulse" : "bg-slate-800 text-purple-400 border-purple-800"}`}>
                                {hitFlashActive ? "✨ フラッシュON" : "⚪ フラッシュOFF"}
                            </button>
                            <button onClick={() => { setMasterRecording(!masterRecording); if(!masterRecording) setMasterRecordBuffer([]); }} className={`px-2.5 py-1 rounded font-bold text-[10px] border ${masterRecording ? "bg-red-600 text-white border-white animate-pulse" : "bg-slate-800 text-red-400 border-red-800"}`}>
                                {masterRecording ? "🔴 録音中" : "⏺️ 全体録音"}
                            </button>
                            <button onClick={clearEntireComposition} className="px-2.5 py-1 bg-red-950 text-red-300 font-bold rounded text-[10px] border border-red-800">
                                🗑️ クリア
                            </button>
                            <div className="flex items-center gap-1 bg-slate-950 px-2 py-0.5 rounded border border-slate-800">
                                <span className="text-[9px] text-slate-400">BPM</span>
                                <input type="number" value={bpm} onChange={e => setBpm(Number(e.target.value))} className="w-12 bg-slate-900 text-center font-bold text-cyan-400 rounded text-xs py-0.5" />
                            </div>
                        </div>
                    </header>

                    {/* タブナビゲーション */}
                    <nav className="bg-slate-900/90 border-b border-slate-800 px-2 py-1.5 flex gap-1 overflow-x-auto whitespace-nowrap">
                        {[
                            { id: "VISUALIZER", label: "🎧 マルチビジュアライザー" },
                            { id: "DUAL_EDIT", label: "🎹 18小節エディタ" },
                            { id: "RAP_RAPID", label: "🎤 ラップ連打" },
                            { id: "AI_AUTO_JAM", label: "🤖 AIメロディ" },
                            { id: "DRUM_SUBBASS_20", label: "🥁 ドラム20種" },
                            { id: "MEMORY_LIST", label: "💾 録音・セーブ" },
                            { id: "JACKET", label: "💿 ジャケット" },
                        ].map(t => (
                            <button key={t.id} onClick={() => setTab(t.id)} className={`px-3 py-1 rounded text-center font-bold transition-all shrink-0 ${tab === t.id ? "bg-cyan-500 text-slate-950 shadow" : "bg-slate-800/60 text-slate-400"}`}>
                                {t.label}
                            </button>
                        ))}
                    </nav>

                    <div className="bg-slate-900/50 px-3 py-1 text-[11px] text-cyan-400 border-b border-slate-900 truncate">
                        <span>💡 {status}</span>
                    </div>

                    <main className="p-2 flex flex-col gap-3 max-w-7xl mx-auto w-full">

                        {/* 🌟 マルチ・ミュージックビジュアライザー画面 */}
                        <div className="bg-slate-900 border border-cyan-500/50 rounded-lg p-4 flex flex-col gap-3 shadow-xl">
                            <div className="flex justify-between items-center flex-wrap gap-2">
                                <span className="text-xs font-bold text-cyan-400 flex items-center gap-1.5">
                                    <span className="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
                                    🎧 マルチ・ミュージックビジュアライザー (パターン多数切替)
                                </span>
                                <span className="text-[10px] text-slate-400">BPM: {bpm} | 小節: {currentBar + 1} / 18</span>
                            </div>

                            {/* パターン選択ボタン群 */}
                            <div className="grid grid-cols-3 sm:grid-cols-6 gap-1.5 bg-slate-950 p-2 rounded border border-slate-800">
                                {VISUALIZER_PATTERNS.map(pat => (
                                    <button 
                                        key={pat.id} 
                                        onClick={() => setSelectedVisualizerPattern(pat.id)}
                                        className={`py-1.5 px-2 rounded text-[10px] font-bold border transition-all ${selectedVisualizerPattern === pat.id ? "bg-cyan-500 text-slate-950 border-white shadow" : "bg-slate-900 text-slate-300 border-slate-800"}`}
                                    >
                                        {pat.label}
                                    </button>
                                ))}
                            </div>

                            {/* ビジュアル表示エリア */}
                            <div className="bg-slate-950 border border-slate-800 rounded-lg p-4 h-44 flex items-center justify-center relative overflow-hidden">
                                
                                {/* 1. クラシック・バー */}
                                {selectedVisualizerPattern === "bars" && (
                                    <div className="w-full h-full flex items-end justify-between gap-1">
                                        {Array.from({ length: 32 }).map((_, i) => {
                                            const h = playing ? Math.max(15, Math.sin((i + currentStep * 2) * 0.4) * 60 + Math.random() * 40) : 10;
                                            const colors = ["bg-cyan-500", "bg-purple-500", "bg-amber-500", "bg-rose-500", "bg-emerald-500"];
                                            return <div key={i} className={`flex-1 rounded-t transition-all duration-75 ${colors[i % colors.length]} ${playing ? "opacity-90 shadow-md shadow-cyan-500/50" : "opacity-30"}`} style={{ height: `${h}%` }}></div>;
                                        })}
                                    </div>
                                )}

                                {/* 2. ネオン・ウェーブ */}
                                {selectedVisualizerPattern === "neonWave" && (
                                    <div className="w-full h-full flex items-center justify-center relative">
                                        <div className="absolute inset-x-0 h-1 bg-gradient-to-r from-cyan-500 via-purple-500 to-rose-500 shadow-lg shadow-cyan-500/80 animate-pulse" style={{ transform: `scaleY(${playing ? Math.random() * 8 + 2 : 1})` }}></div>
                                        <div className="text-center font-black text-sm text-cyan-300 tracking-widest">{playing ? "♫ MIC VICTORY SOUND STREAM ♫" : "PRESS PLAY TO VIBE"}</div>
                                    </div>
                                )}

                                {/* 3. サイバー・レーダー */}
                                {selectedVisualizerPattern === "radar" && (
                                    <div className="w-32 h-32 rounded-full border-2 border-cyan-500/60 relative flex items-center justify-center shadow-lg shadow-cyan-500/30">
                                        <div className={`absolute inset-0 rounded-full border border-purple-500/50 ${playing ? "animate-ping opacity-75" : "opacity-20"}`}></div>
                                        <div className="w-3 h-3 rounded-full bg-cyan-400 shadow-md shadow-cyan-400"></div>
                                    </div>
                                )}

                                {/* 4. パルス・サークル */}
                                {selectedVisualizerPattern === "pulseCircle" && (
                                    <div className="flex gap-4 items-center">
                                        {Array.from({ length: 5 }).map((_, i) => {
                                            const scaleFactor = playing ? 1 + (Math.sin(currentStep + i) + 1) * 0.4 : 1;
                                            return (
                                                <div 
                                                    key={i} 
                                                    className="w-12 h-12 rounded-full bg-gradient-to-tr from-cyan-500 to-purple-600 shadow-lg transition-transform duration-75 flex items-center justify-center text-[10px] font-bold text-slate-950"
                                                    style={{ transform: `scale(${scaleFactor})` }}
                                                >
                                                    {i + 1}
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}

                                {/* 5. マトリックス・ドット */}
                                {selectedVisualizerPattern === "matrix" && (
                                    <div className="grid grid-cols-16 gap-2 w-full h-full p-2 items-center justify-center">
                                        {Array.from({ length: 48 }).map((_, i) => {
                                            const active = playing && (i + currentStep) % 3 === 0;
                                            return <div key={i} className={`aspect-square rounded-full transition-all duration-75 ${active ? "bg-emerald-400 shadow-md shadow-emerald-400 scale-125" : "bg-slate-900 opacity-40"}`}></div>;
                                        })}
                                    </div>
                                )}

                                {/* 6. レインボー・スペクトラム */}
                                {selectedVisualizerPattern === "spectrum" && (
                                    <div className="w-full h-full flex items-end gap-1 px-4">
                                        {Array.from({ length: 24 }).map((_, i) => {
                                            const h = playing ? Math.max(10, Math.cos(i + currentStep) * 50 + 50) : 10;
                                            return <div key={i} className="flex-1 rounded-t bg-gradient-to-t from-indigo-500 via-purple-500 to-pink-500 transition-all duration-75 shadow" style={{ height: `${h}%` }}></div>;
                                        })}
                                    </div>
                                )}

                            </div>
                        </div>

                        {tab === "DUAL_EDIT" && (
                            <div className="flex flex-col gap-3">
                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-2.5 shadow">
                                    <div className="flex justify-between items-center flex-wrap gap-2">
                                        <span className="text-xs font-bold text-cyan-400">① 楽器セレクト ＆ 🔥 連打記録モード</span>
                                        <div className="flex gap-2 flex-wrap">
                                            <button onClick={() => setRapidRecordMode(!rapidRecordMode)} className={`px-3 py-1 rounded font-bold text-[10px] shadow border ${rapidRecordMode ? "bg-red-600 text-white border-white animate-pulse" : "bg-slate-800 text-red-400 border-red-800"}`}>
                                                {rapidRecordMode ? "🔴 連打記録ON" : "⚪ 連打記録OFF"}
                                            </button>
                                            <button onClick={() => generateAiMelody(selectedInstrument)} className="px-2.5 py-1 bg-cyan-950 text-cyan-300 font-bold rounded text-[10px] border border-cyan-800">
                                                ✨ AIメロディ作成
                                            </button>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-12 gap-1.5">
                                        {INSTRUMENTS.map(inst => (
                                            <button key={inst.id} onClick={() => setSelectedInstrument(inst.id)} className={`py-2 px-1 rounded-lg font-bold text-[11px] transition-all border flex items-center justify-center gap-1 shadow ${selectedInstrument === inst.id ? `bg-gradient-to-r ${inst.color} border-white text-white ring-2 ring-white/30` : "bg-slate-950 border-slate-800 text-slate-400"}`}>
                                                {inst.label}
                                            </button>
                                        ))}
                                    </div>

                                    <div className="bg-slate-950 border border-slate-800 rounded p-2.5 flex flex-col gap-2">
                                        <div className="flex justify-between items-center">
                                            <span className="text-[11px] font-bold text-cyan-400">🎹 鍵盤演奏エディタ</span>
                                            <span className="text-[10px] text-slate-400">ボタン連打でリアルタイム発音！</span>
                                        </div>
                                        <div className="grid grid-cols-4 sm:grid-cols-8 gap-1.5">
                                            {NOTES.map(note => (
                                                <button key={note} onClick={() => playAndRecordRapidNote(note)} className="py-3 rounded font-bold flex flex-col items-center justify-center gap-0.5 border bg-slate-900 text-slate-200 border-slate-800 hover:bg-cyan-600 hover:text-slate-950 active:scale-95 transition-all">
                                                    <span className="text-[10px]">{SOLFEGE[note]}</span>
                                                    <span className="text-[8px] text-slate-400">{note}</span>
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3 shadow">
                                    <div className="flex items-center justify-between flex-wrap gap-2">
                                        <span className="text-xs font-bold text-cyan-400">② 18小節ステップグリッドエディタ ({currentInstObj.label})</span>
                                        <div className="flex gap-1 flex-wrap max-h-24 overflow-y-auto p-1 bg-slate-950 rounded border border-slate-800">
                                            {Array.from({ length: BARS }).map((_, b) => (
                                                <button key={b} onClick={() => setCurrentBar(b)} className={`px-2.5 py-1 rounded text-[10px] font-bold ${currentBar === b ? "bg-cyan-500 text-slate-950" : "bg-slate-800 text-slate-400"}`}>
                                                    小節{b + 1}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="overflow-x-auto bg-slate-950 p-3 rounded border border-slate-800">
                                        <div className="grid gap-1 min-w-[540px]" style={{ gridTemplateColumns: "repeat(16, minmax(0, 1fr))" }}>
                                            {Array.from({ length: BAR_STEPS }).map((_, i) => {
                                                const stepIdx = currentBar * BAR_STEPS + i;
                                                const stepVal = instrumentSteps[selectedInstrument][stepIdx];
                                                let isActive = !!stepVal;

                                                return (
                                                    <button key={i} onClick={() => toggleStep(selectedInstrument, stepIdx)} className={`aspect-[3/4] w-full rounded border flex flex-col items-center justify-center text-[9px] transition-all ${isActive ? "bg-gradient-to-t from-cyan-600 to-blue-600 border-white text-white font-bold shadow-md shadow-cyan-500/50" : "bg-slate-900 border-slate-800 text-slate-500"}`}>
                                                        <span className="font-bold text-[10px]">{i + 1}</span>
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {tab === "RAP_RAPID" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-4 flex flex-col gap-3">
                                <span className="text-xs font-bold text-rose-400">🎤 ラップ・ボーカル テンポ連打トリガー</span>
                                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                                    {RAP_PHRASES.map(phrase => (
                                        <button key={phrase} onClick={() => setStatus(`🔥 ラップ連打: [${phrase}]`)} className="py-4 bg-gradient-to-r from-rose-600 to-pink-700 text-white font-black rounded-lg shadow-lg active:scale-95 transition-all text-sm">
                                            🔥 {phrase}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        {tab === "AI_AUTO_JAM" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3">
                                <span className="text-xs font-bold text-cyan-400">🤖 全18小節 各楽器別AIメロディ生成スタジオ</span>
                                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                                    {INSTRUMENTS.map(inst => (
                                        <button key={inst.id} onClick={() => generateAiMelody(inst.id)} className="py-2.5 px-2 bg-slate-950 border border-slate-800 hover:border-cyan-500 rounded font-bold text-[11px] text-slate-200 flex flex-col items-center gap-1 shadow">
                                            <span>{inst.label}</span>
                                            <span className="text-[9px] text-cyan-400">✨ 生成する</span>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        {tab === "DRUM_SUBBASS_20" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3">
                                <div className="flex justify-between items-center">
                                    <span className="text-xs font-bold text-red-400">🥁 ドラム ランダムパターン 20種</span>
                                    <button onClick={() => applyRandomDrumPattern(Math.floor(Math.random() * 20) + 1)} className="px-2.5 py-1 bg-red-600 text-white rounded text-[10px] font-bold">🎲 ランダム</button>
                                </div>
                                <div className="grid grid-cols-5 md:grid-cols-10 gap-1.5 max-h-[160px] overflow-y-auto p-1 bg-slate-950 rounded border border-slate-800">
                                    {Array.from({ length: 20 }).map((_, idx) => (
                                        <button key={idx + 1} onClick={() => applyRandomDrumPattern(idx + 1)} className={`py-2 rounded font-bold text-[10px] border ${selectedDrumPatternId === idx + 1 ? "bg-red-600 text-white border-white" : "bg-slate-900 text-slate-300 border-slate-800"}`}>
                                            No.{idx + 1}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        {tab === "MEMORY_LIST" && (
                            <div className="flex flex-col gap-4">
                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3">
                                    <span className="text-xs font-bold text-cyan-400">💾 セッション保存・ロード</span>
                                    <div className="flex gap-2">
                                        <input type="text" value={slotName} onChange={e => setSlotName(e.target.value)} className="bg-slate-900 px-2 py-1 rounded text-slate-100 flex-1 border border-slate-800 text-xs" />
                                        <button onClick={saveCurrentSession} className="px-4 py-1 bg-cyan-600 text-slate-950 font-bold rounded text-xs">保存</button>
                                    </div>
                                    <div className="max-h-28 overflow-y-auto bg-slate-950 p-2 rounded border border-slate-800 flex flex-col gap-1">
                                        {Object.keys(savedSlots).length === 0 ? (
                                            <span className="text-[10px] text-slate-500 text-center py-2">保存されたセッションはありません。</span>
                                        ) : (
                                            Object.keys(savedSlots).map(name => (
                                                <div key={name} className="flex justify-between items-center bg-slate-900 p-2 rounded">
                                                    <span className="text-cyan-400 text-xs">{name}</span>
                                                    <button onClick={() => loadSession(name)} className="px-2 py-1 bg-cyan-600 text-slate-950 rounded text-[10px]">ロード</button>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>

                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3">
                                    <span className="text-xs font-bold text-red-400">🔴 録音記録リスト（自動保存＆永続化）</span>
                                    <div className="max-h-48 overflow-y-auto bg-slate-950 p-2 rounded border border-slate-800 flex flex-col gap-2">
                                        {recordedSessionsList.length === 0 ? (
                                            <span className="text-[11px] text-slate-500 text-center py-6">録音データがありません。上の「全体録音」ボタンから演奏を保存できます。</span>
                                        ) : (
                                            recordedSessionsList.map(rec => (
                                                <div key={rec.id} className="flex justify-between items-center bg-slate-900 p-2.5 rounded border border-slate-800">
                                                    <span className="text-rose-300 font-bold text-xs">{rec.name}</span>
                                                    <button onClick={() => { setPlayingSessionId(rec.id); setPlaying(true); }} className="px-3 py-1 bg-rose-600 text-white font-bold rounded text-[10px]">▶ 再生</button>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                        {tab === "JACKET" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-4 flex flex-col gap-4 items-center">
                                <span className="text-xs font-bold text-cyan-400 self-start">💿 ジャケット＆グラデーションテーマ選択</span>
                                <div className={`w-64 aspect-square bg-gradient-to-br ${jacketColor} rounded-xl shadow-2xl p-6 flex flex-col justify-between items-center text-center border-4 border-white/25 transition-all`}>
                                    <h2 className="text-lg font-black text-white">{jacketTitle}</h2>
                                    <span className="text-xs font-bold text-cyan-300">{jacketGenre}</span>
                                </div>
                                <div className="grid grid-cols-2 gap-2 w-full max-w-md bg-slate-950 p-3 rounded-lg border border-slate-800">
                                    {GRADIENT_PATTERNS.map(pat => (
                                        <button key={pat.id} onClick={() => setJacketColor(pat.class)} className={`py-2 px-3 rounded text-[10px] font-bold border bg-gradient-to-r ${pat.class} text-white shadow`}>
                                            {pat.label}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<MasterSynthApp/>);
    </script>
</body>
</html>
