<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIC VICTORY - MASTER SYNTHESIZER v39.0 (MICVICTORIES LAND BAND & INDEPENDENT AUDIO)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans select-none pb-20 overflow-x-hidden">
    <div id="root">
        <div class="flex items-center justify-center h-screen text-amber-400 font-bold text-sm animate-pulse">
            読み込み中... (MICVICTORIES LAND v39.0 - BAND & INDEPENDENT AUDIO)
        </div>
    </div>

    <script type="text/babel">
        try {
            function MasterSynthApp() {
                const [tab, setTab] = React.useState("DUAL_EDIT");
                const [playing, setPlaying] = React.useState(false);
                const [flashColor, setFlashColor] = React.useState("border-amber-600");
                const [bpm, setBpm] = React.useState(112);
                const [currentBar, setCurrentBar] = React.useState(0);
                const [currentStep, setCurrentStep] = React.useState(-1);
                const [status, setStatus] = React.useState("🏰 MICVICTORIES LAND: バンドメロディ＆全体音響個別調整完全同期 v39.0");

                const BARS = 8;
                const BAR_STEPS = 16;
                const TOTAL_STEPS = BARS * BAR_STEPS;

                const [selectedInstrument, setSelectedInstrument] = React.useState("bandGuitar");
                const [register, setRegister] = React.useState("mid"); 
                const [selectedNote, setSelectedNote] = React.useState("C3");
                const [selectedBandPart, setSelectedBandPart] = React.useState("leadGuitar");
                const [selectedRapPart, setSelectedRapPart] = React.useState("landAnthem01");

                // 全体音響個別パラメータ (各パートのボリューム・エフェクト)
                const [audioMixer, setAudioMixer] = React.useState({
                    bandGuitar: { volume: 0, pan: 0, reverb: 0.4 },
                    bandBass: { volume: 2, pan: 0, reverb: 0.2 },
                    bandDrums: { volume: 3, pan: 0, reverb: 0.3 },
                    piano: { volume: -1, pan: -0.2, reverb: 0.5 },
                    violin: { volume: -2, pan: 0.2, reverb: 0.6 },
                    synth: { volume: -1, pan: 0, reverb: 0.4 },
                    trumpet: { volume: 1, pan: -0.3, reverb: 0.5 },
                    rapVocals: { volume: 3, pan: 0, reverb: 0.3 }
                });

                const [slotName, setSlotName] = React.useState("MICVICTORIES_LAND_01");
                const [savedSlots, setSavedSlots] = React.useState({});

                const [jacketTitle, setJacketTitle] = React.useState("MICVICTORIES LAND: BAND & MELODY");
                const [jacketGenre, setJacketGenre] = React.useState("THEME PARK ROCK / SOUL POP / BAND MELODY");
                const [jacketColor, setJacketColor] = React.useState("from-amber-900 via-purple-950 to-slate-950");

                const [instrumentSteps, setInstrumentSteps] = React.useState({
                    bandGuitar: new Array(TOTAL_STEPS).fill(null),
                    bandBass: new Array(TOTAL_STEPS).fill(null),
                    bandDrums: new Array(TOTAL_STEPS).fill(null),
                    piano: new Array(TOTAL_STEPS).fill(null),
                    violin: new Array(TOTAL_STEPS).fill(null),
                    synth: new Array(TOTAL_STEPS).fill(null),
                    trumpet: new Array(TOTAL_STEPS).fill(null),
                    rapVocals: new Array(TOTAL_STEPS).fill(null),
                });

                const channelsRef = React.useRef({});
                const synthsRef = React.useRef(null);
                const loopRef = React.useRef(null);

                const NOTES_MAP = {
                    low: ["C1", "D1", "E1", "F1", "G1", "A1", "B1", "C2"],
                    mid: ["C2", "D2", "E2", "F2", "G2", "A2", "B2", "C3", "D3", "E3", "F3", "G3", "A3", "B3", "C4"],
                    high: ["C3", "D3", "E3", "F3", "G3", "A3", "B3", "C4", "D4", "E4", "F4", "G4", "A4", "B4", "C5"]
                };
                const NOTES = NOTES_MAP[register];

                const SOLFEGE = { 
                    "C1": "ド", "D1": "レ", "E1": "ミ", "F1": "ファ", "G1": "ソ", "A1": "ラ", "B1": "シ", 
                    "C2": "ド", "D2": "レ", "E2": "ミ", "F2": "ファ", "G2": "ソ", "A2": "ラ", "B2": "シ", 
                    "C3": "ド", "D3": "レ", "E3": "ミ", "F3": "ファ", "G3": "ソ", "A3": "ラ", "B3": "シ", 
                    "C4": "高ド", "D4": "高レ", "E4": "高ミ", "F4": "高ファ", "G4": "高ソ", "A4": "高ラ", "B4": "高シ", "C5": "超ド" 
                };

                const INSTRUMENTS = [
                    { id: "bandGuitar", label: "🎸 バンドギター", color: "from-amber-700 to-red-900" },
                    { id: "bandBass", label: "🎸 バンドベース", color: "from-orange-800 to-amber-950" },
                    { id: "bandDrums", label: "🥁 バンドドラム", color: "from-red-900 to-rose-950" },
                    { id: "piano", label: "🎹 ランドピアノ", color: "from-slate-700 to-slate-900" },
                    { id: "violin", label: "🎻 ストリングス", color: "from-emerald-800 to-teal-950" },
                    { id: "synth", label: "🎹 シンセメロ", color: "from-blue-900 to-indigo-950" },
                    { id: "trumpet", label: "🎺 トランペット", color: "from-yellow-600 to-amber-800" },
                    { id: "rapVocals", label: "🎤 ランドボーカル", color: "from-purple-800 to-pink-950" },
                ];

                const BAND_PARTS = [
                    { id: "leadGuitar", label: "01. リードギター" }, { id: "rhythmGuitar", label: "02. リズムカッティング" },
                    { id: "powerChord", label: "03. パワーコード" }, { id: "cleanArpeggio", label: "04. クリーンアルペジオ" }
                ];

                const BAND_BASS_PARTS = [
                    { id: "pickBass", label: "01. ロックピックベース" }, { id: "slapBass", label: "02. ファンキースラップ" },
                    { id: "subBass", label: "03. ディープサブベース" }, { id: "walkingBass", label: "04. ウォーキングベース" }
                ];

                const BAND_DRUM_PARTS = [
                    { id: "rockKick", label: "01. ロックキック" }, { id: "rockSnare", label: "02. バックビートスネア" },
                    { id: "openHihat", label: "03. オープンハイハット" }, { id: "crashCymbal", label: "04. クラッシュシンバル" }
                ];

                const LAND_RAP_PARTS = [
                    { id: "landAnthem01", label: "01. ランド・アンセム" }, { id: "landPop02", label: "02. ソウルポップ・コーラス" },
                    { id: "landRock03", label: "03. ロックアンサーボーカル" }, { id: "landVictory04", label: "04. ヴィクトリー歓声" }
                ];

                // 音響初期化 & 個別ミキサーチャンネル構築
                React.useEffect(() => {
                    try {
                        const masterLimiter = new Tone.Limiter(-0.2).toDestination();
                        const masterReverb = new Tone.Reverb({ roomSize: 0.7, wet: 0.25 }).connect(masterLimiter);
                        const masterComp = new Tone.Compressor({ threshold: -16, ratio: 4 }).connect(masterReverb);

                        const chans = {};
                        const syns = {};

                        Object.keys(audioMixer).forEach(instKey => {
                            const mix = audioMixer[instKey];
                            const channel = new Tone.Channel({
                                volume: mix.volume,
                                pan: mix.pan
                            }).connect(masterComp);
                            chans[instKey] = channel;

                            if (instKey === "bandGuitar") {
                                syns.bandGuitar = new Tone.PolySynth(Tone.Synth, {
                                    oscillator: { type: "sawtooth" },
                                    envelope: { attack: 0.02, decay: 0.3, sustain: 0.5, release: 0.3 }
                                }).connect(channel);
                            } else if (instKey === "bandBass") {
                                const bassPartsObj = {};
                                BAND_BASS_PARTS.forEach(p => {
                                    bassPartsObj[p.id] = new Tone.MonoSynth({
                                        oscillator: { type: "triangle" },
                                        envelope: { attack: 0.02, decay: 0.5, sustain: 0.7, release: 0.4 }
                                    }).connect(channel);
                                });
                                syns.bandBass = bassPartsObj;
                            } else if (instKey === "bandDrums") {
                                const drumPartsObj = {};
                                BAND_DRUM_PARTS.forEach(p => {
                                    drumPartsObj[p.id] = new Tone.MembraneSynth({
                                        pitchDecay: 0.05, octaves: 4,
                                        oscillator: { type: "sine" },
                                        envelope: { attack: 0.001, decay: 0.4, sustain: 0.01, release: 0.2 }
                                    }).connect(channel);
                                });
                                syns.bandDrums = drumPartsObj;
                            } else if (["piano", "violin", "synth", "trumpet"].includes(instKey)) {
                                syns[instKey] = new Tone.Synth({
                                    oscillator: { type: instKey === "piano" ? "sine" : "sawtooth" },
                                    envelope: { attack: 0.03, decay: 0.4, sustain: 0.6, release: 0.3 }
                                }).connect(channel);
                            } else if (instKey === "rapVocals") {
                                const rapPartsObj = {};
                                LAND_RAP_PARTS.forEach(p => {
                                    rapPartsObj[p.id] = new Tone.Synth({
                                        oscillator: { type: "triangle" },
                                        envelope: { attack: 0.02, decay: 0.3, sustain: 0.4, release: 0.2 }
                                    }).connect(channel);
                                });
                                syns.rapVocals = rapPartsObj;
                            }
                        });

                        channelsRef.current = chans;
                        synthsRef.current = syns;
                    } catch (e) {
                        console.error("Audio Init Error:", e);
                    }

                    return () => {
                        Tone.Transport.stop();
                        Tone.Transport.cancel();
                    };
                }, []);

                // ミキサーパラメータ変更時のリアルタイム反映
                const updateMixerParam = (instKey, paramName, value) => {
                    const newMixer = {
                        ...audioMixer,
                        [instKey]: { ...audioMixer[instKey], [paramName]: value }
                    };
                    setAudioMixer(newMixer);

                    const chan = channelsRef.current[instKey];
                    if (chan) {
                        if (paramName === "volume") chan.volume.value = value;
                        if (paramName === "pan") chan.pan.value = value;
                    }
                };

                // 演奏ループ
                React.useEffect(() => {
                    Tone.Transport.bpm.value = bpm;
                    Tone.Transport.cancel();

                    if (playing) {
                        let stepCounter = 0;
                        loopRef.current = new Tone.Loop(time => {
                            let step = stepCounter % TOTAL_STEPS;
                            const bar = Math.floor(step / BAR_STEPS);
                            const sInBar = step % BAR_STEPS;

                            setCurrentStep(sInBar);
                            setCurrentBar(bar);

                            if (sInBar % 2 === 0) {
                                setFlashColor("border-amber-500");
                            }

                            const syns = synthsRef.current;
                            if (!syns) return;

                            Object.keys(instrumentSteps).forEach(instKey => {
                                const val = instrumentSteps[instKey][step];
                                if (!val) return;

                                if (instKey === "bandDrums") {
                                    if (typeof val === "object") {
                                        Object.keys(val).forEach(partKey => {
                                            if (val[partKey] && syns.bandDrums[partKey]) {
                                                syns.bandDrums[partKey].triggerAttackRelease("C1", "8n", time);
                                            }
                                        });
                                    }
                                } else if (instKey === "bandBass") {
                                    if (typeof val === "object") {
                                        Object.keys(val).forEach(partKey => {
                                            if (val[partKey] && syns.bandBass[partKey]) {
                                                syns.bandBass[partKey].triggerAttackRelease("C1", "4n", time);
                                            }
                                        });
                                    }
                                } else if (instKey === "rapVocals") {
                                    if (typeof val === "object") {
                                        Object.keys(val).forEach(partKey => {
                                            if (val[partKey] && syns.rapVocals[partKey]) {
                                                syns.rapVocals[partKey].triggerAttackRelease("E3", "4n", time);
                                            }
                                        });
                                    }
                                } else if (["bandGuitar", "piano", "violin", "synth", "trumpet"].includes(instKey)) {
                                    const noteToPlay = typeof val === "string" ? val : "C3";
                                    if (syns[instKey]) {
                                        syns[instKey].triggerAttackRelease(noteToPlay, "4n", time);
                                    }
                                }
                            });

                            stepCounter++;
                        }, "16n").start(0);

                        Tone.Transport.start();
                    } else {
                        Tone.Transport.stop();
                    }
                }, [playing, bpm, instrumentSteps]);

                const togglePlay = async () => {
                    await Tone.start();
                    setPlaying(!playing);
                    setStatus(playing ? "⏸️ 停止しました" : `▶ 再生中 (BPM: ${bpm}) [MICVICTORIES LAND BAND]`);
                };

                const toggleStep = (instKey, idx) => {
                    setInstrumentSteps(prev => {
                        const currentArr = [...prev[instKey]];
                        if (instKey === "bandDrums") {
                            const currentObj = currentArr[idx] || {};
                            const updatedObj = { ...currentObj, [selectedBandPart]: !currentObj[selectedBandPart] };
                            currentArr[idx] = Object.values(updatedObj).some(Boolean) ? updatedObj : null;
                        } else if (instKey === "bandBass") {
                            const currentObj = currentArr[idx] || {};
                            const updatedObj = { ...currentObj, [selectedBandPart]: !currentObj[selectedBandPart] };
                            currentArr[idx] = Object.values(updatedObj).some(Boolean) ? updatedObj : null;
                        } else if (instKey === "rapVocals") {
                            const currentObj = currentArr[idx] || {};
                            const updatedObj = { ...currentObj, [selectedRapPart]: !currentObj[selectedRapPart] };
                            currentArr[idx] = Object.values(updatedObj).some(Boolean) ? updatedObj : null;
                        } else {
                            currentArr[idx] = currentArr[idx] === selectedNote ? null : selectedNote;
                        }
                        return { ...prev, [instKey]: currentArr };
                    });
                };

                const playNoteLive = (instKey, note) => {
                    setSelectedNote(note);
                    const syns = synthsRef.current;
                    if (!syns) return;

                    if (instKey === "bandBass") {
                        if (syns.bandBass[selectedBandPart]) syns.bandBass[selectedBandPart].triggerAttackRelease("C1", "4n");
                    } else if (instKey === "bandDrums") {
                        if (syns.bandDrums[selectedBandPart]) syns.bandDrums[selectedBandPart].triggerAttackRelease("C1", "8n");
                    } else if (instKey === "rapVocals") {
                        if (syns.rapVocals[selectedRapPart]) syns.rapVocals[selectedRapPart].triggerAttackRelease("E3", "4n");
                    } else if (syns[instKey]) {
                        syns[instKey].triggerAttackRelease(note, "4n");
                    }
                };

                const clearAllSteps = () => {
                    const emptyMap = {};
                    Object.keys(instrumentSteps).forEach(k => { emptyMap[k] = new Array(TOTAL_STEPS).fill(null); });
                    setInstrumentSteps(emptyMap);
                    setStatus("🧹 すべてクリアしました");
                };

                // バンド・ソウルポップス用コード進行 AI自動生成
                const generateAIForInstrument = (targetInst) => {
                    const newSteps = JSON.parse(JSON.stringify(instrumentSteps));
                    const arr = new Array(TOTAL_STEPS).fill(null);
                    const notesList = NOTES_MAP[register];

                    // ランドテーマ曲向け王道コード進行 (C -> Am -> F -> G)
                    const chordProgression = [0, 5, 3, 4];

                    for (let s = 0; s < TOTAL_STEPS; s++) {
                        const sInBar = s % BAR_STEPS;
                        const barIdx = Math.floor(s / BAR_STEPS);

                        if (targetInst === "bandDrums") {
                            arr[s] = {
                                rockKick: sInBar === 0 || sInBar === 8 || sInBar === 10,
                                rockSnare: sInBar === 4 || sInBar === 12,
                                openHihat: sInBar % 2 === 0,
                                crashCymbal: sInBar === 0 && barIdx % 2 === 0
                            };
                        } else if (targetInst === "bandBass") {
                            if (sInBar % 4 === 0) {
                                arr[s] = { [selectedBandPart]: true };
                            }
                        } else if (targetInst === "rapVocals") {
                            if (sInBar === 2 || sInBar === 10 || sInBar === 14) {
                                arr[s] = { [selectedRapPart]: true };
                            }
                        } else if (["bandGuitar", "piano", "violin", "synth", "trumpet"].includes(targetInst)) {
                            if (sInBar % 4 === 0) {
                                const baseIdx = chordProgression[barIdx % chordProgression.length];
                                arr[s] = notesList[baseIdx % notesList.length];
                            } else if (sInBar === 6 || sInBar === 10) {
                                const baseIdx = chordProgression[barIdx % chordProgression.length] + 2;
                                arr[s] = notesList[baseIdx % notesList.length];
                            }
                        }
                    }

                    newSteps[targetInst] = arr;
                    setInstrumentSteps(newSteps);
                    setStatus(`🏰 ✨ 【${targetInst}】のバンド＆メロディAIフレーズを生成しました！`);
                };

                const generateAllAI = () => {
                    Object.keys(instrumentSteps).forEach(inst => generateAIForInstrument(inst));
                    setStatus("🌟 MICVICTORIES LAND 全バンド・メロディAI一括自動生成完了！");
                };

                const saveCurrentSession = () => {
                    setSavedSlots({ ...savedSlots, [slotName]: JSON.parse(JSON.stringify(instrumentSteps)) });
                    setStatus(`💾 セッション「${slotName}」を保存しました！`);
                };

                const loadSession = (name) => {
                    if (savedSlots[name]) {
                        setInstrumentSteps(JSON.parse(JSON.stringify(savedSlots[name])));
                        setStatus(`📂 セッション「${name}」をロードしました！`);
                    }
                };

                const currentInstObj = INSTRUMENTS.find(i => i.id === selectedInstrument);

                return (
                    <div className={`min-h-screen bg-slate-950 text-slate-100 flex flex-col text-xs font-sans select-none border-8 transition-all duration-75 ${flashColor}`}>
                        <header className="bg-slate-900 border-b border-slate-800 px-3 py-2 flex items-center justify-between gap-2 sticky top-0 z-50 shadow-lg">
                            <span className="font-black text-sm bg-gradient-to-r from-amber-400 via-orange-400 to-rose-400 bg-clip-text text-transparent">
                                MICVICTORIES LAND <span className="text-[10px] text-amber-300 font-normal">v39.0 BAND & INDEPENDENT AUDIO</span>
                            </span>

                            <div className="flex items-center gap-1.5 flex-wrap">
                                <button onClick={togglePlay} className={`px-3 py-1 rounded font-bold text-xs shadow ${playing ? "bg-amber-600 text-white animate-pulse" : "bg-orange-700 text-white"}`}>
                                    {playing ? "■ 停止" : "▶ 再生"}
                                </button>
                                <button onClick={clearAllSteps} className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded font-bold text-xs border border-slate-700">
                                    🧹 クリア
                                </button>
                                <div className="flex items-center gap-1 bg-slate-950 px-2 py-0.5 rounded border border-slate-800">
                                    <span className="text-[9px] text-slate-400">BPM</span>
                                    <input type="number" value={bpm} onChange={e => setBpm(Math.max(40, Math.min(200, Number(e.target.value))))} className="w-12 bg-slate-900 text-center font-bold text-amber-400 rounded text-xs py-0.5" />
                                </div>
                            </div>
                        </header>

                        <nav className="bg-slate-900/90 border-b border-slate-800 px-2 py-1.5 flex gap-1 overflow-x-auto">
                            {[
                                { id: "DUAL_EDIT", label: "🎸 バンド＆メロディ エディタ" },
                                { id: "MIXER", label: "🎚️ 全体音響個別ミキサー" },
                                { id: "MEMORY_LIST", label: "💾 セッション保存" },
                                { id: "JACKET", label: "💿 ジャケット" },
                            ].map(t => (
                                <button key={t.id} onClick={() => setTab(t.id)} className={`px-3 py-1 rounded text-center font-bold transition-all shrink-0 ${tab === t.id ? "bg-amber-600 text-white shadow" : "bg-slate-800/60 text-slate-400"}`}>
                                    {t.label}
                                </button>
                            ))}
                        </nav>

                        <div className="bg-slate-900/80 border-b border-slate-800 px-3 py-1 flex items-center justify-between flex-wrap gap-1">
                            <span className="text-[11px] text-amber-300">💡 {status}</span>
                            <button onClick={generateAllAI} className="px-3 py-1 bg-gradient-to-r from-amber-600 to-orange-700 hover:from-amber-500 hover:to-orange-600 text-white font-bold rounded text-[10px] shadow">
                                ✨ バンド＆メロディAI一括自動生成
                            </button>
                        </div>

                        <main className="p-2 flex flex-col gap-3">
                            {tab === "DUAL_EDIT" && (
                                <div className="flex flex-col gap-3">
                                    {/* 楽器セレクト */}
                                    <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3 shadow">
                                        <div className="flex justify-between items-center flex-wrap gap-2">
                                            <span className="text-xs font-bold text-amber-300">① 楽器セレクト (バンドギター・ベース・ドラム・メロディ)</span>
                                        </div>

                                        <div className="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-8 gap-1.5">
                                            {INSTRUMENTS.map(inst => (
                                                <div key={inst.id} className="flex flex-col gap-1">
                                                    <button onClick={() => setSelectedInstrument(inst.id)} className={`py-2 px-1 rounded-lg font-bold text-[10px] transition-all border flex items-center justify-center gap-1 shadow ${selectedInstrument === inst.id ? `bg-gradient-to-r ${inst.color} border-white text-white ring-2 ring-white/30` : "bg-slate-950 border-slate-800 text-slate-400"}`}>
                                                        {inst.label}
                                                    </button>
                                                    <button onClick={() => generateAIForInstrument(inst.id)} className="py-1 px-1 bg-slate-800 hover:bg-amber-700 text-amber-200 rounded font-bold text-[9px] border border-slate-700 transition-all text-center">
                                                        🤖 AI作成
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    {/* 音域切り替え */}
                                    {["bandGuitar", "piano", "violin", "synth", "trumpet"].includes(selectedInstrument) && (
                                        <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-2 shadow">
                                            <div className="flex justify-between items-center">
                                                <span className="text-xs font-bold text-amber-300">🎵 バンドメロディ音域切り替え</span>
                                                <span className="text-[10px] text-amber-300 font-bold">現在の選択: {register.toUpperCase()}</span>
                                            </div>
                                            <div className="grid grid-cols-3 gap-2">
                                                {[
                                                    { id: "low", label: "📉 低音 (Low)" },
                                                    { id: "mid", label: "🎹 中音 (Mid)" },
                                                    { id: "high", label: "📈 高音 (High)" },
                                                ].map(reg => (
                                                    <button key={reg.id} onClick={() => setRegister(reg.id)} className={`py-2 rounded font-bold text-xs border transition-all ${register === reg.id ? "bg-amber-600 text-white border-white shadow" : "bg-slate-950 text-slate-400 border-slate-800"}`}>
                                                        {reg.label}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    {/* ボーカルパーツ選択 */}
                                    {selectedInstrument === "rapVocals" && (
                                        <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-2 shadow">
                                            <span className="text-xs font-bold text-purple-300">🎤 ランドボーカル・コーラス選択</span>
                                            <div className="grid grid-cols-2 sm:grid-cols-4 gap-1.5 p-1 bg-slate-950 rounded border border-slate-800">
                                                {LAND_RAP_PARTS.map(part => (
                                                    <button key={part.id} onClick={() => setSelectedRapPart(part.id)} className={`px-2 py-1.5 rounded font-bold text-[10px] text-left transition-all border ${selectedRapPart === part.id ? "bg-purple-700 text-white border-white shadow" : "bg-slate-900 text-slate-300 border-slate-800 hover:bg-slate-800"}`}>
                                                        {part.label}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    {/* 手動ドレミファ鍵盤 */}
                                    {["bandGuitar", "piano", "violin", "synth", "trumpet"].includes(selectedInstrument) && (
                                        <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-2 shadow">
                                            <span className="text-xs font-bold text-emerald-300">🎹 手動ドレミファ鍵盤 (バンドメロディ演奏)</span>
                                            <div className="grid grid-cols-8 sm:grid-cols-15 gap-1 bg-slate-950 p-2 rounded border border-slate-800">
                                                {NOTES.map(note => (
                                                    <button key={note} onClick={() => playNoteLive(selectedInstrument, note)} className={`py-2 px-1 rounded font-bold text-[10px] flex flex-col items-center justify-center transition-all border ${selectedNote === note ? "bg-cyan-600 text-white border-white shadow" : "bg-slate-900 text-slate-300 border-slate-800 hover:bg-slate-800"}`}>
                                                        <span>{SOLFEGE[note] || note}</span>
                                                        <span className="text-[8px] text-slate-400">{note}</span>
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    {/* グリッドシーケンサー */}
                                    <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3 shadow">
                                        <div className="flex justify-between items-center">
                                            <span className="text-xs font-bold text-cyan-300">② グリッド編集 ({currentInstObj.label}) - 小節: {currentBar + 1} / 8</span>
                                            <div className="flex gap-1">
                                                {Array.from({ length: BARS }).map((_, b) => (
                                                    <button key={b} onClick={() => setCurrentBar(b)} className={`w-7 h-7 rounded-full text-xs font-bold ${currentBar === b ? "bg-amber-600 text-white" : "bg-slate-800 text-slate-400"}`}>{b + 1}</button>
                                                ))}
                                            </div>
                                        </div>

                                        <div className="flex flex-col gap-2 bg-slate-950 p-3 rounded border border-slate-800">
                                            <div className="overflow-x-auto py-1">
                                                <div className="grid gap-1 min-w-[540px]" style={{ gridTemplateColumns: "repeat(16, minmax(0, 1fr))" }}>
                                                    {Array.from({ length: BAR_STEPS }).map((_, i) => {
                                                        const stepIdx = currentBar * BAR_STEPS + i;
                                                        const stepVal = instrumentSteps[selectedInstrument][stepIdx];
                                                        const isCurrentPlay = playing && currentStep === i;
                                                        
                                                        let isActive = false;
                                                        if (selectedInstrument === "bandDrums") {
                                                            isActive = stepVal && stepVal[selectedBandPart];
                                                        } else if (selectedInstrument === "bandBass") {
                                                            isActive = stepVal && stepVal[selectedBandPart];
                                                        } else if (selectedInstrument === "rapVocals") {
                                                            isActive = stepVal && stepVal[selectedRapPart];
                                                        } else {
                                                            isActive = !!stepVal;
                                                        }

                                                        return (
                                                            <button key={i} onClick={() => toggleStep(selectedInstrument, stepIdx)} className={`aspect-[3/4] w-full rounded border flex flex-col items-center justify-center text-[9px] transition-all ${isActive ? "bg-gradient-to-t from-amber-600 to-orange-600 border-white text-white font-bold shadow-md shadow-amber-900/50 scale-105" : "bg-slate-900 border-slate-800 text-slate-500"} ${isCurrentPlay ? "ring-2 ring-cyan-400" : ""}`}>
                                                                <span className="font-bold text-[10px]">{i + 1}</span>
                                                                {stepVal && ["bandGuitar", "piano", "violin", "synth", "trumpet"].includes(selectedInstrument) && (
                                                                    <span className="text-[8px] text-amber-200">{SOLFEGE[stepVal] || ""}</span>
                                                                )}
                                                            </button>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {tab === "MIXER" && (
                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3">
                                    <span className="text-xs font-bold text-amber-300">🎚️ 全体音響個別ミキサー (パート別ボリューム＆パン調整)</span>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-2 bg-slate-950 p-3 rounded border border-slate-800">
                                        {Object.keys(audioMixer).map(instKey => {
                                            const instObj = INSTRUMENTS.find(i => i.id === instKey);
                                            const mix = audioMixer[instKey];
                                            return (
                                                <div key={instKey} className="bg-slate-900 border border-slate-800 rounded p-2.5 flex flex-col gap-2 shadow">
                                                    <span className="font-bold text-xs text-amber-400">{instObj ? instObj.label : instKey}</span>
                                                    
                                                    <div className="flex flex-col gap-0.5">
                                                        <div className="flex justify-between text-[9px] text-slate-400">
                                                            <span>ボリューム</span>
                                                            <span className="text-amber-300 font-bold">{mix.volume} dB</span>
                                                        </div>
                                                        <input type="range" min="-20" max="10" step="1" value={mix.volume} onChange={e => updateMixerParam(instKey, "volume", Number(e.target.value))} className="accent-amber-500 cursor-pointer" />
                                                    </div>

                                                    <div className="flex flex-col gap-0.5">
                                                        <div className="flex justify-between text-[9px] text-slate-400">
                                                            <span>ステレオ・パン (左右)</span>
                                                            <span className="text-cyan-300 font-bold">{mix.pan}</span>
                                                        </div>
                                                        <input type="range" min="-1" max="1" step="0.1" value={mix.pan} onChange={e => updateMixerParam(instKey, "pan", Number(e.target.value))} className="accent-cyan-500 cursor-pointer" />
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            )}

                            {tab === "MEMORY_LIST" && (
                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3">
                                    <span className="text-xs font-bold text-emerald-300">💾 セッション保存・リスト切替ロード</span>
                                    <div className="flex gap-2 bg-slate-950 p-3 rounded border border-slate-800">
                                        <input type="text" value={slotName} onChange={e => setSlotName(e.target.value)} className="bg-slate-900 px-2 py-1 rounded text-slate-100 flex-1 border border-slate-800" />
                                        <button onClick={saveCurrentSession} className="px-4 py-1 bg-amber-600 text-white font-bold rounded">保存</button>
                                    </div>
                                    <div className="flex flex-col gap-2 bg-slate-950 p-3 rounded border border-slate-800 max-h-[200px] overflow-y-auto">
                                        {Object.keys(savedSlots).length === 0 && (
                                            <span className="text-[11px] text-slate-500 text-center py-2">保存されたセッションはありません</span>
                                        )}
                                        {Object.keys(savedSlots).map(name => (
                                            <div key={name} className="flex justify-between items-center bg-slate-900 p-2 rounded border border-slate-800">
                                                <span className="font-bold text-amber-300 text-xs">{name}</span>
                                                <button onClick={() => loadSession(name)} className="px-2 py-1 bg-amber-600 text-white rounded text-[10px] font-bold">切替ロード</button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {tab === "JACKET" && (
                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-4 flex flex-col gap-4 items-center">
                                    <span className="text-xs font-bold text-cyan-300 self-start">💿 ジャケット＆リリース</span>
                                    <div className={`w-full max-w-sm aspect-square bg-gradient-to-br ${jacketColor} rounded-xl shadow-2xl p-6 flex flex-col justify-between items-center text-center border-4 border-white/20`}>
                                        <span className="font-black text-xs tracking-widest text-white/80">MICVICTORIES LAND RECORDS</span>
                                        <div className="flex flex-col gap-1">
                                            <h2 className="text-xl font-black text-white">{jacketTitle}</h2>
                                            <span className="text-xs font-bold text-amber-300">{jacketGenre}</span>
                                        </div>
                                        <span className="text-[9px] text-white/70">PRODUCED BY MIKI TAKABE</span>
                                    </div>
                                </div>
                            )}
                        </main>
                    </div>
                );
            }

            const rootElement = document.getElementById('root');
            if (rootElement) {
                ReactDOM.createRoot(rootElement).render(<MasterSynthApp />);
            }
        } catch (err) {
            document.getElementById('root').innerHTML = `
                <div class="p-6 text-red-400 font-bold">
                    <h2 class="text-lg mb-2">⚠️ 起動エラー</h2>
                    <p class="text-xs text-slate-300">${err.message}</p>
                </div>
            `;
        }
    </script>
</body>
</html>
