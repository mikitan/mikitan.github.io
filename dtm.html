<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Black Contemporary & Popping Soul Ultimate DAW</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans select-none pb-32">
    <div id="root"></div>

    <script type="text/babel">
        function BlackContemporaryApp() {
            const [tab, setTab] = React.useState("EDIT");
            const [playing, setPlaying] = React.useState(false);
            
            const [flashColor, setFlashColor] = React.useState("border-amber-500");
            const FLASH_COLORS = [
                "border-amber-500", "border-yellow-400", "border-orange-500", 
                "border-purple-600", "border-pink-500", "border-cyan-500", "border-emerald-500"
            ];

            const [bpm, setBpm] = React.useState(108); // ブラコン・Poppingに最適な心地よいテンポ
            const [currentBar, setCurrentBar] = React.useState(0);
            const totalBars = 16;
            const BAR_STEPS = 16;
            const getMaxSteps = () => totalBars * BAR_STEPS;
            const [status, setStatus] = React.useState("🎷 ブラックコンテンポラリー＆Popping SOUL級 DAW 起動！");

            const [selectedInst, setSelectedInst] = React.useState("trumpet");
            const [selectedNote, setSelectedNote] = React.useState("C4");
            const [repeatRate, setRepeatRate] = React.useState("16n");

            // 楽器定義（ご要望の全要素）
            const INSTRUMENTS = [
                { id: "trumpet", label: "🎺 トランペット (AI/手動)" },
                { id: "piano", label: "🎹 ピアノ" },
                { id: "electronic", label: "⚡ 電子音 / その他" },
                { id: "bass", label: "🎸 ベース低音 (テンポリズム追加)" },
                { id: "violinChorus", label: "🎻 バイオリン＆バックコーラスAI" },
                { id: "drums", label: "🥁 ドラム (ブラックコンテンポラリー級)" },
                { id: "pipeSound", label: "🎶 パイプ音" },
            ];

            const [steps, setSteps] = React.useState({
                trumpet: new Array(16 * BAR_STEPS).fill(null),
                piano: new Array(16 * BAR_STEPS).fill(null),
                electronic: new Array(16 * BAR_STEPS).fill(null),
                bass: new Array(16 * BAR_STEPS).fill(null),
                violinChorus: new Array(16 * BAR_STEPS).fill(null),
                drums: new Array(16 * BAR_STEPS).fill(null),
                pipeSound: new Array(16 * BAR_STEPS).fill(null),
            });

            // ドラム（ブラコン・ポッピング用パーツ）
            const DRUM_PARTS = [
                { id: "bcKick", label: "🥁 重低音ブラコンキック" },
                { id: "funkSnare", label: "💥 ファンキースネア" },
                { id: "poppingClap", label: "👏 ポッピングクラップ" },
                { id: "funkHiHat", label: "🎩 ファンキーハイハット" },
                { id: "soulRim", label: "🥢 ソウルリムショット" },
                { id: "congaBongo", label: "🪘 コンガ・ボンゴ" },
                { id: "openHat", label: "✨ オープンハイハット" },
                { id: "shaker", label: "🥠 シェイカー" }
            ];
            const [selectedDrumPart, setSelectedDrumPart] = React.useState("bcKick");

            // 全体・個別録音関連
            const [recordings, setRecordings] = React.useState([]);
            const [isRecordingLive, setIsRecordingLive] = React.useState(false);
            const liveAudioChunks = React.useRef([]);
            const mediaRecorderRef = React.useRef(null);
            const destinationRef = React.useRef(null);
            const analyserRef = React.useRef(null);

            const synthsRef = React.useRef(null);
            const loopRef = React.useRef(null);

            // Popping SOUL風ペンタトニック＆コード進行のAIパターン生成
            const generateAiPattern = (instKey, maxS) => {
                const arr = new Array(maxS).fill(null);
                const soulNotes = ["C3", "Eb3", "F3", "G3", "Bb3", "C4", "Eb4", "F4", "G4", "Bb4", "C5"];

                for (let s = 0; s < maxS; s++) {
                    const sInBar = s % BAR_STEPS;
                    const barIdx = Math.floor(s / BAR_STEPS);

                    if (instKey === "drums") {
                        const isKick = (sInBar === 0 || sInBar === 6 || sInBar === 10 || sInBar === 12);
                        arr[s] = {
                            bcKick: isKick,
                            funkSnare: (sInBar === 4 || sInBar === 12),
                            poppingClap: sInBar === 4,
                            funkHiHat: sInBar % 2 === 0,
                            soulRim: sInBar === 14,
                            congaBongo: sInBar % 4 === 3,
                            openHat: sInBar === 8,
                            shaker: sInBar % 2 === 1
                        };
                    } else if (instKey === "bass") {
                        if (sInBar === 0 || sInBar === 3 || sInBar === 6 || sInBar === 10) {
                            arr[s] = soulNotes[(s + barIdx) % 4];
                        }
                    } else if (instKey === "trumpet") {
                        if (sInBar === 2 || sInBar === 5 || sInBar === 10 || sInBar === 13) {
                            arr[s] = soulNotes[Math.floor(Math.random() * soulNotes.length)];
                        }
                    } else if (instKey === "violinChorus") {
                        if (sInBar === 0 || sInBar === 8) {
                            arr[s] = soulNotes[Math.floor(Math.random() * soulNotes.length)];
                        }
                    } else if (instKey === "pipeSound") {
                        if (sInBar === 4 || sInBar === 12) {
                            arr[s] = "G4";
                        }
                    } else {
                        if (sInBar % 4 === 0 || sInBar === 7) {
                            arr[s] = soulNotes[(s * 2 + barIdx) % soulNotes.length];
                        }
                    }
                }
                return arr;
            };

            const handleOverallAiOptimization = () => {
                const maxS = getMaxSteps();
                const newSteps = {};
                Object.keys(steps).forEach(k => {
                    newSteps[k] = generateAiPattern(k, maxS);
                });
                setSteps(newSteps);
                setBpm(104 + Math.floor(Math.random() * 10));
                setStatus("✨ Popping SOUL & ブラックコンテンポラリー級のAIメロディを全楽器に適用しました！");
            };

            const handleAllClear = () => {
                const maxS = getMaxSteps();
                const cleared = {};
                Object.keys(steps).forEach(k => {
                    cleared[k] = new Array(maxS).fill(null);
                });
                setSteps(cleared);
                setStatus("🗑️ 全てのメロディ・リズムをクリアしました。");
            };

            const generateSingleInstAi = (instKey) => {
                const maxS = getMaxSteps();
                const arr = generateAiPattern(instKey, maxS);
                setSteps(prev => ({ ...prev, [instKey]: arr }));
                setStatus(`🎲 ${INSTRUMENTS.find(i => i.id === instKey)?.label} のAIメロディパターンを生成しました！`);
            };

            const clearSingleInstrument = (instKey) => {
                setSteps(prev => ({ ...prev, [instKey]: new Array(getMaxSteps()).fill(null) }));
                setStatus(`🗑️ ${INSTRUMENTS.find(i => i.id === instKey)?.label} をClearしました`);
            };

            // 音源エンジン初期化
            React.useEffect(() => {
                try {
                    const dest = Tone.context.createMediaStreamDestination();
                    destinationRef.current = dest;

                    const masterGain = new Tone.Gain(2.0).toDestination();
                    masterGain.connect(dest);

                    const analyser = new Tone.Analyser("waveform", 64);
                    masterGain.connect(analyser);
                    analyserRef.current = analyser;

                    const reverb = new Tone.Reverb({ decay: 2.2, wet: 0.25 }).connect(masterGain);
                    const delay = new Tone.FeedbackDelay("8n", 0.25).connect(reverb);

                    const syns = {};
                    const drumSyns = {};

                    // トランペット (ブラス風)
                    syns.trumpet = new Tone.Synth({
                        oscillator: { type: "sawtooth" },
                        envelope: { attack: 0.05, decay: 0.2, sustain: 0.6, release: 0.3 }
                    }).connect(delay);

                    // ピアノ
                    syns.piano = new Tone.Synth({
                        oscillator: { type: "triangle" },
                        envelope: { attack: 0.005, decay: 0.3, sustain: 0.2, release: 0.3 }
                    }).connect(reverb);

                    // 電子音
                    syns.electronic = new Tone.Synth({
                        oscillator: { type: "pulse", width: 0.5 },
                        envelope: { attack: 0.01, decay: 0.2, sustain: 0.4, release: 0.2 }
                    }).connect(delay);

                    // ベース低音
                    syns.bass = new Tone.MonoSynth({
                        oscillator: { type: "square" },
                        envelope: { attack: 0.01, decay: 0.3, sustain: 0.4, release: 0.2 },
                        filterEnvelope: { attack: 0.01, decay: 0.2, baseFrequency: 80, octaves: 3 }
                    }).connect(reverb);

                    // バイオリン＆バックコーラスAI
                    syns.violinChorus = new Tone.Synth({
                        oscillator: { type: "sine" },
                        envelope: { attack: 0.1, decay: 0.4, sustain: 0.8, release: 0.5 }
                    }).connect(reverb);

                    // パイプ音
                    syns.pipeSound = new Tone.Synth({
                        oscillator: { type: "sine" },
                        envelope: { attack: 0.02, decay: 0.4, sustain: 0.3, release: 0.4 }
                    }).connect(delay);

                    // ドラブラコン用シンセ
                    DRUM_PARTS.forEach(d => {
                        if (d.id.includes("Snare") || d.id.includes("Clap") || d.id.includes("Hat") || d.id.includes("Shaker")) {
                            drumSyns[d.id] = new Tone.NoiseSynth({
                                noise: { type: "white" },
                                envelope: { attack: 0.002, decay: 0.15 }
                            }).connect(reverb);
                        } else {
                            drumSyns[d.id] = new Tone.MembraneSynth({
                                pitchDecay: 0.05, octaves: 4,
                                oscillator: { type: "sine" }
                            }).connect(reverb);
                        }
                    });
                    syns.drums = drumSyns;

                    synthsRef.current = syns;

                    setSteps({
                        trumpet: generateAiPattern("trumpet", 16 * BAR_STEPS),
                        piano: generateAiPattern("piano", 16 * BAR_STEPS),
                        electronic: generateAiPattern("electronic", 16 * BAR_STEPS),
                        bass: generateAiPattern("bass", 16 * BAR_STEPS),
                        violinChorus: generateAiPattern("violinChorus", 16 * BAR_STEPS),
                        drums: generateAiPattern("drums", 16 * BAR_STEPS),
                        pipeSound: generateAiPattern("pipeSound", 16 * BAR_STEPS),
                    });
                } catch(e) {}
                return () => { try { Tone.Transport.stop(); Tone.Transport.cancel(); } catch(e) {} };
            }, []);

            // 全体録音
            const toggleLiveRecording = () => {
                if (!isRecordingLive) {
                    try {
                        liveAudioChunks.current = [];
                        const recorder = new MediaRecorder(destinationRef.current.stream);
                        recorder.ondataavailable = e => { if (e.data.size > 0) liveAudioChunks.current.push(e.data); };
                        recorder.onstop = () => {
                            const blob = new Blob(liveAudioChunks.current, { type: 'audio/webm' });
                            const url = URL.createObjectURL(blob);
                            setRecordings(prev => [...prev, { id: Date.now(), url, title: `SOUL MIX REC #${prev.length + 1}` }]);
                            setStatus("💾 全体演奏ミックスの録音を保存しました！");
                        };
                        recorder.start();
                        mediaRecorderRef.current = recorder;
                        setIsRecordingLive(true);
                        setStatus("🔴 全体ミックス録音中...");
                    } catch(e) {
                        setStatus("⚠️ 記録非対応ブラウザです");
                    }
                } else {
                    mediaRecorderRef.current?.stop();
                    setIsRecordingLive(false);
                }
            };

            // トランスポート・再生ループ
            React.useEffect(() => {
                Tone.Transport.bpm.value = bpm;
                Tone.Transport.cancel();
                if (playing) {
                    let stepCounter = 0;
                    const maxS = getMaxSteps();

                    loopRef.current = new Tone.Loop(time => {
                        let step = stepCounter % maxS;
                        setCurrentBar(Math.floor(step / BAR_STEPS) % totalBars);

                        if (step % 4 === 0) {
                            setFlashColor(FLASH_COLORS[Math.floor(Math.random() * FLASH_COLORS.length)]);
                        }

                        const syns = synthsRef.current;
                        if (!syns) return;

                        Object.keys(steps).forEach(k => {
                            const val = steps[k][step];
                            if (val) {
                                if (k === "drums") {
                                    Object.keys(val).forEach(pk => {
                                        if (val[pk] && syns.drums[pk]) {
                                            syns.drums[pk].triggerAttackRelease("16n", time);
                                        }
                                    });
                                } else if (syns[k]) {
                                    try { syns[k].triggerAttackRelease(typeof val === "string" ? val : "C3", "16n", time); } catch(e) {}
                                }
                            }
                        });
                        stepCounter++;
                    }, "16n").start(0);

                    Tone.Transport.start();
                } else {
                    Tone.Transport.stop();
                }
            }, [playing, bpm, steps]);

            const togglePlay = async () => {
                try { await Tone.start(); } catch(e) {}
                setPlaying(!playing);
            };

            const toggleStep = (instKey, idx) => {
                setSteps(prev => {
                    const arr = [...prev[instKey]];
                    if (instKey === "drums") {
                        const obj = arr[idx] || {};
                        const upd = { ...obj, [selectedDrumPart]: !obj[selectedDrumPart] };
                        arr[idx] = Object.values(upd).some(Boolean) ? upd : null;
                    } else {
                        arr[idx] = arr[idx] ? null : selectedNote;
                    }
                    return { ...prev, [instKey]: arr };
                });
            };

            // 手動鍵盤演奏 ＆ 連打対応
            const handleKeyboardNotePlay = async (note) => {
                try {
                    await Tone.start();
                    const syn = synthsRef.current?.[selectedInst];
                    if (syn && typeof syn.triggerAttackRelease === "function") {
                        syn.triggerAttackRelease(note, repeatRate === "OFF" ? "8n" : repeatRate);
                    }
                    setStatus(`🎵 演奏: ${note} (${selectedInst}) [連打: ${repeatRate}]`);
                } catch(e){}
            };

            const soulKeyboardNotes = ["C2", "Eb2", "F2", "G2", "Bb2", "C3", "Eb3", "F3", "G3", "Bb3", "C4", "Eb4", "F4", "G4", "Bb4", "C5"];

            return (
                <div className={`min-h-screen bg-slate-950 text-slate-100 text-xs font-sans select-none border-4 transition-all ${flashColor}`}>
                    
                    {/* ヘッダー */}
                    <header className="bg-gradient-to-r from-slate-900 via-zinc-900 to-slate-900 border-b border-amber-500/30 p-2 flex flex-wrap items-center justify-between gap-1.5 sticky top-0 z-50 shadow-lg">
                        <span className="font-black text-xs bg-gradient-to-r from-amber-300 via-yellow-200 to-orange-400 bg-clip-text text-transparent">
                            BLACK CONTEMPORARY & POPPING SOUL <span className="text-[9px] text-amber-400">DAW</span>
                        </span>
                        <div className="flex items-center gap-1.5 flex-wrap">
                            <button onClick={togglePlay} className={`px-3 py-1 rounded-lg font-bold text-[11px] shadow ${playing ? "bg-amber-400 text-slate-950 animate-bounce" : "bg-gradient-to-r from-amber-600 to-yellow-700 text-white"}`}>
                                {playing ? "■ 停止" : "▶ 再生"}
                            </button>
                            <button onClick={toggleLiveRecording} className={`px-2.5 py-1 rounded-lg font-bold text-[11px] border ${isRecordingLive ? "bg-red-600 text-white border-white animate-pulse" : "bg-slate-800 text-slate-200 border-slate-600"}`}>
                                {isRecordingLive ? "🔴 録音中" : "💾 全体録音"}
                            </button>
                            <button onClick={handleOverallAiOptimization} className="px-2.5 py-1 bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-bold rounded-lg text-[10px] shadow">
                                ✨ AIランダム作成
                            </button>
                            <button onClick={handleAllClear} className="px-2.5 py-1 bg-red-700 text-white font-bold rounded-lg text-[10px] shadow hover:bg-red-600">
                                🗑️ 全体Clear
                            </button>
                            <div className="flex items-center gap-1 bg-slate-900 px-2 py-0.5 rounded-lg border border-amber-500/40">
                                <span className="text-[9px] text-amber-400 font-bold">BPM</span>
                                <input type="number" value={bpm} onChange={e => setBpm(Number(e.target.value))} className="w-10 bg-transparent text-center font-bold text-amber-400 text-[11px] focus:outline-none" />
                            </div>
                        </div>
                    </header>

                    {/* タブナビゲーション */}
                    <nav className="bg-slate-900/95 border-b border-slate-800 p-1.5 flex gap-1 overflow-x-auto">
                        {[
                            { id: "EDIT", label: "🎹 楽器グリッド ＆ AI・手動" },
                            { id: "REC_LIST", label: "💾 録音ファイル一覧" },
                        ].map(t => (
                            <button key={t.id} onClick={() => setTab(t.id)} className={`px-3.5 py-1 rounded-lg text-center font-bold text-[11px] shrink-0 ${tab === t.id ? "bg-gradient-to-r from-amber-500 to-yellow-600 text-slate-950 shadow" : "bg-slate-800 text-slate-300"}`}>
                                {t.label}
                            </button>
                        ))}
                    </nav>

                    <div className="bg-slate-900 px-3 py-1.5 text-[11px] text-amber-400 border-b border-slate-800 flex justify-between items-center">
                        <span className="truncate">💡 {status}</span>
                        <span className="text-slate-300 font-bold shrink-0 ml-2">16小節: {currentBar + 1} / 16</span>
                    </div>

                    <main className="p-2.5 flex flex-col gap-2.5 max-w-4xl mx-auto">

                        {tab === "EDIT" && (
                            <div className="flex flex-col gap-2.5">
                                {/* 楽器選択 ＆ AI・手動切り替えエリア */}
                                <div className="bg-slate-900 border border-amber-500/20 rounded-2xl p-3 flex flex-col gap-2.5 shadow-xl">
                                    <div className="flex justify-between items-center flex-wrap gap-2">
                                        <span className="text-[11px] font-bold text-amber-400">🎷 楽器・リズム選択 (AI作成 ＆ 手動切り替え)</span>
                                        <button onClick={() => generateSingleInstAi(selectedInst)} className="px-2.5 py-1 bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-bold rounded-lg text-[10px] shadow">
                                            ✨ 選択楽器のAIメロディ作成
                                        </button>
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-1.5">
                                        {INSTRUMENTS.map(inst => (
                                            <div key={inst.id} className="flex gap-1">
                                                <button onClick={() => setSelectedInst(inst.id)} className={`flex-1 py-2 px-2.5 rounded-xl font-bold text-[11px] truncate border text-left ${selectedInst === inst.id ? "bg-gradient-to-r from-amber-500 to-yellow-600 text-slate-950 border-white shadow" : "bg-slate-950 text-slate-300 border-slate-800"}`}>
                                                    {inst.label}
                                                </button>
                                                <button onClick={() => generateSingleInstAi(inst.id)} className="px-2.5 bg-purple-900/80 hover:bg-purple-800 text-purple-200 rounded-xl text-[10px] font-bold border border-purple-700 shadow">
                                                    AI
                                                </button>
                                                <button onClick={() => clearSingleInstrument(inst.id)} className="px-2.5 bg-red-950/80 hover:bg-red-900 text-red-200 rounded-xl text-[10px] font-bold border border-red-800 shadow">
                                                    Clear
                                                </button>
                                            </div>
                                        ))}
                                    </div>

                                    {/* 連打リピート切り替え */}
                                    <div className="bg-slate-950 p-2.5 rounded-xl border border-slate-800 flex items-center justify-between gap-2">
                                        <span className="text-[10px] text-amber-400 font-bold shrink-0">⚡ 連打テンポリズム切り替え:</span>
                                        <div className="flex gap-1">
                                            {["OFF", "8n", "16n", "32n"].map(rate => (
                                                <button key={rate} onClick={() => setRepeatRate(rate)} className={`px-2.5 py-1 rounded text-[10px] font-bold border ${repeatRate === rate ? "bg-amber-500 text-slate-950 border-white" : "bg-slate-900 text-slate-300 border-slate-700"}`}>
                                                    {rate === "OFF" ? "通常" : rate === "8n" ? "標準" : rate === "16n" ? "高速連打" : "超高速"}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* 手動演奏用キーボード */}
                                    <div className="bg-slate-950 p-2.5 rounded-xl border border-slate-800 flex flex-col gap-1.5">
                                        <span className="text-[10px] text-amber-400 font-bold">🎹 手動演奏キーボード (ソウルペンタトニック対応):</span>
                                        <div className="flex flex-wrap gap-1">
                                            {soulKeyboardNotes.map(n => (
                                                <button key={n} onClick={() => handleKeyboardNotePlay(n)} className="px-2.5 py-2 rounded-lg text-[11px] font-bold bg-slate-900 hover:bg-amber-400 hover:text-slate-950 text-slate-100 border border-slate-700 shadow transition-all active:scale-95">
                                                    {n}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* ドラム詳細パーツ選択 */}
                                    {selectedInst === "drums" && (
                                        <div className="bg-slate-950 p-2.5 rounded-xl border border-slate-800 flex flex-col gap-1.5">
                                            <span className="text-[10px] text-amber-400 font-bold">🥁 ブラックコンテンポラリー ドラムパーツ選択:</span>
                                            <div className="grid grid-cols-2 sm:grid-cols-4 gap-1">
                                                {DRUM_PARTS.map(d => (
                                                    <button key={d.id} onClick={() => setSelectedDrumPart(d.id)} className={`py-1.5 px-1 rounded-lg text-[10px] font-bold border truncate ${selectedDrumPart === d.id ? "bg-amber-600 text-white border-white" : "bg-slate-900 text-slate-300 border-slate-800"}`}>
                                                        {d.label}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                </div>

                                {/* グリッド手動打ち込みエリア */}
                                <div className="bg-slate-900 border border-amber-500/20 rounded-2xl p-3 flex flex-col gap-2.5 shadow-xl">
                                    <div className="flex items-center justify-between">
                                        <span className="text-[11px] font-bold text-amber-400">✍️ メロディ・リズム手動作成 (小節: {currentBar + 1} / 16)</span>
                                        <button onClick={() => clearSingleInstrument(selectedInst)} className="text-[10px] text-red-400 font-bold px-2 py-0.5 bg-red-950/60 rounded border border-red-800">
                                            この楽器をClear
                                        </button>
                                    </div>

                                    <div className="flex gap-1 overflow-x-auto p-1 bg-slate-950 rounded-xl border border-slate-800">
                                        {Array.from({ length: 16 }).map((_, b) => (
                                            <button key={b} onClick={() => setCurrentBar(b)} className={`px-2.5 py-1 rounded-lg text-[11px] font-bold shrink-0 ${currentBar === b ? "bg-amber-400 text-slate-950" : "bg-slate-800 text-slate-300"}`}>
                                                {b + 1}
                                            </button>
                                        ))}
                                    </div>

                                    <div className="grid grid-cols-8 gap-1 bg-slate-950 p-2.5 rounded-2xl border border-slate-800">
                                        {Array.from({ length: BAR_STEPS }).map((_, i) => {
                                            const idx = currentBar * BAR_STEPS + i;
                                            const val = steps[selectedInst][idx];
                                            const active = selectedInst === "drums" ? !!(val && val[selectedDrumPart]) : !!val;
                                            return (
                                                <button key={i} onClick={() => toggleStep(selectedInst, idx)} className={`h-11 rounded-lg border flex flex-col items-center justify-center text-[10px] font-bold shadow transition-all ${active ? "bg-amber-400 border-white text-slate-950 scale-105" : "bg-slate-900 border-slate-800 text-slate-400"}`}>
                                                    <span>{i + 1}</span>
                                                    {active && <span className="text-[8px] font-black text-slate-950 bg-amber-200 px-0.5 rounded mt-0.5 truncate max-w-full">{typeof val === "string" ? val : "HIT"}</span>}
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        )}

                        {tab === "REC_LIST" && (
                            <div className="bg-slate-900 border border-amber-500/20 rounded-2xl p-3 flex flex-col gap-2.5 shadow-xl">
                                <span className="text-[11px] font-bold text-amber-400">💾 全体ミックス録音ファイル一覧</span>
                                <div className="bg-slate-950 p-3 rounded-2xl border border-slate-800 flex flex-col gap-2 min-h-[160px]">
                                    {recordings.length === 0 ? (
                                        <span className="text-[11px] text-slate-500 text-center py-8">録音されたファイルはありません。上の「全体録音」ボタンから演奏を録音できます。</span>
                                    ) : (
                                        recordings.map((rec) => (
                                            <div key={rec.id} className="bg-slate-900 p-2.5 rounded-xl border border-slate-800 flex items-center justify-between">
                                                <span className="text-[11px] font-bold text-slate-200">{rec.title}</span>
                                                <div className="flex items-center gap-2">
                                                    <audio src={rec.url} controls className="h-7 w-40"></audio>
                                                    <a href={rec.url} download={`${rec.title}.webm`} className="px-3 py-1 bg-amber-500 text-slate-950 rounded-lg text-[10px] font-bold">DL</a>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        )}

                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<BlackContemporaryApp/>);
    </script>
</body>
</html>
