<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RHYTHM FORGE - PRO DAW v4.8</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }
        /* ヘッダー */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 10px;
            background: #111827;
            border-bottom: 1px solid #1f2937;
            flex-shrink: 0;
        }
        .logo-area {
            display: flex;
            align-items: baseline;
            gap: 4px;
        }
        .logo {
            font-size: 0.95rem;
            font-weight: bold;
            background: linear-gradient(90deg, #38bdf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .version {
            font-size: 0.55rem;
            background: #1e3a8a;
            color: #93c5fd;
            padding: 1px 3px;
            border-radius: 3px;
        }
        .top-controls {
            display: flex;
            gap: 5px;
            align-items: center;
        }
        .btn-stop {
            background: #f97316;
            color: #fff;
            border: none;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.7rem;
        }
        .bpm-box {
            background: #1e293b;
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
        }
        .btn-ai-top {
            background: #0ea5e9;
            color: #fff;
            border: none;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.7rem;
        }

        /* 小節バー（12小節） */
        .bar-container {
            display: flex;
            align-items: center;
            padding: 4px 8px;
            background: #0f172a;
            border-bottom: 1px solid #1e293b;
            flex-shrink: 0;
        }
        .bar-label {
            font-size: 0.6rem;
            color: #94a3b8;
            margin-right: 6px;
            white-space: nowrap;
        }
        .bars {
            display: flex;
            gap: 3px;
            flex: 1;
            overflow-x: auto;
        }
        .bar-num {
            background: #1e293b;
            color: #cbd5e1;
            font-size: 0.65rem;
            width: 22px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 3px;
            flex-shrink: 0;
        }
        .bar-num.active {
            background: #06b6d4;
            color: #fff;
        }

        /* トラックエリア */
        .track-list {
            flex: 1;
            overflow-y: auto;
            padding: 3px;
        }
        .track-row {
            display: flex;
            align-items: center;
            margin-bottom: 2px;
            background: #111827;
            border-radius: 3px;
            padding: 2px;
        }
        .track-btn {
            background: #1e293b;
            color: #e2e8f0;
            border: none;
            padding: 4px 6px;
            border-radius: 3px;
            font-size: 0.58rem;
            width: 100px;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
        }
        .track-btn:active {
            background: #334155;
        }
        .track-timeline {
            flex: 1;
            height: 20px;
            background: #0f172a;
            margin-left: 4px;
            border-radius: 3px;
            border: 1px solid #1e293b;
            position: relative;
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 0 2px;
        }
        .track-timeline.selected {
            border-color: #ec4899;
        }
        .note-block {
            width: 8px;
            height: 12px;
            background: #38bdf8;
            border-radius: 2px;
            margin-right: 2px;
            display: inline-block;
        }

        /* ステータス表示バー（ポップアップの代わり） */
        .status-bar {
            background: #1e293b;
            color: #38bdf8;
            font-size: 0.65rem;
            padding: 2px 10px;
            text-align: center;
            flex-shrink: 0;
            border-top: 1px solid #334155;
        }

        /* フッターコントロール */
        footer {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 2px;
            padding: 4px;
            background: #0f172a;
            border-top: 1px solid #1e293b;
            flex-shrink: 0;
        }
        .footer-btn {
            background: #1e293b;
            color: #cbd5e1;
            border: none;
            padding: 5px 0;
            border-radius: 3px;
            font-size: 0.53rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1px;
            cursor: pointer;
        }
        .footer-btn:active, .footer-btn.active {
            background: #334155;
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <!-- ヘッダー -->
    <header>
        <div class="logo-area">
            <span class="logo">RHYTHM FORGE</span>
            <span class="version">v4.8</span>
        </div>
        <div class="top-controls">
            <button class="btn-stop" id="stopBtn">停止</button>
            <div class="bpm-box">BPM 110</div>
            <button class="btn-ai-top" id="aiTopBtn">AI作曲</button>
        </div>
    </header>

    <!-- 小節表示（12小節） -->
    <div class="bar-container">
        <div class="bar-label">12小節:</div>
        <div class="bars" id="barContainer"></div>
    </div>

    <!-- トラック一覧 -->
    <div class="track-list" id="trackList"></div>

    <!-- ステータス表示（ポップアップを出さずにここに文字で状態を表示） -->
    <div class="status-bar" id="statusBar">準備完了 - ボタンを押して演奏</div>

    <!-- フッター -->
    <footer>
        <button class="footer-btn" id="recBtn">🔴 録音</button>
        <button class="footer-btn" id="playBtn">▶ 再生</button>
        <button class="footer-btn" id="clearBtn">✖ Clear</button>
        <button class="footer-btn" id="repeatBtn">🔁 リピ</button>
        <button class="footer-btn" id="randomBtn">🔀 ラン</button>
        <button class="footer-btn" id="shareBtn">🔗 共有</button>
        <button class="footer-btn" id="editBtn">⚙ 編集</button>
        <button class="footer-btn" id="synthBtn">🧩 合成</button>
    </footer>

    <script>
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function setStatus(msg) {
            document.getElementById('statusBar').textContent = msg;
        }

        // 音を鳴らす関数
        function playSound(type) {
            initAudio();
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'KICK' || type === 'AFRICAN DRUMS') {
                osc.frequency.setValueAtTime(type === 'AFRICAN DRUMS' ? 180 : 120, now);
                osc.frequency.exponentialRampToValueAtTime(0.01, now + 0.12);
                gain.gain.setValueAtTime(1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
            } else if (type === 'SNARE') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(220, now);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
            } else {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now); // ドの音
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
            }

            osc.start(now);
            osc.stop(now + 0.15);
        }

        const trackNames = [
            "KICK", "SNARE", "H.H", "CYMB", 
            "AI MELLOW GUIT.", "PIANO ARPEG.", "STRINGS", 
            "STRINGS CODE", "HARMONICA", "VIOLIN", 
            "AFRICAN DRUMS", "AI BASS", "SUB BASS"
        ];

        const trackListEl = document.getElementById('trackList');
        const barContainerEl = document.getElementById('barContainer');

        // 12小節の生成
        for (let i = 1; i <= 12; i++) {
            const div = document.createElement('div');
            div.className = `bar-num ${i === 1 ? 'active' : ''}`;
            div.textContent = i;
            barContainerEl.appendChild(div);
        }

        // トラックの生成とタイムラインへのノート自動配置
        trackNames.forEach((name, index) => {
            const row = document.createElement('div');
            row.className = 'track-row';
            
            const btn = document.createElement('button');
            btn.className = 'track-btn';
            btn.textContent = name;
            btn.onclick = () => {
                playSound(name);
                setStatus(`${name} を再生しました`);
            };

            const timeline = document.createElement('div');
            timeline.className = 'track-timeline';
            if(index === 0) timeline.classList.add('selected');

            // リズム・メロディっぽくいくつかノートを配置
            if (index === 0 || index === 2 || index === 10) {
                for (let n = 0; n < 12; n += (index === 10 ? 1 : 2)) {
                    const note = document.createElement('div');
                    note.className = 'note-block';
                    if (index === 10) note.style.background = '#f97316'; // アフリカ太鼓は色を変える
                    timeline.appendChild(note);
                }
            }

            row.appendChild(btn);
            row.appendChild(timeline);
            trackListEl.appendChild(row);
        });

        // フッターボタンの動作（ポップアップなしでスムーズに処理）
        document.getElementById('playBtn').onclick = () => {
            initAudio();
            playSound('KICK');
            setStatus("▶ 再生中 (12小節ループ)");
        };

        document.getElementById('stopBtn').onclick = () => {
            setStatus("⏹ 停止しました");
        };

        document.getElementById('clearBtn').onclick = () => {
            setStatus("✖ トラックをクリアしました");
        };

        document.getElementById('randomBtn').onclick = () => {
            setStatus("🔀 ランダムフレーズを生成しました");
        };

        document.getElementById('repeatBtn').onclick = (e) => {
            e.currentTarget.classList.toggle('active');
            setStatus(e.currentTarget.classList.contains('active') ? "🔁 リピート：ON" : "🔁 リピート：OFF");
        };

        document.getElementById('aiTopBtn').onclick = () => {
            setStatus("✨ AIメロディ ＆ アフリカ太鼓AIを適用しました！");
            playSound('AFRICAN DRUMS');
        };

        document.getElementById('synthBtn').onclick = () => {
            setStatus("🧩 トラックを合成しました");
        };

        document.getElementById('editBtn').onclick = () => {
            setStatus("⚙ 編集モード");
        };

        document.getElementById('shareBtn').onclick = () => {
            setStatus("🔗 共有リンクを作成しました");
        };

        document.getElementById('recBtn').onclick = () => {
            setStatus("🔴 録音スタンバイ中...");
        };
    </script>
</body>
</html>
