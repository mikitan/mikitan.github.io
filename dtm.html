<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOUL, DISCO & AFRICAN MASTER SYNTHESIZER</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tone.js for Sound Synthesis -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans select-none pb-16">
    <div id="root"></div>

    <script type="text/babel">
        function MasterSynthApp() {
            const [tab, setTab] = React.useState("PLAY");
            const [playing, setPlaying] = React.useState(false);
            const [isLooping, setIsLooping] = React.useState(true);
            const [isRandomMode, setIsRandomMode] = React.useState(false);
            const [flashEffect, setFlashEffect] = React.useState(false);
            const [bpm, setBpm] = React.useState(122);
            const [currentBar, setCurrentBar] = React.useState(0);
            const [currentStep, setCurrentStep] = React.useState(-1);
            const [status, setStatus] = React.useState("準備完了：バイオリン・シンセ・パイプ・ボイス・AI伴奏機能スタンバイOK");

            const BARS = 8;
            const BAR_STEPS = 16;
            const TOTAL_STEPS = BARS * BAR_STEPS;

            const [selectedInstrument, setSelectedInstrument] = React.useState("drums");
            const [selectedNote, setSelectedNote] = React.useState("C4");
            const [selectedDrumPart, setSelectedDrumPart] = React.useState("kick");

            // 楽器データの保持（すべての楽器＋ボイス）
            const [instrumentSteps, setInstrumentSteps] = React.useState({
                drums: new Array(TOTAL_STEPS).fill(null),
                bass: new Array(TOTAL_STEPS).fill(null),
                piano: new Array(TOTAL_STEPS).fill(null),
                guitar: new Array(TOTAL_STEPS).fill(null),
                electric_guitar: new Array(TOTAL_STEPS).fill(null),
                violin: new Array(TOTAL_STEPS).fill(null),
                trumpet: new Array(TOTAL_STEPS).fill(null),
                synth: new Array(TOTAL_STEPS).fill(null),
                pipe: new Array(TOTAL_STEPS).fill(null),
                voice: new Array(TOTAL_STEPS).fill(null),
                djembe: new Array(TOTAL_STEPS).fill(null),
            });

            // ボイス録音用ステート
            const [isRecordingVoice, setIsRecordingVoice] = React.useState(false);
            const [recordedVoiceAudio, setRecordedVoiceAudio] = React.useState(null);
            const mediaRecorderRef = React.useRef(null);
            const audioChunksRef = React.useRef([]);

            const [songName, setSongName] = React.useState("");
            const [savedList, setSavedList] = React.useState([]);

            const synthsRef = React.useRef(null);
            const loopRef = React.useRef(null);

            const NOTES = ["C4", "D4", "E4", "F4", "G4", "A4", "B4", "C5"];
            const SOLFEGE = { "C4": "ド", "D4": "レ", "E4": "ミ", "F4": "ファ", "G4": "ソ", "A4": "ラ", "B4": "シ", "C5": "ド" };

            const INSTRUMENTS = [
                { id: "drums", label: "🥁 ドラム", color: "from-red-600 to-amber-600" },
                { id: "bass", label: "🎸 ベース", color: "from-emerald-600 to-teal-600" },
                { id: "piano", label: "🎹 ピアノ", color: "from-blue-600 to-indigo-600" },
                { id: "guitar", label: "🎸 ギター", color: "from-amber-600 to-orange-600" },
                { id: "electric_guitar", label: "⚡ エレキ", color: "from-rose-600 to-red-700" },
                { id: "violin", label: "🎻 バイオリン", color: "from-purple-600 to-pink-600" },
                { id: "trumpet", label: "🎺 トランペット", color: "from-yellow-600 to-amber-600" },
                { id: "synth", label: "🎹 シンセ", color: "from-cyan-600 to-blue-700" },
                { id: "pipe", label: "🎺 パイプ音", color: "from-amber-600 to-yellow-700" },
                { id: "voice", label: "🎤 ボイス", color: "from-rose-600 to-pink-700" },
                { id: "djembe", label: "🪘 ジャンベ", color: "from-orange-700 to-yellow-900" },
            ];

            const DRUM_PARTS = [
                { id: "kick", label: "キック" },
                { id: "snare", label: "スネア" },
                { id: "hihat", label: "ハイハット" },
                { id: "clap", label: "クラップ" },
            ];

            // 20種類のアフリカン＆ダンスリズムプリセット
            const AFRICAN_DRUM_PRESETS = [
                { name: "1. アフロビーツ・スタンダード", bpm: 120 },
                { name: "2. 高速アフロ・アッパースイング", bpm: 145 },
                { name: "3. ディープ・スローアフロ", bpm: 85 },
                { name: "4. ハイライフ・ダンスビート", bpm: 128 },
                { name: "5. アマピアノ・シャッフル", bpm: 112 },
                { name: "6. トライバル・ジャングル疾走", bpm: 150 },
                { name: "7. メディテーショナル・スローパルス", bpm: 72 },
                { name: "8. クートゥルー・ポリリズム", bpm: 132 },
                { name: "9. レゲエ・ダブ・スローグルーヴ", bpm: 78 },
                { name: "10. 4つ打ちアフロ・ハウス", bpm: 124 },
                { name: "11. ファンキー・アフロ・グルーヴ", bpm: 116 },
                { name: "12. アフリカン・ロック・ビート", bpm: 138 },
                { name: "13. アンビエント・スロー・ウェーブ", bpm: 68 },
                { name: "14. ラテン・アフロ・クロスオーバー", bpm: 130 },
                { name: "15. モダンダンス・エレクトロ", bpm: 135 },
                { name: "16. アフロ・ヒップホップ・ビート", bpm: 92 },
                { name: "17. ソウルフル・ミディアム", bpm: 105 },
                { name: "18. エキゾチック・変拍子パルス", bpm: 118 },
                { name: "19. ウルトラ・ハイテンポ・ブレイク", bpm: 160 },
                { name: "20. ドリーミー・ウルトラ・スロー", bpm: 60 }
            ];

            // --- Tone.js 音源初期化 ---
            React.useEffect(() => {
                const masterGain = new Tone.Gain(1.2).toDestination();
                const reverb = new Tone.Reverb({ decay: 1.5, wet: 0.2 }).connect(masterGain);
                const delay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.2, wet: 0.15 }).connect(reverb);

                const kickSynth = new Tone.MembraneSynth({
                    pitchDecay: 0.05, octaves: 10, oscillator: { type: "sine" },
                    envelope: { attack: 0.001, decay: 0.6, sustain: 0.01, release: 0.4 }
                }).connect(masterGain);

                const snareSynth = new Tone.NoiseSynth({
                    noise: { type: "white" },
                    envelope: { attack: 0.001, decay: 0.2, sustain: 0 }
                }).connect(reverb);

                const hihatSynth = new Tone.MetalSynth({
                    frequency: 400, envelope: { attack: 0.001, decay: 0.04, release: 0.01 },
                    harmonicity: 5.5, modulationIndex: 40, resonance: 7000, octaves: 2.5
                }).connect(masterGain);

                const clapSynth = new Tone.NoiseSynth({
                    noise: { type: "pink" },
                    envelope: { attack: 0.01, decay: 0.15, sustain: 0 }
                }).connect(reverb);

                const bassFilter = new Tone.Filter({ frequency: 500, type: "lowpass" }).connect(delay);
                const subBassSynth = new Tone.MonoSynth({
                    oscillator: { type: "sawtooth" },
                    envelope: { attack: 0.01, decay: 0.3, sustain: 0.5, release: 0.2 },
                    filterEnvelope: { attack: 0.001, decay: 0.2, baseFrequency: 80, octaves: 3.5, exponent: 2 }
                }).connect(bassFilter);

                const pianoSynth = new Tone.Synth({
                    oscillator: { type: "sine" },
                    envelope: { attack: 0.01, decay: 0.2, sustain: 0.2, release: 0.4 }
                }).connect(delay);

                const guitarSynth = new Tone.Synth({
                    oscillator: { type: "triangle" },
                    envelope: { attack: 0.01, decay: 0.25, sustain: 0.1, release: 0.2 }
                }).connect(delay);

                const distortion = new Tone.Distortion(0.4).connect(delay);
                const electricGuitarSynth = new Tone.Synth({
                    oscillator: { type: "sawtooth" },
                    envelope: { attack: 0.002, decay: 0.2, sustain: 0.3, release: 0.2 }
                }).connect(distortion);

                const violinSynth = new Tone.Synth({
                    oscillator: { type: "sawtooth" },
                    envelope: { attack: 0.08, decay: 0.3, sustain: 0.6, release: 0.5 }
                }).connect(delay);

                const trumpetSynth = new Tone.Synth({
                    oscillator: { type: "square" },
                    envelope: { attack: 0.04, decay: 0.2, sustain: 0.5, release: 0.2 }
                }).connect(delay);

                const synthLead = new Tone.Synth({
                    oscillator: { type: "square" },
                    envelope: { attack: 0.01, decay: 0.2, sustain: 0.4, release: 0.2 }
                }).connect(delay);

                const pipeSynth = new Tone.Synth({
                    oscillator: { type: "triangle" },
                    envelope: { attack: 0.05, decay: 0.4, sustain: 0.8, release: 0.3 }
                }).connect(reverb);

                const djembeSynth = new Tone.MembraneSynth({
                    pitchDecay: 0.04, octaves: 4, oscillator: { type: "sine" },
                    envelope: { attack: 0.001, decay: 0.2, sustain: 0, release: 0.1 }
                }).connect(reverb);

                synthsRef.current = {
                    drums: { kick: kickSynth, snare: snareSynth, hihat: hihatSynth, clap: clapSynth },
                    bass: subBassSynth,
                    piano: pianoSynth,
                    guitar: guitarSynth,
                    electric_guitar: electricGuitarSynth,
                    violin: violinSynth,
                    trumpet: trumpetSynth,
                    synth: synthLead,
                    pipe: pipeSynth,
                    djembe: djembeSynth,
                    masterGain
                };

                return () => {
                    Tone.Transport.stop();
                    Tone.Transport.cancel();
                };
            }, []);

            // 再生ループ制御（リピート＆ランダム対応）
            React.useEffect(() => {
                Tone.Transport.bpm.value = bpm;
                Tone.Transport.cancel();

                if (playing) {
                    let stepCounter = 0;
                    loopRef.current = new Tone.Loop(time => {
                        let step = stepCounter % TOTAL_STEPS;
                        if (isRandomMode) {
                            step = Math.floor(Math.random() * TOTAL_STEPS);
                        }

                        const bar = Math.floor(step / BAR_STEPS);
                        const sInBar = step % BAR_STEPS;

                        setCurrentStep(sInBar);
                        setCurrentBar(bar);

                        if (sInBar % 4 === 0) {
                            setFlashEffect(true);
                            setTimeout(() => setFlashEffect(false), 70);
                        }

                        const syns = synthsRef.current;
                        if (!syns) return;

                        Object.keys(instrumentSteps).forEach(instKey => {
                            const val = instrumentSteps[instKey][step];
                            if (!val) return;

                            if (instKey === "drums") {
                                if (typeof val === "object") {
                                    if (val.kick) syns.drums.kick.triggerAttackRelease("C1", "8n", time);
                                    if (val.snare) syns.drums.snare.triggerAttackRelease("8n", time);
                                    if (val.hihat) syns.drums.hihat.triggerAttackRelease("32n", time, 0.8);
                                    if (val.clap) syns.drums.clap.triggerAttackRelease("8n", time);
                                }
                            } else if (instKey === "voice") {
                                if (recordedVoiceAudio) {
                                    recordedVoiceAudio.currentTime = 0;
                                    recordedVoiceAudio.play().catch(e => console.log(e));
                                }
                            } else if (syns[instKey]) {
                                let playNote = val;
                                if (instKey === "bass") playNote = val.replace("4", "1").replace("5", "2");
                                if (instKey === "djembe") playNote = "C2";
                                syns[instKey].triggerAttackRelease(playNote, "8n", time);
                            }
                        });

                        stepCounter++;
                        if (stepCounter >= TOTAL_STEPS && !isLooping && !isRandomMode) {
                            setPlaying(false);
                            Tone.Transport.stop();
                        }
                    }, "16n").start(0);

                    Tone.Transport.start();
                } else {
                    Tone.Transport.stop();
                }
            }, [playing, bpm, instrumentSteps, isLooping, isRandomMode, recordedVoiceAudio]);

            const togglePlay = async () => {
                await Tone.start();
                setPlaying(!playing);
                setStatus(playing ? "停止しました" : `▶ 再生中 (BPM: ${bpm})`);
            };

            const restartFromTop = () => {
                Tone.Transport.position = 0;
                setCurrentBar(0);
                setCurrentStep(-1);
                setStatus("曲の頭に戻りました");
            };

            const toggleStep = (instKey, idx) => {
                setInstrumentSteps(prev => {
                    const currentArr = [...prev[instKey]];
                    if (instKey === "drums") {
                        const currentObj = currentArr[idx] || { kick: false, snare: false, hihat: false, clap: false };
                        const updatedObj = { ...currentObj, [selectedDrumPart]: !currentObj[selectedDrumPart] };
                        const hasAny = Object.values(updatedObj).some(Boolean);
                        currentArr[idx] = hasAny ? updatedObj : null;
                    } else if (instKey === "voice") {
                        currentArr[idx] = currentArr[idx] ? null : "VOICE";
                    } else {
                        currentArr[idx] = currentArr[idx] ? null : selectedNote;
                    }
                    return { ...prev, [instKey]: currentArr };
                });
            };

            // アフリカン＆ダンスAI自動作曲 / 20パターン適用
            const applyAfricanPreset = (presetIndex) => {
                const preset = AFRICAN_DRUM_PRESETS[presetIndex];
                setBpm(preset.bpm);

                const newDrums = new Array(TOTAL_STEPS).fill(null);
                for (let s = 0; s < TOTAL_STEPS; s++) {
                    const sInBar = s % BAR_STEPS;
                    const isKick = (sInBar % (presetIndex % 3 + 2) === 0);
                    const isSnare = (sInBar === 4 || sInBar === 12);
                    const isHihat = (sInBar % 2 === 0);
                    const isClap = (sInBar === 4 || sInBar === 14);
                    newDrums[s] = { kick: isKick, snare: isSnare, hihat: isHihat, clap: isClap };
                }

                setInstrumentSteps(prev => ({ ...prev, drums: newDrums }));
                setStatus(`✨ プリセット「${preset.name}」(BPM: ${preset.bpm}) を適用しました！`);
            };

            // AIメロディ伴奏連動生成
            const generateAiAccompaniment = () => {
                const scale = ["C4", "E4", "G4", "B4", "C5"];
                const newDrums = [...instrumentSteps.drums];
                const newPiano = [...instrumentSteps.piano];
                const newSynth = [...instrumentSteps.synth];

                for (let i = 0; i < TOTAL_STEPS; i++) {
                    if (i % 4 === 0) {
                        newDrums[i] = { kick: true, snare: i % 8 === 4, hihat: true, clap: i % 8 === 4 };
                    }
                    if (i % 2 === 0) {
                        newPiano[i] = scale[Math.floor(Math.random() * scale.length)];
                    }
                    if (i % 4 === 2) {
                        newSynth[i] = scale[Math.floor(Math.random() * scale.length)];
                    }
                }

                setInstrumentSteps(prev => ({
                    ...prev,
                    drums: newDrums,
                    piano: newPiano,
                    synth: newSynth
                }));
                setStatus("✨ AIメロディ連動の伴奏パターンを自動生成しました！");
            };

            // ボイス録音機能
            const startVoiceRecording = async () => {
                audioChunksRef.current = [];
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const mediaRecorder = new MediaRecorder(stream);
                    mediaRecorderRef.current = mediaRecorder;

                    mediaRecorder.ondataavailable = event => {
                        if (event.data.size > 0) audioChunksRef.current.push(event.data);
                    };

                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                        const audioUrl = URL.createObjectURL(audioBlob);
                        const audio = new Audio(audioUrl);
                        setRecordedVoiceAudio(audio);
                        setStatus("🎤 ボイス録音完了！「ボイス」楽器を選択してステップに配置できます");
                    };

                    mediaRecorder.start();
                    setIsRecordingVoice(true);
                    setStatus("🔴 ボイス録音中...");
                } catch (err) {
                    setStatus("⚠️ マイクへのアクセスが許可されていません");
                }
            };

            const stopVoiceRecording = () => {
                if (mediaRecorderRef.current && isRecordingVoice) {
                    mediaRecorderRef.current.stop();
                    setIsRecordingVoice(false);
                }
            };

            const clearCurrentInstrument = () => {
                setInstrumentSteps(prev => ({ ...prev, [selectedInstrument]: new Array(TOTAL_STEPS).fill(null) }));
                setStatus(`🧹 ${selectedInstrument} のデータをクリアしました`);
            };

            const clearAll = () => {
                setInstrumentSteps({
                    drums: new Array(TOTAL_STEPS).fill(null),
                    bass: new Array(TOTAL_STEPS).fill(null),
                    piano: new Array(TOTAL_STEPS).fill(null),
                    guitar: new Array(TOTAL_STEPS).fill(null),
                    electric_guitar: new Array(TOTAL_STEPS).fill(null),
                    violin: new Array(TOTAL_STEPS).fill(null),
                    trumpet: new Array(TOTAL_STEPS).fill(null),
                    synth: new Array(TOTAL_STEPS).fill(null),
                    pipe: new Array(TOTAL_STEPS).fill(null),
                    voice: new Array(TOTAL_STEPS).fill(null),
                    djembe: new Array(TOTAL_STEPS).fill(null),
                });
                setStatus("🧹 すべての記憶データをクリアしました");
            };

            const saveProject = () => {
                if (!songName) { setStatus("⚠️ 曲名を入力してください"); return; }
                setSavedList([...savedList, { name: songName, time: new Date().toLocaleTimeString(), bpm, steps: JSON.parse(JSON.stringify(instrumentSteps)) }]);
                setStatus(`💾 「${songName}」(BPM: ${bpm}) を記憶リストに保存しました！`);
                setSongName("");
            };

            const loadProject = (item) => {
                setInstrumentSteps(item.steps);
                setBpm(item.bpm);
                setStatus(`📂 記憶リストから「${item.name}」を呼び出しました`);
            };

            const currentInstObj = INSTRUMENTS.find(i => i.id === selectedInstrument);

            return (
                <div className={`min-h-screen bg-slate-950 text-slate-100 flex flex-col text-xs font-sans select-none transition-all duration-75 ${flashEffect ? "border-b-4 border-cyan-400" : ""}`}>
                    
                    {/* ヘッダー */}
                    <header className="bg-slate-900 border-b border-slate-800 px-3 py-2 flex items-center justify-between gap-2 sticky top-0 z-50 shadow-lg">
                        <div className="flex items-center gap-2">
                            <span className="font-black text-sm bg-gradient-to-r from-amber-400 via-pink-400 to-cyan-400 bg-clip-text text-transparent">
                                MASTER SYNTHESIZER
                            </span>
                            <span className="text-[10px] bg-slate-800 px-1.5 py-0.5 rounded text-slate-400">8小節</span>
                        </div>

                        <div className="flex items-center gap-1.5">
                            <button
                                onClick={togglePlay}
                                className={`px-3 py-1 rounded font-bold text-xs shadow ${
                                    playing ? "bg-amber-500 text-slate-950 animate-pulse" : "bg-pink-600 text-white"
                                }`}
                            >
                                {playing ? "■ 停止" : "▶ 再生"}
                            </button>
                            <button onClick={restartFromTop} className="px-2 py-1 bg-slate-800 text-slate-200 rounded text-[11px]">
                                ⏮ 頭
                            </button>

                            <button
                                onClick={() => setIsLooping(!isLooping)}
                                className={`px-2 py-1 rounded text-[10px] font-bold ${isLooping ? "bg-cyan-600 text-white" : "bg-slate-800 text-slate-400"}`}
                            >
                                リピート: {isLooping ? "ON" : "OFF"}
                            </button>

                            <button
                                onClick={() => setIsRandomMode(!isRandomMode)}
                                className={`px-2 py-1 rounded text-[10px] font-bold ${isRandomMode ? "bg-purple-600 text-white" : "bg-slate-800 text-slate-400"}`}
                            >
                                ランダム: {isRandomMode ? "ON" : "OFF"}
                            </button>
                            
                            <div className="flex items-center gap-1 bg-slate-950 px-2 py-0.5 rounded border border-slate-800">
                                <span className="text-[9px] text-slate-400">BPM</span>
                                <input
                                    type="number"
                                    value={bpm}
                                    onChange={e => setBpm(Math.max(60, Math.min(190, Number(e.target.value))))}
                                    className="w-10 bg-slate-900 text-center font-bold text-pink-400 rounded text-xs py-0.5"
                                />
                            </div>
                        </div>
                    </header>

                    {/* タブナビゲーション */}
                    <nav className="bg-slate-900/90 border-b border-slate-800 px-2 py-1.5 flex gap-1 overflow-x-auto">
                        {[
                            { id: "PLAY", label: "🕺 メイン演奏・エディタ" },
                            { id: "AFRICAN", label: "🌍 アフリカン20+ドラム" },
                            { id: "VOICE", label: "🎤 ボイス録音スタジオ" },
                            { id: "SAVE", label: "💾 記憶リスト" },
                        ].map(t => (
                            <button
                                key={t.id}
                                onClick={() => setTab(t.id)}
                                className={`px-3 py-1 rounded text-center font-bold transition-all shrink-0 ${
                                    tab === t.id ? "bg-amber-600 text-slate-950 shadow" : "bg-slate-800/60 text-slate-400 hover:text-slate-200"
                                }`}
                            >
                                {t.label}
                            </button>
                        ))}
                    </nav>

                    <div className="bg-slate-900/50 px-3 py-1 text-[11px] text-cyan-400 border-b border-slate-900 truncate flex justify-between items-center">
                        <span>💡 {status}</span>
                        <button onClick={generateAiAccompaniment} className="bg-pink-600 text-white px-2 py-0.5 rounded text-[10px] font-bold">
                            ✨ AI伴奏生成
                        </button>
                    </div>

                    <main className="p-2 flex flex-col gap-3">

                        {tab === "PLAY" && (
                            <>
                                {/* 楽器セレクター */}
                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-2 flex flex-col gap-2">
                                    <span className="text-[11px] font-bold text-slate-300">🎵 楽器選択:</span>
                                    <div className="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 gap-1.5">
                                        {INSTRUMENTS.map(inst => (
                                            <button
                                                key={inst.id}
                                                onClick={() => setSelectedInstrument(inst.id)}
                                                className={`py-2 px-2 rounded-lg font-bold text-xs transition-all border flex items-center justify-center gap-1 shadow ${
                                                    selectedInstrument === inst.id
                                                        ? `bg-gradient-to-r ${inst.color} border-white text-white ring-2 ring-white/30`
                                                        : "bg-slate-950 border-slate-800 text-slate-400 hover:text-slate-200"
                                                }`}
                                            >
                                                {inst.label}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* ドラムパーツ選択 */}
                                {selectedInstrument === "drums" && (
                                    <div className="bg-slate-900 border border-slate-800 rounded-lg p-2.5 flex items-center gap-2">
                                        <span className="text-[11px] font-bold text-slate-300">ドラムパーツ切替:</span>
                                        <div className="flex gap-1.5 overflow-x-auto">
                                            {DRUM_PARTS.map(part => (
                                                <button
                                                    key={part.id}
                                                    onClick={() => setSelectedDrumPart(part.id)}
                                                    className={`px-3 py-1 rounded text-[11px] font-bold shrink-0 ${
                                                        selectedDrumPart === part.id ? "bg-red-600 text-white shadow" : "bg-slate-800 text-slate-300"
                                                    }`}
                                                >
                                                    {part.label}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {/* 音階選択 */}
                                {selectedInstrument !== "drums" && selectedInstrument !== "voice" && (
                                    <div className="bg-slate-900 border border-slate-800 rounded-lg p-2.5 flex items-center gap-1.5">
                                        <span className="text-[11px] font-bold text-slate-300">音階選択:</span>
                                        <div className="flex gap-1 overflow-x-auto pb-1">
                                            {NOTES.map(n => (
                                                <button
                                                    key={n}
                                                    onClick={() => setSelectedNote(n)}
                                                    className={`px-2.5 py-1 rounded text-[11px] font-bold shrink-0 ${
                                                        selectedNote === n ? "bg-purple-600 text-white shadow" : "bg-slate-800 text-slate-300"
                                                    }`}
                                                >
                                                    {SOLFEGE[n]} ({n})
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {selectedInstrument === "voice" && (
                                    <div className="bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-[11px] text-pink-300">
                                        🎤 「ボイス」タブで音声を録音後、グリッドをクリックして配置するとリズムに合わせて再生されます。
                                    </div>
                                )}

                                {/* 小節切り替え */}
                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-2 flex flex-col gap-1.5">
                                    <div className="flex items-center justify-between">
                                        <span className="text-[11px] font-bold text-slate-300">
                                            小節セレクター: <strong className="text-pink-400 text-xs">{currentBar + 1}小節目 / 8小節</strong>
                                        </span>
                                        <div className="flex gap-1">
                                            <button onClick={clearCurrentInstrument} className="px-2 py-0.5 bg-red-950/60 text-red-300 text-[10px] rounded border border-red-800">
                                                この楽器をクリア
                                            </button>
                                            <button onClick={clearAll} className="px-2 py-0.5 bg-slate-800 text-slate-300 text-[10px] rounded border border-slate-700">
                                                全体クリア
                                            </button>
                                        </div>
                                    </div>
                                    <div className="flex gap-1 overflow-x-auto pb-1">
                                        {Array.from({ length: BARS }).map((_, b) => (
                                            <button
                                                key={b}
                                                onClick={() => setCurrentBar(b)}
                                                className={`w-8 h-8 shrink-0 rounded-full text-xs font-bold transition-all ${
                                                    currentBar === b ? "bg-amber-500 text-slate-950 ring-2 ring-amber-400/50" : "bg-slate-800 text-slate-400"
                                                }`}
                                            >
                                                {b + 1}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* グリッドマトリクス */}
                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 overflow-x-auto">
                                    <div className="flex items-center justify-between mb-2">
                                        <span className="text-xs font-bold text-amber-400">
                                            🎯 グリッドエディタ ({currentInstObj.label} / {currentBar + 1}小節目)
                                        </span>
                                    </div>
                                    
                                    <div className="grid gap-1 min-w-[540px]" style={{ gridTemplateColumns: "repeat(16, minmax(0, 1fr))" }}>
                                        {Array.from({ length: BAR_STEPS }).map((_, i) => {
                                            const stepIdx = currentBar * BAR_STEPS + i;
                                            const stepVal = instrumentSteps[selectedInstrument][stepIdx];
                                            const isCurrentPlay = playing && currentStep === i;

                                            let isActive = selectedInstrument === "drums" 
                                                ? (stepVal && stepVal[selectedDrumPart]) 
                                                : selectedInstrument === "voice" 
                                                ? !!stepVal 
                                                : !!stepVal;

                                            return (
                                                <button
                                                    key={i}
                                                    onClick={() => toggleStep(selectedInstrument, stepIdx)}
                                                    className={`aspect-[3/4] w-full rounded border flex flex-col items-center justify-center p-0.5 text-[9px] transition-all ${
                                                        isActive
                                                            ? "bg-gradient-to-t from-amber-600 to-pink-600 border-amber-400 text-white font-bold shadow-md shadow-amber-500/50 scale-105"
                                                            : "bg-slate-950 border-slate-800 text-slate-500 hover:border-slate-700"
                                                    } ${isCurrentPlay ? "ring-2 ring-cyan-400" : ""}`}
                                                >
                                                    <span className="font-bold text-[10px]">{i + 1}</span>
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>
                            </>
                        )}

                        {tab === "AFRICAN" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3">
                                <div className="text-xs font-bold text-amber-400">🌍 アフリカン＆ダンス 20種類のリズムプリセット一括適用スタジオ</div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-2">
                                    {AFRICAN_DRUM_PRESETS.map((preset, idx) => (
                                        <button
                                            key={idx}
                                            onClick={() => applyAfricanPreset(idx)}
                                            className="p-2 bg-slate-950 border border-slate-800 hover:border-amber-500 rounded text-left flex flex-col gap-1 transition-all"
                                        >
                                            <span className="font-bold text-slate-200 text-[11px]">{preset.name}</span>
                                            <span className="text-[10px] text-amber-400">BPM: {preset.bpm}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        {tab === "VOICE" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-4 flex flex-col items-center gap-4">
                                <div className="text-xs font-bold text-pink-400">🎤 ボイス録音・再生スタジオ</div>
                                <div className="flex gap-2">
                                    {!isRecordingVoice ? (
                                        <button onClick={startVoiceRecording} className="px-4 py-2 bg-red-600 hover:bg-red-500 text-white font-bold rounded text-xs shadow">
                                            🔴 ボイス録音開始
                                        </button>
                                    ) : (
                                        <button onClick={stopVoiceRecording} className="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold rounded text-xs shadow animate-pulse">
                                            ⏹ 録音停止
                                        </button>
                                    )}
                                </div>
                                {recordedVoiceAudio && (
                                    <div className="flex flex-col items-center gap-2">
                                        <span className="text-emerald-400 text-[11px]">✔ 録音されたボイスがあります</span>
                                        <button onClick={() => recordedVoiceAudio.play()} className="px-3 py-1 bg-slate-800 text-white rounded text-xs">
                                            ▶ 試聴する
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}

                        {tab === "SAVE" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3">
                                <div className="text-xs font-bold text-pink-400">💾 記憶リスト管理</div>
                                <div className="flex gap-2">
                                    <input 
                                        type="text" 
                                        placeholder="曲名を入力してください" 
                                        value={songName} 
                                        onChange={e => setSongName(e.target.value)} 
                                        className="flex-1 bg-slate-950 border border-slate-800 rounded px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-pink-500" 
                                    />
                                    <button onClick={saveProject} className="px-4 py-1.5 bg-pink-600 hover:bg-pink-500 text-white font-bold rounded text-xs shadow">
                                        記憶保存
                                    </button>
                                </div>
                                <div className="flex flex-col gap-1.5 mt-1 max-h-60 overflow-y-auto">
                                    {savedList.length === 0 ? (
                                        <span className="text-[10px] text-slate-500 text-center py-6">記憶された曲はありません</span>
                                    ) : (
                                        savedList.map((s, idx) => (
                                            <div key={idx} className="bg-slate-950 px-3 py-2 rounded border border-slate-800 flex justify-between items-center text-[11px]">
                                                <div className="flex flex-col">
                                                    <span className="font-bold text-slate-200">🎵 {s.name}</span>
                                                    <span className="text-[9px] text-pink-400">BPM: {s.bpm} | {s.time}</span>
                                                </div>
                                                <button onClick={() => loadProject(s)} className="px-2.5 py-1 bg-amber-600 text-slate-950 font-bold rounded text-[10px]">
                                                    呼び出し
                                                </button>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        )}

                    </main>
                </div>
            );
        }

        const container = document.getElementById('root');
        if (container) {
            ReactDOM.createRoot(container).render(<MasterSynthApp />);
        }
    </script>
</body>
</html>
