<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIC VICTORY - DLAND DTM v58.1 SAFE APPEND SAVER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans select-none pb-24 overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const ALBUM_POPS_20_MANIFEST = [
            { id: 1, title: "01 MIC VICTORY (Duun-Ta OP)", bpm: 110, key: "Cmajor", concept: "C0ドゥンた＋高音ペンタランダム" },
            { id: 2, title: "02 Velvet High-Random Cred", bpm: 106, key: "Gmajor", concept: "オフビートスネア＋散らばる高音スタッカート" },
            { id: 3, title: "03 Midnight Duun-Ta Isolation", bpm: 98, key: "Aminor", concept: "ディープC0ウェーブ＋スロー高音モザイク" },
            { id: 4, title: "04 High-Random Flashback 90s", bpm: 112, key: "Fmajor", concept: "エキゾチック高音変移＋ロック＆ストップ" },
            { id: 5, title: "05 Future Popin Victory", bpm: 122, key: "Dminor", concept: "フューチャーポップ基調の高音AIリフ" },
            { id: 6, title: "06 Sweet Crera Pop Parade", bpm: 112, key: "Cmajor", concept: "跳ねるスタッカートとブラス和音" },
            { id: 7, title: "07 Dland Radiant Pop Wave", bpm: 120, key: "Bbmajor", concept: "高揚感あるシンセパッド＋ポップスビート" },
            { id: 8, title: "08 Urban Popin Pulse", bpm: 116, key: "Eminor", concept: "都会的でタイトなポップロック感" },
            { id: 9, title: "09 Mic Victory Daylight Pop", bpm: 124, key: "Gmajor", concept: "疾走感あふれるメロディックポップ" },
            { id: 10, title: "10 Crera Popin Connection", bpm: 118, key: "Cminor", concept: "v58.0ポップ＋低音サブベース融合" },
            { id: 11, title: "11 Pastel Pop Illusion", bpm: 110, key: "Ebmajor", concept: "パステルカラーを想起させる高音変移" },
            { id: 12, title: "12 Dland Popin Ignition", bpm: 126, key: "F#minor", concept: "ハイテンポなポッピング特化ポップ" },
            { id: 13, title: "13 Velvet Pop Harmony", bpm: 106, key: "Dmajor", concept: "滑らかなバイオリン＆ピアノ重ね" },
            { id: 14, title: "14 Mic Victory Pop Odyssey", bpm: 120, key: "Amajor", concept: "壮大なポップスオーケストレーション" },
            { id: 15, title: "15 Electric Pop Starlight", bpm: 122, key: "Cmajor", concept: "きらびやかで弾けるAIシンセソロ" },
            { id: 16, title: "16 Groove Popin Delight", bpm: 114, key: "Gminor", concept: "グルーヴィーなベースと軽快ポップ" },
            { id: 17, title: "17 Dland Popin Horizon", bpm: 118, key: "Fmajor", concept: "水平線が抜けるようなオープンポップ" },
            { id: 18, title: "18 Crera Popin Climax", bpm: 128, key: "Cminor", concept: "全楽器AIポップ高密度フィナーレ" },
            { id: 19, title: "19 Mic Victory Pop Outro", bpm: 96, key: "Cmajor", concept: "余韻を残すポップピアノ残響" },
            { id: 20, title: "20 Dland Final Pop Limit", bpm: 120, key: "Cmajor", concept: "ポップ×ポッピングAI総合決戦" }
        ];

        const INSTRUMENTS = [
            { id: "subBass", label: "🔊 重低音サブベース", color: "from-amber-600 to-orange-700", scale: ["C0", "D0", "E0", "F0", "G0", "A0"] },
            { id: "bass", label: "🎸 ベース", color: "from-emerald-600 to-teal-600", scale: ["C1", "D1", "E1", "F1", "G1", "A1"] },
            { id: "drums", label: "🥁 ドラム", color: "from-red-600 to-amber-600", scale: ["kick", "snare", "hihat", "clap"] },
            { id: "synth", label: "🎹 AI高音シンセ", color: "from-cyan-600 to-blue-700", scale: ["C5", "D5", "E5", "G5", "A5", "C6", "D6"] },
            { id: "piano", label: "🎹 AIポップピアノ", color: "from-blue-600 to-indigo-600", scale: ["C4", "D4", "E4", "G4", "A4", "C5"] },
            { id: "trumpet", label: "🎺 ブラス・ホーン", color: "from-yellow-500 to-amber-600", scale: ["C4", "E4", "G4", "B4", "C5"] },
            { id: "guitar", label: "🎸 ギターカッティング", color: "from-orange-600 to-red-700", scale: ["G3", "C4", "E4", "G4", "B4"] },
            { id: "violin", label: "🎻 ストリングス", color: "from-amber-600 to-yellow-700", scale: ["C4", "G4", "A4", "E5"] },
            { id: "flute", label: "🪈 フルート・ハイ", color: "from-teal-500 to-cyan-600", scale: ["E5", "G5", "A5", "C6", "E6"] },
            { id: "loopTrack", label: "🔁 ループビート", color: "from-pink-600 to-rose-600", scale: ["C4", "E4", "G4"] },
        ];

        function MasterSynthApp() {
            const [tab, setTab] = React.useState("ALBUM_POPS");
            const [playing, setPlaying] = React.useState(false);
            const [flashColor, setFlashColor] = React.useState("border-cyan-500");
            const [bpm, setBpm] = React.useState(110);
            const [currentBar, setCurrentBar] = React.useState(0);
            const [currentStep, setCurrentStep] = React.useState(-1);
            const [activeAlbumTrackId, setActiveAlbumTrackId] = React.useState(1);
            const [barsCount, setBarsCount] = React.useState(8);
            const [status, setStatus] = React.useState("🛡️ v58.1 崩さない安全拡張＆アペンドセーバー準備完了");

            const BAR_STEPS = 16;
            const TOTAL_STEPS = barsCount * BAR_STEPS;

            const [selectedInstrument, setSelectedInstrument] = React.useState("synth");
            const [selectedDuration, setSelectedDuration] = React.useState("16n");
            const [aiDensity, setAiDensity] = React.useState(0.55);

            const [instrumentSteps, setInstrumentSteps] = React.useState(() => {
                const initial = {};
                INSTRUMENTS.forEach(inst => {
                    initial[inst.id] = new Array(8 * BAR_STEPS).fill(null);
                });
                return initial;
            });

            const [volumes, setVolumes] = React.useState({
                subBass: 6, bass: 3, drums: 3, synth: 2, piano: 2, trumpet: 0, guitar: 0, violin: 0, flute: 0, loopTrack: 0
            });

            const resizeBarsSafe = (newBarCount) => {
                const newTotalSteps = newBarCount * BAR_STEPS;
                setInstrumentSteps(prev => {
                    const next = {};
                    Object.keys(prev).forEach(instId => {
                        const oldArr = prev[instId];
                        const resized = new Array(newTotalSteps).fill(null);
                        for (let i = 0; i < Math.min(oldArr.length, newTotalSteps); i++) {
                            resized[i] = oldArr[i];
                        }
                        next[instId] = resized;
                    });
                    return next;
                });
                setBarsCount(newBarCount);
                if (currentBar >= newBarCount) setCurrentBar(newBarCount - 1);
                setStatus(`🎚️ 小節数を安全に ${newBarCount}bars へ拡張/調整しました（既存フレーズ保持）`);
            };

            const synthsRef = React.useRef(null);
            const loopRef = React.useRef(null);
            const masterGainRef = React.useRef(null);
            const [masterBassBoost, setMasterBassBoost] = React.useState(14);
            const [masterVolume, setMasterVolume] = React.useState(1.3);

            const [isRecording, setIsRecording] = React.useState(false);
            const mediaRecorderRef = React.useRef(null);
            const audioChunksRef = React.useRef([]);
            const destStreamRef = React.useRef(null);

            React.useEffect(() => {
                const masterGain = new Tone.Gain(masterVolume).toDestination();
                masterGainRef.current = masterGain;

                const eq = new Tone.EQ3({ low: masterBassBoost, lowFrequency: 160, mid: 2.0, high: 2.5 }).connect(masterGain);
                const reverb = new Tone.Reverb({ decay: 1.5, wet: 0.15 }).connect(eq);
                const delay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.2, wet: 0.08 }).connect(reverb);

                const cGains = {};
                INSTRUMENTS.forEach(inst => {
                    cGains[inst.id] = new Tone.Gain(Tone.dbToGain(volumes[inst.id] || 0)).connect(delay);
                });

                synthsRef.current = {
                    subBass: new Tone.MonoSynth({ oscillator: { type: "sine" }, envelope: { attack: 0.005, decay: 0.3, sustain: 0.5, release: 0.15 } }).connect(cGains.subBass),
                    bass: new Tone.MonoSynth({ oscillator: { type: "triangle" }, envelope: { attack: 0.01, decay: 0.25, sustain: 0.4, release: 0.12 } }).connect(cGains.bass),
                    synth: new Tone.Synth({ oscillator: { type: "triangle" }, envelope: { attack: 0.01, decay: 0.2, sustain: 0.3, release: 0.1 } }).connect(cGains.synth),
                    piano: new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.008, decay: 0.3, sustain: 0.25, release: 0.2 } }).connect(cGains.piano),
                    trumpet: new Tone.Synth({ oscillator: { type: "sawtooth" }, envelope: { attack: 0.03, decay: 0.2, sustain: 0.5, release: 0.1 } }).connect(cGains.trumpet),
                    guitar: new Tone.Synth({ oscillator: { type: "sawtooth" }, envelope: { attack: 0.005, decay: 0.15, sustain: 0.2, release: 0.08 } }).connect(cGains.guitar),
                    violin: new Tone.Synth({ oscillator: { type: "sawtooth" }, envelope: { attack: 0.05, decay: 0.2, sustain: 0.7, release: 0.2 } }).connect(cGains.violin),
                    flute: new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.04, decay: 0.2, sustain: 0.6, release: 0.2 } }).connect(cGains.flute),
                    loopTrack: new Tone.Synth({ oscillator: { type: "square" }, envelope: { attack: 0.01, decay: 0.2, sustain: 0.3, release: 0.1 } }).connect(cGains.loopTrack),
                    drums: {
                        kick: new Tone.MembraneSynth({ pitchDecay: 0.05, octaves: 5, oscillator: { type: "sine" }, envelope: { attack: 0.0001, decay: 0.25, sustain: 0.01, release: 0.1 } }).connect(cGains.drums),
                        snare: new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.0001, decay: 0.15, sustain: 0 } }).connect(cGains.drums),
                        hihat: new Tone.MetalSynth({ frequency: 1000, envelope: { attack: 0.0005, decay: 0.02, release: 0.01 }, harmonicity: 5.1, modulationIndex: 25, resonance: 6000, octaves: 1.2 }).connect(cGains.drums),
                        clap: new Tone.NoiseSynth({ noise: { type: "pink" }, envelope: { attack: 0.004, decay: 0.12, sustain: 0 } }).connect(cGains.drums),
                    },
                    eq, reverb, delay
                };

                return () => { Tone.Transport.stop(); Tone.Transport.cancel(); };
            }, []);

            React.useEffect(() => {
                Tone.Transport.bpm.value = bpm;
                Tone.Transport.cancel();

                if (playing) {
                    let stepCounter = 0;
                    loopRef.current = new Tone.Loop(time => {
                        let step = stepCounter % TOTAL_STEPS;
                        const bar = Math.floor(step / BAR_STEPS);
                        const sInBar = step % BAR_STEPS;

                        setCurrentStep(sInBar);
                        setCurrentBar(bar);

                        if (sInBar === 0) {
                            const colors = ["border-cyan-500", "border-pink-500", "border-amber-500", "border-emerald-500"];
                            setFlashColor(colors[Math.floor(Math.random() * colors.length)]);
                        }

                        const syns = synthsRef.current;
                        if (!syns) return;

                        Object.keys(instrumentSteps).forEach(instKey => {
                            const item = instrumentSteps[instKey][step];
                            if (!item) return;

                            if (instKey === "drums" && typeof item === "object") {
                                if (item.kick) syns.drums.kick.triggerAttackRelease("C0", "16n", time);
                                if (item.snare) syns.drums.snare.triggerAttackRelease("16n", time);
                                if (item.hihat) syns.drums.hihat.triggerAttackRelease("32n", time, 0.8);
                                if (item.clap) syns.drums.clap.triggerAttackRelease("16n", time);
                            } else {
                                const note = typeof item === "object" ? item.note : item;
                                const dur = typeof item === "object" ? (item.dur || "16n") : "16n";
                                if (instKey === "subBass") syns.subBass.triggerAttackRelease(note || "C0", dur, time);
                                else if (syns[instKey]) syns[instKey].triggerAttackRelease(note || "C4", dur, time);
                            }
                        });

                        stepCounter++;
                    }, "16n").start(0);

                    Tone.Transport.start();
                } else {
                    Tone.Transport.stop();
                }
            }, [playing, bpm, instrumentSteps]);

            const togglePlay = async () => {
                await Tone.start();
                setPlaying(!playing);
                setStatus(playing ? "停止しました" : `▶ 再生中 (BPM: ${bpm})`);
            };

            const startRecording = async () => {
                try {
                    await Tone.start();
                    if (!destStreamRef.current) {
                        const dest = Tone.context.createMediaStreamDestination();
                        Tone.getDestination().connect(dest);
                        destStreamRef.current = dest.stream;
                    }

                    audioChunksRef.current = [];
                    const recorder = new MediaRecorder(destStreamRef.current, {
                        mimeType: MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : 'audio/webm'
                    });

                    recorder.ondataavailable = (event) => {
                        if (event.data.size > 0) audioChunksRef.current.push(event.data);
                    };

                    recorder.onstop = () => {
                        const blob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
                        a.download = `MIC_VICTORY_DLAND_SAFEAPPEND_${timestamp}.webm`;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                        setStatus("🎙️ 崩さない全体ミックス録音ファイル書き出し完了！");
                    };

                    recorder.start();
                    mediaRecorderRef.current = recorder;
                    setIsRecording(true);
                    if (!playing) setPlaying(true);
                    setStatus("🔴 崩さない全体録音中...");
                } catch (e) {
                    console.error(e);
                    setStatus("⚠️ 録音初期化エラー");
                }
            };

            const stopRecording = () => {
                if (mediaRecorderRef.current && isRecording) {
                    mediaRecorderRef.current.stop();
                    setIsRecording(false);
                }
            };

            const safeAppendExportJSON = () => {
                const projectData = {
                    app: "MIC VICTORY DLAND v58.1 SAFE-APPEND",
                    exportDate: new Date().toISOString(),
                    activeAlbumTrackId,
                    barsCount,
                    bpm,
                    volumes,
                    instrumentSteps
                };
                const blob = new Blob([JSON.stringify(projectData, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `DLAND_SAFE_APPEND_TR${activeAlbumTrackId.toString().padStart(2, '0')}_${barsCount}bars.json`;
                a.click();
                URL.revokeObjectURL(url);
                setStatus(`💾 崩さない安全拡張プロジェクト（${barsCount}bars）JSONセーブ完了！`);
            };

            const safeAppendImportJSON = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        if (parsed.instrumentSteps) {
                            setInstrumentSteps(parsed.instrumentSteps);
                            if (parsed.barsCount) setBarsCount(parsed.barsCount);
                            if (parsed.bpm) setBpm(parsed.bpm);
                            setStatus("📂 安全アペンドプロジェクトの読み込み・マージ完了！");
                        }
                    } catch (err) {
                        setStatus("⚠️ JSONパースエラー");
                    }
                };
                reader.readAsText(file);
            };

            const generateAiMelodyForInstrument = (targetInstId) => {
                const instMeta = INSTRUMENTS.find(i => i.id === targetInstId);
                if (!instMeta) return;

                const scale = instMeta.scale;
                const seed = targetInstId.length * 41 + activeAlbumTrackId * 13;

                setInstrumentSteps(prev => {
                    const currentArr = [...prev[targetInstId]];
                    for (let i = 0; i < TOTAL_STEPS; i++) {
                        const stepInBar = i % BAR_STEPS;
                        const pseudo = Math.abs(Math.sin((i + 1) * seed * 0.75)) * 10000;
                        const r = pseudo - Math.floor(pseudo);
                        const isPopinAccent = (stepInBar === 2 || stepInBar === 6 || stepInBar === 10 || stepInBar === 14);

                        if (targetInstId === "drums") {
                            const isKick = (stepInBar === 0 || stepInBar === 8 || (r < 0.25 && stepInBar % 4 === 2));
                            const isSnare = (stepInBar === 4 || stepInBar === 12);
                            const isHihat = (stepInBar % 2 === 1);
                            currentArr[i] = currentArr[i] || { kick: isKick, snare: isSnare, hihat: isHihat, clap: isSnare };
                        } else {
                            if (!currentArr[i] && (r < aiDensity || (isPopinAccent && r < aiDensity + 0.3))) {
                                const noteIdx = Math.floor(Math.abs(Math.sin(i * seed * 1.7)) * scale.length) % scale.length;
                                currentArr[i] = { note: scale[noteIdx], dur: isPopinAccent ? "8n" : "16n" };
                            }
                        }
                    }
                    return { ...prev, [targetInstId]: currentArr };
                });
                setStatus(`✨ 【${instMeta.label}】崩さない安全アペンドAIメロディ追加完了`);
            };

            const applyPopsAlbumTrackAI = (track) => {
                setActiveAlbumTrackId(track.id);
                setBpm(track.bpm);
                setStatus(`💿 TR #${track.id.toString().padStart(2, '0')} [${track.title}] 基軸プリセット展開完了`);
            };

            const toggleStepManual = (instKey, idx) => {
                const meta = INSTRUMENTS.find(i => i.id === instKey);
                setInstrumentSteps(prev => {
                    const currentArr = [...prev[instKey]];
                    if (instKey === "drums") {
                        const cur = currentArr[idx] || { kick: false, snare: false, hihat: false, clap: false };
                        const updated = { ...cur, kick: !cur.kick };
                        const has = Object.values(updated).some(Boolean);
                        currentArr[idx] = has ? updated : null;
                    } else {
                        const defaultNote = meta.scale[0] || "C4";
                        currentArr[idx] = currentArr[idx] ? null : { note: defaultNote, dur: selectedDuration };
                    }
                    return { ...prev, [instKey]: currentArr };
                });
            };

            return (
                <div className={`min-h-screen bg-slate-950 text-slate-100 flex flex-col text-xs font-sans select-none pb-24 overflow-x-hidden border-8 transition-colors duration-300 ${flashColor}`}>
                    <header className="bg-slate-900 border-b border-slate-800 px-3 py-2 flex items-center justify-between gap-2 sticky top-0 z-40 shadow-lg">
                        <span className="font-black text-sm bg-gradient-to-r from-amber-400 via-pink-400 to-cyan-400 bg-clip-text text-transparent">
                            MIC VICTORY <span className="text-[10px] text-pink-400 font-bold">v58.1 Safe-Append Saver</span>
                        </span>
                        <div className="flex items-center gap-1.5 flex-wrap">
                            <button onClick={togglePlay} className={`px-3 py-1 rounded font-bold text-xs shadow ${playing ? "bg-amber-400 text-slate-950 animate-bounce" : "bg-pink-600 text-white"}`}>
                                {playing ? "■ 停止" : "▶ 再生"}
                            </button>
                            <div className="flex items-center gap-1 bg-slate-950 px-2 py-0.5 rounded border border-slate-800">
                                <span className="text-[9px] text-slate-400">BPM</span>
                                <input type="number" value={bpm} onChange={e => setBpm(Math.max(60, Math.min(220, Number(e.target.value))))} className="w-12 bg-slate-900 text-center font-bold text-pink-400 rounded text-xs py-0.5" />
                            </div>
                        </div>
                    </header>

                    {/* v57.0風セーバー・拡張コントロールパネル統合 */}
                    <div className="bg-slate-900/95 border-b border-slate-800 px-3 py-2 flex flex-wrap items-center justify-between gap-2 shadow">
                        <div className="flex items-center gap-2 flex-wrap">
                            <span className="text-xs font-bold text-pink-400">🛡️ 小節拡張:</span>
                            <div className="flex gap-1">
                                {[8, 12, 16].map(b => (
                                    <button key={b} onClick={() => resizeBarsSafe(b)} className={`px-2 py-0.5 rounded text-[11px] font-bold ${barsCount === b ? "bg-amber-500 text-slate-950" : "bg-slate-800 text-slate-400"}`}>
                                        {b}小節
                                    </button>
                                ))}
                            </div>
                            {!isRecording ? (
                                <button onClick={startRecording} className="px-2.5 py-1 bg-red-600 hover:bg-red-500 text-white font-bold rounded text-xs shadow">
                                    ● 全体記録（再生連動）
                                </button>
                            ) : (
                                <button onClick={stopRecording} className="px-2.5 py-1 bg-slate-700 hover:bg-slate-600 text-white font-bold rounded text-xs shadow animate-pulse">
                                    ■ 録音停止・書出
                                </button>
                            )}
                        </div>
                        <div className="flex items-center gap-2 flex-wrap">
                            <button onClick={safeAppendExportJSON} className="px-2.5 py-1 bg-gradient-to-r from-cyan-600 to-blue-600 text-white font-bold rounded text-xs shadow">
                                💾 安全アペンドセーバー
                            </button>
                            <label className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-cyan-300 font-bold rounded text-xs shadow cursor-pointer border border-slate-700">
                                📂 読込マージ
                                <input type="file" accept=".json" onChange={safeAppendImportJSON} className="hidden" />
                            </label>
                        </div>
                    </div>

                    <nav className="bg-slate-900/90 border-b border-slate-800 px-2 py-1.5 flex gap-1 overflow-x-auto">
                        {[
                            { id: "ALBUM_POPS", label: "💿 20曲アルバム(ドゥンた・高音ランダム)" },
                            { id: "INSTRUMENT_AI", label: "🎛️ 各楽器手動・安全アペンドAIメロディ" },
                        ].map(t => (
                            <button key={t.id} onClick={() => setTab(t.id)} className={`px-3 py-1 rounded text-center font-bold transition-all shrink-0 ${tab === t.id ? "bg-amber-500 text-slate-950 shadow" : "bg-slate-800/60 text-slate-400"}`}>
                                {t.label}
                            </button>
                        ))}
                    </nav>

                    <main className="p-2 flex flex-col gap-3">
                        {status && (
                            <div className="bg-slate-900 border border-slate-800 text-cyan-300 px-3 py-1.5 rounded text-[11px] font-bold">
                                {status}
                            </div>
                        )}

                        {tab === "ALBUM_POPS" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3 shadow">
                                <div className="flex justify-between items-center">
                                    <span className="text-xs font-bold text-amber-400">💿 20曲アルバム (ドゥンたリズム ＆ 高音ランダム)</span>
                                    <span className="text-[10px] text-pink-400 font-bold">Active: TR#{activeAlbumTrackId.toString().padStart(2, '0')}</span>
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-2 max-h-[500px] overflow-y-auto pr-1">
                                    {ALBUM_POPS_20_MANIFEST.map(tr => (
                                        <div key={tr.id} onClick={() => applyPopsAlbumTrackAI(tr)} className={`p-2.5 rounded-lg border cursor-pointer transition-all flex flex-col gap-1 ${activeAlbumTrackId === tr.id ? "bg-gradient-to-r from-amber-600/45 to-pink-600/45 border-amber-400 shadow-md" : "bg-slate-950 border-slate-800 hover:border-slate-700"}`}>
                                            <div className="flex justify-between items-center">
                                                <span className="text-[11px] font-black text-amber-300">TR #{tr.id.toString().padStart(2, '0')}</span>
                                                <span className="text-[10px] text-bold text-cyan-400 bg-slate-900 px-1.5 py-0.5 rounded">{tr.bpm} BPM</span>
                                            </div>
                                            <div className="text-[11px] font-bold text-slate-100 truncate">{tr.title}</div>
                                            <div className="text-[10px] text-slate-400 line-clamp-1">{tr.concept}</div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {tab === "INSTRUMENT_AI" && (
                            <div className="flex flex-col gap-3">
                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-2.5 shadow">
                                    <div className="flex justify-between items-center flex-wrap gap-2">
                                        <span className="text-xs font-bold text-amber-400">① 対象楽器の選択 & 安全アペンドAI密度調整</span>
                                        <div className="flex items-center gap-2">
                                            <span className="text-[10px] text-slate-300">密度: {Math.round(aiDensity * 100)}%</span>
                                            <input type="range" min="0.2" max="0.9" step="0.05" value={aiDensity} onChange={e => setAiDensity(Number(e.target.value))} className="accent-amber-500" />
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 sm:grid-cols-5 gap-1.5">
                                        {INSTRUMENTS.map(inst => (
                                            <button key={inst.id} onClick={() => setSelectedInstrument(inst.id)} className={`py-2 px-1 rounded-lg font-bold text-[11px] border flex items-center justify-center gap-1 shadow ${selectedInstrument === inst.id ? `bg-gradient-to-r ${inst.color} border-white text-white` : "bg-slate-950 border-slate-800 text-slate-400"}`}>
                                                {inst.label}
                                            </button>
                                        ))}
                                    </div>
                                    <div className="flex gap-2 mt-1">
                                        <button onClick={() => generateAiMelodyForInstrument(selectedInstrument)} className="flex-1 py-2 bg-gradient-to-r from-amber-500 to-pink-500 text-slate-950 font-black rounded-lg text-xs shadow hover:opacity-90">
                                            ✨ 選択楽器（{INSTRUMENTS.find(i => i.id === selectedInstrument)?.label}）に崩さない安全アペンドAI追加
                                        </button>
                                    </div>
                                </div>

                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3 shadow">
                                    <div className="flex items-center justify-between">
                                        <span className="text-xs font-bold text-cyan-400">② ステップ編集ビュー：{INSTRUMENTS.find(i => i.id === selectedInstrument)?.label} ({barsCount}bars)</span>
                                        <span className="text-[10px] text-pink-400">既存フレーズ保護・後半アペンド対応</span>
                                    </div>

                                    <div className="flex items-center justify-between bg-slate-950 p-2 rounded border border-slate-800 overflow-x-auto">
                                        <span className="text-[11px] text-slate-300 shrink-0">小節: <strong className="text-amber-400">{currentBar + 1} / {barsCount}</strong></span>
                                        <div className="flex gap-1 flex-wrap">
                                            {Array.from({ length: barsCount }).map((_, b) => (
                                                <button key={b} onClick={() => setCurrentBar(b)} className={`w-6 h-6 rounded-full text-xs font-bold shrink-0 ${currentBar === b ? "bg-amber-500 text-slate-950" : "bg-slate-800 text-slate-400"}`}>{b + 1}</button>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="overflow-x-auto bg-slate-950 p-2 rounded border border-slate-800">
                                        <div className="grid gap-1 min-w-[500px]" style={{ gridTemplateColumns: "repeat(16, minmax(0, 1fr))" }}>
                                            {Array.from({ length: BAR_STEPS }).map((_, i) => {
                                                const stepIdx = currentBar * BAR_STEPS + i;
                                                const stepVal = instrumentSteps[selectedInstrument][stepIdx];
                                                const isCurrentPlay = playing && currentStep === i;
                                                let isActive = !!stepVal;

                                                return (
                                                    <button key={i} onClick={() => toggleStepManual(selectedInstrument, stepIdx)} className={`aspect-[3/4] w-full rounded border flex flex-col items-center justify-center text-[9px] ${isActive ? "bg-gradient-to-t from-amber-600 to-pink-600 border-white text-white font-bold" : "bg-slate-900 border-slate-800 text-slate-500"} ${isCurrentPlay ? "ring-2 ring-cyan-400" : ""}`}>
                                                        <span>{i + 1}</span>
                                                        {stepVal && typeof stepVal === "object" && stepVal.note && (
                                                            <span className="text-[7px] text-yellow-200">{stepVal.note}</span>
                                                        )}
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        if (rootElement) {
            ReactDOM.createRoot(rootElement).render(<MasterSynthApp />);
        }
    </script>
</body>
</html>
