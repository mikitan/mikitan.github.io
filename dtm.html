<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIC VICTORY - MASTER SYNTHESIZER v40.0 (MICVICTORIES LAND 20-BEAT & SOUL POP BALLAD)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans select-none pb-20 overflow-x-hidden">
    <div id="root">
        <div class="flex items-center justify-center h-screen text-amber-400 font-bold text-sm animate-pulse">
            読み込み中... (MICVICTORIES LAND v40.0 - 20 BEAT & SOUL POP BALLAD)
        </div>
    </div>

    <script type="text/babel">
        try {
            function MasterSynthApp() {
                const [tab, setTab] = React.useState("ALL_GRID");
                const [playing, setPlaying] = React.useState(false);
                const [flashColor, setFlashColor] = React.useState("border-amber-600");
                const [bpm, setBpm] = React.useState(108);
                const [currentBar, setCurrentBar] = React.useState(0);
                const [currentStep, setCurrentStep] = React.useState(-1);
                const [status, setStatus] = React.useState("🏰 MICVICTORIES LAND v40.0: 20ビート・ループ・ソウルポップバラード・全体グリッド完全同期");

                const BARS = 8;
                const BAR_STEPS = 16;
                const TOTAL_STEPS = BARS * BAR_STEPS;

                const [selectedInstrument, setSelectedInstrument] = React.useState("bandGuitar");
                const [register, setRegister] = React.useState("mid"); 
                const [selectedNote, setSelectedNote] = React.useState("C3");
                
                // 20ビート・20ループの選択状態
                const [selectedDrumPattern, setSelectedDrumPattern] = React.useState("pattern01");
                const [selectedBeatPattern, setSelectedBeatPattern] = React.useState("beat01");
                const [selectedLoopPattern, setSelectedLoopPattern] = React.useState("loop01");

                // 全体音響個別パラメータ (重低音・パイプ音・ロボットFX含む)
                const [audioMixer, setAudioMixer] = React.useState({
                    bandGuitar: { volume: 0, pan: 0 },
                    subBass: { volume: 4, pan: 0 }, // 重低音
                    pipeSound: { volume: 2, pan: -0.3 }, // パイプ音
                    robotFx: { volume: 1, pan: 0.3 }, // ロボットFX
                    drums20: { volume: 3, pan: 0 }, // 20ビートドラム
                    soulPiano: { volume: -1, pan: -0.2 },
                    balladStrings: { volume: -2, pan: 0.2 },
                    vocalRap: { volume: 3, pan: 0 }
                });

                const [slotName, setSlotName] = React.useState("MICVICTORIES_LAND_SOUL_01");
                const [savedSlots, setSavedSlots] = React.useState({});

                // グリッドデータ全体
                const [instrumentSteps, setInstrumentSteps] = React.useState({
                    bandGuitar: new Array(TOTAL_STEPS).fill(null),
                    subBass: new Array(TOTAL_STEPS).fill(null),
                    pipeSound: new Array(TOTAL_STEPS).fill(null),
                    robotFx: new Array(TOTAL_STEPS).fill(null),
                    drums20: new Array(TOTAL_STEPS).fill(null),
                    soulPiano: new Array(TOTAL_STEPS).fill(null),
                    balladStrings: new Array(TOTAL_STEPS).fill(null),
                    vocalRap: new Array(TOTAL_STEPS).fill(null),
                });

                const channelsRef = React.useRef({});
                const synthsRef = React.useRef(null);
                const loopRef = React.useRef(null);

                const NOTES_MAP = {
                    low: ["C1", "D1", "E1", "F1", "G1", "A1", "B1", "C2"],
                    mid: ["C2", "D2", "E2", "F2", "G2", "A2", "B2", "C3", "D3", "E3", "F3", "G3", "A3", "B3", "C4"],
                    high: ["C3", "D3", "E3", "F3", "G3", "A3", "B3", "C4", "D4", "E4", "F4", "G4", "A4", "B4", "C5"]
                };
                const NOTES = NOTES_MAP[register];

                const SOLFEGE = { 
                    "C1": "ド", "D1": "レ", "E1": "ミ", "F1": "ファ", "G1": "ソ", "A1": "ラ", "B1": "シ", 
                    "C2": "ド", "D2": "レ", "E2": "ミ", "F2": "ファ", "G2": "ソ", "A2": "ラ", "B2": "シ", 
                    "C3": "ド", "D3": "レ", "E3": "ミ", "F3": "ファ", "G3": "ソ", "A3": "ラ", "B3": "シ", 
                    "C4": "高ド", "D4": "高レ", "E4": "高ミ", "F4": "高ファ", "G4": "高ソ", "A4": "高ラ", "B4": "高シ", "C5": "超ド" 
                };

                const INSTRUMENTS = [
                    { id: "bandGuitar", label: "🎸 ロックギター", color: "from-amber-700 to-red-900" },
                    { id: "subBass", label: "🔊 重低音サブベース", color: "from-orange-800 to-amber-950" },
                    { id: "pipeSound", label: "🪈 パイプ音シンセ", color: "from-teal-800 to-cyan-950" },
                    { id: "robotFx", label: "🤖 ロボットFX", color: "from-purple-800 to-indigo-950" },
                    { id: "drums20", label: "🥁 20ビートドラム", color: "from-red-900 to-rose-950" },
                    { id: "soulPiano", label: "🎹 ソウルピアノ", color: "from-slate-700 to-slate-900" },
                    { id: "balladStrings", label: "🎻 バラードストリングス", color: "from-emerald-800 to-teal-950" },
                    { id: "vocalRap", label: "🎤 Vocal & ラップ", color: "from-pink-800 to-rose-950" },
                ];

                // 20種類のドラムパターンリスト
                const DRUM_PATTERNS_20 = Array.from({ length: 20 }, (_, i) => ({
                    id: `pattern${String(i+1).padStart(2, '0')}`,
                    label: `${i+1}. ${["スタンダードロック", "ファンクビート", "ソウルポップ", "バラードスロー", "重低音HIPHOP", "ディスコダンス", "エレクトロニカ", "シャッフルロック", "4つ打ちダンサー", "ルーズグルーヴ", "アグレッシブ", "シネマティック", "アンセムビート", "レトロポップ", "ジャジービート", "ラテンミックス", "クラブビート", "ストリート", "ヴィクトリー行進曲", "ファイナルビート"][i]}`
                }));

                // 20種類のビートパターンリスト
                const BEAT_PATTERNS_20 = Array.from({ length: 20 }, (_, i) => ({
                    id: `beat${String(i+1).padStart(2, '0')}`,
                    label: `${i+1}. ${["8ビートロック", "16ビートファンク", "ソウルバラードビート", "ヘヴィロック", "ディスコリズム", "スローバラード", "ダンスポップ", "シャッフルビート", "シンセビート", "ブレイクビート", "アコースティック風", "モダンポップ", "重低音ビート", "ハイエナジー", "グルーヴビート", "ブルース風", "サイケデリック", "フュージョン", "ランドアンセム", "グランドフィナーレ"][i]}`
                }));

                // 20種類のループパターンリスト
                const LOOP_PATTERNS_20 = Array.from({ length: 20 }, (_, i) => ({
                    id: `loop${String(i+1).padStart(2, '0')}`,
                    label: `${i+1}. ${["アルペジオループ", "コードスタボ", "ベースリフ", "メロディックリフ", "シンセパッド", "ピアノフレーズ", "ストリングスロング", "パイプ音ループ", "ロボットシーケンス", "ソウルポップ進行", "バラードアルペジオ", "ロックカッティング", "アンビエント", "リズミックコード", "スパークル", "エモーショナル", "フューチャー", "トランス風", "ビクトリーメロディ", "エンドレスループ"][i]}`
                }));

                // 音響初期化
                React.useEffect(() => {
                    try {
                        const masterLimiter = new Tone.Limiter(-0.2).toDestination();
                        const masterReverb = new Tone.Reverb({ roomSize: 0.7, wet: 0.3 }).connect(masterLimiter);
                        const masterComp = new Tone.Compressor({ threshold: -16, ratio: 4 }).connect(masterReverb);

                        const chans = {};
                        const syns = {};

                        Object.keys(audioMixer).forEach(instKey => {
                            const mix = audioMixer[instKey];
                            const channel = new Tone.Channel({
                                volume: mix.volume,
                                pan: mix.pan
                            }).connect(masterComp);
                            chans[instKey] = channel;

                            if (instKey === "bandGuitar") {
                                syns.bandGuitar = new Tone.PolySynth(Tone.Synth, {
                                    oscillator: { type: "sawtooth" },
                                    envelope: { attack: 0.02, decay: 0.3, sustain: 0.5, release: 0.3 }
                                }).connect(channel);
                            } else if (instKey === "subBass") {
                                syns.subBass = new Tone.MonoSynth({
                                    oscillator: { type: "sine" }, // 重低音サブベース
                                    envelope: { attack: 0.05, decay: 0.6, sustain: 0.8, release: 0.5 }
                                }).connect(channel);
                            } else if (instKey === "pipeSound") {
                                syns.pipeSound = new Tone.Synth({
                                    oscillator: { type: "triangle" }, // パイプ音風
                                    envelope: { attack: 0.01, decay: 0.4, sustain: 0.6, release: 0.3 }
                                }).connect(channel);
                            } else if (instKey === "robotFx") {
                                syns.robotFx = new Tone.Synth({
                                    oscillator: { type: "square" }, // ロボットFX
                                    envelope: { attack: 0.005, decay: 0.15, sustain: 0.1, release: 0.1 }
                                }).connect(channel);
                            } else if (instKey === "drums20") {
                                syns.drums20 = new Tone.MembraneSynth({
                                    pitchDecay: 0.05, octaves: 4,
                                    oscillator: { type: "sine" },
                                    envelope: { attack: 0.001, decay: 0.4, sustain: 0.01, release: 0.2 }
                                }).connect(channel);
                            } else if (["soulPiano", "balladStrings"].includes(instKey)) {
                                syns[instKey] = new Tone.Synth({
                                    oscillator: { type: instKey === "soulPiano" ? "sine" : "sawtooth" },
                                    envelope: { attack: 0.05, decay: 0.5, sustain: 0.6, release: 0.4 }
                                }).connect(channel);
                            } else if (instKey === "vocalRap") {
                                syns.vocalRap = new Tone.Synth({
                                    oscillator: { type: "triangle" },
                                    envelope: { attack: 0.02, decay: 0.3, sustain: 0.4, release: 0.2 }
                                }).connect(channel);
                            }
                        });

                        channelsRef.current = chans;
                        synthsRef.current = syns;
                    } catch (e) {
                        console.error("Audio Init Error:", e);
                    }

                    return () => {
                        Tone.Transport.stop();
                        Tone.Transport.cancel();
                    };
                }, []);

                const updateMixerParam = (instKey, paramName, value) => {
                    setAudioMixer(prev => ({
                        ...prev,
                        [instKey]: { ...prev[instKey], [paramName]: value }
                    }));
                    const chan = channelsRef.current[instKey];
                    if (chan) {
                        if (paramName === "volume") chan.volume.value = value;
                        if (paramName === "pan") chan.pan.value = value;
                    }
                };

                // 再生ループ
                React.useEffect(() => {
                    Tone.Transport.bpm.value = bpm;
                    Tone.Transport.cancel();

                    if (playing) {
                        let stepCounter = 0;
                        loopRef.current = new Tone.Loop(time => {
                            let step = stepCounter % TOTAL_STEPS;
                            const bar = Math.floor(step / BAR_STEPS);
                            const sInBar = step % BAR_STEPS;

                            setCurrentStep(sInBar);
                            setCurrentBar(bar);

                            if (sInBar % 2 === 0) setFlashColor("border-amber-500");

                            const syns = synthsRef.current;
                            if (!syns) return;

                            Object.keys(instrumentSteps).forEach(instKey => {
                                const val = instrumentSteps[instKey][step];
                                if (!val) return;

                                if (instKey === "drums20") {
                                    syns.drums20.triggerAttackRelease("C1", "8n", time);
                                } else if (instKey === "subBass") {
                                    syns.subBass.triggerAttackRelease("C1", "4n", time);
                                } else if (instKey === "pipeSound") {
                                    syns.pipeSound.triggerAttackRelease(typeof val === "string" ? val : "G3", "8n", time);
                                } else if (instKey === "robotFx") {
                                    syns.robotFx.triggerAttackRelease("C4", "16n", time);
                                } else if (["bandGuitar", "soulPiano", "balladStrings", "vocalRap"].includes(instKey)) {
                                    const note = typeof val === "string" ? val : "C3";
                                    if (syns[instKey]) syns[instKey].triggerAttackRelease(note, "4n", time);
                                }
                            });

                            stepCounter++;
                        }, "16n").start(0);

                        Tone.Transport.start();
                    } else {
                        Tone.Transport.stop();
                    }
                }, [playing, bpm, instrumentSteps]);

                const togglePlay = async () => {
                    await Tone.start();
                    setPlaying(!playing);
                    setStatus(playing ? "⏸️ 停止しました" : `▶ 再生中 (BPM: ${bpm}) [SOUL POP & 20 BEAT]`);
                };

                const toggleStep = (instKey, idx) => {
                    setInstrumentSteps(prev => {
                        const arr = [...prev[instKey]];
                        arr[idx] = arr[idx] === selectedNote ? null : selectedNote;
                        return { ...prev, [instKey]: arr };
                    });
                };

                const playNoteLive = (instKey, note) => {
                    setSelectedNote(note);
                    const syns = synthsRef.current;
                    if (!syns) return;
                    if (syns[instKey] && typeof syns[instKey].triggerAttackRelease === "function") {
                        syns[instKey].triggerAttackRelease(note, "4n");
                    } else if (instKey === "drums20") {
                        syns.drums20.triggerAttackRelease("C1", "8n");
                    }
                };

                const clearAllSteps = () => {
                    const emptyMap = {};
                    Object.keys(instrumentSteps).forEach(k => { emptyMap[k] = new Array(TOTAL_STEPS).fill(null); });
                    setInstrumentSteps(emptyMap);
                    setStatus("🧹 すべてクリアしました");
                };

                // ソウル・ポップ・バラード＆ロックパターン AI自動生成 (20ビート・ループ連動)
                const generateSoulPopBalladAI = (targetInst) => {
                    const newSteps = JSON.parse(JSON.stringify(instrumentSteps));
                    const arr = new Array(TOTAL_STEPS).fill(null);
                    const notesList = NOTES_MAP[register];

                    // ソウルポップ・バラード用コード進行 (C -> Am -> Dm -> G または C -> G/B -> Am -> F)
                    const chordProgression = [0, 5, 1, 4];

                    for (let s = 0; s < TOTAL_STEPS; s++) {
                        const sInBar = s % BAR_STEPS;
                        const barIdx = Math.floor(s / BAR_STEPS);

                        if (targetInst === "drums20") {
                            // 20ビートパターン AI切替に応じたリズム
                            if (sInBar === 0 || sInBar === 8 || (selectedDrumPattern >= "pattern10" && sInBar === 10)) {
                                arr[s] = "C1";
                            }
                        } else if (targetInst === "subBass") {
                            // 重低音ベース
                            if (sInBar % 4 === 0) {
                                arr[s] = notesList[0];
                            }
                        } else if (targetInst === "pipeSound") {
                            // パイプ音アクセント
                            if (sInBar === 6 || sInBar === 14) {
                                arr[s] = notesList[4];
                            }
                        } else if (targetInst === "robotFx") {
                            // ロボットFX
                            if (sInBar === 0 && barIdx % 2 === 0) {
                                arr[s] = "C4";
                            }
                        } else {
                            // メロディ・コード (Soul Pop / Ballad / Rock Pops)
                            if (sInBar % 4 === 0) {
                                const baseIdx = chordProgression[barIdx % chordProgression.length];
                                arr[s] = notesList[baseIdx % notesList.length];
                            } else if (sInBar === 6 || sInBar === 10) {
                                const baseIdx = (chordProgression[barIdx % chordProgression.length] + 2) % notesList.length;
                                arr[s] = notesList[baseIdx];
                            }
                        }
                    }

                    newSteps[targetInst] = arr;
                    setInstrumentSteps(newSteps);
                    setStatus(`✨ 【${targetInst}】に選択中のビート・ループ(${selectedBeatPattern}/${selectedLoopPattern})を反映してAI生成しました！`);
                };

                const generateAllAI = () => {
                    Object.keys(instrumentSteps).forEach(inst => generateSoulPopBalladAI(inst));
                    setStatus("🌟 全パート一括: ソウルポップ＆バラード・20ビートAIメロディ作成完了！");
                };

                const saveCurrentSession = () => {
                    setSavedSlots(prev => ({ ...prev, [slotName]: JSON.parse(JSON.stringify(instrumentSteps)) }));
                    setStatus(`💾 セッション「${slotName}」を共有保存リストに追加しました！`);
                };

                const loadSession = (name) => {
                    if (savedSlots[name]) {
                        setInstrumentSteps(JSON.parse(JSON.stringify(savedSlots[name])));
                        setStatus(`📂 セッション「${name}」をロードしました！`);
                    }
                };

                const currentInstObj = INSTRUMENTS.find(i => i.id === selectedInstrument);

                return (
                    <div className={`min-h-screen bg-slate-950 text-slate-100 flex flex-col text-xs font-sans select-none border-8 transition-all duration-75 ${flashColor}`}>
                        {/* ヘッダー */}
                        <header className="bg-slate-900 border-b border-slate-800 px-3 py-2 flex items-center justify-between gap-2 sticky top-0 z-50 shadow-lg">
                            <span className="font-black text-sm bg-gradient-to-r from-amber-400 via-orange-400 to-rose-400 bg-clip-text text-transparent">
                                MICVICTORIES LAND <span className="text-[10px] text-amber-300 font-normal">v40.0 20-BEAT & SOUL POP BALLAD</span>
                            </span>

                            <div className="flex items-center gap-1.5 flex-wrap">
                                <button onClick={togglePlay} className={`px-3 py-1 rounded font-bold text-xs shadow ${playing ? "bg-amber-600 text-white animate-pulse" : "bg-orange-700 text-white"}`}>
                                    {playing ? "■ 停止" : "▶ 全体再生"}
                                </button>
                                <button onClick={clearAllSteps} className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded font-bold text-xs border border-slate-700">
                                    🧹 クリア
                                </button>
                                <div className="flex items-center gap-1 bg-slate-950 px-2 py-0.5 rounded border border-slate-800">
                                    <span className="text-[9px] text-slate-400">BPM</span>
                                    <input type="number" value={bpm} onChange={e => setBpm(Math.max(40, Math.min(220, Number(e.target.value))))} className="w-12 bg-slate-900 text-center font-bold text-amber-400 rounded text-xs py-0.5" />
                                </div>
                            </div>
                        </header>

                        {/* ナビゲーションタブ */}
                        <nav className="bg-slate-900/90 border-b border-slate-800 px-2 py-1.5 flex gap-1 overflow-x-auto">
                            {[
                                { id: "ALL_GRID", label: "🎹 全体グリッド・編集・再生" },
                                { id: "AI_20_PATTERNS", label: "🤖 20ドラム・ビート・ループAI切替" },
                                { id: "MIXER", label: "🎚️ 重低音・パイプ音個別ミキサー" },
                                { id: "MEMORY_LIST", label: "💾 共有保存リスト・ファイル移動" },
                            ].map(t => (
                                <button key={t.id} onClick={() => setTab(t.id)} className={`px-3 py-1 rounded text-center font-bold transition-all shrink-0 ${tab === t.id ? "bg-amber-600 text-white shadow" : "bg-slate-800/60 text-slate-400"}`}>
                                    {t.label}
                                </button>
                            ))}
                        </nav>

                        {/* ステータスバー */}
                        <div className="bg-slate-900/80 border-b border-slate-800 px-3 py-1 flex items-center justify-between flex-wrap gap-1">
                            <span className="text-[11px] text-amber-300">💡 {status}</span>
                            <button onClick={generateAllAI} className="px-3 py-1 bg-gradient-to-r from-amber-600 to-orange-700 hover:from-amber-500 hover:to-orange-600 text-white font-bold rounded text-[10px] shadow">
                                ✨ ソウルポップ＆バラードAI一括自動生成
                            </button>
                        </div>

                        {/* メインコンテンツ */}
                        <main className="p-2 flex flex-col gap-3">
                            {tab === "ALL_GRID" && (
                                <div className="flex flex-col gap-3">
                                    {/* 楽器セレクト */}
                                    <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3 shadow">
                                        <div className="flex justify-between items-center flex-wrap gap-2">
                                            <span className="text-xs font-bold text-amber-300">① 編集楽器・重低音・パイプ音・ロボットFX選択</span>
                                        </div>

                                        <div className="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-8 gap-1.5">
                                            {INSTRUMENTS.map(inst => (
                                                <div key={inst.id} className="flex flex-col gap-1">
                                                    <button onClick={() => setSelectedInstrument(inst.id)} className={`py-2 px-1 rounded-lg font-bold text-[10px] transition-all border flex items-center justify-center gap-1 shadow ${selectedInstrument === inst.id ? `bg-gradient-to-r ${inst.color} border-white text-white ring-2 ring-white/30` : "bg-slate-950 border-slate-800 text-slate-400"}`}>
                                                        {inst.label}
                                                    </button>
                                                    <button onClick={() => generateSoulPopBalladAI(inst.id)} className="py-1 px-1 bg-slate-800 hover:bg-amber-700 text-amber-200 rounded font-bold text-[9px] border border-slate-700 transition-all text-center">
                                                        🤖 AI作成
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    {/* 音域・鍵盤 */}
                                    <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-2 shadow">
                                        <div className="flex justify-between items-center flex-wrap gap-2">
                                            <span className="text-xs font-bold text-emerald-300">🎵 連打メロディ・バラード鍵盤 (現在の選択: {register.toUpperCase()})</span>
                                            <div className="flex gap-1">
                                                {["low", "mid", "high"].map(reg => (
                                                    <button key={reg} onClick={() => setRegister(reg)} className={`px-2.5 py-1 rounded font-bold text-[10px] ${register === reg ? "bg-amber-600 text-white" : "bg-slate-950 text-slate-400 border border-slate-800"}`}>
                                                        {reg.toUpperCase()}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                        <div className="grid grid-cols-8 sm:grid-cols-15 gap-1 bg-slate-950 p-2 rounded border border-slate-800">
                                            {NOTES.map(note => (
                                                <button key={note} onClick={() => playNoteLive(selectedInstrument, note)} className={`py-2 px-1 rounded font-bold text-[10px] flex flex-col items-center justify-center transition-all border ${selectedNote === note ? "bg-cyan-600 text-white border-white shadow" : "bg-slate-900 text-slate-300 border-slate-800 hover:bg-slate-800"}`}>
                                                    <span>{SOLFEGE[note] || note}</span>
                                                    <span className="text-[8px] text-slate-400">{note}</span>
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* グリッド全体表示・記録再生 */}
                                    <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3 shadow">
                                        <div className="flex justify-between items-center">
                                            <span className="text-xs font-bold text-cyan-300">② グリッド全体表示・編集 ({currentInstObj.label}) - 小節: {currentBar + 1} / 8</span>
                                            <div className="flex gap-1">
                                                {Array.from({ length: BARS }).map((_, b) => (
                                                    <button key={b} onClick={() => setCurrentBar(b)} className={`w-7 h-7 rounded-full text-xs font-bold ${currentBar === b ? "bg-amber-600 text-white" : "bg-slate-800 text-slate-400"}`}>{b + 1}</button>
                                                ))}
                                            </div>
                                        </div>

                                        <div className="flex flex-col gap-2 bg-slate-950 p-3 rounded border border-slate-800">
                                            <div className="overflow-x-auto py-1">
                                                <div className="grid gap-1 min-w-[540px]" style={{ gridTemplateColumns: "repeat(16, minmax(0, 1fr))" }}>
                                                    {Array.from({ length: BAR_STEPS }).map((_, i) => {
                                                        const stepIdx = currentBar * BAR_STEPS + i;
                                                        const stepVal = instrumentSteps[selectedInstrument][stepIdx];
                                                        const isCurrentPlay = playing && currentStep === i;
                                                        const isActive = !!stepVal;

                                                        return (
                                                            <button key={i} onClick={() => toggleStep(selectedInstrument, stepIdx)} className={`aspect-[3/4] w-full rounded border flex flex-col items-center justify-center text-[9px] transition-all ${isActive ? "bg-gradient-to-t from-amber-600 to-orange-600 border-white text-white font-bold shadow-md shadow-amber-900/50 scale-105" : "bg-slate-900 border-slate-800 text-slate-500"} ${isCurrentPlay ? "ring-2 ring-cyan-400" : ""}`}>
                                                                <span className="font-bold text-[10px]">{i + 1}</span>
                                                                {stepVal && <span className="text-[8px] text-amber-200">{SOLFEGE[stepVal] || "ON"}</span>}
                                                            </button>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {tab === "AI_20_PATTERNS" && (
                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-4">
                                    <span className="text-xs font-bold text-amber-300">🤖 20種類のドラム・ビート・ループパターン手動切り替え＆AI適用</span>
                                    
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-3 bg-slate-950 p-3 rounded border border-slate-800">
                                        {/* ドラム20 */}
                                        <div className="flex flex-col gap-2">
                                            <span className="text-xs font-bold text-rose-300">🥁 20ドラムパターン</span>
                                            <select value={selectedDrumPattern} onChange={e => setSelectedDrumPattern(e.target.value)} className="bg-slate-900 text-xs p-2 rounded border border-slate-800 text-amber-300 font-bold">
                                                {DRUM_PATTERNS_20.map(p => <option key={p.id} value={p.id}>{p.label}</option>)}
                                            </select>
                                        </div>

                                        {/* ビート20 */}
                                        <div className="flex flex-col gap-2">
                                            <span className="text-xs font-bold text-orange-300">🎵 20ビートパターン</span>
                                            <select value={selectedBeatPattern} onChange={e => setSelectedBeatPattern(e.target.value)} className="bg-slate-900 text-xs p-2 rounded border border-slate-800 text-amber-300 font-bold">
                                                {BEAT_PATTERNS_20.map(p => <option key={p.id} value={p.id}>{p.label}</option>)}
                                            </select>
                                        </div>

                                        {/* ループ20 */}
                                        <div className="flex flex-col gap-2">
                                            <span className="text-xs font-bold text-cyan-300">🔄 20ループパターン</span>
                                            <select value={selectedLoopPattern} onChange={e => setSelectedLoopPattern(e.target.value)} className="bg-slate-900 text-xs p-2 rounded border border-slate-800 text-amber-300 font-bold">
                                                {LOOP_PATTERNS_20.map(p => <option key={p.id} value={p.id}>{p.label}</option>)}
                                            </select>
                                        </div>
                                    </div>

                                    <button onClick={generateAllAI} className="py-2.5 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded text-xs shadow">
                                        🚀 選択した20パターン設定で全パートAIメロディ＆リズムを一括作成
                                    </button>
                                </div>
                            )}

                            {tab === "MIXER" && (
                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3">
                                    <span className="text-xs font-bold text-teal-300">🎚️ 重低音・パイプ音・ロボットFX個別ミキサー</span>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-2 bg-slate-950 p-3 rounded border border-slate-800">
                                        {Object.keys(audioMixer).map(instKey => {
                                            const instObj = INSTRUMENTS.find(i => i.id === instKey);
                                            const mix = audioMixer[instKey];
                                            return (
                                                <div key={instKey} className="bg-slate-900 border border-slate-800 rounded p-2.5 flex flex-col gap-2 shadow">
                                                    <span className="font-bold text-xs text-amber-400">{instObj ? instObj.label : instKey}</span>
                                                    
                                                    <div className="flex flex-col gap-0.5">
                                                        <div className="flex justify-between text-[9px] text-slate-400">
                                                            <span>ボリューム</span>
                                                            <span className="text-amber-300 font-bold">{mix.volume} dB</span>
                                                        </div>
                                                        <input type="range" min="-20" max="10" step="1" value={mix.volume} onChange={e => updateMixerParam(instKey, "volume", Number(e.target.value))} className="accent-amber-500 cursor-pointer" />
                                                    </div>

                                                    <div className="flex flex-col gap-0.5">
                                                        <div className="flex justify-between text-[9px] text-slate-400">
                                                            <span>パン (左右)</span>
                                                            <span className="text-cyan-300 font-bold">{mix.pan}</span>
                                                        </div>
                                                        <input type="range" min="-1" max="1" step="0.1" value={mix.pan} onChange={e => updateMixerParam(instKey, "pan", Number(e.target.value))} className="accent-cyan-500 cursor-pointer" />
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            )}

                            {tab === "MEMORY_LIST" && (
                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3">
                                    <span className="text-xs font-bold text-emerald-300">💾 共有保存リスト・ファイル移動</span>
                                    <div className="flex gap-2 bg-slate-950 p-3 rounded border border-slate-800">
                                        <input type="text" value={slotName} onChange={e => setSlotName(e.target.value)} className="bg-slate-900 px-2 py-1 rounded text-slate-100 flex-1 border border-slate-800" />
                                        <button onClick={saveCurrentSession} className="px-4 py-1 bg-amber-600 text-white font-bold rounded">リスト追加保存</button>
                                    </div>
                                    <div className="flex flex-col gap-2 bg-slate-950 p-3 rounded border border-slate-800 max-h-[220px] overflow-y-auto">
                                        {Object.keys(savedSlots).length === 0 && (
                                            <span className="text-[11px] text-slate-500 text-center py-2">保存リストにファイルはありません</span>
                                        )}
                                        {Object.keys(savedSlots).map(name => (
                                            <div key={name} className="flex justify-between items-center bg-slate-900 p-2 rounded border border-slate-800">
                                                <span className="font-bold text-amber-300 text-xs">{name}</span>
                                                <div className="flex gap-1">
                                                    <button onClick={() => loadSession(name)} className="px-2 py-1 bg-amber-600 text-white rounded text-[10px] font-bold">ファイル切替</button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </main>
                    </div>
                );
            }

            const rootElement = document.getElementById('root');
            if (rootElement) {
                ReactDOM.createRoot(rootElement).render(<MasterSynthApp />);
            }
        } catch (err) {
            document.getElementById('root').innerHTML = `
                <div class="p-6 text-red-400 font-bold">
                    <h2 class="text-lg mb-2">⚠️ 起動エラー</h2>
                    <p class="text-xs text-slate-300">${err.message}</p>
                </div>
            `;
        }
    </script>
</body>
</html>
