<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RHYTHM FORGE - PRO DAW v4.8</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        /* ヘッダー */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: #111827;
            border-bottom: 1px solid #1f2937;
        }
        .logo {
            font-size: 1.1rem;
            font-weight: bold;
            background: linear-gradient(90deg, #38bdf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .version {
            font-size: 0.65rem;
            background: #1e3a8a;
            color: #93c5fd;
            padding: 2px 5px;
            border-radius: 4px;
            margin-left: 6px;
        }
        .top-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .btn-stop {
            background: #f97316;
            color: #fff;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .bpm-box {
            background: #1e293b;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
        }
        .btn-ai-top {
            background: #0ea5e9;
            color: #fff;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.8rem;
        }

        /* 小節バー */
        .bar-container {
            display: flex;
            align-items: center;
            padding: 6px 10px;
            background: #0f172a;
            border-bottom: 1px solid #1e293b;
            overflow-x: auto;
        }
        .bar-label {
            font-size: 0.7rem;
            color: #94a3b8;
            margin-right: 8px;
            white-space: nowrap;
        }
        .bars {
            display: flex;
            gap: 3px;
        }
        .bar-num {
            background: #1e293b;
            color: #cbd5e1;
            font-size: 0.7rem;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 3px;
        }
        .bar-num.active {
            background: #06b6d4;
            color: #fff;
        }

        /* トラックエリア */
        .track-list {
            flex: 1;
            overflow-y: auto;
            padding: 4px;
        }
        .track-row {
            display: flex;
            align-items: center;
            margin-bottom: 3px;
            background: #111827;
            border-radius: 4px;
            padding: 3px;
        }
        .track-btn {
            background: #1e293b;
            color: #e2e8f0;
            border: none;
            padding: 5px 6px;
            border-radius: 3px;
            font-size: 0.65rem;
            width: 105px;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
        }
        .track-btn:active {
            background: #334155;
        }
        .track-timeline {
            flex: 1;
            height: 22px;
            background: #0f172a;
            margin-left: 5px;
            border-radius: 3px;
            border: 1px solid #1e293b;
            position: relative;
            cursor: pointer;
        }

        /* フッターコントロール */
        footer {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 3px;
            padding: 6px;
            background: #0f172a;
            border-top: 1px solid #1e293b;
        }
        .footer-btn {
            background: #1e293b;
            color: #cbd5e1;
            border: none;
            padding: 6px 1px;
            border-radius: 4px;
            font-size: 0.6rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            cursor: pointer;
        }
        .footer-btn:hover, .footer-btn.active {
            background: #334155;
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <header>
        <div style="display: flex; align-items: center;">
            <span class="logo">RHYTHM FORGE</span>
            <span class="version">v4.8</span>
        </div>
        <div class="top-controls">
            <button class="btn-stop" id="stopBtn">停止</button>
            <div class="bpm-box">BPM 110</div>
            <button class="btn-ai-top" id="aiTopBtn">AI</button>
        </div>
    </header>

    <div class="bar-container">
        <div class="bar-label">小節<br>(BAR):</div>
        <div class="bars" id="barContainer">
            </div>
    </div>

    <div class="track-list" id="trackList">
        </div>

    <footer>
        <button class="footer-btn" id="recBtn">🔴 録音</button>
        <button class="footer-btn" id="playBtn">▶ 再生</button>
        <button class="footer-btn" id="clearBtn">✖ Clear</button>
        <button class="footer-btn" id="repeatBtn">🔁 リピート</button>
        <button class="footer-btn" id="randomBtn">🔀 ランダム</button>
        <button class="footer-btn" id="shareBtn">🔗 共有</button>
        <button class="footer-btn" id="editBtn">⚙ 編集</button>
        <button class="footer-btn" id="synthBtn">🧩 合成</button>
    </footer>

    <script>
        // 音声コンテキストの初期化（タップで音が鳴るようにする）
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // 簡単な電子音（ビープ・ドラム音）を鳴らす関数
        function playSound(type) {
            initAudio();
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'KICK') {
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(0.01, now + 0.15);
                gain.gain.setValueAtTime(1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'SNARE') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(250, now);
                gain.gain.setValueAtTime(0.5, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else {
                // メロディ・楽器用
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, now);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            }
        }

        // トラック名リスト
        const trackNames = [
            "KICK", "SNARE", "H.H", "CYMB", 
            "AI MELLOW GUIT.", "PIANO ARPEG.", "STRINGS", 
            "STRINGS CODE", "HARMONICA", "VIOLIN", 
            "AFRICAN DRUMS", "AI BASS", "SUB BASS"
        ];

        const trackListEl = document.getElementById('trackList');
        const barContainerEl = document.getElementById('barContainer');

        // 小節番号の生成 (1〜16)
        for (let i = 1; i <= 16; i++) {
            const div = document.createElement('div');
            div.className = `bar-num ${i === 1 ? 'active' : ''}`;
            div.textContent = i;
            barContainerEl.appendChild(div);
        }

        // トラック行の生成
        trackNames.forEach((name, index) => {
            const row = document.createElement('div');
            row.className = 'track-row';
            
            const btn = document.createElement('button');
            btn.className = 'track-btn';
            btn.textContent = name;
            btn.onclick = () => playSound(name); // トラック名ボタンを押すと音が鳴る

            const timeline = document.createElement('div');
            timeline.className = 'track-timeline';
            if(index === 0) timeline.style.borderColor = '#ec4899'; // KICKを選択状態に

            row.appendChild(btn);
            row.appendChild(timeline);
            trackListEl.appendChild(row);
        });

        // ボタンのアクション設定
        let isPlaying = false;
        document.getElementById('playBtn').onclick = () => {
            initAudio();
            isPlaying = true;
            alert("再生を開始しました！（BPM 110）");
        };

        document.getElementById('stopBtn').onclick = () => {
            isPlaying = false;
            alert("停止しました。");
        };

        document.getElementById('clearBtn').onclick = () => {
            if(confirm("データをクリアしますか？")) {
                alert("クリアしました。");
            }
        };

        document.getElementById('randomBtn').onclick = () => {
            alert("AIランダムフレーズを作成しました！");
        };

        document.getElementById('repeatBtn').onclick = (e) => {
            e.currentTarget.classList.toggle('active');
            alert("リピートモード切り替え");
        };

        document.getElementById('aiTopBtn').onclick = () => {
            alert("AIメニュー：自動作曲・ジャンル変更を行います。");
        };
    </script>
</body>
</html>
