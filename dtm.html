<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>RHYTHM FORGE - ULTRA FAST</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/tone@14.7.77/build/Tone.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; background: #030406; color: #fff; font-family: sans-serif; }
        #root { padding: 10px; box-sizing: border-box; }
        button, select, input { touch-action: manipulation; cursor: pointer; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        const BAR_STEPS = 16;
        const BARS = 18;
        const TOTAL_STEPS = BAR_STEPS * BARS;

        const DRUM_ROWS = [
            { key: "kick", label: "KICK" },
            { key: "snare", label: "SNARE" },
            { key: "djembe", label: "DJEMBE" },
            { key: "conga", label: "CONGA" },
            { key: "shaker", label: "SHAKER" },
        ];

        const BASS_ROWS = [
            { key: "subbass", label: "SUB BASS" },
            { key: "synthchord", label: "CHORD" },
            { key: "strings", label: "STRINGS" },
        ];

        const NOTES = ["C3", "Eb3", "F3", "G3", "Bb3", "C4", "Eb4", "G4", "C5"];

        function App() {
            const [playing, setPlaying] = useState(false);
            const [bpm, setBpm] = useState(130);
            const [tab, setTab] = useState("DRUM");
            const [status, setStatus] = useState("⚡ 超高速モード");

            const [drumSteps, setDrumSteps] = useState(() => {
                const d = {};
                DRUM_ROWS.forEach(r => {
                    d[r.key] = new Array(TOTAL_STEPS).fill(0);
                    for (let i = 0; i < TOTAL_STEPS; i++) {
                        if (i % 16 === 0) d[r.key][i] = 1;
                    }
                });
                return d;
            });

            const [bassSteps, setBassSteps] = useState(() => {
                const b = {};
                BASS_ROWS.forEach(r => { b[r.key] = new Array(TOTAL_STEPS).fill(null); });
                return b;
            });

            const [selectedInst, setSelectedInst] = useState("subbass");
            const [selectedNote, setSelectedNote] = useState("C3");
            const [lyrics, setLyrics] = useState("超高速レスポンスで連続再生！\nAI伴奏とラップを刻む");
            const [records, setRecords] = useState([]);

            // 高速再生用のRef管理
            const drumRef = useRef(drumSteps);
            drumRef.current = drumSteps;
            const bassRef = useRef(bassSteps);
            bassRef.current = bassSteps;
            const loopRef = useRef(null);

            // シンセ定義
            const synths = useRef({
                kick: new Tone.MembraneSynth({ volume: -2 }).toDestination(),
                snare: new Tone.NoiseSynth({ volume: -4, envelope: { attack: 0.001, decay: 0.1 } }).toDestination(),
                djembe: new Tone.MembraneSynth({ volume: -3 }).toDestination(),
                conga: new Tone.MembraneSynth({ volume: -3 }).toDestination(),
                shaker: new Tone.NoiseSynth({ volume: -10, envelope: { attack: 0.001, decay: 0.03 } }).toDestination(),
                subbass: new Tone.Synth({ volume: -3, oscillator: { type: "sine" } }).toDestination(),
                synthchord: new Tone.Synth({ volume: -5, oscillator: { type: "sawtooth" } }).toDestination(),
                strings: new Tone.Synth({ volume: -5, oscillator: { type: "triangle" } }).toDestination(),
            });

            useEffect(() => {
                Tone.Transport.bpm.value = bpm;
                if (loopRef.current) loopRef.current.dispose();

                let stepCount = 0;
                loopRef.current = new Tone.Loop((time) => {
                    const step = stepCount % TOTAL_STEPS;
                    
                    const d = drumRef.current;
                    if (d.kick[step]) synths.current.kick.triggerAttackRelease("C1", "16n", time);
                    if (d.snare[step]) synths.current.snare.triggerAttackRelease("16n", time);
                    if (d.djembe[step]) synths.current.djembe.triggerAttackRelease("G2", "16n", time);
                    if (d.conga[step]) synths.current.conga.triggerAttackRelease("C3", "16n", time);
                    if (d.shaker[step]) synths.current.shaker.triggerAttackRelease("16n", time);

                    const b = bassRef.current;
                    BASS_ROWS.forEach(r => {
                        const note = b[r.key][step];
                        if (note) synths.current[r.key].triggerAttackRelease(note, "16n", time);
                    });

                    stepCount++;
                }, "16n").start(0);

                return () => { if (loopRef.current) loopRef.current.dispose(); };
            }, [bpm]);

            const togglePlay = async () => {
                await Tone.start();
                if (playing) {
                    Tone.Transport.stop();
                    setPlaying(false);
                    setStatus("⏸ 停止");
                } else {
                    Tone.Transport.start();
                    setPlaying(true);
                    setStatus("▶ 連続再生中");
                }
            };

            const toggleDrum = (key, idx) => {
                setDrumSteps(prev => {
                    const copy = { ...prev };
                    copy[key] = [...copy[key]];
                    copy[key][idx] = copy[key][idx] ? 0 : 1;
                    return copy;
                });
            };

            const toggleBass = (key, idx) => {
                setBassSteps(prev => {
                    const copy = { ...prev };
                    copy[key] = [...copy[key]];
                    copy[key][idx] = copy[key][idx] ? null : selectedNote;
                    return copy;
                });
            };

            const aiFill = () => {
                setBassSteps(prev => {
                    const copy = { ...prev };
                    BASS_ROWS.forEach(r => {
                        const arr = new Array(TOTAL_STEPS).fill(null);
                        for (let i = 0; i < TOTAL_STEPS; i += 2) {
                            if (Math.random() > 0.5) arr[i] = NOTES[Math.floor(Math.random() * NOTES.length)];
                        }
                        copy[r.key] = arr;
                    });
                    return copy;
                });
                setStatus("✨ AI自動埋め完了");
            };

            const clearAll = () => {
                setBassSteps(prev => {
                    const copy = {};
                    BASS_ROWS.forEach(r => { copy[r.key] = new Array(TOTAL_STEPS).fill(null); });
                    return copy;
                });
                setStatus("🧹 クリア");
            };

            return (
                <div style={{ maxWidth: "800px", margin: "0 auto" }}>
                    <h2 style={{ fontSize: "1rem", color: "#00ffcc", margin: "0 0 6px 0" }}>⚡ RHYTHM FORGE - ULTRA FAST</h2>
                    
                    {/* コントロール */}
                    <div style={{ background: "#111622", padding: "8px", borderRadius: "6px", display: "flex", gap: "6px", flexWrap: "wrap", alignItems: "center", marginBottom: "8px" }}>
                        <button onClick={togglePlay} style={{ background: playing ? "#ff4444" : "#00ffcc", color: "#000", fontWeight: "bold", border: "none", padding: "6px 12px", borderRadius: "4px" }}>
                            {playing ? "STOP" : "PLAY"}
                        </button>
                        <button onClick={aiFill} style={{ background: "#7928ca", color: "#fff", border: "none", padding: "6px 10px", borderRadius: "4px" }}>AI伴奏</button>
                        <button onClick={clearAll} style={{ background: "#444", color: "#fff", border: "none", padding: "6px 10px", borderRadius: "4px" }}>CLEAR</button>
                        <button onClick={() => synths.current.synthchord.triggerAttackRelease("C2", "32n")} style={{ background: "#f5a623", color: "#000", border: "none", padding: "6px 10px", borderRadius: "4px", fontWeight: "bold" }}>スクラッチ</button>

                        <div>
                            <span style={{ fontSize: "0.75rem" }}>BPM:{bpm}</span>
                            <input type="range" min="80" max="180" value={bpm} onChange={e => setBpm(Number(e.target.value))} style={{ width: "70px", verticalAlign: "middle" }} />
                        </div>
                        <span style={{ fontSize: "0.75rem", color: "#00ffcc", marginLeft: "auto" }}>{status}</span>
                    </div>

                    {/* 高速タブ切り替え */}
                    <div style={{ display: "flex", gap: "4px", marginBottom: "8px" }}>
                        {["DRUM", "BASS", "KEYS", "LYRICS"].map(t => (
                            <button key={t} onClick={() => setTab(t)} style={{ background: tab === t ? "#00ffcc" : "#1a2130", color: tab === t ? "#000" : "#aaa", border: "none", padding: "5px 10px", borderRadius: "4px", fontWeight: "bold", fontSize: "0.75rem" }}>
                                {t}
                            </button>
                        ))}
                    </div>

                    {/* タブコンテンツ */}
                    {tab === "DRUM" && (
                        <div style={{ background: "#111622", padding: "8px", borderRadius: "6px", overflowX: "auto" }}>
                            {DRUM_ROWS.map(r => (
                                <div key={r.key} style={{ display: "flex", alignItems: "center", marginBottom: "3px" }}>
                                    <span style={{ width: "75px", fontSize: "0.65rem", fontWeight: "bold" }}>{r.label}</span>
                                    <div style={{ display: "flex", gap: "2px" }}>
                                        {drumSteps[r.key].map((v, i) => (
                                            <div key={i} onClick={() => toggleDrum(r.key, i)} style={{ width: "11px", height: "20px", background: v ? "#00ffcc" : "#1a2130", border: i % 16 === 0 ? "1px solid #777" : "1px solid #222", borderRadius: "2px" }} />
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}

                    {tab === "BASS" && (
                        <div style={{ background: "#111622", padding: "8px", borderRadius: "6px", overflowX: "auto" }}>
                            {BASS_ROWS.map(r => (
                                <div key={r.key} style={{ display: "flex", alignItems: "center", marginBottom: "3px" }}>
                                    <span style={{ width: "75px", fontSize: "0.65rem", fontWeight: "bold" }}>{r.label}</span>
                                    <div style={{ display: "flex", gap: "2px" }}>
                                        {bassSteps[r.key].map((v, i) => (
                                            <div key={i} onClick={() => toggleBass(r.key, i)} style={{ width: "11px", height: "20px", background: v ? "#7928ca" : "#1a2130", border: i % 16 === 0 ? "1px solid #777" : "1px solid #222", borderRadius: "2px" }} />
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}

                    {tab === "KEYS" && (
                        <div style={{ background: "#111622", padding: "10px", borderRadius: "6px", textAlign: "center" }}>
                            <div style={{ marginBottom: "8px" }}>
                                {BASS_ROWS.map(r => (
                                    <button key={r.key} onClick={() => setSelectedInst(r.key)} style={{ background: selectedInst === r.key ? "#7928ca" : "#1a2130", color: "#fff", border: "none", padding: "4px 8px", marginRight: "4px", borderRadius: "4px", fontSize: "0.75rem" }}>{r.label}</button>
                                ))}
                            </div>
                            <div style={{ display: "flex", justifyContent: "center", gap: "4px", flexWrap: "wrap" }}>
                                {NOTES.map(n => (
                                    <button key={n} onClick={() => { setSelectedNote(n); synths.current[selectedInst].triggerAttackRelease(n, "16n"); }} style={{ background: selectedNote === n ? "#00ffcc" : "#fff", color: "#000", border: "none", width: "32px", height: "60px", fontWeight: "bold", fontSize: "0.7rem", borderRadius: "3px" }}>
                                        {n}
                                    </button>
                                ))}
                            </div>
                        </div>
                    )}

                    {tab === "LYRICS" && (
                        <div style={{ background: "#111622", padding: "8px", borderRadius: "6px" }}>
                            <textarea value={lyrics} onChange={e => setLyrics(e.target.value)} style={{ width: "100%", height: "100px", background: "#030406", color: "#fff", border: "1px solid #333", borderRadius: "4px", padding: "6px", fontSize: "0.8rem", boxSizing: "border-box" }} />
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
