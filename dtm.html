        function MasterSynthApp() {
            const [tab, setTab] = React.useState("ALBUM_20");
            const [playing, setPlaying] = React.useState(false);
            const [isRecording, setIsRecording] = React.useState(false);
            const [flashColor, setFlashColor] = React.useState("border-cyan-500");
            const [bpm, setBpm] = React.useState(112);
            const [currentBar, setCurrentBar] = React.useState(0);
            const [currentStep, setCurrentStep] = React.useState(-1);
            const [activeAlbumTrackId, setActiveAlbumTrackId] = React.useState(1);
            const [status, setStatus] = React.useState("🎤 v56.9 非ループ・ポッピン20曲システム統合完了！");

            const BARS = 8;
            const BAR_STEPS = 16;
            const TOTAL_STEPS = BARS * BAR_STEPS;

            const [selectedInstrument, setSelectedInstrument] = React.useState("synth");
            const [selectedNote, setSelectedNote] = React.useState("C4");
            const [selectedDuration, setSelectedDuration] = React.useState("16n");
            const [selectedDrumPart, setSelectedDrumPart] = React.useState("kick");

            const [recordedTakes, setRecordedTakes] = React.useState([]);
            const [activePatternIndex, setActivePatternIndex] = React.useState(1);

            const [rapLyrics, setRapLyrics] = React.useState("[Verse 1 - DLAND NON-LOOP POPIN]\nMIC VICTORY 反復ゼロのエスカレートフロウ\n走りすぎないソウル、裏拍のハリとタメ\nC0ファット持続、指先の16nランダムパルス\n最高級ポッピン同期（3分50秒非ループ仕様）");

            const [masterBassBoost, setMasterBassBoost] = React.useState(16);
            const [masterVolume, setMasterVolume] = React.useState(1.35);
            const [dlandMode, setDlandMode] = React.useState(true);
            const [screenSaverActive, setScreenSaverActive] = React.useState(false);
            const [slotName, setSlotName] = React.useState("MIC_VICTORY_NON_LOOP_POPIN_20");

            const INSTRUMENTS = [
                { id: "drums", label: "🥁 ドラム (20入)", color: "from-red-600 to-amber-600" },
                { id: "loopTrack", label: "🔁 ループ (20入)", color: "from-pink-600 to-rose-600" },
                { id: "subBass", label: "🔊 重低音ベース", color: "from-amber-600 to-orange-700" },
                { id: "bass", label: "🎸 ベース (20入)", color: "from-emerald-600 to-teal-600" },
                { id: "synth", label: "🎹 シンセ (20入)", color: "from-cyan-600 to-blue-700" },
                { id: "trumpet", label: "🎺 トランペット (20入)", color: "from-yellow-500 to-amber-600" },
                { id: "guitar", label: "🎸 エレキギター (20入)", color: "from-orange-600 to-red-700" },
                { id: "africa1", label: "🪘 ジャンベ (アフリカ)", color: "from-amber-700 to-yellow-800" },
                { id: "africa2", label: "🎹 カリンバ (アフリカ)", color: "from-yellow-600 to-amber-600" },
                { id: "piano", label: "🎹 ピアノ", color: "from-blue-600 to-indigo-600" },
                { id: "violin", label: "🎻 バイオリン", color: "from-amber-600 to-yellow-700" },
                { id: "flute", label: "🪈 フルート", color: "from-teal-500 to-cyan-600" },
            ];

            const [instrumentSteps, setInstrumentSteps] = React.useState({
                drums: new Array(TOTAL_STEPS).fill(null),
                loopTrack: new Array(TOTAL_STEPS).fill(null),
                subBass: new Array(TOTAL_STEPS).fill(null),
                bass: new Array(TOTAL_STEPS).fill(null),
                synth: new Array(TOTAL_STEPS).fill(null),
                trumpet: new Array(TOTAL_STEPS).fill(null),
                guitar: new Array(TOTAL_STEPS).fill(null),
                africa1: new Array(TOTAL_STEPS).fill(null),
                africa2: new Array(TOTAL_STEPS).fill(null),
                piano: new Array(TOTAL_STEPS).fill(null),
                violin: new Array(TOTAL_STEPS).fill(null),
                flute: new Array(TOTAL_STEPS).fill(null),
            });

            const [volumes, setVolumes] = React.useState({
                drums: 3, loopTrack: 0, subBass: 7, bass: 4, synth: 0, trumpet: 0, guitar: 0, africa1: 0, africa2: 0, piano: 0, violin: 0, flute: 0
            });

            const synthsRef = React.useRef(null);
            const loopRef = React.useRef(null);
            const masterGainRef = React.useRef(null);

            const NOTES = ["C4", "D4", "E4", "F4", "G4", "A4", "B4", "C5"];
            const SOLFEGE = { "C4": "ド", "D4": "レ", "E4": "ミ", "F4": "ファ", "G4": "ソ", "A4": "ラ", "B4": "シ", "C5": "ド" };
            const DURATION_OPTIONS = [
                { id: "16n", label: "極短ハリ (16分)" },
                { id: "8n", label: "標準 (8分)" },
                { id: "4n", label: "長めタメ (4分)" },
                { id: "2n", label: "超長レガート (2n)" },
            ];

            React.useEffect(() => {
                const masterGain = new Tone.Gain(masterVolume).toDestination();
                masterGainRef.current = masterGain;

                const eq = new Tone.EQ3({ low: masterBassBoost, lowFrequency: 160, mid: 2.2, high: 2.8 }).connect(masterGain);
                const reverb = new Tone.Reverb({ decay: 1.4, wet: 0.12 }).connect(eq);
                const delay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.22, wet: 0.1 }).connect(reverb);
                const distortion = new Tone.Distortion(0.08).connect(delay);

                const cGains = {};
                Object.keys(instrumentSteps).forEach(key => {
                    cGains[key] = new Tone.Gain(Tone.dbToGain(volumes[key] || 0)).connect(distortion);
                });

                synthsRef.current = {
                    subBass: new Tone.MonoSynth({
                        oscillator: { type: "sine" },
                        envelope: { attack: 0.005, decay: 0.35, sustain: 0.55, release: 0.18 },
                        filterEnvelope: { attack: 0.005, decay: 0.22, sustain: 0.35, release: 0.18, baseFrequency: 70, octaves: 1.6 }
                    }).connect(cGains.subBass),
                    bass: new Tone.MonoSynth({
                        oscillator: { type: "triangle" },
                        envelope: { attack: 0.01, decay: 0.28, sustain: 0.45, release: 0.15 }
                    }).connect(cGains.bass),
                    synth: new Tone.Synth({ oscillator: { type: "pulse", width: 0.4 }, envelope: { attack: 0.01, decay: 0.22, sustain: 0.35, release: 0.15 } }).connect(cGains.synth),
                    loopTrack: new Tone.Synth({ oscillator: { type: "square" }, envelope: { attack: 0.008, decay: 0.2, sustain: 0.3, release: 0.12 } }).connect(cGains.loopTrack),
                    guitar: new Tone.Synth({ oscillator: { type: "sawtooth" }, envelope: { attack: 0.005, decay: 0.2, sustain: 0.25, release: 0.1 } }).connect(cGains.guitar),
                    trumpet: new Tone.Synth({ oscillator: { type: "sawtooth6" }, envelope: { attack: 0.035, decay: 0.2, sustain: 0.6, release: 0.12 } }).connect(cGains.trumpet),
                    africa1: new Tone.MembraneSynth({ pitchDecay: 0.02, octaves: 4, oscillator: { type: "sine" }, envelope: { attack: 0.001, decay: 0.22, sustain: 0.01, release: 0.12 } }).connect(cGains.africa1),
                    africa2: new Tone.Synth({ oscillator: { type: "triangle" }, envelope: { attack: 0.001, decay: 0.18, sustain: 0.1, release: 0.15 } }).connect(cGains.africa2),
                    piano: new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.008, decay: 0.32, sustain: 0.3, release: 0.3 } }).connect(cGains.piano),
                    violin: new Tone.Synth({ oscillator: { type: "sawtooth" }, envelope: { attack: 0.06, decay: 0.22, sustain: 0.8, release: 0.3 } }).connect(cGains.violin),
                    flute: new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.045, decay: 0.22, sustain: 0.7, release: 0.25 } }).connect(cGains.flute),
                    drums: {
                        kick: new Tone.MembraneSynth({ pitchDecay: 0.06, octaves: 6, oscillator: { type: "sine" }, envelope: { attack: 0.0001, decay: 0.28, sustain: 0.01, release: 0.1 } }).connect(cGains.drums),
                        snare: new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.0001, decay: 0.16, sustain: 0 } }).connect(cGains.drums),
                        hihat: new Tone.MetalSynth({ frequency: 900, envelope: { attack: 0.0005, decay: 0.025, release: 0.01 }, harmonicity: 5.1, modulationIndex: 30, resonance: 7000, octaves: 1.4 }).connect(cGains.drums),
                        clap: new Tone.NoiseSynth({ noise: { type: "pink" }, envelope: { attack: 0.004, decay: 0.14, sustain: 0 } }).connect(cGains.drums),
                    },
                    eq, reverb, distortion
                };

                return () => { Tone.Transport.stop(); Tone.Transport.cancel(); };
            }, []);

            React.useEffect(() => {
                Tone.Transport.bpm.value = bpm;
                Tone.Transport.cancel();

                if (playing) {
                    let stepCounter = 0;
                    loopRef.current = new Tone.Loop(time => {
                        let step = stepCounter % TOTAL_STEPS;
                        const bar = Math.floor(step / BAR_STEPS);
                        const sInBar = step % BAR_STEPS;

                        setCurrentStep(sInBar);
                        setCurrentBar(bar);

                        if (dlandMode && sInBar === 0) {
                            const colors = ["border-cyan-500", "border-pink-500", "border-amber-500", "border-purple-500", "border-emerald-500"];
                            setFlashColor(colors[Math.floor(Math.random() * colors.length)]);
                        }

                        const syns = synthsRef.current;
                        if (!syns) return;

                        Object.keys(instrumentSteps).forEach(instKey => {
                            const item = instrumentSteps[instKey][step];
                            if (!item) return;

                            const note = typeof item === "object" ? item.note : item;
                            const dur = typeof item === "object" ? (item.dur || "16n") : "16n";

                            if (instKey === "drums") {
                                if (typeof item === "object") {
                                    if (item.kick) syns.drums.kick.triggerAttackRelease(item.subBoost ? "C0" : "C1", "16n", time);
                                    if (item.snare) syns.drums.snare.triggerAttackRelease("16n", time);
                                    if (item.hihat) syns.drums.hihat.triggerAttackRelease("32n", time, 0.85);
                                    if (item.clap) syns.drums.clap.triggerAttackRelease("16n", time);
                                }
                            } else if (instKey === "subBass") {
                                syns.subBass.triggerAttackRelease(item.subBoost ? "C0" : "C1", dur, time);
                            } else if (syns[instKey]) {
                                syns[instKey].triggerAttackRelease(note || "C4", dur, time);
                            }
                        });

                        stepCounter++;
                    }, "16n").start(0);

                    Tone.Transport.start();
                } else {
                    Tone.Transport.stop();
                }
            }, [playing, bpm, instrumentSteps, dlandMode]);

            const togglePlay = async () => {
                await Tone.start();
                setPlaying(!playing);
                setStatus(playing ? "停止しました" : `▶ 再生中 (BPM: ${bpm})`);
            };

            const toggleRecord = async () => {
                await Tone.start();
                setIsRecording(!isRecording);
                setStatus(!isRecording ? "🔴 全体リアルタイム・非ループ録音中..." : "⏹️ 記録をセーブしました");
                if (isRecording) {
                    setRecordedTakes(prev => [...prev, { id: Date.now(), title: `POPIN非ループテイク ${prev.length + 1}`, bpm, date: new Date().toLocaleTimeString() }]);
                }
            };

            // メロディ非リピート型・ポッピンダンス20曲展開ロジックの完全統合ローダー
            const applyNonRepeatingPoppinTrack = (track) => {
                setActiveAlbumTrackId(track.id);
                setBpm(track.bpm);

                const newDrums = new Array(TOTAL_STEPS).fill(null);
                const newSub = new Array(TOTAL_STEPS).fill(null);
                const newSynth = new Array(TOTAL_STEPS).fill(null);

                const baseOffsets = ["C4", "D#4", "F4", "G#4", "A#4", "D5"];

                for (let i = 0; i < TOTAL_STEPS; i++) {
                    const barIndex = Math.floor(i / BAR_STEPS);
                    const stepInBar = i % BAR_STEPS;

                    const isHitBeat = (stepInBar === 4 || stepInBar === 12 || stepInBar === 14);
                    const isKick = (stepInBar === 0 || stepInBar === 10) && (barIndex % 2 === 0 || stepInBar === 0);
                    const isSnare = (stepInBar === 4 || stepInBar === 12);
                    const isHihat = (stepInBar % 2 === 1);

                    newDrums[i] = {
                        kick: isKick,
                        snare: isSnare,
                        hihat: isHihat,
                        clap: isSnare && (barIndex >= 4),
                        subBoost: isHitBeat
                    };

                    if (stepInBar === 0) {
                        newSub[i] = { note: "C0", dur: "8n", subBoost: true };
                    } else if (stepInBar === 14 && barIndex % 2 === 1) {
                        newSub[i] = { note: "C0", dur: "16n", subBoost: true };
                    }

                    if (isHitBeat || (stepInBar % 4 === 2 && barIndex !== 3)) {
                        const pitchShiftIdx = (barIndex + stepInBar + track.id) % baseOffsets.length;
                        newSynth[i] = {
                            note: baseOffsets[pitchShiftIdx],
                            dur: "16n"
                        };
                    }
                }

                setInstrumentSteps(prev => ({
                    ...prev,
                    drums: newDrums,
                    subBass: newSub,
                    synth: newSynth
                }));
                setStatus(`🎤 Non-Loop Popin TR #${track.id.toString().padStart(2, '0')} [${track.title}] 非反復シフト反映！`);
            };

            const applyHeavySubManualAi = (instKey, modeType) => {
                const newArr = new Array(TOTAL_STEPS).fill(null);
                for (let i = 0; i < TOTAL_STEPS; i++) {
                    const isBeat = modeType === 'roll' ? (i % 2 === 0) : (i % 4 === 0 || i % 16 === 10);
                    if (isBeat) {
                        newArr[i] = { note: "C0", dur: modeType === 'roll' ? "16n" : "4n", subBoost: true };
                    }
                }
                setInstrumentSteps(prev => ({ ...prev, [instKey]: newArr }));
                setStatus(`🔊 【${instKey}】C0超重低音ソウルAI #${modeType} 反映！`);
            };

            const applyHeavyDrumManualAi = (modeName) => {
                const newArr = new Array(TOTAL_STEPS).fill(null);
                for (let i = 0; i < TOTAL_STEPS; i++) {
                    const isKick = modeName === 'heavy_roll' ? (i % 2 === 0) : (i % 4 === 0 || i % 16 === 10);
                    const isSnare = i % 8 === 4 || i % 32 === 28;
                    const isHihat = i % 2 === 0;
                    const isClap = i % 8 === 4;
                    newArr[i] = { kick: isKick, snare: isSnare, hihat: isHihat, clap: isClap, subBoost: true };
                }
                setInstrumentSteps(prev => ({ ...prev, drums: newArr }));
                setStatus(`🥁 ドラムC0ファットソウル連打AI [${modeName}] 反映完了！`);
            };

            const generateViolinAiMelody = (variant) => {
                const scales = ["D4", "E4", "F#4", "G4", "A4", "B4", "C#5", "D5"];
                const newArr = new Array(TOTAL_STEPS).fill(null);
                for (let i = 0; i < TOTAL_STEPS; i++) {
                    if (Math.random() < (variant === 'staccato_heavy' ? 0.65 : 0.5)) {
                        const note = scales[Math.floor(Math.random() * scales.length)];
                        const dur = variant === 'staccato_heavy' ? "16n" : "8n";
                        newArr[i] = { note, dur };
                    }
                }
                setInstrumentSteps(prev => ({ ...prev, violin: newArr }));
                setStatus(`🎻 ヴァイオリン・ソウル短長音切り替え [${variant}] 完了！`);
            };

            const generateAiPattern20 = (instKey, patternNum) => {
                const newArr = new Array(TOTAL_STEPS).fill(null);
                const soulScales = ["C4", "Eb4", "G4", "Bb4", "D5", "Eb5"];
                const scale = soulScales;

                for (let i = 0; i < TOTAL_STEPS; i+
