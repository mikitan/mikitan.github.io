<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIC VICTORY - SYNTHESIZER</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tone.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans select-none pb-12">
    <div id="root">読み込み中...</div>

    <script type="text/babel">
        function App() {
            const [playing, setPlaying] = React.useState(false);
            const [bpm, setBpm] = React.useState(112);
            const [status, setStatus] = React.useState("起動完了：ボタンを押して音を鳴らそう！");

            const togglePlay = async () => {
                await Tone.start();
                setPlaying(!playing);
                setStatus(!playing ? "再生中..." : "停止しました");
            };

            return (
                <div className="p-4 flex flex-col gap-4 max-w-md mx-auto">
                    <h1 className="text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-pink-500">
                        MIC VICTORY v33.0
                    </h1>
                    <div className="bg-slate-900 p-3 rounded border border-slate-800 text-xs text-cyan-400">
                        {status}
                    </div>
                    <button 
                        onClick={togglePlay}
                        className={`py-3 rounded font-bold text-white shadow-lg ${playing ? "bg-amber-600 animate-pulse" : "bg-pink-600"}`}
                    >
                        {playing ? "■ 停止する" : "▶ 再生する"}
                    </button>
                    <div className="flex items-center justify-between bg-slate-900 p-3 rounded border border-slate-800">
                        <span className="text-sm">BPM: {bpm}</span>
                        <input 
                            type="range" 
                            min="60" 
                            max="180" 
                            value={bpm} 
                            onChange={(e) => setBpm(e.target.value)}
                            className="accent-pink-500"
                        />
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
