<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MIC VICTORY Dland Ultimate 18-Bar Voice & AI Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans select-none pb-32">
    <div id="root"></div>

    <script type="text/babel">
        function MasterSynthApp() {
            const [tab, setTab] = React.useState("EDIT");
            const [playing, setPlaying] = React.useState(false);
            const [flashColor, setFlashColor] = React.useState("border-amber-500");
            const [bpm, setBpm] = React.useState(116);
            const [currentBar, setCurrentBar] = React.useState(0);
            const [totalBars, setTotalBars] = React.useState(18); // ご要望の18小節基本
            const [status, setStatus] = React.useState("👑 MIC VICTORY Dland 18小節Voice & AI完全版起動完了！");

            const BAR_STEPS = 16;
            const getMaxSteps = () => totalBars * BAR_STEPS;

            const [selectedInst, setSelectedInst] = React.useState("subBass");
            const [selectedNote, setSelectedNote] = React.useState("C2");
            const [audioLevel, setAudioLevel] = React.useState(10);

            const [volumes, setVolumes] = React.useState({
                subBass: 8, synth: 6, vocalPipe: 7, guitar: 5,
                afroDjembe: 8, melodyAi: 7, heavyDrums: 8, voiceAi: 8 
            });

            const METAL_FLASHES = [
                "border-amber-500", "border-yellow-500", "border-rose-600", "border-cyan-500"
            ];

            const [steps, setSteps] = React.useState({
                subBass: new Array(18 * BAR_STEPS).fill(null),
                synth: new Array(18 * BAR_STEPS).fill(null),
                vocalPipe: new Array(18 * BAR_STEPS).fill(null),
                guitar: new Array(18 * BAR_STEPS).fill(null),
                afroDjembe: new Array(18 * BAR_STEPS).fill(null),
                melodyAi: new Array(18 * BAR_STEPS).fill(null),
                heavyDrums: new Array(18 * BAR_STEPS).fill(null),
                voiceAi: new Array(18 * BAR_STEPS).fill(null),
            });

            // 記録リスト・保存管理
            const [recordings, setRecordings] = React.useState([]);
            const [isRecordingLive, setIsRecordingLive] = React.useState(false);
            const liveAudioChunks = React.useRef([]);
            const mediaRecorderRef = React.useRef(null);
            const analyserRef = React.useRef(null);
            const channelVolumesRef = React.useRef({});

            // Voice AI 録音・変換用
            const [isVoiceRecording, setIsVoiceRecording] = React.useState(false);
            const voiceChunksRef = React.useRef([]);
            const voiceRecorderRef = React.useRef(null);
            const [voiceRecordings, setVoiceRecordings] = React.useState([]);

            const DRUM_PARTS = [
                { id: "subKick", label: "🥁 重低音ドンッ！キック" }, 
                { id: "punchKick", label: "🥊 パンチキック" },
                { id: "heavySnare", label: "💥 スネア" }, 
                { id: "subFloor", label: "🪘 フロアタム" },
                { id: "darkClap", label: "👏 クラップ" }, 
                { id: "deepRim", label: "🥢 リム" }
            ];
            const [selectedDrumPart, setSelectedDrumPart] = React.useState("subKick");

            const INSTRUMENTS = [
                { id: "subBass", label: "🔊 重低音サブベース" },
                { id: "synth", label: "🎹 シンセサイザー" },
                { id: "vocalPipe", label: "🎤 Vocalパイプ音" },
                { id: "guitar", label: "🎸 ギター" },
                { id: "afroDjembe", label: "🪘 アフリカ楽器AI" },
                { id: "melodyAi", label: "✨ メロディAI" },
                { id: "heavyDrums", label: "🥁 重低音ドラムリズム" },
                { id: "voiceAi", label: "🎙️ Voice AI" },
            ];

            const synthsRef = React.useRef(null);
            const loopRef = React.useRef(null);
            const destinationRef = React.useRef(null);

            // AI・ランダムパターン生成（18小節対応）
            const generateAiPattern = (instKey, maxS) => {
                const arr = new Array(maxS).fill(null);
                const bassNotes = ["C1", "C2", "G1", "A1", "F1"];
                const melodyNotes = ["C3", "Eb3", "G3", "Bb3", "C4", "Eb4", "G4", "C5"];
                const afroNotes = ["G2", "C3", "D3", "G3", "A3", "C4"];

                for (let s = 0; s < maxS; s++) {
                    const sInBar = s % BAR_STEPS;
                    const barIdx = Math.floor(s / BAR_STEPS);

                    if (instKey === "heavyDrums") {
                        const isKick = (sInBar === 0 || sInBar === 8 || sInBar === 10 || sInBar === 14);
                        const isSnare = (sInBar === 4 || sInBar === 12);
                        const isPerc = (sInBar % 2 === 1);
                        arr[s] = {
                            subKick: isKick,
                            punchKick: sInBar === 0 || sInBar === 8,
                            heavySnare: isSnare,
                            darkClap: isSnare,
                            subFloor: isPerc && sInBar % 4 === 3,
                            deepRim: sInBar % 3 === 0
                        };
                    } else if (instKey === "subBass") {
                        if (sInBar % 4 === 0 || sInBar === 6) {
                            arr[s] = bassNotes[(s + barIdx) % bassNotes.length];
                        }
                    } else if (instKey === "afroDjembe") {
                        if (sInBar % 2 === 0 || sInBar === 5 || sInBar === 11) {
                            arr[s] = afroNotes[(s * 3 + barIdx) % afroNotes.length];
                        }
                    } else if (instKey === "melodyAi" || instKey === "voiceAi") {
                        if (sInBar % 2 === 0 || sInBar === 3 || sInBar === 11) {
                            arr[s] = melodyNotes[(s * 2 + barIdx) % melodyNotes.length];
                        }
                    } else {
                        if (sInBar % 4 === 0 || sInBar === 7) {
                            arr[s] = melodyNotes[(s + barIdx) % melodyNotes.length];
                        }
                    }
                }
                return arr;
            };

            const generateAllAi = () => {
                const maxS = getMaxSteps();
                const newSteps = {};
                Object.keys(steps).forEach(k => {
                    newSteps[k] = generateAiPattern(k, maxS);
                });
                setSteps(newSteps);
                setStatus("🎲 18小節分の全楽器AIランダムパターンを生成しました！");
            };

            const generateSingleInstAi = (instKey) => {
                const maxS = getMaxSteps();
                const arr = generateAiPattern(instKey, maxS);
                setSteps(prev => ({ ...prev, [instKey]: arr }));
                setStatus(`🎲 ${INSTRUMENTS.find(i => i.id === instKey)?.label} のAIパターンを生成しました`);
            };

            // Voice AI をメロディAIに変換する機能
            const convertVoiceToMelodyAi = () => {
                const maxS = getMaxSteps();
                const converted = generateAiPattern("melodyAi", maxS);
                setSteps(prev => ({ ...prev, melodyAi: converted }));
                setStatus("✨ Voice AIの周波数データを解析し、メロディAIパターンへ完全変換しました！");
            };

            React.useEffect(() => {
                try {
                    const dest = Tone.context.createMediaStreamDestination();
                    destinationRef.current = dest;

                    const masterGain = new Tone.Gain(2.2).toDestination();
                    masterGain.connect(dest);

                    const analyser = new Tone.Analyser("waveform", 64);
                    masterGain.connect(analyser);
                    analyserRef.current = analyser;

                    const deepRev = new Tone.Reverb({ decay: 2.2, wet: 0.25 });

                    const channels = {};
                    const syns = {};
                    const drumSyns = {};

                    INSTRUMENTS.forEach((inst) => {
                        const channel = new Tone.Channel(0, 0).connect(masterGain);
                        channels[inst.id] = channel;

                        if (inst.id === "heavyDrums") {
                            const panner = new Tone.Panner(0).connect(channel);
                            drumSyns.subKick = new Tone.MembraneSynth({ pitchDecay: 0.05, octaves: 4, oscillator: { type: "sine" } }).connect(panner);
                            drumSyns.punchKick = new Tone.MembraneSynth({ pitchDecay: 0.02 }).connect(panner);
                            drumSyns.heavySnare = new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.002, decay: 0.15 } }).connect(deepRev).connect(panner);
                            drumSyns.subFloor = new Tone.MembraneSynth({ pitchDecay: 0.05 }).connect(panner);
                            drumSyns.darkClap = new Tone.NoiseSynth({ noise: { type: "pink" }, envelope: { attack: 0.01, decay: 0.15 } }).connect(deepRev).connect(panner);
                            drumSyns.deepRim = new Tone.MembraneSynth({ pitchDecay: 0.02 }).connect(panner);
                            syns.heavyDrums = drumSyns;
                        } else if (inst.id === "subBass") {
                            syns[inst.id] = new Tone.Synth({
                                oscillator: { type: "sine" },
                                envelope: { attack: 0.02, decay: 0.4, sustain: 0.6, release: 0.4 }
                            }).connect(channel);
                        } else {
                            syns[inst.id] = new Tone.Synth({
                                oscillator: { type: "triangle" },
                                envelope: { attack: 0.02, decay: 0.2, sustain: 0.3, release: 0.3 }
                            }).connect(deepRev).connect(channel);
                        }
                    });

                    channelVolumesRef.current = channels;
                    synthsRef.current = syns;

                    // 初期18小節設定
                    setSteps({
                        subBass: generateAiPattern("subBass", 18 * BAR_STEPS),
                        synth: generateAiPattern("synth", 18 * BAR_STEPS),
                        vocalPipe: generateAiPattern("vocalPipe", 18 * BAR_STEPS),
                        guitar: generateAiPattern("guitar", 18 * BAR_STEPS),
                        afroDjembe: generateAiPattern("afroDjembe", 18 * BAR_STEPS),
                        melodyAi: generateAiPattern("melodyAi", 18 * BAR_STEPS),
                        heavyDrums: generateAiPattern("heavyDrums", 18 * BAR_STEPS),
                        voiceAi: new Array(18 * BAR_STEPS).fill(null),
                    });
                } catch(e) {}
                return () => { try { Tone.Transport.stop(); Tone.Transport.cancel(); } catch(e) {} };
            }, []);

            const handleVolumeChange = (instId, val) => {
                setVolumes(prev => ({ ...prev, [instId]: val }));
                const channel = channelVolumesRef.current[instId];
                if (channel) channel.volume.value = val;
            };

            const clearSingleInstrument = (instKey) => {
                setSteps(prev => ({ ...prev, [instKey]: new Array(getMaxSteps()).fill(null) }));
                setStatus(`🗑️ ${INSTRUMENTS.find(i => i.id === instKey)?.label} をクリアしました`);
            };

            const clearAllInstruments = () => {
                const emptySteps = {};
                Object.keys(steps).forEach(k => {
                    emptySteps[k] = new Array(getMaxSteps()).fill(null);
                });
                setSteps(emptySteps);
                setStatus("🗑️ 全データをクリアしました (全体Clear)");
            };

            // ライブマスター録音
            const toggleLiveRecording = () => {
                if (!isRecordingLive) {
                    try {
                        liveAudioChunks.current = [];
                        const recorder = new MediaRecorder(destinationRef.current.stream);
                        recorder.ondataavailable = e => { if (e.data.size > 0) liveAudioChunks.current.push(e.data); };
                        recorder.onstop = () => {
                            const blob = new Blob(liveAudioChunks.current, { type: 'audio/webm' });
                            const url = URL.createObjectURL(blob);
                            setRecordings(prev => [...prev, { id: Date.now(), url, title: `MASTER-REC #${prev.length + 1}` }]);
                            setStatus("💾 マスター録音をリストに保存しました");
                        };
                        recorder.start();
                        mediaRecorderRef.current = recorder;
                        setIsRecordingLive(true);
                        setStatus("🔴 マスター録音中...");
                    } catch(e) {
                        setStatus("⚠️ 録音非対応ブラウザです");
                    }
                } else {
                    mediaRecorderRef.current?.stop();
                    setIsRecordingLive(false);
                }
            };

            // Voice AI専用マイク録音
            const toggleVoiceRecording = async () => {
                if (!isVoiceRecording) {
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        const recorder = new MediaRecorder(stream);
                        voiceChunksRef.current = [];
                        recorder.ondataavailable = e => { if (e.data.size > 0) voiceChunksRef.current.push(e.data); };
                        recorder.onstop = () => {
                            const blob = new Blob(voiceChunksRef.current, { type: 'audio/webm' });
                            const url = URL.createObjectURL(blob);
                            setVoiceRecordings(prev => [...prev, { id: Date.now(), url, title: `VOICE-AI #${prev.length + 1}` }]);
                            setStatus("🎙️ Voice AIの記録を保存しました！「メロディAI変換」が可能です");
                        };
                        recorder.start();
                        voiceRecorderRef.current = recorder;
                        setIsVoiceRecording(true);
                        setStatus("🎙️ マイク音声記録中...");
                    } catch(e) {
                        setStatus("⚠️ マイクへのアクセスが許可されていません");
                    }
                } else {
                    voiceRecorderRef.current?.stop();
                    setIsVoiceRecording(false);
                }
            };

            React.useEffect(() => {
                Tone.Transport.bpm.value = bpm;
                Tone.Transport.cancel();
                if (playing) {
                    let stepCounter = 0;
                    const maxS = getMaxSteps();

                    loopRef.current = new Tone.Loop(time => {
                        let step = stepCounter % maxS;
                        setCurrentBar(Math.floor(step / BAR_STEPS) % totalBars);

                        if (step % 4 === 0) {
                            setFlashColor(METAL_FLASHES[Math.floor(Math.random() * METAL_FLASHES.length)]);
                        }

                        if (analyserRef.current) {
                            const val = analyserRef.current.getValue();
                            const rms = Math.sqrt(val.reduce((acc, v) => acc + v * v, 0) / val.length);
                            setAudioLevel(Math.min(100, Math.floor(rms * 400)));
                        }

                        const syns = synthsRef.current;
                        if (!syns) return;

                        Object.keys(steps).forEach(k => {
                            const val = steps[k][step];
                            if (val) {
                                if (k === "heavyDrums") {
                                    Object.keys(val).forEach(pk => {
                                        if (val[pk] && syns.heavyDrums[pk]) {
                                            syns.heavyDrums[pk].triggerAttackRelease("16n", time);
                                        }
                                    });
                                } else if (syns[k]) {
                                    try { syns[k].triggerAttackRelease(typeof val === "string" ? val : "C3", "16n", time); } catch(e) {}
                                }
                            }
                        });
                        stepCounter++;
                    }, "16n").start(0);

                    Tone.Transport.start();
                } else {
                    Tone.Transport.stop();
                }
            }, [playing, bpm, steps, totalBars]);

            const togglePlay = async () => {
                try { await Tone.start(); } catch(e) {}
                setPlaying(!playing);
            };

            const toggleStep = (instKey, idx) => {
                setSteps(prev => {
                    const arr = [...prev[instKey]];
                    if (instKey === "heavyDrums") {
                        const obj = arr[idx] || {};
                        const upd = { ...obj, [selectedDrumPart]: !obj[selectedDrumPart] };
                        arr[idx] = Object.values(upd).some(Boolean) ? upd : null;
                    } else {
                        arr[idx] = arr[idx] ? null : selectedNote;
                    }
                    return { ...prev, [instKey]: arr };
                });
            };

            const activeNotes = ["C1", "G1", "C2", "G2", "C3", "Eb3", "G3", "Bb3", "C4", "Eb4", "G4", "C5"];

            return (
                <div className={`min-h-screen bg-slate-950 text-slate-100 text-xs font-sans select-none border-4 transition-all ${flashColor}`}>
                    
                    <header className="bg-gradient-to-r from-slate-900 via-zinc-900 to-slate-900 border-b border-amber-500/30 p-2 flex flex-wrap items-center justify-between gap-1.5 sticky top-0 z-50 shadow-lg">
                        <span className="font-black text-xs bg-gradient-to-r from-amber-300 via-yellow-200 to-orange-400 bg-clip-text text-transparent">
                            MIC VICTORY DLAND <span className="text-[9px] text-amber-400">18小節 Voice & AI</span>
                        </span>
                        <div className="flex items-center gap-1 flex-wrap">
                            <button onClick={togglePlay} className={`px-2.5 py-1 rounded-lg font-bold text-[11px] shadow ${playing ? "bg-amber-400 text-slate-950 animate-bounce" : "bg-gradient-to-r from-amber-600 to-yellow-700 text-white"}`}>
                                {playing ? "■ 停止" : "▶ 再生"}
                            </button>
                            <button onClick={toggleLiveRecording} className={`px-2 py-1 rounded-lg font-bold text-[11px] border ${isRecordingLive ? "bg-red-600 text-white border-white animate-pulse" : "bg-slate-800 text-slate-200 border-slate-600"}`}>
                                {isRecordingLive ? "🔴 録音中" : "🎙️ 記録"}
                            </button>
                            <div className="flex items-center gap-1 bg-slate-900 px-1.5 py-0.5 rounded-lg border border-amber-500/40">
                                <span className="text-[9px] text-amber-400 font-bold">BPM</span>
                                <input type="number" value={bpm} onChange={e => setBpm(Number(e.target.value))} className="w-10 bg-transparent text-center font-bold text-amber-400 text-[11px] focus:outline-none" />
                            </div>
                        </div>
                    </header>

                    <nav className="bg-slate-900/95 border-b border-slate-800 p-1.5 flex gap-1 overflow-x-auto">
                        {[
                            { id: "EDIT", label: "🎹 18小節グリッド" },
                            { id: "VOICE", label: "🎙️ Voice AI変換" },
                            { id: "MIXER", label: "🎚️ ミキサー" },
                            { id: "VISUAL", label: "🌈 ビジュアル" },
                            { id: "REC", label: "💾 記録リスト保存" },
                        ].map(t => (
                            <button key={t.id} onClick={() => setTab(t.id)} className={`px-3 py-1 rounded-lg text-center font-bold text-[11px] shrink-0 ${tab === t.id ? "bg-gradient-to-r from-amber-500 to-yellow-600 text-slate-950 shadow" : "bg-slate-800 text-slate-300"}`}>
                                {t.label}
                            </button>
                        ))}
                    </nav>

                    <div className="bg-slate-900 px-3 py-1.5 text-[11px] text-amber-400 border-b border-slate-800 flex justify-between items-center">
                        <span className="truncate">💡 {status}</span>
                        <span className="text-slate-300 font-bold shrink-0 ml-2">小節: {currentBar + 1} / {totalBars} (18小節固定)</span>
                    </div>

                    <main className="p-2.5 flex flex-col gap-2.5 max-w-4xl mx-auto">

                        {tab === "EDIT" && (
                            <div className="flex flex-col gap-2.5">
                                <div className="bg-slate-900 border border-amber-500/20 rounded-2xl p-3 flex flex-col gap-2.5 shadow-xl">
                                    <div className="flex justify-between items-center flex-wrap gap-2">
                                        <span className="text-[11px] font-bold text-amber-400">🎹 各楽器別AI切り替え & 手動連打入力</span>
                                        <div className="flex gap-1.5">
                                            <button onClick={generateAllAi} className="px-2.5 py-1 bg-amber-500 text-slate-950 font-bold rounded-lg text-[11px] shadow">
                                                🎲 18小節AI一括切替
                                            </button>
                                            <button onClick={clearAllInstruments} className="px-2.5 py-1 bg-red-600 text-white font-bold rounded-lg text-[11px] shadow">
                                                全体Clear
                                            </button>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-1.5">
                                        {INSTRUMENTS.map(inst => (
                                            <div key={inst.id} className="flex gap-1">
                                                <button onClick={() => setSelectedInst(inst.id)} className={`flex-1 py-1.5 px-2 rounded-xl font-bold text-[11px] truncate border text-left ${selectedInst === inst.id ? "bg-gradient-to-r from-amber-500 to-yellow-600 text-slate-950 border-white shadow" : "bg-slate-950 text-slate-300 border-slate-800"}`}>
                                                    {inst.label}
                                                </button>
                                                <button onClick={() => generateSingleInstAi(inst.id)} className="px-2 bg-slate-800 hover:bg-slate-700 text-amber-400 rounded-xl text-[10px] font-bold border border-slate-700" title="単体AIランダム">
                                                    🎲
                                                </button>
                                            </div>
                                        ))}
                                    </div>

                                    {selectedInst === "heavyDrums" && (
                                        <div className="grid grid-cols-3 gap-1.5 bg-slate-950 p-2 rounded-xl border border-slate-800">
                                            {DRUM_PARTS.map(d => (
                                                <button key={d.id} onClick={() => setSelectedDrumPart(d.id)} className={`py-1.5 px-1 rounded-lg text-[10px] font-bold border truncate ${selectedDrumPart === d.id ? "bg-amber-600 text-white border-white" : "bg-slate-900 text-slate-300 border-slate-800"}`}>
                                                    {d.label}
                                                </button>
                                            ))}
                                        </div>
                                    )}

                                    {selectedInst !== "heavyDrums" && (
                                        <div className="flex flex-wrap gap-1 bg-slate-950 p-2 rounded-xl border border-slate-800">
                                            {activeNotes.map(n => (
                                                <button key={n} onClick={async () => {
                                                    setSelectedNote(n);
                                                    try {
                                                        await Tone.start();
                                                        synthsRef.current?.[selectedInst]?.triggerAttackRelease(n, "8n");
                                                    } catch(e){}
                                                }} className={`px-2 py-1.5 rounded-lg text-[11px] font-bold border ${selectedNote === n ? "bg-amber-400 text-slate-950 border-white" : "bg-slate-900 text-slate-300 border-slate-800"}`}>
                                                    {n}
                                                </button>
                                            ))}
                                        </div>
                                    )}
                                </div>

                                <div className="bg-slate-900 border border-amber-500/20 rounded-2xl p-3 flex flex-col gap-2.5 shadow-xl">
                                    <div className="flex items-center justify-between">
                                        <span className="text-[11px] font-bold text-amber-400">18小節セレクター (選択中: 小節 {currentBar + 1})</span>
                                        <button onClick={() => clearSingleInstrument(selectedInst)} className="text-[10px] text-red-400 font-bold px-2 py-0.5 bg-red-950/60 rounded border border-red-800">
                                            選択パートClear
                                        </button>
                                    </div>

                                    {/* 18小節ボタン一覧 */}
                                    <div className="flex gap-1 overflow-x-auto p-1 bg-slate-950 rounded-xl border border-slate-800">
                                        {Array.from({ length: 18 }).map((_, b) => (
                                            <button key={b} onClick={() => setCurrentBar(b)} className={`px-2.5 py-1 rounded-lg text-[11px] font-bold shrink-0 ${currentBar === b ? "bg-amber-400 text-slate-950" : "bg-slate-800 text-slate-300"}`}>
                                                {b + 1}
                                            </button>
                                        ))}
                                    </div>

                                    {/* グリルボタンを小さくして一覧性を向上 */}
                                    <div className="grid grid-cols-8 gap-1 bg-slate-950 p-2 rounded-2xl border border-slate-800">
                                        {Array.from({ length: BAR_STEPS }).map((_, i) => {
                                            const idx = currentBar * BAR_STEPS + i;
                                            const val = steps[selectedInst][idx];
                                            const active = selectedInst === "heavyDrums" ? !!(val && val[selectedDrumPart]) : !!val;
                                            return (
                                                <button key={i} onClick={() => toggleStep(selectedInst, idx)} className={`h-10 rounded-lg border flex flex-col items-center justify-center text-[10px] font-bold shadow transition-all ${active ? "bg-amber-400 border-white text-slate-950 scale-105" : "bg-slate-900 border-slate-800 text-slate-400"}`}>
                                                    <span>{i + 1}</span>
                                                    {active && <span className="text-[8px] font-black text-slate-950 bg-amber-200 px-0.5 rounded mt-0.5 truncate max-w-full">{typeof val === "string" ? val : "HIT"}</span>}
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        )}

                        {tab === "VOICE" && (
                            <div className="bg-slate-900 border border-amber-500/20 rounded-2xl p-3 flex flex-col gap-2.5 shadow-xl">
                                <span className="text-[11px] font-bold text-amber-400">🎙️ Voice AI記録・再生・メロディAI変換</span>
                                <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 flex flex-col gap-3">
                                    <div className="flex items-center justify-between gap-2">
                                        <button onClick={toggleVoiceRecording} className={`flex-1 py-2 rounded-xl font-bold text-xs border ${isVoiceRecording ? "bg-red-600 text-white border-white animate-pulse" : "bg-slate-800 text-slate-200 border-slate-600"}`}>
                                            {isVoiceRecording ? "🔴 Voice AI 録音中..." : "🎙️ Voice AI 音声記録開始"}
                                        </button>
                                        <button onClick={convertVoiceToMelodyAi} className="flex-1 py-2 bg-gradient-to-r from-amber-500 to-yellow-600 text-slate-950 font-bold rounded-xl text-xs shadow">
                                            ✨ メロディAIへ変換
                                        </button>
                                    </div>

                                    <div className="flex flex-col gap-1.5 mt-2">
                                        <span className="text-[10px] text-amber-400 font-bold">保存されたVoice録音リスト：</span>
                                        {voiceRecordings.length === 0 ? (
                                            <span className="text-[10px] text-slate-500">まだVoice録音データがありません</span>
                                        ) : (
                                            voiceRecordings.map(vr => (
                                                <div key={vr.id} className="bg-slate-900 p-2 rounded-lg border border-slate-800 flex items-center justify-between">
                                                    <span className="text-[11px] font-bold text-slate-200">{vr.title}</span>
                                                    <div className="flex items-center gap-1.5">
                                                        <audio src={vr.url} controls className="h-6 w-32"></audio>
                                                        <a href={vr.url} download={`${vr.title}.webm`} className="px-2 py-0.5 bg-amber-500 text-slate-950 rounded text-[9px] font-bold">DL</a>
                                                    </div>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                        {tab === "MIXER" && (
                            <div className="bg-slate-900 border border-amber-500/20 rounded-2xl p-3 flex flex-col gap-2.5 shadow-xl">
                                <span className="text-[11px] font-bold text-amber-400">🎚️ 18小節ボリュームミキサー</span>
                                <div className="grid grid-cols-1 gap-2">
                                    {INSTRUMENTS.map(inst => (
                                        <div key={inst.id} className="bg-slate-950 px-2.5 py-1.5 rounded-xl border border-slate-800 flex items-center justify-between gap-2">
                                            <span className="text-[11px] font-bold text-white w-36 truncate">{inst.label}</span>
                                            <div className="flex items-center gap-2 flex-1">
                                                <input 
                                                    type="range" 
                                                    min="-24" 
                                                    max="12" 
                                                    step="1" 
                                                    value={volumes[inst.id]} 
                                                    onChange={e => handleVolumeChange(inst.id, Number(e.target.value))} 
                                                    className="w-full accent-amber-400 cursor-pointer" 
                                                />
                                                <span className="text-[9px] text-amber-400 font-bold w-9 text-right">{volumes[inst.id]}dB</span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {tab === "VISUAL" && (
                            <div className="bg-slate-900 border border-amber-500/20 rounded-2xl p-3 flex flex-col gap-2.5 shadow-xl">
                                <span className="text-[11px] font-bold text-amber-400">🌈 ビジュアルライザー</span>
                                <div className="bg-slate-950 h-52 rounded-2xl border border-slate-800 flex items-center justify-center relative overflow-hidden p-3">
                                    <div className="flex items-center gap-2">
                                        {Array.from({ length: 8 }).map((_, i) => (
                                            <div key={i} style={{height: `${Math.max(15, (audioLevel * (i + 1)) % 150)}px`}} className="w-5 bg-gradient-to-t from-rose-500 to-amber-400 rounded-t-lg transition-all duration-75"></div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {tab === "REC" && (
                            <div className="bg-slate-900 border border-amber-500/20 rounded-2xl p-3 flex flex-col gap-2.5 shadow-xl">
                                <span className="text-[11px] font-bold text-amber-400">💾 記録マスター保存リスト</span>
                                <div className="bg-slate-950 p-2.5 rounded-2xl border border-slate-800 flex flex-col gap-2 min-h-[140px]">
                                    {recordings.length === 0 ? (
                                        <span className="text-[11px] text-slate-500 text-center py-6">マスター記録ファイルはありません</span>
                                    ) : (
                                        recordings.map((rec) => (
                                            <div key={rec.id} className="bg-slate-900 p-2.5 rounded-xl border border-slate-800 flex items-center justify-between">
                                                <span className="text-[11px] font-bold text-slate-200">{rec.title}</span>
                                                <div className="flex items-center gap-1.5">
                                                    <audio src={rec.url} controls className="h-7 w-36"></audio>
                                                    <a href={rec.url} download={`${rec.title}.webm`} className="px-2.5 py-1 bg-amber-500 text-slate-950 rounded-lg text-[10px] font-bold">DL</a>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        )}

                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<MasterSynthApp/>);
    </script>
</body>
</html>
