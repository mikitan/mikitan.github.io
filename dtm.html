<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MIC VICTORY - 120 PRESETS FULL ECO EVO v65.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        @keyframes rapGlow {
            0% { border-color: #ec4899; box-shadow: 0 0 12px rgba(236, 72, 153, 0.3); }
            50% { border-color: #06b6d4; box-shadow: 0 0 12px rgba(6, 182, 212, 0.3); }
            100% { border-color: #ec4899; box-shadow: 0 0 12px rgba(236, 72, 153, 0.3); }
        }
        .illumi-live { animation: rapGlow 2.5s infinite linear; }
        .eco-saver * { transition: none !important; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans select-none pb-32 overflow-x-hidden text-sm">
    <div id="root"></div>

    <script type="text/babel">
        function Full120EcoRapEvo() {
            const [tab, setTab] = React.useState("AI_20_ALL");
            const [playing, setPlaying] = React.useState(false);
            const [illumiActive, setIllumiActive] = React.useState(true);
            const [ecoMode, setEcoMode] = React.useState(true); // 省電力デフォルトON
            const [manualRec, setManualRec] = React.useState(true);
            const [beatMode, setBeatMode] = React.useState("BEAT_18");
            const [bpm, setBpm] = React.useState(138);
            const [currentStep, setCurrentStep] = React.useState(0);
            const [currentBar, setCurrentBar] = React.useState(0);
            const [status, setStatus] = React.useState("🔥 各楽器20入×6＝全120プリセット展開 v65.0");

            const BARS = 8;
            const STEPS_PER_BAR = beatMode === "BEAT_18" ? 18 : 16;
            const TOTAL_STEPS = BARS * STEPS_PER_BAR;

            const INSTS = [
                { id: "normalDrums20", name: "🥁 普通のドラム(20入)", color: "from-red-600 to-rose-700" },
                { id: "afroTaiko20", name: "🌍 アフリカ太鼓ポリ(20入)", color: "from-amber-600 to-red-800" },
                { id: "coolLead20", name: "🔥 かっこいい音/リード(20入)", color: "from-cyan-500 to-blue-700" },
                { id: "kalimbaSafety20", name: "🎹 カリンバ安全音階(20入)", color: "from-emerald-500 to-teal-700" },
                { id: "tightBass20", name: "🔊 タイト重低音ベース(20入)", color: "from-orange-500 to-stone-900" },
                { id: "fxHit20", name: "💥 エッジFXヒット(20入)", color: "from-indigo-500 to-slate-700" },
            ];

            const [selectedInst, setSelectedInst] = React.useState("coolLead20");
            const [selected20Index, setSelected20Index] = React.useState(0);
            const [noteDuration, setNoteDuration] = React.useState("16n");

            // 8小節分×複数ラップフロウ
            const RAP_FLOW_BANK = [
                [
                    "【BAR 1】蹴り出すスネア 18のビート（ライム固め）",
                    "【BAR 2】崩れないペンタ 乗せるぜクオリティ",
                    "【BAR 3】ジェンベの低音 刻むアンダーグラウンド",
                    "【BAR 4】カリンバの輝き 隙間に差し込むサウンド",
                    "【BAR 5】ハイテンポ加速 CRERAで歪ますエッジ",
                    "【BAR 6】止まらないフロウ 魂の周波数でレス",
                    "【BAR 7】20入りのパレット 一瞬で呼び出す波",
                    "【BAR 8】MIC VICTORY 頂点に刻むラストバー"
                ]
            ];
            const [aiGeneratedBars] = React.useState(RAP_FLOW_BANK[0]);

            // 各楽器20種（全120プリセット）完全生成ライブラリ
            const [ai120Library] = React.useState(() => {
                const lib = {};
                const safeScale = ["C4", "Eb4", "F4", "G4", "Bb4", "C5"];
                INSTS.forEach(i => {
                    lib[i.id] = Array.from({ length: 20 }, (_, pIdx) => {
                        const arr = new Array(TOTAL_STEPS).fill(null);
                        for (let s = 0; s < TOTAL_STEPS; s++) {
                            const sInBar = s % STEPS_PER_BAR;
                            if (sInBar < STEPS_PER_BAR - 2) {
                                if (i.id.includes("Drums") || i.id.includes("Taiko")) {
                                    // 18ビートの裏拍・ポリリズム変種
                                    const patternMask = (sInBar + pIdx * 3) % (4 + (pIdx % 3)) === 0;
                                    if (patternMask || sInBar === 0 || sInBar === 9) {
                                        arr[s] = { note: sInBar === 0 ? "C1" : "G1", dur: "16n", slot: pIdx + 1 };
                                    }
                                } else if (i.id.includes("Bass")) {
                                    if ((sInBar + pIdx) % 3 === 0) {
                                        arr[s] = { note: "C0", dur: "16n", slot: pIdx + 1 };
                                    }
                                } else if (i.id.includes("fxHit")) {
                                    if (sInBar === 6 || sInBar === 12 || sInBar === pIdx % 15) {
                                        arr[s] = { note: safeScale[(pIdx + s) % safeScale.length], dur: "32n", slot: pIdx + 1 };
                                    }
                                } else {
                                    // リード / カリンバ安全音階
                                    const offset = (pIdx * 2) % safeScale.length;
                                    if ((s + pIdx * 5) % 4 === 0 || sInBar === 4 || sInBar === 10) {
                                        arr[s] = {
                                            note: safeScale[(s + offset) % safeScale.length],
                                            dur: "16n",
                                            slot: pIdx + 1
                                        };
                                    }
                                }
                            }
                        }
                        return arr;
                    });
                });
                return lib;
            });

            // 初期アクティブグリッド（#1をロード）
            const [activeGrid, setActiveGrid] = React.useState(() => {
                const init = {};
                INSTS.forEach(i => {
                    init[i.id] = new Array(TOTAL_STEPS).fill(null);
                    for (let s = 0; s < TOTAL_STEPS; s++) {
                        const sInBar = s % STEPS_PER_BAR;
                        if (sInBar < STEPS_PER_BAR - 2) {
                            if (i.id === "normalDrums20" && (sInBar === 0 || sInBar === 9)) {
                                init[i.id][s] = { note: "C1", dur: "16n" };
                            } else if (i.id === "coolLead20" && sInBar % 3 === 0) {
                                init[i.id][s] = { note: "G4", dur: "16n" };
                            }
                        }
                    }
                });
                return init;
            });

            const [tachoHistory, setTachoHistory] = React.useState(Array(24).fill(0));
            const synthsRef = React.useRef(null);
            const transportLoopRef = React.useRef(null);
            const NOTES = ["C4", "D4", "E4", "F4", "G4", "A4", "B4", "C5"];
            const SOLFEGE = { "C4": "ド", "D4": "レ", "E4": "ミ", "F4": "ファ", "G4": "ソ", "A4": "ラ", "B4": "シ", "C5": "ド" };

            React.useLayoutEffect(() => {
                const master = new Tone.Gain(1.15).toDestination();
                const filter = new Tone.Filter({ type: "lowpass", frequency: 7200, Q: 8 }).connect(master);
                const bitCrush = new Tone.BitCrusher(13).connect(filter);
                const reverb = new Tone.Reverb({ decay: 0.9, wet: 0.12 }).connect(bitCrush);

                synthsRef.current = {
                    filter, bitCrush, reverb,
                    lead: new Tone.PolySynth(Tone.Synth, {
                        oscillator: { type: "sawtooth" },
                        envelope: { attack: 0.001, decay: 0.08, sustain: 0.2, release: 0.05 }
                    }).connect(reverb),
                    sub: new Tone.MonoSynth({
                        oscillator: { type: "square" },
                        envelope: { attack: 0.002, decay: 0.15, sustain: 0.4, release: 0.08 }
                    }).connect(reverb),
                    drum: new Tone.MembraneSynth({ pitchDecay: 0.03, octaves: 4.3 }).connect(reverb),
                };

                return () => { Tone.Transport.stop(); Tone.Transport.cancel(); };
            }, []);

            React.useEffect(() => {
                const effectiveBpm = beatMode === "HIGH_TEMPO_EVO" ? bpm * 1.35 : bpm;
                Tone.Transport.bpm.value = Math.max(70, effectiveBpm);
                Tone.Transport.cancel();

                if (playing) {
                    let counter = 0;
                    transportLoopRef.current = new Tone.Loop(time => {
                        const step = counter % TOTAL_STEPS;
                        const bar = Math.floor(step / STEPS_PER_BAR);
                        const sInBar = step % STEPS_PER_BAR;
                        setCurrentStep(sInBar);
                        setCurrentBar(bar);

                        const syns = synthsRef.current;
                        if (!syns) return;

                        let activeCount = 0;
                        INSTS.forEach(inst => {
                            const val = activeGrid[inst.id][step];
                            if (val) {
                                activeCount++;
                                if (inst.id.includes("Bass")) {
                                    syns.sub.triggerAttackRelease("C1", val.dur || "16n", time);
                                } else if (inst.id.includes("Drums") || inst.id.includes("Taiko") || inst.id.includes("fxHit")) {
                                    syns.drum.triggerAttackRelease(sInBar === 0 ? "C1" : "G1", val.dur || "16n", time);
                                } else {
                                    syns.lead.triggerAttackRelease(val.note || "C4", val.dur || "16n", time);
                                }
                            }
                        });

                        if (!ecoMode || counter % 2 === 0) {
                            setTachoHistory(prev => [...prev.slice(1), activeCount * 26]);
                        }
                        counter++;
                    }, "16n").start(0);

                    Tone.Transport.start();
                } else {
                    Tone.Transport.stop();
                }
            }, [playing, bpm, beatMode, activeGrid, ecoMode]);

            const togglePlay = async () => {
                await Tone.start();
                setPlaying(!playing);
                setStatus(playing ? "⏸ 一時停止" : `▶ 再生中 (エコ:${ecoMode ? "ON" : "OFF"} | 120プリセット融合)`);
            };

            const toggleEcoMode = () => {
                const nextEco = !ecoMode;
                setEcoMode(nextEco);
                if (synthsRef.current) {
                    synthsRef.current.reverb.wet.value = nextEco ? 0.08 : 0.15;
                }
                setStatus(nextEco ? "🔋 省電力モードON（発熱・GPU/CPU負荷軽減中）" : "⚡ 通常フルパワーモード復帰");
            };

            const loadAi120PatternToActive = (instId, patternIndex) => {
                const patArr = ai120Library[instId][patternIndex];
                setActiveGrid(prev => ({
                    ...prev,
                    [instId]: [...patArr]
                }));
                setSelectedInst(instId);
                setSelected20Index(patternIndex);
                setStatus(`🤖 ${instId} の20入パターン #${patternIndex + 1} をアクティブ展開！`);
            };

            const loadAll20BatchToActive = () => {
                setActiveGrid(() => {
                    const next = {};
                    INSTS.forEach(i => {
                        // ランダムに各楽器の20入から1つ選んで全トラック一括同期
                        const randIdx = Math.floor(Math.random() * 20);
                        next[i.id] = [...ai120Library[i.id][randIdx]];
                    });
                    return next;
                });
                setStatus("🎲 全6楽器（120種中からランダム一括ミックス）展開完了！");
            };

            const manualPressNote = (note) => {
                const syns = synthsRef.current;
                if (!syns) return;
                if (selectedInst.includes("Bass")) syns.sub.triggerAttackRelease("C1", noteDuration);
                else if (selectedInst.includes("Drums") || selectedInst.includes("Taiko") || selectedInst.includes("fxHit")) syns.drum.triggerAttackRelease("C1", "16n");
                else syns.lead.triggerAttackRelease(note, noteDuration);

                if (manualRec && currentStep !== -1) {
                    const stepIdx = currentBar * STEPS_PER_BAR + currentStep;
                    setActiveGrid(prev => {
                        const arr = [...prev[selectedInst]];
                        arr[stepIdx] = { note, dur: noteDuration, manual: true };
                        return { ...prev, [selectedInst]: arr };
                    });
                }
            };

            return (
                <div className={`min-h-screen bg-slate-950 text-slate-100 flex flex-col text-sm font-sans select-none pb-32 overflow-x-hidden ${ecoMode ? "eco-saver" : ""} ${illumiActive && !ecoMode ? "illumi-live" : ""}`}>
                    {/* TOP HEADER */}
                    <header className="bg-slate-900 border-b border-slate-800 px-3 py-2.5 flex items-center justify-between gap-2 sticky top-0 z-50">
                        <div className="flex flex-col">
                            <span className="font-black text-sm bg-gradient-to-r from-pink-400 via-cyan-400 to-amber-400 bg-clip-text text-transparent">
                                120 PRESET ECO EVO
                            </span>
                            <span className="text-[10px] text-pink-400 font-bold">全6楽器×各20入 v65.0 {ecoMode ? "[ECO節電]" : ""}</span>
                        </div>
                        <div className="flex items-center gap-1.5">
                            <button onClick={toggleEcoMode} className={`px-2 py-1.5 rounded font-bold text-[11px] border ${ecoMode ? "bg-emerald-950 border-emerald-400 text-emerald-300" : "bg-slate-900 border-slate-700 text-slate-400"}`}>
                                {ecoMode ? "🔋節電ON" : "⚡節電OFF"}
                            </button>
                            <button onClick={togglePlay} className={`px-3 py-1.5 rounded font-bold text-xs shadow-lg ${playing ? "bg-amber-400 text-slate-950 animate-pulse" : "bg-cyan-600 text-white"}`}>
                                {playing ? "■ 停止" : "▶ 再生"}
                            </button>
                        </div>
                    </header>

                    {/* STATUS BAR */}
                    <div className="bg-slate-900/50 px-3 py-1.5 text-xs text-cyan-400 border-b border-slate-900 flex justify-between items-center">
                        <span className="truncate">💡 {status}</span>
                        {playing && <span className="text-[11px] text-pink-300 font-mono shrink-0 ml-2">BAR {currentBar + 1}/8</span>}
                    </div>

                    {/* TAB NAV */}
                    <nav className="bg-slate-900/95 border-b border-slate-800 px-2 py-2 grid grid-cols-4 gap-1">
                        {[
                            { id: "AI_20_ALL", label: "🤖 120入全選択" },
                            { id: "RAP_LYRICS_AI", label: "🎤 ラップAI詞" },
                            { id: "MOBILE_20GRID", label: "🎹 太鼓&鍵盤" },
                            { id: "OVERALL_TACHO", label: "📊 タコグラフ" },
                        ].map(t => (
                            <button key={t.id} onClick={() => setTab(t.id)} className={`py-2 px-0.5 rounded text-[11px] font-bold leading-tight ${tab === t.id ? "bg-cyan-400 text-slate-950 shadow" : "bg-slate-800/80 text-slate-300"}`}>
                                {t.label}
                            </button>
                        ))}
                    </nav>

                    <main className="p-3 flex flex-col gap-4">
                        {tab === "AI_20_ALL" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-xl p-3 flex flex-col gap-3">
                                <div className="flex justify-between items-center">
                                    <span className="text-xs font-bold amber-400 text-amber-400">🤖 各楽器20入×6＝全120プリセット選択パレット</span>
                                    <button onClick={loadAll20BatchToActive} className="px-2.5 py-1 bg-gradient-to-r from-pink-500 to-cyan-500 text-slate-950 font-bold rounded text-xs shadow">
                                        🎲 全120ランダム一括ミックス
                                    </button>
                                </div>
                                <div className="flex flex-col gap-3">
                                    {INSTS.map(inst => (
                                        <div key={inst.id} className="bg-slate-950 p-2.5 rounded-lg border border-slate-800 flex flex-col gap-2">
                                            <div className="flex justify-between items-center">
                                                <span className="text-xs font-bold text-pink-300">{inst.name}</span>
                                                <span className="text-[10px] text-slate-400">各20パターン搭載 (#1〜#20)</span>
                                            </div>
                                            <div className="grid grid-cols-5 gap-1.5">
                                                {Array.from({ length: 20 }, (_, idx) => (
                                                    <button key={idx} onClick={() => loadAi120PatternToActive(inst.id, idx)} className={`py-1.5 rounded font-bold text-xs border ${selectedInst === inst.id && selected20Index === idx ? "bg-cyan-400 text-slate-950 border-white" : "bg-slate-900 border-slate-800 text-slate-300"}`}>
                                                        #{idx + 1}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {tab === "RAP_LYRICS_AI" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-xl p-3 flex flex-col gap-3">
                                <span className="text-xs font-bold text-pink-400">🎤 崩れないラップ歌詞AIジェネレーター (8小節フロウ)</span>
                                <div className="flex flex-col gap-1.5 bg-slate-950 p-3 rounded-xl border border-slate-800">
                                    {aiGeneratedBars.map((line, bIdx) => (
                                        <div key={bIdx} onClick={() => setCurrentBar(bIdx)} className={`p-2 rounded-lg text-xs font-mono cursor-pointer flex justify-between items-center ${playing && currentBar === bIdx ? "bg-cyan-950 border border-cyan-400 text-cyan-200" : "bg-slate-900/60 border border-slate-800 text-slate-300"}`}>
                                            <span>{line}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {tab === "MOBILE_20GRID" && (
                            <div className="flex flex-col gap-3">
                                <div className="bg-slate-900 border border-slate-800 rounded-xl p-3 flex flex-col gap-2">
                                    <span className="text-xs font-bold text-pink-400">① 楽器選択（20入ターゲット切替）</span>
                                    <div className="grid grid-cols-2 gap-2">
                                        {INSTS.map(inst => (
                                            <button key={inst.id} onClick={() => setSelectedInst(inst.id)} className={`py-2 px-2 rounded-lg font-bold text-xs border flex items-center justify-center shadow ${selectedInst === inst.id ? `bg-gradient-to-r ${inst.color} border-white text-white` : "bg-slate-950 border-slate-800 text-slate-400"}`}>
                                                {inst.name}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                <div className="bg-slate-900 border border-slate-800 rounded-xl p-3 flex flex-col gap-3">
                                    <span className="text-xs font-bold text-cyan-400">② 音階 / 太鼓打刻パッド（手動記譜）</span>
                                    <div className="grid grid-cols-4 gap-2">
                                        {NOTES.map(note => (
                                            <button key={note} onTouchStart={(e) => { e.preventDefault(); manualPressNote(note); }} onMouseDown={() => manualPressNote(note)} className="py-4 rounded-xl font-bold text-center border shadow-md bg-slate-950 text-slate-100 border-slate-800 active:scale-95 active:bg-cyan-400 active:text-slate-950">
                                                <div className="text-sm font-black">{SOLFEGE[note]}</div>
                                                <div className="text-[9px] opacity-70">{note}</div>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {tab === "OVERALL_TACHO" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-xl p-3 flex flex-col gap-3">
                                <span className="text-xs font-bold text-purple-400">📊 全体タコグラフ（省電力負荷軽量表示）</span>
                                <div className="h-28 bg-slate-950 rounded-xl border border-slate-800 p-2 flex items-end gap-1">
                                    {tachoHistory.map((val, idx) => (
                                        <div key={idx} className="flex-1 flex flex-col justify-end h-full">
                                            <div style={{ height: `${Math.min(100, Math.max(5, val))}%` }} className="bg-gradient-to-t from-cyan-400 to-pink-500 rounded-t-[1px]" />
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* FOOTER */}
                    <footer className="fixed bottom-0 left-0 right-0 bg-slate-950/95 border-t border-slate-800 px-3 py-2 flex justify-between items-center text-[10px] text-slate-500 z-50">
                        <span className="font-bold text-slate-300">120 PRESET ECO EVO</span>
                        <span className="text-emerald-400 font-bold">v65.0</span>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<Full120EcoRapEvo />);
    </script>
</body>
</html>
