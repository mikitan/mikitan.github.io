<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIC VICTORY - MASTER SYNTHESIZER v39.0 (GENRE MELODIES & 20 LOOPS)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans select-none pb-20 overflow-x-hidden">
    <div id="root">
        <div class="flex items-center justify-center h-screen text-amber-500 font-bold text-sm animate-pulse">
            ジャンル別メロディ & ループ20種 読み込み中... (MIC VICTORY v39.0)
        </div>
    </div>

    <script type="text/babel">
        try {
            function MasterSynthApp() {
                const [tab, setTab] = React.useState("GENRE_EDIT");
                const [playing, setPlaying] = React.useState(false);
                const [flashColor, setFlashColor] = React.useState("border-orange-600");
                const [bpm, setBpm] = React.useState(112);
                const [currentBar, setCurrentBar] = React.useState(0);
                const [currentStep, setCurrentStep] = React.useState(-1);
                const [status, setStatus] = React.useState("✨ Soul/Pop/Popping/Ballad/Rock/Dance 20種メロディ＆ループ完全搭載 v39.0");

                const BARS = 8;
                const BAR_STEPS = 16;
                const TOTAL_STEPS = BARS * BAR_STEPS;

                const [selectedInstrument, setSelectedInstrument] = React.useState("trumpet");
                const [diMode, setDiMode] = React.useState("DI_AMP_SIM"); 
                
                // 選択中のジャンルとパーツ・ループ
                const [selectedGenre, setSelectedGenre] = React.useState("SOUL");
                const [selectedMelodyPart, setSelectedMelodyPart] = React.useState("soulLead01");
                const [selectedLoopPart, setSelectedLoopPart] = React.useState("loopBeat01");

                const [selectedDrumPart, setSelectedDrumPart] = React.useState("kick");
                const [selectedBassPart, setSelectedBassPart] = React.useState("subBass");
                const [selectedRapPart, setSelectedRapPart] = React.useState("rapPunch01");

                // リアルタイム手押し記録モード
                const [liveRecordMode, setLiveRecordMode] = React.useState(false);
                const [recordStepIndex, setRecordStepIndex] = React.useState(0);

                const [slotName, setSlotName] = React.useState("MASTER_ALBUM_01");
                const [savedSlots, setSavedSlots] = React.useState({});

                const [instrumentSteps, setInstrumentSteps] = React.useState({
                    trumpet: new Array(TOTAL_STEPS).fill(null),
                    synth: new Array(TOTAL_STEPS).fill(null),
                    violin: new Array(TOTAL_STEPS).fill(null),
                    piano: new Array(TOTAL_STEPS).fill(null),
                    guitar: new Array(TOTAL_STEPS).fill(null),
                    subBass: new Array(TOTAL_STEPS).fill(null),
                    drums: new Array(TOTAL_STEPS).fill(null),
                    rapVocals: new Array(TOTAL_STEPS).fill(null),
                });

                const synthsRef = React.useRef(null);
                const loopRef = React.useRef(null);

                // 各ジャンルごとの20種メロディパーツ定義 (コード進行やフレーズノート)
                const GENRE_MELODY_PARTS = {
                    SOUL: [
                        { id: "soulLead01", label: "01. ソウルフル・ヴォーカルリード", note: "C3" },
                        { id: "soulChord02", label: "02. 7thコード・グルーヴィ", note: "E3" },
                        { id: "soulSmooth03", label: "03. スムース・R&Bフレーズ", note: "G3" },
                        { id: "soulWarm04", label: "04. ウォーム・ローズコード", note: "A3" }
                    ],
                    POP: [
                        { id: "popBright01", label: "05. ブライト・キャッチーメロ", note: "C4" },
                        { id: "popCatchy02", label: "06. キラキラ・サビフレーズ", note: "E4" },
                        { id: "popUpbeat03", label: "07. アップビート・シンセ", note: "G4" },
                        { id: "popHarmoni04", label: "08. ハーモニー・ポップコード", note: "B3" }
                    ],
                    POPPING: [
                        { id: "popPopping01", label: "09. ポッピング・ロボティック", note: "C2" },
                        { id: "popBounce02", label: "10. エレクトロ・バウンス", note: "D2" },
                        { id: "popStacc03", label: "11. シャープ・スタッカート", note: "G2" },
                        { id: "popLock04", label: "12. ロック＆ポップ・ヒット", note: "A2" }
                    ],
                    BALLAD: [
                        { id: "balladEmot01", label: "13. エモーショナル・バラード", note: "E3" },
                        { id: "balladMelan02", label: "14. メランコリック・ピアノ", note: "G3" },
                        { id: "balladTender03", label: "15. テンダー・ストリングス", note: "B3" },
                        { id: "balladDeep04", label: "16. ディープ・エモーショナル", note: "C4" }
                    ],
                    ROCK: [
                        { id: "rockHeavy01", label: "17. ヘヴィ・ギターリフ", note: "C2" },
                        { id: "rockPower02", label: "18. パワーコード・アンセム", note: "E2" },
                        { id: "rockDist03", label: "19. ディストーション・リード", note: "G2" },
                        { id: "rockWild04", label: "20. ワイルド・ロックンロール", note: "A2" }
                    ],
                    DANCE_POPS: [
                        { id: "dancePop01", label: "21. ダンスポップ・チャーム", note: "C3" },
                        { id: "dancePop02", label: "22. クラブ・アンセムリード", note: "F3" },
                        { id: "dancePop03", label: "23. グルーヴィ・シンセポップ", note: "A3" },
                        { id: "dancePop04", label: "24. ハイパー・ダンスフロウ", note: "C4" }
                    ],
                    EDM_DANCE: [
                        { id: "edmSynth01", label: "25. EDM・スーパーソー", note: "C3" },
                        { id: "edmDrop02", label: "26. ドロップ・ベースリード", note: "E3" },
                        { id: "edmPulse03", label: "27. パルス・アルペジオ", note: "G3" },
                        { id: "edmRave04", label: "28. レイブ・フェスティバル", note: "B3" }
                    ]
                };

                // 20種のループパーツ定義
                const LOOP_PARTS = Array.from({ length: 20 }, (_, i) => ({
                    id: `loopBeat${String(i + 1).padStart(2, '0')}`,
                    label: `${String(i + 1).padStart(2, '0')}. プロ・スタイルループビート`
                }));

                const INSTRUMENTS = [
                    { id: "trumpet", label: "🎺 トランペット", color: "from-amber-600 to-yellow-800" },
                    { id: "synth", label: "🎹 シンセサイザー", color: "from-blue-900 to-indigo-950" },
                    { id: "violin", label: "🎻 クラシック弦楽器", color: "from-emerald-800 to-teal-950" },
                    { id: "piano", label: "🎹 グランドピアノ", color: "from-slate-700 to-slate-900" },
                    { id: "guitar", label: "🎸 ロックギター", color: "from-orange-800 to-amber-950" },
                    { id: "subBass", label: "🔊 ステレオ重低音", color: "from-amber-700 to-orange-900" },
                    { id: "drums", label: "🥁 ステレオドラム", color: "from-red-800 to-amber-900" },
                    { id: "rapVocals", label: "🎤 ボーカル＆ラップ", color: "from-rose-800 to-purple-950" },
                ];

                const DRUM_PARTS = [
                    { id: "kick", label: "01. ファットキック" }, { id: "subKick", label: "02. サブ808" },
                    { id: "snare", label: "03. スネア" }, { id: "hihat", label: "04. ハイハット" },
                ];

                const BASS_PARTS = [
                    { id: "subBass", label: "01. ディープサブ" }, { id: "synthBass", label: "02. 808重低音" },
                    { id: "funkBass", label: "03. ファンキー" }, { id: "slapBass", label: "04. スラップ" }
                ];

                const RAP_PARTS = [
                    { id: "rapPunch01", label: "01. ヘヴィパンチ" }, { id: "rapFast02", label: "02. 高速ツーステップ" },
                    { id: "rapAggro03", label: "03. アグレッシブ" }, { id: "rapSmooth04", label: "04. メロウメロディ" }
                ];

                // 音響初期化 (世界最高峰マスタリング)
                React.useEffect(() => {
                    try {
                        const limiter = new Tone.Limiter(-0.1).toDestination();
                        const stereoWidener = new Tone.StereoWidener(0.6).connect(limiter);
                        const chorus = new Tone.Chorus(4, 2.5, 0.5).connect(stereoWidener);
                        const reverb = new Tone.Reverb({ roomSize: 0.85, dampening: 3000, wet: 0.25 }).connect(chorus);
                        const compressor = new Tone.Compressor({ threshold: -18, ratio: 4 }).connect(reverb);
                        const masterGain = new Tone.Gain(1.4).connect(compressor);

                        const trumpetSynth = new Tone.Synth({ oscillator: { type: "sawtooth" }, envelope: { attack: 0.015, decay: 0.25, sustain: 0.7, release: 0.2 } }).connect(masterGain);
                        const synthLead = new Tone.Synth({ oscillator: { type: "fmsawtooth" }, envelope: { attack: 0.02, decay: 0.3, sustain: 0.5, release: 0.3 } }).connect(masterGain);
                        const violinSynth = new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.08, decay: 0.4, sustain: 0.8, release: 0.5 } }).connect(masterGain);
                        const pianoSynth = new Tone.Synth({ oscillator: { type: "triangle" }, envelope: { attack: 0.005, decay: 0.6, sustain: 0.2, release: 0.4 } }).connect(masterGain);
                        const guitarSynth = new Tone.Synth({ oscillator: { type: "square" }, envelope: { attack: 0.01, decay: 0.25, sustain: 0.3, release: 0.2 } }).connect(masterGain);

                        const bassSynths = {};
                        BASS_PARTS.forEach(part => {
                            bassSynths[part.id] = new Tone.MonoSynth({ oscillator: { type: "sine" }, envelope: { attack: 0.01, decay: 0.8, sustain: 0.9, release: 0.4 } }).connect(masterGain);
                        });

                        const drumSynths = {};
                        DRUM_PARTS.forEach(part => {
                            drumSynths[part.id] = new Tone.MembraneSynth({ pitchDecay: 0.06, octaves: 6, oscillator: { type: "sine" }, envelope: { attack: 0.001, decay: 0.6, sustain: 0.01, release: 0.3 } }).connect(masterGain);
                        });

                        const rapSynths = {};
                        RAP_PARTS.forEach(part => {
                            rapSynths[part.id] = new Tone.MembraneSynth({ pitchDecay: 0.03, octaves: 3, oscillator: { type: "square" }, envelope: { attack: 0.005, decay: 0.3, sustain: 0.1, release: 0.2 } }).connect(masterGain);
                        });

                        synthsRef.current = {
                            trumpet: trumpetSynth,
                            synth: synthLead,
                            violin: violinSynth,
                            piano: pianoSynth,
                            guitar: guitarSynth,
                            subBass: bassSynths,
                            drums: drumSynths,
                            rapVocals: rapSynths
                        };
                    } catch (e) {
                        console.error("Audio Init Error:", e);
                    }

                    return () => {
                        Tone.Transport.stop();
                        Tone.Transport.cancel();
                    };
                }, []);

                // 演奏ループ
                React.useEffect(() => {
                    Tone.Transport.bpm.value = bpm;
                    Tone.Transport.cancel();

                    if (playing) {
                        let stepCounter = 0;
                        loopRef.current = new Tone.Loop(time => {
                            let step = stepCounter % TOTAL_STEPS;
                            const bar = Math.floor(step / BAR_STEPS);
                            const sInBar = step % BAR_STEPS;

                            setCurrentStep(sInBar);
                            setCurrentBar(bar);
                            if (liveRecordMode) {
                                setRecordStepIndex(step);
                            }

                            if (sInBar % 2 === 0) setFlashColor("border-orange-600");

                            const syns = synthsRef.current;
                            if (!syns) return;

                            Object.keys(instrumentSteps).forEach(instKey => {
                                const val = instrumentSteps[instKey][step];
                                if (!val) return;

                                if (instKey === "drums") {
                                    if (typeof val === "object") {
                                        Object.keys(val).forEach(partKey => {
                                            if (val[partKey] && syns.drums[partKey]) syns.drums[partKey].triggerAttackRelease("C1", "8n", time);
                                        });
                                    }
                                } else if (instKey === "subBass") {
                                    if (typeof val === "object") {
                                        Object.keys(val).forEach(partKey => {
                                            if (val[partKey] && syns.subBass[partKey]) syns.subBass[partKey].triggerAttackRelease("C1", "8n", time);
                                        });
                                    }
                                } else if (instKey === "rapVocals") {
                                    if (typeof val === "object") {
                                        Object.keys(val).forEach(partKey => {
                                            if (val[partKey] && syns.rapVocals[partKey]) syns.rapVocals[partKey].triggerAttackRelease("C2", "16n", time);
                                        });
                                    }
                                } else if (["trumpet", "synth", "violin", "piano", "guitar"].includes(instKey)) {
                                    const noteToPlay = typeof val === "string" ? val : "C3";
                                    if (syns[instKey]) syns[instKey].triggerAttackRelease(noteToPlay, "8n", time);
                                }
                            });

                            stepCounter++;
                        }, "16n").start(0);

                        Tone.Transport.start();
                    } else {
                        Tone.Transport.stop();
                    }
                }, [playing, bpm, instrumentSteps, liveRecordMode]);

                const togglePlay = async () => {
                    await Tone.start();
                    setPlaying(!playing);
                    setStatus(playing ? "⏸️ 停止しました" : `▶ 再生中 (BPM: ${bpm})`);
                };

                // 各ジャンルパーツ手押し試聴 ＆ ライブ記録
                const playGenrePartLive = (partObj) => {
                    setSelectedMelodyPart(partObj.id);
                    const syns = synthsRef.current;
                    if (!syns || !syns[selectedInstrument]) return;

                    syns[selectedInstrument].triggerAttackRelease(partObj.note, "8n");

                    if (liveRecordMode) {
                        setInstrumentSteps(prev => {
                            const currentArr = [...prev[selectedInstrument]];
                            currentArr[recordStepIndex] = partObj.note;
                            return { ...prev, [selectedInstrument]: currentArr };
                        });
                        setStatus(`🔴 ライブ手押し記録: ステップ ${recordStepIndex + 1} に [${partObj.label}] を記録！`);
                    }
                };

                const toggleStep = (instKey, idx) => {
                    setInstrumentSteps(prev => {
                        const currentArr = [...prev[instKey]];
                        const currentParts = GENRE_MELODY_PARTS[selectedGenre] || GENRE_MELODY_PARTS.SOUL;
                        const targetNote = currentParts[0].note;

                        if (instKey === "drums") {
                            const currentObj = currentArr[idx] || {};
                            const updatedObj = { ...currentObj, [selectedDrumPart]: !currentObj[selectedDrumPart] };
                            currentArr[idx] = Object.values(updatedObj).some(Boolean) ? updatedObj : null;
                        } else if (instKey === "subBass") {
                            const currentObj = currentArr[idx] || {};
                            const updatedObj = { ...currentObj, [selectedBassPart]: !currentObj[selectedBassPart] };
                            currentArr[idx] = Object.values(updatedObj).some(Boolean) ? updatedObj : null;
                        } else if (instKey === "rapVocals") {
                            const currentObj = currentArr[idx] || {};
                            const updatedObj = { ...currentObj, [selectedRapPart]: !currentObj[selectedRapPart] };
                            currentArr[idx] = Object.values(updatedObj).some(Boolean) ? updatedObj : null;
                        } else {
                            currentArr[idx] = currentArr[idx] === targetNote ? null : targetNote;
                        }
                        return { ...prev, [instKey]: currentArr };
                    });
                };

                const clearSpecificInstrument = (instKey) => {
                    setInstrumentSteps(prev => ({ ...prev, [instKey]: new Array(TOTAL_STEPS).fill(null) }));
                    setStatus(`🗑️ 【${instKey}】をクリアしました`);
                };

                const clearAllSteps = () => {
                    const emptyMap = {};
                    Object.keys(instrumentSteps).forEach(k => { emptyMap[k] = new Array(TOTAL_STEPS).fill(null); });
                    setInstrumentSteps(emptyMap);
                    setStatus("🧹 すべてクリアしました");
                };

                // 各ジャンルAI自動生成
                const generateAIForInstrument = (targetInst) => {
                    const newSteps = JSON.parse(JSON.stringify(instrumentSteps));
                    const arr = new Array(TOTAL_STEPS).fill(null);
                    const currentParts = GENRE_MELODY_PARTS[selectedGenre] || GENRE_MELODY_PARTS.SOUL;

                    for (let s = 0; s < TOTAL_STEPS; s++) {
                        const sInBar = s % BAR_STEPS;
                        if (targetInst === "subBass") {
                            if (sInBar % 4 === 0 || sInBar === 6 || sInBar === 10 || sInBar === 14) {
                                arr[s] = { [selectedBassPart]: true };
                            }
                        } else if (targetInst === "drums") {
                            arr[s] = {
                                kick: sInBar % 4 === 0,
                                snare: sInBar === 4 || sInBar === 12,
                                hihat: true
                            };
                        } else if (targetInst === "rapVocals") {
                            if (sInBar % 2 === 0 || sInBar === 15) {
                                arr[s] = { [selectedRapPart]: true };
                            }
                        } else if (["trumpet", "synth", "violin", "piano", "guitar"].includes(targetInst)) {
                            if (sInBar % 2 === 0 || sInBar === 3 || sInBar === 7 || sInBar === 11) {
                                const partItem = currentParts[(s / 2) % currentParts.length];
                                arr[s] = partItem.note;
                            }
                        }
                    }

                    newSteps[targetInst] = arr;
                    setInstrumentSteps(newSteps);
                    setStatus(`🤖 ✨ 【${selectedGenre}】ジャンルAIで 【${targetInst}】 のメロディ＆ループを生成しました！`);
                };

                const generateAllAI = () => {
                    Object.keys(instrumentSteps).forEach(inst => generateAIForInstrument(inst));
                    setStatus(`🌟 【${selectedGenre}】ジャンル全パート一括AI生成完了！`);
                };

                const saveCurrentSession = () => {
                    setSavedSlots({ ...savedSlots, [slotName]: JSON.parse(JSON.stringify(instrumentSteps)) });
                    setStatus(`💾 セッション「${slotName}」を保存しました！`);
                };

                const loadSession = (name) => {
                    if (savedSlots[name]) {
                        setInstrumentSteps(JSON.parse(JSON.stringify(savedSlots[name])));
                        setStatus(`📂 セッション「${name}」をロードしました！`);
                    }
                };

                const currentInstObj = INSTRUMENTS.find(i => i.id === selectedInstrument);
                const activeMelodyParts = GENRE_MELODY_PARTS[selectedGenre] || GENRE_MELODY_PARTS.SOUL;

                return (
                    <div className={`min-h-screen bg-slate-950 text-slate-100 flex flex-col text-xs font-sans select-none border-8 transition-all duration-75 ${flashColor}`}>
                        <header className="bg-slate-900 border-b border-slate-800 px-3 py-2 flex items-center justify-between gap-2 sticky top-0 z-50 shadow-lg">
                            <span className="font-black text-sm bg-gradient-to-r from-amber-500 via-orange-400 to-red-500 bg-clip-text text-transparent">
                                MIC VICTORY <span className="text-[10px] text-orange-400 font-normal">v39.0 GENRE MELODY & 20 LOOPS</span>
                            </span>

                            <div className="flex items-center gap-1.5 flex-wrap">
                                <button onClick={togglePlay} className={`px-3 py-1 rounded font-bold text-xs shadow ${playing ? "bg-amber-600 text-white animate-bounce" : "bg-orange-700 text-white"}`}>
                                    {playing ? "■ 停止" : "▶ 再生"}
                                </button>
                                <button onClick={clearAllSteps} className="px-2.5 py-1 bg-red-950 hover:bg-red-900 text-red-300 rounded font-bold text-xs border border-red-800">
                                    🧹 クリア
                                </button>
                                <div className="flex items-center gap-1 bg-slate-950 px-2 py-0.5 rounded border border-slate-800">
                                    <span className="text-[9px] text-slate-400">BPM</span>
                                    <input type="number" value={bpm} onChange={e => setBpm(Math.max(40, Math.min(220, Number(e.target.value))))} className="w-12 bg-slate-900 text-center font-bold text-orange-500 rounded text-xs py-0.5" />
                                </div>
                            </div>
                        </header>

                        <nav className="bg-slate-900/90 border-b border-slate-800 px-2 py-1.5 flex gap-1 overflow-x-auto">
                            {[
                                { id: "GENRE_EDIT", label: "🎵 ジャンル別20種パーツ＆ループ" },
                                { id: "MEMORY_LIST", label: "💾 セッション保存" },
                            ].map(t => (
                                <button key={t.id} onClick={() => setTab(t.id)} className={`px-3 py-1 rounded text-center font-bold transition-all shrink-0 ${tab === t.id ? "bg-orange-600 text-white shadow" : "bg-slate-800/60 text-slate-400"}`}>
                                    {t.label}
                                </button>
                            ))}
                        </nav>

                        <div className="bg-slate-900/80 border-b border-slate-800 px-3 py-1 flex items-center justify-between flex-wrap gap-1">
                            <span className="text-[11px] text-orange-400">💡 {status}</span>
                            <div className="flex gap-1">
                                <button onClick={generateAllAI} className="px-3 py-1 bg-orange-700 hover:bg-orange-600 text-white font-bold rounded text-[10px] shadow">
                                    🌟 ジャンルAI一括自動生成
                                </button>
                            </div>
                        </div>

                        <main className="p-2 flex flex-col gap-3">
                            {tab === "GENRE_EDIT" && (
                                <div className="flex flex-col gap-3">
                                    {/* 楽器選択 */}
                                    <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3 shadow">
                                        <div className="flex justify-between items-center flex-wrap gap-2">
                                            <span className="text-xs font-bold text-orange-400">① 楽器セレクト</span>
                                            <button onClick={() => clearSpecificInstrument(selectedInstrument)} className="px-2 py-0.5 bg-red-950 text-red-300 rounded text-[10px] border border-red-800">
                                                🗑️ 現在の楽器をクリア
                                            </button>
                                        </div>
                                        <div className="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-8 gap-1.5">
                                            {INSTRUMENTS.map(inst => (
                                                <button key={inst.id} onClick={() => setSelectedInstrument(inst.id)} className={`py-2 px-1 rounded-lg font-bold text-[10px] transition-all border flex items-center justify-center gap-1 shadow ${selectedInstrument === inst.id ? `bg-gradient-to-r ${inst.color} border-white text-white ring-2 ring-white/30` : "bg-slate-950 border-slate-800 text-slate-400"}`}>
                                                    {inst.label}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* ジャンル選択 */}
                                    <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-2 shadow">
                                        <span className="text-xs font-bold text-amber-400">② ジャンル切り替え (Soul / Pop / Popping / Ballad / Rock / Dance)</span>
                                        <div className="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-7 gap-1.5">
                                            {[
                                                { id: "SOUL", label: "🎷 SOUL" },
                                                { id: "POP", label: "🌟 POP" },
                                                { id: "POPPING", label: "⚡ POPPING" },
                                                { id: "BALLAD", label: "🎹 BALLAD" },
                                                { id: "ROCK", label: "🎸 ROCK" },
                                                { id: "DANCE_POPS", label: "💃 DANCE POPS" },
                                                { id: "EDM_DANCE", label: "🔥 EDM DANCE" },
                                            ].map(g => (
                                                <button key={g.id} onClick={() => setSelectedGenre(g.id)} className={`py-2 px-2 rounded font-bold text-[10px] border transition-all ${selectedGenre === g.id ? "bg-orange-600 text-white border-white shadow" : "bg-slate-950 text-slate-400 border-slate-800"}`}>
                                                    {g.label}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* ジャンル別メロディパーツ選択 ＆ リアルタイム手押し記録スイッチ */}
                                    {["trumpet", "synth", "violin", "piano", "guitar"].includes(selectedInstrument) && (
                                        <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-2 shadow">
                                            <div className="flex justify-between items-center flex-wrap gap-2">
                                                <span className="text-xs font-bold text-emerald-400">③ {selectedGenre} メロディパーツ (手押し試聴 ＆ リアルタイム記録)</span>
                                                <button onClick={() => setLiveRecordMode(!liveRecordMode)} className={`px-3 py-1 rounded font-bold text-xs border transition-all ${liveRecordMode ? "bg-red-600 text-white border-white animate-pulse" : "bg-slate-800 text-slate-400 border-slate-700"}`}>
                                                    {liveRecordMode ? "🔴 手押しリアルタイム記録: ON" : "⚪ 手押しリアルタイム記録: OFF"}
                                                </button>
                                            </div>
                                            <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 bg-slate-950 p-2 rounded border border-slate-800">
                                                {activeMelodyParts.map(part => (
                                                    <button key={part.id} onClick={() => playGenrePartLive(part)} className={`py-3 px-2 rounded font-bold text-[10px] flex flex-col items-center justify-center transition-all border ${selectedMelodyPart === part.id ? "bg-cyan-600 text-white border-white shadow" : "bg-slate-900 text-slate-300 border-slate-800 hover:bg-slate-800"}`}>
                                                        <span className="font-bold text-center">{part.label}</span>
                                                        <span className="text-[8px] text-amber-300 mt-1">ノート: {part.note}</span>
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    {/* 20種ループパーツ一覧セレクター */}
                                    <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-2 shadow">
                                        <span className="text-xs font-bold text-rose-400">④ ループパーツ20種 (その場ボタン選択)</span>
                                        <div className="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-5 gap-1.5 max-h-[140px] overflow-y-auto p-1 bg-slate-950 rounded border border-slate-800">
                                            {LOOP_PARTS.map(loop => (
                                                <button key={loop.id} onClick={() => setSelectedLoopPart(loop.id)} className={`px-2 py-1.5 rounded font-bold text-[10px] text-left transition-all border ${selectedLoopPart === loop.id ? "bg-rose-600 text-white border-white shadow" : "bg-slate-900 text-slate-300 border-slate-800 hover:bg-slate-800"}`}>
                                                    {loop.label}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* グリッドシーケンサー */}
                                    <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3 shadow">
                                        <div className="flex justify-between items-center">
                                            <span className="text-xs font-bold text-cyan-400">⑤ グリッド編集 ({currentInstObj.label}) - 小節: {currentBar + 1} / 8</span>
                                            <div className="flex gap-1">
                                                {Array.from({ length: BARS }).map((_, b) => (
                                                    <button key={b} onClick={() => setCurrentBar(b)} className={`w-7 h-7 rounded-full text-xs font-bold ${currentBar === b ? "bg-orange-600 text-white" : "bg-slate-800 text-slate-400"}`}>{b + 1}</button>
                                                ))}
                                            </div>
                                        </div>

                                        <div className="flex flex-col gap-2 bg-slate-950 p-3 rounded border border-slate-800">
                                            <div className="overflow-x-auto py-1">
                                                <div className="grid gap-1 min-w-[540px]" style={{ gridTemplateColumns: "repeat(16, minmax(0, 1fr))" }}>
                                                    {Array.from({ length: BAR_STEPS }).map((_, i) => {
                                                        const stepIdx = currentBar * BAR_STEPS + i;
                                                        const stepVal = instrumentSteps[selectedInstrument][stepIdx];
                                                        const isCurrentPlay = playing && currentStep === i;
                                                        
                                                        let isActive = false;
                                                        if (selectedInstrument === "subBass") {
                                                            isActive = stepVal && stepVal[selectedBassPart];
                                                        } else if (selectedInstrument === "drums") {
                                                            isActive = stepVal && stepVal[selectedDrumPart];
                                                        } else if (selectedInstrument === "rapVocals") {
                                                            isActive = stepVal && stepVal[selectedRapPart];
                                                        } else {
                                                            isActive = !!stepVal;
                                                        }

                                                        return (
                                                            <button key={i} onClick={() => toggleStep(selectedInstrument, stepIdx)} className={`aspect-[3/4] w-full rounded border flex flex-col items-center justify-center text-[9px] transition-all ${isActive ? "bg-gradient-to-t from-orange-700 to-amber-600 border-white text-white font-bold shadow-md shadow-orange-900/50 scale-105" : "bg-slate-900 border-slate-800 text-slate-500"} ${isCurrentPlay ? "ring-2 ring-cyan-400" : ""}`}>
                                                                <span className="font-bold text-[10px]">{i + 1}</span>
                                                                {stepVal && ["trumpet", "synth", "violin", "piano", "guitar"].includes(selectedInstrument) && (
                                                                    <span className="text-[7px] text-amber-300">♪</span>
                                                                )}
                                                            </button>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {tab === "MEMORY_LIST" && (
                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3">
                                    <span className="text-xs font-bold text-emerald-400">💾 セッション保存・ロード</span>
                                    <div className="flex gap-2 bg-slate-950 p-3 rounded border border-slate-800">
                                        <input type="text" value={slotName} onChange={e => setSlotName(e.target.value)} className="bg-slate-900 px-2 py-1 rounded text-slate-100 flex-1 border border-slate-800" />
                                        <button onClick={saveCurrentSession} className="px-4 py-1 bg-emerald-600 text-white font-bold rounded">保存</button>
                                    </div>
                                    <div className="flex flex-col gap-2 bg-slate-950 p-3 rounded border border-slate-800 max-h-[200px] overflow-y-auto">
                                        {Object.keys(savedSlots).length === 0 && (
                                            <span className="text-[11px] text-slate-500 text-center py-2">保存されたセッションはありません</span>
                                        )}
                                        {Object.keys(savedSlots).map(name => (
                                            <div key={name} className="flex justify-between items-center bg-slate-900 p-2 rounded border border-slate-800">
                                                <span className="font-bold text-orange-400 text-xs">{name}</span>
                                                <button onClick={() => loadSession(name)} className="px-2 py-1 bg-orange-600 text-white rounded text-[10px] font-bold">ロード</button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </main>
                    </div>
                );
            }

            const rootElement = document.getElementById('root');
            if (rootElement) {
                ReactDOM.createRoot(rootElement).render(<MasterSynthApp />);
            }
        } catch (err) {
            document.getElementById('root').innerHTML = `
                <div class="p-6 text-red-400 font-bold">
                    <h2 class="text-lg mb-2">⚠️ 起動エラー</h2>
                    <p class="text-xs text-slate-300">${err.message}</p>
                </div>
            `;
        }
    </script>
</body>
</html>
