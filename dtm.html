<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RHYTHM FORGE - PRO DAW</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tone.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body class="bg-slate-950 text-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        // ここにReactアプリのメインコンポーネントコードを配置
        function RhythmForgeApp() {
            // ステートや音源の初期化処理
            const [status, setStatus] = React.useState("Rhythm Forgeへようこそ！");
            const [playing, setPlaying] = React.useState(false);
            const [bpm, setBpm] = React.useState(120);
            const [tab, setTab] = React.useState("DRUM");

            return (
                <div className="min-h-screen p-6 max-w-7xl mx-auto">
                    <header className="flex justify-between items-center mb-6 border-b border-slate-800 pb-4">
                        <h1 className="text-2xl font-black bg-gradient-to-r from-cyan-400 to-fuchsia-400 bg-clip-text text-transparent">
                            RHYTHM FORGE PRO DAW
                        </h1>
                        <div className="text-xs text-slate-400 font-mono">{status}</div>
                    </header>
                    <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 text-center">
                        <p className="text-sm text-slate-300 mb-4">Reactコンポーネントのコードをここに統合してご利用ください。</p>
                        <button 
                            onClick={() => { Tone.start(); setStatus("AudioContext 起動完了！"); }}
                            className="px-4 py-2 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold rounded-lg text-sm shadow"
                        >
                            オーディオエンジンを有効化
                        </button>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<RhythmForgeApp />, document.getElementById("root"));
    </script>
</body>
</html>
