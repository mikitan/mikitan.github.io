<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MIC VICTORY v50.0 ULTIMATE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans select-none pb-32">
    <div id="root"></div>

    <script type="text/babel">
        function MasterSynthApp() {
            const [tab, setTab] = React.useState("SWITCH");
            const [playing, setPlaying] = React.useState(false);
            const [flashColor, setFlashColor] = React.useState("border-yellow-500");
            const [bpm, setBpm] = React.useState(110);
            const [currentBar, setCurrentBar] = React.useState(0);
            const [totalBars, setTotalBars] = React.useState(18);
            const [status, setStatus] = React.useState("✨ v50.0 ステレオ空間＆全機能完全融合");

            const BAR_STEPS = 16;
            const getMaxSteps = () => totalBars * BAR_STEPS;

            const [selectedInst, setSelectedInst] = React.useState("subBass");
            const [selectedNote, setSelectedNote] = React.useState("C2");
            const [audioLevel, setAudioLevel] = React.useState(10);
            const [visualPattern, setVisualPattern] = React.useState(1);

            const [volumes, setVolumes] = React.useState({
                subBass: 0, bass: 0, drums20: 0, violin: 0,
                guitar: 0, piano: 0, robot: 0, djembe: 0, synth: 0, fx: 0
            });

            const METAL_FLASHES = [
                "border-yellow-400", "border-slate-300", "border-amber-500", 
                "border-zinc-400", "border-yellow-200", "border-slate-100", "border-rose-500", "border-cyan-400"
            ];

            const [modes, setModes] = React.useState({
                subBass: "ai", bass: "ai", drums20: "ai", violin: "ai",
                guitar: "ai", piano: "ai", robot: "manual", djembe: "ai", synth: "ai", fx: "manual"
            });

            const [steps, setSteps] = React.useState({
                subBass: new Array(18 * BAR_STEPS).fill(null),
                bass: new Array(18 * BAR_STEPS).fill(null),
                drums20: new Array(18 * BAR_STEPS).fill(null),
                violin: new Array(18 * BAR_STEPS).fill(null),
                guitar: new Array(18 * BAR_STEPS).fill(null),
                piano: new Array(18 * BAR_STEPS).fill(null),
                robot: new Array(18 * BAR_STEPS).fill(null),
                djembe: new Array(18 * BAR_STEPS).fill(null),
                synth: new Array(18 * BAR_STEPS).fill(null),
                fx: new Array(18 * BAR_STEPS).fill(null),
            });

            const [recordings, setRecordings] = React.useState([]);
            const [isRecordingLive, setIsRecordingLive] = React.useState(false);
            const liveAudioChunks = React.useRef([]);
            const mediaRecorderRef = React.useRef(null);
            const analyserRef = React.useRef(null);
            const channelVolumesRef = React.useRef({});

            const DRUM_PARTS = [
                { id: "kick1", label: "キック1" }, { id: "kick2", label: "キック2" },
                { id: "snare1", label: "スネア1" }, { id: "snare2", label: "スネア2" },
                { id: "clap", label: "クラップ" }, { id: "hihatClosed", label: "HH閉" },
                { id: "hihatOpen", label: "HH開" }, { id: "tomHigh", label: "Hタム" },
                { id: "tomMid", label: "Mタム" }, { id: "tomLow", label: "Lタム" },
                { id: "rimshot", label: "リム" }, { id: "cowbell", label: "カウベル" },
                { id: "shaker", label: "シェイカー" }, { id: "tambourine", label: "タンバリン" },
                { id: "crash", label: "クラッシュ" }, { id: "ride", label: "ライド" }
            ];
            const [selectedDrumPart, setSelectedDrumPart] = React.useState("kick1");

            const INSTRUMENTS = [
                { id: "subBass", label: "🔊 超重低音サブベース" }, { id: "bass", label: "🎸 重低音ベース" },
                { id: "drums20", label: "🥁 ステレオドラム20音" }, { id: "violin", label: "🎻 バイオリン" },
                { id: "guitar", label: "🎸 ギター（低/高音）" }, { id: "piano", label: "🎹 ピアノ" },
                { id: "robot", label: "🤖 電子音ロボット" }, { id: "djembe", label: "🪘 アフリカ太鼓AI" },
                { id: "synth", label: "🎹 シンセサイザー" }, { id: "fx", label: "✨ FX効果音" },
            ];

            const synthsRef = React.useRef(null);
            const loopRef = React.useRef(null);
            const destinationRef = React.useRef(null);

            React.useEffect(() => {
                try {
                    const dest = Tone.context.createMediaStreamDestination();
                    destinationRef.current = dest;

                    const masterGain = new Tone.Gain(2.0).toDestination();
                    masterGain.connect(dest);

                    const analyser = new Tone.Analyser("waveform", 64);
                    masterGain.connect(analyser);
                    analyserRef.current = analyser;

                    const dist = new Tone.Distortion({ distortion: 0.4, wet: 0.3 });
                    const rev = new Tone.Reverb({ decay: 3.0, wet: 0.25 });
                    // ステレオ感を生み出すパンナー
                    const panner = new Tone.Panner(0);

                    const channels = {};
                    const syns = {};
                    const d20 = {};

                    INSTRUMENTS.forEach((inst, idx) => {
                        const channel = new Tone.Channel(0, 0).connect(masterGain);
                        channels[inst.id] = channel;

                        if (inst.id === "subBass" || inst.id === "bass") {
                            syns[inst.id] = new Tone.MonoSynth().connect(dist).connect(channel);
                        } else if (inst.id === "drums20") {
                            // ドラムをステレオ配置 (Panner使用)
                            const stereoPanner = new Tone.Panner((idx % 2 === 0 ? -0.4 : 0.4)).connect(channel);
                            d20.kick1 = new Tone.MembraneSynth().connect(dist).connect(stereoPanner);
                            d20.kick2 = new Tone.MembraneSynth().connect(dist).connect(stereoPanner);
                            d20.snare1 = new Tone.NoiseSynth().connect(rev).connect(stereoPanner);
                            d20.snare2 = new Tone.NoiseSynth().connect(rev).connect(stereoPanner);
                            d20.clap = new Tone.NoiseSynth().connect(rev).connect(stereoPanner);
                            d20.hihatClosed = new Tone.MetalSynth().connect(rev).connect(stereoPanner);
                            d20.hihatOpen = new Tone.MetalSynth().connect(rev).connect(stereoPanner);
                            syns.drums20 = d20;
                        } else if (inst.id === "djembe") {
                            // アフリカ楽器専用パーカッシブシンセ
                            syns[inst.id] = new Tone.MembraneSynth({
                                pitchDecay: 0.05,
                                octaves: 4,
                                oscillator: { type: "sine" }
                            }).connect(rev).connect(channel);
                        } else if (inst.id === "guitar" || inst.id === "robot") {
                            syns[inst.id] = new Tone.FMSynth().connect(dist).connect(channel);
                        } else {
                            syns[inst.id] = new Tone.Synth().connect(rev).connect(channel);
                        }
                    });

                    dist.connect(masterGain);
                    rev.connect(masterGain);

                    channelVolumesRef.current = channels;
                    synthsRef.current = syns;
                } catch(e) {}
                return () => { try { Tone.Transport.stop(); Tone.Transport.cancel(); } catch(e) {} };
            }, []);

            const handleVolumeChange = (instId, val) => {
                setVolumes(prev => ({ ...prev, [instId]: val }));
                const channel = channelVolumesRef.current[instId];
                if (channel) channel.volume.value = val;
            };

            const generateAiMelodyForInstrument = (instKey, maxS) => {
                const arr = new Array(maxS).fill(null);
                const highNotes = ["C3", "E3", "G3", "C4", "E4", "G4", "C5"];
                const lowNotes = ["C1", "G1", "C2", "E2"];
                const afroNotes = ["G2", "C3", "D3", "G3", "A3"]; // アフリカ楽器用リズムノート

                for (let s = 0; s < maxS; s++) {
                    const sInBar = s % BAR_STEPS;
                    if (instKey === "drums20") {
                        if (sInBar === 0 || sInBar === 8) arr[s] = { kick1: true };
                        if (sInBar === 4 || sInBar === 12) arr[s] = { snare1: true };
                        if (sInBar % 2 === 0) arr[s] = { ...(arr[s] || {}), hihatClosed: true };
                        if (sInBar % 3 === 0) arr[s] = { ...(arr[s] || {}), crash: true };
                    } else if (instKey === "djembe") {
                        // アフリカ楽器特有のポリリズムAI
                        if (sInBar % 3 === 0 || sInBar % 5 === 0) {
                            arr[s] = afroNotes[s % afroNotes.length];
                        }
                    } else if (instKey === "subBass" || instKey === "bass") {
                        if (sInBar % 4 === 0) arr[s] = lowNotes[s % lowNotes.length];
                    } else {
                        if (sInBar % 2 === 0 || sInBar % 3 === 0) {
                            arr[s] = highNotes[(s + Math.floor(s / BAR_STEPS)) % highNotes.length];
                        }
                    }
                }
                return arr;
            };

            const generateAllAi = () => {
                const maxS = getMaxSteps();
                const newSteps = { ...steps };
                Object.keys(newSteps).forEach(k => {
                    if (modes[k] === "ai") newSteps[k] = generateAiMelodyForInstrument(k, maxS);
                });
                setSteps(newSteps);
                setStatus("🚀 AIがステレオ＆リズムパターンを自動生成しました！");
            };

            // ランダムパターン生成機能
            const randomizePattern = (instKey) => {
                const maxS = getMaxSteps();
                const arr = new Array(maxS).fill(null);
                const notes = ["C1", "E1", "G1", "C2", "G2", "C3", "E3", "G3", "C4", "G4", "C5"];
                for (let s = 0; s < maxS; s++) {
                    if (Math.random() > 0.65) {
                        if (instKey === "drums20") {
                            arr[s] = { kick1: Math.random() > 0.5, snare1: Math.random() > 0.5, hihatClosed: true };
                        } else {
                            arr[s] = notes[Math.floor(Math.random() * notes.length)];
                        }
                    }
                }
                setSteps(prev => ({ ...prev, [instKey]: arr }));
                setStatus(`🎲 ${INSTRUMENTS.find(i => i.id === instKey)?.label} をランダム生成しました！`);
            };

            const addNew18Bars = () => {
                const newTotal = totalBars + 18;
                setTotalBars(newTotal);
                const newMax = newTotal * BAR_STEPS;
                setSteps(prev => {
                    const updated = {};
                    Object.keys(prev).forEach(k => {
                        const oldArr = prev[k];
                        const diff = newMax - oldArr.length;
                        updated[k] = [...oldArr, ...new Array(diff).fill(null)];
                    });
                    return updated;
                });
                setStatus(`➕ 新たに18小節を追加しました（計 ${newTotal} 小節）`);
            };

            const clearSingleInstrument = (instKey) => {
                setSteps(prev => ({ ...prev, [instKey]: new Array(getMaxSteps()).fill(null) }));
                setStatus(`🗑️ ${INSTRUMENTS.find(i => i.id === instKey)?.label} をクリアしました`);
            };

            const clearAllInstruments = () => {
                const emptySteps = {};
                Object.keys(steps).forEach(k => {
                    emptySteps[k] = new Array(getMaxSteps()).fill(null);
                });
                setSteps(emptySteps);
                setStatus("🗑️ 全データを完全クリアしました！");
            };

            const playScratch = async () => {
                try {
                    await Tone.start();
                    synthsRef.current?.drums20?.kick1?.triggerAttackRelease("C3", "16n");
                    setStatus("💿 スクラッチ発動！");
                } catch(e) {}
            };

            const toggleLiveRecording = () => {
                if (!isRecordingLive) {
                    try {
                        liveAudioChunks.current = [];
                        const recorder = new MediaRecorder(destinationRef.current.stream);
                        recorder.ondataavailable = e => { if (e.data.size > 0) liveAudioChunks.current.push(e.data); };
                        recorder.onstop = () => {
                            const blob = new Blob(liveAudioChunks.current, { type: 'audio/webm' });
                            const url = URL.createObjectURL(blob);
                            setRecordings(prev => [...prev, { id: Date.now(), url, title: `MIC VICTORY 録音 #${prev.length + 1}` }]);
                            setStatus("💾 全体録音を保存しました！");
                        };
                        recorder.start();
                        mediaRecorderRef.current = recorder;
                        setIsRecordingLive(true);
                        setStatus("🔴 全体録音中...");
                    } catch(e) {
                        setStatus("⚠️ 録音非対応ブラウザです");
                    }
                } else {
                    mediaRecorderRef.current?.stop();
                    setIsRecordingLive(false);
                }
            };

            React.useEffect(() => {
                Tone.Transport.bpm.value = bpm;
                Tone.Transport.cancel();
                if (playing) {
                    let stepCounter = 0;
                    const maxS = getMaxSteps();

                    loopRef.current = new Tone.Loop(time => {
                        let step = stepCounter % maxS;
                        setCurrentBar(Math.floor(step / BAR_STEPS) % totalBars);

                        if (step % 4 === 0) {
                            setFlashColor(METAL_FLASHES[Math.floor(Math.random() * METAL_FLASHES.length)]);
                        }

                        if (analyserRef.current) {
                            const val = analyserRef.current.getValue();
                            const rms = Math.sqrt(val.reduce((acc, v) => acc + v * v, 0) / val.length);
                            setAudioLevel(Math.min(100, Math.floor(rms * 400)));
                        }

                        const syns = synthsRef.current;
                        if (!syns) return;

                        Object.keys(modes).forEach(k => {
                            const val = steps[k][step];
                            if (val) {
                                if (k === "drums20") {
                                    Object.keys(val).forEach(pk => {
                                        if (val[pk] && syns.drums20[pk]) {
                                            syns.drums20[pk].triggerAttackRelease("8n", time);
                                        }
                                    });
                                } else if (syns[k]) {
                                    try { syns[k].triggerAttackRelease(typeof val === "string" ? val : "C2", "8n", time); } catch(e) {}
                                }
                            }
                        });
                        stepCounter++;
                    }, "16n").start(0);

                    Tone.Transport.start();
                } else {
                    Tone.Transport.stop();
                }
            }, [playing, bpm, steps, modes, totalBars]);

            const togglePlay = async () => {
                try { await Tone.start(); } catch(e) {}
                if (!playing) generateAllAi();
                setPlaying(!playing);
            };

            const toggleStep = (instKey, idx) => {
                setSteps(prev => {
                    const arr = [...prev[instKey]];
                    if (instKey === "drums20") {
                        const obj = arr[idx] || {};
                        const upd = { ...obj, [selectedDrumPart]: !obj[selectedDrumPart] };
                        arr[idx] = Object.values(upd).some(Boolean) ? upd : null;
                    } else {
                        arr[idx] = arr[idx] ? null : selectedNote;
                    }
                    return { ...prev, [instKey]: arr };
                });
            };

            return (
                <div className={`min-h-screen bg-slate-950 text-slate-100 text-xs font-sans select-none border-4 transition-all ${flashColor}`}>
                    
                    {/* ヘッダー：コンパクトボタン */}
                    <header className="bg-gradient-to-r from-slate-900 via-zinc-900 to-slate-900 border-b border-yellow-500/30 p-2 flex flex-wrap items-center justify-between gap-1.5 sticky top-0 z-50 shadow-lg">
                        <span className="font-black text-xs bg-gradient-to-r from-yellow-300 via-slate-200 to-yellow-500 bg-clip-text text-transparent">
                            MIC VICTORY <span className="text-[9px] text-yellow-400">v50.0</span>
                        </span>
                        <div className="flex items-center gap-1 flex-wrap">
                            <button onClick={togglePlay} className={`px-2.5 py-1 rounded-lg font-bold text-[11px] shadow ${playing ? "bg-yellow-400 text-slate-950 animate-bounce" : "bg-gradient-to-r from-yellow-600 to-amber-700 text-white"}`}>
                                {playing ? "■ 停止" : "▶ 再生"}
                            </button>
                            <button onClick={playScratch} className="px-2 py-1 bg-slate-300 text-slate-950 font-bold rounded-lg text-[11px]">スクラッチ</button>
                            <button onClick={toggleLiveRecording} className={`px-2 py-1 rounded-lg font-bold text-[11px] border ${isRecordingLive ? "bg-red-600 text-white border-white animate-pulse" : "bg-slate-800 text-slate-200 border-slate-600"}`}>
                                {isRecordingLive ? "🔴 録音" : "🎙️ 全体録音"}
                            </button>
                            <div className="flex items-center gap-1 bg-slate-900 px-1.5 py-0.5 rounded-lg border border-yellow-500/40">
                                <span className="text-[9px] text-yellow-400 font-bold">BPM</span>
                                <input type="number" value={bpm} onChange={e => setBpm(Number(e.target.value))} className="w-10 bg-transparent text-center font-bold text-yellow-400 text-[11px] focus:outline-none" />
                            </div>
                        </div>
                    </header>

                    {/* タブナビゲーション */}
                    <nav className="bg-slate-900/95 border-b border-slate-800 p-1.5 flex gap-1 overflow-x-auto">
                        {[
                            { id: "SWITCH", label: "🎛️ 楽器・AI" },
                            { id: "MIXER", label: "🎚️ 音響ミキサー" },
                            { id: "EDIT", label: "🎹 鍵盤・18小節" },
                            { id: "VISUAL", label: "🌈 6ビジュアル" },
                            { id: "REC", label: "💾 録音" },
                        ].map(t => (
                            <button key={t.id} onClick={() => setTab(t.id)} className={`px-2.5 py-1 rounded-lg text-center font-bold text-[11px] shrink-0 ${tab === t.id ? "bg-gradient-to-r from-yellow-500 to-amber-600 text-slate-950 shadow" : "bg-slate-800 text-slate-300"}`}>
                                {t.label}
                            </button>
                        ))}
                    </nav>

                    <div className="bg-slate-900 px-3 py-1.5 text-[11px] text-yellow-400 border-b border-slate-800 flex justify-between items-center">
                        <span className="truncate">💡 {status}</span>
                        <span className="text-slate-300 font-bold shrink-0 ml-2">小節: {currentBar + 1} / {totalBars}</span>
                    </div>

                    <main className="p-2.5 flex flex-col gap-2.5 max-w-4xl mx-auto">

                        {tab === "SWITCH" && (
                            <div className="bg-slate-900 border border-yellow-500/20 rounded-2xl p-3 flex flex-col gap-2.5 shadow-xl">
                                <div className="flex justify-between items-center flex-wrap gap-1.5">
                                    <span className="text-[11px] font-bold text-yellow-400">🎛️ 各楽器AI・ランダム切替 ＆ 全体クリア</span>
                                    <div className="flex gap-1.5">
                                        <button onClick={generateAllAi} className="px-2.5 py-1 bg-yellow-500 text-slate-950 rounded-lg font-bold text-[11px] shadow">AI一括生成</button>
                                        <button onClick={clearAllInstruments} className="px-2.5 py-1 bg-red-600 text-white rounded-lg font-bold text-[11px] shadow hover:bg-red-700">全体Clear</button>
                                    </div>
                                </div>
                                <div className="grid grid-cols-1 gap-1.5">
                                    {INSTRUMENTS.map(inst => {
                                        const isAi = modes[inst.id] === "ai";
                                        return (
                                            <div key={inst.id} className="bg-slate-950 px-2.5 py-2 rounded-xl border border-slate-800 flex items-center justify-between">
                                                <span className="text-[11px] font-bold text-white">{inst.label}</span>
                                                <div className="flex items-center gap-1.5">
                                                    <button onClick={() => randomizePattern(inst.id)} className="px-2 py-1 bg-cyan-700 text-white rounded-lg font-bold text-[10px]">ランダム</button>
                                                    <button onClick={() => {
                                                        const nextAi = !isAi;
                                                        setModes(p => ({ ...p, [inst.id]: nextAi ? "ai" : "manual" }));
                                                        if(nextAi) setSteps(p => ({ ...p, [inst.id]: generateAiMelodyForInstrument(inst.id, getMaxSteps()) }));
                                                    }} className={`px-3 py-1 rounded-lg font-bold text-[11px] ${isAi ? "bg-yellow-400 text-slate-950" : "bg-slate-800 text-slate-300"}`}>
                                                        {isAi ? "AI連打" : "手動"}
                                                    </button>
                                                    <button onClick={() => clearSingleInstrument(inst.id)} className="px-2 py-1 bg-red-950 text-red-300 rounded-lg font-bold text-[10px] border border-red-800">
                                                        Clear
                                                    </button>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {tab === "MIXER" && (
                            <div className="bg-slate-900 border border-yellow-500/20 rounded-2xl p-3 flex flex-col gap-2.5 shadow-xl">
                                <span className="text-[11px] font-bold text-yellow-400">🎚️ ステレオ音響 ＆ 各楽器ボリューム微調整</span>
                                <div className="grid grid-cols-1 gap-2">
                                    {INSTRUMENTS.map(inst => (
                                        <div key={inst.id} className="bg-slate-950 px-2.5 py-1.5 rounded-xl border border-slate-800 flex items-center justify-between gap-2">
                                            <span className="text-[11px] font-bold text-white w-32 truncate">{inst.label}</span>
                                            <div className="flex items-center gap-2 flex-1">
                                                <input 
                                                    type="range" 
                                                    min="-24" 
                                                    max="12" 
                                                    step="1" 
                                                    value={volumes[inst.id]} 
                                                    onChange={e => handleVolumeChange(inst.id, Number(e.target.value))} 
                                                    className="w-full accent-yellow-400 cursor-pointer" 
                                                />
                                                <span className="text-[9px] text-yellow-400 font-bold w-9 text-right">{volumes[inst.id]}dB</span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {tab === "EDIT" && (
                            <div className="flex flex-col gap-2.5">
                                <div className="bg-slate-900 border border-yellow-500/20 rounded-2xl p-3 flex flex-col gap-2.5 shadow-xl">
                                    <div className="flex justify-between items-center">
                                        <span className="text-[11px] font-bold text-yellow-400">🎹 楽器選択 ＆ 低音/高音鍵盤（手動・リピート）</span>
                                        <button onClick={addNew18Bars} className="px-2.5 py-1 bg-gradient-to-r from-yellow-500 to-amber-600 text-slate-950 font-bold rounded-lg text-[11px] shadow">
                                            + 18小節追加
                                        </button>
                                    </div>
                                    <div className="grid grid-cols-2 gap-1.5">
                                        {INSTRUMENTS.map(inst => (
                                            <button key={inst.id} onClick={() => setSelectedInst(inst.id)} className={`py-1.5 px-2 rounded-xl font-bold text-[11px] truncate border ${selectedInst === inst.id ? "bg-gradient-to-r from-yellow-500 to-amber-600 text-slate-950 border-white shadow" : "bg-slate-950 text-slate-300 border-slate-800"}`}>
                                                {inst.label}
                                            </button>
                                        ))}
                                    </div>

                                    {selectedInst === "drums20" && (
                                        <div className="grid grid-cols-4 gap-1.5 bg-slate-950 p-2 rounded-xl border border-slate-800 max-h-36 overflow-y-auto">
                                            {DRUM_PARTS.map(d => (
                                                <button key={d.id} onClick={() => setSelectedDrumPart(d.id)} className={`py-1.5 px-1 rounded-lg text-[10px] font-bold border truncate ${selectedDrumPart === d.id ? "bg-rose-600 text-white border-white" : "bg-slate-900 text-slate-300 border-slate-800"}`}>
                                                    {d.label}
                                                </button>
                                            ))}
                                        </div>
                                    )}

                                    {selectedInst !== "drums20" && (
                                        <div className="flex flex-wrap gap-1 bg-slate-950 p-2 rounded-xl border border-slate-800">
                                            {["C1","E1","G1","C2","E2","G2","C3","E3","G3","C4","E4","G4","C5"].map(n => (
                                                <button key={n} onClick={async () => {
                                                    setSelectedNote(n);
                                                    try {
                                                        await Tone.start();
                                                        synthsRef.current?.[selectedInst]?.triggerAttackRelease(n, "8n");
                                                    } catch(e){}
                                                }} className={`px-2.5 py-1.5 rounded-lg text-[11px] font-bold border ${selectedNote === n ? "bg-yellow-400 text-slate-950 border-white" : "bg-slate-900 text-slate-300 border-slate-800"}`}>
                                                    {n}
                                                </button>
                                            ))}
                                        </div>
                                    )}
                                </div>

                                <div className="bg-slate-900 border border-yellow-500/20 rounded-2xl p-3 flex flex-col gap-2.5 shadow-xl">
                                    <div className="flex items-center justify-between">
                                        <span className="text-[11px] font-bold text-yellow-400">小節ナビゲーション（全 {totalBars} 小節）</span>
                                    </div>
                                    <div className="flex gap-1 overflow-x-auto p-1 bg-slate-950 rounded-xl border border-slate-800">
                                        {Array.from({ length: totalBars }).map((_, b) => (
                                            <button key={b} onClick={() => setCurrentBar(b)} className={`px-2.5 py-1 rounded-lg text-[11px] font-bold shrink-0 ${currentBar === b ? "bg-yellow-400 text-slate-950" : "bg-slate-800 text-slate-300"}`}>
                                                {b + 1}
                                            </button>
                                        ))}
                                    </div>

                                    <div className="grid grid-cols-4 gap-1.5 bg-slate-950 p-2.5 rounded-2xl border border-slate-800">
                                        {Array.from({ length: BAR_STEPS }).map((_, i) => {
                                            const idx = currentBar * BAR_STEPS + i;
                                            const val = steps[selectedInst][idx];
                                            const active = selectedInst === "drums20" ? !!(val && val[selectedDrumPart]) : !!val;
                                            return (
                                                <button key={i} onClick={() => toggleStep(selectedInst, idx)} className={`h-14 rounded-xl border flex flex-col items-center justify-center text-xs font-bold shadow transition-all ${active ? "bg-yellow-400 border-white text-slate-950 scale-105" : "bg-slate-900 border-slate-800 text-slate-400"}`}>
                                                    <span>{i + 1}</span>
                                                    {active && <span className="text-[9px] font-black text-slate-950 bg-yellow-200 px-1 rounded mt-0.5">{typeof val === "string" ? val : "REC"}</span>}
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        )}

                        {tab === "VISUAL" && (
                            <div className="bg-slate-900 border border-yellow-500/20 rounded-2xl p-3 flex flex-col gap-2.5 shadow-xl">
                                <div className="flex justify-between items-center flex-wrap gap-1.5">
                                    <span className="text-[11px] font-bold text-yellow-400">🌈 ビジュアルライザー（6パターン切替）</span>
                                    <div className="flex gap-1 overflow-x-auto">
                                        {[1, 2, 3, 4, 5, 6].map(p => (
                                            <button key={p} onClick={() => setVisualPattern(p)} className={`px-2.5 py-1 rounded-lg text-[11px] font-bold ${visualPattern === p ? "bg-yellow-400 text-slate-950" : "bg-slate-800 text-slate-300"}`}>
                                                P{p}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div className="bg-slate-950 h-56 rounded-2xl border border-slate-800 flex items-center justify-center relative overflow-hidden p-3">
                                    {visualPattern === 1 && (
                                        <div style={{transform: `scale(${1 + audioLevel/30})`}} className="w-32 h-32 rounded-full bg-gradient-to-r from-yellow-400 via-amber-500 to-rose-500 flex flex-col items-center justify-center font-black text-slate-950 text-sm shadow-2xl transition-all duration-75">
                                            <span>MIC VICTORY</span>
                                            <span className="text-[10px]">{audioLevel}%</span>
                                        </div>
                                    )}
                                    {visualPattern === 2 && (
                                        <div className="flex items-center gap-2">
                                            {Array.from({ length: 8 }).map((_, i) => (
                                                <div key={i} style={{height: `${Math.max(15, (audioLevel * (i + 1)) % 160)}px`}} className="w-5 bg-gradient-to-t from-yellow-500 to-cyan-400 rounded-t-lg transition-all duration-75"></div>
                                            ))}
                                        </div>
                                    )}
                                    {visualPattern === 3 && (
                                        <div style={{transform: `rotate(${audioLevel * 3.6}deg) scale(${1 + audioLevel/50})`}} className="w-36 h-36 border-4 border-dashed border-yellow-400 rounded-3xl flex items-center justify-center font-bold text-yellow-300 shadow-xl transition-all duration-75">
                                            ★ MATRIX ★
                                        </div>
                                    )}
                                    {visualPattern === 4 && (
                                        <div style={{opacity: Math.max(0.3, audioLevel/50)}} className="text-center font-black text-2xl bg-gradient-to-r from-pink-500 via-yellow-400 to-cyan-400 bg-clip-text text-transparent animate-pulse">
                                            🚀 CYBER BEAT 🚀
                                        </div>
                                    )}
                                    {visualPattern === 5 && (
                                        <div className="flex gap-3 items-center">
                                            {Array.from({ length: 5 }).map((_, i) => (
                                                <div key={i} style={{width: `${15 + (audioLevel * i) % 50}px`, height: `${15 + (audioLevel * i) % 50}px`}} className="rounded-full border-2 border-yellow-400 animate-ping absolute"></div>
                                            ))}
                                            <span className="font-bold text-yellow-400 text-sm z-10">PULSE: {audioLevel}</span>
                                        </div>
                                    )}
                                    {visualPattern === 6 && (
                                        <div style={{transform: `scale(${1 + audioLevel/40})`}} className="w-40 h-20 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 rounded-2xl flex items-center justify-center font-black text-white text-base shadow-2xl transition-all duration-75">
                                            ✨ VICTORY ✨
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {tab === "REC" && (
                            <div className="bg-slate-900 border border-yellow-500/20 rounded-2xl p-3 flex flex-col gap-2.5 shadow-xl">
                                <span className="text-[11px] font-bold text-yellow-400">💾 録音セッション・保存リスト</span>
                                <div className="bg-slate-950 p-2.5 rounded-2xl border border-slate-800 flex flex-col gap-2 min-h-[140px]">
                                    {recordings.length === 0 ? (
                                        <span className="text-[11px] text-slate-500 text-center py-6">「全体録音」ボタンから演奏を録音するとここにリスト保存・DLできます。</span>
                                    ) : (
                                        recordings.map((rec) => (
                                            <div key={rec.id} className="bg-slate-900 p-2.5 rounded-xl border border-slate-800 flex items-center justify-between">
                                                <span className="text-[11px] font-bold text-slate-200">{rec.title}</span>
                                                <div className="flex items-center gap-1.5">
                                                    <audio src={rec.url} controls className="h-7 w-36"></audio>
                                                    <a href={rec.url} download={`${rec.title}.webm`} className="px-2.5 py-1 bg-yellow-500 text-slate-950 rounded-lg text-[10px] font-bold">DL</a>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        )}

                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<MasterSynthApp/>);
    </script>
</body>
</html>
