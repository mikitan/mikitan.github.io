<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>RHYTHM FORGE - ULTIMATE STUDIO</title>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Tone.js -->
    <script src="https://unpkg.com/tone@14.7.77/build/Tone.js"></script>
    <!-- Babel for JSX -->
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; background: #05070a; color: #f0f0f5; font-family: sans-serif; }
        #root { min-height: 100vh; padding: 12px; box-sizing: border-box; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        const BAR_STEPS = 16;
        const BARS = 18;
        const TOTAL_STEPS = BAR_STEPS * BARS;

        // ドラム＆パーカッション（アフリカ楽器や太鼓を含む）
        const PERC_ROWS = [
            { key: "kick", label: "🥁 KICK" },
            { key: "snare", label: "🎯 SNARE" },
            { key: "djembe", label: "🪵 DJEMBE" },
            { key: "conga", label: "🪘 CONGA" },
            { key: "shaker", label: "🪇 SHAKER" },
        ];

        const MELODY_INSTRUMENTS = [
            { key: "synth", label: "🎹 シンセ" },
            { key: "guitar", label: "🎸 ギター風" },
            { key: "violin", label: "🎻 バイオリン風" },
        ];

        const SCALE_NOTES = ["C4", "D4", "Eb4", "F4", "G4", "Ab4", "Bb4", "C5"];

        function emptyNoteRow() {
            return new Array(TOTAL_STEPS).fill(null);
        }

        function buildDefaultPattern(genre = "afro") {
            const steps = {};
            PERC_ROWS.forEach(r => {
                steps[r.key] = new Array(TOTAL_STEPS).fill(0);
            });
            for (let i = 0; i < TOTAL_STEPS; i++) {
                if (genre === "afro") {
                    if (i % 16 === 0 || i % 16 === 10) steps.kick[i] = 1;
                    if (i % 8 === 4) steps.snare[i] = 1;
                    if (i % 4 === 2) steps.djembe[i] = 1;
                    if (i % 2 === 0) steps.conga[i] = 1;
                    if (i % 4 === 0) steps.shaker[i] = 1;
                } else if (genre === "hiphop") {
                    if (i % 16 === 0 || i % 16 === 10) steps.kick[i] = 1;
                    if (i % 16 === 8) steps.snare[i] = 1;
                    if (i % 2 === 0) steps.shaker[i] = 1;
                } else if (genre === "disco") {
                    if (i % 4 === 0) steps.kick[i] = 1;
                    if (i % 8 === 4) steps.snare[i] = 1;
                    if (i % 2 === 0) steps.shaker[i] = 1;
                }
            }
            return steps;
        }

        function App() {
            const [playing, setPlaying] = useState(false);
            const [bpm, setBpm] = useState(105);
            const [genre, setGenre] = useState("afro");
            const [currentStep, setCurrentStep] = useState(-1);
            const [currentBar, setCurrentBar] = useState(0);
            const [status, setStatus] = useState("準備完了");
            const [tab, setTab] = useState("PERC");

            // メロディ関連
            const [selectedInst, setSelectedInst] = useState("synth");
            const [melodySteps, setMelodySteps] = useState(emptyNoteRow);
            const [selectedNote, setSelectedNote] = useState("C4");

            // 録音・再生・歌詞
            const [recording, setRecording] = useState(false);
            const [recordList, setRecordList] = useState([]);
            const [lyrics, setLyrics] = useState("【1-2小節】Yo! アフロビートに乗せて\n【3-4小節】AIと刻むエンドレスリズム");

            // DJ FX / フィルター
            const [filterCutoff, setFilterCutoff] = useState(8000);
            const [djScratch, setDjScratch] = useState(false);

            const percRef = useRef(buildDefaultPattern("afro"));
            const [percSteps, setPercSteps] = useState(() => percRef.current);
            percRef.current = percSteps;

            const melodyRef = useRef(melodySteps);
            melodyRef.current = melodySteps;
            const loopRef = useRef(null);

            // 音源設定 (Tone.js)
            const fxFilter = useRef(new Tone.Filter(8000, "lowpass").toDestination());
            const synths = useRef({
                kick: new Tone.MembraneSynth({ octaves: 5, pitchDecay: 0.05 }).connect(fxFilter.current),
                snare: new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.001, decay: 0.15 } }).connect(fxFilter.current),
                djembe: new Tone.MembraneSynth({ pitchDecay: 0.01, octaves: 3 }).connect(fxFilter.current),
                conga: new Tone.MembraneSynth({ pitchDecay: 0.02, octaves: 2 }).connect(fxFilter.current),
                shaker: new Tone.NoiseSynth({ noise: { type: "pink" }, envelope: { attack: 0.001, decay: 0.05 } }).connect(fxFilter.current),
                
                synth: new Tone.Synth({ oscillator: { type: "sawtooth" } }).connect(fxFilter.current),
                guitar: new Tone.Synth({ oscillator: { type: "triangle" }, envelope: { attack: 0.05, decay: 0.2, sustain: 0.1 } }).connect(fxFilter.current),
                violin: new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.1, decay: 0.4, sustain: 0.5 } }).connect(fxFilter.current),
            });

            useEffect(() => {
                fxFilter.current.frequency.value = filterCutoff;
            }, [filterCutoff]);

            useEffect(() => {
                Tone.Transport.bpm.value = bpm;
                if (loopRef.current) {
                    loopRef.current.dispose();
                    loopRef.current = null;
                }

                let stepCounter = 0;
                loopRef.current = new Tone.Loop((time) => {
                    const step = stepCounter % TOTAL_STEPS;
                    const bar = Math.floor(step / BAR_STEPS);

                    setCurrentStep(step);
                    setCurrentBar(bar);

                    const p = percRef.current;
                    if (p.kick && p.kick[step]) synths.current.kick.triggerAttackRelease("C1", "8n", time);
                    if (p.snare && p.snare[step]) synths.current.snare.triggerAttackRelease("8n", time);
                    if (p.djembe && p.djembe[step]) synths.current.djembe.triggerAttackRelease("G2", "8n", time);
                    if (p.conga && p.conga[step]) synths.current.conga.triggerAttackRelease("C3", "8n", time);
                    if (p.shaker && p.shaker[step]) synths.current.shaker.triggerAttackRelease("16n", time);

                    const m = melodyRef.current[step];
                    if (m) {
                        synths.current[selectedInst].triggerAttackRelease(m, "8n", time);
                    }

                    stepCounter++;
                }, "16n").start(0);

                return () => { if (loopRef.current) loopRef.current.dispose(); };
            }, [bpm, selectedInst]);

            const togglePlay = async () => {
                await Tone.start();
                if (playing) {
                    Tone.Transport.stop();
                    setPlaying(false);
                    setCurrentStep(-1);
                    setStatus("停止しました");
                } else {
                    Tone.Transport.start();
                    setPlaying(true);
                    setStatus("▶ 再生中 (18小節ループ)");
                }
            };

            const handlePercClick = (key, stepIdx) => {
                setPercSteps(prev => {
                    const copy = { ...prev };
                    copy[key] = [...copy[key]];
                    copy[key][stepIdx] = copy[key][stepIdx] ? 0 : 1;
                    return copy;
                });
            };

            const handleMelodyClick = (stepIdx) => {
                setMelodySteps(prev => {
                    const copy = [...prev];
                    copy[stepIdx] = copy[stepIdx] ? null : selectedNote;
                    return copy;
                });
            };

            // AI自作・ランダム生成
            const generateAiPattern = () => {
                const newPerc = buildDefaultPattern(genre);
                for (let i = 0; i < TOTAL_STEPS; i++) {
                    if (Math.random() > 0.6) newPerc.djembe[i] = 1;
                    if (Math.random() > 0.7) newPerc.conga[i] = 1;
                    if (Math.random() > 0.5) newPerc.shaker[i] = 1;
                }
                setPercSteps(newPerc);

                const newMelody = emptyNoteRow();
                for (let i = 0; i < TOTAL_STEPS; i += 2) {
                    if (Math.random() > 0.3) {
                        const note = SCALE_NOTES[Math.floor(Math.random() * SCALE_NOTES.length)];
                        newMelody[i] = note;
                    }
                }
                setMelodySteps(newMelody);
                setStatus(`✨ AI自動生成完了 (${genre.toUpperCase()} & ${selectedInst})`);
            };

            const applyGenre = (g) => {
                setGenre(g);
                setPercSteps(buildDefaultPattern(g));
                if (g === "afro") setBpm(105);
                else if (g === "hiphop") setBpm(92);
                else if (g === "disco") setBpm(120);
                setStatus(`🎵 ジャンル試聴: ${g.toUpperCase()}`);
            };

            const clearAll = () => {
                setPercSteps(buildDefaultPattern(genre));
                setMelodySteps(emptyNoteRow());
                setStatus("🧹 クリアしました");
            };

            const toggleRecord = () => {
                if (!recording) {
                    setRecording(true);
                    setStatus("🔴 ボイス・セッション録音中...");
                } else {
                    setRecording(false);
                    const title = `録音セッション_${Date.now().toString().slice(-4)}`;
                    setRecordList(prev => [...prev, title]);
                    setStatus("💾 記憶・保存しました");
                }
            };

            const triggerDjScratch = () => {
                setDjScratch(true);
                synths.current.synth.triggerAttackRelease("C2", "16n");
                setTimeout(() => setDjScratch(false), 300);
                setStatus("🎛 DJスクラッチ！");
            };

            return (
                <div style={{ maxWidth: "880px", margin: "0 auto" }}>
                    <h1 style={{ fontSize: "1.1rem", color: "#00ffcc", marginBottom: "4px" }}>🌍 RHYTHM FORGE - ULTIMATE STUDIO</h1>
                    <p style={{ fontSize: "0.75rem", color: "#aaa", marginBottom: "8px" }}>アフロ楽器・太鼓・シンセ・ギター・バイオリン・AI自作・DJ機能完備 (18小節)</p>

                    {/* コントロールパネル */}
                    <div style={{ background: "#151821", padding: "10px", borderRadius: "8px", display: "flex", flexWrap: "wrap", gap: "8px", alignItems: "center", marginBottom: "8px" }}>
                        <button onClick={togglePlay} style={{ background: playing ? "#ff4444" : "#00ffcc", color: "#121216", border: "none", padding: "8px 14px", borderRadius: "4px", fontWeight: "bold", cursor: "pointer" }}>
                            {playing ? "⏹ STOP" : "▶ PLAY"}
                        </button>
                        <button onClick={generateAiPattern} style={{ background: "#7928ca", color: "#fff", border: "none", padding: "8px 10px", borderRadius: "4px", fontWeight: "bold", cursor: "pointer" }}>
                            ✨ AI自作
                        </button>
                        <button onClick={clearAll} style={{ background: "#444", color: "#fff", border: "none", padding: "8px 10px", borderRadius: "4px", cursor: "pointer" }}>
                            🧹 CLEAR
                        </button>
                        <button onClick={toggleRecord} style={{ background: recording ? "#ff0077" : "#0070f3", color: "#fff", border: "none", padding: "8px 10px", borderRadius: "4px", cursor: "pointer" }}>
                            {recording ? "⏹ 録音停止" : "🎙 ボイス録音"}
                        </button>
                        <button onClick={triggerDjScratch} style={{ background: "#f5a623", color: "#121216", border: "none", padding: "8px 10px", borderRadius: "4px", fontWeight: "bold", cursor: "pointer" }}>
                            🎛 DJスクラッチ
                        </button>

                        <div>
                            <span style={{ fontSize: "0.75rem", marginRight: "4px" }}>テンポ:{bpm}</span>
                            <input type="range" min="70" max="150" value={bpm} onChange={e => setBpm(Number(e.target.value))} style={{ width: "75px" }} />
                        </div>
                        <div>
                            <span style={{ fontSize: "0.75rem", marginRight: "4px" }}>FX:</span>
                            <input type="range" min="1000" max="15000" value={filterCutoff} onChange={e => setFilterCutoff(Number(e.target.value))} style={{ width: "75px" }} />
                        </div>
                    </div>

                    {/* ジャンル試聴・切り替え */}
                    <div style={{ display: "flex", gap: "6px", marginBottom: "8px", alignItems: "center", flexWrap: "wrap" }}>
                        <span style={{ fontSize: "0.75rem", color: "#aaa" }}>ジャンル試聴:</span>
                        {["afro", "hiphop", "disco"].map(g => (
                            <button key={g} onClick={() => applyGenre(g)} style={{ background: genre === g ? "#00ffcc" : "#222733", color: genre === g ? "#121216" : "#fff", border: "none", padding: "4px 10px", borderRadius: "4px", fontSize: "0.75rem", fontWeight: "bold", cursor: "pointer" }}>
                                {g.toUpperCase()}
                            </button>
                        ))}
                        <span style={{ fontSize: "0.75rem", color: "#00ffcc", marginLeft: "auto" }}>{status}</span>
                    </div>

                    {/* タブナビゲーション */}
                    <div style={{ display: "flex", gap: "6px", marginBottom: "8px", borderBottom: "1px solid #222733", paddingBottom: "6px" }}>
                        {["PERC", "MELODY", "LYRICS", "LIST"].map(t => (
                            <button key={t} onClick={() => setTab(t)} style={{ background: tab === t ? "#00ffcc" : "#222733", color: tab === t ? "#121216" : "#aaa", border: "none", padding: "6px 12px", borderRadius: "4px", fontWeight: "bold", fontSize: "0.8rem", cursor: "pointer" }}>
                                {t === "PERC" ? "太鼓・リズム" : t === "MELODY" ? "メロディ(楽器)" : t === "LYRICS" ? "ラップ歌詞" : "記憶リスト"}
                            </button>
                        ))}
                    </div>

                    {/* リズム・太鼓タブ */}
                    {tab === "PERC" && (
                        <div style={{ background: "#151821", padding: "10px", borderRadius: "8px", overflowX: "auto" }}>
                            <div style={{ fontSize: "0.75rem", marginBottom: "6px", color: "#00ffcc" }}>全 {BARS} 小節（現在第 {currentBar + 1} 小節） - アフリカ楽器・太鼓・ドラム</div>
                            {PERC_ROWS.map(row => (
                                <div key={row.key} style={{ display: "flex", alignItems: "center", marginBottom: "4px" }}>
                                    <span style={{ width: "95px", fontSize: "0.7rem", fontWeight: "bold" }}>{row.label}</span>
                                    <div style={{ display: "flex", gap: "2px" }}>
                                        {percSteps[row.key] && percSteps[row.key].map((val, idx) => {
                                            const isCurrent = currentStep === idx;
                                            const isBarStart = idx % BAR_STEPS === 0;
                                            return (
                                                <div
                                                    key={idx}
                                                    onClick={() => handlePercClick(row.key, idx)}
                                                    style={{
                                                        width: "12px",
                                                        height: "22px",
                                                        background: val ? "#00ffcc" : "#222733",
                                                        border: isCurrent ? "2px solid #ff0077" : isBarStart ? "1px solid #777" : "1px solid #333",
                                                        borderRadius: "2px",
                                                        cursor: "pointer",
                                                    }}
                                                />
                                            );
                                        })}
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}

                    {/* メロディ / 楽器タブ */}
                    {tab === "MELODY" && (
                        <div style={{ background: "#151821", padding: "10px", borderRadius: "8px" }}>
                            <div style={{ display: "flex", gap: "10px", marginBottom: "10px", alignItems: "center", flexWrap: "wrap" }}>
                                <div>
                                    <span style={{ fontSize: "0.75rem", marginRight: "4px" }}>楽器:</span>
                                    {MELODY_INSTRUMENTS.map(inst => (
                                        <button key={inst.key} onClick={() => setSelectedInst(inst.key)} style={{ background: selectedInst === inst.key ? "#ff0077" : "#222733", color: "#fff", border: "none", padding: "4px 8px", borderRadius: "4px", fontSize: "0.75rem", marginRight: "4px", cursor: "pointer" }}>
                                            {inst.label}
                                        </button>
                                    ))}
                                </div>
                                <div>
                                    <span style={{ fontSize: "0.75rem", marginRight: "4px" }}>音程:</span>
                                    <select value={selectedNote} onChange={e => setSelectedNote(e.target.value)} style={{ background: "#222733", color: "#fff", border: "1px solid #444", padding: "4px", borderRadius: "4px", fontSize: "0.75rem" }}>
                                        {SCALE_NOTES.map(n => <option key={n} value={n}>{n}</option>)}
                                    </select>
                                </div>
                            </div>

                            <p style={{ fontSize: "0.75rem", color: "#aaa", marginBottom: "6px" }}>グリッドをクリックして手動編集 / AI自作も可能</p>
                            <div style={{ overflowX: "auto" }}>
                                <div style={{ display: "flex", alignItems: "center", marginBottom: "4px" }}>
                                    <span style={{ width: "95px", fontSize: "0.7rem", fontWeight: "bold" }}>{selectedInst.toUpperCase()}</span>
                                    <div style={{ display: "flex", gap: "2px" }}>
                                        {melodySteps.map((val, idx) => {
                                            const isCurrent = currentStep === idx;
                                            const isBarStart = idx % BAR_STEPS === 0;
                                            return (
                                                <div
                                                    key={idx}
                                                    onClick={() => handleMelodyClick(idx)}
                                                    title={val ? `Note: ${val}` : "Empty"}
                                                    style={{
                                                        width: "12px",
                                                        height: "26px",
                                                        background: val ? "#ff0077" : "#222733",
                                                        border: isCurrent ? "2px solid #00ffcc" : isBarStart ? "1px solid #777" : "1px solid #333",
                                                        borderRadius: "2px",
                                                        cursor: "pointer",
                                                    }}
                                                />
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ラップ歌詞タブ */}
                    {tab === "LYRICS" && (
                        <div style={{ background: "#151821", padding: "10px", borderRadius: "8px" }}>
                            <h3 style={{ fontSize: "0.85rem", marginBottom: "6px" }}>ラップ・ボーカル用 歌詞エディタ</h3>
                            <textarea
                                value={lyrics}
                                onChange={e => setLyrics(e.target.value)}
                                style={{ width: "100%", height: "120px", background: "#0d0f14", color: "#fff", border: "1px solid #333", borderRadius: "4px", padding: "8px", boxSizing: "border-box", fontSize: "0.85rem" }}
                            />
                        </div>
                    )}

                    {/* 記憶・保存リストタブ */}
                    {tab === "LIST" && (
                        <div style={{ background: "#151821", padding: "10px", borderRadius: "8px" }}>
                            <h3 style={{ fontSize: "0.85rem", marginBottom: "6px" }}>録音・セッション記憶リスト</h3>
                            {recordList.length === 0 ? (
                                <p style={{ fontSize: "0.75rem", color: "#aaa" }}>記憶されたデータはありません。「ボイス録音」ボタンで保存できます。</p>
                            ) : (
                                recordList.map((item, index) => (
                                    <div key={index} style={{ background: "#222733", padding: "6px 8px", marginBottom: "4px", borderRadius: "4px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                                        <span style={{ fontSize: "0.8rem" }}>{item}</span>
                                        <button onClick={() => setRecordList(recordList.filter((_, i) => i !== index))} style={{ background: "#ff4444", color: "#fff", border: "none", padding: "3px 6px", borderRadius: "4px", fontSize: "0.7rem", cursor: "pointer" }}>削除</button>
                                    </div>
                                ))
                            )}
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
