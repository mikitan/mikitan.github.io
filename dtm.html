<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RHYTHM FORGE v4.8</title>
  <!-- React & Tone.js CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="margin:0; background-color:#0d1117; color:#fff;">
  <div id="root">読み込み中...</div>

  <script>
    // 万が一スクリプトがクラッシュした際に画面にエラーを表示するセーフティネット
    window.addEventListener('error', function(e) {
      document.getElementById('root').innerHTML = '<div style="padding:20px; color:#ff6b6b;"><h3>エラーが発生しました:</h3><p>' + e.message + '</p></div>';
    });
  </script>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    const BAR_STEPS = 16;
    const BARS = 12;
    const TOTAL_STEPS = BAR_STEPS * BARS;

    const DRUM_ROWS = [
      { key: "kick", label: "KICK" },
      { key: "snare", label: "SNARE" },
      { key: "hihat", label: "H.H" },
      { key: "cymb", label: "CYMB" },
    ];

    const MELODY_ROWS = [
      { key: "guitar", label: "GUITAR ROCK BAND" },
      { key: "elecGuitar", label: "ELEC GUITAR STRINGS" },
      { key: "arpeggio", label: "ARPEGGIO" },
      { key: "cutting", label: "CUTTING" },
      { key: "piano", label: "PIANO" },
      { key: "soulFx", label: "SOUL DISCO FX" },
      { key: "stringCord", label: "STRING CORD" },
      { key: "harmonica", label: "HARMONICA" },
      { key: "violin", label: "VIOLIN" },
      { key: "synth", label: "SYNTH" },
      { key: "africanDrums", label: "AFRICAN DRUMS" },
      { key: "aiBass", label: "AI BASS MELODY" },
      { key: "subBass", label: "SUB BASS" },
    ];

    function emptyRow() {
      return new Array(TOTAL_STEPS).fill(0);
    }

    function RhythmForge() {
      const [bpm, setBpm] = useState(110);
      const [playing, setPlaying] = useState(false);
      const [currentStep, setCurrentStep] = useState(-1);
      const [currentBar, setCurrentBar] = useState(0);
      const [songName, setSongName] = useState("My Groove 1");
      const [status, setStatus] = useState("準備完了");

      const [gridData, setGridData] = useState(() => {
        const initial = {};
        [...DRUM_ROWS, ...MELODY_ROWS].forEach(r => {
          initial[r.key] = emptyRow();
        });
        return initial;
      });

      const handleCellClick = (key, index) => {
        setGridData(prev => {
          const copy = [...prev[key]];
          copy[index] = copy[index] === 1 ? 0 : 1;
          return { ...prev, [key]: copy };
        });
      };

      const togglePlay = async () => {
        try {
          await Tone.start();
          if (playing) {
            Tone.Transport.stop();
            setPlaying(false);
          } else {
            Tone.Transport.start();
            setPlaying(true);
          }
        } catch(err) {
          setStatus("オーディオ再生エラー: " + err.message);
        }
      };

      return (
        <div style={{ padding: "10px", fontFamily: "sans-serif", maxWidth: "100%", boxSizing: "border-box" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", backgroundColor: "#161b22", padding: "10px", borderRadius: "6px" }}>
            <span style={{ fontSize: "16px", fontWeight: "bold", color: "#58a6ff" }}>RHYTHM FORGE v4.8</span>
            <button style={{ padding: "8px 16px", background: playing ? "#f39c12" : "#e74c3c", color: "#fff", border: "none", borderRadius: "4px", fontWeight: "bold" }} onClick={togglePlay}>
              {playing ? "停止" : "再生"}
            </button>
          </div>

          <div style={{ display: "flex", flexDirection: "column", gap: "4px", backgroundColor: "#161b22", padding: "8px", marginTop: "10px", borderRadius: "6px", overflowX: "auto" }}>
            {DRUM_ROWS.concat(MELODY_ROWS).map(row => (
              <div key={row.key} style={{ display: "flex", alignItems: "center", gap: "6px" }}>
                <div style={{ width: "130px", fontSize: "10px", color: "#8b949e", textAlign: "right" }}>{row.label}</div>
                <div style={{ display: "grid", gridTemplateColumns: "repeat(16, 1fr)", gap: "3px", flex: 1 }}>
                  {Array.from({ length: BAR_STEPS }).map((_, i) => {
                    const globalIdx = currentBar * BAR_STEPS + i;
                    const isSelected = gridData[row.key]?.[globalIdx] === 1;
                    return (
                      <div
                        key={i}
                        onClick={() => handleCellClick(row.key, globalIdx)}
                        style={{
                          aspectRatio: "1.2",
                          backgroundColor: isSelected ? "#3498db" : "#1e272e",
                          border: "1px solid #30363d",
                          borderRadius: "3px",
                          cursor: "pointer"
                        }}
                      />
                    );
                  })}
                </div>
              </div>
            ))}
          </div>

          <div style={{ marginTop: "10px", padding: "8px", background: "#1f6feb", borderRadius: "4px", fontSize: "12px", textAlign: "center" }}>
            ステータス: {status}
          </div>
        </div>
      );
    }

    ReactDOM.render(<RhythmForge />, document.getElementById("root"));
  </script>
</body>
</html>
