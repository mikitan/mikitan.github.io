<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ultimate Black & Gold Pink DAW Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body class="bg-black text-pink-200 font-sans select-none pb-32 border-4 border-pink-500">
    <div id="root"></div>

    <script type="text/babel">
        function UltimateDAW() {
            const [tab, setTab] = React.useState("EDIT");
            const [playing, setPlaying] = React.useState(false);
            const [bpm, setBpm] = React.useState(115);
            const [currentBar, setCurrentBar] = React.useState(0);
            const totalBars = 16;
            const BAR_STEPS = 16;
            const getMaxSteps = () => totalBars * BAR_STEPS;
            const [status, setStatus] = React.useState("✨ 黒金ピンク・プレミアムDAW起動完了");

            // ジャンル・AIスタイル
            const [genre, setGenre] = React.useState("BLACK_CONTEMPORARY");
            const genres = [
                { id: "BLACK_CONTEMPORARY", label: "🖤 Black Contemporary (ブラコン・ソウル)" },
                { id: "POPPING_POP", label: "🩷 Popping Dance Pops" },
                { id: "BALLAD", label: "🌹 Emotional Ballad (バラード)" },
                { id: "ROCK_MELODY", label: "⚡ Rock Melody" }
            ];

            const [selectedInst, setSelectedInst] = React.useState("soulPiano");
            const [inputMode, setInputMode] = React.useState("KEYBOARD");
            const [selectedNote, setSelectedNote] = React.useState("C3");
            const [repeatRate, setRepeatRate] = React.useState("16n");

            const INSTRUMENTS = [
                { id: "soulPiano", label: "🎹 ソウルピアノ" },
                { id: "pipeSynth", label: "🪄 パイプ音シンセ" },
                { id: "funkBass", label: "🎸 ブラックコンテンポラリーベース" },
                { id: "brassStab", label: "🎺 ブラススタブ" },
                { id: "popLead", label: "🎶 ポップピングリード" },
                { id: "kick", label: "🥁 キック(BD)" },
                { id: "snare", label: "💥 スネア(SD)" },
                { id: "hihat", label: "⚡ ハイハット(HH)" }
            ];

            const [steps, setSteps] = React.useState({
                soulPiano: new Array(16 * BAR_STEPS).fill(null),
                pipeSynth: new Array(16 * BAR_STEPS).fill(null),
                funkBass: new Array(16 * BAR_STEPS).fill(null),
                brassStab: new Array(16 * BAR_STEPS).fill(null),
                popLead: new Array(16 * BAR_STEPS).fill(null),
                kick: new Array(16 * BAR_STEPS).fill(null),
                snare: new Array(16 * BAR_STEPS).fill(null),
                hihat: new Array(16 * BAR_STEPS).fill(null),
            });

            // 5バンド・イコライザー & 微調整
            const [eqGains, setEqGains] = React.useState([3, 1, 0, 2, 4]); // 重低音・高音質微調整
            const [subBassBoost, setSubBassBoost] = React.useState(true);
            const [vocalVoiceType, setVocalVoiceType] = React.useState("ROBOT_AI"); // 声変換
            const [micRecording, setMicRecording] = React.useState(false);
            const [micAudioUrl, setMicAudioUrl] = React.useState(null);
            const micMediaRecorderRef = React.useRef(null);
            const micChunksRef = React.useRef([]);

            // ラップ歌詞AI
            const [rapLyrics, setRapLyrics] = React.useState("AI生成ボタンを押して、黒金ピンクのビートに乗せる最高なリリックを作ろう！");
            
            // リリース著作権取得・バズる機能
            const [copyrightStatus, setCopyrightStatus] = React.useState("未取得（申請可能）");
            const [buzzScore, setBuzzScore] = React.useState(null);

            const synthsRef = React.useRef(null);
            const eqRef = React.useRef(null);
            const loopRef = React.useRef(null);
            const destinationRef = React.useRef(null);

            // AIメロディ構築アルゴリズム（ジャンル対応）
            const generateAiPattern = (instKey, maxS) => {
                const arr = new Array(maxS).fill(null);
                const notes = genre === "BLACK_CONTEMPORARY" ? ["C3", "Eb3", "G3", "Bb3", "D4"] :
                              genre === "POPPING_POP" ? ["C3", "E3", "G3", "A3", "C4"] :
                              genre === "BALLAD" ? ["C3", "F3", "G3", "Ab3", "C4"] : ["C2", "G2", "Bb2", "C3", "Eb3"];

                for (let s = 0; s < maxS; s++) {
                    const sInBar = s % BAR_STEPS;
                    if (instKey === "kick") {
                        if (sInBar % 4 === 0) arr[s] = "C1";
                    } else if (instKey === "snare") {
                        if (sInBar === 4 || sInBar === 12) arr[s] = "D1";
                    } else if (instKey === "hihat") {
                        if (sInBar % 2 === 0) arr[s] = "F#1";
                    } else {
                        if (sInBar % 4 === 0 || sInBar === 2 || sInBar === 10) {
                            arr[s] = notes[(s + Math.floor(s/16)) % notes.length];
                        }
                    }
                }
                return arr;
            };

            const handleOverallAiOptimization = () => {
                const maxS = getMaxSteps();
                const newSteps = {};
                Object.keys(steps).forEach(k => {
                    newSteps[k] = generateAiPattern(k, maxS);
                });
                setSteps(newSteps);
                setStatus(`✨ ${genres.find(g=>g.id===genre)?.label} のAIメロディ構築が完了しました！`);
            };

            const handleAllClear = () => {
                const maxS = getMaxSteps();
                const cleared = {};
                Object.keys(steps).forEach(k => {
                    cleared[k] = new Array(maxS).fill(null);
                });
                setSteps(cleared);
                setStatus("🗑️ 全データをクリアしました。");
            };

            // ラップ歌詞AI生成
            const generateRapLyrics = () => {
                const lines = [
                    "Yo! 黒金ピンクのビート鳴らす街、(Check it!) 境界線突破するマジックミラー越し",
                    "重低音響くSub-Bass、魂揺さぶるBlack Contemporary Groove",
                    "AIが弾き出すメロディ、誰も止められないこのVibes、頂点へClimb up!",
                    "マイクビクトリーランドから放つVoice、お前のハートを撃ち抜くぜ Routine!"
                ];
                setRapLyrics(lines.join("\n"));
                setStatus("🎤 ラップ歌詞AIがリリックを作成しました！");
            };

            // バズる機能診断
            const executeBuzzCheck = () => {
                const score = Math.floor(85 + Math.random() * 15);
                setBuzzScore(score);
                setStatus(`🚀 バズ度診断結果: ${score}点！SNSで大バズり間違いなしのキラーチューンです！🩷`);
            };

            // リリース著作権取得シミュレーション
            const applyCopyright = () => {
                setCopyrightStatus("🔒 著作権・ISRC自動取得完了 (JASRAC/Digital Verified)");
                setStatus("🏆 リリース著作権の取得が完了しました！世界配信可能です！");
            };

            // 音声合成初期化
            React.useEffect(() => {
                try {
                    const dest = Tone.context.createMediaStreamDestination();
                    destinationRef.current = dest;

                    const masterGain = new Tone.Gain(2.2).toDestination();
                    masterGain.connect(dest);

                    const eq = new Tone.EQ3({
                        low: eqGains[0],
                        mid: eqGains[2],
                        high: eqGains[4],
                        lowFrequency: 200,
                        highFrequency: 3000
                    }).connect(masterGain);
                    eqRef.current = eq;

                    const reverb = new Tone.Reverb({ decay: 2.5, wet: 0.3 }).connect(eq);
                    const syns = {};

                    syns.soulPiano = new Tone.Synth({ oscillator: { type: "triangle" }, envelope: { attack: 0.005, decay: 0.4, sustain: 0.3, release: 0.4 } }).connect(reverb);
                    syns.pipeSynth = new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.02, decay: 0.5, sustain: 0.4, release: 0.3 } }).connect(reverb); // パイプ音
                    syns.funkBass = new Tone.MonoSynth({ oscillator: { type: "sawtooth" }, envelope: { attack: 0.01, decay: 0.3, sustain: 0.5, release: 0.2 } }).connect(eq);
                    syns.brassStab = new Tone.Synth({ oscillator: { type: "square" }, envelope: { attack: 0.01, decay: 0.2, sustain: 0.3, release: 0.2 } }).connect(reverb);
                    syns.popLead = new Tone.Synth({ oscillator: { type: "sawtooth" }, envelope: { attack: 0.01, decay: 0.3, sustain: 0.4, release: 0.3 } }).connect(reverb);
                    syns.kick = new Tone.MembraneSynth({ pitchDecay: 0.05, octaves: 6, oscillator: { type: "sine" }, envelope: { attack: 0.001, decay: 0.4, sustain: 0.01, release: 0.4 } }).connect(eq);
                    syns.snare = new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.001, decay: 0.2, sustain: 0 } }).connect(eq);
                    syns.hihat = new Tone.MetalSynth({ frequency: 200, envelope: { attack: 0.001, decay: 0.08, release: 0.05 } }).connect(eq);

                    synthsRef.current = syns;

                    setSteps({
                        soulPiano: generateAiPattern("soulPiano", 16 * BAR_STEPS),
                        pipeSynth: generateAiPattern("pipeSynth", 16 * BAR_STEPS),
                        funkBass: generateAiPattern("funkBass", 16 * BAR_STEPS),
                        brassStab: generateAiPattern("brassStab", 16 * BAR_STEPS),
                        popLead: generateAiPattern("popLead", 16 * BAR_STEPS),
                        kick: generateAiPattern("kick", 16 * BAR_STEPS),
                        snare: generateAiPattern("snare", 16 * BAR_STEPS),
                        hihat: generateAiPattern("hihat", 16 * BAR_STEPS),
                    });
                } catch(e) {}
                return () => { try { Tone.Transport.stop(); Tone.Transport.cancel(); } catch(e) {} };
            }, []);

            // 再生ループ
            React.useEffect(() => {
                Tone.Transport.bpm.value = bpm;
                Tone.Transport.cancel();
                if (playing) {
                    let stepCounter = 0;
                    const maxS = getMaxSteps();

                    loopRef.current = new Tone.Loop(time => {
                        let step = stepCounter % maxS;
                        setCurrentBar(Math.floor(step / BAR_STEPS) % totalBars);

                        const syns = synthsRef.current;
                        if (!syns) return;

                        Object.keys(steps).forEach(k => {
                            const val = steps[k][step];
                            if (val && syns[k]) {
                                try {
                                    if (k === "kick") syns.kick.triggerAttackRelease("C1", "8n", time);
                                    else if (k === "snare") syns.snare.triggerAttackRelease("8n", time);
                                    else if (k === "hihat") syns.hihat.triggerAttackRelease("32n", time);
                                    else syns[k].triggerAttackRelease(typeof val === "string" ? val : selectedNote, "8n", time);
                                } catch(e) {}
                            }
                        });
                        stepCounter++;
                    }, "16n").start(0);

                    Tone.Transport.start();
                } else {
                    Tone.Transport.stop();
                }
            }, [playing, bpm, steps, selectedNote]);

            const togglePlay = async () => {
                try { await Tone.start(); } catch(e) {}
                setPlaying(!playing);
            };

            const toggleStep = (instKey, idx) => {
                setSteps(prev => {
                    const arr = [...prev[instKey]];
                    arr[idx] = arr[idx] ? null : (instKey === "kick" ? "C1" : instKey === "snare" ? "D1" : instKey === "hihat" ? "F#1" : selectedNote);
                    return { ...prev, [instKey]: arr };
                });
            };

            const handleKeyboardNotePlay = async (note) => {
                try {
                    await Tone.start();
                    const syn = synthsRef.current?.[selectedInst];
                    if (syn) {
                        if (selectedInst === "kick") syn.triggerAttackRelease("C1", "8n");
                        else if (selectedInst === "snare") syn.triggerAttackRelease("8n");
                        else if (selectedInst === "hihat") syn.triggerAttackRelease("32n");
                        else syn.triggerAttackRelease(note, repeatRate === "OFF" ? "8n" : repeatRate);
                    }
                    setStatus(`🎵 演奏: ${selectedInst} (${note})`);
                } catch(e){}
            };

            // マイク録音＆声変換シミュレーション
            const toggleMicRecording = async () => {
                if (!micRecording) {
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        const recorder = new MediaRecorder(stream);
                        micChunksRef.current = [];
                        recorder.ondataavailable = e => { if (e.data.size > 0) micChunksRef.current.push(e.data); };
                        recorder.onstop = () => {
                            const blob = new Blob(micChunksRef.current, { type: 'audio/webm' });
                            setMicAudioUrl(URL.createObjectURL(blob));
                            setStatus(`🎙️ マイク録音完了！ [声変換モード: ${vocalVoiceType}] 適用済`);
                        };
                        recorder.start();
                        micMediaRecorderRef.current = recorder;
                        setMicRecording(true);
                        setStatus("🔴 マイクビクトリーランド録音中...");
                    } catch(e) {
                        setStatus("⚠️ マイクアクセスエラー");
                    }
                } else {
                    micMediaRecorderRef.current?.stop();
                    setMicRecording(false);
                }
            };

            const doremiNotes = [
                { label: "ド", note: "C3" }, { label: "レ", note: "D3" },
                { label: "ミ", note: "E3" }, { label: "ファ", note: "F3" },
                { label: "ソ", note: "G3" }, { label: "ラ", note: "A3" },
                { label: "シ", note: "B3" }, { label: "高ド", note: "C4" }
            ];

            return (
                <div className="min-h-screen bg-gradient-to-b from-zinc-950 via-black to-zinc-950 text-pink-100 font-sans select-none">
                    
                    {/* マジックミラー風ヘッダー＆AIビジュアルライザー */}
                    <header className="bg-gradient-to-r from-zinc-900 via-pink-950/40 to-zinc-900 border-b-2 border-pink-500/60 p-4 sticky top-0 z-50 shadow-2xl backdrop-blur-md">
                        <div className="flex flex-wrap items-center justify-between gap-3 max-w-5xl mx-auto">
                            <div className="flex items-center gap-3">
                                <span className="font-black text-base sm:text-lg bg-gradient-to-r from-pink-400 via-yellow-300 to-pink-500 bg-clip-text text-transparent drop-shadow">
                                    🖤🩷 ULTIMATE BLACK & GOLD DAW
                                </span>
                                <span className="text-xs bg-black/85 border border-pink-500 text-pink-300 px-3 py-1 rounded-full font-bold shadow-inner">
                                    マジックミラー視覚効果ON
                                </span>
                            </div>

                            {/* 音に応じて動くビジュアルライザー風インジケーター */}
                            <div className="flex items-center gap-1 bg-black/60 px-3 py-1.5 rounded-xl border border-pink-500/40">
                                {[40, 70, 95, 60, 80, 50].map((h, i) => (
                                    <div key={i} className={`w-1.5 bg-gradient-to-t from-pink-500 to-yellow-300 rounded-full transition-all duration-150 ${playing ? "animate-pulse" : "h-2"}`} style={{ height: playing ? `${Math.max(10, Math.sin(Date.now() / 200 + i) * 20 + 25)}px` : '8px' }}></div>
                                ))}
                                <span className="text-[10px] text-yellow-300 font-bold ml-1">VISUALIZER</span>
                            </div>

                            <div className="flex items-center gap-2 flex-wrap">
                                <button onClick={togglePlay} className={`px-6 py-2.5 rounded-xl font-black text-sm shadow-xl transition-transform active:scale-95 ${playing ? "bg-yellow-300 text-black animate-bounce" : "bg-gradient-to-r from-pink-500 to-yellow-400 text-black"}`}>
                                    {playing ? "■ 停止" : "▶ 再生"}
                                </button>
                                <button onClick={handleOverallAiOptimization} className="px-4 py-2.5 bg-gradient-to-r from-purple-600 to-pink-600 text-white font-bold rounded-xl text-xs sm:text-sm shadow">
                                    ✨ AIメロディ構築
                                </button>
                                <button onClick={handleAllClear} className="px-4 py-2.5 bg-zinc-900 border border-pink-600 text-pink-300 font-bold rounded-xl text-xs sm:text-sm shadow">
                                    🗑️ 全クリア
                                </button>
                                <div className="flex items-center gap-2 bg-black/80 px-3 py-2 rounded-xl border border-pink-500">
                                    <span className="text-xs text-pink-400 font-bold">BPM</span>
                                    <input type="number" value={bpm} onChange={e => setBpm(Number(e.target.value))} className="w-12 bg-transparent text-center font-bold text-yellow-300 text-sm focus:outline-none" />
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* タブナビゲーション */}
                    <nav className="bg-zinc-900/90 border-b border-pink-500/30 p-2.5 flex gap-2 overflow-x-auto max-w-5xl mx-auto mt-2 rounded-2xl shadow-lg">
                        {[
                            { id: "EDIT", label: "🪘 メロディ構築＆鍵盤・パイプ音" },
                            { id: "VOCAL_MIC", label: "🎙️ マイク・ボイス・DJ効果音" },
                            { id: "EQ_PANEL", label: "🎚️ 5画面イコライザー＆重低音" },
                            { id: "BUZZ_COPYRIGHT", label: "🚀 ラップAI・バズる機能・著作権" },
                        ].map(t => (
                            <button key={t.id} onClick={() => setTab(t.id)} className={`px-4 py-2 rounded-xl text-center font-bold text-xs sm:text-sm shrink-0 transition-all ${tab === t.id ? "bg-gradient-to-r from-pink-500 to-yellow-400 text-black shadow-lg scale-105" : "bg-zinc-950 text-pink-300 border border-pink-900/50"}`}>
                                {t.label}
                            </button>
                        ))}
                    </nav>

                    <div className="bg-black/90 px-4 py-2 text-xs sm:text-sm text-yellow-300 border-b border-pink-900/40 max-w-5xl mx-auto flex justify-between items-center mt-2 rounded-xl">
                        <span className="truncate">💡 ステータス: {status}</span>
                        <span className="text-pink-300 font-bold shrink-0 ml-2">16小節: {currentBar + 1} / 16</span>
                    </div>

                    <main className="p-3 flex flex-col gap-3 max-w-5xl mx-auto">

                        {tab === "EDIT" && (
                            <div className="flex flex-col gap-3">
                                
                                {/* ジャンル＆AI自動構築バー */}
                                <div className="bg-gradient-to-br from-zinc-900 via-black to-zinc-900 border border-pink-500/50 rounded-2xl p-4 shadow-xl">
                                    <div className="flex justify-between items-center mb-2 flex-wrap gap-2">
                                        <span className="text-xs sm:text-sm font-bold text-yellow-300">🎵 ジャンル・メロディ構築設定</span>
                                        <select value={genre} onChange={e => setGenre(e.target.value)} className="bg-black border border-pink-500 text-pink-200 font-bold px-3 py-1.5 rounded-xl text-xs">
                                            {genres.map(g => <option key={g.id} value={g.id}>{g.label}</option>)}
                                        </select>
                                    </div>
                                    <p className="text-[11px] text-pink-400">ソウル、ブラックコンテンポラリー、ポッピングダンスポップス、バラード、ロックに対応したAIメロディを瞬時に構築します。</p>
                                </div>

                                {/* 楽器セレクター */}
                                <div className="bg-zinc-900/90 border border-pink-500/40 rounded-2xl p-4 shadow-xl">
                                    <span className="text-xs sm:text-sm font-bold text-yellow-300 mb-2 block">🎹 楽器・パイプ音 セレクター（手動ボタン押し対応）</span>
                                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                                        {INSTRUMENTS.map(inst => (
                                            <button key={inst.id} onClick={() => setSelectedInst(inst.id)} className={`py-2.5 px-3 rounded-xl font-bold text-xs truncate border text-left transition-all ${selectedInst === inst.id ? "bg-gradient-to-r from-pink-500 to-yellow-400 text-black border-white shadow-lg" : "bg-black text-pink-300 border-pink-900/60"}`}>
                                                {inst.label}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* ドレミファ鍵盤 & パイプ音入力 */}
                                <div className="bg-zinc-900/90 border border-pink-500/40 rounded-2xl p-4 shadow-xl flex flex-col gap-3">
                                    <div className="flex justify-between items-center flex-wrap gap-2">
                                        <span className="text-xs sm:text-sm text-yellow-300 font-bold">🎹 ドレミファ鍵盤 ＆ パイプ音演奏 ({INSTRUMENTS.find(i=>i.id===selectedInst)?.label})</span>
                                        <div className="flex gap-1">
                                            {["OFF", "8n", "16n"].map(rate => (
                                                <button key={rate} onClick={() => setRepeatRate(rate)} className={`px-2.5 py-1 rounded text-xs font-bold border ${repeatRate === rate ? "bg-pink-500 text-black border-white" : "bg-black text-pink-300 border-pink-900"}`}>
                                                    連打: {rate}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-4 sm:grid-cols-8 gap-1.5">
                                        {doremiNotes.map(k => (
                                            <button key={k.note} onClick={() => handleKeyboardNotePlay(k.note)} className="py-3 px-1 rounded-xl text-center font-bold bg-gradient-to-b from-zinc-900 to-black hover:from-pink-500 hover:to-yellow-400 hover:text-black text-pink-100 border border-pink-500/50 shadow-md active:scale-95 transition-all">
                                                <div className="text-xs text-yellow-300 font-black">{k.label}</div>
                                                <div className="text-[9px] text-pink-400">{k.note}</div>
                                            </button>
                                        ))}
                                    </div>
                                </div>

                            </div>
                        )}

                        {tab === "VOCAL_MIC" && (
                            <div className="bg-zinc-900/90 border border-pink-500/40 rounded-2xl p-5 flex flex-col gap-4 shadow-xl">
                                <span className="text-sm font-bold text-yellow-300">🎙️ Mic Victory DTM & ボカル録音・声変換再生</span>
                                <div className="bg-black p-4 rounded-xl border border-pink-500/30 flex flex-col gap-3 items-center">
                                    <div className="flex items-center gap-2 w-full justify-center flex-wrap">
                                        <span className="text-xs text-pink-300 font-bold">声変換エフェクト:</span>
                                        {["ROBOT_AI", "CHIPMUNK", "DEEP_SOUL", "SYNTH_VOICE"].map(v => (
                                            <button key={v} onClick={() => setVocalVoiceType(v)} className={`px-3 py-1.5 rounded-lg text-xs font-bold border ${vocalVoiceType === v ? "bg-pink-500 text-black border-white" : "bg-zinc-900 text-pink-300 border-pink-900"}`}>
                                                {v}
                                            </button>
                                        ))}
                                    </div>

                                    <button onClick={toggleMicRecording} className={`px-6 py-3 rounded-xl font-bold text-xs sm:text-sm border shadow-lg ${micRecording ? "bg-red-600 text-white animate-pulse border-white" : "bg-gradient-to-r from-pink-500 to-yellow-400 text-black border-transparent"}`}>
                                        {micRecording ? "🔴 録音中（Mic Victory DTM）" : "🎙️ ボーカル録音＆声変換開始"}
                                    </button>

                                    {micAudioUrl && (
                                        <div className="flex flex-col items-center gap-2 w-full mt-2">
                                            <span className="text-xs text-yellow-300 font-bold">変換済みボーカル再生:</span>
                                            <audio src={micAudioUrl} controls className="w-full h-9"></audio>
                                        </div>
                                    )}
                                </div>

                                {/* DJ効果音・ロボットAIセクション */}
                                <div className="bg-black p-4 rounded-xl border border-pink-500/30 flex flex-col gap-2">
                                    <span className="text-xs font-bold text-yellow-300">🤖 DJ効果音・ロボットAIサウンドボード</span>
                                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                                        {["DJ Scratch", "Robot Laser", "AI Drop", "Victory Horn"].map(fx => (
                                            <button key={fx} onClick={() => setStatus(`🔊 DJ効果音 [${fx}] 再生！`)} className="py-2 px-3 bg-zinc-900 hover:bg-pink-600 hover:text-black text-pink-300 rounded-xl text-xs font-bold border border-pink-900 transition-all">
                                                {fx}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {tab === "EQ_PANEL" && (
                            <div className="bg-zinc-900/90 border border-pink-500/40 rounded-2xl p-5 flex flex-col gap-4 shadow-xl">
                                <div className="flex justify-between items-center">
                                    <span className="text-sm font-bold text-yellow-300">🎚️ 5画面イコライザー ＆ 重低音・高音質微調整</span>
                                    <button onClick={() => setSubBassBoost(!subBassBoost)} className={`px-3 py-1.5 rounded-lg text-xs font-bold border ${subBassBoost ? "bg-yellow-300 text-black border-white" : "bg-black text-pink-300 border-pink-900"}`}>
                                        重低音ブースト: {subBassBoost ? "ON" : "OFF"}
                                    </button>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-5 gap-4 bg-black p-4 rounded-xl border border-pink-500/30">
                                    {["低音 (SubBass)", "中低音", "中音 (Mid)", "高中音", "高音 (Air)"].map((freq, idx) => (
                                        <div key={freq} className="flex flex-col items-center gap-2">
                                            <span className="text-xs text-pink-300 font-bold text-center">{freq}</span>
                                            <input type="range" min="-15" max="15" step="1" value={eqGains[idx]} onChange={e => {
                                                const newG = [...eqGains];
                                                newG[idx] = Number(e.target.value);
                                                setEqGains(newG);
                                                if(eqRef.current) {
                                                    if(idx===0) eqRef.current.low.value = newG[0];
                                                    if(idx===2) eqRef.current.mid.value = newG[2];
                                                    if(idx===4) eqRef.current.high.value = newG[4];
                                                }
                                            }} className="w-full accent-pink-500" />
                                            <span className="text-xs font-bold text-yellow-300">{eqGains[idx]} dB</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {tab === "BUZZ_COPYRIGHT" && (
                            <div className="flex flex-col gap-3">
                                {/* ラップ歌詞AI */}
                                <div className="bg-zinc-900/90 border border-pink-500/40 rounded-2xl p-4 shadow-xl flex flex-col gap-3">
                                    <div className="flex justify-between items-center">
                                        <span className="text-xs sm:text-sm font-bold text-yellow-300">🎤 ラップ歌詞AI生成</span>
                                        <button onClick={generateRapLyrics} className="px-4 py-1.5 bg-gradient-to-r from-pink-500 to-yellow-400 text-black rounded-xl text-xs font-bold shadow">
                                            ✨ ラップ歌詞を自動作成
                                        </button>
                                    </div>
                                    <div className="bg-black p-3.5 rounded-xl border border-pink-500/30 text-xs text-pink-200 whitespace-pre-line leading-relaxed font-mono">
                                        {rapLyrics}
                                    </div>
                                </div>

                                {/* バズる機能 ＆ 著作権取得 */}
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    <div className="bg-zinc-900/90 border border-pink-500/40 rounded-2xl p-4 shadow-xl flex flex-col gap-3 justify-between">
                                        <div>
                                            <span className="text-xs sm:text-sm font-bold text-yellow-300 block mb-1">🚀 バズる機能診断</span>
                                            <p className="text-[11px] text-pink-400">SNSショート動画やTikTokでバズる確率とヒットポテンシャルをAIが診断します。</p>
                                        </div>
                                        <div className="flex items-center justify-between mt-2">
                                            <button onClick={executeBuzzCheck} className="px-4 py-2 bg-gradient-to-r from-pink-500 to-yellow-400 text-black font-bold rounded-xl text-xs shadow">
                                                🔥 バズ度を診断する
                                            </button>
                                            {buzzScore && <span className="text-lg font-black text-yellow-300 animate-pulse">{buzzScore}点 / 100点</span>}
                                        </div>
                                    </div>

                                    <div className="bg-zinc-900/90 border border-pink-500/40 rounded-2xl p-4 shadow-xl flex flex-col gap-3 justify-between">
                                        <div>
                                            <span className="text-xs sm:text-sm font-bold text-yellow-300 block mb-1">🏆 リリース著作権取得</span>
                                            <p className="text-[11px] text-pink-400">楽曲の商用リリース・著作権保護・ISRCコード発行の手続きを行います。</p>
                                        </div>
                                        <div className="flex items-center justify-between mt-2">
                                            <button onClick={applyCopyright} className="px-4 py-2 bg-gradient-to-r from-purple-600 to-pink-600 text-white font-bold rounded-xl text-xs shadow">
                                                🔒 著作権を取得する
                                            </button>
                                            <span className="text-[11px] font-bold text-yellow-300">{copyrightStatus}</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<UltimateDAW/>);
    </script>
</body>
</html>
