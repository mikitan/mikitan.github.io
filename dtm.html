<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIC VICTORY - MASTER SYNTHESIZER v37.0 (TRUMPET, DI & 20 RAP PARTS)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans select-none pb-20 overflow-x-hidden">
    <div id="root">
        <div class="flex items-center justify-center h-screen text-amber-500 font-bold text-sm animate-pulse">
            読み込み中... (MIC VICTORY v37.0)
        </div>
    </div>

    <script type="text/babel">
        try {
            function MasterSynthApp() {
                const [tab, setTab] = React.useState("DUAL_EDIT");
                const [playing, setPlaying] = React.useState(false);
                const [flashColor, setFlashColor] = React.useState("border-orange-600");
                const [bpm, setBpm] = React.useState(104);
                const [currentBar, setCurrentBar] = React.useState(0);
                const [currentStep, setCurrentStep] = React.useState(-1);
                const [status, setStatus] = React.useState("🎺 トランペット・DI切替・20種ラップAI完全統合完了 v37.0");

                const BARS = 8;
                const BAR_STEPS = 16;
                const TOTAL_STEPS = BARS * BAR_STEPS;

                const [selectedInstrument, setSelectedInstrument] = React.useState("trumpet");
                const [diMode, setDiMode] = React.useState("DI_DIRECT"); // DI切り替え: "DI_DIRECT", "DI_AMP_SIM", "DI_TUBE"
                const [register, setRegister] = React.useState("mid"); // "low", "mid", "high"
                const [selectedNote, setSelectedNote] = React.useState("C3");
                const [selectedDrumPart, setSelectedDrumPart] = React.useState("kick");
                const [selectedBassPart, setSelectedBassPart] = React.useState("subBass");
                const [selectedRapPart, setSelectedRapPart] = React.useState("rapPunch01");

                const [slotName, setSlotName] = React.useState("MASTER_ALBUM_01");
                const [savedSlots, setSavedSlots] = React.useState({});

                const [jacketTitle, setJacketTitle] = React.useState("MIC VICTORY ULTIMATE BEATS");
                const [jacketGenre, setJacketGenre] = React.useState("TRUMPET / RAP 20 / AI ORCHESTRA");
                const [jacketColor, setJacketColor] = React.useState("from-amber-900 via-red-950 to-slate-950");

                const [instrumentSteps, setInstrumentSteps] = React.useState({
                    trumpet: new Array(TOTAL_STEPS).fill(null),
                    synth: new Array(TOTAL_STEPS).fill(null),
                    violin: new Array(TOTAL_STEPS).fill(null),
                    piano: new Array(TOTAL_STEPS).fill(null),
                    guitar: new Array(TOTAL_STEPS).fill(null),
                    subBass: new Array(TOTAL_STEPS).fill(null),
                    drums: new Array(TOTAL_STEPS).fill(null),
                    rapVocals: new Array(TOTAL_STEPS).fill(null),
                });

                const synthsRef = React.useRef(null);
                const loopRef = React.useRef(null);

                const NOTES_MAP = {
                    low: ["C1", "D1", "E1", "F1", "G1", "A1", "B1", "C2"],
                    mid: ["C2", "D2", "E2", "F2", "G2", "A2", "B2", "C3", "D3", "E3", "F3", "G3", "A3", "B3", "C4"],
                    high: ["C3", "D3", "E3", "F3", "G3", "A3", "B3", "C4", "D4", "E4", "F4", "G4", "A4", "B4", "C5"]
                };
                const NOTES = NOTES_MAP[register];

                const SOLFEGE = { 
                    "C1": "ド", "D1": "レ", "E1": "ミ", "F1": "ファ", "G1": "ソ", "A1": "ラ", "B1": "シ", 
                    "C2": "ド", "D2": "レ", "E2": "ミ", "F2": "ファ", "G2": "ソ", "A2": "ラ", "B2": "シ", 
                    "C3": "ド", "D3": "レ", "E3": "ミ", "F3": "ファ", "G3": "ソ", "A3": "ラ", "B3": "シ", 
                    "C4": "高ド", "D4": "高レ", "E4": "高ミ", "F4": "高ファ", "G4": "高ソ", "A4": "高ラ", "B4": "高シ", "C5": "超ド" 
                };

                const INSTRUMENTS = [
                    { id: "trumpet", label: "🎺 トランペット", color: "from-amber-600 to-yellow-800" },
                    { id: "synth", label: "🎹 シンセサイザー", color: "from-blue-900 to-indigo-950" },
                    { id: "violin", label: "🎻 バイオリン", color: "from-emerald-800 to-teal-950" },
                    { id: "piano", label: "🎹 ピアノ", color: "from-slate-700 to-slate-900" },
                    { id: "guitar", label: "🎸 ギター", color: "from-orange-800 to-amber-950" },
                    { id: "subBass", label: "🔊 重低音ベース", color: "from-amber-700 to-orange-900" },
                    { id: "drums", label: "🥁 ドラム", color: "from-red-800 to-amber-900" },
                    { id: "rapVocals", label: "🎤 ラップ(20種)", color: "from-rose-800 to-purple-950" },
                ];

                const DRUM_PARTS = [
                    { id: "kick", label: "01. ファットキック" }, { id: "subKick", label: "02. サブロー808" },
                    { id: "snare", label: "03. スネア" }, { id: "hihat", label: "04. ハイハット" },
                ];

                const BASS_PARTS = [
                    { id: "subBass", label: "01. ディープサブベース" }, { id: "synthBass", label: "02. 808重低音ベース" },
                    { id: "funkBass", label: "03. ファンキーベース" }, { id: "slapBass", label: "04. スラップベース" }
                ];

                // ラップパーツ20種
                const RAP_PARTS = [
                    { id: "rapPunch01", label: "01. ヘヴィパンチフロー" }, { id: "rapFast02", label: "02. 高速ツーステップ" },
                    { id: "rapAggro03", label: "03. アグレッシブシャウト" }, { id: "rapSmooth04", label: "04. メロウメロディラップ" },
                    { id: "rapStreet05", label: "05. ストリートアンセム" }, { id: "rapBoom06", label: "06. ブームバップビート" },
                    { id: "rapTrap07", label: "07. トラップハイハット" }, { id: "rapOld08", label: "08. オールドスクール" },
                    { id: "rapDark09", label: "09. ダークシネマティック" }, { id: "rapSoul10", label: "10. ソウルフルフロウ" },
                    { id: "rapChopper11", label: "11. チョッパー高速" }, { id: "rapMelodic12", label: "12. オートチューンメロウ" },
                    { id: "rapHardcore13", label: "13. ハードコアスピット" }, { id: "rapChill14", label: "14. チルバイブス" },
                    { id: "rapDouble15", label: "15. ダブルタイムフロウ" }, { id: "rapStaccato16", label: "16. スタッカートリズミカル" },
                    { id: "rapGfunk17", label: "17. Gファンクウェーブ" }, { id: "rapDrill18", label: "18. ドリルスライディング" },
                    { id: "rapFreestyle19", label: "19. フリースタイル即興" }, { id: "rapVictory20", label: "20. ヴィクトリーフィナーレ" }
                ];

                // 音響の初期化
                React.useEffect(() => {
                    try {
                        const limiter = new Tone.Limiter(-0.3).toDestination();
                        const eq = new Tone.EQ3({ low: 6, mid: 1, high: -2 }).connect(limiter);
                        const compressor = new Tone.Compressor({ threshold: -16, ratio: 6 }).connect(eq);
                        const masterGain = new Tone.Gain(1.3).connect(compressor);

                        // 各楽器シンセ
                        const trumpetSynth = new Tone.Synth({ oscillator: { type: "sawtooth" }, envelope: { attack: 0.02, decay: 0.2, sustain: 0.8, release: 0.3 } }).connect(masterGain);
                        const synthLead = new Tone.Synth({ oscillator: { type: "triangle" }, envelope: { attack: 0.03, decay: 0.4, sustain: 0.4, release: 0.3 } }).connect(masterGain);
                        const violinSynth = new Tone.Synth({ oscillator: { type: "sawtooth" }, envelope: { attack: 0.1, decay: 0.3, sustain: 0.7, release: 0.4 } }).connect(masterGain);
                        const pianoSynth = new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.01, decay: 0.5, sustain: 0.2, release: 0.3 } }).connect(masterGain);
                        const guitarSynth = new Tone.Synth({ oscillator: { type: "square" }, envelope: { attack: 0.02, decay: 0.3, sustain: 0.3, release: 0.2 } }).connect(masterGain);

                        const bassSynths = {};
                        BASS_PARTS.forEach(part => {
                            bassSynths[part.id] = new Tone.MonoSynth({
                                oscillator: { type: "sine" },
                                envelope: { attack: 0.02, decay: 0.7, sustain: 0.8, release: 0.5 }
                            }).connect(masterGain);
                        });

                        const drumSynths = {};
                        DRUM_PARTS.forEach(part => {
                            drumSynths[part.id] = new Tone.MembraneSynth({ pitchDecay: 0.08, octaves: 5, oscillator: { type: "sine" }, envelope: { attack: 0.001, decay: 0.7, sustain: 0.02, release: 0.4 } }).connect(masterGain);
                        });

                        const rapSynths = {};
                        RAP_PARTS.forEach(part => {
                            rapSynths[part.id] = new Tone.MembraneSynth({ pitchDecay: 0.02, octaves: 2, oscillator: { type: "square" }, envelope: { attack: 0.01, decay: 0.3, sustain: 0.1, release: 0.2 } }).connect(masterGain);
                        });

                        synthsRef.current = {
                            trumpet: trumpetSynth,
                            synth: synthLead,
                            violin: violinSynth,
                            piano: pianoSynth,
                            guitar: guitarSynth,
                            subBass: bassSynths,
                            drums: drumSynths,
                            rapVocals: rapSynths
                        };
                    } catch (e) {
                        console.error("Audio Init Error:", e);
                    }

                    return () => {
                        Tone.Transport.stop();
                        Tone.Transport.cancel();
                    };
                }, []);

                // 演奏ループ
                React.useEffect(() => {
                    Tone.Transport.bpm.value = bpm;
                    Tone.Transport.cancel();

                    if (playing) {
                        let stepCounter = 0;
                        loopRef.current = new Tone.Loop(time => {
                            let step = stepCounter % TOTAL_STEPS;
                            const bar = Math.floor(step / BAR_STEPS);
                            const sInBar = step % BAR_STEPS;

                            setCurrentStep(sInBar);
                            setCurrentBar(bar);

                            if (sInBar % 2 === 0) {
                                setFlashColor("border-orange-600");
                            }

                            const syns = synthsRef.current;
                            if (!syns) return;

                            Object.keys(instrumentSteps).forEach(instKey => {
                                const val = instrumentSteps[instKey][step];
                                if (!val) return;

                                if (instKey === "drums") {
                                    if (typeof val === "object") {
                                        Object.keys(val).forEach(partKey => {
                                            if (val[partKey] && syns.drums[partKey]) {
                                                syns.drums[partKey].triggerAttackRelease("C1", "8n", time);
                                            }
                                        });
                                    }
                                } else if (instKey === "subBass") {
                                    if (typeof val === "object") {
                                        Object.keys(val).forEach(partKey => {
                                            if (val[partKey] && syns.subBass[partKey]) {
                                                syns.subBass[partKey].triggerAttackRelease("C1", "8n", time);
                                            }
                                        });
                                    }
                                } else if (instKey === "rapVocals") {
                                    if (typeof val === "object") {
                                        Object.keys(val).forEach(partKey => {
                                            if (val[partKey] && syns.rapVocals[partKey]) {
                                                syns.rapVocals[partKey].triggerAttackRelease("C2", "16n", time);
                                            }
                                        });
                                    }
                                } else if (["trumpet", "synth", "violin", "piano", "guitar"].includes(instKey)) {
                                    const noteToPlay = typeof val === "string" ? val : "C3";
                                    if (syns[instKey]) {
                                        syns[instKey].triggerAttackRelease(noteToPlay, "8n", time);
                                    }
                                }
                            });

                            stepCounter++;
                        }, "16n").start(0);

                        Tone.Transport.start();
                    } else {
                        Tone.Transport.stop();
                    }
                }, [playing, bpm, instrumentSteps]);

                const togglePlay = async () => {
                    await Tone.start();
                    setPlaying(!playing);
                    setStatus(playing ? "⏸️ 停止しました" : `▶ 再生中 (BPM: ${bpm}) [DI: ${diMode}]`);
                };

                const toggleStep = (instKey, idx) => {
                    setInstrumentSteps(prev => {
                        const currentArr = [...prev[instKey]];
                        if (instKey === "drums") {
                            const currentObj = currentArr[idx] || {};
                            const updatedObj = { ...currentObj, [selectedDrumPart]: !currentObj[selectedDrumPart] };
                            currentArr[idx] = Object.values(updatedObj).some(Boolean) ? updatedObj : null;
                        } else if (instKey === "subBass") {
                            const currentObj = currentArr[idx] || {};
                            const updatedObj = { ...currentObj, [selectedBassPart]: !currentObj[selectedBassPart] };
                            currentArr[idx] = Object.values(updatedObj).some(Boolean) ? updatedObj : null;
                        } else if (instKey === "rapVocals") {
                            const currentObj = currentArr[idx] || {};
                            const updatedObj = { ...currentObj, [selectedRapPart]: !currentObj[selectedRapPart] };
                            currentArr[idx] = Object.values(updatedObj).some(Boolean) ? updatedObj : null;
                        } else {
                            currentArr[idx] = currentArr[idx] === selectedNote ? null : selectedNote;
                        }
                        return { ...prev, [instKey]: currentArr };
                    });
                };

                const playNoteLive = (instKey, note) => {
                    setSelectedNote(note);
                    const syns = synthsRef.current;
                    if (!syns) return;

                    if (instKey === "subBass") {
                        if (syns.subBass[selectedBassPart]) syns.subBass[selectedBassPart].triggerAttackRelease("C1", "8n");
                    } else if (instKey === "drums") {
                        if (syns.drums[selectedDrumPart]) syns.drums[selectedDrumPart].triggerAttackRelease("C1", "8n");
                    } else if (instKey === "rapVocals") {
                        if (syns.rapVocals[selectedRapPart]) syns.rapVocals[selectedRapPart].triggerAttackRelease("C2", "8n");
                    } else if (syns[instKey]) {
                        syns[instKey].triggerAttackRelease(note, "8n");
                    }
                };

                const clearSpecificInstrument = (instKey) => {
                    setInstrumentSteps(prev => ({ ...prev, [instKey]: new Array(TOTAL_STEPS).fill(null) }));
                    setStatus(`🗑️ 【${instKey}】をクリアしました`);
                };

                const clearAllSteps = () => {
                    const emptyMap = {};
                    Object.keys(instrumentSteps).forEach(k => { emptyMap[k] = new Array(TOTAL_STEPS).fill(null); });
                    setInstrumentSteps(emptyMap);
                    setStatus("🧹 すべてクリアしました");
                };

                // 各楽器・リズム・メロディ・ラップAI自動生成
                const generateAIForInstrument = (targetInst) => {
                    const newSteps = JSON.parse(JSON.stringify(instrumentSteps));
                    const arr = new Array(TOTAL_STEPS).fill(null);
                    const notesList = NOTES_MAP[register];

                    for (let s = 0; s < TOTAL_STEPS; s++) {
                        const sInBar = s % BAR_STEPS;

                        if (targetInst === "subBass") {
                            if (sInBar % 4 === 0 || sInBar === 6 || sInBar === 10 || sInBar === 14) {
                                arr[s] = { [selectedBassPart]: true };
                            }
                        } else if (targetInst === "drums") {
                            arr[s] = {
                                kick: sInBar % 4 === 0,
                                snare: sInBar === 4 || sInBar === 12,
                                hihat: sInBar % 2 === 0
                            };
                        } else if (targetInst === "rapVocals") {
                            if (sInBar % 2 === 0 || sInBar === 15) {
                                arr[s] = { [selectedRapPart]: true };
                            }
                        } else if (["trumpet", "synth", "violin", "piano", "guitar"].includes(targetInst)) {
                            if (sInBar % 2 === 0) {
                                arr[s] = notesList[(s / 2) % notesList.length];
                            }
                        }
                    }

                    newSteps[targetInst] = arr;
                    setInstrumentSteps(newSteps);
                    setStatus(`🤖 ✨ 【${targetInst}】のAIメロディ＆リズムを生成しました！`);
                };

                const generateAllAI = () => {
                    Object.keys(instrumentSteps).forEach(inst => generateAIForInstrument(inst));
                    setStatus("🔥 全楽器・リズム・メロディ・ラップAI一括自動生成完了！");
                };

                const saveCurrentSession = () => {
                    setSavedSlots({ ...savedSlots, [slotName]: JSON.parse(JSON.stringify(instrumentSteps)) });
                    setStatus(`💾 セッション「${slotName}」を保存しました！`);
                };

                const loadSession = (name) => {
                    if (savedSlots[name]) {
                        setInstrumentSteps(JSON.parse(JSON.stringify(savedSlots[name])));
                        setStatus(`📂 セッション「${name}」をロードしました！`);
                    }
                };

                const currentInstObj = INSTRUMENTS.find(i => i.id === selectedInstrument);

                return (
                    <div className={`min-h-screen bg-slate-950 text-slate-100 flex flex-col text-xs font-sans select-none border-8 transition-all duration-75 ${flashColor}`}>
                        <header className="bg-slate-900 border-b border-slate-800 px-3 py-2 flex items-center justify-between gap-2 sticky top-0 z-50 shadow-lg">
                            <span className="font-black text-sm bg-gradient-to-r from-amber-600 via-orange-500 to-red-600 bg-clip-text text-transparent">
                                MIC VICTORY <span className="text-[10px] text-orange-500 font-normal">v37.0 TRUMPET & RAP 20 AI</span>
                            </span>

                            <div className="flex items-center gap-1.5 flex-wrap">
                                <button onClick={togglePlay} className={`px-3 py-1 rounded font-bold text-xs shadow ${playing ? "bg-amber-600 text-white animate-bounce" : "bg-orange-700 text-white"}`}>
                                    {playing ? "■ 停止" : "▶ 再生"}
                                </button>
                                <button onClick={clearAllSteps} className="px-2.5 py-1 bg-red-950 hover:bg-red-900 text-red-300 rounded font-bold text-xs border border-red-800">
                                    🧹 クリア
                                </button>
                                <div className="flex items-center gap-1 bg-slate-950 px-2 py-0.5 rounded border border-slate-800">
                                    <span className="text-[9px] text-slate-400">BPM</span>
                                    <input type="number" value={bpm} onChange={e => setBpm(Math.max(40, Math.min(200, Number(e.target.value))))} className="w-12 bg-slate-900 text-center font-bold text-orange-500 rounded text-xs py-0.5" />
                                </div>
                            </div>
                        </header>

                        <nav className="bg-slate-900/90 border-b border-slate-800 px-2 py-1.5 flex gap-1 overflow-x-auto">
                            {[
                                { id: "DUAL_EDIT", label: "🎛️ 楽器＆DI・AIエディタ" },
                                { id: "MEMORY_LIST", label: "💾 セッション保存" },
                                { id: "JACKET", label: "💿 ジャケット" },
                            ].map(t => (
                                <button key={t.id} onClick={() => setTab(t.id)} className={`px-3 py-1 rounded text-center font-bold transition-all shrink-0 ${tab === t.id ? "bg-orange-600 text-white shadow" : "bg-slate-800/60 text-slate-400"}`}>
                                    {t.label}
                                </button>
                            ))}
                        </nav>

                        <div className="bg-slate-900/80 border-b border-slate-800 px-3 py-1 flex items-center justify-between flex-wrap gap-1">
                            <span className="text-[11px] text-orange-400">💡 {status}</span>
                            <button onClick={generateAllAI} className="px-3 py-1 bg-orange-700 hover:bg-orange-600 text-white font-bold rounded text-[10px] shadow">
                                ✨ 全楽器・リズム・ラップ一括AI自動生成
                            </button>
                        </div>

                        <main className="p-2 flex flex-col gap-3">
                            {tab === "DUAL_EDIT" && (
                                <div className="flex flex-col gap-3">
                                    {/* 楽器選択 ＆ DI切り替え */}
                                    <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3 shadow">
                                        <div className="flex justify-between items-center flex-wrap gap-2">
                                            <span className="text-xs font-bold text-orange-400">① 楽器セレクト & DI切替 (DI / Amp Sim / Tube)</span>
                                            <div className="flex gap-1">
                                                {[
                                                    { id: "DI_DIRECT", label: "🎛️ DI直結" },
                                                    { id: "DI_AMP_SIM", label: "🎸 アンプシミュ" },
                                                    { id: "DI_TUBE", label: "🔥 真空管サチュ" },
                                                ].map(di => (
                                                    <button key={di.id} onClick={() => setDiMode(di.id)} className={`px-2 py-1 rounded font-bold text-[10px] border transition-all ${diMode === di.id ? "bg-amber-600 text-white border-white shadow" : "bg-slate-950 text-slate-400 border-slate-800"}`}>
                                                        {di.label}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-8 gap-1.5">
                                            {INSTRUMENTS.map(inst => (
                                                <div key={inst.id} className="flex flex-col gap-1">
                                                    <button onClick={() => setSelectedInstrument(inst.id)} className={`py-2 px-1 rounded-lg font-bold text-[10px] transition-all border flex items-center justify-center gap-1 shadow ${selectedInstrument === inst.id ? `bg-gradient-to-r ${inst.color} border-white text-white ring-2 ring-white/30` : "bg-slate-950 border-slate-800 text-slate-400"}`}>
                                                        {inst.label}
                                                    </button>
                                                    <button onClick={() => generateAIForInstrument(inst.id)} className="py-1 px-1 bg-slate-800 hover:bg-amber-700 text-amber-300 rounded font-bold text-[9px] border border-slate-700 transition-all text-center">
                                                        🤖 AI作成
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    {/* 音域切り替え (トランペット・シンセ・バイオリン・ピアノ・ギター用) */}
                                    {["trumpet", "synth", "violin", "piano", "guitar"].includes(selectedInstrument) && (
                                        <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-2 shadow">
                                            <div className="flex justify-between items-center">
                                                <span className="text-xs font-bold text-amber-400">🎵 音域切り替え (高音・中音・低音)</span>
                                                <span className="text-[10px] text-cyan-400 font-bold">現在の選択: {register.toUpperCase()}</span>
                                            </div>
                                            <div className="grid grid-cols-3 gap-2">
                                                {[
                                                    { id: "low", label: "📉 低音 (Low)" },
                                                    { id: "mid", label: "🎹 中音 (Mid)" },
                                                    { id: "high", label: "📈 高音 (High)" },
                                                ].map(reg => (
                                                    <button key={reg.id} onClick={() => setRegister(reg.id)} className={`py-2 rounded font-bold text-xs border transition-all ${register === reg.id ? "bg-orange-600 text-white border-white shadow" : "bg-slate-950 text-slate-400 border-slate-800"}`}>
                                                        {reg.label}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    {/* ラップパーツ20種選択 */}
                                    {selectedInstrument === "rapVocals" && (
                                        <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-2 shadow">
                                            <span className="text-xs font-bold text-rose-400">🎤 ラップパーツ20種 選択</span>
                                            <div className="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-5 gap-1.5 max-h-[160px] overflow-y-auto p-1 bg-slate-950 rounded border border-slate-800">
                                                {RAP_PARTS.map(part => (
                                                    <button key={part.id} onClick={() => setSelectedRapPart(part.id)} className={`px-2 py-1.5 rounded font-bold text-[10px] text-left transition-all border ${selectedRapPart === part.id ? "bg-rose-600 text-white border-white shadow" : "bg-slate-900 text-slate-300 border-slate-800 hover:bg-slate-800"}`}>
                                                        {part.label}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    {/* ドレミファ鍵盤 (手動打ち込み ＆ 記録) */}
                                    {["trumpet", "synth", "violin", "piano", "guitar"].includes(selectedInstrument) && (
                                        <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-2 shadow">
                                            <span className="text-xs font-bold text-emerald-400">🎹 手動ドレミファ鍵盤 (クリックで試聴 ＆ グリッドに記録)</span>
                                            <div className="grid grid-cols-8 sm:grid-cols-15 gap-1 bg-slate-950 p-2 rounded border border-slate-800">
                                                {NOTES.map(note => (
                                                    <button key={note} onClick={() => playNoteLive(selectedInstrument, note)} className={`py-2 px-1 rounded font-bold text-[10px] flex flex-col items-center justify-center transition-all border ${selectedNote === note ? "bg-cyan-600 text-white border-white shadow" : "bg-slate-900 text-slate-300 border-slate-800 hover:bg-slate-800"}`}>
                                                        <span>{SOLFEGE[note] || note}</span>
                                                        <span className="text-[8px] text-slate-400">{note}</span>
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    {/* グリッドシーケンサー */}
                                    <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3 shadow">
                                        <div className="flex justify-between items-center">
                                            <span className="text-xs font-bold text-cyan-400">② グリッド編集 ({currentInstObj.label}) - 小節: {currentBar + 1} / 8</span>
                                            <div className="flex gap-1">
                                                {Array.from({ length: BARS }).map((_, b) => (
                                                    <button key={b} onClick={() => setCurrentBar(b)} className={`w-7 h-7 rounded-full text-xs font-bold ${currentBar === b ? "bg-orange-600 text-white" : "bg-slate-800 text-slate-400"}`}>{b + 1}</button>
                                                ))}
                                            </div>
                                        </div>

                                        <div className="flex flex-col gap-2 bg-slate-950 p-3 rounded border border-slate-800">
                                            <div className="overflow-x-auto py-1">
                                                <div className="grid gap-1 min-w-[540px]" style={{ gridTemplateColumns: "repeat(16, minmax(0, 1fr))" }}>
                                                    {Array.from({ length: BAR_STEPS }).map((_, i) => {
                                                        const stepIdx = currentBar * BAR_STEPS + i;
                                                        const stepVal = instrumentSteps[selectedInstrument][stepIdx];
                                                        const isCurrentPlay = playing && currentStep === i;
                                                        
                                                        let isActive = false;
                                                        if (selectedInstrument === "subBass") {
                                                            isActive = stepVal && stepVal[selectedBassPart];
                                                        } else if (selectedInstrument === "drums") {
                                                            isActive = stepVal && stepVal[selectedDrumPart];
                                                        } else if (selectedInstrument === "rapVocals") {
                                                            isActive = stepVal && stepVal[selectedRapPart];
                                                        } else {
                                                            isActive = !!stepVal;
                                                        }

                                                        return (
                                                            <button key={i} onClick={() => toggleStep(selectedInstrument, stepIdx)} className={`aspect-[3/4] w-full rounded border flex flex-col items-center justify-center text-[9px] transition-all ${isActive ? "bg-gradient-to-t from-orange-700 to-amber-600 border-white text-white font-bold shadow-md shadow-orange-900/50 scale-105" : "bg-slate-900 border-slate-800 text-slate-500"} ${isCurrentPlay ? "ring-2 ring-cyan-400" : ""}`}>
                                                                <span className="font-bold text-[10px]">{i + 1}</span>
                                                                {stepVal && ["trumpet", "synth", "violin", "piano", "guitar"].includes(selectedInstrument) && (
                                                                    <span className="text-[8px] text-amber-300">{SOLFEGE[stepVal] || ""}</span>
                                                                )}
                                                            </button>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {tab === "MEMORY_LIST" && (
                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3">
                                    <span className="text-xs font-bold text-emerald-400">💾 セッション保存・リスト切替ロード</span>
                                    <div className="flex gap-2 bg-slate-950 p-3 rounded border border-slate-800">
                                        <input type="text" value={slotName} onChange={e => setSlotName(e.target.value)} className="bg-slate-900 px-2 py-1 rounded text-slate-100 flex-1 border border-slate-800" />
                                        <button onClick={saveCurrentSession} className="px-4 py-1 bg-emerald-600 text-white font-bold rounded">保存</button>
                                    </div>
                                    <div className="flex flex-col gap-2 bg-slate-950 p-3 rounded border border-slate-800 max-h-[200px] overflow-y-auto">
                                        {Object.keys(savedSlots).length === 0 && (
                                            <span className="text-[11px] text-slate-500 text-center py-2">保存されたセッションはありません</span>
                                        )}
                                        {Object.keys(savedSlots).map(name => (
                                            <div key={name} className="flex justify-between items-center bg-slate-900 p-2 rounded border border-slate-800">
                                                <span className="font-bold text-orange-400 text-xs">{name}</span>
                                                <button onClick={() => loadSession(name)} className="px-2 py-1 bg-orange-600 text-white rounded text-[10px] font-bold">切替ロード</button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {tab === "JACKET" && (
                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-4 flex flex-col gap-4 items-center">
                                    <span className="text-xs font-bold text-cyan-400 self-start">💿 ジャケット＆リリース</span>
                                    <div className={`w-full max-w-sm aspect-square bg-gradient-to-br ${jacketColor} rounded-xl shadow-2xl p-6 flex flex-col justify-between items-center text-center border-4 border-white/20`}>
                                        <span className="font-black text-xs tracking-widest text-white/80">MIC VICTORY RECORDS</span>
                                        <div className="flex flex-col gap-1">
                                            <h2 className="text-xl font-black text-white">{jacketTitle}</h2>
                                            <span className="text-xs font-bold text-amber-300">{jacketGenre}</span>
                                        </div>
                                        <span className="text-[9px] text-white/70">PRODUCED BY MIKI TAKABE</span>
                                    </div>
                                </div>
                            )}
                        </main>
                    </div>
                );
            }

            const rootElement = document.getElementById('root');
            if (rootElement) {
                ReactDOM.createRoot(rootElement).render(<MasterSynthApp />);
            }
        } catch (err) {
            document.getElementById('root').innerHTML = `
                <div class="p-6 text-red-400 font-bold">
                    <h2 class="text-lg mb-2">⚠️ 起動エラー</h2>
                    <p class="text-xs text-slate-300">${err.message}</p>
                </div>
            `;
        }
    </script>
</body>
</html>
