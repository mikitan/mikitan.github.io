<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOUL, DISCO & ROBOT MASTER SYNTHESIZER v21</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tone.js for Sound Synthesis -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans select-none pb-16 overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        function MasterSynthApp() {
            const [tab, setTab] = React.useState("PLAY");
            const [playing, setPlaying] = React.useState(false);
            const [isLooping, setIsLooping] = React.useState(true);
            const [flashColor, setFlashColor] = React.useState("border-cyan-500");
            const [bpm, setBpm] = React.useState(145); // 超ハイテンポ初期値
            const [currentBar, setCurrentBar] = React.useState(0);
            const [currentStep, setCurrentStep] = React.useState(-1);
            const [status, setStatus] = React.useState("🔥 超ハイテンポ＆重低音・ステレオ・ロボットディスコ 準備完了！");

            const BARS = 8;
            const BAR_STEPS = 16;
            const TOTAL_STEPS = BARS * BAR_STEPS;

            const [selectedInstrument, setSelectedInstrument] = React.useState("drums");
            const [selectedNote, setSelectedNote] = React.useState("C4");
            const [selectedDrumPart, setSelectedDrumPart] = React.useState("kick");

            // 楽器ステップデータ
            const [instrumentSteps, setInstrumentSteps] = React.useState({
                drums: new Array(TOTAL_STEPS).fill(null),
                subBass: new Array(TOTAL_STEPS).fill(null), // 重低音サブベース
                robot: new Array(TOTAL_STEPS).fill(null),   // ロボット高低音FX
                bass: new Array(TOTAL_STEPS).fill(null),
                piano: new Array(TOTAL_STEPS).fill(null),
                synth: new Array(TOTAL_STEPS).fill(null),
                voice: new Array(TOTAL_STEPS).fill(null),
            });

            const [fxSettings, setFxSettings] = React.useState({
                reverbWet: 0.3,
                delayWet: 0.2,
                distortion: 0.4,
                stereoPan: 0
            });

            const synthsRef = React.useRef(null);
            const loopRef = React.useRef(null);
            const pannerRef = React.useRef(null);

            const NOTES = ["C4", "D4", "E4", "F4", "G4", "A4", "B4", "C5"];

            const INSTRUMENTS = [
                { id: "drums", label: "🥁 ドラム", color: "from-red-600 to-amber-600" },
                { id: "subBass", label: "🔊 重低音ベース", color: "from-amber-600 to-orange-700" },
                { id: "robot", label: "🤖 ロボットFX", color: "from-purple-600 to-pink-600" },
                { id: "bass", label: "🎸 ベース", color: "from-emerald-600 to-teal-600" },
                { id: "piano", label: "🎹 ピアノ", color: "from-blue-600 to-indigo-600" },
                { id: "synth", label: "🎹 シンセ", color: "from-cyan-600 to-blue-700" },
                { id: "voice", label: "🎤 ボイス", color: "from-rose-600 to-pink-700" },
            ];

            const DRUM_PARTS = [
                { id: "kick", label: "キック" },
                { id: "snare", label: "スネア" },
                { id: "hihat", label: "ハイハット" },
                { id: "clap", label: "クラップ" },
            ];

            // 21曲マスタープリセット
            const MASTER_21_PRESETS = [
                { id: 1, name: "1. 超ハイテンポ・ロボットディスコ", genre: "Dance", bpm: 150 },
                { id: 2, name: "2. アフロビーツ・サマーパーティ", genre: "Afro", bpm: 120 },
                { id: 3, name: "3. サタデーナイト・ディスコフィーバー", genre: "Disco", bpm: 118 },
                { id: 4, name: "4. エモーショナル・ラブバラード", genre: "Ballad", bpm: 72 },
                { id: 5, name: "5. ヘヴィメタル・アグレッシブロック", genre: "Rock", bpm: 150 },
                { id: 6, name: "6. スムースR&B・ミディアムグルーヴ", genre: "Soul", bpm: 95 },
                { id: 7, name: "7. フューチャー・ベースエレクトロ", genre: "Dance", bpm: 130 },
                { id: 8, name: "8. トライバル・ジャングルアフロ", genre: "Afro", bpm: 140 },
                { id: 9, name: "9. モータウン・ソウルアンセム", genre: "Soul", bpm: 112 },
                { id: 10, name: "10. スタジアム・ロックアンセム", genre: "Rock", bpm: 135 },
                { id: 11, name: "11. ピアノ・メランコリックバラード", genre: "Ballad", bpm: 68 },
                { id: 12, name: "12. サイケデリック・ファンク", genre: "Disco", bpm: 124 },
                { id: 13, name: "13. アマピアノ・クラブシャッフル", genre: "Dance", bpm: 114 },
                { id: 14, name: "14. アコースティック・サンセット", genre: "Pops", bpm: 88 },
                { id: 15, name: "15. エレクトリック・ダンス・フロア", genre: "Dance", bpm: 128 },
                { id: 16, name: "16. オールドスクール・ヒップホップ", genre: "Pops", bpm: 92 },
                { id: 17, name: "17. サンバ・カーニバルビート", genre: "Afro", bpm: 138 },
                { id: 18, name: "18. グランジ・オルタナティブロック", genre: "Rock", bpm: 142 },
                { id: 19, name: "19. ドリーミー・アンビエントバラード", genre: "Ballad", bpm: 60 },
                { id: 20, name: "20. スーパー・ハイテンポ・ブレイクビーツ", genre: "Dance", bpm: 165 },
                { id: 21, name: "21. 伝説のグランド・フィナーレ", genre: "Ballad", bpm: 80 },
            ];

            // 音響・シンセサイザーの初期化
            React.useEffect(() => {
                const masterGain = new Tone.Gain(1.2).toDestination();
                
                const panner = new Tone.Panner(0).connect(masterGain);
                pannerRef.current = panner;

                const reverb = new Tone.Reverb({ decay: 1.8, wet: fxSettings.reverbWet }).connect(panner);
                const delay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.25, wet: fxSettings.delayWet }).connect(reverb);
                const distortion = new Tone.Distortion(fxSettings.distortion).connect(delay);

                const subBassSynth = new Tone.MonoSynth({
                    oscillator: { type: "sawtooth" },
                    envelope: { attack: 0.005, decay: 0.3, sustain: 0.2, release: 0.2 },
                    filterEnvelope: { attack: 0.001, decay: 0.2, baseFrequency: 60, octaves: 4 }
                }).connect(distortion);

                const robotSynth = new Tone.Synth({
                    oscillator: { type: "square" },
                    envelope: { attack: 0.01, decay: 0.15, sustain: 0.2, release: 0.1 }
                }).connect(distortion);

                const kickSynth = new Tone.MembraneSynth({
                    pitchDecay: 0.05, octaves: 10, oscillator: { type: "sine" },
                    envelope: { attack: 0.001, decay: 0.6, sustain: 0.01, release: 0.4 }
                }).connect(masterGain);

                const snareSynth = new Tone.NoiseSynth({
                    noise: { type: "white" },
                    envelope: { attack: 0.001, decay: 0.2, sustain: 0 }
                }).connect(reverb);

                const hihatSynth = new Tone.MetalSynth({
                    frequency: 600, envelope: { attack: 0.001, decay: 0.04, release: 0.01 },
                    harmonicity: 5.5, modulationIndex: 40, resonance: 7000, octaves: 2.5
                }).connect(reverb);

                const clapSynth = new Tone.NoiseSynth({
                    noise: { type: "pink" },
                    envelope: { attack: 0.01, decay: 0.15, sustain: 0 }
                }).connect(reverb);

                const pianoSynth = new Tone.Synth({
                    oscillator: { type: "sine" },
                    envelope: { attack: 0.01, decay: 0.3, sustain: 0.3, release: 0.5 }
                }).connect(reverb);

                const synthLead = new Tone.Synth({
                    oscillator: { type: "square" },
                    envelope: { attack: 0.01, decay: 0.2, sustain: 0.4, release: 0.2 }
                }).connect(reverb);

                synthsRef.current = {
                    drums: { kick: kickSynth, snare: snareSynth, hihat: hihatSynth, clap: clapSynth },
                    subBass: subBassSynth,
                    robot: robotSynth,
                    piano: pianoSynth,
                    synth: synthLead,
                    masterGain,
                    reverb,
                    delay,
                    distortion
                };

                return () => {
                    Tone.Transport.stop();
                    Tone.Transport.cancel();
                };
            }, []);

            // エフェクト設定の反映
            React.useEffect(() => {
                const syns = synthsRef.current;
                if (!syns) return;
                syns.reverb.wet.value = fxSettings.reverbWet;
                syns.delay.wet.value = fxSettings.delayWet;
                syns.distortion.distortion = fxSettings.distortion;
                if (pannerRef.current) {
                    pannerRef.current.pan.value = fxSettings.stereoPan;
                }
            }, [fxSettings]);

            // トランスポート再生ループ
            React.useEffect(() => {
                Tone.Transport.bpm.value = bpm;
                Tone.Transport.cancel();

                if (playing) {
                    let stepCounter = 0;
                    loopRef.current = new Tone.Loop(time => {
                        let step = stepCounter % TOTAL_STEPS;
                        const bar = Math.floor(step / BAR_STEPS);
                        const sInBar = step % BAR_STEPS;

                        setCurrentStep(sInBar);
                        setCurrentBar(bar);

                        // ミラーボール風画面チカチカ演出
                        if (sInBar % 2 === 0) {
                            const colors = ["border-pink-500", "border-cyan-400", "border-yellow-400", "border-purple-500", "border-emerald-400"];
                            setFlashColor(colors[Math.floor(Math.random() * colors.length)]);
                        }

                        // ステレオオートパン
                        if (pannerRef.current) {
                            pannerRef.current.pan.value = Math.sin(stepCounter * 0.4) * 0.7;
                        }

                        const syns = synthsRef.current;
                        if (!syns) return;

                        Object.keys(instrumentSteps).forEach(instKey => {
                            const val = instrumentSteps[instKey][step];
                            if (!val) return;

                            if (instKey === "drums") {
                                if (typeof val === "object") {
                                    if (val.kick) syns.drums.kick.triggerAttackRelease("C1", "8n", time);
                                    if (val.snare) syns.drums.snare.triggerAttackRelease("8n", time);
                                    if (val.hihat) syns.drums.hihat.triggerAttackRelease("32n", time, 0.8);
                                    if (val.clap) syns.drums.clap.triggerAttackRelease("8n", time);
                                }
                            } else if (instKey === "subBass") {
                                syns.subBass.triggerAttackRelease("C1", "8n", time);
                            } else if (instKey === "robot") {
                                const robotNote = Math.random() > 0.5 ? "C6" : "C3";
                                syns.robot.triggerAttackRelease(robotNote, "16n", time);
                            } else if (syns[instKey]) {
                                syns[instKey].triggerAttackRelease(val, "8n", time);
                            }
                        });

                        stepCounter++;
                    }, "16n").start(0);

                    Tone.Transport.start();
                } else {
                    Tone.Transport.stop();
                }
            }, [playing, bpm, instrumentSteps]);

            const togglePlay = async () => {
                await Tone.start();
                setPlaying(!playing);
                setStatus(playing ? "停止しました" : `🔥 超ハイテンポ再生中 (BPM: ${bpm})`);
            };

            const toggleStep = (instKey, idx) => {
                setInstrumentSteps(prev => {
                    const currentArr = [...prev[instKey]];
                    if (instKey === "drums") {
                        const currentObj = currentArr[idx] || { kick: false, snare: false, hihat: false, clap: false };
                        const updatedObj = { ...currentObj, [selectedDrumPart]: !currentObj[selectedDrumPart] };
                        const hasAny = Object.values(updatedObj).some(Boolean);
                        currentArr[idx] = hasAny ? updatedObj : null;
                    } else if (instKey === "subBass" || instKey === "robot") {
                        currentArr[idx] = currentArr[idx] ? null : 1;
                    } else {
                        currentArr[idx] = currentArr[idx] ? null : selectedNote;
                    }
                    return { ...prev, [instKey]: currentArr };
                });
            };

            const applyMaster21Preset = (presetId) => {
                const preset = MASTER_21_PRESETS.find(p => p.id === presetId);
                setBpm(preset.bpm);

                const newDrums = new Array(TOTAL_STEPS).fill(null);
                const newSubBass = new Array(TOTAL_STEPS).fill(null);
                const newRobot = new Array(TOTAL_STEPS).fill(null);

                for (let s = 0; s < TOTAL_STEPS; s++) {
                    const sInBar = s % BAR_STEPS;
                    newDrums[s] = {
                        kick: sInBar % 4 === 0,
                        snare: sInBar === 4 || sInBar === 12,
                        hihat: true,
                        clap: sInBar === 12
                    };
                    if (sInBar % 4 === 0) newSubBass[s] = 1;
                    if (sInBar % 2 === 0) newRobot[s] = 1;
                }

                setInstrumentSteps(prev => ({
                    ...prev,
                    drums: newDrums,
                    subBass: newSubBass,
                    robot: newRobot
                }));
                setStatus(`🎵 【第${preset.id}曲】「${preset.name}」をロードしました！`);
            };

            const currentInstObj = INSTRUMENTS.find(i => i.id === selectedInstrument);

            return (
                <div className={`min-h-screen bg-slate-950 text-slate-100 flex flex-col text-xs font-sans select-none border-8 transition-all duration-75 ${flashColor}`}>
                    
                    {/* ヘッダー */}
                    <header className="bg-slate-900 border-b border-slate-800 px-3 py-2 flex items-center justify-between gap-2 sticky top-0 z-50 shadow-lg">
                        <div className="flex items-center gap-2">
                            <span className="font-black text-sm bg-gradient-to-r from-amber-400 via-pink-400 to-cyan-400 bg-clip-text text-transparent animate-pulse">
                                DISCO ROBOT SYNTH <span className="text-[10px] text-pink-400 font-normal">v21</span>
                            </span>
                        </div>

                        <div className="flex items-center gap-1.5">
                            <button
                                onClick={togglePlay}
                                className={`px-4 py-1 rounded font-bold text-xs shadow ${
                                    playing ? "bg-amber-400 text-slate-950 animate-bounce" : "bg-pink-600 text-white"
                                }`}
                            >
                                {playing ? "■ 停止" : "▶ 再生"}
                            </button>
                            
                            <div className="flex items-center gap-1 bg-slate-950 px-2 py-0.5 rounded border border-slate-800">
                                <span className="text-[9px] text-slate-400">BPM</span>
                                <input
                                    type="number"
                                    value={bpm}
                                    onChange={e => setBpm(Math.max(60, Math.min(220, Number(e.target.value))))}
                                    className="w-12 bg-slate-900 text-center font-bold text-pink-400 rounded text-xs py-0.5"
                                />
                            </div>
                        </div>
                    </header>

                    {/* タブナビゲーション */}
                    <nav className="bg-slate-900/90 border-b border-slate-800 px-2 py-1.5 flex gap-1 overflow-x-auto">
                        {[
                            { id: "PLAY", label: "🕺 メイン演奏・グリッド" },
                            { id: "PRESETS21", label: "🌟 全21曲マスター" },
                            { id: "MIXER", label: "🎚️ 音響・重低音・ステレオ" },
                        ].map(t => (
                            <button
                                key={t.id}
                                onClick={() => setTab(t.id)}
                                className={`px-3 py-1 rounded text-center font-bold transition-all shrink-0 ${
                                    tab === t.id ? "bg-amber-500 text-slate-950 shadow" : "bg-slate-800/60 text-slate-400"
                                }`}
                            >
                                {t.label}
                            </button>
                        ))}
                    </nav>

                    <div className="bg-slate-900/50 px-3 py-1 text-[11px] text-cyan-400 border-b border-slate-900 truncate">
                        <span>💡 {status}</span>
                    </div>

                    <main className="p-2 flex flex-col gap-3">

                        {tab === "PLAY" && (
                            <>
                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-2 flex flex-col gap-2">
                                    <span className="text-[11px] font-bold text-slate-300">🎵 楽器・エフェクト音源選択:</span>
                                    <div className="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-7 gap-1.5">
                                        {INSTRUMENTS.map(inst => (
                                            <button
                                                key={inst.id}
                                                onClick={() => setSelectedInstrument(inst.id)}
                                                className={`py-2 px-2 rounded-lg font-bold text-xs transition-all border flex items-center justify-center gap-1 shadow ${
                                                    selectedInstrument === inst.id
                                                        ? `bg-gradient-to-r ${inst.color} border-white text-white ring-2 ring-white/30`
                                                        : "bg-slate-950 border-slate-800 text-slate-400"
                                                }`}
                                            >
                                                {inst.label}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {selectedInstrument === "drums" && (
                                    <div className="bg-slate-900 border border-slate-800 rounded-lg p-2.5 flex items-center gap-2">
                                        <span className="text-[11px] font-bold text-slate-300">ドラムパーツ:</span>
                                        <div className="flex gap-1.5 overflow-x-auto">
                                            {DRUM_PARTS.map(part => (
                                                <button
                                                    key={part.id}
                                                    onClick={() => setSelectedDrumPart(part.id)}
                                                    className={`px-3 py-1 rounded text-[11px] font-bold shrink-0 ${
                                                        selectedDrumPart === part.id ? "bg-red-600 text-white shadow" : "bg-slate-800 text-slate-300"
                                                    }`}
                                                >
                                                    {part.label}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-2 flex items-center justify-between">
                                    <span className="text-[11px] font-bold text-slate-300">
                                        小節: <strong className="text-pink-400">{currentBar + 1}小節目 / 8小節</strong>
                                    </span>
                                    <div className="flex gap-1">
                                        {Array.from({ length: BARS }).map((_, b) => (
                                            <button
                                                key={b}
                                                onClick={() => setCurrentBar(b)}
                                                className={`w-7 h-7 rounded-full text-xs font-bold ${
                                                    currentBar === b ? "bg-amber-500 text-slate-950" : "bg-slate-800 text-slate-400"
                                                }`}
                                            >
                                                {b + 1}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 overflow-x-auto">
                                    <div className="text-xs font-bold text-amber-400 mb-2">
                                        🎯 グリッドエディタ ({currentInstObj.label} / {currentBar + 1}小節)
                                    </div>
                                    <div className="grid gap-1 min-w-[540px]" style={{ gridTemplateColumns: "repeat(16, minmax(0, 1fr))" }}>
                                        {Array.from({ length: BAR_STEPS }).map((_, i) => {
                                            const stepIdx = currentBar * BAR_STEPS + i;
                                            const stepVal = instrumentSteps[selectedInstrument][stepIdx];
                                            const isCurrentPlay = playing && currentStep === i;

                                            let isActive = selectedInstrument === "drums" 
                                                ? (stepVal && stepVal[selectedDrumPart]) 
                                                : (selectedInstrument === "subBass" || selectedInstrument === "robot")
                                                ? !!stepVal
                                                : !!stepVal;

                                            return (
                                                <button
                                                    key={i}
                                                    onClick={() => toggleStep(selectedInstrument, stepIdx)}
                                                    className={`aspect-[3/4] w-full rounded border flex flex-col items-center justify-center text-[9px] transition-all ${
                                                        isActive
                                                            ? "bg-gradient-to-t from-amber-600 to-pink-600 border-white text-white font-bold shadow-md shadow-pink-500/50 scale-105"
                                                            : "bg-slate-950 border-slate-800 text-slate-500"
                                                    } ${isCurrentPlay ? "ring-2 ring-cyan-400" : ""}`}
                                                >
                                                    <span className="font-bold text-[10px]">{i + 1}</span>
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>
                            </>
                        )}

                        {tab === "PRESETS21" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3">
                                <div className="text-xs font-bold text-pink-400">🌟 全21曲マスタープリセット（超ハイテンポ＆ロボット対応）</div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2">
                                    {MASTER_21_PRESETS.map((preset) => (
                                        <button
                                            key={preset.id}
                                            onClick={() => applyMaster21Preset(preset.id)}
                                            className="p-2.5 bg-slate-950 border border-slate-800 hover:border-pink-500 rounded text-left flex flex-col gap-1 transition-all shadow"
                                        >
                                            <div className="flex justify-between items-center">
                                                <span className="font-bold text-slate-200 text-[11px]">{preset.name}</span>
                                                <span className="text-[9px] bg-pink-950 text-pink-300 px-1.5 py-0.5 rounded">{preset.genre}</span>
                                            </div>
                                            <span className="text-[10px] text-cyan-400">BPM: {preset.bpm} ⚡ 即時反映</span>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        {tab === "MIXER" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3">
                                <div className="text-xs font-bold text-cyan-400">🎚️ 重低音・ステレオ・FXエフェクト調整</div>
                                
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                    <div className="bg-slate-950 p-3 rounded border border-slate-800 flex flex-col gap-3">
                                        <span className="text-xs font-bold text-amber-400">🔊 空間・重低音パラメータ</span>
                                        
                                        <label className="text-[10px] text-slate-300 flex flex-col gap-1">
                                            ステレオ・ワイド (左右パンニング): {Math.round(fxSettings.stereoPan * 100)}%
                                            <input type="range" min="-1" max="1" step="0.1" value={fxSettings.stereoPan} onChange={e => setFxSettings({...fxSettings, stereoPan: Number(e.target.value)})} />
                                        </label>

                                        <label className="text-[10px] text-slate-300 flex flex-col gap-1">
                                            重低音歪み度 (Distortion): {Math.round(fxSettings.distortion * 100)}%
                                            <input type="range" min="0" max="1" step="0.05" value={fxSettings.distortion} onChange={e => setFxSettings({...fxSettings, distortion: Number(e.target.value)})} />
                                        </label>

                                        <label className="text-[10px] text-slate-300 flex flex-col gap-1">
                                            リバーブ (残響): {Math.round(fxSettings.reverbWet * 100)}%
                                            <input type="range" min="0" max="1" step="0.05" value={fxSettings.reverbWet} onChange={e => setFxSettings({...fxSettings, reverbWet: Number(e.target.value)})} />
                                        </label>
                                    </div>
                                </div>
                            </div>
                        )}

                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<MasterSynthApp />);
    </script>
</body>
</html>
