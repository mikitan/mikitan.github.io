<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rhythm Forge Pro - 18小節 & アフリカ楽器AI対応版</title>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tone.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body style="margin: 0; background: #121216;">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const BAR_STEPS = 16;
        const BARS = 18; // 18小節に対応
        const TOTAL_STEPS = BAR_STEPS * BARS; // 288ステップ

        const DRUM_ROWS = [
            { key: "djemb", label: "ジャンベ (Djembé)" },
            { key: "talking", label: "トーキングドラム" },
            { key: "shekere", label: "シェケレ" },
            { key: "kick", label: "Kick" },
            { key: "snare", label: "Snare" },
            { key: "hihat", label: "Hi-Hat" },
        ];

        function emptyNoteRow() {
            return new Array(TOTAL_STEPS).fill(null);
        }

        function buildAfricanAiPattern() {
            const steps = {};
            DRUM_ROWS.forEach(r => {
                steps[r.key] = new Array(TOTAL_STEPS).fill(0);
            });
            // アフリカ風ポリリズムAI自動生成パターン
            for (let i = 0; i < TOTAL_STEPS; i++) {
                if (i % 6 === 0) steps.djemb[i] = 1;
                if (i % 12 === 3 || i % 12 === 9) steps.talking[i] = 1;
                if (i % 4 === 2) steps.shekere[i] = 1;
                if (i % 16 === 0) steps.kick[i] = 1;
                if (i % 16 === 8) steps.snare[i] = 1;
                if (i % 2 === 0) steps.hihat[i] = 1;
            }
            return steps;
        }

        function App() {
            const [playing, setPlaying] = useState(false);
            const [bpm, setBpm] = useState(110);
            const [currentStep, setCurrentStep] = useState(-1);
            const [currentBar, setCurrentBar] = useState(0);
            const [status, setStatus] = useState("準備完了");
            const [tab, setTab] = useState("DRUM");

            const [drumSteps, setDrumSteps] = useState(buildAfricanAiPattern);
            const [melodySteps, setMelodySteps] = useState(emptyNoteRow);
            const [recording, setRecording] = useState(false);
            const [recordList, setRecordList] = useState([]);

            const drumRef = useRef(drumSteps);
            drumRef.current = drumSteps;
            const melodyRef = useRef(melodySteps);
            melodyRef.current = melodySteps;
            const loopRef = useRef(null);

            // サウンドシンセの定義（アフリカ風パーカッション＋メロディ）
            const synths = useRef({
                djemb: new Tone.MembraneSynth({ pitchDecay: 0.03, octaves: 4 }).toDestination(),
                talking: new Tone.MembraneSynth({ pitchDecay: 0.08, octaves: 6 }).toDestination(),
                shekere: new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.001, decay: 0.05, sustain: 0 } }).toDestination(),
                kick: new Tone.MembraneSynth({ octaves: 6, pitchDecay: 0.05 }).toDestination(),
                snare: new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.001, decay: 0.15, sustain: 0 } }).toDestination(),
                hihat: new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.001, decay: 0.04, sustain: 0 } }).toDestination(),
                melody: new Tone.Synth().toDestination(),
            });

            useEffect(() => {
                return () => {
                    Object.values(synths.current).forEach(n => { try { n.dispose(); } catch(e){} });
                };
            }, []);

            // 再生ループ (18小節対応)
            useEffect(() => {
                Tone.Transport.bpm.value = bpm;
                if (loopRef.current) {
                    loopRef.current.dispose();
                    loopRef.current = null;
                }

                let stepCounter = 0;
                loopRef.current = new Tone.Loop((time) => {
                    const step = stepCounter % TOTAL_STEPS;
                    const bar = Math.floor(step / BAR_STEPS);

                    setCurrentStep(step);
                    setCurrentBar(bar);

                    const d = drumRef.current;
                    if (d.djemb[step]) synths.current.djemb.triggerAttackRelease("G1", "8n", time);
                    if (d.talking[step]) synths.current.talking.triggerAttackRelease("C2", "8n", time);
                    if (d.shekere[step]) synths.current.shekere.triggerAttackRelease("16n", time);
                    if (d.kick[step]) synths.current.kick.triggerAttackRelease("C1", "8n", time);
                    if (d.snare[step]) synths.current.snare.triggerAttackRelease("8n", time);
                    if (d.hihat[step]) synths.current.hihat.triggerAttackRelease("16n", time);

                    const m = melodyRef.current[step];
                    if (m) {
                        synths.current.melody.triggerAttackRelease(m, "8n", time);
                    }

                    stepCounter++;
                }, "16n").start(0);

                return () => { if (loopRef.current) loopRef.current.dispose(); };
            }, [bpm]);

            const togglePlay = async () => {
                await Tone.start();
                if (playing) {
                    Tone.Transport.stop();
                    setPlaying(false);
                    setCurrentStep(-1);
                } else {
                    Tone.Transport.start();
                    setPlaying(true);
                }
            };

            const handleDrumClick = (key, stepIdx) => {
                setDrumSteps(prev => {
                    const copy = { ...prev };
                    copy[key] = [...copy[key]];
                    copy[key][stepIdx] = copy[key][stepIdx] ? 0 : 1;
                    return copy;
                });
            };

            const generateAiPattern = () => {
                setDrumSteps(buildAfricanAiPattern());
                // メロディのAI自動生成
                const newMelody = emptyNoteRow();
                const scale = ["C4", "D4", "F4", "G4", "A4", "C5"];
                for (let i = 0; i < TOTAL_STEPS; i += 4) {
                    if (Math.random() > 0.4) {
                        newMelody[i] = scale[Math.floor(Math.random() * scale.length)];
                    }
                }
                setMelodySteps(newMelody);
                setStatus("🤖 アフリカ楽器・メロディAI生成完了！");
            };

            const clearAll = () => {
                setDrumSteps(buildAfricanAiPattern()); // 初期化
                setMelodySteps(emptyNoteRow());
                setStatus("データをクリアしました");
            };

            const toggleRecord = () => {
                if (!recording) {
                    setRecording(true);
                    setStatus("🔴 録音中...");
                } else {
                    setRecording(false);
                    const newItem = `録音セッション_${Date.now().toString().slice(-4)}`;
                    setRecordList(prev => [...prev, newItem]);
                    setStatus("💾 録音リストに追加しました");
                }
            };

            return (
                <div style={{ background: "#121216", color: "#f0f0f5", minHeight: "100vh", fontFamily: "sans-serif", padding: "16px" }}>
                    <h1 style={{ fontSize: "1.4rem", color: "#00ffcc", marginBottom: "4px" }}>🌍 アフリカ太鼓 & メロディ AI DAW (1-18小節)</h1>
                    <p style={{ fontSize: "0.8rem", color: "#aaa", marginBottom: "12px" }}>ジャンベ、トーキングドラム、シェケレ、AI自動合成対応</p>

                    {/* コントロール・トランスポートバー */}
                    <div style={{ background: "#1c1c24", padding: "10px", borderRadius: "8px", display: "flex", flexWrap: "wrap", gap: "10px", alignItems: "center", marginBottom: "12px" }}>
                        <button onClick={togglePlay} style={{ background: playing ? "#ff4444" : "#00ffcc", color: "#121216", border: "none", padding: "8px 14px", borderRadius: "4px", fontWeight: "bold", cursor: "pointer" }}>
                            {playing ? "⏹ STOP" : "▶ PLAY"}
                        </button>
                        <button onClick={generateAiPattern} style={{ background: "#7928ca", color: "#fff", border: "none", padding: "8px 12px", borderRadius: "4px", fontWeight: "bold", cursor: "pointer" }}>
                            ✨ AI全体生成
                        </button>
                        <button onClick={clearAll} style={{ background: "#444", color: "#fff", border: "none", padding: "8px 12px", borderRadius: "4px", cursor: "pointer" }}>
                            🧹 CLEAR
                        </button>
                        <button onClick={toggleRecord} style={{ background: recording ? "#ff0077" : "#0070f3", color: "#fff", border: "none", padding: "8px 12px", borderRadius: "4px", cursor: "pointer" }}>
                            {recording ? "⏹ 録音停止" : "🎙 録音"}
                        </button>
                        <div>
                            <label style={{ fontSize: "0.8rem", marginRight: "6px" }}>BPM: {bpm}</label>
                            <input type="range" min="80" max="160" value={bpm} onChange={e => setBpm(Number(e.target.value))} />
                        </div>
                        <span style={{ fontSize: "0.8rem", color: "#00ffcc" }}>{status}</span>
                    </div>

                    {/* タブナビゲーション */}
                    <div style={{ display: "flex", gap: "6px", marginBottom: "12px", borderBottom: "1px solid #2a2a35", paddingBottom: "6px" }}>
                        {["DRUM", "MELODY", "LIST"].map(t => (
                            <button key={t} onClick={() => setTab(t)} style={{ background: tab === t ? "#00ffcc" : "#2a2a35", color: tab === t ? "#121216" : "#aaa", border: "none", padding: "6px 12px", borderRadius: "4px", fontWeight: "bold", cursor: "pointer" }}>
                                {t === "DRUM" ? "アフリカ太鼓・リズム" : t === "MELODY" ? "メロディAI編集" : "録音リスト"}
                            </button>
                        ))}
                    </div>

                    {/* ドラム/パーカッションタブ (18小節・全288ステップ) */}
                    {tab === "DRUM" && (
                        <div style={{ background: "#1c1c24", padding: "12px", borderRadius: "8px", overflowX: "auto" }}>
                            <h3 style={{ fontSize: "0.95rem", marginBottom: "8px" }}>現在位置: 第 {currentBar + 1} 小節 / 全 {BARS} 小節</h3>
                            {DRUM_ROWS.map(row => (
                                <div key={row.key} style={{ display: "flex", alignItems: "center", marginBottom: "6px" }}>
                                    <span style={{ width: "130px", fontSize: "0.75rem", fontWeight: "bold" }}>{row.label}</span>
                                    <div style={{ display: "flex", gap: "2px" }}>
                                        {drumSteps[row.key].map((val, idx) => {
                                            const isCurrent = currentStep === idx;
                                            const isBarStart = idx % BAR_STEPS === 0;
                                            return (
                                                <div
                                                    key={idx}
                                                    onClick={() => handleDrumClick(row.key, idx)}
                                                    style={{
                                                        width: "16px",
                                                        height: "24px",
                                                        background: val ? "#00ffcc" : "#2a2a35",
                                                        border: isCurrent ? "2px solid #ff0077" : isBarStart ? "1px solid #777" : "1px solid #333",
                                                        borderRadius: "2px",
                                                        cursor: "pointer",
                                                    }}
                                                />
                                            );
                                        })}
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}

                    {/* メロディAI編集タブ */}
                    {tab === "MELODY" && (
                        <div style={{ background: "#1c1c24", padding: "12px", borderRadius: "8px", overflowX: "auto" }}>
                            <h3 style={{ fontSize: "0.95rem", marginBottom: "8px" }}>メロディ シーケンサー (1〜18小節)</h3>
                            <div style={{ display: "flex", gap: "2px", flexWrap: "wrap" }}>
                                {melodySteps.map((note, idx) => {
                                    const isCurrent = currentStep === idx;
                                    return (
                                        <div
                                            key={idx}
                                            onClick={() => {
                                                const copy = [...melodySteps];
                                                copy[idx] = copy[idx] ? null : "C4";
                                                setMelodySteps(copy);
                                            }}
                                            style={{
                                                width: "20px",
                                                height: "32px",
                                                background: note ? "#7928ca" : "#2a2a35",
                                                border: isCurrent ? "2px solid #00ffcc" : "1px solid #444",
                                                borderRadius: "3px",
                                                display: "flex",
                                                alignItems: "center",
                                                justifyContent: "center",
                                                fontSize: "0.6rem",
                                                color: "#fff",
                                                cursor: "pointer"
                                            }}
                                        >
                                            {note ? "♪" : ""}
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    )}

                    {/* 録音リストタブ */}
                    {tab === "LIST" && (
                        <div style={{ background: "#1c1c24", padding: "12px", borderRadius: "8px" }}>
                            <h3 style={{ fontSize: "0.95rem", marginBottom: "8px" }}>録音・編集リスト</h3>
                            {recordList.length === 0 ? (
                                <p style={{ fontSize: "0.8rem", color: "#aaa" }}>録音されたデータはありません。</p>
                            ) : (
                                recordList.map((item, index) => (
                                    <div key={index} style={{ background: "#2a2a35", padding: "8px", marginBottom: "6px", borderRadius: "4px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                                        <span style={{ fontSize: "0.85rem" }}>{item}</span>
                                        <button onClick={() => setRecordList(recordList.filter((_, i) => i !== index))} style={{ background: "#ff4444", color: "#fff", border: "none", padding: "4px 8px", borderRadius: "4px", fontSize: "0.75rem", cursor: "pointer" }}>削除</button>
                                    </div>
                                ))
                            )}
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
