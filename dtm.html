<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MIC VICTORY - AFRO POLYRHYTHM EVO v62.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        @keyframes afroPulse {
            0% { border-color: #d97706; box-shadow: 0 0 18px rgba(217, 119, 6, 0.5); }
            50% { border-color: #059669; box-shadow: 0 0 18px rgba(5, 150, 105, 0.5); }
            100% { border-color: #d97706; box-shadow: 0 0 18px rgba(217, 119, 6, 0.5); }
        }
        .illumi-live { animation: afroPulse 2.2s infinite linear; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans select-none pb-32 overflow-x-hidden text-sm">
    <div id="root"></div>

    <script type="text/babel">
        function AfroPolyVictoryEvo() {
            const [tab, setTab] = React.useState("MOBILE_20GRID");
            const [playing, setPlaying] = React.useState(false);
            const [illumiActive, setIllumiActive] = React.useState(true);
            const [manualRec, setManualRec] = React.useState(true);
            const [beatMode, setBeatMode] = React.useState("BEAT_18"); // アフリカ音楽変拍子・ポリリズム特化18ビート
            const [bpm, setBpm] = React.useState(116);
            const [creraParam, setCreraParam] = React.useState({ cutoff: 5800, resonance: 7, crush: 14 });
            const [currentStep, setCurrentStep] = React.useState(0);
            const [currentBar, setCurrentBar] = React.useState(0);
            const [status, setStatus] = React.useState("🌍 アフリカ太鼓・ポリリズムAI v62.0 待機中");

            const BARS = 8;
            const STEPS_PER_BAR = beatMode === "BEAT_18" ? 18 : 16;
            const TOTAL_STEPS = BARS * STEPS_PER_BAR;

            const INSTS = [
                { id: "djembeLow20", name: "🥁 ジェンベ低音(ドン20入)", color: "from-amber-600 to-red-800" },
                { id: "djembeHigh20", name: "🪘 ジェンベ高音(カッ20入)", color: "from-yellow-600 to-amber-700" },
                { id: "dondunDeep", name: "🔊 ドンドゥン重低音太鼓", color: "from-orange-700 to-stone-900" },
                { id: "kalimba20", name: "🎹 カリンバ/コラ安全音階(20入)", color: "from-emerald-600 to-teal-700" },
                { id: "shakerPoly20", name: "🌿 ポリリズム・シェーカー(20入)", color: "from-lime-600 to-green-700" },
                { id: "fluteEthnic20", name: "🎋 エスニック安全笛(20入)", color: "from-cyan-600 to-blue-700" },
            ];

            const [selectedInst, setSelectedInst] = React.useState("djembeLow20");
            const [selected20Index, setSelected20Index] = React.useState(0);
            const [noteDuration, setNoteDuration] = React.useState("16n");

            // ポリリズム×崩れないペンタトニックAIパレット(20種)
            const [ai20Library, setAi20Library] = React.useState(() => {
                const lib = {};
                INSTS.forEach(i => {
                    lib[i.id] = Array.from({ length: 20 }, (_, pIdx) => {
                        const arr = new Array(TOTAL_STEPS).fill(null);
                        const safeScale = ["C4", "Eb4", "F4", "G4", "Bb4", "C5"];
                        for (let s = 0; s < TOTAL_STEPS; s++) {
                            const sInBar = s % STEPS_PER_BAR;
                            // 3/4 or 6/8ウラ拍のポリリズム交差（最後尾真空スロット適度に確保）
                            if (sInBar < STEPS_PER_BAR - 1 && ((s + pIdx * 2) % 3 === 0 || sInBar === 0 || sInBar === 6 || sInBar === 12)) {
                                if (i.id.includes("Low") || i.id.includes("dondun")) {
                                    arr[s] = { note: "C1", dur: "16n", slot: pIdx + 1 };
                                } else if (i.id.includes("High")) {
                                    arr[s] = { note: "G1", dur: "16n", slot: pIdx + 1 };
                                } else {
                                    arr[s] = {
                                        note: safeScale[(s + pIdx) % safeScale.length],
                                        dur: "16n",
                                        slot: pIdx + 1
                                    };
                                }
                            }
                        }
                        return arr;
                    });
                });
                return lib;
            });

            const [activeGrid, setActiveGrid] = React.useState(() => {
                const init = {};
                INSTS.forEach(i => {
                    init[i.id] = new Array(TOTAL_STEPS).fill(null);
                    for (let s = 0; s < TOTAL_STEPS; s++) {
                        const sInBar = s % STEPS_PER_BAR;
                        if (sInBar < STEPS_PER_BAR - 1) {
                            if (i.id === "djembeLow20" && sInBar % 3 === 0) {
                                init[i.id][s] = { note: "C1", dur: "16n" };
                            } else if (i.id === "djembeHigh20" && (sInBar === 2 || sInBar === 8 || sInBar === 14)) {
                                init[i.id][s] = { note: "G1", dur: "16n" };
                            } else if (i.id === "kalimba20" && sInBar === 6) {
                                init[i.id][s] = { note: "G4", dur: "16n" };
                            }
                        }
                    }
                });
                return init;
            });

            const [tachoHistory, setTachoHistory] = React.useState(Array(36).fill(0));
            const synthsRef = React.useRef(null);
            const transportLoopRef = React.useRef(null);
            const NOTES = ["C4", "D4", "E4", "F4", "G4", "A4", "B4", "C5"];
            const SOLFEGE = { "C4": "ド", "D4": "レ", "E4": "ミ", "F4": "ファ", "G4": "ソ", "A4": "ラ", "B4": "シ", "C5": "ド" };

            React.useLayoutEffect(() => {
                const master = new Tone.Gain(1.15).toDestination();
                const filter = new Tone.Filter({ type: "lowpass", frequency: 5800, Q: 7 }).connect(master);
                const bitCrush = new Tone.BitCrusher(14).connect(filter);
                const reverb = new Tone.Reverb({ decay: 1.4, wet: 0.25 }).connect(bitCrush);

                synthsRef.current = {
                    filter, bitCrush, reverb,
                    lead: new Tone.PolySynth(Tone.Synth, {
                        oscillator: { type: "triangle" },
                        envelope: { attack: 0.003, decay: 0.12, sustain: 0.22, release: 0.09 }
                    }).connect(reverb),
                    sub: new Tone.MonoSynth({
                        oscillator: { type: "sine" },
                        envelope: { attack: 0.002, decay: 0.22, sustain: 0.45, release: 0.12 }
                    }).connect(reverb),
                    drum: new Tone.MembraneSynth({ pitchDecay: 0.04, octaves: 4.2 }).connect(reverb),
                };

                return () => { Tone.Transport.stop(); Tone.Transport.cancel(); };
            }, []);

            React.useEffect(() => {
                const effectiveBpm = beatMode === "HIGH_TEMPO_EVO" ? bpm * 1.45 : bpm;
                Tone.Transport.bpm.value = Math.max(50, effectiveBpm);
                Tone.Transport.cancel();

                if (playing) {
                    let counter = 0;
                    transportLoopRef.current = new Tone.Loop(time => {
                        const step = counter % TOTAL_STEPS;
                        const bar = Math.floor(step / STEPS_PER_BAR);
                        const sInBar = step % STEPS_PER_BAR;
                        setCurrentStep(sInBar);
                        setCurrentBar(bar);

                        const syns = synthsRef.current;
                        if (!syns) return;

                        let activeCount = 0;
                        INSTS.forEach(inst => {
                            const val = activeGrid[inst.id][step];
                            if (val) {
                                activeCount++;
                                if (inst.id.includes("Low") || inst.id.includes("Deep")) {
                                    syns.sub.triggerAttackRelease("C1", val.dur || "16n", time);
                                } else if (inst.id.includes("High") || inst.id.includes("Poly")) {
                                    syns.drum.triggerAttackRelease(sInBar % 2 === 0 ? "C1" : "G1", "16n", time);
                                } else {
                                    syns.lead.triggerAttackRelease(val.note || "C4", val.dur || "16n", time);
                                }
                            }
                        });

                        setTachoHistory(prev => [...prev.slice(1), activeCount * 25 + Math.round(Math.random() * 20)]);
                        counter++;
                    }, "16n").start(0);

                    Tone.Transport.start();
                } else {
                    Tone.Transport.stop();
                }
            }, [playing, bpm, beatMode, activeGrid]);

            const togglePlay = async () => {
                await Tone.start();
                setPlaying(!playing);
                setStatus(playing ? "⏸ 一時停止" : `▶ 再生中 (${beatMode} | BPM ${Math.round(beatMode === "HIGH_TEMPO_EVO" ? bpm * 1.45 : bpm)})`);
            };

            const aiInferenceNewOverallMelody = () => {
                setActiveGrid(() => {
                    const next = {};
                    INSTS.forEach(inst => {
                        const arr = new Array(TOTAL_STEPS).fill(null);
                        const safeScale = ["C4", "Eb4", "F4", "G4", "Bb4", "C5"];
                        for (let s = 0; s < TOTAL_STEPS; s++) {
                            const sInBar = s % STEPS_PER_BAR;
                            if (sInBar < STEPS_PER_BAR - 1 && (sInBar % 3 === 0 || sInBar % 4 === 0)) {
                                arr[s] = {
                                    note: inst.id.includes("Low") || inst.id.includes("Deep") ? "C1" : safeScale[Math.floor(Math.random() * safeScale.length)],
                                    dur: "16n",
                                    inferred: true
                                };
                            }
                        }
                        next[inst.id] = arr;
                    });
                    return next;
                });
                setStatus("🌍 アフリカ太鼓ポリリズムAI新曲を一括構築完了！");
            };

            const loadAi20PatternToActive = (instId, patternIndex) => {
                const patArr = ai20Library[instId][patternIndex];
                setActiveGrid(prev => ({
                    ...prev,
                    [instId]: [...patArr]
                }));
                setSelectedInst(instId);
                setSelected20Index(patternIndex);
                setStatus(`🤖 ${instId} のAIポリリズムパターン #${patternIndex + 1}（20入）を展開！`);
            };

            const manualPressNote = (note) => {
                const syns = synthsRef.current;
                if (!syns) return;

                if (selectedInst.includes("Low") || selectedInst.includes("Deep")) syns.sub.triggerAttackRelease("C1", noteDuration);
                else if (selectedInst.includes("High") || selectedInst.includes("Poly")) syns.drum.triggerAttackRelease("C1", "16n");
                else syns.lead.triggerAttackRelease(note, noteDuration);

                if (manualRec && currentStep !== -1) {
                    const stepIdx = currentBar * STEPS_PER_BAR + currentStep;
                    setActiveGrid(prev => {
                        const arr = [...prev[selectedInst]];
                        arr[stepIdx] = { note, dur: noteDuration, manual: true };
                        return { ...prev, [selectedInst]: arr };
                    });
                }
            };

            const applyCrera = (cutoff, res, crush) => {
                setCreraParam({ cutoff, resonance: res, crush });
                if (synthsRef.current) {
                    synthsRef.current.filter.frequency.value = cutoff;
                    synthsRef.current.filter.Q.value = res;
                    synthsRef.current.bitCrush.bits = Math.max(4, 16 - Math.round(crush / 8));
                }
            };

            return (
                <div className={`min-h-screen bg-slate-950 text-slate-100 flex flex-col text-sm font-sans select-none pb-32 overflow-x-hidden ${illumiActive ? "illumi-live" : ""}`}>
                    {/* TOP HEADER */}
                    <header className="bg-slate-900 border-b border-slate-800 px-3 py-2.5 flex items-center justify-between gap-2 sticky top-0 z-50">
                        <div className="flex flex-col">
                            <span className="font-black text-sm bg-gradient-to-r from-amber-400 via-emerald-400 to-yellow-300 bg-clip-text text-transparent">
                                AFRO POLYRHYTHM DLAND
                            </span>
                            <span className="text-[10px] text-amber-400 font-bold">ETHNIC TAIKO v62.0</span>
                        </div>
                        <div className="flex items-center gap-1.5">
                            <button onClick={() => setManualRec(!manualRec)} className={`px-2 py-1.5 rounded font-bold text-[11px] border ${manualRec ? "bg-red-950 border-red-500 text-red-200" : "bg-slate-900 border-slate-700 text-slate-400"}`}>
                                {manualRec ? "🔴手動記" : "⚪試聴"}
                            </button>
                            <button onClick={() => setIllumiActive(!illumiActive)} className={`px-2 py-1.5 rounded font-bold text-[11px] border ${illumiActive ? "bg-amber-600 text-slate-950" : "bg-slate-900 border-amber-500 text-amber-300"}`}>
                                🌍イルミ
                            </button>
                            <button onClick={togglePlay} className={`px-3 py-1.5 rounded font-bold text-xs shadow-lg ${playing ? "bg-amber-400 text-slate-950 animate-pulse" : "bg-emerald-600 text-white"}`}>
                                {playing ? "■ 停止" : "▶ 再生"}
                            </button>
                        </div>
                    </header>

                    {/* BEAT EVO / AI QUICK BAR */}
                    <div className="bg-slate-900/95 px-3 py-2 border-b border-slate-800 flex items-center justify-between gap-1 overflow-x-auto">
                        <div className="flex gap-1 shrink-0">
                            {[
                                { id: "STANDARD_16", label: "標準16" },
                                { id: "BEAT_18", label: "🔥18ビートポリ" },
                                { id: "HIGH_TEMPO_EVO", label: "⚡ハイテンポ進化" }
                            ].map(b => (
                                <button key={b.id} onClick={() => setBeatMode(b.id)} className={`px-2.5 py-1 rounded text-xs font-bold ${beatMode === b.id ? "bg-amber-500 text-slate-950" : "bg-slate-800 text-slate-400"}`}>
                                    {b.label}
                                </button>
                            ))}
                        </div>
                        <button onClick={aiInferenceNewOverallMelody} className="px-3 py-1 bg-gradient-to-r from-emerald-500 to-amber-500 text-slate-950 font-bold rounded text-xs shrink-0 shadow">
                            🧠AI推測アフロ新曲構築
                        </button>
                    </div>

                    {/* STATUS BAR */}
                    <div className="bg-slate-900/50 px-3 py-1.5 text-xs text-amber-400 border-b border-slate-900 flex justify-between items-center">
                        <span className="truncate">💡 {status}</span>
                        {playing && <span className="text-[11px] text-emerald-300 font-mono shrink-0 ml-2">BAR {currentBar + 1}/8 : STEP {currentStep + 1}/${STEPS_PER_BAR}</span>}
                    </div>

                    {/* MOBILE TAB NAV */}
                    <nav className="bg-slate-900/95 border-b border-slate-800 px-2 py-2 grid grid-cols-4 gap-1">
                        {[
                            { id: "MOBILE_20GRID", label: "🎹 太鼓&鍵盤" },
                            { id: "AI_20_ALL", label: "🤖 各楽器20入AI" },
                            { id: "OVERALL_TACHO", label: "📊 全体タコグラフ" },
                            { id: "CRERA_REALTIME", label: "🎛️ CRERA微調整" },
                        ].map(t => (
                            <button key={t.id} onClick={() => setTab(t.id)} className={`py-2 px-1 rounded text-xs font-bold leading-tight ${tab === t.id ? "bg-amber-500 text-slate-950 shadow" : "bg-slate-800/80 text-slate-300"}`}>
                                {t.label}
                            </button>
                        ))}
                    </nav>

                    <main className="p-3 flex flex-col gap-4">
                        {tab === "MOBILE_20GRID" && (
                            <div className="flex flex-col gap-3">
                                <div className="bg-slate-900 border border-slate-800 rounded-xl p-3 flex flex-col gap-2">
                                    <span className="text-xs font-bold text-amber-400">① アフリカ太鼓・民族楽器レイヤー選択</span>
                                    <div className="grid grid-cols-2 gap-2">
                                        {INSTS.map(inst => (
                                            <button key={inst.id} onClick={() => setSelectedInst(inst.id)} className={`py-2.5 px-2 rounded-lg font-bold text-xs border flex items-center justify-center shadow ${selectedInst === inst.id ? `bg-gradient-to-r ${inst.color} border-white text-white` : "bg-slate-950 border-slate-800 text-slate-400"}`}>
                                                {inst.name}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div className="bg-slate-900 border border-slate-800 rounded-xl p-3 flex flex-col gap-3">
                                    <div className="flex justify-between items-center">
                                        <span className="text-xs font-bold text-emerald-400">② 太鼓／カリンバ音階・打刻鍵盤（崩れなし）</span>
                                        <div className="flex gap-1 bg-slate-950 p-1 rounded border border-slate-800">
                                            {["16n", "8n", "4n", "2n"].map(d => (
                                                <button key={d} onClick={() => setNoteDuration(d)} className={`px-2 py-0.5 rounded text-[11px] font-bold ${noteDuration === d ? "bg-amber-500 text-slate-950" : "text-slate-400"}`}>
                                                    {d}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-4 gap-2">
                                        {NOTES.map(note => (
                                            <button key={note} onTouchStart={(e) => { e.preventDefault(); manualPressNote(note); }} onMouseDown={() => manualPressNote(note)} className="py-5 rounded-xl font-bold text-center border shadow-md bg-slate-950 text-slate-100 border-slate-800 active:scale-95 active:bg-amber-500 active:text-slate-950">
                                                <div className="text-base font-black">{SOLFEGE[note]}</div>
                                                <div className="text-[10px] opacity-70">{note}</div>
                                            </button>
                                        ))}
                                    </div>

                                    <div className="flex items-center justify-between bg-slate-950 p-2.5 rounded-lg border border-slate-800">
                                        <span className="text-xs text-slate-300">小節: <strong className="text-amber-400">{currentBar + 1} / {BARS}</strong></span>
                                        <div className="flex gap-1.5">
                                            {Array.from({ length: BARS }).map((_, b) => (
                                                <button key={b} onClick={() => setCurrentBar(b)} className={`w-7 h-7 rounded-full text-xs font-bold ${currentBar === b ? "bg-amber-500 text-slate-950" : "bg-slate-800 text-slate-400"}`}>{b + 1}</button>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="overflow-x-auto bg-slate-950 p-2.5 rounded-lg border border-slate-800">
                                        <div className="grid gap-1 min-w-[340px]" style={{ gridTemplateColumns: `repeat(${STEPS_PER_BAR}, minmax(0, 1fr))` }}>
                                            {Array.from({ length: STEPS_PER_BAR }).map((_, i) => {
                                                const sIdx = currentBar * STEPS_PER_BAR + i;
                                                const stepVal = activeGrid[selectedInst][sIdx];
                                                const isCurrent = playing && currentStep === i;
                                                return (
                                                    <button key={i} onClick={() => {
                                                        setActiveGrid(prev => {
                                                            const arr = [...prev[selectedInst]];
                                                            arr[sIdx] = arr[sIdx] ? null : { note: "C4", dur: noteDuration };
                                                            return { ...prev, [selectedInst]: arr };
                                                        });
                                                    }} className={`aspect-square rounded text-[10px] font-bold border flex items-center justify-center ${stepVal ? "bg-amber-600 border-white text-white" : "bg-slate-900 border-slate-800 text-slate-500"} ${isCurrent ? "ring-2 ring-emerald-400" : ""}`}>
                                                        {i + 1}
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {tab === "AI_20_ALL" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-xl p-3 flex flex-col gap-3">
                                <span className="text-xs font-bold text-amber-400">🤖 アフリカ太鼓ポリリズム 20入り AIパターン一括選択</span>
                                <div className="flex flex-col gap-3">
                                    {INSTS.map(inst => (
                                        <div key={inst.id} className="bg-slate-950 p-2.5 rounded-lg border border-slate-800 flex flex-col gap-2">
                                            <span className="text-xs font-bold text-emerald-300">{inst.name} (20ポリ入)</span>
                                            <div className="grid grid-cols-5 gap-1.5">
                                                {Array.from({ length: 20 }, (_, idx) => (
                                                    <button key={idx} onClick={() => loadAi20PatternToActive(inst.id, idx)} className={`py-2 rounded font-bold text-xs border ${selectedInst === inst.id && selected20Index === idx ? "bg-amber-500 text-slate-950 border-white" : "bg-slate-900 border-slate-800 text-slate-300"}`}>
                                                        #{idx + 1}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {tab === "OVERALL_TACHO" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-xl p-3 flex flex-col gap-3">
                                <div className="flex justify-between items-center">
                                    <span className="text-xs font-bold text-purple-400">📊 全体音楽タコグラフ ＆ 太鼓稼働推移</span>
                                    <span className="text-[10px] text-slate-400 font-mono">BEAT: {beatMode}</span>
                                </div>
                                <div className="h-32 bg-slate-950 rounded-xl border border-slate-800 p-2.5 flex items-end gap-1">
                                    {tachoHistory.map((val, idx) => (
                                        <div key={idx} className="flex-1 flex flex-col justify-end h-full">
                                            <div style={{ height: `${Math.min(100, Math.max(5, val))}%` }} className="bg-gradient-to-t from-emerald-500 to-amber-400 rounded-t-[1px]" />
                                        </div>
                                    ))}
                                </div>
                                <div className="grid grid-cols-1 gap-2">
                                    {INSTS.map(inst => (
                                        <div key={inst.id} className="bg-slate-950 p-2 rounded border border-slate-800 flex flex-col gap-1">
                                            <span className="text-[10px] font-bold text-slate-400">{inst.name} 稼働状況</span>
                                            <div className="grid gap-[1px]" style={{ gridTemplateColumns: `repeat(${STEPS_PER_BAR}, minmax(0, 1fr))` }}>
                                                {Array.from({ length: STEPS_PER_BAR }).map((_, stepIdx) => {
                                                    const isActive = !!activeGrid[inst.id][currentBar * STEPS_PER_BAR + stepIdx];
                                                    return (
                                                        <div key={stepIdx} className={`h-2.5 rounded-[1px] ${isActive ? "bg-amber-400" : "bg-slate-900"}`} />
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {tab === "CRERA_REALTIME" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-xl p-3 flex flex-col gap-4">
                                <span className="text-xs font-bold text-cyan-400">🎛️ CRERAリアルタイム周波数・アコースティック太鼓ウッド歪み</span>
                                <div className="flex flex-col gap-3 bg-slate-950 p-3 rounded-xl border border-slate-800">
                                    <div className="flex flex-col gap-1">
                                        <span className="text-xs text-amber-400">フィルターカットオフ: {creraParam.cutoff} Hz</span>
                                        <input type="range" min="1000" max="10000" step="300" value={creraParam.cutoff} onChange={e => applyCrera(Number(e.target.value), creraParam.resonance, creraParam.crush)} className="accent-amber-500" />
                                    </div>
                                    <div className="flex flex-col gap-1">
                                        <span className="text-xs text-emerald-400">レゾナンス Q: {creraParam.resonance}</span>
                                        <input type="range" min="1" max="14" step="1" value={creraParam.resonance} onChange={e => applyCrera(creraParam.cutoff, Number(e.target.value), creraParam.crush)} className="accent-emerald-500" />
                                    </div>
                                    <div className="flex flex-col gap-1">
                                        <span className="text-xs text-cyan-400">CRERAローファイ歪み: {creraParam.crush}%</span>
                                        <input type="range" min="0" max="50" step="5" value={creraParam.crush} onChange={e => applyCrera(creraParam.cutoff, creraParam.resonance, Number(e.target.value))} className="accent-cyan-500" />
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* FOOTER */}
                    <footer className="fixed bottom-0 left-0 right-0 bg-slate-950/95 border-t border-slate-800 px-3 py-2 flex justify-between items-center text-[10px] text-slate-500 z-50">
                        <span className="font-bold text-slate-300">MIC VICTORY AFRO POLY</span>
                        <span className="text-amber-400 font-bold">EVO v62.0</span>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<AfroPolyVictoryEvo />);
    </script>
</body>
</html>
