<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>RHYTHM FORGE - AI ACCOMPANIMENT STUDIO</title>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Tone.js -->
    <script src="https://unpkg.com/tone@14.7.77/build/Tone.js"></script>
    <!-- Babel for JSX -->
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; background: #06080d; color: #f0f0f5; font-family: sans-serif; }
        #root { min-height: 100vh; padding: 12px; box-sizing: border-box; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        const BAR_STEPS = 16;
        const BARS = 18;
        const TOTAL_STEPS = BAR_STEPS * BARS;

        // ドラム＆アフリカ太鼓・パーカッション
        const DRUM_ROWS = [
            { key: "kick", label: "🥁 KICK" },
            { key: "snare", label: "🎯 SNARE" },
            { key: "djembe", label: "🪵 DJEMBE" },
            { key: "conga", label: "🪘 CONGA" },
            { key: "shaker", label: "🪇 SHAKER" },
        ];

        // 伴奏レイヤー（ベース、コード、ストリングスなど、AI演奏に合わせて足せる楽器）
        const BASS_ROWS = [
            { key: "subbass", label: "🎸 SUB BASS" },
            { key: "synthchord", label: "🎹 SYNTH CHORD" },
            { key: "strings", label: "🎻 STRINGS" },
        ];

        const KEYBOARD_NOTES = ["C3", "D3", "Eb3", "F3", "G3", "Ab3", "Bb3", "C4", "D4", "Eb4", "F4", "G4", "Ab4", "Bb4", "C5"];

        function emptyDrumRow() { return new Array(TOTAL_STEPS).fill(0); }
        function emptyNoteRow() { return new Array(TOTAL_STEPS).fill(null); }

        function buildDefaultPattern() {
            const steps = {};
            DRUM_ROWS.forEach(r => { steps[r.key] = emptyDrumRow(); });
            for (let i = 0; i < TOTAL_STEPS; i++) {
                if (i % 16 === 0 || i % 16 === 10) steps.kick[i] = 1;
                if (i % 8 === 4) steps.snare[i] = 1;
                if (i % 4 === 2) steps.djembe[i] = 1;
                if (i % 2 === 0) steps.shaker[i] = 1;
            }
            return steps;
        }

        function App() {
            const [playing, setPlaying] = useState(false);
            const [bpm, setBpm] = useState(100);
            const [currentStep, setCurrentStep] = useState(-1);
            const [currentBar, setCurrentBar] = useState(0);
            const [status, setStatus] = useState("準備完了");
            const [tab, setTab] = useState("DRUM");

            // パターンデータ
            const [drumSteps, setDrumSteps] = useState(buildDefaultPattern);
            const [bassSteps, setBassSteps] = useState(() => {
                const b = {};
                BASS_ROWS.forEach(r => b[r.key] = emptyNoteRow());
                return b;
            });

            // 鍵盤入力用
            const [selectedBassInst, setSelectedBassInst] = useState("subbass");
            const [selectedNote, setSelectedNote] = useState("C3");

            // ラップ歌詞
            const [lyrics, setLyrics] = useState("【1-2小節】Yo! ビートに乗せて文字を紡ぐ\n【3-4小節】AIの伴奏に合わせてリリック解放");

            // 記録・リスト
            const [recording, setRecording] = useState(false);
            const [recordList, setRecordList] = useState([]);

            const drumRef = useRef(drumSteps);
            drumRef.current = drumSteps;
            const bassRef = useRef(bassSteps);
            bassRef.current = bassSteps;
            const loopRef = useRef(null);

            // Audio Synths
            const synths = useRef({
                kick: new Tone.MembraneSynth({ octaves: 5 }).toDestination(),
                snare: new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.001, decay: 0.15 } }).toDestination(),
                djembe: new Tone.MembraneSynth({ pitchDecay: 0.01, octaves: 3 }).toDestination(),
                conga: new Tone.MembraneSynth({ pitchDecay: 0.02, octaves: 2 }).toDestination(),
                shaker: new Tone.NoiseSynth({ noise: { type: "pink" }, envelope: { attack: 0.001, decay: 0.05 } }).toDestination(),
                
                subbass: new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.05, release: 0.2 } }).toDestination(),
                synthchord: new Tone.Synth({ oscillator: { type: "sawtooth" }, envelope: { attack: 0.02, release: 0.3 } }).toDestination(),
                strings: new Tone.Synth({ oscillator: { type: "triangle" }, envelope: { attack: 0.2, release: 0.5 } }).toDestination(),
            });

            useEffect(() => {
                Tone.Transport.bpm.value = bpm;
                if (loopRef.current) {
                    loopRef.current.dispose();
                    loopRef.current = null;
                }

                let stepCounter = 0;
                loopRef.current = new Tone.Loop((time) => {
                    const step = stepCounter % TOTAL_STEPS;
                    const bar = Math.floor(step / BAR_STEPS);

                    setCurrentStep(step);
                    setCurrentBar(bar);

                    // ドラム・太鼓再生
                    const d = drumRef.current;
                    if (d.kick && d.kick[step]) synths.current.kick.triggerAttackRelease("C1", "8n", time);
                    if (d.snare && d.snare[step]) synths.current.snare.triggerAttackRelease("8n", time);
                    if (d.djembe && d.djembe[step]) synths.current.djembe.triggerAttackRelease("G2", "8n", time);
                    if (d.conga && d.conga[step]) synths.current.conga.triggerAttackRelease("C3", "8n", time);
                    if (d.shaker && d.shaker[step]) synths.current.shaker.triggerAttackRelease("16n", time);

                    // 伴奏レイヤー再生
                    const b = bassRef.current;
                    BASS_ROWS.forEach(r => {
                        const note = b[r.key][step];
                        if (note) {
                            synths.current[r.key].triggerAttackRelease(note, "8n", time);
                        }
                    });

                    stepCounter++;
                }, "16n").start(0);

                return () => { if (loopRef.current) loopRef.current.dispose(); };
            }, [bpm]);

            const togglePlay = async () => {
                await Tone.start();
                if (playing) {
                    Tone.Transport.stop();
                    setPlaying(false);
                    setCurrentStep(-1);
                    setStatus("停止しました");
                } else {
                    Tone.Transport.start();
                    setPlaying(true);
                    setStatus("▶ 再生・リピート中 (18小節)");
                }
            };

            const handleDrumClick = (key, idx) => {
                setDrumSteps(prev => {
                    const copy = { ...prev };
                    copy[key] = [...copy[key]];
                    copy[key][idx] = copy[key][idx] ? 0 : 1;
                    return copy;
                });
            };

            const handleBassClick = (key, idx) => {
                setBassSteps(prev => {
                    const copy = { ...prev };
                    copy[key] = [...copy[key]];
                    copy[key][idx] = copy[key][idx] ? null : selectedNote;
                    return copy;
                });
            };

            // AI演奏に合わせて伴奏を自動で継ぎ足す（レイヤー追加）
            const aiAddAccompaniment = () => {
                setBassSteps(prev => {
                    const copy = { ...prev };
                    const notes = ["C3", "Eb3", "F3", "G3", "Bb3"];
                    BASS_ROWS.forEach(r => {
                        const arr = [...copy[r.key]];
                        for (let i = 0; i < TOTAL_STEPS; i += 4) {
                            if (Math.random() > 0.4) {
                                arr[i] = notes[Math.floor(Math.random() * notes.length)];
                            }
                        }
                        copy[r.key] = arr;
                    });
                    return copy;
                });
                setStatus("🤖 AIが自動伴奏レイヤーを継ぎ足しました！");
            };

            // ランダム自動生成
            const randomGenerate = () => {
                buildDefaultPattern();
                aiAddAccompaniment();
                setStatus("🎲 ランダムパターンを生成しました");
            };

            const clearAll = () => {
                setDrumSteps(buildDefaultPattern());
                const b = {};
                BASS_ROWS.forEach(r => b[r.key] = emptyNoteRow());
                setBassSteps(b);
                setStatus("🧹 すべてクリアしました");
            };

            const triggerScratch = () => {
                synths.current.synthchord.triggerAttackRelease("C2", "16n");
                setStatus("🎛 スクラッチ音！");
            };

            const toggleRecord = () => {
                if (!recording) {
                    setRecording(true);
                    setStatus("🔴 録音中...");
                } else {
                    setRecording(false);
                    const title = `セッション記録_${Date.now().toString().slice(-4)}`;
                    setRecordList(prev => [...prev, title]);
                    setStatus("💾 記録を保存しました");
                }
            };

            const previewGenre = (name) => {
                setStatus(`🎧 試聴中: ${name}スタイル`);
                togglePlay();
            };

            return (
                <div style={{ maxWidth: "880px", margin: "0 auto" }}>
                    <h1 style={{ fontSize: "1.1rem", color: "#00ffcc", marginBottom: "4px" }}>🎛 RHYTHM FORGE - AI伴奏スタジオ</h1>
                    <p style={{ fontSize: "0.75rem", color: "#aaa", marginBottom: "8px" }}>1〜18小節 画面編集・鍵盤入力・AI伴奏継ぎ足し・ラップ対応</p>

                    {/* コントロールパネル */}
                    <div style={{ background: "#121620", padding: "10px", borderRadius: "8px", display: "flex", flexWrap: "wrap", gap: "8px", alignItems: "center", marginBottom: "8px" }}>
                        <button onClick={togglePlay} style={{ background: playing ? "#ff4444" : "#00ffcc", color: "#121216", border: "none", padding: "8px 14px", borderRadius: "4px", fontWeight: "bold", cursor: "pointer" }}>
                            {playing ? "⏹ STOP" : "▶ PLAY / リピート"}
                        </button>
                        <button onClick={aiAddAccompaniment} style={{ background: "#7928ca", color: "#fff", border: "none", padding: "8px 10px", borderRadius: "4px", fontWeight: "bold", cursor: "pointer" }}>
                            🤖 AI伴奏継ぎ足し
                        </button>
                        <button onClick={randomGenerate} style={{ background: "#0070f3", color: "#fff", border: "none", padding: "8px 10px", borderRadius: "4px", cursor: "pointer" }}>
                            🎲 ランダム
                        </button>
                        <button onClick={triggerScratch} style={{ background: "#f5a623", color: "#121216", border: "none", padding: "8px 10px", borderRadius: "4px", fontWeight: "bold", cursor: "pointer" }}>
                            🎛 スクラッチ
                        </button>
                        <button onClick={clearAll} style={{ background: "#444", color: "#fff", border: "none", padding: "8px 10px", borderRadius: "4px", cursor: "pointer" }}>
                            🧹 CLEAR
                        </button>
                        <button onClick={toggleRecord} style={{ background: recording ? "#ff0077" : "#333", color: "#fff", border: "none", padding: "8px 10px", borderRadius: "4px", cursor: "pointer" }}>
                            {recording ? "⏹ 録音停止" : "🎙 記録"}
                        </button>

                        <div>
                            <span style={{ fontSize: "0.75rem", marginRight: "4px" }}>テンポ:{bpm}</span>
                            <input type="range" min="70" max="140" value={bpm} onChange={e => setBpm(Number(e.target.value))} style={{ width: "70px" }} />
                        </div>
                    </div>

                    {/* 試聴・ジャンルボタン */}
                    <div style={{ display: "flex", gap: "6px", marginBottom: "8px", alignItems: "center", flexWrap: "wrap" }}>
                        <span style={{ fontSize: "0.75rem", color: "#aaa" }}>試聴:</span>
                        {["アロエビート", "ヒップホップ", "ディスコソウル"].map(g => (
                            <button key={g} onClick={() => previewGenre(g)} style={{ background: "#222a3a", color: "#fff", border: "none", padding: "4px 8px", borderRadius: "4px", fontSize: "0.75rem", cursor: "pointer" }}>
                                🎧 {g}試聴
                            </button>
                        ))}
                        <span style={{ fontSize: "0.75rem", color: "#00ffcc", marginLeft: "auto" }}>{status}</span>
                    </div>

                    {/* タブ */}
                    <div style={{ display: "flex", gap: "6px", marginBottom: "8px", borderBottom: "1px solid #222a3a", paddingBottom: "6px" }}>
                        {["DRUM", "BASS_ACC", "KEYBOARD", "LYRICS", "LIST"].map(t => (
                            <button key={t} onClick={() => setTab(t)} style={{ background: tab === t ? "#00ffcc" : "#222a3a", color: tab === t ? "#121216" : "#aaa", border: "none", padding: "6px 10px", borderRadius: "4px", fontWeight: "bold", fontSize: "0.75rem", cursor: "pointer" }}>
                                {t === "DRUM" ? "ドラム・太鼓" : t === "BASS_ACC" ? "伴奏レイヤー" : t === "KEYBOARD" ? "鍵盤入力" : t === "LYRICS" ? "ラップ歌詞" : "記録リスト"}
                            </button>
                        ))}
                    </div>

                    {/* ドラム・太鼓タブ */}
                    {tab === "DRUM" && (
                        <div style={{ background: "#121620", padding: "10px", borderRadius: "8px", overflowX: "auto" }}>
                            <div style={{ fontSize: "0.75rem", marginBottom: "6px", color: "#00ffcc" }}>1〜18小節エディタ（現在: 第 {currentBar + 1} 小節）</div>
                            {DRUM_ROWS.map(row => (
                                <div key={row.key} style={{ display: "flex", alignItems: "center", marginBottom: "4px" }}>
                                    <span style={{ width: "95px", fontSize: "0.7rem", fontWeight: "bold" }}>{row.label}</span>
                                    <div style={{ display: "flex", gap: "2px" }}>
                                        {drumSteps[row.key] && drumSteps[row.key].map((val, idx) => {
                                            const isCurrent = currentStep === idx;
                                            const isBarStart = idx % BAR_STEPS === 0;
                                            return (
                                                <div
                                                    key={idx}
                                                    onClick={() => handleDrumClick(row.key, idx)}
                                                    style={{
                                                        width: "12px",
                                                        height: "22px",
                                                        background: val ? "#00ffcc" : "#222a3a",
                                                        border: isCurrent ? "2px solid #ff0077" : isBarStart ? "1px solid #777" : "1px solid #333",
                                                        borderRadius: "2px",
                                                        cursor: "pointer",
                                                    }}
                                                />
                                            );
                                        })}
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}

                    {/* 伴奏レイヤー追加タブ */}
                    {tab === "BASS_ACC" && (
                        <div style={{ background: "#121620", padding: "10px", borderRadius: "8px", overflowX: "auto" }}>
                            <div style={{ fontSize: "0.75rem", marginBottom: "6px", color: "#7928ca" }}>AI演奏やビートに重ねる「伴奏レイヤー」</div>
                            {BASS_ROWS.map(row => (
                                <div key={row.key} style={{ display: "flex", alignItems: "center", marginBottom: "4px" }}>
                                    <span style={{ width: "105px", fontSize: "0.7rem", fontWeight: "bold" }}>{row.label}</span>
                                    <div style={{ display: "flex", gap: "2px" }}>
                                        {bassSteps[row.key] && bassSteps[row.key].map((val, idx) => {
                                            const isCurrent = currentStep === idx;
                                            const isBarStart = idx % BAR_STEPS === 0;
                                            return (
                                                <div
                                                    key={idx}
                                                    onClick={() => handleBassClick(row.key, idx)}
                                                    title={val ? `Note: ${val}` : "Empty"}
                                                    style={{
                                                        width: "12px",
                                                        height: "22px",
                                                        background: val ? "#7928ca" : "#222a3a",
                                                        border: isCurrent ? "2px solid #00ffcc" : isBarStart ? "1px solid #777" : "1px solid #333",
                                                        borderRadius: "2px",
                                                        cursor: "pointer",
                                                    }}
                                                />
                                            );
                                        })}
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}

                    {/* 鍵盤入力タブ */}
                    {tab === "KEYBOARD" && (
                        <div style={{ background: "#121620", padding: "12px", borderRadius: "8px", textAlign: "center" }}>
                            <div style={{ marginBottom: "10px" }}>
                                <span style={{ fontSize: "0.75rem", marginRight: "6px" }}>対象楽器:</span>
                                {BASS_ROWS.map(r => (
                                    <button key={r.key} onClick={() => setSelectedBassInst(r.key)} style={{ background: selectedBassInst === r.key ? "#7928ca" : "#222a3a", color: "#fff", border: "none", padding: "4px 8px", borderRadius: "4px", fontSize: "0.75rem", marginRight: "4px", cursor: "pointer" }}>
                                        {r.label}
                                    </button>
                                ))}
                            </div>
                            <div style={{ marginBottom: "10px" }}>
                                <span style={{ fontSize: "0.75rem", marginRight: "6px" }}>選択音程: <b>{selectedNote}</b></span>
                            </div>
                            <div style={{ display: "flex", justifyContent: "center", gap: "4px", flexWrap: "wrap" }}>
                                {KEYBOARD_NOTES.map(note => (
                                    <button
                                        key={note}
                                        onClick={() => {
                                            setSelectedNote(note);
                                            synths.current[selectedBassInst].triggerAttackRelease(note, "8n");
                                        }}
                                        style={{
                                            background: selectedNote === note ? "#00ffcc" : "#fff",
                                            color: "#121216",
                                            border: "none",
                                            width: "36px",
                                            height: "70px",
                                            borderRadius: "4px",
                                            fontWeight: "bold",
                                            cursor: "pointer",
                                            fontSize: "0.75rem"
                                        }}
                                    >
                                        {note}
                                    </button>
                                ))}
                            </div>
                            <p style={{ fontSize: "0.70rem", color: "#aaa", marginTop: "8px" }}>鍵盤をクリックして音程を確認し、各グリッドに配置できます。</p>
                        </div>
                    )}

                    {/* ラップ歌詞タブ */}
                    {tab === "LYRICS" && (
                        <div style={{ background: "#121620", padding: "10px", borderRadius: "8px" }}>
                            <h3 style={{ fontSize: "0.85rem", marginBottom: "6px" }}>🎤 ラップリリック エディタ</h3>
                            <textarea
                                value={lyrics}
                                onChange={e => setLyrics(e.target.value)}
                                style={{ width: "100%", height: "120px", background: "#06080d", color: "#fff", border: "1px solid #333", borderRadius: "4px", padding: "8px", boxSizing: "border-box", fontSize: "0.85rem" }}
                            />
                        </div>
                    )}

                    {/* 記録リストタブ */}
                    {tab === "LIST" && (
                        <div style={{ background: "#121620", padding: "10px", borderRadius: "8px" }}>
                            <h3 style={{ fontSize: "0.85rem", marginBottom: "6px" }}>💾 記録・保存リスト</h3>
                            {recordList.length === 0 ? (
                                <p style={{ fontSize: "0.75rem", color: "#aaa" }}>保存された記録はありません。</p>
                            ) : (
                                recordList.map((item, index) => (
                                    <div key={index} style={{ background: "#222a3a", padding: "6px 8px", marginBottom: "4px", borderRadius: "4px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                                        <span style={{ fontSize: "0.8rem" }}>{item}</span>
                                        <button onClick={() => setRecordList(recordList.filter((_, i) => i !== index))} style={{ background: "#ff4444", color: "#fff", border: "none", padding: "3px 6px", borderRadius: "4px", fontSize: "0.7rem", cursor: "pointer" }}>削除</button>
                                    </div>
                                ))
                            )}
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
