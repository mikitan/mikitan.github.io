function emptyNoteRow() { return new Array(TOTAL_STEPS).fill(null); }
function patRow(presetObj, key) { return presetObj[key] || new Array(BAR_STEPS).fill(0); }
function buildFullDrum(presetName) {
  const p = DRUM_PRESETS[presetName];
  const o = {};
  DRUM_ROWS.forEach(r => {
    const row = new Array(TOTAL_STEPS).fill(0);
    const src = patRow(p, r.key);
    for (let i = 0; i < BAR_STEPS; i++) row[i] = src[i];
    o[r.key] = row;
  });
  return o;
}

// simple WAV encoder for an AudioBuffer
function bufferToWav(buffer) {
  const numCh = buffer.numberOfChannels;
  const len = buffer.length * numCh * 2 + 44;
  const arrBuf = new ArrayBuffer(len);
  const view = new DataView(arrBuf);
  const writeStr = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
  writeStr(0, "RIFF"); view.setUint32(4, len - 8, true); writeStr(8, "WAVE");
  writeStr(12, "fmt "); view.setUint32(16, 16, true); view.setUint16(20, 1, true);
  view.setUint16(22, numCh, true); view.setUint32(24, buffer.sampleRate, true);
  view.setUint32(28, buffer.sampleRate * numCh * 2, true); view.setUint16(32, numCh * 2, true);
  view.setUint16(34, 16, true); writeStr(36, "data"); view.setUint32(40, len - 44, true);
  let offset = 44;
  for (let i = 0; i < buffer.length; i++) {
    for (let ch = 0; ch < numCh; ch++) {
      let s = Math.max(-1, Math.min(1, buffer.getChannelData(ch)[i]));
      view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7fff, true);
      offset += 2;
    }
  }
  return new Blob([arrBuf], { type: "audio/wav" });
}

        kick.volume.value = volRef.current.kick; snareNoise.volume.value = volRef.current.snare;
        hihat.volume.value = volRef.current.hihat; snap.volume.value = volRef.current.snap;
        tom.volume.value = volRef.current.tom; electro.volume.value = volRef.current.electro; shaker.volume.value = volRef.current.shaker; bass.volume.value = volRef.current.bass;
        bassSub.volume.value = volRef.current.bass + (bassBoostRef.current ? 6 : 0);
        synthLead.volume.value = volRef.current.synth;
        ambient.volume.value = volRef.current.ambient;

        transport.bpm.value = bpm;
        for (let i = 0; i < TOTAL_STEPS; i++) {
          const t = i * secPerStep + (i % 2 === 1 ? swingAmt * secPerStep * 0.5 : 0);
          const d = drumRef.current;
          if (d.kick[i]) kick.triggerAttackRelease("C1", "8n", t);
          if (d.snare[i]) snareNoise.triggerAttackRelease("8n", t);
          if (d.hihat[i]) hihat.triggerAttackRelease("16n", t);
          if (d.snap[i]) snap.triggerAttackRelease("16n", t);
          if (d.tom[i]) tom.triggerAttackRelease("G1", "8n", t);
          if (d.electro[i]) electro.triggerAttackRelease("A2", "16n", t);
          if (d.shaker[i]) shaker.triggerAttackRelease("32n", t);
          const bn = bassRef.current[i];
          if (bn) { bass.triggerAttackRelease(bn, "8n", t); bassSub.triggerAttackRelease(Tone.Frequency(bn).transpose(-12), "8n", t); }
          const sn = synthRef.current[i];
          if (sn) synthLead.triggerAttackRelease(sn, "8n", t);
        }
        if (ambientOn) {
          const barsPerChord = progressionSpeedRef.current === "1m" ? 1 : 2;
          for (let bar = 0; bar < BARS; bar += barsPerChord) {
            const chord = progressionRef.current[Math.floor(bar / barsPerChord) % progressionRef.current.length];
            const t0 = bar * secPerStep * BAR_STEPS;
            const dur = secPerStep * BAR_STEPS * barsPerChord;
            if (ambientPulseRef.current) {
              const subdivisions = 8;
              for (let s = 0; s < subdivisions; s++) ambient.triggerAttackRelease(chord, "16n", t0 + s * (dur / subdivisions));
            } else {
              ambient.triggerAttackRelease(chord, dur, t0);
            }
            if (backChorusRef.current) {
              const chorusNotes = chord.map(n => Tone.Frequency(n).transpose(12).toNote());
              chorus.triggerAttackRelease(chorusNotes, dur, t0);
            }
          }
        }
      }, totalSec);

      const finalBuf = buffer.get();
      const layers = [
        [rapUrl, volumes.rap], [refUrl, 0], [bassRecUrl, volumes.bassrec], [drumRecUrl, volumes.drumrec], [guitarRecUrl, volumes.guitarrec],
      ];
      for (const [url, gainDb] of layers) {
        if (!url) continue;
        try { const src = await decodeUrlToBuffer(url); mixIn(finalBuf, src, gainDb); } catch (e) {}
      }

      if (robotizeAllRef.current) {
        const sr = finalBuf.sampleRate;
        for (let ch = 0; ch < finalBuf.numberOfChannels; ch++) {
          const data = finalBuf.getChannelData(ch);
          for (let i = 0; i < data.length; i++) data[i] *= Math.sin(2 * Math.PI * 35 * (i / sr));
        }
      }

      const wavBlob = bufferToWav(finalBuf);
      const url = URL.createObjectURL(wavBlob);
      const a = document.createElement("a");
      a.href = url; a.download = `${songName || "rhythm-forge"}.wav`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      if (navigator.share && navigator.canShare) {
        try {
          const file = new File([wavBlob], "rhythmforge.wav", { type: "audio/wav" });
          if (navigator.canShare({ files: [file] })) await navigator.share({ files: [file], title: "RHYTHM FORGE", text: `${songName || "曲"}を作曲しました🎵`, url: "https://mikitan.github.io/" });
        } catch (e) {}
      }
      setStatus("合成・書き出し完了");
    } catch (e) { setStatus("書き出しに失敗しました"); }
    setExporting(false);
