<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIC VICTORY - DLAND DTM v65.0 VOICE録音＆マルチAI＆DJスイート</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans select-none pb-24 overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        function MasterSynthApp() {
            const [tab, setTab] = React.useState("DUAL_EDIT");
            const [playing, setPlaying] = React.useState(false);
            const [flashColor, setFlashColor] = React.useState("border-cyan-500");
            const [bpm, setBpm] = React.useState(104);
            const [currentBar, setCurrentBar] = React.useState(0);
            const [currentStep, setCurrentStep] = React.useState(-1);
            const [status, setStatus] = React.useState("✨ v65.0 VOICE録音付きマルチAI＆DJ最高級スイート稼働中！");

            const [powerSavingMode, setPowerSavingMode] = React.useState(false);
            const [autoCacheEnabled, setAutoCacheEnabled] = React.useState(true);
            const [keyboardDirectWrite, setKeyboardDirectWrite] = React.useState(true);

            // 🎤 マイク音声リアルタイム録音関連ステート
            const [isVoiceRecording, setIsVoiceRecording] = React.useState(false);
            const [voiceAudioUrl, setVoiceAudioUrl] = React.useState(null);
            const mediaRecorderRef = React.useRef(null);
            const audioChunksRef = React.useRef([]);
            const voiceAudioRef = React.useRef(null);

            const [instrumentMutes, setInstrumentMutes] = React.useState({
                clickyBass: false, drums: false, subBass: false, chopperBass: false,
                elecGuitar: false, synth: false, violin: false, piano: false, africa1: false, rapLead: false
            });

            const [barsCount, setBarsCount] = React.useState(36);
            const BAR_STEPS = 16;
            const TOTAL_STEPS = barsCount * BAR_STEPS;

            const [selectedInstrument, setSelectedInstrument] = React.useState("piano");
            const [selectedNote, setSelectedNote] = React.useState("C4");
            const [selectedDuration, setSelectedDuration] = React.useState("8n");
            const [selectedDrumPart, setSelectedDrumPart] = React.useState("kick");
            const [aiStyle, setAiStyle] = React.useState("popping");

            const [creraList, setCreraList] = React.useState([
                { id: 1, title: "BLAUND 36小節全体記録＆鍵盤ダイレクト crera #1", bpm: 104, bars: 36, date: "12:00:00", credit: "micvictorydanb / 作曲: 32 / 著作権フリー" }
            ]);

            const [recordedTakes, setRecordedTakes] = React.useState([
                { id: 1, title: "36小節全体演奏テイク #1 (DJ対応)", bpm: 104, date: "12:01:00", credit: "micvictorydanb / 作曲: 32 / 著作権フリー" }
            ]);
            const [isRecording, setIsRecording] = React.useState(false);

            const [lyricThemeInput, setLyricThemeInput] = React.useState("鍵盤ダイレクト書き込み・新曲");
            const [additionalNoteInput, setAdditionalNoteInput] = React.useState("世界最高級音感 ポッピン・レゲエ全小節完全同期 BLAUND & MIC VICTORY");
            
            const [rapLyrics, setRapLyrics] = React.useState(
`[Intro - VOICE録音＆マルチAI＆DJエフェクト連動の新章]
鍵盤ダイレクト入力、マルチAI自動生成、そして最高級DJ効果音が融合！
販売：micvictorydanb ／ 作曲：32。著作権フリーの最高峰サウンド！

[Verse 1 - 躍動するリズム＆スクラッチ]
ポッピングダンス、ソウル、テクノ、ブラックコンテンポラリーの圧倒的グルーヴ！
BLAUNDの哲学、それは「世界最高級音感」による究極のダンス＆ヒップホップ！

[Chorus / Outro - BLAUND 永遠のゴールド・スタンダード]
著作権フリー、完全なる自由の光が世界を包み込む
BLAUND — 世界最高級音感、それは永遠の輝き
MIC VICTORY、私たちが描く未来に限界など存在しない！！`
            );

            const [masterBassBoost, setMasterBassBoost] = React.useState(16);
            const [masterVolume, setMasterVolume] = React.useState(1.35);
            const [reverbWet, setReverbWet] = React.useState(0.18);
            const [delayFeedback, setDelayFeedback] = React.useState(0.28);
            const [distortionAmount, setDistortionAmount] = React.useState(0.1);
            const [chorusWet, setChorusWet] = React.useState(0.3);

            const [dlandMode, setDlandMode] = React.useState(true);
            const [slotName, setSlotName] = React.useState("KEYBOARD_DIRECT_36_BARS_MICVICTORYDANB");

            const INSTRUMENTS = [
                { id: "piano", label: "🎹 グランドピアノ", color: "from-blue-600 to-indigo-600" },
                { id: "rapLead", label: "🎤 AIラップリード", color: "from-pink-600 to-rose-700" },
                { id: "drums", label: "🥁 ドラム", color: "from-red-600 to-amber-600" },
                { id: "clickyBass", label: "⚡ Clicky Bitベース", color: "from-yellow-500 to-red-600" },
                { id: "subBass", label: "🔊 重低音クレラベース", color: "from-amber-600 to-orange-700" },
                { id: "chopperBass", label: "🎸 チョッパーベース", color: "from-emerald-600 to-green-700" },
                { id: "elecGuitar", label: "🎸 エレキギター", color: "from-orange-600 to-red-700" },
                { id: "synth", label: "🎹 クリスタルシンセ", color: "from-cyan-600 to-blue-700" },
                { id: "violin", label: "🎻 バイオリン", color: "from-purple-600 to-indigo-700" },
                { id: "africa1", label: "🪘 ジャンベ", color: "from-amber-700 to-yellow-800" },
            ];

            const [instrumentSteps, setInstrumentSteps] = React.useState({
                clickyBass: new Array(TOTAL_STEPS).fill(null),
                drums: new Array(TOTAL_STEPS).fill(null),
                subBass: new Array(TOTAL_STEPS).fill(null),
                chopperBass: new Array(TOTAL_STEPS).fill(null),
                elecGuitar: new Array(TOTAL_STEPS).fill(null),
                synth: new Array(TOTAL_STEPS).fill(null),
                violin: new Array(TOTAL_STEPS).fill(null),
                piano: new Array(TOTAL_STEPS).fill(null),
                africa1: new Array(TOTAL_STEPS).fill(null),
                rapLead: new Array(TOTAL_STEPS).fill(null),
            });

            const [volumes, setVolumes] = React.useState({
                clickyBass: 4, drums: 3, subBass: 6, chopperBass: 4, elecGuitar: 3, synth: 0, violin: 2, piano: 0, africa1: 0, rapLead: 5
            });

            const synthsRef = React.useRef(null);
            const loopRef = React.useRef(null);
            const masterGainRef = React.useRef(null);
            const eqRef = React.useRef(null);
            const reverbRef = React.useRef(null);
            const delayRef = React.useRef(null);
            const distortionRef = React.useRef(null);
            const chorusRef = React.useRef(null);
            const instrumentGainsRef = React.useRef({});
            const directWriteStepIndexRef = React.useRef(0);

            const NOTES = ["C2", "D2", "E2", "F2", "G2", "A2", "B2", "C3", "C4", "E4", "G4", "A4"];
            const SOLFEGE = { "C2": "低ド", "D2": "低レ", "E2": "低ミ", "F2": "低ファ", "G2": "低ソ", "A2": "低ラ", "B2": "低シ", "C3": "低ド+", "C4": "ド", "E4": "ミ", "G4": "ソ", "A4": "ラ" };

            const changeBarsCount = (newBars) => {
                setBarsCount(newBars);
                const newTotalSteps = newBars * BAR_STEPS;
                setInstrumentSteps(prev => {
                    const updated = {};
                    Object.keys(prev).forEach(key => {
                        const oldArr = prev[key] || [];
                        if (oldArr.length >= newTotalSteps) {
                            updated[key] = oldArr.slice(0, newTotalSteps);
                        } else {
                            const expanded = [...oldArr, ...new Array(newTotalSteps - oldArr.length).fill(null)];
                            updated[key] = expanded;
                        }
                    });
                    return updated;
                });
                if (currentBar >= newBars) setCurrentBar(newBars - 1);
                setStatus(`➕ 小節数を ${newBars} 小節に変更しました！`);
            };

            const startFreshComposition = () => {
                if (!window.confirm(`これまでの全体記録や${barsCount}小節のグリッドをすべてリセットして、新しい作曲をスタートしますか？`)) return;
                
                setPlaying(false);
                const totalLen = barsCount * BAR_STEPS;
                const clearedSteps = {};
                Object.keys(instrumentSteps).forEach(k => {
                    clearedSteps[k] = new Array(totalLen).fill(null);
                });
                setInstrumentSteps(clearedSteps);
                setCreraList([]);
                setRecordedTakes([]);
                setVoiceAudioUrl(null);
                localStorage.removeItem("MIC_VICTORY_PLUS_AUTOCACHE_v65_0");
                setStatus(`✨ 全体記録をすべてクリアしました！新曲の作曲をスタートしましょう！`);
            };

            // 🎤 マイク音声リアルタイム録音機能
            const startVoiceRecording = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    audioChunksRef.current = [];
                    const mediaRecorder = new MediaRecorder(stream);
                    mediaRecorderRef.current = mediaRecorder;

                    mediaRecorder.ondataavailable = (e) => {
                        if (e.data.size > 0) audioChunksRef.current.push(e.data);
                    };

                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                        const url = URL.createObjectURL(audioBlob);
                        setVoiceAudioUrl(url);
                        setStatus("🎤 マイクボイス録音が完了しました！再生可能です。");
                    };

                    mediaRecorder.start();
                    setIsVoiceRecording(true);
                    setStatus("🔴 マイクボイス録音中...（もう一度押して停止）");
                } catch (err) {
                    alert("マイクアクセスの許可が必要です。");
                    console.error(err);
                }
            };

            const stopVoiceRecording = () => {
                if (mediaRecorderRef.current && isVoiceRecording) {
                    mediaRecorderRef.current.stop();
                    setIsVoiceRecording(false);
                }
            };

            const playVoiceAudio = () => {
                if (voiceAudioUrl) {
                    if (voiceAudioRef.current) voiceAudioRef.current.pause();
                    const audio = new Audio(voiceAudioUrl);
                    voiceAudioRef.current = audio;
                    audio.play();
                    setStatus("🔊 録音ボイス再生中...");
                }
            };

            const triggerDjEffect = (effectType) => {
                const syns = synthsRef.current;
                if (!syns) return;

                const now = Tone.now();
                if (effectType === "airhorn") {
                    const osc = new Tone.Oscillator(280, "sawtooth").connect(syns.eq).start(now).stop(now + 0.6);
                    osc.frequency.setValueAtTime(280, now);
                    osc.frequency.exponentialRampToValueAtTime(540, now + 0.15);
                    osc.frequency.exponentialRampToValueAtTime(220, now + 0.5);
                    setStatus("📢 DJ AIRHORN バースト！");
                } else if (effectType === "scratch") {
                    const noise = new Tone.Noise("white").connect(syns.eq).start(now).stop(now + 0.25);
                    const filter = new Tone.Filter(800, "bandpass").connect(syns.eq);
                    noise.connect(filter);
                    filter.frequency.setValueAtTime(400, now);
                    filter.frequency.linearRampToValueAtTime(3200, now + 0.12);
                    filter.frequency.linearRampToValueAtTime(200, now + 0.25);
                    setStatus("🎛️ DJ リアルスクラッチ！");
                } else if (effectType === "siren") {
                    const osc = new Tone.Oscillator(440, "sine").connect(syns.eq).start(now).stop(now + 1.2);
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.linearRampToValueAtTime(880, now + 0.3);
                    osc.frequency.linearRampToValueAtTime(440, now + 0.6);
                    osc.frequency.linearRampToValueAtTime(880, now + 0.9);
                    setStatus("🚨 DJ サイレンバースト！");
                } else if (effectType === "laser") {
                    const osc = new Tone.Oscillator(1200, "sawtooth").connect(syns.eq).start(now).stop(now + 0.3);
                    osc.frequency.exponentialRampToValueAtTime(80, now + 0.28);
                    setStatus("💥 DJ レーザーショット！");
                }
            };

            React.useEffect(() => {
                if (autoCacheEnabled) {
                    const cached = localStorage.getItem("MIC_VICTORY_PLUS_AUTOCACHE_v65_0");
                    if (cached) {
                        try {
                            const parsed = JSON.parse(cached);
                            if (parsed.instrumentSteps && parsed.instrumentSteps.drums) {
                                setInstrumentSteps(parsed.instrumentSteps);
                                setBarsCount(parsed.instrumentSteps.drums.length / 16);
                            }
                            if (parsed.rapLyrics) setRapLyrics(parsed.rapLyrics);
                            if (parsed.bpm) setBpm(parsed.bpm);
                            if (parsed.creraList) setCreraList(parsed.creraList);
                            if (parsed.recordedTakes) setRecordedTakes(parsed.recordedTakes);
                        } catch (e) {
                            console.error("Cache load error", e);
                        }
                    }
                }
            }, []);

            React.useEffect(() => {
                if (autoCacheEnabled) {
                    const cacheData = { instrumentSteps, rapLyrics, bpm, creraList, recordedTakes, updatedAt: new Date().toISOString() };
                    localStorage.setItem("MIC_VICTORY_PLUS_AUTOCACHE_v65_0", JSON.stringify(cacheData));
                }
            }, [instrumentSteps, rapLyrics, bpm, creraList, recordedTakes, autoCacheEnabled]);

            React.useEffect(() => {
                if (masterGainRef.current) masterGainRef.current.gain.value = masterVolume;
                if (eqRef.current) eqRef.current.low.value = masterBassBoost;
                if (reverbRef.current) reverbRef.current.wet.value = reverbWet;
                if (delayRef.current) delayRef.current.feedback.value = delayFeedback;
                if (distortionRef.current) distortionRef.current.distortion = distortionAmount;
                if (chorusRef.current) chorusRef.current.wet.value = chorusWet;

                Object.keys(instrumentMutes).forEach(instKey => {
                    if (instrumentGainsRef.current[instKey]) {
                        const isMuted = instrumentMutes[instKey];
                        instrumentGainsRef.current[instKey].gain.value = isMuted ? 0 : Tone.dbToGain(volumes[instKey] || 0);
                    }
                });
            }, [masterVolume, masterBassBoost, reverbWet, delayFeedback, distortionAmount, chorusWet, instrumentMutes, volumes]);

            React.useEffect(() => {
                const masterGain = new Tone.Gain(masterVolume).toDestination();
                masterGainRef.current = masterGain;

                const eq = new Tone.EQ3({ low: masterBassBoost, lowFrequency: 140, mid: 2.0, high: 3.0 }).connect(masterGain);
                eqRef.current = eq;

                const reverb = new Tone.Reverb({ decay: 1.8, wet: reverbWet }).connect(eq);
                reverbRef.current = reverb;

                const delay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: delayFeedback, wet: 0.22 }).connect(reverb);
                delayRef.current = delay;

                const chorus = new Tone.Chorus(4, 2.5, chorusWet).connect(delay);
                chorusRef.current = chorus;

                const distortion = new Tone.Distortion(distortionAmount).connect(chorus);
                distortionRef.current = distortion;

                const cGains = {};
                Object.keys(instrumentSteps).forEach(key => {
                    const cg = new Tone.Gain(instrumentMutes[key] ? 0 : Tone.dbToGain(volumes[key] || 0)).connect(distortion);
                    cGains[key] = cg;
                });
                instrumentGainsRef.current = cGains;

                synthsRef.current = {
                    clickyBass: new Tone.MonoSynth({
                        oscillator: { type: "sawtooth" },
                        envelope: { attack: 0.001, decay: 0.25, sustain: 0.2, release: 0.1 },
                        filterEnvelope: { attack: 0.001, decay: 0.15, sustain: 0.1, release: 0.1, baseFrequency: 120, octaves: 4.2, exponent: 2 }
                    }).connect(cGains.clickyBass),
                    subBass: new Tone.MonoSynth({
                        oscillator: { type: "sine" },
                        envelope: { attack: 0.005, decay: 0.5, sustain: 0.7, release: 0.3 },
                        filterEnvelope: { attack: 0.005, decay: 0.3, sustain: 0.4, release: 0.2, baseFrequency: 55, octaves: 2.0 }
                    }).connect(cGains.subBass),
                    chopperBass: new Tone.MonoSynth({
                        oscillator: { type: "square" },
                        envelope: { attack: 0.002, decay: 0.18, sustain: 0.1, release: 0.05 },
                        filterEnvelope: { attack: 0.002, decay: 0.12, sustain: 0.2, release: 0.05, baseFrequency: 200, octaves: 3.5 }
                    }).connect(cGains.chopperBass),
                    elecGuitar: new Tone.Synth({
                        oscillator: { type: "sawtooth" },
                        envelope: { attack: 0.005, decay: 0.25, sustain: 0.3, release: 0.1 }
                    }).connect(cGains.elecGuitar),
                    synth: new Tone.Synth({ oscillator: { type: "pulse", width: 0.45 }, envelope: { attack: 0.01, decay: 0.3, sustain: 0.45, release: 0.2 } }).connect(cGains.synth),
                    violin: new Tone.Synth({
                        oscillator: { type: "sawtooth" },
                        envelope: { attack: 0.05, decay: 0.3, sustain: 0.8, release: 0.3 }
                    }).connect(cGains.violin),
                    africa1: new Tone.MembraneSynth({ pitchDecay: 0.02, octaves: 4.5, oscillator: { type: "sine" }, envelope: { attack: 0.001, decay: 0.3, sustain: 0.01, release: 0.15 } }).connect(cGains.africa1),
                    piano: new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.008, decay: 0.4, sustain: 0.35, release: 0.45 } }).connect(cGains.piano),
                    rapLead: new Tone.Synth({ oscillator: { type: "triangle" }, envelope: { attack: 0.005, decay: 0.15, sustain: 0.2, release: 0.1 } }).connect(cGains.rapLead),
                    drums: {
                        kick: new Tone.MembraneSynth({ pitchDecay: 0.06, octaves: 6.5, oscillator: { type: "sine" }, envelope: { attack: 0.0001, decay: 0.4, sustain: 0.01, release: 0.15 } }).connect(cGains.drums),
                        snare: new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.0001, decay: 0.22, sustain: 0 } }).connect(cGains.drums),
                        hihat: new Tone.MetalSynth({ frequency: 950, envelope: { attack: 0.0005, decay: 0.03, release: 0.01 }, harmonicity: 5.2, modulationIndex: 34, resonance: 7500, octaves: 1.6 }).connect(cGains.drums),
                        clap: new Tone.NoiseSynth({ noise: { type: "pink" }, envelope: { attack: 0.005, decay: 0.15, sustain: 0 } }).connect(cGains.drums),
                    },
                    eq, reverb, distortion, chorus
                };

                return () => { Tone.Transport.stop(); Tone.Transport.cancel(); };
            }, []);

            React.useEffect(() => {
                Tone.Transport.bpm.value = bpm;
                Tone.Transport.cancel();

                if (playing) {
                    let stepCounter = 0;
                    const totalStepsLen = barsCount * BAR_STEPS;
                    loopRef.current = new Tone.Loop(time => {
                        let step = stepCounter % totalStepsLen;
                        const bar = Math.floor(step / BAR_STEPS);
                        const sInBar = step % BAR_STEPS;

                        setCurrentStep(sInBar);
                        setCurrentBar(bar);
                        directWriteStepIndexRef.current = step;

                        if (dlandMode && sInBar === 0 && !powerSavingMode) {
                            const colors = ["border-cyan-500", "border-pink-500", "border-amber-500", "border-yellow-500", "border-emerald-500"];
                            setFlashColor(colors[Math.floor(Math.random() * colors.length)]);
                        }

                        const syns = synthsRef.current;
                        if (!syns) return;

                        Object.keys(instrumentSteps).forEach(instKey => {
                            if (instrumentMutes[instKey]) return;
                            const item = instrumentSteps[instKey][step];
                            if (!item) return;

                            if (instKey === "drums") {
                                if (typeof item === "object") {
                                    if (item.kick) syns.drums.kick.triggerAttackRelease("C0", "8n", time);
                                    if (item.snare) syns.drums.snare.triggerAttackRelease("8n", time);
                                    if (item.hihat) syns.drums.hihat.triggerAttackRelease("32n", time, 0.9);
                                    if (item.clap) syns.drums.clap.triggerAttackRelease("8n", time);
                                }
                            } else {
                                const noteToPlay = item.note || "C2";
                                if (syns[instKey]) {
                                    syns[instKey].triggerAttackRelease(noteToPlay, item.dur || "8n", time);
                                }
                            }
                        });

                        stepCounter++;
                    }, "16n").start(0);

                    Tone.Transport.start();
                } else {
                    Tone.Transport.stop();
                }
            }, [playing, bpm, instrumentSteps, dlandMode, powerSavingMode, barsCount, instrumentMutes]);

            const togglePlay = async () => {
                await Tone.start();
                setPlaying(!playing);
                setStatus(playing ? "停止しました" : `▶ 再生中 (${barsCount}小節グリッド / BPM: ${bpm}) - v65.0`);
            };

            const saveToCrera = () => {
                const newCrera = {
                    id: Date.now(),
                    title: `BLAUND ${barsCount}小節 全体記録＆鍵盤ダイレクト crera #${creraList.length + 1} (${slotName})`,
                    bpm,
                    bars: barsCount,
                    date: new Date().toLocaleTimeString(),
                    credit: "micvictorydanb / 作曲: 32 / 著作権フリー",
                    instrumentSteps: JSON.parse(JSON.stringify(instrumentSteps)),
                    recordedTakesCount: recordedTakes.length
                };
                setCreraList(prev => [...prev, newCrera]);
                setStatus("🌊 crera ストレージに全体記録を完全保存しました！");
            };

            const syncAndLoadFromCrera = (creraItem) => {
                if (!creraItem) return;
                if (creraItem.instrumentSteps) {
                    setInstrumentSteps(creraItem.instrumentSteps);
                    const loadedBars = creraItem.instrumentSteps.drums ? (creraItem.instrumentSteps.drums.length / 16) : 36;
                    setBarsCount(loadedBars);
                }
                if (creraItem.bpm) {
                    setBpm(creraItem.bpm);
                }
                setStatus(`🌊 crera から「${creraItem.title}」の全体記録をロードしました！`);
            };

            const toggleRecord = async () => {
                await Tone.start();
                setIsRecording(!isRecording);
                if (!isRecording) {
                    setStatus("🔴 全体パフォーマンス録音中...");
                } else {
                    const newTake = {
                        id: Date.now(),
                        title: `BLAUND ${barsCount}小節全体パフォーマンス録音テイク #${recordedTakes.length + 1} (${slotName})`,
                        bpm,
                        date: new Date().toLocaleTimeString(),
                        credit: "micvictorydanb / 作曲: 32 / 著作権フリー"
                    };
                    setRecordedTakes(prev => [...prev, newTake]);
                    setStatus("⏹ 全体記録を完了し、テイクを保存しました！");
                }
            };

                        if (style === "popping") {

                            hihat = sInBar % 2 === 1;
                            clap = sInBar === 12;
                        } else if (style === "blackContemporary") {

                            snare = sInBar === 4 || sInBar === 12;
                            hihat = sInBar % 2 === 0;
                        }

                        }

                                                <div className="flex flex-col gap-0.5">
                                                    <span className="font-bold text-pink-300">{take.title}</span>
                                                    <span className="text-[10px] text-slate-400">BPM: {take.bpm} | {barsCount}小節 | 録音時刻: {take.date}</span>
                                                </div>
                                                <span className="px-2.5 py-1 bg-emerald-600 text-white font-bold rounded text-[10px]">保持中</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {tab === "RAP_AI" && (
                            <div className="flex flex-col gap-3">
                                {/* 🎤 マイク VOICE 録音＆再生コントロールパネル (ご指定の場所に追加) */}
                                <div className="bg-gradient-to-r from-slate-900 via-pink-950/40 to-slate-900 p-3 rounded-lg border border-pink-500/80 flex flex-col gap-2 shadow-xl">
                                    <div className="flex justify-between items-center flex-wrap gap-2">
                                        <span className="font-black text-xs text-pink-300 flex items-center gap-1">
                                            🎙️ リアルタイム Voice (マイク音声) 録音＆再生スイート
                                        </span>
                                        <div className="flex gap-2 items-center">
                                            {!isVoiceRecording ? (
                                                <button onClick={startVoiceRecording} className="px-3 py-1 bg-red-600 hover:bg-red-500 text-white font-black rounded text-[11px] shadow animate-pulse">
                                                    🎙️ マイク録音開始
                                                </button>
                                            ) : (
                                                <button onClick={stopVoiceRecording} className="px-3 py-1 bg-yellow-400 text-slate-950 font-black rounded text-[11px] shadow animate-bounce">
                                                    ⏹️ 録音停止
                                                </button>
                                            )}
                                            {voiceAudioUrl && (
                                                <button onClick={playVoiceAudio} className="px-3 py-1 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-black rounded text-[11px] shadow">
                                                    🔊 Voice再生
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-slate-900 p-4 rounded border border-slate-800 flex flex-col gap-3 shadow-lg">
                                    <h2 className="text-sm font-black bg-gradient-to-r from-yellow-400 via-pink-400 to-cyan-400 bg-clip-text text-transparent">
                                        🎤 宣伝歌詞 & AI自動作成
                                    </h2>
                                    <div className="bg-slate-950 p-3 rounded border border-slate-800 flex flex-col gap-2.5">
                                        <input type="text" value={lyricThemeInput} onChange={e => setLyricThemeInput(e.target.value)} placeholder="歌詞テーマ入力" className="w-full bg-slate-900 text-slate-200 px-3 py-2 rounded border border-slate-700 text-xs outline-none" />
                                        <div className="flex gap-2">
                                            <input type="text" value={additionalNoteInput} onChange={e => setAdditionalNoteInput(e.target.value)} placeholder="つけ足しPR" className="flex-1 bg-slate-900 text-slate-200 px-3 py-2 rounded border border-slate-700 text-xs outline-none" />
                                            <button onClick={appendLyricsAction} className="px-3 py-2 bg-purple-700 text-white font-bold rounded text-xs shrink-0">➕ つけ足し</button>
                                        </div>
                                        <button onClick={generateAi800Lyrics} className="w-full py-2.5 bg-gradient-to-r from-yellow-500 to-pink-600 text-white font-black rounded text-xs shadow">🤖 AI 宣伝歌詞作成</button>
                                    </div>
                                    <textarea value={rapLyrics} onChange={e => setRapLyrics(e.target.value)} rows={10} className="w-full bg-slate-950 text-slate-200 p-3 rounded border border-slate-800 font-mono text-xs" />
                                    <div className="flex justify-end">
                                        <button onClick={() => { navigator.clipboard.writeText(rapLyrics); }} className="px-4 py-2 bg-cyan-600 text-white font-bold rounded text-xs shadow">📋 歌詞をコピー</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {tab === "AUDIO_MIX" && (
                            <div className="flex flex-col gap-3">
                                <div className="bg-slate-900 p-4 rounded border border-slate-800 flex flex-col gap-3 shadow-lg">
                                    <h2 className="text-sm font-black bg-gradient-to-r from-yellow-400 via-pink-400 to-cyan-400 bg-clip-text text-transparent">
                                        🎚️ 音響機能調整 & FX（エフェクト）制御
                                    </h2>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        <div className="bg-slate-950 p-3 rounded border border-slate-800 flex flex-col gap-1.5">
                                            <div className="flex justify-between text-[11px]"><span className="text-slate-400">マスターボリューム</span><span className="font-bold text-pink-400">{masterVolume.toFixed(2)}x</span></div>
                                            <input type="range" min="0.5" max="2.0" step="0.05" value={masterVolume} onChange={e => setMasterVolume(Number(e.target.value))} className="w-full accent-pink-500" />
                                        </div>
                                        <div className="bg-slate-950 p-3 rounded border border-slate-800 flex flex-col gap-1.5">
                                            <div className="flex justify-between text-[11px]"><span className="text-slate-400">低音ブースト (重低音)</span><span className="font-bold text-yellow-400">{masterBassBoost} dB</span></div>
                                            <input type="range" min="0" max="24" step="1" value={masterBassBoost} onChange={e => setMasterBassBoost(Number(e.target.value))} className="w-full accent-yellow-500" />
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {tab === "MEMORY" && (
                            <div className="flex flex-col gap-3">
                                <div className="bg-slate-900 p-4 rounded border border-slate-800 flex flex-col gap-3">
                                    <h2 className="text-sm font-bold text-yellow-300">💾 プロジェクトファイル保存</h2>
                                    <input type="text" value={slotName} onChange={e => setSlotName(e.target.value)} className="w-full bg-slate-950 text-yellow-300 px-3 py-2 rounded border border-slate-800 font-mono text-xs font-bold" />
                                    <button onClick={exportProjectToFile} className="py-2.5 bg-gradient-to-r from-yellow-500 to-pink-600 font-black text-slate-950 rounded shadow">
                                        💾 プロジェクト保存 (JSON)
                                    </button>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.render(<MasterSynthApp />, document.getElementById("root"));
    </script>
</body>
</html>
