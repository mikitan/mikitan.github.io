<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIC VICTORY - DLAND DTM v100.0 崩差ない絶対 各楽器別AIメロディ作成特化 録音機能付き</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans select-none pb-24 overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        function MasterSynthApp() {
            const [tab, setTab] = React.useState("DUAL_EDIT");
            const [playing, setPlaying] = React.useState(false);
            const [flashColor, setFlashColor] = React.useState("border-cyan-500");
            const [bpm, setBpm] = React.useState(112);
            const [playbackRate, setPlaybackRate] = React.useState(1.0);
            const [currentBar, setCurrentBar] = React.useState(0);
            const [currentStep, setCurrentStep] = React.useState(-1);
            const [status, setStatus] = React.useState("✨ v100.0 崩差ない絶対 【内部＆外部録音機能付き】稼働中！");

            const [powerSavingMode, setPowerSavingMode] = React.useState(false);
            const [autoCacheEnabled, setAutoCacheEnabled] = React.useState(true);
            const [keyboardDirectWrite, setKeyboardDirectWrite] = React.useState(true);

            // 🎹 1押し連打モード（1打〜4打バースト）
            const [rapidHitCount, setRapidHitCount] = React.useState(1);

            // 🎛️ FX機能
            const [fxScratchActive, setFxScratchActive] = React.useState(false);
            const [fxRepeatActive, setFxRepeatActive] = React.useState(false);

            // 🎙️ 録音機能関連（内部ミックス録音 ＆ 外部マイク単体録音）
            const [currentRecordMode, setCurrentRecordMode] = React.useState('internal'); // 'internal' or 'external'
            const [isRecording, setIsRecording] = React.useState(false);
            const [recordedAudioList, setRecordedAudioList] = React.useState([]);
            const mediaRecorderRef = React.useRef(null);
            const audioChunksRef = React.useRef([]);

            // 楽器ミュート設定
            const [instrumentMutes, setInstrumentMutes] = React.useState({
                drums: false, synthLowBass: false, trumpet: false, africa: false,
                elecGuitar: false, violin: false, highLead: false, piano: false
            });

            // 🎚️ 各楽器ボリューム
            const [volumes, setVolumes] = React.useState({
                synthLowBass: 12, trumpet: 8, drums: 6, africa: 3,
                elecGuitar: 4, violin: 6, highLead: 6, piano: 3
            });

            const [barsCount, setBarsCount] = React.useState(38);
            const BAR_STEPS = 16;
            const TOTAL_STEPS = barsCount * BAR_STEPS;

            const [selectedInstrument, setSelectedInstrument] = React.useState("synthLowBass");
            const [selectedNote, setSelectedNote] = React.useState("C1");
            const [selectedDuration, setSelectedDuration] = React.useState("8n");
            const [selectedDrumPart, setSelectedDrumPart] = React.useState("kick");

            const [creraList, setCreraList] = React.useState([
                { id: 1, title: "崩差ない絶対 38小節 各楽器別AI crera #1", bpm: 112, bars: 38, date: "12:00:00", credit: "micvictorydanb / 作曲: 32 / 著作権フリー" }
            ]);

            const [rapLyrics, setRapLyrics] = React.useState(
`[Intro - 崩差ない絶対 各楽器別AIメロディ作成 micvictorybrand]
1曲38小節、選択中の楽器ごとに最適なAIメロディ＆リズムフレーズを個別生成！
ドッドッドットゥの躍動感と滑らかな旋律に合わせて、歌詞を見ながら熱唱。
販売：micvictorydanb ／ 作曲：32。著作権フリー、最高峰サウンド演出！

[Verse 1 - 楽器別独立AI生成 & ボーカル実録]
シンセベース、トランペット、バイオリン、ドラム...各パートを個別にAIメイキング！
重厚な低音から優雅な高音まで、自分好みに組み合わせて世界でひとつの楽曲へ。
画面の歌詞を目で追いながら崩差ない絶対のパフォーマンスを完全記録。

[Outro - BLAUND 永遠のゴールド・スタンダード]
著作権フリー、完全なる自由の光が世界を包み込む
BLAUND — 世界最高級音感、それは永遠の情熱
各楽器別AIメロディ作成の軌跡とともに、未来へ鳴り響け！！`
            );

            const [masterBassBoost, setMasterBassBoost] = React.useState(24);
            const [masterVolume, setMasterVolume] = React.useState(1.45);
            const [reverbWet, setReverbWet] = React.useState(0.22);
            const [delayFeedback, setDelayFeedback] = React.useState(0.30);
            const [distortionAmount, setDistortionAmount] = React.useState(0.12);
            const [chorusWet, setChorusWet] = React.useState(0.35);

            const [slotName, setSlotName] = React.useState("HOKKAI_INDIVIDUAL_INSTRUMENT_AI_v100");

            const INSTRUMENTS = [
                { id: "synthLowBass", label: "🔊 シンセサイザー電子低音 (ベース命)", color: "from-red-600 via-amber-700 to-red-950 text-white font-black" },
                { id: "trumpet", label: "🎺 トランペット (Trumpet Lead)", color: "from-yellow-500 via-amber-500 to-yellow-600 text-slate-950 font-black" },
                { id: "drums", label: "🥁 ドラム", color: "from-amber-600 to-red-700 text-white font-black" },
                { id: "piano", label: "🎹 グランドピアノ", color: "from-blue-600 to-indigo-600 text-white font-bold" },
                { id: "africa", label: "🪘 アフリカ楽器", color: "from-amber-700 to-yellow-800 text-white font-bold" },
                { id: "elecGuitar", label: "🎸 エレキギター電子", color: "from-orange-600 to-red-700 text-white font-bold" },
                { id: "violin", label: "🎻 バイオリン電子音", color: "from-purple-600 to-pink-700 text-white font-bold" },
                { id: "highLead", label: "✨ 高音 (希望のリード)", color: "from-yellow-400 to-amber-500 text-slate-950 font-black" },
            ];

            const [instrumentSteps, setInstrumentSteps] = React.useState({
                synthLowBass: new Array(TOTAL_STEPS).fill(null),
                trumpet: new Array(TOTAL_STEPS).fill(null),
                drums: new Array(TOTAL_STEPS).fill(null),
                africa: new Array(TOTAL_STEPS).fill(null),
                elecGuitar: new Array(TOTAL_STEPS).fill(null),
                violin: new Array(TOTAL_STEPS).fill(null),
                highLead: new Array(TOTAL_STEPS).fill(null),
                piano: new Array(TOTAL_STEPS).fill(null),
            });

            const synthsRef = React.useRef(null);
            const loopRef = React.useRef(null);
            const masterGainRef = React.useRef(null);
            const eqRef = React.useRef(null);
            const reverbRef = React.useRef(null);
            const delayRef = React.useRef(null);
            const distortionRef = React.useRef(null);
            const chorusRef = React.useRef(null);
            const instrumentGainsRef = React.useRef({});
            const directWriteStepIndexRef = React.useRef(0);
            const destStreamNodeRef = React.useRef(null);

            const BASS_NOTES = ["C1", "D1", "E1", "F1", "G1", "A1", "B1", "C2", "D2", "E2", "F2", "G2"];
            const GENERAL_NOTES = ["C3", "D3", "E3", "F3", "G3", "A3", "B3", "C4", "D4", "E4", "F4", "G4"];
            const TRUMPET_NOTES = ["C4", "D4", "E4", "F4", "G4", "A4", "B4", "C5", "D5", "E5", "F5", "G5"];
            const VIOLIN_NOTES = ["G3", "A3", "B3", "C4", "D4", "E4", "F4", "G4", "A4", "B4", "C5", "D5", "E5"];

            const SOLFEGE_MAP = {
                "C1": "超低ド", "D1": "超低レ", "E1": "超低ミ", "F1": "超低ファ", "G1": "超低ソ", "A1": "超低ラ", "B1": "超低シ",
                "C2": "低ド", "D2": "低レ", "E2": "低ミ", "F2": "低ファ", "G2": "低ソ",
                "G3": "低ソ", "A3": "低ラ", "B3": "低シ",
                "C3": "ド", "D3": "レ", "E3": "ミ", "F3": "ファ", "G3": "ソ", "A3": "ラ", "B3": "シ",
                "C4": "中ド", "D4": "中レ", "E4": "中ミ", "F4": "中ファ", "G4": "中ソ", "A4": "中ラ", "B4": "中シ",
                "C5": "高ド", "D5": "高レ", "E5": "高ミ", "F5": "高ファ", "G5": "高ソ"
            };

            // 🎙️ 内部＆外部録音機能の開始
            const startRecording = async () => {
                try {
                    await Tone.start();
                    let captureStream;

                    if (currentRecordMode === 'internal') {
                        // 内部ミックス録音 (アプリの音響出力 destStreamNode からキャプチャ ＋ マイクをミックス)
                        const micStream = await navigator.mediaDevices.getUserMedia({ audio: true }).catch(() => null);
                        if (destStreamNodeRef.current) {
                            const mixStream = destStreamNodeRef.current.stream;
                            if (micStream) {
                                // Tone.js のストリームとマイクストリームを結合するための簡易処理
                                captureStream = mixStream;
                            } else {
                                captureStream = mixStream;
                            }
                        } else {
                            captureStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        }
                        setStatus("🎧 内部ミックス録音中... (アプリ演奏＋マイク音声)");
                    } else {
                        // 外部マイク単体録音
                        captureStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        setStatus("🎤 外部マイク単体録音中...");
                    }

                    mediaRecorderRef.current = new MediaRecorder(captureStream);
                    audioChunksRef.current = [];

                    mediaRecorderRef.current.ondataavailable = (e) => {
                        if (e.data.size > 0) audioChunksRef.current.push(e.data);
                    };

                    mediaRecorderRef.current.onstop = () => {
                        const audioBlob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                        const audioUrl = URL.createObjectURL(audioBlob);
                        const newTake = {
                            id: Date.now(),
                            title: `${currentRecordMode === 'internal' ? '内部ミックス録音' : '外部マイク録音'} #${recordedAudioList.length + 1}`,
                            url: audioUrl,
                            date: new Date().toLocaleTimeString()
                        };
                        setRecordedAudioList(prev => [...prev, newTake]);
                        setStatus("⏹️ 録音が完了し、プレビューリストに追加されました！");
                    };

                    mediaRecorderRef.current.start();
                    setIsRecording(true);
                    if (!playing && currentRecordMode === 'internal') togglePlay();
                } catch (err) {
                    console.error("録音エラー:", err);
                    alert("マイクのアクセス許可またはオーディオキャプチャに失敗しました。");
                }
            };

            const stopRecording = () => {
                if (mediaRecorderRef.current && isRecording) {
                    mediaRecorderRef.current.stop();
                    setIsRecording(false);
                }
            };

            const changeBarsCount = (newBars) => {
                setBarsCount(newBars);
                const newTotalSteps = newBars * BAR_STEPS;
                setInstrumentSteps(prev => {
                    const updated = {};
                    Object.keys(prev).forEach(key => {
                        const oldArr = prev[key] || [];
                        if (oldArr.length >= newTotalSteps) {
                            updated[key] = oldArr.slice(0, newTotalSteps);
                        } else {
                            const expanded = [...oldArr, ...new Array(newTotalSteps - oldArr.length).fill(null)];
                            updated[key] = expanded;
                        }
                    });
                    return updated;
                });
                if (currentBar >= newBars) setCurrentBar(newBars - 1);
                setStatus(`➕ 小節数を ${newBars} 小節に変更しました！`);
            };

            const startFreshComposition = () => {
                if (!window.confirm(`これまでの全体記録やグリッドをすべてリセットして、新しい作曲をスタートしますか？`)) return;
                setPlaying(false);
                const totalLen = barsCount * BAR_STEPS;
                const clearedSteps = {};
                Object.keys(instrumentSteps).forEach(k => {
                    clearedSteps[k] = new Array(totalLen).fill(null);
                });
                setInstrumentSteps(clearedSteps);
                setCreraList([]);
                setRecordedAudioList([]);
                localStorage.removeItem("MIC_VICTORY_PLUS_AUTOCACHE_v100_0");
                setStatus(`✨ 全体記録をすべてクリアしました！`);
            };

            const triggerFxScratch = () => {
                setFxScratchActive(true);
                const syns = synthsRef.current;
                if (syns) {
                    const now = Tone.now();
                    const noise = new Tone.Noise("white").connect(syns.eq).start(now).stop(now + 0.3);
                    const filter = new Tone.Filter(1200, "bandpass").connect(syns.eq);
                    noise.connect(filter);
                    filter.frequency.setValueAtTime(300, now);
                    filter.frequency.linearRampToValueAtTime(4000, now + 0.15);
                    filter.frequency.linearRampToValueAtTime(100, now + 0.3);
                }
                setStatus("🎛️ スクラッチ FX 発動！");
                setTimeout(() => setFxScratchActive(false), 300);
            };

            const triggerFxRepeat = () => {
                setFxRepeatActive(true);
                const prevBpm = bpm;
                setBpm(prevBpm * 1.5);
                setStatus("🔁 ランダムリピート（高速バースト）発動！");
                setTimeout(() => {
                    setBpm(prevBpm);
                    setFxRepeatActive(false);
                }, 1200);
            };

            const changeInstrumentVolume = (instKey, val) => {
                setVolumes(prev => ({ ...prev, [instKey]: val }));
            };

            const toggleInstrumentMute = (instKey) => {
                setInstrumentMutes(prev => ({ ...prev, [instKey]: !prev[instKey] }));
            };

            React.useEffect(() => {
                if (autoCacheEnabled) {
                    const cached = localStorage.getItem("MIC_VICTORY_PLUS_AUTOCACHE_v100_0");
                    if (cached) {
                        try {
                            const parsed = JSON.parse(cached);
                            if (parsed.instrumentSteps && parsed.instrumentSteps.drums) {
                                setInstrumentSteps(parsed.instrumentSteps);
                                setBarsCount(parsed.instrumentSteps.drums.length / 16);
                            }
                            if (parsed.rapLyrics) setRapLyrics(parsed.rapLyrics);
                            if (parsed.bpm) setBpm(parsed.bpm);
                            if (parsed.creraList) setCreraList(parsed.creraList);
                            if (parsed.volumes) setVolumes(parsed.volumes);
                        } catch (e) {
                            console.error("Cache load error", e);
                        }
                    }
                }
            }, []);

            React.useEffect(() => {
                if (autoCacheEnabled) {
                    const cacheData = { instrumentSteps, rapLyrics, bpm, creraList, volumes, updatedAt: new Date().toISOString() };
                    localStorage.setItem("MIC_VICTORY_PLUS_AUTOCACHE_v100_0", JSON.stringify(cacheData));
                }
            }, [instrumentSteps, rapLyrics, bpm, creraList, volumes, autoCacheEnabled]);

            React.useEffect(() => {
                if (masterGainRef.current) masterGainRef.current.gain.value = masterVolume;
                if (eqRef.current) eqRef.current.low.value = masterBassBoost;
                if (reverbRef.current) reverbRef.current.wet.value = reverbWet;
                if (delayRef.current) delayRef.current.feedback.value = delayFeedback;
                if (distortionRef.current) distortionRef.current.distortion = distortionAmount;
                if (chorusRef.current) chorusRef.current.wet.value = chorusWet;

                Object.keys(instrumentMutes).forEach(instKey => {
                    if (instrumentGainsRef.current[instKey]) {
                        const isMuted = instrumentMutes[instKey];
                        instrumentGainsRef.current[instKey].gain.value = isMuted ? 0 : Tone.dbToGain(volumes[instKey] || 0);
                    }
                });
            }, [masterVolume, masterBassBoost, reverbWet, delayFeedback, distortionAmount, chorusWet, instrumentMutes, volumes]);

            React.useEffect(() => {
                const masterGain = new Tone.Gain(masterVolume);
                masterGainRef.current = masterGain;

                // 内部録音用のMediaStreamDestinationを作成
                const destNode = Tone.context.createMediaStreamDestination();
                destStreamNodeRef.current = destNode;

                masterGain.connect(Tone.Destination);
                masterGain.connect(destNode);

                const eq = new Tone.EQ3({ low: masterBassBoost, lowFrequency: 90, mid: 3.2, high: 4.8 }).connect(masterGain);
                eqRef.current = eq;

                const reverb = new Tone.Reverb({ decay: 2.4, wet: reverbWet }).connect(eq);
                reverbRef.current = reverb;

                const delay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: delayFeedback, wet: 0.22 }).connect(reverb);
                delayRef.current = delay;

                const chorus = new Tone.Chorus(4, 2.5, chorusWet).connect(delay);
                chorusRef.current = chorus;

                const distortion = new Tone.Distortion(distortionAmount).connect(chorus);
                distortionRef.current = distortion;

                const cGains = {};
                Object.keys(instrumentSteps).forEach(key => {
                    const cg = new Tone.Gain(instrumentMutes[key] ? 0 : Tone.dbToGain(volumes[key] || 0)).connect(distortion);
                    cGains[key] = cg;
                });
                instrumentGainsRef.current = cGains;

                synthsRef.current = {
                    synthLowBass: new Tone.MonoSynth({
                        oscillator: { type: "sawtooth" },
                        envelope: { attack: 0.0005, decay: 0.25, sustain: 0.4, release: 0.1 },
                        filterEnvelope: { attack: 0.001, decay: 0.2, sustain: 0.5, release: 0.1, baseFrequency: 60, octaves: 5.0 }
                    }).connect(cGains.synthLowBass),
                    violin: new Tone.Synth({
                        oscillator: { type: "sawtooth" },
                        envelope: { attack: 0.08, decay: 0.4, sustain: 0.85, release: 0.4 }
                    }).connect(cGains.violin),
                    trumpet: new Tone.Synth({
                        oscillator: { type: "sawtooth" },
                        envelope: { attack: 0.02, decay: 0.25, sustain: 0.85, release: 0.3 }
                    }).connect(cGains.trumpet),
                    highLead: new Tone.Synth({
                        oscillator: { type: "sine" },
                        envelope: { attack: 0.008, decay: 0.5, sustain: 0.75, release: 0.6 }
                    }).connect(cGains.highLead),
                    elecGuitar: new Tone.Synth({
                        oscillator: { type: "sawtooth" },
                        envelope: { attack: 0.005, decay: 0.25, sustain: 0.3, release: 0.1 }
                    }).connect(cGains.elecGuitar),
                    africa: new Tone.MembraneSynth({ pitchDecay: 0.02, octaves: 4.5, oscillator: { type: "sine" }, envelope: { attack: 0.001, decay: 0.3, sustain: 0.01, release: 0.15 } }).connect(cGains.africa),
                    piano: new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.008, decay: 0.5, sustain: 0.45, release: 0.5 } }).connect(cGains.piano),
                    drums: {
                        kick: new Tone.MembraneSynth({ pitchDecay: 0.06, octaves: 5.8, oscillator: { type: "sine" }, envelope: { attack: 0.0001, decay: 0.4, sustain: 0.01, release: 0.15 } }).connect(cGains.drums),
                        snare: new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.0001, decay: 0.22, sustain: 0 } }).connect(cGains.drums),
                        hihat: new Tone.MetalSynth({ frequency: 950, envelope: { attack: 0.0005, decay: 0.03, release: 0.01 }, harmonicity: 5.2, modulationIndex: 34, resonance: 7500, octaves: 1.6 }).connect(cGains.drums),
                        clap: new Tone.NoiseSynth({ noise: { type: "pink" }, envelope: { attack: 0.005, decay: 0.15, sustain: 0 } }).connect(cGains.drums),
                    },
                    eq, reverb, distortion, chorus
                };

                return () => { Tone.Transport.stop(); Tone.Transport.cancel(); };
            }, []);

            React.useEffect(() => {
                Tone.Transport.bpm.value = bpm * playbackRate;
                Tone.Transport.cancel();

                if (playing) {
                    let stepCounter = 0;
                    const totalStepsLen = barsCount * BAR_STEPS;
                    loopRef.current = new Tone.Loop(time => {
                        let step = stepCounter % totalStepsLen;
                        const bar = Math.floor(step / BAR_STEPS);
                        const sInBar = step % BAR_STEPS;

                        setCurrentStep(sInBar);
                        setCurrentBar(bar);
                        directWriteStepIndexRef.current = step;

                        if (!powerSavingMode && sInBar === 0) {
                            const colors = ["border-cyan-500", "border-pink-500", "border-amber-500", "border-yellow-500", "border-emerald-500"];
                            setFlashColor(colors[Math.floor(Math.random() * colors.length)]);
                        }

                        const syns = synthsRef.current;
                        if (!syns) return;

                        Object.keys(instrumentSteps).forEach(instKey => {
                            if (instrumentMutes[instKey]) return;
                            const item = instrumentSteps[instKey][step];
                            if (!item) return;

                            if (instKey === "drums") {
                                if (typeof item === "object") {
                                    if (item.kick) syns.drums.kick.triggerAttackRelease("C1", "8n", time);
                                    if (item.snare) syns.drums.snare.triggerAttackRelease("8n", time);
                                    if (item.hihat) syns.drums.hihat.triggerAttackRelease("32n", time, 0.9);
                                    if (item.clap) syns.drums.clap.triggerAttackRelease("8n", time);
                                }
                            } else {
                                const noteToPlay = item.note || (instKey === "synthLowBass" ? "C1" : "C4");
                                if (syns[instKey]) {
                                    syns[instKey].triggerAttackRelease(noteToPlay, item.dur || "8n", time);
                                }
                            }
                        });

                        stepCounter++;
                    }, "16n").start(0);

                    Tone.Transport.start();
                } else {
                    Tone.Transport.stop();
                }
            }, [playing, bpm, playbackRate, instrumentSteps, powerSavingMode, barsCount, instrumentMutes]);

            const togglePlay = async () => {
                await Tone.start();
                setPlaying(!playing);
                setStatus(playing ? "停止しました" : `▶ 再生中 (${barsCount}小節 / BPM: ${bpm})`);
            };

            const saveToCrera = () => {
                const newCrera = {
                    id: Date.now(),
                    title: `崩差ない絶対 ${barsCount}小節 各楽器別AI crera #${creraList.length + 1} (${slotName})`,
                    bpm,
                    bars: barsCount,
                    date: new Date().toLocaleTimeString(),
                    credit: "micvictorydanb / 作曲: 32 / 著作権フリー",
                    instrumentSteps: JSON.parse(JSON.stringify(instrumentSteps)),
                    volumes: JSON.parse(JSON.stringify(volumes))
                };
                setCreraList(prev => [...prev, newCrera]);
                setStatus("🌊 crera ストレージにデータを完全保存しました！");
            };

            const syncAndLoadFromCrera = (creraItem) => {
                if (!creraItem) return;
                if (creraItem.instrumentSteps) {
                    setInstrumentSteps(creraItem.instrumentSteps);
                    const loadedBars = creraItem.instrumentSteps.drums ? (creraItem.instrumentSteps.drums.length / 16) : 38;
                    setBarsCount(loadedBars);
                }
                if (creraItem.bpm) setBpm(creraItem.bpm);
                if (creraItem.volumes) setVolumes(creraItem.volumes);
                setStatus(`🌊 crera から「${creraItem.title}」をロードしました！`);
            };

            // 🎯 【各楽器別 AIメロディ・リズム作成】（選択中楽器のみに適用）
            const generateAiStyleMelodyForSelectedInstrument = (styleType) => {
                const newSteps = { ...instrumentSteps };
                const totalLen = barsCount * BAR_STEPS;
                const targetInst = selectedInstrument;
                const arr = new Array(totalLen).fill(null);

                if (targetInst === "drums") {
                    for (let i = 0; i < totalLen; i++) {
                        const sInBar = i % 16;
                        let kick = sInBar === 0 || sInBar === 10;
                        let snare = sInBar === 4 || sInBar === 12;
                        let hihat = sInBar % 2 === 0;
                        let clap = false;

                        if (styleType === "popping") {
                            kick = sInBar === 0 || sInBar === 6 || sInBar === 10;
                            snare = sInBar === 4 || sInBar === 12;
                            hihat = sInBar % 2 === 0 || sInBar === 15;
                        } else if (styleType === "blackContemp") {
                            kick = sInBar === 0 || sInBar === 8;
                            snare = sInBar === 4 || sInBar === 12;
                            clap = sInBar === 12;
                        } else if (styleType === "poppingdancebracksulepopsai") {
                            kick = sInBar === 0 || sInBar === 6 || sInBar === 10 || sInBar === 14;
                            snare = sInBar === 4 || sInBar === 12;
                            hihat = sInBar % 2 === 0 || sInBar === 3 || sInBar === 11;
                            clap = sInBar === 12;
                        }
                        arr[i] = { kick, snare, hihat, clap };
                    }
                } else {
                    let scale = ["C4", "D4", "E4", "G4", "A4", "C5"];
                    
                    if (targetInst === "synthLowBass") {
                        scale = ["C1", "D1", "Eb1", "F1", "G1", "Bb1", "C2"];
                    } else if (targetInst === "trumpet") {
                        scale = ["C4", "E4", "G4", "A4", "C5", "D5", "E5", "G5"];
                    } else if (targetInst === "violin") {
                        scale = ["G3", "A3", "C4", "Eb4", "F4", "G4", "Bb4", "C5", "D5"];
                    }

                    if (styleType === "popping") scale = scale.filter((_, i) => i % 2 === 0);
                    else if (styleType === "blackContemp") scale = [...scale].reverse();
                    
                    const pattern = [0, 2, 4, 6, 8, 10, 12, 14];
                    for (let bar = 0; bar < barsCount; bar++) {
                        pattern.forEach(s => {
                            if (Math.random() > 0.3) {
                                const globalIdx = bar * 16 + s;
                                if (globalIdx < totalLen) {
                                    const note = scale[Math.floor(Math.random() * scale.length)];
                                    arr[globalIdx] = { note, dur: targetInst === "synthLowBass" ? "16n" : "8n" };
                                }
                            }
                        });
                    }
                }

                newSteps[targetInst] = arr;
                setInstrumentSteps(newSteps);
                setStatus(`✨ 【${targetInst}】専用に AIメロディ「${styleType.toUpperCase()}」を個別作成しました！`);
            };

            const playNoteKeyboard = (note) => {
                setSelectedNote(note);
                const syns = synthsRef.current;
                if (!syns) return;

                if (selectedInstrument === "drums") {
                    if (selectedDrumPart === "kick") syns.drums.kick.triggerAttackRelease("C1", selectedDuration);
                    else if (selectedDrumPart === "snare") syns.drums.snare.triggerAttackRelease(selectedDuration);
                    else if (selectedDrumPart === "hihat") syns.drums.hihat.triggerAttackRelease("32n");
                    else syns.drums.clap.triggerAttackRelease(selectedDuration);
                } else if (syns[selectedInstrument]) {
                    syns[selectedInstrument].triggerAttackRelease(note, selectedDuration);
                }

                const startStep = playing ? directWriteStepIndexRef.current : (currentBar * BAR_STEPS + 0);
                const totalLen = barsCount * BAR_STEPS;

                for (let i = 0; i < rapidHitCount; i++) {
                    const targetStep = (startStep + i) % totalLen;
                    setTimeout(() => {
                        if (selectedInstrument !== "drums" && syns[selectedInstrument]) {
                            syns[selectedInstrument].triggerAttackRelease(note, selectedDuration);
                        }
                    }, i * 80);

                    if (keyboardDirectWrite) {
                        toggleStepWithDurationDirect(selectedInstrument, targetStep, note, selectedDuration);
                    }
                }

                setStatus(`🎹 【${selectedInstrument}】手動連打記録: ステップ ${startStep + 1} から ${rapidHitCount}連打を書き込みました！`);
            };

            const toggleStepWithDurationDirect = (instKey, idx, note = selectedNote, dur = selectedDuration) => {
                setInstrumentSteps(prev => {
                    const currentArr = [...(prev[instKey] || [])];
                    if (instKey === "drums") {
                        const currentObj = currentArr[idx] || { kick: false, snare: false, hihat: false, clap: false };
                        const updatedObj = { ...currentObj, [selectedDrumPart]: !currentObj[selectedDrumPart] };
                        const hasAny = Object.values(updatedObj).some(Boolean);
                        currentArr[idx] = hasAny ? updatedObj : null;
                    } else {
                        currentArr[idx] = { note, dur };
                    }
                    return { ...prev, [instKey]: currentArr };
                });
            };

            const toggleStepGrid = (instKey, idx) => {
                setInstrumentSteps(prev => {
                    const currentArr = [...(prev[instKey] || [])];
                    if (instKey === "drums") {
                        const currentObj = currentArr[idx] || { kick: false, snare: false, hihat: false, clap: false };
                        const updatedObj = { ...currentObj, [selectedDrumPart]: !currentObj[selectedDrumPart] };
                        const hasAny = Object.values(updatedObj).some(Boolean);
                        currentArr[idx] = hasAny ? updatedObj : null;
                    } else {
                        if (!currentArr[idx]) {
                            currentArr[idx] = { note: selectedNote, dur: selectedDuration };
                        } else {
                            currentArr[idx] = null;
                        }
                    }
                    return { ...prev, [instKey]: currentArr };
                });
            };

            const clearSpecificInstrument = (instKey) => {
                setInstrumentSteps(prev => ({ ...prev, [instKey]: new Array(barsCount * BAR_STEPS).fill(null) }));
                setStatus(`🗑️ 【${instKey}】のグリッドをクリアしました。`);
            };

            const exportProjectToFile = () => {
                const projectData = {
                    title: slotName,
                    bars: barsCount,
                    bpm,
                    instrumentSteps,
                    volumes,
                    date: new Date().toISOString()
                };
                const blob = new Blob([JSON.stringify(projectData, null, 2)], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `${slotName}.json`;
                a.click();
                URL.revokeObjectURL(url);

            return (

                            </span>

                        <div className="flex items-center gap-1.5 flex-wrap">

                            <button onClick={togglePlay} className={`px-3 py-1 rounded font-bold text-xs shadow ${playing ? "bg-yellow-400 text-slate-950 animate-bounce" : "bg-pink-600 text-white"}`}>

                                <input type="number" value={bpm} onChange={e => setBpm(Math.max(60, Math.min(220, Number(e.target.value))))} className="w-12 bg-slate-900 text-center font-bold text-yellow-400 rounded text-xs py-0.5" />
                            </div>
                        </div>
                    </header>

                    <nav className="bg-slate-900/90 border-b border-slate-800 px-2 py-1.5 flex gap-1 overflow-x-auto">
                        {[
                            { id: "DUAL_EDIT", label: "🎹 38小節 各楽器別AI Sequencer" },

                            { id: "AUDIO_MIX", label: "🎚️ 音響ミキサー" },
                            { id: "FX_SUITE", label: "🎛️ FX・速度" },

                            <button key={t.id} onClick={() => setTab(t.id)} className={`px-3 py-1 rounded text-center font-bold transition-all shrink-0 ${tab === t.id ? "bg-gradient-to-r from-yellow-500 to-pink-600 text-slate-950 shadow-lg" : "bg-slate-800/60 text-slate-400"}`}>

                                        <span className="text-[10px] text-slate-300 font-bold">現在選択中: 【{INSTRUMENTS.find(i => i.id === selectedInstrument)?.label}】</span>

                                    <div className="grid grid-cols-2 gap-2">
                                        <button onClick={() => generateAiStyleMelodyForSelectedInstrument("popping")} className="py-2.5 bg-gradient-to-r from-pink-600 to-rose-600 text-white font-black rounded-lg text-xs shadow hover:scale-105 active:scale-95 transition-transform">🕺 Popping Dance</button>
                                        <button onClick={() => generateAiStyleMelodyForSelectedInstrument("blackContemp")} className="py-2.5 bg-gradient-to-r from-amber-600 to-orange-600 text-white font-black rounded-lg text-xs shadow hover:scale-105 active:scale-95 transition-transform">🎷 Black Contemp</button>
                                        <button onClick={() => generateAiStyleMelodyForSelectedInstrument("soul")} className="py-2.5 bg-gradient-to-r from-yellow-500 to-amber-500 text-slate-950 font-black rounded-lg text-xs shadow hover:scale-105 active:scale-95 transition-transform">🎶 Soul</button>
                                        <button onClick={() => generateAiStyleMelodyForSelectedInstrument("pops")} className="py-2.5 bg-gradient-to-r from-blue-600 to-cyan-600 text-white font-black rounded-lg text-xs shadow hover:scale-105 active:scale-95 transition-transform">🎤 Pops AI</button>
                                    </div>
                                    <button onClick={() => generateAiStyleMelodyForSelectedInstrument("poppingdancebracksulepopsai")} className="w-full py-2.5 bg-gradient-to-r from-purple-600 via-pink-600 to-yellow-500 text-white font-black rounded-lg text-xs shadow-lg animate-pulse hover:scale-105 active:scale-95 transition-transform">
                                        ✨ 【選択楽器専用】 Poppingdancebracksulepopsai メロディ作成
                                    </button>
                                </div>

                                <div className="bg-slate-900 p-3 rounded-xl border border-slate-800 flex flex-col gap-2">
                                    <div className="flex justify-between items-center flex-wrap gap-2">
                                        <span className="font-bold text-amber-300">🎹 音階鍵盤手動入力 ＆ {rapidHitCount}押し連打記録 ({selectedInstrument})</span>
                                    </div>

                                    {selectedInstrument === "drums" && (
                                        <div className="bg-slate-950 p-3 rounded-lg border border-slate-800 flex flex-col gap-2.5">
                                            <div className="flex justify-between items-center flex-wrap gap-2">
                                                <span className="text-[11px] font-bold text-amber-400">🥁 ドラムパーツ切替</span>
                                                <div className="flex gap-1">
                                                    {[
                                                        { id: "kick", label: "キック" },
                                                        { id: "snare", label: "スネア" },
                                                        { id: "hihat", label: "ハイハット" },
                                                        { id: "clap", label: "クラップ" }
                                                    ].map(p => (
                                                        <button key={p.id} onClick={() => setSelectedDrumPart(p.id)} className={`px-2.5 py-1 rounded text-[10px] font-bold ${selectedDrumPart === p.id ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-slate-300'}`}>
                                                            {p.label}
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>
                                            <button onClick={() => playNoteKeyboard("C1")} className="w-full py-3 bg-gradient-to-r from-red-600 to-amber-600 text-white font-black rounded-lg text-xs shadow-lg active:scale-95">
                                                🥁 ドラムパーツ ({selectedDrumPart}) を {rapidHitCount}押し連打記録・再生
                                            </button>
                                        </div>
                                    )}

                                    {selectedInstrument !== "drums" && (
                                        <div className="grid grid-cols-6 sm:grid-cols-12 gap-1 pt-1">
                                            {currentNotesList.map(note => (
                                                <button key={note} onClick={() => playNoteKeyboard(note)} className="py-2.5 bg-slate-800 border border-slate-700 rounded flex flex-col items-center justify-center hover:bg-slate-700 active:scale-95 shadow">
                                                    <span className="font-bold text-yellow-300 text-[10px]">{SOLFEGE_MAP[note] || note}</span>
                                                    <span className="text-[8px] text-slate-400">{note}</span>
                                                </button>
                                            ))}
                                        </div>
                                    )}

                                    <div className="flex justify-between items-center pt-2 flex-wrap gap-2">
                                        <span className="text-[10px] text-slate-400">🎛️ 【{selectedInstrument}】 グリッド (全 {barsCount * 16} ステップ) - 第 {currentBar + 1} / {barsCount} 小節</span>
                                        <button onClick={() => clearSpecificInstrument(selectedInstrument)} className="px-3 py-1 bg-slate-800 text-red-400 rounded font-bold text-[10px]">🗑️ 選択楽器クリア</button>
                                    </div>

                                    <div className="bg-slate-950 p-2.5 rounded border border-slate-800 flex flex-col gap-2">
                                        <div className="grid grid-cols-8 sm:grid-cols-16 gap-1">
                                            {Array.from({ length: 16 }).map((_, idx) => {
                                                const globalIdx = currentBar * BAR_STEPS + idx;
                                                const stepData = (instrumentSteps[selectedInstrument] || [])[globalIdx];
                                                
                                                let isActive = false;
                                                let displayLabel = `${idx + 1}`;
                                                if (selectedInstrument === "drums") {
                                                    isActive = stepData && stepData[selectedDrumPart];
                                                } else {
                                                    isActive = stepData !== null && stepData && stepData.note;
                                                    if (isActive) displayLabel = SOLFEGE_MAP[stepData.note] || stepData.note;
                                                }

                                                const isCurrentPlaying = playing && currentStep === idx;

                                                return (
                                                    <button key={idx} onClick={() => toggleStepGrid(selectedInstrument, globalIdx)} className={`h-11 rounded flex flex-col items-center justify-center font-mono text-[10px] border transition-all ${isCurrentPlaying ? 'border-yellow-400 ring-2 ring-yellow-400' : 'border-slate-800'} ${isActive ? 'bg-gradient-to-t from-red-500 to-amber-600 text-slate-950 font-black' : 'bg-slate-900 text-slate-400 hover:bg-slate-800'}`}>
                                                        <span>{idx + 1}</span>
                                                        <span className="text-[8px] font-bold truncate max-w-full">{isActive ? displayLabel : '·'}</span>
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                                            </button>

                                    {recordedAudioList.length > 0 && (

                                        </span>

                            <div className="flex flex-col gap-3">
                                <div className="bg-slate-900 p-4 rounded border border-yellow-500/80 flex flex-col gap-4 shadow-xl">
                                    <h2 className="text-sm font-black text-yellow-300">🎚️ 音響調整ミキサー</h2>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 bg-slate-950 p-3 rounded border border-slate-800">
                                        <div className="flex flex-col gap-1">
                                            <div className="flex justify-between text-[11px]"><span className="text-slate-300 font-bold">📢 マスター音量</span><span className="font-bold text-pink-400">{masterVolume.toFixed(2)}x</span></div>
                                            <input type="range" min="0.5" max="2.0" step="0.05" value={masterVolume} onChange={e => setMasterVolume(Number(e.target.value))} className="w-full accent-pink-500" />
                                        </div>
                                        <div className="flex flex-col gap-1">
                                            <div className="flex justify-between text-[11px]"><span className="text-slate-300 font-bold">🔊 ベースEQブースト</span><span className="font-bold text-amber-400">{masterBassBoost} dB</span></div>
                                            <input type="range" min="0" max="30" step="1" value={masterBassBoost} onChange={e => setMasterBassBoost(Number(e.target.value))} className="w-full accent-amber-500" />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-2.5">
                                        {INSTRUMENTS.map(inst => {
                                            const isMuted = instrumentMutes[inst.id];
                                            const vol = volumes[inst.id] !== undefined ? volumes[inst.id] : 0;
                                            return (
                                                <div key={inst.id} className="bg-slate-950 p-3 rounded border border-slate-800 flex flex-col gap-2 shadow">
                                                    <div className="flex justify-between items-center">
                                                        <span className="font-bold text-[11px] text-yellow-300 truncate max-w-[130px]">{inst.label}</span>
                                                        <button onClick={() => toggleInstrumentMute(inst.id)} className={`px-2 py-0.5 rounded text-[9px] font-bold ${isMuted ? 'bg-red-600 text-white' : 'bg-slate-800 text-emerald-400'}`}>
                                                            {isMuted ? 'MUTE' : 'ON'}
                                                        </button>
                                                    </div>
                                                    <div className="flex flex-col gap-1">
                                                        <div className="flex justify-between text-[9px] text-slate-400">
                                                            <span>音量</span><span className="font-mono text-cyan-300">{vol} dB</span>
                                                        </div>
                                                        <input type="range" min="-24" max="12" step="1" value={vol} onChange={e => changeInstrumentVolume(inst.id, Number(e.target.value))} className="w-full accent-cyan-400" />
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        )}

                        {tab === "FX_SUITE" && (
                            <div className="flex flex-col gap-3">
                                <div className="bg-slate-900 p-4 rounded border border-purple-600/60 flex flex-col gap-4">
                                    <h2 className="text-sm font-black text-purple-300">🎛️ FX機能 & 速度調整</h2>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        <button onClick={triggerFxScratch} className="py-4 bg-gradient-to-r from-pink-600 to-purple-600 text-white rounded font-black text-xs shadow">🎛️ スクラッチ FX</button>
                                        <button onClick={triggerFxRepeat} className="py-4 bg-gradient-to-r from-yellow-500 to-amber-600 text-slate-950 rounded font-black text-xs shadow">🔁 リピートバースト</button>
                                    </div>
                                    <div className="bg-slate-950 p-4 rounded border border-slate-800 flex flex-col gap-2">
                                        <div className="flex justify-between text-xs">
                                            <span className="text-slate-300 font-bold">⚡ 再生速度</span>
                                            <span className="font-bold text-yellow-400">{playbackRate.toFixed(2)}x (BPM: {Math.round(bpm * playbackRate)})</span>
                                        </div>
                                        <input type="range" min="0.5" max="2.0" step="0.05" value={playbackRate} onChange={e => setPlaybackRate(Number(e.target.value))} className="w-full accent-yellow-500" />
                                    </div>
                                </div>
                            </div>
                        )}

                        {tab === "CRERA_SUITE" && (
                            <div className="flex flex-col gap-3">
                                <div className="bg-slate-900 border border-cyan-800/60 rounded-lg p-4 flex flex-col gap-3">
                                    <div className="flex justify-between items-center">
                                        <h2 className="text-sm font-black text-cyan-300">🌊 crera ストレージ</h2>
                                        <button onClick={saveToCrera} className="px-3 py-1.5 bg-cyan-600 text-white font-black rounded text-xs">🌊 保存</button>
                                    </div>
                                    <div className="flex flex-col gap-2">
                                        {creraList.map(item => (
                                            <div key={item.id} className="bg-slate-950 p-3 rounded border border-cyan-900 flex justify-between items-center">
                                                <span className="font-bold text-yellow-300">{item.title}</span>
                                                <button onClick={() => syncAndLoadFromCrera(item)} className="px-3 py-1 bg-blue-600 text-white font-black rounded text-[10px]">ロード</button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {tab === "MEMORY" && (
                            <div className="flex flex-col gap-3">
                                <div className="bg-slate-900 p-4 rounded border border-slate-800 flex flex-col gap-3">
                                    <h2 className="text-sm font-bold text-yellow-300">💾 プロジェクト保存</h2>
                                    <input type="text" value={slotName} onChange={e => setSlotName(e.target.value)} className="w-full bg-slate-950 text-yellow-300 px-3 py-2 rounded border border-slate-800 font-mono text-xs font-bold" />
                                    <button onClick={exportProjectToFile} className="py-2.5 bg-gradient-to-r from-yellow-500 to-pink-600 font-black text-slate-950 rounded shadow">💾 JSONダウンロード</button>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.render(<MasterSynthApp />, document.getElementById("root"));
    </script>
</body>
</html>
