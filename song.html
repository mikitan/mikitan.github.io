<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIC VICTORY - DLAND DTM v88.0 崩差ない絶対 ベースドラムリズムテンポメロディ手動記録＆AI予測</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans select-none pb-24 overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        function MasterSynthApp() {
            const [tab, setTab] = React.useState("DUAL_EDIT");
            const [playing, setPlaying] = React.useState(false);
            const [flashColor, setFlashColor] = React.useState("border-cyan-500");
            const [bpm, setBpm] = React.useState(112);
            const [playbackRate, setPlaybackRate] = React.useState(1.0);
            const [currentBar, setCurrentBar] = React.useState(0);
            const [currentStep, setCurrentStep] = React.useState(-1);
            const [status, setStatus] = React.useState("✨ v88.0 崩差ない絶対 ベースドラムリズムテンポメロディ手動記録＆AI予測稼働中！");

            const [powerSavingMode, setPowerSavingMode] = React.useState(false);
            const [autoCacheEnabled, setAutoCacheEnabled] = React.useState(true);
            const [keyboardDirectWrite, setKeyboardDirectWrite] = React.useState(true);

            // 🎹 1押し連打モード（1打、2打、3打）
            const [rapidHitCount, setRapidHitCount] = React.useState(1);

            // 🎛️ FX機能
            const [fxScratchActive, setFxScratchActive] = React.useState(false);
            const [fxRepeatActive, setFxRepeatActive] = React.useState(false);

            // 楽器ミュート設定
            const [instrumentMutes, setInstrumentMutes] = React.useState({
                drums: false, synthLowBass: false, africa: false, elecGuitar: false,
                violin: false, highLead: false, piano: false
            });

            // 🎚️ 各楽器ボリューム
            const [volumes, setVolumes] = React.useState({
                synthLowBass: 11, drums: 6, africa: 3, elecGuitar: 4,
                violin: 3, highLead: 5, piano: 3
            });

            const [barsCount, setBarsCount] = React.useState(38);
            const BAR_STEPS = 16;
            const TOTAL_STEPS = barsCount * BAR_STEPS;

            const [selectedInstrument, setSelectedInstrument] = React.useState("synthLowBass");
            const [selectedNote, setSelectedNote] = React.useState("C1");
            const [selectedDuration, setSelectedDuration] = React.useState("8n");
            const [selectedDrumPart, setSelectedDrumPart] = React.useState("kick");

            const [creraList, setCreraList] = React.useState([
                { id: 1, title: "崩差ない絶対 38小節 ベースドラムAI手動レコード crera #1", bpm: 112, bars: 38, date: "12:00:00", credit: "micvictorydanb / 作曲: 32 / 著作権フリー" }
            ]);

            const [recordedTakes, setRecordedTakes] = React.useState([
                { id: 1, title: "崩差ない絶対 ベースドラムAI手動記録テイク #1", bpm: 112, date: "12:01:00", credit: "micvictorydanb / 作曲: 32 / 著作権フリー" }
            ]);
            const [isRecording, setIsRecording] = React.useState(false);

            const [rapLyrics, setRapLyrics] = React.useState(
`[Intro - 崩差ない絶対 ベースドラムリズムテンポメロディ作成ai手動記録再生 micvictorybrand]
1曲38小節、ベース・ドラム・リズム・テンポが手動記録再生とAI予測で完璧に連動！
シンセサイザー電子低音とビートが重なり合い、最高峰のメロディ空間を構築する。
販売：micvictorydanb ／ 作曲：32。著作権フリー、最高峰サウンド演出！

[Verse 1 - 手動記録連打 & AI予測全体最適化]
指先で刻むベース低音の音律とキック・スネアのリズム連打！
AI予測機能が手動記録されたグルーヴを自動補完し、全体のテンポと旋律を極限まで引き上げる。
ポッピングダンスのキレとブラックコンテンポラリーの深みが支配する。

[Chorus - FXスイート & 圧巻のサウンド仕上げ]
スクラッチ、ランダムリピート、18ビート速度調整を自在に操るFX機能！
重厚なベースとシャープなドラムが理想のアンサンブルを響かせ、圧倒的感動を生み出す。
崩差ない絶対の哲学、世界を誇る名曲の輝きがここに。

[Outro - BLAUND 永遠のゴールド・スタンダード]
著作権フリー、完全なる自由の光が世界を包み込む
BLAUND — 世界最高級音感、それは永遠の情熱
ベース・ドラム・AI予測の軌跡とともに、未来へ鳴り響け！！`
            );

            const [masterBassBoost, setMasterBassBoost] = React.useState(19);
            const [masterVolume, setMasterVolume] = React.useState(1.40);
            const [reverbWet, setReverbWet] = React.useState(0.20);
            const [delayFeedback, setDelayFeedback] = React.useState(0.30);
            const [distortionAmount, setDistortionAmount] = React.useState(0.12);
            const [chorusWet, setChorusWet] = React.useState(0.35);

            const [dlandMode, setDlandMode] = React.useState(true);
            const [slotName, setSlotName] = React.useState("HOKKAI_BASS_DRUM_AI_RECORD_SUITE");

            const INSTRUMENTS = [
                { id: "synthLowBass", label: "🔊 シンセサイザー電子低音 (ベース命)", color: "from-amber-600 via-red-700 to-red-950 text-white font-black" },
                { id: "drums", label: "🥁 ドラム", color: "from-red-600 to-amber-600 text-white font-black" },
                { id: "piano", label: "🎹 グランドピアノ", color: "from-blue-600 to-indigo-600" },
                { id: "africa", label: "🪘 アフリカ楽器", color: "from-amber-700 to-yellow-800" },
                { id: "elecGuitar", label: "🎸 エレキギター電子", color: "from-orange-600 to-red-700" },
                { id: "violin", label: "🎻 バイオリン電子音", color: "from-purple-500 to-pink-700" },
                { id: "highLead", label: "✨ 高音 (希望のリード)", color: "from-yellow-400 to-amber-500 text-slate-950 font-black" },
            ];

            const [instrumentSteps, setInstrumentSteps] = React.useState({
                synthLowBass: new Array(TOTAL_STEPS).fill(null),
                drums: new Array(TOTAL_STEPS).fill(null),
                africa: new Array(TOTAL_STEPS).fill(null),
                elecGuitar: new Array(TOTAL_STEPS).fill(null),
                violin: new Array(TOTAL_STEPS).fill(null),
                highLead: new Array(TOTAL_STEPS).fill(null),
                piano: new Array(TOTAL_STEPS).fill(null),
            });

            const synthsRef = React.useRef(null);
            const loopRef = React.useRef(null);
            const masterGainRef = React.useRef(null);
            const eqRef = React.useRef(null);
            const reverbRef = React.useRef(null);
            const delayRef = React.useRef(null);
            const distortionRef = React.useRef(null);
            const chorusRef = React.useRef(null);
            const instrumentGainsRef = React.useRef({});
            const directWriteStepIndexRef = React.useRef(0);

            const BASS_NOTES = ["C1", "D1", "E1", "F1", "G1", "A1", "B1", "C2", "D2", "E2", "F2", "G2"];
            const GENERAL_NOTES = ["C3", "D3", "E3", "F3", "G3", "A3", "B3", "C4", "D4", "E4", "F4", "G4"];

            const SOLFEGE_MAP = {
                "C1": "超低ド", "D1": "超低レ", "E1": "超低ミ", "F1": "超低ファ", "G1": "超低ソ", "A1": "超低ラ", "B1": "超低シ",
                "C2": "低ド", "D2": "低レ", "E2": "低ミ", "F2": "低ファ", "G2": "低ソ",
                "C3": "ド", "D3": "レ", "E3": "ミ", "F3": "ファ", "G3": "ソ", "A3": "ラ", "B3": "シ",
                "C4": "中ド", "D4": "中レ", "E4": "中ミ", "F4": "中ファ", "G4": "中ソ"
            };

            const changeBarsCount = (newBars) => {
                setBarsCount(newBars);
                const newTotalSteps = newBars * BAR_STEPS;
                setInstrumentSteps(prev => {
                    const updated = {};
                    Object.keys(prev).forEach(key => {
                        const oldArr = prev[key] || [];
                        if (oldArr.length >= newTotalSteps) {
                            updated[key] = oldArr.slice(0, newTotalSteps);
                        } else {
                            const expanded = [...oldArr, ...new Array(newTotalSteps - oldArr.length).fill(null)];
                            updated[key] = expanded;
                        }
                    });
                    return updated;
                });
                if (currentBar >= newBars) setCurrentBar(newBars - 1);
                setStatus(`➕ 小節数を ${newBars} 小節に変更しました！`);
            };

            const startFreshComposition = () => {
                if (!window.confirm(`これまでの全体記録や38小節のグリッドをすべてリセットして、新しい作曲をスタートしますか？`)) return;
                
                setPlaying(false);
                const totalLen = barsCount * BAR_STEPS;
                const clearedSteps = {};
                Object.keys(instrumentSteps).forEach(k => {
                    clearedSteps[k] = new Array(totalLen).fill(null);
                });
                setInstrumentSteps(clearedSteps);
                setCreraList([]);
                setRecordedTakes([]);
                localStorage.removeItem("MIC_VICTORY_PLUS_AUTOCACHE_v88_0");
                setStatus(`✨ 全体記録をすべてクリアしました！新しい作曲をスタートしましょう！`);
            };

            const triggerFxScratch = () => {
                setFxScratchActive(true);
                const syns = synthsRef.current;
                if (syns) {
                    const now = Tone.now();
                    const noise = new Tone.Noise("white").connect(syns.eq).start(now).stop(now + 0.3);
                    const filter = new Tone.Filter(1200, "bandpass").connect(syns.eq);
                    noise.connect(filter);
                    filter.frequency.setValueAtTime(300, now);
                    filter.frequency.linearRampToValueAtTime(4000, now + 0.15);
                    filter.frequency.linearRampToValueAtTime(100, now + 0.3);
                }
                setStatus("🎛️ スクラッチ FX 発動！");
                setTimeout(() => setFxScratchActive(false), 300);
            };

            const triggerFxRepeat = () => {
                setFxRepeatActive(true);
                const prevBpm = bpm;
                setBpm(prevBpm * 1.5);
                setStatus("🔁 ランダムリピート（高速バースト）発動！");
                setTimeout(() => {
                    setBpm(prevBpm);
                    setFxRepeatActive(false);
                }, 1200);
            };

            const changeInstrumentVolume = (instKey, val) => {
                setVolumes(prev => ({ ...prev, [instKey]: val }));
            };

            const toggleInstrumentMute = (instKey) => {
                setInstrumentMutes(prev => ({ ...prev, [instKey]: !prev[instKey] }));
            };

            React.useEffect(() => {
                if (autoCacheEnabled) {
                    const cached = localStorage.getItem("MIC_VICTORY_PLUS_AUTOCACHE_v88_0");
                    if (cached) {
                        try {
                            const parsed = JSON.parse(cached);
                            if (parsed.instrumentSteps && parsed.instrumentSteps.drums) {
                                setInstrumentSteps(parsed.instrumentSteps);
                                setBarsCount(parsed.instrumentSteps.drums.length / 16);
                            }
                            if (parsed.rapLyrics) setRapLyrics(parsed.rapLyrics);
                            if (parsed.bpm) setBpm(parsed.bpm);
                            if (parsed.creraList) setCreraList(parsed.creraList);
                            if (parsed.recordedTakes) setRecordedTakes(parsed.recordedTakes);
                            if (parsed.volumes) setVolumes(parsed.volumes);
                        } catch (e) {
                            console.error("Cache load error", e);
                        }
                    }
                }
            }, []);

            React.useEffect(() => {
                if (autoCacheEnabled) {
                    const cacheData = { instrumentSteps, rapLyrics, bpm, creraList, recordedTakes, volumes, updatedAt: new Date().toISOString() };
                    localStorage.setItem("MIC_VICTORY_PLUS_AUTOCACHE_v88_0", JSON.stringify(cacheData));
                }
            }, [instrumentSteps, rapLyrics, bpm, creraList, recordedTakes, volumes, autoCacheEnabled]);

            React.useEffect(() => {
                if (masterGainRef.current) masterGainRef.current.gain.value = masterVolume;
                if (eqRef.current) eqRef.current.low.value = masterBassBoost;
                if (reverbRef.current) reverbRef.current.wet.value = reverbWet;
                if (delayRef.current) delayRef.current.feedback.value = delayFeedback;
                if (distortionRef.current) distortionRef.current.distortion = distortionAmount;
                if (chorusRef.current) chorusRef.current.wet.value = chorusWet;

                Object.keys(instrumentMutes).forEach(instKey => {
                    if (instrumentGainsRef.current[instKey]) {
                        const isMuted = instrumentMutes[instKey];
                        instrumentGainsRef.current[instKey].gain.value = isMuted ? 0 : Tone.dbToGain(volumes[instKey] || 0);
                    }
                });
            }, [masterVolume, masterBassBoost, reverbWet, delayFeedback, distortionAmount, chorusWet, instrumentMutes, volumes]);

            React.useEffect(() => {
                const masterGain = new Tone.Gain(masterVolume).toDestination();
                masterGainRef.current = masterGain;

                const eq = new Tone.EQ3({ low: masterBassBoost, lowFrequency: 110, mid: 2.5, high: 4.0 }).connect(masterGain);
                eqRef.current = eq;

                const reverb = new Tone.Reverb({ decay: 2.2, wet: reverbWet }).connect(eq);
                reverbRef.current = reverb;

                const delay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: delayFeedback, wet: 0.22 }).connect(reverb);
                delayRef.current = delay;

                const chorus = new Tone.Chorus(4, 2.5, chorusWet).connect(delay);
                chorusRef.current = chorus;

                const distortion = new Tone.Distortion(distortionAmount).connect(chorus);
                distortionRef.current = distortion;

                const cGains = {};
                Object.keys(instrumentSteps).forEach(key => {
                    const cg = new Tone.Gain(instrumentMutes[key] ? 0 : Tone.dbToGain(volumes[key] || 0)).connect(distortion);
                    cGains[key] = cg;
                });
                instrumentGainsRef.current = cGains;

                synthsRef.current = {
                    synthLowBass: new Tone.MonoSynth({
                        oscillator: { type: "sawtooth" },
                        envelope: { attack: 0.002, decay: 0.45, sustain: 0.85, release: 0.2 },
                        filterEnvelope: { attack: 0.001, decay: 0.3, sustain: 0.5, release: 0.2, baseFrequency: 50, octaves: 4.2 }
                    }).connect(cGains.synthLowBass),
                    highLead: new Tone.Synth({
                        oscillator: { type: "sine" },
                        envelope: { attack: 0.01, decay: 0.5, sustain: 0.7, release: 0.6 }
                    }).connect(cGains.highLead),
                    elecGuitar: new Tone.Synth({
                        oscillator: { type: "sawtooth" },
                        envelope: { attack: 0.005, decay: 0.25, sustain: 0.3, release: 0.1 }
                    }).connect(cGains.elecGuitar),
                    violin: new Tone.Synth({
                        oscillator: { type: "sawtooth" },
                        envelope: { attack: 0.05, decay: 0.3, sustain: 0.8, release: 0.3 }
                    }).connect(cGains.violin),
                    africa: new Tone.MembraneSynth({ pitchDecay: 0.02, octaves: 4.5, oscillator: { type: "sine" }, envelope: { attack: 0.001, decay: 0.3, sustain: 0.01, release: 0.15 } }).connect(cGains.africa),
                    piano: new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.008, decay: 0.5, sustain: 0.45, release: 0.5 } }).connect(cGains.piano),
                    drums: {
                        kick: new Tone.MembraneSynth({ pitchDecay: 0.06, octaves: 5.5, oscillator: { type: "sine" }, envelope: { attack: 0.0001, decay: 0.35, sustain: 0.01, release: 0.15 } }).connect(cGains.drums),
                        snare: new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.0001, decay: 0.22, sustain: 0 } }).connect(cGains.drums),
                        hihat: new Tone.MetalSynth({ frequency: 950, envelope: { attack: 0.0005, decay: 0.03, release: 0.01 }, harmonicity: 5.2, modulationIndex: 34, resonance: 7500, octaves: 1.6 }).connect(cGains.drums),
                        clap: new Tone.NoiseSynth({ noise: { type: "pink" }, envelope: { attack: 0.005, decay: 0.15, sustain: 0 } }).connect(cGains.drums),
                    },
                    eq, reverb, distortion, chorus
                };

                return () => { Tone.Transport.stop(); Tone.Transport.cancel(); };
            }, []);

            React.useEffect(() => {
                Tone.Transport.bpm.value = bpm * playbackRate;
                Tone.Transport.cancel();

                if (playing) {
                    let stepCounter = 0;
                    const totalStepsLen = barsCount * BAR_STEPS;
                    loopRef.current = new Tone.Loop(time => {
                        let step = stepCounter % totalStepsLen;
                        const bar = Math.floor(step / BAR_STEPS);
                        const sInBar = step % BAR_STEPS;

                        setCurrentStep(sInBar);
                        setCurrentBar(bar);
                        directWriteStepIndexRef.current = step;

                        if (dlandMode && sInBar === 0 && !powerSavingMode) {
                            const colors = ["border-cyan-500", "border-pink-500", "border-amber-500", "border-yellow-500", "border-emerald-500"];
                            setFlashColor(colors[Math.floor(Math.random() * colors.length)]);
                        }

                        const syns = synthsRef.current;
                        if (!syns) return;

                        Object.keys(instrumentSteps).forEach(instKey => {
                            if (instrumentMutes[instKey]) return;
                            const item = instrumentSteps[instKey][step];
                            if (!item) return;

                            if (instKey === "drums") {
                                if (typeof item === "object") {
                                    if (item.kick) syns.drums.kick.triggerAttackRelease("C1", "8n", time);
                                    if (item.snare) syns.drums.snare.triggerAttackRelease("8n", time);
                                    if (item.hihat) syns.drums.hihat.triggerAttackRelease("32n", time, 0.9);
                                    if (item.clap) syns.drums.clap.triggerAttackRelease("8n", time);
                                }
                            } else {
                                const noteToPlay = item.note || (instKey === "synthLowBass" ? "C1" : "C4");
                                if (syns[instKey]) {
                                    syns[instKey].triggerAttackRelease(noteToPlay, item.dur || "8n", time);
                                }
                            }
                        });

                        stepCounter++;
                    }, "16n").start(0);

                    Tone.Transport.start();
                } else {
                    Tone.Transport.stop();
                }
            }, [playing, bpm, playbackRate, instrumentSteps, dlandMode, powerSavingMode, barsCount, instrumentMutes]);

            const togglePlay = async () => {
                await Tone.start();
                setPlaying(!playing);
                setStatus(playing ? "停止しました" : `▶ 再生中 (${barsCount}小節 ベースドラムAI手動記録 / BPM: ${bpm}) - v88.0`);
            };

            const saveToCrera = () => {
                const newCrera = {
                    id: Date.now(),
                    title: `崩差ない絶対 ${barsCount}小節 ベースドラムAI手動レコード crera #${creraList.length + 1} (${slotName})`,
                    bpm,
                    bars: barsCount,
                    date: new Date().toLocaleTimeString(),
                    credit: "micvictorydanb / 作曲: 32 / 著作権フリー",
                    instrumentSteps: JSON.parse(JSON.stringify(instrumentSteps)),
                    volumes: JSON.parse(JSON.stringify(volumes)),
                    recordedTakesCount: recordedTakes.length
                };
                setCreraList(prev => [...prev, newCrera]);
                setStatus("🌊 crera ストレージにベースドラム手動記録＆AI予測データを完全保存しました！");
            };

            const syncAndLoadFromCrera = (creraItem) => {
                if (!creraItem) return;
                if (creraItem.instrumentSteps) {
                    setInstrumentSteps(creraItem.instrumentSteps);
                    const loadedBars = creraItem.instrumentSteps.drums ? (creraItem.instrumentSteps.drums.length / 16) : 38;
                    setBarsCount(loadedBars);
                }
                if (creraItem.bpm) setBpm(creraItem.bpm);
                if (creraItem.volumes) setVolumes(creraItem.volumes);
                setStatus(`🌊 crera から「${creraItem.title}」の全体記録をロードしました！`);
            };

            const toggleRecord = async () => {
                await Tone.start();
                setIsRecording(!isRecording);
                if (!isRecording) {
                    setStatus("🔴 パフォーマンス録音中...");
                } else {
                    const newTake = {
                        id: Date.now(),
                        title: `崩差ない絶対 ${barsCount}小節 録音テイク #${recordedTakes.length + 1} (${slotName})`,
                        bpm,
                        date: new Date().toLocaleTimeString(),
                        credit: "micvictorydanb / 作曲: 32 / 著作権フリー"
                    };
                    setRecordedTakes(prev => [...prev, newTake]);
                    setStatus("⏹ 全体記録を完了し、テイクを保存しました！");
                }
            };

            const generateAiMelodyStyle = (style) => {
                const newSteps = { ...instrumentSteps };
                const totalLen = barsCount * BAR_STEPS;
                const arr = new Array(totalLen).fill(null);
                
                let scale = ["C4", "E4", "G4", "A4", "C5"];
                if (selectedInstrument === "synthLowBass") {
                    scale = ["C1", "D1", "E1", "F1", "G1", "A1", "C2"];
                } else if (style === "popping") {
                    scale = ["C4", "Eb4", "F4", "G4", "Bb4", "C5"];
                } else if (style === "blackContemp") {
                    scale = ["C3", "F3", "Ab3", "C4", "Eb4", "F4"];
                } else if (style === "soul") {
                    scale = ["C3", "Eb3", "G3", "Bb3", "C4", "Eb4"];
                } else if (style === "popsai") {
                    scale = ["C4", "D4", "E4", "G4", "A4", "C5", "E5", "G5", "C6"];
                }

                if (selectedInstrument === "drums") {
                    for (let i = 0; i < totalLen; i++) {
                        const sInBar = i % 16;
                        let kick = false, snare = false, hihat = false, clap = false;

                        if (style === "popping") {
                            kick = sInBar === 0 || sInBar === 6 || sInBar === 10 || sInBar === 14;
                            snare = sInBar === 4 || sInBar === 12;
                            hihat = sInBar % 2 === 0 || sInBar === 3 || sInBar === 11;
                            clap = sInBar === 12;
                        } else if (style === "blackContemp") {
                            kick = sInBar === 0 || sInBar === 4 || sInBar === 8 || sInBar === 12;
                            snare = sInBar === 4 || sInBar === 12;
                            hihat = sInBar % 2 === 1;
                        } else if (style === "soul") {
                            kick = sInBar === 0 || sInBar === 7 || sInBar === 10;
                            snare = sInBar === 4 || sInBar === 12;
                            hihat = sInBar % 3 === 0;
                        } else if (style === "popsai") {
                            kick = sInBar % 4 === 0 || sInBar === 10;
                            snare = sInBar === 4 || sInBar === 12;
                            hihat = sInBar % 2 === 0;
                            clap = sInBar === 12;
                        }
                        if (kick || snare || hihat || clap) {
                            arr[i] = { kick, snare, hihat, clap };
                        }
                    }
                } else {
                    for (let bar = 0; bar < barsCount; bar++) {
                        for (let s = 0; s < 16; s++) {
                            const globalIdx = bar * 16 + s;
                            const isAccent = (s === 0 || s === 3 || s === 6 || s === 10 || s === 14);
                            if (selectedInstrument === "synthLowBass" ? (isAccent || s % 2 === 0) : (isAccent || s % 2 === 0 || Math.random() > 0.35)) {
                                const note = scale[Math.floor(Math.random() * scale.length)];
                                const dur = (style === "popsai" && Math.random() > 0.5) ? "4n" : "8n";
                                arr[globalIdx] = { note, dur };
                            }
                        }
                    }
                }

                newSteps[selectedInstrument] = arr;
                setInstrumentSteps(newSteps);
                setStatus(`✨ 【${selectedInstrument}】に 【${style.toUpperCase()}】 4大AIスタイルパターンを適用しました！`);

            // 🎯 AI予測ベースドラムリズムテンポメロディ一括自動生成＆改善
            const generateAiPredictiveTotalBassDrumSuite = () => {
                const newSteps = { ...instrumentSteps };
                const totalLen = barsCount * BAR_STEPS;
                
                const bassArr = newSteps.synthLowBass || [];
                
                Object.keys(newSteps).forEach(instKey => {
                    const arr = [...newSteps[instKey]];
                    let scale = ["C4", "D4", "E4", "G4", "A4", "C5", "E5"];
                    if (instKey === "synthLowBass") scale = ["C1", "D1", "E1", "F1", "G1", "A1", "C2"];
                    else if (instKey === "elecGuitar") scale = ["C3", "Eb3", "F3", "G3", "Bb3", "C4"];
                    else if (instKey === "drums") {
                        for (let i = 0; i < totalLen; i++) {
                            const sInBar = i % 16;
                            const hasBassHit = bassArr[i] !== null;
                            const kick = sInBar === 0 || sInBar === 6 || sInBar === 10 || (hasBassHit && sInBar % 2 === 0);
                            const snare = sInBar === 4 || sInBar === 12;
                            const hihat = sInBar % 2 === 0 || sInBar === 14;
                            const clap = sInBar === 12;
                            if (kick || snare || hihat) arr[i] = { kick, snare, hihat, clap };
                        }
                        newSteps.drums = arr;
                        return;
                    }

                    for (let i = 0; i < totalLen; i++) {
                        const sInBar = i % 16;
                        const isMainPulse = sInBar === 0 || sInBar === 3 || sInBar === 6 || sInBar === 10 || sInBar === 14;
                        
                        if (arr[i] === null && isMainPulse) {
                            if (Math.random() > 0.25) {
                                const note = scale[Math.floor(Math.random() * scale.length)];
                                arr[i] = { note, dur: (sInBar === 0 || sInBar === 8) ? "4n" : "8n" };
                            }
                        }
                    }
                    newSteps[instKey] = arr;
                });

                setInstrumentSteps(newSteps);
                setStatus(`✨🤖 AI予測完了！ベース・ドラム・リズム・テンポ・メロディを最高クオリティに仕上げました！`);

                    else if (selectedDrumPart === "hihat") syns.drums.hihat.triggerAttackRelease("32n");
                    else syns.drums.clap.triggerAttackRelease(selectedDuration);

                }

                const startStep = playing ? directWriteStepIndexRef.current : (currentBar * BAR_STEPS + 0);
                const totalLen = barsCount * BAR_STEPS;

                for (let i = 0; i < rapidHitCount; i++) {
                    const targetStep = (startStep + i) % totalLen;

                        const hasAny = Object.values(updatedObj).some(Boolean);
                        currentArr[idx] = hasAny ? updatedObj : null;

                    return { ...prev, [instKey]: currentArr };

                                                        <div className="flex justify-between text-[9px] text-slate-400">
                                                            <span>音量 (dB)</span>
                                                            <span className="font-mono text-cyan-300">{vol} dB</span>
                                                        </div>
                                                        <input type="range" min="-24" max="12" step="1" value={vol} onChange={e => changeInstrumentVolume(inst.id, Number(e.target.value))} className="w-full accent-cyan-400" />
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        )}

                        {tab === "RAP_AI" && (
                            <div className="flex flex-col gap-3">
                                <div className="bg-slate-900 p-4 rounded border border-slate-800 flex flex-col gap-3 shadow-lg">
                                    <h2 className="text-sm font-black bg-gradient-to-r from-yellow-400 via-pink-400 to-cyan-400 bg-clip-text text-transparent">
                                        📝 800文字級 AI歌詞表示・編集スイート
                                    </h2>
                                    <textarea value={rapLyrics} onChange={e => setRapLyrics(e.target.value)} rows={14} className="w-full bg-slate-950 text-slate-200 p-3 rounded border border-slate-800 font-mono text-xs leading-relaxed" />
                                    <div className="flex justify-end">
                                        <button onClick={() => { navigator.clipboard.writeText(rapLyrics); }} className="px-4 py-2 bg-cyan-600 text-white font-bold rounded text-xs shadow">📋 歌詞をコピー</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {tab === "FX_SUITE" && (
                            <div className="flex flex-col gap-3">
                                <div className="bg-slate-900 p-4 rounded border border-purple-600/60 flex flex-col gap-4 shadow-xl">
                                    <h2 className="text-sm font-black text-purple-300">🎛️ FX機能 & 速度調整スイート</h2>
                                    
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        <button onClick={triggerFxScratch} className={`py-4 rounded font-black text-xs shadow-lg transition-all ${fxScratchActive ? 'bg-white text-slate-950 scale-95' : 'bg-gradient-to-r from-pink-600 to-purple-600 text-white'}`}>
                                            🎛️ スクラッチ FX 発動
                                        </button>
                                        <button onClick={triggerFxRepeat} className={`py-4 rounded font-black text-xs shadow-lg transition-all ${fxRepeatActive ? 'bg-white text-slate-950 scale-95' : 'bg-gradient-to-r from-yellow-500 to-amber-600 text-slate-950'}`}>
                                            🔁 ランダムリピート（バースト）発動
                                        </button>
                                    </div>

                                    <div className="bg-slate-950 p-4 rounded border border-slate-800 flex flex-col gap-2">
                                        <div className="flex justify-between text-xs">
                                            <span className="text-slate-300 font-bold">⚡ 再生速度マルチプライヤー (速度調整)</span>
                                            <span className="font-bold text-yellow-400">{playbackRate.toFixed(2)}x (BPM: {Math.round(bpm * playbackRate)})</span>
                                        </div>
                                        <input type="range" min="0.5" max="2.0" step="0.05" value={playbackRate} onChange={e => setPlaybackRate(Number(e.target.value))} className="w-full accent-yellow-500" />
                                    </div>
                                </div>
                            </div>
                        )}

                        {tab === "CRERA_SUITE" && (
                            <div className="flex flex-col gap-3">
                                <div className="bg-gradient-to-r from-slate-900 via-cyan-950/40 to-slate-900 border border-cyan-800/60 rounded-lg p-4 flex flex-col gap-3 shadow-lg">
                                    <div className="flex justify-between items-center flex-wrap gap-2">
                                        <h2 className="text-sm font-black bg-gradient-to-r from-yellow-400 via-pink-400 to-cyan-400 bg-clip-text text-transparent">
                                            🌊 crera ストレージ管理スイート
                                        </h2>
                                        <button onClick={saveToCrera} className="px-3 py-1.5 bg-cyan-600 hover:bg-cyan-500 text-white font-black rounded text-xs shadow animate-bounce">
                                            🌊 creraに保存
                                        </button>
                                    </div>
                                    <div className="flex flex-col gap-2">
                                        {creraList.map(item => (
                                            <div key={item.id} className="bg-slate-950 p-3 rounded border border-cyan-900/80 flex justify-between items-center flex-wrap gap-2">
                                                <div className="flex flex-col gap-0.5">
                                                    <span className="font-bold text-yellow-300">{item.title}</span>
                                                    <span className="text-[10px] text-slate-400">BPM: {item.bpm} | {item.bars || barsCount}小節 | 保存時刻: {item.date}</span>
                                                </div>
                                                <button onClick={() => syncAndLoadFromCrera(item)} className="px-3.5 py-1.5 bg-gradient-to-r from-cyan-600 to-blue-600 text-white font-black rounded text-[10px] shadow-lg">
                                                    🌊 ロード
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {tab === "MEMORY" && (
                            <div className="flex flex-col gap-3">
                                <div className="bg-slate-900 p-4 rounded border border-slate-800 flex flex-col gap-3">
                                    <h2 className="text-sm font-bold text-yellow-300">💾 プロジェクトファイル保存</h2>
                                    <input type="text" value={slotName} onChange={e => setSlotName(e.target.value)} className="w-full bg-slate-950 text-yellow-300 px-3 py-2 rounded border border-slate-800 font-mono text-xs font-bold" />
                                    <button onClick={exportProjectToFile} className="py-2.5 bg-gradient-to-r from-yellow-500 to-pink-600 font-black text-slate-950 rounded shadow">
                                        💾 プロジェクト保存 (JSON)
                                    </button>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.render(<MasterSynthApp />, document.getElementById("root"));
    </script>
</body>
</html>
