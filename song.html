<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIC VICTORY BAND - Extended Drums & Chords v121.06</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans select-none pb-12 overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        function MasterSynthApp() {
            const [activeTab, setActiveTab] = React.useState("SEQUENCER"); 
            const [playing, setPlaying] = React.useState(false);
            const [bpm, setBpm] = React.useState(120);
            const [selectedGenre, setSelectedGenre] = React.useState("Pops");
            const [playbackRate, setPlaybackRate] = React.useState(1.0);
            const [barsCount, setBarsCount] = React.useState(38);
            const [currentBar, setCurrentBar] = React.useState(0);
            const [currentStep, setCurrentStep] = React.useState(-1);
            const [status, setStatus] = React.useState("🔥 8種ドラム＆16種コード拡張エンジン 稼働中");

            const BAR_STEPS = 16;

            // 🎵 5大ジャンル
            const GENRES = [
                { id: "Pops", label: "✨ Pops (120)", bpm: 120, color: "from-purple-700 to-fuchsia-600" },
                { id: "Rock", label: "🎸 Rock (132)", bpm: 132, color: "from-amber-700 to-orange-600" },
                { id: "Popping", label: "💥 Popping (108)", bpm: 108, color: "from-red-700 to-rose-600" },
                { id: "Dance", label: "🎧 Dance (128)", bpm: 128, color: "from-blue-700 to-cyan-600" },
                { id: "Soul", label: "🎷 Soul (98)", bpm: 98, color: "from-amber-600 to-yellow-600" }
            ];

            // 🎹 各楽器別 20種類ループ
            const INST_LOOP_PRESETS = Array.from({ length: 20 }, (_, i) => ({
                id: `inst_loop_${i + 1}`,
                num: i + 1,
                label: `ループ #${i + 1}`,
                type: i < 5 ? "Arp" : i < 10 ? "Riff" : i < 15 ? "Chord" : "Melody"
            }));

            // 🥁 ドラムプリセット拡張 (8種類)
            const DRUM_PRESETS = [
                { id: "standard", label: "🥁 8ビート", desc: "王道ポップス・ロック" },
                { id: "fourOnFloor", label: "🕺 4つ打ち", desc: "ダンス・EDM・ディスコ" },
                { id: "heavyRock", label: "🤘 ヘヴィロック", desc: "重厚キック＆強烈スネア" },
                { id: "funkSoul", label: "🎷 ファンク＆ソウル", desc: "裏拍HH＆リムショット" },
                { id: "shuffle", label: "⚡ 16ビートシャッフル", desc: "跳ねるグルーヴ" },
                { id: "funk16", label: "🔥 16ビートファンク", desc: "細密ハイハット" },
                { id: "trap808", label: "🎧 トラップ 808", desc: "連打HH＆重低音キック" },
                { id: "latinBossa", label: "🌴 ラテン・ボサノバ", desc: "パーカッシブなクラーベ" }
            ];

            // 選択中楽器・設定
            const [selectedInstrument, setSelectedInstrument] = React.useState("synthLeadNormal");
            const [selectedDrumPart, setSelectedDrumPart] = React.useState("kick");
            const [selectedGuitarStyle, setSelectedGuitarStyle] = React.useState("arpeggio");
            const [selectedChord, setSelectedChord] = React.useState("Am");
            const [selectedOctave, setSelectedOctave] = React.useState("mid");
            const [selectedNote, setSelectedNote] = React.useState("C4");
            const [inputMode, setInputMode] = React.useState("manual");
            const [selectedInstLoop, setSelectedInstLoop] = React.useState(INST_LOOP_PRESETS[0].id);

            // ドラムパーツ定義
            const DRUM_PARTS = [
                { id: "kick", label: "💥 キック" },
                { id: "snare", label: "🎯 スネア" },
                { id: "hihat", label: "⚡ ハイハット" },
                { id: "openHihat", label: "✨ オープンHH" },
                { id: "clap", label: "👏 クラップ" },
                { id: "rim", label: "🪵 リム" }
            ];

            // 🎸 16種類に拡張したコード構成音
            const CHORD_NOTES = {
                Am: ["A3", "C4", "E4"],
                C:  ["C4", "E4", "G4"],
                Dm: ["D4", "F4", "A4"],
                Em: ["E4", "G4", "B4"],
                F:  ["F4", "A4", "C5"],
                G:  ["G3", "B3", "D4"],
                E7: ["E3", "G#3", "B3", "D4"],
                FM7:["F4", "A4", "C5", "E5"],
                A7: ["A3", "C#4", "E4", "G4"],
                Bm7b5: ["B3", "D4", "F4", "A4"],
                Fm: ["F4", "G#4", "C5"],
                G7: ["G3", "B3", "D4", "F4"],
                C7: ["C4", "E4", "G4", "A#4"],
                D7: ["D4", "F#4", "A4", "C5"],
                Em7:["E4", "G4", "B4", "D5"],
                Dm7:["D4", "F4", "A4", "C5"]
            };

            const CHORD_LIST = Object.keys(CHORD_NOTES);

            // エフェクト パラメータ
            const [reverbRoomSize, setReverbRoomSize] = React.useState(0.5);
            const [reverbWet, setReverbWet] = React.useState(0.25);
            const [delayTime, setDelayTime] = React.useState("8n");
            const [delayFeedback, setDelayFeedback] = React.useState(0.3);
            const [delayWet, setDelayWet] = React.useState(0.15);
            const [distortionAmount, setDistortionAmount] = React.useState(0.15);

            // AI歌詞
            const [rapLyrics, setRapLyrics] = React.useState(
`[Intro - MIC VICTORY Direct Grid & Genre AI v121.06]
1. 8大ドラムパターン＆16種類コード進行バリエーション拡張。
2. 楽器別20ループと手動・AI完全切り替え対応。`
            );

            // ミキサー
            const [masterVolume, setMasterVolume] = React.useState(1.6);
            const [masterBassBoost, setMasterBassBoost] = React.useState(24);
            const [volumes, setVolumes] = React.useState({
                synthLowBass: 18, trumpet: 14, violin: 14,
                elecGuitar: 16, synthLeadNormal: 12, drums: 18
            });
            const [mutes, setMutes] = React.useState({
                synthLowBass: false, trumpet: false, violin: false,
                elecGuitar: false, synthLeadNormal: false, drums: false
            });

            // ストレージ
            const [storageList, setStorageList] = React.useState(() => {
                const saved = localStorage.getItem("MIC_VICTORY_TRACKS_V121_06");
                return saved ? JSON.parse(saved) : [{ id: 1, title: "Extended Session #1", bars: 38, bpm: 120, date: "12:00" }];
            });
            const [saveSlotName, setSaveSlotName] = React.useState("MIC_VICTORY_EXTENDED_v121");

            // 録音
            const [isRecording, setIsRecording] = React.useState(false);
            const [isVocalRecording, setIsVocalRecording] = React.useState(false);
            const [recordedAudioList, setRecordedAudioList] = React.useState([]);
            const [vocalAudioList, setVocalAudioList] = React.useState([]);

            const mediaRecorderRef = React.useRef(null);
            const vocalRecorderRef = React.useRef(null);
            const audioChunksRef = React.useRef([]);
            const vocalChunksRef = React.useRef([]);
            const destStreamNodeRef = React.useRef(null);

            // ステップデータ
            const [instrumentSteps, setInstrumentSteps] = React.useState(() => {
                const saved = localStorage.getItem("MIC_VICTORY_STEPS_V121_06");
                if (saved) return JSON.parse(saved);
                return {
                    synthLowBass: new Array(64 * BAR_STEPS).fill(null),
                    trumpet: new Array(64 * BAR_STEPS).fill(null),
                    violin: new Array(64 * BAR_STEPS).fill(null),
                    elecGuitar: new Array(64 * BAR_STEPS).fill(null),
                    synthLeadNormal: new Array(64 * BAR_STEPS).fill(null),
                    drums: new Array(64 * BAR_STEPS).fill(null)
                };
            });

            React.useEffect(() => {
                localStorage.setItem("MIC_VICTORY_STEPS_V121_06", JSON.stringify(instrumentSteps));
            }, [instrumentSteps]);

            React.useEffect(() => {
                localStorage.setItem("MIC_VICTORY_TRACKS_V121_06", JSON.stringify(storageList));
            }, [storageList]);

            // Tone.js 参照
            const synthsRef = React.useRef(null);
            const loopRef = React.useRef(null);
            const masterGainRef = React.useRef(null);
            const limiterRef = React.useRef(null);
            const compRef = React.useRef(null);
            const eqRef = React.useRef(null);
            const reverbRef = React.useRef(null);
            const delayRef = React.useRef(null);
            const distortionRef = React.useRef(null);
            const instrumentGainsRef = React.useRef({});
            const directStepIdxRef = React.useRef(0);

            const INSTRUMENT_MAP = [
                { id: "synthLeadNormal", label: "🎹 シンセサイザー電子 (20ループ対応)", color: "from-cyan-800 to-blue-600" },
                { id: "synthLowBass", label: "🎸 ベース (超重低音20ループ)", color: "from-red-900 to-red-600" },
                { id: "elecGuitar", label: "🎸 ピアノ/ギター伴奏 (16コード/20ループ)", color: "from-orange-800 to-amber-600" },
                { id: "violin", label: "🎻 バイオリン (旋律20ループ)", color: "from-rose-800 to-pink-600" },
                { id: "trumpet", label: "🎺 トランペット", color: "from-amber-600 to-yellow-500" },
                { id: "drums", label: "🥁 ドラムセット (8種リズムプリセット)", color: "from-purple-900 to-rose-700" },
            ];

            const KEYBOARD_NOTES = [
                { note: "C", label: "ド", color: "bg-red-600 hover:bg-red-500" },
                { note: "D", label: "レ", color: "bg-orange-600 hover:bg-orange-500" },
                { note: "E", label: "ミ", color: "bg-yellow-600 hover:bg-yellow-500" },
                { note: "F", label: "ファ", color: "bg-green-600 hover:bg-green-500" },
                { note: "G", label: "ソ", color: "bg-cyan-600 hover:bg-cyan-500" },
                { note: "A", label: "ラ", color: "bg-blue-600 hover:bg-blue-500" },
                { note: "B", label: "シ", color: "bg-purple-600 hover:bg-purple-500" },
                { note: "C+", label: "高ド", color: "bg-rose-600 hover:bg-rose-500" },
            ];

            // Tone.js 初期化
            React.useEffect(() => {
                const masterGain = new Tone.Gain(masterVolume);
                masterGainRef.current = masterGain;

                const limiter = new Tone.Limiter(-0.1); 
                limiterRef.current = limiter;

                const comp = new Tone.Compressor({ threshold: -10, ratio: 5, attack: 0.003, release: 0.1 });
                compRef.current = comp;

                const eq = new Tone.EQ3({ low: masterBassBoost, lowFrequency: 85, mid: 0, high: -2 });
                eqRef.current = eq;

                const reverb = new Tone.Reverb({ decay: 2.5, wet: reverbWet });
                reverb.generate();
                reverbRef.current = reverb;

                const delay = new Tone.FeedbackDelay({ delayTime: delayTime, feedback: delayFeedback, wet: delayWet });
                delayRef.current = delay;

                const distortion = new Tone.Distortion({ distortion: distortionAmount, wet: 0.3 });
                distortionRef.current = distortion;

                const destNode = Tone.context.createMediaStreamDestination();
                destStreamNodeRef.current = destNode;

                eq.connect(distortion);
                distortion.connect(delay);
                delay.connect(reverb);
                reverb.connect(comp);
                comp.connect(limiter);
                limiter.connect(masterGain);
                masterGain.connect(Tone.Destination);
                masterGain.connect(destNode);

                const cGains = {};
                Object.keys(instrumentSteps).forEach(key => {
                    const cg = new Tone.Gain(Tone.dbToGain(volumes[key] || 0)).connect(eq);
                    cGains[key] = cg;
                });
                instrumentGainsRef.current = cGains;

                synthsRef.current = {
                    synthLowBass: new Tone.MonoSynth({ oscillator: { type: "sawtooth" }, envelope: { attack: 0.005, decay: 0.2, sustain: 0.4, release: 0.1 } }).connect(cGains.synthLowBass),
                    trumpet: new Tone.Synth({ oscillator: { type: "sawtooth8" }, envelope: { attack: 0.03, decay: 0.2, sustain: 0.7, release: 0.15 } }).connect(cGains.trumpet),
                    violin: new Tone.Synth({ oscillator: { type: "triangle8" }, envelope: { attack: 0.08, decay: 0.4, sustain: 0.9, release: 0.4 } }).connect(cGains.violin),
                    elecGuitar: new Tone.PolySynth(Tone.Synth, { oscillator: { type: "sawtooth" }, envelope: { attack: 0.005, decay: 0.3, sustain: 0.1, release: 0.2 } }).connect(cGains.elecGuitar),
                    synthLeadNormal: new Tone.Synth({ oscillator: { type: "triangle" }, envelope: { attack: 0.01, decay: 0.2, sustain: 0.3, release: 0.1 } }).connect(cGains.synthLeadNormal),
                    drums: {
                        kick: new Tone.MembraneSynth({ pitchDecay: 0.05, octaves: 6, envelope: { attack: 0.001, decay: 0.3, sustain: 0.01 } }).connect(cGains.drums),
                        snare: new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.001, decay: 0.2, sustain: 0 } }).connect(cGains.drums),
                        hihat: new Tone.MetalSynth({ frequency: 250, envelope: { attack: 0.001, decay: 0.04, release: 0.01 }, harmonicity: 5.1, modulationIndex: 32, resonance: 4000, octaves: 1.5 }).connect(cGains.drums),
                        openHihat: new Tone.MetalSynth({ frequency: 180, envelope: { attack: 0.005, decay: 0.25, release: 0.1 }, harmonicity: 4.2, modulationIndex: 24, resonance: 3000, octaves: 2 }).connect(cGains.drums),
                        clap: new Tone.NoiseSynth({ noise: { type: "pink" }, envelope: { attack: 0.005, decay: 0.15, sustain: 0 } }).connect(cGains.drums),
                        rim: new Tone.MembraneSynth({ pitchDecay: 0.01, octaves: 2, envelope: { attack: 0.001, decay: 0.05, sustain: 0 } }).connect(cGains.drums)
                    }
                };

                return () => { Tone.Transport.stop(); Tone.Transport.cancel(); };
            }, []);

            React.useEffect(() => {
                if (masterGainRef.current) masterGainRef.current.gain.value = masterVolume;
                if (eqRef.current) eqRef.current.low.value = masterBassBoost;
                if (reverbRef.current) {
                    reverbRef.current.wet.value = reverbWet;
                    reverbRef.current.decay = reverbRoomSize * 5.0 + 0.5;
                }
                if (delayRef.current) {
                    delayRef.current.delayTime.value = delayTime;
                    delayRef.current.feedback.value = delayFeedback;
                    delayRef.current.wet.value = delayWet;
                }
                if (distortionRef.current) {
                    distortionRef.current.distortion = distortionAmount;
                }

                Object.keys(volumes).forEach(key => {
                    if (instrumentGainsRef.current[key]) {
                        const val = mutes[key] ? -Infinity : volumes[key];
                        instrumentGainsRef.current[key].gain.value = Tone.dbToGain(val);
                    }
                });
            }, [masterVolume, masterBassBoost, volumes, mutes, reverbRoomSize, reverbWet, delayTime, delayFeedback, delayWet, distortionAmount]);

            // ループ演奏エンジン
            React.useEffect(() => {
                Tone.Transport.bpm.value = bpm * playbackRate;
                Tone.Transport.cancel();

                if (playing) {
                    let stepCounter = 0;
                    loopRef.current = new Tone.Loop(time => {
                        const totalLen = barsCount * BAR_STEPS;
                        let step = stepCounter % totalLen;
                        setCurrentStep(step % BAR_STEPS);
                        setCurrentBar(Math.floor(step / BAR_STEPS));
                        directStepIdxRef.current = step;

                        const syns = synthsRef.current;
                        if (syns) {
                            Object.keys(instrumentSteps).forEach(instKey => {
                                if (mutes[instKey]) return;
                                const item = instrumentSteps[instKey][step];
                                if (!item) return;

                                if (instKey === "drums") {
                                    if (item.kick) syns.drums.kick.triggerAttackRelease("C1", "8n", time);
                                    if (item.snare) syns.drums.snare.triggerAttackRelease("8n", time);
                                    if (item.hihat) syns.drums.hihat.triggerAttackRelease("32n", time);
                                    if (item.openHihat) syns.drums.openHihat.triggerAttackRelease("8n", time);
                                    if (item.clap) syns.drums.clap.triggerAttackRelease("8n", time);
                                    if (item.rim) syns.drums.rim.triggerAttackRelease("G3", "16n", time);
                                } else if (instKey === "elecGuitar") {
                                    if (item.note) {
                                        syns.elecGuitar.triggerAttackRelease(item.note, item.dur || "8n", time);
                                    } else {
                                        const chordNotes = CHORD_NOTES[item.chord] || ["A3", "C4", "E4"];
                                        syns.elecGuitar.triggerAttackRelease(chordNotes, "4n", time);
                                    }
                                } else if (syns[instKey]) {
                                    syns[instKey].triggerAttackRelease(item.note || "C3", item.dur || "8n", time);
                                }
                            });
                        }
                        stepCounter++;
                    }, "16n").start(0);

                    Tone.Transport.start();
                } else {
                    Tone.Transport.stop();
                }
            }, [playing, bpm, playbackRate, instrumentSteps, barsCount, mutes]);

            const togglePlay = async () => {
                await Tone.start();
                setPlaying(!playing);
                setStatus(playing ? "■ 停止中" : `▶ 再生中 (${selectedGenre} / ${bpm} BPM)`);
            };

            const clearAll = () => {
                if (!window.confirm("全シーケンスデータを一括削除しますか？")) return;
                const cleared = {};
                Object.keys(instrumentSteps).forEach(k => { cleared[k] = new Array(64 * BAR_STEPS).fill(null); });
                setInstrumentSteps(cleared);
                setStatus("🗑️ 全データを消去しました");
            };

            const selectGenre = (genreObj) => {
                setSelectedGenre(genreObj.id);
                setBpm(genreObj.bpm);
                setStatus(`🎵 ジャンル設定: 【${genreObj.label}】 に変更しました`);
            };

            // 🥁 ドラムプリセット拡張 8パターン一括適用
            const applyDrumPreset = (presetId) => {
                const totalLen = barsCount * BAR_STEPS;
                const newSteps = JSON.parse(JSON.stringify(instrumentSteps));
                const drumArr = newSteps.drums;

                for (let i = 0; i < totalLen; i++) {
                    const s = i % 16;
                    const obj = { kick: false, snare: false, hihat: false, openHihat: false, clap: false, rim: false };

                    if (presetId === "standard") {
                        if (s === 0 || s === 8) obj.kick = true;
                        if (s === 4 || s === 12) obj.snare = true;
                        if (s % 2 === 0) obj.hihat = true;
                        if (s === 14) obj.openHihat = true;
                    } else if (presetId === "fourOnFloor") {
                        if (s === 0 || s === 4 || s === 8 || s === 12) obj.kick = true;
                        if (s === 4 || s === 12) obj.snare = true;
                        if (s % 2 === 0) obj.hihat = true;
                    } else if (presetId === "heavyRock") {
                        if (s === 0 || s === 6 || s === 10) obj.kick = true;
                        if (s === 4 || s === 12) obj.snare = true;
                        if (s % 2 === 0) obj.hihat = true;
                        if (s === 15) obj.openHihat = true;
                    } else if (presetId === "funkSoul") {
                        if (s === 0 || s === 9) obj.kick = true;
                        if (s === 4 || s === 12) obj.rim = true;
                        if (s % 2 === 0) obj.hihat = true;
                    } else if (presetId === "shuffle") {
                        if (s === 0 || s === 8) obj.kick = true;
                        if (s === 4 || s === 12) obj.snare = true;
                        if (s === 0 || s === 3 || s === 6 || s === 8 || s === 11 || s === 14) obj.hihat = true;
                    } else if (presetId === "funk16") {
                        if (s === 0 || s === 7 || s === 10) obj.kick = true;
                        if (s === 4 || s === 12) obj.snare = true;
                        obj.hihat = true;
                    } else if (presetId === "trap808") {
                        if (s === 0 || s === 6 || s === 8) obj.kick = true;
                        if (s === 4 || s === 12) obj.clap = true;
                        if (s % 1 === 0) obj.hihat = true; 
                    } else if (presetId === "latinBossa") {
                        if (s === 0 || s === 6 || s === 10) obj.kick = true;
                        if (s === 3 || s === 8 || s === 12) obj.rim = true;
                        if (s % 2 === 0) obj.hihat = true;
                    }
                    drumArr[i] = obj;
                }

                setInstrumentSteps(newSteps);
                const pObj = DRUM_PRESETS.find(x => x.id === presetId);
                setStatus(`🥁 ドラムパターン 【${pObj?.label}】 を適用しました！`);
            };

            // 🎹 20種類ループ適用
            const applyInstrumentLoopPreset = (presetObj) => {
                setSelectedInstLoop(presetObj.id);
                const totalLen = barsCount * BAR_STEPS;
                const newSteps = JSON.parse(JSON.stringify(instrumentSteps));
                const currentArr = newSteps[selectedInstrument];

                const notesPool = ["C4", "E4", "G4", "B4", "A4", "D4", "F4", "C5"];
                const bassPool = ["C2", "G1", "A1", "F1", "D2", "E2"];

                for (let i = 0; i < totalLen; i++) {
                    const s = i % 16;
                    const bar = Math.floor(i / 16);

                    if (selectedInstrument === "drums") continue;
                    if (selectedInstrument === "synthLowBass") {
                        if (s === 0 || s === 4 || s === 8 || s === 12) {
                            currentArr[i] = { note: bassPool[(bar + presetObj.num) % bassPool.length], dur: "8n" };
                        } else {
                            currentArr[i] = null;
                        }
                    } else {
                        if (presetObj.type === "Arp") {
                            if (s % 2 === 0) currentArr[i] = { note: notesPool[(s + presetObj.num) % notesPool.length], dur: "16n" };
                            else currentArr[i] = null;
                        } else if (presetObj.type === "Riff") {
                            if (s === 0 || s === 6 || s === 10) currentArr[i] = { note: notesPool[presetObj.num % notesPool.length], dur: "8n" };
                            else currentArr[i] = null;
                        } else {
                            if (s === 0 || s === 8) currentArr[i] = { note: notesPool[(bar) % notesPool.length], dur: "4n" };
                            else currentArr[i] = null;
                        }
                    }
                }

                setInstrumentSteps(newSteps);
                const instObj = INSTRUMENT_MAP.find(x => x.id === selectedInstrument);
                setStatus(`✨ 【${instObj?.label}】のループ #${presetObj.num} を適用しました！`);
            };

            const handleChordSelect = async (chordName) => {
                await Tone.start();
                setSelectedChord(chordName);
                const syns = synthsRef.current;
                if (syns && syns.elecGuitar) {
                    const notes = CHORD_NOTES[chordName] || ["A3", "C4", "E4"];
                    syns.elecGuitar.triggerAttackRelease(notes, "4n");
                }
                setStatus(`🎸 コード [${chordName}] 試聴中`);
            };

            const handleGridCellClick = async (globalIdx, overrideNote = null) => {
                await Tone.start();
                const syns = synthsRef.current;
                const targetNote = overrideNote || selectedNote;

                if (selectedInstrument === "drums") {
                    if (syns && syns.drums) {
                        if (selectedDrumPart === "kick") syns.drums.kick.triggerAttackRelease("C1", "8n");
                        if (selectedDrumPart === "snare") syns.drums.snare.triggerAttackRelease("8n");
                        if (selectedDrumPart === "hihat") syns.drums.hihat.triggerAttackRelease("32n");
                        if (selectedDrumPart === "openHihat") syns.drums.openHihat.triggerAttackRelease("8n");
                        if (selectedDrumPart === "clap") syns.drums.clap.triggerAttackRelease("8n");
                        if (selectedDrumPart === "rim") syns.drums.rim.triggerAttackRelease("G3", "16n");
                    }
                } else if (syns && syns[selectedInstrument]) {
                    syns[selectedInstrument].triggerAttackRelease(targetNote, "8n");
                }

                setInstrumentSteps(prev => {
                    const currentArr = [...prev[selectedInstrument]];
                    if (selectedInstrument === "drums") {
                        const obj = currentArr[globalIdx] || { kick: false, snare: false, hihat: false, openHihat: false, clap: false, rim: false };
                        obj[selectedDrumPart] = !obj[selectedDrumPart];
                        currentArr[globalIdx] = obj;
                    } else {
                        currentArr[globalIdx] = (currentArr[globalIdx] && currentArr[globalIdx].note === targetNote) ? null : { note: targetNote, dur: "8n" };
                    }
                    return { ...prev, [selectedInstrument]: currentArr };
                });
            };

            const handleKeyboardClick = async (noteRawObj) => {
                await Tone.start();
                let noteName = noteRawObj.note;
                let oct = selectedOctave === "low" ? "2" : selectedOctave === "mid" ? "3" : "4";
                if (noteName === "C+") {
                    noteName = "C";
                    oct = selectedOctave === "low" ? "3" : selectedOctave === "mid" ? "4" : "5";
                }
                const fullNote = noteName + oct;
                setSelectedNote(fullNote);

                const targetStep = playing ? directStepIdxRef.current : (currentBar * BAR_STEPS);
                handleGridCellClick(targetStep, fullNote);
                setStatus(`🎹 鍵盤 [${noteRawObj.label}(${fullNote})] 記録！`);
            };

            const applyInstrumentAiByGenre = () => {
                const totalLen = barsCount * BAR_STEPS;
                const newSteps = JSON.parse(JSON.stringify(instrumentSteps));
                const currentArr = newSteps[selectedInstrument];

                let userMotif = ["A4", "C5", "E5", "G5"];
                const chordProg = ["Am", "Dm", "G7", "C", "Fm", "Bm7b5", "E7", "Am"];
                const bassNotes = ["A1", "D2", "G1", "C2", "F1", "B1", "E2", "A1"];

                for (let i = 0; i < totalLen; i++) {
                    const s = i % 16;
                    const bar = Math.floor(i / 16);

                    if (selectedInstrument === "drums") {
                        const obj = { kick: false, snare: false, hihat: false, openHihat: false, clap: false, rim: false };
                        if (s === 0 || s === 8) obj.kick = true;
                        if (s === 4 || s === 12) obj.snare = true;
                        if (s % 2 === 0) obj.hihat = true;
                        currentArr[i] = obj;
                    } else if (selectedInstrument === "synthLowBass") {
                        if (s === 0 || s === 3 || s === 8 || s === 11) {
                            currentArr[i] = { note: bassNotes[bar % bassNotes.length], dur: "16n" };
                        }
                    } else {
                        if (s === 0 || s === 4 || s === 8 || s === 12) {
                            currentArr[i] = { note: userMotif[(s / 4 + bar) % userMotif.length], dur: "8n" };
                        }
                    }
                }

                setInstrumentSteps(newSteps);
                setStatus(`✨ 【${selectedGenre}】AI自動生成完了！`);
            };

            const startRecording = async () => {
                try {
                    await Tone.start();
                    let captureStream = destStreamNodeRef.current.stream;
                    mediaRecorderRef.current = new MediaRecorder(captureStream);
                    audioChunksRef.current = [];
                    mediaRecorderRef.current.ondataavailable = (e) => { if (e.data.size > 0) audioChunksRef.current.push(e.data); };
                    mediaRecorderRef.current.onstop = () => {
                        const audioBlob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                        const audioUrl = URL.createObjectURL(audioBlob);
                        setRecordedAudioList(prev => [...prev, { id: Date.now(), title: `全体演奏トラック #${prev.length + 1}`, url: audioUrl }]);
                        setStatus("⏹️ 全体録音完了！");
                    };
                    mediaRecorderRef.current.start();
                    setIsRecording(true);
                    if (!playing) togglePlay();
                } catch (err) {
                    alert("エラー: " + err.message);
                }
            };

            const stopRecording = () => {
                if (mediaRecorderRef.current && isRecording) {
                    mediaRecorderRef.current.stop();
                    setIsRecording(false);
                }
            };

            const startVocalRecording = async () => {
                try {
                    const micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                    vocalRecorderRef.current = new MediaRecorder(micStream);
                    vocalChunksRef.current = [];
                    vocalRecorderRef.current.ondataavailable = (e) => { if (e.data.size > 0) vocalChunksRef.current.push(e.data); };
                    vocalRecorderRef.current.onstop = () => {
                        const audioBlob = new Blob(vocalChunksRef.current, { type: 'audio/webm' });
                        const audioUrl = URL.createObjectURL(audioBlob);
                        setVocalAudioList(prev => [...prev, { id: Date.now(), title: `ボーカル #${prev.length + 1}`, url: audioUrl }]);
                        setStatus("🎤 ボーカル録音完了！");
                    };
                    vocalRecorderRef.current.start();
                    setIsVocalRecording(true);
                } catch (err) {
                    alert("マイクアクセスエラー");
                }
            };

            const stopVocalRecording = () => {
                if (vocalRecorderRef.current && isVocalRecording) {
                    vocalRecorderRef.current.stop();
                    setIsVocalRecording(false);
                }
            };

            const downloadJSON = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({
                    saveSlotName, bpm, barsCount, instrumentSteps, rapLyrics
                }));
                const dlAnchorElem = document.createElement('a');
                dlAnchorElem.setAttribute("href", dataStr);
                dlAnchorElem.setAttribute("download", `${saveSlotName}.json`);
                dlAnchorElem.click();

            const selectedInstObj = INSTRUMENT_MAP.find(i => i.id === selectedInstrument);

            return (
                <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col text-xs font-sans max-w-md mx-auto border-x border-slate-800 shadow-2xl">
                    
                    {/* ヘッダー */}
                    <header className="bg-slate-900 px-3 py-2 border-b border-red-900/60 sticky top-0 z-50 flex items-center justify-between gap-2">
                        <div className="shrink-0">
                            <h1 className="font-black text-xs text-red-500 tracking-wider">MIC VICTORY BAND</h1>
                            <p className="text-[9px] text-yellow-400 font-bold">8種ドラム＆16種コード拡張 v121.06</p>
                        </div>
                        <div className="flex items-center gap-1.5 shrink-0">
                            <button onClick={clearAll} className="px-2 py-1 bg-red-800 hover:bg-red-700 font-bold rounded text-[9px] text-white shadow">
                                🗑️ 全削除
                            </button>
                            <button onClick={togglePlay} className={`px-2.5 py-1 font-black rounded shadow text-[10px] ${playing ? "bg-yellow-400 text-black animate-pulse" : "bg-red-600 text-white"}`}>
                                {playing ? "■ 停止" : "▶ 再生"}
                            </button>
                            <div className="bg-slate-950 px-1.5 py-0.5 rounded border border-slate-800 font-bold text-yellow-400 text-center">
                                <span className="text-[7px] block text-slate-500 leading-none">BPM</span>
                                <span className="text-[10px]">{bpm}</span>
                            </div>
                        </div>
                    </header>

                    {/* ナビゲーションタブ */}
                    <nav className="bg-slate-900 border-b border-slate-800 grid grid-cols-6 text-[10px] font-bold text-center">
                        {[
                            { id: "SEQUENCER", label: "🎹 Seq" },
                            { id: "REC_AI", label: "🎙️ 録音AI" },
                            { id: "MIXER", label: "🎚️ Mix" },
                            { id: "FX", label: "⚃ FX" },
                            { id: "STORAGE", label: "🌊 保存" },
                            { id: "SAVE", label: "💾 Export" }

                    <main className="p-2.5 flex flex-col gap-3">

                                                    <span className="font-bold text-purple-200 text-[9px]">{dp.label}</span>

                                            ))}
                                        </div>
                                    </div>

                                {/* 🎸 ギター/ピアノ選択時：16種類コードバリエーション */}
                                {selectedInstrument === "elecGuitar" && (
                                    <div className="bg-slate-900 p-2.5 rounded-lg border border-orange-500/80 flex flex-col gap-2 shadow-xl">

                                        <div className="grid grid-cols-4 gap-1">
                                            {CHORD_LIST.map(chord => (
                                                <button key={chord} onClick={() => handleChordSelect(chord)} className={`py-1.5 rounded font-bold text-[9px] ${selectedChord === chord ? "bg-amber-600 text-white font-black scale-105 shadow" : "bg-slate-950 text-slate-300 border border-slate-800 hover:bg-slate-800"}`}>
                                                    {chord}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {/* 🎹 楽器別 20種類ループ */}
                                {selectedInstrument !== "drums" && (
                                    <div className="bg-slate-900 p-2.5 rounded-lg border border-cyan-500/80 flex flex-col gap-2 shadow-xl">
                                        <div className="flex justify-between items-center">
                                            <span className="font-black text-cyan-300 text-[11px]">🎼 [{selectedInstObj?.label}] 20種類別ループ</span>
                                            <span className="text-[8px] bg-cyan-400 text-black px-1.5 py-0.5 rounded font-black">20 LOOPS</span>

                                        <div className="grid grid-cols-5 gap-1 max-h-28 overflow-y-auto p-1 bg-slate-950 rounded border border-slate-800">
                                            {INST_LOOP_PRESETS.map(preset => (
                                                <button 
                                                    key={preset.id} 
                                                    onClick={() => applyInstrumentLoopPreset(preset)} 
                                                    className={`py-1.5 rounded font-black text-[9px] flex flex-col items-center justify-center border transition-all ${
                                                        selectedInstLoop === preset.id 
                                                            ? "bg-gradient-to-r from-cyan-600 to-blue-600 border-white text-white shadow-lg scale-105" 
                                                            : "bg-slate-900 border-slate-800 text-slate-300 hover:bg-slate-800"
                                                    }`}
                                                >
                                                    <span className="text-[10px] leading-none">#{preset.num}</span>
                                                    <span className="text-[6px] opacity-70 leading-none mt-0.5">{preset.type}</span>
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {/* 🎛️ 手動 ⇄ AI切り替え */}
                                <div className="bg-slate-900 p-2.5 rounded-lg border border-purple-500/80 flex flex-col gap-2 shadow-md">
                                    <div className="flex justify-between items-center">
                                        <span className="font-bold text-purple-300 text-[10px]">🎛️ 制作モード切替 (手動 ⇄ AI)</span>
                                        <div className="flex gap-1">
                                            <button onClick={() => setInputMode("manual")} className={`px-2.5 py-1 rounded text-[9px] font-bold ${inputMode === "manual" ? "bg-purple-600 text-white font-black" : "bg-slate-950 text-slate-400 border border-slate-800"}`}>
                                                ✍️ 手動
                                            </button>
                                            <button onClick={() => setInputMode("ai")} className={`px-2.5 py-1 rounded text-[9px] font-bold ${inputMode === "ai" ? "bg-cyan-600 text-white font-black" : "bg-slate-950 text-slate-400 border border-slate-800"}`}>
                                                ✨ AI自動
                                            </button>
                                        </div>
                                    </div>

                                    {inputMode === "ai" && (
                                        <div className="bg-gradient-to-r from-cyan-950 to-blue-950 p-2.5 rounded border border-cyan-400 flex flex-col gap-1.5">
                                            <span className="text-[9px] text-cyan-200 font-bold">✨ 【{selectedGenre}】× [{selectedInstObj?.label}] AI自動生成</span>
                                            <button onClick={applyInstrumentAiByGenre} className="w-full py-2 bg-gradient-to-r from-cyan-600 to-blue-600 text-white font-black rounded text-[10px] shadow active:scale-95">
                                                🚀 AIメロディ・伴奏を一括自動生成する
                                            </button>
                                        </div>
                                    )}
                                </div>

                                {/* 🎹 ドレミファソ手動鍵盤 */}
                                {selectedInstrument !== "drums" && inputMode === "manual" && (
                                    <div className="bg-slate-900 p-2.5 rounded-lg border border-cyan-500/80 flex flex-col gap-1.5 shadow-lg">
                                        <div className="flex justify-between items-center">
                                            <span className="font-bold text-cyan-300 text-[10px]">🎹 ドレミファソ手動鍵盤 (タップ即時記録・再生)</span>
                                            <div className="flex gap-1">
                                                {["low", "mid", "high"].map(oct => (
                                                    <button key={oct} onClick={() => setSelectedOctave(oct)} className={`px-1.5 py-0.5 rounded text-[8px] font-bold uppercase ${selectedOctave === oct ? "bg-cyan-500 text-black font-black" : "bg-slate-950 text-slate-400 border border-slate-800"}`}>
                                                        {oct}
                                                    </button>

                                            </div>
                                        </div>
                                        <div className="grid grid-cols-8 gap-1">
                                            {KEYBOARD_NOTES.map(k => (
                                                <button key={k.note} onClick={() => handleKeyboardClick(k)} className={`${k.color} h-10 rounded font-black text-white flex flex-col items-center justify-center shadow active:scale-95 transition-transform`}>
                                                    <span className="text-[11px] leading-none">{k.label}</span>
                                                    <span className="text-[7px] opacity-80 leading-none mt-0.5">{k.note}</span>
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {/* ⚏ ステップ録音・グリッド直接記録 */}
                                <div className="bg-slate-900 p-2.5 rounded-lg border border-slate-800 flex flex-col gap-2">
                                    <div className="flex justify-between items-center">
                                        <span className="font-bold text-amber-400 text-[10px]">⚏ グリッド直接記録 (第 {currentBar + 1} 小節)</span>
                                        <button onClick={() => {
                                            const newArr = new Array(64 * 16).fill(null);
                                            setInstrumentSteps(prev => ({ ...prev, [selectedInstrument]: newArr }));
                                        }} className="px-1.5 py-0.5 bg-slate-800 text-red-400 font-bold rounded text-[9px]">クリア</button>
                                    </div>
                                    
                                    <div className="grid grid-cols-8 gap-1">
                                        {Array.from({ length: 16 }).map((_, stepInBar) => {
                                            const globalIdx = currentBar * 16 + stepInBar;
                                            const isCurrent = playing && currentStep === stepInBar;
                                            const item = instrumentSteps[selectedInstrument][globalIdx];
                                            let active = false;
                                            let displayLabel = stepInBar + 1;

                                            if (selectedInstrument === "drums") {
                                                active = item && item[selectedDrumPart];
                                                if (active) displayLabel = selectedDrumPart[0].toUpperCase();
                                            } else {
                                                active = !!item;
                                                if (active) displayLabel = item.note || "ON";
                                            }

                                            return (
                                                <button 
                                                    key={stepInBar} 
                                                    onClick={() => handleGridCellClick(globalIdx)} 
                                                    className={`h-9 rounded flex flex-col items-center justify-center font-bold text-[9px] border transition-all ${

                                                            : active 
                                                                ? "bg-red-600 text-white border-red-500 shadow" 
                                                                : "bg-slate-950 text-slate-400 border-slate-800 hover:border-slate-700"
                                                    }`}
                                                >
                                                    <span className="text-[8px] opacity-60 leading-none">{stepInBar + 1}</span>
                                                    <span className="text-[10px] font-black leading-none mt-0.5 truncate max-w-full px-0.5">
                                                        {active ? displayLabel : "·"}
                                                    </span>
                                                </button>
                                            );
                                        })}
                                    </div>

                                {/* ドラムパーツ切替 */}

                                    <span className="font-bold text-amber-400 text-[10px]">🎙️ 全体演奏録音機能 (BGMキャプチャ)</span>
                                    {!isRecording ? (
                                        <button onClick={startRecording} className="py-2.5 bg-red-600 font-bold text-white rounded shadow text-[10px]">🔴 全体演奏録音スタート</button>
                                    ) : (
                                        <button onClick={stopRecording} className="py-2.5 bg-yellow-400 text-black font-bold rounded shadow text-[10px] animate-pulse">⏹️ 全体演奏録音停止</button>
                                    )}
                                    {recordedAudioList.map(rec => (
                                        <div key={rec.id} className="bg-slate-950 p-2 rounded flex justify-between items-center border border-slate-800">
                                            <span className="font-bold text-yellow-300 text-[9px] truncate mr-1">{rec.title}</span>
                                            <audio controls src={rec.url} className="h-6 w-36 accent-red-500" />
                                        </div>
                                    ))}
                                </div>

                                <div className="bg-slate-900 p-3 rounded-lg border-2 border-amber-500/80 flex flex-col gap-2 shadow-xl">
                                    <div className="flex justify-between items-center">
                                        <span className="font-black text-amber-400 text-[11px]">✨ AI 歌詞 & プロンプトメモ (800文字対応)</span>
                                        <span className="text-[9px] bg-amber-500 text-black px-2 py-0.5 rounded font-black">{rapLyrics.length} 文字</span>
                                    </div>
                                    <textarea 
                                        value={rapLyrics} 
                                        onChange={e => setRapLyrics(e.target.value)} 
                                        rows={16} 
                                        className="bg-slate-950 border border-amber-500/50 rounded-md p-3 text-[11px] font-mono text-slate-100 leading-relaxed focus:outline-none focus:border-amber-400 shadow-inner resize-y" 
                                        placeholder="AIラップ歌詞や文章を入力..." 
                                    />
                                </div>
                            </div>
                        )}

                        {/* --- TAB 3: MIXER --- */}
                        {activeTab === "MIXER" && (
                            <div className="bg-slate-900 p-2.5 rounded-lg border border-slate-800 flex flex-col gap-3">
                                <span className="font-bold text-amber-400 text-[10px]">🎚️ ミキサー & 音割れ防止回路</span>
                                <div className="bg-slate-950 p-2 rounded border border-slate-800 flex flex-col gap-2">
                                    <div className="flex justify-between font-bold text-[9px]"><span>📢 マスター音量</span><span className="text-red-400">{masterVolume.toFixed(2)}x</span></div>
                                    <input type="range" min="0.2" max="2.5" step="0.05" value={masterVolume} onChange={e => setMasterVolume(Number(e.target.value))} className="accent-red-500" />
                                    <div className="flex justify-between font-bold text-[9px]"><span>🔊 重低音ブースト</span><span className="text-amber-400">{masterBassBoost} dB</span></div>
                                    <input type="range" min="0" max="30" step="1" value={masterBassBoost} onChange={e => setMasterBassBoost(Number(e.target.value))} className="accent-amber-500" />
                                </div>
                                <div className="flex flex-col gap-1.5">
                                    {INSTRUMENT_MAP.map(inst => (
                                        <div key={inst.id} className="bg-slate-950 p-2 rounded border border-slate-800 flex flex-col gap-1">
                                            <div className="flex justify-between items-center font-bold text-[9px]">
                                                <span className="text-slate-200 truncate mr-2">{inst.label}</span>
                                                <div className="flex items-center gap-1.5">
                                                    <button onClick={() => setMutes(prev => ({ ...prev, [inst.id]: !prev[inst.id] }))} className={`px-1.5 py-0.5 rounded text-[8px] font-bold ${mutes[inst.id] ? "bg-red-800 text-white" : "bg-emerald-600 text-white"}`}>
                                                        {mutes[inst.id] ? "MUTE" : "ON"}
                                                    </button>
                                                    <span className="text-amber-400 w-8 text-right">{volumes[inst.id]}dB</span>
                                                </div>
                                            </div>
                                            <input type="range" min="-12" max="24" step="1" value={volumes[inst.id]} onChange={e => setVolumes({ ...volumes, [inst.id]: Number(e.target.value) })} className="accent-red-500" />
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* --- TAB 4: FX --- */}
                        {activeTab === "FX" && (
                            <div className="bg-slate-900 p-2.5 rounded-lg border border-amber-500/80 flex flex-col gap-3">
                                <span className="font-bold text-amber-400 text-[10px]">⚃ エフェクト & リバーブ パラメータ調整</span>

                                <div className="bg-slate-950 p-2 rounded border border-slate-800 flex flex-col gap-1">
                                    <div className="flex justify-between font-bold text-[9px]">
                                        <span>⚡ 再生スピード</span>
                                        <span className="text-yellow-400">{playbackRate.toFixed(2)}x (BPM: {Math.round(bpm * playbackRate)})</span>
                                    </div>
                                    <input type="range" min="0.5" max="2.0" step="0.05" value={playbackRate} onChange={e => setPlaybackRate(Number(e.target.value))} className="accent-amber-500" />
                                </div>

                                <div className="bg-slate-950 p-2 rounded border border-slate-800 flex flex-col gap-2">
                                    <span className="font-bold text-yellow-400 text-[10px]">🌊 リバーブ (空間・残響)</span>
                                    <div className="flex flex-col gap-0.5">
                                        <div className="flex justify-between font-bold text-[9px]"><span>ルームサイズ (減衰)</span><span className="text-slate-300">{reverbRoomSize.toFixed(2)}</span></div>
                                        <input type="range" min="0.0" max="1.0" step="0.05" value={reverbRoomSize} onChange={e => setReverbRoomSize(Number(e.target.value))} className="accent-yellow-500" />
                                    </div>
                                    <div className="flex flex-col gap-0.5">
                                        <div className="flex justify-between font-bold text-[9px]"><span>リバーブ量 (Wet)</span><span className="text-slate-300">{Math.round(reverbWet * 100)}%</span></div>
                                        <input type="range" min="0.0" max="1.0" step="0.05" value={reverbWet} onChange={e => setReverbWet(Number(e.target.value))} className="accent-yellow-500" />
                                    </div>
                                </div>

                                <div className="bg-slate-950 p-2 rounded border border-slate-800 flex flex-col gap-2">
                                    <span className="font-bold text-cyan-400 text-[10px]">🔄 ディレイ (やまびこ効果)</span>
                                    <div className="flex justify-between items-center text-[9px] font-bold">
                                        <span>ディレイタイム:</span>
                                        <div className="flex gap-1">
                                            {["16n", "8n", "4n"].map(time => (
                                                <button key={time} onClick={() => setDelayTime(time)} className={`px-2 py-0.5 rounded ${delayTime === time ? "bg-cyan-600 text-white" : "bg-slate-900 text-slate-400 border border-slate-800"}`}>
                                                    {time}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="flex flex-col gap-0.5">
                                        <div className="flex justify-between font-bold text-[9px]"><span>フィードバック</span><span className="text-slate-300">{Math.round(delayFeedback * 100)}%</span></div>
                                        <input type="range" min="0.0" max="0.8" step="0.05" value={delayFeedback} onChange={e => setDelayFeedback(Number(e.target.value))} className="accent-cyan-500" />
                                    </div>
                                    <div className="flex flex-col gap-0.5">
                                        <div className="flex justify-between font-bold text-[9px]"><span>ディレイ量 (Wet)</span><span className="text-slate-300">{Math.round(delayWet * 100)}%</span></div>
                                        <input type="range" min="0.0" max="1.0" step="0.05" value={delayWet} onChange={e => setDelayWet(Number(e.target.value))} className="accent-cyan-500" />
                                    </div>
                                </div>

                                <div className="bg-slate-950 p-2 rounded border border-slate-800 flex flex-col gap-2">
                                    <span className="font-bold text-red-400 text-[10px]">⚡ 歪み (オーバードライブ)</span>
                                    <div className="flex flex-col gap-0.5">
                                        <div className="flex justify-between font-bold text-[9px]"><span>歪み量 (Drive)</span><span className="text-slate-300">{Math.round(distortionAmount * 100)}%</span></div>
                                        <input type="range" min="0.0" max="1.0" step="0.05" value={distortionAmount} onChange={e => setDistortionAmount(Number(e.target.value))} className="accent-red-500" />
                                    </div>
                                </div>

                            </div>
                        )}

                        {/* --- TAB 5: STORAGE --- */}
                        {activeTab === "STORAGE" && (
                            <div className="bg-slate-900 p-2.5 rounded-lg border border-slate-800 flex flex-col gap-2">
                                <div className="flex justify-between items-center">
                                    <span className="font-bold text-amber-400 text-[10px]">🌊 ストレージ保存</span>
                                    <button onClick={() => setStorageList(prev => [...prev, { id: Date.now(), title: `Extended Session #${prev.length + 1}`, bars: barsCount, bpm, date: new Date().toLocaleTimeString() }])} className="px-2 py-0.5 bg-red-600 text-white font-bold rounded text-[9px]">保存</button>
                                </div>
                                {storageList.map(item => (
                                    <div key={item.id} className="bg-slate-950 p-2 rounded flex justify-between items-center border border-slate-800">
                                        <div>
                                            <h4 className="font-bold text-yellow-300 text-[10px]">{item.title}</h4>
                                            <p className="text-[8px] text-slate-500">{item.bars}小節 / {item.bpm} BPM</p>
                                        </div>
                                        <button onClick={() => setStatus(`ロード完了: ${item.title}`)} className="px-2 py-1 bg-blue-600 text-white font-bold rounded text-[9px]">ロード</button>
                                    </div>
                                ))}
                            </div>
                        )}

                        {/* --- TAB 6: SAVE --- */}
                        {activeTab === "SAVE" && (
                            <div className="bg-slate-900 p-2.5 rounded-lg border border-slate-800 flex flex-col gap-3">
                                <span className="font-bold text-amber-400 text-[10px]">💾 JSON エクスポート</span>
                                <div className="bg-slate-950 p-2.5 rounded border border-slate-800 flex flex-col gap-2">
                                    <input type="text" value={saveSlotName} onChange={e => setSaveSlotName(e.target.value)} className="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-yellow-300 font-bold font-mono text-[10px]" />
                                    <button onClick={downloadJSON} className="py-2 bg-gradient-to-r from-orange-600 to-red-600 font-bold text-white rounded shadow text-[10px]">💾 JSONダウンロード</button>
                                </div>
                            </div>
                        )}

                    </main>
                </div>
            );
        }

        ReactDOM.render(<MasterSynthApp />, document.getElementById("root"));
    </script>
</body>
</html>
