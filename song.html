<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body class="bg-slate-950 text-slate-100 font-sans select-none pb-24 overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        function MasterSynthApp() {
            const [tab, setTab] = React.useState("BLAUND_LUXURY");
            const [playing, setPlaying] = React.useState(false);
            const [isRecording, setIsRecording] = React.useState(false);
            const [flashColor, setFlashColor] = React.useState("border-cyan-500");
            const [bpm, setBpm] = React.useState(116);
            const [currentBar, setCurrentBar] = React.useState(0);
            const [currentStep, setCurrentStep] = React.useState(-1);
            const [status, setStatus] = React.useState("💎 v59.3 崩さない美学・AI予測・ドレミファ鍵盤完全同期版！");

            const [powerSavingMode, setPowerSavingMode] = React.useState(false);
            const [autoCacheEnabled, setAutoCacheEnabled] = React.useState(true);

            const BARS = 8;
            const BAR_STEPS = 16;
            const TOTAL_STEPS = BARS * BAR_STEPS;

            const [selectedInstrument, setSelectedInstrument] = React.useState("clickyBass");
            const [selectedNote, setSelectedNote] = React.useState("C2");
            const [selectedDuration, setSelectedDuration] = React.useState("8n");
            const [selectedDrumPart, setSelectedDrumPart] = React.useState("kick");

            const [creraList, setCreraList] = React.useState([
                { id: 1, title: "BLAUND Clicky Synth Anthem #1", bpm: 116, date: "12:00:00", credit: "micvictorydanb / 作曲: 28 / 著作権フリー" }
            ]);

            const [recordedTakes, setRecordedTakes] = React.useState([
                { id: 1, title: "Clicky Bit & ライブテイク #1", bpm: 116, date: "12:01:00", credit: "micvictorydanb / 作曲: 28 / 著作権フリー" }
            ]);

            const [lyricThemeInput, setLyricThemeInput] = React.useState("Clicky Bit 鋭いアタック、重低音クレラ、崩さない絶対の美学");
            const [additionalNoteInput, setAdditionalNoteInput] = React.useState("ドラムAI自動生成・エレキギターアンプ音・チョッパーベース・バイオリンAI予測搭載、世界へ羽ばたくMIC VICTORY");
            
            const [rapLyrics, setRapLyrics] = React.useState(
`[Intro - Clicky Bit & BLAUND 世界最高級音感の幕開け]
鋭いアタック音「Clicky Bit」がミックスを切り裂き、地の底を這う重低音クレラとエレキギターの歪みが完璧に融和する。
世界最高峰の音響美学を纏ったブランド「BLAUND」、いまその真価が世界へ解き放たれる。
販売：micvictorydanb ／ 作曲：28。すべての制限を外し、永遠の音楽フリーダムをここに宣言！

[Verse 1 - 圧倒的な気品とドラムAI・チョッパーベース]
AIが生み出したグルーヴ感溢れるドラムビートが心地よいリズムを刻み、チョッパーベースのスラップ音が加速する
バイオリンのAI予測メロディが美しく重なり、聴き手の心を完全に奪う
BLAUNDの哲学、それは「世界最高級音感」による究極の音楽体験
画面の向こうで息を呑むオーディエンスよ、この圧倒的な音の芸術に酔いしれろ！

[Chorus / Outro - BLAUND 永遠のゴールド・スタンダード]
著作権フリー、完全なる自由の光が世界を包み込む
BLAUND — 世界最高級音感、それは永遠の輝き
MIC VICTORY、私たちが描く未来に限界など存在しない！！`
            );

            const [masterBassBoost, setMasterBassBoost] = React.useState(14);
            const [masterVolume, setMasterVolume] = React.useState(1.35);
            const [reverbWet, setReverbWet] = React.useState(0.15);
            const [delayFeedback, setDelayFeedback] = React.useState(0.2);
            const [distortionAmount, setDistortionAmount] = React.useState(0.12);
            const [chorusWet, setChorusWet] = React.useState(0.3);

            const [dlandMode, setDlandMode] = React.useState(true);
            const [screenSaverActive, setScreenSaverActive] = React.useState(false);
            const [slotName, setSlotName] = React.useState("CLICKY_BASS_LUXURY_v59_3_MICVICTORYDANB_28");

            const INSTRUMENTS = [
                { id: "clickyBass", label: "⚡ Clicky Bitベース", color: "from-yellow-500 to-red-600" },
                { id: "drums", label: "🥁 ドラム (AI搭載)", color: "from-red-600 to-amber-600" },
                { id: "subBass", label: "🔊 重低音クレラベース", color: "from-amber-600 to-orange-700" },
                { id: "chopperBass", label: "🎸 チョッパーベース", color: "from-emerald-600 to-green-700" },
                { id: "elecGuitar", label: "🎸 エレキギター(アンプ音)", color: "from-orange-600 to-red-700" },
                { id: "synth", label: "🎹 クスタルシンセ", color: "from-cyan-600 to-blue-700" },
                { id: "violin", label: "🎻 バイオリン(AI予測)", color: "from-purple-600 to-indigo-700" },
                { id: "piano", label: "🎹 グランドピアノ", color: "from-blue-600 to-indigo-600" },
                { id: "africa1", label: "🪘 ジャンベ (ワールド)", color: "from-amber-700 to-yellow-800" },
            ];

            const [instrumentSteps, setInstrumentSteps] = React.useState({
                clickyBass: new Array(TOTAL_STEPS).fill(null),
                drums: new Array(TOTAL_STEPS).fill(null),
                subBass: new Array(TOTAL_STEPS).fill(null),
                chopperBass: new Array(TOTAL_STEPS).fill(null),
                elecGuitar: new Array(TOTAL_STEPS).fill(null),
                synth: new Array(TOTAL_STEPS).fill(null),
                violin: new Array(TOTAL_STEPS).fill(null),
                piano: new Array(TOTAL_STEPS).fill(null),
                africa1: new Array(TOTAL_STEPS).fill(null),
            });

            const [volumes, setVolumes] = React.useState({
                clickyBass: 4, drums: 2, subBass: 6, chopperBass: 4, elecGuitar: 3, synth: 0, violin: 2, piano: 0, africa1: 0
            });

            const synthsRef = React.useRef(null);
            const loopRef = React.useRef(null);
            const masterGainRef = React.useRef(null);
            const eqRef = React.useRef(null);
            const reverbRef = React.useRef(null);
            const delayRef = React.useRef(null);
            const distortionRef = React.useRef(null);
            const chorusRef = React.useRef(null);

            const NOTES = ["C2", "D2", "E2", "F2", "G2", "A2", "B2", "C3", "C4", "E4", "G4", "A4"];
            const SOLFEGE = { "C2": "低ド", "D2": "低レ", "E2": "低ミ", "F2": "低ファ", "G2": "低ソ", "A2": "低ラ", "B2": "低シ", "C3": "低ド+", "C4": "ド", "E4": "ミ", "G4": "ソ", "A4": "ラ" };
            const DURATION_OPTIONS = [
                { id: "16n", label: "極短クリック (16分)" },
                { id: "8n", label: "標準 (8分)" },
                { id: "4n", label: "長め (4分)" },
            ];

            React.useEffect(() => {
                if (autoCacheEnabled) {
                    const cached = localStorage.getItem("MIC_VICTORY_CLICKY_AUTOCACHE_v59_3");
                    if (cached) {
                        try {
                            const parsed = JSON.parse(cached);
                            if (parsed.instrumentSteps) setInstrumentSteps(parsed.instrumentSteps);
                            if (parsed.rapLyrics) setRapLyrics(parsed.rapLyrics);
                            if (parsed.bpm) setBpm(parsed.bpm);
                        } catch (e) {
                            console.error("Cache load error", e);
                        }
                    }
                }
            }, []);

            React.useEffect(() => {
                if (autoCacheEnabled) {
                    const cacheData = { instrumentSteps, rapLyrics, bpm, updatedAt: new Date().toISOString() };
                    localStorage.setItem("MIC_VICTORY_CLICKY_AUTOCACHE_v59_3", JSON.stringify(cacheData));
                }
            }, [instrumentSteps, rapLyrics, bpm, autoCacheEnabled]);

            React.useEffect(() => {
                if (masterGainRef.current) masterGainRef.current.gain.value = masterVolume;
                if (eqRef.current) eqRef.current.low.value = masterBassBoost;
                if (reverbRef.current) reverbRef.current.wet.value = reverbWet;
                if (delayRef.current) delayRef.current.feedback.value = delayFeedback;
                if (distortionRef.current) distortionRef.current.distortion = distortionAmount;
                if (chorusRef.current) chorusRef.current.wet.value = chorusWet;
            }, [masterVolume, masterBassBoost, reverbWet, delayFeedback, distortionAmount, chorusWet]);

            React.useEffect(() => {
                const masterGain = new Tone.Gain(masterVolume).toDestination();
                masterGainRef.current = masterGain;

                const eq = new Tone.EQ3({ low: masterBassBoost, lowFrequency: 150, mid: 2.0, high: 3.0 }).connect(masterGain);
                eqRef.current = eq;

                const reverb = new Tone.Reverb({ decay: 1.6, wet: reverbWet }).connect(eq);
                reverbRef.current = reverb;

                const delay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: delayFeedback, wet: 0.12 }).connect(reverb);
                delayRef.current = delay;

                const chorus = new Tone.Chorus(4, 2.5, chorusWet).connect(delay);
                chorusRef.current = chorus;

                const distortion = new Tone.Distortion(distortionAmount).connect(chorus);
                distortionRef.current = distortion;

                const cGains = {};
                Object.keys(instrumentSteps).forEach(key => {
                    const cg = new Tone.Gain(Tone.dbToGain(volumes[key] || 0)).connect(distortion);
                    cGains[key] = cg;
                });

                synthsRef.current = {
                    clickyBass: new Tone.MonoSynth({
                        oscillator: { type: "sawtooth" },
                        envelope: { attack: 0.001, decay: 0.25, sustain: 0.2, release: 0.1 },
                        filterEnvelope: { attack: 0.001, decay: 0.15, sustain: 0.1, release: 0.1, baseFrequency: 120, octaves: 4.2, exponent: 2 }
                    }).connect(cGains.clickyBass),
                    subBass: new Tone.MonoSynth({
                        oscillator: { type: "sine" },
                        envelope: { attack: 0.005, decay: 0.4, sustain: 0.6, release: 0.25 },
                        filterEnvelope: { attack: 0.005, decay: 0.25, sustain: 0.35, release: 0.2, baseFrequency: 65, octaves: 1.8 }
                    }).connect(cGains.subBass),
                    chopperBass: new Tone.MonoSynth({
                        oscillator: { type: "square" },
                        envelope: { attack: 0.002, decay: 0.18, sustain: 0.1, release: 0.05 },
                        filterEnvelope: { attack: 0.002, decay: 0.12, sustain: 0.2, release: 0.05, baseFrequency: 200, octaves: 3.5 }
                    }).connect(cGains.chopperBass),
                    elecGuitar: new Tone.Synth({
                        oscillator: { type: "sawtooth" },
                        envelope: { attack: 0.005, decay: 0.25, sustain: 0.3, release: 0.1 }
                    }).connect(cGains.elecGuitar),
                    synth: new Tone.Synth({ oscillator: { type: "pulse", width: 0.45 }, envelope: { attack: 0.01, decay: 0.3, sustain: 0.45, release: 0.2 } }).connect(cGains.synth),
                    violin: new Tone.Synth({
                        oscillator: { type: "sawtooth" },
                        envelope: { attack: 0.05, decay: 0.3, sustain: 0.8, release: 0.3 }
                    }).connect(cGains.violin),
                    africa1: new Tone.MembraneSynth({ pitchDecay: 0.02, octaves: 4.5, oscillator: { type: "sine" }, envelope: { attack: 0.001, decay: 0.3, sustain: 0.01, release: 0.15 } }).connect(cGains.africa1),
                    piano: new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.008, decay: 0.4, sustain: 0.35, release: 0.45 } }).connect(cGains.piano),
                    drums: {
                        kick: new Tone.MembraneSynth({ pitchDecay: 0.06, octaves: 6.5, oscillator: { type: "sine" }, envelope: { attack: 0.0001, decay: 0.35, sustain: 0.01, release: 0.15 } }).connect(cGains.drums),
                        snare: new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.0001, decay: 0.2, sustain: 0 } }).connect(cGains.drums),
                        hihat: new Tone.MetalSynth({ frequency: 950, envelope: { attack: 0.0005, decay: 0.03, release: 0.01 }, harmonicity: 5.2, modulationIndex: 34, resonance: 7500, octaves: 1.6 }).connect(cGains.drums),
                        clap: new Tone.NoiseSynth({ noise: { type: "pink" }, envelope: { attack: 0.005, decay: 0.15, sustain: 0 } }).connect(cGains.drums),
                    },
                    eq, reverb, distortion, chorus
                };

                return () => { Tone.Transport.stop(); Tone.Transport.cancel(); };
            }, []);

            React.useEffect(() => {
                Tone.Transport.bpm.value = bpm;
                Tone.Transport.cancel();

                if (playing) {
                    let stepCounter = 0;
                    loopRef.current = new Tone.Loop(time => {
                        let step = stepCounter % TOTAL_STEPS;
                        const bar = Math.floor(step / BAR_STEPS);
                        const sInBar = step % BAR_STEPS;

                        setCurrentStep(sInBar);
                        setCurrentBar(bar);

                        if (dlandMode && sInBar === 0 && !powerSavingMode) {
                            const colors = ["border-cyan-500", "border-pink-500", "border-amber-500", "border-yellow-500", "border-emerald-500"];
                            setFlashColor(colors[Math.floor(Math.random() * colors.length)]);
                        }

                        const syns = synthsRef.current;
                        if (!syns) return;

                        Object.keys(instrumentSteps).forEach(instKey => {
                            const item = instrumentSteps[instKey][step];
                            if (!item) return;

                            const note = typeof item === "object" ? item.note : item;
                            const dur = typeof item === "object" ? (item.dur || "8n") : "8n";

                            if (instKey === "drums") {
                                if (typeof item === "object") {
                                    if (item.kick) syns.drums.kick.triggerAttackRelease(item.subBoost ? "C0" : "C1", "8n", time);
                                    if (item.snare) syns.drums.snare.triggerAttackRelease("8n", time);
                                    if (item.hihat) syns.drums.hihat.triggerAttackRelease("32n", time, 0.9);
                                    if (item.clap) syns.drums.clap.triggerAttackRelease("8n", time);
                                }
                            } else if (instKey === "clickyBass") {
                                syns.clickyBass.triggerAttackRelease(note || "C2", dur, time);
                            } else if (instKey === "subBass") {
                                syns.subBass.triggerAttackRelease(item.subBoost ? "C0" : "C1", dur, time);
                            } else if (syns[instKey]) {
                                syns[instKey].triggerAttackRelease(note || "C3", dur, time);
                            }
                        });

                        stepCounter++;
                    }, "16n").start(0);

                    Tone.Transport.start();
                } else {
                    Tone.Transport.stop();
                }
            }, [playing, bpm, instrumentSteps, dlandMode, powerSavingMode]);

            const togglePlay = async () => {
                await Tone.start();
                setPlaying(!playing);
                setStatus(playing ? "停止しました" : `▶ 再生中 (BPM: ${bpm}) - BLAUND v59.3 ライブアンセム`);
            };

            const saveToCrera = () => {
                const newCrera = {
                    id: Date.now(),
                    title: `BLAUND Clicky Suite #${creraList.length + 1} (${slotName})`,
                    bpm,
                    date: new Date().toLocaleTimeString(),
                    credit: "micvictorydanb / 作曲: 28 / 著作権フリー"
                };
                setCreraList(prev => [...prev, newCrera]);
                setStatus("🌊 crera ストレージに正常保存しました！");
            };

            const toggleRecord = async () => {
                await Tone.start();
                setIsRecording(!isRecording);
                if (!isRecording) {
                    setStatus("🔴 ライブ録音中...");
                } else {
                    const newTake = {
                        id: Date.now(),
                        title: `BLAUND ライブテイク #${recordedTakes.length + 1} (${slotName})`,
                        bpm,
                        date: new Date().toLocaleTimeString(),
                        credit: "micvictorydanb / 作曲: 28 / 著作権フリー"
                    };
                    setRecordedTakes(prev => [...prev, newTake]);
                    setStatus("⏹ ライブ録音をリストに記録しました！");
                }
            };

            const generateAi800Lyrics = () => {
                const theme = lyricThemeInput || "Clicky Bit アタック";
                const addition = additionalNoteInput ? `（PR: ${additionalNoteInput}）` : "";
                
                const generated = `[Intro - Clicky Bit & BLAUND 公式リリース]
エレキギターの歪みと重低音クレラが夜の静寂を圧倒的な高音質で切り裂いていく。
販売：micvictorydanb ／ 作曲：28 による著作権フリーの完全リリース。
テーマ：「${theme}」${addition}――今、最高峰のサウンドスケープが幕を開ける！

[Verse 1 - ドラムAIグルーヴ & チョッパーベース]
AIが生成したビートとタイトなスラップ音、そしてバイオリンの流麗な旋律がクロスオーバーする
妥協なきサウンドが胸の鼓動とシンクロし、極上のグルーヴを生み出す
BLAUNDの哲学、それは「世界最高級音感」による究極の音楽体験！

[Chorus / Outro - BLAUND 永遠のゴールド・スタンダード]
著作権フリー、完全なる自由の光が世界を包み込む
BLAUND — 世界最高級音感、それは永遠の輝き
MIC VICTORY、私たちが描く未来に限界など存在しない！！`;

                setRapLyrics(generated);
                setStatus(`✨ 宣伝歌詞の生成が完了しました！`);
            };

            const appendLyricsAction = () => {
                const addText = additionalNoteInput ? `\n\n[BLAUND Special PR]\n${additionalNoteInput}\n販売：micvictorydanb ／ 著作権フリー` : "";
                setRapLyrics(prev => prev + addText);
                setStatus("➕ つけ足しPRテキストを歌詞末尾に追加しました！");
            };

            const handleGenerateAiDrum = (genre) => {
                const newArr = new Array(TOTAL_STEPS).fill(null);

                for (let i = 0; i < TOTAL_STEPS; i++) {
                    let kick = false;
                    let snare = false;
                    let hihat = false;
                    let clap = false;

                    switch (genre) {
                        case 'edm':
                            kick = (i % 4 === 0);
                            snare = (i % 8 === 4);
                            hihat = true;
                            clap = (i % 16 === 12);
                            break;
                        case 'hiphop':
                            kick = (i === 0 || i === 6 || i === 10 || i % 16 === 0);
                            snare = (i % 16 === 4 || i % 16 === 12);
                            hihat = (i % 2 === 0 || i % 4 === 3);
                            clap = (i % 16 === 12);
                            break;
                        case 'rock':
                            kick = (i % 4 === 0 || i === 10 || i === 14);
                            snare = (i % 8 === 4);
                            hihat = (i % 2 === 0);
                            break;
                        case 'lofi':
                            kick = (i % 16 === 0 || i % 16 === 7 || i % 16 === 10);
                            snare = (i % 16 === 4 || i % 16 === 12);
                            hihat = (Math.random() > 0.3);
                            break;
                        case 'random':
                        default:
                            kick = (Math.random() > 0.6);
                            snare = (i % 8 === 4);
                            hihat = (Math.random() > 0.4);
                            clap = (i % 16 === 12);
                            break;
                    }

                    if (kick || snare || hihat || clap) {
                        newArr[i] = { kick, snare, hihat, clap, subBoost: true };
                    }
                }

                setInstrumentSteps(prev => ({ ...prev, drums: newArr }));
                setStatus(`🤖 【ドラムAI】スタイル [${genre.toUpperCase()}] のビート自動生成完了！`);
            };

            const applyAiPattern = (instKey, modeType) => {
                const newArr = new Array(TOTAL_STEPS).fill(null);
                const scales = {
                    clickyBass: ["C2", "D2", "E2", "G2", "A2"],
                    chopperBass: ["C2", "E2", "G2", "A2"],
                    elecGuitar: ["E3", "G3", "B3", "E4", "A4"],
                    violin: ["E4", "G4", "B4", "C5", "E5"],
                    synth: ["C4", "E4", "G4", "A4", "C5"],
                    piano: ["C4", "E4", "G4", "B4"]
                };
                const scale = scales[instKey] || ["C4", "E4", "G4", "A4"];

                for (let i = 0; i < TOTAL_STEPS; i++) {
                    if (modeType === 'chopper_riff') {
                        if (i % 2 === 0 || i % 4 === 3) {
                            newArr[i] = { note: scale[i % scale.length], dur: "16n" };
                        }
                    } else if (modeType === 'violin_ai') {
                        if (Math.random() < 0.4) {
                            const note = scale[Math.floor(Math.random() * scale.length)];
                            newArr[i] = { note, dur: "8n" };
                        }
                    } else {
                        if (i % 4 === 0) {
                            newArr[i] = { note: scale[i % scale.length], dur: selectedDuration };
                        }
                    }
                }

                setInstrumentSteps(prev => ({ ...prev, [instKey]: newArr }));
                setStatus(`🤖 【${instKey}】パターン [${modeType}] 生成完了！`);
            };

            const playNoteKeyboard = (note) => {
                setSelectedNote(note);
                const syns = synthsRef.current;
                if (!syns) return;

                if (selectedInstrument === "drums") {
                    if (selectedDrumPart === "kick") syns.drums.kick.triggerAttackRelease("C0", selectedDuration);
                    else if (selectedDrumPart === "snare") syns.drums.snare.triggerAttackRelease(selectedDuration);
                    else if (selectedDrumPart === "hihat") syns.drums.hihat.triggerAttackRelease("32n");
                    else syns.drums.clap.triggerAttackRelease(selectedDuration);
                } else if (syns[selectedInstrument]) {
                    syns[selectedInstrument].triggerAttackRelease(note, selectedDuration);
                }

                if (currentStep !== -1) {
                    const stepIdx = currentBar * BAR_STEPS + currentStep;
                    toggleStepWithDuration(selectedInstrument, stepIdx, note, selectedDuration);
                }
            };

            const toggleStepWithDuration = (instKey, idx, note = selectedNote, dur = selectedDuration) => {
                setInstrumentSteps(prev => {
                    const currentArr = [...prev[instKey]];
                    if (instKey === "drums") {
                        const currentObj = currentArr[idx] || { kick: false, snare: false, hihat: false, clap: false };
                        const updatedObj = { ...currentObj, [selectedDrumPart]: !currentObj[selectedDrumPart] };
                        const hasAny = Object.values(updatedObj).some(Boolean);
                        currentArr[idx] = hasAny ? updatedObj : null;
                    } else {

                                        <div className="flex gap-2">
                                            <button onClick={() => applyAiPattern("violin", "violin_ai")} className="flex-1 py-1.5 bg-purple-600 text-white font-bold rounded">🎻 バイオリン AI予測メロディ生成</button>
                                            <button onClick={() => clearSpecificInstrument("violin")} className="px-3 py-1.5 bg-slate-800 text-red-400 rounded font-bold">🗑️ クリア</button>
                                        </div>
                                    ) : selectedInstrument !== "drums" ? (
                                        <div className="flex gap-2">
                                            <button onClick={() => applyAiPattern(selectedInstrument, "standard")} className="flex-1 py-1.5 bg-cyan-700 text-white font-bold rounded">🤖 標準AI 16ステップ生成</button>
                                            <button onClick={() => clearSpecificInstrument(selectedInstrument)} className="px-3 py-1.5 bg-slate-800 text-red-400 rounded font-bold">🗑️ クリア</button>
                                        </div>
                                    ) : (
                                        <div className="flex justify-end">
                                            <button onClick={() => clearSpecificInstrument("drums")} className="px-3 py-1.5 bg-slate-800 text-red-400 rounded font-bold text-xs">🗑️ ドラム全クリア</button>
                                        </div>
                                    )}

                                    {selectedInstrument !== "drums" && (
                                        <div className="grid grid-cols-6 sm:grid-cols-12 gap-1 pt-1">
                                            {NOTES.map(note => (
                                                <button key={note} onClick={() => playNoteKeyboard(note)} className="py-2.5 bg-slate-800 border border-slate-700 rounded flex flex-col items-center justify-center hover:bg-slate-700 active:scale-95">
                                                    <span className="font-bold text-yellow-300 text-[10px]">{SOLFEGE[note] || note}</span>
                                                    <span className="text-[8px] text-slate-400">{note}</span>
                                                </button>
                                            ))}
                                        </div>
                                    )}

                                    <div className="mt-3 bg-slate-950 p-2.5 rounded border border-slate-800 flex flex-col gap-1.5">
                                        <div className="flex justify-between items-center text-[10px] text-slate-400">
                                            <span>🎛️ 【{selectedInstrument}】グリッドステップ (16ステップ)</span>
                                            <span className="text-yellow-400 font-mono">Bar: {currentBar + 1}</span>
                                        </div>
                                        <div className="grid grid-cols-8 sm:grid-cols-16 gap-1">
                                            {Array.from({ length: 16 }).map((_, idx) => {
                                                const globalIdx = currentBar * BAR_STEPS + idx;
                                                const stepData = instrumentSteps[selectedInstrument][globalIdx];
                                                
                                                let isActive = false;
                                                if (selectedInstrument === "drums") {
                                                    isActive = stepData && stepData[selectedDrumPart];
                                                } else {
                                                    isActive = stepData !== null;
                                                }

                                                const isCurrentPlaying = playing && currentStep === idx;

                                                return (
                                                    <button key={idx} onClick={() => toggleStepWithDuration(selectedInstrument, globalIdx)} className={`h-9 rounded flex flex-col items-center justify-center font-mono text-[10px] border transition-all ${isCurrentPlaying ? 'border-yellow-400 ring-2 ring-yellow-400' : 'border-slate-800'} ${isActive ? 'bg-gradient-to-t from-yellow-500 to-pink-600 text-slate-950 font-black' : 'bg-slate-900 text-slate-500 hover:bg-slate-800'}`}>
                                                        <span>{idx + 1}</span>
                                                        <span className="text-[8px]">{isActive ? '●' : '·'}</span>
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {tab === "MEMORY" && (
                            <div className="flex flex-col gap-3">
                                <div className="bg-slate-900 p-4 rounded border border-slate-800 flex flex-col gap-3">
                                    <h2 className="text-sm font-bold text-yellow-300">💾 プロジェクトファイル保存</h2>
                                    <input type="text" value={slotName} onChange={e => setSlotName(e.target.value)} className="w-full bg-slate-950 text-yellow-300 px-3 py-2 rounded border border-slate-800 font-mono text-xs font-bold" />
                                    <button onClick={exportProjectToFile} className="py-2.5 bg-gradient-to-r from-yellow-500 to-pink-600 font-black text-slate-950 rounded shadow">
                                        💾 著作権フリープロジェクト保存 (JSON)
                                    </button>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.render(<MasterSynthApp />, document.getElementById("root"));
    </script>
</body>
</html>
