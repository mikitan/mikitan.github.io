<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIC VICTORY BAND - Popping Heavy Bass v100.10</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans select-none pb-12 overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        function MasterSynthApp() {
            // --- タブ & 基本設定 ---
            const [activeTab, setActiveTab] = React.useState("SEQUENCER"); 
            const [playing, setPlaying] = React.useState(false);
            const [bpm, setBpm] = React.useState(116);
            const [playbackRate, setPlaybackRate] = React.useState(1.0);
            const [barsCount, setBarsCount] = React.useState(38);
            const [burstMode, setBurstMode] = React.useState(1);
            const [currentBar, setCurrentBar] = React.useState(0);
            const [currentStep, setCurrentStep] = React.useState(-1);
            const [status, setStatus] = React.useState("🔥 MIC VICTORY BAND 稼働中");

            const BAR_STEPS = 16;
            const TOTAL_STEPS = barsCount * BAR_STEPS;

            // --- 選択中楽器・パーツ ---
            const [selectedInstrument, setSelectedInstrument] = React.useState("synthLowBass");
            const [selectedDrumPart, setSelectedDrumPart] = React.useState("kick");
            const [selectedNote, setSelectedNote] = React.useState("C2");
            const [aiPromptTopic, setAiPromptTopic] = React.useState("圧倒的な重低音とキレのあるPoppingビート");

            // --- AI歌詞/プロンプト ---
            const [rapLyrics, setRapLyrics] = React.useState(
`[Intro - MIC VICTORY BAND Popping Special]
重低音サブベースが胸を打ち抜く！1曲38小節の完全なるグルーヴ。
体を揺らし、ヒットを刻め！最高峰のワクワクサウンドが今始まる。

[Verse 1 - 鬼キレ重低音AIビート構築]
シンセサイザー電子低音＆サブベースが圧倒的なうねりを生む。
無駄な高音を削ぎ落とし、ダンサーの魂を震わせる。`
            );

            // --- 音割れ（歪み）防止ミキサー パラメータ ---
            const [masterVolume, setMasterVolume] = React.useState(1.6);
            const [masterBassBoost, setMasterBassBoost] = React.useState(24);
            const [volumes, setVolumes] = React.useState({
                synthLowBass: 18,
                synthSubBass: 16,
                drums: 12,
                synthLeadNormal: 8,
                piano: 6,
                elecGuitar: 4,
                africa: 2
            });
            const [mutes, setMutes] = React.useState({
                synthLowBass: false, synthSubBass: false, drums: false,
                synthLeadNormal: false, piano: false, elecGuitar: false, africa: false
            });

            // --- ストレージデータ ---
            const [storageList, setStorageList] = React.useState([
                { id: 1, title: "MIC VICTORY 38小節 Popping Session #1", bars: 38, bpm: 116, date: "12:00" }
            ]);
            const [saveSlotName, setSaveSlotName] = React.useState("MIC_VICTORY_HEAVY_BASS_v100");

            // --- 録音機能 ---
            const [isRecording, setIsRecording] = React.useState(false);
            const [recMode, setRecMode] = React.useState("master");
            const [recordedAudioList, setRecordedAudioList] = React.useState([]);
            const mediaRecorderRef = React.useRef(null);
            const audioChunksRef = React.useRef([]);
            const destStreamNodeRef = React.useRef(null);

            // --- ステップデータ定義 ---
            const [instrumentSteps, setInstrumentSteps] = React.useState({
                synthLowBass: new Array(64 * BAR_STEPS).fill(null),
                synthSubBass: new Array(64 * BAR_STEPS).fill(null),
                drums: new Array(64 * BAR_STEPS).fill(null),
                synthLeadNormal: new Array(64 * BAR_STEPS).fill(null),
                piano: new Array(64 * BAR_STEPS).fill(null),
                elecGuitar: new Array(64 * BAR_STEPS).fill(null),
                africa: new Array(64 * BAR_STEPS).fill(null),
            });

            // --- Tone.js 音源参照 ---
            const synthsRef = React.useRef(null);
            const loopRef = React.useRef(null);
            const masterGainRef = React.useRef(null);
            const limiterRef = React.useRef(null);
            const compRef = React.useRef(null);
            const eqRef = React.useRef(null);
            const instrumentGainsRef = React.useRef({});
            const directStepIdxRef = React.useRef(0);

            // --- 音色とラベルデータ ---
            const INSTRUMENT_MAP = [
                { id: "synthLowBass", label: "超重低音ベース (Low Synth)", color: "from-red-900 to-red-600" },
                { id: "synthSubBass", label: "サブベース極太 (Sub Bass)", color: "from-amber-900 to-red-800" },
                { id: "drums", label: "鬼キレドラム (Popping Beats)", color: "from-orange-700 to-red-600" },
                { id: "synthLeadNormal", label: "電子通常シンセ音 (Synth Lead)", color: "from-cyan-800 to-blue-600" },
                { id: "piano", label: "エレクトリックピアノ", color: "from-blue-900 to-indigo-700" },
                { id: "elecGuitar", label: "ファンクギター電子", color: "from-amber-800 to-orange-700" },
                { id: "africa", label: "パーカッション (Afro Groove)", color: "from-yellow-800 to-amber-600" },
            ];

            const KEYBOARD_NOTES = [
                { note: "C2", label: "ド", color: "bg-red-600 hover:bg-red-500" },
                { note: "D2", label: "レ", color: "bg-orange-600 hover:bg-orange-500" },
                { note: "E2", label: "ミ", color: "bg-yellow-600 hover:bg-yellow-500" },
                { note: "F2", label: "ファ", color: "bg-green-600 hover:bg-green-500" },
                { note: "G2", label: "ソ", color: "bg-cyan-600 hover:bg-cyan-500" },
                { note: "A2", label: "ラ", color: "bg-blue-600 hover:bg-blue-500" },
                { note: "B2", label: "シ", color: "bg-purple-600 hover:bg-purple-500" },
                { note: "C3", label: "高ド", color: "bg-rose-600 hover:bg-rose-500" },
            ];

            // 🎧 Tone.js オーディオノード初期化（歪み・音割れブロック回路）
            React.useEffect(() => {
                const masterGain = new Tone.Gain(masterVolume);
                masterGainRef.current = masterGain;

                const limiter = new Tone.Limiter(-0.1); 
                limiterRef.current = limiter;

                const comp = new Tone.Compressor({ threshold: -10, ratio: 5, attack: 0.003, release: 0.1 });
                compRef.current = comp;

                const eq = new Tone.EQ3({ low: masterBassBoost, lowFrequency: 80, mid: 0, high: -3 });
                eqRef.current = eq;

                const destNode = Tone.context.createMediaStreamDestination();
                destStreamNodeRef.current = destNode;

                eq.connect(comp);
                comp.connect(limiter);
                limiter.connect(masterGain);
                masterGain.connect(Tone.Destination);
                masterGain.connect(destNode);

                const cGains = {};
                Object.keys(instrumentSteps).forEach(key => {
                    const cg = new Tone.Gain(Tone.dbToGain(volumes[key] || 0)).connect(eq);
                    cGains[key] = cg;
                });
                instrumentGainsRef.current = cGains;

                synthsRef.current = {
                    synthLowBass: new Tone.MonoSynth({ oscillator: { type: "sawtooth" }, envelope: { attack: 0.005, decay: 0.2, sustain: 0.4, release: 0.1 } }).connect(cGains.synthLowBass),
                    synthSubBass: new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.01, decay: 0.4, sustain: 0.6, release: 0.2 } }).connect(cGains.synthSubBass),
                    synthLeadNormal: new Tone.Synth({ oscillator: { type: "triangle" }, envelope: { attack: 0.01, decay: 0.2, sustain: 0.3, release: 0.1 } }).connect(cGains.synthLeadNormal),
                    piano: new Tone.PolySynth(Tone.Synth).connect(cGains.piano),
                    elecGuitar: new Tone.PluckSynth({ attackNoise: 1, dampening: 4000, resonance: 0.7 }).connect(cGains.elecGuitar),
                    africa: new Tone.MembraneSynth({ pitchDecay: 0.05, octaves: 3, envelope: { attack: 0.001, decay: 0.2, sustain: 0.01 } }).connect(cGains.africa),
                    drums: {
                        kick: new Tone.MembraneSynth({ pitchDecay: 0.05, octaves: 6, envelope: { attack: 0.001, decay: 0.3, sustain: 0.01 } }).connect(cGains.drums),
                        snare: new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.001, decay: 0.2, sustain: 0 } }).connect(cGains.drums),
                        hihat: new Tone.MetalSynth({ frequency: 250, envelope: { attack: 0.001, decay: 0.04, release: 0.01 }, harmonicity: 5.1, modulationIndex: 32, resonance: 4000, octaves: 1.5 }).connect(cGains.drums),
                        clap: new Tone.NoiseSynth({ noise: { type: "pink" }, envelope: { attack: 0.005, decay: 0.15, sustain: 0 } }).connect(cGains.drums),
                    }
                };

                return () => { Tone.Transport.stop(); Tone.Transport.cancel(); };
            }, []);

            React.useEffect(() => {
                if (masterGainRef.current) masterGainRef.current.gain.value = masterVolume;
                if (eqRef.current) eqRef.current.low.value = masterBassBoost;
                Object.keys(volumes).forEach(key => {
                    if (instrumentGainsRef.current[key]) {
                        const val = mutes[key] ? -Infinity : volumes[key];
                        instrumentGainsRef.current[key].gain.value = Tone.dbToGain(val);
                    }
                });
            }, [masterVolume, masterBassBoost, volumes, mutes]);

            React.useEffect(() => {
                Tone.Transport.bpm.value = bpm * playbackRate;
                Tone.Transport.cancel();

                if (playing) {
                    let stepCounter = 0;
                    loopRef.current = new Tone.Loop(time => {
                        const totalLen = barsCount * BAR_STEPS;
                        let step = stepCounter % totalLen;
                        setCurrentStep(step % BAR_STEPS);
                        setCurrentBar(Math.floor(step / BAR_STEPS));
                        directStepIdxRef.current = step;

                        const syns = synthsRef.current;
                        if (syns) {
                            Object.keys(instrumentSteps).forEach(instKey => {
                                if (mutes[instKey]) return;
                                const item = instrumentSteps[instKey][step];
                                if (!item) return;

                                if (instKey === "drums") {
                                    if (item.kick) syns.drums.kick.triggerAttackRelease("C1", "8n", time);
                                    if (item.snare) syns.drums.snare.triggerAttackRelease("8n", time);
                                    if (item.hihat) syns.drums.hihat.triggerAttackRelease("32n", time);
                                    if (item.clap) syns.drums.clap.triggerAttackRelease("8n", time);
                                } else if (syns[instKey]) {
                                    syns[instKey].triggerAttackRelease(item.note || "C2", item.dur || "8n", time);
                                }
                            });
                        }
                        stepCounter++;
                    }, "16n").start(0);

                    Tone.Transport.start();
                } else {
                    Tone.Transport.stop();
                }
            }, [playing, bpm, playbackRate, instrumentSteps, barsCount, mutes]);

            const togglePlay = async () => {
                await Tone.start();
                setPlaying(!playing);
                setStatus(playing ? "■ 停止" : `▶ 再生中 (${bpm} BPM - クリア重低音)`);
            };

            const clearAll = () => {
                if (!window.confirm("全シーケンスデータを一括削除しますか？")) return;
                const cleared = {};
                Object.keys(instrumentSteps).forEach(k => { cleared[k] = new Array(64 * BAR_STEPS).fill(null); });
                setInstrumentSteps(cleared);
                setStatus("🗑️ 全データを消去しました");
            };

            const generateGenrePattern = (genre) => {
                const totalLen = barsCount * BAR_STEPS;
                const newSteps = { ...instrumentSteps };
                const drumsArr = new Array(totalLen).fill(null);
                const bassArr = new Array(totalLen).fill(null);

                for (let i = 0; i < totalLen; i++) {
                    const s = i % 16;
                    let kick = false, snare = false, hihat = false, clap = false;
                    let bassNote = null;

                    if (genre === "popping") {
                        kick = s === 0 || s === 6 || s === 10;
                        snare = s === 4 || s === 12;
                        hihat = s % 2 === 0;
                        clap = s === 12;
                        if (s === 0 || s === 3 || s === 10) bassNote = { note: "C2", dur: "16n" };
                    } else if (genre === "dance") {
                        kick = s % 4 === 0;
                        snare = s === 4 || s === 12;
                        hihat = true;
                        if (s % 2 === 0) bassNote = { note: "C2", dur: "8n" };
                    } else if (genre === "soul") {
                        kick = s === 0 || s === 7 || s === 10;
                        snare = s === 4 || s === 12;
                        hihat = true;
                        if (s === 0 || s === 6 || s === 12) bassNote = { note: "F2", dur: "8n" };
                    } else if (genre === "contemporary") {
                        kick = s === 0 || s === 8;
                        snare = s === 12;
                        hihat = s % 4 === 0;
                        if (s === 0 || s === 4 || s === 8) bassNote = { note: "A2", dur: "4n" };
                    } else if (genre === "blues" || genre === "pops" || genre === "rock") {
                        kick = s === 0 || s === 8 || s === 10;
                        snare = s === 4 || s === 12;
                        hihat = s % 2 === 0;
                        if (s === 0 || s === 8) bassNote = { note: "G2", dur: "8n" };
                    }

                    drumsArr[i] = { kick, snare, hihat, clap };
                    bassArr[i] = bassNote;
                }

                newSteps["drums"] = drumsArr;
                newSteps["synthLowBass"] = bassArr;
                setInstrumentSteps(newSteps);
                setStatus(`✨ 【${genre.toUpperCase()}】パターンを生成しました！`);
            };

            const handleKeyboardClick = (noteObj) => {
                const note = noteObj.note;
                setSelectedNote(note);
                const syns = synthsRef.current;
                if (!syns) return;

                if (selectedInstrument === "drums") {
                    if (selectedDrumPart === "kick") syns.drums.kick.triggerAttackRelease("C1", "8n");
                    else if (selectedDrumPart === "snare") syns.drums.snare.triggerAttackRelease("8n");
                    else if (selectedDrumPart === "hihat") syns.drums.hihat.triggerAttackRelease("32n");
                    else syns.drums.clap.triggerAttackRelease("8n");
                } else if (syns[selectedInstrument]) {
                    syns[selectedInstrument].triggerAttackRelease(note, "8n");
                }

                const targetStep = playing ? directStepIdxRef.current : (currentBar * BAR_STEPS);
                toggleStep(selectedInstrument, targetStep, note);
            };

            const toggleStep = (instKey, stepIdx, noteVal = selectedNote) => {
                setInstrumentSteps(prev => {
                    const currentArr = [...prev[instKey]];
                    if (instKey === "drums") {
                        const obj = currentArr[stepIdx] || { kick: false, snare: false, hihat: false, clap: false };
                        obj[selectedDrumPart] = !obj[selectedDrumPart];
                        currentArr[stepIdx] = obj;
                    } else {
                        currentArr[stepIdx] = currentArr[stepIdx] ? null : { note: noteVal, dur: "8n" };
                    }
                    return { ...prev, [instKey]: currentArr };
                });
            };

            const startRecording = async () => {
                try {
                    await Tone.start();
                    let captureStream = destStreamNodeRef.current.stream;
                    mediaRecorderRef.current = new MediaRecorder(captureStream);
                    audioChunksRef.current = [];
                    mediaRecorderRef.current.ondataavailable = (e) => { if (e.data.size > 0) audioChunksRef.current.push(e.data); };
                    mediaRecorderRef.current.onstop = () => {
                        const audioBlob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                        const audioUrl = URL.createObjectURL(audioBlob);
                        setRecordedAudioList(prev => [...prev, { id: Date.now(), title: `MIC VICTORY Track #${prev.length + 1}`, url: audioUrl }]);
                        setStatus("⏹️ 録音完了・保存しました！");
                    };
                    mediaRecorderRef.current.start();
                    setIsRecording(true);
                    if (!playing) togglePlay();
                } catch (err) {
                    alert("マイク/オーディオキャプチャエラー");
                }
            };

            const stopRecording = () => {
                if (mediaRecorderRef.current && isRecording) {
                    mediaRecorderRef.current.stop();
                    setIsRecording(false);
                }
            };

            const downloadJSON = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({
                    saveSlotName, bpm, barsCount, instrumentSteps
                }));
                const dlAnchorElem = document.createElement('a');
                dlAnchorElem.setAttribute("href", dataStr);
                dlAnchorElem.setAttribute("download", `${saveSlotName}.json`);
                dlAnchorElem.click();
            };

            return (
                <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col text-xs font-sans max-w-md mx-auto border-x border-slate-800 shadow-2xl">
                    
                    {/* ヘッダーエリア */}
                    <header className="bg-slate-900 px-3 py-2 border-b border-red-900/60 sticky top-0 z-50 flex items-center justify-between gap-2">
                        <div className="shrink-0">
                            <h1 className="font-black text-xs text-red-500 tracking-wider">MIC VICTORY BAND</h1>
                            <p className="text-[9px] text-yellow-400 font-bold">Popping Bass v100.10</p>
                        </div>
                        <div className="flex items-center gap-1.5 shrink-0">
                            <button onClick={clearAll} className="px-2 py-1 bg-red-800 hover:bg-red-700 font-bold rounded text-[9px] text-white shadow">
                                🗑️ 全削除
                            </button>
                            <button onClick={togglePlay} className={`px-2.5 py-1 font-black rounded shadow text-[10px] ${playing ? "bg-yellow-400 text-black animate-pulse" : "bg-red-600 text-white"}`}>
                                {playing ? "■ 停止" : "▶ 再生"}
                            </button>
                            <div className="bg-slate-950 px-1.5 py-0.5 rounded border border-slate-800 font-bold text-yellow-400 text-center">
                                <span className="text-[7px] block text-slate-500 leading-none">BPM</span>
                                <span className="text-[10px]">{bpm}</span>
                            </div>
                        </div>
                    </header>

                    {/* ナビゲーションタブ */}
                    <nav className="bg-slate-900 border-b border-slate-800 grid grid-cols-6 text-[10px] font-bold text-center">
                        {[
                            { id: "SEQUENCER", label: "🎹 Seq" },
                            { id: "REC_AI", label: "🎙️ 録音" },
                            { id: "MIXER", label: "🎚️ Mix" },
                            { id: "FX", label: "⚃ FX" },
                            { id: "STORAGE", label: "🌊 保存" },
                            { id: "SAVE", label: "💾 Export" }
                        ].map(tab => (
                            <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`py-2 border-r border-slate-800 transition-colors ${activeTab === tab.id ? "bg-red-700 text-white" : "bg-slate-900 text-slate-400 hover:text-slate-200"}`}>
                                {tab.label}
                            </button>
                        ))}
                    </nav>

                    {/* メインコンテンツ */}
                    <main className="p-2.5 flex flex-col gap-3">

                        {/* ステータスバー */}
                        <div className="bg-slate-900 px-2.5 py-1 rounded border border-red-900/40 text-[9px] text-amber-300 font-bold flex justify-between items-center">
                            <span className="truncate mr-2">{status}</span>
                            <span className="shrink-0 text-slate-400">Bar: <b className="text-white">{currentBar + 1}</b> / {barsCount}</span>
                        </div>

                        {/* --- TAB 1: SEQUENCER --- */}
                        {activeTab === "SEQUENCER" && (
                            <div className="flex flex-col gap-3">
                                
                                {/* コンパクト16ステップ グリッド表示 */}
                                <div className="bg-slate-900 p-2.5 rounded-lg border border-slate-800 flex flex-col gap-2">
                                    <div className="flex justify-between items-center">
                                        <div className="flex items-center gap-1.5">
                                            <span className="font-black text-amber-400 text-[11px]">⚏ グリッド</span>
                                            <span className="text-[9px] text-slate-400">第 <b>{currentBar + 1}</b> / {barsCount} 小節</span>
                                        </div>
                                        <button onClick={() => {
                                            const newArr = new Array(64 * 16).fill(null);
                                            setInstrumentSteps(prev => ({ ...prev, [selectedInstrument]: newArr }));
                                        }} className="px-1.5 py-0.5 bg-slate-800 text-red-400 font-bold rounded text-[9px] hover:bg-slate-700">クリア</button>
                                    </div>
                                    
                                    {/* 高度化・省スペースな 8x2 グリッド */}
                                    <div className="grid grid-cols-8 gap-1">
                                        {Array.from({ length: 16 }).map((_, stepInBar) => {
                                            const globalIdx = currentBar * 16 + stepInBar;
                                            const isCurrent = playing && currentStep === stepInBar;
                                            const item = instrumentSteps[selectedInstrument][globalIdx];
                                            const active = selectedInstrument === "drums" ? (item && item[selectedDrumPart]) : !!item;

                                            return (
                                                <button 
                                                    key={stepInBar} 
                                                    onClick={() => toggleStep(selectedInstrument, globalIdx)} 
                                                    className={`h-8 rounded flex flex-col items-center justify-center font-bold text-[9px] border transition-all ${
                                                        isCurrent 
                                                            ? "border-amber-400 bg-amber-500 text-black font-black scale-95" 
                                                            : active 
                                                                ? "bg-red-600 text-white border-red-500" 
                                                                : "bg-slate-950 text-slate-500 border-slate-800 hover:border-slate-700"
                                                    }`}
                                                >
                                                    <span className="leading-none">{stepInBar + 1}</span>
                                                    {active && (
                                                        <span className="text-[7px] leading-none mt-0.5 opacity-90 truncate max-w-full px-0.5">
                                                            {selectedInstrument === "drums" ? selectedDrumPart[0].toUpperCase() : item.note}
                                                        </span>
                                                    )}
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>

                                {/* キーボード */}
                                <div className="bg-slate-900 p-2.5 rounded-lg border border-slate-800 flex flex-col gap-1.5">
                                    <span className="font-bold text-amber-300 text-[10px]">🎹 キーボード入力</span>
                                    <div className="grid grid-cols-8 gap-1">
                                        {KEYBOARD_NOTES.map(k => (
                                            <button 
                                                key={k.note} 
                                                onClick={() => handleKeyboardClick(k)} 
                                                className={`${k.color} h-8 rounded font-black text-white flex flex-col items-center justify-center shadow active:scale-95 transition-transform`}
                                            >
                                                <span className="text-[10px] leading-none">{k.label}</span>
                                                <span className="text-[7px] opacity-70 leading-none">{k.note}</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* 楽器セレクター */}
                                <div className="bg-slate-900 p-2.5 rounded-lg border border-slate-800 flex flex-col gap-1.5">
                                    <span className="font-bold text-amber-400 text-[10px]">⚡ 楽器切替</span>
                                    <div className="grid grid-cols-1 gap-1">
                                        {INSTRUMENT_MAP.map(inst => (
                                            <button 
                                                key={inst.id} 
                                                onClick={() => setSelectedInstrument(inst.id)} 
                                                className={`py-1.5 px-2.5 rounded font-bold text-left flex items-center justify-between border text-[10px] ${
                                                    selectedInstrument === inst.id 
                                                        ? "bg-gradient-to-r " + inst.color + " border-white/60 shadow text-white" 
                                                        : "bg-slate-950 border-slate-800 text-slate-400 hover:bg-slate-900"
                                                }`}
                                            >
                                                <span>{inst.label}</span>
                                                {selectedInstrument === inst.id && <span className="text-[8px] bg-white text-black px-1 rounded font-bold">ON</span>}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* ドラムパーツ切替（ドラム選択時のみ表示） */}
                                {selectedInstrument === "drums" && (
                                    <div className="bg-slate-900 p-2 rounded-lg border border-red-900/60 flex items-center justify-between gap-2">
                                        <span className="font-bold text-yellow-400 text-[10px] shrink-0">🥁 パーツ:</span>
                                        <div className="grid grid-cols-4 gap-1 flex-1">
                                            {["kick", "snare", "hihat", "clap"].map(part => (
                                                <button 
                                                    key={part} 
                                                    onClick={() => setSelectedDrumPart(part)} 
                                                    className={`py-1 rounded font-bold uppercase text-[9px] ${
                                                        selectedDrumPart === part ? "bg-amber-500 text-black" : "bg-slate-950 text-slate-400 border border-slate-800"
                                                    }`}
                                                >
                                                    {part}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {/* 小節数・バースト設定 */}
                                <div className="bg-slate-900 p-2.5 rounded-lg border border-slate-800 flex flex-col gap-2">
                                    <div className="flex items-center justify-between">
                                        <span className="font-bold text-slate-300 text-[10px]">小節数設定:</span>
                                        <div className="flex gap-1">
                                            {[16, 32, 38, 64].map(b => (
                                                <button 
                                                    key={b} 
                                                    onClick={() => setBarsCount(b)} 
                                                    className={`px-2 py-0.5 rounded font-bold text-[9px] ${
                                                        barsCount === b ? "bg-red-600 text-white" : "bg-slate-950 text-slate-400 border border-slate-800"
                                                    }`}
                                                >
                                                    {b}小節
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                {/* ジャンルパターン自動生成 */}
                                <div className="bg-slate-900 p-2.5 rounded-lg border border-slate-800 flex flex-col gap-1.5">
                                    <span className="font-bold text-amber-400 text-[10px]">🔥 ジャンル自動パターン</span>
                                    <div className="grid grid-cols-3 gap-1">
                                        <button onClick={() => generateGenrePattern("popping")} className="py-1.5 bg-red-700 text-white font-bold rounded text-[9px]">💥 Popping</button>
                                        <button onClick={() => generateGenrePattern("dance")} className="py-1.5 bg-blue-700 text-white font-bold rounded text-[9px]">🎧 Dance</button>
                                        <button onClick={() => generateGenrePattern("soul")} className="py-1.5 bg-amber-700 text-white font-bold rounded text-[9px]">🎷 Funk</button>
                                        <button onClick={() => generateGenrePattern("contemporary")} className="py-1.5 bg-purple-700 text-white font-bold rounded text-[9px]">🪘 Black</button>
                                        <button onClick={() => generateGenrePattern("pops")} className="py-1.5 bg-pink-700 text-white font-bold rounded text-[9px]">✨ Pops</button>
                                        <button onClick={() => generateGenrePattern("rock")} className="py-1.5 bg-orange-800 text-white font-bold rounded text-[9px]">⚡ Rock</button>
                                    </div>
                                </div>

                            </div>
                        )}

                        {/* --- TAB 2: REC & AI --- */}
                        {activeTab === "REC_AI" && (
                            <div className="flex flex-col gap-3">
                                <div className="bg-slate-900 p-2.5 rounded-lg border border-red-800 flex flex-col gap-2">
                                    <span className="font-bold text-amber-400 text-[10px]">🎙️ 録音スタジオ</span>
                                    <div className="grid grid-cols-3 gap-1">
                                        <button onClick={() => setRecMode("master")} className={`py-1 rounded font-bold text-[9px] ${recMode === "master" ? "bg-amber-600 text-white" : "bg-slate-950 text-slate-400"}`}>🔴 マスター</button>
                                        <button onClick={() => setRecMode("internal")} className={`py-1 rounded font-bold text-[9px] ${recMode === "internal" ? "bg-amber-600 text-white" : "bg-slate-950 text-slate-400"}`}>🎧 内部ミックス</button>
                                        <button onClick={() => setRecMode("mic")} className={`py-1 rounded font-bold text-[9px] ${recMode === "mic" ? "bg-amber-600 text-white" : "bg-slate-950 text-slate-400"}`}>🎤 マイク</button>
                                    </div>

                                    {!isRecording ? (
                                        <button onClick={startRecording} className="py-2 bg-red-600 font-bold text-white rounded shadow text-[10px]">🔴 録音開始</button>
                                    ) : (
                                        <button onClick={stopRecording} className="py-2 bg-yellow-400 text-black font-bold rounded shadow text-[10px]">⏹️ 録音停止・保存</button>
                                    )}

                                    {recordedAudioList.map(rec => (
                                        <div key={rec.id} className="bg-slate-950 p-1.5 rounded flex justify-between items-center border border-slate-800">
                                            <span className="font-bold text-yellow-300 text-[9px] truncate mr-1">{rec.title}</span>
                                            <audio controls src={rec.url} className="h-6 w-32 accent-red-500" />
                                        </div>
                                    ))}
                                </div>

                                <div className="bg-slate-900 p-2.5 rounded-lg border border-slate-800 flex flex-col gap-1.5">
                                    <div className="flex justify-between items-center">
                                        <span className="font-bold text-amber-400 text-[10px]">✨ AI歌詞生成</span>
                                        <button onClick={() => navigator.clipboard.writeText(rapLyrics)} className="px-1.5 py-0.5 bg-red-700 text-white font-bold rounded text-[8px]">コピー</button>
                                    </div>
                                    <textarea value={rapLyrics} onChange={e => setRapLyrics(e.target.value)} rows={5} className="bg-slate-950 border border-slate-800 rounded p-1.5 text-[10px] font-mono text-slate-200 leading-normal" />
                                </div>
                            </div>
                        )}

                        {/* --- TAB 3: MIXER --- */}
                        {activeTab === "MIXER" && (
                            <div className="bg-slate-900 p-2.5 rounded-lg border border-slate-800 flex flex-col gap-3">
                                <span className="font-bold text-amber-400 text-[10px]">🎚️ 重低音ミキサー (歪み防止回路搭載)</span>

                                <div className="bg-slate-950 p-2 rounded border border-slate-800 flex flex-col gap-2">
                                    <div className="flex flex-col gap-0.5">
                                        <div className="flex justify-between font-bold text-[9px]"><span>📢 マスター音量</span><span className="text-red-400">{masterVolume.toFixed(2)}x</span></div>
                                        <input type="range" min="0.2" max="2.5" step="0.05" value={masterVolume} onChange={e => setMasterVolume(Number(e.target.value))} className="accent-red-500" />
                                    </div>
                                    <div className="flex flex-col gap-0.5">
                                        <div className="flex justify-between font-bold text-[9px]"><span>🔊 重低音ブースト</span><span className="text-amber-400">{masterBassBoost} dB</span></div>
                                        <input type="range" min="0" max="30" step="1" value={masterBassBoost} onChange={e => setMasterBassBoost(Number(e.target.value))} className="accent-amber-500" />
                                    </div>
                                </div>

                                <div className="flex flex-col gap-1.5">
                                    {INSTRUMENT_MAP.map(inst => (
                                        <div key={inst.id} className="bg-slate-950 p-2 rounded border border-slate-800 flex flex-col gap-1">
                                            <div className="flex justify-between items-center font-bold text-[9px]">
                                                <span className="text-slate-200 truncate mr-2">{inst.label}</span>
                                                <div className="flex items-center gap-1.5 shrink-0">
                                                    <button onClick={() => setMutes(prev => ({ ...prev, [inst.id]: !prev[inst.id] }))} className={`px-1.5 py-0.5 rounded text-[8px] font-bold ${mutes[inst.id] ? "bg-red-800 text-white" : "bg-emerald-600 text-white"}`}>
                                                        {mutes[inst.id] ? "MUTE" : "ON"}
                                                    </button>
                                                    <span className="text-amber-400 w-8 text-right">{volumes[inst.id]}dB</span>
                                                </div>
                                            </div>
                                            <input type="range" min="-12" max="24" step="1" value={volumes[inst.id]} onChange={e => setVolumes({ ...volumes, [inst.id]: Number(e.target.value) })} className="accent-red-500" />
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* --- TAB 4: FX --- */}
                        {activeTab === "FX" && (
                            <div className="bg-slate-900 p-2.5 rounded-lg border border-slate-800 flex flex-col gap-3">
                                <span className="font-bold text-amber-400 text-[10px]">⚃ FX & 速度調整</span>
                                
                                <div className="grid grid-cols-2 gap-1.5">
                                    <button onClick={() => setStatus("⚡ スクラッチFX発動！")} className="py-2.5 bg-gradient-to-r from-red-600 to-purple-600 font-bold rounded text-white shadow text-[10px]">⚃ スクラッチ FX</button>
                                    <button onClick={() => setStatus("🔄 リピートバースト発動！")} className="py-2.5 bg-gradient-to-r from-amber-600 to-orange-600 font-bold rounded text-white shadow text-[10px]">🔄 リピートバースト</button>
                                </div>

                                <div className="bg-slate-950 p-2 rounded border border-slate-800 flex flex-col gap-1">
                                    <div className="flex justify-between font-bold text-[9px]">
                                        <span>⚡ 再生速度</span>
                                        <span className="text-yellow-400">{playbackRate.toFixed(2)}x (BPM: {Math.round(bpm * playbackRate)})</span>
                                    </div>
                                    <input type="range" min="0.5" max="2.0" step="0.05" value={playbackRate} onChange={e => setPlaybackRate(Number(e.target.value))} className="accent-amber-500" />
                                </div>
                            </div>
                        )}

                        {/* --- TAB 5: STORAGE --- */}
                        {activeTab === "STORAGE" && (
                            <div className="bg-slate-900 p-2.5 rounded-lg border border-slate-800 flex flex-col gap-2">
                                <div className="flex justify-between items-center">
                                    <span className="font-bold text-amber-400 text-[10px]">🌊 ストレージ</span>
                                    <button onClick={() => setStorageList(prev => [...prev, { id: Date.now(), title: `MIC VICTORY ${barsCount}小節 Session #${prev.length + 1}`, bars: barsCount, bpm, date: new Date().toLocaleTimeString() }])} className="px-2 py-0.5 bg-red-600 text-white font-bold rounded text-[9px]">
                                        保存
                                    </button>
                                </div>

                                {storageList.map(item => (
                                    <div key={item.id} className="bg-slate-950 p-2 rounded border border-slate-800 flex justify-between items-center">
                                        <div>
                                            <h4 className="font-bold text-yellow-300 text-[10px]">{item.title}</h4>
                                            <p className="text-[8px] text-slate-500">{item.bars}小節 / {item.bpm} BPM / {item.date}</p>
                                        </div>
                                        <button onClick={() => setStatus(`ロード完了: ${item.title}`)} className="px-2 py-1 bg-blue-600 text-white font-bold rounded text-[9px]">
                                            ロード
                                        </button>
                                    </div>
                                ))}
                            </div>
                        )}

                        {/* --- TAB 6: SAVE --- */}
                        {activeTab === "SAVE" && (
                            <div className="bg-slate-900 p-2.5 rounded-lg border border-slate-800 flex flex-col gap-2">
                                <span className="font-bold text-amber-400 text-[10px]">💾 プロジェクト保存</span>

                                <div className="bg-slate-950 p-2 rounded border border-slate-800 flex flex-col gap-2">
                                    <input type="text" value={saveSlotName} onChange={e => setSaveSlotName(e.target.value)} className="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-yellow-300 font-bold font-mono text-[10px]" />
                                    <button onClick={downloadJSON} className="py-2 bg-gradient-to-r from-orange-600 to-red-600 font-bold text-white rounded shadow text-[10px]">
                                        💾 JSONダウンロード
                                    </button>
                                </div>
                            </div>
                        )}

                    </main>
                </div>
            );
        }

        ReactDOM.render(<MasterSynthApp />, document.getElementById("root"));
    </script>
</body>
</html>
