<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIC VICTORY - DLAND DTM v57.1 ALBUM RELEASE & CRERA RECORDING SUITE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans select-none pb-24 overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        function MasterSynthApp() {
            const [tab, setTab] = React.useState("RAP_AI");
            const [playing, setPlaying] = React.useState(false);
            const [isRecording, setIsRecording] = React.useState(false);
            const [flashColor, setFlashColor] = React.useState("border-cyan-500");
            const [bpm, setBpm] = React.useState(116);
            const [currentBar, setCurrentBar] = React.useState(0);
            const [currentStep, setCurrentStep] = React.useState(-1);
            const [status, setStatus] = React.useState("✨ v57.1 歌詞題材AI自動生成 800字拡張＆崩さない絶対モード統合完了！");

            const [powerSavingMode, setPowerSavingMode] = React.useState(false);

            const BARS = 8;
            const BAR_STEPS = 16;
            const TOTAL_STEPS = BARS * BAR_STEPS;

            const [selectedInstrument, setSelectedInstrument] = React.useState("synth");
            const [selectedNote, setSelectedNote] = React.useState("C4");
            const [selectedDuration, setSelectedDuration] = React.useState("8n");
            const [selectedDrumPart, setSelectedDrumPart] = React.useState("kick");

            // 全体録音 crera 保存リスト
            const [recordedTakes, setRecordedTakes] = React.useState([
                { id: 1, title: "MIC VICTORY Anthem (Demo #1)", bpm: 116, date: "12:00:00", credit: "micvictorydanb / 作曲: 28" }
            ]);
            const [activePatternIndex, setActivePatternIndex] = React.useState(1);

            // 歌詞題材入力＆AI自動生成ステート
            const [lyricThemeInput, setLyricThemeInput] = React.useState("崩さない絶対、鋼鉄の意志、夜を突き抜けるスピード感、D-LAND DTMの重低音クレラ");
            const [rapLyrics, setRapLyrics] = React.useState(
`[Verse 1 - 青春・希望（スピード感とビートの共存）]
鳴り響くキックが心臓を叩く 止まらないビートが夜を突き抜ける
描き出した夢のキャンバスはいつでも まだ色褪せない眩しい青空のままで
画面の向こうへ届くこの歌声が 迷える背中を押す羅針盤になる
重低音クレラが足元を支えて どんな坂道だって全速力で駆け抜ける

[Chorus / Outro - 崩れない最強の結び (c) micvictorydanb 作曲: 28]
何度転んでも立ち上がる強い意志 決して崩れない鋼鉄のメロディー
MIC VICTORY それは俺たちの証し
D-LAND DTM クレラと共に 永遠に響け、この勝利の歌！`
            );

            const [masterBassBoost, setMasterBassBoost] = React.useState(12);
            const [masterVolume, setMasterVolume] = React.useState(1.3);
            const [dlandMode, setDlandMode] = React.useState(true);
            const [screenSaverActive, setScreenSaverActive] = React.useState(false);
            const [slotName, setSlotName] = React.useState("MIC_ALBUM_v57_MICVICTORYDANB_28");

            const INSTRUMENTS = [
                { id: "drums", label: "🥁 ドラム (20入)", color: "from-red-600 to-amber-600" },
                { id: "loopTrack", label: "🔁 ループ (20入)", color: "from-pink-600 to-rose-600" },
                { id: "subBass", label: "🔊 重低音ベース", color: "from-amber-600 to-orange-700" },
                { id: "bass", label: "🎸 ベース (20入)", color: "from-emerald-600 to-teal-600" },
                { id: "synth", label: "🎹 シンセ (20入)", color: "from-cyan-600 to-blue-700" },
                { id: "trumpet", label: "🎺 トランペット (20入)", color: "from-yellow-500 to-amber-600" },
                { id: "guitar", label: "🎸 エレキギター (20入)", color: "from-orange-600 to-red-700" },
                { id: "africa1", label: "🪘 ジャンベ (アフリカ)", color: "from-amber-700 to-yellow-800" },
                { id: "africa2", label: "🎹 カリンバ (アフリカ)", color: "from-yellow-600 to-amber-600" },
                { id: "piano", label: "🎹 ピアノ", color: "from-blue-600 to-indigo-600" },
                { id: "violin", label: "🎻 バイオリン", color: "from-amber-600 to-yellow-700" },
                { id: "flute", label: "🪈 フルート", color: "from-teal-500 to-cyan-600" },
            ];

            const [instrumentSteps, setInstrumentSteps] = React.useState({
                drums: new Array(TOTAL_STEPS).fill(null),
                loopTrack: new Array(TOTAL_STEPS).fill(null),
                subBass: new Array(TOTAL_STEPS).fill(null),
                bass: new Array(TOTAL_STEPS).fill(null),
                synth: new Array(TOTAL_STEPS).fill(null),
                trumpet: new Array(TOTAL_STEPS).fill(null),
                guitar: new Array(TOTAL_STEPS).fill(null),
                africa1: new Array(TOTAL_STEPS).fill(null),
                africa2: new Array(TOTAL_STEPS).fill(null),
                piano: new Array(TOTAL_STEPS).fill(null),
                violin: new Array(TOTAL_STEPS).fill(null),
                flute: new Array(TOTAL_STEPS).fill(null),
            });

            const [volumes, setVolumes] = React.useState({
                drums: 2, loopTrack: 0, subBass: 6, bass: 4, synth: 0, trumpet: 0, guitar: 0, africa1: 0, africa2: 0, piano: 0, violin: 0, flute: 0
            });

            const synthsRef = React.useRef(null);
            const loopRef = React.useRef(null);
            const masterGainRef = React.useRef(null);

            const NOTES = ["C4", "D4", "E4", "F4", "G4", "A4", "B4", "C5"];
            const SOLFEGE = { "C4": "ド", "D4": "レ", "E4": "ミ", "F4": "ファ", "G4": "ソ", "A4": "ラ", "B4": "シ", "C5": "ド" };
            const DURATION_OPTIONS = [
                { id: "16n", label: "極短 (16分)" },
                { id: "8n", label: "標準 (8分)" },
                { id: "4n", label: "長め (4分)" },
                { id: "2n", label: "超長 (2n)" },
            ];

            React.useEffect(() => {
                const masterGain = new Tone.Gain(masterVolume).toDestination();
                masterGainRef.current = masterGain;

                const eq = new Tone.EQ3({ low: masterBassBoost, lowFrequency: 160, mid: 1.5, high: 2.5 }).connect(masterGain);
                const reverb = new Tone.Reverb({ decay: 1.4, wet: 0.12 }).connect(eq);
                const delay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.2, wet: 0.1 }).connect(reverb);
                const distortion = new Tone.Distortion(0.08).connect(delay);

                const cGains = {};
                Object.keys(instrumentSteps).forEach(key => {
                    const cg = new Tone.Gain(Tone.dbToGain(volumes[key] || 0)).connect(distortion);
                    cGains[key] = cg;
                });

                synthsRef.current = {
                    subBass: new Tone.MonoSynth({
                        oscillator: { type: "sine" },
                        envelope: { attack: 0.005, decay: 0.35, sustain: 0.5, release: 0.2 },
                        filterEnvelope: { attack: 0.005, decay: 0.2, sustain: 0.3, release: 0.2, baseFrequency: 70, octaves: 1.5 }
                    }).connect(cGains.subBass),
                    bass: new Tone.MonoSynth({
                        oscillator: { type: "triangle" },
                        envelope: { attack: 0.01, decay: 0.3, sustain: 0.4, release: 0.2 }
                    }).connect(cGains.bass),
                    synth: new Tone.Synth({ oscillator: { type: "pulse", width: 0.4 }, envelope: { attack: 0.01, decay: 0.25, sustain: 0.4, release: 0.2 } }).connect(cGains.synth),
                    loopTrack: new Tone.Synth({ oscillator: { type: "square" }, envelope: { attack: 0.008, decay: 0.2, sustain: 0.3, release: 0.15 } }).connect(cGains.loopTrack),
                    guitar: new Tone.Synth({ oscillator: { type: "sawtooth" }, envelope: { attack: 0.005, decay: 0.2, sustain: 0.2, release: 0.1 } }).connect(cGains.guitar),
                    trumpet: new Tone.Synth({ oscillator: { type: "sawtooth6" }, envelope: { attack: 0.04, decay: 0.2, sustain: 0.6, release: 0.15 } }).connect(cGains.trumpet),
                    africa1: new Tone.MembraneSynth({ pitchDecay: 0.02, octaves: 4, oscillator: { type: "sine" }, envelope: { attack: 0.001, decay: 0.25, sustain: 0.01, release: 0.15 } }).connect(cGains.africa1),
                    africa2: new Tone.Synth({ oscillator: { type: "triangle" }, envelope: { attack: 0.001, decay: 0.2, sustain: 0.1, release: 0.2 } }).connect(cGains.africa2),
                    piano: new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.008, decay: 0.35, sustain: 0.3, release: 0.4 } }).connect(cGains.piano),
                    violin: new Tone.Synth({ oscillator: { type: "sawtooth" }, envelope: { attack: 0.08, decay: 0.25, sustain: 0.8, release: 0.4 } }).connect(cGains.violin),
                    flute: new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.06, decay: 0.25, sustain: 0.7, release: 0.3 } }).connect(cGains.flute),
                    drums: {
                        kick: new Tone.MembraneSynth({ pitchDecay: 0.06, octaves: 6, oscillator: { type: "sine" }, envelope: { attack: 0.0001, decay: 0.3, sustain: 0.01, release: 0.15 } }).connect(cGains.drums),
                        snare: new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.0001, decay: 0.18, sustain: 0 } }).connect(cGains.drums),
                        hihat: new Tone.MetalSynth({ frequency: 900, envelope: { attack: 0.0005, decay: 0.025, release: 0.01 }, harmonicity: 5.1, modulationIndex: 32, resonance: 7000, octaves: 1.5 }).connect(cGains.drums),
                        clap: new Tone.NoiseSynth({ noise: { type: "pink" }, envelope: { attack: 0.005, decay: 0.14, sustain: 0 } }).connect(cGains.drums),
                    },
                    eq, reverb, distortion
                };

                return () => { Tone.Transport.stop(); Tone.Transport.cancel(); };
            }, []);

            React.useEffect(() => {
                Tone.Transport.bpm.value = bpm;
                Tone.Transport.cancel();

                if (playing) {
                    let stepCounter = 0;
                    loopRef.current = new Tone.Loop(time => {
                        let step = stepCounter % TOTAL_STEPS;
                        const bar = Math.floor(step / BAR_STEPS);
                        const sInBar = step % BAR_STEPS;

                        setCurrentStep(sInBar);
                        setCurrentBar(bar);

                        if (dlandMode && sInBar === 0 && !powerSavingMode) {
                            const colors = ["border-cyan-500", "border-pink-500", "border-amber-500", "border-purple-500", "border-emerald-500"];
                            setFlashColor(colors[Math.floor(Math.random() * colors.length)]);
                        }

                        const syns = synthsRef.current;
                        if (!syns) return;

                        Object.keys(instrumentSteps).forEach(instKey => {
                            const item = instrumentSteps[instKey][step];
                            if (!item) return;

                            const note = typeof item === "object" ? item.note : item;
                            const dur = typeof item === "object" ? (item.dur || "8n") : "8n";

                            if (instKey === "drums") {
                                if (typeof item === "object") {
                                    if (item.kick) syns.drums.kick.triggerAttackRelease(item.subBoost ? "C0" : "C1", "8n", time);
                                    if (item.snare) syns.drums.snare.triggerAttackRelease("8n", time);
                                    if (item.hihat) syns.drums.hihat.triggerAttackRelease("32n", time, 0.85);
                                    if (item.clap) syns.drums.clap.triggerAttackRelease("8n", time);
                                }
                            } else if (instKey === "subBass") {
                                syns.subBass.triggerAttackRelease(item.subBoost ? "C0" : "C1", dur, time);
                            } else if (syns[instKey]) {
                                syns[instKey].triggerAttackRelease(note || "C4", dur, time);
                            }
                        });

                        stepCounter++;
                    }, "16n").start(0);

                    Tone.Transport.start();
                } else {
                    Tone.Transport.stop();
                }
            }, [playing, bpm, instrumentSteps, dlandMode, powerSavingMode]);

            const togglePlay = async () => {
                await Tone.start();
                setPlaying(!playing);
                setStatus(playing ? "停止しました" : `▶ 再生中 (BPM: ${bpm}) - 作曲: 28 / (c) micvictorydanb`);
            };

            const toggleRecord = async () => {
                await Tone.start();
                setIsRecording(!isRecording);
                if (!isRecording) {
                    setStatus("🔴 全体リアルタイム・crera録音中...");
                } else {
                    const newTake = {
                        id: Date.now(),
                        title: `アルバムテイク #${recordedTakes.length + 1} (${slotName})`,
                        bpm,
                        date: new Date().toLocaleTimeString(),
                        credit: "micvictorydanb / 作曲: 28"
                    };
                    setRecordedTakes(prev => [...prev, newTake]);
                    setStatus("⏹ 全体録音を crera 保存リストに正常記録しました！");
                }
            };

            // 800字AI歌詞自動生成（題材反映＆崩さない絶対モード）
            const generateAi800Lyrics = () => {
                const theme = lyricThemeInput || "崩さない絶対、MIC VICTORY";
                const generated = `[Intro - D-LAND DTM 崩さない絶対の幕開け]
重低音クレラが地響きを立てて、夜の静寂を切り裂いていく。
何度試練が立ちはだかろうとも、俺たちの歩みは絶対に崩れない。
題材：「${theme}」を胸に、いま全てのビートが一つに融合する！

[Verse 1 - 青春の疾走と鋼鉄の意志]
鳴り響くキックが心臓を叩く 止まらないビートが夜を突き抜ける
描き出した夢のキャンバスはいつでも まだ色褪せない眩しい青空のままで
画面の向こうへ届くこの歌声が 迷える背中を押す羅針盤になる
重低音クレラが足元を支えて どんな坂道だって全速力で駆け抜ける
「崩さない絶対」の誓いを胸に、一歩も引かずに未来を切り拓け！

[Verse 2 - 深化する重低音とクレラの鼓動]
低音の波がフロアを揺らし、熱狂の渦へとオーディエンスを飲み込む
シンセサイザーの閃光が幾重にも重なり合い、未知の次元へと誘う
迷いなんて一瞬で吹き飛ばせ、進むべき道はただ一つ、勝利の頂点のみ
作曲家「28」が紡ぎ出す旋律は、永遠に色褪せることのない永遠の金字塔
どんな逆風が吹こうとも、私たちの絆と意志は絶対に崩れない！

[Bridge - 覚醒のメロディーと圧倒的パワー]
研ぎ澄まれたギターとトランペットの調べが、夜空に高らかに鳴り響く
アフリカの鼓動、ジャンベとカリンバのリズムが原始のパワーを呼び覚ます
恐れるな、君の中にある情熱の炎を今こそ燃え上がらせろ！
MIC VICTORYの旗の下に集いし者よ、共に歌え、共に勝利を掴み取れ！

[Chorus / Outro - 崩れない最強の結び (c) micvictorydanb 作曲: 28]
何度転んでも立ち上がる強い意志 決して崩れない鋼鉄のメロディー
MIC VICTORY それは俺たちの証し
D-LAND DTM クレラと共に 永遠に響け、この勝利の歌！
崩さない絶対のプライドを胸に、明日へ向かって羽ばたけ！！`;

                setRapLyrics(generated);
                setStatus(`✨ 題材「${theme}」に基づく 800字AI歌詞（崩さない絶対モード）の生成が完了しました！`);
            };

            const applyHeavySubManualAi = (instKey, modeType) => {
                const newArr = new Array(TOTAL_STEPS).fill(null);
                for (let i = 0; i < TOTAL_STEPS; i++) {
                    const isBeat = modeType === 'roll' ? (i % 2 === 0) : (i % 4 === 0 || i % 16 === 10 || i % 16 === 14);
                    if (isBeat) {
                        newArr[i] = { note: "C0", dur: modeType === 'roll' ? "16n" : "8n", subBoost: true };
                    }
                }
                setInstrumentSteps(prev => ({ ...prev, [instKey]: newArr }));
                setStatus(`🔊 【${instKey}】C0重低音クレラAI 反映完了！`);
            };

            const applyHeavyDrumManualAi = (modeName) => {
                const newArr = new Array(TOTAL_STEPS).fill(null);
                for (let i = 0; i < TOTAL_STEPS; i++) {
                    const isKick = modeName === 'heavy_roll' ? (i % 2 === 0) : (i % 4 === 0 || i === 10 || i === 14);
                    const isSnare = i % 8 === 4;
                    const isHihat = true;
                    const isClap = modeName === 'heavy_roll' ? (i % 4 === 2) : (i % 16 === 12);
                    newArr[i] = { kick: isKick, snare: isSnare, hihat: isHihat, clap: isClap, subBoost: true };
                }
                setInstrumentSteps(prev => ({ ...prev, drums: newArr }));
                setStatus(`🥁 ドラム重低音AI [${modeName}] 反映完了！`);
            };

            const generateAiPattern20 = (instKey, patternNum) => {
                const newArr = new Array(TOTAL_STEPS).fill(null);
                const scales = {
                    synth: ["C4", "E4", "G4", "A4", "C5", "E5"],
                    bass: ["C2", "G2", "A2", "C3"],
                    subBass: ["C0", "C1"],
                    loopTrack: ["C4", "E4", "G4", "B4", "C5"],
                    trumpet: ["C4", "E4", "G4", "C5", "E5"],
                    guitar: ["E3", "G3", "B3", "E4", "A4"],
                    drums: [],
                    africa1: ["C3", "G3", "D4"],
                    africa2: ["C4", "D4", "F4", "G4", "A4"]
                };

                const scale = scales[instKey] || ["C4", "D4", "E4", "F4", "G4", "A4", "B4", "C5"];

                for (let i = 0; i < TOTAL_STEPS; i++) {
                    if (instKey === "drums") {
                        const isKick = i % (4 + (patternNum % 3)) === 0 || (patternNum > 10 && i % 8 === 2);
                        const isSnare = i % 8 === 4 || (patternNum > 15 && i % 4 === 2);
                        const isHihat = true;
                        const isClap = patternNum > 5 && i % 16 === 14;
                        if (isKick || isSnare || isHihat || isClap) {
                            newArr[i] = { kick: isKick, snare: isSnare, hihat: isHihat, clap: isClap, subBoost: true };
                        }
                    } else if (instKey === "subBass") {
                        if (i % 4 === 0 || i % 16 === 10) {
                            newArr[i] = { note: "C0", dur: selectedDuration, subBoost: true };
                        }
                    } else {
                        let density = 0.25 + (patternNum * 0.015);
                        if (Math.random() < density) {
                            const noteIdx = (i * 2 + patternNum) % scale.length;
                            const note = scale[noteIdx];
                            const dur = selectedDuration;
                            newArr[i] = { note, dur };
                        }
                    }
                }

                setInstrumentSteps(prev => ({ ...prev, [instKey]: newArr }));
                setActivePatternIndex(patternNum);
                setStatus(`🤖 AI パターン #${patternNum} （重低音リズム共存）生成完了！`);
            };

            const playNoteKeyboard = (note) => {
                setSelectedNote(note);
                const syns = synthsRef.current;
                if (!syns) return;

                if (selectedInstrument === "drums") {
                    if (selectedDrumPart === "kick") syns.drums.kick.triggerAttackRelease("C0", selectedDuration);
                    else if (selectedDrumPart === "snare") syns.drums.snare.triggerAttackRelease(selectedDuration);
                    else if (selectedDrumPart === "hihat") syns.drums.hihat.triggerAttackRelease("32n");
                    else syns.drums.clap.triggerAttackRelease(selectedDuration);
                } else if (selectedInstrument === "subBass") {
                    syns.subBass.triggerAttackRelease("C0", selectedDuration);
                } else if (syns[selectedInstrument]) {
                    syns[selectedInstrument].triggerAttackRelease(note, selectedDuration);
                }

                if (currentStep !== -1) {
                    const stepIdx = currentBar * BAR_STEPS + currentStep;
                    toggleStepWithDuration(selectedInstrument, stepIdx, note, selectedDuration);
                }
            };

            const toggleStepWithDuration = (instKey, idx, note = selectedNote, dur = selectedDuration) => {
                setInstrumentSteps(prev => {
                    const currentArr = [...prev[instKey]];
                    if (instKey === "drums") {
                        const currentObj = currentArr[idx] || { kick: false, snare: false, hihat: false, clap: false };
                        const updatedObj = { ...currentObj, [selectedDrumPart]: !currentObj[selectedDrumPart] };
                        const hasAny = Object.values(updatedObj).some(Boolean);
                        currentArr[idx] = hasAny ? updatedObj : null;
                    } else {
                        currentArr[idx] = currentArr[idx] ? null : { note, dur, subBoost: instKey === "subBass" };
                    }
                    return { ...prev, [instKey]: currentArr };
                });
            };

            const clearSpecificInstrument = (instKey) => {
                setInstrumentSteps(prev => ({ ...prev, [instKey]: new Array(TOTAL_STEPS).fill(null) }));
                setStatus(`🗑️ 【${instKey}】をクリアしました。`);
            };

            const exportProjectToFile = () => {
                const projectData = {
                    title: slotName,
                    album: "MIC VICTORY OFFICIAL ALBUM",
                    copyright: "micvictorydanb",
                    composer: "28",
                    bpm,
                    instrumentSteps,
                    volumes,
                    date: new Date().toISOString()
                };
                const blob = new Blob([JSON.stringify(projectData, null, 2)], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `${slotName}.json`;
                a.click();
                URL.revokeObjectURL(url);
                setStatus(`💾 アルバムプロジェクトファイル転送（保存）完了！`);
            };

            const importProjectFromFile = (event) => {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (data.instrumentSteps) {
                            setInstrumentSteps(data.instrumentSteps);
                            if (data.bpm) setBpm(data.bpm);
                            setStatus(`📂 ファイル転送読込成功：${data.title || 'プロジェクト'}`);
                        }
                    } catch (err) {
                        setStatus("❌ ファイル転送読込エラー");
                    }
                };
                reader.readAsText(file);
            };

            return (
                <div className={`min-h-screen bg-slate-950 text-slate-100 flex flex-col text-xs font-sans select-none pb-24 overflow-x-hidden border-8 transition-colors duration-300 ${powerSavingMode ? 'border-emerald-800' : flashColor}`}>

                    {screenSaverActive && !powerSavingMode && (
                        <div onClick={() => setScreenSaverActive(false)} className="fixed inset-0 z-50 bg-slate-950/95 flex flex-col items-center justify-center p-6 cursor-pointer backdrop-blur-md">
                            <div className="absolute top-4 right-4 text-cyan-400 font-bold text-sm animate-pulse">
                                [ 画面クリックで通常画面へ戻る ]
                            </div>
                            <div className="text-center mb-8">
                                <h1 className="text-2xl font-black bg-gradient-to-r from-amber-400 via-pink-400 to-cyan-400 bg-clip-text text-transparent animate-bounce">
                                    MIC VICTORY ALBUM VISUALIZER
                                </h1>
                                <p className="text-slate-400 text-xs mt-1">著作権: micvictorydanb | 作曲: 28 | BPM: {bpm}</p>
                            </div>
                            <div className="flex items-end gap-1.5 h-64 w-full max-w-xl bg-slate-900/80 p-4 rounded-xl border border-slate-800 shadow-2xl">
                                {Array.from({ length: 16 }).map((_, idx) => {
                                    const activeHeight = playing ? Math.floor(Math.sin((idx + currentStep) * 0.5) * 40 + 60) : 10;
                                    return (
                                        <div key={idx} className="flex-1 bg-gradient-to-t from-pink-600 via-purple-600 to-cyan-400 rounded-t transition-all duration-100" style={{ height: `${activeHeight}%` }}></div>
                                    );
                                })}
                            </div>
                        </div>
                    )}

                    <header className="bg-slate-900 border-b border-slate-800 px-3 py-2 flex items-center justify-between gap-2 sticky top-0 z-40 shadow-lg">
                        <div className="flex items-center gap-2">
                            <span className="font-black text-sm bg-gradient-to-r from-amber-400 via-pink-400 to-cyan-400 bg-clip-text text-transparent">
                                MIC VICTORY <span className="text-[10px] text-pink-400 font-bold">v57.1 崩さない絶対・800字AI版</span>
                            </span>
                        </div>
                        <div className="flex items-center gap-1.5 flex-wrap">
                            <button 
                                onClick={() => setPowerSavingMode(!powerSavingMode)} 
                                className={`px-2.5 py-1 rounded font-bold text-[10px] border shadow transition-all ${
                                    powerSavingMode 
                                        ? 'bg-emerald-600 border-emerald-400 text-white animate-pulse' 
                                        : 'bg-slate-800 border-slate-700 text-slate-300 hover:bg-slate-700'
                                }`}
                            >
                                {powerSavingMode ? '⚡ 節電: ON' : '🔋 節電: OFF'}
                            </button>

                            {!powerSavingMode && (
                                <button onClick={() => setScreenSaverActive(true)} className="px-2.5 py-1 bg-cyan-900 border border-cyan-700 text-cyan-200 font-bold rounded text-[10px] shadow">
                                    📺 セーバー
                                </button>
                            )}

                            <button onClick={togglePlay} className={`px-3 py-1 rounded font-bold text-xs shadow ${playing ? "bg-amber-400 text-slate-950 animate-bounce" : "bg-pink-600 text-white"}`}>
                                {playing ? "■ 停止" : "▶ 再生"}
                            </button>
                            <button onClick={toggleRecord} className={`px-3 py-1 rounded font-bold text-xs shadow ${isRecording ? "bg-red-600 text-white animate-pulse" : "bg-slate-800 text-red-400 border border-red-800"}`}>
                                {isRecording ? "🔴 録音中(Stopで保存)" : "⏺️ 全体録音 crera保存"}
                            </button>
                            <div className="flex items-center gap-1 bg-slate-950 px-2 py-0.5 rounded border border-slate-800">
                                <span className="text-[9px] text-slate-400">BPM</span>
                                <input type="number" value={bpm} onChange={e => setBpm(Math.max(60, Math.min(220, Number(e.target.value))))} className="w-12 bg-slate-900 text-center font-bold text-pink-400 rounded text-xs py-0.5" />
                            </div>
                        </div>
                    </header>

                    <nav className="bg-slate-900/90 border-b border-slate-800 px-2 py-1.5 flex gap-1 overflow-x-auto">
                        {[
                            { id: "RAP_AI", label: "🎤 800字歌詞 & 題材AI自動生成" },
                            { id: "ALBUM_RELEASE", label: "💿 リリースアルバム & 宣伝" },
                            { id: "DUAL_EDIT", label: "🎛️ 鍵盤 & 重低音クレラ・グリッド" },
                            { id: "RECORDINGS", label: "📁 crera全体録音リスト" },
                            { id: "MEMORY", label: "💾 ファイル転送・保存" },
                        ].map(t => (
                            <button key={t.id} onClick={() => setTab(t.id)} className={`px-3 py-1 rounded text-center font-bold transition-all shrink-0 ${tab === t.id ? "bg-amber-500 text-slate-950 shadow" : "bg-slate-800/60 text-slate-400"}`}>
                                {t.label}
                            </button>
                        ))}
                    </nav>

                    <div className="bg-slate-900/50 px-3 py-1 text-[11px] text-cyan-400 border-b border-slate-900 truncate flex justify-between items-center">
                        <span>💡 {status} | 🎵 作曲: 28 | (c) micvictorydanb</span>
                        {playing && (
                            <div className="flex items-center gap-1">
                                <span className="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
                                <span className="text-[10px] text-cyan-300 font-mono">STEP: {currentStep + 1}</span>
                            </div>
                        )}
                    </div>

                    <main className="p-2 flex flex-col gap-3">
                        {tab === "RAP_AI" && (
                            <div className="flex flex-col gap-3">
                                <div className="bg-slate-900 p-4 rounded border border-slate-800 flex flex-col gap-3 shadow-lg">
                                    <div className="flex justify-between items-center flex-wrap gap-2">
                                        <h2 className="text-sm font-black bg-gradient-to-r from-amber-400 via-pink-400 to-cyan-400 bg-clip-text text-transparent">
                                            🎤 800字歌詞 & 題材入力 AI自動生成（崩さない絶対モード）
                                        </h2>
                                        <span className="px-2 py-0.5 bg-pink-600 text-white font-bold rounded text-[10px]">著作権: micvictorydanb</span>
                                    </div>

                                    {/* 歌詞題材入力＆AI生成ボタン領域 */}
                                    <div className="bg-slate-950 p-3 rounded border border-slate-800 flex flex-col gap-2">
                                        <label className="text-[11px] font-bold text-amber-300">💡 歌詞題材・キーワード入力欄（ここにテーマを入力してください）</label>
                                        <div className="flex gap-2 flex-wrap sm:flex-nowrap">
                                            <input 
                                                type="text" 
                                                value={lyricThemeInput} 
                                                onChange={e => setLyricThemeInput(e.target.value)} 
                                                placeholder="例: 崩さない絶対、鋼鉄の意志、夜の疾走、重低音クレラ"
                                                className="flex-1 bg-slate-900 text-slate-200 px-3 py-2 rounded border border-slate-700 text-xs focus:border-pink-500 outline-none" 
                                            />
                                            <button 
                                                onClick={generateAi800Lyrics} 
                                                className="px-4 py-2 bg-gradient-to-r from-amber-500 to-pink-600 text-slate-950 font-black rounded text-xs shadow hover:opacity-95 shrink-0"
                                            >
                                                🤖 AI 800字文章作成実行
                                            </button>
                                        </div>
                                    </div>

                                    {/* 編集・表示用テキストエリア */}
                                    <div className="flex flex-col gap-1">
                                        <div className="flex justify-between items-center text-[10px] text-slate-400">
                                            <span>生成的確歌詞 (編集可能)</span>
                                            <span className="text-pink-400 font-mono">文字数: {rapLyrics.length} 字 (目標: 800字以上)</span>
                                        </div>
                                        <textarea
                                            value={rapLyrics}
                                            onChange={e => setRapLyrics(e.target.value)}
                                            rows={14}
                                            className="w-full bg-slate-950 text-slate-200 p-3 rounded border border-slate-800 font-mono text-xs leading-relaxed"
                                        />
                                    </div>

                                    <div className="flex justify-end gap-2">
                                        <button onClick={() => { navigator.clipboard.writeText(rapLyrics); setStatus("📋 800字歌詞をクリップボードにコピーしました！"); }} className="px-4 py-2 bg-cyan-600 text-white font-bold rounded text-xs shadow hover:bg-cyan-500">
                                            📋 歌詞をコピーする
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {tab === "ALBUM_RELEASE" && (
                            <div className="flex flex-col gap-3">
                                <div className="bg-gradient-to-r from-slate-900 via-purple-950/40 to-slate-900 border border-purple-800/60 rounded-lg p-4 flex flex-col gap-3 shadow-lg">
                                    <div className="flex justify-between items-center flex-wrap gap-2">
                                        <h2 className="text-sm font-black bg-gradient-to-r from-amber-400 via-pink-400 to-cyan-400 bg-clip-text text-transparent">
                                            💿 MIC VICTORY 公式リリースアルバム & プロモーション
                                        </h2>
                                        <span className="px-2 py-0.5 bg-pink-600 text-white font-bold rounded text-[10px]">公式配信中</span>
                                    </div>
                                    <div className="bg-slate-950 p-3 rounded border border-slate-800 flex flex-col gap-2">
                                        <div className="flex justify-between text-[11px] border-b border-slate-900 pb-1.5">
                                            <span className="text-slate-400">アルバム名:</span>
                                            <span className="font-bold text-amber-300">MIC VICTORY - THE SOLID CRERA ANTHEMS</span>
                                        </div>
                                        <div className="flex justify-between text-[11px] border-b border-slate-900 pb-1.5">
                                            <span className="text-slate-400">アーティスト:</span>
                                            <span className="font-bold text-pink-300">micvictorydanb</span>
                                        </div>
                                        <div className="flex justify-between text-[11px] border-b border-slate-900 pb-1.5">
                                            <span className="text-slate-400">メインコンポーザー:</span>
                                            <span className="font-bold text-cyan-300">28 (niya)</span>
                                        </div>
                                        <div className="flex justify-between text-[11px]">
                                            <span className="text-slate-400">エンジン仕様:</span>
                                            <span className="font-mono text-emerald-400">DLAND DTM v57.1 (crera重低音拡張)</span>
                                        </div>
                                    </div>
                                    <div className="flex gap-2">
                                        <button onClick={() => setTab("DUAL_EDIT")} className="flex-1 py-2 bg-gradient-to-r from-pink-600 to-purple-600 font-bold rounded text-white shadow hover:opacity-95">
                                            🎛️ 音源・グリッドエディタを開く
                                        </button>
                                        <button onClick={() => setTab("RAP_AI")} className="flex-1 py-2 bg-gradient-to-r from-amber-600 to-orange-600 font-bold rounded text-white shadow hover:opacity-95">
                                            🎤 800字歌詞へ戻る
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {tab === "DUAL_EDIT" && (
                            <div className="flex flex-col gap-3">
                                <div className="bg-slate-900 p-3 rounded border border-slate-800 flex flex-col gap-2">
                                    <div className="flex justify-between items-center">
                                        <span className="font-bold text-cyan-300">楽器選択 & 重低音クレラ制御</span>
                                        <span className="text-[10px] text-slate-400">現在選択: <strong className="text-pink-400">{selectedInstrument}</strong></span>
                                    </div>
                                    <div className="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-1.5">
                                        {INSTRUMENTS.map(inst => (
                                            <button
                                                key={inst.id}
                                                onClick={() => setSelectedInstrument(inst.id)}
                                                className={`p-2 rounded font-bold text-[11px] border transition-all bg-gradient-to-br ${inst.color} ${selectedInstrument === inst.id ? 'border-white scale-105 shadow-lg' : 'border-transparent opacity-75 hover:opacity-100'}`}
                                            >
                                                {inst.label}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div className="bg-slate-900 p-3 rounded border border-slate-800 flex flex-col gap-2">
                                    <div className="flex justify-between items-center flex-wrap gap-2">
                                        <span className="font-bold text-amber-300">🎹 鍵盤操作パネル & 手動グリッド切替</span>
                                        <div className="flex gap-1">
                                            {DURATION_OPTIONS.map(d => (
                                                <button
                                                    key={d.id}
                                                    onClick={() => setSelectedDuration(d.id)}
                                                    className={`px-2 py-0.5 rounded text-[10px] font-bold ${selectedDuration === d.id ? 'bg-cyan-500 text-slate-950' : 'bg-slate-800 text-slate-400'}`}
                                                >
                                                    {d.label}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {selectedInstrument === "drums" ? (
                                        <div className="flex flex-col gap-2">
                                            <div className="flex gap-1.5">
                                                {[{ id: "kick", label: "🥁 キック (C0重低音)" }, { id: "snare", label: "💥 スネア" }, { id: "hihat", label: "✨ ハイハット" }, { id: "clap", label: "👏 クラップ" }].map(d => (
                                                    <button
                                                        key={d.id}
                                                        onClick={() => setSelectedDrumPart(d.id)}
                                                        className={`flex-1 py-2 rounded font-bold text-[11px] border ${selectedDrumPart === d.id ? 'bg-red-600 border-white text-white' : 'bg-slate-800 border-slate-700 text-slate-300'}`}
                                                    >
                                                        {d.label}
                                                    </button>
                                                ))}
                                            </div>
                                            <div className="flex gap-2">
                                                <button onClick={() => applyHeavyDrumManualAi('standard')} className="flex-1 py-1.5 bg-amber-600 text-white rounded font-bold">🥁 ドラム重低音AI定番</button>
                                                <button onClick={() => applyHeavyDrumManualAi('heavy_roll')} className="flex-1 py-1.5 bg-red-700 text-white rounded font-bold">🔥 ドラム重低音ロール</button>
                                                <button onClick={() => clearSpecificInstrument("drums")} className="px-3 py-1.5 bg-slate-800 text-red-400 rounded font-bold">🗑️ クリア</button>
                                            </div>
                                        </div>
                                    ) : selectedInstrument === "subBass" ? (
                                        <div className="flex flex-col gap-2">
                                            <div className="p-2 bg-slate-950 rounded border border-amber-900 text-center text-amber-400 font-bold">
                                                🔊 C0 重低音クレラ専用サブベースモード (超低域最適化済み)
                                            </div>
                                            <div className="flex gap-2">
                                                <button onClick={() => applyHeavySubManualAi("subBass", "beat")} className="flex-1 py-1.5 bg-amber-600 text-white rounded font-bold">🔊 C0重低音4つ打ちAI</button>
                                                <button onClick={() => applyHeavySubManualAi("subBass", "roll")} className="flex-1 py-1.5 bg-orange-600 text-white rounded font-bold">⚡ C0重低音ロールAI</button>
                                                <button onClick={() => clearSpecificInstrument("subBass")} className="px-3 py-1.5 bg-slate-800 text-red-400 rounded font-bold">🗑️ クリア</button>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="flex flex-col gap-2">
                                            <div className="grid grid-cols-8 gap-1">
                                                {NOTES.map(note => (
                                                    <button
                                                        key={note}
                                                        onClick={() => playNoteKeyboard(note)}
                                                        className="py-3 bg-slate-800 border border-slate-700 rounded flex flex-col items-center justify-center hover:bg-slate-700 active:scale-95"
                                                    >
                                                        <span className="font-bold text-cyan-300">{SOLFEGE[note]}</span>
                                                        <span className="text-[9px] text-slate-400">{note}</span>
                                                    </button>
                                                ))}
                                            </div>
                                            <div className="flex gap-2">
                                                <button onClick={() => generateAiPattern20(selectedInstrument, activePatternIndex)} className="flex-1 py-1.5 bg-cyan-700 text-white rounded font-bold">🤖 【{selectedInstrument}】AIパターン自動生成</button>
                                                <button onClick={() => clearSpecificInstrument(selectedInstrument)} className="px-3 py-1.5 bg-slate-800 text-red-400 rounded font-bold">🗑️ クリア</button>
                                            </div>
                                        </div>
                                    )}

                                    {/* 手動ステップグリッド表示 */}
                                    <div className="mt-3 bg-slate-950 p-2.5 rounded border border-slate-800 flex flex-col gap-1.5">
                                        <div className="flex justify-between items-center text-[10px] text-slate-400">
                                            <span>🎛️ 【{selectedInstrument}】手動グリッドステップ (16ステップ) - クリックでON/OFF手動切替</span>
                                            <span className="text-pink-400 font-mono">Bar: {currentBar + 1}</span>
                                        </div>
                                        <div className="grid grid-cols-8 sm:grid-cols-16 gap-1">
                                            {Array.from({ length: 16 }).map((_, idx) => {
                                                const globalIdx = currentBar * BAR_STEPS + idx;
                                                const stepData = instrumentSteps[selectedInstrument][globalIdx];
                                                const isActive = stepData !== null;
                                                const isCurrentPlaying = playing && currentStep === idx;

                                                return (
                                                    <button
                                                        key={idx}
                                                        onClick={() => toggleStepWithDuration(selectedInstrument, globalIdx)}
                                                        className={`h-9 rounded flex flex-col items-center justify-center font-mono text-[10px] border transition-all ${
                                                            isCurrentPlaying 
                                                                ? 'border-yellow-400 ring-2 ring-yellow-400' 
                                                                : 'border-slate-800'
                                                        } ${
                                                            isActive 
                                                                ? 'bg-gradient-to-t from-pink-600 to-purple-600 text-white font-bold' 
                                                                : 'bg-slate-900 text-slate-500 hover:bg-slate-800'
                                                        }`}
                                                    >
                                                        <span>{idx + 1}</span>
                                                        <span className="text-[8px]">{isActive ? '●' : '·'}</span>
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {tab === "RECORDINGS" && (
                            <div className="flex flex-col gap-3">
                                <div className="bg-slate-900 p-4 rounded border border-slate-800 flex flex-col gap-3">
                                    <h2 className="text-sm font-bold text-pink-400">📁 crera 全体録音保存リスト ({recordedTakes.length} テイク)</h2>
                                    <div className="flex flex-col gap-2">
                                        {recordedTakes.map(take => (
                                            <div key={take.id} className="bg-slate-950 p-3 rounded border border-slate-800 flex justify-between items-center">
                                                <div className="flex flex-col gap-0.5">
                                                    <span className="font-bold text-amber-300">{take.title}</span>
                                                    <span className="text-[10px] text-slate-400">BPM: {take.bpm} | 録音時刻: {take.date} | クレジット: {take.credit}</span>
                                                </div>
                                                <span className="px-2.5 py-1 bg-emerald-600 text-white font-bold rounded text-[10px]">保存済</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {tab === "MEMORY" && (
                            <div className="flex flex-col gap-3">
                                <div className="bg-slate-900 p-4 rounded border border-slate-800 flex flex-col gap-3">
                                    <h2 className="text-sm font-bold text-cyan-400">💾 アルバムプロジェクト ファイル転送・保存</h2>
                                    <div className="flex flex-col gap-2">
                                        <label className="text-slate-400 text-[11px]">セーブスロット名</label>
                                        <input type="text" value={slotName} onChange={e => setSlotName(e.target.value)} className="w-full bg-slate-950 text-cyan-300 px-3 py-2 rounded border border-slate-800 font-mono text-xs font-bold" />
                                    </div>
                                    <div className="flex gap-2">
                                        <button onClick={exportProjectToFile} className="flex-1 py-2.5 bg-gradient-to-r from-cyan-600 to-blue-600 font-bold text-white rounded shadow">
                                            💾 プロジェクト保存 (JSON)
                                        </button>
                                        <label className="flex-1 py-2.5 bg-gradient-to-r from-purple-600 to-pink-600 font-bold text-white rounded shadow text-center cursor-pointer">
                                            📂 ファイル読込
                                            <input type="file" accept=".json" onChange={importProjectFromFile} className="hidden" />
                                        </label>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.render(<MasterSynthApp />, document.getElementById("root"));
    </script>
</body>
</html>
