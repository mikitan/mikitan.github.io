<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIC VICTORY - AI Instrument Specific Foundation v123.4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans select-none pb-12 overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        function AiInstrumentApp() {
            const [activeTab, setActiveTab] = React.useState("SEQUENCER");
            const [playing, setPlaying] = React.useState(false);
            const [bpm, setBpm] = React.useState(108);
            const [barsCount, setBarsCount] = React.useState(8);
            const [currentBar, setCurrentBar] = React.useState(0);
            const [currentStep, setCurrentStep] = React.useState(0);
            const [status, setStatus] = React.useState("✨ 楽器別AI土台作成機能 稼働中");

            const STEPS_PER_BAR = 16;
            const TOTAL_STEPS = barsCount * STEPS_PER_BAR;

            const [selectedInstrument, setSelectedInstrument] = React.useState("synthLead");
            const [selectedDrumPart, setSelectedDrumPart] = React.useState("kick");
            const [selectedOctave, setSelectedOctave] = React.useState("mid");
            const [selectedNote, setSelectedNote] = React.useState("C3");

            const [isRecording, setIsRecording] = React.useState(false);
            const [recordedAudioList, setRecordedAudioList] = React.useState([]);

            const mediaRecorderRef = React.useRef(null);
            const audioChunksRef = React.useRef([]);
            const destStreamNodeRef = React.useRef(null);

            const INSTRUMENT_MAP = [
                { id: "synthLead", label: "🎹 AI Pops ロボティック・リード", color: "from-amber-700 to-orange-600" },
                { id: "popBass", label: "🎸 Popping パンチ・ベース", color: "from-red-900 to-rose-700" },
                { id: "trumpet", label: "🎺 ブラス・ヒット", color: "from-yellow-600 to-amber-500" },
                { id: "violin", label: "🎻 ストリングス伴奏", color: "from-purple-800 to-indigo-600" },
                { id: "drums", label: "🥁 ドラムセット (ビート＆ヒット)", color: "from-cyan-900 to-blue-800" }
            ];

            const DRUM_PARTS = [
                { id: "kick", label: "💥 キック" },
                { id: "snare", label: "🎯 スネア" },
                { id: "hihat", label: "⚡ ハイハット" },
                { id: "clap", label: "👏 ヒット・クラップ" }
            ];

            const KEYBOARD_NOTES = [
                { note: "C", label: "ド", color: "bg-red-600 hover:bg-red-500" },
                { note: "D", label: "レ", color: "bg-orange-600 hover:bg-orange-500" },
                { note: "E", label: "ミ", color: "bg-yellow-600 hover:bg-yellow-500" },
                { note: "F", label: "ファ", color: "bg-green-600 hover:bg-green-500" },
                { note: "G", label: "ソ", color: "bg-cyan-600 hover:bg-cyan-500" },
                { note: "A", label: "ラ", color: "bg-blue-600 hover:bg-blue-500" },
                { note: "B", label: "シ", color: "bg-purple-600 hover:bg-purple-500" },
                { note: "C+", label: "高ド", color: "bg-rose-600 hover:bg-rose-500" },
            ];

            const [instrumentSteps, setInstrumentSteps] = React.useState(() => {
                const saved = localStorage.getItem("AI_INSTRUMENT_STEPS_V123_4");
                if (saved) return JSON.parse(saved);
                return {
                    popBass: new Array(128).fill(null),
                    synthLead: new Array(128).fill(null),
                    trumpet: new Array(128).fill(null),
                    violin: new Array(128).fill(null),
                    drums: new Array(128).fill(null)
                };
            });

            React.useEffect(() => {
                localStorage.setItem("AI_INSTRUMENT_STEPS_V123_4", JSON.stringify(instrumentSteps));
            }, [instrumentSteps]);

            const synthsRef = React.useRef(null);
            const loopRef = React.useRef(null);
            const masterGainRef = React.useRef(null);
            const limiterRef = React.useRef(null);
            const compRef = React.useRef(null);
            const reverbRef = React.useRef(null);
            const instrumentGainsRef = React.useRef({});
            const directStepIdxRef = React.useRef(0);

            React.useEffect(() => {
                const masterGain = new Tone.Gain(1.0);
                masterGainRef.current = masterGain;

                const limiter = new Tone.Limiter(-1.0); 
                limiterRef.current = limiter;

                const comp = new Tone.Compressor({ threshold: -16, ratio: 4, attack: 0.005, release: 0.1 });
                compRef.current = comp;

                const reverb = new Tone.Reverb({ decay: 1.5, wet: 0.15 });
                reverb.generate();
                reverbRef.current = reverb;

                const destNode = Tone.context.createMediaStreamDestination();
                destStreamNodeRef.current = destNode;

                reverb.connect(comp);
                comp.connect(limiter);
                limiter.connect(masterGain);
                masterGain.connect(Tone.Destination);
                masterGain.connect(destNode);

                const cGains = {};
                Object.keys(instrumentSteps).forEach(key => {
                    const cg = new Tone.Gain(1.0).connect(reverb);
                    cGains[key] = cg;
                });
                instrumentGainsRef.current = cGains;

                synthsRef.current = {
                    popBass: new Tone.MonoSynth({
                        oscillator: { type: "sawtooth" },
                        envelope: { attack: 0.005, decay: 0.15, sustain: 0.2, release: 0.1 },
                        filterEnvelope: { attack: 0.005, decay: 0.1, sustain: 0.3, baseFrequency: 150, octaves: 2 }
                    }).connect(cGains.popBass),

                    synthLead: new Tone.Synth({
                        oscillator: { type: "square" },
                        envelope: { attack: 0.005, decay: 0.12, sustain: 0.4, release: 0.1 }
                    }).connect(cGains.synthLead),

                    trumpet: new Tone.FMSynth({
                        harmonicity: 1.5,
                        modulationIndex: 3.0,
                        oscillator: { type: "sine" },
                        envelope: { attack: 0.02, decay: 0.15, sustain: 0.5, release: 0.1 }
                    }).connect(cGains.trumpet),

                    violin: new Tone.AMSynth({
                        harmonicity: 2.0,
                        oscillator: { type: "sawtooth" },
                        envelope: { attack: 0.08, decay: 0.2, sustain: 0.6, release: 0.2 }
                    }).connect(cGains.violin),

                    drums: {
                        kick: new Tone.MembraneSynth({ pitchDecay: 0.04, octaves: 3, envelope: { attack: 0.001, decay: 0.25, sustain: 0 } }).connect(cGains.drums),
                        snare: new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.001, decay: 0.15, sustain: 0 } }).connect(cGains.drums),
                        hihat: new Tone.MetalSynth({ frequency: 350, envelope: { attack: 0.001, decay: 0.02, release: 0.01 }, harmonicity: 5.1, modulationIndex: 12, resonance: 2500, octaves: 1.0 }).connect(cGains.drums),
                        clap: new Tone.NoiseSynth({ noise: { type: "pink" }, envelope: { attack: 0.005, decay: 0.12, sustain: 0 } }).connect(cGains.drums)
                    }
                };

                return () => { Tone.Transport.stop(); Tone.Transport.cancel(); };
            }, []);

            React.useEffect(() => {
                Tone.Transport.bpm.value = bpm;
                Tone.Transport.cancel();

                if (playing) {
                    let stepCounter = 0;
                    loopRef.current = new Tone.Loop(time => {
                        let step = stepCounter % TOTAL_STEPS;
                        setCurrentStep(step % STEPS_PER_BAR);
                        setCurrentBar(Math.floor(step / STEPS_PER_BAR));
                        directStepIdxRef.current = step;

                        const syns = synthsRef.current;
                        if (syns) {
                            Object.keys(instrumentSteps).forEach(instKey => {
                                const item = instrumentSteps[instKey][step];
                                if (!item) return;

                                if (instKey === "drums") {
                                    if (item.kick) syns.drums.kick.triggerAttackRelease("C2", "8n", time);
                                    if (item.snare) syns.drums.snare.triggerAttackRelease("8n", time);
                                    if (item.hihat) syns.drums.hihat.triggerAttackRelease("32n", time);
                                    if (item.clap) syns.drums.clap.triggerAttackRelease("8n", time);
                                } else if (syns[instKey]) {
                                    syns[instKey].triggerAttackRelease(item.note || "C3", item.dur || "8n", time);
                                }
                            });
                        }
                        stepCounter++;
                    }, "16n").start(0);

                    Tone.Transport.start();
                } else {
                    Tone.Transport.stop();
                }
            }, [playing, bpm, instrumentSteps]);

            const togglePlay = async () => {
                await Tone.start();
                setPlaying(!playing);
                setStatus(playing ? "■ 停止中" : "▶ 再生中 (108 BPM)");
            };

            const clearAll = () => {
                if (!window.confirm("全8小節のデータを消去しますか？")) return;
                const cleared = {};
                Object.keys(instrumentSteps).forEach(k => { cleared[k] = new Array(128).fill(null); });
                setInstrumentSteps(cleared);
                setStatus("🗑️ 全データを消去しました");
            };

            // 🎵 【楽器別】AI土台作成機能
            const generateAiPatternForSelectedInstrument = () => {
                const newSteps = JSON.parse(JSON.stringify(instrumentSteps));
                const scaleNotes = ["C3", "E3", "G3", "A3", "C4"];

                for (let i = 0; i < TOTAL_STEPS; i++) {
                    const s = i % STEPS_PER_BAR;
                    const bar = Math.floor(i / STEPS_PER_BAR);

                    if (selectedInstrument === "drums") {
                        newSteps.drums[i] = {
                            kick: (s === 0 || s === 8 || s === 10),
                            snare: (s === 4 || s === 12),
                            hihat: (s % 2 === 0),
                            clap: (s === 4 || s === 12)
                        };
                    } else if (selectedInstrument === "popBass") {
                        if (s === 0 || s === 3 || s === 8 || s === 11) {
                            newSteps.popBass[i] = { note: bar % 2 === 0 ? "C2" : "G2", dur: "16n" };
                        } else {
                            newSteps.popBass[i] = null;
                        }
                    } else if (selectedInstrument === "synthLead") {
                        if (s === 2 || s === 6 || s === 10 || s === 14) {
                            const noteIdx = (bar + s) % scaleNotes.length;
                            newSteps.synthLead[i] = { note: scaleNotes[noteIdx], dur: "16n" };
                        } else {
                            newSteps.synthLead[i] = null;
                        }
                    } else if (selectedInstrument === "trumpet") {
                        if (s === 0 || s === 8) {
                            newSteps.trumpet[i] = { note: "C4", dur: "8n" };
                        } else {
                            newSteps.trumpet[i] = null;
                        }
                    } else if (selectedInstrument === "violin") {
                        if (s === 0) {
                            newSteps.violin[i] = { note: "E3", dur: "2n" };
                        } else {
                            newSteps.violin[i] = null;
                        }
                    }
                }

                setInstrumentSteps(newSteps);
                const currentInstLabel = INSTRUMENT_MAP.find(i => i.id === selectedInstrument)?.label || selectedInstrument;
                setStatus(`✨ 【${currentInstLabel}】 のAI土台パターンを生成しました！`);
            };

            const startRecording = async () => {
                try {
                    await Tone.start();
                    let captureStream = destStreamNodeRef.current.stream;
                    mediaRecorderRef.current = new MediaRecorder(captureStream);
                    audioChunksRef.current = [];
                    mediaRecorderRef.current.ondataavailable = (e) => { if (e.data.size > 0) audioChunksRef.current.push(e.data); };
                    mediaRecorderRef.current.onstop = () => {
                        const audioBlob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                        const audioUrl = URL.createObjectURL(audioBlob);
                        setRecordedAudioList(prev => [...prev, { id: Date.now(), title: `録音 #${prev.length + 1}`, url: audioUrl }]);
                        setStatus("⏹️ 録音完了！録音一覧タブで確認できます");
                    };
                    mediaRecorderRef.current.start();
                    setIsRecording(true);
                    if (!playing) togglePlay();
                } catch (err) { alert("録音エラー: " + err.message); }
            };

            const stopRecording = () => {
                if (mediaRecorderRef.current && isRecording) {
                    mediaRecorderRef.current.stop();
                    setIsRecording(false);
                }
            };

            const updateCellData = (targetIdx, noteVal) => {
                setInstrumentSteps(prev => {
                    const currentArr = [...prev[selectedInstrument]];
                    if (selectedInstrument === "drums") {
                        const obj = currentArr[targetIdx] || { kick: false, snare: false, hihat: false, clap: false };
                        obj[selectedDrumPart] = !obj[selectedDrumPart];
                        currentArr[targetIdx] = obj;
                    } else {
                        currentArr[targetIdx] = { note: noteVal, dur: "8n" };
                    }
                    return { ...prev, [selectedInstrument]: currentArr };
                });
            };

            const handleGridCellClick = async (globalIdx) => {
                await Tone.start();
                const syns = synthsRef.current;
                if (selectedInstrument === "drums") {
                    if (syns && syns.drums) {
                        if (selectedDrumPart === "kick") syns.drums.kick.triggerAttackRelease("C2", "8n");
                        if (selectedDrumPart === "snare") syns.drums.snare.triggerAttackRelease("8n");
                        if (selectedDrumPart === "hihat") syns.drums.hihat.triggerAttackRelease("32n");
                        if (selectedDrumPart === "clap") syns.drums.clap.triggerAttackRelease("8n");
                    }
                } else if (syns && syns[selectedInstrument]) {
                    syns[selectedInstrument].triggerAttackRelease(selectedNote, "8n");
                }
                updateCellData(globalIdx, selectedNote);
            };

            const handleKeyboardClick = async (noteRawObj) => {
                await Tone.start();
                let noteName = noteRawObj.note;
                let oct = selectedOctave === "low" ? "2" : selectedOctave === "mid" ? "3" : "4";
                if (noteName === "C+") {
                    noteName = "C";
                    oct = selectedOctave === "low" ? "3" : selectedOctave === "mid" ? "4" : "5";
                }
                const fullNote = noteName + oct;
                setSelectedNote(fullNote);

                const syns = synthsRef.current;
                if (syns && syns[selectedInstrument] && selectedInstrument !== "drums") {
                    syns[selectedInstrument].triggerAttackRelease(fullNote, "8n");
                }

                const targetStep = playing ? directStepIdxRef.current : (currentBar * STEPS_PER_BAR + currentStep);
                updateCellData(targetStep, fullNote);

                setStatus(`🎹 [${noteRawObj.label} (${fullNote})] 記録！`);
            };

            return (
                <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col text-xs font-sans max-w-md mx-auto border-x border-slate-800 shadow-2xl">
                    
                    {/* ヘッダー */}
                    <header className="bg-slate-900 px-3 py-2 border-b border-amber-900/60 sticky top-0 z-50 flex items-center justify-between">
                        <div>
                            <h1 className="font-black text-xs text-amber-400 tracking-wider">AI POPS & POPPING</h1>
                            <p className="text-[9px] text-yellow-400 font-bold">楽器別AI土台作成機能</p>
                        </div>
                        <div className="flex items-center gap-1.5">
                            <button onClick={clearAll} className="px-2 py-1 bg-red-900 hover:bg-red-800 font-bold rounded text-[9px] text-white">🗑️ 全消去</button>
                            <button onClick={togglePlay} className={`px-2.5 py-1 font-black rounded text-[10px] ${playing ? "bg-yellow-400 text-black animate-pulse" : "bg-amber-600 text-white"}`}>
                                {playing ? "■ 停止" : "▶ 再生"}
                            </button>
                        </div>
                    </header>

                    <nav className="bg-slate-900 border-b border-slate-800 grid grid-cols-2 text-[11px] font-bold text-center">
                        <button onClick={() => setActiveTab("SEQUENCER")} className={`py-2.5 ${activeTab === "SEQUENCER" ? "bg-amber-700 text-white" : "text-slate-400"}`}>
                            🎹 シーケンサー
                        </button>
                        <button onClick={() => setActiveTab("RECORDER")} className={`py-2.5 ${activeTab === "RECORDER" ? "bg-amber-700 text-white" : "text-slate-400"}`}>
                            🔴 録音一覧 ({recordedAudioList.length})
                        </button>
                    </nav>

                    <main className="p-2.5 flex flex-col gap-3">

                        <div className="bg-slate-900 px-2.5 py-1.5 rounded border border-amber-900/40 text-[9px] text-amber-300 font-bold flex justify-between items-center">
                            <span className="truncate mr-2">{status}</span>
                            <span className="shrink-0 text-slate-400">位置: <b className="text-white">{currentBar + 1}</b>小節 <b className="text-yellow-400">{currentStep + 1}</b>/16</span>
                        </div>

                        {activeTab === "SEQUENCER" && (
                            <div className="flex flex-col gap-3">
                                
                                {/* ⚡ 楽器選択 */}
                                <div className="bg-slate-900 p-2 rounded-lg border border-slate-800 flex flex-col gap-1">
                                    <span className="font-bold text-amber-400 text-[10px]">⚡ 編集・AI土台作成する楽器を選択</span>
                                    <div className="grid grid-cols-1 gap-1">
                                        {INSTRUMENT_MAP.map(inst => (
                                            <button 
                                                key={inst.id} 
                                                onClick={() => setSelectedInstrument(inst.id)} 
                                                className={`py-1.5 px-2 rounded font-bold text-left flex items-center justify-between border text-[10px] ${
                                                    selectedInstrument === inst.id 
                                                        ? "bg-gradient-to-r " + inst.color + " border-white text-white shadow" 
                                                        : "bg-slate-950 border-slate-800 text-slate-400"
                                                }`}
                                            >
                                                <span>{inst.label}</span>
                                                {selectedInstrument === inst.id && <span className="text-[8px] bg-white text-black px-1 rounded font-bold">選択中</span>}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* 🎵 選択中楽器専用のAI土台作成ボタン */}
                                <button onClick={generateAiPatternForSelectedInstrument} className="w-full py-2.5 bg-gradient-to-r from-amber-600 via-orange-600 to-red-600 text-white font-black rounded-lg text-[10px] shadow-lg active:scale-95 transition-transform border border-amber-400/40">
                                    ✨ 選択中楽器のAI土台パターンを自動生成する
                                </button>

                                <div className="grid grid-cols-2 gap-2">
                                    {!isRecording ? (
                                        <button onClick={startRecording} className="py-2 bg-gradient-to-r from-red-600 to-rose-600 font-black text-white rounded text-[10px]">🔴 全体演奏録音スタート</button>
                                    ) : (
                                        <button onClick={stopRecording} className="py-2 bg-yellow-400 text-black font-black rounded text-[10px] animate-pulse">⏹️ 録音停止</button>
                                    )}
                                    <div className="bg-slate-900 p-1 rounded border border-slate-800 text-center font-bold text-[9px] flex items-center justify-center">
                                        選択音: <span className="text-amber-400 font-black ml-1">{selectedNote}</span>
                                    </div>
                                </div>

                                {/* 🎹 鍵盤直接記録 */}
                                {selectedInstrument !== "drums" && (
                                    <div className="bg-slate-900 p-2.5 rounded-lg border-2 border-amber-500/80 flex flex-col gap-2 shadow-xl">
                                        <div className="flex justify-between items-center">
                                            <span className="font-black text-amber-300 text-[10px]">🎹 鍵盤手動ボタン (即座にグリッド反映記録)</span>
                                            <div className="flex gap-1">
                                                {["low", "mid", "high"].map(oct => (
                                                    <button key={oct} onClick={() => setSelectedOctave(oct)} className={`px-1.5 py-0.5 rounded text-[8px] font-bold uppercase ${selectedOctave === oct ? "bg-amber-500 text-black font-black" : "bg-slate-950 text-slate-400 border border-slate-800"}`}>
                                                        {oct}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                        <div className="grid grid-cols-8 gap-1">
                                            {KEYBOARD_NOTES.map(k => (
                                                <button key={k.note} onClick={() => handleKeyboardClick(k)} className={`${k.color} h-12 rounded font-black text-white flex flex-col items-center justify-center shadow-lg active:scale-95 transition-transform border border-white/20`}>
                                                    <span className="text-[12px] leading-none">{k.label}</span>
                                                    <span className="text-[7px] opacity-80 leading-none mt-0.5">{k.note}</span>
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {/* 小節タブ */}
                                <div className="bg-slate-900 p-2 rounded-lg border border-slate-800 flex flex-col gap-1">
                                    <span className="font-bold text-slate-300 text-[10px]">📍 小節切替 (全8小節)</span>
                                    <div className="grid grid-cols-8 gap-1">
                                        {Array.from({ length: 8 }).map((_, barIdx) => (
                                            <button key={barIdx} onClick={() => { setCurrentBar(barIdx); setCurrentStep(0); }} className={`py-1 rounded font-black text-[10px] border ${currentBar === barIdx ? "bg-amber-600 text-white border-white scale-105" : "bg-slate-950 text-slate-400 border-slate-800"}`}>
                                                {barIdx + 1}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* グリッド表示 */}
                                <div className="bg-slate-900 p-2.5 rounded-lg border border-slate-800 flex flex-col gap-2">
                                    <span className="font-bold text-amber-400 text-[10px]">⚏ 第 {currentBar + 1} 小節 グリッド記録状況</span>
                                    <div className="grid grid-cols-8 gap-1">
                                        {Array.from({ length: STEPS_PER_BAR }).map((_, stepInBar) => {
                                            const globalIdx = currentBar * STEPS_PER_BAR + stepInBar;
                                            const isCurrent = currentStep === stepInBar;
                                            const item = instrumentSteps[selectedInstrument][globalIdx];
                                            let active = false;
                                            let displayLabel = stepInBar + 1;

                                            if (selectedInstrument === "drums") {
                                                active = item && item[selectedDrumPart];
                                                if (active) displayLabel = selectedDrumPart[0].toUpperCase();
                                            } else {
                                                active = !!item;
                                                if (active) displayLabel = item.note || "ON";
                                            }

                                            return (
                                                <button key={stepInBar} onClick={() => { setCurrentStep(stepInBar); handleGridCellClick(globalIdx); }} className={`h-10 rounded flex flex-col items-center justify-center font-bold text-[9px] border transition-all ${isCurrent ? "border-yellow-300 bg-yellow-500 text-black font-black scale-95 shadow-lg" : active ? "bg-amber-600 text-white border-amber-500 shadow" : "bg-slate-950 text-slate-400 border-slate-800"}`}>
                                                    <span className="text-[7px] opacity-70 leading-none">{stepInBar + 1}</span>
                                                    <span className="text-[10px] font-black leading-none mt-0.5 truncate max-w-full px-0.5">{active ? displayLabel : "·"}</span>
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>

                                {selectedInstrument === "drums" && (
                                    <div className="bg-slate-900 p-2.5 rounded-lg border border-purple-900 flex flex-col gap-1.5">
                                        <span className="font-bold text-purple-300 text-[10px]">🥁 ドラムパーツ選択</span>
                                        <div className="grid grid-cols-2 gap-1">
                                            {DRUM_PARTS.map(part => (
                                                <button key={part.id} onClick={() => setSelectedDrumPart(part.id)} className={`py-1.5 rounded font-bold text-[9px] ${selectedDrumPart === part.id ? "bg-purple-600 text-white font-black" : "bg-slate-950 text-slate-400 border border-slate-800"}`}>
                                                    {part.label}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                )}

                            </div>
                        )}

                        {activeTab === "RECORDER" && (
                            <div className="bg-slate-900 p-3 rounded-lg border border-amber-900/60 flex flex-col gap-3">
                                <span className="font-black text-amber-400 text-[11px]">🎙️ 全体演奏 録音一覧</span>
                                <div className="flex flex-col gap-2">
                                    {recordedAudioList.length === 0 ? (
                                        <p className="text-slate-500 text-center py-6 text-[10px]">録音データがありません。</p>
                                    ) : (
                                        recordedAudioList.map(rec => (
                                            <div key={rec.id} className="bg-slate-950 p-2.5 rounded-lg border border-slate-800 flex flex-col gap-1.5">
                                                <div className="flex justify-between items-center">
                                                    <span className="font-bold text-yellow-300 text-[10px]">{rec.title}</span>
                                                    <a href={rec.url} download={`${rec.title}.webm`} className="px-2 py-0.5 bg-slate-800 text-cyan-400 font-bold rounded text-[9px]">⬇️ DL</a>
                                                </div>
                                                <audio controls src={rec.url} className="w-full h-8 accent-amber-500" />
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        )}

                    </main>
                </div>
            );
        }

        ReactDOM.render(<AiInstrumentApp />, document.getElementById("root"));
    </script>
</body>
</html>
