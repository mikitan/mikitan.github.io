<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIC VICTORY - Popping Dance AI Base v123.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans select-none pb-12 overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        function PoppingDanceApp() {
            const [playing, setPlaying] = React.useState(false);
            const [bpm, setBpm] = React.useState(108); // Popping定番テンポ
            const [barsCount, setBarsCount] = React.useState(8); // 固定8小節
            const [currentBar, setCurrentBar] = React.useState(0);
            const [currentStep, setCurrentStep] = React.useState(-1);
            const [status, setStatus] = React.useState("💥 Popping Dance AI 土台エンジン 稼働中");

            const STEPS_PER_BAR = 16; // 1小節16ステップ固定
            const TOTAL_STEPS = barsCount * STEPS_PER_BAR;

            const [selectedInstrument, setSelectedInstrument] = React.useState("popBass");
            const [selectedDrumPart, setSelectedDrumPart] = React.useState("kick");
            const [selectedNote, setSelectedNote] = React.useState("C3");

            const INSTRUMENT_MAP = [
                { id: "popBass", label: "🎸 ポッピング・ベース (クリア＆パンチ)", color: "from-red-900 to-rose-700" },
                { id: "synthLead", label: "🎹 ヒット・シンセ (ロボティック音)", color: "from-amber-700 to-orange-600" },
                { id: "trumpet", label: "🎺 ブラス・ヒット (アクセント管楽器)", color: "from-yellow-600 to-amber-500" },
                { id: "violin", label: "🎻 ストリングス (空間演出)", color: "from-purple-800 to-indigo-600" },
                { id: "drums", label: "🥁 ドラムセット (ファンク・ビート)", color: "from-cyan-900 to-blue-800" }
            ];

            const DRUM_PARTS = [
                { id: "kick", label: "💥 キック" },
                { id: "snare", label: "🎯 スネア" },
                { id: "hihat", label: "⚡ ハイハット" },
                { id: "clap", label: "👏 ヒット・クラップ" }
            ];

            const KEYBOARD_NOTES = [
                { note: "C", label: "ド", color: "bg-red-600 hover:bg-red-500" },
                { note: "D", label: "レ", color: "bg-orange-600 hover:bg-orange-500" },
                { note: "E", label: "ミ", color: "bg-yellow-600 hover:bg-yellow-500" },
                { note: "F", label: "ファ", color: "bg-green-600 hover:bg-green-500" },
                { note: "G", label: "ソ", color: "bg-cyan-600 hover:bg-cyan-500" },
                { note: "A", label: "ラ", color: "bg-blue-600 hover:bg-blue-500" },
                { note: "B", label: "シ", color: "bg-purple-600 hover:bg-purple-500" },
                { note: "C+", label: "高ド", color: "bg-rose-600 hover:bg-rose-500" },
            ];

            // 8小節分のシーケンスデータ
            const [instrumentSteps, setInstrumentSteps] = React.useState(() => {
                const saved = localStorage.getItem("POPPING_DANCE_STEPS_V123");
                if (saved) return JSON.parse(saved);
                return {
                    popBass: new Array(128).fill(null),
                    synthLead: new Array(128).fill(null),
                    trumpet: new Array(128).fill(null),
                    violin: new Array(128).fill(null),
                    drums: new Array(128).fill(null)
                };
            });

            React.useEffect(() => {
                localStorage.setItem("POPPING_DANCE_STEPS_V123", JSON.stringify(instrumentSteps));
            }, [instrumentSteps]);

            const synthsRef = React.useRef(null);
            const loopRef = React.useRef(null);
            const masterGainRef = React.useRef(null);
            const limiterRef = React.useRef(null);
            const compRef = React.useRef(null);
            const reverbRef = React.useRef(null);
            const instrumentGainsRef = React.useRef({});
            const directStepIdxRef = React.useRef(0);

            // 音割れ防止＆クリアサウンドの初期化
            React.useEffect(() => {
                const masterGain = new Tone.Gain(1.0);
                masterGainRef.current = masterGain;

                const limiter = new Tone.Limiter(-1.0); // 歪み・音割れ完全防止
                limiterRef.current = limiter;

                const comp = new Tone.Compressor({ threshold: -16, ratio: 4, attack: 0.005, release: 0.1 });
                compRef.current = comp;

                const reverb = new Tone.Reverb({ decay: 1.5, wet: 0.15 });
                reverb.generate();
                reverbRef.current = reverb;

                reverb.connect(comp);
                comp.connect(limiter);
                limiter.connect(masterGain);
                masterGain.connect(Tone.Destination);

                const cGains = {};
                Object.keys(instrumentSteps).forEach(key => {
                    const cg = new Tone.Gain(1.0).connect(reverb);
                    cGains[key] = cg;
                });
                instrumentGainsRef.current = cGains;

                // 各楽器音源（重低音なし・クリアで抜けの良いPoppingサウンド）
                synthsRef.current = {
                    popBass: new Tone.MonoSynth({
                        oscillator: { type: "sawtooth" },
                        envelope: { attack: 0.005, decay: 0.15, sustain: 0.2, release: 0.1 },
                        filterEnvelope: { attack: 0.005, decay: 0.1, sustain: 0.3, baseFrequency: 150, octaves: 2 }
                    }).connect(cGains.popBass),

                    synthLead: new Tone.Synth({
                        oscillator: { type: "square" },
                        envelope: { attack: 0.005, decay: 0.12, sustain: 0.4, release: 0.1 }
                    }).connect(cGains.synthLead),

                    trumpet: new Tone.FMSynth({
                        harmonicity: 1.5,
                        modulationIndex: 3.0,
                        oscillator: { type: "sine" },
                        envelope: { attack: 0.02, decay: 0.15, sustain: 0.5, release: 0.1 }
                    }).connect(cGains.trumpet),

                    violin: new Tone.AMSynth({
                        harmonicity: 2.0,
                        oscillator: { type: "sawtooth" },
                        envelope: { attack: 0.08, decay: 0.2, sustain: 0.6, release: 0.2 }
                    }).connect(cGains.violin),

                    drums: {
                        kick: new Tone.MembraneSynth({ pitchDecay: 0.04, octaves: 3, envelope: { attack: 0.001, decay: 0.25, sustain: 0 } }).connect(cGains.drums),
                        snare: new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.001, decay: 0.15, sustain: 0 } }).connect(cGains.drums),
                        hihat: new Tone.MetalSynth({ frequency: 350, envelope: { attack: 0.001, decay: 0.02, release: 0.01 }, harmonicity: 5.1, modulationIndex: 12, resonance: 2500, octaves: 1.0 }).connect(cGains.drums),
                        clap: new Tone.NoiseSynth({ noise: { type: "pink" }, envelope: { attack: 0.005, decay: 0.12, sustain: 0 } }).connect(cGains.drums)
                    }
                };

                return () => { Tone.Transport.stop(); Tone.Transport.cancel(); };
            }, []);

            // 再生ループ
            React.useEffect(() => {
                Tone.Transport.bpm.value = bpm;
                Tone.Transport.cancel();

                if (playing) {
                    let stepCounter = 0;
                    loopRef.current = new Tone.Loop(time => {
                        let step = stepCounter % TOTAL_STEPS;
                        setCurrentStep(step % STEPS_PER_BAR);
                        setCurrentBar(Math.floor(step / STEPS_PER_BAR));
                        directStepIdxRef.current = step;

                        const syns = synthsRef.current;
                        if (syns) {
                            Object.keys(instrumentSteps).forEach(instKey => {
                                const item = instrumentSteps[instKey][step];
                                if (!item) return;

                                if (instKey === "drums") {
                                    if (item.kick) syns.drums.kick.triggerAttackRelease("C2", "8n", time);
                                    if (item.snare) syns.drums.snare.triggerAttackRelease("8n", time);
                                    if (item.hihat) syns.drums.hihat.triggerAttackRelease("32n", time);
                                    if (item.clap) syns.drums.clap.triggerAttackRelease("8n", time);
                                } else if (syns[instKey]) {
                                    syns[instKey].triggerAttackRelease(item.note || "C3", item.dur || "8n", time);
                                }
                            });
                        }
                        stepCounter++;
                    }, "16n").start(0);

                    Tone.Transport.start();
                } else {
                    Tone.Transport.stop();
                }
            }, [playing, bpm, instrumentSteps]);

            const togglePlay = async () => {
                await Tone.start();
                setPlaying(!playing);
                setStatus(playing ? "■ 停止中" : "▶ Popping再生中 (108 BPM)");
            };

            const clearAll = () => {
                if (!window.confirm("8小節のデータをすべて消去しますか？")) return;
                const cleared = {};
                Object.keys(instrumentSteps).forEach(k => { cleared[k] = new Array(128).fill(null); });
                setInstrumentSteps(cleared);
                setStatus("🗑️ データを消去しました");
            };

            // Popping用 AI自動ヒット構築
            const aiPredictPoppingBeat = () => {
                const newSteps = JSON.parse(JSON.stringify(instrumentSteps));
                for (let i = 0; i < TOTAL_STEPS; i++) {
                    const s = i % STEPS_PER_BAR;
                    // ドラム（強力なブレイクビーツ＆ヒット用スネア）
                    newSteps.drums[i] = {
                        kick: (s === 0 || s === 8 || s === 10),
                        snare: (s === 4 || s === 12),
                        hihat: (s % 2 === 0),
                        clap: (s === 4 || s === 12)
                    };
                    // ベース（ヒットに合わせたアクセント）
                    if (s === 0 || s === 4 || s === 8 || s === 12) {
                        newSteps.popBass[i] = { note: "C2", dur: "16n" };
                    } else {
                        newSteps.popBass[i] = null;
                    }
                    // シンセヒット
                    if (s === 0 || s === 6 || s === 10) {
                        newSteps.synthLead[i] = { note: "G3", dur: "16n" };
                    } else {
                        newSteps.synthLead[i] = null;
                    }
                }
                setInstrumentSteps(newSteps);
                setStatus("✨ AI Poppingビート＆ヒット構築完了！");
            };

            const handleGridCellClick = async (globalIdx, overrideNote = null) => {
                await Tone.start();
                const syns = synthsRef.current;
                const targetNote = overrideNote || selectedNote;

                if (selectedInstrument === "drums") {
                    if (syns && syns.drums) {
                        if (selectedDrumPart === "kick") syns.drums.kick.triggerAttackRelease("C2", "8n");
                        if (selectedDrumPart === "snare") syns.drums.snare.triggerAttackRelease("8n");
                        if (selectedDrumPart === "hihat") syns.drums.hihat.triggerAttackRelease("32n");
                        if (selectedDrumPart === "clap") syns.drums.clap.triggerAttackRelease("8n");
                    }
                } else if (syns && syns[selectedInstrument]) {
                    syns[selectedInstrument].triggerAttackRelease(targetNote, "8n");
                }

                setInstrumentSteps(prev => {
                    const currentArr = [...prev[selectedInstrument]];
                    if (selectedInstrument === "drums") {
                        const obj = currentArr[globalIdx] || { kick: false, snare: false, hihat: false, clap: false };
                        obj[selectedDrumPart] = !obj[selectedDrumPart];
                        currentArr[globalIdx] = obj;
                    } else {
                        currentArr[globalIdx] = (currentArr[globalIdx] && currentArr[globalIdx].note === targetNote) ? null : { note: targetNote, dur: "8n" };
                    }
                    return { ...prev, [selectedInstrument]: currentArr };
                });
            };

            const handleKeyboardClick = async (noteRawObj) => {
                await Tone.start();
                const fullNote = noteRawObj.note + "3";
                setSelectedNote(fullNote);
                const targetStep = playing ? directStepIdxRef.current : (currentBar * STEPS_PER_BAR);
                handleGridCellClick(targetStep, fullNote);
                setStatus(`🎹 鍵盤 [${noteRawObj.label}(${fullNote})] 記録！`);
            };

            return (
                <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col text-xs font-sans max-w-md mx-auto border-x border-slate-800 shadow-2xl">
                    
                    {/* ヘッダー */}
                    <header className="bg-slate-900 px-3 py-2.5 border-b border-red-900/60 sticky top-0 z-50 flex items-center justify-between">
                        <div>
                            <h1 className="font-black text-xs text-red-500 tracking-wider">MIC VICTORY POPPING</h1>
                            <p className="text-[9px] text-yellow-400 font-bold">8小節クリアAIビート土台</p>
                        </div>
                        <div className="flex items-center gap-1.5">
                            <button onClick={clearAll} className="px-2 py-1 bg-red-900 hover:bg-red-800 font-bold rounded text-[9px] text-white">🗑️ 全削除</button>
                            <button onClick={togglePlay} className={`px-3 py-1 font-black rounded text-[10px] ${playing ? "bg-yellow-400 text-black animate-pulse" : "bg-red-600 text-white"}`}>
                                {playing ? "■ 停止" : "▶ 再生"}
                            </button>
                            <div className="bg-slate-950 px-2 py-0.5 rounded border border-slate-800 text-yellow-400 text-center font-bold">
                                <span className="text-[7px] block text-slate-500">BPM</span>
                                <span className="text-[10px]">{bpm}</span>
                            </div>
                        </div>
                    </header>

                    <main className="p-2.5 flex flex-col gap-3">

                        {/* ステータス */}
                        <div className="bg-slate-900 px-2.5 py-1.5 rounded border border-red-900/40 text-[9px] text-amber-300 font-bold flex justify-between items-center">
                            <span>{status}</span>
                            <span className="text-slate-400">小節: <b className="text-white">{currentBar + 1}</b> / 8</span>
                        </div>

                        {/* AI自動構築 */}
                        <button onClick={aiPredictPoppingBeat} className="w-full py-2.5 bg-gradient-to-r from-red-600 via-rose-600 to-amber-500 text-white font-black rounded text-[10px] shadow-lg active:scale-95">
                            ✨ AI Poppingビート自動生成 (ワンタップ作成)
                        </button>

                        {/* 楽器選択 */}
                        <div className="bg-slate-900 p-2.5 rounded-lg border border-slate-800 flex flex-col gap-1.5">
                            <span className="font-bold text-amber-400 text-[10px]">⚡ 楽器を選択 (重低音なし・クリアサウンド)</span>
                            <div className="grid grid-cols-1 gap-1">
                                {INSTRUMENT_MAP.map(inst => (
                                    <button 
                                        key={inst.id} 
                                        onClick={() => setSelectedInstrument(inst.id)} 
                                        className={`py-2 px-2.5 rounded font-bold text-left flex items-center justify-between border text-[10px] ${
                                            selectedInstrument === inst.id 
                                                ? "bg-gradient-to-r " + inst.color + " border-white/60 shadow text-white" 
                                                : "bg-slate-950 border-slate-800 text-slate-400 hover:bg-slate-900"
                                        }`}
                                    >
                                        <span>{inst.label}</span>
                                        {selectedInstrument === inst.id && <span className="text-[8px] bg-white text-black px-1.5 py-0.5 rounded font-bold">選択中</span>}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* 鍵盤手動入力 */}
                        {selectedInstrument !== "drums" && (
                            <div className="bg-slate-900 p-2.5 rounded-lg border border-cyan-500/80 flex flex-col gap-1.5">
                                <span className="font-bold text-cyan-300 text-[10px]">🎹 鍵盤手動記録</span>
                                <div className="grid grid-cols-8 gap-1">
                                    {KEYBOARD_NOTES.map(k => (
                                        <button key={k.note} onClick={() => handleKeyboardClick(k)} className={`${k.color} h-10 rounded font-black text-white flex flex-col items-center justify-center shadow active:scale-95`}>
                                            <span className="text-[11px] leading-none">{k.label}</span>
                                            <span className="text-[7px] opacity-80 leading-none mt-0.5">{k.note}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* 8小節切り替えタブ */}
                        <div className="bg-slate-900 p-2 rounded-lg border border-slate-800 flex flex-col gap-1.5">
                            <span className="font-bold text-slate-300 text-[10px]">📍 編集する小節 (全8小節)</span>
                            <div className="grid grid-cols-8 gap-1">
                                {Array.from({ length: 8 }).map((_, barIdx) => (
                                    <button key={barIdx} onClick={() => setCurrentBar(barIdx)} className={`py-1.5 rounded font-black text-[10px] border ${currentBar === barIdx ? "bg-red-600 text-white border-white shadow scale-105" : "bg-slate-950 text-slate-400 border-slate-800"}`}>
                                        {barIdx + 1}小節
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* 16ステップ グリッド記録 */}
                        <div className="bg-slate-900 p-2.5 rounded-lg border border-slate-800 flex flex-col gap-2">
                            <div className="flex justify-between items-center">
                                <span className="font-bold text-amber-400 text-[10px]">⚏ 第 {currentBar + 1} 小節グリッド (16ステップ)</span>
                                <button onClick={() => {
                                    const newSteps = JSON.parse(JSON.stringify(instrumentSteps));
                                    for(let i = currentBar * 16; i < (currentBar + 1) * 16; i++) newSteps[selectedInstrument][i] = null;
                                    setInstrumentSteps(newSteps);
                                }} className="px-1.5 py-0.5 bg-slate-800 text-red-400 font-bold rounded text-[9px]">小節クリア</button>
                            </div>

                            <div className="grid grid-cols-8 gap-1">
                                {Array.from({ length: STEPS_PER_BAR }).map((_, stepInBar) => {
                                    const globalIdx = currentBar * STEPS_PER_BAR + stepInBar;
                                    const isCurrent = playing && currentStep === stepInBar;
                                    const item = instrumentSteps[selectedInstrument][globalIdx];
                                    let active = false;
                                    let displayLabel = stepInBar + 1;

                                    if (selectedInstrument === "drums") {
                                        active = item && item[selectedDrumPart];
                                        if (active) displayLabel = selectedDrumPart[0].toUpperCase();
                                    } else {
                                        active = !!item;
                                        if (active) displayLabel = item.note || "ON";
                                    }

                                    return (
                                        <button key={stepInBar} onClick={() => handleGridCellClick(globalIdx)} className={`h-9 rounded flex flex-col items-center justify-center font-bold text-[9px] border transition-all ${isCurrent ? "border-amber-400 bg-amber-500 text-black font-black scale-95 shadow-lg" : active ? "bg-red-600 text-white border-red-500 shadow" : "bg-slate-950 text-slate-400 border-slate-800 hover:border-slate-700"}`}>
                                            <span className="text-[8px] opacity-60 leading-none">{stepInBar + 1}</span>
                                            <span className="text-[10px] font-black leading-none mt-0.5 truncate max-w-full px-0.5">{active ? displayLabel : "·"}</span>
                                        </button>
                                    );
                                })}
                            </div>
                        </div>

                        {/* ドラムパーツ選択 */}
                        {selectedInstrument === "drums" && (
                            <div className="bg-slate-900 p-2.5 rounded-lg border border-purple-900 flex flex-col gap-1.5">
                                <span className="font-bold text-purple-300 text-[10px]">🥁 ドラムパーツ選択</span>
                                <div className="grid grid-cols-2 gap-1">
                                    {DRUM_PARTS.map(part => (
                                        <button key={part.id} onClick={() => setSelectedDrumPart(part.id)} className={`py-1.5 rounded font-bold text-[9px] ${selectedDrumPart === part.id ? "bg-purple-600 text-white font-black" : "bg-slate-950 text-slate-400 border border-slate-800"}`}>
                                            {part.label}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                    </main>
                </div>
            );
        }

        ReactDOM.render(<PoppingDanceApp />, document.getElementById("root"));
    </script>
</body>
</html>
