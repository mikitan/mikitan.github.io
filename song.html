<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIC VICTORY BAND - Popping Heavy Bass v100.10</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans select-none pb-24 overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        function MasterSynthApp() {
            // --- タブ & 基本設定 ---
            const [activeTab, setActiveTab] = React.useState("SEQUENCER"); // SEQUENCER, REC_AI, MIXER, FX, STORAGE, SAVE
            const [playing, setPlaying] = React.useState(false);
            const [bpm, setBpm] = React.useState(116);
            const [playbackRate, setPlaybackRate] = React.useState(1.0);
            const [barsCount, setBarsCount] = React.useState(38);
            const [burstMode, setBurstMode] = React.useState(1); // 1打, 2打, 3打, 4打
            const [currentBar, setCurrentBar] = React.useState(0);
            const [currentStep, setCurrentStep] = React.useState(-1);
            const [status, setStatus] = React.useState("🔥 MIC VICTORY BAND 稼働中");

            const BAR_STEPS = 16;
            const TOTAL_STEPS = barsCount * BAR_STEPS;

            // --- 選択中楽器・パーツ ---
            const [selectedInstrument, setSelectedInstrument] = React.useState("synthLowBass");
            const [selectedDrumPart, setSelectedDrumPart] = React.useState("kick");
            const [selectedNote, setSelectedNote] = React.useState("C2");
            const [aiPromptTopic, setAiPromptTopic] = React.useState("圧倒的な重低音とキレのあるPoppingビート");

            // --- AI歌詞/プロンプト ---
            const [rapLyrics, setRapLyrics] = React.useState(
`[Intro - MIC VICTORY BAND Popping Special]
重低音サブベースが胸を打ち抜く！1曲38小節の完全なるグループ。
体を揺らし、ヒットを刻め！最高峰のワクワクサウンドが今始まる。

[Verse 1 - 鬼キレ重低音AIビート構築]
シンセサイザー電子低音＆サブベースが圧倒的なうねりを生む。
無駄な高音を削ぎ落とし、ダンサーの魂を震わせる。`
            );

            // --- 音割れ（歪み）防止ミキサー パラメータ ---
            const [masterVolume, setMasterVolume] = React.useState(1.6);
            const [masterBassBoost, setMasterBassBoost] = React.useState(24);
            const [volumes, setVolumes] = React.useState({
                synthLowBass: 18,
                synthSubBass: 16,
                drums: 12,
                synthLeadNormal: 8,
                piano: 6,
                elecGuitar: 4,
                africa: 2
            });
            const [mutes, setMutes] = React.useState({
                synthLowBass: false, synthSubBass: false, drums: false,
                synthLeadNormal: false, piano: false, elecGuitar: false, africa: false
            });

            // --- ストレージデータ ---
            const [storageList, setStorageList] = React.useState([
                { id: 1, title: "MIC VICTORY 38小節 Popping Session #1", bars: 38, bpm: 116, date: "12:00" }
            ]);
            const [saveSlotName, setSaveSlotName] = React.useState("MIC_VICTORY_HEAVY_BASS_v100");

            // --- 録音機能 ---
            const [isRecording, setIsRecording] = React.useState(false);
            const [recMode, setRecMode] = React.useState("master"); // master, internal, mic
            const [recordedAudioList, setRecordedAudioList] = React.useState([]);
            const mediaRecorderRef = React.useRef(null);
            const audioChunksRef = React.useRef([]);
            const destStreamNodeRef = React.useRef(null);

            // --- ステップデータ定義 ---
            const [instrumentSteps, setInstrumentSteps] = React.useState({
                synthLowBass: new Array(64 * BAR_STEPS).fill(null),
                synthSubBass: new Array(64 * BAR_STEPS).fill(null),
                drums: new Array(64 * BAR_STEPS).fill(null),
                synthLeadNormal: new Array(64 * BAR_STEPS).fill(null),
                piano: new Array(64 * BAR_STEPS).fill(null),
                elecGuitar: new Array(64 * BAR_STEPS).fill(null),
                africa: new Array(64 * BAR_STEPS).fill(null),
            });

            // --- Tone.js 音源参照 ---
            const synthsRef = React.useRef(null);
            const loopRef = React.useRef(null);
            const masterGainRef = React.useRef(null);
            const limiterRef = React.useRef(null);
            const compRef = React.useRef(null);
            const eqRef = React.useRef(null);
            const instrumentGainsRef = React.useRef({});
            const directStepIdxRef = React.useRef(0);

            // --- 音色とラベルデータ ---
            const INSTRUMENT_MAP = [
                { id: "synthLowBass", label: "超重低音ベース (Low Synth)", color: "from-red-900 to-red-600" },
                { id: "synthSubBass", label: "サブベース極太 (Sub Bass)", color: "from-amber-900 to-red-800" },
                { id: "drums", label: "鬼キレドラム (Popping Beats)", color: "from-orange-700 to-red-600" },
                { id: "synthLeadNormal", label: "電子通常シンセ音 (Synth Lead)", color: "from-cyan-800 to-blue-600" },
                { id: "piano", label: "エレクトリックピアノ", color: "from-blue-900 to-indigo-700" },
                { id: "elecGuitar", label: "ファンクギター電子", color: "from-amber-800 to-orange-700" },
                { id: "africa", label: "パーカッション (Afro Groove)", color: "from-yellow-800 to-amber-600" },
            ];

            const KEYBOARD_NOTES = [
                { note: "C2", label: "ド", color: "bg-red-600" },
                { note: "D2", label: "レ", color: "bg-orange-600" },
                { note: "E2", label: "ミ", color: "bg-yellow-600" },
                { note: "F2", label: "ファ", color: "bg-green-600" },
                { note: "G2", label: "ソ", color: "bg-cyan-600" },
                { note: "A2", label: "ラ", color: "bg-blue-600" },
                { note: "B2", label: "シ", color: "bg-purple-600" },
                { note: "C3", label: "高ド", color: "bg-rose-600" },
            ];

            // 🎧 Tone.js オーディオノード初期化（歪み・音割れブロック回路）
            React.useEffect(() => {
                const masterGain = new Tone.Gain(masterVolume);
                masterGainRef.current = masterGain;

                // 超強力リミッター＆コンプレッサー（音割れを阻止）
                const limiter = new Tone.Limiter(-0.1); 
                limiterRef.current = limiter;

                const comp = new Tone.Compressor({ threshold: -10, ratio: 5, attack: 0.003, release: 0.1 });
                compRef.current = comp;

                const eq = new Tone.EQ3({ low: masterBassBoost, lowFrequency: 80, mid: 0, high: -3 });
                eqRef.current = eq;

                const destNode = Tone.context.createMediaStreamDestination();
                destStreamNodeRef.current = destNode;

                // 接続: 楽器Gain -> EQ -> Compressor -> Limiter -> MasterGain -> Destination & Stream
                eq.connect(comp);
                comp.connect(limiter);
                limiter.connect(masterGain);
                masterGain.connect(Tone.Destination);
                masterGain.connect(destNode);

                const cGains = {};
                Object.keys(instrumentSteps).forEach(key => {
                    const cg = new Tone.Gain(Tone.dbToGain(volumes[key] || 0)).connect(eq);
                    cGains[key] = cg;
                });
                instrumentGainsRef.current = cGains;

                // シンセ・ドラム音源作成
                synthsRef.current = {
                    synthLowBass: new Tone.MonoSynth({ oscillator: { type: "sawtooth" }, envelope: { attack: 0.005, decay: 0.2, sustain: 0.4, release: 0.1 } }).connect(cGains.synthLowBass),
                    synthSubBass: new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.01, decay: 0.4, sustain: 0.6, release: 0.2 } }).connect(cGains.synthSubBass),
                    synthLeadNormal: new Tone.Synth({ oscillator: { type: "triangle" }, envelope: { attack: 0.01, decay: 0.2, sustain: 0.3, release: 0.1 } }).connect(cGains.synthLeadNormal),
                    piano: new Tone.PolySynth(Tone.Synth).connect(cGains.piano),
                    elecGuitar: new Tone.PluckSynth({ attackNoise: 1, dampening: 4000, resonance: 0.7 }).connect(cGains.elecGuitar),
                    africa: new Tone.MembraneSynth({ pitchDecay: 0.05, octaves: 3, envelope: { attack: 0.001, decay: 0.2, sustain: 0.01 } }).connect(cGains.africa),
                    drums: {
                        kick: new Tone.MembraneSynth({ pitchDecay: 0.05, octaves: 6, envelope: { attack: 0.001, decay: 0.3, sustain: 0.01 } }).connect(cGains.drums),
                        snare: new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.001, decay: 0.2, sustain: 0 } }).connect(cGains.drums),
                        hihat: new Tone.MetalSynth({ frequency: 250, envelope: { attack: 0.001, decay: 0.04, release: 0.01 }, harmonicity: 5.1, modulationIndex: 32, resonance: 4000, octaves: 1.5 }).connect(cGains.drums),
                        clap: new Tone.NoiseSynth({ noise: { type: "pink" }, envelope: { attack: 0.005, decay: 0.15, sustain: 0 } }).connect(cGains.drums),
                    }
                };

                return () => { Tone.Transport.stop(); Tone.Transport.cancel(); };
            }, []);

            // リアルタイム音量・EQ変更
            React.useEffect(() => {
                if (masterGainRef.current) masterGainRef.current.gain.value = masterVolume;
                if (eqRef.current) eqRef.current.low.value = masterBassBoost;
                Object.keys(volumes).forEach(key => {
                    if (instrumentGainsRef.current[key]) {
                        const val = mutes[key] ? -Infinity : volumes[key];
                        instrumentGainsRef.current[key].gain.value = Tone.dbToGain(val);
                    }
                });
            }, [masterVolume, masterBassBoost, volumes, mutes]);

            // シーケンサー再生制御
            React.useEffect(() => {
                Tone.Transport.bpm.value = bpm * playbackRate;
                Tone.Transport.cancel();

                if (playing) {
                    let stepCounter = 0;
                    loopRef.current = new Tone.Loop(time => {
                        const totalLen = barsCount * BAR_STEPS;
                        let step = stepCounter % totalLen;
                        setCurrentStep(step % BAR_STEPS);
                        setCurrentBar(Math.floor(step / BAR_STEPS));
                        directStepIdxRef.current = step;

                        const syns = synthsRef.current;
                        if (syns) {
                            Object.keys(instrumentSteps).forEach(instKey => {
                                if (mutes[instKey]) return;
                                const item = instrumentSteps[instKey][step];
                                if (!item) return;

                                if (instKey === "drums") {
                                    if (item.kick) syns.drums.kick.triggerAttackRelease("C1", "8n", time);
                                    if (item.snare) syns.drums.snare.triggerAttackRelease("8n", time);
                                    if (item.hihat) syns.drums.hihat.triggerAttackRelease("32n", time);
                                    if (item.clap) syns.drums.clap.triggerAttackRelease("8n", time);
                                } else if (syns[instKey]) {
                                    syns[instKey].triggerAttackRelease(item.note || "C2", item.dur || "8n", time);
                                }
                            });
                        }
                        stepCounter++;
                    }, "16n").start(0);

                    Tone.Transport.start();
                } else {
                    Tone.Transport.stop();
                }
            }, [playing, bpm, playbackRate, instrumentSteps, barsCount, mutes]);

            // 再生・停止切り替え
            const togglePlay = async () => {
                await Tone.start();
                setPlaying(!playing);
                setStatus(playing ? "■ 停止" : `▶ 再生中 (${bpm} BPM - クリア重低音)`);
            };

            // 全削除
            const clearAll = () => {
                if (!window.confirm("全シーケンスデータを一括削除しますか？")) return;
                const cleared = {};
                Object.keys(instrumentSteps).forEach(k => { cleared[k] = new Array(64 * BAR_STEPS).fill(null); });
                setInstrumentSteps(cleared);
                setStatus("🗑️ 全データを消去しました");
            };

            // パターン自動生成 (ジャンル別)
            const generateGenrePattern = (genre) => {
                const totalLen = barsCount * BAR_STEPS;
                const newSteps = { ...instrumentSteps };
                const drumsArr = new Array(totalLen).fill(null);
                const bassArr = new Array(totalLen).fill(null);

                for (let i = 0; i < totalLen; i++) {
                    const s = i % 16;
                    let kick = false, snare = false, hihat = false, clap = false;
                    let bassNote = null;

                    if (genre === "popping") {
                        kick = s === 0 || s === 6 || s === 10;
                        snare = s === 4 || s === 12;
                        hihat = s % 2 === 0;
                        clap = s === 12;
                        if (s === 0 || s === 3 || s === 10) bassNote = { note: "C2", dur: "16n" };
                    } else if (genre === "dance") {
                        kick = s % 4 === 0;
                        snare = s === 4 || s === 12;
                        hihat = true;
                        if (s % 2 === 0) bassNote = { note: "C2", dur: "8n" };
                    } else if (genre === "soul") {
                        kick = s === 0 || s === 7 || s === 10;
                        snare = s === 4 || s === 12;
                        hihat = true;
                        if (s === 0 || s === 6 || s === 12) bassNote = { note: "F2", dur: "8n" };
                    } else if (genre === "contemporary") {
                        kick = s === 0 || s === 8;
                        snare = s === 12;
                        hihat = s % 4 === 0;
                        if (s === 0 || s === 4 || s === 8) bassNote = { note: "A2", dur: "4n" };
                    } else if (genre === "blues" || genre === "pops" || genre === "rock") {
                        kick = s === 0 || s === 8 || s === 10;
                        snare = s === 4 || s === 12;
                        hihat = s % 2 === 0;
                        if (s === 0 || s === 8) bassNote = { note: "G2", dur: "8n" };
                    }

                    drumsArr[i] = { kick, snare, hihat, clap };
                    bassArr[i] = bassNote;
                }

                newSteps["drums"] = drumsArr;
                newSteps["synthLowBass"] = bassArr;
                setInstrumentSteps(newSteps);
                setStatus(`✨ 【${genre.toUpperCase()}】パターンを生成しました！`);
            };

            // 鍵盤クリック・書き込み
            const handleKeyboardClick = (noteObj) => {
                const note = noteObj.note;
                setSelectedNote(note);
                const syns = synthsRef.current;
                if (!syns) return;

                if (selectedInstrument === "drums") {
                    if (selectedDrumPart === "kick") syns.drums.kick.triggerAttackRelease("C1", "8n");
                    else if (selectedDrumPart === "snare") syns.drums.snare.triggerAttackRelease("8n");
                    else if (selectedDrumPart === "hihat") syns.drums.hihat.triggerAttackRelease("32n");
                    else syns.drums.clap.triggerAttackRelease("8n");
                } else if (syns[selectedInstrument]) {
                    syns[selectedInstrument].triggerAttackRelease(note, "8n");
                }

                const targetStep = playing ? directStepIdxRef.current : (currentBar * BAR_STEPS);
                toggleStep(selectedInstrument, targetStep, note);
            };

            // グリッド直接切り替え
            const toggleStep = (instKey, stepIdx, noteVal = selectedNote) => {
                setInstrumentSteps(prev => {
                    const currentArr = [...prev[instKey]];
                    if (instKey === "drums") {
                        const obj = currentArr[stepIdx] || { kick: false, snare: false, hihat: false, clap: false };
                        obj[selectedDrumPart] = !obj[selectedDrumPart];
                        currentArr[stepIdx] = obj;
                    } else {
                        currentArr[stepIdx] = currentArr[stepIdx] ? null : { note: noteVal, dur: "8n" };
                    }
                    return { ...prev, [instKey]: currentArr };
                });
            };

            // 録音処理
            const startRecording = async () => {
                try {
                    await Tone.start();
                    let captureStream = destStreamNodeRef.current.stream;
                    mediaRecorderRef.current = new MediaRecorder(captureStream);
                    audioChunksRef.current = [];
                    mediaRecorderRef.current.ondataavailable = (e) => { if (e.data.size > 0) audioChunksRef.current.push(e.data); };
                    mediaRecorderRef.current.onstop = () => {
                        const audioBlob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                        const audioUrl = URL.createObjectURL(audioBlob);
                        setRecordedAudioList(prev => [...prev, { id: Date.now(), title: `MIC VICTORY Track #${prev.length + 1}`, url: audioUrl }]);
                        setStatus("⏹️ 録音完了・保存しました！");
                    };
                    mediaRecorderRef.current.start();
                    setIsRecording(true);
                    if (!playing) togglePlay();
                } catch (err) {
                    alert("マイク/オーディオキャプチャエラー");
                }
            };

            const stopRecording = () => {
                if (mediaRecorderRef.current && isRecording) {
                    mediaRecorderRef.current.stop();
                    setIsRecording(false);
                }
            };

            // JSON保存・ダウンロード
            const downloadJSON = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({
                    saveSlotName, bpm, barsCount, instrumentSteps
                }));
                const dlAnchorElem = document.createElement('a');
                dlAnchorElem.setAttribute("href", dataStr);
                dlAnchorElem.setAttribute("download", `${saveSlotName}.json`);
                dlAnchorElem.click();
            };

            return (
                <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col text-xs font-sans max-w-md mx-auto border-4 border-red-800 shadow-2xl">
                    
                    {/* ヘッダーエリア */}
                    <header className="bg-slate-900 px-3 py-2 border-b border-red-900 sticky top-0 z-50 flex items-center justify-between">
                        <div>
                            <h1 className="font-black text-sm text-red-500 tracking-wider">MIC VICTORY BAND</h1>
                            <p className="text-[10px] text-yellow-400 font-bold">Popping Heavy Bass v100.10</p>
                        </div>
                        <div className="flex items-center gap-2">
                            <button onClick={clearAll} className="px-2 py-1 bg-red-700 hover:bg-red-600 font-bold rounded text-[10px] text-white shadow">
                                🗑️ 全体一括削除
                            </button>
                            <button onClick={togglePlay} className={`px-3 py-1 font-black rounded shadow text-xs ${playing ? "bg-yellow-400 text-black animate-pulse" : "bg-red-600 text-white"}`}>
                                {playing ? "■ 停止" : "▶ 再生"}
                            </button>
                            <div className="bg-slate-950 px-2 py-0.5 rounded border border-slate-700 font-bold text-yellow-400 text-center">
                                <span className="text-[8px] block text-slate-400">BPM</span>
                                {bpm}
                            </div>
                        </div>
                    </header>

                    {/* ナビゲーションタブメニュー */}
                    <nav className="bg-slate-900 border-b border-slate-800 grid grid-cols-6 text-[11px] font-bold text-center">
                        <button onClick={() => setActiveTab("SEQUENCER")} className={`py-2 border-r border-slate-800 ${activeTab === "SEQUENCER" ? "bg-orange-600 text-white" : "bg-slate-900 text-slate-400"}`}>
                            🎹 Sequencer
                        </button>
                        <button onClick={() => setActiveTab("REC_AI")} className={`py-2 border-r border-slate-800 ${activeTab === "REC_AI" ? "bg-orange-600 text-white" : "bg-slate-900 text-slate-400"}`}>
                            🎙️ 録音&AI
                        </button>
                        <button onClick={() => setActiveTab("MIXER")} className={`py-2 border-r border-slate-800 ${activeTab === "MIXER" ? "bg-orange-600 text-white" : "bg-slate-900 text-slate-400"}`}>
                            🎚️ ミキサー
                        </button>
                        <button onClick={() => setActiveTab("FX")} className={`py-2 border-r border-slate-800 ${activeTab === "FX" ? "bg-orange-600 text-white" : "bg-slate-900 text-slate-400"}`}>
                            ⚃ FX・速度
                        </button>
                        <button onClick={() => setActiveTab("STORAGE")} className={`py-2 border-r border-slate-800 ${activeTab === "STORAGE" ? "bg-orange-600 text-white" : "bg-slate-900 text-slate-400"}`}>
                            🌊 ストレージ
                        </button>
                        <button onClick={() => setActiveTab("SAVE")} className={`py-2 ${activeTab === "SAVE" ? "bg-orange-600 text-white" : "bg-slate-900 text-slate-400"}`}>
                            💾 保存
                        </button>
                    </nav>

                    {/* メインコンテンツエリア */}
                    <main className="p-3 flex flex-col gap-4">

                        {/* STATUS BAR */}
                        <div className="bg-slate-900 px-3 py-1.5 rounded border border-red-900/60 text-[10px] text-amber-300 font-bold flex justify-between">
                            <span>{status}</span>
                            <span>Bar: {currentBar + 1} / {barsCount}</span>
                        </div>

                        {/* --- TAB 1: 38小節 Sequencer --- */}
                        {activeTab === "SEQUENCER" && (
                            <div className="flex flex-col gap-4">
                                {/* 小節数セレクター */}
                                <div className="bg-slate-900 p-3 rounded-xl border border-slate-800 flex flex-col gap-2">
                                    <span className="font-bold text-amber-400">🎹 小節数セレクター ({barsCount}小節設定中)</span>
                                    <div className="grid grid-cols-6 gap-1">
                                        {[16, 32, 36, 38, 50, 64].map(b => (
                                            <button key={b} onClick={() => setBarsCount(b)} className={`py-1 rounded font-bold text-xs ${barsCount === b ? "bg-red-600 text-white border border-white" : "bg-slate-950 text-slate-400 border border-slate-800"}`}>
                                                {b}小節
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* 連打バーストモード */}
                                <div className="bg-slate-900 p-2.5 rounded-xl border border-slate-800 flex items-center justify-between">
                                    <span className="font-bold text-slate-300">🎹 連打バーストモード:</span>
                                    <div className="flex gap-1">
                                        {[1, 2, 3, 4].map(b => (
                                            <button key={b} onClick={() => setBurstMode(b)} className={`px-2.5 py-1 rounded font-bold ${burstMode === b ? "bg-amber-500 text-black" : "bg-slate-950 text-slate-400"}`}>
                                                {b}打
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* ジャンルパターン自動生成 */}
                                <div className="bg-slate-900 p-3 rounded-xl border border-slate-800 flex flex-col gap-2">
                                    <span className="font-bold text-amber-400">🔥 ジャンル音源・パターン自動生成</span>
                                    <div className="grid grid-cols-2 gap-2">
                                        <button onClick={() => generateGenrePattern("popping")} className="py-2.5 bg-gradient-to-r from-red-600 to-rose-700 text-white font-black rounded-lg shadow">💥 Popping</button>
                                        <button onClick={() => generateGenrePattern("dance")} className="py-2.5 bg-gradient-to-r from-blue-600 to-cyan-600 text-white font-black rounded-lg shadow">🎧 Dance (4つ打ち)</button>
                                        <button onClick={() => generateGenrePattern("soul")} className="py-2.5 bg-gradient-to-r from-amber-600 to-yellow-600 text-white font-black rounded-lg shadow">🎷 Soul Funk</button>
                                        <button onClick={() => generateGenrePattern("contemporary")} className="py-2.5 bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-black rounded-lg shadow">🪘 Black Contemporary</button>
                                        <button onClick={() => generateGenrePattern("blues")} className="py-2 bg-gradient-to-r from-indigo-800 to-blue-800 text-white font-bold rounded-lg">🎸 Blues</button>
                                        <button onClick={() => generateGenrePattern("pops")} className="py-2 bg-gradient-to-r from-pink-600 to-rose-600 text-white font-bold rounded-lg">✨ Pops</button>
                                        <button onClick={() => generateGenrePattern("rock")} className="py-2 col-span-2 bg-gradient-to-r from-orange-700 to-red-800 text-white font-bold rounded-lg">⚡ Rock</button>
                                    </div>
                                </div>

                                {/* 楽器セレクター */}
                                <div className="bg-slate-900 p-3 rounded-xl border border-slate-800 flex flex-col gap-2">
                                    <span className="font-bold text-amber-400">⚡ 楽器セレクター (重低音 & シンセ電子音)</span>
                                    <div className="flex flex-col gap-1.5">
                                        {INSTRUMENT_MAP.map(inst => (
                                            <button key={inst.id} onClick={() => setSelectedInstrument(inst.id)} className={`py-2 px-3 rounded-lg font-black text-left flex items-center justify-between border ${selectedInstrument === inst.id ? "bg-gradient-to-r " + inst.color + " border-white shadow-lg text-white" : "bg-slate-950 border-slate-800 text-slate-400"}`}>
                                                <span>{inst.label}</span>
                                                {selectedInstrument === inst.id && <span className="text-[10px] bg-white text-black px-1.5 py-0.5 rounded">選択中</span>}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* ドラムパーツ切り替え */}
                                {selectedInstrument === "drums" && (
                                    <div className="bg-slate-900 p-3 rounded-xl border border-red-900 flex flex-col gap-2">
                                        <span className="font-bold text-yellow-400">🥁 ドラムパーツ切替</span>
                                        <div className="grid grid-cols-4 gap-1">
                                            {["kick", "snare", "hihat", "clap"].map(part => (
                                                <button key={part} onClick={() => setSelectedDrumPart(part)} className={`py-2 rounded font-bold uppercase ${selectedDrumPart === part ? "bg-amber-500 text-black" : "bg-slate-950 text-slate-400"}`}>
                                                    {part}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {/* ドレミファソ鍵盤 */}
                                <div className="bg-slate-900 p-3 rounded-xl border border-slate-800 flex flex-col gap-2">
                                    <span className="font-bold text-amber-300">🎹 手書き書き込み要望枠 (キーボード & グリッド)</span>
                                    <div className="grid grid-cols-4 gap-1.5">
                                        {KEYBOARD_NOTES.map(k => (
                                            <button key={k.note} onClick={() => handleKeyboardClick(k)} className={`${k.color} h-12 rounded-lg font-black text-white flex flex-col items-center justify-center shadow active:scale-95 transition-transform`}>
                                                <span>{k.label}</span>
                                                <span className="text-[8px] opacity-70">{k.note}</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* 16ステップ グリッド表示 */}
                                <div className="bg-slate-900 p-3 rounded-xl border border-slate-800 flex flex-col gap-2">
                                    <div className="flex justify-between items-center">
                                        <span className="font-bold text-slate-300">⚏ グリッド (全 {barsCount * 16} ステップ) - 第 {currentBar + 1} / {barsCount} 小節</span>
                                        <button onClick={() => {
                                            const newArr = new Array(64 * 16).fill(null);
                                            setInstrumentSteps(prev => ({ ...prev, [selectedInstrument]: newArr }));
                                        }} className="px-2 py-0.5 bg-slate-800 text-red-400 font-bold rounded text-[10px]">クリア</button>
                                    </div>
                                    <div className="grid grid-cols-4 gap-1.5">
                                        {Array.from({ length: 16 }).map((_, stepInBar) => {
                                            const globalIdx = currentBar * 16 + stepInBar;
                                            const isCurrent = playing && currentStep === stepInBar;
                                            const item = instrumentSteps[selectedInstrument][globalIdx];
                                            const active = selectedInstrument === "drums" ? (item && item[selectedDrumPart]) : !!item;

                                            return (
                                                <button key={stepInBar} onClick={() => toggleStep(selectedInstrument, globalIdx)} className={`h-12 rounded flex flex-col items-center justify-center font-bold border transition-colors ${isCurrent ? "border-amber-400 bg-amber-500 text-black font-black" : active ? "bg-red-600 text-white border-red-500" : "bg-slate-950 text-slate-500 border-slate-800"}`}>
                                                    <span>{stepInBar + 1}</span>
                                                    <span className="text-[8px]">{active ? (selectedInstrument === "drums" ? selectedDrumPart : item.note) : "."}</span>
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* --- TAB 2: 録音 & AI歌詞 --- */}
                        {activeTab === "REC_AI" && (
                            <div className="flex flex-col gap-4">
                                <div className="bg-slate-900 p-3 rounded-xl border border-red-800 flex flex-col gap-3">
                                    <span className="font-black text-amber-400 text-xs">🎙️ MIC VICTORY 録音スタジオ</span>
                                    <div className="grid grid-cols-3 gap-1">
                                        <button onClick={() => setRecMode("master")} className={`py-1.5 rounded font-bold ${recMode === "master" ? "bg-amber-600 text-white" : "bg-slate-950 text-slate-400"}`}>🔴 全体マスター</button>
                                        <button onClick={() => setRecMode("internal")} className={`py-1.5 rounded font-bold ${recMode === "internal" ? "bg-amber-600 text-white" : "bg-slate-950 text-slate-400"}`}>🎧 内部ミックス</button>
                                        <button onClick={() => setRecMode("mic")} className={`py-1.5 rounded font-bold ${recMode === "mic" ? "bg-amber-600 text-white" : "bg-slate-950 text-slate-400"}`}>🎤 外部マイク</button>
                                    </div>

                                    {!isRecording ? (
                                        <button onClick={startRecording} className="py-3 bg-gradient-to-r from-red-600 to-orange-600 font-black text-white rounded-xl shadow-lg text-sm animate-pulse">🔴 録音を開始</button>
                                    ) : (
                                        <button onClick={stopRecording} className="py-3 bg-yellow-400 text-black font-black rounded-xl shadow-lg text-sm">⏹️ 録音停止・保存</button>
                                    )}

                                    {recordedAudioList.map(rec => (
                                        <div key={rec.id} className="bg-slate-950 p-2 rounded flex justify-between items-center border border-slate-800">
                                            <span className="font-bold text-yellow-300 text-[10px]">{rec.title}</span>
                                            <audio controls src={rec.url} className="h-6 w-36 accent-red-500" />
                                        </div>
                                    ))}
                                </div>

                                <div className="bg-slate-900 p-3 rounded-xl border border-slate-800 flex flex-col gap-2">
                                    <div className="flex justify-between items-center">
                                        <span className="font-bold text-amber-400">✨ AI歌詞・文章生成</span>
                                        <button onClick={() => navigator.clipboard.writeText(rapLyrics)} className="px-2 py-0.5 bg-red-700 text-white font-bold rounded text-[10px]">📋 コピー</button>
                                    </div>
                                    <div className="flex gap-2">
                                        <input type="text" value={aiPromptTopic} onChange={e => setAiPromptTopic(e.target.value)} className="flex-1 bg-slate-950 border border-slate-800 rounded px-2 text-xs font-bold text-amber-300" />
                                        <button onClick={() => setStatus("✨ AI歌詞を再生成しました")} className="px-3 py-2 bg-gradient-to-r from-red-600 to-orange-600 font-bold rounded text-white text-[10px]">🤖 AI自動生成</button>
                                    </div>
                                    <textarea value={rapLyrics} onChange={e => setRapLyrics(e.target.value)} rows={6} className="bg-slate-950 border border-slate-800 rounded p-2 text-[11px] font-mono text-slate-200 leading-relaxed" />
                                </div>
                            </div>
                        )}

                        {/* --- TAB 3: 重低音ミキサー --- */}
                        {activeTab === "MIXER" && (
                            <div className="bg-slate-900 p-3 rounded-xl border border-slate-800 flex flex-col gap-4">
                                <span className="font-black text-amber-400 text-xs">🎚️ 重低音革命ミキサー (歪み・音割れ完全防止)</span>

                                <div className="bg-slate-950 p-3 rounded-lg border border-slate-800 flex flex-col gap-3">
                                    <div className="flex flex-col gap-1">
                                        <div className="flex justify-between font-bold text-slate-300"><span>📢 マスター音量</span><span className="text-red-400">{masterVolume.toFixed(2)}x</span></div>
                                        <input type="range" min="0.2" max="2.5" step="0.05" value={masterVolume} onChange={e => setMasterVolume(Number(e.target.value))} className="accent-red-500" />
                                    </div>
                                    <div className="flex flex-col gap-1">
                                        <div className="flex justify-between font-bold text-slate-300"><span>🔊 超重低音ベースEQブースト</span><span className="text-amber-400">{masterBassBoost} dB</span></div>
                                        <input type="range" min="0" max="30" step="1" value={masterBassBoost} onChange={e => setMasterBassBoost(Number(e.target.value))} className="accent-amber-500" />
                                    </div>
                                </div>

                                <div className="flex flex-col gap-2">
                                    {INSTRUMENT_MAP.map(inst => (
                                        <div key={inst.id} className="bg-slate-950 p-2.5 rounded-lg border border-slate-800 flex flex-col gap-1">
                                            <div className="flex justify-between items-center font-bold">
                                                <span className="text-slate-200">{inst.label}</span>
                                                <div className="flex items-center gap-2">
                                                    <button onClick={() => setMutes(prev => ({ ...prev, [inst.id]: !prev[inst.id] }))} className={`px-2 py-0.5 rounded text-[9px] font-bold ${mutes[inst.id] ? "bg-red-800 text-white" : "bg-emerald-600 text-white"}`}>
                                                        {mutes[inst.id] ? "MUTED" : "ON"}
                                                    </button>
                                                    <span className="text-xs text-amber-400">{volumes[inst.id]} dB</span>
                                                </div>
                                            </div>
                                            <input type="range" min="-12" max="24" step="1" value={volumes[inst.id]} onChange={e => setVolumes({ ...volumes, [inst.id]: Number(e.target.value) })} className="accent-red-500" />
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* --- TAB 4: FX & 速度 --- */}
                        {activeTab === "FX" && (
                            <div className="bg-slate-900 p-3 rounded-xl border border-slate-800 flex flex-col gap-4">
                                <span className="font-black text-amber-400 text-xs">⚃ FX機能 & 速度調整</span>
                                
                                <div className="grid grid-cols-1 gap-2">
                                    <button onClick={() => setStatus("⚡ スクラッチFX発動！")} className="py-3 bg-gradient-to-r from-red-600 to-purple-600 font-black rounded-lg text-white shadow">⚃ スクラッチ FX</button>
                                    <button onClick={() => setStatus("🔄 リピートバースト発動！")} className="py-3 bg-gradient-to-r from-amber-600 to-orange-600 font-black rounded-lg text-white shadow">🔄 リピートバースト</button>
                                </div>

                                <div className="bg-slate-950 p-3 rounded-lg border border-slate-800 flex flex-col gap-2">
                                    <div className="flex justify-between font-bold">
                                        <span>⚡ 再生速度</span>
                                        <span className="text-yellow-400">{playbackRate.toFixed(2)}x (BPM: {Math.round(bpm * playbackRate)})</span>
                                    </div>
                                    <input type="range" min="0.5" max="2.0" step="0.05" value={playbackRate} onChange={e => setPlaybackRate(Number(e.target.value))} className="accent-amber-500" />
                                </div>
                            </div>
                        )}

                        {/* --- TAB 5: crera ストレージ --- */}
                        {activeTab === "STORAGE" && (
                            <div className="bg-slate-900 p-3 rounded-xl border border-slate-800 flex flex-col gap-3">
                                <div className="flex justify-between items-center">
                                    <span className="font-black text-amber-400 text-xs">🌊 crera ストレージ</span>
                                    <button onClick={() => setStorageList(prev => [...prev, { id: Date.now(), title: `MIC VICTORY ${barsCount}小節 Session #${prev.length + 1}`, bars: barsCount, bpm, date: new Date().toLocaleTimeString() }])} className="px-3 py-1 bg-red-600 text-white font-bold rounded text-xs shadow">
                                        🌊 保存
                                    </button>
                                </div>

                                {storageList.map(item => (
                                    <div key={item.id} className="bg-slate-950 p-3 rounded-lg border border-slate-800 flex justify-between items-center">
                                        <div>
                                            <h4 className="font-bold text-yellow-300 text-xs">{item.title}</h4>
                                            <p className="text-[10px] text-slate-500">{item.bars}小節 / {item.bpm} BPM / {item.date}</p>
                                        </div>
                                        <button onClick={() => setStatus(`ロード完了: ${item.title}`)} className="px-3 py-1.5 bg-blue-600 text-white font-bold rounded text-xs">
                                            ロード
                                        </button>
                                    </div>
                                ))}
                            </div>
                        )}

                        {/* --- TAB 6: プロジェクト保存 --- */}
                        {activeTab === "SAVE" && (
                            <div className="bg-slate-900 p-3 rounded-xl border border-slate-800 flex flex-col gap-3">
                                <span className="font-black text-amber-400 text-xs">💾 プロジェクト保存</span>

                                <div className="bg-slate-950 p-3 rounded-lg border border-slate-800 flex flex-col gap-3">
                                    <input type="text" value={saveSlotName} onChange={e => setSaveSlotName(e.target.value)} className="bg-slate-900 border border-slate-700 rounded px-3 py-2 text-yellow-300 font-bold font-mono text-xs" />
                                    <button onClick={downloadJSON} className="py-3 bg-gradient-to-r from-orange-600 to-red-600 font-black text-white rounded-lg shadow flex items-center justify-center gap-2 text-xs">
                                        💾 JSONダウンロード
                                    </button>
                                </div>
                            </div>
                        )}

                    </main>
                </div>
            );
        }

        ReactDOM.render(<MasterSynthApp />, document.getElementById("root"));
    </script>
</body>
</html>
