<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
body { font-family: 'Inter', sans-serif;}

</h1>
<div class="flex items-center gap-2">

<label class="text-sm bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg border border-slate-600 transition flex items-center gap-1.5 cursor-pointer" title="バックアップから復元">
<i class="fa-solid fa-upload"></i> 復元
<input type="file" id="importFile" onchange="importData(event)" class="hidden" accept=".json">

<i class="fa-solid fa-triangle-exclamation mr-1"></i>
この開き方ではデータ保存が使えません。ファイルを Chrome などのブラウザで直接開いてください（アプリ内プレビューやシークレットモードでは保存が消えます）。<br>※ 消えやすい場合は、Chromeのメニュー「ホーム画面に追加」して、そこから開くと残りやすくなります。
</p>
</div>

<main class="max-w-4xl mx-auto px-4 mt-8">
<div class="flex flex-col md:flex-row justify-between items-stretch md:items-center gap-4 mb-6">
<button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 px-5 rounded-xl shadow-lg transition flex items-center justify-center gap-2">
<i class="fa-solid fa-plus"></i> 新しい目標を追加
</button>

<button onclick="shareList()" class="flex-1 md:flex-none bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 px-4 rounded-xl shadow transition flex items-center justify-center gap-2">
<i class="fa-solid fa-share-nodes"></i> リスト共有リンク生成
</button>
<button onclick="restoreBackup()" class="flex-1 md:flex-none bg-slate-700 hover:bg-slate-600 text-white font-semibold py-2.5 px-4 rounded-xl shadow transition flex items-center justify-center gap-2" title="1つ前の保存データに戻す">
<i class="fa-solid fa-rotate-left"></i> 前の保存に戻す
</button>
</div>
</div>

<div id="goalsList" class="grid gap-6 md:grid-cols-2"></div>

<i class="fa-solid fa-flag-checkered text-5xl text-slate-600 mb-3"></i>

<p class="text-slate-500 text-sm mt-1">「新しい目標を追加」ボタンから設定してみましょう！</p>
</div>

<div id="modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center hidden z-50 p-4">

<i class="fa-solid fa-xmark"></i>
</button>

<form id="goalForm" onsubmit="saveGoal(event)" class="space-y-4">
<input type="hidden" id="goalId">
<div>
<label class="block text-xs font-semibold text-slate-400 uppercase mb-1">目標名</label>
<input type="text" id="goalTitle" required placeholder="例: 資格試験に合格する" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-indigo-500">
</div>
<div>
<label class="block text-xs font-semibold text-slate-400 uppercase mb-1">目標達成期日</label>
<input type="datetime-local" id="goalDeadline" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-indigo-500">
</div>
<div>
<label class="block text-xs font-semibold text-slate-400 uppercase mb-1">メモ / 詳細</label>
<textarea id="goalNotes" rows="3" placeholder="達成に向けたメモや詳細を入力..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-indigo-500"></textarea>
</div>
<div class="flex justify-end gap-3 pt-2">
<button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm">キャンセル</button>
<button type="submit" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 font-semibold rounded-lg text-sm transition">保存する</button>
</div>
</form>
</div>
</div>

<div id="toast" class="fixed bottom-5 right-5 bg-emerald-600 text-white px-4 py-2.5 rounded-lg shadow-xl translate-y-20 opacity-0 transition-all duration-300 flex items-center gap-2 z-50">
<i class="fa-solid fa-circle-check"></i> <span id="toastMsg">通知メッセージ</span>
</div>

<script>
/* =========================================================
v3 保存の仕組み（v2からさらに強化）
1) IndexedDB と localStorage の両方に二重保存する
2) 保存のたびに「1つ前のデータ」を予備として残す（誤削除の復旧用）
3) 読み込み時は両方を見て、新しい方を採用する。旧形式（配列そのまま）も読み込む
4) 保存できたかどうかを画面上部に必ず表示する
5) ブラウザに「データを消さないで」と要求する（navigator.storage.persist）
========================================================= */
const LS_KEY = 'user_goals_data';
const LS_MIRROR_KEY = 'user_goals_data_mirror';
const COOKIE_NAME = 'gt_goals_v3';
const LS_BACKUP_KEY = 'user_goals_data_backup';
const DB_NAME = 'goalTrackerDB_v2';
const DB_STORE = 'kv';
const DB_KEY = 'goals_main';
const DB_BACKUP_KEY = 'goals_backup';

let goals = [];
let dataLoaded = false;   // 読み込みが終わるまでは絶対に保存しない（空データで上書きする事故防止）
let allowEmptySave = false; // 本人が明示的に全部消した場合だけ true
let lastSavedAt = 0;
let lsAvailable = false;
let idbAvailable = false;

// ---------- IndexedDB ----------
function idbOpen() {
return new Promise((resolve, reject) => {
if (!('indexedDB' in window)) { reject(new Error('no idb')); return;}
const req = indexedDB.open(DB_NAME, 1);
req.onupgradeneeded = () => { req.result.createObjectStore(DB_STORE);};
req.onsuccess = () => resolve(req.result);
req.onerror = () => reject(req.error);
});
}
async function idbGet(key) {
const db = await idbOpen();
return new Promise((resolve, reject) => {
const tx = db.transaction(DB_STORE, 'readonly');
const req = tx.objectStore(DB_STORE).get(key);
req.onsuccess = () => resolve(req.result || null);
req.onerror = () => reject(req.error);
});
}
async function idbSet(key, value) {
const db = await idbOpen();
return new Promise((resolve, reject) => {
const tx = db.transaction(DB_STORE, 'readwrite');
tx.objectStore(DB_STORE).put(value, key);
tx.oncomplete = () => resolve(true);
tx.onerror = () => reject(tx.error);
});
}

// ---------- localStorage ----------
function testLocalStorage() {
try {
const k = '__gt_test__';
localStorage.setItem(k, '1');
localStorage.removeItem(k);
return true;
} catch (e) { return false;}
}
function lsRead(key) {
try {
const raw = localStorage.getItem(key);
return raw? JSON.parse(raw): null;
} catch (e) { return null;}
}
function lsWrite(key, value) {
try { localStorage.setItem(key, JSON.stringify(value)); return true;}
catch (e) { return false;}
}

// ---------- Cookie ミラー（localStorageとは別の保存場所にも残す） ----------
function cookieWrite(payload) {
try {
const enc = encodeURIComponent(JSON.stringify(payload));
if (enc.length > 3500) return false; // Cookieの上限を超える場合は書かない
const exp = new Date(Date.now() + 3650 * 24 * 60 * 60 * 1000).toUTCString();
document.cookie = COOKIE_NAME + '=' + enc + '; expires=' + exp + '; path=/; SameSite=Lax';
return true;
} catch (e) { return false;}
}
function cookieRead() {
try {
const m = document.cookie.match(new RegExp('(?:^|; )' + COOKIE_NAME + '=([^;]*)'));
if (!m) return null;
return JSON.parse(decodeURIComponent(m[1]));
} catch (e) { return null;}
}

// 旧形式（配列）と新形式（{savedAt, goals}）の両方を受ける
function normalize(parsed) {
if (!parsed) return null;
if (Array.isArray(parsed)) return { savedAt: 0, goals: parsed};
if (Array.isArray(parsed.goals)) return { savedAt: parsed.savedAt || 0, goals: parsed.goals};
return null;
}

async function loadAllData() {
let candidates = [];
if (lsAvailable) {
const main = normalize(lsRead(LS_KEY));
if (main) candidates.push(main);
const mirror = normalize(lsRead(LS_MIRROR_KEY));
if (mirror) candidates.push(mirror);
}
const ck = normalize(cookieRead());
if (ck) candidates.push(ck);
try {
const idbMain = normalize(await idbGet(DB_KEY));
idbAvailable = true;
if (idbMain) candidates.push(idbMain);
} catch (e) { idbAvailable = false;}

if (candidates.length === 0) return { savedAt: 0, goals: []};
// 「新しい方」ではなく「目標が多い方」を優先する（空で上書きされたコピーに負けないため）
candidates.sort((a, b) => (b.goals.length - a.goals.length) || ((b.savedAt || 0) - (a.savedAt || 0)));
return candidates[0];
}

async function persistGoals(showMsg, forceEmpty) {
if (!dataLoaded) return false; // 読み込み前は保存しない
// 空データでの上書き防止：保存済みに目標があるのに goals が空なら書かない（本人の明示操作は除く）
if (goals.length === 0 && !forceEmpty && !allowEmptySave) {
let storedHas = false;
if (lsAvailable) {
const a = normalize(lsRead(LS_KEY)); if (a && a.goals.length > 0) storedHas = true;
const b = normalize(lsRead(LS_MIRROR_KEY)); if (b && b.goals.length > 0) storedHas = true;
}
if (storedHas) { updateSaveStatus(true, lsAvailable, idbAvailable); return true;}
}
const payload = { version: 3, savedAt: Date.now(), goals: goals};
let okLS = false, okIDB = false;

if (lsAvailable) {
const prev = lsRead(LS_KEY);
if (prev) lsWrite(LS_BACKUP_KEY, prev);
okLS = lsWrite(LS_KEY, payload);
lsWrite(LS_MIRROR_KEY, payload);
}
cookieWrite(payload);
try {
const prevIdb = await idbGet(DB_KEY);
if (prevIdb) await idbSet(DB_BACKUP_KEY, prevIdb);
await idbSet(DB_KEY, payload);
okIDB = true;
} catch (e) { okIDB = false;}

lastSavedAt = payload.savedAt;
updateSaveStatus(okLS || okIDB, okLS, okIDB);
if (showMsg) {
if (okLS || okIDB) showToast('保存しました');
else showToast('保存できませんでした。バックアップを書き出してください');
}
return okLS || okIDB;
}

function updateSaveStatus(ok, okLS, okIDB) {
const el = document.getElementById('saveStatus');
const warn = document.getElementById('storageWarning');
const time = lastSavedAt? new Date(lastSavedAt).toLocaleTimeString(): '-';
if (ok) {
el.innerHTML = '<i class="fa-solid fa-circle-check text-emerald-400 mr-1"></i> 保存済み：目標 ' +
goals.length + ' 件 ／ 最終保存 ' + escapeHtml(time) +
'（保存先：' + (okIDB? 'IndexedDB ': '') + (okLS? 'localStorage': '') + '）';
warn.classList.add('hidden');
} else {
el.innerHTML = '<i class="fa-solid fa-triangle-exclamation text-rose-400 mr-1"></i> 保存できていません';
warn.classList.remove('hidden');
}
}

async function restoreBackup() {
let backups = [];
if (lsAvailable) {
const b = normalize(lsRead(LS_BACKUP_KEY));
if (b) backups.push(b);
}
try {
const b = normalize(await idbGet(DB_BACKUP_KEY));
if (b) backups.push(b);
} catch (e) {}
if (backups.length === 0) { showToast('予備データがありません'); return;}
backups.sort((a, b) => (b.savedAt || 0) - (a.savedAt || 0));
const backup = backups[0];
if (confirm('1つ前の保存データ（目標 ' + backup.goals.length + ' 件）に戻しますか？\n今の表示は置き換わります。')) {
goals = backup.goals;
await persistGoals(false);
renderGoals();
showToast('前の保存データに戻しました');
}
}

// ---------- 起動 ----------
window.addEventListener('DOMContentLoaded', async () => {
lsAvailable = testLocalStorage();

// ブラウザにデータ保持を要求（対応ブラウザのみ）
try {
if (navigator.storage && navigator.storage.persist) {
await navigator.storage.persist();
}
} catch (e) {}

const loaded = await loadAllData();
goals = loaded.goals || [];
lastSavedAt = loaded.savedAt || 0;

// 共有リンク：読み込みの「後」に足す（v1の上書きバグを修正）
const urlParams = new URLSearchParams(window.location.search);
const sharedData = urlParams.get('shared_goals');
if (sharedData) {
try {
const decoded = JSON.parse(decodeURIComponent(escape(atob(sharedData))));
if (Array.isArray(decoded) && confirm('共有された目標リストを読み込みますか？\n（現在のリストに追加保存されます）')) {
const existingIds = new Set(goals.map(g => String(g.id)));
decoded.forEach(g => { if (!existingIds.has(String(g.id))) goals.push(g);});
await persistGoals(false);
}
} catch (e) {
showToast('共有データの読み込みに失敗しました');
}
window.history.replaceState({}, document.title, window.location.pathname);
}

renderGoals();
dataLoaded = true; // ここから保存を許可
updateSaveStatus(lsAvailable || idbAvailable, lsAvailable, idbAvailable);
try {
if (navigator.storage && navigator.storage.persisted) {
const p = await navigator.storage.persisted();
const el = document.getElementById('saveStatus');
el.innerHTML += p? ' ／ ブラウザ保持: 強' : ' ／ ブラウザ保持: 弱（「ホーム画面に追加」すると強くなります）';
}
} catch (e) {}
if (!lsAvailable &&!idbAvailable) {
document.getElementById('storageWarning').classList.remove('hidden');
}
setInterval(updateCountdown, 1000);
});

// 画面を閉じる／隠すときにも localStorage へ即保存（保険）
document.addEventListener('visibilitychange', () => {
if (document.visibilityState === 'hidden' && lsAvailable && dataLoaded && (goals.length > 0 || allowEmptySave)) {
const pl = { version: 3, savedAt: Date.now(), goals: goals};
lsWrite(LS_KEY, pl);
lsWrite(LS_MIRROR_KEY, pl);
cookieWrite(pl);
}
});
window.addEventListener('beforeunload', () => {
if (lsAvailable && dataLoaded && (goals.length > 0 || allowEmptySave)) {
const pl = { version: 3, savedAt: Date.now(), goals: goals};
lsWrite(LS_KEY, pl);
lsWrite(LS_MIRROR_KEY, pl);
}
});

// ---------- 表示 ----------
function renderGoals() {
const container = document.getElementById('goalsList');
const emptyState = document.getElementById('emptyState');
container.innerHTML = '';
if (goals.length === 0) {
emptyState.classList.remove('hidden');
} else {
emptyState.classList.add('hidden');
}
goals.forEach((goal) => {
const card = document.createElement('div');
card.className = "bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-lg relative flex flex-col justify-between";
card.id = 'goal-card-' + goal.id;
card.innerHTML =
'<div>' +
'<div class="flex justify-between items-start mb-2">' +
'<h3 class="text-lg font-bold text-white leading-tight pr-2">' + escapeHtml(goal.title) + '</h3>' +
'<div class="flex items-center gap-1 text-slate-400 shrink-0">' +
'<button onclick="copyGoalSummary(\'' + goal.id + '\')" class="p-1 hover:text-emerald-400 transition" title="カード内容をコピー"><i class="fa-regular fa-copy"></i></button>' +
'<button onclick="editGoal(\'' + goal.id + '\')" class="p-1 hover:text-indigo-400 transition" title="編集"><i class="fa-solid fa-pen-to-square"></i></button>' +
'<button onclick="deleteGoal(\'' + goal.id + '\')" class="p-1 hover:text-rose-400 transition" title="削除"><i class="fa-solid fa-trash-can"></i></button>' +
'</div>' +
'</div>' +
'<p class="text-xs text-slate-400 mb-4"><i class="fa-regular fa-calendar-check mr-1"></i> 期限: ' + escapeHtml(new Date(goal.deadline).toLocaleString()) + '</p>' +
'<div class="bg-slate-900 border border-slate-700 rounded-xl p-3 mb-4 text-center">' +
'<div id="timer-' + goal.id + '" class="text-xl font-bold font-mono text-indigo-400">計算中...</div>' +
'</div>' +
(goal.notes? '<p class="text-sm text-slate-300 bg-slate-900/50 p-2.5 rounded-lg border border-slate-700/50 whitespace-pre-wrap mb-4">' + escapeHtml(goal.notes) + '</p>': '') +
'</div>' +
'<div class="border-t border-slate-700/80 pt-3 mt-2">' +
'<div class="flex justify-between items-center text-xs text-slate-400 mb-2">' +
'<span class="font-semibold"><i class="fa-solid fa-list-check mr-1"></i> 進捗記録リスト</span>' +
'<button onclick="addLogPrompt(\'' + goal.id + '\')" class="text-indigo-400 hover:underline"><i class="fa-solid fa-plus"></i> 記録追加</button>' +
'</div>' +
'<ul class="space-y-1.5 max-h-32 overflow-y-auto pr-1 text-xs text-slate-300">' +
((goal.logs || []).length > 0?
goal.logs.map((log, index) =>
'<li class="bg-slate-900/80 p-2 rounded flex justify-between items-center">' +
'<span>' + escapeHtml(log.text) + ' <span class="text-[10px] text-slate-500">(' + escapeHtml(log.date) + ')</span></span>' +
'<div class="flex items-center gap-1 shrink-0 ml-2">' +
'<button onclick="copyLog(\'' + goal.id + '\',' + index + ')" class="text-slate-500 hover:text-emerald-400" title="テキストをコピー"><i class="fa-regular fa-copy"></i></button>' +
'<button onclick="deleteLog(\'' + goal.id + '\',' + index + ')" class="text-slate-500 hover:text-rose-400" title="削除"><i class="fa-solid fa-xmark"></i></button>' +
'</div>' +
'</li>').join(''):
'<li class="text-slate-500 text-center py-1">記録はまだありません</li>') +
'</ul>' +
'</div>';
container.appendChild(card);
});
updateCountdown();
}

function updateCountdown() {
const now = new Date().getTime();
goals.forEach((goal) => {
const element = document.getElementById('timer-' + goal.id);
if (!element) return;
const target = new Date(goal.deadline).getTime();
const distance = target - now;
if (distance < 0) {
element.innerHTML = '<span class="text-rose-400 font-semibold"><i class="fa-solid fa-flag"></i> 期限切れ / 達成！</span>';
return;
}
const days = Math.floor(distance / (1000 * 60 * 60 * 24));
const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
const seconds = Math.floor((distance % (1000 * 60)) / 1000);
element.innerHTML =
'<span class="text-2xl">' + days + '</span><span class="text-xs text-slate-400 mr-2">日</span>' +
'<span class="text-xl">' + pad(hours) + '</span><span class="text-xs text-slate-400 mr-1">:</span>' +
'<span class="text-xl">' + pad(minutes) + '</span><span class="text-xs text-slate-400 mr-1">:</span>' +
'<span class="text-xl text-amber-400">' + pad(seconds) + '</span>';
});
}
function pad(n) { return n < 10? '0' + n: n;}

// ---------- 操作 ----------
async function saveGoal(e) {
e.preventDefault();
const id = document.getElementById('goalId').value;
const title = document.getElementById('goalTitle').value.trim();
const deadline = document.getElementById('goalDeadline').value;
const notes = document.getElementById('goalNotes').value.trim();
if (id) {
const index = goals.findIndex(g => String(g.id) === String(id));
if (index!== -1) {
goals[index].title = title;
goals[index].deadline = deadline;
goals[index].notes = notes;
}
showToast('目標を更新しました');
} else {
goals.push({ id: Date.now().toString(), title: title, deadline: deadline, notes: notes, logs: []});
showToast('目標を新しく保存しました');
}
await persistGoals(false);
renderGoals();
closeModal();
}

function editGoal(id) {
const goal = goals.find(g => String(g.id) === String(id));
if (!goal) return;
document.getElementById('modalTitle').innerText = '目標の編集';
document.getElementById('goalId').value = goal.id;
document.getElementById('goalTitle').value = goal.title;
document.getElementById('goalDeadline').value = goal.deadline;
document.getElementById('goalNotes').value = goal.notes || '';
openModal();
}

async function deleteGoal(id) {
if (confirm('この目標を削除してもよろしいですか？\n（間違えた場合は「前の保存に戻す」で戻せます）')) {
goals = goals.filter(g => String(g.id)!== String(id));
if (goals.length === 0) allowEmptySave = true;
await persistGoals(false, goals.length === 0);
renderGoals();
showToast('目標を削除しました');
}
}

async function addLogPrompt(goalId) {
const text = prompt('本日の進捗や一言メモを入力してください:');
if (text && text.trim()) {
const goal = goals.find(g => String(g.id) === String(goalId));
if (goal) {
if (!goal.logs) goal.logs = [];
const today = new Date();
const dateStr = (today.getMonth() + 1) + '/' + today.getDate() + ' ' + pad(today.getHours()) + ':' + pad(today.getMinutes());
goal.logs.unshift({ text: text.trim(), date: dateStr});
await persistGoals(false);
renderGoals();
showToast('記録を追加しました');
}
}
}

function copyLog(goalId, logIndex) {
const goal = goals.find(g => String(g.id) === String(goalId));
if (goal && goal.logs && goal.logs[logIndex]) copyText(goal.logs[logIndex].text);
}

async function deleteLog(goalId, logIndex) {
const goal = goals.find(g => String(g.id) === String(goalId));
if (goal && goal.logs) {
goal.logs.splice(logIndex, 1);
await persistGoals(false);
renderGoals();
showToast('記録を削除しました');
}
}

// ---------- コピー ----------
function copyText(text) {
if (!text) return;
if (navigator.clipboard && navigator.clipboard.writeText) {
navigator.clipboard.writeText(text).then(() => {
showToast('クリップボードにコピーしました！');
}).catch(() => { fallbackCopyText(text);});
} else {
fallbackCopyText(text);
}
}
function fallbackCopyText(text) {
const textArea = document.createElement("textarea");
textArea.value = text;
textArea.style.position = "fixed";
document.body.appendChild(textArea);
textArea.focus();
textArea.select();
try {
const successful = document.execCommand('copy');
showToast(successful? 'クリップボードにコピーしました！': 'コピーに失敗しました');
} catch (err) {
showToast('コピーに失敗しました');
}
document.body.removeChild(textArea);
}

function copyGoalSummary(id) {
const goal = goals.find(g => String(g.id) === String(id));
if (!goal) return;
let summary = '' + goal.title + '\n';
summary += '' + new Date(goal.deadline).toLocaleString() + '\n';
if (goal.notes) summary += '\n' + goal.notes + '\n';
if (goal.logs && goal.logs.length > 0) {
summary += '\n';
goal.logs.forEach(log => { summary += '・' + log.text + ' (' + log.date + ')\n';});
}
copyText(summary.trim());
}

function shareList() {
if (goals.length === 0) { alert('共有する目標がありません。'); return;}
try {
const jsonStr = JSON.stringify(goals);
const encoded = btoa(unescape(encodeURIComponent(jsonStr)));
const shareUrl = window.location.origin + window.location.pathname + '?shared_goals=' + encoded;
copyText(shareUrl);
} catch (e) {
alert('データサイズが大きすぎるため、共有リンクを作成できません。');
}
}

// ---------- バックアップ / 復元 ----------
function exportData() {
const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(goals, null, 2));
const downloadAnchor = document.createElement('a');
downloadAnchor.setAttribute("href", dataStr);
downloadAnchor.setAttribute("download", 'goals_backup_' + new Date().toISOString().slice(0, 10) + '.json');
document.body.appendChild(downloadAnchor);
downloadAnchor.click();
downloadAnchor.remove();
showToast('バックアップファイルを保存しました');
}

function importData(event) {
const file = event.target.files[0];
if (!file) return;
const reader = new FileReader();
reader.onload = async function(e) {
try {
const imported = JSON.parse(e.target.result);
const importedGoals = Array.isArray(imported)? imported: (imported.goals || null);
if (!Array.isArray(importedGoals)) { alert('無効なファイル形式です。'); return;}
if (confirm('OK：今のリストに「追加」して復元します\nキャンセル：次の選択（上書き）へ')) {
const existingIds = new Set(goals.map(g => String(g.id)));
importedGoals.forEach(g => { if (!existingIds.has(String(g.id))) goals.push(g);});
await persistGoals(false);
renderGoals();
showToast('データを追加で復元しました');
} else if (confirm('OK：今のリストを消して「上書き」復元します\nキャンセル：中止します')) {
goals = importedGoals;
await persistGoals(false);
renderGoals();
showToast('データを上書き復元しました');
}
} catch (err) {
alert('ファイルの読み込みに失敗しました。');
}
event.target.value = '';
};
reader.readAsText(file);
}

// ---------- モーダル / トースト ----------
function openModal() { document.getElementById('modal').classList.remove('hidden');}
function closeModal() {
document.getElementById('modal').classList.add('hidden');
document.getElementById('goalForm').reset();
document.getElementById('goalId').value = '';
document.getElementById('modalTitle').innerText = '新しい目標の設定';
}
function showToast(message) {
const toast = document.getElementById('toast');
document.getElementById('toastMsg').innerText = message;
toast.classList.remove('translate-y-20', 'opacity-0');
setTimeout(() => { toast.classList.add('translate-y-20', 'opacity-0');}, 3000);
}
function escapeHtml(str) {
return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
</script>
