<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULTIMATE MASTER DAW v37.0 - エレキギター・弾き語りリフ・つけ足し完全版</title>
    <style>
        :root {
            --bg-color: #070605;
            --surface-color: #15110d;
            --surface-alt: #0d0a08;
            --border-color: #4a3520;
            --accent-gold: #f2a900;
            --accent-gold-bright: #ffc233;
            --text-main: #f5f0e6;
            --text-muted: #b89b82;
        }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--bg-color); color: var(--text-main); margin: 0; padding: 15px; }
        h1, h2, h3 { color: var(--accent-gold); border-bottom: 1px solid #3d2c1e; padding-bottom: 6px; margin: 8px 0; letter-spacing: 1px; }
        .section { background: var(--surface-color); padding: 12px 18px; margin-bottom: 12px; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.8); border: 1px solid var(--border-color); }
        button { background: linear-gradient(135deg, #f2a900, #c67d00); color: #0f0c08; border: none; padding: 7px 14px; margin: 3px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 11px; transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.4); }
        button:hover { background: linear-gradient(135deg, var(--accent-gold-bright), #f2a900); transform: translateY(-1px); }
        button.record-btn { background: linear-gradient(135deg, #a62b14, #661505); color: #fff; }
        button.clear-btn { background: linear-gradient(135deg, #592015, #36120b); color: var(--text-main); }
        button.preview-btn { background: linear-gradient(135deg, #205030, #103020); color: #fff; }
        button.ai-btn { background: linear-gradient(135deg, #204080, #102040); color: #fff; }
        button.bank-btn { background: linear-gradient(135deg, #2a4736, #16291e); color: #7cfc00; border: 1px solid #3fae49; }
        button.add-play-btn { background: linear-gradient(135deg, #008b8b, #004848); color: #fff; }
        
        select, input, textarea { background: #221912; color: var(--text-main); border: 1px solid #594028; padding: 6px; border-radius: 6px; margin: 3px; font-size: 11px; outline: none; font-family: inherit; }
        
        .bank-tabs { display: flex; gap: 4px; margin: 6px 0; align-items: center; flex-wrap: wrap; }
        .bank-tab { padding: 5px 12px; background: #221912; border: 1px solid #594028; border-radius: 4px; cursor: pointer; font-size: 10px; color: var(--text-muted); transition: 0.15s; }
        .bank-tab:hover { border-color: var(--accent-gold); }
        .bank-tab.active-bank { background: var(--accent-gold); color: #0f0c08; font-weight: bold; border-color: #ffe066; }

        .grid-18 { display: grid; grid-template-columns: repeat(18, minmax(28px, 1fr)); gap: 3px; margin-top: 6px; overflow-x: auto; padding-bottom: 4px; }
        .step-cell { background: #221912; height: 50px; text-align: center; font-size: 9px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; border-radius: 4px; user-select: none; color: #8c735e; border: 1px solid #38291e; line-height: 1.1; }
        .step-cell.active { background: var(--accent-gold); color: #0f0c08; font-weight: bold; border-color: #ffe066; box-shadow: 0 0 8px rgba(242,169,0,0.6); }
        .step-cell.current-playing { outline: 2px solid #00ffff !important; transform: scale(1.08); background: #3d3010 !important; color: #fff !important; z-index: 5; }
        
        .flex { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .track-toolbar { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 6px; background: rgba(0,0,0,0.3); padding: 6px; border-radius: 6px; }
        .status-bar { font-size: 11px; color: var(--accent-gold); margin-top: 4px; min-height: 16px; font-weight: bold; }
    </style>
</head>
<body>

    <h1>🎛️🎶 ULTIMATE MASTER DAW v37.0 (エレキギター・弾き語りリフ・つけ足し完全統合)</h1>
    <div id="statusMessage" class="status-bar">準備完了 — 画面のどこかをクリックしてAudioContextを有効化してから再生してください</div>

    <!-- エレキギター & 弾き語りリフ特化コントロール -->
    <section class="section" style="border: 2px solid #ff4500; background: linear-gradient(135deg, #1f0f0d, #2a1610);">
        <h2>🎸⚡ エレキギター歪み ＆ 弾き語りリフ生成・つけ足し(Overdub)パレット</h2>
        <div class="flex">
            <span>歪みトーン: 
                <select id="egToneSelect">
                    <option value="clean">クリーン・カッティング</option>
                    <option value="crunch">クランチ・ブルース歪み</option>
                    <option value="lead" selected>ディストーション・リード</option>
                </select>
            </span>
            <button class="ai-btn" style="background: linear-gradient(135deg, #ff4500, #b22222);" onclick="generateAcousticVocalStrumRiff()">🪵 弾き語りコードストラム・リフ作成</button>
            <button class="add-play-btn" onclick="overdubStackStepRandom('electric_guitar', 4)">⚡ ギターリフつけ足し (+4ステップ)</button>
            <button class="add-play-btn" onclick="flashRepeatStaccato('electric_guitar')">🔥 フラッシュ連打(Staccato Repeat)</button>
            <button class="clear-btn" onclick="clearSingleTrack('electric_guitar')">🗑 ギターCRERAクリア</button>
        </div>
    </section>

    <!-- マスター同期トランスポート -->
    <div class="section" style="border: 2px solid var(--accent-gold);">
        <h2>🎛️ 1. マスター再生・全楽器一括AI・バンク拡張管理</h2>
        <div class="flex">
            <button onclick="masterPlay()" style="font-size: 13px; background: linear-gradient(135deg, #00ffcc, #008b8b); color:#000;">▶ 同期トランスポート再生</button>
            <button onclick="masterStop()" style="font-size: 13px;">⏹ 停止</button>
            <button class="bank-btn" onclick="add18BarsBank()">➕ 18小節バンク追加つけ足し</button>
            <button class="ai-btn" style="background: linear-gradient(135deg, #00a86b, #004d40);" onclick="generateAllInstrumentsAi()">🤖 全楽器一括AI作曲</button>
            <span>BPM: <input type="number" id="bpmInput" value="120" min="50" max="240" style="width: 55px;"></span>
        </div>
    </div>

    <!-- 各トラックコンテナ -->
    <div id="tracksContainer"></div>

    <script>
        let audioCtx = null;
        let isPlaying = false;
        let currentStep = 0;
        let playIntervalTimer = null;
        let numBanks = 1;
        let activeBankIdx = 0;

        let songData = {
            numBanks: 1,
            trackData: {},   // boolean[bank][step]
            trackNotes: {},  // number[bank][step]
            trackDur: {},    // number[bank][step] (0:短, 1:中, 2:長)
            trackVib: {}     // number[bank][step] (0:無, 1:軽, 2:豊)
        };

        const instruments = [
            { id: 'electric_guitar', name: '⚡ エレキギター (歪み/クランチ/リード切替)', type: 'melody' },
            { id: 'acoustic_strum', name: '🪵 弾き語りアコースティック・カッティング', type: 'chords' },
            { id: 'drums', name: '🥁 プロ・アコースティックキック＆スネアキット', type: 'drums' },
            { id: 'bass', name: '🎸 ウルトラ重低音サブベース', type: 'bass' },
            { id: 'piano', name: '🎹 ピアノ (上質アコースティック)', type: 'melody' },
            { id: 'violin', name: '🎻 バイオリン (LFOビブラート専用)', type: 'melody' }
        ];

        const solfaNotes = [
            { name: 'ド', freq: 261.63 }, { name: 'レ', freq: 293.66 }, { name: 'ミ', freq: 329.63 }, { name: 'ファ', freq: 349.23 },
            { name: 'ソ', freq: 392.00 }, { name: 'ラ', freq: 440.00 }, { name: 'シ', freq: 493.88 }, { name: '高ド', freq: 523.25 }
        ];

        const durDurations = [0.10, 0.28, 0.55];

        function initAudioContext() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContextClass();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function setStatus(msg) {
            const st = document.getElementById('statusMessage');
            if(st) st.innerText = msg;
        }

        function ensureBankArray(instId, bankIndex) {
            if (!songData.trackData[instId]) {
                songData.trackData[instId] = [];
                songData.trackNotes[instId] = [];
                songData.trackDur[instId] = [];
                songData.trackVib[instId] = [];
            }
            while (songData.trackData[instId].length <= bankIndex) {
                songData.trackData[instId].push(new Array(18).fill(false));
                songData.trackNotes[instId].push(new Array(18).fill(0));
                songData.trackDur[instId].push(new Array(18).fill(1));
                songData.trackVib[instId].push(new Array(18).fill(1));
            }
        }

        // ================= ウェブオーディオ・エレキ／弾き語り実音エンジン =================
        function playRealAudioStep(instId, step, noteIdx, durIdx = 1, vibIdx = 1) {
            initAudioContext();
            const now = audioCtx.currentTime;
            const solfa = solfaNotes[noteIdx % solfaNotes.length] || solfaNotes[0];
            const freq = solfa.freq;
            const durSec = durDurations[durIdx] || 0.28;

            if (instId === 'electric_guitar') {
                const tone = document.getElementById('egToneSelect').value;
                playElectricGuitarNote(freq, durSec, tone);
            } else if (instId === 'acoustic_strum') {
                playAcousticStrumChord(freq, durSec);
            } else if (instId === 'drums') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                if (step % 2 === 0) {
                    osc.frequency.setValueAtTime(140, now);
                    osc.frequency.exponentialRampToValueAtTime(40, now + durSec * 0.8);
                    gain.gain.setValueAtTime(0.5, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + durSec);
                } else {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(220, now);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + durSec);
                }
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + durSec + 0.05);
            } else if (instId === 'violin') {
                playViolinNoteWithVibrato(freq, durSec, vibIdx);
            } else {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + durSec);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + durSec + 0.05);
            }
        }

        function playElectricGuitarNote(freq, duration, tone) {
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const waveshaper = audioCtx.createWaveShaper();
            const gain = audioCtx.createGain();

            // 歪みシェーパー簡易設定
            waveshaper.curve = makeDistortionCurve(tone === 'lead' ? 400 : tone === 'crunch' ? 120 : 15);
            waveshaper.oversample = '4x';

            osc.type = tone === 'clean' ? 'triangle' : 'sawtooth';
            osc.frequency.setValueAtTime(freq, now);

            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(0.22, now + 0.03);
            gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

            osc.connect(waveshaper);
            waveshaper.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + duration + 0.05);
        }

        function makeDistortionCurve(amount) {
            const k = typeof amount === 'number' ? amount : 50;
            const n_samples = 44100;
            const curve = new Float32Array(n_samples);
            const deg = Math.PI / 180;
            for (let i = 0; i < n_samples; ++i) {
                const x = (i * 2) / n_samples - 1;
                curve[i] = ((3 + k) * x * 20 * deg) / (Math.PI + k * Math.abs(x));
            }
            return curve;
        }

        function playAcousticStrumChord(rootFreq, duration) {
            const now = audioCtx.currentTime;
            // 3度と5度を加えたストラムアルペジオ（微差遅延）
            [rootFreq, rootFreq * 1.25, rootFreq * 1.5].forEach((f, idx) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(f, now + idx * 0.03);
                gain.gain.setValueAtTime(0.001, now + idx * 0.03);
                gain.gain.linearRampToValueAtTime(0.12, now + idx * 0.03 + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + idx * 0.03);
                osc.stop(now + duration + 0.05);
            });
        }

        function playViolinNoteWithVibrato(freq, duration, vibIdx) {
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const lfo = audioCtx.createOscillator();
            const lfoGain = audioCtx.createGain();

            const depthMultipliers = [0, 0.4, 0.9];
            const depth = depthMultipliers[vibIdx] || 0.6;

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(freq, now);

            lfo.type = 'sine';
            lfo.frequency.setValueAtTime(6.0, now);
            lfoGain.gain.setValueAtTime(depth * 12, now);

            lfo.connect(lfoGain);
            lfoGain.connect(osc.frequency);

            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(0.18, now + 0.04);
            gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now);
            lfo.start(now);
            osc.stop(now + duration + 0.05);
            lfo.stop(now + duration + 0.05);
        }

        // ================= つけ足し(Overdub)・フラッシュ連打ロジック =================
        function overdubStackStepRandom(instId, interval = 2) {
            ensureBankArray(instId, activeBankIdx);
            const data = songData.trackData[instId][activeBankIdx];
            const notes = songData.trackNotes[instId][activeBankIdx];
            let addedCount = 0;
            for(let i=0; i<18; i+=interval) {
                data[i] = true;
                notes[i] = (notes[i] + Math.floor(Math.random() * 4) + 1) % solfaNotes.length;
                addedCount++;
            }
            renderTracks();
            playSingleTrackWithProps(instId);
            setStatus(`⚡ ${instId} つけ足しスタック合成 (${addedCount}ステップ追加)`);
        }

        function flashRepeatStaccato(instId) {
            ensureBankArray(instId, activeBankIdx);
            const data = songData.trackData[instId][activeBankIdx];
            const notes = songData.trackNotes[instId][activeBankIdx];
            const dur = songData.trackDur[instId][activeBankIdx];
            for(let i=0; i<18; i++) {
                data[i] = true;
                notes[i] = (i * 2) % solfaNotes.length;
                dur[i] = 0; // 短スタッカート連打
            }
            renderTracks();
            playSingleTrackWithProps(instId);
            setStatus(`🔥 ${instId} フラッシュ連打(Staccato Repeat)適用`);
        }

        function generateAcousticVocalStrumRiff() {
            ensureBankArray('acoustic_strum', activeBankIdx);
            const data = songData.trackData['acoustic_strum'][activeBankIdx];
            const notes = songData.trackNotes['acoustic_strum'][activeBankIdx];
            const strumPattern = [0, 1, 3, 5]; // 弾き語り基本裏拍ストラム
            strumPattern.forEach((idx, step) => {
                data[step*4] = true;
                notes[step*4] = idx * 2;
            });
            renderTracks();
            playSingleTrackWithProps('acoustic_strum');
            setStatus('🪵 弾き語りコードストラム・リフ作成完了');
        }

        function generateAllInstrumentsAi() {
            instruments.forEach(inst => {
                ensureBankArray(inst.id, activeBankIdx);
                const data = songData.trackData[inst.id][activeBankIdx];
                const notes = songData.trackNotes[inst.id][activeBankIdx];
                for(let i=0; i<18; i++) {
                    data[i] = (inst.type === 'drums') ? (i % 2 === 0 || i === 7) : (i % 3 !== 2);
                    notes[i] = (i * 2 + activeBankIdx) % solfaNotes.length;
                }
            });
            renderTracks();
            setStatus('🤖 全楽器一括AIメロディ生成完了');
        }

        function generateTrackAi(instId) {
            ensureBankArray(instId, activeBankIdx);
            const data = songData.trackData[instId][activeBankIdx];
            const notes = songData.trackNotes[instId][activeBankIdx];
            for(let i=0; i<18; i++) {
                data[i] = Math.random() > 0.35;
                notes[i] = Math.floor(Math.random() * solfaNotes.length);
            }
            renderTracks();
            setStatus(`🤖 ${instId} 単体AI推測生成`);
        }

        function clearSingleTrack(instId) {
            ensureBankArray(instId, activeBankIdx);
            songData.trackData[instId][activeBankIdx].fill(false);
            renderTracks();
            setStatus(`🗑 ${instId} CRERAクリア`);
        }

        // ================= グリッド描画・状態管理 =================
        function renderTracks() {
            const container = document.getElementById('tracksContainer');
            if(!container) return;
            container.innerHTML = `
                <div class="section">
                    <div class="bank-tabs">
                        <span>バンク選択:</span>
                        ${Array.from({length: numBanks}, (_, idx) => 
                            `<div class="bank-tab ${idx === activeBankIdx ? 'active-bank' : ''}" onclick="selectBank(${idx})">バンク ${idx+1}</div>`
                        ).join('')}
                    </div>
                </div>
            `;
            const durLabels = ['短', '中', '長'];
            const vibLabels = ['無', '軽', '豊'];

            instruments.forEach(inst => {
                ensureBankArray(inst.id, activeBankIdx);
                const div = document.createElement('div');
                div.className = 'section';
                
                let cellsHtml = '';
                for(let s=0; s<18; s++) {
                    const isActive = songData.trackData[inst.id][activeBankIdx][s];
                    const noteIdx = songData.trackNotes[inst.id][activeBankIdx][s];
                    const noteName = solfaNotes[noteIdx % solfaNotes.length]?.name || '';
                    const dur = songData.trackDur[inst.id][activeBankIdx][s];
                    const vib = songData.trackVib[inst.id][activeBankIdx][s];
                    cellsHtml += `
                        <div class="step-cell ${isActive ? 'active' : ''}" id="cell-${inst.id}-${activeBankIdx}-${s}" onclick="toggleStep('${inst.id}', ${activeBankIdx}, ${s})">
                            ${s+1}<br><span style="font-size:8px;">${isActive ? noteName : '·'}</span><br>
                            <span style="font-size:7px; opacity:0.8;">${isActive ? durLabels[dur]+vibLabels[vib] : ''}</span>
                        </div>`;
                }

                div.innerHTML = `
                    <h3>${inst.name}</h3>
                    <div class="track-toolbar">
                        <button class="ai-btn" onclick="generateTrackAi('${inst.id}')">🤖 AI作曲</button>
                        <button class="add-play-btn" onclick="overdubStackStepRandom('${inst.id}', 2)">➕ つけ足しスタック</button>
                        <button class="preview-btn" onclick="playSingleTrackWithProps('${inst.id}')">▶ トラック試聴</button>
                        <button class="clear-btn" onclick="clearSingleTrack('${inst.id}')">🗑 クリア</button>
                    </div>
                    <div class="grid-18">${cellsHtml}</div>
                `;
                container.appendChild(div);
            });
        }

        function toggleStep(instId, bankIdx, step) {
            ensureBankArray(instId, bankIdx);
            const current = songData.trackData[instId][bankIdx][step];
            songData.trackData[instId][bankIdx][step] = !current;
            if (!current) {
                playRealAudioStep(instId, step, songData.trackNotes[instId][bankIdx][step], songData.trackDur[instId][bankIdx][step], songData.trackVib[instId][bankIdx][step]);
            }
            renderTracks();
        }

        function selectBank(idx) {
            activeBankIdx = idx;
            renderTracks();
            setStatus(`📁 バンク ${idx+1} 切り替え`);
        }

        function add18BarsBank() {
            numBanks++;
            songData.numBanks = numBanks;
            activeBankIdx = numBanks - 1;
            instruments.forEach(inst => ensureBankArray(inst.id, activeBankIdx));
            renderTracks();
            setStatus(`➕ 18小節バンク追加 (計 ${numBanks} バンク)`);
        }

        function playSingleTrackWithProps(instId) {
            initAudioContext();
            for(let s=0; s<18; s++) {
                if(songData.trackData[instId][activeBankIdx][s]) {
                    const delay = s * 130;
                    setTimeout(() => {
                        playRealAudioStep(instId, s, songData.trackNotes[instId][activeBankIdx][s], songData.trackDur[instId][activeBankIdx][s], songData.trackVib[instId][activeBankIdx][s]);
                    }, delay);
                }
            }
            setStatus(`▶ ${instId} トラック試聴中...`);
        }

        // ================= マスター同期再生ループ =================
        function masterPlay() {
            initAudioContext();
            if (isPlaying) return;
            isPlaying = true;
            currentStep = 0;
            const bpm = parseInt(document.getElementById('bpmInput').value) || 120;
            const stepDurationMs = (60 / bpm / 4) * 1000;

            playIntervalTimer = setInterval(() => {
                document.querySelectorAll('.step-cell').forEach(el => el.classList.remove('current-playing'));

                instruments.forEach(inst => {
                    ensureBankArray(inst.id, activeBankIdx);
                    if (songData.trackData[inst.id][activeBankIdx][currentStep]) {
                        playRealAudioStep(
                            inst.id,
                            currentStep,
                            songData.trackNotes[inst.id][activeBankIdx][currentStep],
                            songData.trackDur[inst.id][activeBankIdx][currentStep],
                            songData.trackVib[inst.id][activeBankIdx][currentStep]
                        );
                        const cellEl = document.getElementById(`cell-${inst.id}-${activeBankIdx}-${currentStep}`);
                        if(cellEl) cellEl.classList.add('current-playing');
                    }
                });

                currentStep = (currentStep + 1) % 18;
            }, stepDurationMs);

            setStatus(`▶ 同期トランスポート再生中 (BPM: ${bpm})`);
        }

        function masterStop() {
            isPlaying = false;
            if (playIntervalTimer) clearInterval(playIntervalTimer);
            document.querySelectorAll('.step-cell').forEach(el => el.classList.remove('current-playing'));
            setStatus('⏹ マスター再生停止');
        }

        function initApp() {
            instruments.forEach(inst => ensureBankArray(inst.id, 0));
            renderTracks();
            setStatus('🟢 ULTIMATE MASTER DAW v37.0 初期化完了・リアル発音準備OK');
        }

        window.onload = initApp;
    </script>
