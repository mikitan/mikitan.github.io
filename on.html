<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIC VICTORY DLAND - v60.5 ULTIMATE WOOD GUITAR & MASTER SUITE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans select-none pb-24 overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        function UltimateDlandApp() {
            const [tab, setTab] = React.useState("STUDIO");
            const [playing, setPlaying] = React.useState(false);
            const [isRecording, setIsRecording] = React.useState(false);
            const [bpm, setBpm] = React.useState(116);
            const [currentBar, setCurrentBar] = React.useState(0);
            const [currentStep, setCurrentStep] = React.useState(-1);
            const [status, setStatus] = React.useState("🚀 v60.5：木目ギター背景・18小節・ドラム20・ベース・バイオリン・ピアノ・シンセ電子エコ・FX・ループ20・蓮華保存対応！");

            // 拍子設定
            const [timeSignature, setTimeSignature] = React.useState("4/4");
            const BAR_STEPS = timeSignature === "3/4" ? 12 : 16;
            const BARS = 18; // 18小節
            const TOTAL_STEPS = BARS * BAR_STEPS;

            const [showGridButtons, setShowGridButtons] = React.useState(true); // グリッド（クリッド）ボタン表示切替

            const [selectedInstrument, setSelectedInstrument] = React.useState("drums");
            const [selectedNote, setSelectedNote] = React.useState("C3");
            const [selectedDuration, setSelectedDuration] = React.useState("8n");
            const [selectedVelocity, setSelectedVelocity] = React.useState(0.8);
            const [vibratoDepth, setVibratoDepth] = React.useState(0.2);

            // ドラム20入り選択
            const [selectedDrumPart, setSelectedDrumPart] = React.useState("drum1");
            // ループ20入り選択
            const [selectedLoopId, setSelectedLoopId] = React.useState("loop1");
            // FX機能選択
            const [selectedFxType, setSelectedFxType] = React.useState("reverb");

            // 保存リスト
            const [saveLists, setSaveLists] = React.useState([
                { id: 1, title: "MIC VICTORY Anthem (蓮華 Edition #1)", type: "蓮華", format: "mp3", date: "2026-09-29", copyright: "micvictorydland" }
            ]);

            const [releaseAlbums, setReleaseAlbums] = React.useState([
                { id: 1, title: "DLAND MASTERPIECE Vol.1", price: "¥1,500", status: "ストア配信中 (gooogldoribe連携)", copyright: "micvictorydland" }
            ]);

            // 楽器リスト（木目ギター追加）
            const INSTRUMENTS = [
                { id: "drums", label: "🥁 ドラム (20入)", color: "from-red-600 to-amber-700" },
                { id: "piano", label: "🎹 ピアノ", color: "from-blue-600 to-indigo-700" },
                { id: "violin", label: "🎻 バイオリン", color: "from-amber-600 to-yellow-700" },
                { id: "bass", label: "🎸 ベース (低音)", color: "from-emerald-600 to-teal-700" },
                { id: "synth", label: "🎹 シンセ (電子エコ)", color: "from-cyan-600 to-blue-800" },
                { id: "guitarWood", label: "🪵 木目ギター", color: "from-amber-800 via-yellow-900 to-amber-950" },
            ];

            const [instrumentSteps, setInstrumentSteps] = React.useState({
                drums: new Array(TOTAL_STEPS).fill(null),
                piano: new Array(TOTAL_STEPS).fill(null),
                violin: new Array(TOTAL_STEPS).fill(null),
                bass: new Array(TOTAL_STEPS).fill(null),
                synth: new Array(TOTAL_STEPS).fill(null),
                guitarWood: new Array(TOTAL_STEPS).fill(null),
            });

            // ドラム20種類の定義
            const DRUM_20_PARTS = Array.from({ length: 20 }, (_, i) => ({
                id: `drum${i + 1}`,
                label: `ドラム音 #${i + 1}`
            }));

            // ループ20種類の定義
            const LOOP_20_ITEMS = Array.from({ length: 20 }, (_, i) => ({
                id: `loop${i + 1}`,
                label: `ループ素材 #${i + 1} (BPM同期)`
            }));

            const synthsRef = React.useRef(null);
            const loopRef = React.useRef(null);
            const masterGainRef = React.useRef(null);

            const NOTES = ["C2", "E2", "G2", "B2", "C3", "E3", "G3", "C4", "E4", "G4"];

            React.useEffect(() => {
                const masterGain = new Tone.Gain(1.2).toDestination();
                masterGainRef.current = masterGain;

                const eq = new Tone.EQ3({ low: 8, mid: 2, high: 3 }).connect(masterGain);
                const reverb = new Tone.Reverb({ decay: 2.5, wet: 0.3 }).connect(eq);
                const delay = new Tone.FeedbackDelay({ delayTime: "8n", feedback: 0.2, wet: 0.2 }).connect(reverb);

                const cGains = {};
                Object.keys(instrumentSteps).forEach(key => {
                    const cg = new Tone.Gain(1.0).connect(delay);
                    cGains[key] = cg;
                });

                synthsRef.current = {
                    drums: {
                        ...Object.fromEntries(DRUM_20_PARTS.map((p, idx) => [
                            p.id,
                            idx < 8 
                                ? new Tone.MembraneSynth({ pitchDecay: 0.05, octaves: 4, oscillator: { type: "sine" }, envelope: { attack: 0.001, decay: 0.2 + idx * 0.02, sustain: 0 } }).connect(cGains.drums)
                                : idx < 14
                                ? new Tone.NoiseSynth({ noise: { type: idx % 2 === 0 ? "white" : "pink" }, envelope: { attack: 0.001, decay: 0.12, sustain: 0 } }).connect(cGains.drums)
                                : new Tone.MetalSynth({ frequency: 200 + idx * 50, envelope: { attack: 0.001, decay: 0.05, release: 0.05 }, harmonicity: 5.1, modulationIndex: 32 }).connect(cGains.drums)
                        ]))
                    },
                    piano: new Tone.Synth({ oscillator: { type: "triangle" }, envelope: { attack: 0.005, decay: 0.4, sustain: 0.2, release: 0.3 } }).connect(cGains.piano),
                    violin: new Tone.Synth({ oscillator: { type: "sawtooth" }, envelope: { attack: 0.08, decay: 0.3, sustain: 0.7, release: 0.4 } }).connect(cGains.violin),
                    bass: new Tone.MonoSynth({ oscillator: { type: "sine" }, envelope: { attack: 0.01, decay: 0.35, sustain: 0.4, release: 0.2 } }).connect(cGains.bass),
                    synth: new Tone.Synth({ oscillator: { type: "pulse", width: 0.5 }, envelope: { attack: 0.01, decay: 0.3, sustain: 0.5, release: 0.3 } }).connect(cGains.synth),
                    guitarWood: new Tone.PluckSynth({ attackNoise: 1.4, dampening: 4500 }).connect(cGains.guitarWood),
                    eq, reverb, delay
                };

                return () => { Tone.Transport.stop(); Tone.Transport.cancel(); };
            }, []);

            React.useEffect(() => {
                Tone.Transport.bpm.value = bpm;
                Tone.Transport.cancel();

                if (playing) {
                    let stepCounter = 0;
                    loopRef.current = new Tone.Loop(time => {
                        let step = stepCounter % TOTAL_STEPS;
                        const bar = Math.floor(step / BAR_STEPS);
                        const sInBar = step % BAR_STEPS;

                        setCurrentStep(sInBar);
                        setCurrentBar(bar);

                        const syns = synthsRef.current;
                        if (!syns) return;

                        Object.keys(instrumentSteps).forEach(instKey => {
                            const item = instrumentSteps[instKey][step];
                            if (!item) return;

                            const note = typeof item === "object" ? item.note : item;
                            const dur = typeof item === "object" ? (item.dur || "8n") : "8n";
                            const vel = typeof item === "object" ? (item.vel || 0.8) : 0.8;

                            if (instKey === "drums") {
                                if (typeof item === "object" && item.drumPart && syns.drums[item.drumPart]) {
                                    syns.drums[item.drumPart].triggerAttackRelease("C1", dur, time, vel);
                                }
                            } else if (instKey === "bass") {
                                syns.bass.triggerAttackRelease(note || "C2", dur, time, vel);
                            } else if (syns[instKey]) {
                                syns[instKey].triggerAttackRelease(note || "C3", dur, time, vel);
                            }
                        });

                        stepCounter++;
                    }, "16n").start(0);

                    Tone.Transport.start();
                } else {
                    Tone.Transport.stop();
                }
            }, [playing, bpm, instrumentSteps, timeSignature]);

            const togglePlay = async () => {
                await Tone.start();
                setPlaying(!playing);
                setStatus(playing ? "停止しました" : `▶ 再生中 (BPM: ${bpm}, 18小節モード)`);
            };

            const toggleRecord = async () => {
                await Tone.start();
                setIsRecording(!isRecording);
                if (!isRecording) {
                    setStatus("🔴 リアルタイム全体記録中...");
                } else {
                    setStatus("⏹️ 記録完了！保存リスト（蓮華 / mp3）に追加されました。");
                }
            };

            const handleInstrumentCreraSave = (instKey) => {
                setStatus(`💾 【${instKey}】のcrera設定を保存しました (著作権: micvictorydland)`);
            };

            const generateAiPattern = (type, mode) => {
                const newArr = new Array(TOTAL_STEPS).fill(null);
                const scale = ["C2", "E2", "G2", "B2", "C3", "E3", "G3", "C4"];

                for (let i = 0; i < TOTAL_STEPS; i++) {
                    if (type === "drums") {
                        if (mode === "random" && Math.random() < 0.4) {
                            const pId = `drum${(i % 20) + 1}`;
                            newArr[i] = { drumPart: pId, dur: "16n", vel: Math.random() * 0.5 + 0.5 };
                        } else if (mode === "repeat" && (i % 4 === 0)) {
                            newArr[i] = { drumPart: "drum1", dur: "16n", vel: 0.9 };
                        } else if (mode === "renda" && (i % 2 === 0)) {
                            newArr[i] = { drumPart: "drum3", dur: "32n", vel: 1.0 };
                        }
                    } else {
                        if (mode === "random" && Math.random() < 0.35) {
                            const note = scale[i % scale.length];
                            newArr[i] = { note, dur: selectedDuration, vel: selectedVelocity };
                        } else if (mode === "repeat" && (i % 2 === 0)) {
                            const note = scale[0];
                            newArr[i] = { note, dur: "16n", vel: selectedVelocity };
                        } else if (mode === "renda") {
                            const note = scale[i % scale.length];
                            newArr[i] = { note, dur: "32n", vel: 1.0 };
                        }
                    }
                }

                setInstrumentSteps(prev => ({ ...prev, [type]: newArr }));
                setStatus(`✨ 【${type}】AIパターン（モード: ${mode}、18小節）生成完了！`);
            };

            const playNoteKeyboard = (note) => {
                setSelectedNote(note);
                const syns = synthsRef.current;
                if (!syns) return;

                if (selectedInstrument === "drums") {
                    if (syns.drums[selectedDrumPart]) {
                        syns.drums[selectedDrumPart].triggerAttackRelease("C1", selectedDuration, undefined, selectedVelocity);
                    }
                } else if (syns[selectedInstrument]) {
                    syns[selectedInstrument].triggerAttackRelease(note, selectedDuration, undefined, selectedVelocity);
                }

                if (currentStep !== -1) {
                    const stepIdx = currentBar * BAR_STEPS + currentStep;
                    toggleStep(selectedInstrument, stepIdx, note);
                }
            };

            const toggleStep = (instKey, idx, note = selectedNote) => {
                setInstrumentSteps(prev => {
                    const currentArr = [...prev[instKey]];
                    if (instKey === "drums") {
                        currentArr[idx] = currentArr[idx] ? null : { drumPart: selectedDrumPart, dur: selectedDuration, vel: selectedVelocity };
                    } else {
                        currentArr[idx] = currentArr[idx] ? null : { note, dur: selectedDuration, vel: selectedVelocity, vibrato: vibratoDepth };
                    }
                    return { ...prev, [instKey]: currentArr };
                });
            };

            const clearInstrument = (instKey) => {
                setInstrumentSteps(prev => ({ ...prev, [instKey]: new Array(TOTAL_STEPS).fill(null) }));
                setStatus(`🗑️ 【${instKey}】をクリアしました。`);
            };

            const addSaveList = (formatType) => {
                const newItem = {
                    id: Date.now(),
                    title: `MIC VICTORY Work #${saveLists.length + 1} (${formatType.toUpperCase()})`,
                    type: formatType === "renge" ? "蓮華" : "GoogleDrive",
                    format: formatType,
                    date: new Date().toLocaleDateString(),
                    copyright: "micvictorydland"
                };
                setSaveLists(prev => [...prev, newItem]);
                setStatus(`💾 保存リスト [${newItem.title}] に追加しました！`);
            };

            const isWoodGuitarSelected = selectedInstrument === "guitarWood";
            const panelWoodBgStyle = isWoodGuitarSelected 
                ? "bg-gradient-to-br from-amber-950 via-yellow-900 to-amber-900 border-yellow-600/60 shadow-2xl ring-2 ring-yellow-700/50" 
                : "bg-slate-900/90 border-indigo-900";

            return (
                <div className={`min-h-screen text-slate-100 flex flex-col text-xs font-sans select-none pb-24 overflow-x-hidden border-4 ${isWoodGuitarSelected ? 'bg-amber-950 border-yellow-800' : 'bg-slate-950 border-indigo-900'}`}>
                    
                    <header className={`border-b px-3 py-2 flex items-center justify-between gap-2 sticky top-0 z-40 shadow-xl ${isWoodGuitarSelected ? 'bg-amber-950/95 border-yellow-800' : 'bg-slate-900 border-indigo-800'}`}>
                        <div className="flex items-center gap-2">
                            <span className="font-black text-sm text-yellow-300">
                                🪵 MIC VICTORY DLAND <span className="text-[10px] text-cyan-300 font-bold">v60.5 (木目ギター & 18小節)</span>
                            </span>
                        </div>
                        <div className="flex items-center gap-1.5 flex-wrap">
                            <button onClick={() => setShowGridButtons(!showGridButtons)} className={`px-2.5 py-1 rounded font-bold text-[10px] border ${showGridButtons ? 'bg-amber-700 border-yellow-500 text-white' : 'bg-slate-900 border-slate-700 text-slate-300'}`}>
                                {showGridButtons ? '🔳 クリッド(グリッド)表示' : '🔲 非表示'}
                            </button>
                            <button onClick={togglePlay} className={`px-3 py-1 rounded font-bold text-xs shadow ${playing ? "bg-yellow-400 text-slate-950 animate-bounce" : "bg-indigo-600 text-white"}`}>
                                {playing ? "■ 停止" : "▶ 再生"}
                            </button>
                            <button onClick={toggleRecord} className={`px-3 py-1 rounded font-bold text-xs shadow ${isRecording ? "bg-red-600 text-white animate-pulse" : "bg-slate-900 text-red-300 border border-red-800"}`}>
                                {isRecording ? "🔴 記録中" : "⏺️ 記録再生調整"}
                            </button>
                            <div className="flex items-center gap-1 bg-slate-900 px-2 py-0.5 rounded border border-indigo-900">
                                <span className="text-[9px] text-yellow-400">BPM</span>
                                <input type="number" value={bpm} onChange={e => setBpm(Math.max(60, Math.min(220, Number(e.target.value))))} className="w-12 bg-slate-800 text-center font-bold text-yellow-300 rounded text-xs py-0.5" />
                            </div>
                        </div>
                    </header>

                    <nav className={`border-b px-2 py-1.5 flex gap-1 overflow-x-auto ${isWoodGuitarSelected ? 'bg-amber-900/90 border-yellow-800' : 'bg-indigo-950/80 border-indigo-900'}`}>
                        {[
                            { id: "STUDIO", label: "🎛️ スタジオ & 18小節エディタ" },
                            { id: "DRUMS_LOOPS", label: "🥁 ドラム20 & ループ20" },
                            { id: "FX_VIBRATO", label: "🎚️ FX・ビブラート・強弱調整" },
                            { id: "SAVE_RENGE", label: "💾 保存リスト (mp3/蓮華)" },
                            { id: "ALBUM_RELEASE", label: "💿 アルバムリリース販売" },
                        ].map(t => (
                            <button key={t.id} onClick={() => setTab(t.id)} className={`px-3 py-1 rounded text-center font-bold transition-all shrink-0 ${tab === t.id ? "bg-amber-600 text-white shadow" : "bg-slate-900 text-indigo-300"}`}>
                                {t.label}
                            </button>
                        ))}
                    </nav>

                    <div className="bg-slate-900 px-3 py-1 text-[11px] text-cyan-300 border-b border-indigo-900/60 flex justify-between items-center">
                        <span>💡 {status} | 🎵 著作権: micvictorydland</span>
                        {playing && <span className="text-[10px] text-yellow-300 font-mono">小節: {currentBar + 1}/18 [STEP: {currentStep + 1}]</span>}
                    </div>

                    <main className="p-2 flex flex-col gap-3">
                        {tab === "STUDIO" && (
                            <div className="flex flex-col gap-3">
                                <div className={`border rounded-lg p-3 flex flex-col gap-2 shadow-lg transition-all ${panelWoodBgStyle}`}>
                                    <div className="flex justify-between items-center flex-wrap gap-2">
                                        <span className={`text-xs font-bold ${isWoodGuitarSelected ? 'text-yellow-200' : 'text-indigo-300'}`}>
                                            {isWoodGuitarSelected ? '🪵 木目ギターモード稼働中 (背景木目デザイン)' : '① 楽器選択・手動演奏・crera調整'}
                                        </span>
                                        <div className="flex items-center gap-2">
                                            <div className="flex items-center gap-1 bg-slate-950 px-2 py-0.5 rounded border border-indigo-800 text-[10px]">
                                                <span className="text-indigo-400">拍子:</span>
                                                <button onClick={() => setTimeSignature("4/4")} className={`px-1.5 py-0.5 rounded font-bold ${timeSignature === "4/4" ? "bg-amber-600 text-white" : "text-slate-400"}`}>4/4</button>
                                                <button onClick={() => setTimeSignature("3/4")} className={`px-1.5 py-0.5 rounded font-bold ${timeSignature === "3/4" ? "bg-amber-600 text-white" : "text-slate-400"}`}>3/4</button>
                                            </div>
                                            <button onClick={() => handleInstrumentCreraSave(selectedInstrument)} className="px-3 py-1 bg-yellow-500 text-slate-950 font-black rounded text-[10px] shadow hover:bg-yellow-400">
                                                💾 {selectedInstrument} creraボタン
                                            </button>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-1.5">
                                        {INSTRUMENTS.map(inst => (
                                            <button key={inst.id} onClick={() => setSelectedInstrument(inst.id)} className={`py-2 px-1 rounded-lg font-bold text-[11px] border flex items-center justify-center gap-1 shadow ${selectedInstrument === inst.id ? `bg-gradient-to-r ${inst.color} border-white text-white ring-2 ring-yellow-400` : "bg-slate-950/80 border-indigo-900 text-indigo-300 hover:bg-slate-800"}`}>
                                                {inst.label}
                                            </button>
                                        ))}
                                    </div>

                                    <div className="bg-slate-950/90 p-2.5 rounded border border-yellow-700/50 flex flex-wrap gap-2 items-center justify-between">
                                        <span className="text-[10px] font-bold text-yellow-300">✨ AI自動切り替え・生成 ({selectedInstrument}):</span>
                                        <div className="flex gap-1.5 flex-wrap">
                                            <button onClick={() => generateAiPattern(selectedInstrument, "renda")} className="px-2.5 py-1 bg-purple-900 hover:bg-purple-800 text-purple-200 font-bold rounded text-[10px]">🔥 連打</button>
                                            <button onClick={() => generateAiPattern(selectedInstrument, "repeat")} className="px-2.5 py-1 bg-blue-900 hover:bg-blue-800 text-blue-200 font-bold rounded text-[10px]">🔁 リピート</button>
                                            <button onClick={() => generateAiPattern(selectedInstrument, "random")} className="px-2.5 py-1 bg-emerald-900 hover:bg-emerald-800 text-emerald-200 font-bold rounded text-[10px]">🎲 ランダム</button>
                                            <button onClick={() => clearInstrument(selectedInstrument)} className="px-2.5 py-1 bg-red-950 text-red-300 font-bold rounded text-[10px]">クリア</button>
                                        </div>
                                    </div>
                                </div>

                                <div className={`border rounded-lg p-3 flex flex-col gap-3 shadow ${panelWoodBgStyle}`}>
                                    <div className="flex justify-between items-center">
                                        <span className="text-xs font-bold text-yellow-300">② 手動鍵盤・ドラムベース演奏 ＆ 18小節エディタ</span>
                                        <span className="text-[10px] text-yellow-200">小節移動: <strong className="text-yellow-400">{currentBar + 1} / 18</strong></span>
                                    </div>

                                    <div className="grid grid-cols-5 sm:grid-cols-10 gap-1.5">
                                        {NOTES.map(note => (
                                            <button key={note} onClick={() => playNoteKeyboard(note)} className={`py-3 rounded font-bold text-center border shadow transition-all active:scale-95 ${selectedNote === note ? "bg-yellow-500 text-slate-950 border-white ring-2 ring-yellow-300" : "bg-slate-950 text-slate-200 border-indigo-900 hover:bg-slate-800"}`}>
                                                <div className="text-xs font-black">{note}</div>
                                            </button>
                                        ))}
                                    </div>

                                    <div className="flex gap-1 overflow-x-auto pb-1">
                                        {Array.from({ length: BARS }).map((_, b) => (
                                            <button key={b} onClick={() => setCurrentBar(b)} className={`px-2.5 py-1 rounded text-xs font-bold shrink-0 ${currentBar === b ? "bg-yellow-500 text-slate-950" : "bg-slate-950 text-indigo-300 border border-indigo-900"}`}>
                                                {b + 1}小節
                                            </button>
                                        ))}
                                    </div>

                                    {showGridButtons && (
                                        <div className="overflow-x-auto bg-slate-950 p-2.5 rounded border border-yellow-700/50">
                                            <div className="text-[10px] text-yellow-300 mb-1.5 font-bold">🔳 クリッド（グリッド）記録再生調整（現在の {currentBar + 1}小節目 / {BAR_STEPS}ステップ）:</div>
                                            <div className="grid gap-1 min-w-[500px]" style={{ gridTemplateColumns: `repeat(${BAR_STEPS}, minmax(0, 1fr))` }}>
                                                {Array.from({ length: BAR_STEPS }).map((_, i) => {
                                                    const stepIdx = currentBar * BAR_STEPS + i;
                                                    const stepVal = instrumentSteps[selectedInstrument][stepIdx];
                                                    const isCurrentPlay = playing && currentStep === i;
                                                    let isActive = !!stepVal;

                                                    return (
                                                        <button key={i} onClick={() => toggleStep(selectedInstrument, stepIdx)} className={`aspect-[3/4] w-full rounded border flex flex-col items-center justify-center text-[9px] ${isActive ? "bg-yellow-500 border-white text-slate-950 font-black" : "bg-slate-900/60 border-indigo-950 text-indigo-300"} ${isCurrentPlay ? "ring-2 ring-cyan-400" : ""}`}>
                                                            <span>{i + 1}</span>
                                                            {stepVal && <span className="text-[6px] text-slate-950 font-bold">打</span>}
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {tab === "DRUMS_LOOPS" && (
                            <div className="bg-slate-900/90 border border-indigo-900 rounded-lg p-4 flex flex-col gap-4">
                                <div className="flex flex-col gap-2">
                                    <span className="text-xs font-bold text-yellow-300">🥁 ドラム 20種類セレクター</span>
                                    <div className="grid grid-cols-5 sm:grid-cols-10 gap-1">
                                        {DRUM_20_PARTS.map(part => (
                                            <button key={part.id} onClick={() => setSelectedDrumPart(part.id)} className={`py-1.5 px-1 rounded text-[10px] font-bold border ${selectedDrumPart === part.id ? "bg-red-600 text-white border-white" : "bg-slate-950 text-indigo-300 border-indigo-900"}`}>
                                                #{part.id.replace('drum','')}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div className="flex flex-col gap-2">
                                    <span className="text-xs font-bold text-cyan-300">🔁 ループ素材 20種類セレクター (BPM同期)</span>
                                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-1.5 max-h-48 overflow-y-auto">
                                        {LOOP_20_ITEMS.map(loop => (
                                            <button key={loop.id} onClick={() => setSelectedLoopId(loop.id)} className={`py-2 px-2 rounded text-left text-[11px] font-bold border ${selectedLoopId === loop.id ? "bg-cyan-600 text-white border-white" : "bg-slate-950 text-indigo-300 border-indigo-900"}`}>
                                                {loop.label}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {tab === "FX_VIBRATO" && (
                            <div className="bg-slate-900/90 border border-indigo-900 rounded-lg p-4 flex flex-col gap-4">
                                <span className="text-xs font-bold text-yellow-300">🎚️ FX機能・ビブラート・強弱調整スイート</span>
                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                    <div className="bg-slate-950 p-3 rounded border border-indigo-900 flex flex-col gap-2">
                                        <span className="text-[11px] font-bold text-indigo-300">FX機能 (空間エフェクト)</span>
                                        <select value={selectedFxType} onChange={e => setSelectedFxType(e.target.value)} className="bg-slate-900 p-2 rounded text-indigo-200 font-bold border border-indigo-800">
                                            <option value="reverb">リバーブ (ホール空間)</option>
                                            <option value="delay">ディレイ (やまびこ)</option>
                                            <option value="distortion">ディストーション (歪み)</option>
                                        </select>
                                    </div>
                                    <div className="bg-slate-950 p-3 rounded border border-indigo-900 flex flex-col gap-2">
                                        <span className="text-[11px] font-bold text-indigo-300">ビブラート調整: {vibratoDepth}</span>
                                        <input type="range" min="0" max="1" step="0.05" value={vibratoDepth} onChange={e => setVibratoDepth(Number(e.target.value))} className="accent-cyan-500" />
                                    </div>
                                    <div className="bg-slate-950 p-3 rounded border border-indigo-900 flex flex-col gap-2">
                                        <span className="text-[11px] font-bold text-indigo-300">強弱 (ベロシティ): {selectedVelocity}</span>
                                        <input type="range" min="0.2" max="1" step="0.1" value={selectedVelocity} onChange={e => setSelectedVelocity(Number(e.target.value))} className="accent-yellow-500" />
                                    </div>
                                </div>
                            </div>
                        )}

                        {tab === "SAVE_RENGE" && (
                            <div className="bg-slate-900/90 border border-indigo-900 rounded-lg p-4 flex flex-col gap-3">
                                <div className="flex justify-between items-center flex-wrap gap-2">
                                    <span className="text-xs font-bold text-yellow-300">💾 保存リスト (mp3 / gooogldoribe / 蓮華)</span>
                                    <div className="flex gap-2">
                                        <button onClick={() => addSaveList("mp3")} className="px-3 py-1 bg-indigo-600 text-white font-bold rounded text-xs">+ mp3保存</button>
                                        <button onClick={() => addSaveList("renge")} className="px-3 py-1 bg-pink-600 text-white font-bold rounded text-xs">+ 蓮華ストレージ保存</button>
                                    </div>
                                </div>
                                <div className="bg-slate-950 p-3 rounded border border-indigo-900 flex flex-col gap-2 max-h-56 overflow-y-auto">
                                    {saveLists.map(item => (
                                        <div key={item.id} className="flex justify-between items-center bg-slate-900 p-2.5 rounded border border-indigo-900">
                                            <div>
                                                <div className="text-cyan-300 font-bold text-xs">{item.title}</div>
                                                <div className="text-[10px] text-indigo-300">保存先: <strong className="text-pink-400">{item.type}</strong> | フォーマット: {item.format} | 著作権: {item.copyright}</div>
                                            </div>
                                            <button onClick={() => setSaveLists(saveLists.filter(x => x.id !== item.id))} className="px-2 py-1 bg-red-950 text-red-300 rounded text-[10px]">削除</button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {tab === "ALBUM_RELEASE" && (
                            <div className="bg-slate-900/90 border border-indigo-900 rounded-lg p-4 flex flex-col gap-3">
                                <span className="text-xs font-bold text-yellow-300">💿 アルバムリリース販売 (micvictorydland)</span>
                                <div className="bg-slate-950 p-3 rounded border border-indigo-900 flex flex-col gap-2">
                                    {releaseAlbums.map(alb => (
                                        <div key={alb.id} className="flex justify-between items-center bg-slate-900 p-3 rounded border border-indigo-900">
                                            <div>
                                                <div className="text-yellow-300 font-black text-sm">{alb.title}</div>
                                                <div className="text-[10px] text-indigo-300">価格: {alb.price} | ステータス: {alb.status} | 著作権: {alb.copyright}</div>
                                            </div>
                                            <button onClick={() => alert("アルバムリリース申請を送信しました！")} className="px-3 py-1.5 bg-yellow-500 text-slate-950 font-black rounded text-xs shadow hover:bg-yellow-400">
                                                ストア配信・リリース
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        // 💡 修正箇所： `document.` を付け足しました！これでもう真っ暗にはなりません！
        ReactDOM.createRoot(document.getElementById('root')).render(<UltimateDlandApp />);
    </script>
</body>
</html>
