<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Masterpiece DAW - Multi-Mode & Massive AI Edition</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #0b0907; color: #f5f0e6; margin: 0; padding: 20px; }
        h1, h2, h3 { color: #f2a900; border-bottom: 1px solid #3d2c1e; padding-bottom: 8px; margin: 10px 0; letter-spacing: 1px; }
        .section { background: #1a1410; padding: 15px 20px; margin-bottom: 15px; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.8); border: 1px solid #4a3520; }
        button { background: linear-gradient(135deg, #f2a900, #c67d00); color: #0f0c08; border: none; padding: 7px 14px; margin: 3px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 11px; transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.4); }
        button:hover { background: linear-gradient(135deg, #ffc233, #f2a900); transform: translateY(-1px); }
        button.clear-btn { background: linear-gradient(135deg, #a62b14, #661505); color: #fff; }
        button.clear-btn:hover { background: linear-gradient(135deg, #c7351a, #881c07); }
        select, input, textarea { background: #261d15; color: #f5f0e6; border: 1px solid #594028; padding: 6px; border-radius: 6px; margin: 3px; font-size: 11px; outline: none; font-family: inherit; }
        .grid-18 { display: grid; grid-template-columns: repeat(18, 1fr); gap: 4px; margin-top: 8px; overflow-x: auto; }
        .step-cell { background: #261d15; height: 30px; text-align: center; font-size: 11px; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 4px; user-select: none; color: #8c735e; border: 1px solid #38291e; transition: 0.1s; }
        .step-cell.active { background: #f2a900; color: #0f0c08; font-weight: bold; border-color: #ffe066; box-shadow: 0 0 10px rgba(242,169,0,0.6); }
        .step-cell.current-playing { border: 2px solid #fff !important; transform: scale(1.05); }
        .flex { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .summary-box { background: #120e0b; padding: 12px; border-radius: 8px; font-size: 12px; margin-top: 10px; color: #b89b82; border: 1px solid #332418; max-height: 150px; overflow-y: auto; }
        
        .keyboard-container { display: flex; gap: 3px; margin-top: 10px; overflow-x: auto; padding: 8px; background: #120e0b; border-radius: 6px; border: 1px solid #332418; }
        .piano-key { width: 38px; height: 65px; background: #eaeaf0; color: #111; border: 1px solid #444; display: flex; align-items: flex-end; justify-content: center; font-size: 10px; font-weight: bold; cursor: pointer; border-radius: 0 0 4px 4px; user-select: none; }
        .piano-key:active, .piano-key.playing { background: #f2a900 !important; color: #0f0c08 !important; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal-content { background: #1a1410; padding: 25px; border-radius: 16px; width: 90%; max-width: 650px; box-shadow: 0 12px 40px rgba(0,0,0,0.9); border: 1px solid #f2a900; }
        .sub-grid-16 { display: grid; grid-template-columns: repeat(16, 1fr); gap: 3px; margin: 12px 0; }
        .sub-step-cell { background: #261d15; height: 40px; text-align: center; font-size: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 4px; color: #8c735e; border: 1px solid #38291e; }
        .sub-step-cell.active { background: #f2a900; color: #0f0c08; font-weight: bold; }
        .mode-badge { padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; }
        .mode-manual { background: #204060; color: #fff; }
        .mode-ai { background: #603010; color: #f2a900; }
    </style>
</head>
<body>

    <h1>🎙️ メジャーバンド DAW <span style="font-size: 13px; color: #f2a900;">各楽器手動/AI切替・大量AIパターン Edition</span></h1>

    <!-- 21曲アルバム管理セクション -->
    <div class="section" style="border: 2px solid #f2a900;">
        <h2>💿 21曲アルバム & 一括AIコントロール</h2>
        <div class="flex">
            <span>楽曲選択: 
                <select id="albumSongSelect" onchange="switchSong(this.value)" style="font-weight: bold; color: #f2a900;"></select>
            </span>
            <button onclick="addNewSong()">➕ 曲を追加</button>
            <button onclick="generateAllTracksAi()" style="background: linear-gradient(135deg, #ff4500, #ff8c00); color: #fff; font-size: 13px;">🤖 全楽器AI一括自動作曲</button>
            <button onclick="saveCurrentSongData()">💾 曲データ保存</button>
        </div>
        <div class="flex" style="margin-top: 10px;">
            <span>曲名: <input type="text" id="songTitleInput" value="第1曲: 情熱のアンセム" style="width: 250px;" onchange="updateSongTitle()"></span>
            <span>全体グルーヴ: 
                <select id="masterGrooveSelect" onchange="applyGlobalGroove(this.value)">
                    <option value="pop">スタンダード・ポップス</option>
                    <option value="rock">ハードロック・疾走</option>
                    <option value="dance">四つ打ちダンス</option>
                    <option value="ballad">エモーショナル・バラード</option>
                </select>
            </span>
        </div>
    </div>

    <!-- 全体音響コントロールルーム -->
    <div class="section">
        <h2>🎛️ 全体音響マスターコントロールルーム</h2>
        <div class="flex">
            <button onclick="masterPlay()" style="font-size: 13px;">▶ 総合再生 (Top)</button>
            <button onclick="masterStop()" style="font-size: 13px;">⏹ 停止</button>
            <button class="clear-btn" onclick="masterClear()">🗑 全トラッククリア</button>
            <button class="clear-btn" onclick="executeCacheClear()" style="background: linear-gradient(135deg, #d9534f, #c9302c);">🧹 キャッシュ Clear</button>
            <button onclick="saveProject()">💾 プロジェクト保存</button>
            <label><input type="checkbox" id="repeatToggle" checked> ループ再生</label>
            <span>テンポ (BPM): <input type="number" id="bpmInput" value="130" min="50" max="240" style="width: 55px;" onchange="updateTempo(this.value)"></span>
        </div>
        <div class="flex" style="margin-top: 10px; border-top: 1px dashed #3d2c1e; padding-top: 10px;">
            <span>🎚 マスター音量: <input type="range" min="0" max="1.5" step="0.05" value="0.9" id="masterVolumeControl" style="width: 80px;" onchange="updateMasterVolume(this.value)"></span>
            <span>🌌 リバーブ空間系: <input type="range" min="0" max="1" step="0.05" value="0.25" id="reverbControl" style="width: 70px;"></span>
            <span>💥 コンプレッサー (音圧): 
                <select id="masterCompMode" onchange="updateMasterCompressor()">
                    <option value="punchy">パンチ強め (ロック向け)</option>
                    <option value="normal">バランス (ポップス)</option>
                    <option value="off">オフ</option>
                </select>
            </span>
        </div>
    </div>

    <!-- 歌詞＆AI自動生成サポート -->
    <div class="section">
        <h2>✍️ AI歌詞 & ボーカル構成メモ</h2>
        <div class="flex">
            <button onclick="generateAiLyrics()">🤖 歌詞をAI自動生成</button>
            <button onclick="addToList()">➕ アルバムリストに登録</button>
        </div>
        <textarea id="songLyricsArea" rows="3" style="width: 100%; margin-top: 8px;" placeholder="AI生成された歌詞やボーカルメモがここに保存されます..."></textarea>
    </div>

    <!-- リアルタイム鍵盤演奏スタジオ -->
    <div class="section">
        <h2>🎹 ドレミファ鍵盤 (リアルタイム手動入力)</h2>
        <div class="flex">
            <span>記録対象パート: 
                <select id="liveTargetTrack">
                    <option value="piano">ピアノ</option>
                    <option value="violin">バイオリン</option>
                    <option value="nylonguitar">ナイロンギター</option>
                    <option value="elecguitar">エレキギター</option>
                    <option value="strings">弦楽器</option>
                </select>
            </span>
            <button onclick="startLiveRecording()" style="background: #a62b14; color:#fff;">🔴 鍵盤記録開始</button>
            <button onclick="stopLiveRecording()">⏹ 記録停止</button>
        </div>
        <div class="keyboard-container" id="masterKeyboard"></div>
    </div>

    <!-- トラック一覧（各楽器の手動/AI切り替えスイッチ付き） -->
    <div id="tracksContainer"></div>

    <!-- 1小節詳細エディター モーダル -->
    <div id="barEditorModal" class="modal-overlay">
        <div class="modal-content">
            <h2 id="modalTitle" style="color: #f2a900;">1小節手動打ち込みエディター</h2>
            <div class="flex">
                <span>編集小節: 
                    <select id="modalBarSelect" onchange="changeEditingBar()"></select>
                </span>
                <button onclick="copyCurrentBar()" style="background: #205030; color:#fff;">📋 コピー</button>
                <button onclick="pasteBarData()" style="background: #204060; color:#fff;">📋 ペースト</button>
            </div>
            <div style="margin-top: 15px;">
                <div style="font-size: 12px; margin-bottom: 6px; color: #f2a900;">16分音符グリッド:</div>
                <div class="sub-grid-16" id="subGridContainer"></div>
            </div>
            <div class="flex" style="margin-top: 25px; justify-content: flex-end;">
                <button onclick="playBarPreview()">▶ この小節を試聴</button>
                <button onclick="closeBarEditor()" style="background: #38291e; color: #f5f0e6;">閉じる</button>
            </div>
        </div>
    </div>

    <!-- ボーカル録音 & アルバムリスト -->
    <div class="section">
        <h2>🎙️ ボーカル録音 & アルバムリスト</h2>
        <div id="compositionListContainer" class="summary-box">
            アルバム登録曲はまだありません。
        </div>
        <div class="flex" style="margin-top: 12px;">
            <button onclick="startVocalRecording()">🔴 マイク録音開始</button>
            <button onclick="stopVocalRecording()">⏹ 録音停止</button>
            <button onclick="playVocal()">▶ 試聴</button>
            <button class="clear-btn" onclick="clearVocal()">🗑 削除</button>
            <audio id="vocalAudio" controls style="height: 30px;"></audio>
        </div>
    </div>

    <script>
        const instruments = [
            { id: 'piano', name: '🎹 ピアノ', type: 'melody', aiStyles: [
                'スタンダード・ポップスアルペジオ', '跳ねるシンコペーション刻み', '疾走16分ピアノ連打', 'エモーショナルコード伴奏', 'ジャズ風リズミック', 'クラシカル分散和音', 'メロウ・アルペジオ'
            ]},
            { id: 'violin', name: '🎻 バイオリン', type: 'melody', aiStyles: [
                '情熱のロングトーン・メロディ', 'スタッカート・アタック奏法', '華麗なトリル・リズム', 'ドラマチック・ソロ上昇', '哀愁のレガート刻み', 'ハイトーン・ソステヌート'
            ]},
            { id: 'nylonguitar', name: '🎸 ナイロンギター', type: 'melody', aiStyles: [
                'スパニッシュ風情熱ピッキング', 'アコースティック伴奏刻み', 'アルペジオ・スイープ', 'フォーク調コード刻み', 'メロウ・リズムストローク', 'ボサノバ風ウネリ'
            ]},
            { id: 'elecguitar', name: '⚡ エレキギター (ロック)', type: 'melody', aiStyles: [
                'ハードロック・メインリフ', 'パワーコード高速疾走刻み', 'メタル・トリッキーソロ', '軽快ポップ・カッティング', 'ヘヴィ・ダウンチューニング', 'エッジィ・オーバードライブ'
            ]},
            { id: 'strings', name: '🎻 弦楽器 (パッド)', type: 'melody', aiStyles: [
                '壮大なオーケストラ持続パッド', 'シネマティック・クレッシェンド', 'スタッカート・アンサンブル刻み', 'アンビエント・エモーショナル', 'クライマックス合奏'
            ]},
            { id: 'drums', name: '🥁 ドラム・ビート (豊富なAI)', type: 'drums', aiStyles: [
                'スタンダード・ロックビート', '変則シンコペーション・グルーヴ', '四つ打ちダンス・リズム', 'パンキッシュ・高速疾走ビート', 'ブレイクビーツ＆フィルイン', 'シャッフル・ビート', 'メタル・ツーバス連打', 'レゲエ・ワンダロップ'
            ]},
            { id: 'bass', name: '🎸 ベースパターン', type: 'bass', aiStyles: [
                '8ビート堅実ルート弾き', 'メロディック・ウォーキングベース', 'スラップ風ファンク・グルーヴ', 'うねる重低音ロックベース', 'タイトなスタッカートベース', '高速ピック弾きロックンロール'
            ]}
        ];

        let currentSongIndex = 0;
        let albumSongs = [];
        let audioCtx = null;
        let masterGainNode = null;
        let compressorNode = null;
        let reverbNode = null;
        let isPlaying = false;
        let currentTimer = null;
        let mediaRecorder;
        let recordedChunks = [];
        let vocalAudioBlob = null;
        let savedList = [];

        let currentEditingTrack = null;
        let currentEditingBarIndex = 0;
        let copiedBarBuffer = null;
        let isLiveRecording = false;

        const solfaNotes = [
            { name: 'ド (C4)', freq: 261.63 },
            { name: 'レ (D4)', freq: 293.66 },
            { name: 'ミ (E4)', freq: 329.63 },
            { name: 'ファ (F4)', freq: 349.23 },
            { name: 'ソ (G4)', freq: 392.00 },
            { name: 'ラ (A4)', freq: 440.00 },
            { name: 'シ (B4)', freq: 493.88 },
            { name: '高ド (C5)', freq: 523.25 }
        ];

        function initApp() {
            for(let s=1; s<=21; s++) {
                let initialData = {};
                let initialSubData = {};
                let initialAiChoices = {};
                let initialModes = {};
                instruments.forEach(inst => {
                    initialData[inst.id] = new Array(18).fill(false);
                    initialSubData[inst.id] = Array.from({ length: 18 }, () => new Array(16).fill(false));
                    initialAiChoices[inst.id] = 0;
                    initialModes[inst.id] = 'manual'; // デフォルト手動モード
                });
                albumSongs.push({
                    title: `第 ${s} 曲: メジャーアルバム傑作選`,
                    bpm: 120 + ((s * 3) % 35),
                    groove: 'pop',
                    trackData: initialData,
                    subBarData: initialSubData,
                    aiChoices: initialAiChoices,
                    trackModes: initialModes,
                    lyrics: `【第${s}曲】手動打ち込みと多彩なAIパターンを切り替えて、最高の楽曲を作り上げよう！`
                });
            }
            updateSongSelector();
            loadSong(0);
            renderMasterKeyboard();
        }

        function updateSongSelector() {
            const sel = document.getElementById('albumSongSelect');
            sel.innerHTML = '';
            albumSongs.forEach((song, idx) => {
                let opt = document.createElement('option');
                opt.value = idx;
                opt.innerText = song.title;
                sel.appendChild(opt);
            });
            sel.value = currentSongIndex;
        }

        function loadSong(index) {
            currentSongIndex = parseInt(index);
            const song = albumSongs[currentSongIndex];
            document.getElementById('songTitleInput').value = song.title;
            document.getElementById('bpmInput').value = song.bpm;
            document.getElementById('songLyricsArea').value = song.lyrics;
            document.getElementById('masterGrooveSelect').value = song.groove || 'pop';

            const container = document.getElementById('tracksContainer');
            container.innerHTML = '';

            const barSelect = document.getElementById('modalBarSelect');
            barSelect.innerHTML = '';
            for(let b=0; b<18; b++) {
                let opt = document.createElement('option');
                opt.value = b;
                opt.innerText = `第 ${b + 1} 小節`;
                barSelect.appendChild(opt);
            }

            instruments.forEach(inst => {
                const div = document.createElement('div');
                div.className = 'section';
                
                let styleOptions = '';
                inst.aiStyles.forEach((styleName, sIdx) => {
                    let selected = (song.aiChoices[inst.id] === sIdx) ? 'selected' : '';
                    styleOptions += `<option value="${sIdx}" ${selected}>🤖 [${styleName}]</option>`;
                });

                let currentMode = song.trackModes[inst.id] || 'manual';
                let modeBadgeText = currentMode === 'manual' ? '✏️ 手動打ち込みモード中' : '🤖 AI自動生成モード中';
                let modeBadgeClass = currentMode === 'manual' ? 'mode-manual' : 'mode-ai';

                div.innerHTML = `
                    <h3>${inst.name} <span id="badge-${inst.id}" class="mode-badge ${modeBadgeClass}">${modeBadgeText}</span></h3>
                    <div class="flex">
                        <span>モード切替: 
                            <select id="mode-sel-${inst.id}" onchange="changeTrackMode('${inst.id}', this.value)" style="font-weight: bold; color: #f2a900;">
                                <option value="manual" ${currentMode==='manual'?'selected':''}>✏️ 手動編集モード</option>
                                <option value="ai" ${currentMode==='ai'?'selected':''}>🤖 AI自動生成モード</option>
                            </select>
                        </span>
                        <span>AIパターン: 
                            <select id="ai-sel-${inst.id}" onchange="updateAiChoice('${inst.id}', this.value)">
                                ${styleOptions}
                            </select>
                        </span>
                        <button onclick="applyTrackAi('${inst.id}', document.getElementById('ai-sel-${inst.id}').value)" style="background: linear-gradient(135deg, #205030, #103020); color:#fff;">✨ AI反映実行</button>
                        <button onclick="openBarEditor('${inst.id}')" style="background: linear-gradient(135deg, #f2a900, #c67d00); color: #0f0c08;">🔍 手動エディター</button>
                        <button onclick="playTrackPreview('${inst.id}')">▶ 試聴</button>
                        <button class="clear-btn" onclick="clearTrack('${inst.id}')">🗑 Clear</button>
                    </div>
                    <div class="grid-18" id="grid-${inst.id}"></div>
                `;
                container.appendChild(div);
                renderGrid(inst.id);
            });
        }

        function switchSong(index) {
            saveCurrentSongData();
            loadSong(index);
        }

        function saveCurrentSongData() {
            let song = albumSongs[currentSongIndex];
            song.title = document.getElementById('songTitleInput').value;
            song.bpm = document.getElementById('bpmInput').value;
            song.groove = document.getElementById('masterGrooveSelect').value;
            song.lyrics = document.getElementById('songLyricsArea').value;
            updateSongSelector();
        }

        function updateSongTitle() {
            albumSongs[currentSongIndex].title = document.getElementById('songTitleInput').value;
            updateSongSelector();
        }

        function changeTrackMode(id, mode) {
            albumSongs[currentSongIndex].trackModes[id] = mode;
            const badge = document.getElementById(`badge-${id}`);
            if (badge) {
                badge.innerText = mode === 'manual' ? '✏️ 手動打ち込みモード中' : '🤖 AI自動生成モード中';
                badge.className = `mode-badge ${mode === 'manual' ? 'mode-manual' : 'mode-ai'}`;
            }
        }

        function applyGlobalGroove(grooveVal) {
            albumSongs[currentSongIndex].groove = grooveVal;
            if(grooveVal === 'rock') document.getElementById('bpmInput').value = 145;
            else if(grooveVal === 'dance') document.getElementById('bpmInput').value = 126;
            else if(grooveVal === 'ballad') document.getElementById('bpmInput').value = 75;
            else document.getElementById('bpmInput').value = 120;
            generateAllTracksAi();
        }

        function addNewSong() {
            if(albumSongs.length >= 21) return alert('アルバムは21曲で完結しています！');
            let initialData = {};
            let initialSubData = {};
            let initialAiChoices = {};
            let initialModes = {};
            instruments.forEach(inst => {
                initialData[inst.id] = new Array(18).fill(false);
                initialSubData[inst.id] = Array.from({ length: 18 }, () => new Array(16).fill(false));
                initialAiChoices[inst.id] = 0;
                initialModes[inst.id] = 'manual';
            });
            albumSongs.push({
                title: `第 ${albumSongs.length + 1} 曲: 新しいマスターピース`,
                bpm: 128,
                groove: 'pop',
                trackData: initialData,
                subBarData: initialSubData,
                aiChoices: initialAiChoices,
                trackModes: initialModes,
                lyrics: `自由な手動打ち込みと豊かなAIパターンで名曲を創ろう！`
            });
            updateSongSelector();
            loadSong(albumSongs.length - 1);
        }

        function updateAiChoice(id, styleIndex) {
            albumSongs[currentSongIndex].aiChoices[id] = parseInt(styleIndex);
        }

        // 各楽器の豊富なAI自動生成アルゴリズム
        function applyTrackAi(id, styleIndex) {
            const sIdx = parseInt(styleIndex);
            albumSongs[currentSongIndex].aiChoices[id] = sIdx;
            changeTrackMode(id, 'ai');
            document.getElementById(`mode-sel-${id}`).value = 'ai';

            let song = albumSongs[currentSongIndex];
            let tData = song.trackData[id];
            let subData = song.subBarData[id];
            tData.fill(false);

            for(let i=0; i<18; i++) {
                let generated = false;
                if (id === 'drums') {
                    if (sIdx === 0) generated = (i % 4 === 0 || i % 4 === 2);
                    else if (sIdx === 1) generated = (i % 3 === 0 || i === 5 || i === 11);
                    else if (sIdx === 2) generated = (i % 4 === 0 || i % 2 === 0);
                    else if (sIdx === 3) generated = (i % 2 === 0 || i === 7 || i === 15);
                    else if (sIdx === 4) generated = (i >= 14 || i % 4 === 0);
                    else if (sIdx === 5) generated = (i % 3 === 1);
                    else if (sIdx === 6) generated = (i % 2 === 0 || i % 6 === 5);
                    else generated = (i % 4 !== 1);
                } else {
                    if (sIdx === 0) generated = (i % 2 === 0 || i % 4 === 0);
                    else if (sIdx === 1) generated = (i % 3 === 0 || i === 5 || i === 12);
                    else if (sIdx === 2) generated = (i % 2 !== 0 && i % 3 === 0);
                    else if (sIdx === 3) generated = (i === 0 || i === 4 || i === 8 || i === 12);
                    else if (sIdx === 4) generated = (i % 5 === 0 || i % 7 === 0);
                    else generated = (i % 3 === 0 || i % 4 === 3);
                }

                if (generated) {
                    tData[i] = true;
                    let subStepIdx = (i * 2) % 16;
                    subData[i][subStepIdx] = true;
                }
            }
            renderGrid(id);
        }

        function generateAllTracksAi() {
            instruments.forEach(inst => {
                const randomStyle = Math.floor(Math.random() * inst.aiStyles.length);
                const selectElem = document.getElementById(`ai-sel-${inst.id}`);
                if(selectElem) selectElem.value = randomStyle;
                applyTrackAi(inst.id, randomStyle);
            });
            alert('🤖 全楽器のAI自動生成モードを一括適用しました！');
        }

        function renderMasterKeyboard() {
            const kbContainer = document.getElementById('masterKeyboard');
            kbContainer.innerHTML = '';
            solfaNotes.forEach(note => {
                const key = document.createElement('div');
                key.className = 'piano-key';
                key.innerText = note.name;
                key.onmousedown = () => {
                    key.classList.add('playing');
                    playTone(note.freq, 0.3);
                    if (isLiveRecording) {
                        const targetTr = document.getElementById('liveTargetTrack').value;
                        changeTrackMode(targetTr, 'manual');
                        document.getElementById(`mode-sel-${targetTr}`).value = 'manual';
                        const randStep = Math.floor(Math.random() * 18);
                        albumSongs[currentSongIndex].trackData[targetTr][randStep] = true;
                        renderGrid(targetTr);
                    }
                    setTimeout(() => key.classList.remove('playing'), 200);
                };
                kbContainer.appendChild(key);
            });
        }

        function playTone(freq, duration = 0.3) {
            const ctx = getAudioContext();
            const now = ctx.currentTime;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(freq, now);
            osc.connect(gain);
            connectWithMaster(ctx, gain);

            gain.gain.setValueAtTime(0.4, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
            osc.start(now);
            osc.stop(now + duration);
        }

        function renderGrid(id) {
            const grid = document.getElementById(`grid-${id}`);
            if(!grid) return;
            grid.innerHTML = '';
            let tData = albumSongs[currentSongIndex].trackData[id];
            for (let i = 0; i < 18; i++) {
                const cell = document.createElement('div');
                cell.className = `step-cell ${tData[i] ? 'active' : ''}`;
                cell.id = `cell-${id}-${i}`;
                cell.innerText = i + 1;
                cell.onclick = () => {
                    // グリッドをクリックしたら自動的に手動モードに切り替わる親切設計
                    changeTrackMode(id, 'manual');
                    document.getElementById(`mode-sel-${id}`).value = 'manual';
                    tData[i] = !tData[i];
                    renderGrid(id);
                };
                grid.appendChild(cell);
            }
        }

        function openBarEditor(trackId) {
            currentEditingTrack = trackId;
            currentEditingBarIndex = parseInt(document.getElementById('modalBarSelect').value);
            const instObj = instruments.find(i => i.id === trackId);
            document.getElementById('modalTitle').innerText = `${instObj.name} - 1小節手動エディター`;
            renderSubGrid();
            document.getElementById('barEditorModal').style.display = 'flex';
        }

        function closeBarEditor() { document.getElementById('barEditorModal').style.display = 'none'; }
        function changeEditingBar() { currentEditingBarIndex = parseInt(document.getElementById('modalBarSelect').value); renderSubGrid(); }

        function copyCurrentBar() {
            copiedBarBuffer = [...albumSongs[currentSongIndex].subBarData[currentEditingTrack][currentEditingBarIndex]];
            alert(`第 ${currentEditingBarIndex + 1} 小節をコピーしました！`);
        }

        function pasteBarData() {
            if (!copiedBarBuffer) return alert('コピーデータがありません。');
            let song = albumSongs[currentSongIndex];
            changeTrackMode(currentEditingTrack, 'manual');
            document.getElementById(`mode-sel-${currentEditingTrack}`).value = 'manual';
            song.subBarData[currentEditingTrack][currentEditingBarIndex] = [...copiedBarBuffer];
            song.trackData[currentEditingTrack][currentEditingBarIndex] = copiedBarBuffer.some(v => v);
            renderSubGrid();
            renderGrid(currentEditingTrack);
            alert('ペーストしました！');
        }

        function renderSubGrid() {
            const container = document.getElementById('subGridContainer');
            container.innerHTML = '';
            const data = albumSongs[currentSongIndex].subBarData[currentEditingTrack][currentEditingBarIndex];
            for (let s = 0; s < 16; s++) {
                const cell = document.createElement('div');
                cell.className = `sub-step-cell ${data[s] ? 'active' : ''}`;
                cell.innerText = s + 1;
                cell.onclick = () => {
                    changeTrackMode(currentEditingTrack, 'manual');
                    document.getElementById(`mode-sel-${currentEditingTrack}`).value = 'manual';
                    data[s] = !data[s];
                    albumSongs[currentSongIndex].trackData[currentEditingTrack][currentEditingBarIndex] = data.some(v => v);
                    renderGrid(currentEditingTrack);
                    renderSubGrid();
                };
                container.appendChild(cell);
            }
        }

        function playBarPreview() {
            if (!currentEditingTrack) return;
            const data = albumSongs[currentSongIndex].subBarData[currentEditingTrack][currentEditingBarIndex];
            const bpm = document.getElementById('bpmInput').value;
            const interval = (60 / bpm) * 250;
            data.forEach((isActive, idx) => {
                if (isActive) {
                    setTimeout(() => playNoteSound(currentEditingTrack, idx), idx * interval);
                }
            });
        }

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                masterGainNode = audioCtx.createGain();
                masterGainNode.gain.value = parseFloat(document.getElementById('masterVolumeControl').value);

                compressorNode = audioCtx.createDynamicsCompressor();
                updateMasterCompressor();

                compressorNode.connect(masterGainNode);
                masterGainNode.connect(audioCtx.destination);
                createReverbImpulse();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function updateMasterVolume(val) {
            if (masterGainNode && audioCtx) masterGainNode.gain.setValueAtTime(parseFloat(val), audioCtx.currentTime);
        }

        function updateMasterCompressor() {
            if (!compressorNode) return;
            const mode = document.getElementById('masterCompMode').value;
            if (mode === 'punchy') {
                compressorNode.threshold.setValueAtTime(-25, audioCtx.currentTime);
                compressorNode.ratio.setValueAtTime(6, audioCtx.currentTime);
            } else {
                compressorNode.threshold.setValueAtTime(-20, audioCtx.currentTime);
                compressorNode.ratio.setValueAtTime(3, audioCtx.currentTime);
            }
        }

        function createReverbImpulse() {
            const rate = audioCtx.sampleRate;
            const length = rate * 1.0;
            const impulse = audioCtx.createBuffer(2, length, rate);
            const left = impulse.getChannelData(0);
            const right = impulse.getChannelData(1);
            for (let i = 0; i < length; i++) {
                left[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, 2.0);
                right[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, 2.0);
            }
            reverbNode = audioCtx.createConvolver();
            reverbNode.buffer = impulse;
        }

        function connectWithMaster(ctx, node) {
            const reverbGain = ctx.createGain();
            reverbGain.gain.setValueAtTime(parseFloat(document.getElementById('reverbControl').value) || 0.25, ctx.currentTime);
            if (reverbNode) {
                node.connect(reverbNode);
                reverbNode.connect(reverbGain);
                reverbGain.connect(compressorNode);
            }
            node.connect(compressorNode);
        }

        function playNoteSound(instId, stepIndex) {
            const ctx = getAudioContext();
            const now = ctx.currentTime;
            const gain = ctx.createGain();
            gain.gain.setValueAtTime(0.8, now);
            connectWithMaster(ctx, gain);

            if (instId === 'drums') {
                playNoiseHit(ctx, gain, stepIndex % 4 === 0 ? 120 : 250, 0.1);
            } else if (instId === 'bass') {
                const scale = [110.00, 123.47, 130.81, 146.83, 164.81];
                const freq = scale[stepIndex % scale.length] * 0.5;
                const osc = ctx.createOscillator();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, now);
                osc.connect(gain);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);
                osc.start(now);
                osc.stop(now + 0.35);
            } else {
                const scale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25];
                const freq = scale[stepIndex % scale.length];
                const osc = ctx.createOscillator();
                osc.type = instId === 'elecguitar' ? 'sawtooth' : 'triangle';
                osc.frequency.setValueAtTime(freq, now);
                osc.connect(gain);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            }
        }

        function playNoiseHit(ctx, destination, freq, duration) {
            const bufferSize = ctx.sampleRate * duration;
            const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            const noise = ctx.createBufferSource();
            noise.buffer = buffer;
            const filter = ctx.createBiquadFilter();
            filter.type = 'highpass';
            filter.frequency.value = freq;
            noise.connect(filter);
            filter.connect(destination);
            noise.start(ctx.currentTime);
        }

        function clearTrack(id) {
            let song = albumSongs[currentSongIndex];
            song.trackData[id].fill(false);
            song.subBarData[id] = Array.from({ length: 18 }, () => new Array(16).fill(false));
            renderGrid(id);
        }

        function playTrackPreview(id) {
            let step = 0;
            const interval = (60 / document.getElementById('bpmInput').value) * 500;
            let tData = albumSongs[currentSongIndex].trackData[id];
            const timer = setInterval(() => {
                if(tData[step]) playNoteSound(id, step);
                step++;
                if (step >= 18) clearInterval(timer);
            }, interval);
        }

        function updateTempo(val) { if (isPlaying) { masterStop(); masterPlay(); } }

        function startLiveRecording() { isLiveRecording = true; alert('鍵盤記録を開始しました！'); }
        function stopLiveRecording() { isLiveRecording = false; alert('鍵盤記録を終了しました。'); }

        function masterPlay() {
            if (isPlaying) return;
            isPlaying = true;
            let currentStep = 0;
            const bpm = document.getElementById('bpmInput').value;
            const interval = (60 / bpm) * 500;
            let tData = albumSongs[currentSongIndex].trackData;

            currentTimer = setInterval(() => {
                instruments.forEach(inst => {
                    const cell = document.getElementById(`cell-${inst.id}-${currentStep}`);
                    if (cell) {
                        cell.classList.add('current-playing');
                        setTimeout(() => cell.classList.remove('current-playing'), interval * 0.9);
                    }
                });

                Object.keys(tData).forEach(id => {
                    if (tData[id][currentStep]) playNoteSound(id, currentStep);
                });

                currentStep++;
                if (currentStep >= 18) {
                    currentStep = 0;
                    if (!document.getElementById('repeatToggle').checked) masterStop();
                }
            }, interval);
        }

        function masterStop() { isPlaying = false; if (currentTimer) { clearInterval(currentTimer); currentTimer = null; } }

        function masterClear() {
            masterStop();
            instruments.forEach(inst => clearTrack(inst.id));
        }

        function executeCacheClear() {
            masterClear();
            localStorage.clear();
            sessionStorage.clear();
            savedList = [];
            updateListDisplay();
            clearVocal();
            alert('🧹 キャッシュとプロジェクトデータを完全クリアしました！');
        }

        function saveProject() {
            saveCurrentSongData();
            const blob = new Blob([JSON.stringify(albumSongs, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'micvictory_daw_project.json';
            a.click();
        }

        function generateAiLyrics() {
            const lyrics = `【AI自動生成歌詞】\n熱いビートに乗せて、未来へ駆け抜けろ！\n手動のこだわりとAIのグルーヴが融合する最高のステージへ！`;
            document.getElementById('songLyricsArea').value = lyrics;
            albumSongs[currentSongIndex].lyrics = lyrics;
            alert('AI歌詞を生成しました！');
        }

        function addToList() {
            saveCurrentSongData();
            savedList.push(albumSongs[currentSongIndex].title);
            updateListDisplay();
            alert('アルバムリストに登録しました！');
        }

        function updateListDisplay() {
            document.getElementById('compositionListContainer').innerHTML = savedList.length === 0 ? 'アルバム登録曲はありません。' : savedList.map((item, i) => `<div>💿 第${i+1}登録: ${item}</div>`).join('');
        }

        async function startVocalRecording() {
            recordedChunks = [];
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    vocalAudioBlob = new Blob(recordedChunks, { type: 'audio/webm' });
                    document.getElementById('vocalAudio').src = URL.createObjectURL(vocalAudioBlob);
                };
                mediaRecorder.start();
                alert('マイク録音中...');
            } catch(e) { alert('マイクへのアクセスが拒否されました。'); }
        }

        function stopVocalRecording() { if (mediaRecorder) mediaRecorder.stop(); }
        function playVocal() { const aud = document.getElementById('vocalAudio'); if (aud.src) aud.play(); }
        function clearVocal() { vocalAudioBlob = null; document.getElementById('vocalAudio').src = ''; }

        window.onload = initApp;
    </script>
</body>
