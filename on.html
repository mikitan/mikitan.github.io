<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>African Rhythm & Masterpiece DAW Suite (Standard Mix Edition)</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #0b0907; color: #f5f0e6; margin: 0; padding: 20px; }
        h1, h2, h3 { color: #f2a900; border-bottom: 1px solid #3d2c1e; padding-bottom: 8px; margin: 10px 0; letter-spacing: 1px; }
        .section { background: #1a1410; padding: 15px 20px; margin-bottom: 15px; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.8); border: 1px solid #4a3520; }
        button { background: linear-gradient(135deg, #f2a900, #c67d00); color: #0f0c08; border: none; padding: 7px 14px; margin: 3px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 11px; transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.4); }
        button:hover { background: linear-gradient(135deg, #ffc233, #f2a900); transform: translateY(-1px); }
        button.clear-btn { background: linear-gradient(135deg, #a62b14, #661505); color: #fff; }
        button.clear-btn:hover { background: linear-gradient(135deg, #c7351a, #881c07); }
        select, input { background: #261d15; color: #f5f0e6; border: 1px solid #594028; padding: 6px; border-radius: 6px; margin: 3px; font-size: 11px; outline: none; }
        .grid-18 { display: grid; grid-template-columns: repeat(18, 1fr); gap: 4px; margin-top: 8px; overflow-x: auto; }
        .step-cell { background: #261d15; height: 30px; text-align: center; font-size: 11px; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 4px; user-select: none; color: #8c735e; border: 1px solid #38291e; transition: 0.1s; }
        .step-cell.active { background: #f2a900; color: #0f0c08; font-weight: bold; border-color: #ffe066; box-shadow: 0 0 10px rgba(242,169,0,0.6); }
        .step-cell.current-playing { border: 2px solid #fff !important; transform: scale(1.05); }
        .flex { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .summary-box { background: #120e0b; padding: 12px; border-radius: 8px; font-size: 12px; margin-top: 10px; color: #b89b82; border: 1px solid #332418; max-height: 150px; overflow-y: auto; }
        
        .keyboard-container { display: flex; gap: 3px; margin-top: 10px; overflow-x: auto; padding: 8px; background: #120e0b; border-radius: 6px; border: 1px solid #332418; }
        .piano-key { width: 38px; height: 65px; background: #eaeaf0; color: #111; border: 1px solid #444; display: flex; align-items: flex-end; justify-content: center; font-size: 10px; font-weight: bold; cursor: pointer; border-radius: 0 0 4px 4px; user-select: none; }
        .piano-key.black { width: 22px; height: 38px; background: #1a1a24; color: #eaeaf0; margin-left: -12px; margin-right: -12px; z-index: 2; border-radius: 0 0 3px 3px; border: 1px solid #000; }
        .piano-key:active, .piano-key.playing { background: #f2a900 !important; color: #0f0c08 !important; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal-content { background: #1a1410; padding: 25px; border-radius: 16px; width: 90%; max-width: 650px; box-shadow: 0 12px 40px rgba(0,0,0,0.9); border: 1px solid #f2a900; }
        .sub-grid-16 { display: grid; grid-template-columns: repeat(16, 1fr); gap: 3px; margin: 12px 0; }
        .sub-step-cell { background: #261d15; height: 40px; text-align: center; font-size: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 4px; color: #8c735e; border: 1px solid #38291e; }
        .sub-step-cell.active { background: #f2a900; color: #0f0c08; font-weight: bold; }
    </style>
</head>
<body>

    <h1>🌍 African Rhythm & Masterpiece DAW <span style="font-size: 14px; color: #f2a900;">Standard Mix Edition</span></h1>

    <!-- マスターコントロールルーム -->
    <div class="section">
        <h2>マスターコントロールルーム</h2>
        <div class="flex">
            <button onclick="masterPlay()" style="font-size: 13px;">▶ 総合再生 (Top)</button>
            <button onclick="masterStop()" style="font-size: 13px;">⏹ 停止 (Stop)</button>
            <button class="clear-btn" onclick="masterClear()">🗑 全トラッククリア</button>
            <button onclick="saveProject()">💾 プロジェクト保存</button>
            <label><input type="checkbox" id="repeatToggle" checked> ループ再生</label>
            <span>BPM: <input type="number" id="bpmInput" value="126" min="40" max="240" style="width: 55px;" onchange="updateTempo(this.value)"></span>
            <button onclick="adjustBpm(-5)">-5</button>
            <button onclick="adjustBpm(5)">+5</button>
            <span>リバーブ(残響): <input type="range" min="0" max="1" step="0.05" value="0.2" id="reverbControl" style="width: 70px;"></span>
        </div>
    </div>

    <!-- ギター & キーボード -->
    <div class="section">
        <h2>🎸 エレキギター &amp; ドレミファボタン リアルタイム演奏スタジオ</h2>
        <div class="flex">
            <button onclick="triggerGuitarStrum('C')" style="background: linear-gradient(135deg, #ff4500, #ff8c00); color: #fff; font-size: 13px;">🎸 ギター「バーン！」(C)</button>
            <button onclick="triggerGuitarStrum('Am')" style="background: linear-gradient(135deg, #ff4500, #ff8c00); color: #fff; font-size: 13px;">🎸 ギター「バーン！」(Am)</button>
            <button onclick="triggerGuitarStrum('F')" style="background: linear-gradient(135deg, #ff4500, #ff8c00); color: #fff; font-size: 13px;">🎸 ギター「バーン！」(F)</button>
            <button onclick="triggerGuitarStrum('G')" style="background: linear-gradient(135deg, #ff4500, #ff8c00); color: #fff; font-size: 13px;">🎸 ギター「バーン！」(G)</button>
        </div>
        <div class="keyboard-container" id="masterKeyboard"></div>
        <div class="flex" style="margin-top: 10px;">
            <button onclick="startLiveRecording()" style="background: #a62b14; color:#fff;">🔴 リアルタイム演奏の記録開始</button>
            <button onclick="stopLiveRecording()">⏹ 記録停止</button>
            <button class="clear-btn" onclick="clearLiveRecording()">🗑 記録クリア</button>
        </div>
    </div>

    <!-- コード進行 -->
    <div class="section">
        <h2>🎵 コードつけ足し &amp; 自動進行スタジオ</h2>
        <div class="flex">
            <span>対象小節: 
                <select id="targetBarSelect">
                    <script>
                        for(let i=1; i<=18; i++) document.write(`<option value="${i-1}">第 ${i} 小節</option>`);
                    </script>
                </select>
            </span>
            <span>コード選択: 
                <select id="selectedChordInput">
                    <option value="C">C (Cメジャー)</option>
                    <option value="Am">Am (Aマイナー)</option>
                    <option value="F">F (Fメジャー)</option>
                    <option value="G">G (Gメジャー)</option>
                    <option value="Dm">Dm (Dマイナー)</option>
                    <option value="Em">Em (Eマイナー)</option>
                </select>
            </span>
            <button onclick="setManualChord()">小節にコードセット</button>
        </div>
        <div class="flex" style="margin-top: 10px;">
            <span>AIスタイル自動進行: 
                <select id="aiChordStyle">
                    <option value="pops">青春ポップス風 (C - G - Am - F)</option>
                    <option value="rock">ロック風 (Am - F - C - G)</option>
                    <option value="jazz">ジャズ風 (Dm7 - G7 - Cmaj7 - A7)</option>
                </select>
            </span>
            <button onclick="applyAutoChords()">全18小節に一括適用</button>
        </div>
        <div id="chordDisplayList" class="summary-box" style="font-family: monospace; color: #f2a900; max-height: 80px;">
            [1〜18小節コード構成] 初期設定
        </div>
    </div>

    <!-- トラック一覧 -->
    <div id="tracksContainer"></div>

    <!-- 1小節詳細エディター モーダル -->
    <div id="barEditorModal" class="modal-overlay">
        <div class="modal-content">
            <h2 id="modalTitle" style="color: #f2a900;">1小節 (16ステップ) 手動書き込みエディター</h2>
            <div class="flex">
                <span>編集小節: 
                    <select id="modalBarSelect" onchange="changeEditingBar()"></select>
                </span>
                <button onclick="copyCurrentBar()" style="background: #205030; color:#fff;">📋 この小節をコピー</button>
                <button onclick="pasteBarData()" style="background: #204060; color:#fff;">📋 別の小節にペースト</button>
            </div>
            <div style="margin-top: 15px;">
                <div style="font-size: 12px; margin-bottom: 6px; color: #f2a900;">16分音符グリッド:</div>
                <div class="sub-grid-16" id="subGridContainer"></div>
            </div>
            <div class="flex" style="margin-top: 25px; justify-content: flex-end;">
                <button onclick="playBarPreview()">▶ この小節を試聴</button>
                <button onclick="closeBarEditor()" style="background: #38291e; color: #f5f0e6;">閉じる</button>
            </div>
        </div>
    </div>

    <!-- まとめリスト & ボーカル -->
    <div class="section">
        <h2>マスターサマリー &amp; 録音</h2>
        <div class="flex">
            <button onclick="addToList()">➕ 現在の構成をリストに記録</button>
            <button class="clear-btn" onclick="clearList()">🗑 リスト削除</button>
        </div>
        <div id="compositionListContainer" class="summary-box">
            ここにセッションの構成履歴がリスト表示されます。
        </div>
        <div class="flex" style="margin-top: 12px;">
            <button onclick="startRecording()">🔴 マイク録音開始</button>
            <button onclick="stopRecording()">⏹ 録音停止</button>
            <button onclick="playVocal()">▶ 再生</button>
            <button class="clear-btn" onclick="clearVocal()">🗑 削除</button>
            <audio id="vocalAudio" controls style="height: 30px;"></audio>
        </div>
    </div>

    <script>
        const instruments = [
            { id: 'djembes', name: '🪘 ジャンベ・マスターパーカッション (標準バランス)', defaultPan: 0.0 },
            { id: 'talkingdrum', name: '🪘 トーキングドラム (変調リード)', defaultPan: 0.3 },
            { id: 'kora', name: '🪕 コラ (西アフリカ伝統ハープ)', defaultPan: -0.4 },
            { id: 'balafon', name: '🪵 バラフォン (木琴リズム)', defaultPan: 0.4 },
            { id: 'shekere', name: '🍈 シェケレ・シャッフルリズム', defaultPan: -0.2 },
            { id: 'guitar', name: '🎸 アフロビーツ・ギターカッティング', defaultPan: -0.3 },
            { id: 'bass', name: '🎻 アフロベース (スタンダード)', defaultPan: 0.1 },
            { id: 'brass', name: '📯 シンセブラス・ホーン隊', defaultPan: 0.2 },
            { id: 'clap', name: '👏 アフロ・ハンドクラップ (手拍子)', defaultPan: 0.0 },
            { id: 'vocalpad', name: '🎶 エスニック・コーラスパッド', defaultPan: 0.2 }
        ];

        let trackData = {};
        let trackSettings = {};
        let subBarData = {};
        
        let songChords = new Array(18).fill("C");
        const chordTemplates = {
            pops: ["C", "G", "Am", "F"],
            rock: ["Am", "F", "C", "G"],
            jazz: ["Dm7", "G7", "Cmaj7", "A7"]
        };
        const chordFrequencies = {
            "C": [261.63, 329.63, 392.00],
            "Am": [220.00, 261.63, 329.63],
            "F": [174.61, 220.00, 261.63],
            "G": [196.00, 246.94, 293.66],
            "Dm": [146.83, 174.61, 220.00],
            "Em": [164.81, 196.00, 246.94],
            "Dm7": [146.83, 174.61, 220.00, 261.63],
            "G7": [196.00, 246.94, 293.66, 349.23],
            "Cmaj7": [261.63, 329.63, 392.00, 493.88],
            "A7": [220.00, 277.18, 329.63, 392.00]
        };

        let audioCtx = null;
        let reverbNode = null;
        let isPlaying = false;
        let currentTimer = null;
        let mediaRecorder;
        let recordedChunks = [];
        let vocalAudioBlob = null;
        let savedList = [];

        let currentEditingTrack = null;
        let currentEditingBarIndex = 0;
        let copiedBarBuffer = null;
        let isLiveRecording = false;

        const solfaNotes = [
            { name: 'ド (C4)', freq: 261.63, type: 'white' },
            { name: 'レ (D4)', freq: 293.66, type: 'white' },
            { name: 'ミ (E4)', freq: 329.63, type: 'white' },
            { name: 'ファ (F4)', freq: 349.23, type: 'white' },
            { name: 'ソ (G4)', freq: 392.00, type: 'white' },
            { name: 'ラ (A4)', freq: 440.00, type: 'white' },
            { name: 'シ (B4)', freq: 493.88, type: 'white' },
            { name: '高ド (C5)', freq: 523.25, type: 'white' }
        ];

        function initApp() {
            const container = document.getElementById('tracksContainer');
            container.innerHTML = '';
            
            const barSelect = document.getElementById('modalBarSelect');
            barSelect.innerHTML = '';
            for(let b=0; b<18; b++) {
                let opt = document.createElement('option');
                opt.value = b;
                opt.innerText = `第 ${b + 1} 小節`;
                barSelect.appendChild(opt);
            }

            instruments.forEach(inst => {
                trackData[inst.id] = new Array(18).fill(false);
                trackSettings[inst.id] = { lengthType: 'normal', volume: 0.8, pan: inst.defaultPan };
                subBarData[inst.id] = Array.from({ length: 18 }, () => new Array(16).fill(false));

                const div = document.createElement('div');
                div.className = 'section';
                
                div.innerHTML = `
                    <h3>${inst.name}</h3>
                    <div class="flex">
                        <button onclick="aiComposeAfrican('${inst.id}')">🤖 自動作曲</button>
                        <button onclick="openBarEditor('${inst.id}')" style="background: linear-gradient(135deg, #f2a900, #c67d00); color: #0f0c08;">🔍 手動エディター</button>
                        <button onclick="playTrackPreview('${inst.id}')">▶ 試聴</button>
                        <button class="clear-btn" onclick="clearTrack('${inst.id}')">🗑 Clear</button>
                        <span>音量: <input type="range" min="0" max="1" step="0.05" value="0.8" onchange="updateVolume('${inst.id}', this.value)" style="width: 45px;"></span>
                        <span>定位: <input type="range" min="-1" max="1" step="0.1" value="${inst.defaultPan}" onchange="updatePan('${inst.id}', this.value)" style="width: 45px;"></span>
                        <span>音の伸び: 
                            <select onchange="updateLengthType('${inst.id}', this.value)">
                                <option value="short">短め</option>
                                <option value="normal" selected>普通</option>
                                <option value="long">長め</option>
                            </select>
                        </span>
                    </div>
                    <div class="grid-18" id="grid-${inst.id}"></div>
                `;
                container.appendChild(div);
                renderGrid(inst.id);
            });

            renderMasterKeyboard();
            updateChordDisplay();
        }

        function renderMasterKeyboard() {
            const kbContainer = document.getElementById('masterKeyboard');
            kbContainer.innerHTML = '';
            solfaNotes.forEach(note => {
                const key = document.createElement('div');
                key.className = `piano-key ${note.type}`;
                key.innerText = note.name;
                key.onmousedown = () => {
                    key.classList.add('playing');
                    playRealElectronicSound(note.freq, 'sawtooth', 0.4);
                    if (isLiveRecording) {
                        trackData['guitar'][Math.floor(Math.random() * 18)] = true;
                        renderGrid('guitar');
                    }
                    setTimeout(() => key.classList.remove('playing'), 200);
                };
                kbContainer.appendChild(key);
            });
        }

        function triggerGuitarStrum(chordName) {
            const ctx = getAudioContext();
            const now = ctx.currentTime;
            const freqs = chordFrequencies[chordName] || chordFrequencies["C"];

            const distortion = ctx.createWaveShaper();
            distortion.curve = makeDistortionCurve(30);

            const filter = ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(2200, now);

            const gainNode = ctx.createGain();
            gainNode.gain.setValueAtTime(0.6, now);
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

            distortion.connect(filter);
            filter.connect(gainNode);
            connectWithReverb(ctx, gainNode);

            freqs.forEach((freq, idx) => {
                const osc = ctx.createOscillator();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(freq, now + idx * 0.02);
                osc.connect(distortion);
                osc.start(now + idx * 0.02);
                osc.stop(now + 0.4);
            });
        }

        function makeDistortionCurve(amount) {
            const k = typeof amount === 'number' ? amount : 50;
            const n_samples = 44100;
            const curve = new Float32Array(n_samples);
            const deg = Math.PI / 180;
            for (let i = 0; i < n_samples; ++i) {
                const x = (i * 2) / n_samples - 1;
                curve[i] = ((3 + k) * x * 20 * deg) / (Math.PI + k * Math.abs(x));
            }
            return curve;
        }

        function playRealElectronicSound(freq, type = 'square', duration = 0.3) {
            const ctx = getAudioContext();
            const now = ctx.currentTime;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            osc.type = type;
            osc.frequency.setValueAtTime(freq, now);
            osc.connect(gain);
            connectWithReverb(ctx, gain);

            gain.gain.setValueAtTime(0.4, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

            osc.start(now);
            osc.stop(now + duration);
        }

        function setManualChord() {
            const bar = parseInt(document.getElementById('targetBarSelect').value);
            const chord = document.getElementById('selectedChordInput').value;
            songChords[bar] = chord;
            updateChordDisplay();
        }

        function applyAutoChords() {
            const style = document.getElementById('aiChordStyle').value;
            const template = chordTemplates[style];
            for (let i = 0; i < 18; i++) {
                songChords[i] = template[i % template.length];
            }
            updateChordDisplay();
        }

        function updateChordDisplay() {
            let text = "【1〜18小節 コード構成】\n";
            for (let i = 0; i < 18; i++) {
                text += `[${i+1}:${songChords[i]}] `;
                if ((i + 1) % 6 === 0) text += "\n";
            }
            document.getElementById('chordDisplayList').innerText = text;
        }

        function renderGrid(id) {
            const grid = document.getElementById(`grid-${id}`);
            grid.innerHTML = '';
            for (let i = 0; i < 18; i++) {
                const cell = document.createElement('div');
                cell.className = `step-cell ${trackData[id][i] ? 'active' : ''}`;
                cell.id = `cell-${id}-${i}`;
                cell.innerText = i + 1;
                cell.onclick = () => {
                    trackData[id][i] = !trackData[id][i];
                    renderGrid(id);
                };
                grid.appendChild(cell);
            }
        }

        function openBarEditor(trackId) {
            currentEditingTrack = trackId;
            currentEditingBarIndex = parseInt(document.getElementById('modalBarSelect').value);
            const instObj = instruments.find(i => i.id === trackId);
            document.getElementById('modalTitle').innerText = `${instObj.name} - 手動書き込みエディター`;
            renderSubGrid();
            document.getElementById('barEditorModal').style.display = 'flex';
        }

        function closeBarEditor() {
            document.getElementById('barEditorModal').style.display = 'none';
        }

        function changeEditingBar() {
            currentEditingBarIndex = parseInt(document.getElementById('modalBarSelect').value);
            renderSubGrid();
        }

        function copyCurrentBar() {
            copiedBarBuffer = [...subBarData[currentEditingTrack][currentEditingBarIndex]];
            alert(`第 ${currentEditingBarIndex + 1} 小節のフレーズをコピーしました！`);
        }

        function pasteBarData() {
            if (!copiedBarBuffer) {
                alert('コピーされたデータがありません。');
                return;
            }
            subBarData[currentEditingTrack][currentEditingBarIndex] = [...copiedBarBuffer];
            trackData[currentEditingTrack][currentEditingBarIndex] = copiedBarBuffer.some(v => v);
            renderSubGrid();
            renderGrid(currentEditingTrack);
            alert(`第 ${currentEditingBarIndex + 1} 小節にペーストしました！`);
        }

        function renderSubGrid() {
            const container = document.getElementById('subGridContainer');
            container.innerHTML = '';
            const data = subBarData[currentEditingTrack][currentEditingBarIndex];

            for (let s = 0; s < 16; s++) {
                const cell = document.createElement('div');
                cell.className = `sub-step-cell ${data[s] ? 'active' : ''}`;
                cell.innerText = s + 1;
                cell.onclick = () => {
                    data[s] = !data[s];
                    trackData[currentEditingTrack][currentEditingBarIndex] = data.some(v => v);
                    renderGrid(currentEditingTrack);
                    renderSubGrid();
                };
                container.appendChild(cell);
            }
        }

        function playBarPreview() {
            if (!currentEditingTrack) return;
            const data = subBarData[currentEditingTrack][currentEditingBarIndex];
            const bpm = document.getElementById('bpmInput').value;
            const sixteenthInterval = (60 / bpm) * 250;

            data.forEach((isActive, idx) => {
                if (isActive) {
                    setTimeout(() => {
                        playHighQualitySound(currentEditingTrack, idx);
                    }, idx * sixteenthInterval);
                }
            });
        }

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                createReverbImpulse();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function createReverbImpulse() {
            const rate = audioCtx.sampleRate;
            const length = rate * 1.0;
            const decay = 2.0;
            const impulse = audioCtx.createBuffer(2, length, rate);
            const left = impulse.getChannelData(0);
            const right = impulse.getChannelData(1);

            for (let i = 0; i < length; i++) {
                left[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, decay);
                right[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, decay);
            }

            reverbNode = audioCtx.createConvolver();
            reverbNode.buffer = impulse;
        }

        function connectWithReverb(ctx, node) {
            const reverbGain = ctx.createGain();
            const reverbAmt = parseFloat(document.getElementById('reverbControl').value) || 0.2;
            reverbGain.gain.setValueAtTime(reverbAmt, ctx.currentTime);

            if (reverbNode) {
                node.connect(reverbNode);
                reverbNode.connect(reverbGain);
                reverbGain.connect(ctx.destination);
            }
            node.connect(ctx.destination);
        }

        function playHighQualitySound(instId, stepIndex) {
            if (!trackData[instId][stepIndex]) return;
            if (instId === 'guitar') {
                triggerGuitarStrum(songChords[stepIndex] || 'C');
            } else {
                playAfricanSoundCore(instId, stepIndex);
            }
        }

        function playAfricanSoundCore(instId, noteIndex) {
            const ctx = getAudioContext();
            const now = ctx.currentTime;
            const settings = trackSettings[instId] || { lengthType: 'normal', volume: 0.8, pan: 0 };
            const vol = parseFloat(settings.volume);
            const panVal = parseFloat(settings.pan);
            
            const gainNode = ctx.createGain();
            gainNode.gain.setValueAtTime(vol, now);
            
            if (ctx.createStereoPanner) {
                const pannerNode = ctx.createStereoPanner();
                pannerNode.pan.setValueAtTime(panVal, now);
                gainNode.connect(pannerNode);
                connectWithReverb(ctx, pannerNode);
            } else {
                connectWithReverb(ctx, gainNode);
            }

            let mult = 0.4;
            if (settings.lengthType === 'short') mult = 0.2;
            if (settings.lengthType === 'long') mult = 0.8;

            // 🥁 【ドラム・パーカッション標準音】聞き取りやすい標準的な抜け感
            if (instId === 'djembes' || instId === 'shekere' || instId === 'clap') {
                let centerFreq = 180;
                let duration = 0.12;
                if (instId === 'shekere') centerFreq = 4000;
                if (instId === 'clap') centerFreq = 2500;

                playPercussionNoise(ctx, gainNode, centerFreq, duration);
            } 
            // 🎻 【ベース標準音】聴きやすい通常のローエンドバランス
            else if (instId === 'bass') {
                const scale = [130.81, 146.83, 164.81, 196.00, 220.00, 261.63, 293.66];
                let baseFreq = scale[noteIndex % scale.length] * 0.5;

                const osc = ctx.createOscillator();
                const filter = ctx.createBiquadFilter();
                osc.type = 'triangle'; // 聴きやすい柔らかな三角波ベース
                osc.frequency.setValueAtTime(baseFreq, now);
                
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(350, now);
                
                osc.connect(filter);
                filter.connect(gainNode);

                const duration = 0.4 * (mult / 0.4);
                gainNode.gain.setValueAtTime(vol, now);
                gainNode.gain.exponentialRampToValueAtTime(0.0001, now + duration);

                osc.start(now);
                osc.stop(now + duration);
            } 
            // その他の楽器
            else {
                const scale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33];
                const osc = ctx.createOscillator();
                const filter = ctx.createBiquadFilter();
                
                osc.connect(filter);
                filter.connect(gainNode);

                let freq = scale[noteIndex % scale.length] * (instId === 'brass' ? 1.5 : 1.0);
                osc.frequency.setValueAtTime(freq, now);
                osc.type = instId === 'brass' ? 'sawtooth' : 'triangle';
                
                const duration = 0.4 * (mult / 0.4);
                gainNode.gain.setValueAtTime(vol, now);
                gainNode.gain.exponentialRampToValueAtTime(0.0001, now + duration);

                osc.start(now);
                osc.stop(now + duration);
            }
        }

        function playBackingChord(currentStep) {
            const currentChordName = songChords[currentStep % 18];
            const freqs = chordFrequencies[currentChordName] || chordFrequencies["C"];
            const ctx = getAudioContext();
            const now = ctx.currentTime;

            freqs.forEach(freq => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq * 0.5, now);
                osc.connect(gain);
                connectWithReverb(ctx, gain);

                gain.gain.setValueAtTime(0.06, now);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.3);

                osc.start(now);
                osc.stop(now + 0.3);
            });
        }

        function playPercussionNoise(ctx, destination, filterFreq, duration) {
            const bufferSize = ctx.sampleRate * duration;
            const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.3));
            }

            const noise = ctx.createBufferSource();
            noise.buffer = buffer;

            const filter = ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = filterFreq;
            filter.Q.value = 1.0;

            const gain = ctx.createGain();
            gain.gain.setValueAtTime(0.8, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(destination);

            noise.start(ctx.currentTime);
        }

        function updateVolume(id, val) { trackSettings[id].volume = val; }
        function updatePan(id, val) { trackSettings[id].pan = val; }
        function updateLengthType(id, val) { trackSettings[id].lengthType = val; }

        function clearTrack(id) {
            trackData[id].fill(false);
            subBarData[id] = Array.from({ length: 18 }, () => new Array(16).fill(false));
            renderGrid(id);
        }

        function aiComposeAfrican(id) {
            for (let i = 0; i < 18; i++) {
                trackData[id][i] = (i % 3 === 0 || i % 4 === 2 || Math.random() > 0.6);
            }
            renderGrid(id);
        }

        function playTrackPreview(id) {
            let step = 0;
            const interval = (60 / document.getElementById('bpmInput').value) * 500;
            const timer = setInterval(() => {
                playHighQualitySound(id, step);
                step++;
                if (step >= 18) clearInterval(timer);
            }, interval);
        }

        function updateTempo(val) {
            if (isPlaying) {
                masterStop();
                masterPlay();
            }
        }

        function adjustBpm(amount) {
            const input = document.getElementById('bpmInput');
            let val = parseInt(input.value) + amount;
            if (val < 40) val = 40;
            if (val > 240) val = 240;
            input.value = val;
            updateTempo(val);
        }

        function startLiveRecording() {
            isLiveRecording = true;
            alert('リアルタイム演奏の記録を開始しました。ドレミファボタンを弾くとシーケンサーに自動記録されます！');
        }

        function stopLiveRecording() {
            isLiveRecording = false;
            alert('リアルタイム演奏の記録を終了しました。');
        }

        function clearLiveRecording() {
            trackData['guitar'].fill(false);
            renderGrid('guitar');
            alert('ギター・記録トラックをクリアしました。');
        }

        function masterPlay() {
            if (isPlaying) return;
            isPlaying = true;
            let currentStep = 0;
            const bpm = document.getElementById('bpmInput').value;
            const interval = (60 / bpm) * 500;

            currentTimer = setInterval(() => {
                instruments.forEach(inst => {
                    const cell = document.getElementById(`cell-${inst.id}-${currentStep}`);
                    if (cell) {
                        cell.classList.add('current-playing');
                        setTimeout(() => cell.classList.remove('current-playing'), interval * 0.9);
                    }
                });

                Object.keys(trackData).forEach(id => {
                    playHighQualitySound(id, currentStep);
                });
                playBackingChord(currentStep);

                currentStep++;
                if (currentStep >= 18) {
                    currentStep = 0;
                    const repeat = document.getElementById('repeatToggle').checked;
                    if (!repeat) masterStop();
                }
            }, interval);
        }

        function masterStop() {
            isPlaying = false;
            if (currentTimer) {
                clearInterval(currentTimer);
                currentTimer = null;
            }
        }

        function masterClear() {
            masterStop();
            Object.keys(trackData).forEach(id => {
                trackData[id].fill(false);
                subBarData[id] = Array.from({ length: 18 }, () => new Array(16).fill(false));
                renderGrid(id);
            });
        }

        function saveProject() {
            const project = { bpm: document.getElementById('bpmInput').value, trackData, songChords };
            const blob = new Blob([JSON.stringify(project, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'african_master_standard.json';
            a.click();
        }

        function addToList() {
            const bpm = document.getElementById('bpmInput').value;
            savedList.push(`BPM: ${bpm} - スタンダード・ミックスセッション`);
            updateListDisplay();
        }

        function clearList() {
            savedList = [];
            updateListDisplay();
        }

        function updateListDisplay() {
            const container = document.getElementById('compositionListContainer');
            container.innerHTML = savedList.length === 0 ? '記録はありません。' : savedList.map((item, idx) => `<div>#${idx + 1}: ${item}</div>`).join('');
        }

        async function startRecording() {
            recordedChunks = [];
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    vocalAudioBlob = new Blob(recordedChunks, { type: 'audio/webm' });
                    document.getElementById('vocalAudio').src = URL.createObjectURL(vocalAudioBlob);
                };
                mediaRecorder.start();
                alert('マイク録音開始...');
            } catch (err) { alert('マイクへのアクセスが許可されていません。'); }
        }

        function stopRecording() { if (mediaRecorder) mediaRecorder.stop(); }
        function playVocal() { const audio = document.getElementById('vocalAudio'); if (audio.src) audio.play(); }
        function clearVocal() { vocalAudioBlob = null; document.getElementById('vocalAudio').src = ''; }

        window.onload = initApp;
    </script>
</body>
