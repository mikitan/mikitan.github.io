<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate DAW with 20 Drum/Bass Patterns & AI Melody</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #0b0907; color: #f5f0e6; margin: 0; padding: 20px; }
        h1, h2, h3 { color: #f2a900; border-bottom: 1px solid #3d2c1e; padding-bottom: 8px; margin: 10px 0; letter-spacing: 1px; }
        .section { background: #1a1410; padding: 15px 20px; margin-bottom: 15px; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.8); border: 1px solid #4a3520; }
        button { background: linear-gradient(135deg, #f2a900, #c67d00); color: #0f0c08; border: none; padding: 7px 14px; margin: 3px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 11px; transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.4); }
        button:hover { background: linear-gradient(135deg, #ffc233, #f2a900); transform: translateY(-1px); }
        button.record-btn { background: linear-gradient(135deg, #a62b14, #661505); color: #fff; }
        button.record-btn:hover { background: linear-gradient(135deg, #c7351a, #881c07); }
        button.clear-btn { background: linear-gradient(135deg, #592015, #36120b); color: #f5f0e6; }
        button.clear-btn:hover { background: linear-gradient(135deg, #7a2d1e, #4a1910); }
        button.preview-btn { background: linear-gradient(135deg, #205030, #103020); color: #fff; }
        button.edit-btn { background: linear-gradient(135deg, #204060, #102030); color: #fff; }
        
        select, input, textarea { background: #261d15; color: #f5f0e6; border: 1px solid #594028; padding: 6px; border-radius: 6px; margin: 3px; font-size: 11px; outline: none; font-family: inherit; }
        textarea { width: 100%; height: 50px; resize: vertical; box-sizing: border-box; }
        
        .grid-18 { display: grid; grid-template-columns: repeat(18, 1fr); gap: 4px; margin-top: 8px; overflow-x: auto; }
        .step-cell { background: #261d15; height: 35px; text-align: center; font-size: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; border-radius: 4px; user-select: none; color: #8c735e; border: 1px solid #38291e; transition: 0.1s; }
        .step-cell.active { background: #f2a900; color: #0f0c08; font-weight: bold; border-color: #ffe066; box-shadow: 0 0 10px rgba(242,169,0,0.6); }
        .step-cell.current-playing { border: 2px solid #fff !important; transform: scale(1.05); }
        
        .flex { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .summary-box { background: #120e0b; padding: 12px; border-radius: 8px; font-size: 12px; margin-top: 10px; color: #b89b82; border: 1px solid #332418; max-height: 120px; overflow-y: auto; }
        
        .instrument-keyboard { display: flex; gap: 4px; margin-top: 10px; overflow-x: auto; padding: 8px; background: #120e0b; border-radius: 6px; border: 1px solid #332418; }
        .doremi-key { width: 42px; height: 55px; background: #eaeaf0; color: #111; border: 1px solid #444; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 4px; font-size: 10px; font-weight: bold; cursor: pointer; border-radius: 0 0 4px 4px; user-select: none; }
        .doremi-key:active, .doremi-key.playing { background: #f2a900 !important; color: #0f0c08 !important; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal-content { background: #1a1410; padding: 25px; border-radius: 16px; width: 90%; max-width: 650px; box-shadow: 0 12px 40px rgba(0,0,0,0.9); border: 1px solid #f2a900; }
        .sub-grid-16 { display: grid; grid-template-columns: repeat(16, 1fr); gap: 3px; margin: 12px 0; }
        .sub-step-cell { background: #261d15; height: 42px; text-align: center; font-size: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 4px; color: #8c735e; border: 1px solid #38291e; }
        .sub-step-cell.active { background: #f2a900; color: #0f0c08; font-weight: bold; }
    </style>
</head>
<body>

    <h1>🎛️🎶 究極マスターDAW (20ドラム・20ベース・AIメロディ対応)</h1>

    <!-- マスターコントロール -->
    <div class="section" style="border: 2px solid #f2a900;">
        <h2>🎛️ マスターコントロール</h2>
        <div class="flex">
            <button onclick="masterPlay()" style="font-size: 13px;">▶ 再生</button>
            <button onclick="masterStop()" style="font-size: 13px;">⏹ 停止</button>
            <button class="record-btn" onclick="toggleMasterRecording()" id="masterRecBtn">🔴 全体録音</button>
            <button class="clear-btn" onclick="masterClear()">🗑 Clear</button>
            <button class="preview-btn" onclick="previewMaster()">▶ 試聴</button>
            <button onclick="saveCompositionList()">💾 保存</button>
            <button class="edit-btn" onclick="openGlobalEditor()">🔍 編集</button>
            <label><input type="checkbox" id="repeatToggle" checked> ループ</label>
            <span>BPM: <input type="number" id="bpmInput" value="120" min="50" max="240" style="width: 50px;"></span>
        </div>
        <div class="flex" style="margin-top: 10px; border-top: 1px dashed #3d2c1e; padding-top: 10px;">
            <span>全体音量: <input type="range" min="0" max="1.5" step="0.05" value="0.9" id="masterVolumeControl" style="width: 70px;" onchange="updateMasterVolume(this.value)"></span>
            <span>リバーブ: <input type="range" min="0" max="1" step="0.05" value="0.3" id="reverbControl" style="width: 60px;"></span>
        </div>
        <div style="margin-top: 5px;"><audio id="masterAudio" controls style="height: 32px; width: 100%;"></audio></div>
        <div id="compositionListContainer" class="summary-box" style="margin-top:8px;">保存リストはありません。</div>
    </div>

    <!-- ラップボーイ＆歌詞エディター -->
    <div class="section" style="border: 2px solid #a62b14;">
        <h2>🧢 ラップボーイ & 歌詞エディター</h2>
        <div class="flex">
            <span>モード: </span>
            <select id="lyricModeSelect" onchange="toggleLyricMode(this.value)">
                <option value="manual">手動書き込み歌詞</option>
                <option value="ai">AI歌詞生成</option>
                <option value="rapboy">ラップボーイ (自動ラップ)</option>
            </select>
            <button onclick="generateAiLyrics()" style="background: linear-gradient(135deg, #ff4500, #ff8c00); color: #fff;">🤖 AI/ラップ自動作成</button>
            <button class="record-btn" onclick="startVocalRecording()">🔴 音声録音</button>
            <button onclick="stopVocalRecording()">⏹ 停止</button>
            <button class="preview-btn" onclick="playVocal()">▶ 音声試聴</button>
        </div>
        <div style="margin-top: 8px;">
            <textarea id="lyricTextArea" placeholder="ここに歌詞やラップテキストを入力してください..."></textarea>
        </div>
        <div style="margin-top: 3px;"><audio id="vocalAudio" controls style="height: 28px; width: 100%;"></audio></div>
    </div>

    <!-- 7大楽器トラックコンテナ -->
    <div id="tracksContainer"></div>

    <!-- 1小節詳細エディター モーダル -->
    <div id="barEditorModal" class="modal-overlay">
        <div class="modal-content">
            <h2 id="modalTitle" style="color: #f2a900;">1小節詳細エディター</h2>
            <div class="flex">
                <span>編集小節: <select id="modalBarSelect" onchange="changeEditingBar()"></select></span>
                <button class="edit-btn" onclick="copyCurrentBar()">📋 コピー</button>
                <button class="edit-btn" onclick="pasteBarData()">📋 ペースト</button>
            </div>
            <div style="margin-top: 15px;">
                <div style="font-size: 12px; margin-bottom: 6px; color: #f2a900;">16分音符グリッド:</div>
                <div class="sub-grid-16" id="subGridContainer"></div>
            </div>
            <div class="flex" style="margin-top: 25px; justify-content: flex-end;">
                <button class="preview-btn" onclick="playBarPreview()">▶ この小節を試聴</button>
                <button onclick="closeBarEditor()" style="background: #38291e; color: #f5f0e6;">閉じる</button>
            </div>
        </div>
    </div>

    <script>
        const instruments = [
            { id: 'violin', name: '🎻 バイオリン', type: 'melody' },
            { id: 'piano', name: '🎹 ピアノ', type: 'melody' },
            { id: 'guitar', name: '🎸 アコースティックギター', type: 'melody' },
            { id: 'eguitar', name: '⚡ エレキギター', type: 'melody' },
            { id: 'synth', name: '🎛️ シンセサイザー', type: 'melody' },
            { id: 'bass', name: '🎸 ベース', type: 'bass' },
            { id: 'drums', name: '🥁 ドラムキット', type: 'drums' }
        ];

        const solfaNotes = [
            { name: 'ド', noteName: 'C4', freq: 261.63 },
            { name: 'レ', noteName: 'D4', freq: 293.66 },
            { name: 'ミ', noteName: 'E4', freq: 329.63 },
            { name: 'ファ', noteName: 'F4', freq: 349.23 },
            { name: 'ソ', noteName: 'G4', freq: 392.00 },
            { name: 'ラ', noteName: 'A4', freq: 440.00 },
            { name: 'シ', noteName: 'B4', freq: 493.88 },
            { name: '高ド', noteName: 'C5', freq: 523.25 }
        ];

        const drumNotes = [
            { name: 'Kick', noteName: 'バスドラ' },
            { name: 'Snare', noteName: 'スネア' },
            { name: 'Hi-Hat', noteName: 'ハイハット' },
            { name: 'Cymbal', noteName: 'シンバル' }
        ];

        let songData = {
            title: 'マイソング 01',
            trackData: {},
            trackNotes: {},
            subBarData: {},
            subBarNotes: {},
            liveRecordingStates: {},
            inputModes: {},
            trackFx: {},
            drumPatternIndex: 0,
            bassPatternIndex: 0,
            melodyMode: 'manual'
        };

        let audioCtx = null, masterGainNode = null, compressorNode = null, reverbNode = null;
        let isPlaying = false, currentTimer = null;
        let mediaRecorder, recordedChunks = [], vocalAudioBlob = null;
        let masterMediaRecorder, masterRecordedChunks = [], masterAudioBlob = null, isMasterRecording = false;
        let savedList = [];
        let currentEditingTrack = null, currentEditingBarIndex = 0;
        let copiedBarBuffer = null, copiedNotesBuffer = null;

        function initApp() {
            instruments.forEach(inst => {
                songData.trackData[inst.id] = new Array(18).fill(false);
                songData.trackNotes[inst.id] = new Array(18).fill(0);
                songData.subBarData[inst.id] = Array.from({ length: 18 }, () => new Array(16).fill(false));
                songData.subBarNotes[inst.id] = Array.from({ length: 18 }, () => new Array(16).fill(0));
                songData.liveRecordingStates[inst.id] = false;
                songData.inputModes[inst.id] = 'manual';
                songData.trackFx[inst.id] = 'normal';
            });
            renderTracks();
            initBarSelect();
        }

        function initBarSelect() {
            const barSelect = document.getElementById('modalBarSelect');
            barSelect.innerHTML = '';
            for(let b=0; b<18; b++) {
                let opt = document.createElement('option');
                opt.value = b;
                opt.innerText = `第 ${b + 1} 小節`;
                barSelect.appendChild(opt);
            }
        }

        function renderTracks() {
            const container = document.getElementById('tracksContainer');
            container.innerHTML = '';

            instruments.forEach(inst => {
                const div = document.createElement('div');
                div.className = 'section';
                
                let isRecording = songData.liveRecordingStates[inst.id];
                let recordBtnText = isRecording ? '⏹ 記録停止中...' : '🔴 記録 (鍵盤)';
                let recordBtnClass = isRecording ? 'record-btn' : '';
                let currentMode = songData.inputModes[inst.id];
                let currentFx = songData.trackFx[inst.id];

                let patternSelectorsHTML = '';
                if (inst.id === 'drums') {
                    let opts = '';
                    for(let p=1; p<=20; p++) opts += `<option value="${p-1}">ドラムパターン ${p}</option>`;
                    patternSelectorsHTML = `<span style="color:#f2a900;">20パターン:</span> <select onchange="applyDrumPattern(this.value)">${opts}</select>`;
                } else if (inst.id === 'bass') {
                    let opts = '';
                    for(let p=1; p<=20; p++) opts += `<option value="${p-1}">ベースパターン ${p}</option>`;
                    patternSelectorsHTML = `<span style="color:#f2a900;">20パターン:</span> <select onchange="applyBassPattern(this.value)">${opts}</select>`;
                } else if (inst.type === 'melody') {
                    patternSelectorsHTML = `
                        <span style="color:#f2a900;">メロディ切替:</span>
                        <select onchange="changeMelodyMode('${inst.id}', this.value)">
                            <option value="manual" ${currentMode==='manual'?'selected':''}>手動入力</option>
                            <option value="ai" ${currentMode==='ai'?'selected':''}>AI自動生成</option>
                        </select>
                    `;
                }

                div.innerHTML = `
                    <h3>${inst.name}</h3>
                    <div class="flex">
                        ${patternSelectorsHTML}
                        <span>音FX: </span>
                        <select onchange="changeTrackFx('${inst.id}', this.value)">
                            <option value="normal" ${currentFx==='normal'?'selected':''}>Normal</option>
                            <option value="distortion" ${currentFx==='distortion'?'selected':''}>ディストーション</option>
                            <option value="lowpass" ${currentFx==='lowpass'?'selected':''}>ローパス</option>
                            <option value="delay" ${currentFx==='delay'?'selected':''}>ディレイ</option>
                        </select>
                        <button class="${recordBtnClass}" id="rec-btn-${inst.id}" onclick="toggleLiveRecording('${inst.id}')">${recordBtnText}</button>
                        <button class="edit-btn" onclick="openBarEditor('${inst.id}')">🔍 編集</button>
                        <button class="preview-btn" onclick="playTrackPreview('${inst.id}')">▶ 試聴</button>
                        <button class="clear-btn" onclick="clearTrack('${inst.id}')">🗑 Clear</button>
                    </div>
                    <div style="font-size:11px; color:#f2a900; margin-top:8px;">${inst.type==='drums'?'🥁 ドラム演奏パッド':'🎹 キーボード'}:</div>
                    <div class="instrument-keyboard" id="kb-${inst.id}"></div>
                    <div class="grid-18" id="grid-${inst.id}" style="margin-top:10px;"></div>
                `;
                container.appendChild(div);
                renderInstrumentKeyboard(inst);
                renderGrid(inst.id);
            });
        }

        function changeMelodyMode(instId, mode) {
            songData.inputModes[instId] = mode;
            if (mode === 'ai') autoGenerateMelody(instId);
        }

        function applyDrumPattern(patternIdx) {
            idx = parseInt(patternIdx);
            songData.drumPatternIndex = idx;
            let tData = songData.trackData['drums'];
            let tNotes = songData.trackNotes['drums'];
            tData.fill(false);

            for(let i=0; i<18; i++) {
                if ((i + idx) % 2 === 0 || (i + idx) % 5 === 0) {
                    tData[i] = true;
                    tNotes[i] = (i + idx) % 4;
                }
            }
            renderGrid('drums');
        }

        function applyBassPattern(patternIdx) {
            idx = parseInt(patternIdx);
            songData.bassPatternIndex = idx;
            let tData = songData.trackData['bass'];
            let tNotes = songData.trackNotes['bass'];
            tData.fill(false);

            for(let i=0; i<18; i++) {
                if (i % 3 === 0 || (i + idx) % 4 === 0) {
                    tData[i] = true;
                    tNotes[i] = (i + idx) % 8;
                }
            }
            renderGrid('bass');
        }

        function autoGenerateMelody(instId) {
            let tData = songData.trackData[instId];
            let tNotes = songData.trackNotes[instId];
            tData.fill(false);
            for(let i=0; i<18; i++) {
                if (i % 2 === 0) {
                    tData[i] = true;
                    tNotes[i] = (i * 3) % 8;
                }
            }
            renderGrid(instId);
        }

        function changeTrackFx(instId, fxVal) { songData.trackFx[instId] = fxVal; }

        function toggleLyricMode(mode) {
            const ta = document.getElementById('lyricTextArea');
            if (mode === 'ai') ta.value = "【AI自動生成歌詞】\nビートに乗せて 光る未来へ\n限界突破のステージが始まる";
            else if (mode === 'rapboy') ta.value = "【ラップボーイ】\nYo! チェックイン 鳴り響くベース\nRhyme & Flow 刻むぜ Beatに Ride on!";
            else ta.value = "";
        }

        function generateAiLyrics() {
            const mode = document.getElementById('lyricModeSelect').value;
            toggleLyricMode(mode);
            alert('自動生成しました！');
        }

        function renderInstrumentKeyboard(inst) {
            const kbContainer = document.getElementById(`kb-${inst.id}`);
            kbContainer.innerHTML = '';
            let items = (inst.type === 'drums') ? drumNotes : solfaNotes;

            items.forEach((item, idx) => {
                const key = document.createElement('div');
                key.className = 'doremi-key';
                key.innerHTML = `<span>${item.name}</span><span style="font-size:7px; color:#777;">${item.noteName}</span>`;
                key.onmousedown = () => {
                    key.classList.add('playing');
                    playInstrumentNote(inst.id, idx);
                    if (songData.liveRecordingStates[inst.id]) {
                        const targetStep = Math.floor(Math.random() * 18);
                        songData.trackData[inst.id][targetStep] = true;
                        songData.trackNotes[inst.id][targetStep] = idx;
                        renderGrid(inst.id);
                    }
                    setTimeout(() => key.classList.remove('playing'), 200);
                };
                kbContainer.appendChild(key);
            });
        }

        function toggleLiveRecording(instId) {
            songData.liveRecordingStates[instId] = !songData.liveRecordingStates[instId];
            const btn = document.getElementById(`rec-btn-${instId}`);
            if (songData.liveRecordingStates[instId]) {
                btn.innerText = '⏹ 記録停止'; btn.className = 'record-btn';
            } else {
                btn.innerText = '🔴 記録 (鍵盤)'; btn.className = '';
            }
        }

        function renderGrid(id) {
            const grid = document.getElementById(`grid-${id}`);
            if(!grid) return;
            grid.innerHTML = '';
            let tData = songData.trackData[id];
            let tNotes = songData.trackNotes[id];
            let instObj = instruments.find(i => i.id === id);

            for (let i = 0; i < 18; i++) {
                const cell = document.createElement('div');
                cell.className = `step-cell ${tData[i] ? 'active' : ''}`;
                cell.id = `cell-${id}-${i}`;
                let label = '';
                if(tData[i]) {
                    label = instObj.type === 'drums' ? drumNotes[tNotes[i]].name : solfaNotes[tNotes[i]].name;
                }
                cell.innerHTML = `<span>${i + 1}</span><span style="font-size:8px; font-weight:bold;">${label}</span>`;
                cell.onclick = () => {
                    let maxNotes = instObj.type === 'drums' ? 4 : 8;
                    if (!tData[i]) { tData[i] = true; tNotes[i] = 0; }
                    else {
                        tNotes[i] = (tNotes[i] + 1) % maxNotes;
                        if(tNotes[i] === 0) tData[i] = false;
                    }
                    renderGrid(id);
                };
                grid.appendChild(cell);
            }
        }

        function openBarEditor(trackId) {
            currentEditingTrack = trackId;
            currentEditingBarIndex = parseInt(document.getElementById('modalBarSelect').value);
            const instObj = instruments.find(i => i.id === trackId);
            document.getElementById('modalTitle').innerText = `${instObj.name} - 1小節詳細エディター`;
            renderSubGrid();
            document.getElementById('barEditorModal').style.display = 'flex';
        }

        function openGlobalEditor() { openBarEditor('piano'); }
        function closeBarEditor() { document.getElementById('barEditorModal').style.display = 'none'; }
        function changeEditingBar() { currentEditingBarIndex = parseInt(document.getElementById('modalBarSelect').value); renderSubGrid(); }

        function copyCurrentBar() {
            copiedBarBuffer = [...songData.subBarData[currentEditingTrack][currentEditingBarIndex]];
            copiedNotesBuffer = [...songData.subBarNotes[currentEditingTrack][currentEditingBarIndex]];
            alert('コピーしました！');
        }

        function pasteBarData() {
            if (!copiedBarBuffer) return;
            songData.subBarData[currentEditingTrack][currentEditingBarIndex] = [...copiedBarBuffer];
            songData.subBarNotes[currentEditingTrack][currentEditingBarIndex] = [...copiedNotesBuffer];
            songData.trackData[currentEditingTrack][currentEditingBarIndex] = copiedBarBuffer.some(v => v);
            renderSubGrid(); renderGrid(currentEditingTrack);
            alert('ペーストしました！');
        }

        function renderSubGrid() {
            const container = document.getElementById('subGridContainer');
            container.innerHTML = '';
            const data = songData.subBarData[currentEditingTrack][currentEditingBarIndex];
            const notes = songData.subBarNotes[currentEditingTrack][currentEditingBarIndex];
            const instObj = instruments.find(i => i.id === currentEditingTrack);

            for (let s = 0; s < 16; s++) {
                const cell = document.createElement('div');
                cell.className = `sub-step-cell ${data[s] ? 'active' : ''}`;
                let noteName = data[s] ? (instObj.type === 'drums' ? drumNotes[notes[s]].name : solfaNotes[notes[s]].name) : (s + 1);
                cell.innerHTML = `<span>${s+1}</span><span style="font-size:8px; color:${data[s]?'#0f0c08':'#8c735e'}">${noteName}</span>`;
                cell.onclick = () => {
                    let maxNotes = instObj.type === 'drums' ? 4 : 8;
                    if (!data[s]) { data[s] = true; notes[s] = 0; }
                    else {
                        notes[s] = (notes[s] + 1) % maxNotes;
                        if(notes[s] === 0) data[s] = false;
                    }
                    songData.trackData[currentEditingTrack][currentEditingBarIndex] = data.some(v => v);
                    renderGrid(currentEditingTrack); renderSubGrid();
                };
                container.appendChild(cell);
            }
        }

        function playBarPreview() {
            if (!currentEditingTrack) return;
            const data = songData.subBarData[currentEditingTrack][currentEditingBarIndex];
            const notes = songData.subBarNotes[currentEditingTrack][currentEditingBarIndex];
            const interval = (60 / document.getElementById('bpmInput').value) * 250;
            data.forEach((isActive, idx) => {
                if (isActive) setTimeout(() => playInstrumentNote(currentEditingTrack, notes[idx]), idx * interval);
            });
        }

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                masterGainNode = audioCtx.createGain();
                masterGainNode.gain.value = parseFloat(document.getElementById('masterVolumeControl').value);
                compressorNode = audioCtx.createDynamicsCompressor();
                compressorNode.connect(masterGainNode);
                masterGainNode.connect(audioCtx.destination);
                createReverbImpulse();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function updateMasterVolume(val) {
            if (masterGainNode && audioCtx) masterGainNode.gain.setValueAtTime(parseFloat(val), audioCtx.currentTime);
        }

        function createReverbImpulse() {
            const rate = audioCtx.sampleRate, length = rate * 1.5;
            const impulse = audioCtx.createBuffer(2, length, rate);
            const left = impulse.getChannelData(0), right = impulse.getChannelData(1);
            for (let i = 0; i < length; i++) {
                left[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, 2.0);
                right[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, 2.0);
            }
            reverbNode = audioCtx.createConvolver();
            reverbNode.buffer = impulse;
        }

        function applyFxToNode(ctx, sourceNode, fxType) {
            let lastNode = sourceNode;
            if (fxType === 'distortion') {
                const waveShaper = ctx.createWaveShaper();
                const curve = new Float32Array(44100);
                for (let i = 0; i < 44100; ++i) {
                    let x = (i * 2) / 44100 - 1;
                    curve[i] = (35 * x * 20 * (Math.PI / 180)) / (Math.PI + 35 * Math.abs(x));
                }
                waveShaper.curve = curve;
                lastNode.connect(waveShaper);
                lastNode = waveShaper;
            } else if (fxType === 'lowpass') {
                const filter = ctx.createBiquadFilter();
                filter.type = 'lowpass'; filter.frequency.value = 800;
                lastNode.connect(filter);
                lastNode = filter;
            } else if (fxType === 'delay') {
                const delay = ctx.createDelay();
                delay.delayTime.value = 0.25;
                lastNode.connect(delay);
                delay.connect(compressorNode);
            }
            return lastNode;
        }

        function connectWithMaster(ctx, node, instId) {
            const fxType = songData.trackFx[instId] || 'normal';
            const processedNode = applyFxToNode(ctx, node, fxType);
            processedNode.connect(compressorNode);
        }

        function playInstrumentNote(instId, noteIndex) {
            const ctx = getAudioContext();
            const now = ctx.currentTime;
            const gain = ctx.createGain();
            connectWithMaster(ctx, gain, instId);

            if (instId === 'drums') {
                gain.gain.setValueAtTime(0.7, now);
                const osc = ctx.createOscillator();
                if (noteIndex === 0) {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(130, now);
                    osc.frequency.exponentialRampToValueAtTime(30, now + 0.15);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.2);
                    osc.connect(gain); osc.start(now); osc.stop(now + 0.2);
                } else {
                    const bufferSize = ctx.sampleRate * 0.1;
                    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                    const noise = ctx.createBufferSource();
                    noise.buffer = buffer;
                    noise.connect(gain);
                    noise.start(now);
                }
                return;
            }

            let freq = solfaNotes[noteIndex].freq;
            if (instId === 'bass') freq = freq / 2;
            gain.gain.setValueAtTime(0.5, now);
            const osc = ctx.createOscillator();
            osc.type = instId === 'bass' ? 'triangle' : 'sawtooth';
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);
            osc.connect(gain); osc.start(now); osc.stop(now + 0.5);
        }

        function clearTrack(id) {
            songData.trackData[id].fill(false);
            songData.trackNotes[id].fill(0);
            renderGrid(id);
        }

        function playTrackPreview(id) {
            let step = 0;
            const interval = (60 / document.getElementById('bpmInput').value) * 500;
            let tData = songData.trackData[id], tNotes = songData.trackNotes[id];
            const timer = setInterval(() => {
                if(tData[step]) playInstrumentNote(id, tNotes[step]);
                step++; if (step >= 18) clearInterval(timer);
            }, interval);
        }

        function masterPlay() {
            if (isPlaying) return;
            isPlaying = true;
            let currentStep = 0;
            const bpm = document.getElementById('bpmInput').value;
            const interval = (60 / bpm) * 500;
            let tData = songData.trackData, tNotes = songData.trackNotes;

            currentTimer = setInterval(() => {
                instruments.forEach(inst => {
                    const cell = document.getElementById(`cell-${inst.id}-${currentStep}`);
                    if (cell) {
                        cell.classList.add('current-playing');
                        setTimeout(() => cell.classList.remove('current-playing'), interval * 0.9);
                    }
                });

                Object.keys(tData).forEach(id => {
                    if (tData[id][currentStep]) playInstrumentNote(id, tNotes[id][currentStep]);
                });

                currentStep++;
                if (currentStep >= 18) {
                    currentStep = 0;
                    if (!document.getElementById('repeatToggle').checked) masterStop();
                }
            }, interval);
        }

        function masterStop() { isPlaying = false; if (currentTimer) { clearInterval(currentTimer); currentTimer = null; } }
        function masterClear() { masterStop(); instruments.forEach(inst => clearTrack(inst.id)); document.getElementById('lyricTextArea').value = ''; }
        function previewMaster() { masterPlay(); }

        function toggleMasterRecording() {
            if (!isMasterRecording) {
                masterRecordedChunks = [];
                try {
                    const dest = getAudioContext().createMediaStreamDestination();
                    masterGainNode.connect(dest);
                    masterMediaRecorder = new MediaRecorder(dest.stream);
                    masterMediaRecorder.ondataavailable = e => { if (e.data.size > 0) masterRecordedChunks.push(e.data); };
                    masterMediaRecorder.onstop = () => {
                        masterAudioBlob = new Blob(masterRecordedChunks, { type: 'audio/webm' });
                        document.getElementById('masterAudio').src = URL.createObjectURL(masterAudioBlob);
                    };
                    masterMediaRecorder.start();
                    isMasterRecording = true;
                    document.getElementById('masterRecBtn').innerText = '⏹ 録音停止';
                    masterPlay();
                    alert('🔴 全体録音を開始しました！');
                } catch(e) { alert('録音の開始に失敗しました。'); }
            } else {
                if (masterMediaRecorder) masterMediaRecorder.stop();
                masterStop();
                isMasterRecording = false;
                document.getElementById('masterRecBtn').innerText = '🔴 全体録音';
                alert('全体録音が完了しました！');
            }
        }

        async function startVocalRecording() {
            recordedChunks = [];
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    vocalAudioBlob = new Blob(recordedChunks, { type: 'audio/webm' });
                    document.getElementById('vocalAudio').src = URL.createObjectURL(vocalAudioBlob);
                };
                mediaRecorder.start();
                alert('🎙️ 音声録音中...');
            } catch(e) { alert('マイクアクセスが拒否されました。'); }
        }

        function stopVocalRecording() { if (mediaRecorder) mediaRecorder.stop(); }
        function playVocal() { const aud = document.getElementById('vocalAudio'); if (aud.src) aud.play(); }

        function saveCompositionList() {
            savedList.push({ title: songData.title, lyrics: document.getElementById('lyricTextArea').value });
            document.getElementById('compositionListContainer').innerHTML = savedList.map((item, i) => `<div>💿 曲 ${i+1}: ${item.title}</div>`).join('');
            alert('保存しました！');
        }

        window.onload = initApp;
    </script>
</body>
