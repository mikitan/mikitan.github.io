<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Append & Roll Groovebox</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; margin: 0; }
    .container { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; }
    h1 { font-size: 1.15rem; margin: 0; }
    .btn-group { display: flex; flex-wrap: wrap; gap: 8px; }
    button { background: #3b82f6; color: white; border: none; padding: 10px 12px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; flex: 1 1 auto; white-space: nowrap; }
    button:hover { background: #2563eb; }
    .active-mode { background: #10b981 !important; }
    .danger-btn { background: #ef4444 !important; flex-basis: 100%; }
    .danger-btn:hover { background: #dc2626 !important; }
    .panel { background: #1e293b; padding: 15px; border-radius: 8px; }
    .panel h3 { font-size: 0.9rem; margin: 0 0 10px 0; }
    .pads-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    pre { background: #090d16; padding: 10px; border-radius: 4px; font-size: 11px; overflow-x: auto; color: #38bdf8; max-height: 180px; margin: 0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Append & Roll Groovebox</h1>
    <div class="btn-group">
      <button id="btnPlay">PLAY / STOP</button>
      <button id="btnOverdub" class="active-mode">OVERDUB: ON</button>
      <button id="btnClearAll" class="danger-btn">全体一括Clear（即時）</button>
    </div>
    <div class="panel">
      <h3>Live Pads</h3>
      <div class="pads-grid">
        <button class="pad" data-note="60">C4 (Kick)</button>
        <button class="pad" data-note="62">D4 (Snare)</button>
        <button class="pad" data-note="64">E4 (HiHat)</button>
      </div>
    </div>
    <div class="panel">
      <h3>Event Log</h3>
      <pre id="logView">[]</pre>
    </div>
  </div>

  <script>
    class WebAudioAppendSeq {
      constructor() {
        this.ctx = null;
        this.isPlaying = false;
        this.isOverdub = true;
        this.bpm = 120;
        this.loopTicks = 16;
        this.currentTick = 0;
        this.events = [];
        this.lookahead = 25.0;
        this.scheduleAheadTime = 0.1;
        this.nextNoteTime = 0.0;
        this.timerId = null;
      }

      initAudio() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
      }

      playTone(freq, time) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.frequency.setValueAtTime(freq, time);
        gain.gain.setValueAtTime(0.3, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.15);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(time);
        osc.stop(time + 0.2);
      }

      midiToFreq(midi) {
        return 440 * Math.pow(2, (midi - 69) / 12);
      }

      start() {
        this.initAudio();
        if (this.ctx.state === 'suspended') this.ctx.resume();
        this.isPlaying = true;
        this.currentTick = 0;
        this.nextNoteTime = this.ctx.currentTime;
        this.loopTimer();
      }

      stop() {
        this.isPlaying = false;
        if (this.timerId) clearTimeout(this.timerId);
      }

      getSecondsPerTick() {
        return (60.0 / this.bpm) / 4.0;
      }

      loopTimer() {
        if (!this.isPlaying) return;
        while (this.nextNoteTime < this.ctx.currentTime + this.scheduleAheadTime) {
          this.scheduleTick(this.currentTick, this.nextNoteTime);
          this.advanceTick();
        }
        this.timerId = setTimeout(() => this.loopTimer(), this.lookahead);
      }

      advanceTick() {
        this.nextNoteTime += this.getSecondsPerTick();
        this.currentTick = (this.currentTick + 1) % this.loopTicks;
      }

      scheduleTick(tick, time) {
        const matched = this.events.filter(e => e.tick === tick);
        matched.forEach(e => {
          this.playTone(this.midiToFreq(e.note), time);
        });
      }

      appendNote(note) {
        if (!this.isOverdub) return;
        this.events.push({ tick: this.currentTick, note });
        this.events.sort((a, b) => a.tick - b.tick);
        updateLogView(this.events);
      }

      clearAll() {
        this.events = [];
        updateLogView(this.events);
      }
    }

    const seq = new WebAudioAppendSeq();

    const btnPlay = document.getElementById('btnPlay');
    const btnOverdub = document.getElementById('btnOverdub');
    const btnClearAll = document.getElementById('btnClearAll');
    const logView = document.getElementById('logView');

    function updateLogView(events) {
      logView.textContent = JSON.stringify(events, null, 2);
    }

    btnPlay.addEventListener('click', () => {
      if (!seq.isPlaying) {
        seq.start();
        btnPlay.textContent = 'STOP';
      } else {
        seq.stop();
        btnPlay.textContent = 'PLAY / STOP';
      }
    });

    btnOverdub.addEventListener('click', () => {
      seq.isOverdub = !seq.isOverdub;
      btnOverdub.classList.toggle('active-mode', seq.isOverdub);
      btnOverdub.textContent = `OVERDUB: ${seq.isOverdub ? 'ON' : 'OFF'}`;
    });

    // ポップアップなしの即時一括クリア実行
    btnClearAll.addEventListener('click', () => {
      seq.clearAll();
    });

    document.querySelectorAll('.pad').forEach(pad => {
      pad.addEventListener('click', () => {
        const note = parseInt(pad.dataset.note, 10);
        seq.initAudio();
        seq.playTone(seq.midiToFreq(note), seq.ctx ? seq.ctx.currentTime : 0);
        seq.appendNote(note);
      });
    });
  </script>
</body>
</html>
