<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULTIMATE MASTER DAW v33.6 - UI EXACT INTEGRATION</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #070605; color: #f5f0e6; margin: 0; padding: 15px; }
        h1, h2, h3 { color: #f2a900; border-bottom: 1px solid #3d2c1e; padding-bottom: 6px; margin: 8px 0; letter-spacing: 1px; }
        .section { background: #15110d; padding: 12px 18px; margin-bottom: 12px; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.8); border: 1px solid #4a3520; }
        button { background: linear-gradient(135deg, #f2a900, #c67d00); color: #0f0c08; border: none; padding: 7px 14px; margin: 3px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 11px; transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.4); }
        button:hover { background: linear-gradient(135deg, #ffc233, #f2a900); transform: translateY(-1px); }
        button.record-btn { background: linear-gradient(135deg, #a62b14, #661505); color: #fff; }
        button.clear-btn { background: linear-gradient(135deg, #592015, #36120b); color: #f5f0e6; }
        button.preview-btn { background: linear-gradient(135deg, #205030, #103020); color: #fff; }
        button.ai-btn { background: linear-gradient(135deg, #204080, #102040); color: #fff; }
        button.release-btn { background: linear-gradient(135deg, #8a2be2, #4b0082); color: #fff; font-size: 12px; }
        
        select, input, textarea { background: #221912; color: #f5f0e6; border: 1px solid #594028; padding: 6px; border-radius: 6px; margin: 3px; font-size: 11px; outline: none; font-family: inherit; }
        textarea { width: 100%; height: 90px; resize: vertical; box-sizing: border-box; line-height: 1.5; }
        
        /* 画像UI直結：AIパターン一括生成 20grid */
        .ai-20-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-top: 6px; }
        .ai-slot-btn { background: #221912; border: 1px solid #4a3520; color: #b89b82; padding: 8px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; text-align: center; }
        .ai-slot-btn.active, .ai-slot-btn:hover { background: #f2a900; color: #0f0c08; border-color: #ffe066; }

        /* 画像UI直結：音長セレクター＆鍵盤群 */
        .gate-selector-bar { display: flex; gap: 4px; align-items: center; margin: 8px 0; background: #0d0a08; padding: 6px; border-radius: 6px; border: 1px solid #332418; }
        .gate-btn { background: #221912; color: #b89b82; border: 1px solid #4a3520; padding: 5px 10px; border-radius: 4px; font-size: 10px; cursor: pointer; }
        .gate-btn.active { background: #f2a900; color: #0f0c08; font-weight: bold; }

        .ui-piano-kb { display: flex; gap: 3px; margin-top: 6px; overflow-x: auto; padding: 6px; background: #0d0a08; border-radius: 6px; border: 1px solid #332418; }
        .ui-piano-key { width: 44px; height: 62px; background: #eaeaf0; color: #111; border: 1px solid #444; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 4px; cursor: pointer; border-radius: 0 0 5px 5px; user-select: none; flex-shrink: 0; }
        .ui-piano-key span.name { font-size: 12px; font-weight: bold; }
        .ui-piano-key span.sub { font-size: 9px; opacity: 0.7; }
        .ui-piano-key:active, .ui-piano-key.playing { background: #f2a900 !important; color: #0f0c08 !important; }

        .bar-tabs { display: flex; gap: 3px; align-items: center; margin: 8px 0; flex-wrap: wrap; }
        .bar-tab-btn { background: #221912; color: #b89b82; border: 1px solid #4a3520; width: 28px; height: 28px; border-radius: 4px; font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .bar-tab-btn.active { background: #f2a900; color: #0f0c08; font-weight: bold; }

        .grid-9-steps { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; margin-top: 4px; }
        .step-cell-img { background: #221912; height: 40px; text-align: center; font-size: 11px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; border-radius: 4px; user-select: none; color: #8c735e; border: 1px solid #38291e; }
        .step-cell-img.active { background: #f2a900; color: #0f0c08; font-weight: bold; border-color: #ffe066; }
        .step-cell-img.current-playing { border: 2px solid #fff !important; transform: scale(1.04); }

        .flex { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .summary-box { background: #0d0a08; padding: 10px; border-radius: 8px; font-size: 11px; margin-top: 8px; color: #b89b82; border: 1px solid #332418; max-height: 100px; overflow-y: auto; }
    </style>
</head>
<body>

    <h1>🎛️🎶 ULTIMATE MASTER DAW v33.6 (画像完全再現UI・36小節展開)</h1>

    <!-- 1. マスター＆テンポコントロール -->
    <div class="section" style="border: 2px solid #f2a900;">
        <h2>🎛️ 1. マスター再生・全体録音CRERA・36小節管理</h2>
        <div class="flex">
            <button onclick="masterPlay()" style="font-size: 13px;">▶ 再生</button>
            <button onclick="masterStop()" style="font-size: 13px;">⏹ 停止</button>
            <button class="record-btn" onclick="toggleMasterRecording()" id="masterRecBtn">🔴 全体ミックス一括録音</button>
            <button class="clear-btn" onclick="masterClear()">🗑 全曲CRERA(全クリア)</button>
            <button class="preview-btn" onclick="previewMaster()">▶ 試聴</button>
            <label><input type="checkbox" id="repeatToggle" checked> ループ</label>
            <span>BPM: <input type="number" id="bpmInput" value="120" min="50" max="240" style="width: 50px;"></span>
        </div>
        <div class="flex" style="margin-top: 8px; border-top: 1px dashed #3d2c1e; padding-top: 8px;">
            <span>マスター音量: <input type="range" min="0" max="1.5" step="0.05" value="1.0" id="masterVolumeControl" style="width: 70px;" onchange="updateMasterVolume(this.value)"></span>
            <button onclick="saveProjectToList()">💾 現在の曲をリスト保存</button>
            <button onclick="exportProjectFileTransfer()">📤 ファイル転送用JSON書出</button>
            <span>アルバムテンプレ: 
                <select id="albumTemplateSelect" onchange="loadAlbumTemplate(this.value)">
                    <option value="">-- 20アルバムテンプレート選択 --</option>
                </select>
            </span>
        </div>
        <div style="margin-top: 5px;"><audio id="masterAudio" controls style="height: 32px; width: 100%;"></audio></div>
        <div id="compositionListContainer" class="summary-box">保存プロジェクトリストはありません。</div>
    </div>

    <!-- 2. AI作詞＆ボーカル録音CRERAスタジオ -->
    <div class="section" style="border: 2px solid #a62b14;">
        <h2>🧢 2. AI作詞 ＆ ボーカル録音 (CRERA機能付き)</h2>
        <div class="flex">
            <span>テーマ: </span>
            <select id="lyricThemeSelect">
                <option value="season">四季・シーズン</option>
                <option value="love">恋・情熱</option>
                <option value="dream">夢・希望</option>
                <option value="youth">青春・時唄</option>
            </select>
            <button onclick="generateAiLyrics()" style="background: linear-gradient(135deg, #ff4500, #ff8c00); color: #fff;">🤖 AI歌詞自動作成</button>
            <button class="record-btn" onclick="startVocalRecording()">🔴 ボーカル録音</button>
            <button onclick="stopVocalRecording()">⏹ 停止</button>
            <button class="preview-btn" onclick="playVocal()">▶ 試聴</button>
            <button class="clear-btn" onclick="clearVocal()">🗑 ボーカルCRERA</button>
        </div>
        <div style="margin-top: 8px;"><textarea id="lyricTextArea" placeholder="【AIフルストーリー歌詞...】"></textarea></div>
        <div style="margin-top: 3px;"><audio id="vocalAudio" controls style="height: 28px; width: 100%;"></audio></div>
    </div>

    <!-- 3. プロ・リリース & 著作権認可共有スタジオ -->
    <div class="section" style="border: 2px solid #8a2be2;">
        <h2>💎 3. 著作権取得 (MICVICTORY) & リリース・共有</h2>
        <div class="flex">
            <button class="release-btn" onclick="executeProRelease()">🚀 20アルバム一括リリース・著作権登録</button>
            <button onclick="exportProjectJSON()">💾 プロジェクト保存</button>
            <button onclick="document.getElementById('importJsonFile').click()">📂 読込</button>
            <input type="file" id="importJsonFile" style="display:none" onchange="importProjectJSON(event)">
            <button class="preview-btn" onclick="openConcertMode()">🎤 コンサート音源シェア</button>
        </div>
        <div id="releaseStatusBox" class="summary-box" style="color: #da70d6;">ステータス: 未リリース (準備完了)</div>
    </div>

    <!-- 各楽器トラック管理コンテナ（画像UI完全準拠） -->
    <div id="tracksContainer"></div>

    <script>
        const TOTAL_STEPS = 36; // 18小節 + 新たに18小節（計36ステップ等価）
        const instruments = [
            { id: 'drums', name: '🥁 超リアル・プロドラムキット (20パターン＋AI/手動/CRERA)', type: 'drums' },
            { id: 'bass', name: '🎸 ウルトラ重低音サブベース (普通チューン＋AI/手動/CRERA)', type: 'bass' },
            { id: 'guitar', name: '🪵 エレキギター音(20パターン) ＋ 木目ギター音 (CRERA付き)', type: 'guitar' },
            { id: 'piano', name: '🎹 ピアノ (イイ奴プロ上質音) ＋ AIランダム切替', type: 'melody' },
            { id: 'harmony', name: '🎶 ハーモニーカ (3度上ハモり対応)', type: 'melody' },
            { id: 'violin', name: '🎻 バイオリン (AIランダム切替)', type: 'melody' },
            { id: 'synth', name: '🎛️ シンセサイザー (AIランダム切替)', type: 'melody' },
            { id: 'chords', name: '🎼 コード (アルペジオ/カッティング/リフ/エアー 20種AI/手動/編集/CRERA)', type: 'chords' }
        ];

        const solfaNotes = [
            { name: 'ド', sub: 'C4', freq: 261.63 }, { name: 'レ', sub: 'D4', freq: 293.66 },
            { name: 'ミ', sub: 'E4', freq: 329.63 }, { name: 'ファ', sub: 'F4', freq: 349.23 },
            { name: 'ソ', sub: 'G4', freq: 392.00 }, { name: 'ラ', sub: 'A4', freq: 440.00 },
            { name: 'シ', sub: 'B4', freq: 493.88 }, { name: 'ド', sub: 'C5', freq: 523.25 }
        ];

        const drumNotes = [
            { name: 'Kick', sub: '重低音' }, { name: 'Snare', sub: 'スタジアム' },
            { name: 'Hi-Hat', sub: 'クリア' }, { name: 'Crash', sub: 'クラッシュ' }
        ];

        let songData = {
            title: 'マイソング 01 (UI版)',
            trackData: {},
            trackNotes: {},
            trackGate: {},
            activeBarBlock: {}, // 0: bar1-9, 1: bar10-18, 2: bar19-27, 3: bar28-36
            recStepCursor: {},
            selectedGate: {}
        };

        let savedProjects = [];
        let audioCtx = null, masterGainNode = null, compressorNode = null, masterDestNode = null;
        let isPlaying = false, currentTimer = null;
        let mediaRecorder, recordedChunks = [], vocalAudioBlob = null;
        let masterMediaRecorder, masterRecordedChunks = [], masterAudioBlob = null, isMasterRecording = false;

        function initApp() {
            instruments.forEach(inst => {
                songData.trackData[inst.id] = new Array(TOTAL_STEPS).fill(false);
                songData.trackNotes[inst.id] = new Array(TOTAL_STEPS).fill(0);
                songData.trackGate[inst.id] = new Array(TOTAL_STEPS).fill(0.4);
                songData.activeBarBlock[inst.id] = 0;
                songData.recStepCursor[inst.id] = 0;
                songData.selectedGate[inst.id] = 0.4;
            });
            initAlbumTemplates();
            renderTracks();
        }

        function initAlbumTemplates() {
            const sel = document.getElementById('albumTemplateSelect');
            sel.innerHTML = '<option value="">-- 20アルバムテンプレート選択 --</option>';
            for(let i=1; i<=20; i++) {
                let opt = document.createElement('option');
                opt.value = i;
                opt.innerText = `アルバム #${i} : MICVICTORYコレクション`;
                sel.appendChild(opt);
            }
        }

        function loadAlbumTemplate(num) {
            if(!num) return;
            applyPatternPreset('drums', (num * 3) % 20);
            applyPatternPreset('bass', (num * 2) % 20);
            applyPatternPreset('chords', (num * 1) % 20);
            aiRandomMelody('piano');
            aiRandomMelody('violin');
            aiRandomMelody('synth');
            applyHarmonyPattern();
            generateAiLyrics();
            alert(`アルバム #${num} の全音源・コード・ハーモニー・AIパターン一括を読み込みました！`);
        }

        function renderTracks() {
            const container = document.getElementById('tracksContainer');
            container.innerHTML = '';

            instruments.forEach(inst => {
                const div = document.createElement('div');
                div.className = 'section';

                // 画像UI①AIパターン一括生成(20種類)生成HTML
                let ai20HTML = '';
                for(let p=1; p<=20; p++) {
                    ai20HTML += `<button class="ai-slot-btn" onclick="applyPatternPreset('${inst.id}', ${p-1})">#${p}</button>`;
                }

                // 画像UI②音長選択ボタン群
                div.innerHTML = `
                    <h3>${inst.name}</h3>
                    <div style="font-size:11px; color:#f2a900; margin-bottom:4px;">🤖 AI パターン一括生成 (20種類):</div>
                    <div class="ai-20-grid">${ai20HTML}</div>

                    <div class="gate-selector-bar">
                        <span>音長:</span>
                        <button class="gate-btn ${songData.selectedGate[inst.id]===0.15?'active':''}" onclick="setGateUI('${inst.id}', 0.15, this)">極短</button>
                        <button class="gate-btn ${songData.selectedGate[inst.id]===0.4?'active':''}" onclick="setGateUI('${inst.id}', 0.4, this)">標準</button>
                        <button class="gate-btn ${songData.selectedGate[inst.id]===0.7?'active':''}" onclick="setGateUI('${inst.id}', 0.7, this)">長め</button>
                        <button class="gate-btn ${songData.selectedGate[inst.id]===1.2?'active':''}" onclick="setGateUI('${inst.id}', 1.2, this)">超長</button>
                        <button class="preview-btn" onclick="playTrackPreview('${inst.id}')" style="margin-left:auto;">▶ トラック試聴</button>
                        <button class="clear-btn" onclick="clearTrack('${inst.id}')">🗑 CRERA(個別クリア)</button>
                    </div>

                    <div style="font-size:10px; color:#b89b82;">② 鍵盤押しでリアルタイム連打記録（自動カーソル循環） or グリッド単体クリック編集・CRERA:</div>
                    <div class="ui-piano-kb" id="kb-${inst.id}"></div>

                    <div class="bar-tabs" id="tabs-${inst.id}">
                        <span>小節選択:</span>
                        <button class="bar-tab-btn ${songData.activeBarBlock[inst.id]===0?'active':''}" onclick="setBarBlock('${inst.id}', 0)">1</button>
                        <button class="bar-tab-btn ${songData.activeBarBlock[inst.id]===1?'active':''}" onclick="setBarBlock('${inst.id}', 1)">2</button>
                        <button class="bar-tab-btn ${songData.activeBarBlock[inst.id]===2?'active':''}" onclick="setBarBlock('${inst.id}', 2)">3</button>
                        <button class="bar-tab-btn ${songData.activeBarBlock[inst.id]===3?'active':''}" onclick="setBarBlock('${inst.id}', 3)">4</button>
                        <span style="font-size:10px; color:#f2a900; margin-left:6px;" id="block-label-${inst.id}">表示中: 1～9小節 (前18/後18拡張対応)</span>
                    </div>
                    <div class="grid-9-steps" id="grid-${inst.id}"></div>
                `;
                container.appendChild(div);
                renderKeyboard(inst);
                renderGrid(inst.id);
            });
        }

        function setGateUI(id, val, btnEl) {
            songData.selectedGate[id] = val;
            let bar = btnEl.parentElement;
            bar.querySelectorAll('.gate-btn').forEach(b => b.classList.remove('active'));
            btnEl.classList.add('active');
        }

        function setBarBlock(id, blockIndex) {
            songData.activeBarBlock[id] = blockIndex;
            renderGrid(id);
        }

        function applyPatternPreset(id, idx) {
            let tData = songData.trackData[id], tNotes = songData.trackNotes[id];
            tData.fill(false);
            for(let i=0; i<TOTAL_STEPS; i++) {
                if((i + idx) % 2 === 0 || (id==='drums' && i%4===2)) {
                    tData[i] = true;
                    tNotes[i] = (i + idx) % ((id==='drums'||id==='guitar')?4:8);
                }
            }
            renderGrid(id);
        }

        function aiRandomMelody(id) {
            let tData = songData.trackData[id], tNotes = songData.trackNotes[id];
            tData.fill(false);
            for(let i=0; i<TOTAL_STEPS; i++) {
                if(Math.random() > 0.4) {
                    tData[i] = true;
                    tNotes[i] = Math.floor(Math.random() * 8);
                }
            }
            renderGrid(id);
        }

        function applyHarmonyPattern() {
            let tData = songData.trackData['harmony'], tNotes = songData.trackNotes['harmony'];
            let pianoNotes = songData.trackNotes['piano'];
            tData.fill(false);
            for(let i=0; i<TOTAL_STEPS; i++) {
                if(songData.trackData['piano'][i]) {
                    tData[i] = true;
                    tNotes[i] = (pianoNotes[i] + 2) % 8;
                }
            }
            renderGrid('harmony');
        }

        function renderKeyboard(inst) {
            const kb = document.getElementById(`kb-${inst.id}`);
            if(!kb) return;
            kb.innerHTML = '';
            let items = (inst.type === 'drums' || inst.id === 'guitar') ? drumNotes : solfaNotes;
            items.forEach((item, idx) => {
                const key = document.createElement('div');
                key.className = 'ui-piano-key';
                key.innerHTML = `<span class="name">${item.name}</span><span class="sub">${item.sub}</span>`;
                key.onmousedown = () => {
                    key.classList.add('playing');
                    let gateVal = songData.selectedGate[inst.id] || 0.4;
                    playNote(inst.id, idx, gateVal);
                    setTimeout(() => key.classList.remove('playing'), 200);

                    let tData = songData.trackData[inst.id];
                    let tNotes = songData.trackNotes[inst.id];
                    let tGate = songData.trackGate[inst.id];
                    let cur = songData.recStepCursor[inst.id] || 0;
                    tData[cur] = true;
                    tNotes[cur] = idx;
                    tGate[cur] = gateVal;
                    renderGrid(inst.id);
                    songData.recStepCursor[inst.id] = (cur + 1) % TOTAL_STEPS;
                };
                kb.appendChild(key);
            });
        }

        function renderGrid(id) {
            const grid = document.getElementById(`grid-${id}`);
            const blockLabel = document.getElementById(`block-label-${id}`);
            const tabContainer = document.getElementById(`tabs-${id}`);
            if(!grid) return;
            grid.innerHTML = '';

            let block = songData.activeBarBlock[id] || 0;
            // 36ステップを9ステップ×4ブロック（画像UI画像下段の1-9グリッド表現踏襲）表示
            let startStep = block * 9;
            if(blockLabel) {
                let rangeText = block === 0 ? '1～9小節相当ステップ' : (block === 1 ? '10～18小節相当ステップ' : (block === 2 ? '19～27小節相当ステップ' : '28～36小節相当ステップ'));
                blockLabel.innerText = `表示中: ${rangeText}`;
            }

            // タブアクティブ更新
            if(tabContainer) {
                tabContainer.querySelectorAll('.bar-tab-btn').forEach((btn, bidx) => {
                    btn.classList.toggle('active', bidx === block);
                });
            }

            let tData = songData.trackData[id], tNotes = songData.trackNotes[id], tGate = songData.trackGate[id], instObj = instruments.find(i => i.id === id);

            for (let s = 0; s < 9; s++) {
                let i = startStep + s;
                const cell = document.createElement('div');
                cell.className = `step-cell-img ${tData[i] ? 'active' : ''}`;
                cell.id = `cell-${id}-${i}`;
                let label = tData[i] ? ((instObj.type === 'drums' || id === 'guitar') ? drumNotes[tNotes[i]].name : solfaNotes[tNotes[i]].name) : '';
                cell.innerHTML = `<span>#${i+1}</span><span style="font-size:7px; color:#f2a900;">${label}</span>`;
                cell.onclick = () => {
                    let maxN = (instObj.type === 'drums' || id === 'guitar') ? 4 : 8;
                    if(!tData[i]) {
                        tData[i] = true; tNotes[i] = 0; tGate[i] = songData.selectedGate[id] || 0.4;
                    } else {
                        tNotes[i] = (tNotes[i] + 1) % maxN;
                        if(tNotes[i] === 0) { tData[i] = false; }
                    }
                    renderGrid(id);
                };
                grid.appendChild(cell);
            }
        }

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                masterGainNode = audioCtx.createGain();
                masterGainNode.gain.value = parseFloat(document.getElementById('masterVolumeControl').value);
                compressorNode = audioCtx.createDynamicsCompressor();
                compressorNode.threshold.setValueAtTime(-14, audioCtx.currentTime);
                compressorNode.ratio.setValueAtTime(4, audioCtx.currentTime);
                masterDestNode = audioCtx.createMediaStreamDestination();
                compressorNode.connect(masterGainNode);
                masterGainNode.connect(audioCtx.destination);
                masterGainNode.connect(masterDestNode);
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function updateMasterVolume(v) { if(masterGainNode && audioCtx) masterGainNode.gain.setValueAtTime(parseFloat(v), audioCtx.currentTime); }

        function playNote(instId, noteIndex, gate = 0.4) {
            const ctx = getAudioContext();
            const now = ctx.currentTime;
            const gain = ctx.createGain();
            gain.connect(compressorNode);
            let duration = Math.max(gate, 0.12);
            let releaseTail = 0.18;

            if (instId === 'drums') {
                gain.gain.setValueAtTime(0.85, now);
                const osc = ctx.createOscillator();
                osc.type = noteIndex === 0 ? 'sine' : 'triangle';
                osc.frequency.setValueAtTime(noteIndex===0?140:220, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
                osc.connect(gain); osc.start(now); osc.stop(now + duration + releaseTail);
                return;
            }

            let freq = solfaNotes[noteIndex % solfaNotes.length].freq;
            gain.gain.setValueAtTime(0.01, now);
            gain.gain.linearRampToValueAtTime(0.45, now + 0.02);
            const osc = ctx.createOscillator();
            osc.type = (instId === 'piano') ? 'triangle' : 'sawtooth';
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(0.45, now + duration * 0.7);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + duration + releaseTail);
            osc.connect(gain); osc.start(now); osc.stop(now + duration + releaseTail + 0.05);
        }

        function clearTrack(id) {
            songData.trackData[id].fill(false);
            songData.trackNotes[id].fill(0);
            songData.recStepCursor[id] = 0;
            renderGrid(id);
            alert(`🗑 ${id} トラックをCRERAクリアしました！`);
        }

        function clearVocal() {
            vocalAudioBlob = null;
            recordedChunks = [];
            document.getElementById('vocalAudio').src = '';
            document.getElementById('vocalAudio').load();
            alert('🗑 ボーカル録音をCRERA(クリア)しました！');
        }

        function playTrackPreview(id) {
            let step = 0, interval = (60 / document.getElementById('bpmInput').value) * 500;
            let tData = songData.trackData[id], tNotes = songData.trackNotes[id], tGate = songData.trackGate[id];
            const timer = setInterval(() => {
                if(tData[step]) playNote(id, tNotes[step], tGate[step]);
                step++;
                if(step >= TOTAL_STEPS) clearInterval(timer);
            }, interval);
        }

        function masterPlay() {
            if (isPlaying) return;
            isPlaying = true;
            let currentStep = 0;
            let interval = (60 / document.getElementById('bpmInput').value) * 500;
            let tData = songData.trackData, tNotes = songData.trackNotes, tGate = songData.trackGate;

            currentTimer = setInterval(() => {
                instruments.forEach(inst => {
                    const cell = document.getElementById(`cell-${inst.id}-${currentStep}`);
                    if (cell) { cell.classList.add('current-playing'); setTimeout(() => cell.classList.remove('current-playing'), interval * 0.9); }
                });

                Object.keys(tData).forEach(id => {
                    if (tData[id][currentStep]) playNote(id, tNotes[id][currentStep], tGate[id][currentStep]);
                });

                currentStep++;
                if (currentStep >= TOTAL_STEPS) {
                    currentStep = 0;
                    if (!document.getElementById('repeatToggle').checked) masterStop();
                }
            }, interval);
        }

        function masterStop() { isPlaying = false; if (currentTimer) { clearInterval(currentTimer); currentTimer = null; } }
        function masterClear() { masterStop(); instruments.forEach(inst => clearTrack(inst.id)); document.getElementById('lyricTextArea').value = ''; alert('全曲CRERA実行完了！'); }
        function previewMaster() { masterPlay(); }

        function saveProjectToList() {
            const name = prompt('保存するプロジェクト名:', songData.title);
            if (!name) return;
            songData.title = name;
            savedProjects.push(JSON.parse(JSON.stringify(songData)));
            updateProjectListUI();
            alert(`「${name}」保存完了！`);
        }

        function updateProjectListUI() {
            const container = document.getElementById('compositionListContainer');
            if (savedProjects.length === 0) { container.innerHTML = '保存されたプロジェクトリストなし'; return; }
            let html = '<b>📁 保存済みプロジェクト:</b><ul>';
            savedProjects.forEach((proj, idx) => {
                html += `<li><b>${proj.title}</b> <button onclick="loadProject(${idx})" style="padding:2px 6px; font-size:10px;">読込</button></li>`;
            });
            html += '</ul>';
            container.innerHTML = html;
        }

        function loadProject(idx) {
            songData = JSON.parse(JSON.stringify(savedProjects[idx]));
            renderTracks();
            alert(`読込成功！`);
        }

        function toggleMasterRecording() {
            if (!isMasterRecording) {
                masterRecordedChunks = [];
                try {
                    getAudioContext();
                    masterMediaRecorder = new MediaRecorder(masterDestNode.stream);
                    masterMediaRecorder.ondataavailable = e => { if (e.data.size > 0) masterRecordedChunks.push(e.data); };
                    masterMediaRecorder.onstop = () => {
                        masterAudioBlob = new Blob(masterRecordedChunks, { type: 'audio/webm' });
                        document.getElementById('masterAudio').src = URL.createObjectURL(masterAudioBlob);
                    };
                    masterMediaRecorder.start();
                    isMasterRecording = true;
                    document.getElementById('masterRecBtn').innerText = '⏹ 一括録音停止';
                    masterPlay();
                    alert('🔴 一括録音開始！');
                } catch(e) { alert('録音失敗'); }
            } else {
                if (masterMediaRecorder) masterMediaRecorder.stop();
                masterStop();
                isMasterRecording = false;
                document.getElementById('masterRecBtn').innerText = '🔴 全体ミックス一括録音';
                alert('一括録音完了！');
            }
        }

        function generateAiLyrics() {
            const theme = document.getElementById('lyricThemeSelect').value;
            document.getElementById('lyricTextArea').value = `【AIストーリー・${theme}】\n36小節のビートにドレミファ鍵盤と上質音色が重なる。`;
            alert('AI歌詞生成完了！');
        }

        async function startVocalRecording() {
            recordedChunks = [];
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    vocalAudioBlob = new Blob(recordedChunks, { type: 'audio/webm' });
                    document.getElementById('vocalAudio').src = URL.createObjectURL(vocalAudioBlob);
                };
                mediaRecorder.start();
                alert('🎙️ ボーカル録音中...');
            } catch(e) { alert('マイクアクセス拒否'); }
        }

        function stopVocalRecording() { if (mediaRecorder) mediaRecorder.stop(); }
        function playVocal() { const aud = document.getElementById('vocalAudio'); if(aud.src) aud.play(); }

        function executeProRelease() {
            document.getElementById('releaseStatusBox').innerHTML = `✨ <strong>MICVICTORY 著作権取得完了 & リリース成功！</strong>`;
            alert('🎉 リリース＆著作権登録完了！');
        }

        function exportProjectJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(songData, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr); dlAnchor.setAttribute("download", "daw_ui_project.json");
            document.body.appendChild(dlAnchor); dlAnchor.click(); dlAnchor.remove();
        }

        function exportProjectFileTransfer() {
            const transferPayload = { version: "v33.6-ui", songData: songData };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(transferPayload, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr); dlAnchor.setAttribute("download", `transfer_${songData.title.replace(/\s+/g, '_')}.dawtransfer.json`);
            document.body.appendChild(dlAnchor); dlAnchor.click(); dlAnchor.remove();
            alert('📤 転送用JSON出力完了！');
        }

        function importProjectJSON(e) {
            const reader = new FileReader();
            if (e.target.files[0]) {
                reader.readAsText(e.target.files[0], "UTF-8");
                reader.onload = event => {
                    try {
                        let parsed = JSON.parse(event.target.result);
                        songData = parsed.songData || parsed;
                        renderTracks();
                        alert('ファイル読込成功！');
                    } catch(err) { alert('読込失敗'); }
                };
            }
        }

        function openConcertMode() { alert('🎤 コンサート音源シェア準備完了'); }

        window.onload = initApp;
    </script>
</body>
