<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULTIMATE MASTER DAW v31.0 - PRO RELEASE & ADVANCED AUDIO ENGINE</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #070605; color: #f5f0e6; margin: 0; padding: 15px; }
        h1, h2, h3 { color: #f2a900; border-bottom: 1px solid #3d2c1e; padding-bottom: 6px; margin: 8px 0; letter-spacing: 1px; }
        .section { background: #15110d; padding: 12px 18px; margin-bottom: 12px; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.8); border: 1px solid #4a3520; }
        button { background: linear-gradient(135deg, #f2a900, #c67d00); color: #0f0c08; border: none; padding: 7px 14px; margin: 3px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 11px; transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.4); }
        button:hover { background: linear-gradient(135deg, #ffc233, #f2a900); transform: translateY(-1px); }
        button.record-btn { background: linear-gradient(135deg, #a62b14, #661505); color: #fff; }
        button.clear-btn { background: linear-gradient(135deg, #592015, #36120b); color: #f5f0e6; }
        button.preview-btn { background: linear-gradient(135deg, #205030, #103020); color: #fff; }
        button.release-btn { background: linear-gradient(135deg, #8a2be2, #4b0082); color: #fff; font-size: 12px; }
        
        select, input, textarea { background: #221912; color: #f5f0e6; border: 1px solid #594028; padding: 6px; border-radius: 6px; margin: 3px; font-size: 11px; outline: none; font-family: inherit; }
        textarea { width: 100%; height: 50px; resize: vertical; box-sizing: border-box; }
        
        .grid-18 { display: grid; grid-template-columns: repeat(18, 1fr); gap: 3px; margin-top: 6px; overflow-x: auto; }
        .step-cell { background: #221912; height: 32px; text-align: center; font-size: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; border-radius: 4px; user-select: none; color: #8c735e; border: 1px solid #38291e; }
        .step-cell.active { background: #f2a900; color: #0f0c08; font-weight: bold; border-color: #ffe066; box-shadow: 0 0 8px rgba(242,169,0,0.6); }
        .step-cell.current-playing { border: 2px solid #fff !important; transform: scale(1.05); }
        
        .flex { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .summary-box { background: #0d0a08; padding: 10px; border-radius: 8px; font-size: 11px; margin-top: 8px; color: #b89b82; border: 1px solid #332418; max-height: 110px; overflow-y: auto; }
        .instrument-keyboard { display: flex; gap: 3px; margin-top: 8px; overflow-x: auto; padding: 6px; background: #0d0a08; border-radius: 6px; border: 1px solid #332418; }
        .doremi-key { width: 40px; height: 50px; background: #eaeaf0; color: #111; border: 1px solid #444; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 4px; font-size: 10px; font-weight: bold; cursor: pointer; border-radius: 0 0 4px 4px; user-select: none; }
        .doremi-key:active, .doremi-key.playing { background: #f2a900 !important; color: #0f0c08 !important; }
    </style>
</head>
<body>

    <h1>🎛️🎶 ULTIMATE MASTER DAW v31.0 (高音質音響エンジン & 一括ミックス録音強化)</h1>

    <!-- 1. マスター＆テンポコントロール -->
    <div class="section" style="border: 2px solid #f2a900;">
        <h2>🎛️ 1. マスター・テンポコントロール & 高音質音響ミキサー</h2>
        <div class="flex">
            <button onclick="masterPlay()" style="font-size: 13px;">▶ 再生</button>
            <button onclick="masterStop()" style="font-size: 13px;">⏹ 停止</button>
            <button class="record-btn" onclick="toggleMasterRecording()" id="masterRecBtn">🔴 全体ミックス一括録音</button>
            <button class="clear-btn" onclick="masterClear()">🗑 全曲Clear</button>
            <button class="preview-btn" onclick="previewMaster()">▶ 試聴</button>
            <label><input type="checkbox" id="repeatToggle" checked> ループ</label>
            <span>BPM: <input type="number" id="bpmInput" value="120" min="50" max="240" style="width: 50px;"></span>
            <span>起点小節: <select id="startBarSelect"><option value="0">第1小節から</option><option value="4">第5小節から</option></select></span>
        </div>
        <div class="flex" style="margin-top: 8px; border-top: 1px dashed #3d2c1e; padding-top: 8px;">
            <span>マスター音量: <input type="range" min="0" max="1.5" step="0.05" value="1.0" id="masterVolumeControl" style="width: 70px;" onchange="updateMasterVolume(this.value)"></span>
            <span>アルバムテンプレ: 
                <select id="albumTemplateSelect" onchange="loadAlbumTemplate(this.value)">
                    <option value="">-- 20アルバムテンプレート選択 --</option>
                </select>
            </span>
        </div>
        <div style="margin-top: 5px;"><audio id="masterAudio" controls style="height: 32px; width: 100%;"></audio></div>
        <div id="compositionListContainer" class="summary-box">保存プロジェクトリストはありません。</div>
    </div>

    <!-- 2. AI作詞＆ラップボーイ＆弾き語りスタジオ -->
    <div class="section" style="border: 2px solid #a62b14;">
        <h2>🧢 2. AI作詞 (シーズン・恋・夢・青春) & ボーカル録音</h2>
        <div class="flex">
            <span>テーマ: </span>
            <select id="lyricThemeSelect">
                <option value="season">四季・シーズン</option>
                <option value="love">恋・情熱</option>
                <option value="dream">夢・希望</option>
                <option value="youth">青春・時唄</option>
            </select>
            <button onclick="generateAiLyrics()" style="background: linear-gradient(135deg, #ff4500, #ff8c00); color: #fff;">🤖 AI歌詞自動作成</button>
            <button class="record-btn" onclick="startVocalRecording()">🔴 ボーカル録音</button>
            <button onclick="stopVocalRecording()">⏹ 停止</button>
            <button class="preview-btn" onclick="playVocal()">▶ 試聴</button>
        </div>
        <div style="margin-top: 8px;"><textarea id="lyricTextArea" placeholder="AI歌詞や自作の歌詞・ラップを入力..."></textarea></div>
        <div style="margin-top: 3px;"><audio id="vocalAudio" controls style="height: 28px; width: 100%;"></audio></div>
    </div>

    <!-- 3. プロ・リリース & 著作権認可共有スタジオ -->
    <div class="section" style="border: 2px solid #8a2be2;">
        <h2>💎 3. 著作権取得 (MICVICTORY) & リリース・共有</h2>
        <div class="flex">
            <button class="release-btn" onclick="executeProRelease()">🚀 20アルバム一括リリース・著作権登録</button>
            <button onclick="exportProjectJSON()">💾 プロジェクト保存</button>
            <button onclick="document.getElementById('importJsonFile').click()">📂 読込</button>
            <input type="file" id="importJsonFile" style="display:none" onchange="importProjectJSON(event)">
            <button class="preview-btn" onclick="openConcertMode()">🎤 コンサート音源シェア</button>
        </div>
        <div id="releaseStatusBox" class="summary-box" style="color: #da70d6;">ステータス: 未リリース (アルバム作成・著作権取得準備完了)</div>
    </div>

    <!-- 各楽器トラック管理用コンテナ -->
    <div id="tracksContainer"></div>

    <script>
        const instruments = [
            { id: 'drums', name: '🥁 高音質ドラムキット (20パターン)', type: 'drums' },
            { id: 'bass', name: '🎸 メジャーベース (20パターン)', type: 'bass' },
            { id: 'guitar', name: '🪵 ギター木目・打楽器パーカッション', type: 'guitar' },
            { id: 'piano', name: '🎹 ピアノ & 伴奏AI', type: 'melody' },
            { id: 'violin', name: '🎻 バイオリン (AIメロディ)', type: 'melody' },
            { id: 'synth', name: '🎛️ シンセサイザー', type: 'melody' }
        ];

        const solfaNotes = [
            { name: 'ド', freq: 261.63 }, { name: 'レ', freq: 293.66 }, { name: 'ミ', freq: 329.63 }, { name: 'ファ', freq: 349.23 },
            { name: 'ソ', freq: 392.00 }, { name: 'ラ', freq: 440.00 }, { name: 'シ', freq: 493.88 }, { name: '高ド', freq: 523.25 }
        ];

        const drumNotes = [
            { name: 'プロKick' }, { name: 'スタジアムSnare' }, { name: 'クリアHi-Hat' }, { name: '木目パーカッション' }
        ];

        let songData = {
            title: 'マイソング 01',
            trackData: {},
            trackNotes: {},
            inputModes: {},
            trackFx: {}
        };

        let audioCtx = null, masterGainNode = null, compressorNode = null, masterDestNode = null;
        let isPlaying = false, currentTimer = null;
        let mediaRecorder, recordedChunks = [], vocalAudioBlob = null;
        let masterMediaRecorder, masterRecordedChunks = [], masterAudioBlob = null, isMasterRecording = false;

        function initApp() {
            instruments.forEach(inst => {
                songData.trackData[inst.id] = new Array(18).fill(false);
                songData.trackNotes[inst.id] = new Array(18).fill(0);
                songData.inputModes[inst.id] = 'manual';
                songData.trackFx[inst.id] = 'normal';
            });
            initAlbumTemplates();
            renderTracks();
        }

        function initAlbumTemplates() {
            const sel = document.getElementById('albumTemplateSelect');
            for(let i=1; i<=20; i++) {
                let opt = document.createElement('option');
                opt.value = i;
                opt.innerText = `アルバム #${i} : MICVICTORYコレクション`;
                sel.appendChild(opt);
            }
        }

        function loadAlbumTemplate(num) {
            if(!num) return;
            applyDrumPattern((num * 3) % 20);
            applyBassPattern((num * 2) % 20);
            autoGenerateMelody('piano');
            autoGenerateMelody('violin');
            document.getElementById('lyricTextArea').value = `【アルバム #${num} 特製歌詞】\n未来へ続く光のステージへ\n今こそ走り出そう！`;
            alert(`アルバム #${num} の全音源と歌詞テンプレートを読み込みました！`);
        }

        function renderTracks() {
            const container = document.getElementById('tracksContainer');
            container.innerHTML = '';

            instruments.forEach(inst => {
                const div = document.createElement('div');
                div.className = 'section';
                let currentMode = songData.inputModes[inst.id];
                let currentFx = songData.trackFx[inst.id];

                let patternHTML = '';
                if (inst.id === 'drums') {
                    let opts = ''; for(let p=1; p<=20; p++) opts += `<option value="${p-1}">ドラム #${p}</option>`;
                    patternHTML = `<span>パターン:</span> <select onchange="applyDrumPattern(this.value)">${opts}</select>`;
                } else if (inst.id === 'bass') {
                    let opts = ''; for(let p=1; p<=20; p++) opts += `<option value="${p-1}">ベース #${p}</option>`;
                    patternHTML = `<span>パターン:</span> <select onchange="applyBassPattern(this.value)">${opts}</select>`;
                } else if (inst.id === 'guitar') {
                    patternHTML = `<span>演奏法:</span> <select onchange="changeGuitarStyle(this.value)"><option value="cutting">カッティング</option><option value="arpeggio">アルペジオ</option><option value="wood">木目叩き</option></select>`;
                } else {
                    patternHTML = `<span>モード:</span> <select onchange="changeInputMode('${inst.id}', this.value)"><option value="manual" ${currentMode==='manual'?'selected':''}>手動</option><option value="ai" ${currentMode==='ai'?'selected':''}>AI自動</option></select>`;
                }

                div.innerHTML = `
                    <h3>${inst.name}</h3>
                    <div class="flex">
                        ${patternHTML}
                        <span>FX:</span>
                        <select onchange="changeTrackFx('${inst.id}', this.value)"><option value="normal" ${currentFx==='normal'?'selected':''}>Normal</option><option value="reverb" ${currentFx==='reverb'?'selected':''}>リバーブ</option></select>
                        <button class="preview-btn" onclick="playTrackPreview('${inst.id}')">▶ トラック試聴</button>
                        <button class="clear-btn" onclick="clearTrack('${inst.id}')">🗑 Clear</button>
                    </div>
                    <div class="instrument-keyboard" id="kb-${inst.id}"></div>
                    <div class="grid-18" id="grid-${inst.id}"></div>
                `;
                container.appendChild(div);
                renderKeyboard(inst);
                renderGrid(inst.id);
            });
        }

        function changeInputMode(id, mode) { songData.inputModes[id] = mode; if(mode === 'ai') autoGenerateMelody(id); }
        function changeTrackFx(id, fx) { songData.trackFx[id] = fx; }

        function changeGuitarStyle(style) {
            let tData = songData.trackData['guitar'], tNotes = songData.trackNotes['guitar'];
            tData.fill(false);
            for(let i=0; i<18; i++) {
                if(style === 'cutting' && i % 2 === 0) tData[i] = true;
                if(style === 'arpeggio' && i % 4 === 0) tData[i] = true;
                if(style === 'wood' && i % 8 === 0) { tData[i] = true; tNotes[i] = 3; }
            }
            renderGrid('guitar');
        }

        function applyDrumPattern(idx) {
            let tData = songData.trackData['drums'], tNotes = songData.trackNotes['drums'];
            tData.fill(false); let n = parseInt(idx);
            for(let i=0; i<18; i++) { if((i + n) % 2 === 0) { tData[i] = true; tNotes[i] = (i + n) % 4; } }
            renderGrid('drums');
        }

        function applyBassPattern(idx) {
            let tData = songData.trackData['bass'], tNotes = songData.trackNotes['bass'];
            tData.fill(false); let n = parseInt(idx);
            for(let i=0; i<18; i++) { if(i % 3 === 0 || (i + n) % 4 === 0) { tData[i] = true; tNotes[i] = (i + n) % 8; } }
            renderGrid('bass');
        }

        function autoGenerateMelody(id) {
            let tData = songData.trackData[id], tNotes = songData.trackNotes[id];
            tData.fill(false);
            for(let i=0; i<18; i++) { if(i % 2 === 0) { tData[i] = true; tNotes[i] = (i * 3) % 8; } }
            renderGrid(id);
        }

        function renderKeyboard(inst) {
            const kb = document.getElementById(`kb-${inst.id}`);
            kb.innerHTML = '';
            let items = (inst.type === 'drums' || inst.id === 'guitar') ? drumNotes : solfaNotes;
            items.forEach((item, idx) => {
                const key = document.createElement('div');
                key.className = 'doremi-key';
                key.innerHTML = `<span>${item.name}</span>`;
                key.onmousedown = () => { key.classList.add('playing'); playNote(inst.id, idx); setTimeout(() => key.classList.remove('playing'), 200); };
                kb.appendChild(key);
            });
        }

        function renderGrid(id) {
            const grid = document.getElementById(`grid-${id}`);
            if(!grid) return;
            grid.innerHTML = '';
            let tData = songData.trackData[id], tNotes = songData.trackNotes[id], instObj = instruments.find(i => i.id === id);

            for (let i = 0; i < 18; i++) {
                const cell = document.createElement('div');
                cell.className = `step-cell ${tData[i] ? 'active' : ''}`;
                cell.id = `cell-${id}-${i}`;
                let label = tData[i] ? ((instObj.type === 'drums' || id === 'guitar') ? drumNotes[tNotes[i]].name : solfaNotes[tNotes[i]].name) : '';
                cell.innerHTML = `<span>${i+1}</span><span style="font-size:7px;">${label}</span>`;
                cell.onclick = () => {
                    let maxN = (instObj.type === 'drums' || id === 'guitar') ? 4 : 8;
                    if(!tData[i]) { tData[i] = true; tNotes[i] = 0; }
                    else { tNotes[i] = (tNotes[i] + 1) % maxN; if(tNotes[i] === 0) tData[i] = false; }
                    renderGrid(id);
                };
                grid.appendChild(cell);
            }
        }

        // 高音質音響エンジン (Web Audio API ミキサー・コンプレッサー・出力分離)
        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                // マスターボリューム
                masterGainNode = audioCtx.createGain();
                masterGainNode.gain.value = parseFloat(document.getElementById('masterVolumeControl').value);
                
                // ダイナミクスコンプレッサー（音圧・音質最適化）
                compressorNode = audioCtx.createDynamicsCompressor();
                compressorNode.threshold.setValueAtTime(-12, audioCtx.currentTime);
                compressorNode.knee.setValueAtTime(3, audioCtx.currentTime);
                compressorNode.ratio.setValueAtTime(4, audioCtx.currentTime);
                compressorNode.attack.setValueAtTime(0.003, audioCtx.currentTime);
                compressorNode.release.setValueAtTime(0.25, audioCtx.currentTime);

                // 録音用ストリーム出力先
                masterDestNode = audioCtx.createMediaStreamDestination();

                // ルート結線
                compressorNode.connect(masterGainNode);
                masterGainNode.connect(audioCtx.destination);
                masterGainNode.connect(masterDestNode);
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function updateMasterVolume(v) { if(masterGainNode && audioCtx) masterGainNode.gain.setValueAtTime(parseFloat(v), audioCtx.currentTime); }

        function playNote(instId, noteIndex) {
            const ctx = getAudioContext();
            const now = ctx.currentTime;
            const gain = ctx.createGain();
            gain.connect(compressorNode);

            if (instId === 'drums' || instId === 'guitar') {
                gain.gain.setValueAtTime(0.7, now);
                const osc = ctx.createOscillator();
                osc.type = noteIndex === 0 ? 'sine' : (noteIndex === 3 ? 'triangle' : 'square');
                osc.frequency.setValueAtTime(noteIndex === 0 ? 120 : 300, now);
                osc.frequency.exponentialRampToValueAtTime(30, now + 0.15);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.2);
                osc.connect(gain); osc.start(now); osc.stop(now + 0.2);
                return;
            }

            let freq = solfaNotes[noteIndex].freq;
            if (instId === 'bass') freq = freq / 2;
            gain.gain.setValueAtTime(0.45, now);
            const osc = ctx.createOscillator();
            osc.type = instId === 'bass' ? 'triangle' : 'sawtooth';
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);
            osc.connect(gain); osc.start(now); osc.stop(now + 0.4);
        }

        function clearTrack(id) { songData.trackData[id].fill(false); songData.trackNotes[id].fill(0); renderGrid(id); }

        function playTrackPreview(id) {
            let step = 0, interval = (60 / document.getElementById('bpmInput').value) * 500;
            let tData = songData.trackData[id], tNotes = songData.trackNotes[id];
            const timer = setInterval(() => { if(tData[step]) playNote(id, tNotes[step]); step++; if(step >= 18) clearInterval(timer); }, interval);
        }

        function masterPlay() {
            if (isPlaying) return;
            isPlaying = true;
            let currentStep = parseInt(document.getElementById('startBarSelect').value);
            let interval = (60 / document.getElementById('bpmInput').value) * 500;
            let tData = songData.trackData, tNotes = songData.trackNotes;

            currentTimer = setInterval(() => {
                instruments.forEach(inst => {
                    const cell = document.getElementById(`cell-${inst.id}-${currentStep}`);
                    if (cell) { cell.classList.add('current-playing'); setTimeout(() => cell.classList.remove('current-playing'), interval * 0.9); }
                });

                Object.keys(tData).forEach(id => {
                    if (tData[id][currentStep]) playNote(id, tNotes[id][currentStep]);
                });

                currentStep++;
                if (currentStep >= 18) {
                    currentStep = 0;
                    if (!document.getElementById('repeatToggle').checked) masterStop();
                }
            }, interval);
        }

        function masterStop() { isPlaying = false; if (currentTimer) { clearInterval(currentTimer); currentTimer = null; } }
        function masterClear() { masterStop(); instruments.forEach(inst => clearTrack(inst.id)); document.getElementById('lyricTextArea').value = ''; }
        function previewMaster() { masterPlay(); }

        // 全体ミックス一括録音の強化版
        function toggleMasterRecording() {
            if (!isMasterRecording) {
                masterRecordedChunks = [];
                try {
                    getAudioContext(); // 音響コンテキスト初期化
                    masterMediaRecorder = new MediaRecorder(masterDestNode.stream);
                    masterMediaRecorder.ondataavailable = e => { if (e.data.size > 0) masterRecordedChunks.push(e.data); };
                    masterMediaRecorder.onstop = () => {
                        masterAudioBlob = new Blob(masterRecordedChunks, { type: 'audio/webm' });
                        document.getElementById('masterAudio').src = URL.createObjectURL(masterAudioBlob);
                    };
                    masterMediaRecorder.start();
                    isMasterRecording = true;
                    document.getElementById('masterRecBtn').innerText = '⏹ 一括録音停止';
                    masterPlay();
                    alert('🔴 全楽器ミックスのマスター一括録音を開始しました！');
                } catch(e) { alert('録音の開始に失敗しました。'); }
            } else {
                if (masterMediaRecorder) masterMediaRecorder.stop();
                masterStop();
                isMasterRecording = false;
                document.getElementById('masterRecBtn').innerText = '🔴 全体ミックス一括録音';
                alert('全体ミックス一括録音が完了しました！下のオーディオプレイヤーから再生・保存できます。');
            }
        }

        function generateAiLyrics() {
            const theme = document.getElementById('lyricThemeSelect').value;
            const ta = document.getElementById('lyricTextArea');
            if (theme === 'season') ta.value = "【四季応援】春風そよぐステージで 夢を咲かせよう";
            else if (theme === 'love') ta.value = "【情熱の恋】高鳴る鼓動 君と奏でるエターナルメロディ";
            else if (theme === 'dream') ta.value = "【夢の未来】描いた未来へ手を伸ばし光の中へ";
            else ta.value = "【青春の時唄】僕らの足跡は永遠に消えない！";
            alert('AI歌詞を生成しました！');
        }

        async function startVocalRecording() {
            recordedChunks = [];
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    vocalAudioBlob = new Blob(recordedChunks, { type: 'audio/webm' });
                    document.getElementById('vocalAudio').src = URL.createObjectURL(vocalAudioBlob);
                };
                mediaRecorder.start();
                alert('🎙️ ボーカル・弾き語り録音中...');
            } catch(e) { alert('マイクがブロックされています。'); }
        }

        function stopVocalRecording() { if (mediaRecorder) mediaRecorder.stop(); }
        function playVocal() { const aud = document.getElementById('vocalAudio'); if(aud.src) aud.play(); }

        function executeProRelease() {
            document.getElementById('releaseStatusBox').innerHTML = `✨ <strong>MICVICTORY 著作権取得完了 & リリース成功！</strong><br>・高音質ミックス認証完了・全国配信準備完了`;
            alert('🎉 プロ・リリースおよび著作権取得が完了しました！');
        }

        function exportProjectJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(songData, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr); dlAnchor.setAttribute("download", "daw_project.json");
            document.body.appendChild(dlAnchor); dlAnchor.click(); dlAnchor.remove();
        }

        function importProjectJSON(e) {
            const reader = new FileReader();
            if (e.target.files[0]) {
                reader.readAsText(e.target.files[0], "UTF-8");
                reader.onload = event => {
                    try { songData = JSON.parse(event.target.result); renderTracks(); alert('読込成功しました！'); } catch(err) { alert('読込失敗'); }
                };
            }
        }

        function openConcertMode() { alert('🎤 コンサート音源シェアモード: 会場出力用ミックス調整完了'); }

        window.onload = initApp;
    </script>
</body>
</html>
