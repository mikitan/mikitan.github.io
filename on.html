<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULTIMATE MASTER DAW v33.8 - プロ改修版</title>
    <style>
        :root {
            --bg-color: #070605;
            --surface-color: #15110d;
            --surface-alt: #0d0a08;
            --border-color: #4a3520;
            --accent-gold: #f2a900;
            --accent-gold-bright: #ffc233;
            --text-main: #f5f0e6;
            --text-muted: #b89b82;
        }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--bg-color); color: var(--text-main); margin: 0; padding: 15px; }
        h1, h2, h3 { color: var(--accent-gold); border-bottom: 1px solid #3d2c1e; padding-bottom: 6px; margin: 8px 0; letter-spacing: 1px; }
        .section { background: var(--surface-color); padding: 12px 18px; margin-bottom: 12px; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.8); border: 1px solid var(--border-color); }
        button { background: linear-gradient(135deg, #f2a900, #c67d00); color: #0f0c08; border: none; padding: 7px 14px; margin: 3px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 11px; transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.4); }
        button:hover { background: linear-gradient(135deg, var(--accent-gold-bright), #f2a900); transform: translateY(-1px); }
        button.record-btn { background: linear-gradient(135deg, #a62b14, #661505); color: #fff; }
        button.clear-btn { background: linear-gradient(135deg, #592015, #36120b); color: var(--text-main); }
        button.preview-btn { background: linear-gradient(135deg, #205030, #103020); color: #fff; }
        button.ai-btn { background: linear-gradient(135deg, #204080, #102040); color: #fff; }
        button.release-btn { background: linear-gradient(135deg, #8a2be2, #4b0082); color: #fff; font-size: 12px; }
        button.bank-btn { background: linear-gradient(135deg, #2a4736, #16291e); color: #7cfc00; border: 1px solid #3fae49; }
        
        select, input, textarea { background: #221912; color: var(--text-main); border: 1px solid #594028; padding: 6px; border-radius: 6px; margin: 3px; font-size: 11px; outline: none; font-family: inherit; }
        textarea { width: 100%; height: 90px; resize: vertical; box-sizing: border-box; line-height: 1.5; }
        
        .bank-tabs { display: flex; gap: 4px; margin: 6px 0; align-items: center; flex-wrap: wrap; }
        .bank-tab { padding: 5px 12px; background: #221912; border: 1px solid #594028; border-radius: 4px; cursor: pointer; font-size: 10px; color: var(--text-muted); transition: 0.15s; }
        .bank-tab:hover { border-color: var(--accent-gold); }
        .bank-tab.active-bank { background: var(--accent-gold); color: #0f0c08; font-weight: bold; border-color: #ffe066; }

        .grid-18 { display: grid; grid-template-columns: repeat(18, minmax(28px, 1fr)); gap: 3px; margin-top: 6px; overflow-x: auto; padding-bottom: 4px; }
        .step-cell { background: #221912; height: 42px; text-align: center; font-size: 9px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; border-radius: 4px; user-select: none; color: #8c735e; border: 1px solid #38291e; }
        .step-cell.active { background: var(--accent-gold); color: #0f0c08; font-weight: bold; border-color: #ffe066; box-shadow: 0 0 8px rgba(242,169,0,0.6); }
        .step-cell.current-playing { outline: 2px solid #fff !important; transform: scale(1.06); z-index: 2; }
        
        .flex { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .summary-box { background: var(--surface-alt); padding: 10px; border-radius: 8px; font-size: 11px; margin-top: 8px; color: var(--text-muted); border: 1px solid #332418; max-height: 110px; overflow-y: auto; }
        .instrument-keyboard { display: flex; gap: 3px; margin-top: 8px; overflow-x: auto; padding: 6px; background: var(--surface-alt); border-radius: 6px; border: 1px solid #332418; }
        .doremi-key { min-width: 38px; height: 52px; background: #eaeaf0; color: #111; border: 1px solid #444; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 4px; font-size: 10px; font-weight: bold; cursor: pointer; border-radius: 0 0 4px 4px; user-select: none; flex: 1; }
        .doremi-key:active, .doremi-key.playing { background: var(--accent-gold) !important; color: #0f0c08 !important; }
        canvas { background: #050403; border: 1px solid #38291e; border-radius: 4px; width: 100%; height: 45px; margin-top: 6px; }

        /* モーダルスタイル (全体音響・EQ別画面用) */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: var(--surface-color); border: 2px solid var(--accent-gold); border-width: 2px; border-radius: 12px; width: 500px; padding: 20px; box-shadow: 0 0 40px rgba(242,169,0,0.4); }
    </style>
</head>
<body>

    <h1>🎛️🎶 ULTIMATE MASTER DAW v33.8 (ノイズレス・EQ別画面・54小節マルチバンク)</h1>

    <!-- 1. マスター＆テンポコントロール -->
    <div class="section" style="border: 2px solid var(--accent-gold);">
        <h2>🎛️ 1. マスター再生・全体録音CRERA・マルチ小節バンク管理</h2>
        <div class="flex">
            <button onclick="masterPlay()" style="font-size: 13px;">▶ 再生</button>
            <button onclick="masterStop()" style="font-size: 13px;">⏹ 停止</button>
            <button class="record-btn" onclick="toggleMasterRecording()" id="masterRecBtn">🔴 全体ミックス一括録音</button>
            <button class="clear-btn" onclick="masterClear()">🗑 全曲CRERA(全クリア)</button>
            <button class="preview-btn" onclick="previewMaster()">▶ 試聴</button>
            <button class="bank-btn" onclick="add18BarsBank()">➕ 18小節新たに作曲つけ足し</button>
            <button onclick="copyCurrentBank()">📋 現在バンク複製</button>
            <label><input type="checkbox" id="repeatToggle" checked> マルチバンク・フルリピート</label>
            <span>BPM: <input type="number" id="bpmInput" value="120" min="50" max="240" style="width: 55px;"></span>
        </div>
        <div class="flex" style="margin-top: 8px; border-top: 1px dashed #3d2c1e; padding-top: 8px;">
            <span>全体ジャンルビート: 
                <select id="genreBeatSelect" onchange="applyGenreBeatTemplate(this.value)">
                    <option value="">-- バンド/バラード/ロック/ポップス/ソロ選択 --</option>
                    <option value="band">バンド全体グルーブ</option>
                    <option value="ballad">バラード (ゆったり空間)</option>
                    <option value="rock">ロック (重厚drive)</option>
                    <option value="pops">ポップス (キャッチー4つ打ち)</option>
                    <option value="solo">ソロ・アコースティック</option>
                </select>
            </span>
            <button onclick="openSoundEqModal()" style="background: linear-gradient(135deg, #402080, #201040); color: #fff;">🎚️ 全体音響・EQ別画面</button>
            <button onclick="saveProjectToList()">💾 現在の曲をリスト保存</button>
        </div>
        <canvas id="masterVisualizer" width="600" height="45"></canvas>
        <div style="margin-top: 5px;"><audio id="masterAudio" controls style="height: 32px; width: 100%;"></audio></div>
        <div id="compositionListContainer" class="summary-box">保存プロジェクトリストはありません。</div>
    </div>

    <!-- 2. AI作詞＆ボーカル録音CRERAスタジオ -->
    <div class="section" style="border: 2px solid #a62b14;">
        <h2>🧢 2. AI作詞 ＆ ボーカル録音 (CRERA機能付き)</h2>
        <div class="flex">
            <span>テーマ: </span>
            <select id="lyricThemeSelect">
                <option value="season">四季・シーズン</option>
                <option value="love">恋・情熱</option>
                <option value="dream">夢・希望</option>
                <option value="youth">青春・時唄</option>
            </select>
            <button onclick="generateAiLyrics()" style="background: linear-gradient(135deg, #ff4500, #ff8c00); color: #fff;">🤖 AI歌詞自動作成</button>
            <button class="record-btn" onclick="startVocalRecording()">🔴 ボーカル録音</button>
            <button onclick="stopVocalRecording()">⏹ 停止</button>
            <button class="preview-btn" onclick="playVocal()">▶ 試聴</button>
            <button class="clear-btn" onclick="clearVocal()">🗑 ボーカルCRERA</button>
        </div>
        <div style="margin-top: 8px;"><textarea id="lyricTextArea" placeholder="【AIフルストーリー歌詞...】"></textarea></div>
        <div style="margin-top: 3px;"><audio id="vocalAudio" controls style="height: 28px; width: 100%;"></audio></div>
    </div>

    <!-- 3. プロ・リリース & 著作権認可共有スタジオ -->
    <div class="section" style="border: 2px solid #8a2be2;">
        <h2>💎 3. 著作権取得 (MICVICTORY/DLANDメジャー) & リリース</h2>
        <div class="flex">
            <button class="release-btn" onclick="executeProRelease()">🚀 MICVICTORY / DLAND メジャー一括リリース</button>
            <button onclick="exportProjectJSON()">💾 プロジェクト保存</button>
        </div>
        <div id="releaseStatusBox" class="summary-box" style="color: #da70d6;">ステータス: 未リリース (準備完了)</div>
    </div>

    <!-- 各楽器トラック管理用コンテナ -->
    <div id="tracksContainer"></div>

    <!-- 全体音響・イコライザー別画面 (モーダル) -->
    <div id="soundEqModal" class="modal-overlay">
        <div class="modal-content">
            <h2>🎚️ 全体音響バランス ＆ 3バンドEQ (別画面)</h2>
            <div style="margin: 12px 0;">
                <label>マスター音量 (Master Gain): <input type="range" min="0" max="1.5" step="0.05" value="1.0" id="eqMasterVolume" oninput="updateMasterVolume(this.value)"></label>
            </div>
            <div style="margin: 12px 0;">
                <label>LOW (低音域 100Hz): <input type="range" min="-12" max="12" step="1" value="0" id="eqLowGain" oninput="updateEqBand('low', this.value)"> dB</label>
            </div>
            <div style="margin: 12px 0;">
                <label>MID (中音域 1kHz): <input type="range" min="-12" max="12" step="1" value="0" id="eqMidGain" oninput="updateEqBand('mid', this.value)"> dB</label>
            </div>
            <div style="margin: 12px 0;">
                <label>HIGH (高音域 8kHz): <input type="range" min="-12" max="12" step="1" value="0" id="eqHighGain" oninput="updateEqBand('high', this.value)"> dB</label>
            </div>
            <div style="text-align: right; margin-top: 15px;">
                <button onclick="closeSoundEqModal()">閉じる</button>
            </div>
        </div>
    </div>

    <script>
        const instruments = [
            { id: 'drums', name: '🥁 プロ・アコースティックキック＆スネアキット (金属音カット/20パターン＋AI/CRERA)', type: 'drums' },
            { id: 'bass', name: '🎸 ウルトラ重低音サブベース (20パターン切り替え手動ボタンAI記憶再生CRERA)', type: 'bass' },
            { id: 'guitar', name: '🪵 エレキ/木目ギター音 (20パターン切り替え手動ボタンAI記憶再生CRERA)', type: 'guitar' },
            { id: 'piano', name: '🎹 ピアノ (プロ上質音) ＋ AIランダム切替', type: 'melody' },
            { id: 'harmony', name: '🎶 ハーモニーカ (3度上ハモり対応)', type: 'melody' },
            { id: 'violin', name: '🎻 バイオリン (AIランダム切替)', type: 'melody' },
            { id: 'synth', name: '🎛️ シンセサイザー (AIランダム切替)', type: 'melody' },
            { id: 'chords', name: '🎼 コード (アルペジオ/カッティング/リフ/エアー 20種AI/手動/編集/CRERA)', type: 'chords' }
        ];

        const solfaNotes = [
            { name: 'ド', freq: 261.63 }, { name: 'レ', freq: 293.66 }, { name: 'ミ', freq: 329.63 }, { name: 'ファ', freq: 349.23 },
            { name: 'ソ', freq: 392.00 }, { name: 'ラ', freq: 440.00 }, { name: 'シ', freq: 493.88 }, { name: '高ド', freq: 523.25 }
        ];

        // 金属音（Hi-Hat/Crash）を除外した打楽器インデックス（0: Kick, 1: Snare, 2: Deep Thump, 3: Rimshot）のみ
        const drumNotes = [
            { name: '重低音 Kick' }, { name: 'ファット Snare' }, { name: 'ディープ Thump' }, { name: 'クローズ Rimshot' }
        ];

        const chordPatternNames = [
            'CMaj7 アルペジオ流し', 'Am7 アルペジオ切替', 'Dm7 カッティング刻み', 'G7 リフ・グルーブ',
            'Fmaj7 エアーパッド', 'Em7 アルペジオ軽快', 'A7 カッティング鋭め', 'Dm9 エアー浮遊感',
            'Bbmaj7 リフ太め', 'C#m7 アルペジオ幻想', 'F#m7 カッティング歪み', 'B7 エアー広がりの空間',
            'Ebm7 アルペジオ深め', 'Ab7 カッティングファンク', 'Dbmaj7 リフ滑らか', 'Fm7 エアー静寂',
            'Gm7 カッティング高速', 'C7 リフ特盛', 'Bmaj7 エアーホライゾン', 'Amaj7 フルミックスコード'
        ];

        let numBanks = 1; 
        let activeBankIdx = 0; 

        let songData = {
            title: 'マイソング 01',
            numBanks: 1,
            trackData: {},
            trackNotes: {},
            trackGate: {},
            inputModes: {},
            trackFx: {},
            recStepCursor: {},
            chordStyles: {}
        };

        let savedProjects = [];
        let audioCtx = null, masterGainNode = null, compressorNode = null, masterDestNode = null, analyserNode = null;
        let eqLowFilter = null, eqMidFilter = null, eqHighFilter = null;
        let isPlaying = false, currentTimer = null;
        let mediaRecorder = null, recordedChunks = [], vocalAudioBlob = null;
        let masterMediaRecorder = null, masterRecordedChunks = [], masterAudioBlob = null, isMasterRecording = false;

        function createBlankBankArray(size = 18, fillVal = false) {
            return new Array(size).fill(fillVal);
        }

        function initApp() {
            instruments.forEach(inst => {
                songData.trackData[inst.id] = [createBlankBankArray(18, false)];
                songData.trackNotes[inst.id] = [createBlankBankArray(18, 0)];
                songData.trackGate[inst.id] = [createBlankBankArray(18, 0.4)];
                songData.inputModes[inst.id] = 'manual';
                songData.trackFx[inst.id] = 'normal';
                songData.recStepCursor[inst.id] = 0;
                if(inst.id === 'chords') songData.chordStyles[inst.id] = 0;
            });
            renderTracks();
            startVisualizerLoop();
        }

        function add18BarsBank() {
            if (numBanks >= 3) {
                alert('最大54小節（3バンク）に到達しています！');
                return;
            }
            numBanks++;
            songData.numBanks = numBanks;
            instruments.forEach(inst => {
                songData.trackData[inst.id].push(createBlankBankArray(18, false));
                songData.trackNotes[inst.id].push(createBlankBankArray(18, 0));
                songData.trackGate[inst.id].push(createBlankBankArray(18, 0.4));
            });
            activeBankIdx = numBanks - 1;
            renderTracks();
            alert(`➕ 新たに第${(activeBankIdx)*18 + 1}〜${(activeBankIdx+1)*18}小節バンクを追加しました！`);
        }

        function copyCurrentBank() {
            if (numBanks >= 3) {
                alert('最大54小節（3バンク）の制限によりコピー＆追加できません。');
                return;
            }
            numBanks++;
            songData.numBanks = numBanks;
            instruments.forEach(inst => {
                let currentData = songData.trackData[inst.id][activeBankIdx] || createBlankBankArray(18, false);
                let currentNotes = songData.trackNotes[inst.id][activeBankIdx] || createBlankBankArray(18, 0);
                let currentGate = songData.trackGate[inst.id][activeBankIdx] || createBlankBankArray(18, 0.4);
                
                songData.trackData[inst.id].push([...currentData]);
                songData.trackNotes[inst.id].push([...currentNotes]);
                songData.trackGate[inst.id].push([...currentGate]);
            });
            activeBankIdx = numBanks - 1;
            renderTracks();
            alert(`📋 現在バンクを新バンク(第${activeBankIdx*18+1}〜小節)にコピー追加しました！`);
        }

        function switchBank(bIdx) {
            activeBankIdx = bIdx;
            renderTracks();
        }

        function renderTracks() {
            const container = document.getElementById('tracksContainer');
            container.innerHTML = '';

            let bankTabsHTML = '<div class="bank-tabs"><span>小節バンク切替:</span>';
            for(let b=0; b<numBanks; b++) {
                bankTabsHTML += `<div class="bank-tab ${b===activeBankIdx?'active-bank':''}" onclick="switchBank(${b})">第${b*18+1}〜${(b+1)*18}小節 (バンク${b+1})</div>`;
            }
            bankTabsHTML += '</div>';

            instruments.forEach(inst => {
                const div = document.createElement('div');
                div.className = 'section';
                let currentMode = songData.inputModes[inst.id] || 'manual';
                let currentFx = songData.trackFx[inst.id] || 'normal';

                let patternHTML = '';
                if (inst.id === 'drums') {
                    let opts = ''; for(let p=1; p<=20; p++) opts += `<option value="${p-1}">プロドラム #${p} (金属音レス)</option>`;
                    patternHTML = `<span>パターン(20選):</span> <select onchange="applyDrumPattern(this.value)">${opts}</select>
                                   <button class="ai-btn" onclick="aiRandomPattern('drums')">🎲 AI切替</button>`;
                } else if (inst.id === 'bass') {
                    let opts = ''; for(let p=1; p<=20; p++) opts += `<option value="${p-1}">重低音ベース #${p}</option>`;
                    patternHTML = `<span>ベース(20選):</span> <select onchange="applyBassPattern(this.value)">${opts}</select>
                                   <button class="ai-btn" onclick="aiRandomPattern('bass')">🎲 AI切替</button>`;
                } else if (inst.id === 'guitar') {
                    let opts = ''; for(let p=1; p<=20; p++) opts += `<option value="${p-1}">エレキ/木目ギター #${p}</option>`;
                    patternHTML = `<span>音色切替:</span> <select onchange="applyGuitarSound(this.value)"><option value="elec">エレキ(20連動)</option><option value="wood">木目ギター</option></select>
                                   <span>パターン(20選):</span> <select onchange="applyGuitarPattern(this.value)">${opts}</select>`;
                } else if (inst.id === 'chords') {
                    let opts = ''; for(let p=0; p<20; p++) opts += `<option value="${p}">コード #${p+1}: ${chordPatternNames[p]}</option>`;
                    patternHTML = `<span>演奏スタイル(20選):</span> <select onchange="applyChordPattern(this.value)">${opts}</select>
                                   <button class="ai-btn" onclick="aiRandomChordEdit()">🤖 AIコード自動編集</button>`;
                } else if (inst.id === 'harmony') {
                    patternHTML = `<span>ハーモニーカモード:</span> <select onchange="applyHarmonyPattern(this.value)"><option value="third_up">3度上ハモり</option><option value="octave">オクターブハモ</option></select>
                                   <button class="ai-btn" onclick="aiRandomMelody('harmony')">🎲 AIランダム</button>`;
                } else {
                    patternHTML = `<span>モード:</span> <select onchange="changeInputMode('${inst.id}', this.value)"><option value="manual" ${currentMode==='manual'?'selected':''}>手動</option><option value="ai" ${currentMode==='ai'?'selected':''}>AI自動</option></select>
                                   <button class="ai-btn" onclick="aiRandomMelody('${inst.id}')">🎲 AIランダム切替</button>`;
                }

                div.innerHTML = `
                    <div class="flex" style="justify-content: space-between;">
                        <h3 style="margin:0; border:none;">${inst.name}</h3>
                        <button class="clear-btn" onclick="clearTrack('${inst.id}')">🗑 CRERA(個別クリア)</button>
                    </div>
                    ${bankTabsHTML}
                    <div class="flex">
                        ${patternHTML}
                        <span>FX:</span>
                        <select onchange="changeTrackFx('${inst.id}', this.value)"><option value="normal" ${currentFx==='normal'?'selected':''}>Normal</option><option value="reverb" ${currentFx==='reverb'?'selected':''}>リバーブ</option></select>
                        <span>ノート長:</span>
                        <select onchange="setTrackDefaultGate('${inst.id}', this.value)">
                            <option value="0.2">ショート (0.2s)</option>
                            <option value="0.4" selected>ナチュラル (0.4s)</option>
                            <option value="0.8">ロング (0.8s)</option>
                        </select>
                        <button class="preview-btn" onclick="playTrackPreview('${inst.id}')">▶ バンク試聴</button>
                    </div>
                    <div style="font-size:10px; color:var(--accent-gold); margin-top:4px;">💡 鍵盤連打で現在バンクに次々ステップ記録（セルクリックで音程切替・再クリックでミュート）:</div>
                    <div class="instrument-keyboard" id="kb-${inst.id}"></div>
                    <div class="grid-18" id="grid-${inst.id}"></div>
                `;
                container.appendChild(div);
                renderKeyboard(inst);
                renderGrid(inst.id);
            });
        }

        function ensureBankArray(id, bankIdx) {
            if (!songData.trackData[id][bankIdx]) songData.trackData[id][bankIdx] = createBlankBankArray(18, false);
            if (!songData.trackNotes[id][bankIdx]) songData.trackNotes[id][bankIdx] = createBlankBankArray(18, 0);
            if (!songData.trackGate[id][bankIdx]) songData.trackGate[id][bankIdx] = createBlankBankArray(18, 0.4);
        }

        function changeInputMode(id, mode) {
            songData.inputModes[id] = mode;
            if(mode === 'ai') aiRandomMelody(id);
        }

        function changeTrackFx(id, fx) { songData.trackFx[id] = fx; }
        
        function setTrackDefaultGate(id, val) {
            let v = parseFloat(val);
            ensureBankArray(id, activeBankIdx);
            songData.trackGate[id][activeBankIdx].fill(v);
            renderGrid(id);
        }

        function applyGuitarSound(val) {
            ensureBankArray('guitar', activeBankIdx);
            if(val === 'wood') {
                let tData = songData.trackData['guitar'][activeBankIdx], tNotes = songData.trackNotes['guitar'][activeBankIdx];
                tData.fill(false);
                for(let i=0; i<18; i+=2) { tData[i] = true; tNotes[i] = 3; }
                renderGrid('guitar');
                alert('木目ギター音モードに切り替えました！');
            } else {
                applyGuitarPattern(0);
                alert('エレキギター音(20選連動)に切り替えました！');
            }
        }

        function applyGuitarPattern(idx) {
            ensureBankArray('guitar', activeBankIdx);
            let tData = songData.trackData['guitar'][activeBankIdx], tNotes = songData.trackNotes['guitar'][activeBankIdx];
            tData.fill(false); let n = parseInt(idx || 0, 10);
            for(let i=0; i<18; i++) {
                if((i + n) % 2 === 0) { tData[i] = true; tNotes[i] = (i * 2) % 8; }
            }
            renderGrid('guitar');
        }

        // 金属音（Hi-Hat/Crash）を除外したキック＆スネア中心パター生成
        function applyDrumPattern(idx) {
            ensureBankArray('drums', activeBankIdx);
            let tData = songData.trackData['drums'][activeBankIdx], tNotes = songData.trackNotes['drums'][activeBankIdx];
            tData.fill(false); let n = parseInt(idx || 0, 10);
            for(let i=0; i<18; i++) {
                if((i + n) % 2 === 0) { tData[i] = true; tNotes[i] = (i % 4 === 2) ? 1 : 0; }
                if(i % 4 === 2) { tData[i] = true; tNotes[i] = 2; }
            }
            renderGrid('drums');
        }

        function applyBassPattern(idx) {
            ensureBankArray('bass', activeBankIdx);
            let tData = songData.trackData['bass'][activeBankIdx], tNotes = songData.trackNotes['bass'][activeBankIdx];
            tData.fill(false); let n = parseInt(idx || 0, 10);
            for(let i=0; i<18; i++) {
                if(i % 3 === 0 || (i + n) % 4 === 0) { tData[i] = true; tNotes[i] = 0; }
            }
            renderGrid('bass');
        }

        function applyChordPattern(idx) {
            ensureBankArray('chords', activeBankIdx);
            let tData = songData.trackData['chords'][activeBankIdx], tNotes = songData.trackNotes['chords'][activeBankIdx];
            tData.fill(false); let p = parseInt(idx || 0, 10);
            songData.chordStyles['chords'] = p;
            for(let i=0; i<18; i++) {
                if(i % 2 === 0 || p % 3 === 0) { tData[i] = true; tNotes[i] = (p + i) % 8; }
            }
            renderGrid('chords');
        }

        function applyHarmonyPattern(mode) {
            ensureBankArray('harmony', activeBankIdx);
            ensureBankArray('piano', activeBankIdx);
            let tData = songData.trackData['harmony'][activeBankIdx], tNotes = songData.trackNotes['harmony'][activeBankIdx];
            let pianoNotes = songData.trackNotes['piano'][activeBankIdx];
            let activeMode = mode || document.querySelector('select[onchange*="applyHarmonyPattern"]')?.value || 'third_up';
            tData.fill(false);
            for(let i=0; i<18; i++) {
                if(songData.trackData['piano'][activeBankIdx][i]) {
                    tData[i] = true;
                    let pNote = pianoNotes[i];
                    tNotes[i] = (activeMode === 'octave') ? (pNote + 7) % 8 : (pNote + 2) % 8;
                }
            }
            renderGrid('harmony');
        }

        function applyGenreBeatTemplate(genre) {
            if(!genre) return;
            const bpmMap = { band: 118, ballad: 78, rock: 135, pops: 122, solo: 92 };
            document.getElementById('bpmInput').value = bpmMap[genre] || 120;
            applyDrumPattern(0);
            applyBassPattern(1);
            applyChordPattern(2);
            aiRandomMelody('piano');
            alert(`全体ジャンルビート「${genre.toUpperCase()}」の設定＆20選パターンを反映しました！`);
        }

        function aiRandomMelody(id) {
            ensureBankArray(id, activeBankIdx);
            let tData = songData.trackData[id][activeBankIdx], tNotes = songData.trackNotes[id][activeBankIdx];
            tData.fill(false);
            for(let i=0; i<18; i++) {
                if(Math.random() > 0.35) {
                    tData[i] = true;
                    tNotes[i] = Math.floor(Math.random() * 8);
                }
            }
            renderGrid(id);
            alert(`🎲 ${id} (バンク${activeBankIdx+1}) にAIランダムメロディ適用！`);
        }

        function aiRandomPattern(id) {
            if(id === 'drums') applyDrumPattern(Math.floor(Math.random() * 20));
            if(id === 'bass') applyBassPattern(Math.floor(Math.random() * 20));
            alert(`🎲 ${id} AIランダムパターン更新！`);
        }

        function aiRandomChordEdit() {
            applyChordPattern(Math.floor(Math.random() * 20));
            alert('🤖 AIコード進行を自動編集しました！');
        }

        function renderKeyboard(inst) {
            const kb = document.getElementById(`kb-${inst.id}`);
            if(!kb) return;
            kb.innerHTML = '';
            let items = (inst.type === 'drums' || inst.id === 'guitar') ? drumNotes : solfaNotes;
            items.forEach((item, idx) => {
                const key = document.createElement('div');
                key.className = 'doremi-key';
                key.innerHTML = `<span>${item.name}</span>`;
                key.onmousedown = () => {
                    key.classList.add('playing');
                    let g = (songData.trackGate[inst.id] && songData.trackGate[inst.id][activeBankIdx]) ? songData.trackGate[inst.id][activeBankIdx][0] : 0.4;
                    playNote(inst.id, idx, g);
                    setTimeout(() => key.classList.remove('playing'), 200);

                    ensureBankArray(inst.id, activeBankIdx);
                    let tData = songData.trackData[inst.id][activeBankIdx];
                    let tNotes = songData.trackNotes[inst.id][activeBankIdx];
                    let cur = songData.recStepCursor[inst.id] || 0;
                    tData[cur] = true;
                    tNotes[cur] = idx;
                    renderGrid(inst.id);
                    songData.recStepCursor[inst.id] = (cur + 1) % 18;
                };
                kb.appendChild(key);
            });
        }

        function renderGrid(id) {
            const grid = document.getElementById(`grid-${id}`);
            if(!grid) return;
            grid.innerHTML = '';
            ensureBankArray(id, activeBankIdx);
            let tData = songData.trackData[id][activeBankIdx], tNotes = songData.trackNotes[id][activeBankIdx], tGate = songData.trackGate[id][activeBankIdx], instObj = instruments.find(i => i.id === id);

            for (let i = 0; i < 18; i++) {
                const cell = document.createElement('div');
                cell.className = `step-cell ${tData[i] ? 'active' : ''}`;
                cell.id = `cell-${id}-${activeBankIdx}-${i}`;
                let label = tData[i] ? ((instObj.type === 'drums' || id === 'guitar') ? drumNotes[tNotes[i] % drumNotes.length].name : solfaNotes[tNotes[i] % solfaNotes.length].name) : '';
                let gateShort = tGate[i] === 0.2 ? '短' : (tGate[i] === 0.8 ? '長' : '中');
                cell.innerHTML = `<span>${activeBankIdx*18+i+1}</span><span style="font-size:7px;">${label}</span><span style="font-size:6px; opacity:0.8;">[${gateShort}]</span>`;
                cell.onclick = (e) => {
                    e.stopPropagation();
                    let maxN = (instObj.type === 'drums' || id === 'guitar') ? 4 : 8;
                    if(!tData[i]) {
                        tData[i] = true; tNotes[i] = 0; tGate[i] = 0.4;
                    } else {
                        if(e.shiftKey) {
                            tGate[i] = tGate[i] === 0.4 ? 0.8 : (tGate[i] === 0.8 ? 0.2 : 0.4);
                        } else {
                            tNotes[i] = (tNotes[i] + 1) % maxN;
                            if(tNotes[i] === 0) { tData[i] = false; }
                        }
                    }
                    renderGrid(id);
                };
            }
        }

        function getAudioContext() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContextClass();
                masterGainNode = audioCtx.createGain();
                masterGainNode.gain.value = parseFloat(document.getElementById('eqMasterVolume')?.value || 1.0);
                
                // 3バンドEQ用BiquadFilter
                eqLowFilter = audioCtx.createBiquadFilter();
                eqLowFilter.type = 'lowshelf';
                eqLowFilter.frequency.value = 100;
                eqLowFilter.gain.value = 0;

                eqMidFilter = audioCtx.createBiquadFilter();
                eqMidFilter.type = 'peaking';
                eqMidFilter.frequency.value = 1000;
                eqMidFilter.gain.value = 0;

                eqHighFilter = audioCtx.createBiquadFilter();
                eqHighFilter.type = 'highshelf';
                eqHighFilter.frequency.value = 8000;
                eqHighFilter.gain.value = 0;

                compressorNode = audioCtx.createDynamicsCompressor();
                compressorNode.threshold.setValueAtTime(-14, audioCtx.currentTime);
                compressorNode.ratio.setValueAtTime(4, audioCtx.currentTime);
                analyserNode = audioCtx.createAnalyser();
                analyserNode.fftSize = 256;
                masterDestNode = audioCtx.createMediaStreamDestination();
                
                // 接続チェイン: Compressor -> EQ Low -> EQ Mid -> EQ High -> Master Gain -> Analyser & Destination
                compressorNode.connect(eqLowFilter);
                eqLowFilter.connect(eqMidFilter);
                eqMidFilter.connect(eqHighFilter);
                eqHighFilter.connect(masterGainNode);
                masterGainNode.connect(analyserNode);
                analyserNode.connect(audioCtx.destination);
                masterGainNode.connect(masterDestNode);
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function updateMasterVolume(v) { 
            if(masterGainNode && audioCtx) {
                masterGainNode.gain.setValueAtTime(parseFloat(v), audioCtx.currentTime); 
            }
        }

        function updateEqBand(band, val) {
            getAudioContext();
            let v = parseFloat(val);
            if(band === 'low' && eqLowFilter) eqLowFilter.gain.value = v;
            if(band === 'mid' && eqMidFilter) eqMidFilter.gain.value = v;
            if(band === 'high' && eqHighFilter) eqHighFilter.gain.value = v;
        }

        function openSoundEqModal() {
            document.getElementById('soundEqModal').classList.add('active');
        }

        function closeSoundEqModal() {
            document.getElementById('soundEqModal').classList.remove('active');
        }

        function playNote(instId, noteIndex, gate = 0.4) {
            const ctx = getAudioContext();
            const now = ctx.currentTime;
            const gain = ctx.createGain();
            gain.connect(compressorNode);
            
            let duration = Math.max(gate, 0.15);
            let releaseTail = 0.18;

            if (instId === 'drums') {
                gain.gain.setValueAtTime(0.85, now);
                const osc = ctx.createOscillator();
                // 金属音レス：パンチの効いたキック・スネア・タム系のみ生成
                if (noteIndex === 0) {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(140, now); osc.frequency.exponentialRampToValueAtTime(32, now + 0.15);
                } else if (noteIndex === 1) {
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(220, now); osc.frequency.exponentialRampToValueAtTime(75, now + 0.12);
                } else if (noteIndex === 2) {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(180, now); osc.frequency.exponentialRampToValueAtTime(50, now + 0.14);
                } else {
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(40, now + 0.1);
                }
                gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
                osc.connect(gain); osc.start(now); osc.stop(now + duration + releaseTail);
                return;
            }

            if (instId === 'bass') {
                gain.gain.setValueAtTime(0.01, now);
                gain.gain.linearRampToValueAtTime(0.85, now + 0.02);
                const osc = ctx.createOscillator();
                osc.type = 'sine';
                let subFreq = (solfaNotes[noteIndex % solfaNotes.length].freq) / 4;
                osc.frequency.setValueAtTime(subFreq, now);
                gain.gain.setValueAtTime(0.85, now + duration * 0.7);
                gain.gain.exponentialRampToValueAtTime(0.001, now + duration + releaseTail);
                osc.connect(gain); osc.start(now); osc.stop(now + duration + releaseTail + 0.05);
                return;
            }

            if (instId === 'piano') {
                let freq = solfaNotes[noteIndex % solfaNotes.length].freq;
                gain.gain.setValueAtTime(0.01, now);
                gain.gain.linearRampToValueAtTime(0.45, now + 0.02);
                const osc1 = ctx.createOscillator(); osc1.type = 'triangle'; osc1.frequency.setValueAtTime(freq, now);
                const osc2 = ctx.createOscillator(); osc2.type = 'sine'; osc2.frequency.setValueAtTime(freq * 2, now);
                const g2 = ctx.createGain(); g2.gain.value = 0.2;
                osc2.connect(g2); g2.connect(gain);
                osc1.connect(gain);
                gain.gain.setValueAtTime(0.45, now + duration * 0.6);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + duration + releaseTail);
                osc1.start(now); osc2.start(now);
                osc1.stop(now + duration + releaseTail + 0.05); osc2.stop(now + duration + releaseTail + 0.05);
                return;
            }

            let freq = solfaNotes[noteIndex % solfaNotes.length].freq;
            gain.gain.setValueAtTime(0.01, now);
            gain.gain.linearRampToValueAtTime(0.45, now + 0.03);
            const osc = ctx.createOscillator();
            osc.type = (instId === 'guitar') ? 'triangle' : 'sawtooth';
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(0.45, now + duration * 0.6);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + duration + releaseTail);
            osc.connect(gain); osc.start(now); osc.stop(now + duration + releaseTail + 0.05);
        }

        function clearTrack(id) {
            ensureBankArray(id, activeBankIdx);
            songData.trackData[id][activeBankIdx].fill(false);
            songData.trackNotes[id][activeBankIdx].fill(0);
            songData.trackGate[id][activeBankIdx].fill(0.4);
            songData.recStepCursor[id] = 0;
            renderGrid(id);
            alert(`🗑 ${id} のバンク小節をCRERAクリアしました！`);
        }

        function clearVocal() {
            if (vocalAudioBlob) URL.revokeObjectURL(document.getElementById('vocalAudio').src);
            vocalAudioBlob = null; recordedChunks = [];
            const aud = document.getElementById('vocalAudio'); aud.src = ''; aud.load();
            alert('🗑 ボーカル録音をCRERA(クリア)しました！');
        }

        function playTrackPreview(id) {
            if(isPlaying) masterStop();
            let step = 0;
            const bpm = parseFloat(document.getElementById('bpmInput').value) || 120;
            let interval = (60 / bpm) * 500;
            ensureBankArray(id, activeBankIdx);
            let tData = songData.trackData[id][activeBankIdx], tNotes = songData.trackNotes[id][activeBankIdx], tGate = songData.trackGate[id][activeBankIdx];
            
            const timer = setInterval(() => {
                if(tData[step]) playNote(id, tNotes[step], tGate[step]);
                step++;
                if(step >= 18) clearInterval(timer);
            }, interval);
        }

        function masterPlay() {
            if (isPlaying) return;
            isPlaying = true;
            let currentBank = activeBankIdx;
            let currentStep = 0;
            const bpm = parseFloat(document.getElementById('bpmInput').value) || 120;
            let interval = (60 / bpm) * 500;
            let tData = songData.trackData, tNotes = songData.trackNotes, tGate = songData.trackGate;

            currentTimer = setInterval(() => {
                instruments.forEach(inst => {
                    const cell = document.getElementById(`cell-${inst.id}-${currentBank}-${currentStep}`);
                    if (cell) { 
                        cell.classList.add('current-playing'); 
                        setTimeout(() => cell.classList.remove('current-playing'), interval * 0.95); 
                    }
                });

                Object.keys(tData).forEach(id => {
                    if (tData[id] && tData[id][currentBank] && tData[id][currentBank][currentStep]) {
                        playNote(id, tNotes[id][currentBank][currentStep], tGate[id] && tGate[id][currentBank] ? tGate[id][currentBank][currentStep] : 0.4);
                    }
                });

                currentStep++;
                if (currentStep >= 18) {
                    currentStep = 0;
                    currentBank++;
                    activeBankIdx = currentBank; 
                    renderTracks(); 
                    if (currentBank >= (songData.numBanks || 1)) {
                        currentBank = 0;
                        activeBankIdx = 0;
                        renderTracks();
                        if (!document.getElementById('repeatToggle').checked) {
                            masterStop();
                            return;
                        }
                    }
                }
            }, interval);
        }

        function masterStop() { 
            isPlaying = false; 
            if (currentTimer) { clearInterval(currentTimer); currentTimer = null; } 
        }

        function masterClear() { 
            masterStop(); 
            instruments.forEach(inst => clearTrack(inst.id)); 
            document.getElementById('lyricTextArea').value = ''; 
            alert('全曲CRERA(全クリア)実行完了！'); 
        }
        
        function previewMaster() { masterPlay(); }

        function startVisualizerLoop() {
            const canvas = document.getElementById('masterVisualizer');
            const ctx = canvas.getContext('2d');
            const bufferLength = 128;
            const dataArray = new Uint8Array(bufferLength);

            function draw() {
                requestAnimationFrame(draw);
                ctx.fillStyle = '#050403';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                if (analyserNode && (isPlaying || isMasterRecording)) {
                    analyserNode.getByteTimeDomainData(dataArray);
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = '#f2a900';
                    ctx.beginPath();
                    let sliceWidth = canvas.width * 1.0 / bufferLength;
                    let x = 0;
                    for (let i = 0; i < bufferLength; i++) {
                        let v = dataArray[i] / 128.0;
                        let y = v * canvas.height / 2;
                        if (i === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                        x += sliceWidth;
                    }
                    ctx.lineTo(canvas.width, canvas.height / 2);
                    ctx.stroke();
                } else {
                    ctx.strokeStyle = '#38291e';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(0, canvas.height / 2);
                    ctx.lineTo(canvas.width, canvas.height / 2);
                    ctx.stroke();
                }
            }
            draw();
        }

        function saveProjectToList() {
            const name = prompt('保存するプロジェクト名を入力してください:', songData.title);
            if (!name) return;
            songData.title = name;
            songData.numBanks = numBanks;
            savedProjects.push(JSON.parse(JSON.stringify(songData)));
            updateProjectListUI();
            alert(`「${name}」をリストに保存しました！`);
        }

        function updateProjectListUI() {
            const container = document.getElementById('compositionListContainer');
            if (savedProjects.length === 0) { container.innerHTML = '保存されたプロジェクトリストはありません。'; return; }
            let html = '<b>📁 保存済みプロジェクト一覧:</b><ul>';
            savedProjects.forEach((proj, idx) => {
                html += `<li><b>${proj.title} (${proj.numBanks||1}バンク)</b> <button onclick="loadProject(${idx})" style="padding:2px 6px; font-size:10px;">読込</button></li>`;
            });
            html += '</ul>';
            container.innerHTML = html;
        }

        function loadProject(idx) {
            if(!savedProjects[idx]) return;
            songData = JSON.parse(JSON.stringify(savedProjects[idx]));
            numBanks = songData.numBanks || 1;
            activeBankIdx = 0;
            renderTracks();
            alert(`「${songData.title}」を読み込みました！`);
        }

        function toggleMasterRecording() {
            if (!isMasterRecording) {
                masterRecordedChunks = [];
                try {
                    getAudioContext();
                    masterMediaRecorder = new MediaRecorder(masterDestNode.stream);
                    masterMediaRecorder.ondataavailable = e => { if (e.data.size > 0) masterRecordedChunks.push(e.data); };
                    masterMediaRecorder.onstop = () => {
                        masterAudioBlob = new Blob(masterRecordedChunks, { type: 'audio/webm' });
                        document.getElementById('masterAudio').src = URL.createObjectURL(masterAudioBlob);
                    };
                    masterMediaRecorder.start();
                    isMasterRecording = true;
                    document.getElementById('masterRecBtn').innerText = '⏹ 一括録音停止';
                    masterPlay();
                    alert('🔴 全楽器ミックス一括録音開始！');
                } catch(e) { alert('録音開始に失敗しました。'); }
            } else {
                if (masterMediaRecorder && masterMediaRecorder.state !== 'inactive') masterMediaRecorder.stop();
                masterStop();
                isMasterRecording = false;
                document.getElementById('masterRecBtn').innerText = '🔴 全体ミックス一括録音';
                alert('一括録音完了！');
            }
        }

        function generateAiLyrics() {
            const theme = document.getElementById('lyricThemeSelect').value;
            const ta = document.getElementById('lyricTextArea');
            ta.value = `【AIストーリー・${theme}】\nプロピアノ＆重低音ベース、ノイズレスキック＆スネアが重なる。\n(Chorus) MICVICTORY / DLANDメジャーへ向けて加速する54小節。`;
            alert('AI歌詞を生成しました！');
        }

        async function startVocalRecording() {
            recordedChunks = [];
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    vocalAudioBlob = new Blob(recordedChunks, { type: 'audio/webm' });
                    document.getElementById('vocalAudio').src = URL.createObjectURL(vocalAudioBlob);
                    stream.getTracks().forEach(t => t.stop());
                };
                mediaRecorder.start();
                alert('🎙️ ボーカル録音中...');
            } catch(e) { alert('マイクアクセスエラー'); }
        }

        function stopVocalRecording() { if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop(); }
        function playVocal() { const aud = document.getElementById('vocalAudio'); if(aud.src) aud.play(); }

        function executeProRelease() {
            document.getElementById('releaseStatusBox').innerHTML = `✨ <strong>MICVICTORY / DLAND メジャーリリース＆著作権登録完了！</strong><br>・金属音完全除去・高音質3バンドEQ適用完了 (ID: MV-DL-2026-MULTI54)`;
            alert('🎉 MICVICTORY / DLAND メジャーリリース完了！');
        }

        function exportProjectJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(songData, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr); dlAnchor.setAttribute("download", "daw_project.json");
            document.body.appendChild(dlAnchor); dlAnchor.click(); dlAnchor.remove();
        }

        window.onload = initApp;
    </script>
