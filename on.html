<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIC VICTORY DLAND - v64.0 ULTIMATE SYNTH & GUITAR MASTER SUITE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans select-none pb-24 overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        function UltimateDlandApp() {
            const [tab, setTab] = React.useState("STUDIO");
            const [playing, setPlaying] = React.useState(false);
            const [isRecording, setIsRecording] = React.useState(false);
            const [bpm, setBpm] = React.useState(124); // ハイテンポ対応
            const [currentBar, setCurrentBar] = React.useState(0);
            const [currentStep, setCurrentStep] = React.useState(-1);
            const [status, setStatus] = React.useState("🚀 v64.0：シンセサイザー追加・ベース完全強化・ハイテンポ ドンパシャ＆シンバル・ギター高音質化！");

            // 拍子設定
            const [timeSignature, setTimeSignature] = React.useState("4/4");
            const BAR_STEPS = timeSignature === "3/4" ? 12 : 16;
            const BARS = 18; // 18小節
            const TOTAL_STEPS = BARS * BAR_STEPS;

            const [showGridButtons, setShowGridButtons] = React.useState(true);

            const [selectedInstrument, setSelectedInstrument] = React.useState("drums");
            const [selectedNote, setSelectedNote] = React.useState("C3");
            const [selectedDuration, setSelectedDuration] = React.useState("8n");
            const [selectedVelocity, setSelectedVelocity] = React.useState(0.9);
            const [vibratoDepth, setVibratoDepth] = React.useState(0.2);

            const [selectedDrumPart, setSelectedDrumPart] = React.useState("drum1");
            const [selectedFxType, setSelectedFxType] = React.useState("reverb");

            // ギターコード定義 (Am含む全コード)
            const [guitarStyle, setGuitarStyle] = React.useState("arpeggio");
            const [selectedChord, setSelectedChord] = React.useState("Am");
            const GUITAR_CHORDS = [
                { name: "Am", notes: ["A2", "C3", "E3", "A3"] },
                { name: "C", notes: ["C3", "E3", "G3", "C4"] },
                { name: "G", notes: ["G2", "B2", "D3", "G3"] },
                { name: "F", notes: ["F2", "A2", "C3", "F3"] },
                { name: "Dm", notes: ["D3", "F3", "A3", "D4"] },
                { name: "Em", notes: ["E2", "G2", "B2", "E3"] },
                { name: "E", notes: ["E2", "G#2", "B2", "E3"] },
                { name: "A7", notes: ["A2", "C#3", "E3", "G3"] },
                { name: "D7", notes: ["D3", "F#3", "A3", "C4"] },
                { name: "B7", notes: ["B2", "D#3", "F#3", "A3"] },
                { name: "Cmaj7", notes: ["C3", "E3", "G3", "B3"] },
                { name: "Fmaj7", notes: ["F2", "A2", "C3", "E3"] },
                { name: "Bm", notes: ["B2", "D3", "F#3", "B3"] },
                { name: "Gm", notes: ["G2", "A#2", "D3", "G3"] },
                { name: "Bb", notes: ["A#2", "D3", "F3", "A#3"] },
                { name: "Eb", notes: ["D#3", "G3", "A#3", "D#4"] }
            ];

            // マイク音声録音関連
            const [micRecording, setMicRecording] = React.useState(false);
            const [micAudioUrl, setMicAudioUrl] = React.useState(null);
            const mediaRecorderRef = React.useRef(null);
            const audioChunksRef = React.useRef([]);

            const [saveLists, setSaveLists] = React.useState([
                { id: 1, title: "MIC VICTORY Hi-Tempo Anthem (#1)", type: "蓮華", format: "mp3", date: "2026-09-29", copyright: "micvictorydland" }
            ]);

            const INSTRUMENTS = [
                { id: "drums", label: "🥁 ドラム (ハイテンポ・ドンパシャ)", color: "from-red-600 to-amber-700" },
                { id: "bass", label: "🎸 ベース (低音・グリッド/AI)", color: "from-emerald-600 to-teal-700" },
                { id: "synth", label: "🎹 シンセサイザー", color: "from-cyan-600 to-blue-700" },
                { id: "guitarWood", label: "🪵 木目ギター (良音)", color: "from-amber-800 via-yellow-900 to-amber-950" },
                { id: "piano", label: "🎹 ピアノ", color: "from-blue-600 to-indigo-700" },
                { id: "harmonica", label: "🪗 ハーモニカ", color: "from-orange-600 to-amber-700" },
            ];

            const [instrumentSteps, setInstrumentSteps] = React.useState({
                drums: new Array(TOTAL_STEPS).fill(null),
                bass: new Array(TOTAL_STEPS).fill(null),
                synth: new Array(TOTAL_STEPS).fill(null),
                guitarWood: new Array(TOTAL_STEPS).fill(null),
                piano: new Array(TOTAL_STEPS).fill(null),
                harmonica: new Array(TOTAL_STEPS).fill(null),
            });

            // ハイテンポ向けドンパシャ＆シンバル強化ドラム20パート
            const DRUM_20_PARTS = Array.from({ length: 20 }, (_, i) => ({
                id: `drum${i + 1}`,
                label: i === 0 ? "ドン (Kick)" : i === 1 ? "パシャ (Snare)" : i === 2 ? "シンバル (Cymbal)" : `ドラム音 #${i + 1}`
            }));

            const synthsRef = React.useRef(null);
            const loopRef = React.useRef(null);
            const masterGainRef = React.useRef(null);

            const NOTES = ["C2", "E2", "G2", "B2", "C3", "E3", "G3", "C4", "E4", "G4"];

            React.useEffect(() => {
                const masterGain = new Tone.Gain(1.2).toDestination();
                masterGainRef.current = masterGain;

                const eq = new Tone.EQ3({ low: 6, mid: 3, high: 4 }).connect(masterGain);
                const reverb = new Tone.Reverb({ decay: 2.2, wet: 0.25 }).connect(eq);
                const delay = new Tone.FeedbackDelay({ delayTime: "8n", feedback: 0.2, wet: 0.15 }).connect(reverb);

                const cGains = {};
                Object.keys(instrumentSteps).forEach(key => {
                    const cg = new Tone.Gain(1.0).connect(delay);
                    cGains[key] = cg;
                });

                synthsRef.current = {
                    drums: {
                        ...Object.fromEntries(DRUM_20_PARTS.map((p, idx) => [
                            p.id,
                            idx === 0 
                                ? new Tone.MembraneSynth({ pitchDecay: 0.03, octaves: 6, oscillator: { type: "sine" }, envelope: { attack: 0.001, decay: 0.25, sustain: 0 } }).connect(cGains.drums) // ドン
                                : idx === 1 
                                ? new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.001, decay: 0.15, sustain: 0 } }).connect(cGains.drums) // パシャ
                                : idx === 2 
                                ? new Tone.MetalSynth({ frequency: 300, envelope: { attack: 0.001, decay: 0.4, release: 0.3 }, harmonicity: 5.1, modulationIndex: 40 }).connect(cGains.drums) // シンバル
                                : idx < 10
                                ? new Tone.MembraneSynth({ pitchDecay: 0.05, octaves: 4, oscillator: { type: "triangle" }, envelope: { attack: 0.001, decay: 0.2, sustain: 0 } }).connect(cGains.drums)
                                : new Tone.MetalSynth({ frequency: 200 + idx * 40, envelope: { attack: 0.001, decay: 0.08, release: 0.08 }, harmonicity: 4, modulationIndex: 20 }).connect(cGains.drums)
                        ]))
                    },
                    bass: new Tone.MonoSynth({ oscillator: { type: "sawtooth" }, filter: { Q: 2, type: "lowpass", rolloff: -24 }, envelope: { attack: 0.005, decay: 0.3, sustain: 0.3, release: 0.1 } }).connect(cGains.bass),
                    synth: new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.01, decay: 0.25, sustain: 0.4, release: 0.2 } }).connect(cGains.synth),
                    guitarWood: new Tone.PluckSynth({ attackNoise: 1.8, dampening: 5200 }).connect(cGains.guitarWood), // 高音質なギター響き
                    piano: new Tone.Synth({ oscillator: { type: "triangle" }, envelope: { attack: 0.005, decay: 0.4, sustain: 0.2, release: 0.3 } }).connect(cGains.piano),
                    harmonica: new Tone.Synth({ oscillator: { type: "sawtooth" }, envelope: { attack: 0.02, decay: 0.25, sustain: 0.6, release: 0.3 } }).connect(cGains.harmonica),
                    eq, reverb, delay
                };

                return () => { Tone.Transport.stop(); Tone.Transport.cancel(); };
            }, []);

            React.useEffect(() => {
                Tone.Transport.bpm.value = bpm;
                Tone.Transport.cancel();

                if (playing) {
                    let stepCounter = 0;
                    loopRef.current = new Tone.Loop(time => {
                        let step = stepCounter % TOTAL_STEPS;
                        const bar = Math.floor(step / BAR_STEPS);
                        const sInBar = step % BAR_STEPS;

                        setCurrentStep(sInBar);
                        setCurrentBar(bar);

                        const syns = synthsRef.current;
                        if (!syns) return;

                        Object.keys(instrumentSteps).forEach(instKey => {
                            const item = instrumentSteps[instKey][step];
                            if (!item) return;

                            if (instKey === "guitarWood") {
                                const chordObj = GUITAR_CHORDS.find(c => c.name === (item.chord || "Am"));
                                if (chordObj) {
                                    if (item.style === "arpeggio") {
                                        const note = chordObj.notes[sInBar % chordObj.notes.length];
                                        syns.guitarWood.triggerAttackRelease(note, "8n", time);
                                    } else {
                                        chordObj.notes.forEach(n => syns.guitarWood.triggerAttackRelease(n, "16n", time, 0.9));
                                    }
                                }
                            } else if (instKey === "drums") {
                                if (item.drumPart && syns.drums[item.drumPart]) {
                                    syns.drums[item.drumPart].triggerAttackRelease("C1", item.dur || "16n", time, item.vel || 0.9);
                                }
                            } else if (instKey === "bass") {
                                syns.bass.triggerAttackRelease(item.note || "C2", item.dur || "8n", time, item.vel || 0.9);
                            } else if (syns[instKey]) {
                                syns[instKey].triggerAttackRelease(item.note || "C3", item.dur || "8n", time, item.vel || 0.9);
                            }
                        });

                        stepCounter++;
                    }, "16n").start(0);

                    Tone.Transport.start();
                } else {
                    Tone.Transport.stop();
                }
            }, [playing, bpm, instrumentSteps, timeSignature]);

            const togglePlay = async () => {
                await Tone.start();
                setPlaying(!playing);
                setStatus(playing ? "停止しました" : `▶ 再生中 (BPM: ${bpm}, ハイテンポモード)`);
            };

            const toggleRecord = async () => {
                await Tone.start();
                setIsRecording(!isRecording);
                setStatus(!isRecording ? "🔴 ハイテンポ全体記録中..." : "⏹️ 記録完了！保存リストに追加されました。");
            };

            const playChordManual = (chordName) => {
                setSelectedChord(chordName);
                const chordObj = GUITAR_CHORDS.find(c => c.name === chordName);
                const syns = synthsRef.current;
                if (!chordObj || !syns) return;
                chordObj.notes.forEach(n => syns.guitarWood.triggerAttackRelease(n, "16n"));
                if (currentStep !== -1) {
                    toggleStep("guitarWood", currentBar * BAR_STEPS + currentStep, chordName);
                }
            };

            const generateAiPattern = (type, mode) => {
                const newArr = new Array(TOTAL_STEPS).fill(null);
                const scale = type === "bass" ? ["C2", "E2", "G2", "A2"] : ["C3", "E3", "G3", "B3", "C4"];

                for (let i = 0; i < TOTAL_STEPS; i++) {
                    if (type === "guitarWood") {
                        newArr[i] = { chord: GUITAR_CHORDS[i % GUITAR_CHORDS.length].name, style: guitarStyle };
                    } else if (type === "drums") {
                        if (mode === "random" && Math.random() < 0.45) {
                            const pId = i % 4 === 0 ? "drum1" : i % 4 === 2 ? "drum2" : i % 8 === 7 ? "drum3" : `drum${(i % 20) + 1}`;
                            newArr[i] = { drumPart: pId, dur: "16n", vel: 0.95 };
                        } else if (mode === "repeat" && i % 2 === 0) {
                            newArr[i] = { drumPart: i % 4 === 0 ? "drum1" : "drum2", dur: "16n", vel: 0.9 };
                        } else if (mode === "renda") {
                            newArr[i] = { drumPart: "drum3", dur: "32n", vel: 1.0 }; // シンバル連打
                        }
                    } else {
                        if (mode === "random" && Math.random() < 0.35) {
                            newArr[i] = { note: scale[i % scale.length], dur: selectedDuration, vel: selectedVelocity };
                        } else if (mode === "repeat" && i % 2 === 0) {
                            newArr[i] = { note: scale[0], dur: "16n", vel: selectedVelocity };
                        } else if (mode === "renda") {
                            newArr[i] = { note: scale[i % scale.length], dur: "32n", vel: 1.0 };
                        }
                    }
                }
                setInstrumentSteps(prev => ({ ...prev, [type]: newArr }));
                setStatus(`✨ 【${type}】ハイテンポAIパターン生成完了！`);
            };

            const playNoteKeyboard = (note) => {
                setSelectedNote(note);
                const syns = synthsRef.current;
                if (!syns) return;

                if (selectedInstrument === "guitarWood") {
                    playChordManual(selectedChord);
                } else if (selectedInstrument === "drums") {
                    if (syns.drums[selectedDrumPart]) {
                        syns.drums[selectedDrumPart].triggerAttackRelease("C1", selectedDuration, undefined, selectedVelocity);
                    }
                } else if (syns[selectedInstrument]) {
                    syns[selectedInstrument].triggerAttackRelease(note, selectedDuration, undefined, selectedVelocity);
                }

                if (currentStep !== -1) {
                    toggleStep(selectedInstrument, currentBar * BAR_STEPS + currentStep, note);
                }
            };

            const toggleStep = (instKey, idx, val = selectedNote) => {
                setInstrumentSteps(prev => {
                    const currentArr = [...prev[instKey]];
                    if (instKey === "guitarWood") {
                        currentArr[idx] = currentArr[idx] ? null : { chord: selectedChord, style: guitarStyle };
                    } else if (instKey === "drums") {
                        currentArr[idx] = currentArr[idx] ? null : { drumPart: selectedDrumPart, dur: selectedDuration, vel: selectedVelocity };
                    } else {
                        currentArr[idx] = currentArr[idx] ? null : { note: val, dur: selectedDuration, vel: selectedVelocity };
                    }
                    return { ...prev, [instKey]: currentArr };
                });
            };

            const clearInstrument = (instKey) => {
                setInstrumentSteps(prev => ({ ...prev, [instKey]: new Array(TOTAL_STEPS).fill(null) }));
                setStatus(`🗑️ 【${instKey}】をクリアしました。`);
            };

            const isWoodGuitarSelected = selectedInstrument === "guitarWood";
            const panelWoodBgStyle = isWoodGuitarSelected 
                ? "bg-gradient-to-br from-amber-950 via-yellow-900 to-amber-900 border-yellow-600/60 shadow-2xl ring-2 ring-yellow-700/50" 
                : "bg-slate-900/90 border-indigo-900";

            return (
                <div className={`min-h-screen text-slate-100 flex flex-col text-xs font-sans select-none pb-24 overflow-x-hidden border-4 ${isWoodGuitarSelected ? 'bg-amber-950 border-yellow-800' : 'bg-slate-950 border-indigo-900'}`}>
                    
                    <header className={`border-b px-3 py-2 flex items-center justify-between gap-2 sticky top-0 z-40 shadow-xl ${isWoodGuitarSelected ? 'bg-amber-950/95 border-yellow-800' : 'bg-slate-900 border-indigo-800'}`}>
                        <div className="flex items-center gap-2">
                            <span className="font-black text-sm text-yellow-300">
                                🎸 MIC VICTORY DLAND <span className="text-[10px] text-cyan-300 font-bold">v64.0 (シンセ・ベース強化・ドンパシャ)</span>
                            </span>
                        </div>
                        <div className="flex items-center gap-1.5 flex-wrap">
                            <button onClick={() => setShowGridButtons(!showGridButtons)} className={`px-2.5 py-1 rounded font-bold text-[10px] border ${showGridButtons ? 'bg-amber-700 border-yellow-500 text-white' : 'bg-slate-900 border-slate-700 text-slate-300'}`}>
                                {showGridButtons ? '🔳 グリッド表示' : '🔲 非表示'}
                            </button>
                            <button onClick={togglePlay} className={`px-3 py-1 rounded font-bold text-xs shadow ${playing ? "bg-yellow-400 text-slate-950 animate-bounce" : "bg-indigo-600 text-white"}`}>
                                {playing ? "■ 停止" : "▶ 再生"}
                            </button>
                            <button onClick={toggleRecord} className={`px-3 py-1 rounded font-bold text-xs shadow ${isRecording ? "bg-red-600 text-white animate-pulse" : "bg-slate-900 text-red-300 border border-red-800"}`}>
                                {isRecording ? "🔴 記録中" : "⏺️ 記録調整"}
                            </button>
                            <div className="flex items-center gap-1 bg-slate-900 px-2 py-0.5 rounded border border-indigo-900">
                                <span className="text-[9px] text-yellow-400">BPM</span>
                                <input type="number" value={bpm} onChange={e => setBpm(Math.max(60, Math.min(240, Number(e.target.value))))} className="w-12 bg-slate-800 text-center font-bold text-yellow-300 rounded text-xs py-0.5" />
                            </div>
                        </div>
                    </header>

                    <nav className={`border-b px-2 py-1.5 flex gap-1 overflow-x-auto ${isWoodGuitarSelected ? 'bg-amber-900/90 border-yellow-800' : 'bg-indigo-950/80 border-indigo-900'}`}>
                        {[
                            { id: "STUDIO", label: "🎛️ スタジオ & 18小節" },
                            { id: "DRUMS_20", label: "🥁 ドラム20 (ドンパシャ・シンバル)" },
                            { id: "FX_VIBRATO", label: "🎚️ FX・ビブラート調整" },
                            { id: "SAVE_RENGE", label: "💾 保存リスト (蓮華)" },
                        ].map(t => (
                            <button key={t.id} onClick={() => setTab(t.id)} className={`px-3 py-1 rounded text-center font-bold transition-all shrink-0 ${tab === t.id ? "bg-amber-600 text-white shadow" : "bg-slate-900 text-indigo-300"}`}>
                                {t.label}
                            </button>
                        ))}
                    </nav>

                    <div className="bg-slate-900 px-3 py-1 text-[11px] text-cyan-300 border-b border-indigo-900/60 flex justify-between items-center">
                        <span>💡 {status} | 🎵 著作権: micvictorydland</span>
                        {playing && <span className="text-[10px] text-yellow-300 font-mono">小節: {currentBar + 1}/18 [STEP: {currentStep + 1}]</span>}
                    </div>

                    <main className="p-2 flex flex-col gap-3">
                        {tab === "STUDIO" && (
                            <div className="flex flex-col gap-3">
                                <div className={`border rounded-lg p-3 flex flex-col gap-2 shadow-lg ${panelWoodBgStyle}`}>
                                    <div className="flex justify-between items-center flex-wrap gap-2">
                                        <span className={`text-xs font-bold ${isWoodGuitarSelected ? 'text-yellow-200' : 'text-indigo-300'}`}>
                                            {isWoodGuitarSelected ? '🪵 木目ギター (良音コード全表示)' : '① 楽器選択・手動演奏・ベース強化AI'}
                                        </span>
                                        <div className="flex items-center gap-1 bg-slate-950 px-2 py-0.5 rounded border border-indigo-800 text-[10px]">
                                            <span className="text-indigo-400">拍子:</span>
                                            <button onClick={() => setTimeSignature("4/4")} className={`px-1.5 py-0.5 rounded font-bold ${timeSignature === "4/4" ? "bg-amber-600 text-white" : "text-slate-400"}`}>4/4</button>
                                            <button onClick={() => setTimeSignature("3/4")} className={`px-1.5 py-0.5 rounded font-bold ${timeSignature === "3/4" ? "bg-amber-600 text-white" : "text-slate-400"}`}>3/4</button>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-1.5">
                                        {INSTRUMENTS.map(inst => (
                                            <button key={inst.id} onClick={() => setSelectedInstrument(inst.id)} className={`py-2 px-1 rounded-lg font-bold text-[11px] border flex items-center justify-center gap-1 shadow ${selectedInstrument === inst.id ? `bg-gradient-to-r ${inst.color} border-white text-white ring-2 ring-yellow-400` : "bg-slate-950/80 border-indigo-900 text-indigo-300 hover:bg-slate-800"}`}>
                                                {inst.label}
                                            </button>
                                        ))}
                                    </div>

                                    {isWoodGuitarSelected && (
                                        <div className="bg-slate-950/90 p-3 rounded border border-yellow-800 flex flex-col gap-2">
                                            <div className="flex justify-between items-center">
                                                <span className="text-[11px] font-bold text-yellow-300">📌 コード選択 (選択中: <strong className="text-cyan-300">{selectedChord}</strong>)</span>
                                                <div className="flex gap-1 bg-slate-900 p-1 rounded border border-yellow-700">
                                                    {["arpeggio", "cutting"].map(style => (
                                                        <button key={style} onClick={() => setGuitarStyle(style)} className={`px-2 py-0.5 rounded text-[10px] font-bold ${guitarStyle === style ? "bg-yellow-500 text-slate-950" : "text-amber-200"}`}>
                                                            {style === "arpeggio" ? "🎵 アルペジオ" : "⚡ カッティング"}
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>
                                            <div className="grid grid-cols-4 sm:grid-cols-8 gap-1.5">
                                                {GUITAR_CHORDS.map(chord => (
                                                    <button key={chord.name} onClick={() => playChordManual(chord.name)} className={`py-2 px-1 rounded font-black text-xs border shadow ${selectedChord === chord.name ? "bg-yellow-500 text-slate-950 border-white ring-2 ring-yellow-300" : "bg-slate-900 text-amber-100 border-yellow-900"}`}>
                                                        {chord.name}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    <div className="bg-slate-950/90 p-2.5 rounded border border-yellow-700/50 flex flex-wrap gap-2 items-center justify-between">
                                        <span className="text-[10px] font-bold text-yellow-300">✨ AI自動生成 ({selectedInstrument}):</span>
                                        <div className="flex gap-1.5 flex-wrap">
                                            <button onClick={() => generateAiPattern(selectedInstrument, "renda")} className="px-2.5 py-1 bg-purple-900 text-purple-200 font-bold rounded text-[10px]">🔥 連打</button>
                                            <button onClick={() => generateAiPattern(selectedInstrument, "repeat")} className="px-2.5 py-1 bg-blue-900 text-blue-200 font-bold rounded text-[10px]">🔁 リピート</button>
                                            <button onClick={() => generateAiPattern(selectedInstrument, "random")} className="px-2.5 py-1 bg-emerald-900 text-emerald-200 font-bold rounded text-[10px]">🎲 ランダム</button>
                                            <button onClick={() => clearInstrument(selectedInstrument)} className="px-2.5 py-1 bg-red-950 text-red-300 font-bold rounded text-[10px]">クリア</button>
                                        </div>
                                    </div>
                                </div>

                                <div className={`border rounded-lg p-3 flex flex-col gap-3 shadow ${panelWoodBgStyle}`}>
                                    <div className="flex justify-between items-center">
                                        <span className="text-xs font-bold text-yellow-300">② 手動鍵盤 ＆ 18小節エディタ (ベース・シンセ対応)</span>
                                        <span className="text-[10px] text-yellow-200">小節: <strong className="text-yellow-400">{currentBar + 1} / 18</strong></span>
                                    </div>

                                    {!isWoodGuitarSelected && (
                                        <div className="grid grid-cols-5 sm:grid-cols-10 gap-1.5">
                                            {NOTES.map(note => (
                                                <button key={note} onClick={() => playNoteKeyboard(note)} className={`py-3 rounded font-bold text-center border shadow ${selectedNote === note ? "bg-yellow-500 text-slate-950 border-white ring-2 ring-yellow-300" : "bg-slate-950 text-slate-200 border-indigo-900"}`}>
                                                    <div className="text-xs font-black">{note}</div>
                                                </button>
                                            ))}
                                        </div>
                                    )}

                                    <div className="flex gap-1 overflow-x-auto pb-1">
                                        {Array.from({ length: BARS }).map((_, b) => (
                                            <button key={b} onClick={() => setCurrentBar(b)} className={`px-2.5 py-1 rounded text-xs font-bold shrink-0 ${currentBar === b ? "bg-yellow-500 text-slate-950" : "bg-slate-950 text-indigo-300 border border-indigo-900"}`}>
                                                {b + 1}小節
                                            </button>
                                        ))}
                                    </div>

                                    {showGridButtons && (
                                        <div className="overflow-x-auto bg-slate-950 p-2.5 rounded border border-yellow-700/50">
                                            <div className="text-[10px] text-yellow-300 mb-1.5 font-bold">🔳 グリッド記録再生（{currentBar + 1}小節目 / {BAR_STEPS}ステップ）:</div>
                                            <div className="grid gap-1 min-w-[500px]" style={{ gridTemplateColumns: `repeat(${BAR_STEPS}, minmax(0, 1fr))` }}>
                                                {Array.from({ length: BAR_STEPS }).map((_, i) => {
                                                    const stepIdx = currentBar * BAR_STEPS + i;
                                                    const stepVal = instrumentSteps[selectedInstrument][stepIdx];
                                                    const isCurrentPlay = playing && currentStep === i;
                                                    return (
                                                        <button key={i} onClick={() => toggleStep(selectedInstrument, stepIdx)} className={`aspect-[3/4] w-full rounded border flex flex-col items-center justify-center text-[9px] ${stepVal ? "bg-yellow-500 border-white text-slate-950 font-black" : "bg-slate-900/60 border-indigo-950 text-indigo-300"} ${isCurrentPlay ? "ring-2 ring-cyan-400" : ""}`}>
                                                            <span>{i + 1}</span>
                                                            {stepVal && <span className="text-[6px] text-slate-950 font-bold">{stepVal.chord || '打'}</span>}
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {tab === "DRUMS_20" && (
                            <div className="bg-slate-900/90 border border-indigo-900 rounded-lg p-4 flex flex-col gap-3">
                                <span className="text-xs font-bold text-yellow-300">🥁 ドラム 20種類 (ドン・パシャ・シンバル強化)</span>
                                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                                    {DRUM_20_PARTS.map(part => (
                                        <button key={part.id} onClick={() => setSelectedDrumPart(part.id)} className={`py-2 px-2 rounded text-left text-[11px] font-bold border ${selectedDrumPart === part.id ? "bg-red-600 text-white border-white" : "bg-slate-950 text-indigo-300 border-indigo-900"}`}>
                                            {part.label}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        {tab === "FX_VIBRATO" && (
                            <div className="bg-slate-900/90 border border-indigo-900 rounded-lg p-4 flex flex-col gap-4">
                                <span className="text-xs font-bold text-yellow-300">🎚️ FX・ビブラート・ベロシティ調整</span>
                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                    <div className="bg-slate-950 p-3 rounded border border-indigo-900 flex flex-col gap-2">
                                        <span className="text-[11px] font-bold text-indigo-300">FX機能</span>
                                        <select value={selectedFxType} onChange={e => setSelectedFxType(e.target.value)} className="bg-slate-900 p-2 rounded text-indigo-200 font-bold border">
                                            <option value="reverb">リバーブ</option>
                                            <option value="delay">ディレイ</option>
                                        </select>
                                    </div>
                                    <div className="bg-slate-950 p-3 rounded border border-indigo-900 flex flex-col gap-2">
                                        <span className="text-[11px] font-bold text-indigo-300">ビブラート: {vibratoDepth}</span>
                                        <input type="range" min="0" max="1" step="0.05" value={vibratoDepth} onChange={e => setVibratoDepth(Number(e.target.value))} />
                                    </div>
                                    <div className="bg-slate-950 p-3 rounded border border-indigo-900 flex flex-col gap-2">
                                        <span className="text-[11px] font-bold text-indigo-300">強弱: {selectedVelocity}</span>
                                        <input type="range" min="0.2" max="1" step="0.1" value={selectedVelocity} onChange={e => setSelectedVelocity(Number(e.target.value))} />
                                    </div>
                                </div>
                            </div>
                        )}

                        {tab === "SAVE_RENGE" && (
                            <div className="bg-slate-900/90 border border-indigo-900 rounded-lg p-4 flex flex-col gap-3">
                                <span className="text-xs font-bold text-yellow-300">💾 保存リスト (蓮華ストレージ)</span>
                                <div className="bg-slate-950 p-3 rounded border border-indigo-900 flex flex-col gap-2">
                                    {saveLists.map(item => (
                                        <div key={item.id} className="flex justify-between items-center bg-slate-900 p-2 rounded border">
                                            <div>
                                                <div className="text-cyan-300 font-bold text-xs">{item.title}</div>
                                                <div className="text-[10px] text-indigo-300">保存先: {item.type} | 著作権: {item.copyright}</div>
                                            </div>
                                            <button onClick={() => setSaveLists(saveLists.filter(x => x.id !== item.id))} className="px-2 py-1 bg-red-950 text-red-300 rounded text-[10px]">削除</button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<UltimateDlandApp />);
    </script>
</body>
</html>
