<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piano & Violin Solfa Special DAW</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #0b0907; color: #f5f0e6; margin: 0; padding: 20px; }
        h1, h2, h3 { color: #f2a900; border-bottom: 1px solid #3d2c1e; padding-bottom: 8px; margin: 10px 0; letter-spacing: 1px; }
        .section { background: #1a1410; padding: 15px 20px; margin-bottom: 15px; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.8); border: 1px solid #4a3520; }
        button { background: linear-gradient(135deg, #f2a900, #c67d00); color: #0f0c08; border: none; padding: 8px 15px; margin: 3px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.4); }
        button:hover { background: linear-gradient(135deg, #ffc233, #f2a900); transform: translateY(-1px); }
        button.clear-btn { background: linear-gradient(135deg, #a62b14, #661505); color: #fff; }
        button.clear-btn:hover { background: linear-gradient(135deg, #c7351a, #881c07); }
        select, input { background: #261d15; color: #f5f0e6; border: 1px solid #594028; padding: 6px; border-radius: 6px; margin: 3px; font-size: 12px; outline: none; font-family: inherit; }
        .grid-18 { display: grid; grid-template-columns: repeat(18, 1fr); gap: 4px; margin-top: 8px; overflow-x: auto; }
        .step-cell { background: #261d15; height: 35px; text-align: center; font-size: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; border-radius: 4px; user-select: none; color: #8c735e; border: 1px solid #38291e; transition: 0.1s; }
        .step-cell.active { background: #f2a900; color: #0f0c08; font-weight: bold; border-color: #ffe066; box-shadow: 0 0 10px rgba(242,169,0,0.6); }
        .step-cell.current-playing { border: 2px solid #fff !important; transform: scale(1.05); }
        .flex { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .summary-box { background: #120e0b; padding: 12px; border-radius: 8px; font-size: 12px; margin-top: 10px; color: #b89b82; border: 1px solid #332418; max-height: 150px; overflow-y: auto; }
        
        .keyboard-container { display: flex; gap: 4px; margin-top: 10px; overflow-x: auto; padding: 10px; background: #120e0b; border-radius: 6px; border: 1px solid #332418; justify-content: center; }
        .piano-key { width: 50px; height: 85px; background: #eaeaf0; color: #111; border: 1px solid #444; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 6px; font-size: 11px; font-weight: bold; cursor: pointer; border-radius: 0 0 6px 6px; user-select: none; }
        .piano-key:active, .piano-key.playing { background: #f2a900 !important; color: #0f0c08 !important; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal-content { background: #1a1410; padding: 25px; border-radius: 16px; width: 90%; max-width: 650px; box-shadow: 0 12px 40px rgba(0,0,0,0.9); border: 1px solid #f2a900; }
        .sub-grid-16 { display: grid; grid-template-columns: repeat(16, 1fr); gap: 3px; margin: 12px 0; }
        .sub-step-cell { background: #261d15; height: 42px; text-align: center; font-size: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 4px; color: #8c735e; border: 1px solid #38291e; }
        .sub-step-cell.active { background: #f2a900; color: #0f0c08; font-weight: bold; }
        .mode-badge { padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; }
        .mode-manual { background: #204060; color: #fff; }
        .mode-ai { background: #603010; color: #f2a900; }
    </style>
</head>
<body>

    <h1>🎹🎻 ピアノ＆バイオリン ドレミファ特化型 DAW</h1>

    <!-- マスターコントロール -->
    <div class="section" style="border: 2px solid #f2a900;">
        <h2>🎛️ デュオ・マスターコントロールルーム</h2>
        <div class="flex">
            <button onclick="masterPlay()" style="font-size: 13px;">▶ デュオ全体再生</button>
            <button onclick="masterStop()" style="font-size: 13px;">⏹ 停止</button>
            <button class="clear-btn" onclick="masterClear()">🗑 全パート一括Clear</button>
            <button onclick="generateAllAi()" style="background: linear-gradient(135deg, #ff4500, #ff8c00); color: #fff; font-size: 13px;">🤖 両楽器AI自動作曲</button>
            <label><input type="checkbox" id="repeatToggle" checked> ループ再生</label>
            <span>テンポ (BPM): <input type="number" id="bpmInput" value="120" min="50" max="240" style="width: 55px;"></span>
        </div>
        <div class="flex" style="margin-top: 10px; border-top: 1px dashed #3d2c1e; padding-top: 10px;">
            <span>🎚 マスター音量: <input type="range" min="0" max="1.5" step="0.05" value="0.9" id="masterVolumeControl" style="width: 80px;" onchange="updateMasterVolume(this.value)"></span>
            <span>🌌 リバーブ空間: <input type="range" min="0" max="1" step="0.05" value="0.3" id="reverbControl" style="width: 70px;"></span>
        </div>
    </div>

    <!-- ボーカル・アルバム登録 -->
    <div class="section" style="border: 1px solid #f2a900;">
        <h2>🎙️ ボーカル録音・試聴・アルバム登録</h2>
        <div class="flex">
            <button onclick="startVocalRecording()" style="background: #a62b14; color:#fff;">🔴 ボーカル録音</button>
            <button onclick="stopVocalRecording()">⏹ 録音停止</button>
            <button onclick="playVocal()" style="background: #205030; color:#fff;">▶ 試聴</button>
            <button onclick="saveVocalData()" style="background: #204060; color:#fff;">💾 保存</button>
            <button class="clear-btn" onclick="clearVocal()">🗑 Clear</button>
            <button onclick="addToList()">➕ アルバム登録</button>
        </div>
        <div style="margin-top: 10px;"><audio id="vocalAudio" controls style="height: 35px; width: 100%;"></audio></div>
        <div id="compositionListContainer" class="summary-box">アルバム登録曲はまだありません。</div>
    </div>

    <!-- ドレミファ共通リアルタイム鍵盤 -->
    <div class="section" style="border: 1px solid #f2a900;">
        <h2>🎹 ドレミファ鍵盤 (リアルタイム演奏・記録)</h2>
        <div class="flex">
            <span>記録対象パート: 
                <select id="liveTargetTrack">
                    <option value="piano">🎹 ピアノ</option>
                    <option value="violin">🎻 バイオリン</option>
                </select>
            </span>
            <button onclick="startLiveRecording()" style="background: #a62b14; color:#fff;">🔴 鍵盤記録開始</button>
            <button onclick="stopLiveRecording()">⏹ 記録停止</button>
        </div>
        <div class="keyboard-container" id="masterKeyboard"></div>
    </div>

    <!-- ピアノ・バイオリン トラックコンテナ -->
    <div id="tracksContainer"></div>

    <!-- 1小節詳細エディター モーダル -->
    <div id="barEditorModal" class="modal-overlay">
        <div class="modal-content">
            <h2 id="modalTitle" style="color: #f2a900;">1小節手動エディター</h2>
            <div class="flex">
                <span>編集小節: <select id="modalBarSelect" onchange="changeEditingBar()"></select></span>
                <button onclick="copyCurrentBar()" style="background: #205030; color:#fff;">📋 コピー</button>
                <button onclick="pasteBarData()" style="background: #204060; color:#fff;">📋 ペースト</button>
            </div>
            <div style="margin-top: 15px;">
                <div style="font-size: 12px; margin-bottom: 6px; color: #f2a900;">16分音符グリッド (音程指定):</div>
                <div class="sub-grid-16" id="subGridContainer"></div>
            </div>
            <div class="flex" style="margin-top: 25px; justify-content: flex-end;">
                <button onclick="playBarPreview()">▶ この小節を試聴</button>
                <button onclick="closeBarEditor()" style="background: #38291e; color: #f5f0e6;">閉じる</button>
            </div>
        </div>
    </div>

    <script>
        const instruments = [
            { id: 'piano', name: '🎹 ピアノ', aiStyles: ['アルペジオ分散和音', 'アップコード伴奏', 'シンコペーション', '疾走16分連打', 'エモーショナルコード'] },
            { id: 'violin', name: '🎻 バイオリン', aiStyles: ['情熱ロングトーン', 'スタッカート刻み', '華麗なトリル', 'ドラマチックソロ', 'レガート奏法'] }
        ];

        const solfaNotes = [
            { name: 'ド', noteName: 'C4', freq: 261.63 },
            { name: 'レ', noteName: 'D4', freq: 293.66 },
            { name: 'ミ', noteName: 'E4', freq: 329.63 },
            { name: 'ファ', noteName: 'F4', freq: 349.23 },
            { name: 'ソ', noteName: 'G4', freq: 392.00 },
            { name: 'ラ', noteName: 'A4', freq: 440.00 },
            { name: 'シ', noteName: 'B4', freq: 493.88 },
            { name: '高ド', noteName: 'C5', freq: 523.25 }
        ];

        let songData = {
            title: 'ピアノ＆バイオリン・ドレミファデュオ',
            trackData: {},
            trackNotes: {},
            subBarData: {},
            subBarNotes: {},
            aiChoices: {},
            trackModes: {}
        };

        let audioCtx = null, masterGainNode = null, compressorNode = null, reverbNode = null;
        let isPlaying = false, currentTimer = null;
        let mediaRecorder, recordedChunks = [], vocalAudioBlob = null, savedList = [];
        let currentEditingTrack = null, currentEditingBarIndex = 0;
        let copiedBarBuffer = null, copiedNotesBuffer = null, isLiveRecording = false;

        function initApp() {
            instruments.forEach(inst => {
                songData.trackData[inst.id] = new Array(18).fill(false);
                songData.trackNotes[inst.id] = new Array(18).fill(0);
                songData.subBarData[inst.id] = Array.from({ length: 18 }, () => new Array(16).fill(false));
                songData.subBarNotes[inst.id] = Array.from({ length: 18 }, () => new Array(16).fill(0));
                songData.aiChoices[inst.id] = 0;
                songData.trackModes[inst.id] = 'manual';
            });
            renderTracks();
            renderMasterKeyboard();
            initBarSelect();
        }

        function initBarSelect() {
            const barSelect = document.getElementById('modalBarSelect');
            barSelect.innerHTML = '';
            for(let b=0; b<18; b++) {
                let opt = document.createElement('option');
                opt.value = b;
                opt.innerText = `第 ${b + 1} 小節`;
                barSelect.appendChild(opt);
            }
        }

        function renderTracks() {
            const container = document.getElementById('tracksContainer');
            container.innerHTML = '';

            instruments.forEach(inst => {
                const div = document.createElement('div');
                div.className = 'section';
                
                let styleOptions = '';
                inst.aiStyles.forEach((styleName, sIdx) => {
                    let selected = (songData.aiChoices[inst.id] === sIdx) ? 'selected' : '';
                    styleOptions += `<option value="${sIdx}" ${selected}>🤖 [${styleName}]</option>`;
                });

                let currentMode = songData.trackModes[inst.id] || 'manual';
                let modeBadgeText = currentMode === 'manual' ? '✏️ 手動打ち込み' : '🤖 AI自動生成';
                let modeBadgeClass = currentMode === 'manual' ? 'mode-manual' : 'mode-ai';

                div.innerHTML = `
                    <h3>${inst.name} <span id="badge-${inst.id}" class="mode-badge ${modeBadgeClass}">${modeBadgeText}</span></h3>
                    <div class="flex">
                        <span>切替: 
                            <select id="mode-sel-${inst.id}" onchange="changeTrackMode('${inst.id}', this.value)" style="font-weight: bold; color: #f2a900;">
                                <option value="manual" ${currentMode==='manual'?'selected':''}>✏️ 手動</option>
                                <option value="ai" ${currentMode==='ai'?'selected':''}>🤖 AI</option>
                            </select>
                        </span>
                        <span>パターン: 
                            <select id="ai-sel-${inst.id}" onchange="updateAiChoice('${inst.id}', this.value)">
                                ${styleOptions}
                            </select>
                        </span>
                        <button onclick="applyTrackAi('${inst.id}', document.getElementById('ai-sel-${inst.id}').value)" style="background: linear-gradient(135deg, #205030, #103020); color:#fff;">✨ AI反映</button>
                        <button onclick="openBarEditor('${inst.id}')" style="background: linear-gradient(135deg, #f2a900, #c67d00); color: #0f0c08;">🔍 エディター</button>
                        <button onclick="playTrackPreview('${inst.id}')">▶ 試聴</button>
                        <button class="clear-btn" onclick="clearTrack('${inst.id}')">🗑 Clear</button>
                    </div>
                    <div class="grid-18" id="grid-${inst.id}"></div>
                `;
                container.appendChild(div);
                renderGrid(inst.id);
            });
        }

        function changeTrackMode(id, mode) {
            songData.trackModes[id] = mode;
            const badge = document.getElementById(`badge-${id}`);
            if (badge) {
                badge.innerText = mode === 'manual' ? '✏️ 手動打ち込み' : '🤖 AI自動生成';
                badge.className = `mode-badge ${mode === 'manual' ? 'mode-manual' : 'mode-ai'}`;
            }
        }

        function updateAiChoice(id, styleIndex) { songData.aiChoices[id] = parseInt(styleIndex); }

        function applyTrackAi(id, styleIndex) {
            const sIdx = parseInt(styleIndex);
            songData.aiChoices[id] = sIdx;
            changeTrackMode(id, 'ai');
            document.getElementById(`mode-sel-${id}`).value = 'ai';

            let tData = songData.trackData[id];
            let tNotes = songData.trackNotes[id];
            let subData = songData.subBarData[id];
            let subNotes = songData.subBarNotes[id];

            tData.fill(false);
            for(let b=0; b<18; b++) subData[b].fill(false);

            for(let i=0; i<18; i++) {
                if (i % 2 === 0 || i % 3 === 0) {
                    tData[i] = true;
                    tNotes[i] = (i + sIdx) % 8;
                    let subStep = (i * 2) % 16;
                    subData[i][subStep] = true;
                    subNotes[i][subStep] = (i + sIdx) % 8;
                }
            }
            renderGrid(id);
        }

        function generateAllAi() {
            instruments.forEach(inst => {
                const randomStyle = Math.floor(Math.random() * inst.aiStyles.length);
                const sel = document.getElementById(`ai-sel-${inst.id}`);
                if(sel) sel.value = randomStyle;
                applyTrackAi(inst.id, randomStyle);
            });
            alert('🤖 ピアノとバイオリンに美しいドレミファAIフレーズを生成しました！');
        }

        function renderMasterKeyboard() {
            const kbContainer = document.getElementById('masterKeyboard');
            kbContainer.innerHTML = '';
            solfaNotes.forEach((note, idx) => {
                const key = document.createElement('div');
                key.className = 'piano-key';
                key.innerHTML = `<span>${note.name}</span><span style="font-size:9px; color:#666;">${note.noteName}</span>`;
                key.onmousedown = () => {
                    key.classList.add('playing');
                    playTone(note.freq, 0.3);
                    if (isLiveRecording) {
                        const targetTr = document.getElementById('liveTargetTrack').value;
                        changeTrackMode(targetTr, 'manual');
                        document.getElementById(`mode-sel-${targetTr}`).value = 'manual';
                        const randStep = Math.floor(Math.random() * 18);
                        songData.trackData[targetTr][randStep] = true;
                        songData.trackNotes[targetTr][randStep] = idx;
                        renderGrid(targetTr);
                    }
                    setTimeout(() => key.classList.remove('playing'), 200);
                };
                kbContainer.appendChild(key);
            });
        }

        function playTone(freq, duration = 0.3) {
            const ctx = getAudioContext();
            const now = ctx.currentTime;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now);
            osc.connect(gain);
            connectWithMaster(ctx, gain);
            gain.gain.setValueAtTime(0.4, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
            osc.start(now);
            osc.stop(now + duration);
        }

        function renderGrid(id) {
            const grid = document.getElementById(`grid-${id}`);
            if(!grid) return;
            grid.innerHTML = '';
            let tData = songData.trackData[id];
            let tNotes = songData.trackNotes[id];

            for (let i = 0; i < 18; i++) {
                const cell = document.createElement('div');
                cell.className = `step-cell ${tData[i] ? 'active' : ''}`;
                cell.id = `cell-${id}-${i}`;
                let noteLabel = tData[i] ? solfaNotes[tNotes[i]].name : '';
                cell.innerHTML = `<span>${i + 1}</span><span style="font-size:9px; font-weight:bold;">${noteLabel}</span>`;
                
                cell.onclick = () => {
                    changeTrackMode(id, 'manual');
                    document.getElementById(`mode-sel-${id}`).value = 'manual';
                    if (!tData[i]) {
                        tData[i] = true;
                        tNotes[i] = 0;
                    } else {
                        tNotes[i] = (tNotes[i] + 1) % 8;
                        if(tNotes[i] === 0) tData[i] = false;
                    }
                    renderGrid(id);
                };
                grid.appendChild(cell);
            }
        }

        function openBarEditor(trackId) {
            currentEditingTrack = trackId;
            currentEditingBarIndex = parseInt(document.getElementById('modalBarSelect').value);
            const instObj = instruments.find(i => i.id === trackId);
            document.getElementById('modalTitle').innerText = `${instObj.name} - 1小節手動エディター`;
            renderSubGrid();
            document.getElementById('barEditorModal').style.display = 'flex';
        }

        function closeBarEditor() { document.getElementById('barEditorModal').style.display = 'none'; }
        function changeEditingBar() { currentEditingBarIndex = parseInt(document.getElementById('modalBarSelect').value); renderSubGrid(); }

        function copyCurrentBar() {
            copiedBarBuffer = [...songData.subBarData[currentEditingTrack][currentEditingBarIndex]];
            copiedNotesBuffer = [...songData.subBarNotes[currentEditingTrack][currentEditingBarIndex]];
            alert(`第 ${currentEditingBarIndex + 1} 小節をコピーしました！`);
        }

        function pasteBarData() {
            if (!copiedBarBuffer) return alert('コピーデータがありません。');
            changeTrackMode(currentEditingTrack, 'manual');
            document.getElementById(`mode-sel-${currentEditingTrack}`).value = 'manual';
            songData.subBarData[currentEditingTrack][currentEditingBarIndex] = [...copiedBarBuffer];
            songData.subBarNotes[currentEditingTrack][currentEditingBarIndex] = [...copiedNotesBuffer];
            songData.trackData[currentEditingTrack][currentEditingBarIndex] = copiedBarBuffer.some(v => v);
            renderSubGrid();
            renderGrid(currentEditingTrack);
            alert('ペーストしました！');
        }

        function renderSubGrid() {
            const container = document.getElementById('subGridContainer');
            container.innerHTML = '';
            const data = songData.subBarData[currentEditingTrack][currentEditingBarIndex];
            const notes = songData.subBarNotes[currentEditingTrack][currentEditingBarIndex];

            for (let s = 0; s < 16; s++) {
                const cell = document.createElement('div');
                cell.className = `sub-step-cell ${data[s] ? 'active' : ''}`;
                let noteName = data[s] ? solfaNotes[notes[s]].name : (s + 1);
                cell.innerHTML = `<span>${s+1}</span><span style="font-size:9px; color:${data[s]?'#0f0c08':'#8c735e'}">${noteName}</span>`;
                
                cell.onclick = () => {
                    changeTrackMode(currentEditingTrack, 'manual');
                    document.getElementById(`mode-sel-${currentEditingTrack}`).value = 'manual';
                    if (!data[s]) {
                        data[s] = true;
                        notes[s] = 0;
                    } else {
                        notes[s] = (notes[s] + 1) % 8;
                        if(notes[s] === 0) data[s] = false;
                    }
                    songData.trackData[currentEditingTrack][currentEditingBarIndex] = data.some(v => v);
                    renderGrid(currentEditingTrack);
                    renderSubGrid();
                };
                container.appendChild(cell);
            }
        }

        function playBarPreview() {
            if (!currentEditingTrack) return;
            const data = songData.subBarData[currentEditingTrack][currentEditingBarIndex];
            const notes = songData.subBarNotes[currentEditingTrack][currentEditingBarIndex];
            const bpm = document.getElementById('bpmInput').value;
            const interval = (60 / bpm) * 250;
            data.forEach((isActive, idx) => {
                if (isActive) {
                    setTimeout(() => playInstrumentNote(currentEditingTrack, notes[idx]), idx * interval);
                }
            });
        }

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                masterGainNode = audioCtx.createGain();
                masterGainNode.gain.value = parseFloat(document.getElementById('masterVolumeControl').value);
                compressorNode = audioCtx.createDynamicsCompressor();
                compressorNode.threshold.setValueAtTime(-20, audioCtx.currentTime);
                compressorNode.ratio.setValueAtTime(4, audioCtx.currentTime);
                compressorNode.connect(masterGainNode);
                masterGainNode.connect(audioCtx.destination);
                createReverbImpulse();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function updateMasterVolume(val) {
            if (masterGainNode && audioCtx) masterGainNode.gain.setValueAtTime(parseFloat(val), audioCtx.currentTime);
        }

        function createReverbImpulse() {
            const rate = audioCtx.sampleRate;
            const length = rate * 1.5;
            const impulse = audioCtx.createBuffer(2, length, rate);
            const left = impulse.getChannelData(0);
            const right = impulse.getChannelData(1);
            for (let i = 0; i < length; i++) {
                left[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, 2.0);
                right[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, 2.0);
            }
            reverbNode = audioCtx.createConvolver();
            reverbNode.buffer = impulse;
        }

        function connectWithMaster(ctx, node) {
            const reverbGain = ctx.createGain();
            reverbGain.gain.setValueAtTime(parseFloat(document.getElementById('reverbControl').value) || 0.3, ctx.currentTime);
            if (reverbNode) {
                node.connect(reverbNode);
                reverbNode.connect(reverbGain);
                reverbGain.connect(compressorNode);
            }
            node.connect(compressorNode);
        }

        function playInstrumentNote(instId, noteIndex) {
            const ctx = getAudioContext();
            const now = ctx.currentTime;
            const freq = solfaNotes[noteIndex].freq;
            const gain = ctx.createGain();
            gain.gain.setValueAtTime(0.6, now);
            connectWithMaster(ctx, gain);

            const osc = ctx.createOscillator();
            if (instId === 'piano') {
                osc.type = 'sine';
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);
            } else { // violin
                osc.type = 'sawtooth';
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);
            }
            osc.frequency.setValueAtTime(freq, now);
            osc.connect(gain);
            osc.start(now);
            osc.stop(now + 0.5);
        }

        function clearTrack(id) {
            songData.trackData[id].fill(false);
            songData.trackNotes[id].fill(0);
            songData.subBarData[id] = Array.from({ length: 18 }, () => new Array(16).fill(false));
            songData.subBarNotes[id] = Array.from({ length: 18 }, () => new Array(16).fill(0));
            renderGrid(id);
        }

        function playTrackPreview(id) {
            let step = 0;
            const interval = (60 / document.getElementById('bpmInput').value) * 500;
            let tData = songData.trackData[id];
            let tNotes = songData.trackNotes[id];
            const timer = setInterval(() => {
                if(tData[step]) playInstrumentNote(id, tNotes[step]);
                step++;
                if (step >= 18) clearInterval(timer);
            }, interval);
        }

        function startLiveRecording() { isLiveRecording = true; alert('鍵盤記録を開始しました！'); }
        function stopLiveRecording() { isLiveRecording = false; alert('鍵盤記録を終了しました。'); }

        function masterPlay() {
            if (isPlaying) return;
            isPlaying = true;
            let currentStep = 0;
            const bpm = document.getElementById('bpmInput').value;
            const interval = (60 / bpm) * 500;
            let tData = songData.trackData;
            let tNotes = songData.trackNotes;

            currentTimer = setInterval(() => {
                instruments.forEach(inst => {
                    const cell = document.getElementById(`cell-${inst.id}-${currentStep}`);
                    if (cell) {
                        cell.classList.add('current-playing');
                        setTimeout(() => cell.classList.remove('current-playing'), interval * 0.9);
                    }
                });

                Object.keys(tData).forEach(id => {
                    if (tData[id][currentStep]) playInstrumentNote(id, tNotes[id][currentStep]);
                });

                currentStep++;
                if (currentStep >= 18) {
                    currentStep = 0;
                    if (!document.getElementById('repeatToggle').checked) masterStop();
                }
            }, interval);
        }

        function masterStop() { isPlaying = false; if (currentTimer) { clearInterval(currentTimer); currentTimer = null; } }
        function masterClear() { masterStop(); instruments.forEach(inst => clearTrack(inst.id)); }

        async function startVocalRecording() {
            recordedChunks = [];
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    vocalAudioBlob = new Blob(recordedChunks, { type: 'audio/webm' });
                    document.getElementById('vocalAudio').src = URL.createObjectURL(vocalAudioBlob);
                };
                mediaRecorder.start();
                alert('🎙️ ボーカルマイク録音中...');
            } catch(e) { alert('マイクへのアクセスが許可されていません。'); }
        }

        function stopVocalRecording() { if (mediaRecorder) mediaRecorder.stop(); alert('ボーカル録音を停止しました。'); }
        function playVocal() { const aud = document.getElementById('vocalAudio'); if (aud.src) aud.play(); else alert('再生するボーカルデータがありません。'); }
        function saveVocalData() {
            if (!vocalAudioBlob) return alert('保存データがありません。');
            const url = URL.createObjectURL(vocalAudioBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'vocal_take.webm';
            a.click();
        }
        function clearVocal() { vocalAudioBlob = null; document.getElementById('vocalAudio').src = ''; alert('クリアしました。'); }
        function addToList() {
            savedList.push(songData.title);
            document.getElementById('compositionListContainer').innerHTML = savedList.map((item, i) => `<div>💿 登録曲 ${i+1}: ${item}</div>`).join('');
            alert('アルバムリストに登録しました！');
        }

        window.onload = initApp;
    </script>
</body>
</html>
