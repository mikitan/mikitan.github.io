<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>完全統合型 18小節ステレオDAW & 楽器コンポーザー</title>
    <style>
        body { font-family: sans-serif; background: #0f0f13; color: #f0f0f5; margin: 0; padding: 10px; }
        h1, h2, h3 { color: #d0bcff; border-bottom: 1px solid #2b2b36; padding-bottom: 4px; margin: 8px 0; }
        .section { background: #181820; padding: 10px 12px; margin-bottom: 10px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
        button { background: #6750a4; color: white; border: none; padding: 6px 10px; margin: 2px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 11px; }
        button:hover { background: #4f378b; }
        button.clear-btn { background: #b3261e; }
        button.clear-btn:hover { background: #8c1d18; }
        select, input { background: #2b2b36; color: white; border: 1px solid #44474f; padding: 4px; border-radius: 4px; margin: 2px; font-size: 11px; }
        .grid-18 { display: grid; grid-template-columns: repeat(18, 1fr); gap: 2px; margin-top: 4px; overflow-x: auto; }
        .step-cell { background: #2b2b36; height: 24px; text-align: center; font-size: 9px; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 2px; user-select: none; }
        .step-cell.active { background: #0ef3d6; color: #000; font-weight: bold; }
        .flex { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        .summary-box { background: #22222d; padding: 8px; border-radius: 6px; font-size: 12px; margin-top: 6px; }
        
        .keyboard-container { display: flex; gap: 2px; margin-top: 6px; overflow-x: auto; padding: 4px; background: #111116; border-radius: 4px; }
        .piano-key { width: 28px; height: 50px; background: #fff; color: #000; border: 1px solid #444; display: flex; align-items: flex-end; justify-content: center; font-size: 9px; font-weight: bold; cursor: pointer; border-radius: 0 0 3px 3px; user-select: none; }
        .piano-key.black { width: 18px; height: 32px; background: #222; color: #fff; margin-left: -10px; margin-right: -10px; z-index: 2; border-radius: 0 0 2px 2px; }
        .piano-key:active, .piano-key.playing { background: #0ef3d6 !important; color: #000; }
    </style>
</head>
<body>

    <h1>🎵 18小節ステレオDAWコンポーザー (完全統合版)</h1>

    <div class="section">
        <h2>マスターコントロール & アルバム情報</h2>
        <div class="flex">
            <button onclick="masterPlay()">▶ 全体再生</button>
            <button onclick="masterStop()">⏹ 停止</button>
            <button class="clear-btn" onclick="masterClear()">🗑 全体クリア</button>
            <button onclick="saveProject()">💾 プロジェクト保存</button>
            <label><input type="checkbox" id="repeatToggle"> リピート</label>
            <label><input type="checkbox" id="randomToggle"> ランダム</label>
            <span>BPM: <input type="number" id="bpmInput" value="115" min="40" max="240" style="width: 45px;"></span>
        </div>
    </div>

    <div id="tracksContainer"></div>

    <div class="section">
        <h2>📋 18小節まとめ一覧 & 合成リスト・ボーカル記録</h2>
        <div class="flex">
            <button onclick="addToList()">➕ 現在の構成をリストに追加</button>
            <button onclick="exportAudioMix()">📥 音源合成して書き出し（WAV）</button>
        </div>
        <div id="compositionListContainer" class="summary-box">
            ここにセーブされたアレンジ・リストが表示されます。
        </div>
        <div class="flex" style="margin-top: 10px;">
            <button onclick="startRecording()">🔴 録音開始</button>
            <button onclick="stopRecording()">⏹ 録音停止</button>
            <button onclick="playVocal()">▶ 再生</button>
            <button class="clear-btn" onclick="clearVocal()">🗑 削除</button>
            <audio id="vocalAudio" controls style="height: 28px;"></audio>
        </div>
    </div>

    <script>
        const instruments = [
            { id: 'melody', name: 'ドレミファ (メインメロディ)' },
            { id: 'guitar', name: 'ギター (ナイロン / スチール / エレキ)' },
            { id: 'harmonica', name: 'ハーモニカ' },
            { id: 'violin', name: 'バイオリン' },
            { id: 'synth', name: 'シンセサイザー' },
            { id: 'piano', name: 'ピアノ' },
            { id: 'bass', name: 'ベース' },
            { id: 'drums', name: 'ドラム' }
        ];

        let trackData = {};
        let trackSettings = {};
        let audioCtx = null;
        let isPlaying = false;
        let currentTimer = null;
        let mediaRecorder;
        let recordedChunks = [];
        let vocalAudioBlob = null;
        let savedList = [];

        const pianoNotes = [
            { name: 'C4', freq: 261.63, type: 'white' },
            { name: 'C#4', freq: 277.18, type: 'black' },
            { name: 'D4', freq: 293.66, type: 'white' },
            { name: 'D#4', freq: 311.13, type: 'black' },
            { name: 'E4', freq: 329.63, type: 'white' },
            { name: 'F4', freq: 349.23, type: 'white' },
            { name: 'F#4', freq: 369.99, type: 'black' },
            { name: 'G4', freq: 392.00, type: 'white' },
            { name: 'G#4', freq: 415.30, type: 'black' },
            { name: 'A4', freq: 440.00, type: 'white' },
            { name: 'A#4', freq: 466.16, type: 'black' },
            { name: 'B4', freq: 493.88, type: 'white' },
            { name: 'C5', freq: 523.25, type: 'white' }
        ];

        function initApp() {
            const container = document.getElementById('tracksContainer');
            container.innerHTML = '';
            instruments.forEach(inst => {
                trackData[inst.id] = new Array(18).fill(false);
                trackSettings[inst.id] = { subType: 'nylon', volume: 0.8, pan: 0 };

                const div = document.createElement('div');
                div.className = 'section';
                
                let extraControls = '';
                if (inst.id === 'guitar') {
                    extraControls = `
                        <span>弦タイプ: 
                            <select id="setting-${inst.id}" onchange="updateSubType('${inst.id}')">
                                <option value="nylon">ナイロン弦</option>
                                <option value="steel">スチール弦</option>
                                <option value="electric">エレキ弦</option>
                            </select>
                        </span>`;
                } else if (inst.id === 'synth') {
                    extraControls = `
                        <span>波形: 
                            <select id="setting-${inst.id}" onchange="updateSubType('${inst.id}')">
                                <option value="sawtooth">ソウ・リード</option>
                                <option value="square">スクエア</option>
                                <option value="sine">サイン</option>
                            </select>
                        </span>`;
                }

                div.innerHTML = `
                    <h3>${inst.name}</h3>
                    <div class="flex">
                        <button onclick="aiCompose('${inst.id}')">🤖 AI機能自動</button>
                        <button onclick="playTrackPreview('${inst.id}')">▶ 試聴再生</button>
                        <button onclick="saveTrackData('${inst.id}')">💾 保存</button>
                        <button class="clear-btn" onclick="clearTrack('${inst.id}')">🗑 クリア</button>
                        ${extraControls}
                        <span>音量: <input type="range" min="0" max="1" step="0.1" value="0.8" onchange="updateVolume('${inst.id}', this.value)" style="width: 50px;"></span>
                        <span>パン: <input type="range" min="-1" max="1" step="0.1" value="0" onchange="updatePan('${inst.id}', this.value)" style="width: 50px;"></span>
                    </div>
                    <div class="grid-18" id="grid-${inst.id}"></div>
                    <div style="margin-top: 4px; font-size: 10px; color: #a0a0b0;">🎹 手動打ち込み鍵盤 (クリックでリアルタイム試奏)</div>
                    <div class="keyboard-container" id="keyboard-${inst.id}"></div>
                `;
                container.appendChild(div);
                renderGrid(inst.id);
                renderKeyboard(inst.id);
            });
        }

        function renderGrid(id) {
            const grid = document.getElementById(`grid-${id}`);
            grid.innerHTML = '';
            for (let i = 0; i < 18; i++) {
                const cell = document.createElement('div');
                cell.className = `step-cell ${trackData[id][i] ? 'active' : ''}`;
                cell.innerText = i + 1;
                cell.onclick = () => {
                    trackData[id][i] = !trackData[id][i];
                    renderGrid(id);
                };
                grid.appendChild(cell);
            }
        }

        function renderKeyboard(id) {
            const kbContainer = document.getElementById(`keyboard-${id}`);
            kbContainer.innerHTML = '';
            pianoNotes.forEach(note => {
                const key = document.createElement('div');
                key.className = `piano-key ${note.type}`;
                key.innerText = note.name.replace('4','');
                key.onmousedown = () => {
                    key.classList.add('playing');
                    playSpecificFreq(id, note.freq);
                    setTimeout(() => key.classList.remove('playing'), 200);
                };
                kbContainer.appendChild(key);
            });
        }

        function getAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playHighQualitySound(instId, stepIndex) {
            const scaleFreqs = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25];
            const freq = scaleFreqs[(stepIndex + (instId.length)) % scaleFreqs.length];
            playSpecificFreq(instId, freq);
        }

        function playSpecificFreq(instId, freq) {
            const ctx = getAudioContext();
            const now = ctx.currentTime;
            const settings = trackSettings[instId] || { subType: 'nylon', volume: 0.8, pan: 0 };
            
            let panner = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
            if (panner) panner.pan.setValueAtTime(settings.pan, now);

            const masterGain = ctx.createGain();
            masterGain.gain.setValueAtTime(settings.volume * 0.25, now);

            if (panner) {
                masterGain.connect(panner);
                panner.connect(ctx.destination);
            } else {
                masterGain.connect(ctx.destination);
            }

            if (instId === 'drums') {
                playPercussion(ctx, masterGain, now);
                return;
            }

            let oscType = 'triangle';
            let filterCutoff = 1500;

            if (instId === 'guitar') {
                if (settings.subType === 'nylon') { oscType = 'sine'; filterCutoff = 1000; }
                else if (settings.subType === 'steel') { oscType = 'triangle'; filterCutoff = 2500; }
                else { oscType = 'sawtooth'; filterCutoff = 3000; }
            } else if (instId === 'harmonica') {
                oscType = 'square';
                filterCutoff = 2000;
            } else if (instId === 'violin') {
                oscType = 'sawtooth';
                filterCutoff = 2200;
            } else if (instId === 'synth') {
                oscType = settings.subType || 'sawtooth';
                filterCutoff = 3500;
            } else if (instId === 'bass') {
                oscType = 'sawtooth';
                freq /= 2;
                filterCutoff = 800;
            } else if (instId === 'piano') {
                oscType = 'sine';
                filterCutoff = 1800;
            }

            const osc = ctx.createOscillator();
            const filter = ctx.createBiquadFilter();
            osc.type = oscType;
            osc.frequency.setValueAtTime(freq, now);

            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(filterCutoff, now);
            filter.frequency.exponentialRampToValueAtTime(300, now + 0.3);

            osc.connect(filter);
            filter.connect(masterGain);
            osc.start(now);
            osc.stop(now + 0.35);
        }

        function playPercussion(ctx, destination, time) {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(90, time);
            osc.frequency.exponentialRampToValueAtTime(30, time + 0.15);
            gain.gain.setValueAtTime(0.3, time);
            gain.gain.exponentialRampToValueAtTime(0.001, time + 0.2);
            osc.connect(gain);
            gain.connect(destination);
            osc.start(time);
            osc.stop(time + 0.2);
        }

        function updateSubType(id) { trackSettings[id].subType = document.getElementById(`setting-${id}`).value; }
        function updateVolume(id, val) { trackSettings[id].volume = parseFloat(val); }
        function updatePan(id, val) { trackSettings[id].pan = parseFloat(val); }

        function playTrackPreview(id) {
            getAudioContext();
            for (let i = 0; i < 18; i++) {
                if (trackData[id][i]) {
                    setTimeout(() => playHighQualitySound(id, i), i * 150);
                }
            }
        }

        function saveTrackData(id) {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ data: trackData[id], settings: trackSettings[id] }));
            const a = document.createElement('a');
            a.href = dataStr;
            a.download = `${id}_track_edit.json`;
            a.click();
        }

        function aiCompose(id) {
            trackData[id] = trackData[id].map((_, index) => {
                if (id === 'drums') return index % 2 === 0 || Math.random() > 0.6;
                return Math.random() > 0.5;
            });
            renderGrid(id);
        }

        function clearTrack(id) {
            trackData[id] = new Array(18).fill(false);
            renderGrid(id);
        }

        function masterPlay() {
            masterStop();
            const bpm = parseInt(document.getElementById('bpmInput').value) || 115;
            const stepTime = (60 / bpm) * 500;
            let currentStep = 0;
            isPlaying = true;
            getAudioContext();

            currentTimer = setInterval(() => {
                instruments.forEach(inst => {
                    if (trackData[inst.id][currentStep]) {
                        playHighQualitySound(inst.id, currentStep);
                    }
                });
                currentStep++;
                if (currentStep >= 18) {
                    if (!document.getElementById('repeatToggle').checked) masterStop();
                    else currentStep = 0;
                }
            }, stepTime);
        }

        function masterStop() {
            isPlaying = false;
            if (currentTimer) clearInterval(currentTimer);
        }

        function masterClear() {
            masterStop();
            instruments.forEach(inst => clearTrack(inst.id));
        }

        function addToList() {
            const summary = {
                bpm: document.getElementById('bpmInput').value,
                activeTracks: instruments.filter(inst => trackData[inst.id].some(v => v)).map(i => i.name)
            };
            savedList.push(summary);
            const container = document.getElementById('compositionListContainer');
            container.innerHTML = '<b>【18小節まとめ一覧リスト】</b><br>';
            savedList.forEach((item, index) => {
                container.innerHTML += `[${index + 1}] BPM:${item.bpm} / 使用楽器: ${item.activeTracks.join(', ')}<br>`;
            });
        }

        function saveProject() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ trackData, trackSettings }));
            const a = document.createElement('a');
            a.href = dataStr;
            a.download = "daw_complete_project.json";
            a.click();
        }

        function exportAudioMix() { alert("音声合成ファイルを書き出し中..."); }

        async function startRecording() {
            recordedChunks = [];
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    vocalAudioBlob = new Blob(recordedChunks, { type: 'audio/webm' });
                    document.getElementById('vocalAudio').src = URL.createObjectURL(vocalAudioBlob);
                };
                mediaRecorder.start();
            } catch (err) { alert("マイクが利用できません。"); }
        }

        function stopRecording() { if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop(); }
        function playVocal() { const audio = document.getElementById('vocalAudio'); if (audio.src) audio.play(); }
        function clearVocal() { vocalAudioBlob = null; document.getElementById('vocalAudio').src = ''; }

        window.onload = initApp;
    </script>
</body>
</html>
