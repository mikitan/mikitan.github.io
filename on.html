<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MULTI-INSTRUMENT STUDIO - Professional Luxury Edition</title>
    <style>
        :root {
            --bg-base: #0f0e0d;
            --surface-base: #1b1715;
            --panel-base: #26201c;
            --border-base: #3d312a;
            --accent-gold: #e2b742;
            --accent-bright: #ffdf6d;
            --text-main: #f5f0e6;
            --accent-cyan: #00e5ff;
        }
        body { 
            font-family: 'Helvetica Neue', Arial, sans-serif; 
            background: var(--bg-base); 
            color: var(--text-main); 
            margin: 0; 
            padding: 10px; 
            font-size: 11px;
        }
        h1, h2, h3 { color: var(--accent-gold); border-bottom: 1px solid var(--border-base); padding-bottom: 3px; margin: 6px 0; font-size: 13px; }
        
        .master-screen { 
            background: linear-gradient(135deg, #2c211b, #15110e); 
            border: 2px solid var(--accent-gold); 
            padding: 10px; 
            margin-bottom: 10px; 
            border-radius: 6px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.8); 
        }
        
        .section { background: var(--surface-base); padding: 8px 10px; margin-bottom: 8px; border-radius: 5px; border: 1px solid var(--border-base); }
        
        button { background: linear-gradient(135deg, #d4af37, #997a15); color: #120f0d; border: none; padding: 4px 8px; margin: 2px; border-radius: 3px; cursor: pointer; font-weight: bold; font-size: 10px; }
        button:hover { background: var(--accent-bright); }
        button.sub-btn { background: #3d312a; color: var(--text-main); }
        button.action-btn { background: linear-gradient(135deg, #16a085, #117a65); color: #fff; }
        
        select, input { background: #14110f; color: var(--text-main); border: 1px solid var(--border-base); padding: 3px; border-radius: 3px; font-size: 10px; }
        
        /* 18小節対応 (18ステップ) グリッド */
        .grid-18 { display: grid; grid-template-columns: repeat(18, minmax(18px, 1fr)); gap: 1px; margin-top: 4px; overflow-x: auto; padding-bottom: 3px; }
        .step-cell { background: #181412; height: 32px; text-align: center; font-size: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; border-radius: 2px; color: #7a6a60; border: 1px solid #332822; }
        .step-cell.active { background: var(--accent-gold); color: #120f0d; font-weight: bold; }
        .step-cell.current-playing { outline: 2px solid var(--accent-cyan) !important; background: #ffffff !important; color: #000 !important; }

        .flex { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
        .status-bar { font-size: 11px; color: var(--accent-gold); margin-bottom: 6px; font-weight: bold; }
        .instrument-panel { border-left: 3px solid var(--accent-gold); padding-left: 6px; margin: 6px 0; }
    </style>
</head>
<body>

    <h1>🎵 PROFESSIONAL MULTI-INSTRUMENT STUDIO</h1>
    <div id="statusBar" class="status-bar">準備完了 — 最高級オーディオエンジンスタンバイ</div>

    <!-- 全体音響マスターコントロール -->
    <div class="master-screen">
        <h2>🎛️ 全体音響マスターコントロール</h2>
        <div class="flex">
            <span>BPM: <input type="number" id="masterBpm" value="116" min="40" max="240" style="width: 45px;"></span>
            <span>拍子: 
                <select id="timeSignature" onchange="updateGridLength()">
                    <option value="4">4/4拍子</option>
                    <option value="3">3/4拍子</option>
                    <option value="18" selected>18小節モード</option>
                </select>
            </span>
            <span>全体Vol: <input type="range" id="masterVol" min="0" max="1" step="0.05" value="0.8" style="width: 60px;"></span>
            <button class="action-btn" onclick="startMasterPlayback()">▶ 全体再生</button>
            <button class="sub-btn" onclick="stopMasterPlayback()">⏹ 停止</button>
            <button class="sub-btn" onclick="saveMasterCache()">💾 キャッシュ保存</button>
            <button class="sub-btn" onclick="loadMasterCache()">📂 キャッシュ読込</button>
        </div>
    </div>

    <!-- 各楽器セクション (ステレオギター、ピアノ、木金、タンバリン、ベース、シンセ、バイオリン) -->
    <div class="section">
        <h2>🎹 高級楽器スタジオ＆各楽器別音量・リフ・AIメロディ・キャッシュ</h2>
        
        <!-- ギター -->
        <div class="instrument-panel">
            <div class="flex">
                <b style="width:80px; color:var(--accent-gold);">ギター(20種)</b>
                <select id="guitarType" onchange="updateInstrumentPreset('guitar')">
                    <option value="stereo">ステレオナイロンギター</option>
                    <option value="electric">エレキギター(電子エコー)</option>
                    <option value="acoustic">アコースティック</option>
                </select>
                <span>音量: <input type="range" id="vol_guitar" min="0" max="1" step="0.1" value="0.7" style="width:50px;"></span>
                <span>ビブラート: <select id="vib_guitar"><option value="none">なし</option><option value="short">短</option><option value="long">長</option><option value="weak">弱</option><option value="strong">強</option></select></span>
                <button class="sub-btn" onclick="generateAiMelody('guitar')">AIメロディ</button>
                <button class="sub-btn" onclick="applyRiff('guitar')">リフ</button>
                <button class="sub-btn" onclick="randomInstrument('guitar')">ランダム</button>
                <button class="sub-btn" onclick="saveCache('guitar')">記録</button>
            </div>
            <div class="grid-18" id="guitarGrid"></div>
        </div>

        <!-- ピアノ -->
        <div class="instrument-panel">
            <div class="flex">
                <b style="width:80px; color:var(--accent-gold);">ピアノ(20種)</b>
                <select id="pianoType"><option value="grand">グランドピアノ</option><option value="bright">ブライトピアノ</option></select>
                <span>音量: <input type="range" id="vol_piano" min="0" max="1" step="0.1" value="0.7" style="width:50px;"></span>
                <span>ビブラート: <select id="vib_piano"><option value="none">なし</option><option value="short">短</option><option value="long">長</option></select></span>
                <button class="sub-btn" onclick="generateAiMelody('piano')">AIメロディ</button>
                <button class="sub-btn" onclick="applyRiff('piano')">リフ</button>
                <button class="sub-btn" onclick="randomInstrument('piano')">ランダム</button>
                <button class="sub-btn" onclick="saveCache('piano')">記録</button>
            </div>
            <div class="grid-18" id="pianoGrid"></div>
        </div>

        <!-- 木金（木琴・金属音） -->
        <div class="instrument-panel">
            <div class="flex">
                <b style="width:80px; color:var(--accent-gold);">木金(20種)</b>
                <select id="malletType"><option value="wood">木琴 (ウッド)</option><option value="metal">金属音 (メタル)</option></select>
                <span>音量: <input type="range" id="vol_mallet" min="0" max="1" step="0.1" value="0.7" style="width:50px;"></span>
                <button class="sub-btn" onclick="generateAiMelody('mallet')">AIメロディ</button>
                <button class="sub-btn" onclick="applyRiff('mallet')">リフ</button>
                <button class="sub-btn" onclick="randomInstrument('mallet')">ランダム</button>
                <button class="sub-btn" onclick="saveCache('mallet')">記録</button>
            </div>
            <div class="grid-18" id="malletGrid"></div>
        </div>

        <!-- タンバリン＆シンバルビートリズム -->
        <div class="instrument-panel">
            <div class="flex">
                <b style="width:80px; color:var(--accent-gold);">リズム(20種)</b>
                <select id="rhythmType"><option value="tambourine">タンバリンリズム</option><option value="cymbal">シンバルリズム</option></select>
                <span>音量: <input type="range" id="vol_rhythm" min="0" max="1" step="0.1" value="0.7" style="width:50px;"></span>
                <button class="sub-btn" onclick="generateAiMelody('rhythm')">AIビート</button>
                <button class="sub-btn" onclick="randomInstrument('rhythm')">ランダム</button>
                <button class="sub-btn" onclick="saveCache('rhythm')">記録</button>
            </div>
            <div class="grid-18" id="rhythmGrid"></div>
        </div>

        <!-- ベース低音 -->
        <div class="instrument-panel">
            <div class="flex">
                <b style="width:80px; color:var(--accent-gold);">ベース(20種)</b>
                <select id="bassType"><option value="sub">重低音サブベース</option><option value="slap">スラップベース</option></select>
                <span>音量: <input type="range" id="vol_bass" min="0" max="1" step="0.1" value="0.8" style="width:50px;"></span>
                <button class="sub-btn" onclick="generateAiMelody('bass')">AIメロディ</button>
                <button class="sub-btn" onclick="applyRiff('bass')">リフ</button>
                <button class="sub-btn" onclick="randomInstrument('bass')">ランダム</button>
                <button class="sub-btn" onclick="saveCache('bass')">記録</button>
            </div>
            <div class="grid-18" id="bassGrid"></div>
        </div>

        <!-- シンセサイザー電子音 -->
        <div class="instrument-panel">
            <div class="flex">
                <b style="width:80px; color:var(--accent-gold);">シンセ(20種)</b>
                <select id="synthType"><option value="lead">電子音リード</option><option value="pad">アンビエントパッド</option></select>
                <span>音量: <input type="range" id="vol_synth" min="0" max="1" step="0.1" value="0.7" style="width:50px;"></span>
                <button class="sub-btn" onclick="generateAiMelody('synth')">AIメロディ</button>
                <button class="sub-btn" onclick="applyRiff('synth')">リフ</button>
                <button class="sub-btn" onclick="randomInstrument('synth')">ランダム</button>
                <button class="sub-btn" onclick="saveCache('synth')">記録</button>
            </div>
            <div class="grid-18" id="synthGrid"></div>
        </div>

        <!-- バイオリンバック演奏 -->
        <div class="instrument-panel">
            <div class="flex">
                <b style="width:80px; color:var(--accent-gold);">バイオリン</b>
                <select id="violinType"><option value="string">バック演奏ストリングス</option></select>
                <span>音量: <input type="range" id="vol_violin" min="0" max="1" step="0.1" value="0.6" style="width:50px;"></span>
                <span>ビブラート: <select id="vib_violin"><option value="long" selected>長(贅沢ビブラート)</option><option value="strong">強</option></select></span>
                <button class="sub-btn" onclick="generateAiMelody('violin')">AIメロディ</button>
                <button class="sub-btn" onclick="randomInstrument('violin')">ランダム</button>
                <button class="sub-btn" onclick="saveCache('violin')">記録</button>
            </div>
            <div class="grid-18" id="violinGrid"></div>
        </div>

    </div>

    <script>
        let audioCtx = null;
        let isMasterPlaying = false;
        let masterTimer = null;
        let currentStepIdx = 0;
        let totalSteps = 18; // 18小節対応

        const instruments = ['guitar', 'piano', 'mallet', 'rhythm', 'bass', 'synth', 'violin'];
        let grids = {};
        instruments.forEach(inst => {
            grids[inst] = new Array(totalSteps).fill(false);
        });

        function initAudio() {
            if (!audioCtx) {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioCtx();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function setStatus(msg) {
            document.getElementById('statusBar').innerText = msg;
        }

        function updateGridLength() {
            const val = parseInt(document.getElementById('timeSignature').value);
            totalSteps = val === 18 ? 18 : 16;
            instruments.forEach(inst => {
                if (grids[inst].length < totalSteps) {
                    while(grids[inst].length < totalSteps) grids[inst].push(false);
                } else {
                    grids[inst] = grids[inst].slice(0, totalSteps);
                }
            });
            renderAllGrids();
            setStatus(`グリッドを ${totalSteps}ステップに更新しました`);
        }

        function renderAllGrids() {
            instruments.forEach(inst => {
                const container = document.getElementById(`${inst}Grid`);
                if (!container) return;
                container.style.gridTemplateColumns = `repeat(${totalSteps}, minmax(18px, 1fr))`;
                container.innerHTML = '';

                for (let i = 0; i < totalSteps; i++) {
                    const cell = document.createElement('div');
                    cell.className = `step-cell ${grids[inst][i] ? 'active' : ''}`;
                    cell.id = `cell-${inst}-${i}`;
                    cell.innerHTML = `${i+1}<br>${grids[inst][i] ? '●' : '·'}`;
                    cell.onclick = () => {
                        initAudio();
                        grids[inst][i] = !grids[inst][i];
                        renderAllGrids();
                        if (grids[inst][i]) playSound(inst, 0.3);
                    };
                    container.appendChild(cell);
                }
            });
        }

        function playSound(inst, duration = 0.4) {
            initAudio();
            const now = audioCtx.currentTime;
            const userVol = parseFloat(document.getElementById(`vol_${inst}`).value) || 0.7;
            const masterVol = parseFloat(document.getElementById('masterVol').value) || 0.8;
            const finalVol = userVol * masterVol;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            let freq = 220;
            let type = 'sine';

            if (inst === 'guitar') {
                freq = 164.81; // E3
                type = 'sawtooth';
            } else if (inst === 'piano') {
                freq = 261.63; // C4
                type = 'triangle';
            } else if (inst === 'mallet') {
                freq = 523.25; // C5
                type = 'sine';
            } else if (inst === 'rhythm') {
                freq = 120;
                type = 'square';
            } else if (inst === 'bass') {
                freq = 55; // A1
                type = 'sine';
            } else if (inst === 'synth') {
                freq = 440;
                type = 'sawtooth';
            } else if (inst === 'violin') {
                freq = 329.63; // E4
                type = 'sawtooth';
            }

            osc.type = type;
            osc.frequency.setValueAtTime(freq, now);

            // ビブラート効果
            const vibSelect = document.getElementById(`vib_${inst}`);
            if (vibSelect && vibSelect.value !== 'none') {
                const lfo = audioCtx.createOscillator();
                const lfoGain = audioCtx.createGain();
                lfo.frequency.value = vibSelect.value === 'short' ? 8 : 4;
                lfoGain.gain.value = vibSelect.value === 'strong' ? 15 : 6;
                lfo.connect(osc.frequency);
                lfo.start(now);
                lfo.stop(now + duration);
            }

            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(finalVol, now + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + duration + 0.05);
        }

        function generateAiMelody(inst) {
            grids[inst].fill(false);
            for (let i = 0; i < totalSteps; i++) {
                if (i % 3 === 0 || Math.random() < 0.35) grids[inst][i] = true;
            }
            renderAllGrids();
            setStatus(`${inst} の高級AIメロディを生成しました`);
        }

        function applyRiff(inst) {
            grids[inst].fill(false);
            for (let i = 0; i < totalSteps; i += 2) grids[inst][i] = true;
            renderAllGrids();
            setStatus(`${inst} のリフパターンを適用しました`);
        }

        function randomInstrument(inst) {
            for (let i = 0; i < totalSteps; i++) grids[inst][i] = Math.random() > 0.6;
            renderAllGrids();
            setStatus(`${inst} のランダムパターンを設定しました`);
        }

        function saveCache(inst) {
            localStorage.setItem(`cache_${inst}`, JSON.stringify(grids[inst]));
            setStatus(`${inst} のパターンをキャッシュに記録しました`);
        }

        function saveMasterCache() {
            localStorage.setItem('master_all_grids', JSON.stringify(grids));
            setStatus("全楽器のデータをキャッシュに一括保存しました");
        }

        function loadMasterCache() {
            const data = localStorage.getItem('master_all_grids');
            if (data) {
                grids = JSON.parse(data);
                renderAllGrids();
                setStatus("キャッシュからデータを読み込みました");
            } else {
                setStatus("保存されたキャッシュが見つかりません");
            }
        }

        function startMasterPlayback() {
            initAudio();
            if (isMasterPlaying) return;
            isMasterPlaying = true;
            currentStepIdx = 0;

            const bpm = parseInt(document.getElementById('masterBpm').value) || 116;
            const stepTime = (60 / bpm / 4) * 1000;

            masterTimer = setInterval(() => {
                document.querySelectorAll('.step-cell').forEach(el => el.classList.remove('current-playing'));

                instruments.forEach(inst => {
                    if (grids[inst][currentStepIdx]) {
                        playSound(inst, 0.35);
                    }
                    const cell = document.getElementById(`cell-${inst}-${currentStepIdx}`);
                    if (cell) cell.classList.add('current-playing');
                });

                currentStepIdx = (currentStepIdx + 1) % totalSteps;
            }, stepTime);

            setStatus(`全体音響マスター再生中 (BPM: ${bpm})`);
        }

        function stopMasterPlayback() {
            isMasterPlaying = false;
            if (masterTimer) clearInterval(masterTimer);
            document.querySelectorAll('.step-cell').forEach(el => el.classList.remove('current-playing'));
            setStatus("停止しました");
        }

        window.onload = () => {
            renderAllGrids();
            setStatus("高級スタジオスタンバイ完了");
        };
    </script>
</body>
</html>
