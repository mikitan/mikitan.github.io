<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>価値創造善知識日記365 - 手動記録表（追加・削除対応）</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-sub: #94a3b8;
            --accent-gold: #f59e0b;
            --accent-gold-light: #fbbf24;
            --border-color: #334155;
            --highlight-bg: rgba(245, 158, 11, 0.1);
            --input-bg: #0f172a;
            --danger-color: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans JP", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.8;
            margin: 0;
            padding: 24px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 720px;
            width: 100%;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .header {
            border-bottom: 2px solid var(--accent-gold);
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 1.75rem;
            margin: 0 0 8px 0;
            color: var(--accent-gold);
            letter-spacing: 0.05em;
        }

        .header .subtitle {
            font-size: 0.9rem;
            color: var(--text-sub);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 16px;
        }

        label {
            font-size: 0.85rem;
            color: var(--accent-gold-light);
            margin-bottom: 6px;
            font-weight: 600;
        }

        input[type="date"],
        input[type="time"],
        input[type="text"],
        select,
        textarea {
            width: 100%;
            padding: 10px 12px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent-gold);
        }

        .meta-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            background-color: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 1.1rem;
            color: var(--text-color);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            margin-top: 24px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 120px;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            text-align: center;
        }

        .btn-primary {
            background-color: var(--accent-gold);
            color: #000;
        }

        .btn-secondary {
            background-color: #334155;
            color: var(--text-color);
        }

        .btn-danger {
            background-color: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid var(--danger-color);
        }

        .btn:hover {
            opacity: 0.85;
        }

        /* 履歴カード */
        .log-history {
            margin-top: 32px;
        }

        .log-card {
            background-color: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            font-size: 0.9rem;
            position: relative;
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--accent-gold-light);
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 6px;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--danger-color);
            cursor: pointer;
            font-size: 0.8rem;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .delete-btn:hover {
            background-color: rgba(239, 68, 68, 0.1);
        }

        .footer {
            margin-top: 32px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-sub);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>価値創造善知識日記365</h1>
        <div class="subtitle">手動資産構築記録表（追加・削除・保存対応）</div>
    </div>

    <form id="recordForm">
        <!-- 日時・天候 -->
        <div class="meta-grid">
            <div class="form-group" style="margin-bottom: 0;">
                <label for="recordDate">記録日付</label>
                <input type="date" id="recordDate" required>
            </div>
            <div class="form-group" style="margin-bottom: 0;">
                <label for="recordTime">記録時間</label>
                <input type="time" id="recordTime" required>
            </div>
            <div class="form-group" style="margin-bottom: 0;">
                <label for="weather">天候</label>
                <select id="weather">
                    <option value="晴れ ☀️">晴れ ☀️</option>
                    <option value="快晴 ☀️">快晴 ☀️</option>
                    <option value="曇り ☁️">曇り ☁️</option>
                    <option value="雨 🌧️">雨 🌧️</option>
                    <option value="大雨 ☔">大雨 ☔</option>
                    <option value="雪 ❄️">雪 ❄️</option>
                </select>
            </div>
        </div>

        <h2 class="section-title">本日の価値創造＆記録項目</h2>

        <div class="form-group">
            <label for="concept">本日の善知識（コアコンセプト）</label>
            <textarea id="concept" rows="2">「価値の創造とは、一過性の労働収入に頼るのではなく、時間をかけて積み上がり続ける『仕組み』と『知識』の資産化である。」</textarea>
        </div>

        <div class="form-group">
            <label for="theme">本日のテーマ</label>
            <input type="text" id="theme" value="資産構築コピーの保存と価値創造思想の再定義">
        </div>

        <div class="form-group">
            <label for="category">アセット分類</label>
            <input type="text" id="category" value="ナレッジ / Web UI ソースコード">
        </div>

        <div class="form-group">
            <label for="action">次回アクション</label>
            <input type="text" id="action" value="積み上げた知識資産・デジタルアセットの整理と最適化">
        </div>

        <div class="btn-group">
            <button type="button" class="btn btn-primary" onclick="saveRecord()">新規追加・保存</button>
            <button type="button" class="btn btn-secondary" onclick="exportCSV()">CSV出力</button>
            <button type="button" class="btn btn-danger" onclick="clearAllHistory()">全履歴削除</button>
        </div>
    </form>

    <div class="log-history">
        <h2 class="section-title">
            <span>保存された記録一覧</span>
        </h2>
        <div id="historyList">
            <!-- 履歴がここに表示されます -->
        </div>
    </div>

    <div class="footer">
        © 価値創造善知識日記365 - Asset Building Copy Record
    </div>
</div>

<script>
    // 初期値セット（現在日時）
    window.onload = function() {
        setNow();
        displayHistory();
    };

    function setNow() {
        const now = new Date();
        document.getElementById('recordDate').value = now.toISOString().substring(0, 10);
        document.getElementById('recordTime').value = now.toTimeString().substring(0, 5);
    }

    // 記録の追加・保存
    function saveRecord() {
        const record = {
            id: Date.now(), // 削除用のユニークID
            date: document.getElementById('recordDate').value,
            time: document.getElementById('recordTime').value,
            weather: document.getElementById('weather').value,
            concept: document.getElementById('concept').value,
            theme: document.getElementById('theme').value,
            category: document.getElementById('category').value,
            action: document.getElementById('action').value
        };

        let records = JSON.parse(localStorage.getItem('diaryRecords') || '[]');
        records.unshift(record);
        localStorage.setItem('diaryRecords', JSON.stringify(records));

        alert('新しい記録を追加・保存しました。');
        displayHistory();
    }

    // 個別削除
    function deleteRecord(id) {
        if (!confirm('この記録を削除しますか？')) return;

        let records = JSON.parse(localStorage.getItem('diaryRecords') || '[]');
        records = records.filter(r => r.id !== id);
        localStorage.setItem('diaryRecords', JSON.stringify(records));
        displayHistory();
    }

    // 全履歴削除
    function clearAllHistory() {
        if (!confirm('保存されているすべての履歴を削除しますか？この操作は元に戻せません。')) return;

        localStorage.removeItem('diaryRecords');
        displayHistory();
    }

    // 履歴表示
    function displayHistory() {
        const historyList = document.getElementById('historyList');
        let records = JSON.parse(localStorage.getItem('diaryRecords') || '[]');
        
        if (records.length === 0) {
            historyList.innerHTML = '<p style="color: var(--text-sub); font-size: 0.85rem; text-align: center; padding: 20px;">保存された記録はまだありません。</p>';
            return;
        }

        historyList.innerHTML = records.map(r => `
            <div class="log-card">
                <div class="log-header">
                    <span>📅 ${r.date} ${r.time} ｜ ${r.weather}</span>
                    <button class="delete-btn" onclick="deleteRecord(${r.id})">削除</button>
                </div>
                <div><strong>テーマ:</strong> ${r.theme}</div>
                <div><strong>分類:</strong> ${r.category}</div>
                <div><strong>コア:</strong> ${r.concept}</div>
                <div><strong>次回:</strong> ${r.action}</div>
            </div>
        `).join('');
    }

    // CSV出力
    function exportCSV() {
        let records = JSON.parse(localStorage.getItem('diaryRecords') || '[]');
        if (records.length === 0) {
            alert('出力するデータがありません。');
            return;
        }

        let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
        csvContent += "日付,時間,天候,テーマ,分類,コアコンセプト,次回アクション\n";

        records.forEach(r => {
            csvContent += `"${r.date}","${r.time}","${r.weather}","${r.theme}","${r.category}","${r.concept}","${r.action}"\n`;
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `価値創造善知識日記_${new Date().toISOString().substring(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>

</body>
</html>
