<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIC VICTORY SOUND - WORLD BEST DTM v63.0 CRERA SUITE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans select-none pb-24 overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        function MasterSynthApp() {
            const [tab, setTab] = React.useState("DUAL_EDIT");
            const [playing, setPlaying] = React.useState(false);
            const [bpm, setBpm] = React.useState(116);
            const [currentBar, setCurrentBar] = React.useState(0);
            const [currentStep, setCurrentStep] = React.useState(-1);
            const [status, setStatus] = React.useState("✨ v63.0 全体・楽器別・パイプ音・ロボット音crera対応完了！");

            const [powerSavingMode, setPowerSavingMode] = React.useState(false);
            const [autoAiCache, setAutoAiCache] = React.useState(true);

            const BARS = 8;
            const BAR_STEPS = 16;
            const TOTAL_STEPS = BARS * BAR_STEPS;

            const [selectedInstrument, setSelectedInstrument] = React.useState("subBass");
            const [selectedNote, setSelectedNote] = React.useState("C4");
            const [selectedDuration, setSelectedDuration] = React.useState("8n");
            const [selectedDrumPart, setSelectedDrumPart] = React.useState("kick");

            const [bassMode, setBassMode] = React.useState("subLow");
            const [fxPattern, setFxPattern] = React.useState("reverbEcho");
            const [scratchMode, setScratchMode] = React.useState(false);

            const [screenSaverActive, setScreenSaverActive] = React.useState(false);
            const [activeEqColorIndex, setActiveEqColorIndex] = React.useState(0);

            const EQ_COLORS = [
                { name: "レッド (情熱)", class: "bg-red-600 border-red-400 shadow-red-500/80" },
                { name: "オレンジ (熱気)", class: "bg-orange-600 border-orange-400 shadow-orange-500/80" },
                { name: "イエロー (輝き)", class: "bg-yellow-500 border-yellow-300 shadow-yellow-400/80" },
                { name: "グリーン (癒し)", class: "bg-emerald-600 border-emerald-400 shadow-emerald-500/80" },
                { name: "シアン (近未来)", class: "bg-cyan-500 border-cyan-300 shadow-cyan-400/80" },
                { name: "ブルー (ディープ)", class: "bg-blue-600 border-blue-400 shadow-blue-500/80" },
                { name: "パープル (神秘)", class: "bg-purple-600 border-purple-400 shadow-purple-500/80" },
                { name: "ピンク (ポップ)", class: "bg-pink-600 border-pink-400 shadow-pink-500/80" }
            ];

            // 📁 crera 各種ストレージステート
            const [masterTakes, setMasterTakes] = React.useState([
                { id: 1, title: "全体セッション #1 (重低音ベース＋AIリフ)", bpm: 116, date: "12:00", credit: "micvictorysund" }
            ]);
            const [instrumentTakes, setInstrumentTakes] = React.useState([
                { id: 101, instrument: "subBass", title: "ベース王道グルーヴ #1", steps: [] }
            ]);
            const [pipeTakes, setPipeTakes] = React.useState([
                { id: 201, title: "パイプ音スペーシーフレーズ #1", steps: [] }
            ]);
            const [robotTakes, setRobotTakes] = React.useState([
                { id: 301, title: "ロボット音エレクトロビート #1", steps: [] }
            ]);

            const [albumProducts, setAlbumProducts] = React.useState([
                { id: 101, title: "MICVICTORY 2026 アルティメットアルバム Vol.1", price: "¥1,800 (商用利用OK)", tracks: 12 },
                { id: 102, title: "BLAUND & POME スポーツBGM集", price: "¥1,200 (配信利用OK)", tracks: 8 }
            ]);

            const [masterBassBoost, setMasterBassBoost] = React.useState(14);
            const [masterVolume, setMasterVolume] = React.useState(1.4);
            const [flashColor, setFlashColor] = React.useState("border-cyan-500");

            const INSTRUMENTS = [
                { id: "subBass", label: "🔊 ベース (重低音/高音)", color: "from-amber-600 to-orange-700" },
                { id: "chopperBass", label: "🎸 チョッパクリッド", color: "from-yellow-600 to-amber-700" },
                { id: "electricGuitar", label: "🎸 エレキギター", color: "from-orange-600 to-red-700" },
                { id: "pipeSynth", label: "🪈 パイプ音", color: "from-teal-500 to-cyan-600" },
                { id: "robotSynth", label: "🤖 ロボット音", color: "from-purple-600 to-indigo-700" },
                { id: "amRiff", label: "🎹 Amリフ", color: "from-pink-600 to-rose-600" },
                { id: "drums", label: "🥁 ドラム", color: "from-red-600 to-amber-600" },
                { id: "synth", label: "🎹 シンセ", color: "from-cyan-600 to-blue-700" },
            ];

            const [instrumentSteps, setInstrumentSteps] = React.useState({
                subBass: new Array(TOTAL_STEPS).fill(null),
                chopperBass: new Array(TOTAL_STEPS).fill(null),
                electricGuitar: new Array(TOTAL_STEPS).fill(null),
                pipeSynth: new Array(TOTAL_STEPS).fill(null),
                robotSynth: new Array(TOTAL_STEPS).fill(null),
                amRiff: new Array(TOTAL_STEPS).fill(null),
                drums: new Array(TOTAL_STEPS).fill(null),
                synth: new Array(TOTAL_STEPS).fill(null),
            });

            const [volumes, setVolumes] = React.useState({
                subBass: 6, chopperBass: 4, electricGuitar: 3, pipeSynth: 2, robotSynth: 3, amRiff: 4, drums: 3, synth: 0
            });

            const synthsRef = React.useRef(null);
            const loopRef = React.useRef(null);
            const masterGainRef = React.useRef(null);
            const fxNodesRef = React.useRef(null);

            const NOTES = ["C4", "D4", "E4", "F4", "G4", "A4", "B4", "C5"];
            const AM_NOTES = ["A3", "C4", "E4", "G4", "A4", "B4", "C5", "E5"];
            const SOLFEGE = { "C4": "ド", "D4": "レ", "E4": "ミ", "F4": "ファ", "G4": "ソ", "A4": "ラ", "B4": "シ", "C5": "ド", "A3": "ラ低", "E5": "ミ高" };
            const DURATION_OPTIONS = [
                { id: "16n", label: "16分音符" },
                { id: "8n", label: "8分音符" },
                { id: "4n", label: "4分音符" },
                { id: "2n", label: "2分音符" },
            ];

            const FLASH_COLORS = [
                "border-red-500 shadow-red-500/50", "border-orange-500 shadow-orange-500/50",
                "border-yellow-500 shadow-yellow-500/50", "border-emerald-500 shadow-emerald-500/50",
                "border-cyan-500 shadow-cyan-500/50", "border-purple-500 shadow-purple-500/50",
                "border-pink-500 shadow-pink-500/50", "border-blue-500 shadow-blue-500/50"
            ];

            React.useEffect(() => {
                const masterGain = new Tone.Gain(masterVolume).toDestination();
                masterGainRef.current = masterGain;

                const eq = new Tone.EQ3({ low: masterBassBoost, lowFrequency: 140, mid: 3.0, high: 4.0 }).connect(masterGain);
                const reverb = new Tone.Reverb({ decay: 2.2, wet: 0.35 }).connect(eq);
                const delay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.3, wet: 0.25 }).connect(reverb);
                const distortion = new Tone.Distortion(0.12).connect(delay);
                const autoFilter = new Tone.AutoFilter("4n").start().connect(distortion);

                fxNodesRef.current = { eq, reverb, delay, distortion, autoFilter };

                const cGains = {};
                Object.keys(instrumentSteps).forEach(key => {
                    const cg = new Tone.Gain(Tone.dbToGain(volumes[key] || 0)).connect(autoFilter);
                    cGains[key] = cg;
                });

                synthsRef.current = {
                    subBass: new Tone.MonoSynth({ oscillator: { type: "sine" }, envelope: { attack: 0.005, decay: 0.4, sustain: 0.7, release: 0.2 } }).connect(cGains.subBass),
                    chopperBass: new Tone.MonoSynth({ oscillator: { type: "sawtooth" }, envelope: { attack: 0.001, decay: 0.15, sustain: 0.1, release: 0.1 } }).connect(cGains.chopperBass),
                    electricGuitar: new Tone.Synth({ oscillator: { type: "sawtooth6" }, envelope: { attack: 0.01, decay: 0.3, sustain: 0.4, release: 0.3 } }).connect(cGains.electricGuitar),
                    pipeSynth: new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.05, decay: 0.4, sustain: 0.6, release: 0.3 } }).connect(cGains.pipeSynth),
                    robotSynth: new Tone.Synth({ oscillator: { type: "square8" }, envelope: { attack: 0.001, decay: 0.1, sustain: 0.2, release: 0.05 } }).connect(cGains.robotSynth),
                    amRiff: new Tone.Synth({ oscillator: { type: "triangle" }, envelope: { attack: 0.01, decay: 0.25, sustain: 0.3, release: 0.2 } }).connect(cGains.amRiff),
                    synth: new Tone.Synth({ oscillator: { type: "pulse", width: 0.5 }, envelope: { attack: 0.01, decay: 0.2, sustain: 0.4, release: 0.2 } }).connect(cGains.synth),
                    drums: {
                        kick: new Tone.MembraneSynth({ pitchDecay: 0.05, octaves: 6, oscillator: { type: "sine" }, envelope: { attack: 0.0001, decay: 0.3, sustain: 0.01 } }).connect(cGains.drums),
                        snare: new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.0001, decay: 0.18, sustain: 0 } }).connect(cGains.drums),
                        hihat: new Tone.MetalSynth({ frequency: 1200, envelope: { attack: 0.0005, decay: 0.02 } }).connect(cGains.drums),
                        clap: new Tone.NoiseSynth({ noise: { type: "pink" }, envelope: { attack: 0.005, decay: 0.12 } }).connect(cGains.drums),
                    }
                };

                return () => {
                    Tone.Transport.stop();
                    Tone.Transport.cancel();
                };
            }, []);

            React.useEffect(() => {
                Tone.Transport.bpm.value = bpm;
                if (playing) {
                    if (loopRef.current) loopRef.current.dispose();

                    let stepCounter = 0;
                    loopRef.current = new Tone.Loop(time => {
                        let step = stepCounter % TOTAL_STEPS;
                        const bar = Math.floor(step / BAR_STEPS);
                        const sInBar = step % BAR_STEPS;

                        setCurrentStep(sInBar);
                        setCurrentBar(bar);
                        setActiveEqColorIndex(prev => (prev + 1) % EQ_COLORS.length);

                        if (!powerSavingMode) {
                            const colorIdx = (step + (scratchMode ? Math.floor(Math.random() * 8) : 0)) % FLASH_COLORS.length;
                            setFlashColor(FLASH_COLORS[colorIdx]);
                        }

                        const syns = synthsRef.current;
                        if (!syns) return;

                        Object.keys(instrumentSteps).forEach(instKey => {
                            let item = instrumentSteps[instKey][step];

                            if (!item && autoAiCache && (instKey === "amRiff" || instKey === "subBass" || instKey === "pipeSynth")) {
                                if (step % 4 === 0) {
                                    const fallbackNotes = ["C4", "E4", "G4", "A4"];
                                    item = { note: fallbackNotes[Math.floor(Math.random() * fallbackNotes.length)], dur: "8n" };
                                }
                            }

                            if (!item) return;
                            const note = typeof item === "object" ? item.note : item;
                            const dur = typeof item === "object" ? (item.dur || "8n") : "8n";

                            if (instKey === "drums") {
                                if (typeof item === "object") {
                                    if (item.kick) syns.drums.kick.triggerAttackRelease("C1", "8n", time);
                                    if (item.snare) syns.drums.snare.triggerAttackRelease("8n", time);
                                    if (item.hihat) syns.drums.hihat.triggerAttackRelease("32n", time, 0.9);
                                    if (item.clap) syns.drums.clap.triggerAttackRelease("8n", time);
                                }
                            } else if (instKey === "subBass") {
                                const bassNote = bassMode === "subLow" ? (item.subBoost ? "C0" : "C1") : (item.note || "C3");
                                syns.subBass.triggerAttackRelease(bassNote, dur, time);
                            } else if (syns[instKey]) {
                                syns[instKey].triggerAttackRelease(note || "C4", dur, time);
                            }
                        });

                        stepCounter++;
                    }, "16n").start(0);

                    if (Tone.Transport.state !== "started") Tone.Transport.start();
                } else {
                    Tone.Transport.stop();
                    if (loopRef.current) loopRef.current.stop();
                }
            }, [playing, bpm, instrumentSteps, powerSavingMode, autoAiCache, bassMode, scratchMode]);

            const togglePlay = async () => {
                await Tone.start();
                setPlaying(!playing);
                setStatus(playing ? "停止しました" : `▶ 再生中 (BPM: ${bpm})`);
            };

            const triggerScratch = () => {
                setScratchMode(true);
                const syns = synthsRef.current;
                if (syns) {
                    const now = Tone.now();
                    syns.drums.hihat.triggerAttackRelease("32n", now);
                    syns.synth.triggerAttackRelease("C5", "16n", now + 0.04);
                }
                setStatus("🎛️ DJスクラッチ発動！");
                setTimeout(() => setScratchMode(false), 700);
            };

            const generateAiRandomPattern = (instKey) => {
                const newArr = new Array(TOTAL_STEPS).fill(null);
                let scale = NOTES;
                if (instKey === "amRiff") scale = AM_NOTES;
                else if (instKey === "pipeSynth") scale = ["C4", "E4", "G4", "B4", "C5", "E5"];
                else if (instKey === "robotSynth") scale = ["A2", "C3", "E3", "A3", "E4"];

                for (let i = 0; i < TOTAL_STEPS; i++) {
                    if (instKey === "drums") {
                        newArr[i] = { kick: i % 4 === 0, snare: i % 8 === 4, hihat: true, clap: i % 16 === 14 };
                    } else if (Math.random() < 0.38) {
                        newArr[i] = { note: scale[Math.floor(Math.random() * scale.length)], dur: selectedDuration, subBoost: Math.random() > 0.5 };
                    }
                }
                setInstrumentSteps(prev => ({ ...prev, [instKey]: newArr }));
                setStatus(`🤖 AIランダムパターン生成 [${instKey}]`);
            };

            const playNoteKeyboard = (note) => {
                setSelectedNote(note);
                const syns = synthsRef.current;
                if (!syns) return;

                if (selectedInstrument === "drums") {
                    if (selectedDrumPart === "kick") syns.drums.kick.triggerAttackRelease("C1", selectedDuration);
                    else if (selectedDrumPart === "snare") syns.drums.snare.triggerAttackRelease(selectedDuration);
                    else if (selectedDrumPart === "hihat") syns.drums.hihat.triggerAttackRelease("32n");
                    else syns.drums.clap.triggerAttackRelease(selectedDuration);
                } else if (selectedInstrument === "subBass") {
                    syns.subBass.triggerAttackRelease(bassMode === "subLow" ? "C1" : note, selectedDuration);
                } else if (syns[selectedInstrument]) {
                    syns[selectedInstrument].triggerAttackRelease(note, selectedDuration);
                }

                if (currentStep !== -1) {
                    const stepIdx = currentBar * BAR_STEPS + currentStep;
                    toggleStepWithDuration(selectedInstrument, stepIdx, note, selectedDuration);
                }
            };

            const toggleStepWithDuration = (instKey, idx, note = selectedNote, dur = selectedDuration) => {
                setInstrumentSteps(prev => {
                    const currentArr = [...prev[instKey]];
                    if (instKey === "drums") {
                        const currentObj = currentArr[idx] || { kick: false, snare: false, hihat: false, clap: false };
                        const updatedObj = { ...currentObj, [selectedDrumPart]: !currentObj[selectedDrumPart] };
                        currentArr[idx] = Object.values(updatedObj).some(Boolean) ? updatedObj : null;
                    } else {
                        currentArr[idx] = currentArr[idx] ? null : { note, dur, subBoost: bassMode === "subLow" };
                    }
                    return { ...prev, [instKey]: currentArr };
                });
            };

            // 📁 crera 各種保存・読み込み関数
            const saveMasterCrera = () => {
                const newTake = { id: Date.now(), title: `全体セッション #${masterTakes.length + 1}`, bpm, date: new Date().toLocaleTimeString(), steps: { ...instrumentSteps } };
                setMasterTakes(prev => [newTake, ...prev]);
                setStatus("📁 【全体crera】に現在の全セッションを保存しました！");
            };
            const loadMasterCrera = (take) => {
                setBpm(take.bpm);
                setInstrumentSteps(take.steps);
                setStatus(`🚀 【全体crera】「${take.title}」を読み込みました！`);
            };

            const saveInstrumentCrera = () => {
                const newTake = { id: Date.now(), instrument: selectedInstrument, title: `${selectedInstrument} パターン #${instrumentTakes.length + 1}`, steps: [...instrumentSteps[selectedInstrument]] };
                setInstrumentTakes(prev => [newTake, ...prev]);
                setStatus(`📁 【楽器別crera】[${selectedInstrument}] を保存しました！`);
            };
            const loadInstrumentCrera = (take) => {
                setInstrumentSteps(prev => ({ ...prev, [take.instrument]: [...take.steps] }));
                setSelectedInstrument(take.instrument);
                setStatus(`🚀 【楽器別crera】「${take.title}」を読み込みました！`);
            };

            const savePipeCrera = () => {
                const newTake = { id: Date.now(), title: `パイプ音フレーズ #${pipeTakes.length + 1}`, steps: [...instrumentSteps.pipeSynth] };
                setPipeTakes(prev => [newTake, ...prev]);
                setStatus("📁 【パイプ音crera】にフレーズを保存しました！");
            };
            const loadPipeCrera = (take) => {
                setInstrumentSteps(prev => ({ ...prev, pipeSynth: [...take.steps] }));
                setStatus(`🚀 【パイプ音crera】「${take.title}」を読み込みました！`);
            };

            const saveRobotCrera = () => {
                const newTake = { id: Date.now(), title: `ロボット音ビート #${robotTakes.length + 1}`, steps: [...instrumentSteps.robotSynth] };
                setRobotTakes(prev => [newTake, ...prev]);
                setStatus("📁 【ロボット音crera】にフレーズを保存しました！");
            };
            const loadRobotCrera = (take) => {
                setInstrumentSteps(prev => ({ ...prev, robotSynth: [...take.steps] }));
                setStatus(`🚀 【ロボット音crera】「${take.title}」を読み込みました！`);
            };

            return (
                <div className={`min-h-screen bg-slate-950 text-slate-100 flex flex-col text-xs font-sans select-none pb-24 overflow-x-hidden border-8 transition-colors duration-300 ${flashColor}`}>
                    
                    {screenSaverActive && (
                        <div className="fixed inset-0 z-50 bg-slate-950 flex flex-col items-center justify-center p-6 border-8 border-cyan-500 animate-pulse">
                            <div className="absolute top-4 right-4">
                                <button onClick={() => setScreenSaverActive(false)} className="px-4 py-2 bg-red-600 text-white font-bold rounded-lg text-sm">✕ 終了</button>
                            </div>
                            <h1 className="text-3xl font-black text-cyan-400 mb-6">MICVICTORY 8色音連動イコライザー</h1>
                            <div className="grid grid-cols-4 gap-4 w-full max-w-3xl mb-6">
                                {EQ_COLORS.map((col, idx) => {
                                    const isLit = playing && (activeEqColorIndex === idx);
                                    return (
                                        <div key={idx} className={`p-6 rounded-2xl border-2 flex flex-col items-center justify-center ${col.class} ${isLit ? 'scale-105 opacity-100 ring-4 ring-white' : 'opacity-40 bg-slate-900'}`}>
                                            <span className="text-sm font-black text-white">{col.name}</span>
                                        </div>
                                    );
                                })}
                            </div>
                            <button onClick={togglePlay} className="px-6 py-3 bg-amber-500 text-slate-950 font-bold rounded-xl text-base">{playing ? "■ 停止" : "▶ 再生"}</button>
                        </div>
                    )}

                    <header className="bg-slate-900 border-b border-slate-800 px-3 py-2 flex items-center justify-between sticky top-0 z-40 shadow-lg">
                        <span className="font-black text-sm bg-gradient-to-r from-amber-400 to-cyan-400 bg-clip-text text-transparent">
                            micvictorysund DTM <span className="text-[10px] text-pink-400">v63.0 crera全対応</span>
                        </span>
                        <div className="flex items-center gap-1.5 flex-wrap">
                            <button onClick={() => setScreenSaverActive(true)} className="px-2.5 py-1 bg-cyan-700 text-white font-bold rounded text-[10px]">🖥️ スクリーンセーバー</button>
                            <button onClick={togglePlay} className={`px-3 py-1 rounded font-bold text-xs ${playing ? "bg-amber-400 text-slate-950" : "bg-pink-600 text-white"}`}>{playing ? "■ 停止" : "▶ 再生"}</button>
                            <button onClick={triggerScratch} className="px-2 py-1 bg-purple-700 text-white font-bold rounded text-xs">🎛️ スクラッチ</button>
                            <div className="flex items-center gap-1 bg-slate-950 px-2 py-0.5 rounded border border-slate-800">
                                <span className="text-[9px] text-slate-400">BPM</span>
                                <input type="number" value={bpm} onChange={e => setBpm(Number(e.target.value))} className="w-12 bg-slate-900 text-center font-bold text-pink-400 rounded text-xs py-0.5" />
                            </div>
                        </div>
                    </header>

                    <nav className="bg-slate-900/90 border-b border-slate-800 px-2 py-1.5 flex gap-1 overflow-x-auto">
                        {[
                            { id: "DUAL_EDIT", label: "🎛️ メイン編集" },
                            { id: "MASTER_CRERA", label: "📁 全体crera" },
                            { id: "INST_CRERA", label: "🎸 楽器別crera" },
                            { id: "PIPE_CRERA", label: "🪈 パイプ音crera" },
                            { id: "ROBOT_CRERA", label: "🤖 ロボット音crera" },
                            { id: "ALBUM_STORE", label: "💿 アルバムショップ" },
                        ].map(t => (
                            <button key={t.id} onClick={() => setTab(t.id)} className={`px-3 py-1 rounded text-center font-bold shrink-0 ${tab === t.id ? "bg-amber-500 text-slate-950" : "bg-slate-800/60 text-slate-400"}`}>
                                {t.label}
                            </button>
                        ))}
                    </nav>

                    <div className="bg-slate-900/50 px-3 py-1 text-[11px] text-cyan-400 border-b border-slate-900">
                        <span>💡 {status}</span>
                    </div>

                    <main className="p-2 flex flex-col gap-3">
                        {tab === "DUAL_EDIT" && (
                            <div className="flex flex-col gap-3">
                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-2.5">
                                    <div className="flex justify-between items-center flex-wrap gap-2">
                                        <span className="text-xs font-bold text-pink-400">🔊 楽器選択・コントローラー</span>
                                        <div className="flex gap-1.5">
                                            <button onClick={() => setBassMode("subLow")} className={`px-2.5 py-1 rounded font-bold text-[10px] ${bassMode === "subLow" ? "bg-amber-500 text-slate-950" : "bg-slate-950 text-slate-400"}`}>重低音</button>
                                            <button onClick={() => setBassMode("high")} className={`px-2.5 py-1 rounded font-bold text-[10px] ${bassMode === "high" ? "bg-cyan-500 text-slate-950" : "bg-slate-950 text-slate-400"}`}>高音</button>
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-8 gap-1.5">
                                        {INSTRUMENTS.map(inst => (
                                            <button key={inst.id} onClick={() => setSelectedInstrument(inst.id)} className={`py-2 px-1 rounded font-bold text-[10px] border flex items-center justify-center gap-1 ${selectedInstrument === inst.id ? `bg-gradient-to-r ${inst.color} border-white text-white` : "bg-slate-950 border-slate-800 text-slate-400"}`}>
                                                {inst.label}
                                            </button>
                                        ))}
                                    </div>
                                    <div className="flex justify-between items-center pt-2 border-t border-slate-800">
                                        <button onClick={() => generateAiRandomPattern(selectedInstrument)} className="px-3 py-1 bg-pink-600 text-white font-bold rounded text-xs">🤖 AIランダム生成</button>
                                        <span className="text-[10px] text-amber-400">選択中: {selectedInstrument}</span>
                                    </div>
                                </div>

                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3">
                                    <div className="grid grid-cols-8 gap-1.5">
                                        {NOTES.map(note => (
                                            <button key={note} onClick={() => playNoteKeyboard(note)} className={`py-3 rounded font-bold text-center border ${selectedNote === note ? "bg-amber-500 text-slate-950 border-white" : "bg-slate-950 text-slate-100 border-slate-800"}`}>
                                                <div className="text-xs">{SOLFEGE[note]}</div>
                                            </button>
                                        ))}
                                    </div>
                                    <div className="overflow-x-auto bg-slate-950 p-2 rounded border border-slate-800">
                                        <div className="grid gap-1 min-w-[500px]" style={{ gridTemplateColumns: "repeat(16, minmax(0, 1fr))" }}>
                                            {Array.from({ length: BAR_STEPS }).map((_, i) => {
                                                const stepIdx = currentBar * BAR_STEPS + i;
                                                const stepVal = instrumentSteps[selectedInstrument][stepIdx];
                                                const isActive = selectedInstrument === "drums" ? (stepVal && stepVal[selectedDrumPart]) : !!stepVal;
                                                return (
                                                    <button key={i} onClick={() => toggleStepWithDuration(selectedInstrument, stepIdx)} className={`aspect-[3/4] w-full rounded border flex items-center justify-center text-[9px] ${isActive ? "bg-amber-600 border-white text-white font-bold" : "bg-slate-900 border-slate-800 text-slate-500"}`}>
                                                        {i + 1}
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {tab === "MASTER_CRERA" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-4 flex flex-col gap-3">
                                <div className="flex justify-between items-center">
                                    <span className="text-xs font-bold text-amber-400">📁 全体creraマネージャー（全楽器セッション保存）</span>
                                    <button onClick={saveMasterCrera} className="px-4 py-2 bg-amber-500 text-slate-950 font-bold rounded text-xs">➕ 現在の全体状態を保存</button>
                                </div>
                                <div className="bg-slate-950 p-3 rounded border border-slate-800 flex flex-col gap-2 max-h-[300px] overflow-y-auto">
                                    {masterTakes.map(t => (
                                        <div key={t.id} className="flex justify-between items-center bg-slate-900 p-2 rounded border border-slate-800">
                                            <div>
                                                <div className="text-cyan-400 font-bold">{t.title}</div>
                                                <div className="text-[10px] text-slate-400">BPM: {t.bpm} | 記録時刻: {t.date}</div>
                                            </div>
                                            <button onClick={() => loadMasterCrera(t)} className="px-3 py-1 bg-emerald-700 text-white rounded font-bold">読込</button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {tab === "INST_CRERA" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-4 flex flex-col gap-3">
                                <div className="flex justify-between items-center">
                                    <span className="text-xs font-bold text-pink-400">🎸 楽器別creraマネージャー（選択中楽器のパターン保存）</span>
                                    <button onClick={saveInstrumentCrera} className="px-4 py-2 bg-pink-600 text-white font-bold rounded text-xs">➕ [{selectedInstrument}] を保存</button>
                                </div>
                                <div className="bg-slate-950 p-3 rounded border border-slate-800 flex flex-col gap-2 max-h-[300px] overflow-y-auto">
                                    {instrumentTakes.map(t => (
                                        <div key={t.id} className="flex justify-between items-center bg-slate-900 p-2 rounded border border-slate-800">
                                            <div>
                                                <div className="text-pink-400 font-bold">{t.title}</div>
                                                <div className="text-[10px] text-slate-400">対象楽器: {t.instrument}</div>
                                            </div>
                                            <button onClick={() => loadInstrumentCrera(t)} className="px-3 py-1 bg-emerald-700 text-white rounded font-bold">読込</button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {tab === "PIPE_CRERA" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-4 flex flex-col gap-3">
                                <div className="flex justify-between items-center">
                                    <span className="text-xs font-bold text-teal-400">🪈 パイプ音専用 creraマネージャー</span>
                                    <button onClick={savePipeCrera} className="px-4 py-2 bg-teal-600 text-white font-bold rounded text-xs">➕ パイプ音フレーズを保存</button>
                                </div>
                                <div className="bg-slate-950 p-3 rounded border border-slate-800 flex flex-col gap-2 max-h-[300px] overflow-y-auto">
                                    {pipeTakes.map(t => (
                                        <div key={t.id} className="flex justify-between items-center bg-slate-900 p-2 rounded border border-slate-800">
                                            <div className="text-teal-300 font-bold">{t.title}</div>
                                            <button onClick={() => loadPipeCrera(t)} className="px-3 py-1 bg-emerald-700 text-white rounded font-bold">読込</button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {tab === "ROBOT_CRERA" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-4 flex flex-col gap-3">
                                <div className="flex justify-between items-center">
                                    <span className="text-xs font-bold text-purple-400">🤖 ロボット音専用 creraマネージャー</span>
                                    <button onClick={saveRobotCrera} className="px-4 py-2 bg-purple-600 text-white font-bold rounded text-xs">➕ ロボット音ビートを保存</button>
                                </div>
                                <div className="bg-slate-950 p-3 rounded border border-slate-800 flex flex-col gap-2 max-h-[300px] overflow-y-auto">
                                    {robotTakes.map(t => (
                                        <div key={t.id} className="flex justify-between items-center bg-slate-900 p-2 rounded border border-slate-800">
                                            <div className="text-purple-300 font-bold">{t.title}</div>
                                            <button onClick={() => loadRobotCrera(t)} className="px-3 py-1 bg-emerald-700 text-white rounded font-bold">読込</button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {tab === "ALBUM_STORE" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-4 flex flex-col gap-4">
                                <span className="text-xs font-bold text-pink-400">💿 著作権フリーアルバム販売ショップ</span>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    {albumProducts.map(album => (
                                        <div key={album.id} className="bg-slate-950 p-4 rounded-xl border border-slate-800 flex flex-col justify-between gap-3">
                                            <div>
                                                <div className="text-cyan-400 font-bold text-xs">{album.title}</div>
                                                <div className="text-amber-400 font-black text-sm">{album.price}</div>
                                            </div>
                                            <button onClick={() => alert("ご購入ありがとうございます！")} className="w-full py-2 bg-gradient-to-r from-pink-600 to-amber-600 text-white font-bold rounded text-xs">購入する</button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(getElementById_safe = document.getElementById('root')).render(<MasterSynthApp />);
    </script>
</body>
</html>
