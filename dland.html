<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIC VICTORY SOUND - WORLD BEST DTM v60.0 RELEASE ALBUM & COPYRIGHT SUITE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans select-none pb-24 overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        function MasterSynthApp() {
            const [tab, setTab] = React.useState("RELEASE_ALBUM");
            const [playing, setPlaying] = React.useState(false);
            const [bpm, setBpm] = React.useState(116);
            const [currentBar, setCurrentBar] = React.useState(0);
            const [currentStep, setCurrentStep] = React.useState(-1);
            const [status, setStatus] = React.useState("✨ v60.0 著作権リリースアルバム販売マネージャー統合完了！");

            const [powerSavingMode, setPowerSavingMode] = React.useState(false);
            const [autoAiCache, setAutoAiCache] = React.useState(true);

            const BARS = 8;
            const BAR_STEPS = 16;
            const TOTAL_STEPS = BARS * BAR_STEPS;

            const [selectedInstrument, setSelectedInstrument] = React.useState("synth");
            const [selectedNote, setSelectedNote] = React.useState("C4");
            const [selectedDuration, setSelectedDuration] = React.useState("8n");
            const [selectedDrumPart, setSelectedDrumPart] = React.useState("kick");
            const [activePatternIndex, setActivePatternIndex] = React.useState(1);

            // リリースアルバム & 販売クレジット (micvictorysund)
            const [albums, setAlbums] = React.useState([
                {
                    id: 1,
                    title: "MIC VICTORY ANTHEM Vol.1 (World Best DTM)",
                    artist: "micvictorysund",
                    copyright: "(c) 2026 micvictorysund / 作曲: 28",
                    price: "¥1,500 (税込み)",
                    status: "販売中・ストア公開済",
                    tracks: 12,
                    genre: "Pop Dance / Heavy Bass / DTM"
                },
                {
                    id: 2,
                    title: "BLAUND & POME WINTER COLLECTION SOUND",
                    artist: "micvictorysund",
                    copyright: "(c) 2026 micvictorysund / 作曲: 28",
                    price: "¥1,800 (税込み)",
                    status: "予約受付中",
                    tracks: 10,
                    genre: "Electro Synth / Ambient"
                }
            ]);

            const [newAlbumTitle, setNewAlbumTitle] = React.useState("MIC VICTORY NEW RELEASE 2026");
            const [newAlbumPrice, setNewAlbumPrice] = React.useState("¥2,000");

            const [recordedTakes, setRecordedTakes] = React.useState([
                { id: 1, title: "MIC VICTORY Anthem (Demo #1)", bpm: 116, date: "12:00:00", credit: "micvictorysund / 作曲: 28" }
            ]);

            const [djVoiceRecordings, setDjVoiceRecordings] = React.useState([
                { id: 1, title: "DJ Voice #1: MIC VICTORY DROP!", date: "12:00:00" }
            ]);
            const [isRecordingDjVoice, setIsRecordingDjVoice] = React.useState(false);
            const [scratchMode, setScratchMode] = React.useState(false);

            const [lyricTheme, setLyricTheme] = React.useState("青春・希望");
            const [rapLyrics, setRapLyrics] = React.useState(
`[Verse 1 - DJ MIC VICTORY & micvictorysund]
世界最高級のサウンドを刻むリリースアルバムが今ここに完成する
(c) micvictorysund の旗を掲げて 時代を切り開くビートを鳴らす
重低音クレラが響き渡るフロアで 誰もが主役になれる瞬間（とき）
作曲家 28 が放つ究極のメロディーは永遠に色褪せない`
            );

            const [masterBassBoost, setMasterBassBoost] = React.useState(12);
            const [masterVolume, setMasterVolume] = React.useState(1.3);
            const [flashColor, setFlashColor] = React.useState("border-cyan-500");
            const [screenSaverActive, setScreenSaverActive] = React.useState(false);

            const INSTRUMENTS = [
                { id: "drums", label: "🥁 ドラム (極上ドラム)", color: "from-red-600 to-amber-600" },
                { id: "loopTrack", label: "🔁 ループ (20入)", color: "from-pink-600 to-rose-600" },
                { id: "subBass", label: "🔊 重低音ベース", color: "from-amber-600 to-orange-700" },
                { id: "bass", label: "🎸 ベース (20入)", color: "from-emerald-600 to-teal-600" },
                { id: "synth", label: "🎹 シンセ (20入)", color: "from-cyan-600 to-blue-700" },
                { id: "trumpet", label: "🎺 トランペット (20入)", color: "from-yellow-500 to-amber-600" },
                { id: "guitar", label: "🎸 エレキギター (20入)", color: "from-orange-600 to-red-700" },
                { id: "africa1", label: "🪘 ジャンベ (アフリカ)", color: "from-amber-700 to-yellow-800" },
                { id: "africa2", label: "🎹 カリンバ (アフリカ)", color: "from-yellow-600 to-amber-600" },
                { id: "piano", label: "🎹 ピアノ", color: "from-blue-600 to-indigo-600" },
                { id: "violin", label: "🎻 バイオリン (AI推測)", color: "from-amber-600 to-yellow-700" },
                { id: "flute", label: "🪈 フルート", color: "from-teal-500 to-cyan-600" },
            ];

            const [instrumentSteps, setInstrumentSteps] = React.useState({
                drums: new Array(TOTAL_STEPS).fill(null),
                loopTrack: new Array(TOTAL_STEPS).fill(null),
                subBass: new Array(TOTAL_STEPS).fill(null),
                bass: new Array(TOTAL_STEPS).fill(null),
                synth: new Array(TOTAL_STEPS).fill(null),
                trumpet: new Array(TOTAL_STEPS).fill(null),
                guitar: new Array(TOTAL_STEPS).fill(null),
                africa1: new Array(TOTAL_STEPS).fill(null),
                africa2: new Array(TOTAL_STEPS).fill(null),
                piano: new Array(TOTAL_STEPS).fill(null),
                violin: new Array(TOTAL_STEPS).fill(null),
                flute: new Array(TOTAL_STEPS).fill(null),
            });

            const [volumes, setVolumes] = React.useState({
                drums: 3, loopTrack: 0, subBass: 6, bass: 4, synth: 0, trumpet: 0, guitar: 0, africa1: 0, africa2: 0, piano: 0, violin: 0, flute: 0
            });

            const synthsRef = React.useRef(null);
            const loopRef = React.useRef(null);
            const masterGainRef = React.useRef(null);

            const NOTES = ["C4", "D4", "E4", "F4", "G4", "A4", "B4", "C5"];
            const SOLFEGE = { "C4": "ド", "D4": "レ", "E4": "ミ", "F4": "ファ", "G4": "ソ", "A4": "ラ", "B4": "シ", "C5": "ド" };
            const DURATION_OPTIONS = [
                { id: "16n", label: "極短 (16分)" },
                { id: "8n", label: "標準 (8分)" },
                { id: "4n", label: "長め (4分)" },
                { id: "2n", label: "超長 (2n)" },
            ];

            const FLASH_COLORS = [
                "border-red-500 shadow-red-500/50",
                "border-orange-500 shadow-orange-500/50",
                "border-yellow-500 shadow-yellow-500/50",
                "border-emerald-500 shadow-emerald-500/50",
                "border-cyan-500 shadow-cyan-500/50",
                "border-blue-500 shadow-blue-500/50",
                "border-purple-500 shadow-purple-500/50",
                "border-pink-500 shadow-pink-500/50"
            ];

            React.useEffect(() => {
                const masterGain = new Tone.Gain(masterVolume).toDestination();
                masterGainRef.current = masterGain;

                const eq = new Tone.EQ3({ low: masterBassBoost, lowFrequency: 150, mid: 2.0, high: 3.0 }).connect(masterGain);
                const reverb = new Tone.Reverb({ decay: 1.5, wet: 0.15 }).connect(eq);
                const delay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.2, wet: 0.1 }).connect(reverb);
                const distortion = new Tone.Distortion(0.06).connect(delay);

                const cGains = {};
                Object.keys(instrumentSteps).forEach(key => {
                    const cg = new Tone.Gain(Tone.dbToGain(volumes[key] || 0)).connect(distortion);
                    cGains[key] = cg;
                });

                synthsRef.current = {
                    subBass: new Tone.MonoSynth({
                        oscillator: { type: "sine" },
                        envelope: { attack: 0.005, decay: 0.4, sustain: 0.6, release: 0.2 },
                        filterEnvelope: { attack: 0.005, decay: 0.2, sustain: 0.4, release: 0.2, baseFrequency: 65, octaves: 2 }
                    }).connect(cGains.subBass),
                    bass: new Tone.MonoSynth({
                        oscillator: { type: "triangle" },
                        envelope: { attack: 0.01, decay: 0.3, sustain: 0.4, release: 0.2 }
                    }).connect(cGains.bass),
                    synth: new Tone.Synth({ oscillator: { type: "pulse", width: 0.4 }, envelope: { attack: 0.01, decay: 0.25, sustain: 0.4, release: 0.2 } }).connect(cGains.synth),
                    loopTrack: new Tone.Synth({ oscillator: { type: "square" }, envelope: { attack: 0.008, decay: 0.2, sustain: 0.3, release: 0.15 } }).connect(cGains.loopTrack),
                    guitar: new Tone.Synth({ oscillator: { type: "sawtooth" }, envelope: { attack: 0.005, decay: 0.2, sustain: 0.2, release: 0.1 } }).connect(cGains.guitar),
                    trumpet: new Tone.Synth({ oscillator: { type: "sawtooth6" }, envelope: { attack: 0.04, decay: 0.2, sustain: 0.6, release: 0.15 } }).connect(cGains.trumpet),
                    africa1: new Tone.MembraneSynth({ pitchDecay: 0.02, octaves: 4, oscillator: { type: "sine" }, envelope: { attack: 0.001, decay: 0.25, sustain: 0.01, release: 0.15 } }).connect(cGains.africa1),
                    africa2: new Tone.Synth({ oscillator: { type: "triangle" }, envelope: { attack: 0.001, decay: 0.2, sustain: 0.1, release: 0.2 } }).connect(cGains.africa2),
                    piano: new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.008, decay: 0.35, sustain: 0.3, release: 0.4 } }).connect(cGains.piano),
                    violin: new Tone.Synth({ oscillator: { type: "sawtooth" }, envelope: { attack: 0.08, decay: 0.25, sustain: 0.8, release: 0.4 } }).connect(cGains.violin),
                    flute: new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.06, decay: 0.25, sustain: 0.7, release: 0.3 } }).connect(cGains.flute),
                    drums: {
                        kick: new Tone.MembraneSynth({ pitchDecay: 0.05, octaves: 7, oscillator: { type: "sine" }, envelope: { attack: 0.0001, decay: 0.35, sustain: 0.02, release: 0.15 } }).connect(cGains.drums),
                        snare: new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.0001, decay: 0.2, sustain: 0 } }).connect(cGains.drums),
                        hihat: new Tone.MetalSynth({ frequency: 1000, envelope: { attack: 0.0005, decay: 0.03, release: 0.01 }, harmonicity: 5.1, modulationIndex: 32, resonance: 8000, octaves: 1.5 }).connect(cGains.drums),
                        clap: new Tone.NoiseSynth({ noise: { type: "pink" }, envelope: { attack: 0.005, decay: 0.15, sustain: 0 } }).connect(cGains.drums),
                    },
                    eq, reverb, distortion
                };

                return () => { 
                    Tone.Transport.stop(); 
                    Tone.Transport.cancel(); 
                };
            }, []);

            React.useEffect(() => {
                Tone.Transport.bpm.value = bpm;
                if (playing) {
                    if (loopRef.current) loopRef.current.dispose();

                    let stepCounter = 0;
                    loopRef.current = new Tone.Loop(time => {
                        let step = stepCounter % TOTAL_STEPS;
                        const bar = Math.floor(step / BAR_STEPS);
                        const sInBar = step % BAR_STEPS;

                        setCurrentStep(sInBar);
                        setCurrentBar(bar);

                        if (!powerSavingMode) {
                            const colorIdx = (step + (scratchMode ? Math.floor(Math.random() * 8) : 0)) % FLASH_COLORS.length;
                            setFlashColor(FLASH_COLORS[colorIdx]);
                        }

                        const syns = synthsRef.current;
                        if (!syns) return;

                        Object.keys(instrumentSteps).forEach(instKey => {
                            const item = instrumentSteps[instKey][step];
                            if (!item) return;

                            const note = typeof item === "object" ? item.note : item;
                            const dur = typeof item === "object" ? (item.dur || "8n") : "8n";

                            if (autoAiCache || item) {
                                if (instKey === "drums") {
                                    if (typeof item === "object") {
                                        if (item.kick) syns.drums.kick.triggerAttackRelease(item.subBoost ? "C0" : "C1", "8n", time);
                                        if (item.snare) syns.drums.snare.triggerAttackRelease("8n", time);
                                        if (item.hihat) syns.drums.hihat.triggerAttackRelease("32n", time, 0.9);
                                        if (item.clap) syns.drums.clap.triggerAttackRelease("8n", time);
                                    }
                                } else if (instKey === "subBass") {
                                    syns.subBass.triggerAttackRelease(item.subBoost ? "C0" : "C1", dur, time);
                                } else if (syns[instKey]) {
                                    syns[instKey].triggerAttackRelease(note || "C4", dur, time);
                                }
                            }
                        });

                        stepCounter++;
                    }, "16n").start(0);

                    if (Tone.Transport.state !== "started") Tone.Transport.start();
                } else {
                    Tone.Transport.stop();
                    if (loopRef.current) loopRef.current.stop();
                }
            }, [playing, bpm, instrumentSteps, powerSavingMode, autoAiCache, scratchMode]);

            const togglePlay = async () => {
                await Tone.start();
                setPlaying(!playing);
                setStatus(playing ? "停止しました" : `▶ micvictorysund リリースアルバム再生中 (BPM: ${bpm})`);
            };

            const triggerScratchRepeat = () => {
                setScratchMode(true);
                const syns = synthsRef.current;
                if (syns) {
                    const now = Tone.now();
                    syns.drums.hihat.triggerAttackRelease("32n", now);
                    syns.synth.triggerAttackRelease("C5", "16n", now + 0.05);
                    syns.drums.snare.triggerAttackRelease("32n", now + 0.1);
                }
                setStatus("🎛️ DJスクラッチ連打リピート発動！");
                setTimeout(() => setScratchMode(false), 800);
            };

            const toggleRecordDjVoice = () => {
                setIsRecordingDjVoice(!isRecordingDjVoice);
                if (!isRecordingDjVoice) {
                    setStatus("🎙️ DJボイス録音中...");
                } else {
                    const newVoice = {
                        id: Date.now(),
                        title: `DJ Voice #${djVoiceRecordings.length + 1} (micvictorysund)`,
                        date: new Date().toLocaleTimeString()
                    };
                    setDjVoiceRecordings(prev => [...prev, newVoice]);
                    setStatus("✅ DJボイス録音を記録・再生リストに保存しました！");
                }
            };

            const saveCurrentTakeToCrera = () => {
                const newTake = {
                    id: Date.now(),
                    title: `リリース用極上テイク #${recordedTakes.length + 1}`,
                    bpm,
                    date: new Date().toLocaleTimeString(),
                    credit: "micvictorysund / 作曲: 28"
                };
                setRecordedTakes(prev => [...prev, newTake]);
                setStatus("📁 録音データを crera 記録リストおよびリリースアルバムに追加しました！");
            };

            const addNewAlbum = () => {
                const newAlbum = {
                    id: Date.now(),
                    title: newAlbumTitle,
                    artist: "micvictorysund",
                    copyright: "(c) 2026 micvictorysund / 作曲: 28",
                    price: newAlbumPrice,
                    status: "新規リリース・販売中",
                    tracks: 12,
                    genre: "World Best DTM Suite"
                };
                setAlbums(prev => [newAlbum, ...prev]);
                setStatus(`💿 新規リリースアルバム「${newAlbumTitle}」を micvictorysund に登録・販売開始しました！`);
            };

            const generateAiPattern20 = (instKey, patternNum) => {
                const newArr = new Array(TOTAL_STEPS).fill(null);
                const scales = {
                    synth: ["C4", "E4", "G4", "A4", "C5", "E5"],
                    bass: ["C2", "G2", "A2", "C3"],
                    subBass: ["C0", "C1"],
                    loopTrack: ["C4", "E4", "G4", "B4", "C5"],
                    trumpet: ["C4", "E4", "G4", "C5", "E5"],
                    guitar: ["E3", "G3", "B3", "E4", "A4"],
                    drums: [],
                    africa1: ["C3", "G3", "D4"],
                    africa2: ["C4", "D4", "F4", "G4", "A4"],
                    piano: ["C4", "D#4", "G4", "A#4", "C5"],
                    violin: ["D4", "F#4", "A4", "C#5", "D5"],
                    flute: ["E4", "G4", "B4", "E5"]
                };

                const scale = scales[instKey] || ["C4", "D4", "E4", "F4", "G4", "A4", "B4", "C5"];

                for (let i = 0; i < TOTAL_STEPS; i++) {
                    if (instKey === "drums") {
                        const isKick = i % (4 + (patternNum % 3)) === 0 || (patternNum > 10 && i % 8 === 2);
                        const isSnare = i % 8 === 4 || (patternNum > 15 && i % 4 === 2);
                        const isHihat = true;
                        const isClap = patternNum > 5 && i % 16 === 14;
                        if (isKick || isSnare || isHihat || isClap) {
                            newArr[i] = { kick: isKick, snare: isSnare, hihat: isHihat, clap: isClap, subBoost: true };
                        }
                    } else if (instKey === "subBass") {
                        if (i % 4 === 0 || i % 16 === 10) {
                            newArr[i] = { note: "C0", dur: selectedDuration, subBoost: true };
                        }
                    } else if (instKey === "violin") {
                        if (i % 2 === 0 || (patternNum > 10 && i % 4 === 2)) {
                            const note = scale[(i + patternNum) % scale.length];
                            const dur = patternNum % 2 === 0 ? "8n" : "16n";
                            newArr[i] = { note, dur };
                        }
                    } else {
                        let density = 0.25 + (patternNum * 0.015);
                        if (Math.random() < density) {
                            const noteIdx = (i * 2 + patternNum) % scale.length;
                            const note = scale[noteIdx];
                            const dur = selectedDuration;
                            newArr[i] = { note, dur };
                        }
                    }
                }

                setInstrumentSteps(prev => ({ ...prev, [instKey]: newArr }));
                setActivePatternIndex(patternNum);
                setStatus(`🤖 AI予測パターン #${patternNum} （${instKey}）生成完了！`);
            };

            const playNoteKeyboard = (note) => {
                setSelectedNote(note);
                const syns = synthsRef.current;
                if (!syns) return;

                if (selectedInstrument === "drums") {
                    if (selectedDrumPart === "kick") syns.drums.kick.triggerAttackRelease("C0", selectedDuration);
                    else if (selectedDrumPart === "snare") syns.drums.snare.triggerAttackRelease(selectedDuration);
                    else if (selectedDrumPart === "hihat") syns.drums.hihat.triggerAttackRelease("32n");
                    else syns.drums.clap.triggerAttackRelease(selectedDuration);
                } else if (selectedInstrument === "subBass") {
                    syns.subBass.triggerAttackRelease("C0", selectedDuration);
                } else if (syns[selectedInstrument]) {
                    syns[selectedInstrument].triggerAttackRelease(note, selectedDuration);
                }

                if (currentStep !== -1) {
                    const stepIdx = currentBar * BAR_STEPS + currentStep;
                    toggleStepWithDuration(selectedInstrument, stepIdx, note, selectedDuration);
                }
            };

            const toggleStepWithDuration = (instKey, idx, note = selectedNote, dur = selectedDuration) => {
                setInstrumentSteps(prev => {
                    const currentArr = [...prev[instKey]];
                    if (instKey === "drums") {
                        const currentObj = currentArr[idx] || { kick: false, snare: false, hihat: false, clap: false };
                        const updatedObj = { ...currentObj, [selectedDrumPart]: !currentObj[selectedDrumPart] };
                        const hasAny = Object.values(updatedObj).some(Boolean);
                        currentArr[idx] = hasAny ? updatedObj : null;
                    } else {
                        currentArr[idx] = currentArr[idx] ? null : { note, dur, subBoost: instKey === "subBass" };
                    }
                    return { ...prev, [instKey]: currentArr };
                });
            };

            const clearSpecificInstrument = (instKey) => {
                setInstrumentSteps(prev => ({ ...prev, [instKey]: new Array(TOTAL_STEPS).fill(null) }));
                setStatus(`🗑️ 【${instKey}】をクリアしました。`);
            };

            return (
                <div className={`min-h-screen bg-slate-950 text-slate-100 flex flex-col text-xs font-sans select-none pb-24 overflow-x-hidden border-8 transition-colors duration-300 ${powerSavingMode ? 'border-emerald-800' : flashColor}`}>
                    
                    {/* イコライザー・スクリーンセーバー */}
                    {screenSaverActive && !powerSavingMode && (
                        <div onClick={() => setScreenSaverActive(false)} className="fixed inset-0 z-50 bg-slate-950/95 flex flex-col items-center justify-center p-6 cursor-pointer backdrop-blur-md">
                            <div className="absolute top-4 right-4 text-cyan-400 font-bold text-sm animate-pulse">[ 画面クリックで通常画面へ戻る ]</div>
                            <div className="text-center mb-8">
                                <h1 className="text-2xl font-black bg-gradient-to-r from-amber-400 via-pink-400 to-cyan-400 bg-clip-text text-transparent animate-bounce">
                                    micvictorysund EQUALIZER SCREEN SAVER
                                </h1>
                                <p className="text-slate-400 text-xs mt-1">(c) micvictorysund | 作曲: 28</p>
                            </div>
                            <div className="flex items-end gap-1.5 h-64 w-full max-w-xl bg-slate-900/80 p-4 rounded-xl border border-slate-800 shadow-2xl">
                                {Array.from({ length: 16 }).map((_, idx) => {
                                    const activeHeight = playing ? Math.floor(Math.sin((idx + currentStep) * 0.5) * 45 + 55) : 10;
                                    return (
                                        <div key={idx} className="flex-1 bg-gradient-to-t from-pink-600 via-purple-600 to-cyan-400 rounded-t transition-all duration-100" style={{ height: `${activeHeight}%` }}></div>
                                    );
                                })}
                            </div>
                        </div>
                    )}

                    {/* ヘッダー */}
                    <header className="bg-slate-900 border-b border-slate-800 px-3 py-2 flex items-center justify-between gap-2 sticky top-0 z-40 shadow-lg">
                        <div className="flex items-center gap-2">
                            <span className="font-black text-sm bg-gradient-to-r from-amber-400 via-pink-400 to-cyan-400 bg-clip-text text-transparent">
                                micvictorysund <span className="text-[10px] text-pink-400 font-bold">著作権・リリースアルバム販売suite v60.0</span>
                            </span>
                        </div>
                        <div className="flex items-center gap-1.5 flex-wrap">
                            <button onClick={() => setPowerSavingMode(!powerSavingMode)} className={`px-2.5 py-1 rounded font-bold text-[10px] border shadow transition-all ${powerSavingMode ? 'bg-emerald-600 border-emerald-400 text-white animate-pulse' : 'bg-slate-800 border-slate-700 text-slate-300'}`}>
                                {powerSavingMode ? '⚡ 節電: ON' : '🔋 節電: OFF'}
                            </button>
                            {!powerSavingMode && (
                                <button onClick={() => setScreenSaverActive(true)} className="px-2.5 py-1 bg-cyan-900 border border-cyan-700 text-cyan-200 font-bold rounded text-[10px]">
                                    📺 スクリーンセーバー
                                </button>
                            )}
                            <button onClick={togglePlay} className={`px-3 py-1 rounded font-bold text-xs shadow ${playing ? "bg-amber-400 text-slate-950 animate-bounce" : "bg-pink-600 text-white"}`}>
                                {playing ? "■ 停止" : "▶ 再生"}
                            </button>
                            <button onClick={triggerScratchRepeat} className="px-2.5 py-1 bg-purple-700 hover:bg-purple-600 text-white font-bold rounded text-xs animate-pulse">
                                🎛️ スクラッチ連打
                            </button>
                            <div className="flex items-center gap-1 bg-slate-950 px-2 py-0.5 rounded border border-slate-800">
                                <span className="text-[9px] text-slate-400">BPM</span>
                                <input type="number" value={bpm} onChange={e => setBpm(Math.max(60, Math.min(220, Number(e.target.value))))} className="w-12 bg-slate-900 text-center font-bold text-pink-400 rounded text-xs py-0.5" />
                            </div>
                        </div>
                    </header>

                    {/* ナビゲーションタブ */}
                    <nav className="bg-slate-900/90 border-b border-slate-800 px-2 py-1.5 flex gap-1 overflow-x-auto">
                        {[
                            { id: "RELEASE_ALBUM", label: "💿 著作権 & リリースアルバム販売" },
                            { id: "DUAL_EDIT", label: "🎛️ 鍵盤 & ドラム(極上音)" },
                            { id: "DJ_SUITE", label: "🎙️ DJボイス & スクラッチ" },
                            { id: "RECORDINGS", label: "📁 個別全体録音(crera)表示" },
                            { id: "RAP_AI", label: "🎤 DJ歌詞 & ラップAI" },
                        ].map(t => (
                            <button key={t.id} onClick={() => setTab(t.id)} className={`px-3 py-1 rounded text-center font-bold transition-all shrink-0 ${tab === t.id ? "bg-amber-500 text-slate-950 shadow" : "bg-slate-800/60 text-slate-400"}`}>
                                {t.label}
                            </button>
                        ))}
                    </nav>

                    {/* ステータスバー */}
                    <div className="bg-slate-900/50 px-3 py-1 text-[11px] text-cyan-400 border-b border-slate-900 truncate flex justify-between items-center">
                        <span>💡 {status} | 🎵 作曲: 28 | (c) micvictorysund</span>
                        {playing && (
                            <div className="flex items-center gap-1">
                                <span className="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
                                <span className="text-[10px] text-cyan-300 font-mono">STEP: {currentStep + 1}</span>
                            </div>
                        )}
                    </div>

                    <main className="p-2 flex flex-col gap-3">
                        {/* 著作権 & リリースアルバム販売タブ */}
                        {tab === "RELEASE_ALBUM" && (
                            <div className="flex flex-col gap-3">
                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-4 flex flex-col gap-3 shadow">
                                    <div className="flex justify-between items-center flex-wrap gap-2">
                                        <span className="text-xs font-bold text-amber-400">💿 micvictorysund 著作権・リリースアルバム販売マネージャー</span>
                                        <span className="text-[10px] bg-pink-950 text-pink-300 px-2 py-0.5 rounded border border-pink-700 font-bold">
                                            (c) micvictorysund / 作曲: 28
                                        </span>
                                    </div>
                                    <p className="text-slate-300 text-[11px] leading-relaxed">
                                        世界最高級DTM「MIC VICTORY SOUND」で制作した楽曲の著作権管理、リリースアルバムの店舗配信、およびオンラインストア販売の設定を行います。すべての楽曲は micvictorysund の公式著作権の下で保護されています。
                                    </p>

                                    {/* 新規アルバム追加フォーム */}
                                    <div className="bg-slate-950 p-3 rounded border border-slate-800 flex flex-col gap-2 mt-1">
                                        <span className="text-[11px] font-bold text-pink-400">➕ 新規リリースアルバム登録</span>
                                        <div className="flex flex-col sm:flex-row gap-2">
                                            <input type="text" value={newAlbumTitle} onChange={e => setNewAlbumTitle(e.target.value)} placeholder="アルバムタイトル" className="flex-1 bg-slate-900 text-slate-100 px-3 py-1.5 rounded text-xs border border-slate-800" />
                                            <input type="text" value={newAlbumPrice} onChange={e => setNewAlbumPrice(e.target.value)} placeholder="価格 (例: ¥2,000)" className="w-28 bg-slate-900 text-slate-100 px-3 py-1.5 rounded text-xs border border-slate-800" />
                                            <button onClick={addNewAlbum} className="px-4 py-1.5 bg-amber-500 text-slate-950 font-bold rounded text-xs shadow">登録して販売</button>
                                        </div>
                                    </div>

                                    {/* アルバム一覧 */}
                                    <div className="flex flex-col gap-2 mt-2">
                                        <span className="text-[11px] font-bold text-cyan-400">販売中の公式リリースアルバム一覧 ({albums.length}作品)</span>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                                            {albums.map(alb => (
                                                <div key={alb.id} className="bg-slate-950 p-3 rounded-lg border border-slate-800 flex flex-col gap-1.5 shadow">
                                                    <div className="flex justify-between items-start">
                                                        <span className="text-xs font-bold text-amber-300">{alb.title}</span>
                                                        <span className="text-[10px] bg-emerald-950 text-emerald-300 px-2 py-0.5 rounded border border-emerald-700 font-bold">{alb.status}</span>
                                                    </div>
                                                    <div className="text-[10px] text-slate-400">アーティスト: <strong className="text-slate-200">{alb.artist}</strong></div>
                                                    <div className="text-[10px] text-slate-400">著作権表記: <strong className="text-pink-400">{alb.copyright}</strong></div>
                                                    <div className="flex justify-between items-center mt-1 pt-1 border-t border-slate-900">
                                                        <span className="text-xs font-black text-cyan-400">{alb.price}</span>
                                                        <div className="flex gap-1">
                                                            <button onClick={() => setStatus(`🛒 「${alb.title}」の購入リンクを生成しました！`)} className="px-2.5 py-1 bg-pink-600 text-white rounded text-[10px] font-bold">購入ページ</button>
                                                            <button onClick={() => setAlbums(albums.filter(a => a.id !== alb.id))} className="px-2 py-1 bg-red-950 text-red-300 rounded text-[10px]">削除</button>
                                                        </div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {tab === "DUAL_EDIT" && (
                            <div className="flex flex-col gap-3">
                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-2.5 shadow">
                                    <div className="flex justify-between items-center">
                                        <span className="text-xs font-bold text-pink-400">① 楽器選択 & 世界最高級ドラム音 / AI予測伴奏</span>
                                        <button onClick={() => clearSpecificInstrument(selectedInstrument)} className="px-2.5 py-1 bg-red-950 text-red-300 font-bold rounded text-[10px]">クリア</button>
                                    </div>
                                    <div className="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 gap-1.5">
                                        {INSTRUMENTS.map(inst => (
                                            <button key={inst.id} onClick={() => setSelectedInstrument(inst.id)} className={`py-2 px-1 rounded-lg font-bold text-[11px] border flex items-center justify-center gap-1 shadow ${selectedInstrument === inst.id ? `bg-gradient-to-r ${inst.color} border-white text-white` : "bg-slate-950 border-slate-800 text-slate-400"}`}>
                                                {inst.label}
                                            </button>
                                        ))}
                                    </div>

                                    <div className="bg-slate-950 p-2.5 rounded border border-slate-800 flex flex-col gap-2 mt-1">
                                        <div className="flex justify-between items-center">
                                            <span className="text-[11px] font-bold text-amber-400">🤖 全体キャッシュ自動AI予測ジェネレーター (20種類)</span>
                                            <button onClick={() => setAutoAiCache(!autoAiCache)} className={`px-2 py-0.5 rounded text-[10px] font-bold ${autoAiCache ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-slate-400'}`}>
                                                {autoAiCache ? '全キャッシュ自動AI: 有効' : '全キャッシュ自動AI: 停止'}
                                            </button>
                                        </div>
                                        <div className="grid grid-cols-5 sm:grid-cols-10 gap-1">
                                            {Array.from({ length: 20 }).map((_, idx) => {
                                                const pNum = idx + 1;
                                                return (
                                                    <button key={pNum} onClick={() => generateAiPattern20(selectedInstrument, pNum)} className={`py-1.5 rounded text-[10px] font-bold border ${activePatternIndex === pNum ? "bg-amber-500 text-slate-950 border-white" : "bg-slate-900 text-slate-300 border-slate-800"}`}>
                                                        #{pNum}
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3 shadow">
                                    <div className="flex justify-between items-center flex-wrap gap-2">
                                        <span className="text-xs font-bold text-cyan-400">② 鍵盤 & 音の長さ調整</span>
                                        <div className="flex items-center gap-1 bg-slate-950 px-2 py-1 rounded border border-slate-800">
                                            <span className="text-[10px] text-amber-400 font-bold">音長:</span>
                                            {DURATION_OPTIONS.map(d => (
                                                <button key={d.id} onClick={() => setSelectedDuration(d.id)} className={`px-2 py-0.5 rounded text-[10px] font-bold ${selectedDuration === d.id ? "bg-amber-500 text-slate-950" : "bg-slate-900 text-slate-400"}`}>
                                                    {d.label.split(" ")[0]}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {selectedInstrument === "drums" && (
                                        <div className="flex items-center gap-2 bg-slate-950 p-2 rounded border border-slate-800">
                                            <span className="text-[10px] font-bold text-red-400">世界最高級ドラム打楽器切替:</span>
                                            {["kick", "snare", "hihat", "clap"].map(part => (
                                                <button key={part} onClick={() => setSelectedDrumPart(part)} className={`px-2.5 py-1 rounded text-[10px] font-bold ${selectedDrumPart === part ? "bg-red-600 text-white" : "bg-slate-900 text-slate-400"}`}>
                                                    {part.toUpperCase()}
                                                </button>
                                            ))}
                                        </div>
                                    )}

                                    <div className="grid grid-cols-8 gap-1.5">
                                        {NOTES.map(note => (
                                            <button key={note} onClick={() => playNoteKeyboard(note)} className={`py-4 rounded font-bold text-center border shadow transition-all active:scale-95 ${selectedNote === note ? "bg-amber-500 text-slate-950 border-white ring-2 ring-amber-400" : "bg-slate-950 text-slate-100 border-slate-800 hover:bg-slate-900"}`}>
                                                <div className="text-sm font-black">{SOLFEGE[note]}</div>
                                                <div className="text-[9px] opacity-70">{note}</div>
                                            </button>
                                        ))}
                                    </div>

                                    <div className="flex items-center justify-between bg-slate-950 p-2 rounded border border-slate-800">
                                        <span className="text-[11px] text-slate-300">小節選択: <strong className="text-pink-400">{currentBar + 1} / 8</strong></span>
                                        <div className="flex gap-1">
                                            {Array.from({ length: BARS }).map((_, b) => (
                                                <button key={b} onClick={() => setCurrentBar(b)} className={`w-6 h-6 rounded-full text-xs font-bold ${currentBar === b ? "bg-amber-500 text-slate-950" : "bg-slate-800 text-slate-400"}`}>{b + 1}</button>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="overflow-x-auto bg-slate-950 p-2 rounded border border-slate-800">
                                        <div className="grid gap-1 min-w-[500px]" style={{ gridTemplateColumns: "repeat(16, minmax(0, 1fr))" }}>
                                            {Array.from({ length: BAR_STEPS }).map((_, i) => {
                                                const stepIdx = currentBar * BAR_STEPS + i;
                                                const stepVal = instrumentSteps[selectedInstrument][stepIdx];
                                                const isCurrentPlay = playing && currentStep === i;
                                                let isActive = selectedInstrument === "drums" ? (stepVal && stepVal[selectedDrumPart]) : !!stepVal;

                                                return (
                                                    <button key={i} onClick={() => toggleStepWithDuration(selectedInstrument, stepIdx)} className={`aspect-[3/4] w-full rounded border flex flex-col items-center justify-center text-[9px] ${isActive ? "bg-gradient-to-t from-amber-600 to-pink-600 border-white text-white font-bold" : "bg-slate-900 border-slate-800 text-slate-500"} ${isCurrentPlay && !powerSavingMode ? "ring-2 ring-cyan-400" : ""}`}>
                                                        <span>{i + 1}</span>
                                                        {stepVal && typeof stepVal === "object" && stepVal.dur && (
                                                            <span className="text-[7px] text-yellow-200">{stepVal.dur}</span>
                                                        )}
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {tab === "DJ_SUITE" && (
                            <div className="flex flex-col gap-3">
                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-4 flex flex-col gap-3">
                                    <span className="text-xs font-bold text-pink-400">🎙️ DJボイス録音記録・再生機能 & スクラッチコントロール</span>
                                    <div className="bg-slate-950 p-3 rounded border border-slate-800 flex flex-col gap-2">
                                        <div className="flex gap-2 items-center">
                                            <button onClick={toggleRecordDjVoice} className={`px-4 py-2 rounded font-bold text-xs ${isRecordingDjVoice ? 'bg-red-600 text-white animate-pulse' : 'bg-slate-800 text-pink-400 border border-pink-700'}`}>
                                                {isRecordingDjVoice ? '🔴 DJボイス録音中 (Stop)' : '🎙️ DJボイス新規録音'}
                                            </button>
                                            <button onClick={triggerScratchRepeat} className="px-4 py-2 bg-purple-600 hover:bg-purple-500 text-white font-bold rounded text-xs">
                                                🎛️ スクラッチ連打リピート
                                            </button>
                                        </div>
                                        <div className="flex flex-col gap-1.5 mt-2">
                                            <span className="text-[10px] text-slate-400">保存されたDJボイス録音一覧:</span>
                                            {djVoiceRecordings.map(v => (
                                                <div key={v.id} className="flex justify-between items-center bg-slate-900 p-2 rounded border border-slate-800">
                                                    <span className="text-cyan-300 font-bold">{v.title} ({v.date})</span>
                                                    <button onClick={() => setStatus(`▶ ${v.title} 再生中！`)} className="px-2.5 py-1 bg-cyan-700 text-white rounded text-[10px]">再生</button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {tab === "RECORDINGS" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-4 flex flex-col gap-3">
                                <div className="flex justify-between items-center">
                                    <span className="text-xs font-bold text-pink-400">📁 個別全体録音表示 (crera保存リスト)</span>
                                    <button onClick={saveCurrentTakeToCrera} className="px-3 py-1.5 bg-amber-500 text-slate-950 font-bold rounded text-xs">
                                        ➕ 現在のセッションをリリースに追加
                                    </button>
                                </div>
                                <div className="bg-slate-950 p-3 rounded border border-slate-800 flex flex-col gap-2 max-h-[260px] overflow-y-auto">
                                    {recordedTakes.length === 0 ? <span className="text-[10px] text-slate-500">記録なし</span> : recordedTakes.map(t => (
                                        <div key={t.id} className="flex justify-between items-center bg-slate-900 p-2 rounded border border-slate-800">
                                            <div>
                                                <div className="text-cyan-400 text-xs font-bold">{t.title}</div>
                                                <div className="text-[9px] text-slate-400">BPM: {t.bpm} | {t.credit} | {t.date}</div>
                                            </div>
                                            <div className="flex gap-1">
                                                <button onClick={() => setStatus(`🚀 ${t.title} 読込完了！`)} className="px-2.5 py-1 bg-emerald-700 text-white rounded text-[10px]">読込</button>
                                                <button onClick={() => setRecordedTakes(recordedTakes.filter(x => x.id !== t.id))} className="px-2.5 py-1 bg-red-900 text-white rounded text-[10px]">削除</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {tab === "RAP_AI" && (
                            <div className="flex flex-col gap-3">
                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-4 flex flex-col gap-3">
                                    <div className="flex justify-between items-center flex-wrap gap-2">
                                        <span className="text-xs font-bold text-pink-400">🎤 DJ歌詞 & ラップAI作成</span>
                                        <div className="flex gap-1">
                                            {["青春・希望", "恋愛・情熱", "時代・春夏秋冬", "友情・仲間"].map(theme => (
                                                <button key={theme} onClick={() => setLyricTheme(theme)} className={`px-2 py-1 rounded text-[10px] font-bold ${lyricTheme === theme ? "bg-pink-600 text-white" : "bg-slate-800 text-slate-400"}`}>
                                                    {theme}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                    <textarea value={rapLyrics} onChange={e => setRapLyrics(e.target.value)} rows="8" className="bg-slate-950 text-slate-100 p-2.5 rounded text-xs border border-slate-800 font-mono leading-relaxed" />
                                    <div className="flex gap-2">
                                        <button onClick={() => setStatus("📝 DJ歌詞データをcreraメモリに記録しました！")} className="px-3 py-1.5 bg-cyan-600 text-white font-bold rounded text-xs">crera保存</button>
                                        <button onClick={() => setRapLyrics("[DJ Verse - " + lyricTheme + "]\nmicvictorysund 著作権リリースアルバム公式ソング\n作曲: 28 / (c) 2026 micvictorysund")} className="px-3 py-1.5 bg-slate-800 text-slate-300 font-bold rounded text-xs">AI自動切替生成</button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<MasterSynthApp />);
    </script>
</body>
</html>
