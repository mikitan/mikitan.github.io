<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIC VICTORY - DLAND DTM v58.0 崩れないドラム20 & AIメロディ完全版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans select-none pb-24 overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        function MasterSynthApp() {
            const [tab, setTab] = React.useState("DRUM_AI_HUB");
            const [playing, setPlaying] = React.useState(false);
            const [isRecording, setIsRecording] = React.useState(false);
            const [flashColor, setFlashColor] = React.useState("border-cyan-500");
            const [bpm, setBpm] = React.useState(112);
            const [currentBar, setCurrentBar] = React.useState(0);
            const [currentStep, setCurrentStep] = React.useState(-1);
            const [status, setStatus] = React.useState("✨ v58.0 崩れないドラム20種 & AIメロディ統合稼働中！");

            const BARS = 8;
            const BAR_STEPS = 16;
            const TOTAL_STEPS = BARS * BAR_STEPS;

            const [selectedInstrument, setSelectedInstrument] = React.useState("drums");
            const [selectedNote, setSelectedNote] = React.useState("C4");
            const [selectedDuration, setSelectedDuration] = React.useState("8n");
            const [selectedDrumPart, setSelectedDrumPart] = React.useState("kick");

            const [creraTakes, setCreraTakes] = React.useState([]);
            const [activePatternIndex, setActivePatternIndex] = React.useState(1);

            // 崩壊防止セーフ積層ミキサー／音響ゲイン設定
            const [masterBassBoost, setMasterBassBoost] = React.useState(12);
            const [masterVolume, setMasterVolume] = React.useState(1.2);
            const [dlandMode, setDlandMode] = React.useState(true);
            const [slotName, setSlotName] = React.useState("DLAND_v58_DRUM20_COMPLETE");

            const INSTRUMENTS = [
                { id: "drums", label: "🥁 ドラム/ハリ極尖(20種)", color: "from-red-600 to-amber-600" },
                { id: "loopTrack", label: "🔁 ブラコンカッティング", color: "from-pink-600 to-rose-600" },
                { id: "subBass", label: "🔊 C0超重低音土台", color: "from-amber-600 to-orange-700" },
                { id: "bass", label: "🎸 ファットスラップ", color: "from-emerald-600 to-teal-600" },
                { id: "synth", label: "🎹 ローズ系スタブ", color: "from-cyan-600 to-blue-700" },
                { id: "trumpet", label: "🎺 ブラスセクション", color: "from-yellow-500 to-amber-600" },
                { id: "guitar", label: "🎸 ファンクギター", color: "from-orange-600 to-red-700" },
                { id: "africa1", label: "🪘 ジャンベパーク", color: "from-amber-700 to-yellow-800" },
                { id: "africa2", label: "🎹 カリンバコンプ", color: "from-yellow-600 to-amber-600" },
                { id: "piano", label: "🎹 グランドエレピ", color: "from-blue-600 to-indigo-600" },
                { id: "violin", label: "🎻 ストリングス", color: "from-amber-600 to-yellow-700" },
                { id: "flute", label: "🪈 スムースフルート", color: "from-teal-500 to-cyan-600" },
            ];

            const [instrumentSteps, setInstrumentSteps] = React.useState(() => {
                const init = {};
                INSTRUMENTS.forEach(inst => init[inst.id] = new Array(TOTAL_STEPS).fill(null));
                return init;
            });

            const [volumes, setVolumes] = React.useState({
                drums: 4, loopTrack: -2, subBass: 6, bass: 3, synth: 0, trumpet: -1, guitar: -2, africa1: -3, africa2: -3, piano: 0, violin: -4, flute: -4
            });

            const synthsRef = React.useRef(null);
            const loopRef = React.useRef(null);
            const masterGainRef = React.useRef(null);

            const NOTES = ["C4", "D4", "E4", "F4", "G4", "A4", "B4", "C5"];
            const SOLFEGE = { "C4": "ド", "D4": "レ", "E4": "ミ", "F4": "ファ", "G4": "ソ", "A4": "ラ", "B4": "シ", "C5": "ド" };
            const DURATION_OPTIONS = [
                { id: "16n", label: "極短パンチ(16分)" },
                { id: "8n", label: "標準グルーヴ(8分)" },
                { id: "4n", label: "長めレガート(4分)" },
                { id: "2n", label: "ロングパッド(2n)" },
            ];

            const purgeAndClearCacheBuffer = () => {
                try {
                    if (Tone.context && Tone.context.state === 'suspended') Tone.context.resume();
                    const empty = {};
                    INSTRUMENTS.forEach(inst => empty[inst.id] = new Array(TOTAL_STEPS).fill(null));
                    setInstrumentSteps(empty);
                    setStatus("🧹 積層キャッシュ完全クリア＆安全初期化完了！");
                } catch(e) {
                    setStatus("⚠️ 保護例外リセット");
                }
            };

            React.useEffect(() => {
                const masterGain = new Tone.Gain(masterVolume).toDestination();
                masterGainRef.current = masterGain;

                const eq = new Tone.EQ3({ low: masterBassBoost, lowFrequency: 140, mid: 2.0, high: 2.5 }).connect(masterGain);
                const reverb = new Tone.Reverb({ decay: 1.2, wet: 0.1 }).connect(eq);
                const delay = new Tone.FeedbackDelay({ delayTime: "8n", feedback: 0.15, wet: 0.08 }).connect(reverb);
                const distortion = new Tone.Distortion(0.08).connect(delay);

                const cGains = {};
                INSTRUMENTS.forEach(inst => {
                    cGains[inst.id] = new Tone.Gain(Tone.dbToGain(volumes[inst.id] || 0)).connect(distortion);
                });

                synthsRef.current = {
                    subBass: new Tone.MonoSynth({
                        oscillator: { type: "sine" },
                        envelope: { attack: 0.003, decay: 0.38, sustain: 0.55, release: 0.2 },
                        filterEnvelope: { attack: 0.003, decay: 0.22, sustain: 0.35, release: 0.2, baseFrequency: 65, octaves: 1.4 }
                    }).connect(cGains.subBass),
                    bass: new Tone.MonoSynth({
                        oscillator: { type: "triangle" },
                        envelope: { attack: 0.006, decay: 0.32, sustain: 0.45, release: 0.15 }
                    }).connect(cGains.bass),
                    synth: new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.008, decay: 0.28, sustain: 0.45, release: 0.2 } }).connect(cGains.synth),
                    loopTrack: new Tone.Synth({ oscillator: { type: "triangle" }, envelope: { attack: 0.005, decay: 0.15, sustain: 0.2, release: 0.1 } }).connect(cGains.loopTrack),
                    guitar: new Tone.Synth({ oscillator: { type: "sawtooth" }, envelope: { attack: 0.004, decay: 0.18, sustain: 0.2, release: 0.1 } }).connect(cGains.guitar),
                    trumpet: new Tone.Synth({ oscillator: { type: "sawtooth" }, envelope: { attack: 0.03, decay: 0.2, sustain: 0.6, release: 0.15 } }).connect(cGains.trumpet),
                    africa1: new Tone.MembraneSynth({ pitchDecay: 0.02, octaves: 4, oscillator: { type: "sine" }, envelope: { attack: 0.001, decay: 0.2, sustain: 0.01, release: 0.1 } }).connect(cGains.africa1),
                    africa2: new Tone.Synth({ oscillator: { type: "triangle" }, envelope: { attack: 0.001, decay: 0.18, sustain: 0.1, release: 0.15 } }).connect(cGains.africa2),
                    piano: new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.008, decay: 0.35, sustain: 0.3, release: 0.3 } }).connect(cGains.piano),
                    violin: new Tone.Synth({ oscillator: { type: "sawtooth" }, envelope: { attack: 0.05, decay: 0.28, sustain: 0.7, release: 0.3 } }).connect(cGains.violin),
                    flute: new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.05, decay: 0.25, sustain: 0.7, release: 0.25 } }).connect(cGains.flute),
                    drums: {
                        kick: new Tone.MembraneSynth({ pitchDecay: 0.055, octaves: 6, oscillator: { type: "sine" }, envelope: { attack: 0.0001, decay: 0.28, sustain: 0.01, release: 0.12 } }).connect(cGains.drums),
                        snare: new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.0001, decay: 0.16, sustain: 0 } }).connect(cGains.drums),
                        hihat: new Tone.MetalSynth({ frequency: 980, envelope: { attack: 0.0005, decay: 0.022, release: 0.01 }, harmonicity: 5.1, modulationIndex: 32, resonance: 7200, octaves: 1.4 }).connect(cGains.drums),
                        clap: new Tone.NoiseSynth({ noise: { type: "pink" }, envelope: { attack: 0.004, decay: 0.13, sustain: 0 } }).connect(cGains.drums),
                    },
                    eq, reverb, distortion
                };

                return () => { Tone.Transport.stop(); Tone.Transport.cancel(); };
            }, []);

            const updateInstrumentVolume = (instId, dbVal) => {
                setVolumes(prev => ({ ...prev, [instId]: dbVal }));
            };

            React.useEffect(() => {
                Tone.Transport.bpm.value = bpm;
                Tone.Transport.cancel();

                if (playing) {
                    let stepCounter = 0;
                    loopRef.current = new Tone.Loop(time => {
                        let step = stepCounter % TOTAL_STEPS;
                        const bar = Math.floor(step / BAR_STEPS);
                        const sInBar = step % BAR_STEPS;

                        setCurrentStep(sInBar);
                        setCurrentBar(bar);

                        if (dlandMode && sInBar === 0) {
                            const colors = ["border-cyan-500", "border-pink-500", "border-amber-500", "border-purple-500", "border-emerald-500"];
                            setFlashColor(colors[Math.floor(Math.random() * colors.length)]);
                        }

                        const syns = synthsRef.current;
                        if (!syns) return;

                        Object.keys(instrumentSteps).forEach(instKey => {
                            const item = instrumentSteps[instKey][step];
                            if (!item) return;

                            const note = typeof item === "object" ? item.note : item;
                            const dur = typeof item === "object" ? (item.dur || "8n") : "8n";

                            if (instKey === "drums") {
                                if (typeof item === "object") {
                                    if (item.kick) syns.drums.kick.triggerAttackRelease("C1", "8n", time);
                                    if (item.snare) syns.drums.snare.triggerAttackRelease("8n", time);
                                    if (item.hihat) syns.drums.hihat.triggerAttackRelease("32n", time, 0.92);
                                    if (item.clap) syns.drums.clap.triggerAttackRelease("8n", time);
                                }
                            } else if (instKey === "subBass") {
                                syns.subBass.triggerAttackRelease(item.subBoost ? "C0" : "C1", dur, time);
                            } else if (syns[instKey]) {
                                syns[instKey].triggerAttackRelease(note || "C4", dur, time);
                            }
                        });

                        stepCounter++;
                    }, "16n").start(0);

                    Tone.Transport.start();
                } else {
                    Tone.Transport.stop();
                }
            }, [playing, bpm, instrumentSteps, dlandMode]);

            // ドラム専用 20種AIパターン生成関数
            const generateDrumPattern20 = (pNum) => {
                const newArr = new Array(TOTAL_STEPS).fill(null);
                for (let i = 0; i < TOTAL_STEPS; i++) {
                    const s = i % 16;
                    let isKick = false;
                    let isSnare = false;
                    let isHihat = false;
                    let isClap = false;

                    // パターン番号に応じて多彩なリズム（4つ打ち、ブレイクビーツ、ファンク、変則など）を構築
                    if (pNum === 1) { // スタンダード4つ打ち
                        isKick = (s === 0 || s === 4 || s === 8 || s === 12);
                        isSnare = (s === 4 || s === 12);
                        isHihat = (i % 2 === 0);
                    } else if (pNum === 2) { // レゲトン風
                        isKick = (s === 0 || s === 3 || s === 8 || s === 11);
                        isSnare = (s === 4 || s === 12);
                        isHihat = (i % 2 === 0);
                    } else if (pNum === 3) { // ヒップホップ・ブームバップ
                        isKick = (s === 0 || s === 6 || s === 10);
                        isSnare = (s === 4 || s === 12);
                        isHihat = (i % 2 === 0 || s === 14);
                    } else if (pNum === 4) { // ファンキー・シンコペーション
                        isKick = (s === 0 || s === 3 || s === 8 || s === 10);
                        isSnare = (s === 4 || s === 12 || s === 15);
                        isHihat = (i % 2 === 0);
                        isClap = (s === 12);
                    } else if (pNum === 5) { // 高速ツーバス・ロック
                        isKick = (s % 2 === 0);
                        isSnare = (s === 4 || s === 12);
                        isHihat = (i % 2 === 0);
                    } else { // 6〜20: アルゴリズミック自動生成による多彩なリズムバリエーション
                        isKick = (i % (4 + (pNum % 3)) === 0 || (pNum % 2 === 0 && s === 10));
                        isSnare = (s === 4 || s === 12 || (pNum > 10 && s === 14));
                        isHihat = (i % Math.max(1, (pNum % 4)) === 0);
                        isClap = (pNum > 8 && s === 12);
                    }

                    if (isKick || isSnare || isHihat || isClap) {
                        newArr[i] = { kick: isKick, snare: isSnare, hihat: isHihat, clap: isClap };
                    }
                }
                setInstrumentSteps(prev => ({ ...prev, drums: newArr }));
                setActivePatternIndex(pNum);
                setStatus(`🥁 ドラム崩れないパターン #${pNum} を適用しました！`);
            };

            // メロディ・コード・ベース等専用 AIジェネレーター (全20種)
            const generateAiMelodyOrInst20 = (instKey, patternNum) => {
                const scales = {
                    synth: ["C4", "Eb4", "G4", "Bb4", "C5", "G4"],
                    bass: ["C2", "Eb2", "G2", "Bb2"],
                    subBass: ["C0", "C1"],
                    loopTrack: ["C4", "F4", "G4", "C5"],
                    trumpet: ["C4", "E4", "G4", "C5"],
                    guitar: ["Eb3", "G3", "Bb3", "Eb4"],
                    africa1: ["C3", "G3", "D4"],
                    africa2: ["C4", "D4", "F4", "G4"],
                    piano: ["C4", "Eb4", "G4", "Bb4"],
                    violin: ["D4", "F#4", "A4", "D5"],
                    flute: ["G4", "Bb4", "D5", "G5"],
                    drums: []
                };
                const scale = scales[instKey] || ["C4", "D4", "E4", "G4", "A4", "C5"];
                const newArr = new Array(TOTAL_STEPS).fill(null);

                for (let i = 0; i < TOTAL_STEPS; i++) {
                    if (instKey === "subBass") {
                        if (i % 4 === 0 || (patternNum % 2 === 0 && i % 16 === 10)) {
                            newArr[i] = { note: "C0", dur: "16n", subBoost: true };
                        }
                    } else {
                        const density = 0.25 + (patternNum * 0.02) % 0.45;
                        if ((i * 3 + patternNum) % Math.max(2, Math.floor(10 - density * 8)) === 0) {
                            const noteChoice = scale[(i + patternNum) % scale.length];
                            newArr[i] = { note: noteChoice, dur: patternNum > 15 ? "16n" : "8n" };
                        }
                    }
                }
                setInstrumentSteps(prev => ({ ...prev, [instKey]: newArr }));
                setStatus(`🤖 【${instKey}】AIメロディパターン #${patternNum} 生成完了！`);
            };

            const toggleRecordCrera = async () => {
                await Tone.start();
                setIsRecording(!isRecording);
                if (!isRecording) {
                    setStatus("🔴 【CRERA録音中】演奏キャプチャ開始...");
                } else {
                    const newTake = {
                        id: Date.now(),
                        title: `CRERA テイク #${creraTakes.length + 1} (${selectedInstrument})`,
                        bpm,
                        stepsSnapshot: JSON.parse(JSON.stringify(instrumentSteps)),
                        date: new Date().toLocaleTimeString()
                    };
                    setCreraTakes(prev => [newTake, ...prev]);
                    setStatus("⏹️ 【CRERA録音完了】アーカイブにセーブしました！");
                }
            };

            const playOrLoadCreraTake = (take) => {
                setInstrumentSteps(JSON.parse(JSON.stringify(take.stepsSnapshot)));
                setBpm(take.bpm);
                setStatus(`▶ 録音テイク [${take.title}] 復元ロード完了！`);
            };

            const playNoteKeyboard = (note) => {
                setSelectedNote(note);
                const syns = synthsRef.current;
                if (!syns) return;
                if (selectedInstrument === "drums") {
                    if (selectedDrumPart === "kick") syns.drums.kick.triggerAttackRelease("C1", selectedDuration);
                    else if (selectedDrumPart === "snare") syns.drums.snare.triggerAttackRelease(selectedDuration);
                    else if (selectedDrumPart === "hihat") syns.drums.hihat.triggerAttackRelease("32n");
                    else syns.drums.clap.triggerAttackRelease(selectedDuration);
                } else if (selectedInstrument === "subBass") {
                    syns.subBass.triggerAttackRelease("C0", selectedDuration);
                } else if (syns[selectedInstrument]) {
                    syns[selectedInstrument].triggerAttackRelease(note, selectedDuration);
                }
                if (currentStep !== -1) {
                    toggleStepWithDuration(selectedInstrument, currentBar * BAR_STEPS + currentStep, note, selectedDuration);
                }
            };

            const toggleStepWithDuration = (instKey, idx, note = selectedNote, dur = selectedDuration) => {
                setInstrumentSteps(prev => {
                    const currentArr = [...prev[instKey]];
                    if (instKey === "drums") {
                        const currentObj = currentArr[idx] || { kick: false, snare: false, hihat: false, clap: false };
                        const updatedObj = { ...currentObj, [selectedDrumPart]: !currentObj[selectedDrumPart] };
                        const hasAny = Object.values(updatedObj).some(Boolean);
                        currentArr[idx] = hasAny ? updatedObj : null;
                    } else {
                        currentArr[idx] = currentArr[idx] ? null : { note, dur, subBoost: instKey === "subBass" };
                    }
                    return { ...prev, [instKey]: currentArr };
                });
            };

            const exportProjectToFile = () => {
                const projectData = { title: slotName, bpm, instrumentSteps, volumes, creraTakes, date: new Date().toISOString() };
                const blob = new Blob([JSON.stringify(projectData, null, 2)], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `${slotName}.json`;
                a.click();
                URL.revokeObjectURL(url);
                setStatus(`💾 プロジェクトファイル保存完了`);
            };

            const importProjectFromFile = (event) => {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (data.instrumentSteps) setInstrumentSteps(data.instrumentSteps);
                        if (data.bpm) setBpm(data.bpm);
                        if (data.creraTakes) setCreraTakes(data.creraTakes);
                        setStatus(`📂 プロジェクト読込成功`);
                    } catch (err) {
                        setStatus("❌ ファイル読込エラー");
                    }
                };
                reader.readAsText(file);
            };

            const currentInstObj = INSTRUMENTS.find(i => i.id === selectedInstrument) || INSTRUMENTS[0];

            return (
                <div className={`min-h-screen bg-slate-950 text-slate-100 flex flex-col text-xs font-sans select-none pb-24 overflow-x-hidden border-8 transition-colors duration-300 ${flashColor}`}>
                    <header className="bg-slate-900 border-b border-slate-800 px-3 py-2 flex items-center justify-between gap-2 sticky top-0 z-40 shadow-lg">
                        <div className="flex items-center gap-2">
                            <span className="font-black text-sm bg-gradient-to-r from-amber-400 via-pink-400 to-cyan-400 bg-clip-text text-transparent">
                                MIC VICTORY <span className="text-[10px] text-pink-400 font-bold">v58.0 ドラム20 & AIメロディ統合</span>
                            </span>
                        </div>
                        <div className="flex items-center gap-1.5 flex-wrap">
                            <button onClick={purgeAndClearCacheBuffer} className="px-2 py-1 bg-red-900 border border-red-700 text-red-200 font-bold rounded text-[10px]">
                                🧹 キャッシュクリア
                            </button>
                            <button onClick={() => setPlaying(!playing)} className={`px-3 py-1 rounded font-bold text-xs shadow ${playing ? "bg-amber-400 text-slate-950 animate-bounce" : "bg-pink-600 text-white"}`}>
                                {playing ? "■ 停止" : "▶ 再生"}
                            </button>
                            <button onClick={toggleRecordCrera} className={`px-3 py-1 rounded font-bold text-xs shadow ${isRecording ? "bg-red-600 text-white animate-pulse" : "bg-slate-800 text-red-400 border border-red-800"}`}>
                                {isRecording ? "🔴 録音中" : "⏺️ CRERA録音"}
                            </button>
                            <div className="flex items-center gap-1 bg-slate-950 px-2 py-0.5 rounded border border-slate-800">
                                <span className="text-[9px] text-slate-400">BPM</span>
                                <input type="number" value={bpm} onChange={e => setBpm(Math.max(60, Math.min(220, Number(e.target.value))))} className="w-12 bg-slate-900 text-center font-bold text-pink-400 rounded text-xs py-0.5" />
                            </div>
                        </div>
                    </header>

                    <nav className="bg-slate-900/90 border-b border-slate-800 px-2 py-1.5 flex gap-1 overflow-x-auto">
                        {[
                            { id: "DRUM_AI_HUB", label: "🥁 ドラム20種 & AIメロディ統合" },
                            { id: "INSTRUMENT_GRID", label: "🎛️ 各楽器個別グリッド記録" },
                            { id: "KEYBOARD_EDIT", label: "🎹 鍵盤 & リアルタイム入力" },
                            { id: "SAFE_MIXER", label: "🎚️ 崩れない積層ミキサー" },
                            { id: "CRERA_ARCHIVE", label: "📁 テイク管理" },
                            { id: "MEMORY", label: "💾 保存/読込" },
                        ].map(t => (
                            <button key={t.id} onClick={() => setTab(t.id)} className={`px-3 py-1 rounded text-center font-bold transition-all shrink-0 ${tab === t.id ? "bg-amber-500 text-slate-950 shadow" : "bg-slate-800/60 text-slate-400"}`}>
                                {t.label}
                            </button>
                        ))}
                    </nav>

                    <div className="bg-slate-900/50 px-3 py-1 text-[11px] text-cyan-400 border-b border-slate-900 truncate">
                        💡 {status} | 現在選択: <span className="text-pink-400 font-bold">{currentInstObj.label}</span>
                    </div>

                    <main className="p-2 flex flex-col gap-3">
                        {tab === "DRUM_AI_HUB" && (
                            <div className="flex flex-col gap-3">
                                {/* ドラム20種クイック付加エリア */}
                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3 shadow">
                                    <div className="flex justify-between items-center">
                                        <span className="text-xs font-bold text-red-400">🥁 崩れないつけ足しドラム (全20種プリセット)</span>
                                        <span className="text-[10px] text-slate-400">いつでも重ねてリズム強化！</span>
                                    </div>
                                    <div className="grid grid-cols-5 sm:grid-cols-10 gap-1">
                                        {Array.from({ length: 20 }).map((_, idx) => {
                                            const pNum = idx + 1;
                                            return (
                                                <button key={pNum} onClick={() => generateDrumPattern20(pNum)} className="py-1.5 rounded text-[10px] font-bold bg-slate-950 text-red-300 border border-red-900/50 hover:bg-red-600 hover:text-white transition-all">
                                                    ドラム#{pNum}
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>

                                {/* AIメロディ・コード生成エリア */}
                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3 shadow">
                                    <div className="flex justify-between items-center flex-wrap gap-2">
                                        <div className="flex items-center gap-2">
                                            <span className="text-xs font-bold text-cyan-400">対象楽器 (AIメロディ追加):</span>
                                            <select value={selectedInstrument} onChange={e => setSelectedInstrument(e.target.value)} className="bg-slate-950 text-amber-400 border border-slate-800 rounded text-xs p-1.5 font-bold">
                                                {INSTRUMENTS.filter(i => i.id !== "drums").map(i => <option key={i.id} value={i.id}>{i.label}</option>)}
                                            </select>
                                        </div>
                                    </div>
                                    <div className="flex flex-col gap-1.5">
                                        <span className="text-[11px] font-bold text-pink-400">AIメロディパターン生成 (全20種)</span>
                                        <div className="grid grid-cols-5 sm:grid-cols-10 gap-1">
                                            {Array.from({ length: 20 }).map((_, idx) => {
                                                const pNum = idx + 1;
                                                return (
                                                    <button key={pNum} onClick={() => generateAiMelodyOrInst20(selectedInstrument === "drums" ? "synth" : selectedInstrument, pNum)} className="py-1.5 rounded text-[10px] font-bold bg-slate-950 text-cyan-300 border border-slate-800 hover:bg-cyan-500 hover:text-slate-950 transition-all">
                                                        AI #{pNum}
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {tab === "INSTRUMENT_GRID" && (
                            <div className="flex flex-col gap-3">
                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3 shadow">
                                    <div className="flex justify-between items-center">
                                        <span className="text-xs font-bold text-cyan-400">編集楽器:</span>
                                        <select value={selectedInstrument} onChange={e => setSelectedInstrument(e.target.value)} className="bg-slate-950 text-amber-400 border border-slate-800 rounded text-xs p-1.5 font-bold">
                                            {INSTRUMENTS.map(i => <option key={i.id} value={i.id}>{i.label}</option>)}
                                        </select>
                                    </div>
                                    {selectedInstrument === "drums" && (
                                        <div className="flex items-center gap-2 bg-slate-950 p-2 rounded border border-slate-800">
                                            <span className="text-[11px] text-red-400 font-bold">ドラムパーツ切替:</span>
                                            {["kick", "snare", "hihat", "clap"].map(part => (
                                                <button key={part} onClick={() => setSelectedDrumPart(part)} className={`px-2.5 py-1 rounded text-[10px] font-bold uppercase ${selectedDrumPart === part ? "bg-red-600 text-white" : "bg-slate-900 text-slate-400"}`}>
                                                    {part}
                                                </button>
                                            ))}
                                        </div>
                                    )}
                                </div>

                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3 shadow">
                                    <div className="flex justify-between items-center">
                                        <span className="text-xs font-bold text-amber-400">{currentInstObj.label} - 8小節詳細グリッド</span>
                                        <span className="text-[10px] text-slate-400">小節 {currentBar + 1} / ステップ {currentStep + 1}</span>
                                    </div>

                                    {Array.from({ length: BARS }).map((_, barIdx) => (
                                        <div key={barIdx} className="flex flex-col gap-1 bg-slate-950 p-2 rounded border border-slate-800">
                                            <div className="text-[10px] font-bold text-cyan-400">Bar {barIdx + 1}</div>
                                            <div className="grid grid-cols-16 gap-1">
                                                {Array.from({ length: BAR_STEPS }).map((_, stepIdx) => {
                                                    const absoluteStep = barIdx * BAR_STEPS + stepIdx;
                                                    const stepData = instrumentSteps[selectedInstrument][absoluteStep];
                                                    const isCurrent = currentBar === barIdx && currentStep === stepIdx && playing;

                                                    return (
                                                        <button
                                                            key={stepIdx}
                                                            onClick={() => toggleStepWithDuration(selectedInstrument, absoluteStep)}
                                                            className={`h-9 rounded flex flex-col items-center justify-center text-[8px] font-bold border transition-all ${
                                                                isCurrent ? "ring-2 ring-pink-400" : ""
                                                            } ${
                                                                stepData ? "bg-amber-500 text-slate-950 border-white shadow" : "bg-slate-900 text-slate-600 border-slate-800 hover:bg-slate-800"
                                                            }`}
                                                        >
                                                            <span>{stepIdx + 1}</span>
                                                            <span className="truncate w-full text-center">{stepData ? (selectedInstrument === "drums" ? "打" : (stepData.note || "ON")) : "·"}</span>
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {tab === "KEYBOARD_EDIT" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3 shadow">
                                <div className="flex justify-between items-center flex-wrap gap-2">
                                    <div className="flex items-center gap-2">
                                        <span className="text-xs font-bold text-cyan-400">楽器:</span>
                                        <select value={selectedInstrument} onChange={e => setSelectedInstrument(e.target.value)} className="bg-slate-950 text-amber-400 border border-slate-800 rounded text-xs p-1 font-bold">
                                            {INSTRUMENTS.map(i => <option key={i.id} value={i.id}>{i.label}</option>)}
                                        </select>
                                    </div>
                                </div>
                                <div className="grid grid-cols-8 gap-1.5">
                                    {NOTES.map(note => (
                                        <button key={note} onClick={() => playNoteKeyboard(note)} className={`py-4 rounded font-bold text-center border shadow transition-all active:scale-95 ${selectedNote === note ? "bg-amber-500 text-slate-950 border-white ring-2 ring-amber-400" : "bg-slate-950 text-slate-100 border-slate-800 hover:bg-slate-900"}`}>
                                            <div className="text-sm font-black">{SOLFEGE[note]}</div>
                                            <div className="text-[9px] opacity-70">{note}</div>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        {tab === "SAFE_MIXER" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-4 flex flex-col gap-3">
                                <span className="text-xs font-bold text-amber-400">🎚️ 崩れない積層ミキサー & 低域クロスオーバーEQ (140Hz)</span>
                                <div className="flex flex-col gap-2 bg-slate-950 p-3 rounded border border-slate-800">
                                    <span className="text-[11px] text-amber-400">マスター低域ブースト土台: {masterBassBoost} dB</span>
                                    <input type="range" min="0" max="24" step="1" value={masterBassBoost} onChange={e => {
                                        const val = Number(e.target.value);
                                        setMasterBassBoost(val);
                                        if (synthsRef.current && synthsRef.current.eq) synthsRef.current.eq.low.value = val;
                                    }} className="accent-amber-500" />
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 bg-slate-950 p-3 rounded border border-slate-800">
                                    {INSTRUMENTS.map(inst => (
                                        <div key={inst.id} className="flex items-center justify-between bg-slate-900 p-2 rounded border border-slate-800">
                                            <span className="text-[11px] text-slate-200">{inst.label}</span>
                                            <input type="range" min="-30" max="6" step="1" value={volumes[inst.id]} onChange={e => updateInstrumentVolume(inst.id, Number(e.target.value))} className="w-24 accent-amber-500" />
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {tab === "CRERA_ARCHIVE" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-4 flex flex-col gap-3">
                                <span className="text-xs font-bold text-pink-400">📁 録音・再生テイクアーカイブ</span>
                                <div className="bg-slate-950 p-3 rounded border border-slate-800 flex flex-col gap-2 max-h-[260px] overflow-y-auto">
                                    {creraTakes.length === 0 ? (
                                        <span className="text-[10px] text-slate-500">録音データはまだありません</span>
                                    ) : creraTakes.map(t => (
                                        <div key={t.id} className="flex justify-between items-center bg-slate-900 p-2 rounded border border-slate-800">
                                            <span className="text-cyan-400 text-xs font-bold">{t.title} (BPM:{t.bpm}) [{t.date}]</span>
                                            <div className="flex gap-1.5">
                                                <button onClick={() => playOrLoadCreraTake(t)} className="px-2.5 py-1 bg-amber-500 text-slate-950 font-bold rounded text-[10px]">復元ロード</button>
                                                <button onClick={() => setCreraTakes(creraTakes.filter(x => x.id !== t.id))} className="px-2 py-1 bg-red-950 text-red-300 rounded text-[10px]">削除</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {tab === "MEMORY" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3">
                                <span className="text-xs font-bold text-emerald-400">💾 プロジェクトセーブ・ロード</span>
                                <div className="flex gap-2 bg-slate-950 p-3 rounded border border-slate-800">
                                    <input type="text" value={slotName} onChange={e => setSlotName(e.target.value)} className="bg-slate-900 px-2 py-1 rounded text-slate-100 flex-1 border border-slate-800 font-bold text-xs" />
                                    <button onClick={exportProjectToFile} className="px-3 py-1 bg-emerald-600 text-white font-bold rounded text-xs">JSON保存</button>
                                </div>
                                <input type="file" accept=".json" onChange={importProjectFromFile} className="text-[10px] text-slate-400" />
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<MasterSynthApp />);
    </script>
</body>
</html>
