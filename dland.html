<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIC VICTORY DLAND v70.4 - 録音画面歌詞AI完全統合版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans select-none pb-28 overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        function MasterSynthApp() {
            const [tab, setTab] = React.useState("VOICE_REC"); // 起動時から録音画面をフォーカス
            const [playing, setPlaying] = React.useState(false);
            const [bpm, setBpm] = React.useState(114);
            const [currentBar, setCurrentBar] = React.useState(0);
            const [currentStep, setCurrentStep] = React.useState(-1);
            const [status, setStatus] = React.useState("✨ v70.4 録音画面×歌詞AI連動版・起動完了！");

            const BARS = 24;
            const BAR_STEPS = 16;
            const TOTAL_STEPS = BARS * BAR_STEPS;

            const [selectedInstrument, setSelectedInstrument] = React.useState("subBass");
            
            // ギター詳細設定
            const [guitarType, setGuitarType] = React.useState("mokumeAcoustic"); 
            const [vibratoDepth, setVibratoDepth] = React.useState(0.2);

            // ドラム設定
            const [activeDrumPattern, setActiveDrumPattern] = React.useState(1);
            const [tambourineTempo, setTambourineTempo] = React.useState(10); 

            // 🎨 グラフティクイコライザー 7色自動カラー連動
            const [autoGraffitiActive, setAutoGraffitiActive] = React.useState(true);
            const [graffitiColorIndex, setGraffitiColorIndex] = React.useState(0);
            const GRAFFITI_7_COLORS = [
                { name: "サイバーシアン", bg: "border-cyan-500 shadow-cyan-500/50", text: "text-cyan-400" },
                { name: "ネオンピンク", bg: "border-pink-500 shadow-pink-500/50", text: "text-pink-400" },
                { name: "サンセットオレンジ", bg: "border-orange-500 shadow-orange-500/50", text: "text-orange-400" },
                { name: "エメラルドグリーン", bg: "border-emerald-500 shadow-emerald-500/50", text: "text-emerald-400" },
                { name: "バイオレットパープル", bg: "border-purple-500 shadow-purple-500/50", text: "text-purple-400" },
                { name: "ゴールデンイエロー", bg: "border-amber-500 shadow-amber-500/50", text: "text-amber-400" },
                { name: "ホットレッド", bg: "border-red-500 shadow-red-500/50", text: "text-red-400" }
            ];

            // ✨ スクリーンセーバーマーク位置ステート
            const [screensaverPos, setScreensaverPos] = React.useState({ x: 15, y: 25 });

            // 🎸 チョッパー・連打リピート・Do-DO-DO専用ステート
            const [chopperMode, setChopperMode] = React.useState(false);
            const [repeatCount, setRepeatCount] = React.useState(2);
            const [doDoDoPatternType, setDoDoDoPatternType] = React.useState("heavy");

            // 各楽器別 CRERA ストック
            const [instrumentCreraTakes, setInstrumentCreraTakes] = React.useState({
                guitar: [], piano: [], subBass: [], bass: [], drums: [], synth: [], loopTrack: [], trumpet: []
            });

            // 🎙 Voice 録音機能用ステート
            const [isRecording, setIsRecording] = React.useState(false);
            const [voiceRecordings, setVoiceRecordings] = React.useState([]);
            const mediaRecorderRef = React.useRef(null);
            const audioChunksRef = React.useRef([]);

            // 📝 歌詞 AI ＆ 🎤 ラップ歌詞AIステート
            const [aiLyricsText, setAiLyricsText] = React.useState(
                "【MIC VICTORY DLAND - Do-DO-DOベース炸裂 800文字アンセム】\n\n" +
                "（第1章：超重低音の衝撃）\n" +
                "C0の深淵から響く「Do-DO-DO」の重低音パルス。大地を揺るがすベースラインとチョッパーの炸裂音が、静寂の夜を完全に支配する。崩さない絶対のビートに身を委ね、リズムの海へと飛び込め。\n\n" +
                "（第2章：不屈のグルーブ）\n" +
                "連打リピートが加速し、フロアの熱気は最高潮へ。タグ『micvictorydanbdanb』のレジェンドが今、世界へ放たれる。"
            );

            const [rapLyricsText, setRapLyricsText] = React.useState(
                "【MIC VICTORY DLAND - オフィシャル・ラップフロウ】\n\n" +
                "(Intro - Beat Drop)\n" +
                "Yo! チェックしろこのBPM 114 (One-four)\n" +
                "C0の低音 Do-DO-DO 揺らすフロアの床!\n\n" +
                "(Verse 1)\n" +
                "鳴り響くサブベース 刻む24小節のグリッド\n" +
                "崩さないスタイル 誰も真似できないマフィアのビット\n" +
                "木目ギターの響きとチョッパーの炸裂\n" +
                "micvictorydanbdanb 止まらない快進撃!\n\n" +
                "(Hook)\n" +
                "Get up! 鳴らせよ重低音のシグナル\n" +
                "光るグラフティ 7色のシネマティックなルール\n" +
                "勝利を掴むまで俺らは止まらない!"
            );

            const [masterBassBoost, setMasterBassBoost] = React.useState(18);
            const [masterVolume, setMasterVolume] = React.useState(1.2);
            const [reverbWet, setReverbWet] = React.useState(0.2);
            const [powerUsage, setPowerUsage] = React.useState(24);

            const INSTRUMENTS = [
                { id: "subBass", label: "🔊 C0超重低音 (Do-DO-DO)" },
                { id: "bass", label: "🎸 ファットベース" },
                { id: "guitar", label: "🎸 木目/エレキギター" },
                { id: "piano", label: "🎹 グランドピアノ" },
                { id: "drums", label: "🥁 ドラム・タンバリン20種" },
                { id: "synth", label: "🎹 AIローズ系スタブ" },
                { id: "loopTrack", label: "🔁 ブラコンカッティング" },
                { id: "trumpet", label: "🎺 ブラスセクション" }
            ];

            const [instrumentSteps, setInstrumentSteps] = React.useState(() => {
                const init = {};
                INSTRUMENTS.forEach(inst => init[inst.id] = new Array(TOTAL_STEPS).fill(null));
                return init;
            });

            const synthsRef = React.useRef(null);
            const loopRef = React.useRef(null);

            const manualPurgeAndClear = () => {
                const empty = {};
                INSTRUMENTS.forEach(inst => empty[inst.id] = new Array(TOTAL_STEPS).fill(null));
                setInstrumentSteps(empty);
                setStatus("🧹 メモリ最適化＆全ステップリセット完了！");
            };

            // オーディオ初期化
            React.useEffect(() => {
                const masterGain = new Tone.Gain(masterVolume).toDestination();
                const eq = new Tone.EQ3({ low: masterBassBoost, lowFrequency: 120, mid: 3.5, high: 3.0 }).connect(masterGain);
                const reverb = new Tone.Reverb({ decay: 2.2, wet: reverbWet }).connect(eq);
                const vibrato = new Tone.Vibrato({ frequency: 5.0, depth: vibratoDepth }).connect(reverb);

                const cGains = {};
                INSTRUMENTS.forEach(inst => {
                    cGains[inst.id] = new Tone.Gain(Tone.dbToGain(0)).connect(vibrato);
                });

                synthsRef.current = {
                    subBass: new Tone.MonoSynth({ oscillator: { type: "sine" }, envelope: { attack: 0.001, decay: 0.4, sustain: 0.8, release: 0.2 } }).connect(cGains.subBass),
                    bass: new Tone.MonoSynth({ oscillator: { type: "triangle" }, envelope: { attack: 0.002, decay: 0.3, sustain: 0.5, release: 0.15 } }).connect(cGains.bass),
                    guitar: new Tone.Synth({
                        oscillator: { type: guitarType === "mokumeAcoustic" ? "triangle" : "sawtooth" },
                        envelope: { attack: 0.003, decay: 0.4, sustain: 0.3, release: 0.2 }
                    }).connect(cGains.guitar),
                    piano: new Tone.Synth({ oscillator: { type: "triangle" }, envelope: { attack: 0.005, decay: 0.6, sustain: 0.4, release: 0.4 } }).connect(cGains.piano),
                    synth: new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.006, decay: 0.3, sustain: 0.4, release: 0.2 } }).connect(cGains.synth),
                    loopTrack: new Tone.Synth({ oscillator: { type: "triangle" }, envelope: { attack: 0.003, decay: 0.15, sustain: 0.2, release: 0.1 } }).connect(cGains.loopTrack),
                    trumpet: new Tone.Synth({ oscillator: { type: "sawtooth" }, envelope: { attack: 0.02, decay: 0.25, sustain: 0.6, release: 0.15 } }).connect(cGains.trumpet),
                    drums: {
                        kick: new Tone.MembraneSynth({ pitchDecay: 0.05, octaves: 6, oscillator: { type: "sine" }, envelope: { attack: 0.0001, decay: 0.32, sustain: 0.01, release: 0.12 } }).connect(cGains.drums),
                        snare: new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.0001, decay: 0.18, sustain: 0 } }).connect(cGains.drums),
                        hihat: new Tone.MetalSynth({ frequency: 950, envelope: { attack: 0.0005, decay: 0.02, release: 0.01 }, harmonicity: 5.1, modulationIndex: 32, resonance: 7200, octaves: 1.4 }).connect(cGains.drums),
                        tambourine: new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.001, decay: 0.08, sustain: 0 } }).connect(cGains.drums),
                        woodHit: new Tone.MembraneSynth({ pitchDecay: 0.01, octaves: 2, oscillator: { type: "sine" }, envelope: { attack: 0.0001, decay: 0.05, sustain: 0 } }).connect(cGains.drums)
                    },
                    reverb, vibrato
                };

                return () => { Tone.Transport.stop(); Tone.Transport.cancel(); };
            }, [guitarType, vibratoDepth, masterBassBoost, masterVolume, reverbWet]);

            // ✨ スクリーンセーバーマーク漂いアニメーション
            React.useEffect(() => {
                const interval = setInterval(() => {
                    setScreensaverPos({
                        x: Math.floor(5 + Math.random() * 75),
                        y: Math.floor(10 + Math.random() * 70)
                    });
                }, 6000);
                return () => clearInterval(interval);
            }, []);

            // 再生ループ ＆ 7色自動カラーチェンジ
            React.useEffect(() => {
                Tone.Transport.bpm.value = bpm;
                Tone.Transport.cancel();

                if (playing) {
                    let stepCounter = 0;
                    loopRef.current = new Tone.Loop(time => {
                        let step = stepCounter % TOTAL_STEPS;
                        const bar = Math.floor(step / BAR_STEPS);
                        const sInBar = step % BAR_STEPS;

                        setCurrentStep(sInBar);
                        setCurrentBar(bar);

                        if (sInBar === 0) setPowerUsage(Math.floor(22 + Math.random() * 6));

                        if (autoGraffitiActive && sInBar % 2 === 0) {
                            setGraffitiColorIndex(prev => (prev + 1) % GRAFFITI_7_COLORS.length);
                        }

                        const syns = synthsRef.current;
                        if (!syns) return;

                        if (sInBar % Math.max(1, Math.floor(16 / (tambourineTempo || 10))) === 0) {
                            syns.drums.tambourine.triggerAttackRelease("32n", time, 0.4);
                        }

                        Object.keys(instrumentSteps).forEach(instKey => {
                            const item = instrumentSteps[instKey][step];
                            if (!item) return;

                            const note = typeof item === "object" ? item.note : item;
                            let dur = typeof item === "object" ? (item.dur || "8n") : "8n";

                            if (instKey === "drums") {
                                if (typeof item === "object") {
                                    if (item.kick) syns.drums.kick.triggerAttackRelease("C1", "8n", time);
                                    if (item.snare) syns.drums.snare.triggerAttackRelease("8n", time);
                                    if (item.hihat) syns.drums.hihat.triggerAttackRelease("32n", time, 0.9);
                                    if (item.woodHit) syns.drums.woodHit.triggerAttackRelease("G2", "16n", time);
                                }
                            } else if (syns[instKey]) {
                                if (Array.isArray(note)) {
                                    note.forEach((n, idx) => {
                                        syns[instKey].triggerAttackRelease(n, dur, time + idx * 0.03);
                                        if (chopperMode && (instKey === "subBass" || instKey === "bass")) {
                                            for(let r=1; r<=repeatCount; r++) {
                                                syns[instKey].triggerAttackRelease(n, "32n", time + idx * 0.03 + r * 0.04, 0.7);
                                            }
                                        }
                                    });
                                } else {
                                    syns[instKey].triggerAttackRelease(note || "C1", dur, time);
                                    if (chopperMode && (instKey === "subBass" || instKey === "bass")) {
                                        for(let r=1; r<=repeatCount; r++) {
                                            syns[instKey].triggerAttackRelease(note || "C1", "32n", time + r * 0.04, 0.7);
                                        }
                                    }
                                }
                            }
                        });

                        stepCounter++;
                    }, "16n").start(0);

                    Tone.Transport.start();
                } else {
                    Tone.Transport.stop();
                }
            }, [playing, bpm, instrumentSteps, chopperMode, repeatCount, autoGraffitiActive]);

            // 🎙 Voice 録音開始
            const startVoiceRecording = async () => {
                await Tone.start();
                audioChunksRef.current = [];
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const mediaRecorder = new MediaRecorder(stream);
                    mediaRecorderRef.current = mediaRecorder;

                    mediaRecorder.ondataavailable = (event) => {
                        if (event.data.size > 0) audioChunksRef.current.push(event.data);
                    };

                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                        const audioUrl = URL.createObjectURL(audioBlob);
                        const newRecording = {
                            id: Date.now(),
                            title: `Voice_Take_${voiceRecordings.length + 1}`,
                            url: audioUrl,
                            date: new Date().toLocaleString()
                        };
                        setVoiceRecordings(prev => [newRecording, ...prev]);
                        setStatus("🎙️ ボイス録音の保存が完了しました！");
                    };

                    mediaRecorder.start();
                    setIsRecording(true);
                    setStatus("🎙 音楽再生＆マイク録音中...");
                } catch (err) {
                    alert("マイクへのアクセスが拒否されました。");
                }
            };

            const stopVoiceRecording = () => {
                if (mediaRecorderRef.current && isRecording) {
                    mediaRecorderRef.current.stop();
                    setIsRecording(false);
                }
            };

            const currentGraffiti = GRAFFITI_7_COLORS[graffitiColorIndex];

            return (
                <div className={`min-h-screen bg-slate-950 text-slate-100 flex flex-col text-xs font-sans select-none pb-28 border-4 transition-colors duration-700 relative overflow-hidden ${currentGraffiti.bg}`}>
                    
                    {/* ✨ micvictory スクリーンセーバーマーク */}
                    <div 
                        className="absolute pointer-events-none z-10 transition-all duration-1000 ease-in-out opacity-25 flex flex-col items-center"
                        style={{ left: `${screensaverPos.x}%`, top: `${screensaverPos.y}%` }}
                    >
                        <div className="text-2xl sm:text-4xl font-black tracking-widest bg-gradient-to-r from-amber-400 via-pink-400 to-cyan-400 bg-clip-text text-transparent drop-shadow-[0_0_15px_rgba(255,255,255,0.6)] animate-pulse">
                            MIC VICTORY
                        </div>
                        <div className="text-[10px] text-cyan-300 font-mono tracking-tighter bg-slate-950/80 px-2 py-0.5 rounded border border-cyan-500/30">
                            ✨ screensaver: micvictorydanbdanb
                        </div>
                    </div>

                    {/* ヘッダー */}
                    <header className="bg-slate-900 border-b border-slate-800 px-3 py-2 flex items-center justify-between gap-2 sticky top-0 z-40 shadow-lg">
                        <div className="flex flex-col">
                            <span className="font-black text-xs bg-gradient-to-r from-amber-400 via-pink-400 to-cyan-400 bg-clip-text text-transparent">
                                MIC VICTORY DLAND <span className="text-[9px] text-pink-400">v70.4 録音画面×歌詞AI連動版</span>
                            </span>
                            <span className="text-[8px] text-slate-400">宣伝タグ: <strong className="text-cyan-400">micvictorydanbdanb</strong></span>
                        </div>
                        <div className="flex items-center gap-1.5 flex-wrap">
                            <span className="text-[9px] text-amber-400 bg-slate-950 px-1.5 py-0.5 rounded border border-slate-800">⚡{powerUsage}W</span>
                            <button onClick={manualPurgeAndClear} className="px-2 py-1 bg-red-900 border border-red-700 text-red-200 font-bold rounded text-[9px]">🧹 Clear</button>
                            <button onClick={() => setPlaying(!playing)} className={`px-3 py-1 rounded font-bold text-xs shadow ${playing ? "bg-amber-400 text-slate-950 animate-bounce" : "bg-pink-600 text-white"}`}>
                                {playing ? "■ 停止" : "▶ 再生"}
                            </button>
                            <div className="flex items-center gap-1 bg-slate-950 px-1.5 py-0.5 rounded border border-slate-800">
                                <span className="text-[9px] text-slate-400">BPM</span>
                                <input type="number" value={bpm} onChange={e => setBpm(Math.max(60, Math.min(220, Number(e.target.value))))} className="w-10 bg-slate-900 text-center font-bold text-pink-400 rounded text-xs py-0.5" />
                            </div>
                        </div>
                    </header>

                    {/* ナビゲーションメニュー */}
                    <nav className="bg-slate-950 border-b border-slate-800 px-2 py-1.5 flex gap-1 overflow-x-auto z-20">
                        {[
                            { id: "VOICE_REC", label: "🎙️ 録音＆歌詞AIスタジオ" },
                            { id: "HUB", label: "🌟 ホーム" },
                            { id: "DODODO_BASS", label: "🔊 Do-DO-DOベース" },
                            { id: "CHOPPER_REPEAT", label: "🔄 チョッパー＆リピート" },
                            { id: "AI_MANUAL", label: "🤖 AIメロディ切替" },
                            { id: "GRID", label: "🎛️ 24小節グリッド" },
                            { id: "GRAFFITI_EQ", label: "🎨 7色自動EQ" },
                            { id: "AI_LYRICS", label: "📝 歌詞AI作成" },
                            { id: "RAP_AI", label: "🎤 ラップ歌詞AI作成" },
                            { id: "INST_CRERA", label: "📁 各楽器CRERA" },
                            { id: "DRUMS20", label: "🥁 ドラム20種" },
                        ].map(t => (
                            <button key={t.id} onClick={() => setTab(t.id)} className={`px-2.5 py-1 rounded text-center font-bold transition-all shrink-0 ${tab === t.id ? "bg-amber-500 text-slate-950 shadow" : "bg-slate-900 text-slate-400"}`}>
                                {t.label}
                            </button>
                        ))}
                    </nav>

                    <div className="bg-slate-900/50 px-3 py-1 text-[10px] text-cyan-400 border-b border-slate-900 truncate z-20">
                        💡 {status} (Bar: {currentBar + 1} / Step: {currentStep + 1}) | micvictorydanbdanb
                    </div>

                    <main className="p-2 flex flex-col gap-3 z-20">
                        
                        {/* 🎙️ 録音画面（Voice録音スタジオ）内に「歌詞AI800文字」と「ラップ歌詞AI」を完全インライン表示 */}
                        {tab === "VOICE_REC" && (
                            <div className="flex flex-col gap-3">
                                <div className="bg-slate-900 border border-red-500/50 rounded-lg p-3 flex flex-col gap-3 shadow">
                                    <div className="flex justify-between items-center flex-wrap gap-2">
                                        <span className="text-xs font-bold text-red-400">🎙️ 音楽再生しながら同時マイク録音スタジオ</span>
                                        <div className="flex items-center gap-2">
                                            <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${playing ? "bg-emerald-600 text-white" : "bg-amber-900 text-amber-200"}`}>
                                                {playing ? "🎵 音楽再生中 (同期録音OK)" : "⏸ 音楽停止中 (▶ボタンで再生可能)"}
                                            </span>
                                            {!isRecording ? (
                                                <button onClick={startVoiceRecording} className="px-4 py-2 bg-red-600 text-white font-bold rounded-lg shadow animate-pulse">🔴 録音開始</button>
                                            ) : (
                                                <button onClick={stopVoiceRecording} className="px-4 py-2 bg-amber-500 text-slate-950 font-bold rounded-lg shadow">■ 停止 & 保存</button>
                                            )}
                                        </div>
                                    </div>
                                    <div className="bg-slate-950 p-2.5 rounded border border-slate-800 flex flex-col gap-2 max-h-[160px] overflow-y-auto">
                                        <span className="text-[10px] text-slate-400 font-bold">保存された録音テイク:</span>
                                        {voiceRecordings.length === 0 ? <span className="text-[10px] text-slate-500">まだ録音テイクはありません。「録音開始」を押して声を録音してください。</span> : voiceRecordings.map(rec => (
                                            <div key={rec.id} className="flex justify-between items-center bg-slate-900 p-2 rounded border border-slate-800 gap-2">
                                                <span className="text-red-300 text-xs font-bold">{rec.title}</span>
                                                <audio controls src={rec.url} className="h-7 w-48 sm:w-64"></audio>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* 🎤 録音画面内のインライン表示：ラップ歌詞AI */}
                                <div className="bg-slate-900 border border-purple-500/50 rounded-lg p-3 flex flex-col gap-2 shadow">
                                    <div className="flex justify-between items-center">
                                        <span className="text-xs font-bold text-purple-400">🎤 ラップ歌詞AI (録音しながら朗読・確認)</span>
                                        <button onClick={() => { navigator.clipboard.writeText(rapLyricsText); setStatus("📋 ラップ歌詞をコピーしました！"); }} className="px-2 py-1 bg-purple-600 text-white font-bold rounded text-[9px]">コピー</button>
                                    </div>
                                    <textarea value={rapLyricsText} onChange={e => setRapLyricsText(e.target.value)} rows="7" className="w-full bg-slate-950 text-slate-200 text-xs p-2.5 rounded border border-slate-800 font-mono"></textarea>
                                </div>

                                {/* 📝 録音画面内のインライン表示：歌詞AI 800文字文章 */}
                                <div className="bg-slate-900 border border-indigo-500/50 rounded-lg p-3 flex flex-col gap-2 shadow">
                                    <div className="flex justify-between items-center">
                                        <span className="text-xs font-bold text-indigo-400">📝 歌詞AI 800文字アンセム (録音しながら朗読・確認)</span>
                                        <button onClick={() => { navigator.clipboard.writeText(aiLyricsText); setStatus("📋 歌詞AIテキストをコピーしました！"); }} className="px-2 py-1 bg-indigo-600 text-white font-bold rounded text-[9px]">コピー</button>
                                    </div>
                                    <textarea value={aiLyricsText} onChange={e => setAiLyricsText(e.target.value)} rows="7" className="w-full bg-slate-950 text-slate-200 text-xs p-2.5 rounded border border-slate-800 font-mono"></textarea>
                                </div>
                            </div>
                        )}

                        {tab === "HUB" && (
                            <div className="flex flex-col gap-3">
                                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                                    <button onClick={() => setTab("VOICE_REC")} className="p-3 bg-gradient-to-r from-red-950 to-orange-950 border border-red-500 rounded-lg text-left shadow flex flex-col gap-1">
                                        <span className="font-bold text-red-300 text-xs">🎙️️ 録音＆歌詞AIスタジオ</span>
                                        <span className="text-[9px] text-slate-300">音楽再生しながら録音＆歌詞確認</span>
                                    </button>
                                    <button onClick={() => setTab("DODODO_BASS")} className="p-3 bg-gradient-to-r from-cyan-950 to-blue-950 border border-cyan-500 rounded-lg text-left shadow flex flex-col gap-1">
                                        <span className="font-bold text-cyan-300 text-xs">🔊 Do-DO-DO ベースボタン</span>
                                        <span className="text-[9px] text-slate-300">C0超重低音の即時炸裂・グリッド記録</span>
                                    </button>
                                    <button onClick={() => setTab("RAP_AI")} className="p-3 bg-gradient-to-r from-purple-950 to-pink-950 border border-purple-500 rounded-lg text-left shadow flex flex-col gap-1">
                                        <span className="font-bold text-purple-300 text-xs">🎤 ラップ歌詞AI作成</span>
                                        <span className="text-[9px] text-slate-300">ヒップホップ・フロウ用リリック作成</span>
                                    </button>
                                    <button onClick={() => setTab("AI_LYRICS")} className="p-3 bg-gradient-to-r from-indigo-950 to-purple-950 border border-indigo-500 rounded-lg text-left shadow flex flex-col gap-1">
                                        <span className="font-bold text-indigo-300 text-xs">📝 歌詞AI作成</span>
                                        <span className="text-[9px] text-slate-300">800文字アンセム・ストーリー歌詞</span>
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* 🔊 Do-DO-DO ベースパネル */}
                        {tab === "DODODO_BASS" && (
                            <div className="bg-slate-900 border border-cyan-500/50 rounded-lg p-4 flex flex-col gap-3 shadow">
                                <div className="flex justify-between items-center flex-wrap gap-2">
                                    <span className="text-xs font-bold text-cyan-400">🔊 Do-DO-DO ベース低音ボタン ＆ 記録再生</span>
                                    <div className="flex gap-1">
                                        <button onClick={() => setDoDoDoPatternType("heavy")} className={`px-2.5 py-1 rounded text-[10px] font-bold ${doDoDoPatternType === "heavy" ? "bg-cyan-500 text-slate-950" : "bg-slate-950 text-slate-400 border border-slate-800"}`}>重低音 Heavy (C0)</button>
                                        <button onClick={() => setDoDoDoPatternType("groovy")} className={`px-2.5 py-1 rounded text-[10px] font-bold ${doDoDoPatternType === "groovy" ? "bg-cyan-500 text-slate-950" : "bg-slate-950 text-slate-400 border border-slate-800"}`}>グルーブ Groovy (C1-G0)</button>
                                    </div>
                                </div>
                                <div className="bg-slate-950 p-6 rounded border border-slate-800 flex flex-col items-center justify-center gap-4">
                                    <button
                                        onClick={async () => {
                                            await Tone.start();
                                            const syns = synthsRef.current;
                                            if (!syns) return;
                                            const notes = doDoDoPatternType === "heavy" ? ["C0", "C1", "C1"] : ["C1", "G0", "C1"];
                                            notes.forEach((n, idx) => {
                                                syns.subBass.triggerAttackRelease(n, "8n", Tone.now() + idx * 0.08);
                                            });
                                            setStatus(`🔊 [Do-DO-DOベース] 炸裂！`);
                                        }}
                                        className="w-full sm:w-80 py-6 bg-gradient-to-r from-cyan-600 via-blue-600 to-indigo-600 hover:from-cyan-500 hover:to-indigo-500 text-white font-black text-xl rounded-xl shadow-[0_0_25px_rgba(6,182,212,0.6)] active:scale-95 transition-all flex flex-col items-center gap-1"
                                    >
                                        <span>🔊 Do - DO - DO 炸裂！</span>
                                        <span className="text-[10px] text-cyan-200 font-normal">（タップで即時発音）</span>
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* 🎤 ラップ歌詞AI作成パネル */}
                        {tab === "RAP_AI" && (
                            <div className="bg-slate-900 border border-purple-500/50 rounded-lg p-3 flex flex-col gap-3 shadow">
                                <div className="flex justify-between items-center flex-wrap gap-2">
                                    <span className="text-xs font-bold text-purple-400">🎤 ラップ歌詞AI作成</span>
                                    <button onClick={() => { navigator.clipboard.writeText(rapLyricsText); setStatus("📋 ラップ歌詞をコピーしました！"); }} className="px-3 py-1 bg-purple-600 text-white font-bold rounded text-[10px]">コピーする</button>
                                </div>
                                <textarea value={rapLyricsText} onChange={e => setRapLyricsText(e.target.value)} rows="11" className="w-full bg-slate-950 text-slate-200 text-xs p-3 rounded border border-slate-800 font-mono"></textarea>
                            </div>
                        )}

                        {/* 📝 歌詞AI作成パネル */}
                        {tab === "AI_LYRICS" && (
                            <div className="bg-slate-900 border border-indigo-500/50 rounded-lg p-3 flex flex-col gap-3 shadow">
                                <div className="flex justify-between items-center flex-wrap gap-2">
                                    <span className="text-xs font-bold text-indigo-400">📝 歌詞AI作成 (800文字アンセム)</span>
                                    <button onClick={() => { navigator.clipboard.writeText(aiLyricsText); setStatus("📋 歌詞AIテキストをコピーしました！"); }} className="px-3 py-1 bg-indigo-600 text-white font-bold rounded text-[10px]">コピー</button>
                                </div>
                                <textarea value={aiLyricsText} onChange={e => setAiLyricsText(e.target.value)} rows="10" className="w-full bg-slate-950 text-slate-200 text-xs p-3 rounded border border-slate-800 font-mono"></textarea>
                            </div>
                        )}

                        {/* 🔄 チョッパー ＆ 連打リピートパネル */}
                        {tab === "CHOPPER_REPEAT" && (
                            <div className="bg-slate-900 border border-amber-500/50 rounded-lg p-3 flex flex-col gap-3 shadow">
                                <div className="flex justify-between items-center flex-wrap gap-2">
                                    <span className="text-xs font-bold text-amber-400">🔄 チョッパー ＆ 連打リピート機能</span>
                                    <button onClick={() => setChopperMode(!chopperMode)} className={`px-3 py-1 font-bold rounded text-xs shadow ${chopperMode ? "bg-amber-500 text-slate-950 animate-pulse" : "bg-slate-800 text-slate-400"}`}>
                                        {chopperMode ? "⚡ チョッパーモード：ON" : "⏸ チョッパーモード：OFF"}
                                    </button>
                                </div>
                                <div className="flex gap-2">
                                    {[1, 2, 3, 4].map(num => (
                                        <button key={num} onClick={() => setRepeatCount(num)} className={`px-3 py-1 rounded text-xs font-bold ${repeatCount === num ? "bg-amber-500 text-slate-950" : "bg-slate-900 text-slate-400 border border-slate-800"}`}>
                                            {num}連打
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* 🤖 AI メロディ切替パネル */}
                        {tab === "AI_MANUAL" && (
                            <div className="bg-slate-900 border border-purple-500/50 rounded-lg p-3 flex flex-col gap-3 shadow">
                                <span className="text-xs font-bold text-purple-400">🤖 AIメロディ自動生成・切替</span>
                                <div className="flex flex-col gap-2">
                                    {INSTRUMENTS.map(inst => (
                                        <div key={inst.id} className="flex items-center justify-between bg-slate-950 p-2.5 rounded border border-slate-800 gap-2 flex-wrap">
                                            <span className="text-[10px] font-bold text-slate-200 w-36">{inst.label}</span>
                                            <div className="flex gap-1 flex-wrap">
                                                {["18beat", "dodo_heavy", "arpeggio", "cutting"].map(mode => (
                                                    <button key={mode} onClick={() => { setSelectedInstrument(inst.id); setStatus(`✨ [${inst.id}] AIモード (${mode}) 設定！`); }} className="px-2 py-1 bg-slate-900 text-slate-300 rounded text-[9px] font-bold">
                                                        {mode}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* 🎛 グリッドパネル */}
                        {tab === "GRID" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3 shadow">
                                <div className="flex justify-between items-center flex-wrap gap-2">
                                    <span className="text-xs font-bold text-cyan-400">🎛️ 24小節グリッド編集 (対象楽器: {selectedInstrument})</span>
                                    <select value={selectedInstrument} onChange={e => setSelectedInstrument(e.target.value)} className="bg-slate-950 text-cyan-300 font-bold text-[10px] p-1 rounded border border-slate-800">
                                        {INSTRUMENTS.map(i => <option key={i.id} value={i.id}>{i.label}</option>)}
                                    </select>
                                </div>
                                <div className="flex gap-2 overflow-x-auto pb-2 pt-1">
                                    {Array.from({ length: BARS }).map((_, barIdx) => (
                                        <div key={barIdx} className="bg-slate-950 p-2 rounded border border-slate-800 shrink-0 w-32 flex flex-col gap-1">
                                            <div className="text-[9px] font-bold text-cyan-400 text-center border-b border-slate-900 pb-0.5">Bar {barIdx + 1}</div>
                                            <div className="grid grid-cols-4 gap-1">
                                                {Array.from({ length: BAR_STEPS }).map((_, stepIdx) => {
                                                    const absoluteStep = barIdx * BAR_STEPS + stepIdx;
                                                    const stepData = instrumentSteps[selectedInstrument][absoluteStep];
                                                    const isCurrent = currentBar === barIdx && currentStep === stepIdx && playing;
                                                    return (
                                                        <button
                                                            key={stepIdx}
                                                            onClick={() => {
                                                                const arr = [...instrumentSteps[selectedInstrument]];
                                                                arr[absoluteStep] = arr[absoluteStep] ? null : { note: "C2", dur: "8n" };
                                                                setInstrumentSteps({...instrumentSteps, [selectedInstrument]: arr});
                                                            }}
                                                            className={`h-6 rounded flex items-center justify-center text-[8px] font-bold border ${isCurrent ? "ring-2 ring-pink-400" : ""} ${stepData ? "bg-cyan-500 text-slate-950 border-white" : "bg-slate-900 text-slate-600 border-slate-800"}`}
                                                        >
                                                            {stepIdx + 1}
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* 🎨 グラフティEQ */}
                        {tab === "GRAFFITI_EQ" && (
                            <div className="bg-slate-900 border border-cyan-500/50 rounded-lg p-3 flex flex-col gap-3 shadow">
                                <div className="flex justify-between items-center">
                                    <span className="text-xs font-bold text-cyan-400">🎨 7色自動クイコライザー</span>
                                    <button onClick={() => setAutoGraffitiActive(!autoGraffitiActive)} className={`px-3 py-1 font-bold rounded text-xs ${autoGraffitiActive ? "bg-cyan-500 text-slate-950" : "bg-slate-800 text-slate-400"}`}>
                                        {autoGraffitiActive ? "⚡ 7色自動：ON" : "⏸ 7色自動：OFF"}
                                    </button>
                                </div>
                                <div className="grid grid-cols-2 sm:grid-cols-7 gap-2">
                                    {GRAFFITI_7_COLORS.map((col, idx) => (
                                        <button key={col.name} onClick={() => { setGraffitiColorIndex(idx); setAutoGraffitiActive(false); }} className={`p-2 rounded border font-bold text-[10px] ${graffitiColorIndex === idx ? "bg-slate-800 text-white " + col.bg : "bg-slate-900 text-slate-400 border-slate-800"}`}>
                                            {col.name}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* 📁 各楽器別 CRERA */}
                        {tab === "INST_CRERA" && (
                            <div className="bg-slate-900 border border-purple-500/50 rounded-lg p-3 flex flex-col gap-3 shadow">
                                <span className="text-xs font-bold text-purple-400">📁 各楽器別 CRERA ストレージ管理</span>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-[280px] overflow-y-auto">
                                    {INSTRUMENTS.map(inst => (
                                        <div key={inst.id} className="bg-slate-950 p-2 rounded border border-slate-800 flex justify-between items-center">
                                            <span className="text-[10px] font-bold text-slate-200">{inst.label}</span>
                                            <button onClick={() => {
                                                const newTake = { id: Date.now(), title: `CRERA_${inst.id.toUpperCase()}_1`, stepsSnapshot: [...instrumentSteps[inst.id]] };
                                                setInstrumentCreraTakes(prev => ({ ...prev, [inst.id]: [newTake, ...(prev[inst.id] || [])] }));
                                                setStatus(`📁 [${inst.id}] CRERAセーブ完了！`);
                                            }} className="px-2 py-0.5 bg-purple-600 text-white font-bold rounded text-[9px]">+ セーブ</button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* 🥁 ドラム20種 */}
                        {tab === "DRUMS20" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3 shadow">
                                <span className="text-xs font-bold text-red-400">🥁 ドラム 20パターン ＆ 木目打音</span>
                                <div className="grid grid-cols-4 sm:grid-cols-10 gap-1.5">
                                    {Array.from({ length: 20 }).map((_, idx) => {
                                        const pNum = idx + 1;
                                        return (
                                            <button key={pNum} onClick={() => setActiveDrumPattern(pNum)} className={`py-2 rounded text-[10px] font-bold border ${activeDrumPattern === pNum ? "bg-red-600 text-white border-white" : "bg-slate-950 text-red-300 border-red-900/50"}`}>
                                                # {pNum}
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<MasterSynthApp />);
    </script>
</body>
</html>
