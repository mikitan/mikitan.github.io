<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIC VICTORY DLAND v60.0 完全究極版 - 20種ドラム & 進化CRERA録音</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans select-none pb-28 overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        function MasterSynthApp() {
            const [tab, setTab] = React.useState("HUB");
            const [playing, setPlaying] = React.useState(false);
            const [isRecording, setIsRecording] = React.useState(false);
            const [flashColorIndex, setFlashColorIndex] = React.useState(0);
            const [bpm, setBpm] = React.useState(114);
            const [currentBar, setCurrentBar] = React.useState(0);
            const [currentStep, setCurrentStep] = React.useState(-1);
            const [status, setStatus] = React.useState("✨ v60.0 MIC VICTORY DLAND リリース完了！全機能稼働中");

            const BARS = 24;
            const BAR_STEPS = 16;
            const TOTAL_STEPS = BARS * BAR_STEPS;

            const [selectedInstrument, setSelectedInstrument] = React.useState("drums");
            const [selectedNote, setSelectedNote] = React.useState("C4");
            const [selectedDuration, setSelectedDuration] = React.useState("8n");
            const [selectedDrumPart, setSelectedDrumPart] = React.useState("kick");

            const [creraTakes, setCreraTakes] = React.useState([]);
            const [activePatternIndex, setActivePatternIndex] = React.useState(1);
            const [masterBassBoost, setMasterBassBoost] = React.useState(14);
            const [masterVolume, setMasterVolume] = React.useState(1.2);
            const [slotName, setSlotName] = React.useState("DLAND_v60_ULTIMATE");
            const [powerUsage, setPowerUsage] = React.useState(18); // 消費電力シミュレータ (W)

            const FLASH_COLORS = [
                "border-cyan-500 shadow-cyan-500/50",
                "border-pink-500 shadow-pink-500/50",
                "border-amber-500 shadow-amber-500/50",
                "border-purple-500 shadow-purple-500/50",
                "border-emerald-500 shadow-emerald-500/50",
                "border-red-500 shadow-red-500/50",
                "border-blue-500 shadow-blue-500/50",
                "border-yellow-500 shadow-yellow-500/50"
            ];

            const INSTRUMENTS = [
                { id: "drums", label: "🥁 つけ足しドラム20種", color: "from-red-600 to-amber-600" },
                { id: "subBass", label: "🔊 C0超重低音土台", color: "from-amber-600 to-orange-700" },
                { id: "bass", label: "🎸 ファットスラップ", color: "from-emerald-600 to-teal-600" },
                { id: "synth", label: "🎹 AIローズ系スタブ", color: "from-cyan-600 to-blue-700" },
                { id: "loopTrack", label: "🔁 ブラコンカッティング", color: "from-pink-600 to-rose-600" },
                { id: "trumpet", label: "🎺 ブラスセクション", color: "from-yellow-500 to-amber-600" },
                { id: "guitar", label: "🎸 ファンクギター", color: "from-orange-600 to-red-700" },
                { id: "piano", label: "🎹 マドンナ系エレピ", color: "from-blue-600 to-indigo-600" },
            ];

            const [instrumentSteps, setInstrumentSteps] = React.useState(() => {
                const init = {};
                INSTRUMENTS.forEach(inst => init[inst.id] = new Array(TOTAL_STEPS).fill(null));
                return init;
            });

            const [volumes, setVolumes] = React.useState({
                drums: 4, subBass: 6, bass: 3, synth: 0, loopTrack: -2, trumpet: -1, guitar: -2, piano: 0
            });

            const synthsRef = React.useRef(null);
            const loopRef = React.useRef(null);
            const masterGainRef = React.useRef(null);

            const NOTES = ["C4", "Eb4", "F4", "G4", "Bb4", "C5"];
            const SOLFEGE = { "C4": "ド", "Eb4": "ミ♭", "F4": "ファ", "G4": "ソ", "Bb4": "シ♭", "C5": "高ド" };

            const purgeAndClearCacheBuffer = () => {
                try {
                    if (Tone.context && Tone.context.state === 'suspended') Tone.context.resume();
                    const empty = {};
                    INSTRUMENTS.forEach(inst => empty[inst.id] = new Array(TOTAL_STEPS).fill(null));
                    setInstrumentSteps(empty);
                    setStatus("🧹 キャッシュ完全クリア完了！");
                } catch(e) {
                    setStatus("⚠️ リセットエラー");
                }
            };

            React.useEffect(() => {
                const masterGain = new Tone.Gain(masterVolume).toDestination();
                masterGainRef.current = masterGain;

                const eq = new Tone.EQ3({ low: masterBassBoost, lowFrequency: 130, mid: 2.5, high: 2.0 }).connect(masterGain);
                const reverb = new Tone.Reverb({ decay: 1.4, wet: 0.12 }).connect(eq);
                const delay = new Tone.FeedbackDelay({ delayTime: "8n", feedback: 0.12, wet: 0.06 }).connect(reverb);

                const cGains = {};
                INSTRUMENTS.forEach(inst => {
                    cGains[inst.id] = new Tone.Gain(Tone.dbToGain(volumes[inst.id] || 0)).connect(delay);
                });

                synthsRef.current = {
                    subBass: new Tone.MonoSynth({
                        oscillator: { type: "sine" },
                        envelope: { attack: 0.002, decay: 0.45, sustain: 0.6, release: 0.2 },
                        filterEnvelope: { attack: 0.002, decay: 0.25, sustain: 0.4, release: 0.2, baseFrequency: 55, octaves: 1.5 }
                    }).connect(cGains.subBass),
                    bass: new Tone.MonoSynth({
                        oscillator: { type: "triangle" },
                        envelope: { attack: 0.005, decay: 0.35, sustain: 0.5, release: 0.15 }
                    }).connect(cGains.bass),
                    synth: new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.008, decay: 0.3, sustain: 0.4, release: 0.2 } }).connect(cGains.synth),
                    loopTrack: new Tone.Synth({ oscillator: { type: "triangle" }, envelope: { attack: 0.004, decay: 0.16, sustain: 0.2, release: 0.1 } }).connect(cGains.loopTrack),
                    guitar: new Tone.Synth({ oscillator: { type: "sawtooth" }, envelope: { attack: 0.004, decay: 0.18, sustain: 0.2, release: 0.1 } }).connect(cGains.guitar),
                    trumpet: new Tone.Synth({ oscillator: { type: "sawtooth" }, envelope: { attack: 0.03, decay: 0.22, sustain: 0.6, release: 0.15 } }).connect(cGains.trumpet),
                    piano: new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.008, decay: 0.35, sustain: 0.3, release: 0.3 } }).connect(cGains.piano),
                    drums: {
                        kick: new Tone.MembraneSynth({ pitchDecay: 0.05, octaves: 6, oscillator: { type: "sine" }, envelope: { attack: 0.0001, decay: 0.32, sustain: 0.01, release: 0.12 } }).connect(cGains.drums),
                        snare: new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.0001, decay: 0.18, sustain: 0 } }).connect(cGains.drums),
                        hihat: new Tone.MetalSynth({ frequency: 950, envelope: { attack: 0.0005, decay: 0.02, release: 0.01 }, harmonicity: 5.1, modulationIndex: 32, resonance: 7200, octaves: 1.4 }).connect(cGains.drums),
                        clap: new Tone.NoiseSynth({ noise: { type: "pink" }, envelope: { attack: 0.004, decay: 0.14, sustain: 0 } }).connect(cGains.drums),
                    },
                    eq, reverb
                };

                return () => { Tone.Transport.stop(); Tone.Transport.cancel(); };
            }, []);

            React.useEffect(() => {
                Tone.Transport.bpm.value = bpm;
                Tone.Transport.cancel();

                if (playing) {
                    let stepCounter = 0;
                    loopRef.current = new Tone.Loop(time => {
                        let step = stepCounter % TOTAL_STEPS;
                        const bar = Math.floor(step / BAR_STEPS);
                        const sInBar = step % BAR_STEPS;

                        setCurrentStep(sInBar);
                        setCurrentBar(bar);

                        if (sInBar === 0) {
                            setFlashColorIndex(prev => (prev + 1) % FLASH_COLORS.length);
                            setPowerUsage(Math.floor(16 + Math.random() * 8)); // 消費電力ゆらぎ
                        }

                        const syns = synthsRef.current;
                        if (!syns) return;

                        Object.keys(instrumentSteps).forEach(instKey => {
                            const item = instrumentSteps[instKey][step];
                            if (!item) return;

                            const note = typeof item === "object" ? item.note : item;
                            const dur = typeof item === "object" ? (item.dur || "8n") : "8n";

                            if (instKey === "drums") {
                                if (typeof item === "object") {
                                    if (item.kick) syns.drums.kick.triggerAttackRelease("C1", "8n", time);
                                    if (item.snare) syns.drums.snare.triggerAttackRelease("8n", time);
                                    if (item.hihat) syns.drums.hihat.triggerAttackRelease("32n", time, 0.92);
                                    if (item.clap) syns.drums.clap.triggerAttackRelease("8n", time);
                                }
                            } else if (instKey === "subBass") {
                                syns.subBass.triggerAttackRelease("C0", dur, time);
                            } else if (syns[instKey]) {
                                syns[instKey].triggerAttackRelease(note || "C4", dur, time);
                            }
                        });

                        stepCounter++;
                    }, "16n").start(0);

                    Tone.Transport.start();
                } else {
                    Tone.Transport.stop();
                }
            }, [playing, bpm, instrumentSteps]);

            // つけ足しドラム 20パターン生成
            const generateDrumPattern20 = (pNum) => {
                const newArr = new Array(TOTAL_STEPS).fill(null);
                for (let i = 0; i < TOTAL_STEPS; i++) {
                    const s = i % 16;
                    let isKick = false, isSnare = false, isHihat = false, isClap = false;
                    if (pNum === 1) {
                        isKick = (s === 0 || s === 4 || s === 8 || s === 12);
                        isSnare = (s === 4 || s === 12);
                        isHihat = (i % 2 === 0);
                    } else if (pNum === 2) {
                        isKick = (s === 0 || s === 3 || s === 8 || s === 11);
                        isSnare = (s === 4 || s === 12);
                        isHihat = (i % 2 === 0);
                    } else {
                        isKick = (i % (4 + (pNum % 3)) === 0 || (pNum % 2 === 0 && s === 10));
                        isSnare = (s === 4 || s === 12 || (pNum > 10 && s === 14));
                        isHihat = (i % Math.max(1, (pNum % 4)) === 0);
                        isClap = (pNum > 8 && s === 12);
                    }
                    if (isKick || isSnare || isHihat || isClap) {
                        newArr[i] = { kick: isKick, snare: isSnare, hihat: isHihat, clap: isClap };
                    }
                }
                setInstrumentSteps(prev => ({ ...prev, drums: newArr }));
                setActivePatternIndex(pNum);
                setStatus(`🥁 つけ足しドラム #${pNum} (24小節) 適用完了！`);
            };

            // AIメロディ & ジャンル切替
            const generateAiMelodyOrGenre = (genreType) => {
                const newSteps = JSON.parse(JSON.stringify(instrumentSteps));
                if (genreType === "popingdance") {
                    setBpm(116);
                    for (let i = 0; i < TOTAL_STEPS; i++) {
                        const s = i % 16;
                        if (s === 0 || s === 8 || s === 10) newSteps.subBass[i] = { note: "C0", dur: "8n" };
                        if (s === 2 || s === 6 || s === 11) newSteps.synth[i] = { note: "C4", dur: "16n" };
                    }
                    setStatus("🔥 【Popping Dance AI】踊れる最高級重低音AIメロディ展開！");
                } else if (genreType === "soulai") {
                    setBpm(104);
                    for (let i = 0; i < TOTAL_STEPS; i++) {
                        const s = i % 16;
                        if (s === 0 || s === 8) newSteps.piano[i] = { note: "Eb4", dur: "4n" };
                        if (s === 3 || s === 11) newSteps.synth[i] = { note: "G4", dur: "8n" };
                    }
                    setStatus("🎷 【Soul AI】メロディ・ベース重低音統合完了！");
                } else if (genreType === "blackcontemporary") {
                    setBpm(108);
                    for (let i = 0; i < TOTAL_STEPS; i++) {
                        const s = i % 16;
                        if (s === 0 || s === 6 || s === 10) newSteps.loopTrack[i] = { note: "Bb4", dur: "16n" };
                    }
                    setStatus("🕶️ 【ブラコン AI】クール＆ギャング系AIメロディ展開！");
                } else if (genreType === "eighteenbeat") {
                    setBpm(120);
                    for (let i = 0; i < TOTAL_STEPS; i++) {
                        if (i % 3 === 0) newSteps.guitar[i] = { note: "C4", dur: "16n" };
                    }
                    setStatus("⚡ 【18ビート】かっこいい変則スピードAI展開！");
                } else if (genreType === "popsmadonna") {
                    setBpm(122);
                    for (let i = 0; i < TOTAL_STEPS; i++) {
                        const s = i % 16;
                        if (s % 2 === 0) newSteps.piano[i] = { note: "C5", dur: "8n" };
                    }
                    setStatus("👑 【Pops / マドンナ系】ダンスポップAIメロディ展開！");
                }
                setInstrumentSteps(newSteps);
            };

            // 手動連打グリッド配置
            const repeatPatternAction = () => {
                const currentArr = [...instrumentSteps[selectedInstrument]];
                for (let i = 0; i < TOTAL_STEPS; i += 4) {
                    if (selectedInstrument === "drums") {
                        currentArr[i] = { kick: true, snare: false, hihat: true, clap: false };
                    } else {
                        currentArr[i] = { note: selectedNote, dur: "16n" };
                    }
                }
                setInstrumentSteps(prev => ({ ...prev, [selectedInstrument]: currentArr }));
                setStatus(`⚡ ${currentInstObj.label} 手動連打リピート配置完了！`);
            };

            // 全体録音・編集・再生 CRERA 進化AI
            const toggleRecordCrera = async () => {
                await Tone.start();
                setIsRecording(!isRecording);
                if (!isRecording) {
                    setStatus("🔴 【全体録音CRERA進化AI】演奏＆全トラックキャプチャ開始...");
                } else {
                    const newTake = {
                        id: Date.now(),
                        title: `CRERA 進化テイク #${creraTakes.length + 1} (BPM:${bpm})`,
                        bpm,
                        stepsSnapshot: JSON.parse(JSON.stringify(instrumentSteps)),
                        date: new Date().toLocaleTimeString()
                    };
                    setCreraTakes(prev => [newTake, ...prev]);
                    setStatus("⏹️ 【CRERA録音完了】アルバムアーカイブへ保存されました！");
                }
            };

            const playOrLoadCreraTake = (take) => {
                setInstrumentSteps(JSON.parse(JSON.stringify(take.stepsSnapshot)));
                setBpm(take.bpm);
                setStatus(`▶ 録音テイク [${take.title}] 復元ロード＆再生準備完了！`);
            };

            const toggleStepWithDuration = (instKey, idx, note = selectedNote, dur = selectedDuration) => {
                setInstrumentSteps(prev => {
                    const currentArr = [...prev[instKey]];
                    if (instKey === "drums") {
                        const currentObj = currentArr[idx] || { kick: false, snare: false, hihat: false, clap: false };
                        const updatedObj = { ...currentObj, [selectedDrumPart]: !currentObj[selectedDrumPart] };
                        const hasAny = Object.values(updatedObj).some(Boolean);
                        currentArr[idx] = hasAny ? updatedObj : null;
                    } else {
                        currentArr[idx] = currentArr[idx] ? null : { note, dur };
                    }
                    return { ...prev, [instKey]: currentArr };
                });
            };

            const exportProjectToFile = () => {
                const projectData = { title: slotName, bpm, instrumentSteps, volumes, creraTakes, date: new Date().toISOString() };
                const blob = new Blob([JSON.stringify(projectData, null, 2)], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `${slotName}.json`;
                a.click();
                URL.revokeObjectURL(url);
                setStatus(`💾 プロジェクト保存完了 [アルバム: ${slotName}]`);
            };

            const currentInstObj = INSTRUMENTS.find(i => i.id === selectedInstrument) || INSTRUMENTS[0];
            const currentFlashClass = FLASH_COLORS[flashColorIndex];

            return (
                <div className={`min-h-screen bg-slate-950 text-slate-100 flex flex-col text-xs font-sans select-none pb-28 border-8 transition-colors duration-500 ${currentFlashClass}`}>
                    
                    {/* ヘッダー＆フラッシュライト8色表示 */}
                    <header className="bg-slate-900 border-b border-slate-800 px-3 py-2 flex items-center justify-between gap-2 sticky top-0 z-40 shadow-lg">
                        <div className="flex flex-col">
                            <span className="font-black text-sm bg-gradient-to-r from-amber-400 via-pink-400 to-cyan-400 bg-clip-text text-transparent">
                                MIC VICTORY DLAND <span className="text-[10px] text-pink-400 font-bold">v60.0 リリース版</span>
                            </span>
                            <span className="text-[9px] text-slate-400">© 2026 MIC VICTORY DLAND - All Rights Reserved.</span>
                        </div>
                        <div className="flex items-center gap-1.5 flex-wrap">
                            <div className="bg-slate-950 px-2 py-1 rounded border border-slate-800 text-[10px] text-amber-400 font-bold">
                                ⚡ 消費電力: {powerUsage}W
                            </div>
                            <button onClick={purgeAndClearCacheBuffer} className="px-2 py-1 bg-red-900 border border-red-700 text-red-200 font-bold rounded text-[10px]">
                                🧹 クリア
                            </button>
                            <button onClick={() => setPlaying(!playing)} className={`px-3 py-1 rounded font-bold text-xs shadow ${playing ? "bg-amber-400 text-slate-950 animate-bounce" : "bg-pink-600 text-white"}`}>
                                {playing ? "■ 停止" : "▶ 再生"}
                            </button>
                            <button onClick={toggleRecordCrera} className={`px-3 py-1 rounded font-bold text-xs shadow ${isRecording ? "bg-red-600 text-white animate-pulse" : "bg-slate-800 text-red-400 border border-red-800"}`}>
                                {isRecording ? "🔴 録音中" : "⏺️ CRERA録音"}
                            </button>
                            <div className="flex items-center gap-1 bg-slate-950 px-2 py-0.5 rounded border border-slate-800">
                                <span className="text-[9px] text-slate-400">BPM</span>
                                <input type="number" value={bpm} onChange={e => setBpm(Math.max(60, Math.min(220, Number(e.target.value))))} className="w-12 bg-slate-900 text-center font-bold text-pink-400 rounded text-xs py-0.5" />
                            </div>
                        </div>
                    </header>

                    {/* ナビゲーションタブ */}
                    <nav className="bg-slate-900/90 border-b border-slate-800 px-2 py-1.5 flex gap-1 overflow-x-auto">
                        {[
                            { id: "HUB", label: "🌟 ジャンル＆AI特設" },
                            { id: "DRUMS20", label: "🥁 つけ足しドラム20種" },
                            { id: "GRID", label: "🎛️ 手動連打グリッド" },
                            { id: "CRERA_ARCHIVE", label: "📁 録音・編集・再生CRERA" },
                            { id: "MIXER", label: "🎚️ 重低音ミキサー" },
                            { id: "SAVE", label: "💾 保存＆アルバム" },
                        ].map(t => (
                            <button key={t.id} onClick={() => setTab(t.id)} className={`px-3 py-1 rounded text-center font-bold transition-all shrink-0 ${tab === t.id ? "bg-amber-500 text-slate-950 shadow" : "bg-slate-800/60 text-slate-400"}`}>
                                {t.label}
                            </button>
                        ))}
                    </nav>

                    <div className="bg-slate-900/50 px-3 py-1 text-[11px] text-cyan-400 border-b border-slate-900 truncate">
                        💡 {status}
                    </div>

                    <main className="p-2 flex flex-col gap-3">
                        {/* 🌟 ジャンル＆AI特設 */}
                        {tab === "HUB" && (
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                <button onClick={() => generateAiMelodyOrGenre("popingdance")} className="p-3 bg-gradient-to-r from-red-900 to-amber-900 border border-amber-600 rounded-lg text-left shadow hover:brightness-110 flex flex-col gap-1">
                                    <span className="font-bold text-amber-300 text-sm">🔥 Poping Dance AI メロディ＆重低音</span>
                                    <span className="text-[10px] text-slate-300">踊れる最高級重低音＆ハリテンポ・崩れない強力ビート！</span>
                                </button>
                                <button onClick={() => generateAiMelodyOrGenre("soulai")} className="p-3 bg-gradient-to-r from-amber-900 to-yellow-900 border border-yellow-600 rounded-lg text-left shadow hover:brightness-110 flex flex-col gap-1">
                                    <span className="font-bold text-yellow-300 text-sm">🎷 Soul AI メロディ＆ドラム低音</span>
                                    <span className="text-[10px] text-slate-300">ソウルフルなコードと厚みのあるベース融合。</span>
                                </button>
                                <button onClick={() => generateAiMelodyOrGenre("blackcontemporary")} className="p-3 bg-gradient-to-r from-pink-900 to-purple-900 border border-pink-600 rounded-lg text-left shadow hover:brightness-110 flex flex-col gap-1">
                                    <span className="font-bold text-pink-300 text-sm">🕶️ ブラックコンテンポラリー (ブラコン)</span>
                                    <span className="text-[10px] text-slate-300">クール＆ギャング系AIメロディ＆ベース重低音。</span>
                                </button>
                                <button onClick={() => generateAiMelodyOrGenre("eighteenbeat")} className="p-3 bg-gradient-to-r from-emerald-900 to-teal-900 border border-emerald-600 rounded-lg text-left shadow hover:brightness-110 flex flex-col gap-1">
                                    <span className="font-bold text-emerald-300 text-sm">⚡ 18ビート かっこいい疾走系</span>
                                    <span className="text-[10px] text-slate-300">変則的でキレのあるリズムとスタイリッシュなAI展開。</span>
                                </button>
                                <button onClick={() => generateAiMelodyOrGenre("popsmadonna")} className="p-3 bg-gradient-to-r from-blue-900 to-indigo-900 border border-blue-600 rounded-lg text-left sm:col-span-2 shadow hover:brightness-110 flex flex-col gap-1">
                                    <span className="font-bold text-blue-300 text-sm">👑 Pops / マドンナ系ディスコポップ</span>
                                    <span className="text-[10px] text-slate-300">80sテイスト香る4つ打ちダンスビート＆キャッチーなシンセスタブ。</span>
                                </button>
                            </div>
                        )}

                        {/* 🥁 つけ足しドラム20種 */}
                        {tab === "DRUMS20" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3 shadow">
                                <div className="flex justify-between items-center">
                                    <span className="text-xs font-bold text-red-400">🥁 つけ足しドラム 20パターン選択 (24小節)</span>
                                </div>
                                <div className="grid grid-cols-5 sm:grid-cols-10 gap-1.5">
                                    {Array.from({ length: 20 }).map((_, idx) => {
                                        const pNum = idx + 1;
                                        return (
                                            <button key={pNum} onClick={() => generateDrumPattern20(pNum)} className={`py-2 rounded text-[10px] font-bold border transition-all ${activePatternIndex === pNum ? "bg-red-600 text-white border-white" : "bg-slate-950 text-red-300 border-red-900/50 hover:bg-red-800"}`}>
                                                ドラム#{pNum}
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {/* 🎛️ 手動連打グリッド */}
                        {tab === "GRID" && (
                            <div className="flex flex-col gap-3">
                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3 shadow">
                                    <div className="flex justify-between items-center flex-wrap gap-2">
                                        <div className="flex items-center gap-2">
                                            <span className="text-xs font-bold text-cyan-400">編集楽器:</span>
                                            <select value={selectedInstrument} onChange={e => setSelectedInstrument(e.target.value)} className="bg-slate-950 text-amber-400 border border-slate-800 rounded text-xs p-1.5 font-bold">
                                                {INSTRUMENTS.map(i => <option key={i.id} value={i.id}>{i.label}</option>)}
                                            </select>
                                        </div>
                                        <button onClick={repeatPatternAction} className="px-3 py-1 bg-pink-600 text-white font-bold rounded text-[10px]">⚡ 手動連打リピート配置</button>
                                    </div>

                                    {selectedInstrument === "drums" && (
                                        <div className="flex items-center gap-2 bg-slate-950 p-2 rounded border border-slate-800">
                                            <span className="text-[11px] text-red-400 font-bold">ドラムパーツ切替:</span>
                                            {["kick", "snare", "hihat", "clap"].map(part => (
                                                <button key={part} onClick={() => setSelectedDrumPart(part)} className={`px-2.5 py-1 rounded text-[10px] font-bold uppercase ${selectedDrumPart === part ? "bg-red-600 text-white" : "bg-slate-900 text-slate-400"}`}>
                                                    {part}
                                                </button>
                                            ))}
                                        </div>
                                    )}
                                </div>

                                <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3 shadow">
                                    <div className="flex justify-between items-center">
                                        <span className="text-xs font-bold text-amber-400">{currentInstObj.label} - 24小節横スライドグリッド</span>
                                        <span className="text-[10px] text-slate-400">再生中: 小節 {currentBar + 1} / ステップ {currentStep + 1}</span>
                                    </div>

                                    <div className="flex gap-2 overflow-x-auto pb-3 pt-1">
                                        {Array.from({ length: BARS }).map((_, barIdx) => (
                                            <div key={barIdx} className="bg-slate-950 p-2 rounded border border-slate-800 shrink-0 w-36 flex flex-col gap-1.5">
                                                <div className="text-[10px] font-bold text-cyan-400 text-center border-b border-slate-900 pb-0.5">Bar {barIdx + 1}</div>
                                                <div className="grid grid-cols-4 gap-1">
                                                    {Array.from({ length: BAR_STEPS }).map((_, stepIdx) => {
                                                        const absoluteStep = barIdx * BAR_STEPS + stepIdx;
                                                        const stepData = instrumentSteps[selectedInstrument][absoluteStep];
                                                        const isCurrent = currentBar === barIdx && currentStep === stepIdx && playing;

                                                        return (
                                                            <button
                                                                key={stepIdx}
                                                                onClick={() => toggleStepWithDuration(selectedInstrument, absoluteStep)}
                                                                className={`h-7 rounded flex items-center justify-center text-[9px] font-bold border transition-all ${
                                                                    isCurrent ? "ring-2 ring-pink-400" : ""
                                                                } ${
                                                                    stepData ? "bg-amber-500 text-slate-950 border-white shadow" : "bg-slate-900 text-slate-600 border-slate-800 hover:bg-slate-800"
                                                                }`}
                                                            >
                                                                {stepData ? <span className="w-2 h-2 rounded-full bg-slate-950 inline-block"></span> : <span className="text-[8px] opacity-40">{stepIdx + 1}</span>}
                                                            </button>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 📁 録音・編集・再生 CRERA */}
                        {tab === "CRERA_ARCHIVE" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-4 flex flex-col gap-3">
                                <div className="flex justify-between items-center">
                                    <span className="text-xs font-bold text-pink-400">📁 全体録音・編集・再生 CRERA 進化AIアーカイブ</span>
                                    <button onClick={toggleRecordCrera} className="px-3 py-1 bg-red-600 text-white font-bold rounded text-xs animate-pulse">🔴 新規テイク録音</button>
                                </div>
                                <div className="bg-slate-950 p-3 rounded border border-slate-800 flex flex-col gap-2 max-h-[280px] overflow-y-auto">
                                    {creraTakes.length === 0 ? (
                                        <span className="text-[10px] text-slate-500">録音テイクはまだありません。「CRERA録音」ボタンから演奏を記録してください。</span>
                                    ) : creraTakes.map(t => (
                                        <div key={t.id} className="flex justify-between items-center bg-slate-900 p-2.5 rounded border border-slate-800">
                                            <div className="flex flex-col">
                                                <span className="text-cyan-400 text-xs font-bold">{t.title}</span>
                                                <span className="text-[9px] text-slate-400">保存時刻: {t.date} | MIC VICTORY DLAND</span>
                                            </div>
                                            <div className="flex gap-1.5">
                                                <button onClick={() => playOrLoadCreraTake(t)} className="px-2.5 py-1 bg-amber-500 text-slate-950 font-bold rounded text-[10px]">復元ロード＆再生</button>
                                                <button onClick={() => setCreraTakes(creraTakes.filter(x => x.id !== t.id))} className="px-2.5 py-1 bg-red-950 text-red-300 rounded text-[10px]">削除</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* 🎚️ ミキサー */}
                        {tab === "MIXER" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-4 flex flex-col gap-3">
                                <span className="text-xs font-bold text-amber-400">🎚️ 崩れない重低音ミキサー & 低域クロスオーバー (130Hz)</span>
                                <div className="flex flex-col gap-2 bg-slate-950 p-3 rounded border border-slate-800">
                                    <span className="text-[11px] text-amber-400">マスター重低音ブースト: {masterBassBoost} dB</span>
                                    <input type="range" min="0" max="24" step="1" value={masterBassBoost} onChange={e => setMasterBassBoost(Number(e.target.value))} className="accent-amber-500" />
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 bg-slate-950 p-3 rounded border border-slate-800">
                                    {INSTRUMENTS.map(inst => (
                                        <div key={inst.id} className="flex items-center justify-between bg-slate-900 p-2 rounded border border-slate-800">
                                            <span className="text-[11px] text-slate-200">{inst.label}</span>
                                            <input type="range" min="-30" max="6" step="1" value={volumes[inst.id]} onChange={e => setVolumes({...volumes, [inst.id]: Number(e.target.value)})} className="w-24 accent-amber-500" />
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* 💾 保存＆アルバム */}
                        {tab === "SAVE" && (
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 flex flex-col gap-3">
                                <span className="text-xs font-bold text-emerald-400">💾 プロジェクト保存・アルバムリリース</span>
                                <div className="flex gap-2 bg-slate-950 p-3 rounded border border-slate-800">
                                    <input type="text" value={slotName} onChange={e => setSlotName(e.target.value)} className="bg-slate-900 px-2 py-1 rounded text-slate-100 flex-1 border border-slate-800 font-bold text-xs" />
                                    <button onClick={exportProjectToFile} className="px-3 py-1 bg-emerald-600 text-white font-bold rounded text-xs">JSON保存</button>
                                </div>
                                <div className="text-[10px] text-slate-400 bg-slate-950 p-3 rounded border border-slate-800 flex flex-col gap-1">
                                    <span className="font-bold text-cyan-400">℗ © 2026 MIC VICTORY DLAND (All Rights Reserved)</span>
                                    <span>Release Version: v60.0 Ultimate Edition</span>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<MasterSynthApp />);
    </script>
</body>
</html>
